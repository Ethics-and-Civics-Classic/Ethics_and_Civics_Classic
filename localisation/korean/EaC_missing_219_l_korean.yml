 EaC_civic_mechanic_events.103.option.commander_hive_a:0 "보관소의 지식을 군체의 기억에 새기자."
 EaC_civic_mechanic_events.103.option.commander_machine_a:0 "보관소의 지식을 통치자의 기억에 통합한다."
 EaC_civic_mechanic_events.103.option.official_hive_a:0 "보관소의 지식을 군체의 기억에 새기자."
 EaC_civic_mechanic_events.103.option.official_machine_a:0 "보관소의 지식을 통치자의 기억에 통합한다."
 EaC_civic_mechanic_events.103.option.scientist_hive_a:0 "보관소의 지식을 군체의 기억에 새기자."
 EaC_civic_mechanic_events.103.option.scientist_machine_a:0 "보관소의 지식을 통치자의 기억에 통합한다."
 EaC_civic_mechanic_events.41.desc.has_ideology.has_slaves:0 "§H[Root.GetName]§!의 사회적 긴장이 누그러졌습니다. 노예제는 여전히 남아 있지만, 불만을 품은 노동자와 지지자들을 결집하던 운동은 점차 힘을 잃고 있습니다. 투쟁을 계속하자는 목소리도 예전만큼 호응을 얻지 못합니다."
 EaC_civic_mechanic_events.41.desc.has_ideology.no_slaves:0 "§H[Root.GetName]§!에 안정을 되찾으려는 분위기가 퍼지고 있습니다. 노동 운동이 내세우던 요구는 예전만큼 절박하게 받아들여지지 않습니다. 파업과 지하 투쟁을 지지하는 주민은 줄어들고, 일상으로 돌아가려는 이들이 늘고 있습니다."
 EaC_civic_mechanic_events.41.desc.no_ideology.has_slaves:0 "§H[Root.GetName]§!에서 노동 운동을 떠받치던 이념적 지지가 거의 사라졌습니다. 노예제는 여전히 남아 있지만, 이를 둘러싼 불만도 충분한 지지자를 모으지는 못합니다. 조직적인 저항은 서서히 잦아들고 있습니다."
 EaC_civic_mechanic_events.41.desc.no_ideology.no_slaves:0 "§H[Root.GetName]§!에는 노동 운동을 지탱하던 이념적 지지도, 끊임없이 갈등을 낳던 노예제도 남아 있지 않습니다. 지하 조직은 해체되었고, 한때 큰 영향력을 행사하던 노동 운동도 사실상 자취를 감췄습니다."
 EaC_civic_mechanic_events.4123.a:0 "이제 이 행성에는 아무도 남지 않았군."
 EaC_civic_mechanic_events.4123.desc:0 "이 행성의 초광속 이전 문명에 속한 마지막 주민마저 끌려갔습니다. 이제 원주민은 한 명도 남아 있지 않습니다. 얼마 전까지 관찰할 수 있었던 그들의 사회는 사실상 사라졌습니다."
 EaC_civic_mechanic_events.6001.desc:0 "과거의 유물 속에서 우리 행성의 생명사를 밝혀 줄 흥미로운 표본이 발견되었습니다. 이를 연구하면 준지성체가 발달해 온 과정을 알아내고, 이들을 지성체로 진화시키는 방법에 한 걸음 더 다가갈 수 있을 것입니다."
 EaC_civic_mechanic_events.7000.b.tooltip:0 "이 종족이 석기 시대 문명을 이루도록 이끌고, 해당 행성의 통치권을 새 문명에 넘깁니다."
 MACHINE_SPIRIT_CANNOT_ENSLAVE:0 "$TRIGGER_FAIL$§Y$civic_machine_cult_machine$§! 사회제도를 채택한 제국은 다른 종족을 노예로 삼을 수 없습니다."
 PrimPlay_situation_event.2.civic_hive_stargazers_effects:0 "다시 별을 향해 눈을 돌리자."
 PrimPlay_situation_event.2.civic_hive_stargazers_effects.desc:0 "우리 군체는 먼 옛날부터 별을 바라보며 모성 너머로 나아갈 날을 꿈꿨습니다. 최초의 아공간 함선은 그 꿈을 현실로 한 걸음 끌어당겼습니다. 이제 집단의식은 진정한 성간 항해의 길을 찾고 있습니다.\n\n생각이 점차 형태를 갖추고 있습니다... $tech_hyper_drive_theory_desc$"
 PrimPlay_situation_event.2.civic_machine_exploration_protocol:0 "심우주 탐사 프로토콜을 가동한다."
 PrimPlay_situation_event.2.civic_machine_exploration_protocol.desc:0 "우리 기계 지능의 최우선 지침은 모성 밖의 생명을 탐사하고 기록하는 것입니다. 아공간 함선으로 첫걸음은 내디뎠지만, 임무를 계속하려면 진정한 성간 항해 능력이 필요합니다.\n\n계산 결과가 하나의 해답으로 수렴합니다... $tech_hyper_drive_theory_desc$"
 PrimPlay_situation_event.3.payback.desc:0 "$NAME_MSI_country$와의 첫 접촉은 우리를 노예로 만들 뻔했습니다. 우리는 침략자들을 물리쳤지만, 그들이 언제든 돌아올 수 있다는 사실을 알고 있습니다. 분열된 세계로는 이 위협에 맞설 수 없습니다. 우리의 다음 목표는 §H$tech_primitive_unified_planet$§!입니다."
