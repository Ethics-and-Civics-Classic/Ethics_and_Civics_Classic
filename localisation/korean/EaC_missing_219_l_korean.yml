 PrimPlayer_operation_locate_strategic_targets_desc.nuclear:0 "우리 공작원들이 §Y[This.Target.GetName]§!의 전략 시설 위치를 조사합니다. 작전을 마치면 §Y정보§!를 확보하고 §Y최대 침투 수준§!을 높일 수 있습니다. 군사 기반 시설을 비롯한 주요 표적을 파악하면 §Y핵 시설§!에 §G선제 타격§!을 가할 수 있습니다.\n\n작전에 투입한 §Y자산§!은 각자의 이해관계에 따라 결과에 영향을 줄 수 있습니다."
 PrimPlayer_payback_unified_planet_approach_tooltip:0 "봉기 당시 §Y$NAME_MSI_country$§!는 우리 문명을 원시 시대로 되돌리는 데 실패했습니다. 그들이 남긴 콜로서스의 잔해와 옛 거점에는 §H$tech_hyper_drive_1$§!을 갖춘 함선과 그 정비 시설의 흔적이 남아 있습니다."
