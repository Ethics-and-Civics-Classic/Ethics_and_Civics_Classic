 primitive_origin.156.desc:0 "오벨리스크의 진정한 목적이 드러났습니다. 그것은 이윤과 노예 노동의 원천으로 삼을 문명을 찾아내는 $NAME_MSI_country$의 감시 체계 일부였습니다. 먼저 이 위협을 알아챈 이들이 힘을 합치자고 제안했습니다. MSI가 같은 일을 되풀이하게 두어서는 안 된다는 것입니다."
