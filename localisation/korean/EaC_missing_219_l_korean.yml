 nations.22274.desc:0 "우리의 §Y$tech_robotic_workers$§! 개발 소식을 들은 §H[FROM.GetName]§!의 대표단이 기술 공유를 요청했습니다.\n\n우리 과학자들은 신중한 입장입니다. 이 기술은 군사적으로도 활용할 수 있습니다. 언젠가 전쟁이 벌어진다면, 우리의 기술을 갖춘 상대를 제압하기는 훨씬 어려워질 것입니다.\n\n하지만 요청을 거절하면 상대는 이를 모욕으로 받아들일 가능성이 큽니다."
 nations.9.a:0 "이제 돌이킬 수 없군."
 nations.9.desc:0 "오랜 갈등이 마침내 공개적인 봉기로 번졌습니다. 반란 세력은 기존 정부의 권위를 부정하고 일부 영토를 장악한 뒤 독자적인 국가를 세웠습니다. 이 세계의 미래를 둘러싼 대립은 이제 새로운 국면에 접어들었습니다."
