 leader_trait_legendary_bad_treehugger_desc:0 "이 지도자는 발전을 희생하더라도 자연계의 보호를 다른 모든 가치보다 우선합니다."
 leader_trait_legendary_bad_polluter_desc:0 "이 지도자는 진보의 대가를 필요악으로 여기며, 발전을 위해 환경에 끼치는 피해를 무시합니다."
 leader_trait_legendary_bad_altruism_desc:0 "이 지도자는 공익을 집요하게 추구하며, 다른 이들을 위해 제국의 자원을 희생시키곤 합니다."
 leader_trait_legendary_bad_capitalism_desc:0 "이 지도자는 연민보다 야망을 앞세우며, 불우한 이들의 희생을 발판 삼아 부를 쌓습니다."
 leader_trait_legendary_Eco_Designer_desc:0 "이 지도자는 도시 계획에 자연의 특성을 창의적으로 반영하여 아름다움과 기능성을 조화시킵니다."
 leader_trait_legendary_Eco_Designer_2_desc:0 "이 지도자는 도시 계획에 자연의 특성을 창의적으로 반영하여 아름다움과 기능성을 조화시킵니다."
 leader_trait_legendary_Eco_Designer_3_desc:0 "이 지도자는 도시 계획에 자연의 특성을 창의적으로 반영하여 아름다움과 기능성을 조화시킵니다."
 leader_trait_legendary_Sustainable_Cultivator_desc:0 "이 지도자는 유기 농법을 장려하여 풍족하면서도 환경친화적인 식량 생산을 보장합니다."
 leader_trait_legendary_Sustainable_Cultivator_2_desc:0 "이 지도자는 유기 농법을 장려하여 풍족하면서도 환경친화적인 식량 생산을 보장합니다."
 leader_trait_legendary_Sustainable_Cultivator_3_desc:0 "이 지도자는 유기 농법을 장려하여 풍족하면서도 환경친화적인 식량 생산을 보장합니다."
 leader_trait_legendary_Void_Harvester_desc:0 "소행성 하나, 별먼지 한 점까지도 모두 이 지도자의 산업 지휘 아래 놓인 자산입니다."
 leader_trait_legendary_Void_Harvester_2_desc:0 "소행성 하나, 별먼지 한 점까지도 모두 이 지도자의 산업 지휘 아래 놓인 자산입니다."
