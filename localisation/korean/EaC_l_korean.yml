 d_ark_nature_preserve_blocker:0 "정원 생물 서식지"
 d_ark_nature_preserve_blocker_plural:0 "정원 생물 서식지"
 d_ark_nature_preserve_blocker_desc:0 "우리 $arkship$의 한 구역은 수많은 행성의 멸종 위기종과 멸종종을 보호하는 데 쓰입니다. 이곳은 우리의 보금자리이자 그들의 보금자리입니다."
 decision_expand_biotope:0 "비오톱 확장"
 decision_expand_biotope_short:0 "$arkship$에 §Y$d_ark_nature_preserve_blocker$§!를 하나 더 추가합니다."
 decision_expand_biotope_desc:0 "예비 생명 유지 장치와 세심한 감시를 통해 여러 생물권의 생태 조건을 정밀하게 재현할 수 있습니다."
 civic_naturalism_nomad:0 "별을 향한 솔라펑크"
 civic_naturalism_nomad_desc:0 "이 방랑자들은 가장 사랑하는 행성을 본떠 $arkship_plural$을 만드는 데 헌신합니다. 이들의 함선은 단순한 모방을 넘어 진정으로 움직이는 세계가 되었습니다."
 building_national_park_nomad:0 "방주 생물권"
 building_national_park_nomad_desc:0 "$arkship$ 내부에는 자연의 생명으로 가득한 완전한 생태계가 조성되어 있습니다. 이곳의 동식물은 특별한 보호를 받습니다."
 civic_environmentalist_nomad:0 "환경 방주"
 civic_environmentalist_nomad_desc:0 "이 유목민들은 방문하는 행성에서 멸종 위기 종과 멸종한 종을 수집합니다. 은하의 생명을 보존한다는 사명 아래 방주에서 이들을 돌봅니다."
 civic_tooltip_environmentalist_nomad_effects:0 "$t$- $AVAILABLE_BUILDINGS$ £building£ ['building:building_nomad_conservatory']$TABBED_NEW_LINE$- $ADDITIONAL_BUILDINGS_STRING$ £building£ §Y$building_nomad_conservatory$§!\n$t$- $AVAILABLE_HOLDINGS$ £building£ ['building:holding_park_ranger_lodge']$TABBED_NEW_LINE$- 게임 시작 시 §Y$d_ark_nature_preserve_blocker$§! £blocker£§H장애물§!을 하나 추가로 얻습니다."
 civic_keepers_harmony_nomad:0 "유목 자연 숭배자"
 civic_keepers_harmony_nomad_desc:0 "이 사회의 사람들은 자신이 방문하는 장소의 신성함을 숭배합니다. 자연과 우주가 완벽한 조화를 이루는 성지를 찾아 수년에 걸친 순례로 은하를 가로지릅니다."
 civic_tooltip_keepers_harmony_nomad_effects:0 "$t$§E신성한 공생:§!$TABBED_NEW_LINE$$t$- £job_bureaucrat£ §Y$job_bureaucrat$§! 직업을 고유한 £job_priest£ §Y$job_druid$§! 직업으로 대체합니다.$TABBED_NEW_LINE$$t$- £job_priest£ §Y$job_druid$§! 직업은 §Y$d_ark_nature_preserve_blocker$§! £blocker£ §H장애물§!이 있는 $arkship_plural$에서 더 효과적이며, £housing£ §Y주거§!를 §G추가§!로 제공하고 §Y$MOD_POP_ENVIRONMENT_TOLERANCE$§!를 증가시킵니다.\n$TABBED_NEW_LINE$- £building£ §Y$building_nature_sanctuary_nomad_plural$§!는 $arkship$의 §Y$d_ark_nature_preserve_blocker$§! £blocker£ §H장애물§!마다 지역 $r_unity$, £happiness£ §Y행복도§!, £pops£ §H$ethic_green$§! 선호도를 증가시키는 고유 건물이며, 유지비로 $r_food$이 필요합니다."
 civic_tooltip_keepers_harmony_nomad_negative_effects:0 "$t$§E버려진 공생:§!$TABBED_NEW_LINE$$t$- §Y$d_ark_nature_preserve_blocker$§! £blocker£ §H장애물§!이 없는 $arkship_plural$에서는 §Y$job_druid$§! 직업이 일반 관료보다도 §R적은§! $r_unity$을 생산합니다."
 building_nature_sanctuary_nomad_plural:0 "정원 성소"
 building_nature_sanctuary_nomad_plural_desc:0 "$building_nature_sanctuary_nomad_desc$"
 building_nature_sanctuary_nomad:0 "정원 성소"
 building_nature_sanctuary_nomad_desc:0 "이 신성한 장소에는 우리가 별들 사이로 걸어온 길이 기려지고, 우주 생태계와의 조화가 숭배됩니다. 이 기념물은 §Y$d_ark_nature_preserve_blocker$§! £blocker£ §H장애물§!마다 지역의 $r_unity$, £happiness£ $HAPPINESS$ 및 §Y생태주의§! 윤리관 선호도를 높이며, 유지비로 $r_food$을 소비합니다."
 civic_eco_warfare_nomad:0 "방어 생태구역"
 civic_eco_warfare_nomad_desc:0 "이들은 무기를 들고 정원의 생태구역을 지킬 의지와 능력을 갖추었을 뿐 아니라, 생명 과학의 성과를 군사 분야에 효과적으로 적용하는 법도 터득했습니다.\n\n§W유기체 함선§!: 군용 함선 건조에 생명 공학을 도입하면 함선이 장갑과 선체 재생 등의 특수 능력을 얻고 에너지 효율도 높아집니다. 다만 이러한 소재는 대체로 무기물 합금보다 취약합니다.\n\n§W군사 생체 의학§!: 지상군 체력이 증가합니다."
 civic_tooltip_eco_warfare_nomad_effects:0 "$t$§E자연의 보호§!: §Y$d_ark_nature_preserve_blocker$§! £blocker£ §H장애물§!의 혜택$TABBED_NEW_LINE$$t$- £job_entertainer£ §Y$job_entertainer_plural$§!을 £job_duelist£ §Y$job_duelist_plural$§!로 전환.$TABBED_NEW_LINE$$t$- £blocker£ §H장애물§!마다 §Y행성 폭격 피해§! §G-5%§!.\n$TABBED_NEW_LINE$§E군용 생명공학§!:$TABBED_NEW_LINE$$t$- [foundry.GetIcon] §Y[GetAlloyProducer]§! 100명당 $r_minerals$ 유지비 §G-1§!.$TABBED_NEW_LINE$$t$- [foundry.GetIcon] §Y[GetAlloyProducer]§! 100명당 $r_food$ 유지비 §R+1§!.$TABBED_NEW_LINE$$t$- £job_biotechnologist£ §Y$job_biotechnologist_plural$§! 100명당 $r_food$ 유지비 §R+1§!.$TABBED_NEW_LINE$$t$- £job_biotechnologist£ §Y$job_biotechnologist_plural$§! 100명당 $r_alloys$ 생산량 §G+0.5§!.\n$BOB_mercs_tooltip$"
 concept_eco_biologists:0 "생태주의 생물학자 직업"
 eco_biologist_swap:0 "생태주의 생물학자 직업 대체"
 concept_eco_biologists_desc:0 "다양한 §H$ethic_green$§! 사회 제도는 생물학자를 생산성이 더 높은 특수 직업으로 대체할 수 있게 합니다.\n§E$job_xenobiologist$§!$TABBED_NEW_LINE$- £job_xenobiologist£ §Y$job_xenobiologist_plural$§!는 £job_biologist£ §Y$job_biologist_plural$§!의 생산성을 높인 형태로, $r_consumer_goods$를 §R33%§! 더 소비하지만 $r_society$를 §G50%§! 더 생산합니다.$TABBED_NEW_LINE$- §C$civic_terraforming$§! §Y사회 제도§!와 ['concept_natural_blockers']의 조합으로 활성화됩니다.\n\n§E$job_ranger$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ranger_plural$§!은 여러 직업을 결합한 다재다능한 인력으로, $r_society$뿐 아니라 $r_unity$, $r_amenities$, £job_criminal£ §Y$PLANET_CRIME_TITLE$§! 감소, §Y$concept_naval_capacity$§!, §Y$defense_army_plural$§! 등 다양한 자원과 효과를 제공합니다.$TABBED_NEW_LINE$- §C$civic_environmentalist$§! 사회 제도의 £building£ §Y$building_ranger_lodge$§! 건물로 활성화됩니다.$TABBED_NEW_LINE$- §C$civic_eco_warfare$§! 사회 제도와 ['concept_natural_blockers']의 조합으로도 활성화됩니다.\n\n§E$job_xenoranger$§!$TABBED_NEW_LINE$- £job_xenobiologist£ §Y$job_xenobiologist_plural$§!와 £job_ranger£ §Y$job_ranger_plural$§!이 모두 활성화되면, 두 직업의 혜택과 유지비를 모두 갖춘 £job_xenoranger£ §Y$job_xenoranger$§! 직업으로 바뀝니다.\n\n§E$job_ark_gardener$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ark_gardener_plural$§!는 ['concept_nomadic_empires']의 $arkship_plural$에서만 일하는 $job_ranger_plural$입니다. 일반 £job_ranger£ §Y$job_ranger$§!과 같은 역할을 수행합니다. §Y$d_ark_nature_preserve_blocker$§! £blocker£ §H장애물§!을 배치하면 혜택을 받으며, 모든 §Y$ethic_green$§! 유목민이 이용할 수 있습니다."
