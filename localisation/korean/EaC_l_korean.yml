 ark_gardener:0 "$job_ark_gardener$"
 job_ark_gardener:0 "방주 정원사"
 job_ark_gardener_plural:0 "방주 정원사"
 job_ark_gardener_desc:0 "세심하게 훈련받은 이 관리자들은 여정 중 발견한 소중한 외계 동식물을 보전하며, 필요하다면 무력을 동원하기도 합니다."
 job_ark_gardener_effect_desc:0 "£job_ranger£ $job_ark_gardener_plural$는 $r_society$와 $r_unity$을 생산하고, 지역 £crime£ §Y$PLANET_CRIME_TITLE$§!를 줄이며, §Y$defense_army_plural$§!을 생성하고 §Y$concept_naval_capacity$§!을 증가시킵니다."
