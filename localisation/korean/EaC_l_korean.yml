 leader_trait_legendary_Empathetic_Leader_desc:0 "이 지도자는 국민의 필요를 이해하며, 생활 수준을 개선하고 더 큰 협력을 장려하는 온정적인 환경을 조성합니다."
 leader_trait_legendary_Empathetic_Leader_2_desc:0 "이 지도자는 국민의 필요를 이해하며, 생활 수준을 개선하고 더 큰 협력을 장려하는 온정적인 환경을 조성합니다."
 leader_trait_legendary_Empathetic_Leader_3_desc:0 "이 지도자는 국민의 필요를 이해하며, 생활 수준을 개선하고 더 큰 협력을 장려하는 온정적인 환경을 조성합니다."
 leader_trait_legendary_Community_Builder_desc:0 "이 지도자는 주민들의 단합과 협력을 북돋아 강한 소속감과 공동의 목적의식을 형성합니다."
 leader_trait_legendary_Community_Builder_2_desc:0 "이 지도자는 주민들의 단합과 협력을 북돋아 강한 소속감과 공동의 목적의식을 형성합니다."
 leader_trait_legendary_Community_Builder_3_desc:0 "이 지도자는 주민들의 단합과 협력을 북돋아 강한 소속감과 공동의 목적의식을 형성합니다."
