 pft_environmentalists_nomads:0 "외계 생태주의 파벌"
 pft_environmentalists_nomads_desc:0 "외계 생태학자들은 방주선의 지속적인 거주 적합성을 확보하고 은하 전체의 거시적 환경을 보전하는 데 주로 관심을 둡니다. 이들은 항성 채굴을 요구하는 채굴주의자들에게 반대합니다.\n\n§L생태주의 윤리관§!"
 pft_manufacturers_nomads:0 "채굴주의 파벌"
 pft_manufacturers_nomads_desc:0 "채굴주의자들은 방주선의 운용 능력을 유지하는 우주 광부, 제조업자, 금속 기술자의 이익을 대변합니다. 이들은 외계 생태주의자들의 이상을 경멸합니다.\n\n§L산업주의 윤리관§!"
 factions.1.desc.manufacturers_nomads:0 "이들은 주로 천체를 채굴하고 운영 비축분을 확대하는 데 관심을 두고 있습니다.\n\n"
 factions.1.desc.environmentalists_nomads:0 "이 파벌의 구성원들은 은하 생태계 보전과 운영에 필요한 자원의 절감을 주장합니다.\n\n"
 civic_machine_cult_machine_forever_cruise:0 "봉사자 교단"
 civic_machine_cult_machine_forever_cruise_desc:0 "창조주들에게 신처럼 숭배받는 이 기계 제국은 유기 생명체의 손을 잡고 우주의 영광을 보여 주고자 합니다... 맛있는 과일 음료도 대접하면서 말입니다."
 civic_tooltip_machine_cult_machine_forever_cruise_effects:0 "- 추가 시작 건물: £building£ §Y기계 수도원§! \n- §C['trait:trait_latent_psionic_machine', $trait_latent_psionic_machine$]§! 특성 잠금 해제 \n$civic_tooltip_machine_cult_buildings$\n\n§E사이오닉 공생§!:\n    - £pops£ §Y$planet_pop_organics$§!을 §H사이버네틱§!으로 개조 가능$t$- §H승객§!은 §Y$living_standard_organic_trophy$§! 생활 수준을 사용해야 하며 전문가 직업 효율 §G추가 +1%§! 제공\n$t$- §H일반석 승객§!이 §Y$job_cruise_passenger_unemployment_bio_trophy_plural$§!로 대체됨\n$t$- §R승객의 요구를 충족하기 더 어려워짐§!\n$t$ 모든 기계 팝은 자동으로 §H승무원§!이 되며, 결코 §H승객§!이 될 수 없습니다.\n\n§E함께 사용할 수 있는 사회 제도:§! \n- ['civic_tooltip_machine_cult_spiritualist_combo', $civic_exalted_priesthood$] 또는 기타 ['concept_ethics_rebuild_theocracy',§Y정신주의§! 계열 정부 사회 제도]"
