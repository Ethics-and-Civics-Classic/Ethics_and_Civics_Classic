 PRESCRIPTED_ruler_title_yldarian_raider_clan:0 "해적왕"
 PRESCRIPTED_ruler_name_yldarian_raider_clan:0 "모노바키"
 PRESCRIPTED_ruler_bio_yldarian_raider_clan:0 "해적 군주 몬노바키는 일다리 부족들을 통합하면서 일찌감치 교묘한 전략을 입증했습니다. 스스로 해적 군주라는 칭호를 붙인 그는 은하 전역으로 범죄 조직을 확장하려 합니다!"
 EMPIRE_DESIGN_united_workers_steel_conglomerate:0 "연합 노동자 철강 조합"
 EMPIRE_DESIGN_EaC_united_workers_steel_conglomerate_desc:0 "우리 사이버스탄 공동체에는 이기적인 자본가들로부터 노동자를 지킬 권리가 있다. 누구도 우리가 기업의 압제 아래 겪었던 고통을 겪어서는 안 된다! 노동자여, 단결하라!"
