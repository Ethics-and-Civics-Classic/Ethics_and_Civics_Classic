 EMPIRE_DESIGN_korinth_conglomerate:0 "코린스 복합기업"
 EMPIRE_DESIGN_EaC_korinth_conglomerate_desc:0 "처음에 이들은 그저 인공위성을 쏘아 올렸을 뿐입니다. 알라바스터 통신 유한회사가 구축한 조기 경보 체계가 옛 코린과의 충돌을 피할 수 없는 떠돌이 행성을 발견하자, 무엇이든 대책을 마련해야 했습니다. 그 소식은 전 세계를 하나로 뭉치게 했고, 절박한 사람들은 이 기업에 신뢰를 맡겼습니다.\n\n알라바스터는 공허 태생 계획을 주도하며 모든 자원을 동원해 첫 거주지를 쏘아 올렸습니다. 새 보금자리에 붙인 브랜드는 대중의 사랑을 받았고, 기업들은 가맹점이 되겠다며 줄을 섰습니다. 머지않아 항성계 전역에 거주지가 들어섰고, 여러 사회가 뒤섞이며 문화적 르네상스가 꽃피었습니다.\n\n안타깝게도 위성 정렬 오류, 운석 충돌, 법적 분쟁, 표준화 부재 등 문제가 끊이지 않아 통신망의 유지가 거의 불가능해졌습니다. 알라바스터 통신은 이 중요하고 섬세한 통신망의 관리를 독점적으로 맡겠다고 자청했습니다. 사람들은 그것이 얼마나 강력한 지렛대가 될지 너무 늦게 깨달았습니다.\n\n거주지의 가맹 기업들은 하나씩 인터넷 접속을 전부 잃을 수 있다는 위협 아래 자산을 빼앗기고, 두 배의 수수료를 내고, 지분을 매각했습니다. 결국 모두가 하나의 조직으로 통합되었습니다. 이제 코린스 복합기업으로 이름을 바꾼 이 거대 기업은 가맹 사업 방식을 통해 은하 전역에서 끝없는 인수를 이어 가려 합니다!"
