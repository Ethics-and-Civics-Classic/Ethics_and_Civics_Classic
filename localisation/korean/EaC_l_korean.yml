 auth_cyber_creed_direct_democratic:0 "신성 증강 정치"
 auth_cyber_creed_direct_democratic_desc:0 "민주적 사이버네틱 정부에서는 신성한 투표권을 통해 증강 시민이 수많은 정치 사안에 대한 결정을 내리고, 최소한의 노력으로 자신의 뜻을 실현할 수 있습니다."
 auth_cyber_creed_direct_democratic_tt:0 "민주적 사이버네틱 정부에서는 신성한 투표권을 통해 증강 시민이 수많은 정치 사안에 대한 결정을 내리고, 최소한의 노력으로 자신의 뜻을 실현할 수 있습니다."
 concept_auth_cyber_creed_direct_democratic:0 "$auth_cyber_creed_direct_democratic$"
 auth_cyber_creed_direct_democracy:0 "$auth_cyber_direct_democratic_collectivist$"
 auth_cyber_creed_direct_democracy_desc:0 "$auth_cyber_direct_democratic_collectivist_desc$"
 auth_cyber_direct_democratic_individualist:0 "동시 참여 민주정"
 auth_cyber_direct_democratic_individualist_desc:0 "고도로 발전한 신경 보안 규약 덕분에 시민들은 정책 결정에 실시간으로 직접 투표할 수 있습니다.\n\n그 결과 시민들의 의견과 생각은 자신의 의지에 따라 무의식적으로 정책 수립에 직접 영향을 주고 이를 통제합니다."
 auth_cyber_direct_democratic_individualist_tt:0 "$auth_democratic_election_tt$\n$unlock_edict_legislative_chorus$"
 concept_auth_cyber_direct_democratic_individualist:0 "$auth_cyber_direct_democratic_individualist$"
 gov_cyber_direct_democracy_individualist:0 "$auth_cyber_direct_democratic_individualist$"
 gov_cyber_direct_democracy_individualist_desc:0 "$auth_cyber_direct_democratic_individualist_desc$"
 auth_cyber_direct_democratic_collectivist:0 "분산 상호 연결"
 auth_cyber_direct_democratic_collectivist_desc:0 "의식 인터페이스를 통해 완전한 사이보그 사이에서 감각 자료, 감정 반응, 사고 양식을 실시간으로 공유할 수 있습니다. 강렬한 타인의 신체 반응에 과민하게 노출되는 것을 막기 위해 감정 방화벽이 공유되는 감정 데이터 패킷의 불필요한 반응을 걸러냅니다.\n\n이를 통해 시민의 의견과 생각이 무의식적으로 정책 결정에 직접 영향을 주고, 자신의 뜻에 따라 이를 통제합니다."
 auth_cyber_direct_democratic_collectivist_tt:0 "$auth_democratic_election_tt$\n사이보그 $pops_with_icon$은 행복도의 영향을 받지 않음\n$unlock_edict_self_preservation_override$"
 concept_auth_cyber_direct_democratic_collectivist:0 "$auth_cyber_direct_democratic_collectivist$"
 gov_cyber_direct_democracy_collectivist:0 "$auth_cyber_direct_democratic_collectivist$"
 gov_cyber_direct_democracy_collectivist_desc:0 "$auth_cyber_direct_democratic_collectivist_desc$"
 auth_synth_direct_democratic_physical:0 "직접 전이 체제"
 auth_synth_direct_democratic_physical_desc:0 "이 정부 형태는 합성 신체 사이를 옮겨 다닐 수 있는 전례 없는 자유를 보장하며, 그에 따르는 추가 비용을 감당할 준비가 되어 있습니다."
 auth_synth_direct_democratic_physical_tt:0 "$auth_democratic_election_tt$\n£district£ 지구당 전문가 생산량 §G+1%§!\n£district£ 지구당 £district£ 지구 유지비 §R+1%§!"
 concept_auth_synth_direct_democratic_physical:0 "$auth_synth_direct_democratic_physical$"
 gov_synth_direct_democracy_physical:0 "$auth_synth_direct_democratic_physical$"
 gov_synth_direct_democracy_physical_desc:0 "$auth_synth_direct_democratic_physical_desc$"
 auth_synth_direct_democratic_virtual:0 "분산 대행 체제"
 auth_synth_direct_democratic_virtual_desc:0 "병사들을 정교한 원격 조종 대체 신체로 대신하면 전쟁이 국민에게 미치는 피해를 줄일 수 있습니다. 승조원용 생활 공간이나 조종실도 필요 없으므로 함선을 더 날렵하게 설계할 수 있습니다."
 auth_synth_direct_democratic_virtual_tt:0 "$auth_democratic_election_tt$"
 concept_auth_synth_direct_democratic_virtual:0 "$auth_synth_direct_democratic_virtual$"
 gov_synth_direct_democracy_virtual:0 "$auth_synth_direct_democratic_virtual$"
 gov_synth_direct_democracy_virtual_desc:0 "$auth_synth_direct_democratic_virtual_desc$"
 RT_ARCHBISHOP:0 "대주교"
 RT_ARCHBISHOP_FEMALE:0 "$RT_ARCHBISHOP$"
 gov_monastic_commmunes:0 "수도 공동체"
 gov_monastic_commmunes_desc:0 "이 정부는 수많은 소규모 종교 공동체로 이루어져 있습니다. 각 공동체는 자치를 누리지만, 중대한 위기에 처하면 사회의 단결을 위해 힘을 모읍니다."
 gov_monastic_order:0 "수도회"
 gov_monastic_order_desc:0 "이 사회는 서로 떨어진 소규모 종교 공동체로 이루어져 있습니다. 모든 공동체는 각 수도원의 지도자들로 구성된 평의회가 작성한 하나의 경전을 따릅니다."
 RT_CONCLAVE_ARBITER:0 "종교 회의 중재자"
 RT_CONCLAVE_ARBITER_FEMALE:0 "$RT_CONCLAVE_ARBITER$"
 gov_monastic_hegemony:0 "수도원 패권정"
 gov_monastic_hegemony_desc:0 "이 사회는 작고 고립된 종교 공동체들로 구성됩니다. 더 크고 강력한 수도원이 이들의 관습과 규범을 결정하며, 가장 강력한 수도원이 지도권을 맡습니다."
 gov_messianic_cult:0 "메시아 숭배"
 gov_messianic_cult_desc:0 "이 작은 공동체들은 막강한 신성한 힘을 지녔다고 믿는 단일 계승 혈통 아래 통합되었습니다."
 RT_DIVINE_GUIDE:0 "신성한 인도자"
 RT_DIVINE_GUIDE_FEMALE:0 "$RT_DIVINE_GUIDE$"
 HT_BLESSED_ACOLYTE:0 "축복받은 시종"
 HT_BLESSED_ACOLYTE_FEMALE:0 "$HT_BLESSED_ACOLYTE$"
 building_storm_summoning_theater_desc_industrial:0 "예술과 기술이 어우러진 $job_storm_technician_plural$의 의식은 우주 폭풍의 형성을 촉진합니다."
 building_storm_holo_theater_desc_industrial:0 "행성 전역과 그 너머까지 방송을 송출하는 $building_storm_holo_theater$ 덕분에 $job_storm_technician_plural$의 작업이 더 널리 퍼집니다."
 building_storm_grand_theater_desc_industrial:0 "예술과 기술의 최첨단 성취를 구현한 이 거대한 중심 시설은 가장 정교한 의식을 치르기에 완벽한 공간을 제공합니다."
 job_storm_technician:0 "폭풍 기술자"
 job_storm_technician_plural:0 "폭풍 기술자"
 job_storm_technician_desc:0 "고대 의식과 실용 과학을 결합하여 폭풍의 본질을 다루는 것이 $job_storm_technician$의 임무입니다.\n\n§R!§! §W직업 요구 사항§! £pops£ §H$ethic_industrial$§!"
 job_storm_technician_effect_desc:0 "$job_storm_technician_plural$는 $r_consumer_goods$를 $r_unity$, $r_amenities$, £engineering£ §Y연구 점수§! 및 £pops£ §H$ethic_industrial$§! 선호도로 전환합니다"
 job_storm_technician_with_icon:0 "£job_storm_technician£ $job_storm_technician$"
 job_storm_technician_plural_with_icon:0 "£job_storm_technician£ $job_storm_technician_plural$"
 mod_job_storm_technician_add:0 "$job_storm_technician$ 직업"
 mod_job_storm_technician_per_pop:0 "팝 $VALUE$마다 $job_storm_technician$ 직업 §G+1§!"
 mod_job_storm_technician_per_pop_short:0 "\n$VALUE$ £pop£마다 £mod_job_storm_technician_add£ §G+1§!"
 planet_storm_technicians:0 "$job_storm_technician_plural$"
 building_storm_summoning_theater_desc_spiritualist:0 "신앙과 기술이 어우러진 가운데, $job_storm_technician_plural$의 의식은 우주 폭풍을 불러들이는 데 도움을 줍니다."
 building_storm_holo_theater_desc_spiritualist:0 "$building_storm_holo_theater$은 행성 전체와 그 너머까지 방송을 송출하여 $job_storm_technician_plural$들의 목소리를 더 멀리 전합니다."
 building_storm_grand_theater_desc_spiritualist:0 "정신적·기술적 성취에 대한 믿음을 품은 이 웅장한 시설은 가장 독실한 성가대원들에게 완벽한 성소를 제공합니다."
