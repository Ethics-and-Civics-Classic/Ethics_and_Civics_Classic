 EMPIRE_DESIGN_yldarian_raider_clan:0 "일다리안 약탈 부족"
 EMPIRE_DESIGN_EaC_yldarian_raider_clan_desc:0 "일다리의 기원은 거의 잊혔으며, 거대한 계획에 대한 희미한 단서와 추측만이 남아 있습니다. 구전 전승에 따르면 이들은 오래전 선구자 제국의 전사 계급으로 유전적으로 설계되었습니다. 옛 주인들이 멸종한 지 오래인 지금, 부족들은 하나로 뭉쳐 무방비한 외부 행성에서 새로운 전리품을 거두려 합니다.\n일다리는 모두 수컷인 종족으로 정상적인 번식이 불가능하여 고대 클론 배양소에 의존합니다. 그러나 고대의 유전 설계는 이들을 완벽한 전사로 만들었습니다. 그 결과 전사는 통치하고 대중은 복종해야 한다는 믿음에 기반한 뿌리 깊은 위계 문화가 형성되었습니다."
