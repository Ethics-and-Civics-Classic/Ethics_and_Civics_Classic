 EaC_civic_mechanic_events.103.desc.other:0 "§R설치된 모드 중 하나에§! §YEthics and Civics Classic§! §R모드와의 호환 패치가 필요합니다!§!\n\n이 충돌은 Ethics and Civics Classic이나 기본 게임에 없는 통치 체제 때문에 발생합니다. Ethics and Civics Classic 제작자에게 호환 지원을 요청할 수 있습니다."
