envoy_events.210.desc.green:0 "$envoy_events.210.desc.start$ [Root.GetAdj]의 실용주의를 저버린 이 사절은 여가 시간 대부분을 [envoy_country.GetAdj]의 야생에서 보내고 있습니다. 심지어 맨땅에서 잠을 자는 모습이 사진에 찍혔다는 충격적인 보도까지 나왔습니다. 무슨 원시 [Root.GetSpeciesName]도 아니고 말입니다!\n해명을 요구하자 사절은 이렇게 답했습니다. \"[envoy_country.GetSpeciesNamePlural]의 말이 맞습니다. 우리는 모성을 죽였습니다. 저도 [Root.GetSpeciesAdj] 본연의 자연과 다시 하나가 되고 싶지만, [Root.GetHomeworldName]에서는 더 이상 그럴 수 없어요.\"\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.industrial:0 "$envoy_events.210.desc.start$ 이 사절은 국민들이 아끼는 국립공원 사업을 두고 \"알량한 감상주의에 영합하는 범죄\"이자 \"발전을 가로막는 걸림돌\"이라고 공개적으로 비난해 충격과 공분을 샀습니다.\n[event_envoy.species.GetShockingDietSecret] 추문도 이런 추문이 없습니다!\n\n$envoy_events.210.desc.end$"
 TABLOIDRUMOR_hum:0 "더 충격적인 소문에 따르면, 이 사절은 고기까지 즐겨 먹는다고 합니다!"
 TABLOIDRUMOR_mam:0 "심지어 점토로 만든 배변용 모래를 쓴다는 소문까지 돌고 있습니다!"
 TABLOIDRUMOR_rep:0 "가장 실망스러운 의혹은 몸을 데우는 데 전력을 많이 잡아먹는 온열등을 쓴다는 것입니다!"
 TABLOIDRUMOR_avi:0 "어떤 목격자는 사절이 모래 목욕을 한 뒤 모래를 재활용하지 않고 그대로 버리는 모습까지 봤다고 주장합니다!"
 TABLOIDRUMOR_art:0 "가장 심각한 보도에 따르면, 이제는 허물을 벗고 나서 퇴비로 만들지도 않는다고 합니다."
 TABLOIDRUMOR_mol:0 "확인되지 않은 보도에 따르면, 생분해되지 않는 점액 젤까지 쓴다고 합니다. 그것도 미용 목적으로 말입니다!"
 TABLOIDRUMOR_shell:0 "확인되지 않은 보도에 따르면, 구시대적인 화석 연료 기반 플라스틱으로 껍데기를 주문 제작했다고 합니다. 다른 것도 아니고, 플라스틱이라니요!"
 TABLOIDRUMOR_necroid:0 "매일 몸을 재생하는 과정에 사용이 금지된 방부액을 쓴다는 더욱 수치스러운 사실도 드러났습니다."
 TABLOIDRUMOR_aquatic:0 "이웃 중에는 사절이 개인 왕복선의 초공간 드라이브 냉각수를 공공 수로에 쏟아 버리는 모습을 봤다는 사람도 있습니다!"
 TABLOIDRUMOR_lithoid:0 "지속 가능성 인증을 받지 못한 광산에서 나온 광물을 먹는다는 우려스러운 의혹도 제기됐습니다."
 TABLOIDRUMOR_plant:0 "설상가상으로, 사절이 집에서 쓰는 토양 침대에서는 불법 산업용 비료까지 검출됐습니다."
 TABLOIDRUMOR_tox:0 "가정용 환경 감지기 기록에 따르면, 사절은 개인적인 용도로 구시대적인 화석 연료를 태워 왔습니다."
 envoy_events.210.desc.socialism:0 "$envoy_events.210.desc.start$ [envoy_country.GetAdj]의 공산주의자들이 무슨 수를 썼는지, 이 사절은 세뇌라도 당한 듯 그들의 타락한 이념에 물들었습니다.\n[envoy_country.GetSpeciesAdj] 노동조합 집회에서 연설을 하기로 한 사실이 드러났지만, 사절은 끝내 입장을 철회하지 않았습니다.\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.capitalism:0 "$envoy_events.210.desc.start$ [event_envoy.GetName](이)가 노동자들을 배신해 왔다는 사실이 드러나 여론이 들끓고 있습니다. [envoy_country.GetAdj] 당국과의 비공개 회동에서 거액의 포상금을 받고 [envoy_country.GetSpeciesAdj] 노동운동 핵심 지도자들의 신원을 넘겨주는 모습이 기록에 남은 것입니다.\n\n$envoy_events.210.desc.end$"
 envoy_events.17.desc.green:0 "$envoy_events.17.desc.base$ 하지만 환경을 더 배려하는 관점의 장점을 설득하는 데는 실패했습니다. 곧 \"감상에 젖은 [Root.GetAdj]의 환경 타령\"을 옹호한다는 야유가 쏟아졌습니다.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.industrial:0 "$envoy_events.17.desc.base$ 하지만 지성체의 필요를 우선하는 관점의 장점을 설득하는 데는 실패했습니다. 오히려 \"광범위한 생태계 파괴\"를 냉혹하게 옹호한다는 신랄한 비난에 직면했습니다.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.socialism:0 "$envoy_events.17.desc.base$ 하지만 중앙 계획 경제의 장점을 설득하는 데는 실패했습니다. 사회주의를 공개적으로 옹호했다는 이유로 회의장에서 쫓겨날 뻔하기까지 했습니다.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.capitalism:0 "$envoy_events.17.desc.base$ 하지만 자유방임 경제의 장점을 설득하는 데는 실패해 서둘러 회의장을 떠나야 했습니다. \"자본가 계급의 폭정\"과 \"[Root.GetAdj]의 지대 추구\"를 두둔했다는 비난이 공개적으로 쏟아지고 있습니다.\n\n$envoy_events.17.desc.end$"
 envoy_events.18.desc.green.base:0 "회원국들의 모성이 초광속 문명으로 발전하기 전 겪었던, 충분히 막을 수 있었던 수많은 행성 규모의 재난을 예로 들며 생태 중심적인 관점의 장점을 많은 이들에게 납득시켰습니다."
 envoy_events.18.desc.industrial.base:0 "현대 생산 체계를 뒷받침하는 실용적인 판단의 가치를 명쾌하게 설명하며, 산업 발전을 중시하는 관점의 장점을 많은 이들에게 납득시켰습니다."
 envoy_events.18.desc.socialism.base:0 "[dispute_loser.GetAdj] 사절이 자본주의를 옹호하며 내놓은 주장을 하나하나 논파해, 사회주의 경제 이론의 장점을 많은 이들에게 납득시켰습니다."
 envoy_events.18.desc.capitalism.base:0 "모든 참석자 앞에서 사회주의의 실패를 조목조목 지적하며, 자유 시장 체제의 장점을 많은 이들에게 납득시켰습니다."
