 bombardment_EaC_liberate_slaves_desc:0 "강습 부대가 노예를 구출해 자유를 되찾아 줍니다.\n\n§R오직§! §Y노예 팝§!§R에게만 적용됩니다!§!"
 orbital_bombardment_nuclear_armageddon:0 "핵 아마겟돈"
 orbital_bombardment_nuclear_armageddon_name:0 "핵 아마겟돈 폭격"
 orbital_bombardment_nuclear_armageddon_desc:0 "행성의 생명을 고려하지 않고 모든 핵무기를 전면적으로 사용하도록 허용합니다. 그들도 우리 선조들이 겪었던 불타는 태양을 느끼게 될 것입니다.\n\n§E'무차별' 및 '절멸' 궤도 폭격 태세를 허용합니다.§!"
 EaC_civic_mechanic_events.103.desc.official_elected:0 "정치관의 굽이진 계단을 따라 들어선 보관소의 사회관에는 아득한 세월 동안 모인 정치 이론, 법률, 정책 기록, 도시 계획, 물자 수송 전략을 비롯한 수많은 분야의 지식이 보관되어 있습니다. 안쪽 방에는 보관소 장서의 일부를 선택받은 이의 정신에 각인할 수 있는 고대 장치가 있습니다.\n\n기억 주입에 쓰이는 도관은 제작에 10년이 걸리며, 사용할 때마다 확장됩니다. §Y[ROOT.GetLeaderName]§!에게 §G기억 주입§!의 영예가 주어지는 것은 지극히 당연합니다. 새로 얻은 지식이 [ROOT.GetName]의 앞길을 밝혀 주기를!"
 EaC_civic_mechanic_events.103.desc.official_elected_20:0 "정치관의 구불구불한 계단을 따라 들어서면, 영겁에 걸쳐 수집된 정치 이론, 법률, 정책 기록, 도시 계획, 보급 전략을 비롯한 수많은 분야의 지식이 보관소의 사회관을 채우고 있습니다. 안쪽 방에는 선택된 이의 정신에 보관소 지식의 일부를 각인할 수 있는 고대 장치가 있습니다.\n\n기억 주입에 쓰이는 매개체는 제작에 수십 년이 걸리며, 사용할 때마다 확장됩니다. §Y[ROOT.GetLeaderName]§!에게 §G기억 주입§!의 영예를 수여하는 것은 당연한 일입니다. 새로 얻은 지식이 [ROOT.GetName]의 앞길을 인도하기를!"
 EaC_civic_mechanic_events.103.desc.official_dictator:0 "정치 구역의 구불구불한 계단을 따라 들어서면, 기록 보관소의 사회학 구역에 아득한 세월 동안 축적된 정치 이론과 법률, 정책 기록, 도시 계획, 보급 물류 전략을 비롯한 수많은 분야의 자료가 보관되어 있습니다. 내부의 방에는 보관소 자료 일부를 선택받은 자의 정신에 각인하는 고대 장치가 있습니다.\n\n기억 주입에 사용하는 도관은 제작에 수십 년이 걸리며 사용할 때마다 확장됩니다. 이번 §G기억 주입§!의 주인공은 [ROOT.GetRulerTitle] §Y[ROOT.GetLeaderName]§!입니다. 새로 얻은 지식이 [ROOT.GetName]의 전진을 이끌기를!"
 EaC_civic_mechanic_events.103.desc.official_dictator_is_memorialist_empire:0 "정치 구역의 굽이치는 계단을 따라가면, 보관소의 사회 구역에 장구한 세월 동안 축적된 정치 이론, 법률, 정책 기록, 도시 계획, 보급 전략을 비롯한 수많은 분야의 지식이 자리하고 있습니다.\n\n보관소 깊은 곳의 비밀 시설에는 소장 지식 일부를 [Root.GetRulerTitle]의 정신에 각인할 수 있는 고대 장치가 있습니다. 이 §B권위의 방§!에는 역대 모든 [Root.GetRulerTitle]의 기억이 보존되어 있습니다.\n\n오늘은 새로 취임한 [Root.GetRulerTitle]의 영광스러운 §G기억 주입§!이 거행되는 날입니다. §Y[ROOT.GetLeaderName]§!은 이전 [Root.GetRulerTitle]의 연장이 되어, 후계자를 통해 존속하는 하나의 의식에 합류할 것입니다."
 EaC_civic_mechanic_events.103.desc.official_imperial:0 "정치관의 굽이진 계단을 따라 들어선 보관소의 사회관에는 아득한 세월 동안 모인 정치 이론, 법률, 정책 기록, 도시 계획, 물자 수송 전략을 비롯한 수많은 분야의 지식이 보관되어 있습니다.\n\n 안쪽 방에는 보관소 장서의 일부를 선택받은 이의 정신에 각인할 수 있는 고대 장치가 있습니다.\n\n기억 주입에 쓰이는 도관은 제작에 수십 년이 걸리며, 사용할 때마다 확장됩니다. [ROOT.GetRulerTitle] §Y[ROOT.GetLeaderName]§!에게는 태어날 때부터 §G기억 주입§!을 받을 권리가 있습니다. 새로 얻은 지식이 [ROOT.GetName]의 전진을 이끌기를!"
 EaC_civic_mechanic_events.103.desc.official_imperial_is_memorialist_empire:0 "정치관의 구불구불한 계단을 따라 들어서면, 영겁에 걸쳐 수집된 정치 이론, 법률, 정책 기록, 도시 계획, 보급 전략을 비롯한 수많은 분야의 지식이 보관소의 사회관을 채우고 있습니다.\n\n보관소 깊숙한 방에는 [Root.GetRulerTitle]의 정신에 보관소 지식의 일부를 각인할 수 있는 고대 장치가 숨겨져 있습니다. 이 §B왕실의 방§!에는 왕가의 모든 기억이 담겨 있으며, [Root.GetLeaderName]에게 전승할 수 있도록 엄중하게 보호되고 있습니다.\n\n오늘은 [Root.GetHeirName](이)가 [Root.GetHeirTitle](이)가 되어 [Root.GetRulerTitle] §Y[ROOT.GetLeaderName]§!의 §G기억 대관식§!을 지켜보는 성스러운 날입니다. 새 통치자는 선대 [Root.GetRulerTitle]의 연장선이 되어, 후손을 통해 살아가는 선조의 의식과 하나가 될 것입니다."
 EaC_civic_mechanic_events.103.desc.official_hive_is_memorialist_empire:0 "정치 구역의 구불구불한 계단을 따라 들어서면, 기록 보관소의 사회학 구역에 아득한 세월 동안 축적된 정치 이론과 법률, 정책 기록, 도시 계획, 보급 물류 전략을 비롯한 수많은 분야의 자료가 보관되어 있습니다.\n보관소 깊은 곳에는 주입 도관을 통해 보관소 자료 일부를 [Root.GetRulerTitle]에게 각인하는 군체 기억 피질이 있습니다. 이 §B군체 기억 피질§!에는 모든 [Root.GetSpeciesName] 개체가 품었던 기억이 담겨 있습니다.\n\n주입 도관을 만드는 과정이 복잡하기 때문에 [ROOT.GetLeaderName]의 §G기억 주입§!은 수십 년에 한 번만 가능합니다."
 EaC_civic_mechanic_events.103.desc.official_megacorp:0 "정치 구역의 굽이치는 계단을 따라가면, 보관소의 사회 구역에 장구한 세월 동안 축적된 정치 이론, 법률, 정책 기록, 도시 계획, 보급 전략을 비롯한 수많은 분야의 지식이 자리하고 있습니다.\n[ROOT.GetName]의 본사는 보관소 깊은 곳에 있습니다. 이곳의 고대 장치는 소장 지식 일부를 다른 이의 정신에 각인할 수 있지만, 제작에 수십 년이 걸리는 특수 연결 장치가 필요합니다. 따라서 §Y[ROOT.GetLeaderName]§!에게 §G기억 주입§!을 시행하는 것이야말로 합리적인 사업적 판단입니다. 새로운 [Root.GetRulerTitle]에게 [ROOT.GetName]의 번영에 필요한 수익 창출의 지혜를 전해줄 것입니다!"
 EaC_civic_mechanic_events.103.desc.official_machine_is_memorialist_empire:0 "정치관의 굽이진 계단을 따라 들어선 보관소의 사회관에는 아득한 세월 동안 모인 정치 이론, 법률, 정책 기록, 도시 계획, 물자 수송 전략을 비롯한 수많은 분야의 지식이 보관되어 있습니다.\n\n보관소 깊숙한 방에는 주입 도관을 통해 보관소 장서의 일부를 [Root.GetRulerTitle]에게 각인하는 고대 기억 코어가 있습니다. 이 §B고대 기억 피질§!에는 모든 [Root.GetSpeciesName] 개체가 지금껏 품었던 기억이 담겨 있습니다.\n\n주입 도관의 제조 공정이 복잡하기 때문에 [ROOT.GetLeaderName]의 §G기억 주입§!은 수십 년에 한 번씩만 진행할 수 있습니다."
 EaC_civic_mechanic_events.103.desc.commander_elected:0 "군사 구역의 구불구불한 계단을 따라 전략과 전술에 관한 오랜 교훈이 정리되어 있습니다. 지상과 공중, 바다와 궤도, 우주를 아우르는 온갖 전쟁 양상에 대한 홀로그램 서적이 줄지어 늘어서 있습니다. 중앙의 방에는 보관소 자료 일부를 선택받은 자의 정신에 각인하는 고대 장치가 있습니다.\n\n기억 주입에 사용하는 도관은 제작에 십 년이 걸리며 사용할 때마다 확장됩니다. §Y[ROOT.GetLeaderName]§!에게 §G기억 주입§!의 영예가 돌아가는 것은 당연한 일입니다. 새로 얻은 지식이 [ROOT.GetName]의 앞길을 이끌기를!"
 EaC_civic_mechanic_events.103.desc.commander_elected_20:0 "군사 구역의 구불구불한 계단을 따라 전략과 전술에 관한 오랜 교훈이 정리되어 있습니다. 지상과 공중, 바다와 궤도, 우주를 아우르는 온갖 전쟁 양상에 대한 홀로그램 서적이 줄지어 늘어서 있습니다. 중앙의 방에는 보관소 자료 일부를 선택받은 자의 정신에 각인하는 고대 장치가 있습니다.\n\n기억 주입에 사용하는 도관은 제작에 십 년이 걸리며 사용할 때마다 확장됩니다. §Y[ROOT.GetLeaderName]§!에게 §G기억 주입§!의 영예가 돌아가는 것은 당연한 일입니다. 새로 얻은 지식이 [ROOT.GetName]의 앞길을 이끌기를!"
 EaC_civic_mechanic_events.103.desc.commander_dictator:0 "군사관의 구불구불한 계단을 따라 들어서면, 영겁에 걸친 전략과 병법의 교훈이 정리되어 있습니다. 육지, 하늘, 바다, 궤도, 우주 등 온갖 전장을 다루는 홀로그램 서적이 줄지어 늘어서 있습니다.\n\n"
 EaC_civic_mechanic_events.103.desc.commander_dictator_is_memorialist_empire:0 "군사 구역의 굽이치는 계단을 따라가면, 장구한 세월 동안 축적된 전략과 전술의 교훈이 분류되어 있습니다. 육해공은 물론 궤도와 우주를 아우르는 모든 전쟁 방식에 관한 홀로북이 줄지어 있습니다.\n\n보관소 깊은 곳의 비밀 시설에는 소장 지식 일부를 [Root.GetRulerTitle]의 정신에 각인할 수 있는 고대 장치가 있습니다. 이 §B권위의 방§!에는 역대 모든 [Root.GetRulerTitle]의 기억이 보존되어 있습니다.\n\n오늘은 새로 취임한 [Root.GetRulerTitle]의 영광스러운 §G기억 주입§!이 거행되는 날입니다. §Y[ROOT.GetLeaderName]§!은 이전 [Root.GetRulerTitle]의 연장이 되어, 후계자를 통해 존속하는 하나의 의식에 합류할 것입니다."
 EaC_civic_mechanic_events.103.desc.commander_imperial:0 "군사관의 구불구불한 계단을 따라 들어서면, 영겁에 걸친 전략과 병법의 교훈이 정리되어 있습니다. 육지, 하늘, 바다, 궤도, 우주 등 온갖 전장을 다루는 홀로그램 서적이 줄지어 늘어서 있습니다.\n\n"
 EaC_civic_mechanic_events.103.desc.commander_imperial_is_memorialist_empire:0 "군사관의 구불구불한 계단을 따라 들어서면, 영겁에 걸친 전략과 병법의 교훈이 정리되어 있습니다. 육지, 하늘, 바다, 궤도, 우주 등 온갖 전장을 다루는 홀로그램 서적이 줄지어 늘어서 있습니다.\n\n보관소 중앙의 방에는 [Root.GetRulerTitle]의 정신에 보관소 지식의 일부를 각인할 수 있는 고대 장치가 숨겨져 있습니다. 이 §B왕실의 방§!에는 왕가의 모든 기억이 담겨 있으며, [Root.GetLeaderName]에게 전승할 수 있도록 엄중하게 보호되고 있습니다.\n\n오늘은 [Root.GetHeirName](이)가 [Root.GetHeirTitle](이)가 되어 [Root.GetRulerTitle] §Y[ROOT.GetLeaderName]§!의 §G기억 대관식§!을 지켜보는 성스러운 날입니다. 새 통치자는 선대 [Root.GetRulerTitle]의 연장선이 되어, 후손을 통해 살아가는 선조의 의식과 하나가 될 것입니다."
 EaC_civic_mechanic_events.103.desc.commander_hive_is_memorialist_empire:0 "군사관의 굽이진 계단을 따라 아득한 세월에 걸쳐 축적된 전략과 전쟁술의 교훈이 분류되어 있습니다. 지상, 공중, 해상, 궤도, 우주를 아우르는 온갖 전쟁 방식에 관한 홀로북이 줄지어 늘어서 있습니다.\n\n보관소 깊숙한 방에는 주입 도관을 통해 보관소 장서의 일부를 [Root.GetRulerTitle]에게 각인하는 군체 기억 피질이 있습니다. 이 §B군체 기억 피질§!에는 모든 [Root.GetSpeciesName] 개체가 지금껏 품었던 기억이 담겨 있습니다.\n\n주입 도관의 제작 과정이 복잡하기 때문에 [ROOT.GetLeaderName]의 §G기억 주입§!은 수십 년에 한 번씩만 진행할 수 있습니다."
 EaC_civic_mechanic_events.103.desc.commander_megacorp:0 "정치 구역의 구불구불한 계단을 따라 들어서면, 기록 보관소의 사회학 구역에 아득한 세월 동안 축적된 정치 이론과 법률, 정책 기록, 도시 계획, 보급 물류 전략을 비롯한 수많은 분야의 자료가 보관되어 있습니다.\n\n[ROOT.GetName]의 본사는 보관소 깊은 곳에 있습니다. 그곳에는 보관소 자료 일부를 다른 이의 정신에 각인하는 고대 장치가 있지만, 이를 사용하려면 마련하는 데 수십 년이 걸리는 특수 도관이 필요합니다. 따라서 §Y[ROOT.GetLeaderName]§!에게 이 §G기억 주입§!을 시행하는 것은 경영상으로도 지극히 합리적입니다. 새로운 [Root.GetRulerTitle]에게 [ROOT.GetName]의 번영에 필요한 돈 버는 지혜를 선사할 테니까요!"
 EaC_civic_mechanic_events.103.desc.commander_machine_is_memorialist_empire:0 "정치관의 굽이진 계단을 따라 들어선 보관소의 사회관에는 아득한 세월 동안 모인 정치 이론, 법률, 정책 기록, 도시 계획, 물자 수송 전략을 비롯한 수많은 분야의 지식이 보관되어 있습니다.\n\n보관소 깊숙한 방에는 주입 도관을 통해 보관소 장서의 일부를 [Root.GetRulerTitle]에게 각인하는 고대 기억 코어가 있습니다. 이 §B고대 기억 피질§!에는 모든 [Root.GetSpeciesName] 개체가 지금껏 품었던 기억이 담겨 있습니다.\n\n주입 도관의 제조 공정이 복잡하기 때문에 [ROOT.GetLeaderName]의 §G기억 주입§!은 수십 년에 한 번씩만 진행할 수 있습니다."
 EaC_civic_mechanic_events.103.desc.scientist_elected:0 "과학 구역의 굽이치는 계단을 따라가면, 과학 이론과 법칙, 물질의 특성, 수학적 증명을 비롯한 무수한 지식이 보관소 곳곳에 자리하고 있습니다. 내부의 방에는 소장 지식 일부를 선택된 이의 정신에 각인할 수 있는 고대 장치가 있습니다.\n\n기억 주입에 사용하는 연결 장치는 제작에 십 년이 걸리며 사용할 때마다 확장됩니다. §Y[ROOT.GetLeaderName]§!에게 §G기억 주입§!의 영예를 수여하는 것은 당연한 일입니다. 새로 얻은 지식이 [ROOT.GetName]의 앞길을 밝혀주기를!"
 EaC_civic_mechanic_events.103.desc.scientist_elected_20:0 "과학관의 굽이진 계단을 따라 과학 이론과 법칙, 물질의 특성, 수학적 증명 등 아득한 세월 동안 축적된 수많은 지식이 보관소의 과학관 곳곳에 자리하고 있습니다. 안쪽 방에는 보관소 장서의 일부를 선택받은 이의 정신에 각인할 수 있는 고대 장치가 있습니다.\n\n기억 주입에 쓰이는 도관은 제작에 수십 년이 걸리며, 사용할 때마다 확장됩니다. §Y[ROOT.GetLeaderName]§!에게 §G기억 주입§!의 영예가 주어지는 것은 지극히 당연합니다. 새로 얻은 지식이 [ROOT.GetName]의 앞길을 밝혀 주기를!"
 EaC_civic_mechanic_events.103.desc.scientist_dictator:0 "과학관의 구불구불한 계단을 따라 들어서면, 과학 이론과 법칙, 물질의 특성, 수학적 증명을 비롯해 영겁에 걸쳐 축적된 무수한 지식이 보관소의 과학관 곳곳을 채우고 있습니다.\n\n"
 EaC_civic_mechanic_events.103.desc.scientist_dictator_is_memorialist_empire:0 "과학 구역의 구불구불한 계단을 따라, 보관소의 과학 구역 곳곳에 과학 이론과 법칙, 물질의 성질, 수학적 증명 등 오랜 세월 쌓아 온 수많은 지식이 자리하고 있습니다.\n\n보관소 깊은 곳에는 자료 일부를 [Root.GetRulerTitle]의 정신에 각인하는 고대 장치를 갖춘 비밀 시설이 있습니다. 이 §B권위의 전당§!에는 지금껏 통치했던 모든 [Root.GetRulerTitle]의 기억이 담겨 있습니다.\n\n오늘은 새로 취임한 [Root.GetRulerTitle]의 영광스러운 §G기억 주입§!이 이루어지는 날입니다. §Y[ROOT.GetLeaderName]§!은 이전 [Root.GetRulerTitle]의 연장이 되어, 후계자를 통해 존속하는 하나의 의식으로 융합될 것입니다."
 EaC_civic_mechanic_events.103.desc.scientist_imperial:0 "과학관의 구불구불한 계단을 따라 들어서면, 과학 이론과 법칙, 물질의 특성, 수학적 증명을 비롯해 영겁에 걸쳐 축적된 무수한 지식이 보관소의 과학관 곳곳을 채우고 있습니다.\n\n"
 EaC_civic_mechanic_events.103.desc.scientist_imperial_is_memorialist_empire:0 "과학관의 구불구불한 계단을 따라 들어서면, 과학 이론과 법칙, 물질의 특성, 수학적 증명을 비롯해 영겁에 걸쳐 축적된 무수한 지식이 보관소의 과학관 곳곳을 채우고 있습니다.\n\n보관소 깊숙한 방에는 [Root.GetRulerTitle]의 정신에 보관소 지식의 일부를 각인할 수 있는 고대 장치가 숨겨져 있습니다. 이 §B왕실의 방§!에는 왕가의 모든 기억이 담겨 있으며, [Root.GetLeaderName]에게 전승할 수 있도록 엄중하게 보호되고 있습니다.\n\n오늘은 [Root.GetHeirName](이)가 [Root.GetHeirTitle](이)가 되어 [Root.GetRulerTitle] §Y[ROOT.GetLeaderName]§!의 §G기억 대관식§!을 지켜보는 성스러운 날입니다. 새 통치자는 선대 [Root.GetRulerTitle]의 연장선이 되어, 후손을 통해 살아가는 선조의 의식과 하나가 될 것입니다."
 EaC_civic_mechanic_events.103.desc.scientist_hive_is_memorialist_empire:0 "과학 구역의 굽이치는 계단을 따라가면, 과학 이론과 법칙, 물질의 특성, 수학적 증명을 비롯한 무수한 지식이 보관소 곳곳에 자리하고 있습니다.\n\n보관소 깊은 곳에는 주입용 연결 장치를 통해 소장 지식 일부를 [Root.GetRulerTitle]에게 각인하는 군체 기억 피질이 있습니다. 이 §B군체 기억 피질§!에는 모든 [Root.GetSpeciesName]이 경험한 기억이 담겨 있습니다.\n\n주입용 연결 장치의 제작이 복잡하기 때문에, [ROOT.GetLeaderName]은 수십 년에 한 번만 §G기억 주입§!을 받을 수 있습니다."
 EaC_civic_mechanic_events.103.desc.scientist_megacorp:0 "과학관의 굽이진 계단을 따라 과학 이론과 법칙, 물질의 특성, 수학적 증명 등 아득한 세월 동안 축적된 수많은 지식이 보관소의 과학관 곳곳에 자리하고 있습니다.\n\n[ROOT.GetName]의 본사는 보관소 깊숙한 방에 자리하고 있습니다. 이곳에는 보관소 장서의 일부를 다른 이의 정신에 각인할 수 있는 고대 장치가 있지만, 확보에 수십 년이 걸리는 특수 도관이 필요합니다. 그러므로 §Y[ROOT.GetLeaderName]§!에게 이 §G기억 주입§!을 사용하는 것은 사업적으로도 당연한 선택입니다. 새로운 [Root.GetRulerTitle]에게 [ROOT.GetName]의 번영에 필요한 수익 창출의 지혜를 안겨 줄 것입니다!"
 EaC_civic_mechanic_events.103.desc.scientist_machine_is_memorialist_empire:0 "과학 구역의 구불구불한 계단을 따라, 보관소의 과학 구역 곳곳에 과학 이론과 법칙, 물질의 성질, 수학적 증명 등 오랜 세월 쌓아 온 수많은 지식이 자리하고 있습니다.\n\n보관소 깊은 곳에는 주입 도관을 통해 보관소 자료 일부를 [Root.GetRulerTitle]에게 각인하는 고대 기억 코어가 있습니다. 이 §B고대 기억 피질§!에는 모든 [Root.GetSpeciesName] 개체가 품었던 기억이 담겨 있습니다.\n\n주입 도관을 제조하는 과정이 복잡하기 때문에 [ROOT.GetLeaderName]의 §G기억 주입§!은 수십 년에 한 번만 가능합니다."
