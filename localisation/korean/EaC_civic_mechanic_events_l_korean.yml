 sm_arkship_pirate_mercenary_garrison:0 "$sm_pirate_mercenary_garrison$"
 sm_arkship_pirate_mercenary_garrison_desc:0 "$sm_pirate_mercenary_garrison_desc$"
 EaC_civic_mechanic_events.2000.name:0 "[mercenary_enclave_country.GetName] 엔클레이브의 배당금 지불"
 EaC_civic_mechanic_events.2000.desc:0 "존경하는 후원자님, 최근 체결한 여러 계약이 높은 수익을 내고 있습니다. 민간 부문 사업을 확장한 결과, 몇몇 기업과 다양한 경호 및 평화 유지 서비스 계약을 체결했습니다. 또한, 계약 업무를 수행하던 저희 요원들이 우연히 귀중한 과학 연구 자료를 발견했습니다. 연구 자료는 정기 배당금과 함께 보내드리도록 하겠습니다."
 EaC_civic_mechanic_events.2005.desc:0 "존경하는 후원자님, 현재 당사 사업은 호조를 보이고 있으며, 매출 또한 꾸준히 증가하고 있습니다. 기존 배당금에 더해, 요금을 체납한 민간 의뢰사로부터 압류한 자원을 추가로 보내드립니다."
 EaC_civic_mechanic_events.2010.desc:0 "존경하는 후원자님, 기쁜 소식을 전해드립니다. 이번 회계 주기에 수익 신기록을 달성했습니다! 이에 기존 배당금에 추가금을 넉넉히 얹어 보내드립니다."
 EaC_civic_mechanic_events.2015.desc:0 "존경하는 후원자님, 저희 조선소는 지금까지 최고의 함대를 생산하기 위해 쉼 없이 노력해 왔습니다. 기존 배당금 외에 최신 설계를 적용한 함대를 무상으로 보내드리니 검토 후 시험해 보시기 바랍니다. 나중에 후기를 들려주시면 감사하겠습니다!"
 EaC_civic_mechanic_events.2020.desc:0 "존경하는 후원자님, 최근 평화 유지 작전에서 여러 해적 집단을 와해시켜 막대한 양의 자원과 기술 데이터, 함선을 입수했습니다. 마땅히 드려야 할 배당금 외에, 회수한 자원과 기술 데이터, 함선 대부분을 함께 보내드립니다."
 EaC_civic_mechanic_events.2025.desc:0 "존경하는 후원자님, 현재 저희 회사 사정이 어렵습니다. 다수의 민간 고객을 잃었을 뿐만 아니라, 다른 여러 사업이 실패로 끝나 막대한 손실을 입었습니다. 현재 전체적인 비용을 감축하기 위한 구조 조정 계획을 수립 중이며, 일부 직원도 해고할 예정입니다.\n\n다만 배당금 지급을 위해 부단히 노력 중이니 안심하시기 바랍니다. 지금은 상황이 어렵지만 금방 지나갈 것입니다."
 EaC_civic_mechanic_events.2025.a:0 "실망이군요."
 EaC_civic_mechanic_events.2025.b:0 "당신은 해고입니다. 퇴직금은 이사회에서 알아보세요."
 EaC_civic_mechanic_events.2025.c:0 "저희가 도와드리죠."
 EaC_civic_mechanic_events.2040.desc:0 "기술을 공유해 주시겠다는 말씀입니까? 저희를 믿어주시다니 영광입니다, 후원자님. 저희 연구 개발 부서가 최첨단 기술을 연구하기 위해 부단히 노력하고 있지만, 후원자님만큼의 자원을 동원하는 것은 도저히 불가능합니다. 후원자님께서 나누어 주시는 지식은 가장 윤리적인 방식으로 저희 사업을 개발하는 데 쓰겠습니다!"
 EaC_civic_mechanic_events.2040.a.tt:0 "이 엔클레이브와 §Y기술§!을 공유합니다. 기술은 §Y10년§!마다 한 번만 공유할 수 있습니다."
 EaC_civic_mechanic_events.2050.name:0 "거절해서는 안 될 거래"
 EaC_civic_mechanic_events.2050.desc:0 "[mercenary_enclave_country.GetName]에서 긴급 통신이 들어왔습니다. [khan_country.GetName]에서 자신들에게 거절할 수 없는 제안을 해 왔다는 것입니다. 제안을 거절하려면 두 달 안에 다른 고용주를 찾아야 합니다. 고용주를 찾지 못하면, 이들은 칸을 섬기게 되어 우리를 상대로 전면전을 벌일 수밖에 없습니다."
 EaC_civic_mechanic_events.2050.a:0 "[mercenary_enclave_country.GetName]에 연락을 취하세요."
 EaC_civic_mechanic_events.2050.a.tt:0 "이들을 고용할지 말지 £time£ §Y60일§! 안에 결정해야 합니다."
 EaC_civic_mechanic_events.2050.b:0 "당장은 고용할 여력이 없습니다. 다음을 기약합시다."
 EaC_civic_mechanic_events.2050.b.tt:0 "이들을 고용할지 말지 £time£ §Y7일§! 안에 결정해야 합니다."
 EaC_civic_mechanic_events.2050.c:0 "이 배신자들! 탐욕에 눈멀어 몰락하고 말지어다."
 EaC_civic_mechanic_events.2.name:0 "[Root.GetName]의 매수된 공무원"
 EaC_civic_mechanic_events.2.desc:0 "현재 제국 내에서 [fleet.GetName]의 독립 §Y해적 엔클레이브§! 전환 여부를 두고 논의가 벌어지고 있습니다. 함대 지휘부가 처음 제안한 이 방안을 채택한다면, 우리는 해당 함대의 지휘권을 잃게 되며, 함대에 막대한 §Y에너지 크레딧§!과 §Y합금§!을 제공할 책임을 지게 됩니다. 그 대신 해적 선장은 우리에게 충성을 맹세할 것이며, 정기적으로 배당금을 얻고 여러 특권도 누릴 수 있습니다.\n\n함대 지휘부는 앞으로 어려움이 닥칠 때 우리 제국을 위해, 그리고 제국의 돈을 위해 항상 싸울 준비를 갖추겠다고 장담하고 있습니다."
 EaC_civic_mechanic_events.2.desc.criminal_heritage:0 "현재 제국 내에서 [fleet.GetName]의 독립 §Y해적 엔클레이브§! 전환 여부를 두고 논의가 벌어지고 있습니다. 함대 지휘부가 처음 제안한 이 방안을 채택한다면, 우리는 해당 함대의 지휘권을 잃게 되며, 함대에 막대한 §Y에너지 크레딧§!과 §Y합금§!을 제공할 책임을 지게 됩니다. 그 대신 해적 선장은 우리에게 충성을 맹세할 것이며, 정기적으로 배당금을 얻고 여러 특권도 누릴 수 있습니다.\n\n함대 지휘부는 앞으로 어려움이 닥칠 때 우리 제국을 위해, 그리고 제국의 돈을 위해 항상 싸울 준비를 갖추겠다고 장담하고 있습니다."
 EaC_civic_mechanic_events.2.tooltip.a:0 "함대에 사령관이 필요합니다."
 EaC_civic_mechanic_events.2.tooltip.aa:0 "함대에 사령관이 있습니다."
 EaC_civic_mechanic_events.2.tooltip.cloak:0 "이 함대에 은폐 능력을 갖춘 함선이 있으면 안 됩니다."
 EaC_civic_mechanic_events.2.tooltip.b:0 "이미 이곳에 엔클레이브가 있습니다."
 EaC_civic_mechanic_events.2.tooltip.bb:0 "성계에 다른 엔클레이브가 없습니다."
 EaC_civic_mechanic_events.2.tooltip.c:0 "우리가 지배하는 성계여야 합니다."
 EaC_civic_mechanic_events.2.tooltip.cc:0 "우리가 지배하는 성계입니다."
 EaC_civic_mechanic_events.2.tooltip.d:0 "남은 용병 수용력이 없습니다."
 EaC_civic_mechanic_events.2.tooltip.dd:0 "남은 용병 수용력이 있습니다."
 EaC_civic_mechanic_events.2.tooltip.e:0 "성계에 소행성 또는 위성이 있어야 합니다."
 EaC_civic_mechanic_events.2.tooltip.ee:0 "성계에 소행성 또는 위성이 있습니다."
 EaC_civic_mechanic_events.2.tooltip.f:0 "이 함대의 소유자여야 합니다."
 EaC_civic_mechanic_events.2.a:0 "이 문제를 해결해야 합니다."
 EaC_civic_mechanic_events.2.a.criminal_heritage:0 "돈이 되는 사업이지. '유료 보호' 말이야."
 EaC_civic_mechanic_events.2.a.vassal.tooltip:0 "§Y해적 속국 엔클레이브§!를 설립하여 성계 내 §H범죄자 직업§!이 대신 §G소량의§! £trade_value£를 생산하게 합니다."
 EaC_civic_mechanic_events.2.a.nomadic.tooltip:0 "§Y유목 해적 속국§!을 설립합니다. 이 속국은 §Y지사§!를 세워 §H범죄자 직업§!이 대신 £trade_value£를 §G소량 생산§!하게 만듭니다."
 EaC_civic_mechanic_events.2.a.tooltip:0 "§Y해적 엔클레이브§!를 창설하여 성계 내 §H범죄자 직업§!이 대신 £trade_value£를 §G소량 생산§!하게 합니다."
 EaC_civic_mechanic_events.25:0 "해적 엔클레이브 파괴"
 EaC_civic_mechanic_events.25.desc:0 "우리 함대가 [merc_system.GetName]에 있는 해적 집단의 방어를 뚫고 이들의 기지를 파괴했습니다. 그러자 [FROM.GetName](은)는 빠르게 함락되었고, 잔존 함대는 와해되었습니다. 살아남은 일부 선장이 조직적이지 않은 해적으로 돌아설 가능성이 있지만, 나머지 선장들은 군수 지원이나 우주 기지 주둔 등 소소한 계약을 계속 이행하겠다는 계획을 밝혔습니다. 그러나 이런 사소한 일은 그다지 중요하지 않습니다. 중요한 점은 해적 엔클레이브가 사라졌으며, 그 잔해로부터 많은 자원을 회수할 수 있었다는 것입니다."
 EaC_civic_mechanic_events.26.desc:0 "[merc_system.GetName]에 위치한 해적 엔클레이브가 [mercenary_destroyer.GetName]에 의해 파괴되었다는 소식이 들어왔습니다. 엔클레이브를 침공한 병력은 [FROM.GetName] 스스로 감당할 수 없을 만큼 강했고, 이사회, 병영, 조선소가 위치한 해적 기지 또한 파괴되었으며, 사략 함대도 얼마 안 가 와해되었습니다. 각 선장이 제 갈 길을 모색해야 하는 상황에서, 일부 대표는 비록 해적 기지가 해체되었더라도 회사가 맺은 군수 및 항성 기지 주둔 계약을 가능한 한 이행하겠다는 입장을 밝혔습니다."
 EaC_civic_mechanic_events.26.a:0 "반드시 대가를 치르게 하겠습니다."
 EaC_civic_mechanic_events.27:0 "긴급 함대 회수"
 EaC_civic_mechanic_events.27.desc:0 "어이, 이 못된 놈들아!\n\n우리 은신처가 공격받고 있다. 해적의 충성은 결국 자기 자신에게 향하는 법이지! 잘들 지내라. 이 통지가 도착하는 즉시 우리 함대는 너희의 지휘를 떠날 것이다. 이 싸움이 끝나면 보호 협정을 다시 맺을 수 있겠지."
 EaC_civic_mechanic_events.27.a:0 "행운을 빕니다."
 EaC_civic_mechanic_events.27.b:0 "말도 안 돼! 배신자 해적 놈들!"
 EaC_civic_mechanic_events.28:0 "평화 협정"
 EaC_civic_mechanic_events.28.desc:0 "어이, [Root.GetName]. 자네들이 배신한 지도 일 년이 지났군. 우리 [mercenary_enclave_country.GetName]은 지난 일은 묻어 둘 준비가 됐어. 사냥감이 없으면 보수도 없다지만, 의리 있는 동료끼리는 다르잖나... 그렇지 않소, [ROOT.GetRulerTitle] [ROOT.GetLeaderName]? 사과와 함께 성의 표시로 금화를 적당히 담은 궤짝을 보내 주면 이번 수작은 눈감아 주겠소."
 EaC_civic_mechanic_events.28.a:0 "해적 주제에. 죽어서 썩어버려라."
 EaC_civic_mechanic_events.28.b:0 "좋습니다."
 EaC_civic_mechanic_events.205.name:0 "[mercenary_enclave_country.GetName]"
 EaC_civic_mechanic_events.205.desc:0 "어서 오시오, 동무들! [mercenary_enclave_country.GetName]은 암시장 물품을 비롯해 고객 여러분께 각종 사략 서비스를 제공하고 있소.\n\n마음에 드는 고객에게는 함대와 지상군, 군사 고문까지 내어 드리지... 물론 금화 상자는 적당히 채워 주셔야겠지만."
 EaC_civic_mechanic_events.205.desc.hostile:0 "아, 뭍사람이 돌아왔군.\n\n이제야 정신을 차렸나, 이 못된 놈들아? 우리에게 자비는 없다. 그래도 성의 표시와 함께 금고에서 돈을 조금 꺼내 준다면, [mercenary_enclave_country.GetName]의 선장은 이번 수작을 눈감아 줄 의향이 있지. 함께 돈을 쓸어 담을 사략 사업의 앞날을 기약해 보자고."
 EaC_civic_mechanic_events.205.desc.unfriendly:0 "어이! 네놈들에게 사략 서비스를 제공할 생각은 없다. 차가운 우주를 무덤으로 삼게 해 주마!"
 EaC_civic_mechanic_events.205.a:0 "§Y사략 함대를 임대§!하고 싶습니다."
 EaC_civic_mechanic_events.205.tooltip.a:0 "이미 [current_client.GetName]에서 우리 사략 함대를 임대하고 있습니다."
 EaC_civic_mechanic_events.205.tooltip.b:0 "임대할 수 있는 사략 함대가 없습니다."
 EaC_civic_mechanic_events.205.b:0 "임대한 사략 함대를 §Y관리§!하고 싶습니다."
 EaC_civic_mechanic_events.205.c:0 "§Y해적 주둔군§! 창설에 관심이 있습니다."
 EaC_civic_mechanic_events.205.d:0 "§Y더 큰 사략 함대§!를 운용할 수 있도록 돕고 싶습니다."
 EaC_civic_mechanic_events.205.d.timeout:0 "엔클레이브가 새로운 장교와 승조원을 모집하고 있습니다. §Y[mercenary_enclave_country.upgraded_station_timer]§! 이후에야 추가적인 군수 개선이 가능합니다."
 EaC_civic_mechanic_events.205.e:0 "막강한 적에 대한 §Y전술적 통찰§!을 얻고자 합니다."
 EaC_civic_mechanic_events.205.f:0 "§Y지상군§!을 고용하고 싶습니다."
 EaC_civic_mechanic_events.205.g:0 "§Y군수 솔루션§!은 무엇이 있습니까?"
 EaC_civic_mechanic_events.205.g.tooltip:0 "우리 제국은 이미 §Y군수 지원§!을 받고 있습니다."
 EaC_civic_mechanic_events.205.h:0 "§Y후원자§!로서, 그대들의 방침을 재고하길 바라오."
 EaC_civic_mechanic_events.205.i:0 "그러도록 하죠."
 EaC_civic_mechanic_events.205.j:0 "내가 그대들의 §Y해적 군주§!다. 내 요구에 따라야 한다."
 EaC_civic_mechanic_events.205.k:0 "선장한테 §Y[ROOT.GetRulerTitle]§!이(가) 왔다고 전하세요."
 EaC_civic_mechanic_events.mercenary_tt_hirefleet:0 "이 엔클레이브의 §Y사략 함대§!를 10년 동안 지휘합니다."
 EaC_civic_mechanic_events.mercenary_tt_managefleet:0 "§Y사략 함대§! 계약을 취소하거나 연장합니다."
 EaC_civic_mechanic_events.mercenary_tt_logistic:0 "사략선원들이 보급선을 지원하게 하고 §Y함대 수용력§!을 증가시킵니다."
 EaC_civic_mechanic_events.210.desc:0 "탁월한 선택이십니다! [mercenary_enclave_country.GetName] 사략 함대를 고용하면 절대로 후회하실 일이 없습니다. 저희 병력은 은하계 최고 수준의 훈련과 군기를 자랑하며, 최첨단 기술과 장비를 사용합니다. 해적, 반란 분자, 폭도 등, 고객님께서 원하시는 상대가 누구든 얼마 안 가 고객님 앞에 머리를 숙이게 될 겁니다.\n\n또한 저희 함대마다 여러 전투에서 능력이 입증된 사령관을 추가 요금 없이 이용하실 수 있습니다. 성간 전쟁의 모든 면에 통달한 이 사령관들이 고객님의 군대를 승리로 이끌 것입니다."
 EaC_civic_mechanic_events.211.desc:0 "새로 고용한 사략 함대를 훌륭하게 활용하시리라 믿습니다. 경쟁국들도 곧 고객님의 제국을 두려워하게 될 겁니다!"
 EaC_civic_mechanic_events.215.desc:0 "사냥감이 없으면 보수도 없는 법.\n\n우리 사략선들은 몸이 근질거려 습격할 기회만 기다리고 있소. 동업할 생각이라면 선장이 협상에 응할 준비가 되어 있지."
 EaC_civic_mechanic_events.215.a:0 "다른 일을 문의하고 싶습니다."
 EaC_civic_mechanic_events.215.b:0 "계약을 연장하고 싶습니다."
 EaC_civic_mechanic_events.215.c:0 "계약을 해지하고 싶습니다."
 EaC_civic_mechanic_events.220.desc:0 "[mercenary_enclave_country.GetName]의 사략 주둔군은 허가받지 않은 해적단을 소탕하는 데 아주 능숙합니다. 이 바닥에서 영향력이 상당하다고 할 수 있지요. 파견된 전문가들은 현장 인력이 능력을 최대한 발휘할 수 있도록 훈련을 시작할 겁니다.\n\n저희 [mercenary_enclave_country.GetName]에서는 정예 평화 유지 인력 양성을 목표로 합니다."
 EaC_civic_mechanic_events.225.desc:0 "전리품은 수익성이 좋습니다. 또 다른 습격에 저희를 고용하고 싶으시다면 부디 알려주시길 바랍니다."
 EaC_civic_mechanic_events.235.1.desc:0 "이 자금이 있으면 사업 규모를 크게 키울 수 있습니다. 더 많은 함선과 병력, 그리고 더 크고 훌륭한 훈련 시설까지... 물론 더 많은 독주도 말이죠!"
 EaC_civic_mechanic_events.235.2.desc:0 "끊임없이 변화하는 냉혹한 은하에서는 해적 행위가 무엇보다 중요합니다. 여러분의 기부로 저희 사업과 서비스를 확대할 수 있습니다! 물론 우리 충실한 육지 친구들은 피해서 말이지요!"
 EaC_civic_mechanic_events.235.3.desc:0 "상상해 보십시오. 은하계 전역에서 견제가 필요한 민간 및 군사 활동을 습격하는 [mercenary_enclave_country.GetName]... 그 덕분에 여러분은 전례 없는 안보를 누리게 되겠지요..."
 EaC_civic_mechanic_events.235.4.desc:0 "저희가 사업을 시작할 무렵, 저희 해적 군주께서는 해적 행위를 생산적인 방향으로 전환한다는 꿈을 지니고 계셨습니다. 오늘, 그 목표가 드디어 가시권에 들어왔다는 것을 기쁜 마음으로 알려드립니다."
 EaC_civic_mechanic_events.235.5.desc:0 "은하 최대의 함대를 출격시킬 것이오! 금고는 넘쳐나고, 국가들은 우리 보호를 받으려고 다투겠지... 이 소식을 들으실 해적 군주의 표정이 벌써 눈에 선하군!"
 EaC_civic_mechanic_events.240.desc:0 "그렇습니다. 확실히 지금은 우려스러운 시기입니다. 저희 밀수업자들이 새로운 위협의 출현을 모니터링하기 위해 큰 위험을 감수했습니다. 유용한 정보를 제공해 드릴 수 있겠군요..."
 EaC_civic_mechanic_events.240.a:0 "위대한 칸."
 EaC_civic_mechanic_events.240.b:0 "회색 폭풍"
 EaC_civic_mechanic_events.240.c:0 "프레소린 무리"
 EaC_civic_mechanic_events.240.d:0 "타 차원의 침공자"
 EaC_civic_mechanic_events.240.e:0 "컨틴전시 AI"
 EaC_civic_mechanic_events.240.f:0 "세타나"
 EaC_civic_mechanic_events.245.desc:0 "칸의 함선은 뚜렷한 약점 없이 전반적으로 균형 잡힌 구성을 갖추고 있습니다. 저희 밀수업자들은 어뢰로 함선을 격침하는 것이 효과적일 수 있다고 보고하지만, 방어 수단을 한 종류에만 의존하지 말라고 조언합니다. 함선을 지키려면 보호막과 장갑을 함께 사용하는 것이 최선일 것입니다. 칸은 지극히 유능한 지휘관임을 입증했으며, 과소평가한다면 끔찍한 대가를 치를 것입니다. 칸의 친위 함대는 극도로 위험합니다."
 EaC_civic_mechanic_events.250.desc:0 "회색 폭풍은 에너지 광선과 함재기라는 두 가지 유형의 상호 보완적인 무기를 사용합니다. 광선은 보호막으로 대응할 수 있지만, 함재기는 보호막을 우회할 수 있습니다. 예측 결과, 보호막과 거점 방어 장치를 같이 활용하는 함선이라면 생존 가능성이 훨씬 높은 것으로 나타났습니다. 또한 나노머신 함선은 방어력이 출중하지만, 어뢰를 이용해 방어를 뚫을 수 있을 것입니다."
 EaC_civic_mechanic_events.255.desc:0 "프레소린 함대는 탄속이 느린 투사체와 다수의 소형 함선을 이용해 적을 쓰러뜨립니다. 프레소린을 막는 방법은 장갑 및 거점 방어 장치를 활용하고 선체의 내구력을 개선시키는 것입니다. 초장거리에서 공격하는 것 또한 방법이 될 수 있습니다. 충분한 위력의 에너지형 무기만 있다면, 아군이 프레소린의 사정거리에 들어오기도 전에 적을 격파할 수 있을 것입니다."
 EaC_civic_mechanic_events.260.desc:0 "언비든의 경우, 에너지에 크게 의존한다는 약점을 노릴 수 있습니다. 언비든의 보호막에 추가 피해를 입히는 무기가 있다면 엄청난 위력을 발휘할 것입니다. 특히 보호막을 완전히 무시하는 무기를 탑재한다면, 언비든을 빠르게 우리 차원에서 쫓아 버릴 수 있습니다. 방어 면에서는, 언비든의 에너지 광선에 적절히 대응하기 위한 보호막을 갖추실 것을 제안드립니다."
 EaC_civic_mechanic_events.265.desc:0 "컨틴전시 함선은 에너지형 무기만 사용하기 때문에 피해를 줄이려면 보호막을 이용하는 것이 가장 좋습니다. 모의 분석 결과를 살펴보면, 이들은 견고한 방어를 갖추고 있지만 선체 자체는 그에 비해 비교적 취약하다고 합니다. 저희 밀수업자들은 관통형 무기가 아주 효과적일 것으로 예측하고 있습니다."
 EaC_civic_mechanic_events.266.desc:0 "세타나의 함선은 사거리가 길고 피해량이 높은 에너지형 무기와 튼튼한 재생 장갑을 사용합니다. 대형 목표를 쓰러뜨리는 데 특화되었기 때문에 소형 함선 무리로 여러 차례에 걸쳐 공격하는 것을 추천드립니다. 세타나의 함대를 상대하기에는 어뢰나 에너지형 무기가 적합하며, 여러분의 함선에 보호막을 적용하면 함선의 생존 시간을 조금이나마 늘릴 수 있을 겁니다."
 EaC_civic_mechanic_events.270.desc:0 "식민지를 진압하거나 눈엣가시를 뿌리 뽑고 싶으십니까? 저희 지상 사략 서비스에서는 까다롭고 위험한 환경에도 투입할 수 있는 숙련된 해적 중대를 제공합니다."
 EaC_civic_mechanic_events.270.a:0 "소규모 해적 부대"
 EaC_civic_mechanic_events.small_merc_army_hire:0 "이 해적들은 무기한으로 고용되지만, 유지비가 높습니다. §Y5개의 해적 지상군§!이 포함됩니다. "
 EaC_civic_mechanic_events.270.b:0 "소규모 정예 기계화 해적 부대"
 EaC_civic_mechanic_events.small_mecha_merc_army_hire:0 "이 해적들은 무기한으로 고용되지만, 유지비가 높습니다. §Y5개의 기계화 해적 지상군§!이 포함됩니다. "
 EaC_civic_mechanic_events.270.c:0 "상당한 규모의 사략선원 부대"
 EaC_civic_mechanic_events.medium_merc_army_hire:0 "이 해적들은 무기한으로 고용되지만, 유지비가 높습니다. §Y10개의 해적 지상군§!이 포함됩니다. "
 EaC_civic_mechanic_events.270.d:0 "정예 기계화 해적 타격대"
 EaC_civic_mechanic_events.medium_mecha_merc_army_hire:0 "이 해적들은 무기한으로 고용되지만, 유지비가 높습니다. §Y10개의 기계화 해적 지상군§!이 포함됩니다. "
 EaC_civic_mechanic_events.270.e:0 "대규모 해적 소대"
 EaC_civic_mechanic_events.large_merc_army_hire:0 "이 해적들은 무기한으로 고용되지만, 유지비가 높습니다. §Y15개의 해적 지상군§!이 포함됩니다. "
 EaC_civic_mechanic_events.280.a.desc:0 "친애하는 후원자님! 어쩐 일로 오셨습니까? 저희 최신형 함선의 도면은 보셨나요? 저희가 민간 고객님들을 대상으로 새로 제공하는 '사략 경호' 상품의 핵심이 될 함선입니다."
 EaC_civic_mechanic_events.280.b.desc:0 "모시게 되어 기쁩니다! 선장을 불러오는 동안 준비한 다과를 즐겨 주시지요."
 EaC_civic_mechanic_events.280.c.desc:0 "후원자 여러분을 뵙는 일은 저희에게 언제나 큰 기쁨이지요. 다음 배당금은 곧 지급될 예정이니 걱정은 안 하셔도 됩니다. 그런데 이번에 저희가 새로 도입한 고위험 보호 서비스는 어떻게 생각하십니까? 저희 민간인 고객들이 아주 좋아할 것 같거든요!"
 EaC_civic_mechanic_events.280.d.desc:0 "[ROOT.GetRulerTitle] [ROOT.GetLeaderName], 만나 뵙게 되어 기쁩니다! 이곳 해적 선장을 불러오는 동안 드실 다과를 준비했으니, 괜찮으시다면 맛보시지요.\n\n§W선장이 [ROOT.GetName]에 보이는 충성심은§! §G높음§! §W수준입니다.§!"
 EaC_civic_mechanic_events.280.e.desc:0 "[ROOT.GetRulerTitle] [ROOT.GetLeaderName] 님을 모시게 되어 영광입니다! 지역 해적 선장을 부르는 동안 준비한 다과를 즐겨 주시기 바랍니다.\n\n§W[ROOT.GetName]에 대한 선장의 충성심은§! §l신뢰함§! §W상태입니다.§!"
 EaC_civic_mechanic_events.280.f.desc:0 "[ROOT.GetRulerTitle] [ROOT.GetLeaderName] 님을 모시게 되어 기쁩니다! 현지 해적 선장을 불러오는 동안 준비한 다과를 즐겨 주시지요.\n\n§W선장은 [ROOT.GetName]에§! §P불신§!§W을 품고 있습니다.§!"
 EaC_civic_mechanic_events.280.g.desc:0 "[ROOT.GetRulerTitle] [ROOT.GetLeaderName], 만나 뵙게 되어 기쁩니다! 이곳 해적 선장을 불러오는 동안 드실 다과를 준비했으니, 괜찮으시다면 맛보시지요.\n\n§W선장은 [ROOT.GetName]에§! §R반역§!§W을 꾀하고 있습니다.§!"
 EaC_civic_mechanic_events.280.b:0 "함대 §Y회수§!를 요청하고 싶습니다."
 EaC_civic_mechanic_events.280.c:0 "저희 §Y기술§!을 공유하고자 합니다."
 EaC_civic_mechanic_events.280.c.timeout:0 "엔클레이브가 아직 우리 기술을 도입하고 있습니다. §Y[mercenary_enclave_country.updating_databanks_timer]§! 이후에 새로운 기술을 공유할 수 있습니다."
 EaC_civic_mechanic_events.285.desc:0 "함대 회수는 민감한 문제라는 점은 아시리라 믿습니다. 물론 표준 약관에 회수에 필요한 장치를 심어 놓기는 했습니다만, 함대를 회수하려면 적어도 6개월은 필요합니다. 그리고... 함대를 대여한 고객 여러분께서 심기가 불편하시지 않도록 후한 보상도 드려야 하죠.\n\n저희 조직의 이익에 부합하는 조치는 아니지만, 후원자님께서 원하신 사항이니... 그대로 이행하도록 하겠습니다."
 EaC_civic_mechanic_events.285.tooltip:0 "엔클레이브의 반감을 얻습니다."
 EaC_civic_mechanic_events.290.name:0 "징발 함대 도착"
 EaC_civic_mechanic_events.290.desc:0 "우리가 엔클레이브에서 징발한 사략 함대가 명령을 기다리고 있습니다."
 EaC_civic_mechanic_events.294.name:0 "해지 통지"
 EaC_civic_mechanic_events.294.desc:0 "친애하는 뭍사람 귀하,\n\n계약 조항 285b.15에 따라, 유감스럽게도 계약을 조기 해지하고 귀국이 임대한 사략 함대를 회수하게 되었습니다. 계약에 명시된 대로 함대가 귀국의 지휘를 떠나기 3개월 전에 이 사실을 통지합니다. 귀국에 지급할 넉넉한 보상금을 동봉합니다.\n\n불편을 끼쳐 죄송하며, 앞으로 하시는 일에 행운이 따르기를 바랍니다."
 EaC_civic_mechanic_events.294.b:0 "우린 그 함대가 필요하다고요!"
 EaC_civic_mechanic_events.2030.desc:0 "저희 군수 지원 서비스는 고객 여러분이 은하계 끝까지 함대를 파견할 수 있도록 도와드립니다. 전담 전문가가 여러분의 함선에 탄약부터 식량, 그리고 온도 조절기 볼트 하나까지 필요한 모든 것이 마련되도록 조치를 취할 것입니다. 또한 함대 파견에 앞서 보급소를 설치하거나 현지 민간 기업과의 공급 계약을 알선할 것입니다. 고객 여러분의 함선에 어울리는 최상의 서비스, 저희가 제공해 드립니다."
 EaC_civic_mechanic_events.2035.name:0 "군수 지원 계약 만료"
 EaC_civic_mechanic_events.2035.desc:0 "친애하는 뭍사람 귀하,\n\n귀국에 제공해 드리고 있는 군수 지원 서비스 갱신 일자가 임박했습니다. 계약 내용에 따라, 갱신 거부 의사를 지체 없이 밝히시지 않는 경우 서비스가 자동으로 갱신되어 요금이 청구됩니다.\n\n당사의 서비스에 분명히 만족하고 계시리라 믿으며, 앞으로도 더 많은 서비스로 모실 수 있기를 기대합니다!"
 EaC_civic_mechanic_events.2035.a:0 "지금은 군수 서비스가 필요 없습니다."
 EaC_civic_mechanic_events.2060.name:0 "함대 계약 만료"
 EaC_civic_mechanic_events.2060.desc:0 "[mercenary_enclave_country.GetName] 측과 체결한 계약이 만료되어 함대가 곧 철수합니다. 연락해서 계약을 갱신하시겠습니까?"
 EaC_civic_mechanic_events.2060.a:0 "다음에 합시다."
 EaC_civic_mechanic_events.2060.b:0 "네. 통신 연결하세요."
 EaC_operation_establish_underground_railroad:0 "지하 탈출로 구축"
 EaC_operation_establish_underground_railroad_desc:0 "우리 공작원들이 §Y[This.Target.GetName]§!의 여러 행성에 관한 정보를 수집하고, 작업이 끝나면 §Y정보§! 보고서를 전달할 것입니다. 또한 안전 가옥을 마련해 현지 주민들이 억압에서 탈출할 길을 열어 줄 것입니다. 이를 통해 장기간 §Y최대 침투 수준§!이 증가합니다.\n\n이 작전에 §Y자산§!을 배정하면 결과가 해당 자산의 관심 분야에 치우칠 수 있습니다."
 EaC_operation_establish_underground_railroad_no_dlc_desc:0 "우리 공작원들이 §Y[This.Target.GetName]§! 내부의 여러 행성에 관한 정보를 수집하고, 완료되면 §Y정보§! 보고서를 제출합니다. 또한 안전 가옥을 마련해 현지 주민들이 억압에서 벗어날 길을 제공합니다. 오랫동안 §Y최대 침투 수준§!이 증가합니다."
 EaC_operation_establish_underground_railroad_on_success:0 "$IF_SUCCESSFUL|E$\n[root.target.GetName]에 대한 정보와 최대 침투 수준이 증가합니다."
 EaC_operation_establish_underground_railroad_10:0 "$EaC_operation_complete_establish_underground_railroad$"
 EaC_operation_establish_underground_railroad_20:0 "$EaC_operation_complete_establish_underground_railroad$"
 EaC_operation_establish_underground_railroad_30:0 "$EaC_operation_complete_establish_underground_railroad$"
 EaC_operation_establish_underground_railroad_40:0 "$EaC_operation_complete_establish_underground_railroad$"
 EaC_operation_complete_establish_underground_railroad:0 "지하 탈출로 구축"
 EaC_operation_complete_establish_underground_railroad_modifier:0 "지하 탈출로"
 EaC_operation_complete_establish_underground_railroad_modifier_desc:0 "§Y급진적인 제국§!이 우리 제국에 §R지하 탈출로§!를 구축했습니다! £socialism£ 및 £egalitarian£ 사상이 확산되면 하층민 사이에서 혁명이 일어날 위험이 있습니다."
 EaC_operation.1000.desc:0 "우리 공작원들이 [FROM.GetName]의 국경 안에 안전 가옥을 마련하고 위치가 자세히 담긴 서류를 보내왔습니다."
 EaC_operation.1000.a:0 "자유로 향하는 길이 마련되었다."
 BRANCH_OFFICE_NO_UNDERGROUND_RAILROAD:0 "§R첩보장이§! §Y[OWNER.GetName]§! §R내에서§! §H$EaC_operation_establish_underground_railroad$§! §R작전을 수행해야 지사를 설립할 수 있습니다.§!"
 EaC_labor_movements:0 "노동 운동"
 EaC_labor_movements_desc:0 "이 행성의 노동 인구는 분권화된 정부와 생산 수단의 민주적 소유라는 급진적인 사상의 영향을 받았습니다."
 EaC_underground_railroad_activity:0 "지하 탈출로"
 EaC_underground_railroad_activity_desc:0 "행성의 표면 곳곳에 숨겨진 네트워크가 존재하여 노예들이 행성 밖으로 탈출할 수 있습니다."
 EaC_underground_railroad_smuggling:0 "노예 해방 운동"
 EaC_inspired_slave_resistance:0 "노예 저항 고취"
 EaC_inspired_slave_resistance_desc:0 "[ROOT.GetNAME]의 지하 탈출로 조직에서 성공적인 노예 탈출 사례를 알리는 선전물을 배포하고 있습니다. 이 행성의 노예들은 해방이 임박했다고 여기며 정부에 적대적인 태도를 보이고 있습니다."
 EaC_underground_railroad_conductor_arrested:0 "지하 탈출로 안내자 체포"
 EaC_slave_revolts:0 "노예 반란"
 EaC_slave_revolts_desc:0 "[ROOT.GetName]에서 자유를 쟁취하기 위한 노예 반란이 일어났습니다. 노예제 폐지를 주장하는 이들은 저항군에 합류할 것입니다."
 EaC_underground_railroad_expanded:0 "지하 탈출로 확장"
 EaC_underground_railroad_expanded_desc:0 "지하 탈출로망이 행성의 외곽 지대까지 확장되었으며, 노예들이 외부로 탈출할 수 있는 안전가옥이 점재해 있습니다."
 EaC_slave_resistance:0 "노예 저항"
 EaC_slave_resistance_desc:0 "노예들은 해방을 위해 더 폭력적인 방법을 택하도록 자극을 받았습니다. 이들이 잃을 것은 쇠사슬뿐입니다."
 EaC_worker_commune:0 "노동자 공동체"
 EaC_worker_commune_desc:0 "이 행성의 노동자들은 차별을 바로잡기 위해 자립적인 자치 구역을 개발할 만큼 충분한 자산을 장악했습니다."
 EaC_labor_propaganda:0 "노동 선전"
 EaC_labor_propaganda_desc:0 "이 행성에서 일어난 노동 운동이 행성 전체로 총파업을 확산하기 위해 선전을 강화하고 있습니다."
 EaC_administration_strikes:0 "행정 파업"
 EaC_administration_strikes_desc:0 "행정 지도자들이 지역 노동 운동과 연대하기 위해 파업에 들어갔습니다."
 EaC_worker_commune_means_of_production:0 "생산 수단 장악"
 EaC_worker_commune_means_of_production_desc:0 "노동자들이 행성의 대부분의 산업과 정부 기반 시설을 장악하고 자원을 분배하여 모든 사람이 끼니를 거르지 않도록 하고 있습니다."
 EaC_planet_general_strike_flag_tooltip:0 "§R이를 선택하면§! §Y총파업§!§R이 발생합니다!§!"
 EaC_civic_mechanic_events.1.name:0 "[Root.GetName] 실업률 증가"
 EaC_civic_mechanic_events.1.desc:0 "§H[Root.GetName]§!에서 실업과 빈곤이 놀라운 속도로 확산되고 있습니다. 불만을 품은 주민들은 혼란 속에서 더 나은 권리를 확보하고자 §R노동 조직화§!에 나섰습니다. 이들은 열악한 경제적 여건이 범죄의 주요 원인이라고 주장합니다. 빈곤이 낳은 범죄를 극복하려면 주민들에게 기본 생활에 필요한 것을 제공해야 한다는 것입니다.\n\n그러나 이 참담한 상황을 악용하려는 자들도 있습니다. 현지 §R범죄 조직§!에는 손쉬운 표적과 절박한 신규 조직원이 넘쳐납니다.\n\n임시방편으로 [Root.GetPlanetMoon]의 실업 급여를 확대할 수 있습니다. 비용은 많이 들겠지만, 일자리를 늘리거나 피해를 입은 주민 집단의 생활 수준을 높이는 등 더 근본적인 해결책을 찾을 시간을 벌 수 있습니다.\n\n아무 조치도 취하지 않을 수도 있지만, 그 경우 [Root.GetName]에 거대한 암흑가가 형성될 가능성이 높습니다."
 EaC_civic_mechanic_events.1.a:0 "실업 급여를 확대하세요."
 EaC_civic_mechanic_events.1.b:0 "불만을 품은 노동자와 범죄자 몇 명쯤은 문제도 아니다."
 EaC_civic_mechanic_events.2.desc.has_authoritarian_ethic:0 "최근에 발견한 증거에 따르면, §H[Root.GetName]§!의 정부 공무원 중 상당수가 뇌물을 받은 것으로 밝혀졌습니다. 현지 범죄 조직이 이들을 매수해 자신의 범죄 행각을 묵인하도록 한 것입니다. 일부 사례에서는 범죄 조직과 맞서 싸워야 할 공무원이 해당 조직 소속인 것으로 드러나기도 했습니다!\n\n해당 공무원 중 일부는 체포됐지만, 상당수는 이러한 혐의가 드러나자 퇴직했습니다. [Root.GetName]에 부패가 깊게 뿌리 박힌 듯합니다.\n\n이러한 혼란 속에서 조직된 노동 세력이 상황을 악용하고 있습니다. 사건 이후, 이들은 범죄를 조장하는 사회 경제적 문제를 해결할 새로운 지도부의 등장을 요구하고 있습니다.\n\n이 급진 세력이 더 이상 과격한 생각을 하지 않기를 바랄 뿐입니다..."
 EaC_civic_mechanic_events.2.desc.not_authoritarian_ethic:0 "최근에 발견한 증거에 따르면, §H[Root.GetName]§!의 정부 공무원 중 상당수가 뇌물을 받은 것으로 밝혀졌습니다. 현지 범죄 조직이 이들을 매수해 자신의 범죄 행각을 묵인하도록 한 것입니다. 일부 사례에서는 범죄 조직과 맞서 싸워야 할 공무원이 해당 조직 소속인 것으로 드러나기도 했습니다!\n\n해당 공무원 중 일부는 체포됐지만, 상당수는 이러한 혐의가 드러나자 퇴직했습니다. [Root.GetName]에 부패가 깊게 뿌리 박힌 듯합니다.\n\n이러한 혼란을 노동 지도자들이 지적하고 있습니다. 범죄와 결탁한 공무원들의 무책임한 행동을 목격한 이들은 범죄를 조장하는 사회 경제적 문제를 해결할 새로운 지도부의 등장을 요구하고 있습니다."
 EaC_civic_mechanic_events.2.b:0 "이 문제를 해결해야 합니다. 우리의 방식대로 말이죠."
 EaC_civic_mechanic_events.2.c:0 "노동 지도자들의 말을 들어봐야 할까요?"
 leader_trait_labor_advocate:0 "노동 옹호자"
 leader_trait_labor_advocate_desc:0 "이 지도자는 정부가 노동자 계급의 이익에 부합하도록 이끄는 능력이 탁월합니다."
 leader_trait_labor_advocate_tt:0 "§E스킬 레벨당 $PLANET_EFFECTS_TXT$:§!$TABBED_NEW_LINE$$mod_planet_jobs_unity_produces_mult$: §G+5%§!"
 EaC_civic_mechanic_events.3.name:0 "[Root.GetName]에서 약물 남용 증가"
 EaC_civic_mechanic_events.3.desc.has_private_healthcare:0 "최근 §H[Root.GetName]§!의 범죄가 증가하면서, 약물 남용 인구가 급격히 늘어났습니다. 이제 불법 마약 사용이 [Root.GetPlanetMoon]의 암흑가를 넘어, 사회 각계각층에 영향을 미치고 있습니다.\n\n노동 단체들은 정부가 약물 남용 피해자들이 민영 의료의 장벽 없이 도움을 받을 수 있도록 의료 서비스를 공공화할 것을 촉구하고 있습니다."
 EaC_civic_mechanic_events.3.desc.has_public_healthcare:0 "최근 §H[Root.GetName]§!의 범죄가 증가하면서, 약물 남용 인구가 급격히 늘어났습니다. 이제 불법 마약 사용이 [Root.GetPlanetMoon]의 암흑가를 넘어, 사회 각계각층에 영향을 미치고 있습니다.\n\n노동 단체들은 정부의 공공 의료 정책 덕분에 약물 남용 피해자들이 비용 부담 없이 도움을 받을 수 있을 것이라며 기대하고 있습니다."
 EaC_civic_mechanic_events.3.a:0 "걱정스러운 소식이군요."
 EaC_civic_mechanic_events.3.a.has_public_healthcare:0 "걱정스러운 소식이지만, 우리도 최선을 다하고 있습니다."
 EaC_civic_mechanic_events.3.b.has_private_healthcare:0 "무료 의료 서비스? 어떻게 수익을 낼 수 있을까요?"
 EaC_civic_mechanic_events.3.c.not_public_healthcare:0 "공공 의료로 전환해 이 급진 세력을 달래도록 하지."
 EaC_civic_mechanic_events.4.name:0 "[Root.GetName]에서 집행관과 파업 노동자 충돌"
 EaC_civic_mechanic_events.4.desc.not_anticrime_campaign:0 "§H[Root.GetName]§!에서 집행관과 파업 참가자들 간의 폭력적인 충돌로 인해 막대한 피해가 발생했습니다. 이는 행성 당국이 불법 작업 중단에 대한 단속을 강화한 후 벌어진 일입니다.\n\n파업 참가자들을 진압하기 위해 고군분투하는 집행관들이 파업을 신속히 끝내기 위한 반범죄 캠페인을 계획했습니다. 그러나 노동 운동가들은 이런 단속이 표현의 자유와 단체 교섭권을 침해한다고 주장하고 있습니다."
 EaC_civic_mechanic_events.4.desc.has_anticrime_campaign:0 "§H[Root.GetName]§!에서 군용 장비를 갖춘 집행관과 파업 참가자들 간의 폭력적인 충돌로 인해 막대한 피해가 발생했습니다. 이는 행성 당국이 불법 작업 중단에 대한 단속을 강화한 후 벌어진 일입니다.\n\n여전히 파업 참가자들을 진압하기 위해 고군분투하는 집행관들은 반범죄 캠페인이 파업을 더 빨리 끝낼 수 있을 것이라 주장하지만, 더 강한 무력이 필요할 것이라고 말합니다. 그러나 노동 운동가들은 이런 단속이 상황을 악화시킬 뿐이며, 사람들은 표현의 자유와 단체 교섭권을 지키기 위해 싸우는 것이라고 주장하고 있습니다."
 EaC_civic_mechanic_events.4.not_anticrime_campaign.a:0 "상황이 걷잡을 수 없군요! 집행관의 계획을 신속히 진행하세요!"
 EaC_civic_mechanic_events.4.not_anticrime_campaign.b:0 "상황이 걷잡을 수 없이 흘러가는군요. 집행관에게 책임이 있습니다!"
 EaC_civic_mechanic_events.4.has_anticrime_campaign.c:0 "책임자의 말대로 상황은 나아질 거다... 언젠가는."
 EaC_civic_mechanic_events.4.has_anticrime_campaign.d:0 "집행관들의 계획은 상황을 악화시킬 뿐이다. 범죄 소탕 운동을 중단하라!"
 EaC_civic_mechanic_events.5.name:0 "[Root.GetName]에서 지하 탈출로 발견"
 EaC_civic_mechanic_events.5.desc:0 "최근 §H[Root.GetName]§!에서 노예 해방 활동이 눈에 띄게 증가했습니다. 밀수업자들이 노예를 해방하는 무허가 우주항인 \"회색 항구\"가 [Root.GetPlanetMoon] 표면에 여러 곳 존재하는 것으로 추정됩니다.\n\n현지 당국은 불법 항구를 추적하고 있지만, 이를 찾아내기 전까지 노예들은 계속 [Root.GetPlanetMoon]을 거쳐 탈출하고 노예 인구는 줄어들 것입니다.\n\n이 노예 경제를 유지하려면 갈수록 더 많은 반체제 인사를 죽여야 합니다. 하지만... 노예제를 폐지한다면 막대한 단속 비용을 대폭 줄일 수 있을 것입니다."
 EaC_civic_mechanic_events.5.a:0 "우리 집행관들이 이 지하 탈출로를 차단할 것이다!"
 EaC_civic_mechanic_events.5.b:0 "통제를 유지하느라 이 고생을 할 가치는 없다. 노예제를 폐지하겠다."
 EaC_civic_mechanic_events.6.name:0 "[Root.GetName]의 도망 노예"
 EaC_civic_mechanic_events.6.desc:0 "§H[Root.GetName]§!에서 반노예제 활동이 계속되면서 최근 이 [Root.GetPlanetMoon]에서 노예를 해방하는 밀수업자들이 늘고 있습니다. 이번 노예 탈출은 지금까지 [Root.GetPlanetMoon]의 지하 탈출로가 영향을 미치지 못한다고 여겨졌던 주거 지역을 대상으로 이루어졌습니다."
 EaC_civic_mechanic_events.6.a:0 "노예들의 탈주 사태에 대처해야 한다."
 EaC_civic_mechanic_events.6.b:0 "노예제 폐지를 향한 첫걸음을 내디디면 이 상황을 해결할 수 있다."
 EaC_civic_mechanic_events.7.name:0 "[Root.GetName]에서 도망 노예 체포"
 EaC_civic_mechanic_events.7.desc:0 "익명의 제보를 받은 §H[Root.GetName]§!의 집행관들이 최근 [Root.GetPlanetMoon] 수도 외곽의 대형 창고를 급습했습니다. 안에는 식량과 물, 침구와 노예가 가득했으며, 지하 탈출로의 은신처임이 분명했습니다. 여러 명이 체포되었고, 압수한 노예들은 추후 활용을 위해 정부 냉동 보관소에 안전하게 수용되었습니다."
 EaC_civic_mechanic_events.7.a:0 "어떤 대가를 치르더라도 우리의 경제 체제를 유지하겠다!"
 EaC_civic_mechanic_events.7.b:0 "저 냉동 포드를 해동하라. 이제 노예 해방이 본격적으로 시작된다."
 EaC_civic_mechanic_events.8.name:0 "[Root.GetName]에서 노예 해방 운동가 체포"
 EaC_civic_mechanic_events.8.desc:0 "최근 집행관들의 함정 수사로 §H[Root.GetName]§! 지하 탈출로의 핵심 안내자가 체포되었습니다. 지도자를 잃은 [Root.GetPlanetMoon]의 지하 탈출로 조직 중 하나는 활동이 크게 위축되었고, 실종되는 노예의 수도 눈에 띄게 감소했습니다.\n\n심문을 받은 안내자는 이렇게 말했습니다. \"나를 죽여도 달라질 건 없어. 나는 노예제라는 병의 증상일 뿐이야. 정부라는 몸에 문제가 있음을 알리는 종기와 같지. 병의 근원을 없애기 전에는 증상도 사라지지 않아.\""
 EaC_civic_mechanic_events.8.a:0 "그래서 '바람직하지 못한' 조짐은 공권력으로 억눌러야 하는 것이다."
 EaC_civic_mechanic_events.8.b:0 "맞는 말이다. 노예제를 끝내야만 이를 멈출 수 있다."
 EaC_civic_mechanic_events.9.name:0 "[THIS.GetName] 창세의 인도자"
 EaC_civic_mechanic_events.9.desc:0 "[THIS.GetName]에 준지성체 생명체를 정착시켰습니다.\n\n우리는 관리자로서 준지성체의 탄생을 이끕니다. 적절한 기술이 있다면 이들을 석기 시대로 진화시켜 [owner.GetName]와 독립된 사회를 관찰할 수 있을 것입니다."
 EaC_civic_mechanic_events.9.a.tooltip:0 "우리 식민지는 준지성체를 위한 보호 구역을 보존할 것입니다."
 EaC_civic_mechanic_events.9.b.tooltip:0 "지성화된 준지성체 사회가 §Y[ROOT.GetName]§!을 소유하게 됩니다."
 EaC_civic_mechanic_events.9.b:0 "이들을 석기 시대까지 진보시킨 뒤 관찰하겠다."
 EaC_civic_mechanic_events.40.name:0 "[Root.GetName]에서 총파업"
 EaC_civic_mechanic_events.40.desc:0 "§H[Root.GetName]§!에서 노동권 문제가 계속되면서, 이제 광범위한 노동 운동이 [Root.GetPlanetMoon]에 뿌리내렸습니다. 일부 지역은 무법천지로 전락했고, 다른 지역은 조직화된 노동자들이 세운 자치 구역인 노동자 공동체로 변모했습니다."
 EaC_civic_mechanic_events.40.a:0 "참을 수 없습니다."
 EaC_civic_mechanic_events.41.name:0 "[Root.GetName]에서 질서 회복"
 EaC_civic_mechanic_events.41.desc.has_ethic_libertarian.has_ethic_cooperative.has_slaves:0 "§H[Root.GetName]§!의 안정도가 크게 높아지면서 [Root.GetPlanetMoon]의 주민들이 다시금 생활의 안정을 느끼고 있습니다. 이에 따라 노동 운동이 주도하는 총파업도 더 이상 지지를 얻지 못하고 있습니다."
 EaC_civic_mechanic_events.41.desc.has_ethic_libertarian.no_ethic_cooperative.has_slaves:0 "§H[Root.GetName]§!의 안정도가 크게 높아지면서 [Root.GetPlanetMoon]의 주민들이 다시금 생활의 안정을 느끼고 있습니다. 이에 따라 노동 운동이 주도하는 총파업도 더 이상 지지를 얻지 못하고 있습니다."
 EaC_civic_mechanic_events.41.desc.no_ethic_libertarian.has_ethic_cooperative.has_slaves:0 "§H[Root.GetName]§!의 안정도가 크게 높아지면서 [Root.GetPlanetMoon]의 주민들이 다시금 생활의 안정을 느끼고 있습니다. 이에 따라 노동 운동이 주도하는 총파업도 더 이상 지지를 얻지 못하고 있습니다."
 EaC_civic_mechanic_events.41.desc.no_ethic_libertarian.no_ethic_cooperative.has_slaves:0 "§H[Root.GetName]§!의 안정도가 크게 높아지면서, 한때 [Root.GetPlanetMoon]에서 영향력을 행사하던 노동 운동은 자취를 감췄습니다. 주민들은 다시 현실에 안주하게 되었습니다."
 EaC_civic_mechanic_events.41.desc.has_ethic_libertarian.has_ethic_cooperative.no_slaves:0 "§H[Root.GetName]§!의 안정도가 크게 높아지면서 [Root.GetPlanetMoon]의 주민들이 다시금 생활의 안정을 느끼고 있습니다. 이에 따라 노동 운동이 주도하는 총파업도 더 이상 지지를 얻지 못하고 있습니다."
 EaC_civic_mechanic_events.41.desc.has_ethic_libertarian.no_ethic_cooperative.no_slaves:0 "§H[Root.GetName]§!의 안정도가 크게 높아지면서 [Root.GetPlanetMoon]의 주민들이 다시금 생활의 안정을 느끼고 있습니다. 이에 따라 노동 운동이 주도하는 총파업도 더 이상 지지를 얻지 못하고 있습니다."
 EaC_civic_mechanic_events.41.desc.no_ethic_libertarian.has_ethic_cooperative.no_slaves:0 "§H[Root.GetName]§!의 안정도가 크게 높아지면서 [Root.GetPlanetMoon]의 주민들이 다시금 생활의 안정을 느끼고 있습니다. 이에 따라 노동 운동이 주도하는 총파업도 더 이상 지지를 얻지 못하고 있습니다."
 EaC_civic_mechanic_events.41.desc.no_ethic_libertarian.no_ethic_cooperative.no_slaves:0 "§H[Root.GetName]§!의 안정도가 크게 높아지면서, 한때 [Root.GetPlanetMoon]에서 영향력을 행사하던 노동 운동은 자취를 감췄습니다. 주민들은 다시 현실에 안주하게 되었습니다."
 EaC_civic_mechanic_events.100.name:0 "[Root.GetName]의 노예 반란"
 EaC_civic_mechanic_events.100.desc:0 "§H[Root.GetName]§!와(과) 인접한 행성에서 더 많은 노예들의 저항을 불러일으키기 위한 노예 반란이 시작되었으며, 마침내 갈등이 정점에 달했습니다. [Root.GetPlanetMoon] 전역의 거리와 골목에서 치열한 전투가 벌어지고 있으며, 주거 지역으로 빠르게 확산되고 있습니다.\n\n지역 보안군이 사태를 억제하기 위해 최선을 다하고 있지만, 전투의 규모가 너무 커서 감당할 수 없는 지경에 이르렀습니다."
 EaC_civic_mechanic_events.100.a:0 "전쟁터가 따로 없군요!"
 EaC_civic_mechanic_events.101.name:0 "[Root.GetName]의 노예 반란!"
 EaC_civic_mechanic_events.101.desc:0 "최근 §H[Root.GetName]§!의 노예 집단 하나가 [Root.GetPlanetMoon] 전역의 법 집행관을 상대로 조직적인 공격을 감행했습니다. 정해진 시각에 노예들은 순찰 중이던 집행관들을 매복 공격했으며, 여러 치안서는 완전히 점령당했습니다. 격렬한 전투로 수천 명이 목숨을 잃었습니다.\n\n남은 보안 병력은 통제권을 되찾으려 분투하고 있지만, 현재 [Root.GetPlanetMoon]의 여러 지역은 완전한 무법 상태에 빠져 있습니다."
 EaC_civic_mechanic_events.101.tooltip:0 "§H[Root.GetName]의 집행관 팝:§! 사망"
 EaC_civic_mechanic_events.102.name:0 "우주로 퍼져나가는 [Root.GetName]의 노예 반란"
 EaC_civic_mechanic_events.102.desc:0 "§H[Root.GetName]§!에서 격렬하게 진행 중이던 노예 반란이 [Root.solar_system.GetName] 성계의 나머지 지역으로 확산되었습니다. 노예 반란에 가담한 무장 민간 선박들이 더 큰 불안을 야기하려는 목적으로 들어오는 무역선들을 공격하면서 여러 차례의 충돌이 보고되고 있습니다."
 EaC_civic_mechanic_events.102.tooltip:0 "§R[Root.solar_system.GetName] 성계에 적대적인 함대가 나타났습니다!§!"
 EaC_civic_mechanic_events.103.name:0 "[Root.GetName]의 노예 해방"
 EaC_civic_mechanic_events.103.desc:0 "§H[Root.GetName]§!의 노예 반란이 [Root.GetPlanetMoon]의 가장 큰 도시 중 하나를 목표로 삼았습니다. 이는 감금되어 비인간적인 방식으로 살도록 강요받고 있는 더 많은 노예들을 해방시키기 위함입니다.\n\n보안군이 압도당한 상황에서, 자유 투사들은 여러 노예 집단을 해방시키고 행성 밖으로 탈출하는 데 성공했습니다."
 EaC_civic_mechanic_events.103.tooltip:0 "§H[Root.GetName]의§! §Y노예 팝§! §H3§!명이 다른 제국으로 탈출합니다."
 EaC_civic_mechanic_events.104.name:0 "갱단 전쟁을 피하는 상인들"
 EaC_civic_mechanic_events.104.desc:0 "§H[Root.GetName]§!에서 노예 반란을 진압하기 위한 투쟁이 이어지면서 이 [Root.GetPlanetMoon]의 무역이 타격을 입고 있습니다. 지표면의 불안정한 정세로 인해 여러 성간 노예상 조합이 상인들에게 이 [Root.GetPlanetMoon]에 접근하지 말라는 경고를 발표했습니다. 다만 불법 무기 밀매는 호황을 누리는 듯합니다."
 EaC_civic_mechanic_events.200.name:0 "[Root.GetName]의 지하 탈출로망 확장"
 EaC_civic_mechanic_events.200.desc:0 "§H[Root.GetName]§!의 안정도가 하락하면서 노예 해방자들이 더욱 대담해졌습니다. 이제 알려진 우주 전역의 온갖 중독성 약물이 [Root.GetPlanetMoon]에 밀수되고 있습니다.\n\n주민들 사이에 약물 사용이 만연해 전반적인 생산성이 악화되고 있습니다."
 EaC_civic_mechanic_events.200.a:0 "상황이 좋지 않군요."
 EaC_civic_mechanic_events.201.name:0 "[Root.GetName]에서 도주하는 노예들"
 EaC_civic_mechanic_events.201.desc:0 "§H[Root.GetName]§!의 노예 밀수업자들이 이른바 지하 탈출로망을 이용해 노예들을 해방하고 있습니다. 도망친 노예들은 우리 영토를 한참 벗어나 다른 제국으로 탈출했습니다.\n\n현지 당국은 노예제 반대 사상의 확산을 막기 위해 최선을 다하고 있지만, 정체불명의 선박 다수가 [Root.GetPlanetMoon]을 드나들고 있습니다."
 EaC_civic_mechanic_events.201.tooltip:0 "§H[Root.GetName]의§! §Y노예 팝§! §H4§!명이 다른 제국으로 탈출합니다."
 EaC_civic_mechanic_events.202.name:0 "[Root.GetName]의 노예 봉기"
 EaC_civic_mechanic_events.202.desc:0 "집행관들이 §H[Root.GetName]§!의 지하 탈출로와 관련된 은신처들을 급습하고 있습니다. 최근 군용 보병 중화기가 동원된 충돌이 여러 차례 발생하여 막대한 재산 피해와 수많은 사망자가 발생했으며, 그중 상당수는 반역자와 노예 동조자였습니다. 노예들이 [Root.GetPlanetMoon] 밖으로 밀반출되는 한편, 이들의 탈출을 돕는 무기가 안으로 반입되는 것으로 보입니다."
 EaC_civic_mechanic_events.203.name:0 "[Root.GetName]에 노예 해방 운동가의 화물선 추락"
 EaC_civic_mechanic_events.203.desc:0 "최근 대형 민간 화물선의 보조 화물칸에서 도망 노예가 발견되어 §H[Root.GetName]§!의 대기권 진입이 거부되었습니다. 화물선은 검사를 위해 정지하라는 명령을 받았지만, 자유에 광적으로 집착하는 [Root.Owner.GetSpeciesName] 선장은 궤도 봉쇄를 강행 돌파해 착륙을 시도했습니다.\n\n화물선은 하강 중 행성 보안군의 지상 사격에 피격되어 인구가 밀집한 도시 지구에 추락했습니다. 지상에서 살아남은 사람은 거의 없었습니다."
 EaC_civic_mechanic_events.203.a:0 "재앙이 따로 없군!"
 EaC_civic_mechanic_events.204.name:0 "[Root.GetName]에서 마약 거래 지속"
 EaC_civic_mechanic_events.204.desc:0 "§H[Root.GetName]§!에서 불법 마약 거래가 계속해서 기승을 부리고 있습니다. 최근에는 밀수업자들이 우리 궤도 창고에서 외계 가스를 탈취해, 그중에 환각 효과가 있는 가스를 선별하는 것을 확인했습니다. 선별된 가스는 판매상에게 공급되어 [Root.GetName]의 뒷골목에서 팔리고 있습니다."
 EaC_civic_mechanic_events.204.a:0 "지금이라도 막아야 합니다!"
 EaC_civic_mechanic_events.300.name:0 "노동자 공동체"
 EaC_civic_mechanic_events.300.desc:0 "§H[Root.GetName]§!에서 노동 운동이 성장하면서, 최근 이 [Root.GetPlanetMoon]의 총파업 참가자들이 자치 구역을 수립했습니다. 이들은 오래전부터 행성 당국의 권위를 약화해 왔으며, 현지 주민들은 이제 이 공동체를 [Root.GetName]의 궁핍한 생활 환경에서 살아남을 수단으로 여기고 있습니다."
 EaC_civic_mechanic_events.300.a:0 "이 찬탈자들을 처리하겠다."
 EaC_civic_mechanic_events.300.b:0 "이 공동체들을 받아들이는 건 어떨까?"
 EaC_civic_mechanic_events.301.name:0 "[Root.GetName]의 총파업 확산"
 EaC_civic_mechanic_events.301.desc:0 "§H[Root.GetName]§!을 장악한 노동자 공동체가 반국가 선전물을 배포하고 있습니다. [Root.GetPlanetMoon]의 공식 사법·치안 체계가 조직화된 노동자들에게 대처하지 못하자, 일반 대중도 자신감을 얻어 노동 운동에 동참하고 있습니다. 이로 인해 생산성이 크게 타격을 받았습니다."
 EaC_civic_mechanic_events.301.a:0 "통제권을 되찾아야 한다."
 EaC_civic_mechanic_events.302.name:0 "[Root.GetName]의 행정 부문 파업"
 EaC_civic_mechanic_events.302.desc:0 "최근 §H[Root.GetName]§!에 파견된 진상 조사단은 행성 행정부 대다수가 [Root.GetPlanetMoon] 노동 운동의 총파업에 동참한 사실을 밝혀냈습니다. 파업에 참여한 관료들은 모두 교체되었지만, 이로 인해 공공 부문에 심각한 혼란이 발생했습니다.\n\n게다가 [Root.GetName] 노동 운동을 이끄는 지도자들은 지금도 더 큰 대표권을 요구하며 신임 관료들을 총파업에 끌어들이려 하고 있습니다."
 EaC_civic_mechanic_events.302.a:0 "이 총파업을 진압해야 한다."
 EaC_civic_mechanic_events.302.b:0 "민중에게 권력 일부를 양보할 수 있지 않을까?"
 EaC_civic_mechanic_events.303.name:0 "[Root.GetName]에서 총독 암살"
 EaC_civic_mechanic_events.303.desc:0 "§H[Root.GetName]§!의 노동 운동에 참여한 억압받는 노동자들이 [governor_target.GetTitle] [governor_target.GetName]을 암살했습니다! [governor_target.GetTitle]의 차량 행렬이 우주항을 떠나던 중 가로막혔고, 호위 경비대와 공격해 온 자유 투사들 사이에 격렬한 총격전이 벌어졌습니다.\n\n소란이 가라앉은 뒤, 사망자 중에 [governor_target.GetTitle]도 포함되어 있음이 확인되었습니다. 이후 노동 운동 측은 다음과 같은 성명을 퍼뜨렸습니다. '[ROOT.GetLeaderName], 똑똑히 들어라. 그대의 억압으로 [ROOT.GetAdjective] 민중의 정신을 꺾을 수는 없다. 우리가 끊어야 할 것은 오직 우리의 사슬뿐이다!'"
 EaC_civic_mechanic_events.303.a:0 "장례는 국가장으로 치르세요."
 EaC_civic_mechanic_events.304.name:0 "[Root.GetName]의 노동자들이 무역 장악"
 EaC_civic_mechanic_events.304.desc:0 "§H[Root.GetName]§!의 노동자 공동체가 이제 [Root.GetPlanetMoon]을 오가는 무역의 상당 부분을 지배합니다. 이들은 주요 우주항 여러 곳을 완전히 장악했고, 모든 무역은 자신들의 중개인을 거쳐야 합니다. 그 결과 [Root.GetName]의 무역 수입이 전반적으로 감소했습니다."
 EaC_civic_mechanic_events.304.a:0 "우리의 지배에 저항한 대가로 엄벌에 처할 것이다."
 EaC_civic_mechanic_events.304.b:0 "윤리관을 바꾸면 이러한 지배권 다툼도 끝낼 수 있을 것이다."
 EaC_civic_mechanic_events.304.c:0 "차라리 이 행성을 독립시켜야 할까?"
 EaC_civic_mechanic_events.1001.name:0 "[Root.GetName]의 지사 폐쇄"
 EaC_civic_mechanic_events.1001.desc:0 "§H[Root.GetName]§!의 안정도가 계속 높아지면서, 현지 당국은 [Root.GetPlanetMoon]에서 §H[office_owner.GetName]§! 측이 벌이는 불법 작업 중단을 저지하는 데 주력할 수 있게 되었습니다. 대규모 체포가 이루어졌고, 이들의 범죄 지사는 문을 닫을 수밖에 없었습니다."
 EaC_civic_mechanic_events.1001.a:0 "속이 시원하군요."
 EaC_civic_mechanic_events.1002.name:0 "[From.GetName]의 지사 폐쇄"
 EaC_civic_mechanic_events.1002.desc:0 "최근 §H[From.Owner.GetName]§!의 §H[From.GetName]§!에 있는 우리 지사가 현지 당국의 대대적인 검거로 인해 문을 닫게 되었습니다. 최근 [From.GetPlanetMoon]의 범죄율이 감소하면서, 법 집행 기관이 우리 사업을 방해하는 데 전념할 수 있게 된 것 같습니다."
 EaC_civic_mechanic_events.1002.tooltip:0 "[From.GetName]에 있는 우리 지사가 폐업했습니다."
 building_underground_railroad_office:0 "지하 탈출로"
 building_underground_railroad_office_desc:0 "외국 제국이 이 행성의 노예들을 구출하기 위해 구축한 비밀 탈출망입니다."
 building_local_union_headquaters:0 "지역 노동조합 사무소"
 building_local_union_headquaters_desc:0 "이 노동조합 지부는 지역 노동자들을 조직하여 더 나은 생활 수준과 시민권을 추구합니다."
 mod_pop_ethic_fanatic_socialism_attraction_mult:0 "광적인 협동주의 윤리관 변동"
 mod_pop_ethic_fanatic_egalitarian_attraction_mult:0 "광적인 자유주의 윤리관 변동"
 job_general_striker:0 "총파업 참여자"
 job_general_striker_plural:0 "총파업 참여자"
 job_general_striker_desc:0 "§R이 파업 참가자들은 열악한§! §Y생활 수준§!§R에 항의하며 불법적으로 작업을 중단했습니다!§!"
 mod_job_general_striker_add:0 "$job_general_striker$ 직업"
 mod_job_general_striker_per_crime:0 "행성 £crime£ §Y범죄§! $VALUE$마다 $job_general_striker$ 직업 §R+1§!"
 mod_job_general_striker_per_crime_short:0 "\n$VALUE$ £crime£마다 £mod_job_general_striker_add£ §R+1§!"
 mod_job_general_striker_per_pop:0 "행성 £pop£ §Y팝§! $VALUE$마다 $job_general_striker$ 직업 §R+1§!"
 mod_job_general_striker_per_pop_short:0 "\n$VALUE$ £pop£마다 £mod_job_general_striker_add£ §R+1§!"
