 origin_post_apocalyptic_specimen:0 "오래된 핵무기"
 origin_post_apocalyptic_specimen_desc_short:0 "모성 [EVENT_TARGET_0.GetName]에서 가져온 이 35메가톤 원자폭탄은 한때 살기 좋았던 행성을 파괴한 대핵전쟁의 잔재입니다"
 origin_post_apocalyptic_specimen_desc_details:0 "다행히 핵폭탄은 아직 해체할 수 있었습니다. 역사학자들이 탄두에 적힌 문구를 해독한 결과, 대략 \"가장 큰 녀석\"이라는 뜻으로 추정됩니다. 참으로 기묘합니다."
 EAC_NUCLEAR_BOMB_PROJECT:0 "재가동된 핵탄두"
 EAC_NUCLEAR_BOMB_PROJECT_DESC:0 "[From.GetName]에서 진행한 발굴 작업으로 버려진 원자폭탄이 뜻하지 않게 작동했습니다. 시간이 다 되기 전에 해체해야 합니다!"
 EaC_civic_mechanic_events.7155.name:0 "재가동된 핵탄두"
 EaC_civic_mechanic_events.7155.desc:0 "[Root.GetName]의 수도 인근 유적을 발굴하던 몇몇 [OWNER.GetSpeciesNamePlural]들이 대핵전쟁 때 남겨진 불발 원자폭탄의 타이머를 실수로 작동시켰습니다.\n\n추정 위력은 35메가톤으로, 폭발하면 여러 인구 밀집 지역이 사라질 것입니다. 폭탄은 옮기기에는 너무 불안정하며, 지역 전체를 대피시킬 시간도 없습니다."
 EaC_civic_mechanic_events.7155.a:0 "폭탄을 해체해야 합니다!"
 EaC_civic_mechanic_events.7156.desc:0 "[From.From.GetName]의 원자폭탄을 성공적으로 해체했습니다! 폭탄은 안전하게 처분되었고, 전문 인력들이 현재 [From.From.GetName] 표면을 수색하며 다른 불발탄을 찾고 있습니다. 이로써 비슷한 사건이 다시 일어날 가능성이 줄어들기를 바랍니다."
 EaC_civic_mechanic_events.7156.pacifist:0 "우리의 어리석음을 되풀이하지 말라는 경고로군."
 EaC_civic_mechanic_events.7156.a:0 "과거를 기억하게 해 줄 원자력 유물이다."
 EaC_civic_mechanic_events.7157.desc:0 "폭발물 처리반이 [From.From.GetName]의 원자폭탄을 제때 해체하지 못했습니다. 폭발이 일어나면서 처리반과 반경 100킬로미터 이내의 모든 생명체가 사라졌습니다. 수많은 [ROOT.GetSpeciesNamePlural]이 목숨을 잃었습니다. 수십 년 전 벌어진 비극적이고 무의미한 전쟁의 마지막 희생자들입니다."
 EaC_civic_mechanic_events.7157.a:0 "이렇게 대핵전쟁이 끝나는군... 우리 스스로의 어리석음이여."
 EaC_civic_mechanic_events.7158.title:0 "원자력 승천"
 EaC_civic_mechanic_events.7158.desc:0 "핵의 불길 속에서 단련된 [OWNER.GetSpeciesNamePlural]은 우라늄에 잠든 힘을 알고 있습니다. 우라늄의 힘을 다스리면 우리 사회는 승천할 수 있습니다. 우라늄은 에너지 생산과 군사력을 강화해 승천의 촉매가 될 것입니다!\n\n다만... 우리가 우라늄을 받아들이기로 한다면 말입니다."
 EaC_civic_mechanic_events.7158.a:0 "우리의 원자력 승천을 받아들이자!"
 EaC_civic_mechanic_events.7158.b:0 "우라늄은 원자 시대에 남겨 두는 것이 좋겠다."
 EaC_civic_mechanic_events.7000.name:0 "창세 계획 절차"
 EaC_civic_mechanic_events.7000.desc:0 "퇴화 광선을 발사한 뒤, 기술진은 §Y창세 계획§!에 대비해 장비 재조정에 들어갔습니다. 이제 이들의 지성을 복원해 §H석기 시대§! 문명을 다시 시작하도록 할지 결정해야 합니다."
 EaC_civic_mechanic_events.7000.a:0 "준지성체 상태로 남겨 둔다."
 EaC_civic_mechanic_events.7000.b:0 "지성을 부여하라. 이들의 석기 시대를 이끌어 주겠다."
 atomic_ascension:0 "원자력 승천"
 embrace_atomic_ascension:0 "['concept_atomic_ascension']을 받아들입니다."
 concept_atomic_ascension:0 "$atomic_ascension$"
 concept_atomic_ascension_desc:0 "$concept_atomic_ascension$:\n£job_technician£ §H$job_technician_plural$§!를 £job_nuclear_technician£ §H$job_nuclear_technician_plural$§!로 대체합니다. 이들은 £primitive_uranium£ §Y$primitive_uranium$§!을 소비해 더 많은 £energy£ §Y$energy$§!을 생산합니다.\n\n£building£ ['building:building_primitive_nuclear_plant']에 £job_physicist£ §H$job_physicist$§! 직업이 추가되며 £building£ §H업그레이드§!할 수 있습니다.\n\n£physics£ §Y$tech_power_hub_1$§! 연구로 다음이 잠금 해제됩니다:\n£building£ §H발전 지구§!의 ['building:building_mega_reactor_apocalyptic']. 이를 업그레이드하면 인공 행성을 제외한 모든 행성을 £planet£ §Y$pc_nuked$§!으로 §G테라포밍§!할 수 있습니다."
 building_mega_reactor_apocalyptic:0 "거대 원자로망"
 building_mega_reactor_apocalyptic_desc:0 "전력망을 따라 설치된 핵 연구 시설에서 기술자들이 원자로의 출력을 실험합니다. 안타깝게도 통제되지 않은 실험으로 주변 지역이 $irradiated_wasteland$로 변했습니다."
 building_mega_reactor_apocalyptic_nuked:0 "과부하 원자로망"
 building_mega_reactor_apocalyptic_nuked_desc:0 "전력망 곳곳에 배치된 핵 연구 시설에서 기술자들은 원자로 출력을 극한까지 끌어올립니다. $irradiated_wasteland$(이)가 되는 것쯤은 안중에도 없습니다..."
 building_mega_reactor_apocalyptic_nuked_effect:0 "£planet£ §H식민지§!가 £primitive_uranium£ ['modifier:irradiated_wasteland'] 보정치를 획득\n\n£job_nuclear_technician£ $job_nuclear_technician$가 £volatile_motes£ §Y$volatile_motes$§! 생산"
