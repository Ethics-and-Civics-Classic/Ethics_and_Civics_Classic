 EaC_civic_mechanic_events.pirate_enclave.offworld_trading_company.desc:0 "각 [Root.GetTradingHubType]마다 §G2§! £trade_value£§Y$TRADE_VALUE$§!을 생산합니다.\n성계의 모든 £crime£ 직업이 §R-1§! £trade_value£를 대가로 §G+1§! £consumer_goods£를 생산합니다.\n"
 sm_pirate_mercenary_garrison:0 "사략선 주둔지"
 sm_pirate_mercenary_garrison_desc:0 "계약한 사략선원들이 주둔하는 막사가 모여 있는 곳입니다. 이곳에 있는 잔뼈 굵은 해적들은 일반 승무원들을 대상으로 정기 훈련을 진행하고, 기지를 방어할 준비 태세를 갖추고 있습니다. 물론, 제국에서 돈이 들어오는 한 말이죠.\n"
