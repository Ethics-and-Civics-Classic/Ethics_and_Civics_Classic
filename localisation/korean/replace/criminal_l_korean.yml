 corrupt_priest:0 "$job_corrupt_priest$"
 job_corrupt_priest:0 "부패한 사제"
 job_corrupt_priest_plural:0 "부패한 사제"
 job_corrupt_priest_desc:0 "겉으로는 존경받을 만한 모습을 유지하면서도, 뒤에서는 사회를 혼란에 빠뜨릴 교리를 퍼뜨리는 사제들입니다."
