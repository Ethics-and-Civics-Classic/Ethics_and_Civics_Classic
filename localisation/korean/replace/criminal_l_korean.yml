 job_corrupt_bureaucrat_plural:0 "부패한 관료"
 job_corrupt_bureaucrat_desc:0 "뇌물을 받고, 증거를 없애고, 첩자가 되는 것까지. 대가만 따른다면 이들에게 불가능한 일은 없습니다."
