 job_corrupt_manager:0 "부패한 관리자"
 job_corrupt_manager_plural:0 "부패한 관리자"
 job_corrupt_manager_desc:0 "숙련된 공장 노동자를 관리하는 일도 쉽지 않습니다. 임금은 그대로 둔 채 위험까지 무릅쓰게 하는 일은 더욱 어렵습니다."
