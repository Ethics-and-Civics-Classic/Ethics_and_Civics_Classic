 job_corrupt_researcher_plural:0 "부패한 연구원"
 job_corrupt_researcher_desc:0 "동료들이 지키는 연구 윤리에 답답함을 느낀 일부 연구원들은 자신의 비전을 이해하고 수단에도 관대한 후원자를 찾아 나섭니다."
