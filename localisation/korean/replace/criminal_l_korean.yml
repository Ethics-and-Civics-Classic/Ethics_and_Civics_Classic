 corrupt_healthcare:0 "$job_corrupt_healthcare$"
 job_corrupt_healthcare:0 "부패한 의료 종사자"
 job_corrupt_healthcare_plural:0 "부패한 의료 종사자"
 job_corrupt_healthcare_desc:0 "이 제약 종사자들은 평범한 의료원 직원으로 행세하지만, 비밀리에 대형 범죄 조직을 위해 암시장에서 불법 약물을 판매합니다."
 mod_job_corrupt_healthcare_add:0 "$job_corrupt_healthcare$ 직업"
 mod_job_corrupt_healthcare_per_crime:0 "행성 £crime£ §Y범죄§! $VALUE$마다 £job_corrupt_healthcare£ §Y$job_corrupt_healthcare_plural$§! 직업 §R+100§!"
 mod_job_corrupt_healthcare_per_crime_short:0 "\n$VALUE$ £crime£당 §R+100§! £job_corrupt_healthcare£ £mod_job_corrupt_healthcare_add£"
 corrupt_gladiator:0 "$job_corrupt_gladiator$"
 job_corrupt_gladiator:0 "부패한 검투사"
 job_corrupt_gladiator_plural:0 "부패한 검투사"
 job_corrupt_gladiator_desc:0 "깊은 밤이면 허름한 창고와 버려진 지하 시설로 도박꾼들이 모여듭니다. 이들은 검투사들이 맹수나 로봇, 다른 검투사와 피투성이로 싸우는 모습에 환호합니다."
