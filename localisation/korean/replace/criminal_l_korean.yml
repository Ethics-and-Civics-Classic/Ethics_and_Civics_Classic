 corrupt_entertainer:0 "$job_corrupt_entertainer$"
 job_corrupt_entertainer:0 "부패한 연예인"
 job_corrupt_entertainer_plural:0 "부패한 연예인"
 job_corrupt_entertainer_desc:0 "이 연예인들은 온갖 무리한 요구를 감당해야 합니다. 무슨 일을 하는지는 결코 대중에게 알려져서는 안 됩니다. 하지만 이들의 진정한 가치는 일이 끝난 뒤 무엇을 하느냐에 있습니다."
 mod_job_corrupt_entertainer_per_crime:0 "행성 £crime£ §Y범죄§! $VALUE$당 £job_corrupt_entertainer£ §Y$job_corrupt_entertainer_plural$§! 직업 §R+100§!"
