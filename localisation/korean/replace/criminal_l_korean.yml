 corrupt_lawyer:0 "$job_corrupt_lawyer$"
 job_corrupt_lawyer:0 "부패한 변호사"
 job_corrupt_lawyer_plural:0 "부패한 변호사"
 job_corrupt_lawyer_desc:0 "보통 변호사는 사람들이 법을 이해하고 활용하도록 돕습니다. 하지만 이들의 주된 관심사는 부유한 의뢰인이 제 잇속대로 법을 주무르게 하는 것입니다."
