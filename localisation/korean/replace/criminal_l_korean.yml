l_korean:
 requires_building_criminal_headquarters:0 "\n이 건물을 건설하려면 행성에 행성 수도가 먼저 있어야 합니다."
 building_criminal_headquarters:0 "작전 본부"
 building_criminal_headquarters_desc:0 "현지 당국에 의해 사업이 중단되지 않도록 관료들이 힘쓰는 우리 기업의 행성 본부입니다.\n\n부패한 관료 직업을 제공합니다. 이 직업은 집행관 수가 3명에서 10명까지일 때 집행관마다 범죄를 증가시키며, 그만큼 무역 가치를 감소시킵니다. 추가 지사 건물도 잠금 해제합니다."
 building_high_society_clubs:0 "상류층 클럽"
 building_high_society_clubs_desc:0 "부유층과 유명인들이 만나 어울리며 공개적으로는 하지 못할 활동을 즐기는 곳입니다. 이곳에서 일어난 일은 밖으로 새어나가지 않습니다... 대개는 말이지요.\n\n침투 속도와 수준, 지사의 무역 가치를 높입니다. 통치자 계층의 행복도와 생산량을 높이는 부패한 연예인 직업도 제공합니다."
 building_high_society_clubs_custom_tooltip:0 "§Y상류층 클럽§!§R을 설립할 수§! §R없습니다!§!"
 building_infiltrated_church:0 "교단에 장악된 교회"
 building_infiltrated_church_desc:0 "겉보기에는 평범한 교회지만 내부에는 광신도들이 침투해 있습니다.\n\n침투 속도와 수준, 지사의 무역 가치 및 정신주의 선호도를 높입니다. 또한 통치 윤리관 선호도를 희생하여 안정도를 높이는 부패한 사제 직업을 추가합니다."
 building_union_busting_lawfirm:0 "노조 파괴 로펌"
 building_union_busting_lawfirm_desc:0 "노동자들이 죽어라 일하게 만드는 가장 좋은 방법은 자기 몸값을 모르게 하는 것입니다. 이 로펌은 노동자들이 회사의 수익에 지장을 줄 만큼 뭉치지 못하게 하는 데 특화되어 있습니다.\n\n침투 속도와 수준, 지사의 무역 가치를 높입니다. 노동자 생산량을 높이는 부패한 변호사 직업도 제공합니다."
 building_unregulated_factories:0 "규제 없는 공장"
 building_unregulated_factories_desc:0 "안전 규정이요? 그런 것은 노동자의 생산성을 제한할 뿐입니다. 이 공장은 장비와 교육 비용을 절감하여 탁월한 생산성을 자랑합니다.\n\n침투 속도와 수준, 지사의 무역 가치를 높입니다. 합금과 소비재 생산량을 높이는 부패한 관리자 직업도 제공합니다."
 building_unregulated_research_labs:0 "규제 없는 연구소"
 building_unregulated_research_labs_desc:0 "과학자들은 특허권을 내주는 대가로 이 연구소를 이용할 수 있습니다. '윤리'나 '규칙'에 가로막혀 못 했던 실험을 마음껏 할 수 있지요.\n\n침투 속도와 수준, 지사의 무역 가치를 높입니다. 연구원 생산량을 높이는 부패한 연구원 직업도 제공합니다."
 building_pr_bureau:0 "홍보국"
 building_pr_bureau_desc:0 "홍보국은 온갖 불법적인 수단으로 정보의 흐름을 통제하며, 그 사실을 숨기려 하지도 않습니다."
 building_fighting_pit:0 "불법 투기장"
 building_fighting_pit_desc:0 "제국 전역의 투자자와 참가자가 몰려드는 불법 검투장입니다. 관중들은 돈을 내고 인질과 노예, 직업 살인자들이 서로 싸우는 모습을 즐깁니다. 때로는 한쪽이 죽어야 끝나는 싸움입니다."
 job_criminal_smuggler:0 "해적 밀수업자"
 job_criminal_smuggler_plural:0 "해적 밀수업자"
 job_criminal_smuggler_desc:0 "하급 해적들은 큰돈을 벌기 위해 목숨을 걸고 다른 제국에 불법 물품을 밀수하며, 수익의 5%를 현지 해적 선장에게 바칩니다."
 mod_job_criminal_smuggler_per_crime:0 "행성 £crime£ §Y범죄§! $VALUE$당 £job_criminal_smuggler£ §Y$job_criminal_smuggler_plural$§! 직업 §R+100§!"
 mod_job_criminal_smuggler_per_crime_short:0 "\n$VALUE$ £crime£당 £job_criminal_smuggler£ £mod_job_criminal_smuggler_add£ §R+100§!"
 mod_job_criminal_smuggler_add:0 "$job_criminal_smuggler$ 직업"
