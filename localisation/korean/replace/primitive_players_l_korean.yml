 PrimPlayer_civic_feudalism:0 "봉건제"
 PrimPlayer_civic_feudalism_desc:0 "이 사회의 경제 원칙은 군주가 자신의 영토 안에 있는 모든 사람과 사물에 절대적인 권한을 가진다는 권리에 기반합니다."
