 PrimPlay_situation_event.1.title:0 "성간 시대"
 PrimPlay_situation_event.1.desc:0 "마지막 기술적 돌파구를 달성한 지금, 우리는 성간 종족이 되었다고 자신 있게 선언할 수 있습니다! 이제 남은 것은 두려운 질문 하나뿐입니다... 어두운 우주의 숲은 [OWNER.GetName]을 보았을 때 어떻게 반응할까요?"
 PrimPlay_situation_event.1.a:0 "새로운 은하 시대의 여명이다!"
 PrimPlay_situation_event.1.payback.desc:0 "최근 이룬 기술적 돌파구 덕분에 이제 우리 국민은 §H미나마르 특화 산업국§!과 성간 전쟁을 지속할 수 있습니다. 압제자들은 더 이상 우리의 손길이 닿지 않는 곳에 숨을 수 없습니다. 그들이 저지른 일의 대가를 치르게 할 것입니다."
 PrimPlay_situation_event.1.payback:0 "미나마르의 기술적 우위가 줄어들고 있다!"
 PrimPlay_situation_event.1.broken_shackles.desc:0 "최근 기술적 돌파구를 마련한 덕분에, 이제 우리 민족은 §H미나마르 특화 산업국§!과 성간 전쟁을 이어 갈 수 있습니다. 초광속 항행이 가능한 우리 함대가 미나마르의 폭정 아래 있는 모든 노예를 해방할 것입니다."
 PrimPlay_situation_event.1.broken_shackles:0 "미나마르에게 억압받는 모든 노예를 해방하겠다!"
