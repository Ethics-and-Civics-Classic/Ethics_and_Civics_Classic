 PrimPlay_situation_event.1001.desc:0 "우리 §H과학자§! 한 명이 최신 §Y채굴 레이저§! 기술을 무기화할 방법을 구상했습니다. 고집속 렌즈를 사용하고 발사 주파수를 주기적으로 바꾸면 소행성을 채굴하거나 적을 격추할 만큼 강력한 레이저를 만들 수 있습니다.\n\n남은 의문은 하나입니다... 이 §H개인 연구 과제§!에 §R충분한 자금§!이 지원될까요?"
 PrimPlay_situation_event.1001.fund:0 "§Y$tech_mining_drone_weapon_1$§! 연구에 자금을 할당한다"
 PrimPlay_situation_event.1001.later:0 "지금은 우선할 수 없다. 나중에 하자."
 PrimPlay_situation_event.1001.cancel:0 "사업의 중점을 평화적 용도로 돌려라."
 STORM_CHASER_CAPSULE_PROJECT_chain_title:0 "신비로운 우주 캡슐"
 STORM_CHASER_CAPSULE_PROJECT_chain_desc:0 "$STORM_CHASER_CAPSULE_PROJECT_DESC$"
 STORM_CHASER_CAPSULE_PROJECT:0 "우주 캡슐 수용"
 STORM_CHASER_CAPSULE_PROJECT_DESC:0 "불가사의한 설계의 수수께끼 캡슐이 궤도에서 떨어져 인근 주민들을 놀라게 했습니다. 조사 중 §H과학자§! 한 명이 내부에서 우주에서 발견되는 것과 같은 위험한 방사선 신호가 새어 나온다는 사실을 알아냈습니다.\n\n안에 무엇이 있든 위험할 수 있지만, 알아낼 방법은 하나뿐입니다... 이 §H우주 연구 계획§!에 §R충분한 자금§!을 지원할까요?"
 STORM_CHASER_CAPSULE_PROJECT_CANCEL:0 "우주 캡슐 거부"
 STORM_CHASER_CAPSULE_PROJECT_CANCEL_DESC:0 "불가해한 설계의 신비로운 캡슐이 궤도에서 떨어져 인근 주민들을 놀라게 했습니다. 조사 중 우리 §H과학자§! 한 명이 내부에서 새어 나오는 위험한 방사선 신호를 감지했는데, 우주에서 발견되는 신호와 일치했습니다.\n\n안에 무엇이 있든 위험할 것입니다. 이 캡슐을 [OWNER.capital_scope.GetName]에서 멀리 떨어진 우주로 다시 쏘아 보내야 합니다!"
 PrimPlay_situation_event.1002.title:0 "추락한 우주 캡슐"
 PrimPlay_situation_event.1002.desc:0 "지난밤 기묘한 설계의 수수께끼 같은 캡슐이 궤도에서 떨어져 인근 주민들을 놀라게 했습니다. 조사 과정에서 우리 §H과학자§! 한 명이 캡슐 내부에서 새어 나오는 위험한 방사선이 우주에서 발견되는 방사선과 일치한다는 사실을 알아냈습니다.\n\n안에 무엇이 있든 위험할 수 있지만, 알아낼 방법은 하나뿐입니다... 이 §H우주 연구 계획§!에 §R충분한 자금§!을 지원할까요?"
 PrimPlay_situation_event.1002.fund:0 "§Y우주 캡슐§! 개방 연구에 자금을 배정하라."
 PrimPlay_situation_event.1002.later:0 "지금은 우선할 수 없다. 나중에 하자."
