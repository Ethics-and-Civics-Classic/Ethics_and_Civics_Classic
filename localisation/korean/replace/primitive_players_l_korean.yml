 PrimPlayer_awareness_situation:0 "성간 인식"
 PrimPlayer_awareness_situation_desc:0 "우리 종족의 존재 자체가 질문을 던집니다. 이 어두운 숲에도 생명이 있을까요? 은하에 정말 우리뿐일까요?"
