 civic_shattered_ring:0 "고대의 부서진 링"
 civic_shattered_ring_desc:0 "$PrimPlayer_civic_shattered_ring_desc$"
 civic_tooltip_shattered_ring_effects:0 "$PrimPlayer_civic_tooltip_shattered_ring_effects$"
 civic_tooltip_shattered_ring_effects_lithoid:0 "$PrimPlayer_civic_tooltip_shattered_ring_effects_lithoid$"
 PrimPlayer_civic_shattered_ring:0 "고대의 부서진 링"
 PrimPlayer_civic_shattered_ring_desc:0 "이 문명은 정체불명의 선조들이 건설한 §H링 월드§!에 거주합니다. 수많은 세대를 거치며 고대 기술의 극히 일부만 전해져, 이제는 지나간 시대의 유물이 되었습니다.\n\n오늘날의 고고학자들은 이 유물에 흩어진 §E소실 기술§! 설계도에서 배울 것이 많아 새로운 발굴 현장이 자주 발견됩니다. 부서진 링 월드를 이해하고 완전히 수리할 수 있다면 막대한 힘을 얻을 것입니다."
 PrimPlayer_civic_tooltip_shattered_ring_effects:0 "£planet£ 모성:$NEW_LINE$ - §Y$job_archaeoengineers_with_icon$§! 직업이 있는 ['modifier:primitive_ring_world_planet_modifier']으로 변경\n\n£society£ 연구 보장:\n - ['tech_archaeostudies']\n - ['tech_archaeo_strike_crafts']\n$NEW_LINE$- ['concept_guaranteed_colonies']: £mod_pop_environment_tolerance£ 거주 적합도를 낮추는 £blocker£ §R장애물§!이 있는 개척 가능한 링 월드 구간으로 대체 $NEW_LINE$- $SPECIES_TRAITS$ ['concept_ring_preference']"
 PrimPlayer_civic_tooltip_shattered_ring_effects_lithoid:0 "§R- 경고: 광물이 부족하여 암석류에게 어려운 기원입니다.§!$NEW_LINE$$PrimPlayer_civic_tooltip_shattered_ring_effects$"
 civic_void_dwellers:0 "고대 공허 거주민"
 civic_void_dwellers_desc:0 "$PrimPlayer_civic_void_dwellers_desc$"
 civic_tooltip_void_dwellers_effects:0 "$PrimPlayer_civic_tooltip_void_dwellers_effects$"
 PrimPlayer_civic_void_dwellers:0 "고대 공허 거주민"
 PrimPlayer_civic_void_dwellers_desc:0 "아득한 옛날, 이 문명은 걷잡을 수 없는 온실 효과 때문에 원래의 모성을 버려야 했습니다. 수많은 세대가 궤도 거주지의 고대 기술 중 극히 일부만 전승하면서, 거주지는 지나간 시대의 유물이 되었습니다.\n\n오늘날의 고고학자들은 이 유물 곳곳에 흩어진 §E소실 기술§! 설계도에서 배울 것이 많아, 새로운 발굴지가 자주 발견됩니다."
 PrimPlayer_civic_tooltip_void_dwellers_effects:0 "£planet£ 모성:$NEW_LINE$ - §Y$job_archaeoengineers_with_icon$§! 직업을 보유한 ['modifier:primitive_habitat_planet_modifier']로 변경\n\n£society£ 연구 보장:\n - ['tech_archaeostudies']\n - ['tech_archaeo_strike_crafts']\n$NEW_LINE$- $SPECIES_TRAITS$$TABBED_NEW_LINE$- ['concept_void_dweller', $trait_void_dweller_1$]$TABBED_NEW_LINE$- ['concept_habitat_preference', $trait_pc_habitat_preference$]$NEW_LINE$- $ap_voidborn_habitat_effect$"
 civic_void_machines:0 "고대의 공허 주조자"
 civic_void_machines_desc:0 "$PrimPlayer_civic_void_machines_desc$"
 civic_tooltip_void_machines_effects:0 "$PrimPlayer_civic_tooltip_void_machines_effects$"
 PrimPlayer_civic_void_machines:0 "고대의 공허 주조자"
 PrimPlayer_civic_void_machines_desc:0 "이 기계 문명의 창조자들은 처음부터 이들을 영원한 우주여행을 위해 설계했으며, 무중력 환경에서 완벽하게 작동하도록 최적화했습니다. 아득한 고립의 세월을 견디는 동안 기계들은 궤도 거주지의 고대 기술 중 극히 일부만 전승했고, 거주지는 지나간 시대의 유물이 되었습니다.\n\n오늘날의 고고학 드론들은 이 유물 곳곳에 흩어진 §E소실 기술§! 설계도에서 복구할 것이 많습니다. 그 결과 새로운 발굴지가 자주 발견됩니다."
 PrimPlayer_civic_tooltip_void_machines_effects:0 "£planet£ 모성:$NEW_LINE$ - §Y$job_archaeoengineers_with_icon$§! 직업이 있는 ['modifier:primitive_habitat_planet_modifier']이 됨\n\n£society£ 연구 보장:\n - ['tech_archaeostudies']\n - ['tech_archaeo_strike_crafts']\n$NEW_LINE$- $SPECIES_TRAITS$$TABBED_NEW_LINE$- ['concept_void_dweller_2', $trait_void_dweller_2$]$TABBED_NEW_LINE$- ['concept_habitat_preference', $trait_pc_habitat_preference$]$NEW_LINE$- $ap_voidborn_habitat_effect$"
 job_archaeo_strike_crafts_miner:0 "고대 굴착 드론"
 job_archaeo_strike_crafts_miner_plural:0 "고대 굴착 드론"
 job_archaeo_strike_crafts_miner_desc:0 "이 원격 조종 드론은 어떤 장갑도 녹일 수 있는 구식 채굴 레이저를 장착하고 있어 우주 채굴을 손쉽게 해냅니다!"
