 origin_primitive_player_atomic_age_desc:0 "이 문명은 원자력 시대에 해당하는 수준까지 발전했습니다. 원자의 힘을 활용하지만 아직 우주에는 진출하지 못했습니다. 핵무기가 널리 퍼져 있을 수 있으며, 갑작스러운 멸종 사건을 초래할 수도 있습니다."
