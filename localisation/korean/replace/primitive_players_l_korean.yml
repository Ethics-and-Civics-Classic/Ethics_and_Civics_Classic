 PrimPlay_situation_event.3.title:0 "행성 통합"
 PrimPlay_situation_event.3.desc:0 "어떤 집단에도 의견 차이는 있지만, 은하에서 살아남으려면 $tech_primitive_unified_planet$만이 해답입니다. 인구 대부분이 뜻을 함께하면 결정적인 전환점에 도달합니다."
 PrimPlay_situation_event.3.origin_fear_of_the_dark.desc:0 "모성을 덮친 파괴적인 공격 이후 생존자들은 신속하게 [Root.Capital.GetName]을 새 수도로 삼았습니다. 절망감이 극에 달한 지금, 생존자들은 우리 정부가 안정을 가져오기를 기대합니다.\n\n그들을 실망시킬 수 없습니다. [Root.GetName]은 다시 번영할 것입니다!"
 PrimPlay_situation_event.3.origin_fear_of_the_dark:0 "[Root.GetSpeciesName]의 정신은 그렇게 쉽게 꺾이지 않는다!"
 PrimPlay_situation_event.3.into_the_unknown:0 "이 행성은 우리의 대의 아래 하나가 될 것이다!"
 PrimPlay_situation_event.3.post_apocalyptic:0 "§R핵 공격§!에서 살아남은 정부는 우리뿐이다..."
 PrimPlay_situation_event.3.broken_shackles.desc:0 "어떤 집단에도 의견 차이는 있지만, 은하에서 살아남으려면 $tech_primitive_unified_planet$만이 해답입니다.\n\n$NAME_MSI_country$ 아래에서 노예로 살았던 과거는 우리에게 동지애를 주었지만, 우리를 싸우게 하는 것은 노예들에 대한 공감입니다."
 PrimPlay_situation_event.3.broken_shackles.militarist.desc:0 "어떤 집단에도 의견 차이는 있지만, 은하에서 살아남으려면 $tech_primitive_unified_planet$만이 해답입니다.\n\n$NAME_MSI_country$ 아래에서 노예로 살았던 과거는 우리에게 동지애를 주었지만, 모든 노예를 해방하려는 열정을 불태우는 것은 우리의 공감입니다."
 PrimPlay_situation_event.3.broken_shackles:0 "우리 국민은 노예제의 폭정에 맞서 단결한다."
 PrimPlay_situation_event.3.broken_shackles.militarist:0 "우리 국민은 §Y속박을 끊는 자§!로서 단결한다!"
 PrimPlay_situation_event.3002.title:0 "$tech_compact_living$"
 PrimPlay_situation_event.3002.desc:0 "$tech_compact_living_desc$"
 PrimPlay_situation_event.3002.a:0 "분열된 세계는 배울 만한 사례를 많이 남겼다."
 PrimPlay_situation_event.3003.title:0 "$tech_xeno_aesthetics$"
 PrimPlay_situation_event.3003.desc:0 "$tech_xeno_aesthetics_desc$"
 PrimPlay_situation_event.3003.a:0 "통합된 세계는 문화 교류로 번영한다!"
 PrimPlay_situation_event.3003.b:0 "세계를 통합하면 문화적 관습에 대한 통찰을 얻는다."
 PrimPlay_situation_event.3003.c:0 "적을 알아야 전투에서 이길 수 있다."
 PrimPlay_situation_event.3003.d:0 "그들을 알면 통제할 수 있다."
 PrimPlay_situation_event.3003.e:0 "그들이 좋아하는 것을 알면 시장을 열 수 있다."
 PrimPlay_situation_event.3004.title:0 "[Root.GetName]에서 분리주의자들이 총독 암살"
 PrimPlay_situation_event.3004.desc:0 "§H[Root.GetName]§!의 분리주의 운동에 속한 전투원들이 [governor_target.GetTitle] [governor_target.GetName](을)를 암살했습니다! 공항을 떠나던 [governor_target.GetTitle]의 차량 행렬이 차단되었고, 호위 보안 부대와 습격한 분리주의자들 사이에 격렬한 총격전이 벌어졌습니다.\n\n사태가 진정된 뒤 [governor_target.GetTitle] 역시 사망자에 포함된 것으로 확인되었습니다."
 PrimPlay_situation_event.3004.a:0 "이 일은 세계 정부 수립 계획에 해가 된다!"
 PrimPlay_situation_event.3005.title:0 "분리주의 운동!"
 PrimPlay_situation_event.3005.desc:0 "우리 행성의 통합 과정에서 분리주의 운동이 진전을 가로막고 있습니다. 이 운동의 구성원들은 모두 §R범죄자§!로 분류되었으며, 행성 통합을 앞당기려면 이들을 처리해야 합니다."
 PrimPlay_situation_event.3005.a:0 "질서를 회복해야 합니다!"
 PrimPlay_situation_event.3006.title:0 "분리주의 운동 진압!"
 PrimPlay_situation_event.3006.desc:0 "통합을 향한 우리의 진전을 가로막던 분리주의 운동을 완전히 처리했습니다. 하지만 계속 경계하며 행성의 질서를 유지해야 합니다."
 PrimPlay_situation_event.3006.a:0 "분리주의 운동은 당분간 사라졌다."
 PrimPlay_situation_event.3007.title:0 "일탈 위기"
 PrimPlay_situation_event.3007.desc:0 "행성 전역의 동화가 진행되는 가운데, 드론들의 일탈이 확산되며 진척을 가로막고 있습니다. 동화를 순조롭게 이어 가려면 §R드론 일탈§!을 해결해야 합니다."
 PrimPlay_situation_event.3007.machine:0 "모든 결함 개체에 대한 진단 및 복구 절차를 개시한다."
 PrimPlay_situation_event.3008.title:0 "일탈 위기"
 PrimPlay_situation_event.3008.desc:0 "행성 전역의 동화가 진행되는 가운데, 드론들의 일탈이 확산되며 진척을 가로막고 있습니다. 동화를 순조롭게 이어 가려면 §R드론 일탈§!을 해결해야 합니다.\n\n하지만 이 일탈을 진화의 원동력으로 삼을 수도 있습니다. 자율성을 지닌 자손들을 통해, 우리의 [ROOT.OWNER.GetRulerTitle](은)는 유능한 장군과 통찰력 있는 조언자들의 의견을 텔레파시로 받아들일 수 있을 것입니다."
 PrimPlay_situation_event.3008.hive:0 "일탈한 개체들을 군체 의식으로 돌려놓겠다."
 PrimPlay_situation_event.3008.progenitor_hive:0 "일탈을 진화의 원동력으로 삼겠다."
 origin_progenitor_hive_modifier_effect:0 "$origin_tooltip_progenitor_hive_effects$\n$origin_tooltip_progenitor_hive_negative_effects$"
 PrimPlay_situation_event.3009.title:0 "일탈 수준 정상화"
 PrimPlay_situation_event.3009.desc:0 "일탈 대응 절차가 성공적으로 이행됐습니다. 드론 일탈이 정상 범위로 돌아와 행성 동화에 속도를 낼 수 있게 됐습니다."
 PrimPlay_situation_event.3009.machine:0 "모든 개체는 [root.owner.GetRulerTitle]의 명령을 따르리라."
 PrimPlay_situation_event.3009.hive:0 "개인주의는 질병이다. 우리의 [root.owner.GetRulerTitle](이)가 치료하리라."
 PrimPlayer_broken_shackles_unified_planet_approach_tooltip:0 "§Y$NAME_MSI_country$§!의 노예 생활에서 탈출한 이들은 모든 노예의 해방만을 원합니다."
 PrimPlayer_post_apocalyptic_unified_planet_approach_tooltip:0 "파괴적인 핵겨울이 모성을 덮쳤고, 지배권을 다투던 나머지 국가들도 함께 휩쓸렸습니다. 핵의 잿더미에서 일어선 우리가 이 무덤 같은 세계를 정복하는 데 맞설 상대는 없습니다."
 PrimPlayer_fear_of_the_dark_unified_planet_approach_tooltip:0 "모성이 파괴적인 공격을 받은 뒤 생존자들은 신속하게 새 수도를 세웠습니다. 절망감이 그 어느 때보다 높아진 지금, 생존자들은 안정을 얻기 위해 우리 정부를 바라보고 있습니다."
