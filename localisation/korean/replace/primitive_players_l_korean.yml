 PrimPlayer_civic_electrifying_nation:0 "전력 보급 국가"
 PrimPlayer_civic_electrifying_nation_desc:0 "이 국가는 전기라는 기술적 혁신을 받아들였습니다.\n\n§Y기계 시대§!§R까지 제거할 수 없습니다§!§R!§!"
