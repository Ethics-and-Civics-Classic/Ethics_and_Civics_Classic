 random_primitive_events.1.title:0 "[Root.System.GetName] 탐험의 여정"
 random_primitive_events.1.nuked.desc:0 "[Root.Leader.GetName](이)가 우리 [Root.System.GetName] 성계 탐사에 나섰습니다. [Root.Leader.GetHerHis] 길고 외로운 대장정은 새로운 보금자리를 찾을 우리 세계의 마지막 희망일지도 모릅니다."
 random_primitive_events.1.desc:0 "[Root.Leader.GetName](이)가 [Root.System.GetName] 탐사를 위한 [Root.Leader.GetHerHis] 여정에 나섭니다. [Root.Leader.GetSheHe](이)가 최후의 개척지로 첫발을 내딛는 지금, 우리의 마음과 생각은 [Root.Leader.GetHerHim]와 함께합니다."
 random_primitive_events.1.gestalt:0 "[Root.System.GetName]은 우리의 핵심이 될 것이다."
 random_primitive_events.1.authoritarian:0 "[Root.System.GetName]은 [Root.Owner.GetRulerTitle]의 것이다!"
 random_primitive_events.1.egalitarian:0 "무한한 공간, 저 너머로!"
 random_primitive_events.1.xenophobe:0 "[Root.System.GetName]에서 [Root.GetSpeciesNamePlural]의 미래는 안전할 것이다."
 random_primitive_events.1.xenophile:0 "마침내 [Root.System.GetName]에서 새로운 생명을 찾을 수 있겠군!"
 random_primitive_events.1.militarist:0 "[Root.System.GetName]의 어떤 도전에도 맞설 준비가 되었다!"
 random_primitive_events.1.pacifist:0 "[Root.System.GetName] 전역에 평화가 깃들기를!"
 random_primitive_events.1.spiritualist:0 "우리의 신앙이 [Root.System.GetName] 전역에 퍼지기를!"
 random_primitive_events.1.materialist:0 "한 [Root.GetSpeciesName]에게는 작은 발걸음이지만, [Root.GetSpeciesAdj] 전체에게는 위대한 도약이다."
 random_primitive_events.1.green:0 "[Root.GetHomeworldName]에 내린 뿌리에서 별을 향해 가지를 뻗는다."
 random_primitive_events.1.industrial:0 "[Root.System.GetName]의 모든 자원을 활용하겠다!"
 random_primitive_events.1.socialism:0 "이 위대한 업적은 모든 [Root.GetSpeciesAdj] 종족의 자연스러운 발전이다!"
 random_primitive_events.1.capitalism:0 "옛 탐험가들처럼 [Root.System.GetName]의 미지의 개척지에서 새로운 부를 찾아 나선다!"
