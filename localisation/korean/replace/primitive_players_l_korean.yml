 nations.90002.branch_office.title:0 "[FROM.GetName] 지사"
 nations.90002.branch_office.desc:0 "고객은 언제나 환영입니다! 조달 담당자가 곧 찾아뵙고 가까운 곳에 새 지사를 설립할 거래 조건을 협의하겠습니다."
 nations.90002.branch_office.desc.established:0 "소중한 고객님, 환영합니다! 잠시 후 고객 서비스 담당자가 이용 약관에 관한 모든 문의에 답변해 드리겠습니다."
 nations.90002.branch_office.yes:0 "§H [Root.Capital.GetName]§!에 §Y지사§! 설립"
 nations.90002.branch_office.no:0 "사양하겠다."
 nations.90002.branch_office.established:0 "지금은 문의할 것이 없다."
 gateway_spage_age_industry:0 "§H우주 시대 산업§!\n§E이 기술은 여러 분야에서 추가적인 발전으로 이어집니다.§!"
 gateway_military_infrastructure:0 "§H기반 시설 발전 경로§!\n§E이 기술은 군사 기반 시설 분야의 추가 발전으로 이어집니다.§!"
 tech_power_plant_1_space_age:0 "우주 시대 기술자"
 tech_power_plant_1_space_age_desc:0 "이 기술자들은 성간 진출의 야망에 필요한 연료를 공급하기 위해 우라늄 생산에 통달했습니다."
 tech_power_plant_1_job_tooltip:0 ""
 tech_primitive_scientific_method:0 "과학적 방법론"
 tech_primitive_scientific_method_desc:0 "과학적 방법은 관찰, 가설 수립, 실험, 자료 분석 및 결론 도출을 통해 자연계에 대한 이해를 검증하고 개선하는 체계적인 지식 습득 방식입니다."
 tech_primitive_scientific_method_tooltip:0 "§H직업 잠금 해제:§! £job_primitive_researcher£ $job_primitive_researcher_plural$"
 tech_primitive_combustion_technology:0 "연소 기술"
 tech_primitive_combustion_technology_desc:0 "연소 물질과 산소 기체의 단순한 반응으로 사회에 동력을 공급하는 혁명적인 기술입니다. 안타깝게도 그 부산물은 행성의 환경을 오염시킵니다."
 tech_primitive_combustion_technology_tooltip:0 "§H직업 잠금 해제:§! £job_primitive_technician£ $job_primitive_technician_plural$\n§H$building_primitive_research$:§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$ §G+25§!"
 tech_primitive_radiowave_theory:0 "전파 이론"
 tech_primitive_radiowave_theory_desc:0 "전파 이론은 전자기학의 한 분야로, 공간을 전파하는 결합된 전기장과 자기장, 즉 '전자기파'를 연구합니다."
 tech_primitive_radiowave_theory_tooltip:0 "§H$building_primitive_research$:§! §G+25§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$"
 tech_primitive_electromagnetism_theory:0 "전자기학 이론"
 tech_primitive_electromagnetism_theory_desc:0 "전자기학은 전하를 띤 입자 사이에 작용하는 전자기력을 다루는 물리학의 한 분야입니다."
 tech_primitive_electromagnetism_theory_tooltip:0 "§H$building_primitive_research$:§! §G+25§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$"
 tech_primitive_nuclear_physics:0 "핵물리학 이론"
 tech_primitive_nuclear_physics_desc:0 "핵물리학은 원자핵과 그 구성 요소 및 상호작용을 연구하며, 다른 형태의 핵물질도 다루는 물리학 분야입니다."
 tech_primitive_nuclear_physics_tooltip:0 "§H$building_primitive_research$:§! §G+25§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$"
 tech_primitive_quantum_mechanics_theory:0 "양자 역학 이론"
 tech_primitive_quantum_mechanics_theory_desc:0 "양자 역학은 원자 크기 이하의 영역에서 자연 현상이 어떻게 일어나는지 설명하는 기초 이론입니다."
 tech_primitive_quantum_mechanics_theory_tooltip:0 "§H$building_primitive_research$:§! §G+50§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$"
 tech_primitive_quantum_electronics_theory:0 "양자 전자공학 이론"
 tech_primitive_quantum_electronics_theory_desc:0 "양자 전자공학은 양자 효과를 전자 장치와 체계에 적용하는 방법을 연구하는 양자 이론의 한 분야입니다."
 tech_primitive_quantum_electronics_theory_tooltip:0 "§H$building_primitive_research$:§! §G+50§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$"
 tech_primitive_radiowave_telescope:0 "전파 기술"
 tech_primitive_radiowave_telescope_desc:0 "전파 망원경은 하늘의 천체 전파원에서 오는 전파를 감지하는 데 쓰이는 특수 안테나와 전파 수신기입니다."
 tech_primitive_computing_technology:0 "천공 카드 데이터"
 tech_primitive_computing_technology_desc:0 "데이터를 저장할 수 있도록 구멍을 정교하게 뚫은 두꺼운 종이 카드입니다. 이를 통해 기계를 특정 작업에 맞춰 조정할 수 있습니다."
 tech_primitive_computing_technology_tooltip:0 "£job_primitive_researcher_2£ §H$job_primitive_researcher_2$:§! £consumer_goods£ 유지비 감소"
 tech_primitive_atomic_era_computing_technology:0 "트랜지스터 컴퓨터"
 tech_primitive_atomic_era_computing_technology_desc:0 "원자력 시대의 이 컴퓨터들은 연구자의 계산 부담을 덜기 위해 방 전체를 차지할 만큼 큰 공간이 필요했습니다."
 tech_primitive_atomic_era_computing_technology_tooltip:0 "£job_primitive_researcher_2£ §H$job_primitive_researcher_2$:§! £consumer_goods£ 유지비 감소"
 tech_primitive_quantum_computing_technology:0 "양자 컴퓨터"
 tech_primitive_quantum_computing_technology_desc:0 "초기 우주 시대의 이 컴퓨터들은 양자역학 현상을 활용하여 더욱 빠른 연산을 수행했습니다."
 tech_primitive_quantum_computing_technology_tooltip:0 "£job_primitive_researcher_2£ §H$job_primitive_researcher_2$:§! £consumer_goods£ 유지비 감소"
 tech_primitive_ai_computing_technology:0 "신경망 컴퓨터"
 tech_primitive_ai_computing_technology_desc:0 "이 컴퓨터들은 유기체의 뇌처럼 작동하도록 설계되어, 연구자들이 이미 알려진 문제에 사고력을 소모하지 않아도 되게 합니다."
 tech_primitive_ai_computing_technology_tooltip:0 "£job_primitive_researcher_2£ §H$job_primitive_researcher_2$:§! £consumer_goods£ 유지비 감소"
 tech_hyper_drive_theory:0 "초공간 이론"
 tech_hyper_drive_theory_desc:0 "항성 대부분의 중력장 사이에는 거미줄 형태의 차원 외 초공간이 이어져 있습니다. 이러한 초공간 항로를 이용하면, 이론적으로 초광속 항행이 가능합니다."
 tech_experimental_hyper_drive:0 "실험용 초공간 드라이브"
 tech_experimental_hyper_drive_desc:0 "초공간 이론은 타당한 것으로 입증되었지만, 차원의 경계를 넘어 초공간 항로를 항해할 방법은 여전히 고안해야 합니다.\n\n"
 tech_hyper_drive_05:0 "실용 초공간 항행"
 tech_hyper_drive_05_desc:0 "실험용 드라이브에서 수집한 시험 자료 덕분에 초공간에 대한 이해가 크게 깊어졌습니다. 이제 널리 사용하기에 적합하면서 훨씬 빠르고 안전하며 신뢰성 높은 드라이브 기술을 개발할 수 있을 것입니다.\n\n"
 TECH_UNLOCK_COLONY_VESSEL_TITLE:0 "§H함선 잠금 해제:§! $colony_vessel$"
 TECH_UNLOCK_COLONY_VESSEL_DESC:0 "$colony_vessel$"
 tech_primitive_holographic_technology:0 "홀로그램 기술"
 tech_primitive_holographic_technology_desc:0 "홀로그램 기술은 빛과 레이저로 공중에 떠 있는 것처럼 보이는 3차원 영상을 만드는 기술입니다. 이 기술은 상업 부문에 끝없는 사업 기회를 열어 줍니다."
 tech_primitive_holographic_technology_tooltip:0 "§H$building_commercial_zone$:§! £job_trader£ $job_trader_plural$ §G+100§!\n§H행성 결정 잠금 해제:§! $decision_planet_luxuries_boost$"
 tech_industrial_city:0 "도시화 계획"
 tech_industrial_city_desc:0 "공동의 목적을 위해 사람들이 모이면 자연스럽게 생겨나는 도심은 어느 사회에나 있었습니다. 도시 계획가들은 뒤이어 기하급수적으로 늘어나는 인구를 수용할 방법을 모색합니다."
 tech_primitive_node:0 "$job_synapse_drone$ 진화"
 tech_primitive_node_desc:0 "시냅스 드론이 군체 의식의 의지를 전달하는 단순한 수용체로, 안정적인 연결을 통해 드론에게 지침을 제공합니다."
 tech_primitive_node_job_tooltip:0 "§H직업 잠금 해제:§! £job_synapse_drone£ $job_synapse_drone_plural$"
 tech_primitive_synapses:0 "$job_evaluator$ 드론 진화"
 tech_primitive_synapses_desc:0 "$job_evaluator$ 드론이 군체 의식의 감각 기관이 되어 모든 드론을 감독할 수 있게 하는 단순한 수용체입니다."
 tech_primitive_synapses_job_tooltip:0 "§H직업 잠금 해제:§! £job_evaluator£ $job_evaluator_plural$"
 tech_primitive_unified_planet:0 "통합된 행성"
 tech_primitive_unified_planet_desc:0 "하나의 깃발 아래 단결한 우리 행성은 더 이상 분열되어 있지 않습니다. 이제 우리는 하나의 국민이며, 우리의 사상을 별들로 가져갈 준비가 되었습니다."
 tech_primitive_unified_planet_tooltip:0 "§H행성 결정 잠금 해제:§! $decision_expel_population$"
 tech_primitive_historical_archives:0 "역사 기록 보관소"
 tech_primitive_historical_archives_desc:0 "이 거대한 도서관은 과학과 문화 지식의 중요한 저장소입니다. 왕들의 서사, 수확과 항해의 기록, 지도와 위대한 저서들이 이곳에 보관됩니다."
 tech_primitive_universities:0 "국립 대학"
 tech_primitive_universities_desc:0 "국립 연구 기관들이 현세대에서 가장 우수하고 뛰어난 인재를 가르치기 위한 교육 기관을 설립합니다."
 tech_primitive_universities_tooltip:0 "§H직업 잠금 해제:§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$"
 tech_primitive_nation_state_government:0 "국민 국가"
 tech_primitive_nation_state_government_desc:0 "모든 제국의 시작은 같았습니다. 공동체의 이름으로 통치하는 정부가 있었고, 시민들은 자신을 그 정부가 다스리는 나라의 일원으로 여겼습니다."
 tech_industrial_farming_2:0 "우주 시대 농부"
 tech_industrial_farming_2_desc:0 "한때 소박한 농부는 작은 밭에서 맨손으로 쉴 새 없이 일했습니다. 이제는 첨단 기계와 자동화 덕분에 단 한 명이 수천 명을 먹여 살릴 수 있습니다."
 tech_industrial_farming_2_job_tooltip:0 "§H직업 잠금 해제:§! £job_farmer£ $job_farmer_plural$"
 tech_primitive_adv_genetic_theory:0 "유전자 저장소"
 tech_primitive_adv_genetic_theory_desc:0 "과학 연구와 유전적 이해의 증진을 위해 유전학 연구 자료를 보관하는 대규모 데이터베이스 단지입니다."
 tech_primitive_adv_genetic_theory_tooltip:0 "§H$building_medical_1$:§! §G+100§! £job_healthcare£ $job_healthcare_plural$"
 tech_primitive_theory_of_evolution:0 "진화론"
 tech_primitive_theory_of_evolution_desc:0 "호기심 많은 사람들은 종 사이의 공통된 양상을 발견하고 묻습니다. '왜 서로 닮았을까?'"
 TECH_UNLOCK_RESOURCE_ALLOYS:0 "£alloys£ $alloys$의 §H전면 생산 잠금 해제§!"
 TECH_UNLOCK_RESOURCE_PRIMITIVE_ALLOYS:0 "£alloys£ $alloys$의 §H제한적 생산 잠금 해제§!"
 tech_proto_thrusters_1:0 "궤도 역학"
 tech_proto_thrusters_1_desc:0 "중력과 싸우면 언제나 질 수밖에 없습니다. 하지만 신중히 계산하면 주변 천체의 중력장을 투척 장치처럼 이용해 작은 우주선을 항성계 너머 먼 곳까지 보낼 수 있습니다."
 TECH_UNLOCK_THRUSTER_0_TITLE:0 "§H부품 잠금 해제:§! 초기형 화학 추진기"
 TECH_UNLOCK_THRUSTER_0_DESC:0 "§H초기 화학 추진기§!\n초기 우주 계획에서는 가연성 추진체로 추력을 만드는 최적의 구성을 찾기 위해 다양한 화학 추진기 시제품을 시험했습니다."
 SHIP_THRUSTER_0:0 "초기형 화학 추진기"
 SHIP_THRUSTER_0_DESC:0 "초기 우주 계획에서는 가연성 추진제로 추력을 만드는 최적의 구성을 찾기 위해 여러 화학 추진기의 시제품을 시험했습니다."
 tech_primitive_alloy_quarry_foundry:0 "원시 합금 가공"
 tech_primitive_alloy_quarry_foundry_desc:0 "초기 우주 시대의 합금 생산은 원시적인 아크 용광로 때문에 막대한 에너지를 소모했습니다. 성간 항행을 견딜 만큼 강한 합금을 만드는 데 필요한 희귀 원소를 캐내는 특수 채석장이 용광로와 함께 설치되는 경우가 많았습니다."
 job_primitive_foundry:0 "합금 노동자"
 job_primitive_foundry_plural:0 "합금 노동자"
 job_primitive_foundry_desc:0 "최근 아크 용광로와 희귀 원소를 공급하는 전문 채석장의 발전 덕분에 이 노동자들은 합금을 생산할 수 있습니다."
 mod_job_primitive_foundry_add:0 "$job_primitive_foundry$ 직업"
 job_primitive_foundry_effect_desc:0 "£job_primitive_laborer£ $job_primitive_foundry_plural$는 $r_minerals$을 소비해 $r_alloys$을 생산합니다"
 building_mine_generic:0 "합금 채석·주조장"
 building_mine_generic_desc:0 "지표면 가까운 채석장 위에 건설된 아크 용광로가 채굴한 광물로 현장에서 합금을 생산합니다."
 TECH_UNLOCK_ENGINEER_VESSEL_TITLE:0 "§H함선 잠금 해제:§! $engineer_vessel$"
 TECH_UNLOCK_ENGINEER_VESSEL_DESC:0 "$engineer_vessel$"
 building_early_spaceport:0 "초기 우주항"
 building_early_spaceport_desc:0 "성간 시대 이전의 우주항으로, 성간 항행이 가능한 함선 한 척을 건조하는 데 필요한 복잡한 물류를 준비하기 위해 수 킬로미터에 걸친 자재 적치장을 갖추고 있습니다."
 building_early_spaceport_tooltip:0 "§Y$NAME_Pre_FTL_Chemical_Ship$§! 한 척 건조 가능"
 building_early_spaceport_launch:0 "$engineer_vessel$ 건조"
 building_early_spaceport_launch_desc:0 "휴스턴, 이륙했습니다."
 tech_space_international_space_station:0 "국제 우주 정거장"
 tech_space_international_space_station_desc:0 "행성 전체가 하나로 뭉쳐 상상할 수 없던 일을 해냈습니다. 머리 위 별들 사이에 과학과 연구의 중심지를 유지하는 것입니다."
 TECH_UNLOCK_INTERNATIONAL_SPACE_STATION_TITLE:0 "§H소형 거대 구조물 잠금 해제:§! $orbital_ring_tier_0$"
 TECH_UNLOCK_INTERNATIONAL_SPACE_STATION_DESC:0 "$orbital_ring_tier_0_MEGASTRUCTURE_DETAILS$"
 orbital_ring_tier_0:0 "궤도 우주 정거장"
 orbital_ring_tier_0_MEGASTRUCTURE_DETAILS:0 "§Y$orbital_ring_tier_0$§!은 행성 상공 높은 궤도를 도는 항성 기지의 일종으로, 궤도 방어와 함선 건조 기능을 제공합니다."
 orbital_ring_tier_0_CONSTRUCTION_INFO_DELAYED:0 "궤도 정거장은 행성 방어에 이점을 제공합니다. 이 구조물은 여러 §Y항성 기지 모듈§!과 §Y건물§!, §Y거주 모듈§! 및 궤도 생산 시설을 설치할 공간을 제공합니다."
 orbital_stations:0 "궤도 우주 정거장"
 orbital_stations_desc:0 "$orbital_ring_tier_0_CONSTRUCTION_INFO_DELAYED$"
 orbital_stations_MEGASTRUCTURE_DETAILS:0 "$orbital_ring_tier_0_MEGASTRUCTURE_DETAILS$"
 sm_astroid_mining_hub:0 "소행성 채굴 허브"
 sm_astroid_mining_hub_desc:0 "이 사무실과 가공 시설에는 성계의 소행성 채굴 작업을 맡는 기술자와 조정 담당자가 상주합니다.\n"
 requires_asteroid_source:0 "§R성계 내 소행성이 필요합니다.§!"
 astroid_mining_hub_tooltip:0 "£minerals£ §G생산§!에 £planet£ §Y소행성§! 필요"
 astroid_mining_hub_drone_laser:0 "£building£ §H$sm_astroid_mining_hub$:§! §Y함재기§! 피해량 §G+15%§!"
 astroid_mining_hub_drone_laser_desc:0 "$sm_astroid_mining_hub$의 모든 드론은 무기화된 $tech_mining_drone_weapon_1$를 장착하여 지역 함재기 부대를 보조합니다."
 tech_primitive_generation_ship:0 "성간 세대 우주선"
 tech_primitive_generation_ship_desc:0 "우리 행성 하나만으로는 부족합니다. 성간 거리를 여행하도록 설계된 우주선이 필요합니다. 하지만 그 거리를 건너 목적지에 도달하려면 여러 세대가 함선 안에서 살고 죽어야 합니다."
 TECH_UNLOCK_EXPLORER_VESSEL_TITLE:0 "§H함선 잠금 해제:§! $explorer_vessel$"
 TECH_UNLOCK_EXPLORER_VESSEL_DESC:0 "$explorer_vessel$"
 tech_primitive_early_aerospace_rocket:0 "초기 우주 위성"
 tech_primitive_early_aerospace_rocket_desc:0 "우리 사회가 하늘 너머에 닿기를 갈망하면서, 별을 향해 더 높이 손을 뻗고 있습니다. 우리를 묶어두는 중력의 사슬에 맞서기 위해 로켓이 태어났습니다."
 tech_primitive_aeroplanes:0 "항공 우주 공학"
 tech_primitive_aeroplanes_desc:0 "새들은 강이나 바다, 산에 구애받지 않고 모든 장벽을 자유롭게 넘나듭니다. 우리 사회의 누군가가 그런 이동의 자유를 실현하고 싶어 하는 것은 당연한 일입니다."
 tech_primitive_plastic_material:0 "합성 소재 건설"
 tech_primitive_plastic_material_desc:0 "플라스틱은 탄소 자원으로 만든 합성 소재로, 화학적 정제 과정에서 심각한 환경 오염을 일으킵니다. 하지만 플라스틱의 활용 분야는 끝없이 다양합니다."
 tech_primitive_composite_material:0 "복합 소재 건설"
 tech_primitive_composite_material_desc:0 "복합 소재는 상호 보완적인 장점을 가진 둘 이상의 재료를 결합하여 만듭니다. 올바르게 제작하면 첨단 항공우주 및 원자력 분야에 적합한 우수한 소재가 됩니다."
 tech_primitive_aluminium_material:0 "알루미늄 건축 자재"
 tech_primitive_aluminium_material_desc:0 "알루미늄은 가볍고 연성이 뛰어나 얇은 판으로 가공할 수 있는 금속 원소입니다. 항공우주 분야에 매우 적합합니다."
 tech_pre_industrial_steel_construction:0 "강철 건축"
 tech_pre_industrial_steel_construction_desc:0 "강철은 비교적 유연하면서도 인장 강도가 뛰어납니다. 철과 코크스를 대량으로 정련해 강철로 만들 수 있는 도가니를 개발하면 건설 기술에 혁명이 일어날 것입니다."
 tech_pre_industrial_iron_construction:0 "철제 건축"
 tech_pre_industrial_iron_construction_desc:0 "철은 가장 소박한 대장간에서도 가공할 수 있는 강한 재료입니다. 달구고 두드리기만 하면 됩니다. 돌로는 불가능했던 일을 해냅니다."
 tech_pre_industrial_iron_construction_tooltip:0 "§H직업 잠금 해제:§! £job_low_tech_laborer£ $job_low_tech_laborer_plural$"
 tech_pre_industrial_stone_construction:0 "석재 건축"
 tech_pre_industrial_stone_construction_desc:0 "돌은 어디에나 있고 쉽게 구할 수 있으니, 누군가 이를 주워 거처를 짓는 데 사용하는 것은 자연스러운 일입니다."
 tech_mechanized_mining_2:0 "우주 시대 광부"
 tech_mechanized_mining_2_desc:0 "광부들이 단순한 수공구만으로 위험한 환경에서 일하던 시대는 끝났습니다. 발명가들은 광산에서 목숨을 잃은 이들의 이야기에 자극받아 이러한 여건을 개선하기 위해 끊임없이 노력했습니다."
 tech_mechanized_mining_2_job_tooltip:0 "§H직업 잠금 해제:§! £job_miner£ $job_miner_plural$\n£primitive_uranium£ §H$primitive_uranium$§! 생산에 필요한 £minerals£ 광물 감소"
 tech_primitive_bow_and_arrow:0 "산업화 이전 전쟁"
 tech_primitive_bow_and_arrow_desc:0 "줄을 단 막대기는 단순해 보일지 몰라도, 활과 화살은 죽음을 빠르고 정확하게 전달하는 수단이 되었습니다."
 tech_primitive_industrial_age_weapons:0 "산업 시대 전쟁"
 tech_primitive_industrial_age_weapons_desc:0 "기계식 자동 장전 기술이 개발되면서, 이를 탑재한 대형 차량은 치명적인 무장을 갖출 수 있게 되었습니다."
 tech_primitive_atomic_age_weapons:0 "원자력 시대 이후의 전쟁"
 tech_primitive_atomic_age_weapons_desc:0 "처음에는 과학적 돌파구로 환영받았지만 곧 대량 살상 무기로 공포의 대상이 되었습니다. 전쟁은 달라졌습니다."
 tech_primitive_space_age_weapons:0 "우주 시대 전쟁"
 tech_primitive_space_age_weapons_desc:0 "세계 대전은 가장 거대한 분쟁이었지만, 이제는 행성으로 가득한 은하의 단일 전장에 불과합니다."
 required_for_tech_primitive_space_age_weapons:0 "£society£ §H$tech_primitive_space_age_weapons$§!에 필요"
 tech_primitive_thrusters_0:0 "탄도 미사일"
 tech_primitive_thrusters_0_desc:0 "기계 시대에 등장한 이 미사일에는 단순한 고체 연료 추진기가 장착되어, 하늘 높이 날아오른 뒤 목표물로 낙하할 수 있었습니다."
 tech_solarpunk_sapling:0 "$building_solarpunk_sapling$"
 tech_solarpunk_sapling_desc:0 "$building_solarpunk_sapling_desc$"
 research_restriction_primitive_technology:0 "초광속 이전 기술 우선"
 research_restriction_primitive_technology_name:0 "$research_restriction_primitive_technology$"
 research_restriction_primitive_technology_desc:0 "아직 미진한 우리 기술을 발전시키는 일이 최우선입니다. 특수한 용도의 기술에 연구 역량을 쏟을 때가 아닙니다.\n\n$research_restriction_primitive_technology_modifier$\n\n['concept_interstellar_age_tech']"
 research_restriction_primitive_technology_modifier:0 "§L원시 기술§!이 연구 선택지에 등장할 확률: §G+100%§!"
