 PrimPlayer_civic_industrializing_nation_desc:0 "이 나라는 산업화를 받아들여 삶의 모든 영역을 자동화하고 있습니다.\n\n§Y기계 시대§!§R까지 제거할 수§! §R없습니다!§!"
 PrimPlayer_civic_the_obelisk:0 "오벨리스크"
 PrimPlayer_civic_the_obelisk_desc:0 "오벨리스크는 세월에도 손상되지 않은 채 이 나라를 굽어보고 있습니다. 이 신생 사회는 신비로운 거석에 어떻게 반응할까요?"
 PrimPlayer_civic_the_obelisk_effects:0 "$NEW_LINE$초광속 이전 문명 둘:$TABBED_NEW_LINE$- 하나는 §I$origin_payback$§! 기원으로 계몽됨$TABBED_NEW_LINE$- 하나는 §I$origin_broken_shackles$§! 기원으로 계몽됨$NEW_LINE$$HOMEWORLD$ $TABBED_NEW_LINE$- $PLANETARY_MODIFIERS$ ['concept_PrimPlayer_the_obelisk']"
 concept_PrimPlayer_the_obelisk:0 "$d_PrimPlayer_the_obelisk_deposit$"
 concept_PrimPlayer_the_obelisk_desc:0 "이 나라에는 기묘한 오벨리스크가 세월에도 훼손되지 않은 채 우뚝 서 있습니다. 누군가는 숭배하고 누군가는 연구하려 하지만, 결국 모두가 묻습니다... 왜 이곳에 있는 것일까요?"
