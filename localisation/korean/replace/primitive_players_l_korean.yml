 origin_primitive_player_early_space_age:0 "초기 우주 시대"
 origin_primitive_player_early_space_age_desc:0 "$CHALLENGING_ORIGIN$\n이 문명은 초기 우주 시대에 들어섰습니다. 원시적인 위성이 모성 궤도를 돌고 있으며 저궤도에서 첫 유인 우주 임무를 완료했습니다. 머지않아 행성을 떠날 준비가 될 것입니다."
 origin_primitive_player_early_space_age_negative_effects:0 "['concept_advanced_empires', 발전된 AI 제국] 최소 하나 보장\n누락된 시작 기술:\n£physics£ £society£ £engineering£ §H성간 시대§! 기술$NEW_LINE$$HOMEWORLD$ $NEW_LINE$£planet£ §H분열된 국민 국가§!를 외교로 통합해야 함"
 origin_primitive_player_early_space_age_negative_effects_nomad:0 "['concept_advanced_empires', 발전된 AI 제국] 최소 하나 보장\n미보유 시작 기술:\n£physics£ £society£ £engineering£ §H성간 시대§! 기술$NEW_LINE$$HOMEWORLD$ $NEW_LINE$£planet£ §H분열된 국민 국가§!를 통합하려면 외교가 필요함\n\n£physics£ §H초광속 드라이브§!를 연구하기 전까지 방주선이 §R무작위로 워프§!할 수 있음"
