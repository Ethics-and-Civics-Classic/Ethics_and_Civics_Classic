 PrimPlayer_developing_hyperdrive_situation:0 "초공간 드라이브 계획"
 PrimPlayer_developing_hyperdrive_situation_desc:0 "$tech_hyper_drive_1$은 우리가 발명한 그 무엇보다도 앞선 기술입니다. 이런 장치를 건설하려면 수년간의 사업 계획과 우리 사회 최고의 지성이 필요할 것입니다."
 PrimPlayer_developing_hyperdrive_situation_monthly_change_tooltip:0 "매월 §H$tech_hyper_drive_1$§!에 필요한 £physics£ §Y연구§!를 일부 §G제공할 확률§!이 있습니다."
 PrimPlayer_developing_hyperdrive_situation_stage_1:0 "§H$tech_hyper_drive_1$§!의 £physics£ §Y연구§!에 §G돌파구§!가 나타날 수 있지만, 이처럼 큰 사업에서는 §Y무작위 사건§!으로 §R진척이 후퇴할 수 있습니다§!.\n\n§H$tech_subspace_drive$§! 기술을 잠금 해제할 §G작은 확률§! 제공"
 PrimPlayer_developing_hyperdrive_situation_modifier_tooltip:0 "§G낮은 확률§!로 §H$tech_subspace_drive$§! 기술 잠금 해제"
 PrimPlayer_developing_hyperdrive_situation_type:0 "초공간 드라이브 계획"
 PrimPlay_situation_event.2.title:0 "$tech_hyper_drive_theory$"
 PrimPlay_situation_event.2.desc:0 "별을 갈망해 온 이 문명은 여러 세대에 걸쳐 발전한 끝에 마침내 은하 탐험 시대의 문턱에 이르렀습니다.\n\n과학자들은 새로운 발상을 떠올렸습니다... $tech_hyper_drive_theory_desc$"
 PrimPlay_situation_event.2.into_the_unknown:0 "이 초공간 드라이브 계획으로 우리는 미지의 세계에 발을 들일 것이다..."
 PrimPlay_situation_event.2.civic_eager_explorers.desc:0 "별들을 갈망한 이 문명은 여러 세대에 걸쳐 발전한 끝에 마침내 은하 탐사의 시대를 눈앞에 두었습니다.\n\n과학자들은 한 가지 생각에 도달했습니다... $tech_hyper_drive_theory_desc$.\n\n끈질긴 탐구와 열망 끝에 이들은 그 연결망을 가로질러 도약하는 기술을 발견했습니다. 이제 거미줄 같은 항로에 갇혀 있지 않아도 됩니다."
 PrimPlay_situation_event.2.civic_eager_explorers:0 "우리 인력이 초공간 드라이브 계획에 다시 집중하고 있다."
 PrimPlay_situation_event.2.civic_privatized_exploration.desc:0 "수년 동안 이 문명은 초공간 드라이브가 거의 완성되었다는 말을 들었습니다. 사람들은 참을성 있게 기다렸지만, 사업을 맡은 자회사는 내내 자금을 자신들의 개인 계좌로 빼돌리고 있었습니다. 마침내 사기가 드러나자 기업은 다급히 움직였고, 정신없는 혼란 속에서 점프 드라이브 기술을 발견했습니다."
 PrimPlay_situation_event.2.civic_privatized_exploration:0 "우리 인력이 초공간 드라이브 계획에 다시 집중하고 있다."
 PrimPlay_situation_event.2.payback.desc:0 "$tech_hyper_drive_theory_desc$"
 PrimPlay_situation_event.2.payback:0 "미나마르의 초공간 드라이브를 역설계하겠다!"
 PrimPlay_situation_event.2.broken_shackles.desc:0 "$tech_hyper_drive_theory_desc$"
 PrimPlay_situation_event.2.broken_shackles:0 "우리는 옛 주인들의 초공간 드라이브를 재현할 것이다!"
 PrimPlay_situation_event.2002.title:0 "$tech_subspace_drive$"
 PrimPlay_situation_event.2002.desc:0 "$tech_subspace_drive_desc$"
 PrimPlay_situation_event.2002.a:0 "놀라운 발견이군!"
 PrimPlay_situation_event.2002.tooltip:0 "\n§W잠금 해제:§! 초광속 항행이 가능한 §H$colony_vessel$§!"
 PrimPlay_situation_event.2003.title:0 "$tech_temple_of_transportation$"
 PrimPlay_situation_event.2003.desc:0 "과학자들이 혁신적인 개념을 떠올렸습니다. 역사 속 증기 기관 운송망을 초공간 규모로 재현할 수 있다는 것입니다. 가설에 따르면 $tech_hyper_relays_desc$. 물론 이 $tech_hyper_relays$는 추가 연구가 필요합니다..."
 PrimPlay_situation_event.2003.a:0 "초공간 고속도로라니, 대단한 발상이군!"
 PrimPlay_situation_event.2004.title:0 "$tech_experimental_subspace_navigation$"
 PrimPlay_situation_event.2004.desc:0 "우리 과학자들은 새로운 성계로 도약하는 방법을 이론적으로 밝혀냈지만, $tech_experimental_subspace_navigation$의 실용성은 제한적입니다. $tech_experimental_subspace_navigation_desc$"
 PrimPlay_situation_event.2004.a:0 "초공간 드라이브는 없어도 이제 성계를 탐험할 수 있다!"
 PrimPlay_situation_event.2004.tooltip:0 "\n§W잠금 해제:§! §H$explorer_vessel$§!용 §Y$tech_experimental_subspace_navigation$§!"
 PrimPlay_situation_event.2005.title:0 "$tech_wormhole_stabilization$"
 PrimPlay_situation_event.2005.desc:0 "$tech_hyper_drive_theory$을 이해하려는 과정에서 웜홀을 인공적으로 만들 수 있다는 이론이 나왔습니다. §H'커니-후치다 드라이브'§!라 불리는 K-F 드라이브는 공간을 휘어 인공 웜홀을 만들고 다른 성계로 빠르게 이동하게 해줄 것입니다.\n\n안타깝게도 현재 기술 수준에서 커니-후치다 드라이브는 §R함선에 쓰기에는 너무 비실용적§!이라는 결론이 났습니다. 그러나 연구가 헛되지는 않았습니다. 이제 웜홀의 구조를 일시적으로 안정화하여 안전하게 통과하는 방법을 알게 되었습니다!"
 PrimPlay_situation_event.2005.a:0 "초공간 드라이브는 막다른 길이지만... 다른 곳에서 새 길이 열렸다!"
 PrimPlay_situation_event.2006.title:0 "$tech_gateway_activation$"
 PrimPlay_situation_event.2006.desc:0 "$tech_gateway_activation_desc$"
 PrimPlay_situation_event.2006.a:0 "어떤 길이 열릴까?"
 PrimPlay_situation_event.2006.tooltip:0 "\n§W잠금 해제:§! §Y$tech_gateway_activation$§!"
 PrimPlay_situation_event.2007.title:0 "$tech_gateway_construction$"
 PrimPlay_situation_event.2007.desc:0 "$tech_gateway_construction_desc$"
 PrimPlay_situation_event.2007.a:0 "이제 우리는 직접 길을 만든다!"
 PrimPlay_situation_event.2007.tooltip:0 "\n§W잠금 해제:§! §Y$tech_gateway_construction$§!"
 PrimPlayer_eager_explorer_hyperdrive_approach_tooltip:0 "별들에 닿기를 갈망하는 §H초공간 드라이브 계획§! 구성원들은 §G성과를 내고자 열망§!합니다."
 PrimPlayer_star_gazers_hyperdrive_approach_tooltip:0 "집합체는 언제나 별을 바라보았습니다. 이제 §H초공간 드라이브 계획§!에서 §G성과를 내겠다는 열망§!을 품고 있습니다."
 PrimPlayer_civic_privatized_exploration_hyperdrive_approach_tooltip:0 "초공간 항행 구현에 실패한 뒤, §H초공간 드라이브 계획§!은 모두의 §G성과를 향한 열망§!을 중심으로 재편되었습니다."
 PrimPlayer_payback_hyperdrive_approach_tooltip:0 "§Y$NAME_MSI_country$§!은 우리의 봉기 중 우리를 퇴화시키는 데 실패했고, 이제 그들의 콜로서스는 우리 행성에 잔해로 남아 있습니다. §H$tech_hyper_drive_1$§!이 가능한 함선과 그 정비 수단을 갖추었던 옛 보유 자산도 남아 있습니다."
 PrimPlayer_broken_shackles_hyperdrive_approach_tooltip:0 "우리의 옛 노예 주인인 §Y$NAME_MSI_country$§!은 공학 데이터베이스를 지우는 데 실패했습니다. 이들의 패배 덕분에 상세한 §H$tech_hyper_drive_1$§! 설계도가 포함된 §G자료의 3%§!를 보존할 수 있었습니다."
 zone_unavailable_tech_primitive_unified_planet:0 "$society_research_icon_with_space$$tech_colonial_centralization$ §W및§! £planet£ 통합된 행성"
 PrimPlayer_unified_planet_situation:0 "통합된 행성"
 PrimPlayer_unified_planet_situation_desc:0 "어떤 집단에도 의견 차이는 있지만, 은하에서 살아남으려면 $tech_primitive_unified_planet$만이 해답입니다. 인구 대부분이 뜻을 함께하면 결정적인 전환점에 도달합니다."
