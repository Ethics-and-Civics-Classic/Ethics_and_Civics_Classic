 progress.3.green:0 "자연을 가꾸면 이 식민지도 결실을 맺을 것이다."
 progress.3.industrial:0 "이 행성의 모든 풍요로운 자원은 우리가 활용할 것이다."
 progress.3.socialism:0 "모든 이의 성공을 위해 우리의 행성들이 협력하기를."
 progress.3.capitalism:0 "이 식민지는 수익성 좋은 사업이 될 것이다."
 random_primitive_events.2.title:0 "[Root.Leader.GetName]의 [From.GetName] 탐사"
 random_primitive_events.2.desc.not_colonizable:0 "[Root.Leader.GetName]이 기묘한 천체를 발견하고 '[FROM.GetName]'이라 명명했습니다. 과학자들이 자료를 검토하고 있으며 이 천체로부터 많은 지식을 얻을 수 있을 것입니다."
 random_primitive_events.2.desc.colonizable:0 "[Root.Leader.GetName]이 개척 가능한 행성을 발견했습니다! 벌써 모성에서는 최초의 개척민이 언제 [FROM.GetName]에 발을 디딜지에 대한 논의가 뜨겁습니다."
 random_primitive_events.2.desc.pc_asteroid:0 "[Root.Leader.GetName](은)는 밀도 높은 금속 핵을 가진 것으로 추정되는 주목할 만한 소행성을 발견했습니다. 이제 [FROM.GetName](이)라 불리는 이 천체의 심층 핵을 분석하기 위해 지질학자들이 파견되었습니다."
 random_primitive_events.2.desc.pc_gas_giant:0 "[From.GetName]의 거대한 중력 우물은 주변 위성과 작은 궤도 천체를 끌어당깁니다. 일부 위성은 중력에 의한 마찰만으로도 핵이 녹아 있습니다. [Root.Leader.GetName](은)는 이 천체들의 물리적 특성을 더 연구하기 위해 조사팀을 파견했습니다."
 random_primitive_events.2.desc.pc_gas_giant.anomaly.300.desc:0 "$anomaly.300.desc$\n\n수석 과학자 [Root.Leader.GetName]은 적절한 기술과, 물론 자금만 있다면 이 생태계를 §Y성간 생명체§!의 §H먹이터§!로 바꿀 수 있다고 생각합니다."
 random_primitive_events.2.desc.pc_molten:0 "[FROM.GetName]의 열 신호가 측정 한계를 넘었습니다! [Root.Leader.GetName]이 공학적 활용에 적합한 독특한 광물이 풍부한 용암 행성을 발견했습니다."
 random_primitive_events.2.desc.pc_barren:0 "[FROM.GetName]에는 생명이 없지만, [Root.Leader.GetName](은)는 황량한 행성 표면에서 귀중한 비밀을 발견할 수 있었습니다. 선상 연구를 위한 토양 표본을 준비하고 있습니다."
 random_primitive_events.2.desc.toxic_planet:0 "[Root.Leader.GetName](은)는 [FROM.GetName]을 조사하고 대기의 화학적 구성을 연구하기 위해 무인 드론을 보냈습니다. 드론들은 부식성 대기에서 빠르게 손상되기 전에 가까스로 일부 자료를 확보했습니다."
 random_primitive_events.2.desc.pc_frozen:0 "[FROM.GetName]의 표면은 얼어붙은 황무지지만, 얼음 아래 광활한 바다에는 숨겨진 생명체가 있을지 모릅니다. [Root.Leader.GetName]이 연구용 얼음 코어 표본을 준비하고 있습니다."
 random_primitive_events.2.desc.home_nuked_planet:0 "[Root.Leader.GetName]이 개척 가능한 행성을 발견했습니다! 벌써 모성에서는 최초의 개척민이 언제 [FROM.GetName]에 발을 디딜지에 대한 논의가 뜨겁습니다."
 random_primitive_events.2.desc.nuked_planet:0 "[Root.Leader.GetName]이 생명이 살 수 없을 것으로 여겨지는 황폐한 행성을 발견했습니다. 그러나 추가 조사 결과 놀랍게도 간신히나마 생명을 부양할 수 있는 것으로 드러났습니다. 이제 남은 의문은 하나입니다... 과연 누가 이런 죽음의 행성에서 살고 싶어 할까요?"
 random_primitive_events.2.option.not_colonizable:0 "가능성은 있지만, 정착은 어렵겠군."
 random_primitive_events.2.option.colonizable:0 "두 번째 고향인가?"
 random_primitive_events.2.option.pc_asteroid:0 "희귀 광물이 풍부하군!"
 random_primitive_events.2.option.anomaly.65:0 "추락 현장을 조사하자. 귀중품이 있을지도 모른다!"
 random_primitive_events.2.option.divider_flag:0 "뜻밖의 행운이지만, 어쩐지 '우리를 겨냥한' 일 같다."
 random_primitive_events.2.option.pc_gas_giant:0 "흥미로운 물리 현상이군."
 random_primitive_events.2.option.space_critter_feeding_ground.a:0 "[Root.Leader.GetName]이 흥미로운 이론을 제안했군. 이 '개인 연구 과제'를 지원하라!"
 random_primitive_events.2.option.space_critter_feeding_ground.b:0 "이 연구에 시간을 할애할 여유가 없다."
 random_primitive_events.2.option.pc_molten:0 "광물이 풍부하지만 생명체는 거의 없는 용암 행성이군."
 random_primitive_events.2.option.pc_barren:0 "차갑고 메마르며 생명이 없다."
 random_primitive_events.2.option.toxic_planet:0 "고등 생명이 살기에는 너무 부식성이 강한 유독성 행성이다."
 random_primitive_events.2.option.pc_frozen:0 "알려진 생명체가 살기에는 너무 추운 얼어붙은 행성이군."
 random_primitive_events.2.option.home_nuked_planet:0 "어떤 무덤도 고향이 될 수 있다."
 random_primitive_events.2.option.nuked_planet:0 "한때는 고향이었으나, 이제는 무덤일 뿐이군."
 SPACE_CRITTER_FEEDING_GROUND_PROJECT:0 "대기권 먹이터"
 SPACE_CRITTER_FEEDING_GROUND_PROJECT_DESC:0 "$random_primitive_events.2.desc.pc_gas_giant.anomaly.300.desc$"
 space_critter_feeding_ground:0 "대기권 먹이터"
 space_critter_feeding_ground_desc:0 "보통 가스 행성은 미생물 수준의 종만 부양할 수 있지만, 이 가스 행성은 거대한 성간 생명체의 먹이터가 되었습니다.\n\n그 덕분에 풍요로운 생태계가 조성되었으며 이제 우주 생물들이 먹이를 찾아 방문합니다."
 NAME_PrimPlayer_Grazing_Tiyanki:0 "$NAME_Grazing_Tiyanki$"
 random_primitive_events.2001.title:0 "대기권 먹이터"
 random_primitive_events.2001.desc.fruitful_partnership:0 "보통 가스 행성은 미생물 수준의 생명체만 부양할 수 있지만, 이 가스 행성은 거대한 성간 생물의 먹이터가 되었습니다.\n\n덕분에 우주 생물들이 번성하는 이 생태계로 먹이를 찾아 모여들고 있습니다.\n\n그런데 이 생물들은 이론적으로 우리의 씨앗 포자를 은하 전역으로 운반할 수도 있는 것으로 보입니다... 거주 가능한 행성에 우리 대신 정착시킬 수 있을지도 모릅니다."
 random_primitive_events.2001.desc:0 "일반적으로 가스 행성은 미생물 수준의 생명체만 부양할 수 있지만, 이 가스 행성은 거대한 성간 생물의 먹이터가 되었습니다.\n\n덕분에 우주 생물들이 먹이를 찾아 방문하는 번성한 생태계가 형성되었습니다."
 random_primitive_events.2001.option.fruitful_partnership:0 "언젠가는 풍요로운 동반자 관계가 될 수 있지 않을까?"
 random_primitive_events.2001.option:0 "얼마나 많은 환상적인 성간 생물이 들르게 될까?"
 PrimPlay_situation_event.1003.title:0 "이론적 중력 덫"
 PrimPlay_situation_event.1003.desc:0 "$tech_gravity_wells_desc$\n\n약간의 영향력을 행사하면 이 연구를 과학자들의 과제 목록에 우선적으로 올릴 수 있습니다. 남은 의문은 하나입니다. 여기에 우선순위를 둘까요?"
 PrimPlay_situation_event.1003.tech_gravity_wells:0 "인도적인 포획 기법 연구에 자금을 지원하라."
 PrimPlay_situation_event.1003.cancel:0 "이 연구를 서두를 시간은 없다."
 PrimPlay_situation_event.1004.title:0 "행성을 통합할 준비 완료!"
 PrimPlay_situation_event.1004.desc.machine:0 "정찰 드론의 보고에 따르면 [root.owner.capital_scope.getname] 지배를 가로막던 위협을 모두 제거했습니다. 이제 행성 전역의 동화를 시작할 수 있습니다."
 PrimPlay_situation_event.1004.desc.hive:0 "[ROOT.OWNER.capital_scope.GetName] 전역의 드론들이 위대한 진화를 앞두고 들떠 있습니다. 온 행성이 우리의 군체 의식과 하나가 될 것입니다."
 PrimPlay_situation_event.1004.desc:0 "국정 담당 장관들이 이제 행성 통합을 추진할 준비가 되었다고 보고했습니다."
 PrimPlay_situation_event.1004.unite.machine:0 "행성 동화 절차를 개시한다."
 PrimPlay_situation_event.1004.unite.hive:0 "우리의 집단의식이 이 세계 구석구석에 닿기를."
 PrimPlay_situation_event.1004.unite:0 "행성 통합을 공식 선언한다."
 PrimPlay_situation_event.1004.hold:0 "아직 통합할 준비가 되지 않았다."
 PrimPlayer_terraform_situation_type:0 "불모 행성 테라포밍"
 PrimPlayer_terraform_situation:0 "불모 행성 테라포밍"
 PrimPlayer_terraform_situation_desc:0 "메마르고 생명이 없는 행성이지만 얼어붙은 물이 존재하며, 한때 풍요로운 생태계의 터전이었을지도 모릅니다. 적절한 기술이 있다면 $pc_continental$으로 테라포밍할 수 있습니다."
 PrimPlayer_terraform_situation_approach_halt:0 "테라포밍 중단"
 PrimPlayer_terraform_situation_approach_terraform:0 "테라포밍 진행"
 PrimPlayer_terraform_frozen_situation_type:0 "얼어붙은 행성 테라포밍"
 PrimPlayer_terraform_frozen_situation:0 "얼어붙은 행성 테라포밍"
 PrimPlayer_terraform_frozen_situation_desc:0 "황량하고 생명이 없는 행성이지만 얼어붙은 물이 존재하며, 한때 번성한 생태계가 있었을지도 모릅니다. 적절한 기술이 있다면 $pc_ocean$으로 테라포밍할 수 있습니다."
 PrimPlayer_terraform_toxic_situation_type:0 "유독성 행성 테라포밍"
 PrimPlayer_terraform_toxic_situation:0 "유독성 행성 테라포밍"
 PrimPlayer_terraform_toxic_situation_desc:0 "이 행성의 유독 가스 때문에 생명체가 살 수 없지만, 충분히 노력하면 이를 덜 치명적인 화합물로 분해하여 마침내 $pc_continental$으로 정화할 수 있습니다."
 random_primitive_events.212.title:0 "대륙 행성 테라포밍 계획"
 random_primitive_events.212.desc:0 "수년에 걸친 치밀한 계획, 막대한 사업비, 성실한 실행 끝에 [FROM.GetName]을 §Y$pc_continental$§!으로 테라포밍하는 데 성공했습니다.\n\n[Root.Capital.GetName]의 모든 [Root.GetSpeciesName]이 새로운 고향이 될 [FROM.GetName]과 앞으로의 발견에 기뻐하고 있습니다!"
 random_primitive_events.212.desc_fractured:0 "수년에 걸친 치밀한 계획과 막대한 자금 투자, 꾸준한 노력 끝에 [FROM.GetName]을 §Y$pc_continental$§!으로 테라포밍하는 데 성공했습니다.\n\n[Root.Capital.GetName]의 모든 [Root.GetSpeciesName]이 [FROM.GetName]을 새 고향으로 삼을 수 있다는 사실에 환호하고 있습니다. 그중 한 국가는 수도와 주민들을 새 식민지로 옮기겠다고 자원했습니다.\n\n어떻게 진행해야 할까요?"
 random_primitive_events.212.a:0 "[ROOT.GetName]의 또 다른 보금자리다."
 random_primitive_events.212.b:0 "다른 국가가 [FROM.GetName]을 개척하고 [root.capital_scope.GetName]을 떠나도록 하라."
 random_primitive_events.212.b.tooltip:0 "[This.GetName](이)가 [FROM.GetName]을 §Y개척§!하고 우리 £planet£ §H수도§!를 §G떠납니다§!"
 random_primitive_events.214.title:0 "해양 행성 테라포밍 계획"
 random_primitive_events.214.desc:0 "수년에 걸친 치밀한 계획, 막대한 사업비, 성실한 실행 끝에 [FROM.GetName]을 §Y$pc_ocean$§!으로 테라포밍하는 데 성공했습니다.\n\n[Root.Capital.GetName]의 모든 [Root.GetSpeciesName]이 새로운 고향이 될 [FROM.GetName]과 앞으로의 발견에 기뻐하고 있습니다!"
 random_primitive_events.214.desc_fractured:0 "수년에 걸친 치밀한 계획, 막대한 사업비, 성실한 실행 끝에 [FROM.GetName]을 §Y$pc_ocean$§!으로 테라포밍하는 데 성공했습니다.\n\n[Root.Capital.GetName]의 모든 [Root.GetSpeciesName]이 새로운 고향이 될 [FROM.GetName]에 기뻐하고 있습니다. 그런데 한 국가가 주민들과 함께 수도를 새 식민지로 옮기겠다고 자원했습니다.\n\n어떻게 대응해야 할까요?"
 random_primitive_events.214.a:0 "[ROOT.GetName]의 또 다른 보금자리다."
 random_primitive_events.214.b:0 "다른 국가가 [FROM.GetName]을 개척하고 [root.capital_scope.GetName]을 떠나도록 하라."
 random_primitive_events.214.b.tooltip:0 "[This.GetName](이)가 [FROM.GetName]을 §Y개척§!하고 우리 £planet£ §H수도§!를 §G떠납니다§!"
 random_primitive_events.217.title:0 "대륙 행성 테라포밍 계획"
 random_primitive_events.217.desc:0 "수년에 걸친 치밀한 계획, 막대한 사업비, 성실한 실행 끝에 [FROM.GetName]을 §Y$pc_continental$§!으로 테라포밍하는 데 성공했습니다.\n\n[Root.Capital.GetName]의 모든 [Root.GetSpeciesName]이 새로운 고향이 될 [FROM.GetName]과 앞으로의 발견에 기뻐하고 있습니다!"
 random_primitive_events.217.desc_fractured:0 "수년에 걸친 치밀한 계획과 막대한 자금 투자, 꾸준한 노력 끝에 [FROM.GetName]을 §Y$pc_continental$§!으로 테라포밍하는 데 성공했습니다.\n\n[Root.Capital.GetName]의 모든 [Root.GetSpeciesName]이 [FROM.GetName]을 새 고향으로 삼을 수 있다는 사실에 환호하고 있습니다. 그중 한 국가는 수도와 주민들을 새 식민지로 옮기겠다고 자원했습니다.\n\n어떻게 진행해야 할까요?"
 random_primitive_events.217.a:0 "[ROOT.GetName]의 또 다른 보금자리다."
 random_primitive_events.217.b:0 "다른 국가가 [FROM.GetName]을 개척하고 [root.capital_scope.GetName]을 떠나도록 하라."
 random_primitive_events.217.b.tooltip:0 "[This.GetName](이)가 [FROM.GetName]을 §Y개척§!하고 우리 £planet£ §H수도§!를 §G떠납니다§!"
 random_primitive_events.219.title:0 "어둠에 대한 공포"
 random_primitive_events.219.desc:0 "[FROM.GetName]을 개척한 지 몇 달이 지났고, [FROM.System.GetName] 전역에서 §H고립주의·원시주의 운동§!이 확산되고 있습니다. 이 운동의 외계종 혐오는 [ROOT.GetSpeciesNamePlural] 사이의 반목이 아니라, [FROM.System.GetName] 밖에 존재할지도 모르는 외계인을 향합니다. 이 혁명은 우주여행 이전에 누렸던 더 평화롭고 소박한 삶으로 돌아가는 것을 목표로 합니다.\n\n이들은 은하가 섬뜩한 포식자들로 가득한 어두운 숲이며, 그 안에 숨는 법을 배워야만 살아남을 수 있다고 주장합니다. 이런 사회적 변화를 어떻게 다뤄야 할까요?"
 random_primitive_events.219.discourage:0 "[Root.GetName]의 진보는 멈추지 않을 것이다!"
 random_primitive_events.219.exodus:0 "숨고 싶다면 [FROM.GetName]에서 숨으라고 하라."
 random_primitive_events.219.exodus.tooltip:0 "§H[This.GetName]:§! §Y$ethic_fanatic_xenophobe$§!로 변화"
 PrimPlayer_isolationist_primitivist_movement:0 "고립주의·원시주의 운동"
 PrimPlayer_isolationist_primitivist_movement_desc:0 "이 혁명은 우주여행 이전에 누리던 더 평화롭고 소박한 삶으로 돌아가려 합니다. 그들의 목표는 우주라는 어두운 숲속에 숨는 것입니다."
 random_primitive_events.218.title:0 "기이한 지진 활동"
 random_primitive_events.218.desc:0 "[Root.GetName]에서 설명할 수 없는 지진 활동이 여러 차례 보고되었습니다. 행성 전역에서 진동이 느껴지지만 아직 기반 시설의 피해는 없습니다. 과학자들은 원인을 밝히려 열망하고 있으며, 발굴에 착수하려면 승인이 필요합니다."
 random_primitive_events.218.a:0 "더 조사하자... 굴착을 시작하라!"
 random_primitive_events.218.b:0 "위험해 보이는군... 저절로 사라지지 않을까?"
 PrimPlayer_subterranean_civilization_chain_title:0 "[Root.owner.GetSubMantleUpper] 문명"
 PrimPlayer_subterranean_civilization_chain_desc:0 "[Root.GetName]의 §H토착 문명§!은 산업 혁명으로 폭주하는 온실 효과가 발생해 모성이 §Y유독 행성§!으로 변하자 지하로 피신하여 멸종을 면했습니다. 이제 지표에 변화가 생겼음을 알아챈 듯 땅 위로 굴을 파고 올라오고 있습니다. 이들의 규모와 의도는 알려지지 않았으며, 심각한 위협이 될 수 있습니다."
 PRIMPLAYER_SEISMIC_DISTURBANCE_1_PROJECT:0 "통신 수립"
 PRIMPLAYER_SEISMIC_DISTURBANCE_1_PROJECT_DESC:0 "[Root.Owner.GetSubMantleLower] 토착 문명과 소통할 방법을 찾아야 합니다. 그들과 공존할 방법이 있을지도 모릅니다."
 PRIMPLAYER_SEISMIC_DISTURBANCE_2_PROJECT:0 "선제 타격"
 PRIMPLAYER_SEISMIC_DISTURBANCE_2_PROJECT_DESC:0 "지표면을 향해 땅을 뚫고 올라오고 있는 이 외계종은 우리에게 큰 위협으로서, 반드시 처리해야 합니다. 선제 타격으로 이 외계종의 지하 도시를 공격합니다."
 PRIMPLAYER_SEISMIC_DISTURBANCE_3_PROJECT:0 "지하 문명 파괴"
 PRIMPLAYER_SEISMIC_DISTURBANCE_3_PROJECT_DESC:0 "[From.From.GetName]의 지하 외계종 문명은 우리 식민지에 큰 위협이 되는 존재로서, 반드시 없애야 합니다. 이 종족의 지하 도시를 타격할 수 있는 방법을 찾아야 합니다."
 random_primitive_events.250.name:0 "지진 활동의 근원"
 random_primitive_events.250.desc:0 "지진 활동을 조사하는 동안 단층이 무너지면서 많은 정착지가 피해를 입었습니다. 그러나 과학자들은 광대한 지하 동굴망을 발견했습니다.\n\n가장 깊은 동굴에는 어떤 §H토착 문명§!이 살고 있습니다. 아마도 모성이 §Y유독성 행성§!으로 변하기 전부터 존재한 문명으로 보이며, 지표면을 향해 땅굴을 파고 있습니다! 우리 정착지의 지면 진동과 최근 정화된 대기가 이들을 자극했을 수도 있지만 확신할 수는 없습니다. 땅굴에서 나와 우리 개척민들과 마주했을 때 이 외계인들이 어떻게 반응할지 알 수 없습니다!"
 random_primitive_events.250.desc.subterranean:0 "[Root.GetName]에서 설명할 수 없는 지진 활동이 여러 차례 보고되었습니다. 행성 전역에서 진동이 느껴지고 많은 정착지가 피해를 입었습니다. 지진을 조사하던 과학자들이 행성 맨틀에서 광대한 동굴망을 발견했습니다.\n\n가장 깊은 동굴에는 어떤 §H토착 문명§!이 살고 있습니다. 아마도 모성이 §Y유독성 행성§!으로 변하기 전부터 존재한 문명으로 보이며, 우리 식민지를 향해 땅굴을 파고 있습니다! 정착지의 일상적인 활동에서 발생한 진동이 이들을 자극했을 수도 있지만 확신할 수는 없습니다. 땅굴에서 나와 우리 개척민들과 마주했을 때 이 외계인들이 어떻게 반응할지 알 수 없습니다!"
 random_primitive_events.250.a:0 "이 상황을 해결해야 합니다."
 random_primitive_events.251.desc:0 "탐사정 하나가 [From.From.GetName]의 지하로 파고들어 땅굴을 뚫던 외계종들과 마주쳤습니다. 놀란 외계인 노동자들이 진정된 뒤, 탐사정은 이들의 지도자와 통신을 수립하는 데 성공했습니다."
 random_primitive_events.251.a:0 "교신 채널을 여세요."
 random_primitive_events.252.desc:0 "[Root.GetName]의 [Root.Owner.GetSubMantleLower] 외계인을 제거하려는 노력이 성공했습니다! 여러 터널을 붕괴시켜 노동자들을 매몰시켰고, 도시가 있던 동굴들을 신경 가스로 가득 채웠습니다.\n\n추정 사상률은 거의 100%이며, 보안군은 남은 생존자들도 처리할 수 있다고 확신합니다."
 random_primitive_events.252.a:0 "작전에 참여한 전군의 노고를 치하합니다."
 random_primitive_events.253.name:0 "[Root.Owner.GetSubMantleUpper] 외계종"
 random_primitive_events.253.desc:0 "이거 켜진 건가? 지상인들, 우리가 보이나? 자네들이 바위 너머 위쪽에 펼쳐진 거대한 스모그에서 왔다고 들었다. 우리 산업 혁명이 대기를 유독하게 오염시킨 뒤로는 거기서 생명체가 살 수 없다고 생각했는데. 어떻게 대기를 정화했지? 대체 의도가 뭔가!?"
 random_primitive_events.253.a:0 "당신들에 대해 알려 주십시오."
 random_primitive_events.253.desc.subterranean:0 "이거 켜진 건가? 우리 모습이 보이나, 지각에 매달려 사는 자들아? 너희가 마그마와 돌보다 더 높은 곳에 있는 대스모그에서 왔다고 들었다. 산업 혁명으로 대기가 유독해진 이후 그곳에는 아무것도 살 수 없다고 여겼다. 어떻게 대기를 정화했지? 대체 너희 의도는 무엇인가!?"
 random_primitive_events.253.a.response:0 "우리 제국은 알려진 세계의 구석구석까지 뻗어 있다. 우리의 손길이 닿지 않는 곳은 대스모그뿐이지. 터널을 흐르는 큰 강에서 잡는 물고기와 지의류 농장을 바탕으로 수많은 훌륭한 도시를 유지하고 있다.\n\n산업 혁명이 대기를 오염시킨 뒤 수천 년 동안 이렇게 살아왔다. 굴착꾼들이 바위 너머에서 자네들 도시의 희미한 울림을 듣고, 조사하기로 했지."
 random_primitive_events.253.b:0 "당신들과 평화롭게 공존하고자 합니다."
 random_primitive_events.253.b.response:0 "그렇게 하지, 지상인! 평화의 정신으로 이 행성을 함께 나누자고. 우리는 자네들과의 교역에 큰 관심이 있네. 서로 줄 수 있는 것이 많을 것 같군. 도시로 돌아가 준비하겠네. 한때 거대한 스모그에 뒤덮였던 우리의 세계를 정화해 줘서 고맙네..."
 random_primitive_events.253.b.response.subterranean:0 "그렇게 하지, '지각인'! 평화의 정신으로 이 행성을 함께 나누자고. 우리는 자네들과의 교역에 큰 관심이 있네. 서로 줄 수 있는 것이 많을 것 같군. 도시로 돌아가 준비하겠네. 한때 거대한 스모그에 뒤덮였던 우리의 세계를 정화해 줘서 고맙네..."
 random_primitive_events.253.c:0 "복종하십시오. 아니면 파멸만이 있을 뿐입니다."
 random_primitive_events.253.c.response:0 "하! 복종할 자들은 너희다! 우리는 평화롭게 나란히 살 수도 있었다... 이제 우리 군대가 대스모그에 빼앗겼던 땅, 너희가 친절하게 정화해 준 땅을 되찾아 제국에 병합할 것이다! 모든 피조물을 다스리는 것은 언제나 우리의 운명이었다."
 random_primitive_events.254.name:0 "[Root.Owner.GetSubMantleUpper] 침공!"
 random_primitive_events.254.desc:0 "[Root.GetName]의 지하 외계종이 지상에 나타났습니다! 원시적이지만 치명적인 투사체 무기로 무장한 대규모 군대가 땅굴에서 쏟아져 나왔으며, 선봉대는 이미 정착지로 공격을 개시했습니다.\n\n치안 부대가 맞서고 있지만, 증원 병력을 보내야 할지도 모릅니다!"
 random_primitive_events.254.desc.subterranean:0 "마그마에 서식하는 [Root.GetName]의 외계종이 우리 동굴에 나타났습니다! 원시적이지만 치명적인 투사체 무기로 무장한 대규모 군대가 땅굴에서 쏟아져 나왔으며, 선봉대는 이미 정착지로 공격을 개시했습니다.\n\n치안 부대가 맞서고 있지만, 증원 병력을 보내야 할지도 모릅니다!"
 random_primitive_events.254.a:0 "전투 준비!"
 subterranean_invasion:0 "적대 세력이 [Root.GetName]의 우리 식민지를 공격하고 있습니다!"
 random_primitive_events.255.desc:0 "[From.From.GetName]의 골칫거리였던 지진은 최근까지 그 존재가 알려지지 않았던 [From.From.GetPlanetMoon]의 토착 지하 문명이 땅굴을 파면서 발생한 것이었습니다! 이 지하 외계종은 원시적이지만 치명적인 투사체 무기로 무장했고 대규모 군대가 땅굴에서 쏟아져 나왔으며, 선봉대는 이미 정착지로 공격을 개시했습니다. 치안 부대가 맞서고 있지만, 증원 병력을 보내야 할지도 모릅니다!"
 random_primitive_events.256.name:0 "[From.From.GetName] 전투 승리!"
 random_primitive_events.256.desc:0 "우리 병력이 [From.From.GetName]의 지하 외계종을 땅굴로 돌려보내는 데 성공했습니다. 현재는 이들의 움직임을 봉쇄한 상태입니다. 하지만 임시방편에 불과하며, 시간이 지나면 이들이 다시금 지상으로 튀어나올 것입니다.\n\n직접 지하로 들어가 적을 덮쳐야 하며, 전략가들이 새로운 공격 계획을 고안했습니다. 상황 일지에 해당 내용을 추가했습니다."
 random_primitive_events.256.desc.subterranean:0 "우리 병력이 [From.From.GetName]의 맨틀에 서식하는 외계종을 마그마 소굴로 돌려보내는 데 성공했습니다. 현재는 이들의 움직임을 봉쇄한 상태입니다. 하지만 임시방편에 불과하며, 시간이 지나면 이들이 다시금 우리 동굴에 침입할 것입니다.\n\n직접 지하로 들어가 적을 덮쳐야 하며, 전략가들이 새로운 공격 계획을 고안했습니다. 상황 일지에 해당 내용을 추가했습니다."
 random_primitive_events.256.a:0 "이 문제를 뿌리 뽑아야 합니다."
 random_primitive_events.257.name:0 "[From.From.GetName] 전투 패배!"
 random_primitive_events.257.desc:0 "[From.From.GetName]에서 우리 병력이 대패했으며, [Root.Owner.GetSubMantleLower] 외계종이 우리 정착지를 완전히 장악했습니다! 심지어 우리 인공위성을 탈취해 우리에게 메시지를 보내고 있습니다."
 random_primitive_events.258.desc:0 "지상종은 들으시오! 우리 영광스러운 군대가 당신네를 상대로 승리했습니다. 그리고 그 전리품으로 당신들이 세운 도시를 우리의 뜻대로 사용할 것입니다. 당신들의 기계 덕분에 많은 것을 배웠고, 이제 우리의 무기는 그 어느 때보다 강력해졌습니다.\n\n다시는 이곳에 발을 들이지 마시오!"
 random_primitive_events.258.desc.subterranean:0 "지각종은 들으시오! 우리 영광스러운 군대가 당신네를 상대로 승리했습니다. 그리고 그 전리품으로 당신들이 세운 도시를 우리의 뜻대로 사용할 것입니다. 당신들의 기계 덕분에 많은 것을 배웠고, 이제 우리의 무기는 그 어느 때보다 강력해졌습니다.\n\n다시는 이곳에 발을 들이지 마시오!"
 random_primitive_events.258.a:0 "뻔뻔한 놈 같으니."
 random_primitive_events.259.name:0 "외계종 출몰"
 random_primitive_events.259.desc:0 "[From.From.GetName]의 지하 외계종이 지상에 나타났습니다! 일단, 일부 탐험가와 상인들로 이루어진 소규모 파견대로 보입니다. 개척민들과 평화로운 공존을 바라는 것일 수도 있고, 어쩌면 무역을 원할 수도 있습니다. 지하 외계 종족 대표가 연락을 취해 왔습니다."
 random_primitive_events.259.desc.subterranean:0 "마그마에 서식하는 [From.From.GetName]의 외계종이 우리 동굴에 나타났습니다! 일단, 일부 탐험가와 상인들로 이루어진 소규모 파견대로 보입니다. 개척민들과 평화로운 공존을 바라는 것일 수도 있고, 어쩌면 무역을 원할 수도 있습니다. 지하 외계 종족 대표가 연락을 취해 왔습니다."
 random_primitive_events.259.a:0 "무슨 말을 하는지 들어보도록 하죠."
 random_primitive_events.260.desc:0 "[Root.GetName]의 지하 외계종이 지하 제국 병력을 모아 지상에 또다시 침공을 감행했습니다! 광분한 이들의 병력이 새로 만든 땅굴에서 튀어나와 우리에게 다시금 도전장을 내민 것입니다."
 random_primitive_events.260.desc.subterranean:0 "마그마에 서식하는 [Root.GetName]의 외계종이 병력을 모아 우리 동굴에 또다시 침공을 감행했습니다! 광분한 이들의 병력이 새로 만든 땅굴에서 튀어나와 우리에게 다시금 도전장을 내민 것입니다."
 random_primitive_events.260.a:0 "반드시 격퇴해야 합니다!"
 subterranean_invasion_2:0 "적대 세력이 [Root.GetName]의 우리 식민지를 공격하고 있습니다!"
 random_primitive_events.261.name:0 "붕괴"
 random_primitive_events.261.desc:0 "[Root.GetName]에서 비보가 들어왔습니다! 그곳에서 교전 중이던 [Root.Owner.GetSubMantleLower] 외계종이 땅굴 입구 근처에 주둔한 아군 부대 전체의 발밑 지반을 붕괴시켰습니다.\n\n추락에서 살아남은 소수의 병사마저 다른 아군 병력이 도착하기 전에 외계종에게 무참히 살해되었습니다."
 random_primitive_events.261.a:0 "기필코 갚아주마!"
 random_primitive_events.262.name:0 "습격대"
 random_primitive_events.262.desc:0 "[Root.GetName]의 우리 식민지 지하에 거주하던 외계종이 어두운 밤을 틈타 땅굴로 소규모 습격대를 보내고 있습니다. 습격대의 공격으로 식민지 주요 시설 하나가 파괴되었고, 습격대는 우리 병력이 대응하기도 전에 지하로 사라졌습니다."
 random_primitive_events.262.a:0 "습격을 막아야 합니다!"
 random_primitive_events.263.name:0 "지상 공격"
 random_primitive_events.263.desc:0 "[Root.GetName]이 또다시 공격받았습니다! [Root.Owner.GetSubMantleLower] 외계종이 우리 주요 정착지 한복판으로 통하는 새 땅굴에서 쏟아져 나왔습니다. 이들은 현지 방어 병력을 제압하고 개척민들을 학살했습니다. 땅굴로 퇴각하면서는 살아남은 몇몇 개척민을 지하로 끌고 갔고, 희생자들의 비명이 울려 퍼졌습니다."
 random_primitive_events.263.a:0 "이 살인 행위에는 반드시 대가가 따를 것이다."
 random_primitive_events.264.name:0 "지하의 생존자"
 random_primitive_events.264.desc:0 "[Root.GetName]의 우리 병력이 식민지 아래의 땅굴망을 조사하던 중 [Root.Owner.GetSubMantleLower] 외계종의 대도시를 발견했습니다. 우리가 신경 가스를 살포하기 전에 지하 제국의 나머지 지역과 스스로를 격리하는 데 성공한 도시입니다. 도시에는 수백만의 외계인이 겁에 질린 채 살고 있습니다. 공병들에게 동굴을 무너뜨려 일을 마무리하라고 지시할까요?"
 random_primitive_events.264.a:0 "네, 고통을 끝내 줍시다."
 random_primitive_events.264.b:0 "아니요! 지상으로 끌고 옵시다. 노예로 부려먹죠."
 random_primitive_events.264.b.subterranean:0 "아니요! 식민지로 끌고 옵시다. 노예로 부려먹죠."
 random_primitive_events.265.name:0 "[Root.Owner.GetSubMantleUpper] 확장"
 random_primitive_events.265.desc:0 "[Root.GetName]의 동굴망에 살포했던 신경가스를 제거하고, 외계종의 시체를 정리했습니다. 이제 개척민들은 이곳으로 안전하게 이주할 수 있습니다. 물론 외계종이 남긴 원시적인 건물은 모두 철거할 예정이며, 그 자리에 우리의 최첨단 건물이 들어설 것입니다."
 random_primitive_events.266.name:0 "금이다!"
 random_primitive_events.266.desc:0 "지금은 멸종한 지하 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 random_primitive_events.266.desc.subterranean:0 "지금은 멸종한 마그마 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 random_primitive_events.267.name:0 "보물고"
 random_primitive_events.267.desc:0 "[Root.GetName]의 땅굴망을 탐사하던 정찰대가 한때 지하 외계 제국의 수도였던 도시에서 왕궁에 진입했습니다. 알현실의 거대한 왕좌에는 황제로 보이는 자의 시신이 여전히 앉아 있었습니다.\n\n정찰대는 폭약으로 왕궁 금고를 뚫고 들어가 가득 쌓인 황금과 기이한 외계 예술품을 발견했습니다. 예술품은 [From.Owner.Capital.GetName]의 박물관으로 보내고, 황금은 매각해 국가 예산에 상당한 보탬을 줄 수 있을 것입니다."
 random_primitive_events.268.name:0 "[Root.GetName]에서 지진 발생"
 random_primitive_events.268.desc:0 "[Root.GetName]에서 최근 또다시 대형 지진이 발생했습니다. 땅굴을 관리하던 [Root.Owner.GetSubMantleLower] 외계종이 사라지자, 지하 동굴망 깊은 곳이 붕괴한 것으로 보입니다. 이로 인해, 많은 정착지가 피해를 보았습니다."
 random_primitive_events.269.name:0 "기근"
 random_primitive_events.269.desc:0 "[Root.GetName]의 [Root.Owner.GetSubMantleLower] 외계종이 우리에게 사절단을 보냈습니다. 이들은 최근 식량난이 발생해 기근에 허덕일 위기에 처한 것으로 보입니다. 사절단은 우리에게 여건이 되는 대로 자신들을 도와 달라고 간절히 부탁했습니다."
 random_primitive_events.269.a:0 "물론이죠. 힘닿는 데까지 지원하겠습니다."
 random_primitive_events.269.b:0 "스스로 살아남아야 한다."
 subterraneans_pleased:0 "[Root.Owner.GetSubMantleLower] 문명과의 관계가 좋아집니다."
 subterraneans_displeased:0 "[Root.Owner.GetSubMantleLower] 문명과의 관계가 악화합니다."
 random_primitive_events.270.name:0 "선물"
 random_primitive_events.270.desc:0 "두 문명 사이의 우정을 기념하는 선물로, [Root.GetName]의 지하 외계종 상단이 대량의 보석을 지상으로 가져왔습니다. 이 보석들은 지하 제국이 [Root.GetPlanetMoon]의 핵에 감히 접근할 수 있는 한계까지 내려가 채굴한 것으로 보입니다."
 random_primitive_events.270.desc.subterranean:0 "두 문명 사이의 우정을 기념하는 선물로, [Root.GetName]의 마그마 외계종 상단이 대량의 보석을 우리 동굴로 가져왔습니다. 이 보석들은 그들의 문명이 [Root.GetPlanetMoon]의 핵에 감히 접근할 수 있는 한계까지 내려가 채굴한 것으로 보입니다."
 random_primitive_events.270.a:0 "뭘 이런 걸 다."
 random_primitive_events.271.name:0 "[root.Owner.GetSubMantleUpper] 난민"
 random_primitive_events.271.desc:0 "[Root.GetName]의 지하 외계 제국에서 최근 많은 난민이 발생해 지상으로 올라왔습니다. 이들은 소규모 병력에 쫓기고 있었습니다. 난민들은 소수 종교 집단에 속한 것으로 보이며, 박해를 피해 달아났다고 주장하고 있습니다.\n\n우리 식민지가 난민들을 받아주면, 이들이 도망쳐 나온 제국의 통치자가 분노할 것입니다. 하지만 난민들이 추격대에 잡혀가도록 놔두면, 처형당할 가능성이 높습니다."
 random_primitive_events.271.desc.subterranean:0 "[Root.GetName]의 마그마 외계 제국에서 최근 많은 난민이 발생해 우리 동굴로 들어왔습니다. 이들은 소규모 병력에 쫓기고 있었습니다. 난민들은 소수 종교 집단에 속한 것으로 보이며, 박해를 피해 달아났다고 주장하고 있습니다.\n\n보다 위에 위치한 동굴에 있는 우리 식민지에 난민들을 받아주면, 이들이 도망쳐 나온 제국의 통치자가 분노할 것입니다. 하지만 난민들이 추격대에 잡혀가도록 놔두면, 처형당할 가능성이 높습니다."
 random_primitive_events.271.a:0 "그들이 원한다면, 받아주겠습니다."
 random_primitive_events.271.b:0 "정치적 갈등은 피해야 합니다. 돌려보내세요."
 random_primitive_events.272.name:0 "외계 인류학자"
 random_primitive_events.272.desc:0 "[Root.Owner.Capital.GetName] 출신 외계종 연구자들이 [Root.GetName]의 토착 [Root.Owner.GetSubMantleLower] 외계종과 오랜 시간 함께 생활한 뒤 지상으로 돌아왔습니다. 연구자들이 배워 온 이들의 오랜 생활 방식과 관습은 우리 사회학 연구에 분명히 도움이 될 것입니다."
 random_primitive_events.273.desc:0 "[Root.GetName]에서 최근 지진이 잇따르면서 여러 정착지의 건물이 무너지고 많은 사망자가 발생했습니다. [Root.Owner.GetSubMantleLower] 외계 제국은 새 도시를 건설하려고 지하 깊은 곳에 새로운 동굴을 파고 있으며, 이것이 지진의 원인으로 보입니다."
 random_primitive_events.273.a:0 "눈감아 주도록 하죠."
 random_primitive_events.273.b:0 "꼭 사죄를 받아야겠습니다!"
 random_primitive_events.274.name:0 "기술 전수 요청"
 random_primitive_events.274.desc:0 "[Root.GetName]의 [Root.Owner.GetSubMantleLower] 외계 제국 소속 장군들이 우리 치안 부대가 사용하는 첨단 무기를 보고는 군사 기술을 전수해 달라고 요청했습니다.\n\n외계 제국과의 전쟁이 시작되면 대응하기 어려워질 것을 우려해, 우리 군 장교들은 기술 전수를 꺼리고 있습니다. 하지만 요청을 거절한다면, 외계 제국은 모욕감을 느낄 것입니다."
 random_primitive_events.274.a:0 "그들에게 현대 무기를 주는 것은 좋지 않다."
 random_primitive_events.274.xenophobe:0 "야만인들에게 첨단 무기를 주는 건 좋은 생각이 아니죠."
 random_primitive_events.274.b:0 "친구끼리 나누며 살아야죠."
 random_primitive_events.275.name:0 "메시지 수신"
 random_primitive_events.275.desc:0 "최근 [Root.GetName]의 [Root.Owner.GetSubMantleLower] 외계종과의 무역량이 크게 떨어졌으며, 이들 제국 대상단들의 왕래도 점차 뜸해지고 있습니다. 오늘 외계 제국군의 대표가 메시지를 보냈습니다. 분위기가 좋지 않은 듯합니다."
 random_primitive_events.275.a:0 "어떤 내용인지 봅시다."
 random_primitive_events.276.name:0 "메시지"
 random_primitive_events.276.desc:0 "지상인들은 들으시오. 좋은 이웃이 되려고 노력했건만, 당신들은 우리 영광스러운 문명에 걸맞은 존중을 보일 생각이 없다는 점이 분명해졌소.\n\n이에 황제께서는 우리의 정당한 권리에 따라 이 행성 전체를 차지하라고 명하셨소. 당신들이 왔던 별들로 도로 쫓아내겠소!"
 random_primitive_events.276.desc.subterranean:0 "지각종은 들으시오. 이웃끼리 잘 지내보려 했건만, 당신들은 우리 영광스러운 문명에 걸맞은 대우를 해 줄 생각이 없나 보군요.\n\n이에, 황제께서 우리의 마땅한 권리를 위해 행성 전체를 장악하라는 명령을 내리셨습니다. 이제 당신들이 왔던 우주로 도로 돌려보내 드리겠습니다!"
 random_primitive_events.276.a:0 "좋지 않군요."
 random_primitive_events.3.title:0 "최초의 인공위성"
 random_primitive_events.3.desc:0 "3...2...1... 발사!\n\n[ROOT.OWNER.GetName](이)가 [ROOT.OWNER.Capital.GetName] 지표에서 첫 로켓을 발사했습니다. 성공적으로 궤도에 진입하면서, 우리를 §Y초기 우주 시대§!로 이끌 우주 계획의 시작을 알렸습니다.\n\n이제 §H국제 우주 정거장§! 건설이 시작됩니다."
 random_primitive_events.3.void_dweller_desc:0 "3...2...1... 발사!\n\n[ROOT.OWNER.GetName]이 [ROOT.OWNER.Capital.GetName]의 고대 도킹 구역에서 첫 우주 왕복선을 발사했습니다. 공허를 성공적으로 횡단한 것은 우리를 §Y초기 우주 시대§!로 이끌 새로운 우주 계획의 시작입니다."
 random_primitive_events.3.a:0 "오늘, 우리는 마침내 초기 우주 시대에 들어섰다."
 random_primitive_events.3.void_dweller:0 "초기 우주 시대를 맞이하자."
 random_primitive_events.3.tooltip:0 "§Y궤도 우주 기지§! 건설 자금이 §G전액§! 확보되었습니다.\n§R(!) 거대 구조물은 직접 건설해야 합니다§!"
 random_primitive_events.4.title:0 "초창기 우주 정거장"
 random_primitive_events.4.desc:0 "[ROOT.GetName]이 마침내 궤도 우주 정거장 계획을 완료했습니다. 이 정거장은 성계를 탐험하고 모성 [ROOT.Capital.GetName]을 보호할 수단을 제공할 것입니다."
 random_primitive_events.4.a:0 "우리는 우주여행의 문턱에 서 있다!"
 random_primitive_events.4.tooltip:0 "§Y초기 화학 추진선§!이 §Y탐사선§!으로 업그레이드됩니다."
 building_primitive_precinct_house:0 "경찰서"
 building_primitive_precinct_house_effect:0 ""
 building_primitive_precinct_house_desc:0 "이런 경찰서는 법을 집행하고 재산을 보호하기 위해 소규모 순찰대를 파견합니다."
 building_generator_generic_primitive:0 "태양광 생산 단지"
 building_generator_generic_primitive_effect:0 "이 $building_generator_generic$은 태양 전지판으로 전력망을 보완하여 전반적인 환경 오염 감소에 기여합니다."
 building_generator_generic_primitive_desc:0 "§Y$building_generator_generic$§!을 §Y3개§! 건설하면 £job_primitive_technician£ §H$job_primitive_technician_plural$§!로 인한 모든 £mod_pop_environment_tolerance£ §R오염§! 불이익이 §G제거§!됩니다."
 building_primitive_synthetics_refinery:0 "합성 정제소"
 building_primitive_synthetics_refinery_desc:0 "이런 합성 정제소는 원자력 시대에 흔했습니다. 석유를 다양한 상업적 용도의 플라스틱으로 바꾸거나 연료로 태워 전기를 생산하는 데 사용되었습니다."
 building_primitive_nuclear_plant:0 "우라늄 농축 연구소"
 building_primitive_nuclear_plant_desc:0 "우라늄을 핵무기용이나 청정 원자력의 연료로 농축하는 연구소입니다."
 building_primitive_nuclear_plant_waste_effect:0 "원시적인 추진 기술로 핵폐기물을 심우주에 내다 버리는 것은 현실적으로 불가능합니다."
 building_primitive_nuclear_plant_irradiated_wasteland_effect:0 "건설되어 있는 동안 §H방주선§!에 £primitive_uranium£ ['modifier:irradiated_wasteland'] 보정치 부여"
 building_primitive_nuclear_plant_apocalyptic:0 "우라늄 농축 시설"
 building_primitive_nuclear_plant_apocalyptic_desc:0 "이 초대형 농축 시설은 성간 제국의 계속 늘어나는 전력 및 군사적 수요를 충족할 만큼 핵분열 물질을 생산합니다."
 mod_planet_miners_primitive_uranium_produces_add:0 "£job_miner£ $job_miner_plural$ 100명당 £primitive_uranium£ 생산량"
 planet_primitive_researcher_2_primitive_uranium_produces_add:0 "£job_primitive_researcher_2£ $job_primitive_researcher_2$ 100명당 £primitive_uranium£ 생산량"
 mod_planet_technician_primitive_uranium_upkeep_add:0 "£job_nuclear_technician£ $job_nuclear_technician$의 £primitive_uranium£ $primitive_uranium$ 유지비"
 mod_planet_nuclear_technician_primitive_uranium_produces_add:0 "£job_nuclear_technician£ $job_nuclear_technician$ 100명당 £volatile_motes£ 생산량"
 mod_planet_nuclear_technician_primitive_uranium_upkeep_add:0 "£job_nuclear_technician£ $job_nuclear_technician$의 £primitive_uranium£ $primitive_uranium$ 유지비"
 mod_country_primitive_uranium_produces_mult:0 "£primitive_uranium£ §H$primitive_uranium$§! 생산량"
 mod_country_primitive_uranium_upkeep_add:0 "£job_nuclear_technician£ $job_nuclear_technician$의 £primitive_uranium£ $primitive_uranium$ 유지비"
 primitive_uranium:0 "우라늄"
 primitive_uranium_desc:0 "핵탄두와 원자력에 사용하기 위해 확보하는 방사성 물질입니다.\n\n초기 우주 시대에는 널리 쓰이지만, 핵융합으로 동력을 공급하는 성간 제국은 우라늄을 거의 사용할 일이 없습니다."
 PrimPlay_situation_event.4100.name:0 "우라늄 비축량 부족"
 PrimPlay_situation_event.4100.desc:0 "$situation_primitive_uranium_deficit_desc$"
 PrimPlay_situation_event.4100.desc.gestalt:0 ""
 PrimPlay_situation_event.4100.a:0 "즉시 우라늄 생산을 늘려야 한다!"
 PrimPlay_situation_event.4100.gestalt:0 "우라늄 생산은 정상 수준으로 유지되어야 한다."
 PrimPlay_situation_event.4100.title:0 "텅 빈 비축고!"
 PrimPlay_situation_event.4110.desc:0 "핵연료 비축량을 회복하는 데 실패했습니다. 수개월간의 우라늄 부족이 치명적인 수준에 이르면서, 핵발전소를 끄고 핵무기 재보급을 중단할 수밖에 없었습니다."
 PrimPlay_situation_event.4110.desc.gestalt:0 "핵물질 비축량의 균형을 회복하지 못했습니다. 수개월에 걸친 우라늄 부족이 치명적인 수준에 이르자 자원 분배 체계를 대대적으로 재편할 수밖에 없었습니다."
 end_deficit_effect_tooltip:0 "§R업그레이드한 모든 건물의 업그레이드가 취소됩니다.\n모든 공격 지상군을 해체합니다.\n군용 함선의 50%를 퇴역시킵니다.§!"
 end_other_deficit_situations_tooltip:0 "제국 구조 조정의 일환으로, 모든 다른 적자 상황이 종료됩니다."
 situation_primitive_uranium_deficit:0 "우라늄 부족"
 situation_primitive_uranium_deficit_desc:0 "우라늄 비축량이 위험한 수준에 도달했습니다! 원자력 기술자들은 필요할 때 연료봉을 안정적으로 확보할 수 없어 혼란에 빠졌습니다. 원자력 발전량과 군의 사기는 사상 최저 수준입니다.\n\n비축량을 회복하려면 §Y$building_primitive_nuclear_plant$§!를 건설해야 합니다!"
 tech_fission_power_tooltip:0 "§H직업 잠금 해제:§! £job_nuclear_technician£ $job_nuclear_technician_plural$"
 tech_fission_power_tooltip_desc:0 "$job_nuclear_technician_desc$"
 tech_fusion_power_tooltip:0 "§H직업 잠금 해제:§! £job_technician£ $job_technician_plural$\n£job_nuclear_technician£ $job_nuclear_technician_plural$를 £job_technician£ §H핵융합§!으로 §H대체§!"
 tech_fusion_power_tooltip_desc:0 "기술자들은 더 이상 작업자의 폐를 오염시키는 발전기를 운용하거나 핵폐기물을 만드는 우라늄에 의존하지 않습니다... 이제 깨끗한 핵융합 시설을 관리합니다."
 job_nuclear_technician:0 "원자력 기술자"
 job_nuclear_technician_plural:0 "원자력 기술자"
 job_nuclear_technician_desc:0 "이 기술자들은 원자력의 잠재력을 극대화하여 초기 우주 시대 사회를 성간 시대로 이끕니다."
 mod_job_nuclear_technician_add:0 "$job_nuclear_technician$ 직업"
 job_ancient_nuclear_technician:0 "고대 원자력 기술자"
 job_ancient_nuclear_technician_plural:0 "고대 원자력 기술자"
 job_ancient_nuclear_technician_desc:0 "이 기술자들은 유물 방주선 중심에서 생명 유지 장치를 가동하는 고대 원자로를 보존하려는 역사학자에 가깝습니다."
 mod_job_ancient_nuclear_technician_add:0 "$job_ancient_nuclear_technician$ 직업"
 building_primitive_power_plant:0 "원시 발전소"
 building_primitive_power_plant_desc:0 "이 유형의 발전소는 유독한 오염 물질이나 위험한 방사성 폐기물을 배출합니다."
 building_fallout_shelter:0 "방사능 대피소"
 building_fallout_shelter_desc:0 "원자력 시대에 설계된 이러한 방사능 낙진 대피소는 사회가 재앙에서 살아남는 데 필요한 모든 것을 제공합니다."
 building_fallout_shelter_tt:0 "§Y$default_storm$§!이 행성 생산에 미치는 부정적 효과가 §G25%§! 감소합니다.\n\n§Y$default_storm$§! 또는 §Y$irradiated_wasteland$§!가 존재하는 동안:$TABBED_NEW_LINE$$mod_planet_miners_minerals_produces_add$: §G+1§! $TABBED_NEW_LINE$$mod_planet_farmers_food_produces_add$: §G+1§! $TABBED_NEW_LINE$$mod_planet_technician_energy_produces_add$: §G+1§!\n\n§Y$irradiated_wasteland$§!가 존재하는 동안:$TABBED_NEW_LINE$£stability£ $MOD_PLANET_STABILITY_ADD$: §G+10§!"
 building_machine_primitive_assembly_plant:0 "원시 조립 공장"
 building_machine_primitive_assembly_plant_desc:0 "이 원시적인 조립 공장은 유닛 하나를 만드는 데도 오랜 시간이 걸리지만, 로봇 혁명을 일으켰습니다."
 job_primitive_replicator:0 "원시 복제기"
 job_primitive_replicator_desc:0 "탄탄한 합금 산업이 없기 때문에 이 원시 복제기는 복잡한 로봇을 제작하려면 광물 제련 과정까지 직접 수행해야 합니다."
 building_heritage_museum:0 "유산 박물관"
 building_heritage_museum_desc:0 "이 원시 사회의 과거 업적을 전시하는 거대한 건물입니다."
 building_corporate_heritage_museum:0 "기업 유산 박물관"
 building_corporate_heritage_museum_desc:0 "이 거대 기업은 사회를 이끌어 온 분기별 실적의 역사를 자랑스럽게 전시합니다."
 building_machine_primitive_capital:0 "대륙 배열체"
 building_machine_primitive_capital_desc:0 "이 행성의 지배권을 다투는 대륙 규모 기계 지능의 중심지입니다."
 job_primitive_machine_calculator:0 "원시 계산기"
 job_primitive_machine_calculator_desc:0 "이 원시 계산기들은 초광속 기술을 추구하며 끊임없이 방정식과 확률을 계산하고 새로운 기능을 시험합니다."
 mod_job_primitive_machine_calculator_add:0 "원시 계산기 직업"
 primitive_patrol_drone:0 "원시 감시 드론"
 primitive_patrol_drone_desc:0 "이 단순한 드론들은 집합체의 안정을 위협하는 일탈과 기능 오류를 감지할 수 있으며, 발견된 문제는 반드시 바로잡아야 합니다."
 EXPERIMENTAL_DRIVE:0 "실험용 초공간 드라이브"
 EXPERIMENTAL_DRIVE_DESC:0 "이제 초공간 항로망을 따라 이동할 수 있게 되었지만, 모델의 예측에 비하면 매우 느립니다. 안전성과 신뢰성도 보장할 수 없습니다. 드라이브는... 예측 불가능합니다. 초공간 항행 중에 정지시켰다가 원격으로 재시동해야 할 수도 있습니다. 여러 부작용이 생길 수 있으며, 일부는 오히려 긍정적일지도 모릅니다.\n\n"
 plentiful_mapmodes_ftl_map_mode:0 "초광속 지도 모드"
 plentiful_mapmodes_ftl_map_mode_desc:0 "제국의 §Y초광속 기술§!에 따라 국경에 색을 표시합니다."
 HAS_HYPER_DRIVE_1:0 "§Y[This.GetName]§!이 첫 단계 §Y초공간 드라이브§! 기술을 보유하고 있습니다."
 HAS_HYPER_DRIVE_2:0 "§Y[This.GetName]§!이 2단계 §Y초공간 드라이브§! 기술을 보유함."
 HAS_HYPER_DRIVE_3:0 "§Y[This.GetName]§!이 세 번째 단계의 §Y초공간 드라이브§! 기술을 보유하고 있습니다."
 HAS_JUMP_DRIVE:0 "§Y[This.GetName]§!이 §Y점프 드라이브§! 기술을 보유하고 있습니다."
 HAS_PSI_DRIVE:0 "§Y[This.GetName]§!이 §Y사이오닉 드라이브§! 기술을 보유함."
 HAS_NO_DRIVE:0 "§Y[This.GetName]§!에 초광속 기술이 없습니다."
 tb_enemy:0 "£blocker£  적대 국가"
 tb_enemy_desc:0 "이 지역에는 우리와 근본적인 가치관이 너무나 다른 동족들이 살고 있어, 차라리 외계인과 더 공통점이 많을지도 모릅니다."
 tb_2nd_enemy:0 "£blocker£  적대적 유기체 종족"
 tb_2nd_enemy_desc:0 "이 지역은 우리와 다른 유기 생명체가 지배합니다."
 machine_primitive:0 "개조 작업 로봇 부대"
 machine_primitive_plural:0 "개조 작업 로봇 부대"
 machine_primitive_desc:0 "전쟁을 위해 용도를 바꾸고 개조한 산업 기계입니다. 목표를 끈질기게 추구하며 유기체 전투 부대를 괴롭히는 사기 저하의 파괴적인 영향도 받지 않습니다."
 PrimPlayer_gov_pre_industrial_age:0 "산업화 이전 시대"
 PrimPlayer_gov_pre_industrial_age_desc:0 "이 문명은 산업화 이전 시대에 머물러 있으며, 별들을 향해 나아가려면 아직 오랜 시간이 필요합니다."
 PrimPlayer_gov_industrial_age:0 "산업 시대"
 PrimPlayer_gov_industrial_age_desc:0 "이 문명은 초기 산업 시대에 돌입했습니다. 전기와 내연 기관은 점차 상용화되고 있고, 도시화가 급속도로 진행되고 있습니다."
 PrimPlayer_gov_machine_age:0 "기계 시대"
 PrimPlayer_gov_machine_age_desc:0 "이 문명은 후기 산업 시대로 여겨지는 기계 시대에 돌입했습니다. 공장에서 제품과 차량이 대량 생산되고, 항공 여행이 보편화되고 있습니다."
 PrimPlayer_gov_atomic_age:0 "원자력 시대"
 PrimPlayer_gov_atomic_age_desc:0 "이 문명은 원자력 시대에 해당하는 수준까지 발전했습니다. 원자의 힘을 활용하지만 아직 우주에는 진출하지 못했습니다. 핵무기가 널리 퍼져 있을 수 있으며, 갑작스러운 멸종 사건을 초래할 수도 있습니다."
 PrimPlayer_gov_early_space_age:0 "초기 우주 시대"
 PrimPlayer_gov_early_space_age_desc:0 "이 문명은 초기 우주 시대에 돌입했습니다. 원시적인 인공위성이 모성 주변을 돌고 있고, 최초의 유인 우주선이 저궤도 운행에 성공했습니다. 곧 모성을 떠날 준비가 될 것입니다."
 origin_primitive_player_pre_industrial_age:0 "산업화 이전 시대"
 origin_primitive_player_pre_industrial_age_desc:0 "이 문명은 산업화 이전 시대에 머물러 있으며, 별들을 향해 나아가려면 아직 오랜 시간이 필요합니다."
 origin_primitive_player_pre_industrial_age_negative_effects:0 "['concept_advanced_empires', 발전된 AI 제국] 최소 하나 보장\n다음 시대의 시작 기술 미보유:\n-산업 시대\n-기계 시대\n-원자력 시대\n-초기 우주 시대\n-우주 시대"
 set_origin_primitive_player_pre_industrial_age:0 "기원을 §Y산업화 이전 시대§!로 설정"
 origin_primitive_player_industrial_age:0 "산업 시대"
 origin_primitive_player_industrial_age_desc:0 "이 문명은 초기 산업 시대에 돌입했습니다. 전기와 내연 기관은 점차 상용화되고 있고, 도시화가 급속도로 진행되고 있습니다."
 origin_primitive_player_industrial_age_negative_effects:0 "최소 하나의 ['concept_advanced_empires', 발전된 AI 제국] 보장\n다음 시대의 시작 기술이 없음:\n-기계 시대\n-원자력 시대\n-초기 우주 시대\n-우주 시대"
