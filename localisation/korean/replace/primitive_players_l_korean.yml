 PrimPlayer_unified_planet_situation_stage_1:0 "§H$tech_primitive_unified_planet$§!을 수립하는 동안 §Y무작위 사건§!이 발생할 수 있습니다"
 PrimPlayer_unified_planet_situation_modifier_tooltip:0 "§G낮은 확률§!로 §H$tech_subspace_drive$§! 기술 잠금 해제\n\n제국이 행성을 통합하는 동안 §H파벌§!들이 형성됩니다."
