 primitive_origin.114.name:0 "$PrimPlayer_civic_the_obelisk$"
 primitive_origin.114.desc:0 "오벨리스크는 세월에도 손상되지 않은 채 이 나라 위로 우뚝 서 있습니다.\n\n지금까지 알려진 어떤 물질도 오벨리스크의 외장 장갑을 뚫지 못했지만, 내부에서는 열과 진동이 느껴집니다. 측면에는 기묘한 표식이 새겨져 있고, 그 어떤 외계학자도 이 외계 문자를 해독하지 못했습니다... 아직은 말입니다."
 primitive_origin.114.first_contact_proactive:0 "이 오벨리스크의 기원을 알아내야 한다!"
 primitive_origin.114.first_contact_cautious:0 "이 오벨리스크를 경계해야 한다."
 primitive_origin.114.first_contact_attack_allowed:0 "이 오벨리스크는 파괴하는 편이 낫겠다."
 primitive_origin.115.name:0 "MSI, 하늘로 향하는 여러분의 사다리"
 primitive_origin.115.desc:0 "§H[This.ContactCountry.GetRealName]§!의 대표단이 우호를 제안하며 우리 사절에게 접근했습니다!\n\n그 기업의 사절은 우리의 '원시적인' 생활을 바꿀 더 나은 삶을 제안했습니다. 눈부신 빛과 함께 선보인 §H계몽 기술§!은 우리 세계를 우주 시대에 걸맞은 사회로 완전히 바꾸어 놓을 것이라고 합니다. 서명란에 간단히 서명만 하면 MSI가 설비 투자에 필요한 대출을 제공할 수 있습니다. 재정 고문들은 새로운 자본 투자와 끝없이 쏟아질 신상품의 전망에 들떠 있습니다.\n\n선의의 증거로, 그들은 모든 재앙으로부터 우리 행성을 보호하는 서비스를 무료로 체험하게 해 주겠다고 합니다."
 primitive_origin.115.first_contact_proactive:0 "무료 체험으로 무엇을 얻을 수 있는지 보자!"
 primitive_origin.115.first_contact_cautious:0 "장사꾼을 섣불리 믿어서는 안 된다."
 primitive_origin.115.first_contact_attack_allowed:0 "우리는 여기에 관여하지 않겠다!"
 primitive_origin.124.name:0 "오벨리스크의 희생자"
 primitive_origin.124.desc:0 "통신팀이 §H오벨리스크 사회§!의 모성을 찾아냈으며 조난 신호를 발신하기 위해 대기 중입니다. 외교 사절들 역시 첫 접촉 절차를 개시할 준비가 되어 있습니다."
 primitive_origin.124.a:0 "그들에게 경고해야 한다!"
 primitive_origin.125.name:0 "조난 신호 전송"
 primitive_origin.125.desc:0 "§H오벨리스크 사회§!로 조난 신호를 성공적으로 전송했습니다. §R압제자 $NAME_MSI_country_initials$§!에 대한 경고를 새겨듣기를 바랍니다..."
 primitive_origin.125.a:0 "이들을 우리 §H성간 동맹§!에 초대하라. 투쟁의 동지들이다."
 primitive_origin.125.b:0 "경고는 하되 독립을 보장하지는 마라."
 primitive_origin.134.name:0 "오벨리스크의 희생자"
 primitive_origin.134.desc:0 "통신팀이 §H오벨리스크 사회§!의 모성을 찾아냈으며 조난 신호를 발신하기 위해 대기 중입니다. 외교 사절들 역시 첫 접촉 절차를 개시할 준비가 되어 있습니다."
 primitive_origin.134.a:0 "그들에게 경고해야 한다!"
 primitive_origin.135.name:0 "조난 신호 전송"
 primitive_origin.135.desc:0 "§H오벨리스크 사회§!로 조난 신호를 성공적으로 전송했습니다. §R압제자 $NAME_MSI_country_initials$§!에 대한 경고를 새겨듣기를 바랍니다..."
 primitive_origin.135.a:0 "이들을 우리 §H성간 동맹§!에 초대하라. 투쟁의 동지들이다."
 primitive_origin.135.b:0 "경고는 하되 독립을 보장하지는 마라."
 primitive_origin.144.name:0 "조난 신호"
 primitive_origin.144.desc:0 "통신팀이 §H성간 발신원§!에서 온 기묘한 §Y조난 신호§!를 포착했습니다. 연결을 안정화하고 그 수수께끼 신호의 내용을 수신할 인력이 대기 중입니다."
 primitive_origin.144.first_contact_proactive:0 "연결을 안정화하고 무슨 말인지 들어 보자."
 primitive_origin.144.first_contact_cautious:0 "그런 일을 겪었으니 신중해야 한다."
 primitive_origin.144.first_contact_attack_allowed:0 "조난 신호를 무시하라. 함정일 수 있다."
 primitive_origin.145.name:0 "공통의 기원"
 primitive_origin.145.desc:0 "§Y<조난 신호 분석 완료... 음성 파일 불러오는 중>§!\n\n여보세요...? 들립니까! 우리는 §H족쇄를 끊고§! §R$NAME_MSI_country$§!에서 해방되었습니다. 모든 일은 모성에서 발견된 §R수수께끼의 오벨리스크§!로부터 시작되었습니다... 그것이 $NAME_MSI_country_initials$의 향후 착취를 위해 초광속 이전 사회를 감시하는 장치였다는 진실을 너무 늦게 알아버렸습니다.\n\n우리의 목표는 §H성간 연방§!을 결성하여 이 식민 압제자를 은하에서 몰아내는 것입니다! 우리의 대의에 동참하겠습니까?"
 primitive_origin.145.first_contact_proactive:0 "함께라면 MSI에 맞서 싸울 수 있다!"
 primitive_origin.145.first_contact_cautious:0 "그런 일을 겪었으니 신중해야 한다."
 primitive_origin.145.first_contact_attack_allowed:0 "우리는 여기에 관여하지 않겠다!"
 primitive_origin.154.name:0 "조난 신호"
 primitive_origin.154.desc:0 "통신팀이 §H성간 발신원§!에서 온 기묘한 §Y조난 신호§!를 포착했습니다. 연결을 안정화하고 그 수수께끼 신호의 내용을 수신할 인력이 대기 중입니다."
 primitive_origin.154.first_contact_proactive:0 "연결을 안정화하고 무슨 말인지 들어 보자."
 primitive_origin.154.first_contact_cautious:0 "신중하게 진행해야 한다."
 primitive_origin.154.first_contact_attack_allowed:0 "조난 신호를 무시하라. 함정일 수 있다."
 primitive_origin.155.name:0 "오벨리스크의 숨겨진 목적"
 primitive_origin.155.desc:0 "§Y<조난 신호 분석 완료... 음성 파일 불러오는 중>§!\n\n여보세요...? 들립니까! 우리는 §H족쇄를 끊고§! §R$NAME_MSI_country$§!에서 해방되었습니다. 모든 일은 모성에서 발견된 §R수수께끼의 오벨리스크§!로부터 시작되었습니다... 그것이 $NAME_MSI_country_initials$의 향후 착취를 위해 초광속 이전 사회를 감시하는 장치였다는 진실을 너무 늦게 알아버렸습니다.\n\n우리의 목표는 §H성간 연방§!을 결성하여 이 식민 압제자를 은하에서 몰아내는 것입니다! 우리의 대의에 동참하겠습니까?"
 primitive_origin.155.first_contact_proactive.msi_contact:0 "함께라면 MSI에 맞서 싸울 수 있다!"
 primitive_origin.155.first_contact_proactive:0 "오벨리스크가 MSI의 감시 장치였다고?! 우리도 함께하겠다!"
 primitive_origin.155.first_contact_cautious:0 "지금 결정하기에는 너무 이르다."
 primitive_origin.155.first_contact_attack_allowed:0 "우리는 여기에 관여하지 않겠다!"
 primitive_origin.4010.name:0 "청구서"
 primitive_origin.4010.desc:0 "스스로 추진하는 작은 보관함이 모성계 외곽에 진입하여 신호기로 요란하게 도착을 알렸습니다. 회수한 보관함에는 끔찍한 내용이 들어 있었습니다. 지난 §Y20년§!간 우리가 누려온 모든 §R계몽 자산§!을 상세히 기록한 긴 목록으로, §Y유전자 클리닉§!을 방문한 모든 환자의 §R의료비 청구서§!까지 포함되어 있었습니다.\n\n곧 채권 추심 업체가 정산을 위해 연락할 예정입니다."
 uplifting_invoice:0 "계몽 청구서"
 uplifting_invoice_desc_short:0 "$NAME_MSI_country$에서 보낸 계몽 서비스 청구서"
 uplifting_invoice_desc_details:0 "성간 신용 관리 회사가 작성한 이 목록에는 [this.GetName]이 20년 동안 누린 모든 계몽 자산이 상세히 기록되어 있습니다. 유전자 클리닉을 방문한 모든 환자의 진료비까지 포함되어 있습니다. 이른바 '선의의 기업'은 이 비용을 상환하라고 요구하며, [this.GetAdjective] 영역의 계몽 자산에 손대는 것조차 추가 계약 위반이라고 주장합니다."
 payback_out_of_warranty_chain_title:0 "보증 만료"
 payback_out_of_warranty_chain_desc:0 "$NAME_MSI_country_initials$가 건설해 준 §Y$building_medical_2$§!는 정비 부족으로 문제가 생기고 있습니다. 대부분의 기술은 현재 우리의 이해를 뛰어넘지만, §S수리§!를 시도할 수는 있습니다.\n\n§L다른 제국과 연구 협약을 체결하면 성공 확률이 높아집니다. [GetAgreementStatus]§!"
 payback_repair_clinic_no_agreement:0 "우리를 도와줄 수 있는 제국과 연구 협약을 맺지 않았습니다."
 payback_repair_clinic_yes_agreement:0 "우리를 도와줄 수 있는 제국과 하나 이상의 연구 협약을 맺었습니다."
 payback_declining_healthcare:0 "의료 수준 저하"
 payback_declining_healthcare_desc:0 "$building_medical_2$가 없어지자 삶의 질이 크게 떨어졌습니다."
 payback_declining_healthcare_alt:0 "대체 의학"
 payback_declining_healthcare_alt_desc:0 "비타민 챙겨 먹는 거 잊지 마세요!"
 payback_declining_healthcare_necro:0 "$payback_declining_healthcare$"
 payback_declining_healthcare_necro_desc:0 "$payback_declining_healthcare_desc$ 망자들의 질도 높아졌습니다."
 payback_healing_scars:0 "옛 상처의 치료"
 payback_healing_scars_desc:0 "이와 같은 외계 의료 시설을 없애야만, 우리는 진정으로 치유될 수 있습니다."
 primitive_origin.4300.name:0 "보증 만료"
 primitive_origin.4300.base.desc:0 "\"질병을 끝내드리겠습니다.\"\n\n$NAME_MSI_country_initials$는 이렇게 우리를 설득했습니다. 우리는 그들이 [Root.GetHomeWorldName]에 §Y$building_medical_2$§!를 짓도록 허용했고, 한 세대 만에 가장 끔찍한 질병 대부분이 사라졌습니다. 이제 수년간의 과도한 사용으로 내부 기계들이 멈춰 서면서 병원들이 고장 나고 있습니다. $NAME_MSI_country_initials$의 기술을 제대로 작동시키는 법은 우리 능력 밖입니다. 역설계할 수 있을까요? 아니면 이 독이 든 선물을 진정으로 우리 것인 무언가로 바꾸어야 할까요?\n"
 primitive_origin.4300.aliens.phobe.desc:0 "$primitive_origin.4300.base.desc$다른 제국에 비슷한 시설이 있을지도 모르지만, 외계종에게 도움을 청하면 수치만 당할 뿐입니다."
 primitive_origin.4300.aliens.phile.desc:0 "$primitive_origin.4300.base.desc$다른 제국에도 비슷한 시설이 있을지 모릅니다. 도움을 요청해야 합니다."
 primitive_origin.4300.noaliens.desc:0 "$primitive_origin.4300.base.desc$ 좀 더 많이 알고 있었다면 좋았을 텐데. "
 primitive_origin.4300.a:0 "$building_medical_2$ 수리를 시도하라."
 primitive_origin.4300.a.tooltip:0 "행성 화면에서 §Y$building_medical_2$§!를 선택한 뒤 §S수리§! 버튼을 클릭해 수리를 시도하십시오. 다른 제국과 §S연구 협약§!을 맺으면 수리에 성공할 확률이 높아집니다."
 primitive_origin.4300.b:0 "$building_medical_2$를 개조하세요."
 primitive_origin.4300.b.tooltip:0 "적은 비용을 들여 §Y$building_medical_2$§!를 §Y$building_autochthon_monument$§!로 바꿉니다."
 primitive_origin.4300.b.memorialist.tooltip:0 "적은 비용을 들여 §Y$building_medical_2$§!를 §Y$building_galactic_memorial_1$§!로 바꿉니다."
 primitive_origin.4301.name:0 "긴급 수리"
 primitive_origin.4301.base.desc:0 "$NAME_MSI_country_initials$는 그저 운이 좋았을 뿐이라거나, 대부분의 일은 자신들이 했다고 주장할 것입니다. 우리가 방금 해낸 §Y$building_medical_2$§! 기술의 역설계가 대단한 성과가 아니라고 말하겠지요."
 primitive_origin.4301.noagreement.desc:0 "$primitive_origin.4301.base.desc$ 하지만 우리는 그들의 도움 없이도 해냈으며, 이 승리는 오롯이 우리의 것입니다."
 primitive_origin.4301.agreement.desc:0 "$primitive_origin.4301.base.desc$ 하지만 관대한 동맹국들의 전문 지식에 힘입어 결국 해냈습니다."
 primitive_origin.4301.a:0 "어쩌면... 외계종이라고 다 나쁜 건 아닐지도?"
 primitive_origin.4301.end.desc:0 "우리도 자기 앞가림 정도는 알아서 합니다."
 primitive_origin.4302.name:0 "수리할 권리"
 primitive_origin.4302.desc:0 "§Y$building_medical_2$§!에 적용된 기술을 역설계하는 작업은 예상보다 까다로운 것으로 드러났지만, 우리 [root.GetEngineerPlural]들은 희망을 놓지 않았습니다. 단지 시간이 더 필요할 뿐이라고 합니다. 하지만 실패가 거듭되고 비용이 늘어만 가자, 진료소를 다른 목적으로 쓸 수 있도록 개조해야 한다는 목소리가 나오고 있습니다."
 primitive_origin.4302.a:0 "실패하더라도, 이번에는 더 나아지도록."
 primitive_origin.4302.a.tooltip:0 "$origin.4300.a.tooltip$"
 primitive_origin.4302.b:0 "$origin.4300.b$"
 primitive_origin.4302.b.tooltip:0 "$origin.4300.b.tooltip$"
 primitive_origin.4302.b.memorialist.tooltip:0 "$origin.4300.b.memorialist.tooltip$"
 primitive_origin.4303.name:0 "수리 실패"
 primitive_origin.4303.desc:0 "§Y$building_medical_2$§! 수리 시도는 실패로 끝났습니다. 거대한 폭발이 건물을 집어삼켰고, 수많은 사상자가 보고되었습니다.\n\n$NAME_MSI_country_initials$는 분명 우리를 오만하고 어리석으며 준비도 안 된 자들이라 비웃고 있을 것입니다. 하지만 이 실패는 우리의 것이며, 뼈아픈 교훈은 잊히지 않을 것입니다."
 primitive_origin.4304.name:0 "재정비된 하드웨어"
 primitive_origin.4304.desc:0 "§Y$building_medical_2$§!에는 더 이상 질병을 치료할 힘이 없을지 모릅니다. 하지만 부품을 제거하고 기념관으로 바꾸면, 적어도 $NAME_MSI_country_initials$가 남긴 상처를 치유하기 시작할 수 있습니다. 과거와 화해함으로써 이를 극복하는 법을 배울 수 있습니다."
 primitive_origin.4305.name:0 "의료 위기"
 primitive_origin.4305.desc:0 "§Y$building_medical_2$§!를 잃으면서 의료의 질이 급격히 떨어졌습니다. 한때 쉽게 치료하던 유전 질환과 만성 질환이 다시 늘어나고 기대 수명의 중앙값도 점령 이전 수준으로 돌아갔습니다. 의료 체계에 대한 대중의 신뢰가 최저점으로 떨어졌으며, 일부는 $NAME_MSI_country_initials$가 떠난 것을 아쉬워하기까지 합니다."
 primitive_origin.4305.a:0 "의료 연구 투자비를 두 배로 늘리세요."
 primitive_origin.4305.a.tooltip:0 "§Y$tech_frontier_health$§! 기술을 발견할 확률이 증가합니다."
 primitive_origin.4305.b:0 "대체 치료법을 권장하세요."
 primitive_origin.4305.b.tooltip:0 "아무런 효과가 없습니다."
 primitive_origin.4305.c:0 "죽음 따윈 애초에 문제가 아닙니다."
 primitive_origin.4306.name:0 "자급자족"
 primitive_origin.4306.desc:0 "유전 공학의 비밀을 통달한 우리 민족은 이제 $NAME_MSI_country_initials$가 남긴 것과 같은 §Y$building_medical_2$§!를 건설할 수 있습니다. 우리 민족에게 영광스러운 날입니다. 별들에 닿기 위해 누군가 [root.species.GetHandName]을 잡아 줄 필요가 없다는 증거니까요."
 building_msi_uplift_center:0 "계몽 센터"
 building_msi_uplift_center_desc:0 "계몽은 무료가 아닐 수 있습니다. 하지만 $NAME_MSI_country_initials$의 계몽은 언제나 그만한 값어치를 합니다."
 preftl_action_trade_pact_msi:0 "MSI 계몽 체험"
 preftl_action_trade_pact_msi_desc:0 "$NAME_MSI_country_initials$의 호화로운 계몽 서비스를 무료 체험 기간 동안 즐겨 주십시오. 언제나 비용만큼의 가치가 있습니다."
 preftl_action_trade_pact_msi_tooltip:0 "§H$NAME_MSI_country_initials$§!의 £building£ §Y지사§! 설립 허용"
 primitive_origin.116.name:0 "정식 외교 관계 수립"
 primitive_origin.116.desc:0 "외계 언어 전문가들과 회동한 뒤 언어 장벽은 빠르게 무너졌고, 우리와 §H[This.ContactCountry.GetRealName]§! 사이에 외교 관계가 수립되었습니다."
 primitive_origin.116.first_contact_proactive:0 "MSI가 이끌어주니 우리의 미래는 밝다!"
 primitive_origin.116.first_contact_cautious:0 "MSI는 평화로워 보이지만 경계해야 한다."
 primitive_origin.116.first_contact_attack_allowed:0 "첩자를 파견하라. 그들의 의도를 알아내야 한다."
 d_PrimPlayer_the_obelisk_deposit:0 "오벨리스크"
 d_PrimPlayer_the_obelisk_deposit_desc:0 "이 나라에는 기묘한 오벨리스크가 세월에도 훼손되지 않은 채 우뚝 서 있습니다. 누군가는 숭배하고 누군가는 연구하려 하지만, 결국 모두가 묻습니다... 왜 이곳에 있는 것일까요?"
 PrimPlayer_the_obelisk:0 "오벨리스크"
 PrimPlayer_the_obelisk_desc:0 "이 나라에는 기묘한 오벨리스크가 세월에도 훼손되지 않은 채 우뚝 서 있습니다. 누군가는 숭배하고 누군가는 연구하려 하지만, 결국 모두가 묻습니다... 왜 이곳에 있는 것일까요?"
 PrimPlayer_obelisk_victim:0 "오벨리스크의 희생자"
 PrimPlayer_BrokenShackles:0 "조난 신호"
 PrimPlayer_civic_star_gazers:0 "별바라기"
 PrimPlayer_civic_star_gazers_desc:0 "이 나라는 별에 큰 의미를 두며, 저 너머에 무엇이 있는지 묻습니다."
 PrimPlayer_civic_symbiotic_presapients:0 "공생하는 준지성체"
 PrimPlayer_civic_symbiotic_presapients_desc:0 "이 국가의 종족과 함께 진화한 준지성체 종족이 사회의 여러 분야에서 도움을 주고 있습니다.\n\n§R이벤트로만 교체할 수 있습니다. 정부 윤리관에 따라§! §Y공생 동반자§! §R또는§! §Y노예 종족§!§R으로 업그레이드됩니다!§!"
 PrimPlayer_civic_trading_nation:0 "무역 국가"
 PrimPlayer_civic_trading_nation_desc:0 "이 국가는 상인 계급의 성장을 받아들였습니다.\n\n§Y원자력 시대§!§R까지 제거할 수 없습니다§!§R!§!"
 PrimPlayer_civic_environmental_synergy:0 "자연과의 상생"
 PrimPlayer_civic_environmental_synergy_desc:0 "이 나라는 자연 및 자연 경관과의 조화를 받아들였습니다.\n\n§Y원자력 시대§!§R까지 제거할 수§! §R없습니다!§!"
 d_PrimPlayer_nation_deposit:0 "수도"
 d_PrimPlayer_nation_deposit_desc:0 "이 신생 국가가 별들을 향한 여정을 시작한 곳입니다."
 has_absorbed_nation_tooltip:0 "\n\n§R(!) 국민 국가는 접촉 메뉴(F10)에서 확인할 수 있습니다.§!"
 has_absorbed_ethic_fanatic_authoritarian_nation:0 "§H권위주의 국가§!를 §Y연합에 편입§!하거나 §Y제거§!함$has_absorbed_nation_tooltip$"
 d_ethic_fanatic_authoritarian_nation_blocker:0 "광적인 권위주의 국가"
 d_ethic_fanatic_authoritarian_nation_blocker_desc:0 "이 권위주의 국가는 친애하는 지도자를 위해 국토의 부를 쌓아둡니다."
 has_absorbed_ethic_fanatic_egalitarian_nation:0 "§H평등주의 국민 국가§!를 §Y연합에 통합§!하거나 §Y제거§!함$has_absorbed_nation_tooltip$"
 d_ethic_fanatic_egalitarian_nation_blocker:0 "광적인 평등주의 국가"
 d_ethic_fanatic_egalitarian_nation_blocker_desc:0 "이 평등주의 국가는 모두가 토지를 이용할 수 있도록 보장하지만, 그 원칙은 국경 안에서만 적용됩니다."
 has_absorbed_ethic_fanatic_xenophobe_nation:0 "§H외계종 혐오 국민 국가§!를 §Y연합에 편입§!하거나 §Y제거§!함$has_absorbed_nation_tooltip$"
 d_ethic_fanatic_xenophobe_nation_blocker:0 "광적인 외계종 혐오 국가"
 d_ethic_fanatic_xenophobe_nation_blocker_desc:0 "이 외계종 혐오 국가는 외부와의 접촉을 피하며, 국경을 닫은 채 고립되어 있습니다."
 has_absorbed_ethic_fanatic_xenophile_nation:0 "§H외계종 선호 국가§!를 §Y연합에 편입§!하거나 §Y제거§!함$has_absorbed_nation_tooltip$"
 d_ethic_fanatic_xenophile_nation_blocker:0 "광적인 외계종 선호 국가"
 d_ethic_fanatic_xenophile_nation_blocker_desc:0 "이 외계종 선호 국가는 협상에는 상당히 개방적이지만, 영토를 개발할 권리는 자신들에게 있다고 여깁니다."
 has_absorbed_ethic_fanatic_militarist_nation:0 "§H군국주의 국민 국가§!를 §Y연합에 통합§!하거나 §Y제거§!함$has_absorbed_nation_tooltip$"
 d_ethic_fanatic_militarist_nation_blocker:0 "광적인 군국주의 국가"
 d_ethic_fanatic_militarist_nation_blocker_desc:0 "이 군국주의 국가는 영토 한 치도 내주지 않기 위해 필사적으로 싸울 것입니다."
 has_absorbed_ethic_fanatic_pacifist_nation:0 "§H평화주의 국가§!를 §Y연합에 편입§!하거나 §Y제거§!함$has_absorbed_nation_tooltip$"
 d_ethic_fanatic_pacifist_nation_blocker:0 "광적인 평화주의 국가"
 d_ethic_fanatic_pacifist_nation_blocker_desc:0 "이 평화로운 국가는 자신의 땅을 돌보며, 독립을 유지하면서 다른 나라들과 협력하기만을 바랍니다."
 has_absorbed_ethic_fanatic_spiritualist_nation:0 "§H정신주의 국민 국가§!를 §Y연합에 편입§!하거나 §Y제거§!함$has_absorbed_nation_tooltip$"
 d_ethic_fanatic_spiritualist_nation_blocker:0 "광적인 정신주의 국가"
 d_ethic_fanatic_spiritualist_nation_blocker_desc:0 "이 정신주의 국가는 자신들의 땅이 신성하며 오직 신자들과만 나눌 수 있다고 선언했습니다."
 has_absorbed_ethic_fanatic_materialist_nation:0 "§H물질주의 국민 국가§!를 §Y연합에 편입§!하거나 §Y제거§!함$has_absorbed_nation_tooltip$"
 d_ethic_fanatic_materialist_nation_blocker:0 "광적인 물질주의 국가"
 d_ethic_fanatic_materialist_nation_blocker_desc:0 "이 물질주의 국가는 자기 영토의 모든 지질학적 발견을 이해하고 정복하려 합니다. 연구 결과를 공유하지는 않을 것입니다."
 has_absorbed_ethic_fanatic_green_nation:0 "§H생태주의 국가§!를 §Y연합에 편입§!하거나 §Y제거§!함$has_absorbed_nation_tooltip$"
 d_ethic_fanatic_green_nation_blocker:0 "광적인 생태주의 국가"
 d_ethic_fanatic_green_nation_blocker_desc:0 "이 환경주의 국가는 대지와의 조화를 추구하며 다른 국가의 착취로부터 자연을 보호합니다."
 has_absorbed_ethic_fanatic_industrial_nation:0 "§H산업주의 국가§!를 §Y연합에 편입§!하거나 §Y제거§!함$has_absorbed_nation_tooltip$"
 d_ethic_fanatic_industrial_nation_blocker:0 "광적인 산업주의 국가"
 d_ethic_fanatic_industrial_nation_blocker_desc:0 "이 산업주의 국가는 토지를 개발하고 그 부를 쥐어짜 경제의 동력으로 삼으려 합니다."
 has_absorbed_ethic_fanatic_socialism_nation:0 "§H협동주의 국민 국가§!를 §Y연합에 편입§!하거나 §Y제거§!함$has_absorbed_nation_tooltip$"
 d_ethic_fanatic_socialism_nation_blocker:0 "광적인 협동주의 국가"
 d_ethic_fanatic_socialism_nation_blocker_desc:0 "이 협동주의 국가는 땅 위에서 공동체 생활을 하며, 그 혜택을 국경 안의 모든 이와 나눕니다."
 has_absorbed_ethic_fanatic_capitalism_nation:0 "§H경쟁주의 국가§!를 §Y연합에 편입§!하거나 §Y제거§!함$has_absorbed_nation_tooltip$"
 d_ethic_fanatic_capitalism_nation_blocker:0 "광적인 경쟁주의 국가"
 d_ethic_fanatic_capitalism_nation_blocker_desc:0 "이 경쟁주의 국가는 국경 안의 모든 땅을 구획했으며 결코 다른 국가와 나누려 하지 않습니다."
 personality_PrimPlayer_ethic_fanatic_nation:0 "원시 국가"
 personality_PrimPlayer_ethic_fanatic_nation_megacorp:0 "원시 거대 기업"
 personality_PrimPlayer_ethic_fanatic_nation_desc:0 "우리 모성에 함께 사는 국가입니다. 별에 도달하여 성간 제국이 되기를 열망합니다."
 personality_PrimPlayer_ethic_fanatic_nation_megacorp_desc:0 "모성의 상당 부분을 소유한 거대 기업입니다. 성간 무역 제국이 되어 별들 사이에서 교역하기를 갈망합니다."
 personality_PrimPlayer_ethic_fanatic_nation_nomadic:0 "유목 원시 국가"
 personality_PrimPlayer_ethic_fanatic_nation_nomadic_desc:0 "우리 방주선에 함께 살면서 유일한 소유자가 되기 위해 경쟁하는 국가입니다."
 personality_PrimPlayer_ethic_fanatic_nation_nomadic_megacorp:0 "유목 원시 거대 기업"
 personality_PrimPlayer_ethic_fanatic_nation_nomadic_megacorp_desc:0 "우리 방주선의 상당 부분을 소유하고 있으며 추가 인수를 꿈꾸는 거대기업입니다."
 PrimPlayer_operation_locate_strategic_targets:0 "전략 자산 첩보 활동"
 PrimPlayer_operation_locate_strategic_targets_desc:0 "우리 공작원들이 §Y[This.Target.GetName]§! 내부 전략 자산의 위치 정보를 수집하고, 완료되면 §Y정보§! 보고서를 제출합니다. 군사 기반 시설과 같은 잠재적인 전략 자산의 위치도 밝혀내며, 오랫동안 §Y최대 침투 수준§!이 증가합니다.\n\n이 작전에 §Y자산§!을 배정하면 결과가 해당 자산의 관심 분야에 치우칠 수 있습니다."
 PrimPlayer_operation_locate_strategic_targets_no_dlc_desc:0 "공작원들이 §Y[This.Target.GetName]§! 내 전략 자산의 위치 정보를 수집하여 완료 시 §Y정보§! 보고서를 제출합니다. 군사 기반 시설 등 잠재적인 전략 자산의 위치도 밝혀내며, 오랫동안 §Y최대 침투 수준§!을 높입니다."
 PrimPlayer_operation_locate_strategic_targets_on_success:0 "$IF_SUCCESSFUL|E$\n[root.target.GetName]에 대한 정보와 최대 침투 수준이 증가합니다."
 PrimPlayer_operation_locate_strategic_targets_no_dlc_desc.nuclear:0 "우리 공작원들이 §Y[This.Target.GetName]§!의 전략 자산 위치에 관한 정보를 수집하고, 완료 시 §Y정보§! 보고서를 제출하여 §Y최대 침투 수준§!을 더욱 높일 것입니다. 또한 군사 기반 시설 같은 전략 자산의 위치를 밝혀 §Y핵 자산§!에 대한 §G선제 타격§!을 가능하게 합니다."
 PrimPlayer_operation_locate_strategic_targets_on_success.nuclear:0 "$IF_SUCCESSFUL|E$\n[root.target.GetName]의 전략 자산에 관한 정보와 §Y최대 침투 수준§!을 얻어, §Y핵 자산§!에 §G선제 공격§!을 할 수 있습니다."
 PrimPlayer_operation_locate_strategic_targets_10:0 "$PrimPlayer_operation_locate_strategic_targets$"
 PrimPlayer_operation_locate_strategic_targets_20:0 "$PrimPlayer_operation_locate_strategic_targets$"
 PrimPlayer_operation_locate_strategic_targets_30:0 "$PrimPlayer_operation_locate_strategic_targets$"
 PrimPlayer_operation_locate_strategic_targets_40:0 "$PrimPlayer_operation_locate_strategic_targets$"
 EaC_operation.7000.desc:0 "공작원들이 전략 자산의 위치 파악 작전을 완료하고 조사 결과를 상세히 담은 서류를 보냈습니다."
 EaC_operation.7000.a:0 "임무를 완수했습니다."
 PrimPlayer_operation_steal_technology:0 "기술 절도"
 PrimPlayer_operation_steal_technology_desc:0 "우리 요원들이 연구소와 연구 체계에 침투해, 우리 과학자들이 찾고 있던 답을 제공할 것입니다."
 PrimPlayer_operation_steal_technology_on_success:0 "$IF_SUCCESSFUL|E$\n아직 연구하지 않은 기술 하나를 무작위로 획득하며, 해당하는 기술이 없으면 일정량의 연구를 얻습니다."
 PrimPlayer_operation_steal_technology_enigmatic_engineering:0 "$TRIGGER_FAIL$ §R상대의 기술과 연구 방법을 우리가 해독할 수 없게 되었습니다.§!"
 PrimPlayer_operation_steal_technology_too_recent:0 "$TRIGGER_FAIL$ §R상대의 연구 시설에 다시 침투하려면 최소 §Y[Root.recently_stole_technology]§!까지 기다려야 합니다.§!"
 PrimPlayer_operation_acquire_asset:0 "자산 획득"
 PrimPlayer_operation_acquire_asset_desc:0 "대가를 지불하고 정보 작전에 유용할 만한 요원 및 기타 자산을 유혹과 협박으로 모집할 수 있습니다.\n\n이 작전에 §Y자산§!을 배정하면, 이들의 이해관계에 따라 결과가 달라질 수 있습니다."
 PrimPlayer_operation_acquire_asset_on_success:0 "$IF_SUCCESSFUL|E$\n이 첩보망에서 사용할 자산을 획득합니다."
 PrimPlayer_operation_sleeper_cells:0 "잠복 조직 준비"
 PrimPlayer_operation_sleeper_cells_desc:0 "현재 정보 요원들을 달리 긴급하게 투입해야 할 곳이 있지만, 신중히 준비한다면 향후 필요할 때를 대비해 첩보망의 대부분을 보존할 수 있습니다."
 PrimPlayer_operation_sleeper_cells_on_success:0 "$IF_SUCCESSFUL|E$\n이 첩보망 내 활동을 중단해, $role_spymaster$을 재배정할 수 있게 하고 $INFILTRATION_LEVEL$이 감소하는 것을 방지합니다."
 PrimPlayer_operation_smear_campaign:0 "비방 활동"
 PrimPlayer_operation_smear_campaign_desc:0 "노련한 요원들은 우리 제국이 조작한 진실을 퍼뜨릴 수 있으며, 아무리 돈독한 관계라도 훼손할 수 있습니다."
 PrimPlayer_operation_smear_campaign_on_success:0 "$IF_SUCCESSFUL|E$\n[root.target.GetName]과 다른 한 제국 사이의 관계를 악화시킵니다."
 PrimPlayer_operation_extort_favors:0 "호의 강탈"
 PrimPlayer_operation_extort_favors_desc:0 "협박과 갈취를 동원하면 우리 외교 사절에게 유용한 협상 수단을 마련할 수 있습니다."
 PrimPlayer_operation_extort_favors_on_success:0 "$IF_SUCCESSFUL|E$\n[root.target.GetName]에게서 호의를 하나 이상 획득합니다."
 PrimPlayer_operation_gather_information:0 "정보 수집"
 PrimPlayer_operation_gather_information_desc:0 "우리 요원들이 §Y[This.Target.GetName]§!에 대한 정보를 종합해, 완성된 §Y정보§! 보고서를 전달합니다. 또한, 이는 취약점을 노출시켜 한동안 우리 제국의 §Y최대 침투 수준§!이 증가합니다.\n\n이 작전에 §Y자산§!을 배정하면, 이들의 이해관계에 따라 결과가 달라질 수 있습니다."
 PrimPlayer_operation_gather_information_no_dlc_desc:0 "우리 요원들이 §Y[This.Target.GetName]§!에 대한 정보를 종합해, 완성된 §Y정보§! 보고서를 전달합니다. 또한, 이는 취약점을 노출시켜 한동안 우리 제국의 §Y최대 침투 수준§!이 증가합니다."
 PrimPlayer_operation_gather_information_on_success:0 "$IF_SUCCESSFUL|E$\n[root.target.GetName]에 대한 정보와 최대 침투 수준이 증가합니다."
 PrimPlayer_operation_diplomatic_incident:0 "외교 사건 촉발"
 PrimPlayer_operation_diplomatic_incident_desc:0 "상대 외교 조직의 약점을 파고들어 망신을 주려 합니다."
 PrimPlayer_operation_diplomatic_incident_on_success:0 "$IF_SUCCESSFUL|E$\n[root.target.GetName]의 사절이 연루된 외교적 추문을 일으킵니다."
 nations.option.nuclear_strike_blocked.reason:0 "§Y침투 수준§!§R이§! §Y50§!§R보다 높아야 합니다§!"
 nations_improve_relations_tooltip:0 "§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations_commerial_pact_tooltip:0 "§g도움말) 통상 조약: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 PrimPlayer_opinion_flavors_up:0 "$opinion_flavors_up$"
 PrimPlayer_opinion_flavors_down:0 "$opinion_flavors_down$"
 nations.11205.title:0 "외교 통신 채널"
 nations.11205.desc:0 "우리 [FROM.GetRulerTitle]께서 자비롭게 [ROOT.GetName]의 알현을 허락하셨다. 무슨 소식을 가져왔느냐?"
 nations.11205.desc.nomad:0 "우리 [FROM.GetRulerTitle]께서 자비롭게 [ROOT.GetName]의 알현을 허락하셨다. 방주선의 자네들 구역에서는 무슨 소식을 가져왔느냐?"
 nations.11205.c:0 "핵 공격 사후 보고"
 nations.11205.c.tooltip:0 "선제 핵공격이 유리한 기회가 될지 현지 첩보 책임자와 논의합니다."
 PrimPlayer_launch_nuclear_strike_trust:0 "§Y모든 국가§!§R와의 관계를 심각하게 해칩니다§!§R!§!"
 nations.11205.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.11205.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.11205.merge.fanatic.tooltip:0 "§R수년간§! §Y'권위주의 연합'§! 상황을 진행해 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.11205.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 될까?"
 nations.11205.merge.normal.tooltip:0 "§R수년§! 동안 §Y'권위주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§G우호적 관계§!에는 우호도 300 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.11205.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.11205.merge.different.tooltip:0 "§R수년§! 동안 §Y'권위주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§B매우 우호적 관계§!에는 우호도 750 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.11205.g:0 "작전실 입장"
 nations.11205.g.tooltip:0 "최고 군사 고문들과 전쟁에 관해 논의합니다.\n\n§g도움말) 관계 악화: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.11205.i:0 "평화 협상 제안"
 nations.11220.title:0 "핵 공격 사후 보고"
 nations.11220.desc:0 "[Root.GetRulerTitle] [Root.GetRulerName]님, [FROMFROMFROMFROM.GetName]에 선제 핵공격을 가할 준비를 마치고 대기 중입니다."
 nations.11220.option.nuclear_strike_launched:0 "§Y핵 공격§!을 개시하라!!"
 nations.11220.option.nuclear_strike_blocked:0 "지금은 §Y핵 공격§!을 수행할 수 없습니다."
 nations.11220.option.goodbye:0 "쉬어, [Root.capital_scope.army.Leader.GetName] 장군. 오늘은 때가 아니다."
 nations.11225.title:0 "[FROMFROMFROMFROM.GetName] 파괴됨"
 nations.11225.desc.nuclear_winter_situation:0 "처음에는 밤하늘에 반짝이는 빛들이 보였습니다. 불과 몇 분 뒤, 태양 같은 섬광이 갑작스레 우리를 덮쳤습니다. 국가들이 하나씩 무너졌고, 돌연변이가 된 생존자들은 벙커에서 기어 나와 무덤으로 변한 세상을 되찾으려 했습니다.\n\n우리 제국이 입은 피해는 가장 적지만, 남은 주민들을 하나의 깃발 아래 모으기는 어려울 것입니다. 질서를 다시 세우는 것이 첫 과제입니다."
 nations.11225.desc.nuclear_winter_avoided:0 "상대 국가의 전략 자산을 성공적으로 무력화하자, 그 제국은 혼란 속에 빠르게 해체되었습니다. 이제 그들이 다스리던 땅을 점령하기만 하면 됩니다."
 nations.11225.option.nuclear_winter_situation:0 "살아남기는 했지만... §R핵겨울§!은 이제 시작일 뿐이다..."
 nations.11225.option.nuclear_winter_avoided:0 "우리의 선제 §Y핵 공격§!이 성공했다!"
 nations.11261.name:0 "붕괴"
 nations.11261.desc:0 "[Root.GetName]에서 비보가 들어왔습니다! 그곳에서 교전 중이던 [Root.Owner.GetSubMantleLower] 외계종이 땅굴 입구 근처에 주둔한 아군 부대 전체의 발밑 지반을 붕괴시켰습니다.\n\n추락에서 살아남은 소수의 병사마저 다른 아군 병력이 도착하기 전에 외계종에게 무참히 살해되었습니다."
 nations.11261.a:0 "기필코 갚아주마!"
 nations.11262.name:0 "습격대"
 nations.11262.desc:0 "[Root.GetName]의 우리 식민지 지하에 거주하던 외계종이 어두운 밤을 틈타 땅굴로 소규모 습격대를 보내고 있습니다. 습격대의 공격으로 식민지 주요 시설 하나가 파괴되었고, 습격대는 우리 병력이 대응하기도 전에 지하로 사라졌습니다."
 nations.11262.a:0 "습격을 막아야 합니다!"
 nations.11263.name:0 "지상 공격"
 nations.11263.desc:0 "[Root.GetName]이 또다시 공격받았습니다! [Root.Owner.GetSubMantleLower] 외계종이 우리 주요 정착지 한복판으로 통하는 새 땅굴에서 쏟아져 나왔습니다. 이들은 현지 방어 병력을 제압하고 개척민들을 학살했습니다. 땅굴로 퇴각하면서는 살아남은 몇몇 개척민을 지하로 끌고 갔고, 희생자들의 비명이 울려 퍼졌습니다."
 nations.11263.a:0 "이 살인 행위에는 반드시 대가가 따를 것이다."
 nations.11264.name:0 "지하의 생존자"
 nations.11264.desc:0 "[Root.GetName]의 우리 병력이 식민지 아래의 땅굴망을 조사하던 중 [Root.Owner.GetSubMantleLower] 외계종의 대도시를 발견했습니다. 우리가 신경 가스를 살포하기 전에 지하 제국의 나머지 지역과 스스로를 격리하는 데 성공한 도시입니다. 도시에는 수백만의 외계인이 겁에 질린 채 살고 있습니다. 공병들에게 동굴을 무너뜨려 일을 마무리하라고 지시할까요?"
 nations.11264.a:0 "네, 고통을 끝내 줍시다."
 nations.11264.b:0 "아니요! 지상으로 끌고 옵시다. 노예로 부려먹죠."
 nations.11264.b.subterranean:0 "아니요! 식민지로 끌고 옵시다. 노예로 부려먹죠."
 nations.11265.name:0 "[Root.Owner.GetSubMantleUpper] 확장"
 nations.11265.desc:0 "[Root.GetName]의 동굴망에 살포했던 신경가스를 제거하고, 외계종의 시체를 정리했습니다. 이제 개척민들은 이곳으로 안전하게 이주할 수 있습니다. 물론 외계종이 남긴 원시적인 건물은 모두 철거할 예정이며, 그 자리에 우리의 최첨단 건물이 들어설 것입니다."
 nations.11266.name:0 "금이다!"
 nations.11266.desc:0 "지금은 멸종한 지하 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.11266.desc.subterranean:0 "지금은 멸종한 마그마 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.11267.name:0 "보물고"
 nations.11267.desc:0 "[Root.GetName]의 땅굴망을 탐사하던 정찰대가 한때 지하 외계 제국의 수도였던 도시에서 왕궁에 진입했습니다. 알현실의 거대한 왕좌에는 황제로 보이는 자의 시신이 여전히 앉아 있었습니다.\n\n정찰대는 폭약으로 왕궁 금고를 뚫고 들어가 가득 쌓인 황금과 기이한 외계 예술품을 발견했습니다. 예술품은 [From.Owner.Capital.GetName]의 박물관으로 보내고, 황금은 매각해 국가 예산에 상당한 보탬을 줄 수 있을 것입니다."
 nations.11268.name:0 "[From.GetName]과의 사건"
 nations.11268.desc:0 "우리 §Y사절§! 한 명이 위대한 [From.GetRulerName]에게 무례를 범하여 외교적 사건이 발생했습니다. 즉시 투옥된 사절은 이제 사형 집행인이 대기하는 형식적인 재판에 서게 되었습니다.\n\n§H외교 면책 특권§!을 주장할 수는 있지만, 심각한 §R외교적 파장§!이 발생할 것입니다."
 nations.11268.a:0 "외교관 면책 특권을 주장하라! 그 사절은 살아 있어야 한다."
 nations.11268.b:0 "처형을 승인하라. 후폭풍을 감수할 수는 없다..."
 nations.11269.name:0 "[From.GetName]의 기근"
 nations.11269.desc:0 "§H[From.GetName]§!의 대표단이 찾아왔습니다. 최근 어려움을 겪고 있으며 §R기근§!의 위협에 직면했다고 합니다.\n\n그들은 우리가 할 수 있는 어떤 도움이라도 제공해 달라고 호소하고 있습니다..."
 nations.11269.a:0 "물론이죠. 힘닿는 데까지 지원하겠습니다."
 nations.11269.b:0 "스스로 살아남아야 한다."
 nations.11269.c:0 "나눠줄 식량이 부족하다..."
 ethic_fanatic_authoritarian_nation_pleased:0 "그 결과 §H$ethic_authoritarian$ [FROM.GetName]§!과의 관계가 §G개선§!됩니다."
 ethic_fanatic_authoritarian_nation_displeased:0 "그 결과 §H$ethic_authoritarian$ [FROM.GetName]§!과의 관계가 §R악화§!됩니다."
 nations.11270.name:0 "$ethic_authoritarian$의 선물"
 nations.11270.desc:0 "두 문명 간의 우호를 기념하는 선물로 §H[FROM.GetName]§!의 사절이 §Y감시 기술§! 설계도와 §Y$tech_centralized_state$§! 및 §Y$tech_penal_colonies$§!에 관한 정치적 구상을 전달했습니다. 이는 그들의 군주인 위대한 [FROM.GetRulerName]이 베푼 호의입니다.\n\n이 정책을 시행하면 식민지 자치권을 더욱 축소해 제국을 중앙집권화하고 §G영향력을 높일§! 수 있습니다. 다만 §R제국 크기가 증가§!합니다."
 nations.11270.a:0 "뭘 이런 걸 다."
 nations.11270.b:0 "지금 이 정책을 시행하자."
 nations.11271.name:0 "[From.GetName] 난민"
 nations.11271.desc:0 "최근 §H[FROM.GetName]§!에서 온 대규모 난민 집단이 소규모 군대에 쫓겨 국경에 도착했습니다. 이들은 자유를 위해 싸우는 저항 세력이며 쿠데타 시도에 실패한 뒤 도망쳤다고 주장합니다.\n\n제국에 받아들이면 위대한 [From.GetRealName]의 분노를 살 것이 분명합니다. 하지만 추격군에 넘겨주면 처형당할 가능성이 높습니다."
 nations.11271.a:0 "그들이 원한다면, 받아주겠습니다."
 nations.11271.b:0 "정치적 갈등은 피해야 합니다. 돌려보내세요."
 nations.11271.xenophobe:0 "외부인을 우리 나라에 들일 수 없다."
 nations.11271.civic_fanatic_purifiers:0 "양쪽 모두 보이는 즉시 죽여라."
 ethic_fanatic_authoritarian_nation_refugees:0 "§Y$ethic_authoritarian$§! §Y[FROM.GetSpeciesNamePlural]§! £pop£ §G800§!명이 우리 제국에 합류합니다."
 nations.11272.name:0 "$ethic_authoritarian$ 문화 교류"
 nations.11272.desc:0 "여러 사절이 §H[FROM.GetName]§! 주민들과 오랜 시간을 함께 보낸 뒤 돌아왔습니다. 그곳의 생활 방식과 관습을 배웠으니 우리 사회학 연구에 분명 도움이 될 것입니다.\n\n하지만 새로운 문화에는 새로운 사상도 따라옵니다... 대중의 §H자유로운 교류§!를 허용할까요?"
 nations.11272.a:0 "우리 국민들은 재화와 사상을 자유롭게 교환할 수 있다."
 nations.11272.b:0 "출입하는 모든 것을 엄격하게 규제하겠다."
 nations.11273.name:0 "[From.GetName] 관련 사망 사고"
 nations.11273.desc:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 우주로 향하던 로켓이 비행 중 동력을 잃고 우리 인근 정착지에 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.11273.nomad:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 정기 정비 작업이 크게 잘못되어 공중 도크가 우리 인근 정착지로 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.11273.a:0 "눈감아 주도록 하죠."
 nations.11273.b:0 "꼭 사죄를 받아야겠습니다!"
 nations.11274.name:0 "기술 전수 요청"
 nations.11274.desc:0 "우리 보안군이 갖춘 §H첨단 무기§!를 본 §H[FROM.GetName]§!의 장군 여럿이 군사 기술 일부를 공유해 달라고 요청했습니다.\n\n우리 장교들은 이를 망설입니다. 만약 전쟁이 일어난다면 그 권위주의 국가를 전장에서 상대하기가 더 어려워질 것이기 때문입니다.\n\n하지만 요청을 거절하면 위대한 [From.GetRulerName]은 분명 모욕으로 받아들일 것입니다."
 nations.11274.a:0 "권위주의자들에게 더 좋은 무기를 쥐여 주는 것은 나쁜 생각이다."
 nations.11274.b:0 "친구끼리 나누며 살아야죠."
 nations.11275.name:0 "메시지 수신"
 nations.11275.desc:0 "최근 §H[FROM.GetName]§!과의 교역이 뜸해지면서 상단의 방문도 점점 드물어졌습니다. 오늘은 그들의 군 대표에게서 메시지가 도착했습니다. 그다지 기분이 좋지는 않아 보입니다."
 nations.11275.a:0 "어떤 내용인지 봅시다."
 nations.11276.name:0 "메시지"
 nations.11276.desc:0 "지상인. 우리는 좋은 이웃이 되려 했으나, 그대들에게는 우리의 영광스러운 문명과 위대한 [From.GetRulerName]께 마땅한 존중을 보일 뜻이 없다는 점이 분명해졌다.\n\n이에 황제께서는 우리의 정당한 권리에 따라 이 행성 전체를 차지하라고 명하셨다. 그대들을 정복하겠다!"
 nations.11276.a:0 "§H[FROM.GetName]§! 국경에 방어 태세를 갖춰라!"
 nations.11277.name:0 "[FROM.GetName]의 연합 제안"
 nations.11277.desc:0 "[ROOT.GetName], 우리는 많은 문제에서 뜻을 같이합니다. 우리 두 국민 국가를 공식적으로 §G연합§!하여 하나의 §H통합 제국§!으로 만들고자 합니다."
 nations.11277.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.11277.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.11277.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 되자."
 nations.11277.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.11277.no:0 "지금은 연합에 합류할 생각이 없다."
 nations.12205.title:0 "외교 통신 채널"
 nations.12205.desc:0 "[Root.Capital.GetName] 전역에 자유가 깃들기를. [FROM.GetName]의 사절은 무슨 소식을 가져왔습니까?"
 nations.12205.desc.nomad:0 "방주선 전역에 자유가 깃들기를. [FROM.GetName]의 사절은 무슨 소식을 가져왔습니까?"
 nations.12205.c:0 "핵 공격 사후 보고"
 nations.12205.c.tooltip:0 "선제 핵공격이 유리한 기회가 될지 현지 첩보 책임자와 논의합니다."
 nations.12205.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.12205.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.12205.merge.fanatic.tooltip:0 "§Y'외계종 선호 연합'§! 상황을 §R수년간§! 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.12205.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 될까?"
 nations.12205.merge.normal.tooltip:0 "§R수년간§! §Y'외계종 선호 연합'§! 상황을 진행해 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§G우호적 관계§!에는 우호도 300 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.12205.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.12205.merge.different.tooltip:0 "§R수년§! 동안 §Y'외계종 선호 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§B매우 우호적 관계§!에는 우호도 750 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.12205.g:0 "작전실 입장"
 nations.12205.g.tooltip:0 "최고 군사 고문들과 전쟁에 관해 논의합니다.\n\n§g도움말) 관계 악화: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.12205.i:0 "평화 협상 제안"
 nations.12220.title:0 "핵 공격 사후 보고"
 nations.12220.desc:0 "[Root.GetRulerTitle] [Root.GetRulerName]님, [FROMFROMFROMFROM.GetName]에 선제 핵공격을 가할 준비를 마치고 대기 중입니다."
 nations.12220.option.nuclear_strike_launched:0 "§Y핵 공격§!을 개시하라!!"
 nations.12220.option.nuclear_strike_blocked:0 "지금은 §Y핵 공격§!을 수행할 수 없습니다."
 nations.12220.option.goodbye:0 "쉬어, [Root.capital_scope.army.Leader.GetName] 장군. 오늘은 때가 아니다."
 nations.12225.title:0 "[FROMFROMFROMFROM.GetName] 파괴됨"
 nations.12225.desc.nuclear_winter_situation:0 "처음에는 밤하늘에 반짝이는 빛들이 보였습니다. 불과 몇 분 뒤, 태양 같은 섬광이 갑작스레 우리를 덮쳤습니다. 국가들이 하나씩 무너졌고, 돌연변이가 된 생존자들은 벙커에서 기어 나와 무덤으로 변한 세상을 되찾으려 했습니다.\n\n우리 제국이 입은 피해는 가장 적지만, 남은 주민들을 하나의 깃발 아래 모으기는 어려울 것입니다. 질서를 다시 세우는 것이 첫 과제입니다."
 nations.12225.desc.nuclear_winter_avoided:0 "상대 국가의 전략 자산을 성공적으로 무력화하자, 그 제국은 혼란 속에 빠르게 해체되었습니다. 이제 그들이 다스리던 땅을 점령하기만 하면 됩니다."
 nations.12225.option.nuclear_winter_situation:0 "살아남기는 했지만... §R핵겨울§!은 이제 시작일 뿐이다..."
 nations.12225.option.nuclear_winter_avoided:0 "우리의 선제 §Y핵 공격§!이 성공했다!"
 nations.12261.name:0 "붕괴"
 nations.12261.desc:0 "[Root.GetName]에서 비보가 들어왔습니다! 그곳에서 교전 중이던 [Root.Owner.GetSubMantleLower] 외계종이 땅굴 입구 근처에 주둔한 아군 부대 전체의 발밑 지반을 붕괴시켰습니다.\n\n추락에서 살아남은 소수의 병사마저 다른 아군 병력이 도착하기 전에 외계종에게 무참히 살해되었습니다."
 nations.12261.a:0 "기필코 갚아주마!"
 nations.12262.name:0 "습격대"
 nations.12262.desc:0 "[Root.GetName]의 우리 식민지 지하에 거주하던 외계종이 어두운 밤을 틈타 땅굴로 소규모 습격대를 보내고 있습니다. 습격대의 공격으로 식민지 주요 시설 하나가 파괴되었고, 습격대는 우리 병력이 대응하기도 전에 지하로 사라졌습니다."
 nations.12262.a:0 "습격을 막아야 합니다!"
 nations.12263.name:0 "지상 공격"
 nations.12263.desc:0 "[Root.GetName]이 또다시 공격받았습니다! [Root.Owner.GetSubMantleLower] 외계종이 우리 주요 정착지 한복판으로 통하는 새 땅굴에서 쏟아져 나왔습니다. 이들은 현지 방어 병력을 제압하고 개척민들을 학살했습니다. 땅굴로 퇴각하면서는 살아남은 몇몇 개척민을 지하로 끌고 갔고, 희생자들의 비명이 울려 퍼졌습니다."
 nations.12263.a:0 "이 살인 행위에는 반드시 대가가 따를 것이다."
 nations.12264.name:0 "지하의 생존자"
 nations.12264.desc:0 "[Root.GetName]의 우리 병력이 식민지 아래의 땅굴망을 조사하던 중 [Root.Owner.GetSubMantleLower] 외계종의 대도시를 발견했습니다. 우리가 신경 가스를 살포하기 전에 지하 제국의 나머지 지역과 스스로를 격리하는 데 성공한 도시입니다. 도시에는 수백만의 외계인이 겁에 질린 채 살고 있습니다. 공병들에게 동굴을 무너뜨려 일을 마무리하라고 지시할까요?"
 nations.12264.a:0 "네, 고통을 끝내 줍시다."
 nations.12264.b:0 "아니요! 지상으로 끌고 옵시다. 노예로 부려먹죠."
 nations.12264.b.subterranean:0 "아니요! 식민지로 끌고 옵시다. 노예로 부려먹죠."
 nations.12265.name:0 "[Root.Owner.GetSubMantleUpper] 확장"
 nations.12265.desc:0 "[Root.GetName]의 동굴망에 살포했던 신경가스를 제거하고, 외계종의 시체를 정리했습니다. 이제 개척민들은 이곳으로 안전하게 이주할 수 있습니다. 물론 외계종이 남긴 원시적인 건물은 모두 철거할 예정이며, 그 자리에 우리의 최첨단 건물이 들어설 것입니다."
 nations.12266.name:0 "금이다!"
 nations.12266.desc:0 "지금은 멸종한 지하 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.12266.desc.subterranean:0 "지금은 멸종한 마그마 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.12267.name:0 "보물고"
 nations.12267.desc:0 "[Root.GetName]의 땅굴망을 탐사하던 정찰대가 한때 지하 외계 제국의 수도였던 도시에서 왕궁에 진입했습니다. 알현실의 거대한 왕좌에는 황제로 보이는 자의 시신이 여전히 앉아 있었습니다.\n\n정찰대는 폭약으로 왕궁 금고를 뚫고 들어가 가득 쌓인 황금과 기이한 외계 예술품을 발견했습니다. 예술품은 [From.Owner.Capital.GetName]의 박물관으로 보내고, 황금은 매각해 국가 예산에 상당한 보탬을 줄 수 있을 것입니다."
 nations.12268.name:0 "[From.GetName]과의 사건"
 nations.12268.desc:0 "우리 §Y사절§! 한 명이 위대한 [From.GetRulerName]에게 무례를 범하여 외교적 사건이 발생했습니다. 즉시 투옥된 사절은 이제 사형 집행인이 대기하는 형식적인 재판에 서게 되었습니다.\n\n§H외교 면책 특권§!을 주장할 수는 있지만, 심각한 §R외교적 파장§!이 발생할 것입니다."
 nations.12268.a:0 "외교관 면책 특권을 주장하라! 그 사절은 살아 있어야 한다."
 nations.12268.b:0 "처형을 승인하라. 후폭풍을 감수할 수는 없다..."
 nations.12269.name:0 "[From.GetName]의 기근"
 nations.12269.desc:0 "§H[From.GetName]§!의 대표단이 찾아왔습니다. 최근 어려움을 겪고 있으며 §R기근§!의 위협에 직면했다고 합니다.\n\n그들은 우리가 할 수 있는 어떤 도움이라도 제공해 달라고 호소하고 있습니다..."
 nations.12269.a:0 "물론이죠. 힘닿는 데까지 지원하겠습니다."
 nations.12269.b:0 "스스로 살아남아야 한다."
 nations.12269.c:0 "나눠줄 식량이 부족하다..."
 ethic_fanatic_egalitarian_nation_pleased:0 "그 결과 §H$ethic_egalitarian$ [FROM.GetName]§!과의 관계가 §G개선§!됩니다."
 ethic_fanatic_egalitarian_nation_displeased:0 "그 결과 §H$ethic_egalitarian$ [FROM.GetName]§!과의 관계가 §R악화§!됩니다."
 nations.12270.name:0 "$ethic_egalitarian$의 선물"
 nations.12270.desc:0 "두 문명 간의 우호를 기념하는 선물로 §H[FROM.GetName]§!의 사절이 §H$tech_federal_state$§!에 관한 정치 교리의 통찰을 전달했습니다. 이 정책을 시행하면 성계 통치를 분권화해 §G제국 크기를 줄일§! 수 있습니다. 새로운 자치권 덕분에 §G교역상이 안정도를 제공§!하지만, 그 대가로 §R관료 효율이 감소§!합니다."
 nations.12270.a:0 "뭘 이런 걸 다."
 nations.12270.b:0 "지금 이 정책을 시행하자."
 nations.12271.name:0 "권위주의 망명자"
 nations.12271.desc:0 "§H[FROM.GetName]§!에서 대규모 정치인 집단이 §Y권위주의적 부패§! 혐의로 추방되었습니다. 이들은 여러 나라를 떠돌다가 우리 제국에 피난처와 수용을 간청했습니다.\n\n받아들이면 분명 §P정치 운동§!이 발생하고 [FROM.GetName]은 실망할 것입니다. 하지만 이 방랑자들을 거절하면... 다음 나라의 국경으로 가는 길에 목숨을 잃을 가능성이 큽니다."
 nations.12271.authoritarian:0 "저 정치인들은 우리 정부에 유용할 것이다."
 nations.12271.a:0 "그들이 원한다면, 받아주겠습니다."
 nations.12271.b:0 "거절하라. 정치적 후폭풍을 감수할 수 없다."
 nations.12271.xenophobe:0 "외부인을 우리 나라에 들일 수 없다."
 nations.12271.civic_fanatic_purifiers:0 "보이는 떠돌이는 모두 학살하라."
 ethic_fanatic_egalitarian_nation_refugees:0 "§Y$ethic_authoritarian$§! §Y[FROM.GetSpeciesNamePlural]§! £pop£ §G800§!명이 우리 제국에 합류합니다."
 nations.12272.name:0 "$ethic_egalitarian$ 문화 교류"
 nations.12272.desc:0 "여러 사절이 §H[FROM.GetName]§! 주민들과 오랜 시간을 함께 보낸 뒤 돌아왔습니다. 그곳의 생활 방식과 관습을 배웠으니 우리 사회학 연구에 분명 도움이 될 것입니다.\n\n하지만 새로운 문화에는 새로운 사상도 따라옵니다... 대중의 §H자유로운 교류§!를 허용할까요?"
 nations.12272.a:0 "우리 국민들은 재화와 사상을 자유롭게 교환할 수 있다."
 nations.12272.b:0 "출입하는 모든 것을 엄격하게 규제하겠다."
 nations.12273.name:0 "[From.GetName] 관련 사망 사고"
 nations.12273.desc:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 우주로 향하던 로켓이 비행 중 동력을 잃고 우리 인근 정착지에 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.12273.nomad:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 정기 정비 작업이 크게 잘못되어 공중 도크가 우리 인근 정착지로 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.12273.a:0 "눈감아 주도록 하죠."
 nations.12273.b:0 "꼭 사죄를 받아야겠습니다!"
 nations.12274.name:0 "기술 전수 요청"
 nations.12274.desc:0 "우리 보안군의 §Y첨단 무기§!를 본 §H[FROM.GetName]§!의 장군들이 군사 기술 일부를 공유해 달라고 요청해 왔습니다.\n\n우리 장교들은 주저하고 있습니다. 훗날 전쟁이 벌어지면 자유를 위해 싸우는 이 국가를 제압하기가 더 어려워질 것이기 때문입니다.\n\n거절하면 그들의 지도자 [From.GetRulerName]은 자신의 선의를 모욕당했다고 여길 것이 분명합니다."
 nations.12274.a:0 "자유 투사들에게 무기를 주는 것은 좋지 않다."
 nations.12274.b:0 "친구끼리 나누며 살아야죠."
 nations.12275.name:0 "메시지 수신"
 nations.12275.desc:0 "최근 §H[FROM.GetName]§!과의 교역이 뜸해지면서 상단의 방문도 점점 드물어졌습니다. 오늘은 그들의 군 대표에게서 메시지가 도착했습니다. 그다지 기분이 좋지는 않아 보입니다."
 nations.12275.a:0 "어떤 내용인지 봅시다."
 nations.12276.name:0 "메시지"
 nations.12276.desc:0 "지상인. 우리는 좋은 이웃이 되려 했으나, 그대들에게는 우리의 영광스러운 문명과 위대한 [From.GetRulerName]께 마땅한 존중을 보일 뜻이 없다는 점이 분명해졌다.\n\n이에 황제께서는 우리의 정당한 권리에 따라 이 행성 전체를 차지하라고 명하셨다. 그대들을 정복하겠다!"
 nations.12276.a:0 "§H[FROM.GetName]§! 국경에 방어 태세를 갖춰라!"
 nations.12277.name:0 "[FROM.GetName]의 연합 제안"
 nations.12277.desc:0 "[ROOT.GetName], 우리는 많은 문제에서 뜻을 같이합니다. 우리 두 국민 국가를 공식적으로 §G연합§!하여 하나의 §H통합 제국§!으로 만들고자 합니다."
 nations.12277.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.12277.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.12277.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 되자."
 nations.12277.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.12277.no:0 "지금은 연합에 합류할 생각이 없다."
 nations.13205.title:0 "외교 통신 채널"
 nations.13205.desc:0 "서둘러라, [ROOT.GetName]. 우리는 외부인에게 참을성이 별로 없다!"
 nations.13205.desc.nomad:0 "서둘러라, [ROOT.GetName]. 우리는 이 방주선의 다른 국가들에게 오래 참아 줄 생각이 없다!"
 nations.13205.c:0 "핵 공격 사후 보고"
 nations.13205.c.tooltip:0 "선제 핵공격이 유리한 기회가 될지 현지 첩보 책임자와 논의합니다."
 nations.13205.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.13205.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.13205.merge.fanatic.tooltip:0 "§R수년§! 동안 §Y'외계종 혐오 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.13205.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 될까?"
 nations.13205.merge.normal.tooltip:0 "§Y'외계종 혐오 연합'§! 상황을 §R수년간§! 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§G우호적 관계§!에는 우호도 300 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.13205.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.13205.merge.different.tooltip:0 "§R수년간§! §Y'외계종 혐오 연합'§! 상황을 진행해 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§B매우 우호적 관계§!에는 우호도 750 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.13205.g:0 "작전실 입장"
 nations.13205.g.tooltip:0 "최고 군사 고문들과 전쟁에 관해 논의합니다.\n\n§g도움말) 관계 악화: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.13205.i:0 "평화 협상 제안"
 nations.13220.title:0 "핵 공격 사후 보고"
 nations.13220.desc:0 "안녕하십니까, [Root.GetRulerTitle] [Root.GetRulerName]님. [FROMFROMFROMFROM.GetName]에 선제 핵 공격을 가할 준비를 마치고 대기 중입니다."
 nations.13220.option.nuclear_strike_launched:0 "§Y핵 공격§!을 개시하라!!"
 nations.13220.option.nuclear_strike_blocked:0 "지금은 §Y핵 공격§!을 수행할 수 없습니다."
 nations.13220.option.goodbye:0 "쉬어, [Root.capital_scope.army.Leader.GetName] 장군. 오늘은 때가 아니다."
 nations.13225.title:0 "[FROMFROMFROMFROM.GetName] 파괴됨"
 nations.13225.desc.nuclear_winter_situation:0 "처음에는 밤하늘에 반짝이는 빛들이 보였습니다. 불과 몇 분 뒤, 태양 같은 섬광이 갑작스레 우리를 덮쳤습니다. 국가들이 하나씩 무너졌고, 돌연변이가 된 생존자들은 벙커에서 기어 나와 무덤으로 변한 세상을 되찾으려 했습니다.\n\n우리 제국이 입은 피해는 가장 적지만, 남은 주민들을 하나의 깃발 아래 모으기는 어려울 것입니다. 질서를 다시 세우는 것이 첫 과제입니다."
 nations.13225.desc.nuclear_winter_avoided:0 "상대 국가의 전략 자산을 성공적으로 무력화하자, 그 제국은 혼란 속에 빠르게 해체되었습니다. 이제 그들이 다스리던 땅을 점령하기만 하면 됩니다."
 nations.13225.option.nuclear_winter_situation:0 "살아남기는 했지만... §R핵겨울§!은 이제 시작일 뿐이다..."
 nations.13225.option.nuclear_winter_avoided:0 "우리의 선제 §Y핵 공격§!이 성공했다!"
 nations.13230.title:0 "작전실"
 nations.13230.desc:0 "어서 오십시오, [Root.GetRulerTitle] [Root.GetRulerName]. 최고 사령부가 명령을 기다리고 있습니다."
 nations.13230.option.invade:0 "침공을 개시하라!"
 nations.war_room.option.invade.no_truce:0 "국가 간의 §Y휴전§! 종료"
 nations.13230.option.debriefing:0 "최고 사령부에 침공 보고 준비를 지시하라."
 nations.war_room.option.debriefing.fail_text:0 "§R보고를 받으려면 첩자들이§! §Y$operation_gather_information$§!§R을 수행해야 합니다!§!"
 nations.13230.option.war_report:0 "최고 사령부에 전황 보고서를 요청하라."
 nations.war_room.option.war_report.need_war:0 "침공 진행 중"
 nations.war_room.option.war_report.need_gather_information:0 "§R전쟁 보고를 받으려면 첩자들이§! §Y$operation_gather_information$§!§R을 수행해야 합니다!§!"
 nations.13230.option.goodbye:0 "장군, 군을 대기시켜 두게."
 nations.13230.option.goodbye.war:0 "지금은 여기까지다, 장군."
 nations.13261.name:0 "붕괴"
 nations.13261.desc:0 "[Root.GetName]에서 비보가 들어왔습니다! 그곳에서 교전 중이던 [Root.Owner.GetSubMantleLower] 외계종이 땅굴 입구 근처에 주둔한 아군 부대 전체의 발밑 지반을 붕괴시켰습니다.\n\n추락에서 살아남은 소수의 병사마저 다른 아군 병력이 도착하기 전에 외계종에게 무참히 살해되었습니다."
 nations.13261.a:0 "기필코 갚아주마!"
 nations.13262.name:0 "습격대"
 nations.13262.desc:0 "[Root.GetName]의 우리 식민지 지하에 거주하던 외계종이 어두운 밤을 틈타 땅굴로 소규모 습격대를 보내고 있습니다. 습격대의 공격으로 식민지 주요 시설 하나가 파괴되었고, 습격대는 우리 병력이 대응하기도 전에 지하로 사라졌습니다."
 nations.13262.a:0 "습격을 막아야 합니다!"
 nations.13263.name:0 "지상 공격"
 nations.13263.desc:0 "[Root.GetName]이 또다시 공격받았습니다! [Root.Owner.GetSubMantleLower] 외계종이 우리 주요 정착지 한복판으로 통하는 새 땅굴에서 쏟아져 나왔습니다. 이들은 현지 방어 병력을 제압하고 개척민들을 학살했습니다. 땅굴로 퇴각하면서는 살아남은 몇몇 개척민을 지하로 끌고 갔고, 희생자들의 비명이 울려 퍼졌습니다."
 nations.13263.a:0 "이 살인 행위에는 반드시 대가가 따를 것이다."
 nations.13264.name:0 "지하의 생존자"
 nations.13264.desc:0 "[Root.GetName]의 우리 병력이 식민지 아래의 땅굴망을 조사하던 중 [Root.Owner.GetSubMantleLower] 외계종의 대도시를 발견했습니다. 우리가 신경 가스를 살포하기 전에 지하 제국의 나머지 지역과 스스로를 격리하는 데 성공한 도시입니다. 도시에는 수백만의 외계인이 겁에 질린 채 살고 있습니다. 공병들에게 동굴을 무너뜨려 일을 마무리하라고 지시할까요?"
 nations.13264.a:0 "네, 고통을 끝내 줍시다."
 nations.13264.b:0 "아니요! 지상으로 끌고 옵시다. 노예로 부려먹죠."
 nations.13264.b.subterranean:0 "아니요! 식민지로 끌고 옵시다. 노예로 부려먹죠."
 nations.13265.name:0 "[Root.Owner.GetSubMantleUpper] 확장"
 nations.13265.desc:0 "[Root.GetName]의 동굴망에 살포했던 신경가스를 제거하고, 외계종의 시체를 정리했습니다. 이제 개척민들은 이곳으로 안전하게 이주할 수 있습니다. 물론 외계종이 남긴 원시적인 건물은 모두 철거할 예정이며, 그 자리에 우리의 최첨단 건물이 들어설 것입니다."
 nations.13266.name:0 "금이다!"
 nations.13266.desc:0 "지금은 멸종한 지하 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.13266.desc.subterranean:0 "지금은 멸종한 마그마 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.13267.name:0 "보물고"
 nations.13267.desc:0 "[Root.GetName]의 땅굴망을 탐사하던 정찰대가 한때 지하 외계 제국의 수도였던 도시에서 왕궁에 진입했습니다. 알현실의 거대한 왕좌에는 황제로 보이는 자의 시신이 여전히 앉아 있었습니다.\n\n정찰대는 폭약으로 왕궁 금고를 뚫고 들어가 가득 쌓인 황금과 기이한 외계 예술품을 발견했습니다. 예술품은 [From.Owner.Capital.GetName]의 박물관으로 보내고, 황금은 매각해 국가 예산에 상당한 보탬을 줄 수 있을 것입니다."
 nations.13268.name:0 "[From.GetName]과의 사건"
 nations.13268.desc:0 "우리 §Y사절§! 한 명이 위대한 [From.GetRulerName]에게 무례를 범하여 외교적 사건이 발생했습니다. 즉시 투옥된 사절은 이제 사형 집행인이 대기하는 형식적인 재판에 서게 되었습니다.\n\n§H외교 면책 특권§!을 주장할 수는 있지만, 심각한 §R외교적 파장§!이 발생할 것입니다."
 nations.13268.a:0 "외교관 면책 특권을 주장하라! 그 사절은 살아 있어야 한다."
 nations.13268.b:0 "처형을 승인하라. 후폭풍을 감수할 수는 없다..."
 nations.13269.name:0 "[From.GetName]의 기근"
 nations.13269.desc:0 "§H[From.GetName]§!의 대표단이 찾아왔습니다. 최근 어려움을 겪고 있으며 §R기근§!의 위협에 직면했다고 합니다.\n\n그들은 우리가 할 수 있는 어떤 도움이라도 제공해 달라고 호소하고 있습니다..."
 nations.13269.a:0 "물론이죠. 힘닿는 데까지 지원하겠습니다."
 nations.13269.b:0 "스스로 살아남아야 한다."
 nations.13269.c:0 "나눠줄 식량이 부족하다..."
 ethic_fanatic_xenophobe_nation_pleased:0 "그 결과 §H$ethic_xenophobe$ [FROM.GetName]§!과의 관계가 §G개선§!됩니다."
 ethic_fanatic_xenophobe_nation_displeased:0 "그 결과 §H$ethic_xenophobe$ [FROM.GetName]§!과의 관계가 §R악화§!됩니다."
 nations.13270.name:0 "$ethic_xenophobe$의 선물"
 nations.13270.desc:0 "두 문명의 우호를 기념하는 선물로 §H[FROM.GetName]§!의 사절이 §H$tech_encryption_1$§! 설계도를 가져왔습니다. 군주이신 위대한 [FROM.GetRulerName]께서 은혜롭게 하사한 것입니다."
 nations.13270.a:0 "뭘 이런 걸 다."
 nations.13271.name:0 "[From.GetName] 난민"
 nations.13271.desc:0 "최근 §H[FROM.GetName]§!에서 온 대규모 난민 집단이 소규모 군대에 쫓겨 국경에 도착했습니다. 이들은 자유를 위해 싸우는 저항 세력이며 쿠데타 시도에 실패한 뒤 도망쳤다고 주장합니다.\n\n제국에 받아들이면 위대한 [From.GetRealName]의 분노를 살 것이 분명합니다. 하지만 추격군에 넘겨주면 처형당할 가능성이 높습니다."
 nations.13271.a:0 "그들이 원한다면, 받아주겠습니다."
 nations.13271.b:0 "정치적 갈등은 피해야 합니다. 돌려보내세요."
 nations.13271.xenophobe:0 "외부인을 우리 나라에 들일 수 없다."
 nations.13271.civic_fanatic_purifiers:0 "양쪽 모두 보이는 즉시 죽여라."
 ethic_fanatic_xenophobe_nation_refugees:0 "§Y$ethic_xenophobe$§! §Y[FROM.GetSpeciesNamePlural]§! £pop£ §G800§!명이 우리 제국에 합류합니다."
 nations.13272.name:0 "$ethic_xenophobe$ 문화 교류"
 nations.13272.desc:0 "여러 사절이 §H[FROM.GetName]§! 주민들과 오랜 시간을 함께 보낸 뒤 돌아왔습니다. 그곳의 생활 방식과 관습을 배웠으니 우리 사회학 연구에 분명 도움이 될 것입니다.\n\n하지만 새로운 문화에는 새로운 사상도 따라옵니다... 대중의 §H자유로운 교류§!를 허용할까요?"
 nations.13272.a:0 "우리 국민들은 재화와 사상을 자유롭게 교환할 수 있다."
 nations.13272.b:0 "출입하는 모든 것을 엄격하게 규제하겠다."
 nations.13273.name:0 "준지성체의 난동"
 nations.13273.desc:0 "§H[FROM.GetName]§!으로부터 우리 국경 인근의 외계종 동물원에서 생물들이 탈출했다는 연락을 받았습니다. 국경 경비대가 탈출한 생물들을 이미 포획했지만, 그 전에 거친 §P난동§!으로 피해가 발생했습니다.\n\n자세히 조사해 보니 포획된 생물들은 일종의 §Y준지성체§!로 보입니다. 그 정부가 이들을 연구하고 있었던 것 같습니다. 반환을 거부하면 [FROM.GetName]은 크게 불쾌해할 것입니다. 다만 넘겨주는 대가로 피해 배상을 청구할 수도 있습니다."
 nations.13273.nomad:0 "$nations.14273.desc$"
 nations.13273.a:0 "대가 없이 돌려보내라."
 nations.13273.b:0 "돌려보내되 피해 비용을 청구하라."
 nations.13273.c:0 "이 준지성체들은 우리가 데리고 있겠다."
 nations.13273.civic_fanatic_purifiers:0 "준지성체들을 박멸하라."
 nations.13274.name:0 "기술 전수 요청"
 nations.13274.desc:0 "우리 보안군이 갖춘 §H첨단 무기§!를 본 §H[FROM.GetName]§!의 장군 여럿이 군사 기술 일부를 공유해 달라고 요청했습니다.\n\n우리 장교들은 이를 망설입니다. 만약 전쟁이 일어난다면 그 권위주의 국가를 전장에서 상대하기가 더 어려워질 것이기 때문입니다.\n\n하지만 요청을 거절하면 위대한 [From.GetRulerName]은 분명 모욕으로 받아들일 것입니다."
 nations.13274.a:0 "권위주의자들에게 더 좋은 무기를 쥐여 주는 것은 나쁜 생각이다."
 nations.13274.b:0 "친구끼리 나누며 살아야죠."
 nations.13275.name:0 "메시지 수신"
 nations.13275.desc:0 "최근 §H[FROM.GetName]§!과의 교역이 뜸해지면서 상단의 방문도 점점 드물어졌습니다. 오늘은 그들의 군 대표에게서 메시지가 도착했습니다. 그다지 기분이 좋지는 않아 보입니다."
 nations.13275.a:0 "어떤 내용인지 봅시다."
 nations.13276.name:0 "메시지"
 nations.13276.desc:0 "지상인. 우리는 좋은 이웃이 되려 했으나, 그대들에게는 우리의 영광스러운 문명과 위대한 [From.GetRulerName]께 마땅한 존중을 보일 뜻이 없다는 점이 분명해졌다.\n\n이에 황제께서는 우리의 정당한 권리에 따라 이 행성 전체를 차지하라고 명하셨다. 그대들을 정복하겠다!"
 nations.13276.a:0 "§H[FROM.GetName]§! 국경에 방어 태세를 갖춰라!"
 nations.13277.name:0 "[FROM.GetName]의 연합 제안"
 nations.13277.desc:0 "[ROOT.GetName], 우리는 많은 문제에서 뜻을 같이합니다. 우리 두 국민 국가를 공식적으로 §G연합§!하여 하나의 §H통합 제국§!으로 만들고자 합니다."
 nations.13277.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.13277.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.13277.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 되자."
 nations.13277.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.13277.no:0 "지금은 연합에 합류할 생각이 없다."
 nations.14205.title:0 "외교 통신 채널"
 nations.14205.desc:0 "[Root.GetName]의 사절을 환영합니다! 양국 문화에는 교류할 것이 많고 논의할 정책도 많습니다."
 nations.14205.desc.nomad:0 "[Root.GetName]의 사절을 환영합니다! 양국의 문화 사이에는 교류할 것이 많으며, 방주선의 두 구역 사이에서도 외교를 펼칠 여지가 많습니다."
 nations.14205.c:0 "핵 공격 사후 보고"
 nations.14205.c.tooltip:0 "선제 핵공격이 유리한 기회가 될지 현지 첩보 책임자와 논의합니다."
 nations.14205.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.14205.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.14205.merge.fanatic.tooltip:0 "§Y'외계종 선호 연합'§! 상황을 §R수년간§! 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.14205.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 될까?"
 nations.14205.merge.normal.tooltip:0 "§R수년간§! §Y'외계종 선호 연합'§! 상황을 진행해 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§G우호적 관계§!에는 우호도 300 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.14205.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.14205.merge.different.tooltip:0 "§R수년§! 동안 §Y'외계종 선호 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§B매우 우호적 관계§!에는 우호도 750 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.14205.g:0 "작전실 입장"
 nations.14205.g.tooltip:0 "최고 군사 고문들과 전쟁에 관해 논의합니다.\n\n§g도움말) 관계 악화: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.14205.i:0 "평화 협상 제안"
 nations.14220.title:0 "핵 공격 사후 보고"
 nations.14220.desc:0 "[Root.GetRulerTitle] [Root.GetRulerName]님, [FROMFROMFROMFROM.GetName]에 선제 핵공격을 가할 준비를 마치고 대기 중입니다."
 nations.14220.option.nuclear_strike_launched:0 "§Y핵 공격§!을 개시하라!!"
 nations.14220.option.nuclear_strike_blocked:0 "지금은 §Y핵 공격§!을 수행할 수 없습니다."
 nations.14220.option.goodbye:0 "쉬어, [Root.capital_scope.army.Leader.GetName] 장군. 오늘은 때가 아니다."
 nations.14225.title:0 "[FROMFROMFROMFROM.GetName] 파괴됨"
 nations.14225.desc.nuclear_winter_situation:0 "처음에는 밤하늘에 반짝이는 빛들이 보였습니다. 불과 몇 분 뒤, 태양 같은 섬광이 갑작스레 우리를 덮쳤습니다. 국가들이 하나씩 무너졌고, 돌연변이가 된 생존자들은 벙커에서 기어 나와 무덤으로 변한 세상을 되찾으려 했습니다.\n\n우리 제국이 입은 피해는 가장 적지만, 남은 주민들을 하나의 깃발 아래 모으기는 어려울 것입니다. 질서를 다시 세우는 것이 첫 과제입니다."
 nations.14225.desc.nuclear_winter_avoided:0 "상대 국가의 전략 자산을 성공적으로 무력화하자, 그 제국은 혼란 속에 빠르게 해체되었습니다. 이제 그들이 다스리던 땅을 점령하기만 하면 됩니다."
 nations.14225.option.nuclear_winter_situation:0 "살아남기는 했지만... §R핵겨울§!은 이제 시작일 뿐이다..."
 nations.14225.option.nuclear_winter_avoided:0 "우리의 선제 §Y핵 공격§!이 성공했다!"
 nations.14261.name:0 "붕괴"
 nations.14261.desc:0 "[Root.GetName]에서 비보가 들어왔습니다! 그곳에서 교전 중이던 [Root.Owner.GetSubMantleLower] 외계종이 땅굴 입구 근처에 주둔한 아군 부대 전체의 발밑 지반을 붕괴시켰습니다.\n\n추락에서 살아남은 소수의 병사마저 다른 아군 병력이 도착하기 전에 외계종에게 무참히 살해되었습니다."
 nations.14261.a:0 "기필코 갚아주마!"
 nations.14262.name:0 "습격대"
 nations.14262.desc:0 "[Root.GetName]의 우리 식민지 지하에 거주하던 외계종이 어두운 밤을 틈타 땅굴로 소규모 습격대를 보내고 있습니다. 습격대의 공격으로 식민지 주요 시설 하나가 파괴되었고, 습격대는 우리 병력이 대응하기도 전에 지하로 사라졌습니다."
 nations.14262.a:0 "습격을 막아야 합니다!"
 nations.14263.name:0 "지상 공격"
 nations.14263.desc:0 "[Root.GetName]이 또다시 공격받았습니다! [Root.Owner.GetSubMantleLower] 외계종이 우리 주요 정착지 한복판으로 통하는 새 땅굴에서 쏟아져 나왔습니다. 이들은 현지 방어 병력을 제압하고 개척민들을 학살했습니다. 땅굴로 퇴각하면서는 살아남은 몇몇 개척민을 지하로 끌고 갔고, 희생자들의 비명이 울려 퍼졌습니다."
 nations.14263.a:0 "이 살인 행위에는 반드시 대가가 따를 것이다."
 nations.14264.name:0 "지하의 생존자"
 nations.14264.desc:0 "[Root.GetName]의 우리 병력이 식민지 아래의 땅굴망을 조사하던 중 [Root.Owner.GetSubMantleLower] 외계종의 대도시를 발견했습니다. 우리가 신경 가스를 살포하기 전에 지하 제국의 나머지 지역과 스스로를 격리하는 데 성공한 도시입니다. 도시에는 수백만의 외계인이 겁에 질린 채 살고 있습니다. 공병들에게 동굴을 무너뜨려 일을 마무리하라고 지시할까요?"
 nations.14264.a:0 "네, 고통을 끝내 줍시다."
 nations.14264.b:0 "아니요! 지상으로 끌고 옵시다. 노예로 부려먹죠."
 nations.14264.b.subterranean:0 "아니요! 식민지로 끌고 옵시다. 노예로 부려먹죠."
 nations.14265.name:0 "[Root.Owner.GetSubMantleUpper] 확장"
 nations.14265.desc:0 "[Root.GetName]의 동굴망에 살포했던 신경가스를 제거하고, 외계종의 시체를 정리했습니다. 이제 개척민들은 이곳으로 안전하게 이주할 수 있습니다. 물론 외계종이 남긴 원시적인 건물은 모두 철거할 예정이며, 그 자리에 우리의 최첨단 건물이 들어설 것입니다."
 nations.14266.name:0 "금이다!"
 nations.14266.desc:0 "지금은 멸종한 지하 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.14266.desc.subterranean:0 "지금은 멸종한 마그마 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.14267.name:0 "보물고"
 nations.14267.desc:0 "[Root.GetName]의 땅굴망을 탐사하던 정찰대가 한때 지하 외계 제국의 수도였던 도시에서 왕궁에 진입했습니다. 알현실의 거대한 왕좌에는 황제로 보이는 자의 시신이 여전히 앉아 있었습니다.\n\n정찰대는 폭약으로 왕궁 금고를 뚫고 들어가 가득 쌓인 황금과 기이한 외계 예술품을 발견했습니다. 예술품은 [From.Owner.Capital.GetName]의 박물관으로 보내고, 황금은 매각해 국가 예산에 상당한 보탬을 줄 수 있을 것입니다."
 nations.14268.name:0 "[From.GetName]과의 사건"
 nations.14268.desc:0 "우리 §Y사절§! 한 명이 위대한 [From.GetRulerName]에게 무례를 범하여 외교적 사건이 발생했습니다. 즉시 투옥된 사절은 이제 사형 집행인이 대기하는 형식적인 재판에 서게 되었습니다.\n\n§H외교 면책 특권§!을 주장할 수는 있지만, 심각한 §R외교적 파장§!이 발생할 것입니다."
 nations.14268.a:0 "외교관 면책 특권을 주장하라! 그 사절은 살아 있어야 한다."
 nations.14268.b:0 "처형을 승인하라. 후폭풍을 감수할 수는 없다..."
 nations.14269.name:0 "[From.GetName]의 기근"
 nations.14269.desc:0 "§H[From.GetName]§!의 대표단이 찾아왔습니다. 최근 어려움을 겪고 있으며 §R기근§!의 위협에 직면했다고 합니다.\n\n그들은 우리가 할 수 있는 어떤 도움이라도 제공해 달라고 호소하고 있습니다..."
 nations.14269.a:0 "물론이죠. 힘닿는 데까지 지원하겠습니다."
 nations.14269.b:0 "스스로 살아남아야 한다."
 nations.14269.c:0 "나눠줄 식량이 부족하다..."
 ethic_fanatic_xenophile_nation_pleased:0 "그 결과 §H$ethic_xenophile$ [FROM.GetName]§!과의 관계가 §G개선§!됩니다."
 ethic_fanatic_xenophile_nation_displeased:0 "그 결과 §H$ethic_xenophile$ [FROM.GetName]§!과의 관계가 §R악화§!됩니다."
 nations.14270.name:0 "$ethic_xenophile$의 선물"
 nations.14270.desc:0 "두 문명의 우호를 기념하는 선물로 §H[FROM.GetName]§!의 사절이 §H$tech_resort_colonies$§!을 건설하는 방법을 알려주었습니다. 벌써 많은 [ROOT.GetSpeciesName]이 정부가 이를 건설할 것인지 열띤 문의를 보내고 있습니다."
 nations.14270.a:0 "멋진 별장이 되겠군!"
 nations.14271.name:0 "외계종을 동경하는 관광객들"
 nations.14271.desc:0 "최근 §H[FROM.GetName]§!에서 온 대규모 관광객 무리가 우리 생활상을 직접 경험하고 싶다며 국경에 도착했습니다.\n\n우리 제국에 머무르지 못하게 한다면 [From.GetRealName]의 분노를 살 것이 분명합니다."
 nations.14271.a:0 "외교 문제를 만들 수는 없다. 입국을 허용하라."
 nations.14271.b:0 "우리 제국은 관광지가 아니다!"
 nations.14271.xenophobe:0 "외부인을 우리 나라에 들일 수 없다."
 nations.14271.civic_fanatic_purifiers:0 "양쪽 모두 보이는 즉시 죽여라."
 ethic_fanatic_xenophile_nation_refugees:0 "§Y$ethic_xenophile$§! §Y[FROM.GetSpeciesNamePlural]§! £pop£ §G800§!명이 우리 제국에 합류합니다."
 nations.14272.name:0 "$ethic_xenophile$ 문화 교류"
 nations.14272.desc:0 "여러 사절이 §H[FROM.GetName]§! 주민들과 오랜 시간을 함께 보낸 뒤 돌아왔습니다. 그곳의 생활 방식과 관습을 배웠으니 우리 사회학 연구에 분명 도움이 될 것입니다.\n\n하지만 새로운 문화에는 새로운 사상도 따라옵니다... 대중의 §H자유로운 교류§!를 허용할까요?"
 nations.14272.a:0 "우리 국민들은 재화와 사상을 자유롭게 교환할 수 있다."
 nations.14272.b:0 "출입하는 모든 것을 엄격하게 규제하겠다."
 nations.14273.name:0 "준지성체의 난동"
 nations.14273.desc:0 "§H[FROM.GetName]§!으로부터 우리 국경 인근의 외계종 동물원에서 생물들이 탈출했다는 연락을 받았습니다. 국경 경비대가 탈출한 생물들을 이미 포획했지만, 그 전에 거친 §P난동§!으로 피해가 발생했습니다.\n\n자세히 조사해 보니 포획된 생물들은 일종의 §Y준지성체§!로 보입니다. 그 정부가 이들을 연구하고 있었던 것 같습니다. 반환을 거부하면 [FROM.GetName]은 크게 불쾌해할 것입니다. 다만 넘겨주는 대가로 피해 배상을 청구할 수도 있습니다."
 nations.14273.nomad:0 "$nations.14273.desc$"
 nations.14273.a:0 "대가 없이 돌려보내라."
 nations.14273.b:0 "돌려보내되 피해 비용을 청구하라."
 nations.14273.c:0 "이 준지성체들은 우리가 데리고 있겠다."
 nations.14273.civic_fanatic_purifiers:0 "준지성체들을 박멸하라."
 nations.14274.name:0 "기술 전수 요청"
 nations.14274.desc:0 "§Y$tech_alien_life_studies$§! 분야에서 우리가 이룬 과학적 돌파구를 본 §H[FROM.GetName]§!의 사절들이 연구 결과 공유와 과학자 훈련을 요청했습니다.\n\n우리 과학자들은 이를 주저합니다. 핵심 관심 분야에서 연구 역량을 돌려야 하기 때문입니다.\n\n요청을 거절하면 [From.GetName]이 불만을 가질 것은 분명합니다."
 nations.14274.a:0 "우리의 우선 연구가 지연되도록 둘 수 없다."
 nations.14274.b:0 "친구끼리 나누며 살아야죠."
 nations.14275.name:0 "메시지 수신"
 nations.14275.desc:0 "최근 §H[FROM.GetName]§!과의 교역이 뜸해지면서 상단의 방문도 점점 드물어졌습니다. 오늘은 그들의 군 대표에게서 메시지가 도착했습니다. 그다지 기분이 좋지는 않아 보입니다."
 nations.14275.a:0 "어떤 내용인지 봅시다."
 nations.14276.name:0 "메시지"
 nations.14276.desc:0 "지상인. 우리는 좋은 이웃이 되려 했으나, 그대들에게는 우리의 영광스러운 문명과 위대한 [From.GetRulerName]께 마땅한 존중을 보일 뜻이 없다는 점이 분명해졌다.\n\n이에 황제께서는 우리의 정당한 권리에 따라 이 행성 전체를 차지하라고 명하셨다. 그대들을 정복하겠다!"
 nations.14276.a:0 "§H[FROM.GetName]§! 국경에 방어 태세를 갖춰라!"
 nations.14277.name:0 "[FROM.GetName]의 연합 제안"
 nations.14277.desc:0 "[ROOT.GetName], 우리는 많은 문제에서 뜻을 같이합니다. 우리 두 국민 국가를 공식적으로 §G연합§!하여 하나의 §H통합 제국§!으로 만들고자 합니다."
 nations.14277.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.14277.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.14277.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 되자."
 nations.14277.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.14277.no:0 "지금은 연합에 합류할 생각이 없다."
 nations.15205.title:0 "외교 통신 채널"
 nations.15205.desc:0 "[Root.GetName]의 사절이군! 우리의 모의 전투에 참가하러 왔나? 아니라면 무엇을 논의하러 왔지?"
 nations.15205.desc.nomad:0 "[Root.GetName]의 사절이군! 우리 방주선 방어 규약을 받아들이러 왔나? 아니라면 그보다 더 중요한 일이 대체 무엇인가?"
 nations.15205.c:0 "핵 공격 사후 보고"
 nations.15205.c.tooltip:0 "선제 핵공격이 유리한 기회가 될지 현지 첩보 책임자와 논의합니다."
 nations.15205.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.15205.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.15205.merge.fanatic.tooltip:0 "§R수년§! 동안 §Y'군국주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.15205.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 될까?"
 nations.15205.merge.normal.tooltip:0 "§R수년간§! §Y'군국주의 연합'§! 상황을 진행해 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§G우호적 관계§!에는 우호도 300 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.15205.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.15205.merge.different.tooltip:0 "§Y'군국주의 연합'§! 상황을 §R수년간§! 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§B매우 우호적 관계§!에는 우호도 750 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.15205.g:0 "작전실 입장"
 nations.15205.g.tooltip:0 "최고 군사 고문들과 전쟁에 관해 논의합니다.\n\n§g도움말) 관계 악화: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.15205.i:0 "평화 협상 제안"
 nations.15220.title:0 "핵 공격 사후 보고"
 nations.15220.desc:0 "[Root.GetRulerTitle] [Root.GetRulerName]님, [FROMFROMFROMFROM.GetName]에 선제 핵공격을 가할 준비를 마치고 대기 중입니다."
 nations.15220.option.nuclear_strike_launched:0 "§Y핵 공격§!을 개시하라!!"
 nations.15220.option.nuclear_strike_blocked:0 "지금은 §Y핵 공격§!을 수행할 수 없습니다."
 nations.15220.option.goodbye:0 "쉬어, [Root.capital_scope.army.Leader.GetName] 장군. 오늘은 때가 아니다."
 nations.15225.title:0 "[FROMFROMFROMFROM.GetName] 파괴됨"
 nations.15225.desc.nuclear_winter_situation:0 "처음에는 밤하늘에 반짝이는 빛들이 보였습니다. 불과 몇 분 뒤, 태양 같은 섬광이 갑작스레 우리를 덮쳤습니다. 국가들이 하나씩 무너졌고, 돌연변이가 된 생존자들은 벙커에서 기어 나와 무덤으로 변한 세상을 되찾으려 했습니다.\n\n우리 제국이 입은 피해는 가장 적지만, 남은 주민들을 하나의 깃발 아래 모으기는 어려울 것입니다. 질서를 다시 세우는 것이 첫 과제입니다."
 nations.15225.desc.nuclear_winter_avoided:0 "상대 국가의 전략 자산을 성공적으로 무력화하자, 그 제국은 혼란 속에 빠르게 해체되었습니다. 이제 그들이 다스리던 땅을 점령하기만 하면 됩니다."
 nations.15225.option.nuclear_winter_situation:0 "살아남기는 했지만... §R핵겨울§!은 이제 시작일 뿐이다..."
 nations.15225.option.nuclear_winter_avoided:0 "우리의 선제 §Y핵 공격§!이 성공했다!"
 nations.15261.name:0 "붕괴"
 nations.15261.desc:0 "[Root.GetName]에서 비보가 들어왔습니다! 그곳에서 교전 중이던 [Root.Owner.GetSubMantleLower] 외계종이 땅굴 입구 근처에 주둔한 아군 부대 전체의 발밑 지반을 붕괴시켰습니다.\n\n추락에서 살아남은 소수의 병사마저 다른 아군 병력이 도착하기 전에 외계종에게 무참히 살해되었습니다."
 nations.15261.a:0 "기필코 갚아주마!"
 nations.15262.name:0 "습격대"
 nations.15262.desc:0 "[Root.GetName]의 우리 식민지 지하에 거주하던 외계종이 어두운 밤을 틈타 땅굴로 소규모 습격대를 보내고 있습니다. 습격대의 공격으로 식민지 주요 시설 하나가 파괴되었고, 습격대는 우리 병력이 대응하기도 전에 지하로 사라졌습니다."
 nations.15262.a:0 "습격을 막아야 합니다!"
 nations.15263.name:0 "지상 공격"
 nations.15263.desc:0 "[Root.GetName]이 또다시 공격받았습니다! [Root.Owner.GetSubMantleLower] 외계종이 우리 주요 정착지 한복판으로 통하는 새 땅굴에서 쏟아져 나왔습니다. 이들은 현지 방어 병력을 제압하고 개척민들을 학살했습니다. 땅굴로 퇴각하면서는 살아남은 몇몇 개척민을 지하로 끌고 갔고, 희생자들의 비명이 울려 퍼졌습니다."
 nations.15263.a:0 "이 살인 행위에는 반드시 대가가 따를 것이다."
 nations.15264.name:0 "지하의 생존자"
 nations.15264.desc:0 "[Root.GetName]의 우리 병력이 식민지 아래의 땅굴망을 조사하던 중 [Root.Owner.GetSubMantleLower] 외계종의 대도시를 발견했습니다. 우리가 신경 가스를 살포하기 전에 지하 제국의 나머지 지역과 스스로를 격리하는 데 성공한 도시입니다. 도시에는 수백만의 외계인이 겁에 질린 채 살고 있습니다. 공병들에게 동굴을 무너뜨려 일을 마무리하라고 지시할까요?"
 nations.15264.a:0 "네, 고통을 끝내 줍시다."
 nations.15264.b:0 "아니요! 지상으로 끌고 옵시다. 노예로 부려먹죠."
 nations.15264.b.subterranean:0 "아니요! 식민지로 끌고 옵시다. 노예로 부려먹죠."
 nations.15265.name:0 "[Root.Owner.GetSubMantleUpper] 확장"
 nations.15265.desc:0 "[Root.GetName]의 동굴망에 살포했던 신경가스를 제거하고, 외계종의 시체를 정리했습니다. 이제 개척민들은 이곳으로 안전하게 이주할 수 있습니다. 물론 외계종이 남긴 원시적인 건물은 모두 철거할 예정이며, 그 자리에 우리의 최첨단 건물이 들어설 것입니다."
 nations.15266.name:0 "금이다!"
 nations.15266.desc:0 "지금은 멸종한 지하 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.15266.desc.subterranean:0 "지금은 멸종한 마그마 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.15267.name:0 "보물고"
 nations.15267.desc:0 "[Root.GetName]의 땅굴망을 탐사하던 정찰대가 한때 지하 외계 제국의 수도였던 도시에서 왕궁에 진입했습니다. 알현실의 거대한 왕좌에는 황제로 보이는 자의 시신이 여전히 앉아 있었습니다.\n\n정찰대는 폭약으로 왕궁 금고를 뚫고 들어가 가득 쌓인 황금과 기이한 외계 예술품을 발견했습니다. 예술품은 [From.Owner.Capital.GetName]의 박물관으로 보내고, 황금은 매각해 국가 예산에 상당한 보탬을 줄 수 있을 것입니다."
 nations.15268.name:0 "[From.GetName]과의 사건"
 nations.15268.desc:0 "우리 §Y사절§! 한 명이 위대한 [From.GetRulerName]에게 무례를 범하여 외교적 사건이 발생했습니다. 즉시 투옥된 사절은 이제 사형 집행인이 대기하는 형식적인 재판에 서게 되었습니다.\n\n§H외교 면책 특권§!을 주장할 수는 있지만, 심각한 §R외교적 파장§!이 발생할 것입니다."
 nations.15268.a:0 "외교관 면책 특권을 주장하라! 그 사절은 살아 있어야 한다."
 nations.15268.b:0 "처형을 승인하라. 후폭풍을 감수할 수는 없다..."
 nations.15269.name:0 "[From.GetName]의 기근"
 nations.15269.desc:0 "§H[From.GetName]§!의 대표단이 찾아왔습니다. 최근 어려움을 겪고 있으며 §R기근§!의 위협에 직면했다고 합니다.\n\n그들은 우리가 할 수 있는 어떤 도움이라도 제공해 달라고 호소하고 있습니다..."
 nations.15269.a:0 "물론이죠. 힘닿는 데까지 지원하겠습니다."
 nations.15269.b:0 "스스로 살아남아야 한다."
 nations.15269.c:0 "나눠줄 식량이 부족하다..."
 ethic_fanatic_militarist_nation_pleased:0 "그 결과 §H$ethic_militarist$ [FROM.GetName]§!과의 관계가 §G개선§!됩니다."
 ethic_fanatic_militarist_nation_displeased:0 "그 결과 §H$ethic_militarist$ [FROM.GetName]§!과의 관계가 §R악화§!됩니다."
 nations.15270.name:0 "$ethic_militarist$의 선물"
 nations.15270.desc:0 "두 문명 간의 우호를 기념하는 선물로 §H[FROM.GetName]§!의 최고 장군이 우리 지휘부에 자신들의 §Y$tech_centralized_command$§! 체계가 작동하는 방식을 가르쳐 주었습니다.\n\n이 통찰을 바탕으로 사관학교에서 가르칠 우리만의 군사 이론을 수립할 수 있습니다."
 nations.15270.a:0 "이 군사 이론은 크게 도움이 될 것이다!"
 nations.15271.name:0 "[From.GetName]의 평화주의자"
 nations.15271.desc:0 "§H[FROM.GetName]§!에서 온 대규모 §H평화주의 난민§! 집단이 소규모 군대에 쫓겨 우리 국경에 도착했습니다. 이들은 강제 징집이 자신들의 윤리 원칙을 침해한다며 도망쳤습니다.\n\n우리 제국에 피난처를 제공하면 최고 장군 [From.GetRulerName]의 분노를 살 것이 분명합니다. 반면 추격군이 이들을 데려가게 두면 평화주의자들은 총알받이로 죽을 가능성이 큽니다... 하지만 그 나라로부터 §G호의§!를 얻을 수도 있습니다."
 nations.15271.a:0 "그들이 원한다면, 받아주겠습니다."
 nations.15271.b:0 "정치적 갈등은 피해야 합니다. 돌려보내세요."
 nations.15271.xenophobe:0 "외부인을 우리 나라에 들일 수 없다."
 nations.15271.civic_fanatic_purifiers:0 "양쪽 모두 보이는 즉시 죽여라."
 ethic_fanatic_militarist_nation_refugees:0 "§Y$ethic_pacifist$§! §Y[FROM.GetSpeciesNamePlural]§! £pop£ §G800§!명이 우리 제국에 합류합니다."
 nations.15272.name:0 "$ethic_egalitarian$ 문화 교류"
 nations.15272.desc:0 "여러 사절이 §H[FROM.GetName]§! 주민들과 오랜 시간을 함께 보낸 뒤 돌아왔습니다. 그곳의 생활 방식과 관습을 배웠으니 우리 사회학 연구에 분명 도움이 될 것입니다.\n\n하지만 새로운 문화에는 새로운 사상도 따라옵니다... 대중의 §H자유로운 교류§!를 허용할까요?"
 nations.15272.a:0 "우리 국민들은 재화와 사상을 자유롭게 교환할 수 있다."
 nations.15272.b:0 "출입하는 모든 것을 엄격하게 규제하겠다."
 nations.15273.name:0 "무기 시험 대참사!"
 nations.15273.desc:0 "실험용 무기 시험 중 §R치명적인 실패§!가 발생했습니다! §H[FROM.GetName]§!은 무기의 조준 장치 계산 오류로 우리 정착지에 직격탄이 발사되어 많은 [Root.GetSpeciesName]이 사망했다고 설명합니다.\n\n그들은 사정을 해명하고 사고에 대해 사과했지만, 시민들은 정부가 §P배상을 요구§!하고 중대한 실수를 문책해야 한다고 주장합니다."
 nations.15273.nomad:0 "실험용 무기 시험 중 §R치명적인 실패§!가 발생했습니다! §H[FROM.GetName]§!은 무기의 조준 장치 계산 오류로 우리 정착지에 직격탄이 발사되어 많은 [Root.GetSpeciesName]이 사망했다고 설명합니다.\n\n그들은 사정을 해명하고 사고에 대해 사과했지만, 시민들은 정부가 §P배상을 요구§!하고 중대한 실수를 문책해야 한다고 주장합니다."
 nations.15273.a:0 "안타까운 기술적 오류였다. 용서하라."
 nations.15273.b:0 "그들을 질책하고 배상을 요구하라!"
 nations.15274.name:0 "기술 전수 요청"
 nations.15274.desc:0 "우리 보안군이 갖춘 §H첨단 무기§!를 본 §H[FROM.GetName]§!의 장군 여럿이 군사 기술 일부를 공유해 달라고 요청했습니다.\n\n우리 장교들은 이를 망설입니다. 만약 전쟁이 일어난다면 그 권위주의 국가를 전장에서 상대하기가 더 어려워질 것이기 때문입니다.\n\n하지만 요청을 거절하면 위대한 [From.GetRulerName]은 분명 모욕으로 받아들일 것입니다."
 nations.15274.a:0 "권위주의자들에게 더 좋은 무기를 쥐여 주는 것은 나쁜 생각이다."
 nations.15274.b:0 "친구끼리 나누며 살아야죠."
 nations.15275.name:0 "메시지 수신"
 nations.15275.desc:0 "최근 §H[FROM.GetName]§!과의 교역이 뜸해지면서 상단의 방문도 점점 드물어졌습니다. 오늘은 그들의 군 대표에게서 메시지가 도착했습니다. 그다지 기분이 좋지는 않아 보입니다."
 nations.15275.a:0 "어떤 내용인지 봅시다."
 nations.15276.name:0 "메시지"
 nations.15276.desc:0 "지상인. 우리는 좋은 이웃이 되려 했으나, 그대들에게는 우리의 영광스러운 문명과 위대한 [From.GetRulerName]께 마땅한 존중을 보일 뜻이 없다는 점이 분명해졌다.\n\n이에 황제께서는 우리의 정당한 권리에 따라 이 행성 전체를 차지하라고 명하셨다. 그대들을 정복하겠다!"
 nations.15276.a:0 "§H[FROM.GetName]§! 국경에 방어 태세를 갖춰라!"
 nations.15277.name:0 "[FROM.GetName]의 연합 제안"
 nations.15277.desc:0 "[ROOT.GetName], 우리는 많은 문제에서 뜻을 같이합니다. 우리 두 국민 국가를 공식적으로 §G연합§!하여 하나의 §H통합 제국§!으로 만들고자 합니다."
 nations.15277.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.15277.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.15277.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 되자."
 nations.15277.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.15277.no:0 "지금은 연합에 합류할 생각이 없다."
 nations.16205.title:0 "외교 통신 채널"
 nations.16205.desc:0 "[Root.GetName]에 평화가 함께하기를. 어떤 외교 사안을 논의할까요?"
 nations.16205.desc.nomad:0 "평화가 함께하기를, [Root.GetName]. 어떤 방주선 사안을 협상하고 싶은가?"
 nations.16205.c:0 "핵 공격 사후 보고"
 nations.16205.c.tooltip:0 "선제 핵공격이 유리한 기회가 될지 현지 첩보 책임자와 논의합니다."
 nations.16205.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.16205.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.16205.merge.fanatic.tooltip:0 "§R수년§! 동안 §Y'평화주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.16205.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 될까?"
 nations.16205.merge.normal.tooltip:0 "§R수년간§! §Y'평화주의 연합'§! 상황을 진행해 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§G우호적 관계§!에는 우호도 300 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.16205.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.16205.merge.different.tooltip:0 "§Y'평화주의 연합'§! 상황을 §R수년간§! 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§B매우 우호적 관계§!에는 우호도 750 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.16205.g:0 "작전실 입장"
 nations.16205.g.tooltip:0 "최고 군사 고문들과 전쟁에 관해 논의합니다.\n\n§g도움말) 관계 악화: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.16205.i:0 "평화 협상 제안"
 nations.16220.title:0 "핵 공격 사후 보고"
 nations.16220.desc:0 "[Root.GetRulerTitle] [Root.GetRulerName]님, [FROMFROMFROMFROM.GetName]에 선제 핵공격을 가할 준비를 마치고 대기 중입니다."
 nations.16220.option.nuclear_strike_launched:0 "§Y핵 공격§!을 개시하라!!"
 nations.16220.option.nuclear_strike_blocked:0 "지금은 §Y핵 공격§!을 수행할 수 없습니다."
 nations.16220.option.goodbye:0 "쉬어, [Root.capital_scope.army.Leader.GetName] 장군. 오늘은 때가 아니다."
 nations.16225.title:0 "[FROMFROMFROMFROM.GetName] 파괴됨"
 nations.16225.desc.nuclear_winter_situation:0 "처음에는 밤하늘에 반짝이는 빛들이 보였습니다. 불과 몇 분 뒤, 태양 같은 섬광이 갑작스레 우리를 덮쳤습니다. 국가들이 하나씩 무너졌고, 돌연변이가 된 생존자들은 벙커에서 기어 나와 무덤으로 변한 세상을 되찾으려 했습니다.\n\n우리 제국이 입은 피해는 가장 적지만, 남은 주민들을 하나의 깃발 아래 모으기는 어려울 것입니다. 질서를 다시 세우는 것이 첫 과제입니다."
 nations.16225.desc.nuclear_winter_avoided:0 "상대 국가의 전략 자산을 성공적으로 무력화하자, 그 제국은 혼란 속에 빠르게 해체되었습니다. 이제 그들이 다스리던 땅을 점령하기만 하면 됩니다."
 nations.16225.option.nuclear_winter_situation:0 "살아남기는 했지만... §R핵겨울§!은 이제 시작일 뿐이다..."
 nations.16225.option.nuclear_winter_avoided:0 "우리의 선제 §Y핵 공격§!이 성공했다!"
 nations.16261.name:0 "붕괴"
 nations.16261.desc:0 "[Root.GetName]에서 비보가 들어왔습니다! 그곳에서 교전 중이던 [Root.Owner.GetSubMantleLower] 외계종이 땅굴 입구 근처에 주둔한 아군 부대 전체의 발밑 지반을 붕괴시켰습니다.\n\n추락에서 살아남은 소수의 병사마저 다른 아군 병력이 도착하기 전에 외계종에게 무참히 살해되었습니다."
 nations.16261.a:0 "기필코 갚아주마!"
 nations.16262.name:0 "습격대"
 nations.16262.desc:0 "[Root.GetName]의 우리 식민지 지하에 거주하던 외계종이 어두운 밤을 틈타 땅굴로 소규모 습격대를 보내고 있습니다. 습격대의 공격으로 식민지 주요 시설 하나가 파괴되었고, 습격대는 우리 병력이 대응하기도 전에 지하로 사라졌습니다."
 nations.16262.a:0 "습격을 막아야 합니다!"
 nations.16263.name:0 "지상 공격"
 nations.16263.desc:0 "[Root.GetName]이 또다시 공격받았습니다! [Root.Owner.GetSubMantleLower] 외계종이 우리 주요 정착지 한복판으로 통하는 새 땅굴에서 쏟아져 나왔습니다. 이들은 현지 방어 병력을 제압하고 개척민들을 학살했습니다. 땅굴로 퇴각하면서는 살아남은 몇몇 개척민을 지하로 끌고 갔고, 희생자들의 비명이 울려 퍼졌습니다."
 nations.16263.a:0 "이 살인 행위에는 반드시 대가가 따를 것이다."
 nations.16264.name:0 "지하의 생존자"
 nations.16264.desc:0 "[Root.GetName]의 우리 병력이 식민지 아래의 땅굴망을 조사하던 중 [Root.Owner.GetSubMantleLower] 외계종의 대도시를 발견했습니다. 우리가 신경 가스를 살포하기 전에 지하 제국의 나머지 지역과 스스로를 격리하는 데 성공한 도시입니다. 도시에는 수백만의 외계인이 겁에 질린 채 살고 있습니다. 공병들에게 동굴을 무너뜨려 일을 마무리하라고 지시할까요?"
 nations.16264.a:0 "네, 고통을 끝내 줍시다."
 nations.16264.b:0 "아니요! 지상으로 끌고 옵시다. 노예로 부려먹죠."
 nations.16264.b.subterranean:0 "아니요! 식민지로 끌고 옵시다. 노예로 부려먹죠."
 nations.16265.name:0 "[Root.Owner.GetSubMantleUpper] 확장"
 nations.16265.desc:0 "[Root.GetName]의 동굴망에 살포했던 신경가스를 제거하고, 외계종의 시체를 정리했습니다. 이제 개척민들은 이곳으로 안전하게 이주할 수 있습니다. 물론 외계종이 남긴 원시적인 건물은 모두 철거할 예정이며, 그 자리에 우리의 최첨단 건물이 들어설 것입니다."
 nations.16266.name:0 "금이다!"
 nations.16266.desc:0 "지금은 멸종한 지하 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.16266.desc.subterranean:0 "지금은 멸종한 마그마 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.16267.name:0 "보물고"
 nations.16267.desc:0 "[Root.GetName]의 땅굴망을 탐사하던 정찰대가 한때 지하 외계 제국의 수도였던 도시에서 왕궁에 진입했습니다. 알현실의 거대한 왕좌에는 황제로 보이는 자의 시신이 여전히 앉아 있었습니다.\n\n정찰대는 폭약으로 왕궁 금고를 뚫고 들어가 가득 쌓인 황금과 기이한 외계 예술품을 발견했습니다. 예술품은 [From.Owner.Capital.GetName]의 박물관으로 보내고, 황금은 매각해 국가 예산에 상당한 보탬을 줄 수 있을 것입니다."
 nations.16268.name:0 "[From.GetName]과의 사건"
 nations.16268.desc:0 "우리 §Y사절§! 한 명이 위대한 [From.GetRulerName]에게 무례를 범하여 외교적 사건이 발생했습니다. 즉시 투옥된 사절은 이제 사형 집행인이 대기하는 형식적인 재판에 서게 되었습니다.\n\n§H외교 면책 특권§!을 주장할 수는 있지만, 심각한 §R외교적 파장§!이 발생할 것입니다."
 nations.16268.a:0 "외교관 면책 특권을 주장하라! 그 사절은 살아 있어야 한다."
 nations.16268.b:0 "처형을 승인하라. 후폭풍을 감수할 수는 없다..."
 nations.16269.name:0 "[From.GetName]의 기근"
 nations.16269.desc:0 "§H[From.GetName]§!의 대표단이 찾아왔습니다. 최근 어려움을 겪고 있으며 §R기근§!의 위협에 직면했다고 합니다.\n\n그들은 우리가 할 수 있는 어떤 도움이라도 제공해 달라고 호소하고 있습니다..."
 nations.16269.a:0 "물론이죠. 힘닿는 데까지 지원하겠습니다."
 nations.16269.b:0 "스스로 살아남아야 한다."
 nations.16269.c:0 "나눠줄 식량이 부족하다..."
 ethic_fanatic_pacifist_nation_pleased:0 "그 결과 §H$ethic_pacifist$ [FROM.GetName]§!과의 관계가 §G개선§!됩니다."
 ethic_fanatic_pacifist_nation_displeased:0 "그 결과 §H$ethic_pacifist$ [FROM.GetName]§!과의 관계가 §R악화§!됩니다."
 nations.16270.name:0 "$ethic_pacifist$의 선물"
 nations.16270.desc:0 "두 문명의 우정을 기념하는 선물로, §H[FROM.GetName]§!의 사절이 §Y$tech_agri_consortium$§!에 관한 통찰을 전해 주었습니다.\n\n이 무역 정책은 무역 흑자보다 식량 생산에 자금을 우선 배정합니다."
 nations.16270.a:0 "참 친절하군."
 nations.16270.b:0 "농업 보조금이라고? 이 무역 정책을 시행하라!"
 nations.16271.name:0 "망명 군사 정권"
 nations.16271.desc:0 "고압적인 §Y용병 집단§!이 군사 정권 수립에 실패한 뒤 §H[FROM.GetName]§!에서 달아나고 있습니다. 국경에 도착한 이들은 외교적 보호를 받는 대가로 우리 군에 §G복무를 맹세§!하겠다고 제안했습니다.\n\n맹세를 받아들이면 [FROM.GetName]이 분노할 것이 분명하며, §P군국주의 운동§!이 발생할 수도 있습니다. 하지만 추격군이 이들을 데려가게 두면 평생 수감될 가능성이 큽니다."
 nations.16271.a:0 "용병 부대를 우리 군에 편입하라."
 nations.16271.b:0 "군사 정권을 보호하는 것은 좋지 않다..."
 nations.16271.xenophobe:0 "외부인을 우리 나라에 들일 수 없다."
 nations.16271.civic_fanatic_purifiers:0 "양쪽 모두 보이는 즉시 죽여라."
 ethic_fanatic_pacifist_nation_refugees:0 "§Y$ethic_militarist$§! §Y[FROM.GetSpeciesNamePlural]§! £pop£ §G800§!명이 우리 제국에 합류합니다."
 nations.16272.name:0 "$ethic_pacifist$ 문화 교류"
 nations.16272.desc:0 "여러 사절이 §H[FROM.GetName]§! 주민들과 오랜 시간을 함께 보낸 뒤 돌아왔습니다. 그곳의 생활 방식과 관습을 배웠으니 우리 사회학 연구에 분명 도움이 될 것입니다.\n\n하지만 새로운 문화에는 새로운 사상도 따라옵니다... 대중의 §H자유로운 교류§!를 허용할까요?"
 nations.16272.a:0 "우리 국민들은 재화와 사상을 자유롭게 교환할 수 있다."
 nations.16272.b:0 "출입하는 모든 것을 엄격하게 규제하겠다."
 nations.16273.name:0 "[From.GetName] 관련 사망 사고"
 nations.16273.desc:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 우주로 향하던 로켓이 비행 중 동력을 잃고 우리 인근 정착지에 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.16273.nomad:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 정기 정비 작업이 크게 잘못되어 공중 도크가 우리 인근 정착지로 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.16273.a:0 "눈감아 주도록 하죠."
 nations.16273.b:0 "꼭 사죄를 받아야겠습니다!"
 nations.16274.name:0 "기술 전수 요청"
 nations.16274.desc:0 "§Y$tech_frontier_health$§!를 본 뒤 §H[FROM.GetName]§!의 여러 사절이 의료 기술을 공유해 달라고 요청했습니다.\n\n우리 과학자들은 우선 과제에서 연구 자금이 빠져나갈 것을 우려하며 망설이고 있습니다.\n\n요청을 거절하면 그들의 지도자 [From.GetRulerName](은)는 이를 도움이 필요한 모든 이들에 대한 모욕으로 여겨 양국 관계가 악화될 것입니다."
 nations.16274.a:0 "현재의 연구 중점을 유지해야 한다."
 nations.16274.b:0 "친구끼리 나누며 살아야죠."
 nations.16275.name:0 "메시지 수신"
 nations.16275.desc:0 "최근 §H[FROM.GetName]§!과의 교역이 뜸해지면서 상단의 방문도 점점 드물어졌습니다. 오늘은 그들의 군 대표에게서 메시지가 도착했습니다. 그다지 기분이 좋지는 않아 보입니다."
 nations.16275.a:0 "어떤 내용인지 봅시다."
 nations.16276.name:0 "메시지"
 nations.16276.desc:0 "지상인. 우리는 좋은 이웃이 되려 했으나, 그대들에게는 우리의 영광스러운 문명과 위대한 [From.GetRulerName]께 마땅한 존중을 보일 뜻이 없다는 점이 분명해졌다.\n\n이에 황제께서는 우리의 정당한 권리에 따라 이 행성 전체를 차지하라고 명하셨다. 그대들을 정복하겠다!"
 nations.16276.a:0 "§H[FROM.GetName]§! 국경에 방어 태세를 갖춰라!"
 nations.16277.name:0 "[FROM.GetName]의 연합 제안"
 nations.16277.desc:0 "[ROOT.GetName], 우리는 많은 문제에서 뜻을 같이합니다. 우리 두 국민 국가를 공식적으로 §G연합§!하여 하나의 §H통합 제국§!으로 만들고자 합니다."
 nations.16277.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.16277.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.16277.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 되자."
 nations.16277.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.16277.no:0 "지금은 연합에 합류할 생각이 없다."
 nations.17205.title:0 "외교 통신 채널"
 nations.17205.desc:0 "[Root.GetName]에 신의 가호가 있기를. 우리의 외교가 위대한 계획을 진전시키기를 바랍니다."
 nations.17205.desc.nomad:0 "[Root.GetName]에 신의 가호가 있기를. 우리의 외교가 방주선을 위대한 계획으로 인도하기를 바랍니다."
 nations.17205.c:0 "핵 공격 사후 보고"
 nations.17205.c.tooltip:0 "선제 핵공격이 유리한 기회가 될지 현지 첩보 책임자와 논의합니다."
 nations.17205.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.17205.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.17205.merge.fanatic.tooltip:0 "§R수년§! 동안 §Y'정신주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.17205.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 될까?"
 nations.17205.merge.normal.tooltip:0 "§R수년§! 동안 §Y'정신주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§G우호적 관계§!에는 우호도 300 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.17205.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.17205.merge.different.tooltip:0 "§R수년간§! §Y'정신주의 연합'§! 상황을 진행해 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§B매우 우호적 관계§!에는 우호도 750 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.17205.g:0 "작전실 입장"
 nations.17205.g.tooltip:0 "최고 군사 고문들과 전쟁에 관해 논의합니다.\n\n§g도움말) 관계 악화: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.17205.i:0 "평화 협상 제안"
 nations.17220.title:0 "핵 공격 사후 보고"
 nations.17220.desc:0 "[Root.GetRulerTitle] [Root.GetRulerName]님, [FROMFROMFROMFROM.GetName]에 선제 핵공격을 가할 준비를 마치고 대기 중입니다."
 nations.17220.option.nuclear_strike_launched:0 "§Y핵 공격§!을 개시하라!!"
 nations.17220.option.nuclear_strike_blocked:0 "지금은 §Y핵 공격§!을 수행할 수 없습니다."
 nations.17220.option.goodbye:0 "쉬어, [Root.capital_scope.army.Leader.GetName] 장군. 오늘은 때가 아니다."
 nations.17225.title:0 "[FROMFROMFROMFROM.GetName] 파괴됨"
 nations.17225.desc.nuclear_winter_situation:0 "처음에는 밤하늘에 반짝이는 빛들이 보였습니다. 불과 몇 분 뒤, 태양 같은 섬광이 갑작스레 우리를 덮쳤습니다. 국가들이 하나씩 무너졌고, 돌연변이가 된 생존자들은 벙커에서 기어 나와 무덤으로 변한 세상을 되찾으려 했습니다.\n\n우리 제국이 입은 피해는 가장 적지만, 남은 주민들을 하나의 깃발 아래 모으기는 어려울 것입니다. 질서를 다시 세우는 것이 첫 과제입니다."
 nations.17225.desc.nuclear_winter_avoided:0 "상대 국가의 전략 자산을 성공적으로 무력화하자, 그 제국은 혼란 속에 빠르게 해체되었습니다. 이제 그들이 다스리던 땅을 점령하기만 하면 됩니다."
 nations.17225.option.nuclear_winter_situation:0 "살아남기는 했지만... §R핵겨울§!은 이제 시작일 뿐이다..."
 nations.17225.option.nuclear_winter_avoided:0 "우리의 선제 §Y핵 공격§!이 성공했다!"
 nations.17261.name:0 "붕괴"
 nations.17261.desc:0 "[Root.GetName]에서 비보가 들어왔습니다! 그곳에서 교전 중이던 [Root.Owner.GetSubMantleLower] 외계종이 땅굴 입구 근처에 주둔한 아군 부대 전체의 발밑 지반을 붕괴시켰습니다.\n\n추락에서 살아남은 소수의 병사마저 다른 아군 병력이 도착하기 전에 외계종에게 무참히 살해되었습니다."
 nations.17261.a:0 "기필코 갚아주마!"
 nations.17262.name:0 "습격대"
 nations.17262.desc:0 "[Root.GetName]의 우리 식민지 지하에 거주하던 외계종이 어두운 밤을 틈타 땅굴로 소규모 습격대를 보내고 있습니다. 습격대의 공격으로 식민지 주요 시설 하나가 파괴되었고, 습격대는 우리 병력이 대응하기도 전에 지하로 사라졌습니다."
 nations.17262.a:0 "습격을 막아야 합니다!"
 nations.17263.name:0 "지상 공격"
 nations.17263.desc:0 "[Root.GetName]이 또다시 공격받았습니다! [Root.Owner.GetSubMantleLower] 외계종이 우리 주요 정착지 한복판으로 통하는 새 땅굴에서 쏟아져 나왔습니다. 이들은 현지 방어 병력을 제압하고 개척민들을 학살했습니다. 땅굴로 퇴각하면서는 살아남은 몇몇 개척민을 지하로 끌고 갔고, 희생자들의 비명이 울려 퍼졌습니다."
 nations.17263.a:0 "이 살인 행위에는 반드시 대가가 따를 것이다."
 nations.17264.name:0 "지하의 생존자"
 nations.17264.desc:0 "[Root.GetName]의 우리 병력이 식민지 아래의 땅굴망을 조사하던 중 [Root.Owner.GetSubMantleLower] 외계종의 대도시를 발견했습니다. 우리가 신경 가스를 살포하기 전에 지하 제국의 나머지 지역과 스스로를 격리하는 데 성공한 도시입니다. 도시에는 수백만의 외계인이 겁에 질린 채 살고 있습니다. 공병들에게 동굴을 무너뜨려 일을 마무리하라고 지시할까요?"
 nations.17264.a:0 "네, 고통을 끝내 줍시다."
 nations.17264.b:0 "아니요! 지상으로 끌고 옵시다. 노예로 부려먹죠."
 nations.17264.b.subterranean:0 "아니요! 식민지로 끌고 옵시다. 노예로 부려먹죠."
 nations.17265.name:0 "[Root.Owner.GetSubMantleUpper] 확장"
 nations.17265.desc:0 "[Root.GetName]의 동굴망에 살포했던 신경가스를 제거하고, 외계종의 시체를 정리했습니다. 이제 개척민들은 이곳으로 안전하게 이주할 수 있습니다. 물론 외계종이 남긴 원시적인 건물은 모두 철거할 예정이며, 그 자리에 우리의 최첨단 건물이 들어설 것입니다."
 nations.17266.name:0 "금이다!"
 nations.17266.desc:0 "지금은 멸종한 지하 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.17266.desc.subterranean:0 "지금은 멸종한 마그마 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.17267.name:0 "보물고"
 nations.17267.desc:0 "[Root.GetName]의 땅굴망을 탐사하던 정찰대가 한때 지하 외계 제국의 수도였던 도시에서 왕궁에 진입했습니다. 알현실의 거대한 왕좌에는 황제로 보이는 자의 시신이 여전히 앉아 있었습니다.\n\n정찰대는 폭약으로 왕궁 금고를 뚫고 들어가 가득 쌓인 황금과 기이한 외계 예술품을 발견했습니다. 예술품은 [From.Owner.Capital.GetName]의 박물관으로 보내고, 황금은 매각해 국가 예산에 상당한 보탬을 줄 수 있을 것입니다."
 nations.17268.name:0 "[From.GetName]과의 사건"
 nations.17268.desc:0 "우리 §Y사절§! 한 명이 위대한 [From.GetRulerName]에게 무례를 범하여 외교적 사건이 발생했습니다. 즉시 투옥된 사절은 이제 사형 집행인이 대기하는 형식적인 재판에 서게 되었습니다.\n\n§H외교 면책 특권§!을 주장할 수는 있지만, 심각한 §R외교적 파장§!이 발생할 것입니다."
 nations.17268.a:0 "외교관 면책 특권을 주장하라! 그 사절은 살아 있어야 한다."
 nations.17268.b:0 "처형을 승인하라. 후폭풍을 감수할 수는 없다..."
 nations.17269.name:0 "[From.GetName]의 기근"
 nations.17269.desc:0 "§H[From.GetName]§!의 대표단이 찾아왔습니다. 최근 어려움을 겪고 있으며 §R기근§!의 위협에 직면했다고 합니다.\n\n그들은 우리가 할 수 있는 어떤 도움이라도 제공해 달라고 호소하고 있습니다..."
 nations.17269.a:0 "물론이죠. 힘닿는 데까지 지원하겠습니다."
 nations.17269.b:0 "스스로 살아남아야 한다."
 nations.17269.c:0 "나눠줄 식량이 부족하다..."
 ethic_fanatic_spiritualist_nation_pleased:0 "그 결과 §H$ethic_spiritualist$ [FROM.GetName]§!과의 관계가 §G개선§!됩니다."
 ethic_fanatic_spiritualist_nation_displeased:0 "그 결과 §H$ethic_spiritualist$ [FROM.GetName]§!과의 관계가 §R악화§!됩니다."
 nations.17270.name:0 "$ethic_spiritualist$의 선물"
 nations.17270.desc:0 "두 문명의 우호를 기념하는 선물로 §H[FROM.GetName]§!의 사절이 §Y$tech_psionic_theory$§!에 관한 지식을 전해왔습니다. 대사제 [FROM.GetRulerName]께서 은혜롭게 하사한 것입니다."
 nations.17270.a:0 "장막에 대한 가르침이라니? 친절하군."
 nations.17270.materialist:0 "정신주의자의 헛소리군."
 nations.17271.name:0 "무신론자 박해"
 nations.17271.desc:0 "§Y물질주의 난민§! 무리가 §H[FROM.GetName]§!의 박해를 피해 달아나고 있습니다. 심문관 부대가 빠르게 쫓아오는 가운데, 이들은 우리 국경 안에서 피난처와 보호를 제공해 달라고 간청했습니다.\n\n그들을 받아들이면 심문관들의 지도자인 대사제 [From.GetRulerName]이 크게 분노할 것입니다. 또한 이들의 거주를 허용하면 제국 내에서 §P물질주의 운동§!이 힘을 얻을 수도 있습니다.\n"
 nations.17271.a:0 "그들이 원한다면, 받아주겠습니다."
 nations.17271.b:0 "정치적 갈등은 피해야 합니다. 돌려보내세요."
 nations.17271.xenophobe:0 "외부인을 우리 나라에 들일 수 없다."
 nations.17271.civic_fanatic_purifiers:0 "양쪽 모두 보이는 즉시 죽여라."
 ethic_fanatic_spiritualist_nation_refugees:0 "§Y$ethic_materialist$§! §Y[FROM.GetSpeciesNamePlural]§! £pop£ §G800§!명이 우리 제국에 합류합니다."
 nations.17272.name:0 "$ethic_spiritualist$ 문화 교류"
 nations.17272.desc:0 "여러 사절이 §H[FROM.GetName]§! 주민들과 오랜 시간을 함께 보낸 뒤 돌아왔습니다. 그곳의 생활 방식과 관습을 배웠으니 우리 사회학 연구에 분명 도움이 될 것입니다.\n\n하지만 새로운 문화에는 새로운 사상도 따라옵니다... 대중의 §H자유로운 교류§!를 허용할까요?"
 nations.17272.a:0 "우리 국민들은 재화와 사상을 자유롭게 교환할 수 있다."
 nations.17272.b:0 "출입하는 모든 것을 엄격하게 규제하겠다."
 nations.17273.name:0 "[From.GetName]의 사망 사고"
 nations.17273.desc:0 "§H[FROM.GetName]§! 국경 근처에서 §R불행한 사고§!가 발생했습니다. 우주로 향하던 로켓이 비행 중 동력을 잃고 우리 인근 정착지에 추락했습니다.\n\n[ROOT.GetName]의 국민들은 [FROM.GetName]의 과실을 공개적으로 규탄하라고 요구하고 있습니다. 하지만 용서해 준다면 그들은 우리에게 §G호의§!를 빚지게 될 것입니다."
 nations.17273.nomad:0 "§H[FROM.GetName]§! 국경 근처에서 §R불행한 사고§!가 발생했습니다. 정기 정비 작업이 크게 잘못되어 공중 도크가 우리 인근 정착지에 추락했습니다.\n\n[ROOT.GetName]의 국민들은 [FROM.GetName]의 과실을 공개적으로 규탄하라고 요구하고 있습니다. 하지만 용서해 준다면 그들은 우리에게 §G호의§!를 빚지게 될 것입니다."
 nations.17273.a:0 "그들의 실수를 용서하겠다."
 nations.17273.b:0 "배상을 요구해야 한다!"
 nations.17274.name:0 "기술 전수 요청"
 nations.17274.desc:0 "§Y$tech_frontier_health$§!를 본 뒤 §H[FROM.GetName]§!의 여러 사절이 의료 기술을 공유해 달라고 요청했습니다.\n\n우리 과학자들은 우선 과제에서 연구 자금이 빠져나갈 것을 우려하며 망설이고 있습니다.\n\n도움을 거절하면 그들의 대사제 [From.GetRulerName](은)는 이를 성스러운 가르침에 대한 신성 모독으로 여겨 양국 관계가 악화될 것입니다."
 nations.17274.a:0 "현재의 연구 중점을 유지해야 한다."
 nations.17274.b:0 "친구끼리 나누며 살아야죠."
 nations.17275.name:0 "메시지 수신"
 nations.17275.desc:0 "최근 §H[FROM.GetName]§!과의 교역이 뜸해지면서 상단의 방문도 점점 드물어졌습니다. 오늘은 그들의 군 대표에게서 메시지가 도착했습니다. 그다지 기분이 좋지는 않아 보입니다."
 nations.17275.a:0 "어떤 내용인지 봅시다."
 nations.17276.name:0 "메시지"
 nations.17276.desc:0 "지상인. 우리는 좋은 이웃이 되려 했으나, 그대들에게는 우리의 영광스러운 문명과 위대한 [From.GetRulerName]께 마땅한 존중을 보일 뜻이 없다는 점이 분명해졌다.\n\n이에 황제께서는 우리의 정당한 권리에 따라 이 행성 전체를 차지하라고 명하셨다. 그대들을 정복하겠다!"
 nations.17276.a:0 "§H[FROM.GetName]§! 국경에 방어 태세를 갖춰라!"
 nations.17277.name:0 "[FROM.GetName]의 연합 제안"
 nations.17277.desc:0 "[ROOT.GetName], 우리는 많은 문제에서 뜻을 같이합니다. 우리 두 국민 국가를 공식적으로 §G연합§!하여 하나의 §H통합 제국§!으로 만들고자 합니다."
 nations.17277.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.17277.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.17277.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 되자."
 nations.17277.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.17277.no:0 "지금은 연합에 합류할 생각이 없다."
 nations.18205.title:0 "외교 통신 채널"
 nations.18205.desc:0 "[Root.GetName]의 사절이여, 환영한다. 우리의 외교가 [Root.Capital.GetName] 전역의 과학 지식을 발전시키기를 바란다."
 nations.18205.desc.nomad:0 "[Root.GetName]의 사절께 인사드립니다. 우리의 외교가 방주선 고고학 연구를 진전시키고 [Root.Capital.GetName] 곳곳에 흩어진 §E소실 기술§!을 회수하는 데 도움이 되기를 바랍니다."
 nations.18205.c:0 "핵 공격 사후 보고"
 nations.18205.c.tooltip:0 "선제 핵공격이 유리한 기회가 될지 현지 첩보 책임자와 논의합니다."
 nations.18205.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.18205.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.18205.merge.fanatic.tooltip:0 "§R수년§! 동안 §Y'물질주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.18205.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 될까?"
 nations.18205.merge.normal.tooltip:0 "§R수년간§! §Y'물질주의 연합'§! 상황을 진행해 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§G우호적 관계§!에는 우호도 300 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.18205.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.18205.merge.different.tooltip:0 "§R수년§! 동안 §Y'물질주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§B매우 우호적 관계§!에는 우호도 750 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.18205.g:0 "작전실 입장"
 nations.18205.g.tooltip:0 "최고 군사 고문들과 전쟁에 관해 논의합니다.\n\n§g도움말) 관계 악화: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.18205.i:0 "평화 협상 제안"
 nations.18220.title:0 "핵 공격 사후 보고"
 nations.18220.desc:0 "[Root.GetRulerTitle] [Root.GetRulerName]님, [FROMFROMFROMFROM.GetName]에 선제 핵공격을 가할 준비를 마치고 대기 중입니다."
 nations.18220.option.nuclear_strike_launched:0 "§Y핵 공격§!을 개시하라!!"
 nations.18220.option.nuclear_strike_blocked:0 "지금은 §Y핵 공격§!을 수행할 수 없습니다."
 nations.18220.option.goodbye:0 "쉬어, [Root.capital_scope.army.Leader.GetName] 장군. 오늘은 때가 아니다."
 nations.18225.title:0 "[FROMFROMFROMFROM.GetName] 파괴됨"
 nations.18225.desc.nuclear_winter_situation:0 "처음에는 밤하늘에 반짝이는 빛들이 보였습니다. 불과 몇 분 뒤, 태양 같은 섬광이 갑작스레 우리를 덮쳤습니다. 국가들이 하나씩 무너졌고, 돌연변이가 된 생존자들은 벙커에서 기어 나와 무덤으로 변한 세상을 되찾으려 했습니다.\n\n우리 제국이 입은 피해는 가장 적지만, 남은 주민들을 하나의 깃발 아래 모으기는 어려울 것입니다. 질서를 다시 세우는 것이 첫 과제입니다."
 nations.18225.desc.nuclear_winter_avoided:0 "상대 국가의 전략 자산을 성공적으로 무력화하자, 그 제국은 혼란 속에 빠르게 해체되었습니다. 이제 그들이 다스리던 땅을 점령하기만 하면 됩니다."
 nations.18225.option.nuclear_winter_situation:0 "살아남기는 했지만... §R핵겨울§!은 이제 시작일 뿐이다..."
 nations.18225.option.nuclear_winter_avoided:0 "우리의 선제 §Y핵 공격§!이 성공했다!"
 nations.18261.name:0 "붕괴"
 nations.18261.desc:0 "[Root.GetName]에서 비보가 들어왔습니다! 그곳에서 교전 중이던 [Root.Owner.GetSubMantleLower] 외계종이 땅굴 입구 근처에 주둔한 아군 부대 전체의 발밑 지반을 붕괴시켰습니다.\n\n추락에서 살아남은 소수의 병사마저 다른 아군 병력이 도착하기 전에 외계종에게 무참히 살해되었습니다."
 nations.18261.a:0 "기필코 갚아주마!"
 nations.18262.name:0 "습격대"
 nations.18262.desc:0 "[Root.GetName]의 우리 식민지 지하에 거주하던 외계종이 어두운 밤을 틈타 땅굴로 소규모 습격대를 보내고 있습니다. 습격대의 공격으로 식민지 주요 시설 하나가 파괴되었고, 습격대는 우리 병력이 대응하기도 전에 지하로 사라졌습니다."
 nations.18262.a:0 "습격을 막아야 합니다!"
 nations.18263.name:0 "지상 공격"
 nations.18263.desc:0 "[Root.GetName]이 또다시 공격받았습니다! [Root.Owner.GetSubMantleLower] 외계종이 우리 주요 정착지 한복판으로 통하는 새 땅굴에서 쏟아져 나왔습니다. 이들은 현지 방어 병력을 제압하고 개척민들을 학살했습니다. 땅굴로 퇴각하면서는 살아남은 몇몇 개척민을 지하로 끌고 갔고, 희생자들의 비명이 울려 퍼졌습니다."
 nations.18263.a:0 "이 살인 행위에는 반드시 대가가 따를 것이다."
 nations.18264.name:0 "지하의 생존자"
 nations.18264.desc:0 "[Root.GetName]의 우리 병력이 식민지 아래의 땅굴망을 조사하던 중 [Root.Owner.GetSubMantleLower] 외계종의 대도시를 발견했습니다. 우리가 신경 가스를 살포하기 전에 지하 제국의 나머지 지역과 스스로를 격리하는 데 성공한 도시입니다. 도시에는 수백만의 외계인이 겁에 질린 채 살고 있습니다. 공병들에게 동굴을 무너뜨려 일을 마무리하라고 지시할까요?"
 nations.18264.a:0 "네, 고통을 끝내 줍시다."
 nations.18264.b:0 "아니요! 지상으로 끌고 옵시다. 노예로 부려먹죠."
 nations.18264.b.subterranean:0 "아니요! 식민지로 끌고 옵시다. 노예로 부려먹죠."
 nations.18265.name:0 "[Root.Owner.GetSubMantleUpper] 확장"
 nations.18265.desc:0 "[Root.GetName]의 동굴망에 살포했던 신경가스를 제거하고, 외계종의 시체를 정리했습니다. 이제 개척민들은 이곳으로 안전하게 이주할 수 있습니다. 물론 외계종이 남긴 원시적인 건물은 모두 철거할 예정이며, 그 자리에 우리의 최첨단 건물이 들어설 것입니다."
 nations.18266.name:0 "금이다!"
 nations.18266.desc:0 "지금은 멸종한 지하 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.18266.desc.subterranean:0 "지금은 멸종한 마그마 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.18267.name:0 "보물고"
 nations.18267.desc:0 "[Root.GetName]의 땅굴망을 탐사하던 정찰대가 한때 지하 외계 제국의 수도였던 도시에서 왕궁에 진입했습니다. 알현실의 거대한 왕좌에는 황제로 보이는 자의 시신이 여전히 앉아 있었습니다.\n\n정찰대는 폭약으로 왕궁 금고를 뚫고 들어가 가득 쌓인 황금과 기이한 외계 예술품을 발견했습니다. 예술품은 [From.Owner.Capital.GetName]의 박물관으로 보내고, 황금은 매각해 국가 예산에 상당한 보탬을 줄 수 있을 것입니다."
 nations.18268.name:0 "[From.GetName]과의 사건"
 nations.18268.desc:0 "우리 §Y사절§! 한 명이 위대한 [From.GetRulerName]에게 무례를 범하여 외교적 사건이 발생했습니다. 즉시 투옥된 사절은 이제 사형 집행인이 대기하는 형식적인 재판에 서게 되었습니다.\n\n§H외교 면책 특권§!을 주장할 수는 있지만, 심각한 §R외교적 파장§!이 발생할 것입니다."
 nations.18268.a:0 "외교관 면책 특권을 주장하라! 그 사절은 살아 있어야 한다."
 nations.18268.b:0 "처형을 승인하라. 후폭풍을 감수할 수는 없다..."
 nations.18269.name:0 "[From.GetName]의 기근"
 nations.18269.desc:0 "§H[From.GetName]§!의 대표단이 찾아왔습니다. 최근 어려움을 겪고 있으며 §R기근§!의 위협에 직면했다고 합니다.\n\n그들은 우리가 할 수 있는 어떤 도움이라도 제공해 달라고 호소하고 있습니다..."
 nations.18269.a:0 "물론이죠. 힘닿는 데까지 지원하겠습니다."
 nations.18269.b:0 "스스로 살아남아야 한다."
 nations.18269.c:0 "나눠줄 식량이 부족하다..."
 ethic_fanatic_materialist_nation_pleased:0 "그 결과 §H$ethic_materialist$ [FROM.GetName]§!과의 관계가 §G개선§!됩니다."
 ethic_fanatic_materialist_nation_displeased:0 "그 결과 §H$ethic_materialist$ [FROM.GetName]§!과의 관계가 §R악화§!됩니다."
 nations.18270.name:0 "$ethic_materialist$의 선물"
 nations.18270.desc:0 "두 문명의 우정을 기념하는 선물로, §H[FROM.GetName]§!의 사절이 §Y$tech_droid_workers$§! 설계도와 §Y$tech_mining_consortium$§! 무역 교리에 관한 통찰을 전해 주었습니다.\n\n이 정책을 시행하면 무역의 60%가 광물 생산량으로 전환됩니다."
 nations.18270.a:0 "이 선물은 채굴 혁명을 일으킬 수 있다!"
 nations.18270.b:0 "무역 흑자를 채굴 보조금에 배정하라."
 nations.18270.spiritualist:0 "기계 이단을 용납하지 않겠다."
 nations.18271.name:0 "종교 박해"
 nations.18271.desc:0 "§Y정신주의자 피란 행렬§!이 §H[FROM.GetName]§!의 박해를 피해 달아나고 있습니다. 이 신도들의 행렬은 자신의 방식대로 자유롭게 살아갈 보금자리를 찾고 있습니다.\n\n이들의 입국을 거절하면 이들은 다음 나라의 국경으로 가는 길에 목숨을 잃을 가능성이 큽니다. 하지만 거주를 허용하면 제국 내에서 §P정신주의 운동§!이 힘을 얻을 수도 있습니다.\n"
 nations.18271.a:0 "그들이 원한다면, 받아주겠습니다."
 nations.18271.b:0 "정치적 갈등은 피해야 합니다. 돌려보내세요."
 nations.18271.xenophobe:0 "외부인을 우리 나라에 들일 수 없다."
 nations.18271.civic_fanatic_purifiers:0 "피란 행렬의 구성원을 모두 죽여라."
 ethic_fanatic_materialist_nation_refugees:0 "§Y$ethic_spiritualist$§! §Y[FROM.GetSpeciesNamePlural]§! £pop£ §G800§!명이 우리 제국에 합류합니다."
 nations.18272.name:0 "$ethic_materialist$ 문화 교류"
 nations.18272.desc:0 "여러 사절이 §H[FROM.GetName]§! 주민들과 오랜 시간을 함께 보낸 뒤 돌아왔습니다. 그곳의 생활 방식과 관습을 배웠으니 우리 사회학 연구에 분명 도움이 될 것입니다.\n\n하지만 새로운 문화에는 새로운 사상도 따라옵니다... 대중의 §H자유로운 교류§!를 허용할까요?"
 nations.18272.a:0 "우리 국민들은 재화와 사상을 자유롭게 교환할 수 있다."
 nations.18272.b:0 "출입하는 모든 것을 엄격하게 규제하겠다."
 nations.18273.name:0 "[From.GetName] 관련 사망 사고"
 nations.18273.desc:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 우주로 향하던 로켓이 비행 중 동력을 잃고 우리 인근 정착지에 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.18273.nomad:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 정기 정비 작업이 크게 잘못되어 공중 도크가 우리 인근 정착지로 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.18273.a:0 "눈감아 주도록 하죠."
 nations.18273.b:0 "꼭 사죄를 받아야겠습니다!"
 nations.18274.name:0 "기술 전수 요청"
 nations.18274.desc:0 "우리 보안군이 갖춘 §H첨단 무기§!를 본 §H[FROM.GetName]§!의 장군 여럿이 군사 기술 일부를 공유해 달라고 요청했습니다.\n\n우리 장교들은 이를 망설입니다. 만약 전쟁이 일어난다면 그 권위주의 국가를 전장에서 상대하기가 더 어려워질 것이기 때문입니다.\n\n하지만 요청을 거절하면 위대한 [From.GetRulerName]은 분명 모욕으로 받아들일 것입니다."
 nations.18274.a:0 "권위주의자들에게 더 좋은 무기를 쥐여 주는 것은 나쁜 생각이다."
 nations.18274.b:0 "친구끼리 나누며 살아야죠."
 nations.18275.name:0 "메시지 수신"
 nations.18275.desc:0 "최근 §H[FROM.GetName]§!과의 교역이 뜸해지면서 상단의 방문도 점점 드물어졌습니다. 오늘은 그들의 군 대표에게서 메시지가 도착했습니다. 그다지 기분이 좋지는 않아 보입니다."
 nations.18275.a:0 "어떤 내용인지 봅시다."
 nations.18276.name:0 "메시지"
 nations.18276.desc:0 "지상인. 우리는 좋은 이웃이 되려 했으나, 그대들에게는 우리의 영광스러운 문명과 위대한 [From.GetRulerName]께 마땅한 존중을 보일 뜻이 없다는 점이 분명해졌다.\n\n이에 황제께서는 우리의 정당한 권리에 따라 이 행성 전체를 차지하라고 명하셨다. 그대들을 정복하겠다!"
 nations.18276.a:0 "§H[FROM.GetName]§! 국경에 방어 태세를 갖춰라!"
 nations.18277.name:0 "[FROM.GetName]의 연합 제안"
 nations.18277.desc:0 "[ROOT.GetName], 우리는 많은 문제에서 뜻을 같이합니다. 우리 두 국민 국가를 공식적으로 §G연합§!하여 하나의 §H통합 제국§!으로 만들고자 합니다."
 nations.18277.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.18277.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.18277.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 되자."
 nations.18277.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.18277.no:0 "지금은 연합에 합류할 생각이 없다."
 nations.19205.title:0 "외교 통신 채널"
 nations.19205.desc:0 "[Root.Capital.GetName]을 지켜야 합니다. 우리에게 유일한 행성입니다. 외교적 노력이 환경 보존을 진전시키기를 바랍니다."
 nations.19205.desc.nomad:0 "[Root.Capital.GetName]을 지켜야 합니다. 우리에게 유일한 방주선입니다. 외교적 노력이 환경과 기반 시설의 보존을 진전시키기를 바랍니다."
 nations.19205.c:0 "핵 공격 사후 보고"
 nations.19205.c.tooltip:0 "선제 핵공격이 유리한 기회가 될지 현지 첩보 책임자와 논의합니다."
 nations.19205.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.19205.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.19205.merge.fanatic.tooltip:0 "§Y'생태주의 연합'§! 상황을 §R수년간§! 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.19205.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 될까?"
 nations.19205.merge.normal.tooltip:0 "§R수년§! 동안 §Y'생태주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§G우호적 관계§!에는 우호도 300 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.19205.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.19205.merge.different.tooltip:0 "§R수년§! 동안 §Y'생태주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§B매우 우호적 관계§!에는 우호도 750 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.19205.g:0 "작전실 입장"
 nations.19205.g.tooltip:0 "최고 군사 고문들과 전쟁에 관해 논의합니다.\n\n§g도움말) 관계 악화: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.19205.i:0 "평화 협상 제안"
 nations.19220.title:0 "핵 공격 사후 보고"
 nations.19220.desc:0 "[Root.GetRulerTitle] [Root.GetRulerName]님, [FROMFROMFROMFROM.GetName]에 선제 핵공격을 가할 준비를 마치고 대기 중입니다."
 nations.19220.option.nuclear_strike_launched:0 "§Y핵 공격§!을 개시하라!!"
 nations.19220.option.nuclear_strike_blocked:0 "지금은 §Y핵 공격§!을 수행할 수 없습니다."
 nations.19220.option.goodbye:0 "쉬어, [Root.capital_scope.army.Leader.GetName] 장군. 오늘은 때가 아니다."
 nations.19225.title:0 "[FROMFROMFROMFROM.GetName] 파괴됨"
 nations.19225.desc.nuclear_winter_situation:0 "처음에는 밤하늘에 반짝이는 빛들이 보였습니다. 불과 몇 분 뒤, 태양 같은 섬광이 갑작스레 우리를 덮쳤습니다. 국가들이 하나씩 무너졌고, 돌연변이가 된 생존자들은 벙커에서 기어 나와 무덤으로 변한 세상을 되찾으려 했습니다.\n\n우리 제국이 입은 피해는 가장 적지만, 남은 주민들을 하나의 깃발 아래 모으기는 어려울 것입니다. 질서를 다시 세우는 것이 첫 과제입니다."
 nations.19225.desc.nuclear_winter_avoided:0 "상대 국가의 전략 자산을 성공적으로 무력화하자, 그 제국은 혼란 속에 빠르게 해체되었습니다. 이제 그들이 다스리던 땅을 점령하기만 하면 됩니다."
 nations.19225.option.nuclear_winter_situation:0 "살아남기는 했지만... §R핵겨울§!은 이제 시작일 뿐이다..."
 nations.19225.option.nuclear_winter_avoided:0 "우리의 선제 §Y핵 공격§!이 성공했다!"
 nations.19261.name:0 "붕괴"
 nations.19261.desc:0 "[Root.GetName]에서 비보가 들어왔습니다! 그곳에서 교전 중이던 [Root.Owner.GetSubMantleLower] 외계종이 땅굴 입구 근처에 주둔한 아군 부대 전체의 발밑 지반을 붕괴시켰습니다.\n\n추락에서 살아남은 소수의 병사마저 다른 아군 병력이 도착하기 전에 외계종에게 무참히 살해되었습니다."
 nations.19261.a:0 "기필코 갚아주마!"
 nations.19262.name:0 "습격대"
 nations.19262.desc:0 "[Root.GetName]의 우리 식민지 지하에 거주하던 외계종이 어두운 밤을 틈타 땅굴로 소규모 습격대를 보내고 있습니다. 습격대의 공격으로 식민지 주요 시설 하나가 파괴되었고, 습격대는 우리 병력이 대응하기도 전에 지하로 사라졌습니다."
 nations.19262.a:0 "습격을 막아야 합니다!"
 nations.19263.name:0 "지상 공격"
 nations.19263.desc:0 "[Root.GetName]이 또다시 공격받았습니다! [Root.Owner.GetSubMantleLower] 외계종이 우리 주요 정착지 한복판으로 통하는 새 땅굴에서 쏟아져 나왔습니다. 이들은 현지 방어 병력을 제압하고 개척민들을 학살했습니다. 땅굴로 퇴각하면서는 살아남은 몇몇 개척민을 지하로 끌고 갔고, 희생자들의 비명이 울려 퍼졌습니다."
 nations.19263.a:0 "이 살인 행위에는 반드시 대가가 따를 것이다."
 nations.19264.name:0 "지하의 생존자"
 nations.19264.desc:0 "[Root.GetName]의 우리 병력이 식민지 아래의 땅굴망을 조사하던 중 [Root.Owner.GetSubMantleLower] 외계종의 대도시를 발견했습니다. 우리가 신경 가스를 살포하기 전에 지하 제국의 나머지 지역과 스스로를 격리하는 데 성공한 도시입니다. 도시에는 수백만의 외계인이 겁에 질린 채 살고 있습니다. 공병들에게 동굴을 무너뜨려 일을 마무리하라고 지시할까요?"
 nations.19264.a:0 "네, 고통을 끝내 줍시다."
 nations.19264.b:0 "아니요! 지상으로 끌고 옵시다. 노예로 부려먹죠."
 nations.19264.b.subterranean:0 "아니요! 식민지로 끌고 옵시다. 노예로 부려먹죠."
 nations.19265.name:0 "[Root.Owner.GetSubMantleUpper] 확장"
 nations.19265.desc:0 "[Root.GetName]의 동굴망에 살포했던 신경가스를 제거하고, 외계종의 시체를 정리했습니다. 이제 개척민들은 이곳으로 안전하게 이주할 수 있습니다. 물론 외계종이 남긴 원시적인 건물은 모두 철거할 예정이며, 그 자리에 우리의 최첨단 건물이 들어설 것입니다."
 nations.19266.name:0 "금이다!"
 nations.19266.desc:0 "지금은 멸종한 지하 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.19266.desc.subterranean:0 "지금은 멸종한 마그마 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.19267.name:0 "보물고"
 nations.19267.desc:0 "[Root.GetName]의 땅굴망을 탐사하던 정찰대가 한때 지하 외계 제국의 수도였던 도시에서 왕궁에 진입했습니다. 알현실의 거대한 왕좌에는 황제로 보이는 자의 시신이 여전히 앉아 있었습니다.\n\n정찰대는 폭약으로 왕궁 금고를 뚫고 들어가 가득 쌓인 황금과 기이한 외계 예술품을 발견했습니다. 예술품은 [From.Owner.Capital.GetName]의 박물관으로 보내고, 황금은 매각해 국가 예산에 상당한 보탬을 줄 수 있을 것입니다."
 nations.19268.name:0 "[From.GetName]과의 사건"
 nations.19268.desc:0 "우리 §Y사절§! 한 명이 위대한 [From.GetRulerName]에게 무례를 범하여 외교적 사건이 발생했습니다. 즉시 투옥된 사절은 이제 사형 집행인이 대기하는 형식적인 재판에 서게 되었습니다.\n\n§H외교 면책 특권§!을 주장할 수는 있지만, 심각한 §R외교적 파장§!이 발생할 것입니다."
 nations.19268.a:0 "외교관 면책 특권을 주장하라! 그 사절은 살아 있어야 한다."
 nations.19268.b:0 "처형을 승인하라. 후폭풍을 감수할 수는 없다..."
 nations.19269.name:0 "[From.GetName]의 기근"
 nations.19269.desc:0 "§H[From.GetName]§!의 대표단이 찾아왔습니다. 최근 어려움을 겪고 있으며 §R기근§!의 위협에 직면했다고 합니다.\n\n그들은 우리가 할 수 있는 어떤 도움이라도 제공해 달라고 호소하고 있습니다..."
 nations.19269.a:0 "물론이죠. 힘닿는 데까지 지원하겠습니다."
 nations.19269.b:0 "스스로 살아남아야 한다."
 nations.19269.c:0 "나눠줄 식량이 부족하다..."
 ethic_fanatic_green_nation_pleased:0 "그 결과 §H$ethic_green$ [FROM.GetName]§!과의 관계가 §G개선§!됩니다."
 ethic_fanatic_green_nation_displeased:0 "그 결과 §H$ethic_green$ [FROM.GetName]§!과의 관계가 §R악화§!됩니다."
 nations.19270.name:0 "$ethic_green$의 선물"
 nations.19270.desc:0 "두 문명의 우정을 기념하는 선물로, §H[FROM.GetName]§!의 사절이 §H감시 기술§! 설계도를 전해 주었습니다. 위대한 군주 [FROM.GetRulerName](이)가 너그러이 제공한 선물입니다."
 nations.19270.a:0 "뭘 이런 걸 다."
 nations.19271.name:0 "[From.GetName] 난민"
 nations.19271.desc:0 "최근 §H[FROM.GetName]§!에서 온 대규모 난민 집단이 소규모 군대에 쫓겨 국경에 도착했습니다. 이들은 자유를 위해 싸우는 저항 세력이며 쿠데타 시도에 실패한 뒤 도망쳤다고 주장합니다.\n\n제국에 받아들이면 위대한 [From.GetRealName]의 분노를 살 것이 분명합니다. 하지만 추격군에 넘겨주면 처형당할 가능성이 높습니다."
 nations.19271.a:0 "그들이 원한다면, 받아주겠습니다."
 nations.19271.b:0 "정치적 갈등은 피해야 합니다. 돌려보내세요."
 nations.19271.xenophobe:0 "외부인을 우리 나라에 들일 수 없다."
 nations.19271.civic_fanatic_purifiers:0 "양쪽 모두 보이는 즉시 죽여라."
 ethic_fanatic_green_nation_refugees:0 "§Y$ethic_green$§! §Y[FROM.GetSpeciesNamePlural]§! £pop£ §G800§!명이 우리 제국에 합류합니다."
 nations.19272.name:0 "$ethic_green$ 문화 교류"
 nations.19272.desc:0 "여러 사절이 §H[FROM.GetName]§! 주민들과 오랜 시간을 함께 보낸 뒤 돌아왔습니다. 그곳의 생활 방식과 관습을 배웠으니 우리 사회학 연구에 분명 도움이 될 것입니다.\n\n하지만 새로운 문화에는 새로운 사상도 따라옵니다... 대중의 §H자유로운 교류§!를 허용할까요?"
 nations.19272.a:0 "우리 국민들은 재화와 사상을 자유롭게 교환할 수 있다."
 nations.19272.b:0 "출입하는 모든 것을 엄격하게 규제하겠다."
 nations.19273.name:0 "[From.GetName] 관련 사망 사고"
 nations.19273.desc:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 우주로 향하던 로켓이 비행 중 동력을 잃고 우리 인근 정착지에 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.19273.nomad:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 정기 정비 작업이 크게 잘못되어 공중 도크가 우리 인근 정착지로 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.19273.a:0 "눈감아 주도록 하죠."
 nations.19273.b:0 "꼭 사죄를 받아야겠습니다!"
 nations.19274.name:0 "기술 전수 요청"
 nations.19274.desc:0 "§Y$tech_frontier_health$§!를 본 뒤 §H[FROM.GetName]§!의 여러 사절이 의료 기술을 공유해 달라고 요청했습니다.\n\n우리 과학자들은 우선 과제에서 연구 자금이 빠져나갈 것을 우려하며 망설이고 있습니다.\n\n요청을 거절하면 그들의 지도자 [From.GetRulerName](은)는 이를 도움이 필요한 모든 이들에 대한 모욕으로 여겨 양국 관계가 악화될 것입니다."
 nations.19274.a:0 "현재의 연구 중점을 유지해야 한다."
 nations.19274.b:0 "친구끼리 나누며 살아야죠."
 nations.19275.name:0 "메시지 수신"
 nations.19275.desc:0 "최근 §H[FROM.GetName]§!과의 교역이 뜸해지면서 상단의 방문도 점점 드물어졌습니다. 오늘은 그들의 군 대표에게서 메시지가 도착했습니다. 그다지 기분이 좋지는 않아 보입니다."
 nations.19275.a:0 "어떤 내용인지 봅시다."
 nations.19276.name:0 "메시지"
 nations.19276.desc:0 "지상인. 우리는 좋은 이웃이 되려 했으나, 그대들에게는 우리의 영광스러운 문명과 위대한 [From.GetRulerName]께 마땅한 존중을 보일 뜻이 없다는 점이 분명해졌다.\n\n이에 황제께서는 우리의 정당한 권리에 따라 이 행성 전체를 차지하라고 명하셨다. 그대들을 정복하겠다!"
 nations.19276.a:0 "§H[FROM.GetName]§! 국경에 방어 태세를 갖춰라!"
 nations.19277.name:0 "[FROM.GetName]의 연합 제안"
 nations.19277.desc:0 "[ROOT.GetName], 우리는 많은 문제에서 뜻을 같이합니다. 우리 두 국민 국가를 공식적으로 §G연합§!하여 하나의 §H통합 제국§!으로 만들고자 합니다."
 nations.19277.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.19277.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.19277.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 되자."
 nations.19277.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.19277.no:0 "지금은 연합에 합류할 생각이 없다."
 nations.20205.title:0 "외교 통신 채널"
 nations.20205.desc:0 "[Root.Capital.GetName]은 개발할 준비가 되어 있습니다. 협력하여 이곳의 자원을 빠짐없이 채취합시다. 사절은 무슨 소식을 가져왔습니까?"
 nations.20205.desc.nomad:0 "우리 방주선 [Root.Capital.GetName]에는 활용할 잠재력이 가득합니다. 협력하여 과거의 잠재력을 온전히 되찾읍시다. 사절은 무슨 소식을 가져왔습니까?"
 nations.20205.c:0 "핵 공격 사후 보고"
 nations.20205.c.tooltip:0 "선제 핵공격이 유리한 기회가 될지 현지 첩보 책임자와 논의합니다."
 nations.20205.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.20205.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.20205.merge.fanatic.tooltip:0 "§R수년간§! §Y'산업주의 연합'§! 상황을 진행해 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.20205.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 될까?"
 nations.20205.merge.normal.tooltip:0 "§Y'산업주의 연합'§! 상황을 §R수년간§! 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§G우호적 관계§!에는 우호도 300 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.20205.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.20205.merge.different.tooltip:0 "§R수년§! 동안 §Y'산업주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§B매우 우호적 관계§!에는 우호도 750 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.20205.g:0 "작전실 입장"
 nations.20205.g.tooltip:0 "최고 군사 고문들과 전쟁에 관해 논의합니다.\n\n§g도움말) 관계 악화: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.20205.i:0 "평화 협상 제안"
 nations.20220.title:0 "핵 공격 사후 보고"
 nations.20220.desc:0 "[Root.GetRulerTitle] [Root.GetRulerName]님, [FROMFROMFROMFROM.GetName]에 선제 핵공격을 가할 준비를 마치고 대기 중입니다."
 nations.20220.option.nuclear_strike_launched:0 "§Y핵 공격§!을 개시하라!!"
 nations.20220.option.nuclear_strike_blocked:0 "지금은 §Y핵 공격§!을 수행할 수 없습니다."
 nations.20220.option.goodbye:0 "쉬어, [Root.capital_scope.army.Leader.GetName] 장군. 오늘은 때가 아니다."
 nations.20225.title:0 "[FROMFROMFROMFROM.GetName] 파괴됨"
 nations.20225.desc.nuclear_winter_situation:0 "처음에는 밤하늘에 반짝이는 빛들이 보였습니다. 불과 몇 분 뒤, 태양 같은 섬광이 갑작스레 우리를 덮쳤습니다. 국가들이 하나씩 무너졌고, 돌연변이가 된 생존자들은 벙커에서 기어 나와 무덤으로 변한 세상을 되찾으려 했습니다.\n\n우리 제국이 입은 피해는 가장 적지만, 남은 주민들을 하나의 깃발 아래 모으기는 어려울 것입니다. 질서를 다시 세우는 것이 첫 과제입니다."
 nations.20225.desc.nuclear_winter_avoided:0 "상대 국가의 전략 자산을 성공적으로 무력화하자, 그 제국은 혼란 속에 빠르게 해체되었습니다. 이제 그들이 다스리던 땅을 점령하기만 하면 됩니다."
 nations.20225.option.nuclear_winter_situation:0 "살아남기는 했지만... §R핵겨울§!은 이제 시작일 뿐이다..."
 nations.20225.option.nuclear_winter_avoided:0 "우리의 선제 §Y핵 공격§!이 성공했다!"
 nations.20261.name:0 "붕괴"
 nations.20261.desc:0 "[Root.GetName]에서 비보가 들어왔습니다! 그곳에서 교전 중이던 [Root.Owner.GetSubMantleLower] 외계종이 땅굴 입구 근처에 주둔한 아군 부대 전체의 발밑 지반을 붕괴시켰습니다.\n\n추락에서 살아남은 소수의 병사마저 다른 아군 병력이 도착하기 전에 외계종에게 무참히 살해되었습니다."
 nations.20261.a:0 "기필코 갚아주마!"
 nations.20262.name:0 "습격대"
 nations.20262.desc:0 "[Root.GetName]의 우리 식민지 지하에 거주하던 외계종이 어두운 밤을 틈타 땅굴로 소규모 습격대를 보내고 있습니다. 습격대의 공격으로 식민지 주요 시설 하나가 파괴되었고, 습격대는 우리 병력이 대응하기도 전에 지하로 사라졌습니다."
 nations.20262.a:0 "습격을 막아야 합니다!"
 nations.20263.name:0 "지상 공격"
 nations.20263.desc:0 "[Root.GetName]이 또다시 공격받았습니다! [Root.Owner.GetSubMantleLower] 외계종이 우리 주요 정착지 한복판으로 통하는 새 땅굴에서 쏟아져 나왔습니다. 이들은 현지 방어 병력을 제압하고 개척민들을 학살했습니다. 땅굴로 퇴각하면서는 살아남은 몇몇 개척민을 지하로 끌고 갔고, 희생자들의 비명이 울려 퍼졌습니다."
 nations.20263.a:0 "이 살인 행위에는 반드시 대가가 따를 것이다."
 nations.20264.name:0 "지하의 생존자"
 nations.20264.desc:0 "[Root.GetName]의 우리 병력이 식민지 아래의 땅굴망을 조사하던 중 [Root.Owner.GetSubMantleLower] 외계종의 대도시를 발견했습니다. 우리가 신경 가스를 살포하기 전에 지하 제국의 나머지 지역과 스스로를 격리하는 데 성공한 도시입니다. 도시에는 수백만의 외계인이 겁에 질린 채 살고 있습니다. 공병들에게 동굴을 무너뜨려 일을 마무리하라고 지시할까요?"
 nations.20264.a:0 "네, 고통을 끝내 줍시다."
 nations.20264.b:0 "아니요! 지상으로 끌고 옵시다. 노예로 부려먹죠."
 nations.20264.b.subterranean:0 "아니요! 식민지로 끌고 옵시다. 노예로 부려먹죠."
 nations.20265.name:0 "[Root.Owner.GetSubMantleUpper] 확장"
 nations.20265.desc:0 "[Root.GetName]의 동굴망에 살포했던 신경가스를 제거하고, 외계종의 시체를 정리했습니다. 이제 개척민들은 이곳으로 안전하게 이주할 수 있습니다. 물론 외계종이 남긴 원시적인 건물은 모두 철거할 예정이며, 그 자리에 우리의 최첨단 건물이 들어설 것입니다."
 nations.20266.name:0 "금이다!"
 nations.20266.desc:0 "지금은 멸종한 지하 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.20266.desc.subterranean:0 "지금은 멸종한 마그마 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.20267.name:0 "보물고"
 nations.20267.desc:0 "[Root.GetName]의 땅굴망을 탐사하던 정찰대가 한때 지하 외계 제국의 수도였던 도시에서 왕궁에 진입했습니다. 알현실의 거대한 왕좌에는 황제로 보이는 자의 시신이 여전히 앉아 있었습니다.\n\n정찰대는 폭약으로 왕궁 금고를 뚫고 들어가 가득 쌓인 황금과 기이한 외계 예술품을 발견했습니다. 예술품은 [From.Owner.Capital.GetName]의 박물관으로 보내고, 황금은 매각해 국가 예산에 상당한 보탬을 줄 수 있을 것입니다."
 nations.20268.name:0 "[From.GetName]과의 사건"
 nations.20268.desc:0 "우리 §Y사절§! 한 명이 위대한 [From.GetRulerName]에게 무례를 범하여 외교적 사건이 발생했습니다. 즉시 투옥된 사절은 이제 사형 집행인이 대기하는 형식적인 재판에 서게 되었습니다.\n\n§H외교 면책 특권§!을 주장할 수는 있지만, 심각한 §R외교적 파장§!이 발생할 것입니다."
 nations.20268.a:0 "외교관 면책 특권을 주장하라! 그 사절은 살아 있어야 한다."
 nations.20268.b:0 "처형을 승인하라. 후폭풍을 감수할 수는 없다..."
 nations.20269.name:0 "[From.GetName]의 기근"
 nations.20269.desc:0 "§H[From.GetName]§!의 대표단이 찾아왔습니다. 최근 어려움을 겪고 있으며 §R기근§!의 위협에 직면했다고 합니다.\n\n그들은 우리가 할 수 있는 어떤 도움이라도 제공해 달라고 호소하고 있습니다..."
 nations.20269.a:0 "물론이죠. 힘닿는 데까지 지원하겠습니다."
 nations.20269.b:0 "스스로 살아남아야 한다."
 nations.20269.c:0 "나눠줄 식량이 부족하다..."
 ethic_fanatic_industrial_nation_pleased:0 "그 결과 §H$ethic_industrial$ [FROM.GetName]§!과의 관계가 §G개선§!됩니다."
 ethic_fanatic_industrial_nation_displeased:0 "그 결과 §H$ethic_industrial$ [FROM.GetName]§!과의 관계가 §R악화§!됩니다."
 nations.20270.name:0 "$ethic_industrial$의 선물"
 nations.20271.name:0 "[From.GetName] 난민"
 nations.20271.desc:0 "최근 §H[FROM.GetName]§!에서 온 대규모 난민 집단이 소규모 군대에 쫓겨 국경에 도착했습니다. 이들은 자유를 위해 싸우는 저항 세력이며 쿠데타 시도에 실패한 뒤 도망쳤다고 주장합니다.\n\n제국에 받아들이면 위대한 [From.GetRealName]의 분노를 살 것이 분명합니다. 하지만 추격군에 넘겨주면 처형당할 가능성이 높습니다."
 nations.20271.a:0 "그들이 원한다면, 받아주겠습니다."
 nations.20271.b:0 "정치적 갈등은 피해야 합니다. 돌려보내세요."
 nations.20271.xenophobe:0 "외부인을 우리 나라에 들일 수 없다."
 nations.20271.civic_fanatic_purifiers:0 "양쪽 모두 보이는 즉시 죽여라."
 ethic_fanatic_industrial_nation_refugees:0 "§Y$ethic_industrial$§! §Y[FROM.GetSpeciesNamePlural]§! £pop£ §G800§!명이 우리 제국에 합류합니다."
 nations.20272.name:0 "$ethic_industrial$ 문화 교류"
 nations.20272.desc:0 "여러 사절이 §H[FROM.GetName]§! 주민들과 오랜 시간을 함께 보낸 뒤 돌아왔습니다. 그곳의 생활 방식과 관습을 배웠으니 우리 사회학 연구에 분명 도움이 될 것입니다.\n\n하지만 새로운 문화에는 새로운 사상도 따라옵니다... 대중의 §H자유로운 교류§!를 허용할까요?"
 nations.20272.a:0 "우리 국민들은 재화와 사상을 자유롭게 교환할 수 있다."
 nations.20272.b:0 "출입하는 모든 것을 엄격하게 규제하겠다."
 nations.20273.name:0 "[From.GetName] 관련 사망 사고"
 nations.20273.desc:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 우주로 향하던 로켓이 비행 중 동력을 잃고 우리 인근 정착지에 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.20273.nomad:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 정기 정비 작업이 크게 잘못되어 공중 도크가 우리 인근 정착지로 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.20273.a:0 "눈감아 주도록 하죠."
 nations.20273.b:0 "꼭 사죄를 받아야겠습니다!"
 nations.20274.name:0 "기술 전수 요청"
 nations.20274.desc:0 "사절들이 우리의 §Y$tech_robotic_workers$§!을 본 뒤 §H[FROM.GetName]§!에서 로봇 기술 일부를 공유해 달라는 요청이 여러 차례 들어왔습니다.\n\n우리 과학자들은 이 기술이 군사적으로 활용될 수 있어 망설이고 있습니다. 혹시라도 전쟁이 난다면 경쟁주의 국가를 전장에서 꺾기가 더 어려워질 것입니다...\n\n요청을 거절하면 그들의 최고 경영자 [From.GetRulerName](은)는 분명 이를 모욕으로 받아들여 분노할 것입니다."
 nations.20274.a:0 "거대기업에 살인 로봇을 주는 것은 좋지 않다."
 nations.20274.b:0 "친구끼리 나누며 살아야죠."
 nations.20275.name:0 "메시지 수신"
 nations.20275.desc:0 "최근 §H[FROM.GetName]§!과의 교역이 뜸해지면서 상단의 방문도 점점 드물어졌습니다. 오늘은 그들의 군 대표에게서 메시지가 도착했습니다. 그다지 기분이 좋지는 않아 보입니다."
 nations.20275.a:0 "어떤 내용인지 봅시다."
 nations.20276.name:0 "메시지"
 nations.20276.desc:0 "지상인. 우리는 좋은 이웃이 되려 했으나, 그대들에게는 우리의 영광스러운 문명과 위대한 [From.GetRulerName]께 마땅한 존중을 보일 뜻이 없다는 점이 분명해졌다.\n\n이에 황제께서는 우리의 정당한 권리에 따라 이 행성 전체를 차지하라고 명하셨다. 그대들을 정복하겠다!"
 nations.20276.a:0 "§H[FROM.GetName]§! 국경에 방어 태세를 갖춰라!"
 nations.20277.name:0 "[FROM.GetName]의 연합 제안"
 nations.20277.desc:0 "[ROOT.GetName], 우리는 많은 문제에서 뜻을 같이합니다. 우리 두 국민 국가를 공식적으로 §G연합§!하여 하나의 §H통합 제국§!으로 만들고자 합니다."
 nations.20277.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.20277.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.20277.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 되자."
 nations.20277.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.20277.no:0 "지금은 연합에 합류할 생각이 없다."
 nations.22205.title:0 "외교 통신 채널"
 nations.22205.desc:0 "반갑습니다, [Root.GetName]! 수익성 있는 무역 거래라면 언제나 환영하지만, 논의할 일이 경제 문제뿐이지는 않겠지요?"
 nations.22205.desc.nomad:0 "반갑습니다, [Root.GetName]! 방주선에서 수익성 있는 무역 거래라면 언제나 환영하지만, 논의할 일이 거래뿐이지는 않겠지요?"
 nations.22205.c:0 "핵 공격 사후 보고"
 nations.22205.c.tooltip:0 "선제 핵공격이 유리한 기회가 될지 현지 첩보 책임자와 논의합니다."
 nations.22205.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.22205.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.22205.merge.fanatic.tooltip:0 "§R수년간§! §Y'경쟁주의 연합'§! 상황을 진행해 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.22205.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 될까?"
 nations.22205.merge.normal.tooltip:0 "§R수년§! 동안 §Y'경쟁주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§G우호적 관계§!에는 우호도 300 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.22205.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.22205.merge.different.tooltip:0 "§R수년§! 동안 §Y'경쟁주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§B매우 우호적 관계§!에는 우호도 750 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.22205.g:0 "작전실 입장"
 nations.22205.g.tooltip:0 "최고 군사 고문들과 전쟁에 관해 논의합니다.\n\n§g도움말) 관계 악화: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.22205.i:0 "평화 협상 제안"
 nations.22220.title:0 "핵 공격 사후 보고"
 nations.22220.desc:0 "[Root.GetRulerTitle] [Root.GetRulerName]님, [FROMFROMFROMFROM.GetName]에 선제 핵공격을 가할 준비를 마치고 대기 중입니다."
 nations.22220.option.nuclear_strike_launched:0 "§Y핵 공격§!을 개시하라!!"
 nations.22220.option.nuclear_strike_blocked:0 "지금은 §Y핵 공격§!을 수행할 수 없습니다."
 nations.22220.option.goodbye:0 "쉬어, [Root.capital_scope.army.Leader.GetName] 장군. 오늘은 때가 아니다."
 nations.22225.title:0 "[FROMFROMFROMFROM.GetName] 파괴됨"
 nations.22225.desc.nuclear_winter_situation:0 "처음에는 밤하늘에 반짝이는 빛들이 보였습니다. 불과 몇 분 뒤, 태양 같은 섬광이 갑작스레 우리를 덮쳤습니다. 국가들이 하나씩 무너졌고, 돌연변이가 된 생존자들은 벙커에서 기어 나와 무덤으로 변한 세상을 되찾으려 했습니다.\n\n우리 제국이 입은 피해는 가장 적지만, 남은 주민들을 하나의 깃발 아래 모으기는 어려울 것입니다. 질서를 다시 세우는 것이 첫 과제입니다."
 nations.22225.desc.nuclear_winter_avoided:0 "상대 국가의 전략 자산을 성공적으로 무력화하자, 그 제국은 혼란 속에 빠르게 해체되었습니다. 이제 그들이 다스리던 땅을 점령하기만 하면 됩니다."
 nations.22225.option.nuclear_winter_situation:0 "살아남기는 했지만... §R핵겨울§!은 이제 시작일 뿐이다..."
 nations.22225.option.nuclear_winter_avoided:0 "우리의 선제 §Y핵 공격§!이 성공했다!"
 nations.22202.open_branch_office:0 "지사 논의"
 nations.22202.open_branch_office.tooltip.a:0 "[FROMFROMFROMFROM.GetName]과 §!통상 조약§!을 체결해야 합니다!\n$nations_commerial_pact_tooltip$"
 nations.22261.name:0 "붕괴"
 nations.22261.desc:0 "[Root.GetName]에서 비보가 들어왔습니다! 그곳에서 교전 중이던 [Root.Owner.GetSubMantleLower] 외계종이 땅굴 입구 근처에 주둔한 아군 부대 전체의 발밑 지반을 붕괴시켰습니다.\n\n추락에서 살아남은 소수의 병사마저 다른 아군 병력이 도착하기 전에 외계종에게 무참히 살해되었습니다."
 nations.22261.a:0 "기필코 갚아주마!"
 nations.22262.name:0 "습격대"
 nations.22262.desc:0 "[Root.GetName]의 우리 식민지 지하에 거주하던 외계종이 어두운 밤을 틈타 땅굴로 소규모 습격대를 보내고 있습니다. 습격대의 공격으로 식민지 주요 시설 하나가 파괴되었고, 습격대는 우리 병력이 대응하기도 전에 지하로 사라졌습니다."
 nations.22262.a:0 "습격을 막아야 합니다!"
 nations.22263.name:0 "지상 공격"
 nations.22263.desc:0 "[Root.GetName]이 또다시 공격받았습니다! [Root.Owner.GetSubMantleLower] 외계종이 우리 주요 정착지 한복판으로 통하는 새 땅굴에서 쏟아져 나왔습니다. 이들은 현지 방어 병력을 제압하고 개척민들을 학살했습니다. 땅굴로 퇴각하면서는 살아남은 몇몇 개척민을 지하로 끌고 갔고, 희생자들의 비명이 울려 퍼졌습니다."
 nations.22263.a:0 "이 살인 행위에는 반드시 대가가 따를 것이다."
 nations.22264.name:0 "지하의 생존자"
 nations.22264.desc:0 "[Root.GetName]의 우리 병력이 식민지 아래의 땅굴망을 조사하던 중 [Root.Owner.GetSubMantleLower] 외계종의 대도시를 발견했습니다. 우리가 신경 가스를 살포하기 전에 지하 제국의 나머지 지역과 스스로를 격리하는 데 성공한 도시입니다. 도시에는 수백만의 외계인이 겁에 질린 채 살고 있습니다. 공병들에게 동굴을 무너뜨려 일을 마무리하라고 지시할까요?"
 nations.22264.a:0 "네, 고통을 끝내 줍시다."
 nations.22264.b:0 "아니요! 지상으로 끌고 옵시다. 노예로 부려먹죠."
 nations.22264.b.subterranean:0 "아니요! 식민지로 끌고 옵시다. 노예로 부려먹죠."
 nations.22265.name:0 "[Root.Owner.GetSubMantleUpper] 확장"
 nations.22265.desc:0 "[Root.GetName]의 동굴망에 살포했던 신경가스를 제거하고, 외계종의 시체를 정리했습니다. 이제 개척민들은 이곳으로 안전하게 이주할 수 있습니다. 물론 외계종이 남긴 원시적인 건물은 모두 철거할 예정이며, 그 자리에 우리의 최첨단 건물이 들어설 것입니다."
 nations.22266.name:0 "금이다!"
 nations.22266.desc:0 "지금은 멸종한 지하 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.22266.desc.subterranean:0 "지금은 멸종한 마그마 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.22267.name:0 "보물고"
 nations.22267.desc:0 "[Root.GetName]의 땅굴망을 탐사하던 정찰대가 한때 지하 외계 제국의 수도였던 도시에서 왕궁에 진입했습니다. 알현실의 거대한 왕좌에는 황제로 보이는 자의 시신이 여전히 앉아 있었습니다.\n\n정찰대는 폭약으로 왕궁 금고를 뚫고 들어가 가득 쌓인 황금과 기이한 외계 예술품을 발견했습니다. 예술품은 [From.Owner.Capital.GetName]의 박물관으로 보내고, 황금은 매각해 국가 예산에 상당한 보탬을 줄 수 있을 것입니다."
 nations.22268.name:0 "[From.GetName]과의 사건"
 nations.22268.desc:0 "우리 §Y사절§! 한 명이 위대한 [From.GetRulerName]에게 무례를 범하여 외교적 사건이 발생했습니다. 즉시 투옥된 사절은 이제 사형 집행인이 대기하는 형식적인 재판에 서게 되었습니다.\n\n§H외교 면책 특권§!을 주장할 수는 있지만, 심각한 §R외교적 파장§!이 발생할 것입니다."
 nations.22268.a:0 "외교관 면책 특권을 주장하라! 그 사절은 살아 있어야 한다."
 nations.22268.b:0 "처형을 승인하라. 후폭풍을 감수할 수는 없다..."
 nations.22269.name:0 "[From.GetName]의 기근"
 nations.22269.desc:0 "§H[From.GetName]§!의 대표단이 찾아왔습니다. 최근 어려움을 겪고 있으며 §R기근§!의 위협에 직면했다고 합니다.\n\n그들은 우리가 할 수 있는 어떤 도움이라도 제공해 달라고 호소하고 있습니다..."
 nations.22269.a:0 "물론이죠. 힘닿는 데까지 지원하겠습니다."
 nations.22269.b:0 "스스로 살아남아야 한다."
 nations.22269.c:0 "나눠줄 식량이 부족하다..."
 ethic_fanatic_capitalism_nation_pleased:0 "그 결과 §H$ethic_capitalism$ [FROM.GetName]§!과의 관계가 §G개선§!됩니다."
 ethic_fanatic_capitalism_nation_displeased:0 "그 결과 §H$ethic_capitalism$ [FROM.GetName]§!과의 관계가 §R악화§!됩니다."
 nations.22270.name:0 "$ethic_capitalism$의 선물"
 nations.22270.desc:0 "두 문명의 우호를 기념하는 선물로 §H[FROM.GetName]§!의 사절이 §Y$tech_free_market$§!에 관한 정치 이론을 전수했습니다. 이 정책을 시행하면 모든 산업의 민영화로 §G무역이 증가§!하지만 §R영향력이 크게 감소§!합니다."
 nations.22270.a:0 "뭘 이런 걸 다."
 nations.22270.b:0 "지금 이 정책을 시행하자."
 nations.22271.name:0 "[From.GetName] 난민"
 nations.22271.desc:0 "최근 §H[FROM.GetName]§!에서 온 대규모 난민 집단이 소규모 군대에 쫓겨 국경에 도착했습니다. 이들은 자유를 위해 싸우는 저항 세력이며 쿠데타 시도에 실패한 뒤 도망쳤다고 주장합니다.\n\n제국에 받아들이면 위대한 [From.GetRealName]의 분노를 살 것이 분명합니다. 하지만 추격군에 넘겨주면 처형당할 가능성이 높습니다."
 nations.22271.a:0 "그들이 원한다면, 받아주겠습니다."
 nations.22271.b:0 "정치적 갈등은 피해야 합니다. 돌려보내세요."
 nations.22271.xenophobe:0 "외부인을 우리 나라에 들일 수 없다."
 nations.22271.civic_fanatic_purifiers:0 "양쪽 모두 보이는 즉시 죽여라."
 ethic_fanatic_capitalism_nation_refugees:0 "§Y$ethic_capitalism$§! §Y[FROM.GetSpeciesNamePlural]§! £pop£ §G800§!이 우리 제국에 합류합니다."
 nations.22272.name:0 "$ethic_capitalism$ 문화 교류"
 nations.22272.desc:0 "여러 사절이 §H[FROM.GetName]§! 주민들과 오랜 시간을 함께 보낸 뒤 돌아왔습니다. 그곳의 생활 방식과 관습을 배웠으니 우리 사회학 연구에 분명 도움이 될 것입니다.\n\n하지만 새로운 문화에는 새로운 사상도 따라옵니다... 대중의 §H자유로운 교류§!를 허용할까요?"
 nations.22272.a:0 "우리 국민들은 재화와 사상을 자유롭게 교환할 수 있다."
 nations.22272.b:0 "출입하는 모든 것을 엄격하게 규제하겠다."
 nations.22273.name:0 "[From.GetName] 관련 사망 사고"
 nations.22273.desc:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 우주로 향하던 로켓이 비행 중 동력을 잃고 우리 인근 정착지에 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.22273.nomad:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 정기 정비 작업이 크게 잘못되어 공중 도크가 우리 인근 정착지로 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.22273.a:0 "눈감아 주도록 하죠."
 nations.22273.b:0 "꼭 사죄를 받아야겠습니다!"
 nations.22275.name:0 "메시지 수신"
 nations.22275.desc:0 "최근 §H[FROM.GetName]§!과의 교역이 뜸해지면서 상단의 방문도 점점 드물어졌습니다. 오늘은 그들의 군 대표에게서 메시지가 도착했습니다. 그다지 기분이 좋지는 않아 보입니다."
 nations.22275.a:0 "어떤 내용인지 봅시다."
 nations.22276.name:0 "메시지"
 nations.22276.desc:0 "지상인. 우리는 좋은 이웃이 되려 했으나, 그대들에게는 우리의 영광스러운 문명과 위대한 [From.GetRulerName]께 마땅한 존중을 보일 뜻이 없다는 점이 분명해졌다.\n\n이에 황제께서는 우리의 정당한 권리에 따라 이 행성 전체를 차지하라고 명하셨다. 그대들을 정복하겠다!"
 nations.22276.a:0 "§H[FROM.GetName]§! 국경에 방어 태세를 갖춰라!"
 nations.22277.name:0 "[FROM.GetName]의 연합 제안"
 nations.22277.desc:0 "[ROOT.GetName], 우리는 많은 문제에서 뜻을 같이합니다. 우리 두 국민 국가를 공식적으로 §G연합§!하여 하나의 §H통합 제국§!으로 만들고자 합니다."
 nations.22277.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.22277.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.22277.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 되자."
 nations.22277.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.22277.no:0 "지금은 연합에 합류할 생각이 없다."
 nations.21205.title:0 "외교 통신 채널"
 nations.21205.desc:0 "[Root.GetName]의 사절이 연대의 말을 가져왔기를 바랍니다. 우리의 외교 채널은 협력을 위해 열려 있습니다."
 nations.21205.desc.nomad:0 "[Root.GetName], 그대의 사절이 연대의 말을 가져왔기를 바랍니다. 우리 외교 창구는 방주선 안의 국가들이 협력할 수 있도록 열려 있습니다."
 nations.21205.c:0 "핵 공격 사후 보고"
 nations.21205.c.tooltip:0 "선제 핵공격이 유리한 기회가 될지 현지 첩보 책임자와 논의합니다."
 nations.21205.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.21205.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.21205.merge.fanatic.tooltip:0 "§R수년간§! §Y'협동주의 연합'§! 상황을 진행해 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.21205.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 될까?"
 nations.21205.merge.normal.tooltip:0 "§R수년§! 동안 §Y'협동주의 연합'§! 상황을 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§G우호적 관계§!에는 우호도 300 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z' 누르기§!"
 nations.21205.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.21205.merge.different.tooltip:0 "§Y'협동주의 연합'§! 상황을 §R수년간§! 진행하여 §H[FROMFROM.GetName]§!을 §G흡수§!합니다.\n\n§B매우 우호적 관계§!에는 우호도 750 필요\n§g도움말) 관계 개선: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.21205.g:0 "작전실 입장"
 nations.21205.g.tooltip:0 "최고 군사 고문들과 전쟁에 관해 논의합니다.\n\n§g도움말) 관계 악화: F10을 누른 뒤 '첩보'를 클릭하고 'Z'를 누르세요§!"
 nations.21205.i:0 "평화 협상 제안"
 nations.21220.title:0 "핵 공격 사후 보고"
 nations.21220.desc:0 "[Root.GetRulerTitle] [Root.GetRulerName]님, [FROMFROMFROMFROM.GetName]에 선제 핵공격을 가할 준비를 마치고 대기 중입니다."
 nations.21220.option.nuclear_strike_launched:0 "§Y핵 공격§!을 개시하라!!"
 nations.21220.option.nuclear_strike_blocked:0 "지금은 §Y핵 공격§!을 수행할 수 없습니다."
 nations.21220.option.goodbye:0 "쉬어, [Root.capital_scope.army.Leader.GetName] 장군. 오늘은 때가 아니다."
 nations.21225.title:0 "[FROMFROMFROMFROM.GetName] 파괴됨"
 nations.21225.desc.nuclear_winter_situation:0 "처음에는 밤하늘에 반짝이는 빛들이 보였습니다. 불과 몇 분 뒤, 태양 같은 섬광이 갑작스레 우리를 덮쳤습니다. 국가들이 하나씩 무너졌고, 돌연변이가 된 생존자들은 벙커에서 기어 나와 무덤으로 변한 세상을 되찾으려 했습니다.\n\n우리 제국이 입은 피해는 가장 적지만, 남은 주민들을 하나의 깃발 아래 모으기는 어려울 것입니다. 질서를 다시 세우는 것이 첫 과제입니다."
 nations.21225.desc.nuclear_winter_avoided:0 "상대 국가의 전략 자산을 성공적으로 무력화하자, 그 제국은 혼란 속에 빠르게 해체되었습니다. 이제 그들이 다스리던 땅을 점령하기만 하면 됩니다."
 nations.21225.option.nuclear_winter_situation:0 "살아남기는 했지만... §R핵겨울§!은 이제 시작일 뿐이다..."
 nations.21225.option.nuclear_winter_avoided:0 "우리의 선제 §Y핵 공격§!이 성공했다!"
 nations.21261.name:0 "붕괴"
 nations.21261.desc:0 "[Root.GetName]에서 비보가 들어왔습니다! 그곳에서 교전 중이던 [Root.Owner.GetSubMantleLower] 외계종이 땅굴 입구 근처에 주둔한 아군 부대 전체의 발밑 지반을 붕괴시켰습니다.\n\n추락에서 살아남은 소수의 병사마저 다른 아군 병력이 도착하기 전에 외계종에게 무참히 살해되었습니다."
 nations.21261.a:0 "기필코 갚아주마!"
 nations.21262.name:0 "습격대"
 nations.21262.desc:0 "[Root.GetName]의 우리 식민지 지하에 거주하던 외계종이 어두운 밤을 틈타 땅굴로 소규모 습격대를 보내고 있습니다. 습격대의 공격으로 식민지 주요 시설 하나가 파괴되었고, 습격대는 우리 병력이 대응하기도 전에 지하로 사라졌습니다."
 nations.21262.a:0 "습격을 막아야 합니다!"
 nations.21263.name:0 "지상 공격"
 nations.21263.desc:0 "[Root.GetName]이 또다시 공격받았습니다! [Root.Owner.GetSubMantleLower] 외계종이 우리 주요 정착지 한복판으로 통하는 새 땅굴에서 쏟아져 나왔습니다. 이들은 현지 방어 병력을 제압하고 개척민들을 학살했습니다. 땅굴로 퇴각하면서는 살아남은 몇몇 개척민을 지하로 끌고 갔고, 희생자들의 비명이 울려 퍼졌습니다."
 nations.21263.a:0 "이 살인 행위에는 반드시 대가가 따를 것이다."
 nations.21264.name:0 "지하의 생존자"
 nations.21264.desc:0 "[Root.GetName]의 우리 병력이 식민지 아래의 땅굴망을 조사하던 중 [Root.Owner.GetSubMantleLower] 외계종의 대도시를 발견했습니다. 우리가 신경 가스를 살포하기 전에 지하 제국의 나머지 지역과 스스로를 격리하는 데 성공한 도시입니다. 도시에는 수백만의 외계인이 겁에 질린 채 살고 있습니다. 공병들에게 동굴을 무너뜨려 일을 마무리하라고 지시할까요?"
 nations.21264.a:0 "네, 고통을 끝내 줍시다."
 nations.21264.b:0 "아니요! 지상으로 끌고 옵시다. 노예로 부려먹죠."
 nations.21264.b.subterranean:0 "아니요! 식민지로 끌고 옵시다. 노예로 부려먹죠."
 nations.21265.name:0 "[Root.Owner.GetSubMantleUpper] 확장"
 nations.21265.desc:0 "[Root.GetName]의 동굴망에 살포했던 신경가스를 제거하고, 외계종의 시체를 정리했습니다. 이제 개척민들은 이곳으로 안전하게 이주할 수 있습니다. 물론 외계종이 남긴 원시적인 건물은 모두 철거할 예정이며, 그 자리에 우리의 최첨단 건물이 들어설 것입니다."
 nations.21266.name:0 "금이다!"
 nations.21266.desc:0 "지금은 멸종한 지하 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.21266.desc.subterranean:0 "지금은 멸종한 마그마 외계종이 살던 [Root.GetName]의 땅굴 깊숙한 곳까지 탐사대가 들어갔습니다. 탐사 결과, 지하 외계 제국이 대량의 귀금속을 채굴했다고 소문이 돌던 금광을 마침내 발견할 수 있었습니다."
 nations.21267.name:0 "보물고"
 nations.21267.desc:0 "[Root.GetName]의 땅굴망을 탐사하던 정찰대가 한때 지하 외계 제국의 수도였던 도시에서 왕궁에 진입했습니다. 알현실의 거대한 왕좌에는 황제로 보이는 자의 시신이 여전히 앉아 있었습니다.\n\n정찰대는 폭약으로 왕궁 금고를 뚫고 들어가 가득 쌓인 황금과 기이한 외계 예술품을 발견했습니다. 예술품은 [From.Owner.Capital.GetName]의 박물관으로 보내고, 황금은 매각해 국가 예산에 상당한 보탬을 줄 수 있을 것입니다."
 nations.21268.name:0 "[From.GetName]과의 사건"
 nations.21268.desc:0 "우리 §Y사절§! 한 명이 위대한 [From.GetRulerName]에게 무례를 범하여 외교적 사건이 발생했습니다. 즉시 투옥된 사절은 이제 사형 집행인이 대기하는 형식적인 재판에 서게 되었습니다.\n\n§H외교 면책 특권§!을 주장할 수는 있지만, 심각한 §R외교적 파장§!이 발생할 것입니다."
 nations.21268.a:0 "외교관 면책 특권을 주장하라! 그 사절은 살아 있어야 한다."
 nations.21268.b:0 "처형을 승인하라. 후폭풍을 감수할 수는 없다..."
 nations.21269.name:0 "[From.GetName]의 기근"
 nations.21269.desc:0 "§H[From.GetName]§!의 대표단이 찾아왔습니다. 최근 어려움을 겪고 있으며 §R기근§!의 위협에 직면했다고 합니다.\n\n그들은 우리가 할 수 있는 어떤 도움이라도 제공해 달라고 호소하고 있습니다..."
 nations.21269.a:0 "물론이죠. 힘닿는 데까지 지원하겠습니다."
 nations.21269.b:0 "스스로 살아남아야 한다."
 nations.21269.c:0 "나눠줄 식량이 부족하다..."
 ethic_fanatic_socialism_nation_pleased:0 "그 결과 §H$ethic_socialism$ [FROM.GetName]§!과의 관계가 §G개선§!됩니다."
 ethic_fanatic_socialism_nation_displeased:0 "그 결과 §H$ethic_socialism$ [FROM.GetName]§!과의 관계가 §R악화§!됩니다."
 nations.21270.name:0 "$ethic_socialism$의 선물"
 nations.21270.desc:0 "두 문명의 우호를 기념하는 선물로 §H[FROM.GetName]§!의 사절이 §Y$tech_planned_economy$§!에 관한 정치 이론을 전수했습니다. 이 정책을 시행하면 신뢰할 수 있고 예측 가능한 공급망으로 §G안정적인 산업§!을 뒷받침하는 계획 경제를 도입할 수 있습니다. 다만 '중요도가 낮은' 시장은 공급망이 위축되어 §R무역이 감소§!합니다."
 nations.21270.a:0 "뭘 이런 걸 다."
 nations.21270.b:0 "지금 이 정책을 시행하자."
 nations.21271.name:0 "[From.GetName] 난민"
 nations.21271.desc:0 "최근 §H[FROM.GetName]§!에서 온 대규모 난민 집단이 소규모 군대에 쫓겨 국경에 도착했습니다. 이들은 자유를 위해 싸우는 저항 세력이며 쿠데타 시도에 실패한 뒤 도망쳤다고 주장합니다.\n\n제국에 받아들이면 위대한 [From.GetRealName]의 분노를 살 것이 분명합니다. 하지만 추격군에 넘겨주면 처형당할 가능성이 높습니다."
 nations.21271.a:0 "그들이 원한다면, 받아주겠습니다."
 nations.21271.b:0 "정치적 갈등은 피해야 합니다. 돌려보내세요."
 nations.21271.xenophobe:0 "외부인을 우리 나라에 들일 수 없다."
 nations.21271.civic_fanatic_purifiers:0 "양쪽 모두 보이는 즉시 죽여라."
 ethic_fanatic_socialism_nation_refugees:0 "§Y$ethic_socialism$§! §Y[FROM.GetSpeciesNamePlural]§! £pop£ §G800§!이 우리 제국에 합류합니다."
 nations.21272.name:0 "$ethic_socialism$ 문화 교류"
 nations.21272.desc:0 "여러 사절이 §H[FROM.GetName]§! 주민들과 오랜 시간을 함께 보낸 뒤 돌아왔습니다. 그곳의 생활 방식과 관습을 배웠으니 우리 사회학 연구에 분명 도움이 될 것입니다.\n\n하지만 새로운 문화에는 새로운 사상도 따라옵니다... 대중의 §H자유로운 교류§!를 허용할까요?"
 nations.21272.a:0 "우리 국민들은 재화와 사상을 자유롭게 교환할 수 있다."
 nations.21272.b:0 "출입하는 모든 것을 엄격하게 규제하겠다."
 nations.21273.name:0 "[From.GetName] 관련 사망 사고"
 nations.21273.desc:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 우주로 향하던 로켓이 비행 중 동력을 잃고 우리 인근 정착지에 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.21273.nomad:0 "§H[FROM.GetName]§! 국경 근처에서 불행한 사고가 발생했습니다. 정기 정비 작업이 크게 잘못되어 공중 도크가 우리 인근 정착지로 추락했습니다. 그날 많은 [Root.GetSpeciesName]이 목숨을 잃었습니다..."
 nations.21273.a:0 "눈감아 주도록 하죠."
 nations.21273.b:0 "꼭 사죄를 받아야겠습니다!"
 nations.21274.name:0 "기술 전수 요청"
 nations.21274.desc:0 "§Y$tech_frontier_health$§!를 본 뒤 §H[FROM.GetName]§!의 여러 사절이 의료 기술을 공유해 달라고 요청했습니다.\n\n우리 과학자들은 우선 과제에서 연구 자금이 빠져나갈 것을 우려하며 망설이고 있습니다.\n\n요청을 거절하면 그들의 지도자 [From.GetRulerName](은)는 이를 도움이 필요한 모든 이들에 대한 모욕으로 여겨 양국 관계가 악화될 것입니다."
 nations.21274.a:0 "현재의 연구 중점을 유지해야 한다."
 nations.21274.b:0 "친구끼리 나누며 살아야죠."
 nations.21275.name:0 "메시지 수신"
 nations.21275.desc:0 "최근 §H[FROM.GetName]§!과의 교역이 뜸해지면서 상단의 방문도 점점 드물어졌습니다. 오늘은 그들의 군 대표에게서 메시지가 도착했습니다. 그다지 기분이 좋지는 않아 보입니다."
 nations.21275.a:0 "어떤 내용인지 봅시다."
 nations.21276.name:0 "메시지"
 nations.21276.desc:0 "지상인. 우리는 좋은 이웃이 되려 했으나, 그대들에게는 우리의 영광스러운 문명과 위대한 [From.GetRulerName]께 마땅한 존중을 보일 뜻이 없다는 점이 분명해졌다.\n\n이에 황제께서는 우리의 정당한 권리에 따라 이 행성 전체를 차지하라고 명하셨다. 그대들을 정복하겠다!"
 nations.21276.a:0 "§H[FROM.GetName]§! 국경에 방어 태세를 갖춰라!"
 nations.21277.name:0 "[FROM.GetName]의 연합 제안"
 nations.21277.desc:0 "[ROOT.GetName], 우리는 많은 문제에서 뜻을 같이합니다. 우리 두 국민 국가를 공식적으로 §G연합§!하여 하나의 §H통합 제국§!으로 만들고자 합니다."
 nations.21277.assimilate:0 "우리의 신념은 비슷하고 목표도 같다. 동화하라."
 nations.21277.merge.fanatic:0 "우리의 광적인 신념과 목표가 일치한다. 하나가 되자."
 nations.21277.merge.normal:0 "윤리관도 비슷하고 국가 간 관계도 우호적이다. 하나가 되자."
 nations.21277.merge.different:0 "윤리관의 차이에도 불구하고 우리 두 나라는 떼어 놓을 수 없는 사이가 되었다."
 nations.21277.no:0 "지금은 연합에 합류할 생각이 없다."
 nations.90001.ethic_fanatic_authoritarian.desc.open_border:0 "[FROM.GetName]의 왕실 사절이 국경 개방을 논의하기 위해 알현을 요청했습니다. 회담은 성과를 거두었고 양측은 국경 통행 조건에 합의했습니다.\n\n이제 남은 것은 [ROOT.Ruler.GetName](이)가 [ROOT.GetName]과 [FROM.GetName] 사이의 공식 국경 정책을 발표하는 정식 결정뿐입니다."
 nations.90001.ethic_fanatic_egalitarian.desc.open_border:0 "[FROM.GetName]의 사절이 양국 간 자유로운 이동을 위해 국경 개방을 요청하는 통신을 보내왔습니다. 협상은 순조롭게 진행되어 양측이 국경 통행 조건에 합의했습니다.\n\n이제 남은 것은 [ROOT.Ruler.GetName]이 [ROOT.GetName]과 [FROM.GetName] 사이의 공식 국경 정책을 발표하는 최종 결정뿐입니다."
 nations.90001.ethic_fanatic_xenophobe.desc.open_border:0 "[FROM.GetName]의 사절이 국경을 넘어와 국경 개방 제안서를 전달했습니다. 문서에는 양측 모두 수용할 수 있는 국경 통행 조건이 정리되어 있었습니다.\n\n[ROOT.Ruler.GetName]은 [ROOT.GetName]과 [FROM.GetName] 간의 국경 방침을 공식화하는 발표를 준비하고 있습니다."
 nations.90001.ethic_fanatic_xenophile.desc.open_border:0 "[FROM.GetName]의 사절 여러 명이 큰 호기심을 품고 우리 나라의 수도에 들어왔습니다. 유명한 장소를 두루 돌아보며 [ROOT.GetName]의 문화를 직접 체험한 이들은, 풍부한 교류 끝에 양국의 국경을 개방하자고 제안했습니다.\n\n국민들은 [ROOT.Ruler.GetName](이)가 [ROOT.GetName]과 [FROM.GetName] 사이의 국경 정책을 발표하기를 기다리고 있습니다."
 nations.90001.ethic_fanatic_militarist.desc.open_border:0 "[FROM.GetName]의 전사들이 양국의 국경 정책을 논의하기 위해 도착했습니다. 여러 검투 경기를 관람하는 동안 합의 조건이 작성되었습니다.\n\n이제 [ROOT.Ruler.GetName]이 [ROOT.GetName]과 [FROM.GetName] 사이의 국경 협상 결과를 발표할 것입니다."
 nations.90001.ethic_fanatic_pacifist.desc.open_border:0 "[FROM.GetName]의 사절이 평화의 징표를 지니고 도착하여 두 나라 사이의 국경을 개방하자고 제안했습니다.\n\n[ROOT.Ruler.GetName]은 [ROOT.GetName]과 [FROM.GetName] 간의 국경 방침을 공식화하는 발표를 준비하고 있습니다."
 nations.90001.ethic_fanatic_spiritualist.desc.open_border:0 ""
