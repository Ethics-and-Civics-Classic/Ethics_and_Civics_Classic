l_korean:
 PrimPlayer_pirate_station:0 "해적 은신처"
 PrimPlayer_pirate_station_plural:0 "해적 은신처"
 PrimPlayer_angry_population:0 "분노한 대중"
 PrimPlayer_angry_population_desc:0 "최근의 사건들로 주민들이 크게 분노했습니다."
 PrimPlayer_tech_transaction:0 "무기 기술 공유"
 PrimPlayer_tech_transaction_desc:0 "우리 연구 자료와 자금의 일부가 우리 모성에 있는 다른 국민 국가를 위해 배정되어 있습니다."
 tech_primitive_arkship:0 "고대 방주선"
 tech_primitive_arkship_desc:0 "방주선을 발견한 지 아득한 세월이 흘렀습니다. 하지만 지식을 독점하려는 자들의 질투, 사소한 탐욕, 세월의 변덕 때문에 건조의 비밀은 사라진 지식이 되었습니다. 우리 고고학자들은 이를 §E소실 기술§!이라 부릅니다."
 tech_primitive_arkship_tooltip:0 "§H방주선 유형 잠금 해제:§! 고대 방주선"
 tech_primitive_arkship_tooltip_desc:0 "방주선을 발견한 지 아득한 세월이 흘렀습니다. 하지만 지식을 독점하려는 자들의 질투, 사소한 탐욕, 세월의 변덕 때문에 건조의 비밀은 사라진 지식이 되었습니다. 우리 고고학자들은 이를 §E소실 기술§!이라 부릅니다."
 tech_primitive_ring_world:0 "고대 링 월드"
 tech_primitive_ring_world_desc:0 "링 월드가 발견된 뒤 장구한 세월이 흘렀습니다. 그러나 지식을 독점하려는 자들의 시기와 사소한 탐욕, 혹은 세월의 변덕으로 건설의 비밀이 사라졌습니다. 고고학자들은 이를 §E소실 기술§!이라 부릅니다."
 tech_primitive_ring_world_tooltip:0 "§H잠금 해제:§! 고대 링 월드"
 tech_primitive_ring_world_tooltip_desc:0 "링 월드가 발견된 뒤 장구한 세월이 흘렀습니다. 그러나 지식을 독점하려는 자들의 시기와 사소한 탐욕, 혹은 세월의 변덕으로 건설의 비밀이 사라졌습니다. 고고학자들은 이를 §E소실 기술§!이라 부릅니다."
 tech_primitive_habitat:0 "고대 궤도 거주지"
 tech_primitive_habitat_desc:0 "궤도 거주지를 발견한 뒤 영겁의 시간이 흘렀습니다. 그러나 지식을 독점하려는 자들의 시기심과 하찮은 탐욕, 혹은 세월의 변덕 탓에 그 건설 비법은 잃어버린 지식이 되었습니다. 우리 고고학자들은 이를 §E소실 기술§!이라 부릅니다."
 tech_primitive_habitat_tooltip:0 "§H잠금 해제:§! 고대 궤도 거주지"
 tech_primitive_habitat_tooltip_desc:0 "궤도 거주지를 발견한 뒤 영겁의 시간이 흘렀습니다. 그러나 지식을 독점하려는 자들의 시기심과 하찮은 탐욕, 혹은 세월의 변덕 탓에 그 건설 비법은 잃어버린 지식이 되었습니다. 우리 고고학자들은 이를 §E소실 기술§!이라 부릅니다."
 tech_primitive_artificial:0 "고대 인공 행성"
 tech_primitive_artificial_desc:0 "인공 행성을 발견한 뒤 영겁의 시간이 흘렀습니다. 하지만 지식을 독점하려는 자들의 시기심과 하찮은 탐욕, 혹은 세월의 변덕 탓에 그 건설 비법은 잃어버린 지식이 되었습니다. 우리 고고학자들은 이를 §E소실 기술§!이라 부릅니다."
 tech_primitive_artificial_tooltip:0 "§H잠금 해제:§! 고대 인공 행성"
 tech_primitive_artificial_tooltip_desc:0 "인공 행성을 발견한 뒤 영겁의 시간이 흘렀습니다. 하지만 지식을 독점하려는 자들의 시기심과 하찮은 탐욕, 혹은 세월의 변덕 탓에 그 건설 비법은 잃어버린 지식이 되었습니다. 우리 고고학자들은 이를 §E소실 기술§!이라 부릅니다."
 job_arkship_scavenger:0 "고물 수집가"
 job_arkship_scavenger_plural:0 "고물 수집가"
 job_arkship_scavenger_desc:0 "고물 수집가들은 가치 있는 물건을 찾아 §H$primitive_arkship_planet_modifier$§!의 폐허를 탐색합니다."
 job_arkship_scavenger_effect_desc:0 "£job_arkship_scavenger£ $job_arkship_scavenger_plural$는 소량의 $r_alloys$, $r_amenities$, $r_research$를 생산합니다."
 mod_arkship_scavenger_add:0 "$job_arkship_scavenger$ 직업"
 mod_job_broken_shackles_scavenger_per_pop:0 "$VALUE$팝당 $job_arkship_scavenger$ 직업 §G+1§!"
 primitive_arkship_planet_modifier:0 "유물 방주선"
 primitive_arkship_planet_modifier_desc:0 "['concept_pc_ark']§W이§! £planet£ §Y3§!§W만큼§! §G증가합니다§!\n\n아득한 옛날의 고대 방주선으로, 이제 우리 민족의 조상 대대로 이어진 고향입니다. 수많은 세대를 거치며 방주선 기술의 극히 일부만 전해져, 이제는 지나간 시대의 유물이 되었습니다.\n\n오늘날의 고고학자들은 이 §H유물 방주선§!에 흩어진 §E§E소실 기술§!§! 설계도에서 배울 것이 많습니다. 덕분에 새로운 §Y고고학 발굴 현장§!을 발견하는 일은 꽤 흔합니다."
 primitive_ring_world_planet_modifier:0 "유물 링 월드"
 primitive_ring_world_planet_modifier_desc:0 "이 고대 링 월드는 아득한 옛날 산산이 부서졌으며, 이제 우리 민족의 조상 대대로 이어진 고향입니다. 수많은 세대를 거치며 링 월드 기술의 극히 일부만 전해져, 이제는 지나간 시대의 유물이 되었습니다.\n\n오늘날의 고고학자들은 이 §H유물 링 월드§!에 흩어진 §E§E소실 기술§!§! 설계도에서 배울 것이 많습니다. 덕분에 새로운 §Y고고학 발굴 현장§!을 발견하는 일은 꽤 흔합니다."
 primitive_habitat_planet_modifier:0 "유물 궤도 거주지"
 primitive_habitat_planet_modifier_desc:0 "아득한 옛날에 지어진 고대 궤도 거주지는 이제 우리 민족의 대대로 이어진 고향입니다. 수많은 세대가 이 거주지 기술의 극히 일부만을 전승해 왔고, 거주지는 지나간 시대의 유물이 되었습니다.\n\n오늘날의 고고학자들은 이 §H유물 거주지§! 곳곳에 남은 §E§E소실 기술§!§! 설계도에서 배울 것이 많습니다. 따라서 새로운 §Y고고학 발굴지§!가 발견되는 일도 제법 흔합니다."
 primitive_artificial_planet_modifier:0 "유물 인공 행성"
 primitive_artificial_planet_modifier_desc:0 "아득한 옛날 건설되어 이제 우리 민족의 조상 대대로 내려오는 고향이 된 행성입니다. 수많은 세대가 이 인공 행성 기술의 극히 일부만을 전승하면서, 이곳은 지나간 시대의 유물이 되었습니다.\n\n오늘날의 고고학자들은 이 §H유물 인공 행성§! 곳곳에 흩어진 §E§E소실 기술§!§! 설계도에서 배울 것이 많으며, 새로운 §Y고고학 발굴지§! 발견도 상당히 흔합니다."
 PrimPlay_situation_event.1100.title:0 "[root.GetName] 워프 드라이브 가동 준비"
 PrimPlay_situation_event.1100.desc:0 "고대 방주선의 초광속 드라이브가 에너지로 진동하며 다음 성계로 도약할 준비를 거의 마쳤습니다.\n\n공학팀을 보내 종료 절차를 준비할까요, 아니면 워프 드라이브가 작동하도록 둘까요?"
 PrimPlay_situation_event.1100.deactivate:0 "공학부에 대기하라고 전하라."
 PrimPlay_situation_event.1100.materialist:0 "비활성화 절차를 개시하라."
 PrimPlay_situation_event.1100.spiritualist:0 "진정의 의식을 준비하라!"
 PrimPlay_situation_event.1100.civic_machine_cult.deactivate:0 "기계 영혼을 달래라."
 PrimPlay_situation_event.1100.civic_machine_cult.activate:0 "기계 영혼이 말씀하신다!"
 PrimPlay_situation_event.1100.activate:0 "워프를 준비하라!"
 PrimPlay_situation_event.1101.title:0 "[root.GetName] 워프 드라이브 비활성화"
 PrimPlay_situation_event.1101.desc:0 "고대 방주선의 초광속 드라이브가 잠잠해졌습니다. 넘치던 에너지의 울림은 멎었고, 공학자들은 이 침묵이 거의 §Y5년§! 동안 이어질 수 있다고 판단합니다.\n\n그동안 [fleet.GetName]의 주민들은 새로운 [fleet.solar_system.GetName] 성계에 오래 머물 준비를 합니다."
 PrimPlay_situation_event.1101.a:0 "당분간은 이곳이 우리의 고향이다."
 PrimPlay_situation_event.1102.title:0 "[root.GetName]이 [fleet.solar_system.GetName]으로 워프함"
 PrimPlay_situation_event.1102.desc:0 "고대 방주선의 초광속 드라이브가 에너지로 울려 퍼지더니, 우리 문명을 온전히 태운 채 다음 성계로 도약했습니다.\n\n과학자들에 따르면 §Y손상된 초광속 드라이브§!가 다시 점프를 시도할 만큼 에너지를 모으려면 최소 §Y5년§!이 걸립니다."
 PrimPlay_situation_event.1102.a:0 "[fleet.solar_system.GetName] 탐사를 준비하라!"
 PrimPlay_situation_event.1102.b:0 "[fleet.solar_system.GetName] 탐사를 완료했다."
 ANCIENT_FISSION_REACTOR:0 "고대 핵분열 반응로"
 ANCIENT_FISSION_REACTOR_DESC:0 "핵분열이 발견된 뒤 장구한 세월이 흘렀습니다. 그러나 지식을 독점하려는 자들의 시기와 사소한 탐욕, 혹은 세월의 변덕으로 새로운 원자로를 건설하는 지식이 사라졌습니다. 핵의 불꽃에 관한 비밀은 이제 §E소실 기술§!이라 불립니다."
 ANCIENT_SHIP_THRUSTER_0:0 "고대 화학 추진기"
 ANCIENT_SHIP_THRUSTER_0_DESC:0 "행성을 움직이는 이 엔진 속 영액의 비밀은 잊힌 지식, 즉 §E소실 기술§!이 되었습니다. 수 세기 동안 우리는 줄어드는 잔량에 의존하며 아슬아슬한 궤도 역학의 곡예를 벌여야 했습니다."
 decision_primplayer_unified_planet:0 "분열된 국민 국가 통합"
 decision_primplayer_unified_planet_desc:0 "비극을 통해서든 단결을 통해서든, 우리의 혁명은 운명을 빚어낼 것입니다."
 edict_decision_primplayer_awareness_situation:0 "성간 인식 기조"
 edict_decision_primplayer_awareness_situation_desc:0 "성간 생명체의 존재는 공식 인정만 남겨 둔 상태입니다."
 decision_primplayer_awareness_situation_fail:0 "§Y성간 인식§! 상황을 완료함"
 decision_primplayer_awareness_situation_suppress:0 "§H$PrimPlayer_awareness_situation_suppress$§! 접근법을 사용하지 않음"
 ethic_civic_classic_flag.4.title:0 "정부 발표"
 ethic_civic_classic_flag.4.proactive.desc:0 "§H성간 제국§!의 증거가 [Root.GetName] 전역에 퍼졌습니다. 아마추어 관측자와 과학자 모두 몇 주 동안 밤하늘에서 목격한 증거를 대조해 왔습니다. 모두가 [Root.GetRulerName]의 공식 정부 입장 발표를 기다리며, 명백한 확인과 뒤이을 축제를 기대하고 있습니다.\n\n그럼에도... 여전히 이 주장을 의심하는 이들이 있습니다. §Y허위 정보 선전§!에 자금을 투입하면 우리 문명이 성간 제국을 인식하는 것을 억누를 수 있습니다."
 ethic_civic_classic_flag.4.desc:0 "§H성간 제국§!의 증거가 [Root.GetName] 전역에 퍼졌습니다. 국민들은 [Root.GetRulerName]의 공식 정부 입장 발표를 기다리며 명백한 확인을 기대하고 있습니다.\n\n그럼에도... 여전히 이 주장을 의심하는 이들이 많습니다. §Y허위 정보 선전§!에 자금을 투입하면 우리 문명이 성간 제국을 인식하는 것을 억누를 수 있습니다."
 ethic_civic_classic_flag.4.full.proactive:0 "성간 생명의 축제를 시작하라."
 ethic_civic_classic_flag.4.full:0 "성간 생명체에 관한 소문이 사실이라고 인정하라."
 ethic_civic_classic_flag.4.suppress:0 "이 '진실 추구자' 운동의 신뢰를 무너뜨릴 자금을 배정하라."
 nations.disabled_content.tooltip:0 "§R(!) 개발 중인 콘텐츠§! - 스팀 배포판에서는 비활성화됨"
 d_primitive_nation_absorption_effect_tooltip:0 "£pop£ 팝 §G1000§! 생성"
 d_primitive_nation_absorption_tomb_tooltip:0 "£pop£ 팝 §G500§!명 생성"
 story.7.desc.PrimPlayer:0 "[Root.GetName]에서 외계 지성체를 발견하기까지는 오랜 시간이 걸리지 않았습니다.\n\n[Root.GetSpeciesAdj] 수도 행성에 보낸 보고서를 살펴보면 이 외계종이 우리와 전혀 동떨어진 모습을 하고 있음을 다소 축소시켜 말하고 있으며, 통신을 연결하지 못했다는 내용은 스쳐 가듯 언급만 하고 있습니다."
 story.7.desc.PrimPlayer.gesta:0 "별들 사이에서 미확인 비행 물체와 조우했습니다. 대상의 기원은 확인할 수 없습니다.\n\n추가 조사를 시도할 수 있으나 주의가 필요합니다."
 story.7.desc.PrimPlayer.phobe:0 "밤하늘의 미확인 비행 물체에 관한 소문이 퍼지면서 [Root.Capital.GetName] 곳곳의 주민들이 동요하고 있습니다. 언론은 미지의 존재에 대한 공포를 조장하며 최악을 가정하는 것이 현명하다고 주장합니다.\n\n고문들은 이러한 사회적 충격의 불안정성을 경고하지만, 이를 이용해서 얻을 이익이 더 클 수도 있습니다. 어느 쪽이든 변화의 시대입니다."
 story.7.desc.PrimPlayer.phile:0 "밤하늘의 방문자에 관한 소문에 전 세계 주민들이 축하하고 있습니다. 모두가 조우 사실을 믿는 것은 아니지만, [Root.Capital.GetName]의 분위기는 열광적이라는 말이 가장 잘 어울립니다!\n\n고문들은 이러한 사회적 충격을 신중히 다루라고 경고하지만, 이 상황이 도움이 될 수도 있습니다. 어쨌든 변화의 시대가 왔습니다."
 nations.5.name:0 "자연 웜홀"
 nations.5.desc:0 "§H[wormhole_system.GetName]§! 성계 가장자리에서 자연적으로 발생한 것으로 보이는 아공간 현상을 감지했습니다! 시공간 자체에 균열이 생겨 '§H웜홀§!'이 형성되었습니다. 우리 과학자들은 이것이 아공간을 통해 은하 어딘가에 있는 또 다른 웜홀로 이어지는 통로일 수 있다고 추측합니다.\n\n반대편 웜홀의 위치에 따라서는 함선이 불과 며칠 만에 은하의 한쪽 끝에서 다른 쪽 끝까지 이동할 수도 있습니다. 안타깝게도 이 웜홀은 대부분의 다른 웜홀처럼 본질적으로 불안정합니다. 무모하게 통과를 시도하는 함선은 몇 초 만에 산산이 찢어질 것입니다."
 nations.5.a:0 "어떻게든 안정화할 수만 있다면..."
 nations.6.title:0 "[capital_scope.GetName] 함락!"
 nations.6.nuked.desc:0 "파괴적인 핵겨울이 [capital_scope.GetName]을 덮쳤고, 지배권을 놓고 경쟁하던 남은 국가들도 함께 무너졌습니다. [ROOT.GetName](은)는 핵의 잿더미에서 일어났으며, 이 무덤 같은 행성을 정복하는 데 맞설 자가 없을 것입니다."
 nations.6.desc:0 "끈질긴 외교적 노력이나 치밀한 무력 행사 끝에, 이제 [capital_scope.GetName]은 [ROOT.GetName]의 지배 아래 놓였습니다. 남은 일은 대중을 단일 제국의 깃발 아래 모으는 것뿐입니다."
 nations.6.destroyed.desc:0 "상상조차 못 할 재앙입니다! 외계 제국의 §Y초강력 무기§!가 우리 모성을 §R파괴했습니다§!. 지표에 살던 불운한 주민들은 모두 사망한 것으로 추정됩니다.\n\n§R생존자는 없습니다§!..."
 nations.6.destroyed:0 "모성을 잃었으니 이제 새로운 보금자리를 찾아야 한다."
 nations.6.a:0 "이제 하나 된 민족으로서 별을 향해 나아간다!"
 nations.6.authoritarian:0 "약자는 강자에게 굴복할 것이다."
 nations.6.egalitarian:0 "국민들은 새롭게 얻은 자유를 기뻐할 것이다."
 nations.6.xenophobe:0 "그들은 우리 문화에 동화될 것이다."
 nations.6.xenophile:0 "문화 교류를 받아들이자!"
 nations.6.militarist:0 "우리의 무력이 모든 갈등을 해결할 것이다."
 nations.6.pacifist:0 "평화로운 공존이 번영을 가져올 것이다."
 nations.6.spiritualist:0 "우리 신앙의 빛이 불신자들을 인도할 것이다."
 nations.6.materialist:0 "신중하게 미래에 적응하는 법을 배우겠다."
 nations.6.green:0 "자연을 보전하지 않으면 고향이라 부를 행성도 없다."
 nations.6.industrial:0 "내일의 진보는 오늘의 성취 위에 세워진다."
 nations.6.socialism:0 "전체는 부분의 합보다 크다."
 nations.6.capitalism:0 "가장 뛰어나고 총명한 이들이 새 시대를 이끌 것이다."
 nations.8.title:0 "[ROOT.GetName] 내전 종식!"
 nations.8.desc:0 "독립을 위한 끝없는 투쟁을 견뎌 낸 [ROOT.GetName]이 마침내 [Owner.GetName]의 군대에 의해 해방되었습니다. 승리는 우리의 것입니다!"
 nations.8.gestalt:0 "의심은 사라져라. 이제 우리는 하나의 의식이다."
