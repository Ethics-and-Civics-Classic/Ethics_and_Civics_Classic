 auth_dictatorial:0 "독재정"
 auth_dictatorial_desc:0 "독재정에서는 한 개인이 절대적인 통제권을 행사하며 평생 국가를 통치합니다."
 building_biomaterials_plant:0 "산업용 생체 소재 공장"
 building_biomaterials_plant_desc:0 "이 시설은 바이오매스로 산업용 유기 복합 소재와 다양한 영양소를 만듭니다."
 civic_drone_brotherhood:0 "드론 형제단"
 civic_drone_brotherhood_desc:0 "이 사회는 전통적으로 노동계급을 찬양하며, 노동자들은 집단주의와 평등이라는 이상적인 원칙에 기반한 전 행성 공동체를 형성합니다. §H농장§!과 §H광산§!이 각각 §H통합력§! §Y0.2§!를 생산합니다."
 shipsize_military_station_small_construction_speed_mult:0 "방어 플랫폼 건조 속도"
 shipsize_military_station_medium_construction_speed_mult:0 "중형 군사 기지 건조 속도"
 shipsize_military_station_large_construction_speed_mult:0 "요새 건조 속도"
 civic_nationalism:0 "국가주의"
 civic_nationalism_desc:0 "강렬한 국가적 우월감과 자부심이 이 사회의 모든 계층에 스며들어 있습니다. §H단결§! 전통을 채택할 수 없습니다."
 civic_private_property:0 "에너지 연합"
 civic_private_property_desc:0 "경제 성장에는 막대한 에너지가 필요합니다. 효율과 산업 발전을 높이기 위해 정부는 발전 시설 상당수를 민영화했습니다. §H$building_power_hub_1$§! 및 §H$building_power_hub_2$§!가 통합력 §Y1§!도 생산합니다."
 civic_militia:0 "민간 군사 조직"
 civic_militia_desc:0 "이 사회에서는 민간 군사 기업이 영향력 있는 지위에 올랐으며, 군 운영의 많은 부분이 강력한 기업들에 넘어갔습니다."
 civic_public_medicine:0 "공공 의료"
 civic_public_medicine_desc:0 "정부가 광범위한 공공 의료 체계를 유지합니다. §Y개척지 의료§! 기술을 보유한 상태로 시작합니다. §H의료원§!과 §H병원§!이 추가 §H통합력§!을 제공합니다."
 civic_public_education:0 "공교육"
 civic_public_education_desc:0 "정부가 광범위한 공교육 제도를 유지합니다."
 civic_monarchy:0 "군주정"
 civic_monarchy_desc:0 "군주제는 대개 왕조를 이루는 가문 같은 집단이 국가의 정체성을 구현하며, 그 구성원 중 한 명이 평생 국가원수나 정부 수반, 보통은 둘 모두를 맡는 정부 형태입니다."
 civic_dictatorship:0 "독재정"
 civic_dictatorship_desc:0 "독재정은 한 사람인 독재자 또는 특정 정치 집단이 국가를 다스리는 정부 형태이며, 다양한 수단으로 권력을 행사하여 통치 주체의 절대 권력을 유지합니다."
 civic_nazi_dictatorship:0 "국가주의 독재정"
 civic_nazi_dictatorship_desc:0 "통치자는 전통적으로 지배적인 국가주의 정당의 지도자입니다."
 civic_republic:0 "공화국"
 civic_republic_desc:0 "공화국은 국가를 통치자의 사적인 관심사나 재산이 아닌 \"공적인 일\"로 여기며, 여러 법률과 규칙에 따라 공직자를 선출하거나 임명하는 정부 형태입니다."
 civic_xeno_republic:0 "다문화 공화국"
 civic_xeno_republic_desc:0 "다른 문화에 완전히 개방적이고 이들을 동등하게 받아들이는 원칙으로 통치하는 다문화 공화국입니다. 외계종에게 기본적으로 §H완전한 시민권§!과 §H완전한 병역§!이 보장됩니다."
 civic_feudalism:0 "관료주의"
 civic_feudalism_desc:0 "관료 조직은 전통적으로 국가 기구의 확대를 선호하며, 그 결과 중앙 정부의 규제 권한이 과도해집니다."
 civic_ambassadors_assembly:0 "대사 의회"
 civic_ambassadors_assembly_desc:0 "가장 영향력 있는 외교 관리들로 구성된 집단이 정부를 지배합니다."
 civic_demos_cratos:0 "민주정"
 civic_demos_cratos_desc:0 "일반 시민들이 주민 투표와 국민 투표를 통해 지역 및 행성 전체의 정책을 직접 결정할 권한을 가집니다."
 civic_empire_bureau:0 "큰 정부"
 civic_empire_bureau_desc:0 "국가 관료 조직의 확대는 정부의 규제력을 높이지만, 필연적으로 추가 지출과 전반적인 경제 비효율을 초래합니다."
 civic_science_lobby:0 "기업 연구"
 civic_science_lobby_desc:0 "정부 연구 계획의 상당 부분을 더욱 효율적인 민간 기업에 위탁했습니다."
 tech_patriotic_call:0 "교리: 애국의 부름"
 tech_patriotic_call_desc:0 "전시에만 사용할 수 있는 특수 제국 시행령을 잠금 해제합니다."
 tech_strategic_taxation:0 "교리: 전략적 과세"
 tech_strategic_taxation_desc:0 "평시에만 사용할 수 있는 특수 제국 시행령을 잠금 해제합니다."
