 civic_cyber_dictatorship:0 "사이버 독재정"
 civic_cyber_dictatorship_desc:0 "이 정부는 치안과 행정 업무에 슈퍼컴퓨터를 적극 활용하는 기술관료 독재정입니다. 하지만 많은 권력을 인공지능에 맡긴 탓에 일반 시민이 통치 과정에 미치는 영향력은 더욱 줄어들었습니다."
