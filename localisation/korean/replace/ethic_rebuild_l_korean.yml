 civic_parliamentary_system:0 "정치적 다원주의"
 civic_parliamentary_system_desc:0 "이 사회는 다양한 정치 세력이 참여하는 의회 체제를 통해 어떤 주제든 활발한 공개 토론을 장려합니다. 유력 정치 파벌 중 하나의 환심을 사면 상당한 이익을 얻을 수 있습니다."
 civic_tooltip_parliamentary_system_effects:0 "$t$- 모든 §Y파벌§!이 §G행복§!해지며 추가 §G지지도§!를 제공합니다.$TABBED_NEW_LINE$- 민주정이 아닌 경우 §Y진보주의§! 파벌이 §Y민주정§! 정부 수립을 요구합니다."
 POLITICAL_PLURALISM:0 "정치적 다원주의"
