 job_geoengineer_plural:0 "행성 물리학자"
 job_geoengineer_desc:0 "행성의 물리적 특성을 전문적으로 연구하는 과학자입니다."
 job_geoengineer_effect_desc:0 "£job_researcher£ $job_geoengineer_plural$는 상당한 $r_engineering$와 $r_physics$를 생산합니다."
