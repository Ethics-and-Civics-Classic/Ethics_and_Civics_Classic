 civic_storm_callers_effect_tooltip:0 "$AVAILABLE_BUILDINGS$ £building£ ['building:building_storm_summoning_theater']: $r_consumer_goods$를 소비해 $r_unity$, $r_amenities$, 그리고 $r_society$ 또는 $r_engineering$를 생산합니다. 제국의 윤리관에 따라 £pops£ §H윤리관 선호도§!도 제공합니다.\n\n$SPECIES_TRAITS$ ['trait:trait_storm_touched']\n§Y우주 폭풍§! 내부에서:\n- £pops£ 직업 생산 자원: §G+10%§!\n- 편의 사용량: §G-10%§!"
