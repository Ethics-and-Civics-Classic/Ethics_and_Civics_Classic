 job_mining_engineer_desc:0 "채굴 공학자는 전문 기술을 활용해 행성 깊숙한 곳에서 광물을 추출합니다."
 job_mining_engineer_effect_desc:0 "£job_miner£ $job_mining_engineer_plural$는 £engineering£ §Y$engineering_research$§!를 생산하고 행성의 $mod_planet_jobs_minerals_produces_add$을 배율로 증가시킵니다."
