 civic_machine_cult:0 "기계 숭배"
 civic_machine_cult_desc:0 "이들은 기계를 신처럼 숭배하며 신앙의 열정으로 §Y로봇§!을 움직입니다."
 civic_tooltip_machine_cult_effects:0 "§Y로봇 노동자§! 기술, £pops£ §H잠재적 사이오닉 로봇§! §Y400§!, £building£ §Y기계 수도원§! 및 £building£ §Y로봇 조립 공장§! 건물을 보유한 상태로 시작합니다 \n\n- §Y정신주의§! 파벌이 로봇을 용인합니다. \n$civic_tooltip_machine_cult_buildings$ \n\n§E조합 가능한 사회 제도:§! \n- ['civic_tooltip_machine_cult_spiritualist_combo', $civic_exalted_priesthood$] 또는 기타 ['concept_ethics_rebuild_theocracy',§Y정신주의§! 계열 정부 사회 제도]."
