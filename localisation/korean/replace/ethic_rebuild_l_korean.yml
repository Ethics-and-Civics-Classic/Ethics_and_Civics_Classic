 building_recreational:0 "휴양 시설"
 building_recreational_desc:0 "사람들은 아주 특별한 약물만이 제공할 수 있는 평온함과 깊은 심리적 휴식을 찾아 이 휴양지를 방문합니다."
 building_sacred_grove:0 "신성한 숲"
 building_sacred_grove_desc:0 "제국 전역에서 사람들이 이 성지를 찾아와 연례 의식에 참여합니다. 특별한 방식으로 조리해 섭취하는 성스러운 식물은 더 지혜롭게 살아가는 법을 가르치고 몸과 마음에 건강을 가져다줍니다."
