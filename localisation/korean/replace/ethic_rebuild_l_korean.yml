 citizenship_organic_civilian:0 "생체 시민 자치권"
 citizenship_organic_civilian_tooltip:0 "이 종족의 팝은 §H$auth_machine_intelligence$§!의 보살핌을 받으며 제한적인 민간 자치권을 허용받습니다."
 citizenship_organic_civilian_tooltip_delayed:0 "§L유기체와의 공존은 가능합니다.§!"
 civic_ruthless_competition:0 "가차 없는 경쟁"
 civic_ruthless_competition_desc:0 "이 거대 기업의 노동 계급은 지배적 소유주 계급이 남긴 부스러기를 차지하기 위해 끊임없이 잔혹한 경쟁을 벌입니다. 이들의 행성에는 노조 탄압이 만연하며 공장과 광산은 아무런 규제도 받지 않습니다. 조직된 노동에 대한 탄압은 자국 행성에만 머무르지도 않습니다. 은하는 약육강식의 세계입니다."
 civic_tooltip_ruthless_competition_effects:0 "§W- §R의무§!:§! §Y계층 경제§! §W생활 수준 적용. \n- 거대 기업을 포함해 전쟁 또는 유효한 휴전 상태가 아닌 모든 제국의 행성에§! §Y지사§! §W건설 가능. \n- 노동을 억압하는 특수§! £building£ §Y$BRANCH_OFFICE_BUILDINGS$§!§W 건설 가능.§!"
 civic_centralized_state:0 "중앙 집권"
 civic_centralized_state_desc:0 " "
 civic_idealistic_foundation:0 "이상주의적 기반"
 civic_idealistic_foundation_desc:0 "이 사회는 자유와 평등이라는 이상주의적 토대 위에 세워졌으며, 중앙 정부의 권한이 크게 축소되어 있습니다."
 civic_tooltip_idealistic_foundation_effects:0 "$t$- §E잠금 해제§!: §Y$bombardment_EaC_liberate_slaves$§! 폭격 태세."
 civic_tooltip_idealistic_foundation_negative_effects:0 "$t$- §H진보주의자§! 및 §H노동주의자§! 파벌이 §Y직접 민주정§!을 §R요구§!합니다."
 civic_hierarchy:0 "불변의 위계"
 civic_hierarchy_desc:0 "이 사회의 정치 권력은 소수 지배 엘리트에게 집중되어 있습니다. 이들은 노동 계급을 철저히 지배하고 착취하며 불변의 카스트 제도를 유지합니다."
 civic_nationalistic_zeal:0 "제국주의"
 civic_nationalistic_zeal_desc:0 "강렬한 민족적 자부심과 제국주의적 야망이 이 사회의 모든 계층에 스며들어 있습니다.\n§W$BOB_mercs_tooltip$§!"
 civic_feudal_realm:0 "봉건 사회"
 civic_feudal_realm_desc:0 "이 사회는 봉건적 방식으로 조직되어 있으며, 군주는 상당한 자치권을 보유하고 영역을 통치하는 강력한 봉신에 의존합니다."
 civic_tooltip_feudal_realm_effects:0 "- §Y종속국화§! 제안 시 §Y외교 요구 사항§!을 무시\n- §Y종속국§!은 다음과 같은 협정 조건을 보유할 수 없음:\n$t$$TRIGGER_FAIL$§Y$subject_cannot_expand$§!\n$t$$TRIGGER_FAIL$§Y종속국 전쟁 불참§!\n$t$$TRIGGER_FAIL$§Y$subject_can_not_do_diplomacy$§!"
 civic_feudal_realm_authority:0 "신봉건제"
 civic_feudal_realm_authority_desc:0 "소수의 주주 집단이 이 거대 기업을 영지로 나누어 소유하며, 최대 주주가 그들을 다스립니다.\n\n§Y통치자§! §W및§! §Y지도자§! §W계급 변경:§! §H귀족§!"
 gov_neo_feudal_empire:0 "신봉건 사회"
 gov_neo_feudal_empire_desc:0 "소수의 주주들이 이 거대 기업을 봉토로 나누었으며, 최대 주주는 기업 봉신들 위에 군주처럼 군림합니다. 상당한 지분을 보유한 다른 주주들은 자신의 영토를 관리할 수 있지만, 그 대가로 수익의 일부를 거대 기업에 바쳐야 합니다."
 RT_SHAREHOLDER:0 "과반 지분 주주"
 civic_franchising:0 "가맹업"
 civic_franchising_desc:0 "기업 부문의 경영진은 자회사들의 가맹 계약을 관리하며, 종종 허점을 이용해 자산을 빼앗습니다. 가맹점들은 상품 판매를 위한 특수 라이선스와 공동 연구 개발 계획에 필요한 막대한 자금을 제공합니다."
 civic_tooltip_franchising_effects:0 "- §H가맹 계약§! 정책은 다음 협정 조건을 허용합니다:\n$t$$TRIGGER_PASS$§Y$subject_can_be_integrated$§!\n$t$$TRIGGER_PASS$§Y지배국 전쟁 참여: 모두§!\n- §Y종속국§!은 다음 협정 조건을 가질 수 없습니다:\n$t$$TRIGGER_FAIL$§Y$subject_cannot_expand$§!\n$t$$TRIGGER_FAIL$§Y$subject_can_not_do_diplomacy$§!\n$t$$TRIGGER_FAIL$§Y$subject_does_not_get_sensors$§!\n- §H가맹점§! 종속국에서 이용 가능한 보유 자산:\n    £building£ §Y$holding_franchise_headquarters$§!\n    £building£ §Y$holding_parasitic_algorithms$§!\n- £building£ §Y$building_commercial_forum$§! $megacorp_civic_branch_office_building_effect$"
 gov_megacorp_franchisor:0 "거대 기업 가맹 본부"
 gov_megacorp_franchisor_desc:0 "기업 지도자들이 자회사의 가맹 계약을 관리합니다. 이들은 종종 계약의 허점을 이용해 자산을 병합합니다. 가맹점들은 판매 가능한 상품의 특별 사용권과 공동 연구 개발 사업을 위해 막대한 자금을 제공합니다."
 franchising_terms:0 "가맹점 계약"
 franchising_terms_name:0 "$franchising_terms$"
 franchising_terms_desc:0 "이 계약에는 종속국과 기업 지배국 사이의 모든 조건이 명시되어 있습니다.\n\n§E초기 자회사 협정 조건:\n$t$$subject_can_be_integrated$\n$t$$subject_can_do_diplomacy$\n$t$$subject_can_expand$\n$t$기본 자원 세금: 30%\n$t$지배국 전쟁 참전: 모든 전쟁\n$t$종속국 전쟁 참전: 방어전\n$t$종속국 보유 자산 한도: 2§!\n\n§Y자비로운 종속 정책§!입니다."
 preset_franchisee:0 "가맹점"
 preset_franchisee_desc:0 "가맹점은 기업 지배국의 독점 라이선스와 공동 연구 개발 계획을 이용하는 대가로 매달 기초 자원을 납부합니다."
 preset_franchisee_flavor_desc:0 "가맹점은 상품에 대한 독점 사용권과 공동 연구 개발 사업을 유지하기 위해 기업 지배국에 매월 요금을 지불합니다.\n\n이용 약관이 적용될 수 있습니다."
