 job_yellow_death_knight_desc:0 "황색 죽음의 기사들은 돈에 집착하는 기회주의자이며, 크레딧에 대한 집착 때문에 황색이라는 이름을 얻었습니다. 이들의 종교 조직은 민간 군사 기업에 더 가까우며, 합법적이라면 어떤 일이든 맡기 위해 노예와 대담한 모험가, 언데드 무리를 고용하거나 대여합니다."
