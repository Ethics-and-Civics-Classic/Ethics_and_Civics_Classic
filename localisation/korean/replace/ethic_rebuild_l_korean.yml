 mod_job_soldier_pirate_per_pop:0 "$VALUE$팝마다 [soldier.GetName] 직업 §G+1§!"
 mod_job_soldier_pirate_per_pop_short:0 "\n$VALUE$ £pop£마다 £mod_job_soldier_add£ §G+1§!"
 BIO_TECH:0 "§Y첨단 생명 공학§!: §Y산업 생명 공학§! 기술을 연구하고 £job_biotechnologist£ $job_biotechnologist_plural$를 고용할 수 있습니다. 암석류 제국은 이용할 수 없습니다."
 job_hedonist:0 "쾌락주의자"
 job_hedonist_plural:0 "쾌락주의자"
 job_hedonist_desc:0 "생각할 수 있는 모든 물질적 욕구 및 욕망이 충족되는 부유한 삶을 살아갑니다."
 job_hedonist_effect_desc:0 "£job_hedonist£ $job_hedonist_plural$는 $r_food$과 $r_consumer_goods$를 소비하여 $r_unity$을 생산합니다."
 mod_job_hedonist_add:0 "$job_hedonist$ 직업"
 mod_job_hedonist_per_pop:0 "$VALUE$팝마다 $job_hedonist$ 직업 §G+1§!"
 mod_job_hedonist_per_pop_short:0 "\n$VALUE$ £pop£마다 £mod_job_hedonist_add£ §G+1§!"
 civic_slaver_guilds_desc:0 "이 사회는 전통적으로 노예 노동을 착취하며, 노예의 훈련과 유통을 유지하기 위해 조직된 전문 조합의 서비스에 의존합니다."
 civic_slaver_guilds_effects:0 "$t$- 행성 고유 건물인 £building£ §Y신 콜로세움§!을 건설할 수 있으며, £job_gladiator£ §Y검투사§! 직업을 추가합니다. £job_gladiator£ §Y검투사§!는 $r_trade$과 $r_amenities$를 일부 생산하고 지역 §Y지상군 피해량§!을 높입니다.\n$BOB_minerals_tooltip$"
 civic_indentured_assets:0 "계약 자산"
 civic_indentured_assets_desc:0 "이 거대 기업은 대규모 계약 노동력을 전문적으로 활용합니다. 야만적인 노예제와는 거의 관계가 없습니다. 이 노동자들은 그저 빚을 갚고 있을 뿐입니다... 무기한으로 말이지요.\n\n§W§Y$ethic_xenophile$§! 제국으로서도 £pop£ §H노예 종족§!을 보유할 수 있습니다.§!\n§W모든§! §Y노예 유형§! §W중§! §H계약 노예제§!§W를 제외한 유형은§! §R금지됩니다§!§W.§!"
 civic_dystopian_society_authority_dictatorial:0 "디스토피아 독재정"
 civic_dystopian_society_authority_dictatorial_desc:0 "하층 계급의 개성과 이견을 짓밟은 엄격하고 잔혹한 독재정입니다."
 civic_dystopian_society_authority_imperial:0 "디스토피아 제국"
 civic_dystopian_society_authority_imperial_desc:0 "귀족과 상류 계급이 정치·경제 권력을 독점하는 가혹하고 잔혹한 제정입니다."
 civic_dystopian_modifier_description:0 "\n§E보정치:§! \n \t - 지도자 유지비: §G-20%§! \n \t - $commander_with_icon$ 수용력: §G+1§!"
 job_heirs_of_the_khan_enforcer:0 "칸의 집행관"
 job_heirs_of_the_khan_enforcer_plural:0 "칸의 집행관"
 job_heirs_of_the_khan_enforcer_desc:0 "이 해적들은 칸의 칙령을 집행하는 대가로 두둑한 보수를 받습니다."
