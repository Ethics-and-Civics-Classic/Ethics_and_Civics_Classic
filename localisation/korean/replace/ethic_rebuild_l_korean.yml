 councilor_anarchy_utopia:0 "분권 대표"
 councilor_anarchy_utopia_desc:0 "분권화된 지방 국가들을 대표하는 인물입니다."
 councilor_free_haven_anarchy_utopia:0 "$councilor_free_haven$"
 councilor_free_haven_anarchy_utopia_desc:0 "$councilor_free_haven_desc$"
 councilor_crowdsourcing_anarchy_utopia:0 "$councilor_crowdsourcing$"
 councilor_crowdsourcing_anarchy_utopia_desc:0 "$councilor_crowdsourcing_desc$"
 councilor_head_of_education_anarchy_utopia:0 "$councilor_head_of_education$"
 councilor_head_of_education_anarchy_utopia_desc:0 "$councilor_head_of_education_desc$"
 councilor_anarchy_ideals:0 "분권 대표"
 councilor_anarchy_ideals_desc:0 "중앙 집권화 수준이 낮은 지방 국가들을 대표합니다."
 councilor_free_haven_anarchy_ideals:0 "$councilor_free_haven$"
 councilor_free_haven_anarchy_ideals_desc:0 "$councilor_free_haven_desc$"
 councilor_crowdsourcing_anarchy_ideals:0 "$councilor_crowdsourcing$"
 councilor_crowdsourcing_anarchy_ideals_desc:0 "$councilor_crowdsourcing_desc$"
 councilor_head_of_education_anarchy_ideals:0 "$councilor_head_of_education$"
 councilor_head_of_education_anarchy_ideals_desc:0 "$councilor_head_of_education_desc$"
 councilor_circular_economy:0 "순환 프로세스 감독관"
 councilor_circular_economy_desc:0 "폐쇄 순환 경제의 과학 기술 개발을 이끄는 책임자로, 다른 생산 체계의 산출물을 원료로 활용하는 공정과 제품을 개발합니다."
 councilor_eco_warfare:0 "병참 사령관"
 councilor_eco_warfare_desc:0 "병참 사령관은 군 보급망의 효율성을 개선하는 데 주력합니다. 다른 체계에서 발생하는 물자 낭비를 최소화합니다."
 councilor_war_industry:0 "최고 조달 책임자"
 councilor_war_industry_desc:0 "최고 조달 책임자는 군수 물자의 조달과 제조, 군산 복합체와의 연락 업무를 총괄합니다."
 councilor_naturalism:0 "지속 가능한 지구 설계자"
 councilor_naturalism_desc:0 "자급자족형 지구 설계를 주도하는 평의원입니다. 건축 공학 및 효율적인 도시 계획과 고효율 대중교통의 설계까지 다양한 방면을 감독합니다."
 councilor_peaceful_urbanism:0 "평온한 도시 계획가"
 councilor_peaceful_urbanism_desc:0 "평온한 도시의 설계를 주도하는 평의원입니다. 멋진 공원, 고풍스럽고 조용한 상업 지구, 편리한 교통 수단 등이 모여 평온한 도시를 만들어냅니다."
 councilor_military_industry:0 "군사 발명가"
 councilor_military_industry_desc:0 "군사 발명가는 첨단 혁신을 통해 최첨단 군사 설계와 연구를 이끌어 갑니다."
 councilor_state_monopoly:0 "불변자"
 councilor_state_monopoly_desc:0 "불변자는 대중에게 잘 이해되지 않는 직책입니다. 불변자는 국가의 독점을 유지하고 사회의 위계질서를 강제하는 역할을 맡고 있으며, 특히 사회 하층민들의 정치적 입지와 활동을 약화시켜 안정성을 유지하는 데 집중합니다."
 councilor_keepers_harmony:0 "드루이드 장로"
 councilor_keepers_harmony_desc:0 "자연 숭배 교단의 지도자이자 최고위 신도입니다. 교리를 전파하고 수호자의 길에 대한 신앙을 지켜 나갑니다."
 councilor_industrial_automation:0 "자동화 감독관"
 councilor_industrial_automation_desc:0 "자동화 사업의 감독관이자 수석 개발자입니다."
 councilor_natural_capitalism:0 "최고 규제 책임자"
 councilor_natural_capitalism_desc:0 "최고 규제 책임자는 소비 경제가 초래하는 부정적인 외부 효과를 억제하기 위해 정책과 지침을 시행합니다."
 councilor_natural_capitalism_corporate:0 "$councilor_natural_capitalism$"
 councilor_natural_capitalism_corporate_desc:0 "$councilor_natural_capitalism_desc$"
 councilor_consumerism:0 "최고 마케팅 책임자"
 councilor_consumerism_desc:0 "기업과 고도로 자본주의화된 사회에서 최고 마케팅 책임자는 광고를 담당합니다. 그러나 과소비 사회의 최고 마케팅 책임자는 극단적인 소비주의와 사치가 당연한 문화로 받아들여지도록 강요하고 선전합니다."
 councilor_consumerism_corporate:0 "$councilor_consumerism$"
 councilor_consumerism_corporate_desc:0 "$councilor_consumerism_desc$"
 councilor_land_of_plenty:0 "생산부 장관"
 councilor_land_of_plenty_desc:0 "생산부의 수장으로서 사회의 생산 체계를 효율화하고 경공업을 발전시키는 책임을 맡습니다."
 councilor_asceticism:0 "수행의 스승"
 councilor_asceticism_desc:0 "깨달음을 얻은 수행자이자 고행의 스승입니다. 수행의 스승은 철학자이자 고행자로서 사회를 비소비주의와 깨달음으로 인도합니다."
 councilor_innovative_economy:0 "기술 재벌"
 councilor_innovative_economy_desc:0 "정식 평의회 직책은 아니지만 모든 첨단 기술 기업의 지배 지분을 소유한 덕분에 평의회 의석을 차지합니다. 이 거대 기술 기업들은 수 세기 동안 각국 정부와 활발히 계약을 맺어 왔습니다."
 councilor_innovative_economy_corporate:0 "$councilor_innovative_economy$"
 councilor_innovative_economy_corporate_desc:0 "$councilor_innovative_economy_desc$"
 councilor_enlightment:0 "공공 중재자"
 councilor_enlightment_desc:0 "공공 중재자는 허위 정보와 불신에 맞서고 집단의 공통점을 찾아내며, 지역 세력 간의 평화와 이해를 증진하기 위해 노력합니다."
 councilor_terraforming:0 "행성 조형가"
 councilor_terraforming_desc:0 "테라포밍 기술 개발 계획의 총책임자입니다. 테라포밍 사업은 대부분 이들의 재량에 따라 진행됩니다."
 councilor_evangelism:0 "최고 전도사"
 councilor_evangelism_desc:0 "방송 전도사! 위대한 선교사! 최고의 집사! 국민을 올바른 길로 이끌고 배교자들을 구원하는 진리와 참된 길의 설교자입니다!"
 councilor_peacekeepers:0 "평화유지군 사령관"
 councilor_peacekeepers_desc:0 "평화유지군의 사령관입니다. 민간인 보호 절차를 관리하고 교전 수칙이 준수되도록 감독합니다. 대중의 신뢰를 받는 이 직책은 우리 외교 정책의 실효성을 높여 줍니다."
 councilor_xeno_militarist:0 "정보국장"
 councilor_xeno_militarist_desc:0 "주요 정보·보안 기구의 책임자입니다. 은하 전역에 정보망을 구축하여 대내외의 잠재적 위협을 항상 주시하는 임무를 맡습니다."
 councilor_star_settlers:0 "식민지 관리자"
 councilor_star_settlers_desc:0 "식민지 관리자는 식민지의 확장과 정착을 관리하고 개발 중인 식민지가 직면하는 문제를 해결합니다."
 councilor_distributism:0 "최고 방송 전도사"
 councilor_distributism_desc:0 "방송 전도사! 위대한 선교사! 최고의 집사! 더 높은 존재가 우리의 육신에 내린 쾌락을 누리는 영광을 설교합니다! 사람들을 자본주의의 영광과 유서 깊은 거대 교회에 대한 신앙으로 인도합니다!"
 councilor_martial_brotherhood:0 "군사 이론가"
 councilor_martial_brotherhood_desc:0 "새로운 군수 체계와 군사 교리, 수송 절차를 개발하는 혁신적인 군사 이론가입니다. 모든 병사가 임무에 충분히 대비하도록 하는 것이 이들의 가장 중요한 책무입니다."
 councilor_symbiotic_race:0 "소통 책임자"
 councilor_symbiotic_race_desc:0 "국내의 소통과 파벌 간 대화를 총괄하는 책임자입니다."
 councilor_slave_race:0 "노예 지배자"
 councilor_slave_race_desc:0 "무자비한 노예 관리자이자 제국에 충분한 노예 노동력을 확보하는 강력한 실세입니다."
 councilor_exploration:0 "위대한 탐험가"
 councilor_exploration_desc:0 "모험가이자 개척자이며, 변경 우주에서 탐험가로 이름을 날리는 평의원입니다."
 councilor_star_seekers:0 "$councilor_exploration$"
 councilor_star_seekers_desc:0 "$councilor_exploration_desc$"
 councilor_corporate_star_seekers:0 "최고 탐험 책임자"
 councilor_corporate_star_seekers_desc:0 "$councilor_exploration_desc$"
 councilor_spiritual_seekers:0 "고위 예언자"
 councilor_spiritual_seekers_desc:0 "우주의 의지를 헤아리며 평의회를 인도하는 최고 구도자입니다."
 councilor_private_militaries:0 "빅 보스"
 councilor_private_militaries_desc:0 "국가도, 철학도, 이념도 없습니다. 오직 자신을 위해 싸우며, 국가의 군대를 이루는 수많은 민간 용병 회사의 의지를 북돋웁니다."
 councilor_defenders_faith:0 "성전 기사단장"
 councilor_defenders_faith_desc:0 "신성 성전 기사단의 단장입니다. 신앙의 수호자들로 구성된 신성한 군대를 지휘하고 조직합니다."
 councilor_harmonious_hierarchy:0 "수석 감사관"
 councilor_harmonious_hierarchy_desc:0 "권력 남용에 관한 민원을 처리하는 검사입니다. 지배 계층이 평민에게 책임을 지도록 감시합니다."
 councilor_harmonious_hierarchy_corporate:0 "수석 감사관"
 councilor_harmonious_hierarchy_corporate_desc:0 "권력 남용에 관한 민원을 처리하는 내부 인사 책임자입니다. 경영진이 직원들에게 책임을 지도록 감시합니다."
 councilor_genetic_aristocracy:0 "유전자 사서"
 councilor_genetic_aristocracy_desc:0 "유전자 사서는 리더십을 발휘할 우수한 표본을 찾기 위해 모든 국민의 유전자 정보를 기록합니다."
 councilor_meritocratic_capitalism:0 "기업 감독국장"
 councilor_meritocratic_capitalism_desc:0 "기업 인증의 승인과 취소를 담당하는 감사 기구의 수장입니다. 부패를 근절하고 공정한 경쟁과 정당한 승진이 이루어지도록 감독합니다."
 councilor_meritocratic_capitalism_corporate:0 "$councilor_meritocratic_capitalism$"
 councilor_meritocratic_capitalism_corporate_desc:0 "$councilor_meritocratic_capitalism_desc$"
 councilor_police_state:0 "최고 심판관"
 councilor_police_state_desc:0 "국가 사법부의 수장이자 보안 기구의 최고위 책임자입니다. 사법 체계 전체가 이들의 명령에 따라 움직입니다."
 councilor_ultimate_collective:0 "선전 매체 총괄"
 councilor_ultimate_collective_desc:0 "사랑받는 선전부의 책임자입니다. 국민의 의지를 원하는 방향으로 이끌기 위해 영화, 포스터, 광고, 소셜 미디어, 뉴스 보도의 제작을 승인합니다."
 councilor_divine_order:0 "시민등록국장"
 councilor_divine_order_desc:0 "시민등록국의 국장입니다. 신성한 질서에서 각자가 차지하는 지위에 따라 미배치 노동력의 고용을 관리합니다."
 councilor_labour_unions:0 "노조 대표"
 councilor_labour_unions_desc:0 "제국의 각 주요 조합에서 선거를 통해 선출된 대표자가 조합의 이익을 대변합니다."
 councilor_welfare_state:0 "보건복지부 장관"
 councilor_welfare_state_desc:0 "보건복지부 장관은 복지 혜택의 분배와 의료 시스템의 관리를 감독합니다."
 councilor_machine_cult:0 "기계교황"
 councilor_machine_cult_desc:0 "존경받는 정비사이자 톱니바퀴의 목소리를 듣는 자인 기계교황은 신성한 기계의 길을 가르치는 최고의 스승입니다."
 councilor_naval_traditions:0 "해군 원수"
 councilor_naval_traditions_desc:0 "해군 원수는 해군의 최고 계급으로, 제국을 위해 뛰어난 공훈을 세운 지휘관에게 수여됩니다."
 councilor_chosen_people:0 "선택받은 교황"
 councilor_chosen_people_desc:0 "선택받은 존재가 걸어야 할 길을 전하는 설교자입니다. 은하의 지배자가 되라는 신성한 소명을 이루도록 제국을 결집시킵니다."
 councilor_military_dictatorship:0 "통치자의 오른팔"
 councilor_military_dictatorship_desc:0 "우리의 소중한 지도자가 내리는 명령은 가장 충성스러운 장교들이 받들어야 합니다. 통치자의 오른팔은 통치자의 생명과 제국의 안전을 위협하는 요소를 막아낼 책무를 짊어집니다."
 councilor_military_dictatorship_corporate:0 "해적 군주의 일등항해사"
 councilor_military_dictatorship_corporate_desc:0 "일등항해사는 해적 군주의 평의회 의석을 보장받으며 해적 대함대의 파견을 담당합니다."
 councilor_military_dictatorship_corporate_envoy:0 "해적 선장 사절"
 councilor_military_dictatorship_corporate_envoy_desc:0 "해적 선장들은 해적 군주 평의회에 참석하는 단 한 명의 사절을 통해 대표됩니다."
 councilor_peaceful_republic:0 "사회 이론가"
 councilor_peaceful_republic_desc:0 "국가의 미래를 위해 가야 할 길을 통찰하는 이론가이자 경제 철학자입니다."
 councilor_spiritual_democracy:0 "민주 교황"
 councilor_spiritual_democracy_desc:0 "국교회는 신성한 비밀 선거 의식을 통해 성직자를 민주적으로 선출합니다. 민주 교황은 몸소 모범을 보여 가르침을 전하도록 국민에게 선택받은 인물입니다."
 councilor_cyber_demos_cratos:0 "사이버 보안 감독관"
 councilor_cyber_demos_cratos_desc:0 "사이버 보안국은 선거와 입법 체계를 공격으로부터 지키기 위해 국내 최고의 해커들을 채용하고 훈련해야 합니다. 사이버 보안 감독관은 그중에서도 가장 뛰어난 해커입니다."
 councilor_divine_council:0 "평의회 궁무처장"
 councilor_divine_council_desc:0 "정식 평의원은 아니지만, 다른 평의원들의 뜻을 국민에게 전달하고 실행하는 역할을 맡습니다."
 councilor_military_junta:0 "성간 민병대 원수"
 councilor_military_junta_desc:0 "성간 민병대를 지휘하고 조직하며 군사 정권의 보안 부대를 편성하는 원수입니다."
 councilor_science_directorate:0 "이사회 대표"
 councilor_science_directorate_desc:0 "국가 정책에 직접 영향을 미치고 학술 위원회의 권한을 대변하도록 이사회에서 선출한 대표입니다."
 councilor_research_cooperatives:0 "협동조합 대표"
 councilor_research_cooperatives_desc:0 "과학계가 직접 선출한 대표로, 국가 정책에 직접 영향을 미치고 학계를 대표하는 권한을 행사합니다."
 councilor_executive_committee:0 "포럼 의장"
 councilor_executive_committee_desc:0 "평의회에서 의회의 권한을 대변하는 철학자 포럼의 의장입니다."
 councilor_cyber_dictatorship:0 "AI 연구부 총괄"
 councilor_cyber_dictatorship_desc:0 "인공지능 개발 책임자이자 수사국장입니다. 인공지능 정부가 요구하는 막대한 전력과 자원을 공급하고, 그 연산 능력을 위협하는 요소를 단호히 제거합니다."
 councilor_globalism:0 "위원회 의장"
 councilor_globalism_desc:0 "세계주의 무역 위원회의 의장입니다. 의장은 무역 파트너 간의 협력을 촉진하고 경제가 성장하며 발생하는 문제들을 해결합니다."
 councilor_in_perfect:0 "순수 사법관"
 councilor_in_perfect_desc:0 "법정이 진리부의 명령에 따르도록 조율하는 사법관입니다."
 councilor_stratocracy:0 "내부 보안 책임자"
 councilor_stratocracy_desc:0 "군정 체제에서 경찰과 군대를 결합한 전담 보안 기구를 통해 법과 질서를 유지하는 책임자입니다."
 councilor_bureaucracy:0 "계몽국 관리자"
 councilor_bureaucracy_desc:0 "계몽 관료제의 핵심 관리자입니다. 행정 효율의 전문가이자 철학적 교육을 받은 지도자입니다."
