 job_primitive_farmer_plural:0 "농부"
 job_primitive_farmer_desc:0 "이 농부들은 원시적이지만 효과적인 농사 장비를 이용해 땅을 경작합니다."
 mod_job_primitive_farmer_add:0 "$job_primitive_farmer$ 직업"
 civic_socialistic:0 "드론 형제단"
 civic_socialistic_desc:0 "이 사회는 전통적으로 노동계급을 찬양하며, 노동자들은 집단주의와 평등이라는 이상적인 원칙에 기반한 전 행성 공동체를 형성합니다.\n\n§Y채굴§!, §Y농업§!, §Y발전§! 지구는 각각 직업 §G+1§!과 주거 §G+1§!을 제공하며 유지비가 §R+15%§! 증가합니다 \n소량의 $r_minerals$, $r_food$, $r_energy$, $r_unity$을 생산하는 특수 노동자 직업 £job_primitive_laborer£ §Y노동 영웅§!을 허용합니다"
 civic_environmentalist:0 "자연 유산"
 civic_environmentalist_desc:0 "이 사회에서 자연은 국가의 부이며, 공익을 위해 보존하고 신중하게 활용해야 할 대상으로 여겨집니다."
 civic_tooltip_environmentalist_effects:0 "$t$§E대지의 관리자§!:$TABBED_NEW_LINE$$t$- £job_biologist£ ['eco_biologist_swap']을 활성화하는 £building£ §Y순찰대 오두막§! 건물을 보유한 채 시작하며, 해당 건물을 건설할 수 있습니다.$TABBED_NEW_LINE$$t$- 행성의 §Y자연§! £blocker£ §H장애물§!은 £job_biologist£ §Y생물학자§! 직업이 소량의 $r_minerals$, $r_energy$, $r_food$ 또는 $r_society$를 추가로 생산하게 합니다.\n$TABBED_NEW_LINE$§E만물의 균형§!:$TABBED_NEW_LINE$$t$- 행성의 §Y자연§! £blocker£ §H장애물§!이 $r_unity$을 생산하고 지역 $r_amenities$ 및 £housing£ §Y주거§!를 늘립니다.$TABBED_NEW_LINE$$t$- £blocker£ ['heavy_blockers']이 £job_technician£ §Y기술자§!, £job_miner£ §Y광부§!, £job_farmer£ §Y농부§!와 같은 기초 자원 직업을 제공합니다.$TABBED_NEW_LINE$$t$- 희귀한 행성 £blocker£ §H장애물§!과 §H특징§!(£blocker£ §Y떠도는 숲§!이나 £blocker£ §Y거대 생명체§! 등)도 그에 맞는 고유 혜택을 제공합니다."
 civic_master_engineer:0 "공학의 거장"
 civic_master_engineer_desc:0 "이 문명은 놀라울 정도로 숙련된 건축가와 기술자로 유명합니다."
 civic_land_of_plenty:0 "풍요의 땅"
 civic_land_of_plenty_desc:0 "이 사회는 산업 발전이 대중을 위해 봉사해야 한다는 원칙에 따라 쾌적한 근로 및 생활 환경을 조성하고 사람들의 물질적 필요를 최대한 충족합니다.\n\n§W무인기망§!은 인구 밀집 지역부터 무인 지역까지 모든 곳을 아우르며, 운송과 정비, 순찰 등 수많은 작업을 수행합니다. 이 체계를 통제하려면 다수의 §W무인기 관제사§!가 밤낮없이 관리해야 합니다. 관제사들은 대부분의 자원 생산량에 §W배율을 적용§!하여 인구가 밀집한 행성의 생산성을 더욱 높입니다.\n§W$BOB_industry_tooltip$§!"
 civic_technocracy:0 "기술관료정"
 civic_technocracy_desc:0 "이 사회는 효율을 극대화하기 위해 과학과 이성의 원리에 따라 통치됩니다. 무지하고 자격도 없는 정치 엘리트의 변덕이 통치를 좌우하는 위험을 용납해서는 안 됩니다."
 civic_tooltip_technocracy_effects:0 "- £building£ §Y수도 건물§!의 £job_politician£ §Y$job_politician$§! 직업이 £job_head_researcher£ §Y$job_head_researcher_plural$§! 직업으로 대체됩니다. \n- £building£ §Y연구 기관§!이 £job_head_researcher£ §Y$job_head_researcher_plural$§! 직업을 추가로 제공합니다. \n\n- £job_researcher£ §Y$job_researcher_plural$§!이 $r_unity$도 생산합니다.\n- £scientist£ §Y과학자§!가 무작위 §Y전문 지식§! 특성을 지닌 채 시작합니다. \n- §Y전문 지식§! 특성에 추가 효과가 부여됩니다 $TABBED_NEW_LINE$ $BOB_research_tooltip$"
 civic_cyber_demos_cratos:0 "사이버 민주정"
 civic_cyber_demos_cratos_desc:0 "정보 기술과 대중 통신의 첨단 성과를 민주적 통치에 도입하면 가장 효율적인 분권형 관료 체계를 구축할 수 있습니다. 하지만 높은 기술 의존도와 상당한 자유가 결합되면 때때로 사이버 범죄가 급증할 수 있습니다."
 civic_tooltip_cyber_demos_cratos_effects:0 "$t$- £building£ §Y수도 건물§!의 £job_politician£ §Y$job_politician$§! 직업을 £job_head_researcher£ §Y$job_head_researcher_plural$§!로 대체합니다.$TABBED_NEW_LINE$- £building£ §Y연구 기관§!이 추가 £job_head_researcher£ §Y$job_head_researcher_plural$§! 직업을 제공합니다.$TABBED_NEW_LINE$- £job_researcher£ §Y$job_researcher_plural$§!이 $r_unity$도 생산합니다."
