 civic_distributism:0 "분배주의"
 civic_distributism_desc:0 "윤리가 시장 경제에서도 역할을 해야 한다는 이념입니다. 사유 재산의 기본권을 옹호하면서도 생산 수단은 소수 개인이나 기업의 손에 집중되지 않고 널리 소유되고 분배되어야 한다고 주장합니다. 따라서 대체로 소규모 기업가와 가족 기업, 강력한 반독점 규제를 선호합니다."
 civic_tooltip_distributism_effects:0 "$t$- 대부분의 §Y전문가§! 직업이 $r_trade$을 소량 추가로 생산합니다.$TABBED_NEW_LINE$- 고유 전문가 직업 £job_wealth_preacher£ §Y$job_wealth_preacher$§!를 잠금 해제합니다. 이들은 $r_unity$을 생산하고 현지 $mod_pop_job_trade_mult$에 배율을 적용합니다."
 civic_tooltip_distributism_negatives:0 "$t$- §Y은하 증권 거래소§!를 건설할 수 §R없음§!$TABBED_NEW_LINE$- £job_mogul£ §Y거물§! 직업을 가질 수 §R없음§!."
 civic_star_settlers:0 "별의 개척자"
 civic_star_settlers_desc:0 "우주 탐사가 시작되자 이 문명은 강한 개척 정신을 받아들였습니다. 사람들은 평화로운 확장과 식민지 개척을 통해 영토를 크게 넓히고 가능한 한 널리 이주하려 합니다."
