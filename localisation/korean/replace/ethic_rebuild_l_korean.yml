 forever_cruise_BRANCH_OFFICE:0 "행성 셔틀 선착장"
 forever_cruise_BRANCH_OFFICE_DESC:0 "§L이 중앙 조선소는 여객 운송뿐 아니라 기항지에서 승객이 물품을 구매할 때마다 이루어지는 상거래도 지원합니다.\n\n방주선이 전투 중일 때 이 왕복선들은 함재기의 화력을 보완하고 승객들에게 즐겁고 흥미진진한 우주 전투 시뮬레이션을 제공합니다.§!\n\n£planet£ §Y아무 식민지§!§W의§! £planet£ §H궤도§!§W에 진입하면§! ['modifier:planet_luxuries_boost']\n"
 edict_civilian_resort_colony_cruise_roam_edict:0 "성계 관광 허가"
 edict_civilian_resort_colony_cruise_roam_edict_desc:0 "우리 유람선들은 궤도에 머무르면 주기적으로 성계 내 무작위 행성의 궤도로 이동합니다.\n\n§R!§! §W단축키 'H'로 민간 함선을 정지할 수 있습니다§!"
 forever_cruise_branch:0 "영원한 유람선 기항지"
 forever_cruise_branch_desc:0 "영원한 유람 방주선이 이 행성에 지사를 열어 호화로운 여가 편의를 제공합니다. 단조로운 일상에서 벗어나 쾌락을 만끽하려는 이들을 위한 탈출구입니다.\n\n§R성계 내에§! §Y영원한 유람 방주선§!§R이 필요합니다!§!"
 resort_colony_branch:0 "휴양 행성 지사"
 resort_colony_branch_desc:0 "$civilian_resort_colony_cruise$이 이 행성에 지사를 열어 호화로운 여가 편의를 제공합니다. 단조로운 일상을 벗어나 쾌락을 만끽하고 싶은 이들을 위한 탈출구입니다.\n\n§R성계 내에§! §Y$civilian_resort_colony_cruise$§!§R이 필요합니다!§!"
