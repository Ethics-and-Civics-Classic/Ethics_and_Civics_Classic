 abs_monarchy:0 "봉건 군주정"
 abs_monarchy_desc:0 "강력한 중앙 권력을 중심으로 세워진 전제 정부입니다. 통제 아래 놓인 봉신들이 사회·군사의 중추를 이룹니다. 국가는 수많은 봉토로 나뉘며, 임명된 충성스러운 귀족들이 영지를 돌보고 왕실 군대의 유지에 기여합니다."
 adv_abs_monarchy:0 "항성 패권정"
 adv_abs_monarchy_desc:0 "강력한 중앙 권력을 중심으로 세워진 전제 정부입니다. 통제 아래 놓인 봉신들이 사회·군사의 중추를 이룹니다. 국가는 수많은 봉토로 나뉘며, 임명된 충성스러운 귀족들이 영지를 돌보고 왕실 군대의 유지에 기여합니다."
 START_SCREEN_PART_TWO_ABS_MONARCHY:0 "우리 나라는 권력과 부를 놓고 소영주들이 수없이 다투는 피비린내 나는 역사를 겪었습니다. 마침내 가장 강력한 독립 영지만 살아남았고, 그 왕이 전 세계의 통치자를 자처했습니다. 그의 야망은 과학 발전을 이끌어 중대한 기술적 도약을 이루어 냈습니다. 이제 별들이 우리 손에 닿을 거리에 있습니다."
