 policy_enslavement_rate:0 "노예 비율"
 policy_enslavement_rate_desc:0 "§Y권위주의§! 제국과 §Y노예상 조합§! 사회 제도를 채택한 제국이 팝의 §Y노예화§! 비율을 설정할 수 있습니다."
