 job_uav_dispatcher:0 "드론 관리자"
 job_uav_dispatcher_plural:0 "드론 관리자"
 job_uav_dispatcher_desc:0 "드론망은 인구 밀집 지역부터 무인 지대까지 모든 지역에서 운송, 측량, 유지 보수, 순찰 등 수많은 작업을 수행합니다. 이 체계를 운용하려면 다수의 $job_uav_dispatcher_plural$가 상시 관리해야 합니다."
 job_uav_dispatcher_effect_desc:0 "£job_uav_dispatcher£ $job_uav_dispatcher_plural$는 $r_energy$ §R1§!을 소비하고 $r_amenities$ 증가, 현지 $r_minerals$ 및 $r_food$ 생산량 5% 증대, §Y범죄§! 감소, §Y방위군§! 생성 등 다양한 혜택을 제공합니다."
