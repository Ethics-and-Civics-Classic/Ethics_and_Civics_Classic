 civic_xeno_militarist:0 "개입주의"
 civic_xeno_militarist_desc:0 "이 문명은 본래 외계 문화에 개방적이지만, 세력 균형을 유지하거나 불의하다고 여기는 일을 바로잡는 데 필요하다고 판단하면 군사력 사용도 주저하지 않습니다."
 civic_tooltip_xeno_militarist_effects:0 "$t$- §Y군국주의 파벌§!:$TABBED_NEW_LINE$$t$- §Y방위 조약§!에 찬성합니다.$TABBED_NEW_LINE$$t$- §Y공격적 외교§!를 요구하지 않습니다.$TABBED_NEW_LINE$$t$- §Y해방 전쟁§! 전쟁 정책에 찬성합니다.$TABBED_NEW_LINE$- §Y군사 연방§! 가입에 찬성합니다.\n$TABBED_NEW_LINE$- §Y방위§! 및 §Y독립 보장§! 외교 조약의 유지비로 $r_influence$이 소모되지 §G않습니다§!.\n$TABBED_NEW_LINE$- 제국 고유 건물 £building£ §Y성간 군사 조정 본부§!를 건설할 수 있습니다. 제국 내 §Y고유 종족§! 수에 따라 제국 전체의 §Y함대 수용력§!, §Y함대에서 얻는 외교적 영향력§!, $r_trade$ §Y생산량§!, §Y첩보망 규모§!에 보너스를 제공합니다.\n$BOB_mercs_tooltip$$BOB_embassy_tooltip$"
 civic_keepers_harmony:0 "조화의 수호자"
 civic_keepers_harmony_desc:0 "이 사회의 사람들은 자연을 영적으로 숭배하는 종교를 발전시켰습니다. 생물권과 진정한 조화를 이루기 위해 세속적인 쾌락에서 크게 벗어날 것을 요구합니다."
 civic_tooltip_keepers_harmony_effects:0 "$t$§E신성한 공생:§!$TABBED_NEW_LINE$$t$- £job_bureaucrat£ §Y$job_bureaucrat$§! 직업을 고유 직업 £job_priest£ §Y$job_druid$§!로 대체합니다.$TABBED_NEW_LINE$$t$- £job_priest£ §Y$job_druid$§! 직업은 £blocker£ §H['concept_natural_blockers']§!이 있는 행성에서 더 효과적이며, £housing£ §Y주거§!를 §G추가로§! 제공하고 §Y$MOD_POP_ENVIRONMENT_TOLERANCE$§!를 높입니다.$TABBED_NEW_LINE$$t$- £blocker£ ['heavy_blockers']은 더 큰 보너스를 제공하며, 희귀 행성 £blocker£ §H장애물§!과 §H특징§!(£blocker£ §Y방랑하는 숲§!, £blocker£ §Y거대 생명체§! 등)은 행성의 $r_unity$ 생산량도 늘립니다.\n$TABBED_NEW_LINE$- £building£ §Y자연 성소§!는 고유 건물입니다. 행성의 고유 천연 장애물마다 현지 $r_unity$, £happiness£ §Y행복도§!, £pops£ §H$ethic_green$§! 선호도를 높이며, 유지비로 $r_food$을 요구합니다."
 civic_tooltip_keepers_harmony_negative_effects:0 "$t$§E버려진 공생:§!$TABBED_NEW_LINE$$t$- £blocker£ §H자연환경 장애물§!이 없는 행성에서는 §Y$job_druid$§! 직업이 일반 관료보다도 §R적은§! $r_unity$을 생산합니다!$TABBED_NEW_LINE$$t$- £district£ §Y채굴 지구§!당 $r_amenities$ §R-100§!."
 building_nature_sanctuary:0 "자연 성소"
 building_nature_sanctuary_desc:0 "행성 전역에서 사람들이 모여들어 대자연에 제물을 바치며 경배합니다. 이 기념물은 고유한 자연 §Y장애물§!마다 지역의 £unity£ 통합력, £happiness£ 행복도 및 §Y생태주의§! 윤리관 선호도를 높이며, 유지비로 $r_food$을 소모합니다."
 civic_functional_architecture_desc:0 "이 사회는 단순하면서도 기능적인 건축으로 유명합니다. 지루하거나 우울한 건축 양식이라고 부르는 이들도 있지만, 대부분의 경우 신형 콘크리트는 다른 건축 자재만큼이나 제 역할을 합니다."
 civic_functional_architecture_effects:0 "$t$- £building£ §Y호화 주택§! 대신 £building£ §Y공동 주택§!을 건설할 수 있습니다.$TABBED_NEW_LINE$- £zone£ 기본 ['concept_district_specializations']의 §Y기술§! 요구 조건이 면제됩니다."
 civic_eco_warfare:0 "자연 수호자"
 civic_eco_warfare_desc:0 "이들은 손에 무기를 들고 생태계를 지킬 의지와 능력을 갖추었을 뿐 아니라, 생명 과학의 성과를 군사 분야에 효과적으로 적용하는 법도 터득했습니다.\n\n§W유기체 함선§!: 군용 함선 건조에 생명 공학을 도입하면 함선이 장갑과 선체 재생 등의 특수 능력을 얻고 에너지 효율도 높아집니다. 다만 이러한 소재는 대체로 무기물 합금보다 취약합니다.\n\n§W군사 생체 의학§!: 지상군 체력이 증가합니다."
 civic_tooltip_eco_warfare_effects:0 "$t$§E자연의 보호§!: £blocker£ §Y['concept_natural_blockers']§!에서 혜택 획득 $TABBED_NEW_LINE$$t$- §Y$d_dangerous_wildlife_blocker$§!이 있는 행성의 £job_entertainer£ §Y$job_entertainer_plural$§!을 £job_duelist£ §Y$job_duelist_plural$§!로 전환합니다.$TABBED_NEW_LINE$$t$- £blocker£ §H장애물§!마다 §Y행성 폭격 피해§! §G-5%§!.$TABBED_NEW_LINE$$t$- £blocker£ ['heavy_blockers']이 £job_foundry£ §Y$job_foundry_plural$§! 또는 £job_duelist£ §Y$job_duelist_plural$§! 직업을 추가로 제공합니다.$TABBED_NEW_LINE$$t$- 희귀 행성 £blocker£ §H장애물§!과 §H특징§!(£blocker£ §Y움직이는 숲§!, £blocker£ §Y거대 생명체§! 등)도 적절한 직업과 고유 보너스를 제공합니다.\n\n§E순찰대 감시§!:$TABBED_NEW_LINE$- £job_biologist£ ['eco_biologist_swap'] 활성화\n$TABBED_NEW_LINE$§E군사 생명 공학§!:$TABBED_NEW_LINE$$t$- [foundry.GetIcon] §Y[GetAlloyProducer]§! 100명당 $r_minerals$ 유지비 §G-1§!.$TABBED_NEW_LINE$$t$- [foundry.GetIcon] §Y[GetAlloyProducer]§! 100명당 $r_food$ 유지비 §R+1§!.$TABBED_NEW_LINE$$t$- £job_biotechnologist£ §Y$job_biotechnologist_plural$§! 100명당 $r_food$ 유지비 §R+1§!.$TABBED_NEW_LINE$$t$- £job_biotechnologist£ §Y$job_biotechnologist_plural$§! 100명당 $r_alloys$ 생산량 §G+0.5§!.\n$BOB_mercs_tooltip$"
