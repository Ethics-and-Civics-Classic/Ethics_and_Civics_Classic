 civilian_resort_colony_cruise_BRANCH_OFFICE:0 "휴양 행성 지사"
 civilian_resort_colony_cruise_BRANCH_OFFICE_DESC:0 "£planet£ §H식민지 궤도에 있는§! §W동안§! ['modifier:planet_luxuries_boost']\n\n최고급 방주 유람선은 어떤 승객이 꿈꾸는 호사라도 제공할 수 있습니다. $resort_colony$의 여유로움을 가까운 식민지로 가져다드립니다!"
 sm_arkship_spinal_branch_office_mount:0 "기항지 조선소"
 sm_arkship_spinal_branch_office_mount_desc:0 "§L선체 중심축을 따라 배치된 이 도크는 여객 수송뿐 아니라 승객이 기항 중 구매하는 모든 상품의 거래도 지원합니다.§!\n\n£planet£ §Y모든 식민지§!§W의§! £planet£ §H궤도§!§W에 진입하면§! ['modifier:planet_luxuries_boost'] 적용\n"
