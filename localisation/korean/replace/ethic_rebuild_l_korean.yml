 gov_corporate_nationalism:0 "기업 국가주의"
 gov_corporate_nationalism_desc:0 " "
 civic_leadership_forge:0 "지도자 양성소"
 civic_leadership_forge_desc:0 "이 제국은 강력한 지도력의 전통을 지니고 있으며, 현명하고 기민한 인사 정책으로 유명합니다."
 ASCENSION_PERKS_NEW:0 "승격 특전"
 gov_generic_stratocracy:0 "군정 체제"
 gov_generic_stratocracy_desc:0 "모든 공직을 퇴역 또는 현역 장교가 맡는 군사 정부입니다."
 civic_energy_syndicate:0 "무역 연맹"
 civic_energy_syndicate_desc:0 "이 제국에는 강력한 무역 회사 연합이 지배하는 발달한 상품 시장이 있습니다."
 civic_public_works:0 "사회 기반 시설"
 civic_public_works_desc:0 "정부는 식민지의 기반 시설과 삶의 질을 개선하는 데 상당한 자금을 투입합니다. 행성 시행령 §H주택§!을 잠금 해제합니다(영향력 100 소모, §Y성장§!, §Y행성 건설 속도§! 및 §Y행복도§! 증가)."
 edict_housing:0 "공공사업"
 edict_housing_desc:0 "행성의 산업이 주택과 사회 기반 시설 개발에 주력하여 인구 성장을 촉진합니다."
 ethic_rebuild_opinion_unity_finish:0 "은하의 통합자"
 civic_elite_navy:0 "정예 해군"
 civic_elite_navy_desc:0 "해군은 군대의 정예 병과로 여겨집니다. 조종사와 고위 해군 장교들은 최고의 교육과 보급을 받습니다."
 shipsize_mining_station_construction_speed_mult:0 "채굴 기지 건설 속도"
 edict_increase_planetsize_3:0 "지질 공학"
 edict_increase_planetsize_3_desc:0 "국지적 테라포밍 절차를 통해 행성의 거주 가능 면적을 늘릴 수 있습니다."
 edict_increase_planetsize_3.tooltip:0 "§Y[Root.GetName]§!의 크기가 §G1타일§! 증가합니다."
