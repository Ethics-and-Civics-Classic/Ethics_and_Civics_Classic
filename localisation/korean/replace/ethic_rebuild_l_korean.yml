 egalitarian_unrest_desc:0 "이 식민지의 §H불안§!으로 인해 지역 팝들이 §Y자유주의§!에 더 끌리게 되었습니다."
 unrest.168.desc:0 "안녕하십니까, [Root.GetSpeciesName]. 우리는 [old_owner.GetName] 출신의 자유 투사이자 해방된 노예들입니다. [old_owner.GetRulerTitle] [old_owner.GetRulerName]의 압제 아래 온갖 학대를 당했지요. 우리는 오랫동안 여러분의 자유주의적 원칙, 고향에서 말하던 [new_owner.GetSpeciesAdj]의 길을 동경했으며 여러분의 가치관에 공감합니다. 우리는 독립을 선언했고 여러분의 나라에 합류하고 싶습니다. 받아 주시겠습니까?"
