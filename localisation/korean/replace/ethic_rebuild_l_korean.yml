 civic_private_healthcare_corporate_desc:0 "건강한 제국이 강한 제국입니다. 이 거대 기업은 실험 약물, 고도로 민영화된 의료 기관, 공격적인 마케팅을 통해 부강한 경제를 유지합니다."
 civic_tooltip_civic_private_healthcare_corporate_effects:0 "$t$- §H$PRIVATE_MEDICINE$§! 정책을 의무적으로 채택해야 합니다.\n$TABBED_NEW_LINE$- §G저렴한§! §Y실험 약물§!이 §G약한 진정 효과§!만 있는 §Y$living_standard_chemical_bliss$§! 생활 수준을 제공합니다. £job£ §H직업 생산량§!에는 §G작은§! 영향만 미치며 관련 연구가 보장됩니다.\n$TABBED_NEW_LINE$- £building£ §Y수도 건물§!이 £job_healthcare£ §Y$job_healthcare$§! 직업 §G+100§!개를 제공합니다.$TABBED_NEW_LINE$- £job_healthcare£ §Y$job_healthcare_plural$§! §W100명당§! £amenities£ §Y편의§! §G+200§!.$TABBED_NEW_LINE$- £job_healthcare£ §Y$job_healthcare_plural$§! §W100명당§! $r_trade$ §G+4§!.\n$TABBED_NEW_LINE$- £building£ §Y$building_corporate_clinics$§! $BRANCH_OFFICE_BUILDING$ 건설 가능. §H범죄 사회 제도§!와 함께 사용하면 £crime£ §Y$job_corrupt_healthcare_plural$§!를 제공합니다.\n$BOB_clinic_tooltip$"
 REGULATED_TRADE:0 "무역 규제: 사회 중점"
