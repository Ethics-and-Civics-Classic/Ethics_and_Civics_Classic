 mod_pop_ethic_egalitarian_attraction_mult:0 "자유주의 윤리관 선호도"
 gov_aristocratic_republic:0 "귀족 공화국"
 gov_aristocratic_republic_desc:0 "이 정부는 간접 민주정의 한 형태로, 사회 엘리트에 속하는 사람만이 의회에 선출되어 국민을 대표하여 통치할 수 있습니다."
 gov_oligarchic_republic:0 "과두 공화국"
 gov_oligarchic_republic_desc:0 "이 정부는 극단적인 엘리트주의 공화정으로, 선거와 통치 과정에 강력한 영향력을 행사하는 소수의 특권층에게 상당한 권력이 집중되어 있습니다."
 gov_congress_republic:0 "의회 공화국"
 gov_congress_republic_desc:0 "이 정부는 대의 민주정의 한 형태로, 민주적으로 선출된 의원들이 권력을 행사하고 정부 수반을 선출합니다. 모든 자유 시민에게 선거권과 피선거권이 있습니다."
 gov_noble_aristocracy:0 "명문 귀족정"
 gov_noble_aristocracy_desc:0 "이 사회의 모든 정치 권력은 유서 깊은 귀족 가문의 대표들로 구성된 평의회에 있습니다."
 RT_REGENT:0 "섭정"
 civic_personality_cult:0 "개인 숭배"
 civic_personality_cult_desc:0 "국가원수는 결코 잘못하지 않는 귀감으로 여겨지며, 이 믿음이 사실이든 허구든 사회 전반에 강력히 강요됩니다."
 gov_soviet_republic:0 "소비에트 공화국"
 gov_soviet_republic_desc:0 "직접 선출된 노동자 평의회인 ‘소비에트’가 통치하는 공화정입니다. 평의회는 유권자에게 직접 책임을 집니다. 권력이 분립되지 않아 선출된 대의원들이 입법부와 행정부, 사법부의 역할을 모두 수행합니다."
 gov_aristocratic_monarchy:0 "귀족 군주제"
 gov_aristocratic_monarchy_desc:0 "이 정부는 군주정의 한 형태로, 세습 통치자는 절대 권력을 행사하지 못하고 가장 영향력 있는 귀족들과 권력을 나누어야 합니다."
 edict_div_crusade:0 "$unity_ambition$ 신성한 성전"
 edict_div_crusade_desc:0 "불경한 이교도들은 완전히 파멸할 것입니다!"
 civic_defenders_faith:0 "호전적 광신도"
 civic_defenders_faith_desc:0 "이 종교 근본주의자들의 군대는 육체와 정신 모두를 단련하는 강도 높은 무술 훈련의 전통을 지닙니다. 모두가 언제나 이교도들로부터 종교적 신념을 지킬 준비가 되어 있어야 합니다."
 civic_tooltip_defenders_faith_effects:0 "$t$- £building£ §Y사원§!의 £job_soldier£ §Y군인§!을 £job_templar£ §Y$job_templar$§! 직업으로 대체합니다.$TABBED_NEW_LINE$- 특수 통합의 야망: §Y신성한 성전§!$TABBED_NEW_LINE$- 특수 행성 결정 §Y마녀사냥§!을 사용할 수 있습니다. £job_templar£ $job_templar_plural$가 추가 $r_unity$을 생산하고 안정도와 £pops£ 정신주의 윤리관 선호도를 높이지만, 지역 $r_research$가 크게 감소합니다.\n$BOB_mercs_tooltip$\n$BOB_temple_tooltip$"
 gov_liberal_democracy:0 "자유 민주정"
 gov_liberal_democracy_desc:0 "서로 다른 여러 정당이 경쟁하는 선거, 권력 분립, 사유 재산을 인정하는 시장 경제, 시민권과 정치적 자유의 보호를 특징으로 하는 정부입니다."
 RT_DUCE:0 "두체"
 gov_anarchy_communism:0 "군사 공산주의"
 gov_anarchy_communism_desc:0 "모든 산업을 국유화하고 엄격한 중앙 집권적 관리를 도입한 극단적인 공산주의 독재정입니다. 국가가 대외 무역을 통제하며 노동자에게 엄격한 규율을 적용합니다. 파업은 금지되고 비노동 계급에도 노동 의무가 부과됩니다."
 RT_GENERALISSIMO:0 "대원수"
 policy_drug_rights:0 "약물"
 policy_drug_rights_desc:0 "환각제와 진통제의 생산 및 유통 제한을 해제하면 의료 분야에서 다양한 잠재적 이익을 얻을 수 있지만, 사람들이 이 물질을 기호품으로 사용하는 경향 때문에 사회 안정이 흔들릴 수 있습니다."
 drug_rights_limited:0 "제한됨"
 drug_rights_limited_name:0 "제한됨"
 drug_rights_limited_desc:0 " "
 drug_rights_allowed:0 "허용"
 drug_rights_allowed_name:0 "허용"
 drug_rights_allowed_desc:0 " "
 PROGRESSIVE_DRUG_RIGHTS:0 "기호용 약물 허용"
 PROGRESSIVE_NO_DRUG_RIGHTS:0 "기호용 약물 허용"
 PROGRESSIVE_DRUG_RIGHTS_DESC:0 "제국의 시민들이 §Y기호용 약물§!을 자유롭게 구매하고 사용하도록 허용하면 [Root.GetName]이 기뻐할 것입니다."
 TOTALITARIAN_DRUG_RIGHTS:0 "기호용 약물 금지됨"
 TOTALITARIAN_NO_DRUG_RIGHTS:0 "기호용 약물 금지"
 TOTALITARIAN_DRUG_RIGHTS_DESC:0 "우리 제국에서 §Y기호용 약물§!의 유통과 사용을 엄격히 통제하면 [Root.GetName]의 지지를 얻습니다."
 TOTALITARIAN_GUN_RIGHTS_DESC:0 "제국에서 §Y개인 무기§!의 유통과 사용을 엄격하게 통제하면 [Root.GetName]이 기뻐할 것입니다."
 gov_communist_dictatorship:0 "혁명 독재정"
 gov_communist_dictatorship_desc:0 "이 사회의 노동자들은 옛 지배자들을 상대로 반란에 성공하여 생산 수단을 장악했습니다. 공동체 사회로 이행하는 과도기 동안 혁명가들은 군대를 통치 기구로 활용합니다."
 gov_social_democracy:0 "사회 민주정"
 gov_social_democracy_desc:0 "민주적으로 선출된 정부가 혼합 경제를 시행합니다. 기본적으로 자본주의 시장 경제의 틀 안에서 운영되지만, 정부의 개입을 통해 일정 수준의 소득 재분배와 국민의 복지를 보장합니다."
 gov_social_nationalism:0 "국가사회주의"
 gov_social_nationalism_desc:0 "강렬한 국가주의, 엘리트주의, 독재적 경찰 국가 통치를 특징으로 하는 전체주의 정부입니다."
 gov_anarch_capitalism:0 "아나코 자본주의"
 gov_anarch_capitalism_desc:0 "이 정부는 국가 기구의 규모와 권한이 최소한으로 축소되고 완전히 자유로운 시장이 법과 질서를 포함한 모든 공공재와 서비스를 제공하는 형태를 갖추고 있습니다."
 gov_minarchy:0 "최소 정부"
 gov_minarchy_desc:0 "이 정부는 영토 내 천연자원을 전혀 사용하지 않으며 자국민의 교육, 의료, 고용, 교통을 책임지지 않는 야경국가의 한 형태입니다. 대신 모든 것이 사적이나 공적으로 유지되며, 국가나 법률 또는 대표자의 간섭을 받지 않습니다."
 XENOIST_UNIVERSALISM:0 "은하 보편주의"
 XENOIST_UNIVERSALISM_DESC:0 "제국에 최소 §Y8§!개의 고유 종족이 거주하면 [Root.GetName]이 크게 기뻐할 것입니다."
 XENOIST_NO_UNIVERSALISM:0 "$XENOIST_UNIVERSALISM$"
 IMPERIALIST_DEFENSIVE_PACTS:0 "방위 동맹"
 IMPERIALIST_DEFENSIVE_PACTS_DESC:0 "다른 제국 §Y2§!곳 이상과 방위 조약을 체결하면 [Root.GetName]의 지지를 얻습니다."
 NO_IMPERIALIST_DEFENSIVE_PACTS:0 "$IMPERIALIST_DEFENSIVE_PACTS$"
 AUTHORITY_ELECTION_DIRECT_DEMOCRATIC:0 "§Y10§!년마다 선거를 실시하여 새 통치자를 선출합니다."
 civic_free_haven_desc:0 "이 사회는 자유의 피난처라는 명성을 정당하게 얻었습니다. 지친 이들, 가난한 이들, 자유롭게 숨 쉬기를 갈망하는 군중 모두 종족이나 출신에 관계없이 이곳에서 환영받습니다."
 civic_tooltip_free_haven_effects:0 "$t$- 제국 내 §Y고유 종족§! 수가 많을수록(5, 7, 10 초과) §Y외계종 선호§! 파벌이 $r_unity$을 추가로 제공합니다.\n$BOB_xeno_outreach_tooltip$"
 civic_inwards_perfection:0 "고립주의"
 civic_inwards_perfection_desc:0 "이 차분하고 평화주의적인 사회는 자신들의 삶의 방식을 이해하지 못하는 외부인에게 별 관심이 없습니다. 무엇보다도 그저 내버려 두기를 바랍니다."
