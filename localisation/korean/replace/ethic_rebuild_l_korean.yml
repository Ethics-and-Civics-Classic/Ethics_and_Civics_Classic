 job_independent_paladin:0 "독립 성기사"
 job_independent_paladin_plural:0 "독립 성기사"
 job_independent_paladin_desc:0 "이곳에서는 기회를 좇는 욕망이 강하게 작용하여 노예와 성기사, 용병 사이의 경계가 흐려집니다. 원형 경기장에는 성기사와 용병 전투원이 나서고, 노예 주인은 사설 경호원과 종자로 노예를 빌려주며, 성스러운 기사단의 기사들은 여가에 사설 경비 일을 하거나 명성을 위해 싸웁니다."
