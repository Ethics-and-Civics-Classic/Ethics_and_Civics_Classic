 druid:0 "$job_druid$"
 job_druid:0 "드루이드"
 job_druid_plural:0 "드루이드"
 job_druid_desc:0 "자연의 힘을 전도하고 초월의 길을 전하는 자입니다. 이들은 육체적, 정신적 차원에서 사회를 치유합니다."
 job_druid_effect_desc:0 "£job_priest£ §Y$job_druid_plural$§!§W는 상당한§! $r_unity$§W을 생산하지만,§! £blocker£ ['concept_natural_blockers']§W이 없는 행성에서는 통합력 생산량이 크게 줄어듭니다.§! £job_priest£ §Y$job_druid_plural$§!§W는 또한§! £crime£ §Y범죄§!§W를 줄이고§! §Y팝 성장§!§W을 조금 높이며§! £pops£ §H$ethic_green$§! §W및§! £pops£ §H$ethic_spiritualist$§! §W선호도를 제공합니다§!"
