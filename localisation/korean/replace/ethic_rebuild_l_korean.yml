 civic_astrometeorology:0 "우주 기상학"
 civic_astrometeorology_desc:0 "자연의 힘에 깊은 경외심을 느낀 이 종족은 자연 현상의 원리를 밝혀내기 위해서라면 어떠한 고난도 마다하지 않습니다. 이들은 우주 기상학에 지대한 관심을 지니고 우주 곳곳으로 나아갑니다. 이들이 추구하는 야심 찬 계획의 중심은 우주의 모든 현상 중에 가장 환상적이면서도 파괴적인 잠재력을 지닌 현상, 바로 우주 폭풍입니다.\n"
