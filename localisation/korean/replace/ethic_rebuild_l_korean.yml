 civic_police_state:0 "경찰 국가"
 civic_police_state_desc:0 "이 억압적인 사회는 모든 반대의 흔적을 없애기 위해 대규모 내부 경찰 조직으로 주민들을 면밀히 감시하고 통제합니다."
 civic_tooltip_police_state_effects:0 "$t$- £job_enforcer£ §Y$job_enforcer_plural$§! 100명당 $r_unity$ §G+1§!.$TABBED_NEW_LINE$- £job_enforcer£ §Y$job_enforcer_plural$§! 100명당 £crime£ §Y범죄§! §G-5§!.$TABBED_NEW_LINE$- £building£ §Y경찰서§!와 £building£ §Y심판의 전당§!의 $r_energy$ 유지비가 증가합니다.\n$BOB_security_tooltip$"
 gov_peoples_republic:0 "인민 공화국"
 gov_peoples_republic_desc:0 "이 정부는 평등주의적 형태의 독재정입니다. 의회가 존재하지만, 소위 인민당이라고 불리는 단일 정치 세력이 지배하고 있습니다."
 empire_not_capitalism:0 "$TRIGGER_FAIL$우리 제국은 필요한 §Y$ethic_capitalism$§! 이상을 수용하지 않습니다."
 gov_bur_collectivism:0 "관료적 집단주의"
 gov_bur_collectivism_desc:0 "국가가 생산 수단을 소유하지만 잉여와 이윤은 노동 계급이 아닌 당의 엘리트 관료 집단에 분배되는 관료적 집단주의 국가입니다."
 gov_enlighted_socialism:0 "계몽 전제정"
 gov_enlighted_socialism_desc:0 "이 정부는 사회주의 독재정의 한 형태입니다. 종신 임기로 선출된 현명한 통치자는 더 밝은 미래를 설계하는 깨우친 인물로 의심 없이 받아들여집니다."
 RT_SAGE:0 "현자"
 HT_PROSELYTE:0 "개종자"
 gov_dread_brotherhood:0 "공포의 형제단"
 gov_dread_brotherhood_desc:0 "은하의 모든 열등한 생명체를 파괴한다는 공동의 목표로 모든 시민이 결속된 극도로 외계종 혐오적인 직접 민주정입니다."
 RT_BROTHER:0 "형제"
 RT_SISTER:0 "자매"
 PROGRESSIVE_NO_WELFARE:0 "사회적 평등 없음"
 NO_PROGRESSIVE_NO_WELFARE:0 "사회적 평등 없음"
 PROGRESSIVE_NO_WELFARE_DESC:0 "§Y사회적 평등§!, §Y사회 복지§! 또는 §Y유토피아적 풍요§! 생활 수준을 적용하면 [Root.GetName]의 반감을 얻습니다."
 PROGRESSIVE_NO_STRATIFIED_DESC:0 "제국민 중 누구라도 §Y계층 경제§! 또는 §Y학술적 특권§!하에서 생활하면 [Root.GetName]의 큰 반감을 얻습니다."
 gov_absolute_monarchy:0 "절대 군주정"
 gov_absolute_monarchy_desc:0 "군주가 최고의 권력을 행사하며, 성문법이나 입법부, 관습의 제약을 받지 않는 군주정입니다."
 gov_cor_dictatorship:0 "기업 독재정"
 gov_cor_dictatorship_desc:0 "강력한 기업들이 사회의 정치와 경제를 완전히 장악한 극단적인 자본주의 정부입니다."
 NO_FREE_MEDIA:0 "자유 언론 없음"
 NO_FREE_MEDIA_DESC:0 "§Y자유 언론§! 정책을 시행하면 [Root.GetName]의 심기를 거스르게 됩니다."
 xenobiologist:0 "$job_xenobiologist$"
 job_xenobiologist:0 "외계 생물학자"
 job_xenobiologist_plural:0 "외계 생물학자"
 job_xenobiologist_desc:0 "외계 생명체를 전문적으로 연구하는 과학자입니다."
 job_xenobiologist_effect_desc:0 "£job_researcher£ $job_xenobiologist_plural$는 많은 $r_society$를 생산합니다."
