 civic_machine_cult_machine:0 "기계 영혼"
 civic_machine_cult_machine_desc:0 "이 기계들은 사이오닉 특성을 지닌 것으로 여겨지며, 신앙의 열정으로 기계 영혼에 힘을 불어넣습니다."
 civic_tooltip_machine_cult_machine_effects:0 "- 추가 시작 건물: £building£ §Y기계 수도원§! \n- §C['trait:trait_latent_psionic_machine', $trait_latent_psionic_machine$]§! 특성 잠금 해제 \n$civic_tooltip_machine_cult_buildings$\n\n§E사이오닉 공생§!:\n    - £pops£ §Y$planet_pop_organics$§!을 §H사이버네틱§!으로 개조 가능\n$civic_tooltip_machine_servitor_effects$\n\n§E함께 사용할 수 있는 사회 제도:§! \n- ['civic_tooltip_machine_cult_spiritualist_combo', $civic_exalted_priesthood$] 또는 기타 ['concept_ethics_rebuild_theocracy',§Y정신주의§! 계열 정부 사회 제도]"
 civic_machine_cult_machine_secondary_species:0 "기계 숭배자"
 civic_machine_cult_machine_secondary_species_desc:0 "§L이 종족은 모성에 거주하는 지성 있는 기계 지능과 함께 진화했으며, 그 기계 지능을 숭배하기 시작했습니다. 열렬한 신앙은 때때로 기계 안의 사이오닉 능력을 일깨웁니다.§!"
 trait_machine_cult_cybernetic:0 "사이버네틱 교단"
 trait_machine_cult_cybernetic_desc:0 "§L이 종족은 기계신의 모습을 본떠 자신을 바꾸기 위해 사이버네틱 증강을 받아들였습니다. 나약한 육신을 기계 복제품으로 교체하면서 관례적으로 기도문을 읊습니다.§!\n"
 trait_latent_psionic_machine:0 "잠재된 기계 영혼"
 trait_latent_psionic_machine_desc:0 "§L이 기계들은 잠재적인 사이오닉 능력을 지녔으나 대부분의 유닛에서는 휴면 상태입니다. 매우 드물지만 간혹 이러한 능력이 발현됩니다.§!"
 building_mecha_monastery:0 "기계 수도원"
 building_mecha_monastery_desc:0 "견고한 합금과 고대 우주선의 선체로 지은 이 거대한 건축물에서는 깊은 공명음이 울려 퍼집니다. 내부의 광대한 공간에서는 기술 사제들이 식민지의 존속을 이끄는 연산 장치를 관리합니다."
 building_colossal_monument:0 "거대 로봇 기념비"
 building_colossal_monument_desc:0 "인간형 로봇을 찬양하는 이 거대한 기념비는 단순한 조각상 이상의 의미를 지닙니다. 숭배를 위한 사당이 아니라 제국의 운명을 빚어낸 고대 인공 지능을 기억하는 성소입니다."
 job_bio_civilian:0 "생체 시민"
 job_bio_civilian_plural:0 "생체 시민"
 job_bio_civilian_plural_with_icon:0 "£job_bio_civilian£ $job_bio_civilian_plural$"
