 ethic_fanatic_capitalism:0 "광적인 경쟁주의"
 ethic_capitalism_desc:0 "§L개인의 야망은 진보의 원동력입니다. 더 나아지고자 하는 욕망과 이를 추구하는 추진력이 별마저 우리 손끝에 닿게 했습니다. 우리는 힘겹게 얻은 표현의 자유를 순응주의자들의 비합리적인 두려움에서 계속 지켜 내고, 획일성이 천재성을 가로막지 못하게 해야 합니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_capitalism_desc:0 "§L남보다 뛰어나고, 부를 축적하고, 재투자하는 것보다 중대한 소명은 없습니다. 야망의 충돌에서 막대한 부가 생겨나고, 그와 함께 더 큰 야망이 솟아납니다. 수레바퀴는 부적합한 자들을 짓누르며 굴러가지만, 한 바퀴 돌 때마다 새로운 도전자들을 끌어올립니다. 우리 중 가장 뛰어난 자들에게 최선인 것이 결국 우리 모두에게 이롭다는 사실을 우리는 알고, 몸소 증명합니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_socialism:0 "협동주의"
 ethic_fanatic_socialism:0 "광적인 협동주의"
 ethic_socialism_desc:0 "§L협력은 진보의 원동력입니다. 함께 일하는 우리는 개개인의 합보다 더 큰 존재가 됩니다. 우리 각자를 세포로 삼는 거대한 하나의 생명체인 것입니다. 우리에게 요구되는 것은 맡은 일을 성실히 해내는 것뿐이며, 우리 스스로 바라는 것도 공동의 이익에 기여하는 것뿐입니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_socialism_desc:0 "§L위대한 노동 속에서 자신의 자리를 찾고, 자신을 내어주며, 공동의 결실을 나누라는 부름보다 더 큰 명령은 없습니다. 부와 토지, 기계를 이기적으로 축적하는 것은 공동체라는 몸에 생긴 종양의 징후입니다. 어린이와 노인, 병자를 돌보는 짐을 함께 나누는 것이야말로 우리를 강하게 하고 하나로 만듭니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_egalitarian_desc:0 "§L자유주의는 사회의 자유를 옹호하며 자율성과 정치적 자유를 장려합니다. 자유로운 결사, 선택의 자유, 자발적 결합과 개인주의를 강조하고, 권력의 중앙 집중과 규제를 줄여 효율을 추구합니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_egalitarian_desc:0 "§L급진적 자유주의는 자율성과 자치를 바탕으로 자유를 사회의 핵심 원칙으로 지키겠다고 맹세하며, 모든 형태의 폭정과 억압을 혐오합니다. 모두는 존엄과 권리에서 평등하고, 정치 권력은 무엇보다 먼저 개인에게 있습니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_gestalt_consciousness_desc_tooltip:0 "\n\n§Y게슈탈트§!는 §R윤리관 효과가 제한됩니다!§!\n"
 ethic_authoritarian_desc:0 "§L문명의 성공에는 강력한 인도자의 손길이 필수적입니다. 그 대안은 무정부 상태와 혼란뿐입니다. 시민들을 가장 생산적인 길로 이끄는 것은 국가의 의무입니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_authoritarian_desc:0 "§L하나의 목소리, 하나의 왕좌, 하나의 국가. 통치라는 막중한 책임을 맡은 소수의 깨우친 이들에게 복종하는 것은 대중의 엄숙한 의무입니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_xenophobe_desc:0 "§L광활하고 미지의 은하로 나아가는 지금, 우리 종족의 생존 자체가 걸려 있습니다! 외계인을 믿어서는 안 됩니다. 그 거짓 미소 뒤에는 헤아릴 수 없는 정신이 숨어 있습니다...§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_xenophobe_desc:0 "§L외계의 영향은 무엇이든 무자비하게 짓눌러야 합니다. 순수성을 지키고 우리 자신과 생명을 준 행성에 충실해야만 음험한 외계인의 음모를 막을 수 있습니다. 외계인을 지배하는 것만으로도 우리의 안전을 보장하기에는 부족할지 모릅니다...§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_xenophile_desc:0 "§L우리 모두의 내면에는 미지의 존재를 향한 깊은 매혹이 자리하고 있습니다. 익숙한 것을 거부하고 낯선 것을 반기는 모험 정신 말입니다. 그것이 무엇이든, 누구이든 상관없습니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_xenophile_desc:0 "§L절대적인 도덕적 명령이 존재한다면, 그것은 우주를 탐험하고 그 안의 모든 것을 포용하는 일일 것입니다. 우리는 홀로 여행하도록 태어나지 않았습니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_militarist_desc:0 "§L진정한 미덕은 오직 용기와 규율뿐이며, 이를 올바르게 활용하면 어떤 장애물도 극복할 수 있습니다. 절제된 힘과 지켜지는 약속, 거기에 진정한 강함이 있습니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_militarist_desc:0 "§L무력을 투사할 능력이 무엇보다 중요합니다. 우리의 생활 방식을 지킬 유일한 길은 모두가 그것을 따르게 하는 것입니다. 자발적이든 아니든...§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_pacifist_desc:0 "§L분쟁을 목적 달성의 수단으로 삼는 발상은 터무니없습니다. 분쟁은 본질적으로 파괴적이어서, 얻으려던 것을 파괴하거나 없애려던 것이 자라날 여지를 줍니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_pacifist_desc:0 "§L문명인으로서 우리가 최우선으로 추구해야 할 것은 모든 무력 충돌의 종식입니다. 전쟁은 진화의 막다른 길이며, 낭비적인 만큼 무의미합니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_spiritualist_desc:0 "§L광대하고 무심한 우주에서 우리가 얼마나 작고 우리의 삶이 얼마나 무의미한지 잊지 말아야 한다는 이들이 있습니다... 헛소리입니다! 우리가 알 수 있는 유일한 진실은 우리 자신의 존재입니다. 겉으로 보이는 모든 영광에도 불구하고 우주는 우리 모두가 함께 꾸는 꿈에 지나지 않습니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_spiritualist_desc:0 "§L우리의 과학은 의식이 현실을 낳는다는 것을 증명했습니다. 우리는 그 반대라고 착각하며 \"단단한 물질\"의 장난감 블록을 갖고 노는 자들의 어린애 같은 노력을 인내심 있게 지켜봅니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_materialist_desc:0 "§L별을 향해 나아가려면 신과 영혼, 그 밖에 머릿속에서 만들어 낸 허상 같은 유치한 것들을 버려야 합니다. 현실은 잔혹하고 무자비하지만, 우리는 마음을 굳게 먹고 과학과 기술을 흔들림 없이 추구하여 종족의 생존을 확보해야 합니다.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_materialist_desc:0 "§L고통스럽더라도 우리는 성숙해져 낡은 도덕 관념을 버려야 합니다. 살아 있는 정신에 특별한 가치를 부여하는 \"신성한 불꽃\" 따위는 없습니다. 어떤 대상에도 우리가 부여한 것 이외의 본질적인 가치는 없습니다. 확신이 주는 자유를 받아들이고 모든 일에서 최고의 효율을 달성합시다!§!$ethic_gestalt_consciousness_desc_tooltip$"
 civic_pilgrims:0 "모험적인 개척자"
 civic_pilgrims_desc:0 "이 사회에는 오랜 유목 전통과 강한 모험 정신이 자리 잡고 있습니다. 사람들은 영토를 크게 넓히고, 가능한 한 널리 퍼져 정착하려 합니다."
 civic_free_market:0 "자유 시장"
 civic_free_market_desc:0 "재화와 서비스의 가격이 생산자와 소비자에 의해서만 결정되며, 수요와 공급의 법칙이 정부, 가격을 설정하는 독점 기업, 기타 권력의 간섭을 받지 않는 이상적인 경제 체제입니다."
 civic_corporate_sovereign_guardianship:0 "기업 보호국"
 civic_corporate_sovereign_guardianship_desc:0 "경쟁하던 산업체들로 이루어진 이 사회는, 강한 방어 태세가 투자처를 지키는 가장 훌륭한 방법이라는 사실을 익히 깨달았습니다. 이제 하나의 기업을 이룬 이들은, 자신들의 이러한 철학을 우주로 펼쳐 국경 방어를 단단히 하는 동시에 긴장은 완화하고자 노력하고 있습니다."
 civic_corporate_sovereign_guardianship_effects:0 "$civic_sovereign_guardianship_effects$ $TABBED_NEW_LINE$ $BOB_mercs_tooltip$"
 civic_natural_design:0 "자연적 설계"
 civic_natural_design_desc:0 "§R경고: 승격의 길이 전부 차단됩니다.§!\n§R경고: 유기체 종족을 변형할 수 없습니다.§!\n\n이 사회는 자연이 시민들의 유전 코드를 이미 완벽한 상태로 만들어 놓았다고 굳게 믿고 있습니다. 이들은 오랫동안 건강을 지키고 손대지 않은 자연 그대로의 유전체 서열을 보존하는 데 자신들의 의료 및 정부 역량을 집중해 왔습니다."
 civic_tooltip_natural_design_effects:0 "$t$- $AVAILABLE_BUILDINGS$ £building£ ['concept_transcendental_retreat'].\n$BOB_clinic_tooltip$"
 civic_tooltip_natural_design_negative_effects:0 "$t$- §H승격 경로§!를 시작한 제국의 우호도 감소.$TABBED_NEW_LINE$- 모든 §H승격 경로§!를 §R차단§!!$TABBED_NEW_LINE$- 유기체 종족 §H변형§! §R불가§!!"
 civic_gospel_of_the_masses:0 "대중 복음"
 civic_gospel_of_the_masses_desc:0 "이 사회는 상업적 가치와 정신주의적 가치가 독특하게 어우러져, 성직자와 기업 임원의 지위가 하나의 역할로 합쳐져 있습니다. $TABBED_NEW_LINE$ $BOB_temple_tooltip$"
