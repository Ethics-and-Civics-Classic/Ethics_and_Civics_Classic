 building_primitive_research:0 "대학 연구소"
 building_primitive_research_desc:0 "대학은 문명을 우주 시대로 이끌기 위한 과학 연구의 대부분을 수행했습니다."
 action.1.preftl_action_trade_pact_msi:0 "$NAME_MSI_country$ 이사회를 대표하여 진심 어린 인사를 전합니다. 저희 $NAME_MSI_country_initials$는 기술과 무역을 통해 다른 문명의 역량을 키워 준다는 신념을 지니고 있습니다. 모든 지성체에게는 꿈을 실현할 권리가 있으니까요.\n\n지금까지 저희는 수십 곳의 초광속 이전 행성에 통찰을 제공했으며, 향후 10년 내에 그 수를 40% 늘릴 계획입니다.\n\n[Root.Capital.GetName] 주민 여러분을 모시게 되어 기쁩니다. 저희 계몽 서비스의 고객으로서 무료 체험 기간을 즐겨 주시기 바랍니다!"
 action.1.obelisk:0 "$NAME_MSI_country$ 이사회를 대표하여 진심 어린 인사를 전합니다. 저희 $NAME_MSI_country_initials$는 기술과 무역을 통해 다른 문명의 역량을 키워 준다는 신념을 지니고 있습니다. 모든 지성체에게는 꿈을 실현할 권리가 있으니까요.\n\n지금까지 저희는 수십 곳의 초광속 이전 행성에 통찰을 제공했으며, 향후 십 년 안에 그 수를 40% 늘릴 계획입니다. 또한 금융 지원과 전문 계약 노동력 서비스를 통해 은하의 우주 진출 제국들을 돕고 있습니다.\n\n필요한 것이 있다면 언제든 연락해 주십시오. 여러분과의 거래를 기대하겠습니다!"
 action.2.a:0 "§E반갑습니다! 서로의 문화에서 배울 점이 많겠군요.§!"
 action.2.d:0 "§E우주는 경이롭다. 그 원리를 그대들에게 알려주겠다.§!"
 action.2.e:0 "§E최고의 전사를 데려오시오. 함께 전투를 찬미합시다!§!"
 action.2.f:0 "§E우리는 평화를 위해 왔다. 조화롭게 공존하기를 바란다.§!"
 action.2.g:0 "§E우리는 평화를 위해 왔으며, 그대들의 자유를 존중합니다.§!"
 action.2.cooperative:0 "§E안녕하십니까, 동지 여러분.§!"
 action.2.competitive:0 "§E반갑습니다! 제공할 서비스가 많습니다. 물론 대가는 받습니다.§!"
 action.2.industrialist:0 "§E그대들의 행성에는 부가 넘쳐난다. 우리가 이를 발굴하게 해다오.§!"
 action.2.ecocentrist:0 "§E그대들의 행성을 치유하고 자연과 조화를 이루도록 도울 수 있습니다.§!"
 action.2.a.invade:0 "§E우리 고고학자들이 너희 사회의 잔해에서 많은 것을 배우겠구나!§!"
 action.2.b.invade:0 "§E흉측한 생물들... 우리 눈앞에서 너희를 흔적도 없이 지워 버리겠다!§!"
 action.2.c.invade:0 "§E그대들과 그대들의 세계에 신의 축복이 함께하기를.§!"
 action.2.d.invade:0 "§E우리 기술은 그대들의 원시적인 군대를 전멸시킬 것입니다.§!"
 action.2.e.invade:0 "§E당신들 같은 혼란한 존재에 질서를 가져다드리겠습니다. 기다리세요.§!"
 action.2.f.invade:0 "§E우리는 평화를 바라지만, 너희의 존재가 그것을 가로막는다.§!"
 action.2.g.invade:0 "§E그대들의 민중을 해방하기 위해 전쟁을 하러 왔다!§!"
 action.2.h.invade:0 "§E당신들 문명이 진보했다고 생각하는 겁니까? 귀엽기도 하지.§!"
 action.2.i.invade:0 "§E우리는 하나다. 너희도 우리의 일부가 될 것이다.§!"
 action.2.j.invade:0 "§E우리는 하나다. 너희도 하나다. 하지만 하나만이 남을 수 있다.§!"
 action.2.k.invade:0 "§E그대들을 수익성 좋은 식민지로 만들기를 기대합니다!§!"
 action.2.cooperative.invade:0 "§E그대들은 동지가 아니다... 아직은.§!"
 action.2.competitive.invade:0 "§E반갑습니다! 여러분은 저희가 갖고 싶은 자산을 많이 보유하고 계시는군요!§!"
 action.2.industrialist.invade:0 "§E너희 세계에는 자원이 풍부하군. 우리가 채굴해 주마.§!"
 action.2.ecocentrist.invade:0 "§E그대들의 무관심에서 이 행성을 구해 내겠다!§!"
 action.2.civic_barbaric_despoilers.invade:0 "§E너희 사회를 노예로 삼겠다! 모든 것은 우리의 것이다!§!"
 action.2.civic_barbaric_despoilers.invade.tooltip:0 "§Y궤도 함대§!§W가§! §G약탈§! 폭격 태세로 전환합니다§!\n\n"
 war_goal_wg_primitive_uprising:0 "원시 문명 해방"
 war_goal_wg_primitive_uprising_desc:0 "우리를 정복하려 했던 성간 제국으로부터 우리 민족을 해방하기 위한 전쟁입니다."
 wg_primitive_uprising:0 "원시 문명 봉기"
 wg_primitive_uprising_accept:0 "§Y[From.GetName]§!이 굴욕을 당하여 §Y10§!년 동안 §Y$mod_country_base_influence_produces_mult$§! 및 팝 행복도가 감소함\n\n§Y[Root.GetName]§!이 $r_influence$ §G+100§!을 얻고 §H[Root.Capital.GetStarName]§!의 소유자가 됨\n[Root.GetEnmityEclipse]"
 cb_primitive_uprising:0 "$casus_belli_cb_primitive_uprising$"
 cb_primitive_uprising_desc:0 "$casus_belli_cb_primitive_uprising_desc$"
 casus_belli_cb_primitive_uprising:0 "원시 문명 봉기"
 casus_belli_cb_primitive_uprising_desc:0 "우리를 정복하려던 성간 제국으로부터 동족을 해방할 용기는 언제나 존재합니다."
 preftl.180.wargoal:0 "원시 문명 봉기"
 preftl.1100.name:0 "성간 시대"
 preftl.1100.desc:0 "[From.Capital.GetName]의 외계 문명이 모성 궤도에서 최초의 초광속 항행이 가능한 행성 간 우주선을 완성했습니다. 좋든 나쁘든, 이제 이 외계인들은 은하 공동체에 합류할 준비를 마쳤으며 은하의 우주 진출 종족 중 하나로 여겨야 합니다."
 origin.10.a.pre_ftl.desc:0 "반갑다, 충실한 [Root.GetSpeciesNamePlural]이여. 지금까지 잘해 주었다. 우리의 인도 아래 그대들은 초기 우주 시대에 도달했고, 이제 처음으로 고향 성계를 탐사할 준비가 되었다... 아득한 옛날 우리가 그랬던 것처럼.\n\n두려워하지 마라. 준비되지 않았다고 여겼다면 일이 여기까지 진행되도록 두지도 않았을 것이다. 이제 나아가 우리가 자랑스러워할 만한 모습을 보여다오."
 origin.10.a.pre_ftl:0 "그 뜻에 따르겠습니다."
 origin.10.b.pre_ftl.desc:0 "[Root.GetSpeciesNamePlural]. 실험의 첫 단계가 성공적으로 끝났다. 우리는 너희 문명을 초기 우주 시대까지 이끌었으며, 이제 너희 항성계의 복잡한 구조를 탐사할 준비가 되었다.\n\n두 번째 단계가 시작된 지금도 너희의 발전을 계속 지켜볼 것이니 안심해도 좋다. 지금까지 너희는 놀라울 만큼 유능했다. 다른 이들과는 전혀 달랐지.\n\n이 기회를 어떻게 활용할지 흥미롭게 지켜보겠다."
 origin.10.b.pre_ftl:0 "실망시켜 드리지 않겠습니다."
 origin.5500.name:0 "다시 별을 향하여!"
 origin.5500.desc:0 "반란 중에 노예 주인들은 §R컴퓨터 데이터베이스를 완전히 삭제§!하려 했으나, §G데이터의 3%§!는 지우지 못했습니다. 기적 같은 일이었습니다. 과학자들이 남아 있던 설계도에서 §H$tech_hyper_drive_1$§! 개발 정보와 §H$tech_hyper_drive_theory$§! 지식을 찾아냈습니다. 노예선의 기관실은 초공간 드라이브를 연구할 기초 연구 단지로 신속하게 개조되었습니다.\n\n초공간 드라이브 설계도만큼 놀랍지는 않지만, 분석가들은 노예선의 목적지에 관한 정보도 찾아냈습니다. 항해 기록에 따르면 이 함선은 인근 성계의 §H원시 문명§!과 첫 접촉을 할 예정이었습니다. 우려스러운 점은 그 행성의 분류가 [Root.GetSpeciesName]의 모성과 같은 §R'오벨리스크 행성'§!이라는 것입니다. 조금만 더 노력하면 다른 오벨리스크 행성들의 위치도 해독할 수 있을 것입니다."
 origin.5500.tt:0 "§Y[Root.Capital.GetName]§!의 §H£building£ $building_low_tech_research_lab$§!이 §H£building£ $building_research_lab_1$§!로 업그레이드됩니다."
 origin.5500.a:0 "초공간 드라이브를 개발해 너무 늦기 전에 경고해야 한다!"
 origin.5505.desc:0 "수립된 지 얼마 지나지 않았던 정부가 가장 처음으로 한 일은 노예선의 갑판 몇 군데를 속히 기초적인 행정 허브로 개조하는 것이었습니다. 이제 제국이 [Root.Capital.GetName]에 확고히 자리 잡은 덕분에, 이러한 시설들을 업그레이드할 수 있었습니다."
 origin.5505.option.regular:0 "이는 §H$tech_primitive_unified_planet$§!의 행정에 도움이 됩니다."
 origin.5505.option.spiritualist:0 "이것은 §H$tech_primitive_unified_planet$§!을 향한 영적 여정에 도움이 된다."
 civic_tooltip_memory_vault_effects:0 "고유한 £building£ §Y$building_paragon_memory_vaults$§! 건설 가능\n획득한 §Y운명 특성§!에 따라 £building£§Y$building_paragon_memory_vaults$§!가 $r_unity$을 생산하고 §Y$MOD_LEADER_SPECIES_EXP_GAIN$§!을 증가시킵니다."
 civic_memory_vault:0 "지식의 보고"
 civic_memory_vault_desc:0 "뛰어난 인물들의 지식과 신념, 경험을 디지털화해 지식의 보고에 축적합니다. 시민들은 이 지혜와 경험의 보고에 접근해 과거의 인물들로부터 배울 수 있습니다.\n\n§Y지도자§!§W가§! §Y통치자§!§W가 되면§! §Y스킬 레벨§! §G+1§!\n\n§C기록자§! §W사회 제도§! §W보유 시:§!\n§S독재정§! §W및§! §S제정§! §W제국에서는§! §Y통치자§!§W의§! §Y스킬 레벨§!§W이§! §Y이전 통치자§!§W보다 낮을 경우 같은 수준으로§! §G조정됩니다§!."
 civic_tooltip_memory_vault_corporate_effects:0 "고유 건물 £building£§Y $building_paragon_memory_vaults$§! 건설 가능\n£building£§Y$building_paragon_memory_vaults$§!는 획득한 §Y운명 특성§!에 따라 $r_unity$과 $r_trade$을 생산합니다."
 civic_memory_vault_corporate:0 "지식 멘토링"
 civic_memory_vault_corporate_desc:0 "위대한 자들의 지식, 원칙, 경험을 디지털화해 지식의 보고에 보관합니다. 국민들은 이 지혜와 경험의 창고를 통해 과거의 위인들로부터 교훈을 배울 수 있습니다. 물론 이용료는 지불해야 합니다.\n\n§Y지도자§!§W가§! §Y통치자§!§W가 되면§! §Y스킬 레벨§! §G+1§!"
 civic_tooltip_memory_vault_machine_effects:0 "고유한 £building£ §Y$building_paragon_memory_vaults$§! 건설 가능\n§Y8레벨§!을 달성한 §Y지도자§! 수에 따라 £building£§Y$building_paragon_memory_vaults$§!가 $r_unity$을 생산하고 §Y$MOD_LEADER_SPECIES_EXP_GAIN$§!을 증가시킵니다."
 civic_memory_vault_machine:0 "경험 보관고"
 civic_memory_vault_machine_desc:0 "이 기계 지능은 분석, 학습 및 자기 개발을 목적으로 각종 데이터 및 경험을 디지털화하고 보관하기 위해 개발되었습니다."
 civic_tooltip_memory_vault_hive_effects:0 "고유한 £building£ §Y$building_paragon_memory_vaults$§! 건설 가능\n§Y8레벨§!을 달성한 §Y지도자§! 수에 따라 £building£ §Y$building_paragon_memory_vaults$§!가 $r_unity$을 생산하고 §Y$MOD_LEADER_SPECIES_EXP_GAIN$§!량을 증가시킵니다."
 civic_memory_vault_hive:0 "신경 보관고"
 civic_memory_vault_hive_desc:0 "이 군체는 은하계에 거주하는 자율 드론들의 삶을 돌아보고 그로부터 교훈을 얻는 데 매진합니다. 뇌 조직을 보관 및 용해시켜 기억을 추출하며, 그 과정을 통해 얻는 부분적인 기억을 새로운 드론에 주입시킬 수 있습니다."
 civic_memorialist:0 "기록자"
 civic_memorialist_desc:0 "이 제국은 과거의 기억과 지성체를 기리며, 죽음과 재탄생, 유산의 끊임없는 순환에서 더 큰 안정과 통찰을 얻습니다."
 civic_tooltip_memorialist_effects:0 "$t$- £building£ §H$building_galactic_memorial_1$§! 건설 가능.$TABBED_NEW_LINE$- $building_galactic_memorial_regular_tooltip$.$TABBED_NEW_LINE$- $job_death_chronicler_simple_effect_desc$.\n\n§C지식의 보관소§! 사회 제도 보유 시:$TABBED_NEW_LINE$- §S독재정§! 및 §S제정§! 제국의 §Y통치자§! §Y레벨§!이 §Y이전 통치자§!보다 낮으면 이전 통치자와 §G같아집니다§!."
 building_galactic_memorial_regular_tooltip:0 "§H안식의 성소§!는 §H죽은 행성§!, §H유물 행성§!, §H유물 방주선§!에서 §H통치 윤리관 선호도§!를 증가시킵니다."
 building_galactic_memorial_gestalt_tooltip:0 "§H안식의 성소§!가 §H죽은 행성§!, §H유물 행성§!, §H유물 방주선§!의 §H일탈§!을 감소시킴"
 civic_hive_memorialist:0 "기록자"
 civic_hive_memorialist_desc:0 "이 군체 의식은 불멸하는 자신의 자아를 가다듬기 위한 수단으로 다른 지성체의 죽음에 특별한 관심을 기울입니다."
 civic_machine_memorialist:0 "$civic_hive_memorialist$"
 civic_machine_memorialist_desc:0 "이 기계 지능은 광활한 우주의 엔트로피를 면밀히 분석해 핵심 프로토콜에 대한 이해를 다듬습니다. 더 뛰어난 복원력을 향해 나아가는 과정에서는 중복 정보조차 유용한 데이터입니다."
 civic_public_relations_specialists:0 "홍보 전문가"
 civic_public_relations_specialists_desc:0 "누군가의 생각을 통제할 수 있다면 행동도 통제할 수 있습니다. 이 거대 기업에는 여론전에 투입할 전문가들이 군대처럼 즐비합니다.\n\n£building£ §Y$building_PR_bureau$§! §W건설 가능§!"
 civic_tooltip_idyllic_bloom_species_or_ethic:0 "§Y$ethic_fanatic_green$§! 윤리관을 지녔거나 §Y$FUN$§! 또는 §Y$PLANT$§! 종족임"
 INSULT_PROPOSE_COL_IND:0 "[Root.GetName](은)는 진짜 국가이긴 한가요? 아니면 다투기만 하는 개인들이 모인 무질서한 무리인가요? 실례지만, 그쪽 정치 체계를 보고 있자니 도무지 구분이 안 되는군요."
 02_INSULT_PROPOSE_COL_IND:0 "당신네 조그마한 항성 국가를 통치하는 게 누구라고 했죠? '투표'로 누군가에게 권력을 준다니, 정말 진기한 생각이군요! 물론 이러다간 당신들은 멸망하고 말 테지만요."
 03_INSULT_PROPOSE_COL_IND:0 "당신들의 민주주의 사상도, [Root.GetName]도 이 은하의 역병입니다."
 04_INSULT_PROPOSE_COL_IND:0 "너희는 언제나 개인의 이익만 앞세우는 이기적인 족속이군. 자유주의라... 하! [Root.GetName]은 올해를 넘기지도 못할 것이다."
 01_INSULT_PROPOSE_IND_COL:0 "당신들의 잔혹하고 폭압적인 정권은 결국 몰락하고 심판받을 것입니다."
 02_INSULT_PROPOSE_IND_COL:0 "시민들이 스스로 생각하게 놔둔다는 생각을 해 본 적은 있나요? 혹시 [Root.GetName]의 몰락으로 이어질까 두렵다면... 그 생각이 맞습니다."
 03_INSULT_PROPOSE_IND_COL:0 "[Root.GetName] 같은 권위주의 국가가 존재한다니 정말 슬프군요. 온 우주에 있는 지성체가 부끄러워할 일입니다."
 04_INSULT_PROPOSE_IND_COL:0 "[Root.GetName]의 멍에 아래 사는 이들을 잔혹하게 억압하는 일도 언젠가는 끝나야 합니다. 그 위계질서가 결국 당신들의 파멸을 부를 것입니다."
 16_FRIENDLY_GREETING:0 "그대들의 정부는 자유주의의 극단적인 폐해를 잘 억제하고 있군요, [From.GetSpeciesNamePlural]."
 14_FRIENDLY_GREETING:0 "저희는 자유로운 사회를 선호하지만, 귀국 정부가 시민들에게 안정을 제공하는 데 능숙하다는 점은 부정할 수 없군요."
 ENSLAVED_DESC:0 "이 팝은 노예화되었습니다. 노예가 된 팝은 행성의 모든 자유주의 팝을 불행하게 만듭니다."
 COL_LABEL:0 "권위주의 <-> 자유주의"
 ethic_collectivist:0 "권위주의"
 ethic_collectivist_desc:0 "§L사람마다 능력이 다르다는 것은 자명합니다. 어떤 이는 통치에 더 적합하고 다른 이는 봉사에 더 적합하며, 사회적 역할도 이를 반영해야 합니다. 이 사실을 무시하는 것은 혼란과 무질서를 자초하는 일입니다.§!\n"
 ethic_fanatic_collectivist:0 "광적인 권위주의"
 ethic_fanatic_collectivist_desc:0 "§L하인이 통치하고 통치자가 섬기는 것은 자연에 대한 죄악입니다. 올바른 질서는 엄격한 위계와 절대적인 복종을 통해서만 유지됩니다.§!\n"
 ethic_egalitarian:0 "자유주의"
 ethic_individualist_desc:0 "§L기본적인 존엄과 권리는 모든 이에게 평등합니다. 질서 유지는 훌륭한 목표이기는 하지만 원칙적으로나 현실적으로 폭정과 억압을 정당화할 수는 없습니다. 문명은 소수가 다수를 지배하지 않을 때 가장 잘 번성할 수 있습니다.§!\n"
 ethic_fanatic_egalitarian:0 "광적인 자유주의"
 ethic_fanatic_individualist_desc:0 "§L권력은 단순히 부패하는 것이 아닙니다. 그 자체가 부패입니다. 모든 권력의 불균형은 본질적으로 강압적입니다. 진정한 자유와 정의는 평등을 통해서만 얻을 수 있습니다.§!\n"
 personality_utopia_builders:0 "낙원 건설자"
 personality_utopia_builders_desc:0 "낙원 건설자는 무엇보다도 종족의 경제적, 사회적 번영을 중요하게 생각합니다. 정부는 규모에 상관없이 그 누구도 궁핍, 질병, 빈곤으로 고통받지 않도록 하기 위해 존재합니다."
 personality_adventurous_expansionist:0 "공격적인 확장주의자"
 personality_adventurous_expansionist_desc:0 "공격적인 확장주의자는 은하계를 자신들의 유산으로 여깁니다. 이들은 주로 도달할 수 있는 우주의 곳곳에 영향력을 넓히는 데 집중합니다."
 personality_paranoid_isolationists:0 "편집증적인 고립주의자"
 personality_paranoid_isolationists_desc:0 "편집증적인 고립주의자는 외부 세계로부터 자신을 완전히 고립시키고 싶어 합니다. 이들은 자신의 일에만 신경을 쓰며, 다른 이들도 모두 그렇게 하기를 원합니다."
