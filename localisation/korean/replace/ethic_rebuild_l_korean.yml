 mod_job_pirate_lord_enforcer_per_pop_short:0 "\n$VALUE$ £pop£마다 £mod_job_enforcer_add£ §G+1§!"
 job_mob_boss_enforcer:0 "범죄 두목의 집행관"
 job_mob_boss_enforcer_plural:0 "범죄 두목의 집행관"
 job_mob_boss_enforcer_desc:0 "이 범죄자들은 범죄 두목의 명령을 집행하는 대가로 후한 보수를 받습니다."
