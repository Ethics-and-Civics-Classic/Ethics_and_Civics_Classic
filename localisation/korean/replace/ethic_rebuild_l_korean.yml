 civic_tooltip_science_directorate_effects:0 "$t$- £building£ §Y수도 건물§!의 £job_politician£ §Y$job_politician$§! 직업을 £job_head_researcher£ §Y$job_head_researcher_plural$§!로 대체$TABBED_NEW_LINE$- £building£ §Y연구소§!가 추가 £job_head_researcher£ §Y$job_head_researcher_plural$§! 직업 제공.$TABBED_NEW_LINE$- £job_researcher£ §Y$job_researcher_plural$§!이 $r_unity$도 생산."
