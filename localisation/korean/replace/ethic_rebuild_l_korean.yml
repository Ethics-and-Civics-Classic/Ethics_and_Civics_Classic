 observation.2041.desc:0 "[From.GetName]의 원주민들은 우리 기술에 매료되었을 뿐 아니라 우리의 생활 방식까지 모방하기 시작했다고 고문들이 보고했습니다.\n\n우리 예술과 문화에서 영감을 받은 [From.Owner.GetSpeciesName] 사회에 새로운 자유주의 의식이 싹튼 것으로 보입니다. 우리가 도착한 뒤 이들의 개인적 자유가 크게 늘어났습니다."
 observation.2061.desc:0 "[From.GetName]의 지표에는 무질서가 만연하며, 우리 고문들은 [From.Owner.GetSpeciesNamePlural]에게 현대 과학을 가르치는 데 어려움을 겪고 있습니다. 이른바 과학자라는 자들은 공동선에는 거의 관심을 두지 않고 그때그때 자신의 흥미가 이끄는 방향으로만 연구를 진행합니다.\n\n원주민들이 보여 주는 잘못된 자유주의에도 불구하고 계몽 임무는 계속되지만, 예상보다 오랜 시간이 걸릴 것입니다."
