 close_branch_office_flag:0 "[OWNER.GetName](이)가 최근 우리 지사를 추방함"
 grand_archive.8000.b:0 "이 보물은 해적 군주의 것이다!"
 grand_archive.8005.a.pl:0 "해적 군주께서 은하 구석구석을 손에 넣으실 것이다!"
 tech_pirate_leaders:0 "해적 지도부"
 tech_pirate_leaders_desc:0 "이 해적들은 우리 제국의 군대에서 가치와 지도력을 입증했습니다. 이제 그 재능을 정부에서 활용하면 더 큰 성과를 거둘 수 있다는 것이 분명해졌습니다... 다만 통합력이 대가가 될 것입니다."
 tech_pirate_leaders_tooltip:0 "£job_politician£ $job_politician_plural$가 £job_commandante_pirate£ §H$job_commandante_pirate_plural$§!도 겸합니다\n지도자들이 다양한 §H해적 통치자 특성§!을 지닌 채 등장합니다"
 mod_leaders_unity_upkeep_mult:0 "§H지도자§!의 £unity£ §W$UNITY$§! 유지비"
 add_leader_trait_treasure_hoarder_tooltip:0 "§Y[ROOT.GetRulerName]§!이 §H$leader_trait_treasure_hoarder$§! 특성 획득"
 civic_criminal_heritage:0 "범죄 유산"
 civic_criminal_heritage_desc:0 "이 거대기업은 범죄 조직에서 시작되어 마침내 모든 형태의 지역 정부를 대체할 만큼 강력해졌습니다.\n\n§H$economic_stance_criminal_market$§! §W및§! §H$economic_policy_criminal$§! §W정책§! §W사용 가능§!"
 civic_criminal_heritage_authority:0 "범죄 단체"
 civic_criminal_heritage_authority_desc:0 "이 조직은 서로의 사업을 지원하는 범죄 기업들의 과두정이 이끕니다. 통치자는 '두목 평의회'가 선출하며, 역사적으로 가장 뛰어난 범죄 설계자들 가운데서 뽑혀 왔습니다."
 civic_crusader_spirit:0 "십자군 정신"
 civic_crusader_spirit_desc:0 "인도자가 없으면 쉬이 부패에 굴복하고 타락에 빠지는 나약한 정신이 생겨납니다. 이 사회는 공격적인 포교을 통해 대중에게 '계몽'을 선사하는 역할을 자임했습니다."
 civic_tooltip_crusader_spirit_effects:0 "$t$- §Y$commander_plural_with_icon$§!이 §Y$leader_trait_crusader$§! 특성을 지닌 채 시작합니다."
 civic_tooltip_crusader_spirit_negative_effects:0 "$t$- §Y전쟁 금지§! 정책을 사용할 수 §R없습니다§!."
 origin_tooltip_treasure_hunters_effects:0 "£society_research£ §H$tech_pirate_leaders$§! §W기술을§! §W보유한 채 시작§!\n- 모집한 모든 지도자가 ['concept_adventurous_spirit_trait'] 특성을 추가로 보유$NEW_LINE$- 통치자 특성:$TABBED_NEW_LINE$- ['leader_trait:leader_trait_buccaneer']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_trailblazer']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_treasure_hoarder']\n- 비활성 상태의 ['r_celestial_chart_0_desc', $celestial_chart$] 보유"
 civic_military_dictatorship_corporate:0 "해적 군주"
 civic_military_dictatorship_corporate_desc:0 "이 사회의 지도자들은 역사적으로 가장 공격적이고 성공한 해적들이었습니다. 모든 파벌이 해적 군주의 깃발 아래 통합된 지금, 이들은 직접 약탈하지 않는 제국에는 자신들의 약탈 솜씨를 용역으로 제공합니다.\n\n§W모든§! £job_manager£ §Y$job_manager$§! §W직업을§! £job_pirate_quartermaster£ §Y$job_pirate_quartermaster$§! §W직업으로 대체하며§!\n£building£ §Y수도 건물§!§W은 모든§! £job_executive£ §Y$job_executive$§! §W직업을§! £job_commandante_pirate£ §Y$job_commandante_pirate$§! §W직업으로 대체합니다§!\n\n§C$civic_barbaric_despoilers$§! §W사회 제도§! §W사용 허용§!\n\n§H$economic_stance_criminal_market$§! §W및§! §H$economic_policy_criminal$§! §W정책§! §W사용 허용§!"
 civic_military_dictatorship_corporate_authority:0 "해적 연합"
 civic_military_dictatorship_corporate_authority_desc:0 "모든 해적은 해적 군주에게 종속됩니다. 정치 파벌은 혼란스럽고 냉혹한 권력 다툼으로 가득합니다. 하위 군주들이 용병 계약과 해적 소굴에서 얻는 부에 만족하는 한 해적 군주는 권력을 유지합니다."
 civic_military_dictatorship_corporate_effect:0 "§W시작 시§! £society_research£ §H$tech_pirate_leaders$§! §W기술 보유§!:\n- 모집하는 모든 지도자에게 추가 ['concept_adventurous_spirit_trait'] 특성 부여$NEW_LINE$- 통치자 특성:$TABBED_NEW_LINE$- ['leader_trait:leader_trait_buccaneer']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_trailblazer']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_treasure_hoarder']\n\n$civic_tooltip_criminal_heritage_effects$"
 civic_military_dictatorship_corporate_treasure_effect:0 "$origin_tooltip_treasure_hunters_effects$\n\n$civic_tooltip_criminal_heritage_effects$"
 civic_crusader_spirit_corporate_desc:0 "이 정부는 우주 해적과 싸우고 국경을 지키기 위해 악명 높은 해적들을 군사 고문과 함대 지휘관으로 활용합니다."
 civic_tooltip_crusader_spirit_corporate_effects:0 "$t$- 특수 §Y해적 은신처§! £building£ §Y건물§! 건설 가능$TABBED_NEW_LINE$§C범죄 유산§! 및 §C해적 군주§! 사회 제도는 모두 §Y해적 엔클레이브§!를 잠금 해제합니다$TABBED_NEW_LINE$$t$§Y해적 엔클레이브§!는 성계 내 모든 §H범죄자 직업§!이 §R범죄§! 대신 §G소량§!의 $r_trade$을 생산하게 하는 특수 §H용병 엔클레이브§!입니다.\n$TABBED_NEW_LINE$- £society_research£ §H$tech_pirate_leaders$§! 기술 연구 허용.\n$TABBED_NEW_LINE$- §Y$commander_plural_with_icon$§!이 §Y$leader_trait_corsair$§! 특성을 보유한 상태로 시작$TABBED_NEW_LINE$- 다른 모든 제국에 '§Y$casus_belli_cb_pirate_raid$§!' 전쟁 명분 획득.\n$TABBED_NEW_LINE$- §Y$building_pirate_haven$§! £building£ $megacorp_civic_branch_office_building_effect$"
 leader_trait_corsair:0 "해적 선장"
 leader_trait_corsair_effect:0 "$FLEET_EFFECTS_TXT$:$TABBED_NEW_LINE$§W$EVERY_ENEMY_SHIP_DESTROYED_TXT$:§!\n$tt$$r_energy$: §G+$@trait_corsair_amt$§!"
 leader_trait_corsair_desc:0 "해적 선장은 선원을 위한 교리를 작성하고 정책을 협상하는 정치인을 겸하는 경우가 많습니다. 전쟁 중에는 격파한 적 함선이 남긴 쓸 만한 물건을 찾아 전장을 뒤지는 것으로 유명합니다.\n\n$leader_trait_corsair_effect$"
 leader_trait_corsair_2:0 "$leader_trait_corsair$ II"
 leader_trait_corsair_2_effect:0 "$FLEET_EFFECTS_TXT$:$TABBED_NEW_LINE$§W$EVERY_ENEMY_SHIP_DESTROYED_TXT$:§!\n$tt$$r_energy$: §G+$@trait_corsair_2_amt$§!"
 leader_trait_corsair_2_desc:0 "$leader_trait_corsair_desc$"
 leader_trait_corsair_3_effect:0 "$t$§W$EVERY_ENEMY_SHIP_DESTROYED_TXT$:§!\n$tt$$r_energy$: §G+$@trait_corsair_2_amt$§!"
 civic_barbaric_despoilers_desc:0 "이 사회가 신성하게 여기는 것은 거의 없습니다. 싸우는 것이 곧 사는 것이며, 가장 강한 자는 원하는 무엇이든 차지할 수 있습니다. 이런 철학 때문에 노예제는 일상적입니다. 노예가 자유를 얻는 유일한 길은 검투 시합입니다."
 civic_barbaric_despoilers_corporate:0 "야만적 약탈자"
 civic_barbaric_despoilers_corporate_desc:0 "이 사회가 신성하게 여기는 것은 거의 없습니다. 싸우는 것이 곧 사는 것이며, 가장 강한 자는 원하는 무엇이든 차지할 수 있습니다. 이런 철학 때문에 노예제는 일상적입니다. 노예가 자유를 얻는 유일한 길은 검투 시합입니다."
 civic_tooltip_barbaric_despoilers_effects:0 "$t$- §H$origin_clone_army$§! 기원과 결합하면 §Y특별한 이야기§!를 잠금 해제합니다.\n$TABBED_NEW_LINE$- 다른 모든 제국에 '§Y$casus_belli_cb_despoliation$§!' 전쟁 명분을 가집니다.$TABBED_NEW_LINE$- $allow_raiding$$TABBED_NEW_LINE$- §Y$casus_belli_cb_satrapy_subjugate$§! 전쟁 명분으로 다른 국가를 §H$preset_relic_satrapy$ 국가§!로 종속시킬 수 있습니다.\n$TABBED_NEW_LINE$- §H$preset_relic_satrapy$§! 종속국에 $AVAILABLE_HOLDINGS$ £building£ §Y$holding_overlord_vigil_command$§!.\n$TABBED_NEW_LINE$- 행성 고유 건물인 £building£ §Y신 콜로세움§!을 건설할 수 있으며 £job_gladiator£ §Y검투사§! 직업을 추가합니다.$TABBED_NEW_LINE$- £job_gladiator£ §Y검투사§!는 $r_trade$과 $r_amenities$를 일부 생산하고 지역 §Y지상군 피해량§!을 높입니다."
 civic_tooltip_barbaric_despoilers_corporate_effects:0 "$civic_tooltip_barbaric_despoilers_effects$\n$BOB_colosseum_tooltip$"
 civic_tooltip_barbaric_despoilers_negatives:0 "$t$- §Y이주 조약§!을 체결할 수 §R없습니다§!$TABBED_NEW_LINE$- §Y무력 동맹§! 또는 §Y패권국§! 이외의 §H연방§!을 창설할 수 §R없지만§! 가입은 §G가능합니다§!$TABBED_NEW_LINE$- 대부분의 다른 제국이 갖는 §Y우호도§!가 §R감소합니다§!"
 PrimPlayer_civic_barbaric_despoilers_khan:0 "위대한 칸의 계획"
 PrimPlayer_civic_barbaric_despoilers_khan_desc:0 "이 야만적인 복제인간들은 아득한 옛날 위대한 칸의 전투 노예였습니다. 선대 칸은 오래전에 죽었지만, 이들은 여전히 위대한 칸의 계획을 성실히 수행합니다."
 civic_tooltip_barbaric_despoilers_PrimPlayer_effects:0 "- 다른 모든 제국에 '§Y$casus_belli_cb_despoliation$§!' 전쟁 명분 획득.\n- $allow_raiding$\n- 다른 제국을 §H$preset_relic_satrapy$ 국가§!로 종속시키는 §Y$casus_belli_cb_satrapy_subjugate$§! 전쟁 명분 보유.\n- §H$preset_relic_satrapy$§! 종속국에서 $AVAILABLE_HOLDINGS$ £building£ §Y$holding_overlord_vigil_command$§!.\n\n- £job_gladiator£ §Y검투사§! 직업을 추가하는 행성 고유 £building£ §Y신 콜로세움§! 건설 허용.\n- £job_gladiator£ §Y검투사§!는 일부 $r_trade$ 및 $r_amenities$를 생산하고 지역 §Y지상군 피해량§!을 증가시킵니다.\n\n['origin_clone_army']의 £job_historical_curator£ §Y특별한 이야기§!와 함께 시작:\n$origin_tooltip_clone_army_effects$"
 civic_tooltip_barbaric_despoilers_PrimPlayer_corporate_effects:0 "$civic_tooltip_barbaric_despoilers_PrimPlayer_effects$\n$BOB_colosseum_tooltip$"
 civic_barbaric_despoilers_khan:0 "$PrimPlayer_civic_barbaric_despoilers_khan$"
 civic_barbaric_despoilers_khan_desc:0 "$PrimPlayer_civic_barbaric_despoilers_khan_desc$"
 war_goal_wg_satrapy_subjugate:0 "$preset_relic_satrapy$ 체제 강요"
 war_goal_wg_satrapy_subjugate_desc:0 "적을 자회사로 편입하기 위한 전쟁입니다.\n\n현상 유지 평화가 체결될 경우, 우리가 점령한 성계에 행성이 하나 이상 있으면 새로운 자회사가 됩니다.\n\n자회사의 초기 협정 조건은 §Y$policy_subjugation_war_terms$§! 정책에 따라 달라집니다."
 casus_belli_cb_satrapy_subjugate:0 "예속"
 casus_belli_cb_satrapy_subjugate_acquire_hint:0 "\n§E대상 제국보다 상대적 전력이 대체로 우세하다면, 자동으로 §Y$casus_belli_cb_megacorp_subjugate$§! §H전쟁 명분§!을 얻을 것입니다.§!"
 councilor_barbaric_despoilers_corporate:0 "근로 감독관"
 councilor_barbaric_despoilers_corporate_female:0 "$councilor_barbaric_despoilers_corporate$"
 councilor_barbaric_despoilers_corporate_desc:0 "$TITLE$(은)는 노예 관리와 감독을 담당합니다."
 councilor_barbaric_despoilers_corporate_custom_modifier_desc:0 "- £slavery£ $pop_cat_slave_plural$에서 발생하는 £empire_sprawl£ §Y$EMPIRE_SIZE$§!: §G-2%§!"
 councilor_barbaric_despoilers_PrimPlayer:0 "최고 노예 감독관"
 councilor_barbaric_despoilers_PrimPlayer_female:0 "$councilor_barbaric_despoilers_PrimPlayer$"
 councilor_barbaric_despoilers_PrimPlayer_desc:0 "$TITLE$은 노예를 전투 노예로 전환하는 일을 감독합니다. 모든 노예는 위대한 칸의 계획을 위해 고되게 봉사할 것입니다."
 councilor_barbaric_despoilers_PrimPlayer_custom_modifier_desc:0 "- £slavery£ $pop_cat_slave_plural$에서 발생하는 £empire_sprawl£ §Y$EMPIRE_SIZE$§!: §G-2%§!"
 councilor_barbaric_despoilers_interpreter:0 "위대한 칸의 계획 해석자"
 councilor_barbaric_despoilers_interpreter_female:0 "$councilor_barbaric_despoilers_interpreter$"
 councilor_barbaric_despoilers_interpreter_desc:0 "가장 성실하고 확고한 복제인간만이 위대한 칸의 계획을 해석하는 영예를 누립니다."
 councilor_barbaric_despoilers_interpreter_custom_modifier_desc:0 "- £slavery£ $pop_cat_slave_plural$에서 발생하는 £empire_sprawl£ §Y$EMPIRE_SIZE$§!: §G-2%§!"
 councilor_barbaric_despoilers_interpreter_PrimPlayer:0 "위대한 칸의 계획 해석자"
 councilor_barbaric_despoilers_interpreter_PrimPlayer_female:0 "$councilor_barbaric_despoilers_interpreter$"
 councilor_barbaric_despoilers_interpreter_PrimPlayer_desc:0 "가장 성실하고 확고한 복제인간만이 위대한 칸의 계획을 해석하는 영예를 누립니다."
 councilor_barbaric_despoilers_interpreter_PrimPlayer_custom_modifier_desc:0 "- £slavery£ $pop_cat_slave_plural$에서 발생하는 £empire_sprawl£ §Y$EMPIRE_SIZE$§!: §G-2%§!"
 origin_tooltip_clone_army_effects:0 "£planetsize£ §Y30 $pc_relic$§!을 $HOMEWORLD$으로 삼아 시작합니다\n- $HOMEWORLD$ ['concept_clone_army_clone_vat']: +2 $NEW_LINE$- $SPECIES_TRAITS$ ['concept_clone_soldier_infertile']$NEW_LINE$- $ADDITIONAL_TECHNOLOGIES_STRING$ $TABBED_NEW_LINE$- ['concept_cloning', £society_research£ $tech_cloning$] $TABBED_NEW_LINE$- ['concept_gene_banks', £society_research£ $tech_gene_banks$]"
 clones_barbaric_despoiler.20.desc:0 "위대한 칸의 계획을 해독하려는 과학자의 헌신이 결실을 맺었습니다. 고대 클론 배양소 깊은 곳에서 찾은 암호가 해독된 것입니다. 지나치게 열성적인 수석 과학 장교가 규약을 무시하고 그 안에 담긴 열쇠를 활성화했습니다.\n\n과거의 메시지가 화면에 울려 퍼집니다..."
 clones_barbaric_despoiler.21.desc:0 "\"§H나는 위대한 칸이다§!.\n\n우리 칸국은 너희 DNA에 새겨진 의무를 통해 영원히 이어질 것이다.\n\n우리 종족이 사라질 경우 그 불씨를 이어 가도록 너희를 창조했다. 제국을 재건하는 것은 너희의 신성한 유전적 의무다. 너희에게 두 가지 길을 제시하겠다.\n\n너희를 불임으로 만든 변화를 되돌려 자유롭게 진화하고 번영하며 번식하도록 할 수 있다.\n\n아니면 진정한 칸의 잠재력을 부여하되 유전적 한계까지 밀어붙여, 후손들이 영원히 기술에 의존해 번식하도록 만들 수도 있다.\""
 clones_barbaric_despoiler.21.a:0 "위대한 칸의 계획이다!"
 CLONE_PRECURSOR_KHAN_UNLOCK_FERTILITY:0 "클론 생식력"
 CLONE_PRECURSOR_KHAN_UNLOCK_FERTILITY_DESC:0 "우리 종족은 선구자 칸의 위대함을 재현하지 못하겠지만, 번식 능력을 얻고 유전자 변형을 견딜 만큼 안정될 것입니다.\n\n효과:\n- ['trait:trait_clone_soldier_infertile'] 특성을 ['trait:trait_clone_soldier_fertile'] 특성으로 대체합니다.\n- 이 경로를 선택하면 모든 ['building:building_clone_army_clone_vat', $building_clone_army_clone_vat_plural$]가 §R해체§!됩니다."
 CLONE_PRECURSOR_KHAN_UNLOCK_FERTILITY_UTOPIA_DESC:0 "$CLONE_SOLDIER_UNLOCK_FERTILITY_DESC$\n- 이제 ['ascension_perk:ap_engineered_evolution'] 승격 특전을 얻을 수 있습니다."
 CLONE_PRECURSOR_KHAN_UNLOCK_FERTILITY_BIOGENESIS_DESC:0 "$CLONE_SOLDIER_UNLOCK_FERTILITY_UTOPIA_DESC$"
 CLONE_PRECURSOR_KHAN_UNLOCK_POTENTIAL:0 "칸의 잠재력"
 CLONE_PRECURSOR_KHAN_UNLOCK_POTENTIAL_DESC:0 "우리 종족은 승천하여 선대 칸의 위대함을 함께 누리지만, 영원히 불임으로 남고 유전자 변형에 저항하게 됩니다.\n\n효과: \n- ['trait:trait_clone_soldier_infertile'] 특성이 ['trait:trait_clone_soldier_infertile_full_potential'] 특성으로 대체됩니다.\n- 지도자가 ['trait:leader_trait_ruler_precursor_great_khan'] 특성을 보유합니다"
 CLONE_PRECURSOR_KHAN_UNLOCK_POTENTIAL_UTOPIA_DESC:0 "$CLONE_PRECURSOR_KHAN_UNLOCK_POTENTIAL_DESC$\n- 이제 ['ascension_perk:ap_engineered_evolution'] 승격 특전을 선택할 수 있습니다."
 CLONE_PRECURSOR_KHAN_UNLOCK_POTENTIAL_BIOGENESIS_DESC:0 "$CLONE_PRECURSOR_KHAN_UNLOCK_POTENTIAL_UTOPIA_DESC$\n- ['tradition_category:tradition_cloning'] 승격 경로가 강화됩니다.\n- §R['tradition_category:tradition_purity'] 및 ['tradition_category:tradition_mutation'] 승격 경로가 차단됩니다.§!"
 leader_trait_great_khan:0 "위대한 칸"
 leader_trait_great_khan_desc:0 "위대한 칸은 카리스마 넘치는 지도자이자 뛰어난 책략가이며, 소문이 사실이라면 강력한 초능력자이기도 합니다."
 leader_trait_ruler_precursor_great_khan:0 "$leader_trait_great_khan$"
 leader_trait_ruler_precursor_great_khan_desc:0 "$leader_trait_great_khan_desc$"
 clones_barbaric_despoiler.22.desc:0 "우리는 생식 능력을 되찾았으며, 첫 신세대 §Y[Root.GetSpeciesNamePlural]§!(이)가 칸국의 제국을 재건할 준비를 마쳤습니다. 이들은 선대 칸의 사회를 받아들이고 자녀를 낳아 우리의 미래를 영원히 바꿀 것입니다.\n\n§Y고대 복제 배양소§!는 이제 필요하지 않으므로, 추가 연구가 가능한 모든 부품을 회수하기로 결정했습니다. 우리 국민은 잃어버린 선조의 문명을 다시 사람들로 채우는 데 집중하고 있습니다."
 clones_barbaric_despoiler.23.desc:0 "이토록 은혜롭게 보존된 선구자 칸의 잠재력을 왜 거부해야 합니까? 모든 클론은 위대한 칸의 모습과 §H운명§!을 이어받을 것입니다. 고대 클론 배양소 또한 §H선구자 문명§!을 위대한 칸의 클론으로 채울 강력한 도구입니다.\n\n칸의 위대함을 받아들이는 편이 낫습니다. 첫 §Y[Root.GetSpeciesNamePlural]§! 생산이 완료된 지금, 우리는 그 어느 때보다 강해졌습니다. 완성된 우리 종족이 선구자의 문명을 되찾을 것입니다."
 clones_barbaric_despoiler.23.a:0 "선조의 선물이다. 위대한 칸들의 문명이라니."
 clones_barbaric_despoiler.10.desc:0 "최근 우주에 진출하면서 우리 기원에 대한 의견 차이가 빠르게 분열로 번지고 있습니다. 역사학자들은 우리가 선구자 §H위대한 칸§!의 복제 병사였다는 오랜 이론을 입증했습니다. 이 발견은 위대한 칸의 잊힌 §H선구자 문명§!을 되찾겠다는 새로운 목적의식을 불러일으켰지만, 그 목표에 이르는 방법을 두고 논쟁이 벌어지고 있습니다.\n\n일부는 선구자 위대한 칸을 숭배하고 복종해야 할 신으로 여기며, 우리가 위대한 칸의 계획을 완수하기 위해 만들어졌다고 믿습니다. 그들은 칸을 향한 유전적 의무를 다하는 것만을 원합니다. 다른 이들은 복제 상태에서 벗어나 위대한 칸의 문명에 다시 인구를 채워야 한다고 믿습니다. 복제에 의존하면 멸종에 취약해져 결국 칸의 계획을 실패하게 만들 것이라는 주장입니다.\n\n사실을 확인하고 논쟁을 끝내기 위해 [Root.Owner.GetHomeWorldName]에 발굴지가 마련되었습니다. 우주로 눈을 돌리기 전에 당장 확인할 수 있는 모든 가능성을 조사해야 합니다. 우리의 선구자 문명은 유구합니다. 그 전통은 이곳에서 살고 죽은 수많은 복제인간 세대를 통해 이어져 왔습니다. 모성의 고대 구조물 아래에는 분명 우리를 기다리는 선구자의 문헌이 있을 것입니다."
 clones.10.a:0 "더 조사해 보자!"
 clones_barbaric_despoiler.10.a:0 "§H위대한 칸의 계획§!을 해독해야 한다!"
 clone_army_digsite_barbaric_despoiler_desc:0 "우리 처지를 자각한 이후, §H위대한 칸의 계획§!에 어떻게 접근할지를 둘러싼 논쟁이 우리 종족을 괴롭혀 왔습니다. 우리는 그 계획의 해석이 미칠 영향을 크게 과소평가했습니다. 이 문제가 해결되기 전에는 협력은커녕 사회가 앞으로 나아갈 수도 없습니다. 우리는 합의에 이르려 애쓰며 답을 갈망합니다.\n\n이 발굴 현장은 선조의 위대한 계획을 둘러싼 논쟁에 답할 증거를 찾고, 하나의 해석을 확립하여 마침내 우리를 통합하기 위해 마련되었습니다."
 clones_barbaric_despoiler.11.desc:0 "중앙 발굴 현장에서 §Y고대 클론 배양소§! 하나의 설치 시기를 추정하는 데 성공했습니다. 구조물 아래 토양의 밀도와 구성을 주변 토양과 비교 분석하여 언제 설치되었는지 합리적인 추정치를 얻었습니다.\n\n우리 종족의 시초인 최초의 복제인간은 약 열두 세기 전에 만들어진 것으로 보입니다.\n\n§H위대한 칸의 계획§!에 무관심했던 탓에 여러 세대의 역사가 소실되었습니다. 수많은 일이 우리를 스쳐 지나갔다는 것은 유감스러운 일입니다."
 clones_barbaric_despoiler.12.desc:0 "발굴지 한 곳에서 [Root.Owner.GetSpeciesName]과 닮은 오래된 화석이 발견되었다는 보고가 들어왔습니다. 아주 오래된 화석입니다. 초기 DNA 분석에서 우리의 유전자와 유사성이 확인되었고, 우리의 기원 종족이라는 결론이 나왔습니다. 시설 더 깊은 곳에서 고고학자들은 광대한 §Y$building_clone_army_clone_vat_plural$§! 구역에 둘러싸인 고대 왕좌실로 추정되는 유적을 발견했습니다.\n\n왕좌실의 문헌과 DNA 분석으로 배양소의 목적에 대한 추측이 확인되었습니다. 위대한 칸이나 칸국 사회가 사라질 경우를 대비한 상세한 비상 계획이 존재합니다. 화석과 건축물은 모두 §Y고대 복제 배양소§!의 건설보다 천 년 이상 앞선 것으로 보여, 비상 계획이 실행되었는지... 아니면 끝내 성공하지 못했는지 확신할 수 없습니다.\n\n모든 것이 새롭게 보이기 시작합니다."
 clones_barbaric_despoiler.12.tooltip:0 "우리가 위대한 칸의 백성이라는 운명이 확인되었다."
 clones_barbaric_despoiler.12.vats:0 "§Y$building_clone_army_clone_vat$§! 수용력 §G증가§!"
 clones_barbaric_despoiler.13.desc:0 "우리가 §H위대한 칸§!의 선구 종족을 복제한 존재임을 입증하는 발굴 결과가 사방으로 퍼지기 시작했습니다.\n\n분명한 결론을 부정하기는 어렵습니다. 위대한 칸의 계획은 칸국 사회의 복제인간을 보존하여 언젠가 우리가 잃어버린 선구 문명을 되찾게 하는 것이었습니다."
 clones_barbaric_despoiler.13.a:0 "그렇다. 우리의 운명은 위대한 칸을 돕는 것이다."
 clones_barbaric_despoiler.16.desc:0 "여러 고위 장교가 자발적으로 선대 위대한 칸에 대한 지지를 공개 선언했습니다.\n\n널리 방송된 메시지에서 이들은 위대한 칸의 계획을 정직하게 밝히는 데 필요했던 용기와 지혜, 그리고 자신들과 [Root.GetAdjective] 국민에게 보여 준 믿음에 경의를 표했습니다. 선구 문명을 되찾겠다는 헌신이 이들에게 힘을 주고 미래를 향한 방향을 제시했습니다.\n\n곳곳의 사람들이 동의를 표하며 축하하고, 내려진 결정을 칭송합니다."
 debated_origin_barbaric_despoiler:0 "위대한 칸의 계획에 관한 논쟁"
 debated_origin_barbaric_despoiler_desc:0 "이 사회는 서로 다른 믿음으로 인해 분열을 겪고 있습니다."
 honorable_leadership_barbaric_despoiler:0 "위대한 칸의 계획"
 honorable_leadership_barbaric_despoiler_desc:0 "이 사회는 위대한 칸의 계획에 대한 지도부의 해석을 전적으로 신뢰합니다."
 WEALTH_CREATION:0 "부의 창출"
 WEALTH_CREATION_DESC:0 "§Y부의 창출§! 무역 정책을 채택하면 [Root.GetName]의 호감을 얻습니다."
 civic_corporate_dominion:0 "평화로운 상인"
 civic_corporate_dominion_desc:0 "이 사회는 평화가 사업에 이롭다는 단순한 원칙에 따라 운영됩니다. 이를 위해 공동의 번영을 추구하는 독립 상인들의 느슨한 연합이 정부의 상당 부분을 관리하거나 통제하며, 적어도 영향력을 행사합니다."
 civic_tooltip_corporate_dominion_negative_effects:0 "$t$- §Y군사 운송§! 정책을 사용할 수 §R없습니다§!."
 councilor_corporate_dominion_custom_modifier_desc:0 "§Y외계 무역 회사§!가 $r_trade$ §G+1§! 및 $r_unity$ §G+1§!을 생산합니다"
 job_corporate_researcher:0 "기업 연구원"
 job_corporate_researcher_plural:0 "기업 연구원"
 job_corporate_researcher_desc:0 "기업 과학자들은 과학적 기술과 학문적 지식을 상업적 목적으로 활용합니다."
