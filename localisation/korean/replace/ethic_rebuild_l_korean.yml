 civic_tooltip_globalism_effects:0 "$t$§E무역 우선 정책§!:$TABBED_NEW_LINE$$t$- §Y후보 지원§! 시 행성이 §Y은하 시장§! 개최지로 선정될 확률이 증가합니다.$TABBED_NEW_LINE$$t$- §Y시장 후보 지명§! 결정이 영향력을 소모하지 않습니다.$TABBED_NEW_LINE$$t$- §Y통상 조약§!의 유지에 영향력이 들지 않습니다.$TABBED_NEW_LINE$$t$- §Y무역 복합기업§! 엔클레이브의 우호도가 증가합니다.$TABBED_NEW_LINE$$t$- §Y기업가§! 파벌은 §Y무역 연방§!에 속하면 추가 지지도를 제공합니다.\n$TABBED_NEW_LINE$§E무역 우선 기반 시설§!: $TABBED_NEW_LINE$$t$- 제국 고유 건물인 £building£ §Y성간 무역 센터§! 건설 가능$TABBED_NEW_LINE$$t$- 제국 내 §Y고유 종족§! 수에 따라 제국 전체의 $r_trade$, §Y경제로 인한 외교적 영향력§!, ['concept_starbase_capacity'] 및 $r_consumer_goods$ 생산량을 높입니다."
