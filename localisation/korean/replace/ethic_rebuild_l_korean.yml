 SELECTIVE_BOMBARDMENT:0 "선택적 궤도 폭격"
 SELECTIVE_BOMBARDMENT_DESC:0 "지역 환경에 대한 피해를 최소화하는 §Y궤도 폭격§! 정책을 채택하면 [Root.GetName]의 호감을 얻습니다."
 civic_natural_capitalism:0 "자연 자본주의"
 civic_natural_capitalism_desc:0 "자연 자본주의 또는 환경 자본주의는 인공 자본의 생산 및 사용과 자연 자본의 유지 및 공급 사이의 중대한 상호 의존성을 인정합니다. 생태계 자체가 제공하는 자연적 재화와 서비스를 보존하는 시장 경제 안에서 환경적 지속 가능성을 발전시킬 것을 주장합니다."
 civic_tooltip_natural_capitalism_effects:0 "$t$§E상업화된 생태계§!:$TABBED_NEW_LINE$$t$- §Y천연§! 행성 £blocker£ §H장애물§!은 적절한 수준의 £housing£ §Y주거§!와 함께 £job_trader£ §Y상인§! 직업을 제공하고, 소량의 자원 보너스($r_food$, $r_minerals$ 또는 $r_energy$)를 제공합니다.$TABBED_NEW_LINE$$t$- £blocker£ ['heavy_blockers']은 £job_entrepreneur£ §Y기업가§! 직업도 제공합니다.$TABBED_NEW_LINE$$t$- 희귀 행성 £blocker£ §H장애물§!과 §H특징§!(£blocker£ §Y떠도는 숲§!, £blocker£ §Y거대 생명체§! 등)도 적절한 보너스를 제공합니다.\n$TABBED_NEW_LINE$§E상업 생명 공학§!:$TABBED_NEW_LINE$$t$- £job_biotechnologist£ $job_biotechnologist_plural$가 $r_trade$도 생산합니다.\n$TABBED_NEW_LINE$§E발달한 생태 관광§!:$TABBED_NEW_LINE$$t$- 행성 고유 건물 £building£ §Y생태 관광 센터§!를 건설할 수 있습니다. 이 건물은 £job_entrepreneur£ §Y기업가§! 직업을 제공하고, 고유 §Y천연§! 행성 £blocker£ §H장애물§!마다 현지 $r_trade$과 $r_amenities$를 늘립니다."
 civic_natural_capitalism_corporate:0 "생태 친화적 시장 모델"
 civic_natural_capitalism_corporate_desc:0 "우리 소비자들은 돈을 쓸 때 생태적 영향을 가장 중요한 문제로 여깁니다. 이에 우리는 은하 전역에서 환경에 남기는 영향을 줄이고 지속 가능한 방식으로 재화와 서비스를 생산하기 위해 노력합니다. 환경 보호와 상품 판매를 대립시키지 않고 통합하는 접근법을 택했습니다. \n\n§W-§! §Y상업화된 생태계§!§W: 천연 행성 장애물은§! £job_trader£ §Y상인§! §W직업과 적절한 수준의§! £housing£ §W주거, 소량의 자원 보너스(§!£food£§W,§! £minerals£ §W또는§! £energy£§W)를 제공합니다. 대형 환경 장애물(§! §Y$d_active_volcano$§!§W,§! §Y$d_mountain_range$§! §W또는§! §Y$d_dangerous_wildlife_blocker$§!§W 등)은§! £job_entrepreneur£ §Y기업가§! §W직업도 제공합니다. 희귀 천연 장애물(§! §Y거대 생명체§! §W또는§! §Y방랑하는 숲§!§W 등)도 적절한 보너스를 제공합니다.\n\n-§! §Y상업 생명 공학§!§W:§! £job_biotechnologist£ $job_biotechnologist_plural$§W가§! $r_trade$§W도 생산합니다.\n\n-§! §Y발달한 생태 관광§!§W: 행성 고유 건물§! £building£ §Y생태 관광 센터§!§W를 건설할 수 있습니다. 이 건물은§! £job_entrepreneur£ §Y기업가§! §W직업을 제공하며, 고유 천연 장애물마다 현지§! $r_trade$ §W및§! $r_amenities$§W를 늘립니다.§!"
 tech_industrial_biotech:0 "산업 생명 공학"
 tech_industrial_biotech_desc:0 "$r_food$을 소비해 $r_energy$, $r_consumer_goods$, $r_alloys$을 생산하는 £job_biotechnologist£ §Y생명 공학자§! 직업을 제공하는 §Y생체 처리 공장§!을 건설할 수 있습니다. 비암석류 제국의 $job_artisan_plural$과 $job_foundry_plural$는 $r_consumer_goods$ 및 $r_alloys$ 생산에 필요한 자원이 $r_minerals$ §G-1§!, $r_food$ §G+1§!만큼 변합니다."
 job_biotechnologist:0 "생명 공학자"
 job_biotechnologist_plural:0 "생명 공학자"
 job_biotechnologist_desc:0 "과학과 공학의 결합을 통해 환경에 무해한 기술을 사용하여 생체 물질을 산업 원료로 가공하는 전문가입니다."
 job_biotechnologist_effect_desc:0 "£job_biotechnologist£ $job_biotechnologist_plural$는 $r_food$을 $r_energy$, $r_consumer_goods$, $r_alloys$으로 전환합니다."
 mod_job_biotechnologist_add:0 "$job_biotechnologist$ 직업"
 mod_job_biotechnologist_per_pop:0 "$VALUE$팝마다 $job_biotechnologist$ 직업 §G+1§!"
 mod_job_biotechnologist_per_pop_short:0 "\n$VALUE$ £pop£마다 £mod_job_biotechnologist_add£ §G+1§!"
 building_biofuel_plant:0 "생체 처리 공장"
 building_biofuel_plant_desc:0 "이 시설에는 다양한 식물과 작물에서 화합물을 분리하고 추출할 수 있는 산업 장비가 있습니다. 이러한 화합물은 추가 연구와 가공을 거쳐 바이오 연료, 복합 소재 및 소비재로 활용됩니다."
 building_pirate_haven:0 "해적 소굴"
 building_pirate_haven_desc:0 "행성 표면의 외딴곳에 숨겨진 도시로, 해적과 불한당들이 모여 함선을 수리하고 무용담을 나눕니다."
 building_pirate_haven_2:0 "해적 소굴"
 building_pirate_haven_2_desc:0 "행성 표면의 외딴곳에 숨겨진 도시로, 해적과 불한당들이 모여 함선을 수리하고 무용담을 나눕니다."
 job_soldier_pirate:0 "해적"
 job_soldier_pirate_plural:0 "해적"
 job_soldier_pirate_desc:0 "현지 해적들은 군의 다양한 직책에서 활동하며, 지상군과 해군 작전에 필요한 신병을 꾸준히 공급합니다."
 job_soldier_pirate_effect_desc:0 "[soldier.GetIcon] [soldier.GetNamePlural](은)는 £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!과 $r_stability$를 증가시키고 £defense_army£ §Y방위군§!을 생성합니다."
