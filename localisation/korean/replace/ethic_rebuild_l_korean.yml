 building_thermal_borehole:0 "지열 시추공"
 building_thermal_borehole_desc:0 "지열 시추공은 행성의 맨틀을 뚫고 행성의 중심부까지 채굴합니다. 풍부한 광물과 에너지의 원천이 될 수 있지만, 방출되는 엄청난 양의 열로 인해 자연 환경에 심각한 피해를 입힐 수 있습니다."
 building_thermal_borehole_2:0 "열굴착 채굴기"
 building_thermal_borehole_2_desc:0 "열굴착 채굴기는 기존 맨틀 시추의 한계를 뛰어넘습니다. 개선된 열 도관과 강화된 수직갱으로 초고밀도 광물층에 접근하여 생산량을 크게 늘리지만, 극심한 지열 응력을 방출해 주변 생태계를 불안정하게 만듭니다."
