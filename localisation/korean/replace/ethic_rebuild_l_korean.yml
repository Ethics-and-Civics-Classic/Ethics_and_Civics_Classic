 job_xenoranger_plural:0 "외계 순찰대원"
 job_xenoranger_desc:0 "외계 생명체를 보전하고 보호하며 연구하는 공무원입니다."
 job_xenoranger_effect_desc:0 "£job_ranger£ $job_xenoranger_plural$은 많은 $r_society$를 생산합니다."
