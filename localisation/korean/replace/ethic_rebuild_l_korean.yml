 civic_imperial_cult_desc:0 "이 사회에는 통치자를 살아 있는 신으로 숭배하는 지배적인 국교가 있습니다."
 civic_imperial_cult_effects:0 "$t$- £building£ §Y수도 건물§!의 £job_politician£ §Y$job_politician$§! 직업을 £job_high_priest£ §Y$job_high_priest_plural$§!로 대체.$TABBED_NEW_LINE$- £building£ §Y신성 연결체§!와 £building£ §Y신앙의 성채§!가 추가 £job_high_priest£ §Y대사제§! 직업 제공.\n$TABBED_NEW_LINE$- £job_priest£ §Y$job_priest_plural$§!가 추가 $r_unity$ 생산.$TABBED_NEW_LINE$- §E신황제§!: 현재 통치자를 §H불멸§!로 만드는 특수 §Y시행령§! 허용.\n$TABBED_NEW_LINE$§E조합 가능§!:$TABBED_NEW_LINE$$t$- ['civic_tooltip_spiritualist_machine_cult_combo', $civic_machine_cult$] 사회 제도와 조합 시 고유 효과 획득."
