 building_tribal_palace:0 "제국 안보부"
 building_tribal_palace_desc:0 "제국의 규모가 커지면 외부 위협도 커지므로, 이 부서는 정치적·행정적으로 갈수록 중요해집니다. \n\n£job_tribe_speaker£ $job_tribe_speaker$의 통치자 직업을 제공합니다. 이들은 제국이 소유한 §Y행성§! 수에 따라 §Y£mod_country_edict_fund_add£ $MOD_COUNTRY_EDICT_FUND_ADD$§!, $i_naval_capacity$, §Y항성 기지 한도§!, $r_influence$에 제국 전체 보너스를 제공합니다. 효과는 행성 수가 §G5+§!에서 §G25+§!까지 늘어날수록 단계적으로 증가합니다(5/10/15/20/25+행성)."
