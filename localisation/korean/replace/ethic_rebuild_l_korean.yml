 mod_job_mining_engineer_per_pop_short:0 "\n$VALUE$ £pop£마다 £mod_job_mining_engineer_add£ §G+1§!"
 job_high_priest_desc:0 "안내자가 스스로 길을 찾고자 할 때는 누구에게 의지할까요? 더 노련한 또 다른 안내자입니다.\n\n§R!§! §W직업 요구 조건:§! £pops£ §H$ethic_spiritualist$§!"
 job_high_priest_effect_desc:0 "£job_high_priest£ $job_high_priest_plural$는 $r_consumer_goods$를 $r_unity$, $r_amenities$ 및 £pops£ §H$ethic_spiritualist$§! 선호도로 전환합니다."
 job_priest_desc:0 "가장 경건하고 독실한 이들이 대중에게 영적인 가르침을 제공합니다.\n\n§R!§! §W직업 요구 조건:§! £pops£ §H$ethic_spiritualist$§!"
 job_priest_effect_desc:0 "£job_priest£ $job_priest_plural$는 $r_consumer_goods$를 소비해 $r_unity$과 $r_amenities$를 생산하고, £pops£ §H$ethic_spiritualist$§! 선호도를 높입니다"
 job_preacher_desc:0 "번영의 전도사는 대중에게 좋은 소식을 전합니다. 대의를 위해 소액의 기부금만 낸다면 누구나 번영할 수 있다는 것입니다.\n\n§R!§! §W직업 요구 조건:§! £pops£ §H$ethic_spiritualist$§!"
 job_preacher_effect_desc:0 "£job_preacher£ $job_preacher_plural$는 $r_consumer_goods$를 $r_unity$, $r_trade$, $r_amenities$ 및 £pops£ §H$ethic_spiritualist$§! 선호도로 전환합니다."
