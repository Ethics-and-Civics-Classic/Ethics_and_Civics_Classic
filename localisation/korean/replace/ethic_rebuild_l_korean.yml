 job_pirate_lord_enforcer_desc:0 "이 해적들은 해적 군주의 칙령을 집행하는 대가로 두둑한 보수를 받습니다."
 job_pirate_lord_enforcer_effect_desc:0 "[enforcer.GetIcon] [pirate_lord_enforcer.GetNamePlural]는 £crime£ §Y$PLANET_CRIME_TITLE$§!를 줄이고 £defense_army£ §Y방위군§!을 생성하며, $r_trade$을 보수로 받아 $r_unity$을 생산합니다"
