 building_tribal_council:0 "순수 재판소"
 building_tribal_council_desc:0 "진실부의 순수성 심판관들이 지속 가능한 사회 발전에 관한 문제를 정기적으로 제기합니다. \n\n고유 통치자 직업 £job_the_elder£ $job_the_elder$을 제공하고, 현지 £society_research£ 사회학 연구, £amenities£ 편의, §Y안정도§!를 높입니다. 효과는 행성의 §Y팝§! 수가 §G40§!에서 §G200+§!까지 늘어날수록 단계적으로 증가합니다(40/80/120/160/200+팝). 유지비도 그에 맞춰 증가합니다."
