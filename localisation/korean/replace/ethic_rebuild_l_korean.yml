 job_bath_attendant_desc:0 "돌연변이성 스파의 숙련된 관리원입니다. 과도한 해독과 세심하게 조절된 유전자형 퇴화를 비롯한 다양한 서비스를 통해 고객의 건강을 유지하는 것이 삶의 목적입니다.\n\n§R!§! §W직업 요구 사항§! £pops£ §H$ethic_industrial$§!"
 job_toxic_baths_effect_desc:0 "£job_bath_attendant£ 변이 유발 스파 관리인은 $r_consumer_goods$를 소비해 £pops£ §Y팝 성장§! 및 £pops£ §H$ethic_industrial$§! 선호도를 높이지만, \n£happiness£ §R행복도§!, £planet£ §R거주 적합도§! 및 £pops£ §H$ethic_green$§! 선호도를 낮춥니다."
 job_overlord_bath_attendant_desc:0 "돌연변이성 스파의 숙련된 관리원입니다. 과도한 해독과 세심하게 조절된 유전자형 퇴화를 비롯한 다양한 서비스를 통해 고객의 건강을 유지하는 것이 삶의 목적입니다.\n\n§R!§! §W직업 요구 사항§! £pops£ §H$ethic_industrial$§!"
