 building_pan_galactic_forum:0 "범은하 포럼"
 building_pan_galactic_forum_desc:0 "£job_head_ambassador£ $job_head_ambassador$ 통치자 직업을 제공합니다. 이 직업은 제국 내 §Y고유 종족§!의 수에 따라 제국 전체에 §Y외교적 영향력§!, $r_society$, $r_unity$, $r_trade$ 보너스를 제공합니다. 보너스는 종족 수가 §G10§!에서 §G100+§!까지 늘어날수록 단계적으로 증가합니다(10/25/40/55/70/85/100+종족)."
