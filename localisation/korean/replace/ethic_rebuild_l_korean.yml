 job_red_death_knight_desc:0 "붉은 죽음의 기사는 언데드 군대가 시선을 끌기 위해 입는 화려한 붉은 의복과 상징에서 이름을 얻었습니다. 현지 기사단에서 관객을 위한 대규모 전투를 전문으로 하는 죽음의 기사들로, 관객을 만족시키기 위해 전술 대신 물량과 잔혹함을 앞세우고 종교적 희생과 의례적인 싸움으로 이목을 사로잡습니다."
