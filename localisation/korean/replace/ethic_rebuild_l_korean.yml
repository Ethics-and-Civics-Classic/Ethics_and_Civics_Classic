 civic_tooltip_consumerism_effects:0 "$t$- £job_trader£ §Y교역상§! 100명당 $r_trade$ §G+1§!.$TABBED_NEW_LINE$- £job_trader£ §Y교역상§! 100명당 $r_amenities$ §G+100§!.$TABBED_NEW_LINE$- £job_artisan£ §Y직공§! 100명당 $r_consumer_goods$ §G+1§!.$TABBED_NEW_LINE$- £job_entertainer£ §Y연예인§! 100명당 $r_amenities$ §G+200§!.$TABBED_NEW_LINE$- £zone£ §Y상업 구역§!, £building£ §Y대형 상업 단지§!, £district£ §Y도시 지구§!, £district£ §Y링 월드 상업 지구§!가 추가 £job_trader£ §Y교역상§! 및 £job_entrepreneur£ §Y기업가§! 직업을 제공합니다.$TABBED_NEW_LINE$- £building£ §Y대형 상업 단지§!가 $r_unity$을 생산합니다.$TABBED_NEW_LINE$- £job_entrepreneur£ §Y기업가§! 직업이 지역 $r_amenities$ 및 $r_consumer_goods$ 생산을 개선합니다.$TABBED_NEW_LINE$- §Y기업가§! 파벌이 §Y소비자 후생§! 무역 정책에 추가 지지도를 제공합니다."
 civic_consumerism_corporate:0 "다크 패턴 마케팅"
 civic_consumerism_corporate_desc:0 "이 거대 기업은 표적 광고의 기술을 거의 완성했습니다. 이들이 장악한 시장에서는 거부할 수 없을 만큼 중독적인 구매 유혹이 정확히 소비자를 겨냥합니다. 사세요, 또 사세요!"
 civic_tooltip_consumerism_corporate_effects:0 "$civic_tooltip_consumerism_effects$\n$BOB_factory_tooltip$\n$BOB_energy_tooltip$"
 PLURALISM_POPS:0 "다원주의 사회"
