 envoy_events.210.desc.spiritualist:0 "$envoy_events.210.desc.start$ 이 사절은 신성한 문제를 대하는 우리 국민들의 태도를 거의 경멸하는 듯합니다. 우주 창조에 대한 불경한 주장부터 속박 없는 AI의 허용까지, 점점 더 많은 사안에서 [envoy_country.GetAdj]의 관점에 동조하고 있습니다. 이를 따져 묻자 사절은 이렇게 응수했습니다.\n\"우리 [Root.GetName](은)는 너무 오래 과거에 머물렀습니다. 이제 미래를 받아들여야 합니다.\"\n\n$envoy_events.210.desc.end$"
