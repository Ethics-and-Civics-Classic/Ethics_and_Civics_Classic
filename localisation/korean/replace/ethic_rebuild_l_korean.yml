 civic_symbiotic_race:0 "사회적 공생"
 civic_symbiotic_race_desc:0 "인공적으로 설계된 신체적으로 강인한 제2종족이 이 사회의 필수적인 일부를 이룹니다. 뚜렷한 차이에도 불구하고 공동의 모성을 다스리는 주종족은 다양한 생명 형태에 공감하는 성향 덕분에 이들을 동등한 존재로 여깁니다."
 civic_tooltip_symbiotic_race_effects:0 "$t$- 다른 종속 종족의 £pop£ 팝 §Y1200§!명을 보유한 채 시작합니다. 이 종족은 §Y공생§! 특성을 지니며, §Y지도자§!를 배출하고 §Y전문가§! 직업에 종사할 수 있습니다.$TABBED_NEW_LINE$- £society£ ['concept_tech_genome_mapping'] 및 £society£ ['concept_tech_epigenetic_triggers'] 기술을 보유한 채 시작합니다.$TABBED_NEW_LINE$- £building£ §Y클론 배양소§!가 행성의 $r_unity$ 생산량을 늘립니다.$TABBED_NEW_LINE$- §Y지성화§!에 성공하면 10년 동안 제국 전체의 $r_unity$ 및 $r_society$를 늘리는 보정치를 얻습니다.\n$TABBED_NEW_LINE$- §Y기술주의자§! 파벌은 §Y설계된 진화§! 승격 특전을 채택하면 기뻐합니다.\n$BOB_xeno_outreach_tooltip$"
 civic_slave_race:0 "노예 종족"
 civic_slave_race_desc:0 "인공적으로 설계된 신체적으로 강인한 제2종족이 이 사회의 필수적인 일부를 이룹니다. 주종족은 이들을 열등한 존재로 선언하고, 오직 고된 노동과 온갖 무자비한 유전 실험에만 적합하다고 여깁니다."
 civic_tooltip_slave_race_effects:0 "$t$- 다른 예속 종족의 £pop£ 팝 §Y1200§!을 보유한 채 시작합니다. 이 종족은 §Y노예 유전자§! 특성을 지니며 주로 단순 노동과 지상전에 능숙합니다.$TABBED_NEW_LINE$- £society£ ['concept_tech_genome_mapping'] 및 £society£ ['concept_tech_neural_implants'] 기술을 보유한 채 시작합니다.$TABBED_NEW_LINE$- 외계종 £pop£ 팝을 섭취하면 $r_society$를 얻습니다.\n$BOB_security_tooltip$"
 gov_xenophile_democracy:0 "다문화 민주정"
 gov_xenophile_democracy_desc:0 "이 사회는 같은 세계에서 살아가는 다양한 종족과 문화를 대표하는 가장 명예로운 인사들로 구성된 선출 의회가 통치합니다."
 trait_symbiotic:0 "공생"
 trait_symbiotic_desc:0 "§L이 종족은 더욱 진화된 다른 종족과 함께 진화했습니다. 그럼에도 불구하고 이들은 모성의 주 종족과 동등한 존재로 간주되며 사회의 중요한 일원으로서 받아들여집니다.§!"
