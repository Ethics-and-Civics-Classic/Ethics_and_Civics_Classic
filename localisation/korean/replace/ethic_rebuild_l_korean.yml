 dec_bureaucracy:0 "성간 평의회"
 dec_bureaucracy_desc:0 "이 정부는 국가의 모든 사안을 감독하는 거대한 관료 조직을 운영하는 이사와 여러 관리들의 위원회가 권력을 쥔 과두정입니다."
 star_bureaucracy:0 "성간 행정부"
