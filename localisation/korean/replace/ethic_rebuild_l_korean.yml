 factions.1.desc.prosperity:0 "이 세력의 구성원들은 제국이 사회·경제적 번영과 평화로운 수단을 통한 안정에 주력하도록 영향력을 행사합니다."
 factions.1.desc.progressive:0 "이 세력의 구성원들은 모든 제국민의 자유와 정의를 추구합니다.\n\n"
 factions.1.desc.bankers:0 "이 세력의 구성원들은 국가가 금융 성장과 자유 시장 발전에 주력하도록 로비 활동을 벌입니다.\n\n"
 factions.1.desc.socialists:0 "이 세력의 구성원들은 제국의 모든 구성원이 경제적 평등을 누릴 수 있도록 노력합니다.\n\n"
 factions.1.desc.environmentalists:0 "이 세력의 구성원들은 제국이 환경 보호에 주력하도록 노력합니다.\n\n"
 factions.1.desc.manufacturers:0 "이 세력의 구성원들은 제국이 산업 발전에 주력하도록 노력합니다.\n\n"
 factions.2000.desc.progressive:0 "이 파벌을 정부에 받아들인 결과, §H자유주의적§! 성향이 한층 뚜렷해졌습니다.\n\n"
 factions.2000.desc.bankers:0 "정부가 해당 세력을 수용함에 따라, 제국의 §H경쟁주의 성향§!이 더욱 강하게 드러나게 되었습니다.\n\n"
 factions.2000.desc.socialists:0 "정부가 해당 세력을 수용함에 따라, 제국의 §H협동주의 성향§!이 더욱 강하게 드러나게 되었습니다.\n\n"
 factions.2000.desc.environmentalists:0 "정부가 해당 세력을 수용함에 따라, 제국의 §H생태주의 성향§!이 더욱 강하게 드러나게 되었습니다.\n\n"
 factions.2000.desc.manufacturers:0 "정부가 해당 세력을 수용함에 따라, 제국의 §H산업주의 성향§!이 더욱 강하게 드러나게 되었습니다.\n\n"
