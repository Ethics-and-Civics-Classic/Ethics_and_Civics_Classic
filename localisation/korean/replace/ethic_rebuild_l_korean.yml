 job_head_commander_effect_desc:0 "£job_head_commander£ $job_head_commander$은 제국의 §Y고유 종족§! 수에 따라 §Y함대 수용력§!, §Y함대에서 얻는 외교적 영향력§!, $r_trade$ §Y생산량§!, §Y첩보망 규모§!에 제국 전체 보너스를 제공합니다. 종족 수 §G10§!부터 §G100+§!까지, 10/25/40/55/70/85/100/100+ 구간마다 효과가 증가합니다. £energy£ 에너지 유지비도 그에 맞춰 조정됩니다. 현지 §Y방위군§!도 생성합니다."
