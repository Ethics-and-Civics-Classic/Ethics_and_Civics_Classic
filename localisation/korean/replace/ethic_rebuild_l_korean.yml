 tech_terraform_uninhabit_molten:0 "용암 행성 테라포밍"
 tech_terraform_uninhabit_molten_desc:0 "충분한 시간과 자원을 들이면 가장 척박한 행성도 거주 가능한 곳으로 바꿀 수 있습니다.\n\n"
