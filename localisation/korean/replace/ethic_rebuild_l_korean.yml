 TOTAL_ISOLATIONISM:0 "고립주의 철학"
 TOTAL_ISOLATIONISM_DESC:0 "§Y고립주의§! 사회 제도를 활성화하면 [Root.GetName]의 지지를 얻습니다."
 civic_welfare_state:0 "사회 국가"
 civic_welfare_state_desc:0 "이 사회에서 국가는 시민의 경제적·사회적 평등과 복지를 보호하고 증진하는 핵심 역할을 맡기에, 전통적으로 상당한 권한을 지닙니다."
 civic_welfare_state_effects:0 "$t$- §H공공 의료§! 정책을 언제나 §G사용할 수 있습니다§!.$TABBED_NEW_LINE$- £district£ §Y도시 지구§!가 £housing£ §Y주거§! §G+100§!을 제공합니다.$TABBED_NEW_LINE$- £building£ §Y수도 건물§!이 £job_healthcare£ §Y$job_healthcare$§! 직업 §G+100§!개를 제공합니다.$TABBED_NEW_LINE$- £job_healthcare£ §Y$job_healthcare_plural$§! 100명당 $r_amenities$ §G+200§!.$TABBED_NEW_LINE$- £job_politician£ §Y$job_politician_plural$§! 100명당 $r_amenities$ §G+200§!.\n$BOB_xeno_outreach_tooltip$"
