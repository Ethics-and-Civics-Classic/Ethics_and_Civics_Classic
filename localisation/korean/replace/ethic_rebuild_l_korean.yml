 civic_evangelism:0 "복음 전도"
 civic_evangelism_desc:0 "이 문명의 사람들은 우주의 모든 지성체가 더 높은 정신으로 이어져 있다고 진심으로 믿습니다. 이제 이들은 은하 전역에 신앙을 전파하고자 합니다."
 civic_tooltip_evangelism_effects:0 "$t$- 제국 고유 건물 £building£ §Y은하 통합의 신전§!을 건설할 수 있습니다. 이 건물은 제국 내 §Y고유 종족§! 수에 따라 $r_unity$, §Y팝에서 얻는 외교적 영향력§!, £happiness£ §Y행복도§!, §Y이주 유도치§!, §Y외계종 선호 윤리관 선호도§!에 제국 전체 보너스를 제공합니다.\n$BOB_embassy_tooltip$\n$BOB_temple_tooltip$"
 building_galactic_navy_academy:0 "성간 군사 조정 센터"
 building_galactic_navy_academy_desc:0 "£job_head_commander£ $job_head_commander$의 통치자 직업을 제공합니다. 이들은 제국의 §Y고유 종족§! 수에 따라 §Y함대 수용력§!, §Y함대에서 얻는 외교적 영향력§!, $r_trade$ §Y생산량§!, §Y첩보망 규모§!에 제국 전체 보너스를 제공합니다. 효과는 종족 수가 §G10§!에서 §G100+§!까지 늘어날수록 단계적으로 증가합니다(10/25/40/55/70/85/100/100+종족). 현지 §Y방위군§!도 생성합니다."
