 building_national_park:0 "국립 생태 공원"
 building_national_park_desc:0 "이 행성의 자연적 경이는 국가적으로 중요한 자산으로 지정되어 정부의 특별 보호를 받습니다. \n\n§Y자연§! £blocker£ 장애물을 제거하려면 추가 영향력이 필요합니다."
 gov_timocracy:0 "금권정"
 gov_timocracy_desc:0 "소유한 재산의 양에 따라 선거권과 피선거권이 결정되는 공화정입니다."
