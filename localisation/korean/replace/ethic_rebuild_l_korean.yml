 allow_dead_terraform:0 "§Y얼어붙은§!, §Y용암§!, §Y유독§! 행성처럼 생명이 없는 행성을 특정 거주 가능 유형으로 테라포밍할 수 있는 특수 기술을 잠금 해제합니다."
 civic_genetic_aristocracy:0 "유전 귀족제"
 civic_genetic_aristocracy_desc:0 "이 물질주의 사회에서는 전통적으로 유전적 우월성을 주된 기준으로 선발하고 양성한 인물들이 지도자의 자리를 차지합니다.\n§W$BOB_retreat_tooltip$§!"
 gov_great_houses:0 "대가문"
 gov_great_houses_desc:0 "이 국가는 고대 씨족과 부족에서 유래한 소수의 명문 가문으로 구성된 지도자 평의회가 통치합니다. 현재는 대부분의 가문이 정당으로서 기능하고 있습니다. 전통적인 귀족과는 달리 가문의 구성원은 출생이나 결혼과 같은 혈통에 얽매이지 않고, 가문에 대한 충성을 서약하고 전통을 준수하기만 하면 누구나 가문에 입적되어 최고 계급까지 올라갈 수 있습니다."
 GENETIC_SUPERIORITY:0 "유전적 우월성"
 NO_GENETIC_SUPERIORITY:0 "유전적 우월성"
 GENETIC_SUPERIORITY_DESC:0 "§Y생체 변형§! 승격 특전을 채택하면 [Root.GetName]이 기뻐할 것입니다."
 mod_planet_pops_minerals_upkeep_mult:0 "팝 광물 유지비"
 personality_evangelising_zealots_machine:0 "전도하는 광신자"
 personality_evangelising_zealots_machine_desc:0 "전도하는 광신자는 은하 전체에 자신의 신앙을 퍼뜨리려 하며, 군사력을 이용해 남들에게 자신의 믿음을 받아들이도록 강요하는 것을 주저하지 않습니다."
 personality_spiritual_seekers_machine:0 "영적 구도자"
 personality_spiritual_seekers_machine_desc:0 "영적 구도자들은 모든 생명이 더 높은 힘으로 연결되어 있으며, 그 힘이 창조한 것들을 통해 이를 이해할 수 있다고 믿습니다. 이들은 신성과의 연결을 연구하고자 다른 제국과 평화로운 협력을 추구합니다. $TABBED_NEW_LINE$ $BOB_temple_tooltip$"
 ethic_storm_interaction_desc_tooltip:0 "\n\n§Y우주 폭풍§!의 영향을 받는 £planet£ §H식민지§!:\n - £job_entertainer£ $job_entertainer_plural$이 £job_storm_dancer£ $job_storm_interpreter_plural$로 변경\n - £job_storm_dancer£ $job_storm_interpreter_plural$가 더 많은 $r_unity$ 생산"
 ethic_industrial:0 "산업주의"
 ethic_fanatic_industrial:0 "광적인 산업주의"
 ethic_industrial_desc:0 "§L산업주의자들은 자신을 생물권의 주인으로 여기는 자기 종족 중심적 가치관을 공유합니다. 다른 생물 종을 차별하게 되더라도 자신들의 번영을 위해 자연과 자원을 이용할 도덕적 권리가 있다고 믿습니다. 이를 '생물권 엘리트주의'라고 부를 수도 있습니다.§!$ethic_storm_interaction_desc_tooltip$$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_industrial_desc:0 "§L우리는 발명을 통해 먼지 속에서 문명을 일으키고 자연의 힘을 의지에 굴복시켰습니다. 우리의 명령에 다른 행성들이 부를 내어놓으면 거대한 공장들이 이를 거두어들일 것입니다. 이 힘은 쓰이기를 요구하며, 우리는 이를 사용해 은하를 우리의 모습대로 재창조할 것입니다.§!\n\n§Y재활용 운동§! 시행령을 사용할 수 없습니다.$ethic_storm_interaction_desc_tooltip$$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_green:0 "생태주의"
 ethic_fanatic_green:0 "광적인 생태주의"
 ethic_green_desc:0 "§L생태주의자는 자신과 자신이 사는 생물권 사이에 존재론적 구분이 없으며, 어떤 지성 종족도 자연 위에 있지 않다는 가치관을 따릅니다. 따라서 이를 '생물권 평등주의'로 볼 수 있습니다. 생태주의 경제는 지속 가능한 발전을 바탕으로 하며, 자연 자원의 효율적 이용, 절제된 소비, 통제된 인구 성장을 지향합니다.§!$ethic_storm_interaction_desc_tooltip$$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_green_desc:0 "§L우리 음악가들은 야생의 노래와 나무의 속삭임만큼 깊은 선율을 작곡하지 못합니다. 우리 예술가들은 산봉우리와 외딴 호수, 광활한 동굴의 형언할 수 없는 장엄함을 담아내지 못합니다. 누군가의 뜻이든 우연이든, 우리는 자연의 초월적인 아름다움이 가득한 우주에 태어났습니다. 이를 계속 보전하기 위해 치르는 어떤 대가도 지나치지 않습니다.§!$ethic_storm_interaction_desc_tooltip$$ethic_gestalt_consciousness_desc_tooltip$"
