 civic_crowdsourcing_edict:0 "대중 참여 사업"
 edict_civic_crowdsourcing_edict:0 "대중 참여 사업"
 edict_civic_crowdsourcing_edict_desc:0 "모든 분야에서 개방형 특허, 열린 사고, 자발적인 협업과 혁신을 장려하여 모두가 더 나은 내일로 나아가게 합니다."
