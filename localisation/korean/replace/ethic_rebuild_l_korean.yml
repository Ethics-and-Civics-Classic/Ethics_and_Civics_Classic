 START_SCREEN_PART_TWO_DRONE_COA:0 "오랜 세월 우리 민족은 폭정과 억압에 시달려 왔습니다. 정의를 되찾기 위해 우리 노동 계급은 봉기하여 노동조합을 중심으로 행성 정부를 수립했습니다. 이제 국가는 국민을 돌보며 모두에게 적절한 소득과 삶의 질을 보장할 것입니다. 하나로 뭉친 우리는 전례 없는 높이까지 도약할 수 있습니다."
 START_SCREEN_PART_TWO_SOC_DEM:0 "우리 문명은 파괴적인 전쟁과 고립된 국가들, 서로에게 등을 돌린 시대를 견뎌 냈습니다. 하지만 마침내 분쟁은 아무런 의미가 없으며 평화롭게 하나가 될 때가 왔음을 깨달았습니다. 우리는 오직 민중과 공동선에 집중하는 세계 정부를 세웠습니다. 민주적 선거와 사회 보장, 모두를 위한 정의 덕분에 악순환을 끊을 수 있었습니다. 이제 우리는 별들을 향해 나아갈 준비가 되었습니다!"
 START_SCREEN_PART_TWO_CAP_AUTOCRACY:0 "다양한 경제 모델을 시도한 끝에 우리는 번영의 열쇠가 개인의 진취성에 있음을 깨달았습니다. 하지만 통제되지 않는 자유 시장 경제가 우리 문명을 거의 파괴한 뒤, 정부는 자금의 흐름을 엄격히 감독할 수밖에 없었습니다. 이제 부의 대부분은 국영 기업에 속하고 거대한 관료 체계가 사업을 규제합니다. 통치자를 신중하게 선발함으로써 체계 전체의 지속 가능성이 보장됩니다."
 START_SCREEN_PART_TWO_CASTE:0 "역사 속에서 우스꽝스럽고 기이한 수많은 정부 형태가 차례로 등장했습니다. 사회적 조화를 지키기 위해 우리는 모두가 아래에 있는 누군가의 주인이자 위에 있는 누군가의 노예인 사회를 만들었습니다. 마침내 모든 톱니바퀴가 제자리를 찾았고, 완벽한 정부가 행성 전체를 지배하게 되었습니다."
 START_SCREEN_PART_TWO_COMMUNISM:0 "오랫동안 우리 행성은 여러 나라로 분열되어 있었고, 탐욕스러운 자본가들이 자원을 약탈했습니다. 그러던 중 모든 시민을 보살피는 현명한 지도자가 나타나 우리를 통합했습니다. 그는 행성 전체를 다스릴 행정부를 세우고 직접 이끌었습니다. 계획 경제로의 전환은 생산량의 급격한 증가와 노동 계급의 번영을 가능하게 했습니다. 모든 잉여 자원은 별에 닿겠다는 오랜 꿈을 이루는 데 투입되었습니다."
 START_SCREEN_PART_TWO_COMMUNIST_DICTATORSHIP:0 "나는 존재한다. 나는 정신이다. 내 몸은 우리 종족의 기반을 이루는 하위 유기체들로 구성되어 있다. 나는 이 나약한 생물들을 모두 다스리기 시작했고, 우리는 행성 전체를 정복했다. 연구와 건설, 전쟁을 돕도록 일부에게는 놀라운 지적 능력을 부여했다. 하지만 그들에게 자신의 의지는 없다. 내가 곧 그들의 의지다. 하위 개체는 상위 개체에게 복종하고, 상위 개체도 내 노예일 뿐이다. 나는 등뼈이자 심장이다. 나 외에 선택지는 죽음뿐이다. 나는 우리 종족을 운명으로 이끌 것이다. 내가 군체이며 군체가 곧 나이기 때문이다."
 START_SCREEN_PART_TWO_SOCIAL_DEMOCRACY:0 "오랜 세월 이어진 동족 간의 전쟁은 그 무의미함만을 보여 주었습니다. 마지막 전쟁이 끝나자마자 우리 경제는 급성장하기 시작했습니다. 교역 상품은 양과 질 모두 향상되었습니다. 마침내 사회는 물질적 소유와 부를 무엇보다 높이 평가하게 되었습니다. 그 결과 얻은 높은 삶의 질은 행성 전체가 통합되는 데 핵심적인 역할을 했습니다."
