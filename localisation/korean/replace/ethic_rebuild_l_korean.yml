 civic_political_pluralism:0 "공화주의 이상"
 civic_political_pluralism_desc:0 "공화주의는 시민적 덕성과 '공적인 일'로서의 국가라는 개념을 중심으로 합니다. 일반 시민들도 공개 토론이나 선거 등을 통해 어느 정도 정치 생활에 참여합니다."
 civic_meritocracy:0 "고도화된 능력주의"
 civic_meritocracy_desc:0 "이 사회에서는 누구나 동등한 기회 아래 자신의 능력과 노력만으로 출세할 수 있습니다. 따라서 가장 자격 있는 인물들이 지도자의 자리를 차지합니다."
 civic_meritocracy_effect:0 "$t$- §Y지도자§!가 §R부정적§! §Y특성§!을 얻을 확률이 크게 감소합니다.\n$BOB_xeno_outreach_tooltip$"
 civic_beacon_of_liberty:0 "자유의 정신"
 civic_beacon_of_liberty_desc:0 "이 사회는 개인의 자유를 이상으로 삼으며, 각자가 자신의 목표와 야망을 추구하고 실현할 권리를 무엇보다 중시합니다. 중앙 정부의 권한과 관료적 규제를 줄여 혁신을 장려하고 사람과 상품, 생각이 전국을 자유롭게 오가도록 합니다."
 civic_beacon_of_liberty_desc_effect:0 "– §H함선 유형 잠금 해제:§! 민간 개척선. \n- §Y무역 중심지§!의 $r_trade$이 §G+4§! 증가합니다."
 civic_beacon_of_liberty_desc_negative_effect:0 "- §H자유 시장§! 경제 정책을 §R의무적으로§! 사용해야 합니다. \n- §H강제 재정착§!, §H공공 의료§!, §H공공 교육§!, §H노예제§! 정책은 §R허용되지 않습니다§!. \n- 대부분의 경우 §H사회 복지§! 및 §H유토피아적 풍요§! 생활 수준은 §R이용할 수 없습니다§!."
 job_planetary_guard:0 "행성 방위군"
 job_planetary_guard_plural:0 "행성 방위군"
 job_planetary_guard_desc:0 "행성 방위대의 대원입니다. 일반적으로 징집병 또는 민병대원으로 구성됩니다."
 job_planetary_guard_effect_desc:0 "£job_planetary_guard£ $job_planetary_guard_plural$은 §Y군인§!보다 많은 §Y방위군§!을 생성하지만, §Y함대 수용력§!은 제공하지 않습니다."
