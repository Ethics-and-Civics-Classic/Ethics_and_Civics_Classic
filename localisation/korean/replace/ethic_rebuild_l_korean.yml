 TRADE_INNOVATIONS:0 "혁신과 진보"
 TRADE_INNOVATIONS_DESC:0 "§Y혁신과 진보§! 무역 정책을 시행하면 [Root.GetName]이 기뻐할 것입니다."
 job_entrepreneur:0 "기업가"
 job_entrepreneur_plural:0 "기업가"
 job_entrepreneur_desc:0 "기업가는 경제의 핵심적인 역할을 담당합니다. 자신의 역량과 진취성을 바탕으로 수요를 예측하고 새로운 아이디어와 상품, 서비스를 시장에 선보입니다."
 job_entrepreneur_effect_desc:0 "£job_entrepreneur£ $job_entrepreneur_plural$는 $r_food$과 $r_minerals$을 소비하여 $r_trade$을 생산하고 현지 $r_amenities$ 및 $r_consumer_goods$ 생산량을 늘립니다."
