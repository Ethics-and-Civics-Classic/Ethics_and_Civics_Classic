 civic_tribal_aristocracy:0 "불변의 카스트"
 civic_tribal_aristocracy_desc:0 "이 사회는 엄격한 사회 계층화에 따라 주민들이 주인과 노예라는 고정된 위계 집단으로 나뉩니다. §H카스트 제도§!를 의무적으로 채택해야 합니다. §H신 콜로세움§!을 건설하면 §H통합력§! §G+1§!을 추가로 제공합니다."
 civic_noble_aristocracy:0 "철인왕"
 civic_noble_aristocracy_desc:0 "이 사회는 이상적인 귀족정에 따라 운영됩니다. 도덕적·지적 엘리트들이 능력주의 원칙에 따라 통치합니다."
 tech_pragmatic_dev:0 "실용적 행성 개발"
