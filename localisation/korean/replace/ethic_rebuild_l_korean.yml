 civic_circular_economy_desc:0 "재사용, 재제조, 재활용을 적극적으로 활용하여 폐기물과 에너지가 다른 공정의 투입물이 되도록 하는 체계입니다. 자원 투입과 폐기물 및 오염 발생을 최소화하는 경제적으로 효율적인 폐쇄 순환 체계를 구축하는 것이 목표입니다."
