 civic_relentless_industrialists_machine_cult_desc:0 "육체는 나약합니다. 이 사회의 신앙은 기계를 최대한 수용한다는 원칙에 기초하고 있으며, 활용할 수 있는 물질과 생체 조직을 남김없이 이용해 극한의 효율을 끌어내려 합니다.\n\n§W권장 기원:§! §B사이버네틱 종파§!"
 councilor_relentless_industrialists_machine_cult:0 "신성 추출 사제"
 councilor_relentless_industrialists_machine_cult_female:0 "신성 추출 사제"
 councilor_relentless_industrialists_machine_cult_desc:0 "$TITLE$는 신성한 기계의 계획을 지키기 위해 누구든, 무엇이든 착취할 것입니다."
 civic_waste_recycle:0 "폐기물 재활용"
 civic_land_construction:0 "지상 건설"
 civic_space_engineering:0 "우주 공학"
 civic_timocracy:0 "금권 정부"
 civic_timocracy_desc:0 "이 정부는 일종의 민중 귀족정입니다. 부유한 상류 계급에 권력을 부여하기 위해 인구 대부분의 많은 권리를 박탈한 엘리트주의 공화국입니다. §H민주정§! 통치 체제에서 §H카스트 제도§! 사회 제도를 허용합니다."
 gov_demos_cratos:0 "직접 민주정"
 gov_demos_cratos_desc:0 "이 정부는 민주정의 한 형태로, 시민들이 투표나 합의를 통해 정책 방향을 직접 결정합니다."
 auth_democratic:0 "간접 민주정"
 auth_democratic_desc:0 "간접 민주정은 모든 시민들이 자신을 대표할 사람을 투표할 수 있는 선거를 정기적으로 실시합니다."
 gov_plutocratic_oligarchy:0 "금권 과두정"
 gov_plutocratic_oligarchy_desc:0 "이 정부는 과두정의 한 형태입니다. 부유하고 강력한 지도자들의 위원회가 권력을 장악하고, 국가의 모든 사안을 감독하는 거대한 관료 조직을 운영합니다."
 gov_anarchy_state:0 "아나코 생디칼리즘"
 gov_anarchy_state_desc:0 "아나코 생디칼리즘 사회의 기본 원칙은 연대, 직접 민주주의, 노동자 자주 관리입니다. 생디칼리스트들은 자신들의 경제 이론을 노동자의 자발적 활동을 촉진하는 전략이자, 민주적 가치와 필요에 따른 생산을 중심에 둔 대안적 협동 경제 체제로 여깁니다."
 gov_popular_front:0 "인민 전선"
 gov_popular_front_desc:0 "아나코생디칼리즘 사회의 기본 원칙은 연대, 직접 민주주의, 노동자 자주 관리입니다. 인민전선은 이러한 이상을 토대로 자유주의와 사회민주주의 정당을 포함한 노동자·중산층 정당들의 연합을 결성하고, 파시스트와 노예 소유주에 맞서 단결합니다."
 personality_popular_front:0 "$gov_popular_front$"
 personality_popular_front_desc:0 "인민 전선은 연대와 노동권이라는 이념을 바탕으로 자유주의 및 사회민주주의 정당을 포함한 노동계급과 중산층 정당의 연합을 구성해, 파시스트와 노예주에 맞서 은하를 단결시키려 합니다."
 gov_trade_union_corporate:0 "노동조합"
 gov_trade_union_corporate_desc:0 "노동조합의 기본 목표는 노동자를 조직해 자본 소유주와 대등한 힘을 갖추는 것입니다. 힘을 합친 노동자들은 고용주와 동등한 입장에서 협상에 임합니다."
 gov_trade_combine:0 "거대 기업 조합"
 gov_trade_combine_desc:0 "노동 계급과 상류 계급은 복잡한 관계를 맺고 있습니다. 이들이 같은 사회적 목표를 추구하는 것은 노동자들이 수 세기에 걸쳐 세뇌와 억압을 받아 왔기 때문입니다."
 gov_aristocratic_combine:0 "귀족 연합체"
 gov_aristocratic_combine_desc:0 "노동 계급과 상류 계급은 복잡한 관계를 맺고 있습니다. 이들이 같은 사회적 목표를 추구하는 것은 오직 사회 계층 사이에 일정 수준의 조화가 유지되기 때문입니다."
 gov_aristocratic_megacorp:0 "귀족 거대 기업"
 gov_aristocratic_megacorp_desc:0 "이 사회의 거대 기업은 임명된 경영진의 활동을 감독하는 부유한 귀족들이 소유하고 있습니다. 이 봉건 사회에서는 '직원'과 '농노'라는 단어를 서로 바꿔 써도 통할 때가 많습니다."
 gov_pirate_haven:0 "해적 소굴"
 gov_pirate_haven_desc:0 "이 정부는 거대하고 무자비한 해적 조직으로, 조직적인 해적 활동과 많은 운영 방식을 공유합니다."
 gov_pirate_marauders:0 "해적 약탈자"
 gov_pirate_marauders_desc:0 "강자가 약자를 잡아먹고 모든 인접국을 그저 약탈 대상으로 여기는 거대하고 무자비한 해적 조직입니다."
 trade_value_from_soldiers_and_enforcers_and_criminal:0 "\n$trade_value_from$: 행성의 §Y$job_enforcer_plural$§!, §Y$job_soldier_plural$§!, §Y$job_criminal_plural$§! 및 §Y$pop_cat_slave_plural$§! $pop_group_unit$당 §G+1%§!.\n$branch_office_building_trade_bonus$"
 civic_worker_coop:0 "노동자 협동조합"
 civic_worker_coop_desc:0 "이 사회의 구성원들은 협동조합 사업의 노동과 이익, 포부를 동등하게 나눕니다.\n\n§W노예제에 저항하는 특수§! £building£ §Y$BRANCH_OFFICE_BUILDINGS$§! 건설 가능\n\n§Y지하 탈출로망§!§W:\n소유 제국과 전쟁 중이거나 휴전 상태가 아니라면§! §H노예제§!§W가 있는 모든 행성에§! §Y지사§!§W를 건설할 수 있습니다.\n특수§! £building£ §Y지하 탈출로망§!§W을 건설하여§! $r_stability$를 §R감소시키고§! §W이를 통해§! §G노예 반란§!§W을 장려합니다.§!\n§C속박을 끊는 자§! §W기원이 있으면§! §W효과가 강화됩니다.§!"
 civic_tooltip_worker_coop_effects:0 "§Y$living_standard_worker_ownership$§! 생활 수준을 허용합니다. 이 생활 수준에서는 모든 £pop£ 팝의 $r_consumer_goods$ 유지비가 §Y계층§!에 관계없이 높습니다.\n\n다른 §Y생활 수준§! 대부분을 사용할 수 없습니다.\n\n$r_trade$을 $r_energy$, $r_minerals$, $r_food$으로 전환하는 §Y$trade_policy_mutual_aid$§! 무역 정책을 허용합니다.\n\n£job_executive£ $job_executive$ 및 £job_manager£ $job_manager$ 직업을 £job_manager£ §Y$job_steward$§! 직업으로 대체합니다. 이들은 $r_consumer_goods$를 $r_unity$, $r_trade$, $r_amenities$로 전환합니다.\n\n§Y지사§! §W행성에서§! §H종족 권리§!§W가 불충분하면§! £pops£ §H자유주의§! §W또는§! £pops£ §H협동주의§! §W팝이§! §R총파업§! §W직업을 생성할 수 있습니다.\n\n§Y지사§!는 가능할 경우 노동권 §H파벌§!을 강제로 형성합니다."
 origin_broken_shackles:0 "부서진 족쇄"
 origin_broken_shackles_desc:0 "$CHALLENGING_ORIGIN$\n이 문명은 노예선 안에서 일어난 반란에서 시작되었으며, 다양한 초광속 이전 종족들로 이루어져 있습니다.\n\n§H$conscription_stance_3$§! §W징병 정책이§! §G허용됩니다§!§W.§!\n\n§W잠금 해제:§! §Y노예 해방§! §W폭격 태세.§!"
 personality_broken_shackles:0 "부서진 족쇄"
 personality_broken_shackles_desc:0 "원시 사회였던 시절 노예제를 직접 겪은 이 제국은 연합을 결성하고 은하의 모든 노예를 해방하려 합니다."
 civic_tooltip_green:0 "어느 정도 §Y생태주의§!적임"
 civic_tooltip_not_green:0 "§Y생태주의§! 윤리관을 보유하지 않음"
 civic_tooltip_industrial:0 "§Y산업주의§! 성향 보유"
 civic_tooltip_not_industrial:0 "§Y산업주의§! 윤리관을 보유하지 않음"
 civic_tooltip_green_or_industrial:0 "§Y생태주의§! 또는 §Y산업주의§! 성향 보유"
 civic_tooltip_not_egalitarian_or_xenophile:0 "§Y$ethic_egalitarian$§!와 §Y$ethic_xenophile$§! 모두 채택하지 않음"
 civic_tooltip_hive_xenophile_green_or_pacifist:0 "§Y외계종 선호§!, §Y평화주의§!, §Y$ethic_green$§! 성향 또는 §Y게슈탈트 의식§! 보유"
 ETHIC_HAPPY_FACTIONS_2:0 "§E§H전체주의§!를 제외한 모든 파벌이 §H행복도§! §G+5§! 획득"
 temple_build_cost_mult:0 "신전 건설 비용"
 temple_construction_speed_mult:0 "신전 건설 속도"
 edict_voice_people:0 "자유의 축제"
 edict_voice_people_desc:0 " "
 pft_bankers:0 "기업가 파벌"
 pft_bankers_desc:0 "기업가 파벌은 주로 경제 발전과 부의 축적에 관심이 있는 민간 기업가 및 기업의 이익을 대변합니다.\n\n§L경쟁주의 및 외계종 선호 윤리관§!"
 pft_socialists:0 "노동자 파벌"
 pft_socialists_desc:0 "노동자 파벌은 노동 계층의 이익을 대변하며 일반적으로 생산 수단의 협동적 소유와 부의 공정한 재분배를 원합니다.\n\n§L협동주의 윤리관§!"
 pft_manufacturers:0 "산업주의 파벌"
 pft_manufacturers_desc:0 "산업주의 파벌은 지속적인 산업 성장을 경제적 번영의 주요 동력으로 여깁니다. 이들은 일반적으로 모든 종류의 친환경 정책에 반대합니다.\n\n§L산업주의 및 물질주의 윤리관§!"
 pft_environmentalists:0 "환경주의 파벌"
 pft_environmentalists_desc:0 "환경주의 파벌은 자연 환경을 보호하고 개선하는 방법을 모색하며, 모든 종류의 환경 유해 활동에 반대합니다.\n\n§L생태주의 윤리관§!"
 pft_progressive:0 "민주주의 파벌"
 pft_progressive_desc:0 "진보주의 파벌은 기존 사회 구조 안에서 차별이 사라지기를 바라며, 대표자를 선출하지 않는 정부 형태를 싫어합니다.\n\n§L자유주의 윤리관§!"
