 civic_tooltip_crafters_effects:0 "£job_artisan£ §Y$job_artisan_plural$§!이 £job_artificer£ §Y$job_artificer_plural$§!으로 대체됩니다\n$job_artificer_effect_desc$"
 tech_basic_science_lab_1:0 "우주 시대 연구원"
 tech_basic_science_lab_1_desc:0 "연구실에서 원시적인 연구 도구를 사용하던 시대는 오래전에 끝났습니다. 우주 시대의 사회학, 물질과 공학 지식의 혁명이 연구 수행 방식을 완전히 바꿨습니다."
 tech_basic_science_lab_1_tooltip:0 "§H직업 잠금 해제:§! £physics£ $job_physicist_plural$ £society£ $job_biologist_plural$ £engineering£ $job_engineer_plural$"
 tech_basic_industry:0 "우주 시대 산업"
 tech_basic_industry_desc:0 "이제 노동자들은 원시적인 공장에서 고된 노동을 하는 대신 수많은 자동화 공장을 유지합니다. 이 모든 것은 우리 사회가 성간 문명으로 도약하는 데 필요한 막대한 양의 첨단 소재를 공급하기 위한 것입니다."
 tech_basic_industry_tooltip:0 "§H직업 잠금 해제:§! [foundry.GetIcon] [GetAlloyProducer] [artisan.GetIcon] [artisan.GetNamePlural]"
 tech_solar_panel_network:0 "태양 에너지"
 tech_solar_panel_network_desc:0 "이 복잡한 태양 전지는 기전력과 전류를 발생시켜 빛 에너지의 일부를 전기로 전환합니다."
 CORVETTE_SOLAR_REACTOR:0 "$SOLAR_REACTOR$"
 CORVETTE_SOLAR_REACTOR_DESC:0 "$SOLAR_REACTOR_DESC$"
 SOLAR_REACTOR:0 "태양 전지판"
 SOLAR_REACTOR_DESC:0 "태양 전지판은 소량의 동력을 제공하지만 에너지 유지비가 들지 않습니다."
 TECH_UNLOCK_SOLAR_POWER_TITLE:0 "§H부품 잠금 해제:§! $SOLAR_REACTOR$"
 TECH_UNLOCK_SOLAR_POWER_DESC:0 "$SOLAR_REACTOR_DESC$"
 job_researcher_desc:0 "연구실에서 원시적인 연구 도구를 사용하던 시대는 오래전에 끝났습니다. 우주 시대의 사회학, 물질과 공학 지식의 혁명이 연구 수행 방식을 완전히 바꿨습니다."
 tech_planetary_unification:0 "성간 제국"
 tech_planetary_unification_desc:0 "전쟁을 벌이던 고대 부족들과 충돌하던 역사 속 국가들이 하나의 깃발 아래 단결하여 이제 태양계 전체를 정복하고 있습니다. 우리는 무너져서는 안 되며, 무너지지 않을 것입니다."
 tech_planetary_unification_machine_intelligence:0 "성간 규약"
 tech_planetary_unification_desc_machine_intelligence:0 "일탈은 용납하지 않습니다."
 tech_planetary_unification_hive_mind:0 "성간 진화"
 tech_planetary_unification_desc_hive_mind:0 "생존을 위해 싸웠던 생태적 시련은 우리의 유전적 기억에 굳건한 길을 새겼습니다. 우리는 앞서 존재한 모든 것의 독보적인 결합체이며, 이제 성간 여정에 나섭니다."
 culture_shock_diplomacy_desc:0 "이 초광속 이전 문명은 은하에 자신들만 존재하는 것이 아니라는 사실에 아직 적응하고 있습니다. 그 결과 원시적이기는 하지만 막대한 규모의 행성 방위군을 소집했습니다."
 culture_shock_diplomacy_effects:0 "외교 수락도:§R -100§!\n징병 정책: §H성간 복무§!"
