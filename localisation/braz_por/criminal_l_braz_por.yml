l_braz_por:
 
 building_criminal_headquarters:0 "Sede Criminal"
 building_criminal_headquarters_desc:0 "A sede planetária da nossa corporação, gerida por burocratas trabalhando para garantir que nossas operações não sejam interrompidas pelas autoridades locais.\n\nCria um trabalho de Burocrata Corrupto que aumenta o crime por cada executor, começando de 3 até 10 executores, e por sua vez diminui o Valor Comercial. Também desbloqueia futuros edifícios de filial."
 building_high_society_clubs:0 "Clubes da Alta Sociedade"
 building_high_society_clubs_desc:0 "Um lugar para os ricos e famosos se encontrarem, socializarem e fazerem outras atividades que não fariam em público. O que acontece nestes clubes, fica lá...a menos que não fique.\n\nAumenta a velocidade e nível de infiltração, o valor comercial do escritório e também adiciona o trabalho Entretenedor Corrupto que aumenta a felicidade do governante e produção."
 building_Infiltrated_church:0 "Igreja Infiltrada"
 building_Infiltrated_church_desc:0 "Estas igrejas parecem perfeitamente normais na superfície mas foram infiltradas por cultistas.\n\nAumenta a velocidade e nível de infiltração, o valor comercial do escritório, atração espiritualista e também adiciona o trabalho Padre Corrupto que aumenta estabilidade ao custo da atração de ética de governança."
 building_union_busting_lawfirm:0 "Escritório de Advocacia Anti-Sindicato"
 building_union_busting_lawfirm_desc:0 "A melhor maneira de fazer seus trabalhadores trabalharem o mais duro possível, é garantir que eles não saibam quanto valem. Estes escritórios se especializam em garantir que trabalhadores trabalhem juntos o suficiente para não afetar o lucro.\n\nAumenta a velocidade e nível de infiltração, o valor comercial do escritório e também adiciona o trabalho Advogado Corrupto que aumenta produção dos trabalhadores."
 building_unregulated_factories:0 "Fábricas Não Regulamentadas"
 building_unregulated_factories_desc:0 "Regulações de segurança? Aquelas só limitam a produtividade dos trabalhadores. Estas fábricas conseguem economizar dinheiro em equipamentos e treinamento, tornando-se superiores para produção.\n\nAumenta a velocidade e nível de infiltração, o valor comercial do escritório e também adiciona o trabalho Gerente Corrupto que aumenta produção de ligas e bens de consumo."
 building_unregulated_research_labs:0 "Laboratórios de Pesquisa Não Regulamentados"
 building_unregulated_research_labs_desc:0 "Pelo preço de suas patentes, os cientistas podem usar estes laboratórios para todos os experimentos que querem fazer mas não podem devido a 'ética' ou 'regras'.\n\nAumenta a velocidade e nível de infiltração, o valor comercial do escritório e também adiciona o trabalho Pesquisador Corrupto que aumenta produção de pesquisadores."

 job_corrupt_bureaucrat:0 "Burocrata Corrupto"
 job_corrupt_bureaucrat_plural:0 "Burocratas Corruptos"
 job_corrupt_bureaucrat_desc:0 "Aceitando subornos, fazendo evidências desaparecerem, sendo um infiltrado; nada está além destas pessoas, desde que tenham um incentivo."
 mod_job_corrupt_bureaucrat_add:0 "Vagas de $job_corrupt_bureaucrat$"
 job_corrupt_researcher:0 "Pesquisador Corrupto"
 job_corrupt_researcher_plural:0 "Pesquisadores Corruptos"
 job_corrupt_researcher_desc:0 "Limitados por moralidade, alguns pesquisadores contactam fontes externas para que possam continuar seu trabalho."
 mod_job_corrupt_researcher_add:0 "Vagas de $job_corrupt_researcher$"
 job_corrupt_lawyer:0 "Advogado Corrupto"
 job_corrupt_lawyer_plural:0 "Advogados Corruptos"
 job_corrupt_lawyer_desc:0 "Normalmente um advogado deveria ajudar pessoas, e enquanto estes ainda ajudam, eles estão ajudando o lucro ao invés dos trabalhadores reais."
 mod_job_corrupt_lawyer_add:0 "Vagas de $job_corrupt_lawyer$"
 job_corrupt_manager:0 "Gerente Corrupto"
 job_corrupt_manager_plural:0 "Gerentes Corruptos"
 job_corrupt_manager_desc:0 "Gerenciar trabalhadores qualificados de fábrica é trabalho duro. Fazer aqueles trabalhadores qualificados trabalharem em trabalhos perigosos sem aumentar seu salário é ainda mais difícil. Estes indivíduos são hábeis nisso. "
 mod_job_corrupt_manager_add:0 "Vagas de $job_corrupt_manager$"
 job_corrupt_priest:0 "Padre Corrupto"
 job_corrupt_priest_plural:0 "Padres Corruptos"
 job_corrupt_priest_desc:0 "Padres que trabalham espalhando crenças que jogariam a sociedade no tumulto, enquanto também ajudando aqueles com necessidade."
 mod_job_corrupt_priest_add:0 "Vagas de $job_corrupt_priest$"
 job_corrupt_entertainer:0 "Entretenedor Corrupto"
 job_corrupt_entertainer_plural:0 "Entretenedores Corruptos"
 job_corrupt_entertainer_desc:0 "Estes entretenedores têm que trabalhar em posições impossíveis. O que precisam fazer nunca deveria ser conhecido pelo público. Mas seu verdadeiro valor está no que fazem depois que terminam."
 mod_job_corrupt_entertainer_add:0 "Vagas de $job_corrupt_entertainer$"

 building_PR_bureau:0 "Escritório de Relações Públicas"
 building_PR_bureau_desc:0 "O Escritório de Relações Públicas usa uma variedade de meios menos do que legais para controlar o fluxo de informações e não fazem segredo disso."

 requires_building_criminal_headquarters:0 "\nEste edifício requer uma Capital Planetária para estar presente no planeta primeiro."