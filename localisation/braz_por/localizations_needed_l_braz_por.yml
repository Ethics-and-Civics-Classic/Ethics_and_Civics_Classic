 # Pirate Combat Instructor
 pirate_comabt_instructor: "$job_pirate_combat_instructor$"
 job_pirate_combat_instructor:0 "Instrutor de Combate Pirata"
 job_pirate_combat_instructor_plural:0 "Instrutores de Combate Pirata"
 job_pirate_combat_instructor_desc:0 "Uma mente afiada é uma ferramenta valiosa para toda frota de corsários. Focar no desenvolvimento ao invés de punição melhora a habilidade de membros da tripulação e mitiga problemas antes que surjam."

 # Steward Captain
 steward_pirate: "$job_steward_pirate$"
 job_steward_pirate:0 "Capitão Administrador"
 job_steward_pirate_plural:0 "Capitães Administradores"
 job_steward_pirate_desc:0 "Como sindicato de trabalho de frotas de corsários cooperativas, a carta sob a qual um capitão pirata pode içar nossa bandeira requer deveres no-planeta assim como no espaço."

# Syndicalist Officer
 steward_pirate_anarchy: "$job_steward_pirate_anarchy$"
 job_steward_pirate_anarchy:0 "Oficial Sindicalista"
 job_steward_pirate_anarchy_plural:0 "Oficiais Sindicalistas"
 job_steward_pirate_anarchy_desc:0 "As demandas de comandar uma embarcação e organizar trabalho exigem muitas competências. Mais importante, devem ser alguém disposto a aceitar o desafio, e então ceder poder quando seu tempo terminar. Não serão respeitados por sua tripulação de outra forma."

 # Offworld Steward Captain
 steward_pirate_offworld: "$job_steward_pirate_offworld$"
 job_steward_pirate_offworld:0 "Capitão Administrador Extramundo"
 job_steward_pirate_offworld_plural:0 "Capitães Administradores Extramundo"
 job_steward_pirate_offworld_desc:0 "Um Capitão Administrador Extramundo atua como um defensor naval não convencional do trabalho, estabelecendo uma relação única com operadores espaciais empreendedores. Eles integram suas redes e ganhos ilegais na estrutura laboral local, resultando em um arranjo próspero para os trabalhadores envolvidos."

