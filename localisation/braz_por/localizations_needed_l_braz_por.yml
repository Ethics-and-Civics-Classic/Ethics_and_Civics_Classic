 # Ark Gardener
 building_nomad_conservatory:0 "Conservatório"
 building_nomad_conservatory_desc:0 "Este santuário é o coração pulsante do ecossistema da $arkship$. É daqui que os controles de suporte de vida dos Jardins da Arca são mantidos."
 building_nomad_conservatory_effect: "£job_ranger£ Vagas de $job_ark_gardener$ de $d_ark_nature_preserve_blocker$ £blocker£ §HBloqueadores§!: §G+1§! £job_ranger£"

 ark_gardener: "$job_ark_gardener$"
 job_ark_gardener:0 "Jardineiro da Arca"
 job_ark_gardener_plural:0 "Jardineiros da Arca"
 job_ark_gardener_desc:0 "Estes administradores cuidadosamente treinados preservam a xenofauna e flora preciosas que encontramos em nossa jornada, às vezes com violência se necessário."
 job_ark_gardener_effect_desc:2 "£job_ranger£ $job_ark_gardener_plural$ produzem $r_society$, $r_unity$, reduzem £crime£ local §Y$PLANET_CRIME_TITLE$§!, geram §Y$defense_army_plural$§! e aumentam §Y$concept_naval_capacity$§."

 mod_job_ark_gardener_add:0 "Vagas de $job_ark_gardener$"
