 # Community Organizer
 organizer: "$job_organizer$"
 job_organizer:0 "Organizador Comunitário"
 job_organizer_plural:0 "Organizadores Comunitários"
 job_organizer_desc:0 "Em uma sociedade não hierárquica, as necessidades de nossos vizinhos são atendidas por organizadores comunitários. Eles distribuem necessidades diárias e coordenam durante emergências."
 job_organizer_effect_desc: "£job_culture_worker£ $job_organizer_plural$ convertem $r_consumer_goods$ em $r_unity$ e $r_amenities$, bem como uma pequena quantidade de $r_food$, $r_minerals$, e $r_energy$."

