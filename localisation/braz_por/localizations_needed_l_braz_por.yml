 council_agenda_agenda_wealth_redistribution_desc:1 "É vital para nossa economia que programas sociais chave não apenas permaneçam bem financiados, mas expandam em seu escopo."
 agenda_wealth_redistribution_finish:0 "$council_agenda_agenda_wealth_redistribution_name$ $agenda_ref$"

 council_agenda_agenda_wealth_redistribution_corp_name:0 "Empresa Sindicalizada"
 council_agenda_agenda_wealth_redistribution_corp_desc:1 "Como parte de nossos esforços cooperativos contínuos, é imperativo revisar frequentemente contratos sindicais dos empregados."
 agenda_wealth_redistribution_corp_finish:0 "$council_agenda_agenda_wealth_redistribution_corp_name$ $agenda_ref$"

