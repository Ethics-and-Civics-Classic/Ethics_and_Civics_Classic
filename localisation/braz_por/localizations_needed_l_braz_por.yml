 pft_environmentalists_nomads:0 "Fação Xenoecologista"
 pft_environmentalists_nomads_desc:1 "Os Xenoecologistas preocupam-se primariamente com a habitabilidade contínua de nossos Arks, e com a preservação do macro-ambiente da galáxia em geral. Opostos às demandas dos Extracionistas por escavação estelar.\n\n§LEcocentrismo ethos§!"

 pft_manufacturers_nomads:0 "Fação Extracionista"
 pft_manufacturers_nomads_desc:1 "Os Extracionistas representam os interesses de astro-mineradores, fabricantes e metalurgistas que mantêm a capacidade operacional de nossos Arks. Desdenham dos ideais dos Xenoecologistas.\n\n§LIndustrialismo ethos§!"

 factions.1.desc.manufacturers_nomads:0 "Seus membros têm estado principalmente preocupados com a escavação de corpos celestes e expansão das reservas operacionais.\n\n"
 factions.1.desc.environmentalists_nomads:0 "Seus membros defendem a conservação da ecologia galáctica e a redução das necessidades operacionais.\n\n"

