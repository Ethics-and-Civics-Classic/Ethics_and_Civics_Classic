 biologist_is_ark_gardener_tt: "£job_biologist£ $job_biologist_plural$ são convertidos em £job_ranger£ $job_ark_gardener_plural$"

 d_ark_nature_preserve_blocker: "Biótopo Jardim"
 d_ark_nature_preserve_blocker_plural: "Biótopos Jardim"
 d_ark_nature_preserve_blocker_desc:0 "Uma seção de nossa $arkship$ foi dedicada à proteção de espécies ameaçadas e extintas de muitos planetas. Este é seu lar, assim como é o nosso."

 decision_expand_biotope: "Expandir Biótopo"
 decision_expand_biotope_short: "Adiciona um §Y$d_ark_nature_preserve_blocker$§! adicional à $arkship$."
 decision_expand_biotope_desc: "Com sistemas de suporte de vida redundantes e monitoramento cuidadoso, podemos recriar com precisão as condições ecológicas de muitas biosferas diferentes."

 # Nomad Naturalism
 civic_naturalism_nomad:0 "Solarpunks Estelares"
 civic_naturalism_nomad_desc:0 "Estes andarilhos se dedicaram a moldar suas $arkship_plural$ na imagem dos planetas que mais amam. Eles não meramente os mimetizam, eles verdadeiramente são mundos móveis."

 building_national_park_nomad:0 "Biosfera da Arca"
 building_national_park_nomad_desc:0 "O interior da $arkship$ é um ecossistema completo, transbordando vida natural. A flora e fauna aqui estão sob proteção especial."

 # Nomad Environmentalism
 civic_environmentalist_nomad:0 "Arco-Ambientais"
 civic_environmentalist_nomad_desc:0 "Estes nômades coletam espécies ameaçadas e extintas dos planetas que visitam. Eles cuidam delas a bordo de suas arcas em uma missão para preservar vida através da galáxia."
 civic_tooltip_environmentalist_nomad_effects:2 "$t$- $AVAILABLE_BUILDINGS$ £building£ ['building:building_nomad_conservatory']$TABBED_NEW_LINE$- $ADDITIONAL_BUILDINGS_STRING$ £building£ §Y$building_nomad_conservatory$§!\n$t$- $AVAILABLE_HOLDINGS$ £building£ ['building:holding_park_ranger_lodge']$TABBED_NEW_LINE$- Concede um §Y$d_ark_nature_preserve_blocker$§! £blocker£§HBloqueador§! adicional no início do jogo.$TABBED_NEW_LINE$- $UNLOCKS_CONTRACT_TYPE$ §Y$conservation_study_special$§!."

# Nomad Keepers of Harmony
 civic_keepers_harmony_nomad:0 "Natureza-Worshippers Nômades"
 civic_keepers_harmony_nomad_desc:0 "Pessoas desta sociedade adoram a santidade dos lugares que visitam. Eles cruzam a galáxia em peregrinações que duram anos para locais sagrados onde natureza e o cosmos estão em perfeita harmonia."
 civic_tooltip_keepers_harmony_nomad_effects:0 "$t$§ESímbiose Divina:§!$TABBED_NEW_LINE$$t$- Substitui £job_bureaucrat£ §Y$job_bureaucrat$§! vagas por únicas £job_priest£ §Y$job_druid$§! vagas.$TABBED_NEW_LINE$$t$- £job_priest£ §Y$job_druid$§! vagas são mais efetivas em $arkship_plural$ com §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBloqueadores§!, proporcionando §Gadicional§! £housing£ §YHabitação§!, e aumentada §Y$MOD_POP_ENVIRONMENT_TOLERANCE$§!.\n$TABBED_NEW_LINE$- £building£ §Y$building_nature_sanctuary_nomad_plural$§! são edifícios únicos que proporcionam aumentada local $r_unity$, £happiness£ §YFelicidade§!, e £pops£ §H$ethic_green$§! atração per §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBloqueadores§! na $arkship$, e requerem $r_food$ para manutenção.\n$TABBED_NEW_LINE$- $UNLOCKS_CONTRACT_TYPE$ §Y$planetary_pilgrimage_special$§!."
 civic_tooltip_keepers_harmony_nomad_negative_effects:0 "$t$§ESímbiose Abandonada:§!$TABBED_NEW_LINE$$t$- Em $arkship_plural$ sem §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBloqueadores§!, §Y$job_druid$§! vagas produzirão §Rmenos§! $r_unity$ do que mesmo um burocrata normal."
 
 building_nature_sanctuary_nomad_plural:0 "Santuários Jardim"
 building_nature_sanctuary_nomad_plural_desc:0 "$building_nature_sanctuary_nomad_desc$"
 building_nature_sanctuary_nomad:0 "Santuário Jardim"
 building_nature_sanctuary_nomad_desc:0 "Este lugar sagrado é onde nosso caminho através das estrelas é enshrined, e nossa harmonia com o ecossistema do vácuo é honrada. Este monumento aumenta local $r_unity$, £happiness£ $HAPPINESS$ e §YEcocentrismo§! atração de ética per §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBloqueadores§!, e requer $r_food$ para manutenção."

 # Nomad Eco Warfare
 civic_eco_warfare_nomad:0 "Biótopos Protetores"
 civic_eco_warfare_nomad_desc:0 "Não apenas estas pessoas estão mais do que prontas e capazes de defender seus biótopos jardim com armas em suas mãos, mas também aprenderam a aplicar efetivamente avanços em ciências biológicas ao militar.\n\n§YNavios Orgânicos§!: Envolver biotecnologia em construção militar permite navios ganharem habilidades especiais, como regeneração de Armadura e Casco, e também tornar-se mais eficientes energeticamente. A desvantagem é que estes materiais são geralmente mais frágeis do que ligas não-orgânicas.\n\n§YMedicina Militar Biotecnológica§!: Saúde do Exército é aumentada."

 civic_tooltip_eco_warfare_nomad_effects:0 "$t$§EProteção Natural§!: Beneficia-se de §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBloqueadores§!$TABBED_NEW_LINE$$t$- Muda £job_entertainer£ §Y$job_entertainer_plural$§! em £job_duelist£ §Y$job_duelist_plural$§!.$TABBED_NEW_LINE$$t$- Cada £blocker£ §HBloqueador§! proporciona §G-5%§! §YDanos de Bombardeio Planetário§!.\n$TABBED_NEW_LINE$§EBiotecnologia Militar§!:$TABBED_NEW_LINE$$t$- $r_minerals$ upkeep per 100 [foundry.GetIcon] §Y[GetAlloyProducer]§! §G-1§!.$TABBED_NEW_LINE$$t$- $r_food$ upkeep per 100 [foundry.GetIcon] §Y[GetAlloyProducer]§! §R+1§!.$TABBED_NEW_LINE$$t$- $r_food$ upkeep per 100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§! §R+1§!.$TABBED_NEW_LINE$$t$- $r_alloys$ produzido per 100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§! §G+0.5§!.\n$BOB_mercs_tooltip$""

