 council_agenda_agenda_environmental_stewards_name:0 "Guardiões Ambientais"
 council_agenda_agenda_environmental_stewards_desc:1 "É nosso dever solene e mais vital garantir a saúde dos ecossistemas de nossos planetas."
 council_agenda_agenda_environmental_stewards_effect:0 "Concede o modificador §Y$natural_beauty$§!, ou aumenta a produção £job_biologist£$job_biologist$, em uma colônia."
 agenda_environmental_stewards_finish:0 "$council_agenda_agenda_environmental_stewards_name$ $agenda_ref$"
