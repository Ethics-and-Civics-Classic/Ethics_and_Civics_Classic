 concept_eco_biologists_desc: "Vários Cívicos §HEcocêntricos§! permitem que biólogos sejam substituídos por variantes especiais e mais produtivas.\n§EBiólogos Xenos§!$TABBED_NEW_LINE$- £job_xenobiologist£ §YBiólogos Xenos§! são versões mais produtivas de £job_biologist£ §Y$job_biologist_plural$§!, produzindo §G50%§! a mais de $r_society$, ao custo de §R33%§! a mais de $r_consumer_goods$.$TABBED_NEW_LINE$- Isso é habilitado pelo §YCívico§! §CEngenharia Ecológica§!, em planetas com os seguintes £blocker£ §HBloqueios§!:$TABBED_NEW_LINE$$t$- £blocker£ §H$d_dangerous_wildlife$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_dense_jungle$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_toxic_kelp$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_noxious_swamp$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_wandering_forests$§!.$TABBED_NEW_LINE$$t$- £blocker£ §HTitanic Lifeforms§!.$TABBED_NEW_LINE$$t$- §HIsolated Valley§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_migrating_forests$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_migrating_forest_reserve$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_savage_wildlands$§!.\n\n§E$job_ranger_plural$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ranger_plural$§! são generalistas que produzem vários recursos além de $r_society$, tais como: $r_unity$, $r_amenities$, £job_criminal£ §Y$PLANET_CRIME_TITLE$§! Redução, §YCapacidade Naval§!, e §YExércitos de Defesa Planetária§!.$TABBED_NEW_LINE$- Isso é habilitado pelo £building£ §YEdifício $building_ranger_lodge$§!, do Cívico §C$civic_environmentalist$§!.$TABBED_NEW_LINE$- Isso também é habilitado pelo Cívico §C$civic_eco_warfare$§!, em planetas com os seguintes bloqueadores:$TABBED_NEW_LINE$$t$- £blocker£ §H$d_massive_glacier$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_noxious_swamp$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_quicksand_basin$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_toxic_kelp$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_dense_jungle$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_active_volcano$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_mountain_range$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_dangerous_wildlife$§!.$TABBED_NEW_LINE$$t$- £blocker£ §HWandering Forests§!.$TABBED_NEW_LINE$$t$- £blocker£ §HTitanic Lifeforms§!.$TABBED_NEW_LINE$$t$- §HIsolated Valley§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_migrating_forests$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_migrating_forest_reserve$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_savage_wildlands$§!.\n\n§EXeno-Patrulheiro§!$TABBED_NEW_LINE$- Quando ambos £job_xenobiologist£ §YBiólogos Xenos§! e £job_ranger£ §Y$job_ranger_plural$§! estão habilitados, o cargo torna-se um £job_xenoranger£ §YXeno-Patrulheiro§!, que tem os benefícios e manutenção de ambos.\n\n§E$job_ark_gardener$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ark_gardener_plural$§! são $job_ranger_plural$ que trabalham exclusivamente em $arkship_plural$ em ['concept_nomadic_empires']. Eles cumprem a mesma função que um £job_ranger£ §Y$job_ranger$§! normal. Beneficiam-se da colocação de £blocker£ §HBloqueios§! §Y$d_ark_nature_preserve_blocker$§!, e estão disponíveis para todos os £green£ Nômades."

