 civic_machine_cult_machine_forever_cruise: "Culto do Servidor"
 civic_machine_cult_machine_forever_cruise_desc: "Este império de máquinas, venerado como deuses por seus criadores, busca levar a vida orgânica pela mão e mostrá-lhes a glória do cosmos... e servir deliciosas bebidas frutadas."
 civic_tooltip_machine_cult_machine_forever_cruise_effects: "$- Edifício Inicial Adicional: £building£ §YMosteiro Mecha§! \n- Desbloqueia o traço §C['trait:trait_latent_psionic_machine', $trait_latent_psionic_machine$]§! \n$civic_tooltip_machine_cult_buildings$\n\n§ESimbiose Psíquica§!:\n    - Pode modificar £pops£ §Y$planet_pop_organics$§! para serem §HCibernéticos§!$t$- §HPassageiros§! devem usar o padrão de vida §Y$living_standard_organic_trophy$§! e fornecem §G+1% adicional§! de Eficiência de Trabalho Especialista\n$t$- §HPassageiros Classe Econômica§! são substituídos por §Y$job_cruise_passenger_unemployment_bio_trophy_plural$§!\n$t$- §RNecessidades dos Passageiros são mais difíceis de satisfazer§!\n$t$ Todos os pops mecânicos automaticamente tornam-se §MEtripulantes§!, e nunca podem ser §MPassageiros§!.\n\n§EPode ser combinado com:§! \n- ['civic_tooltip_machine_cult_spiritualist_combo', $civic_exalted_priesthood$] ou outros ['concept_ethics_rebuild_theocracy',§YESpiritualista§! governos temáticos]"

