# Nomad Keepers of Harmony
 civic_keepers_harmony_nomad:0 "Natureza-Worshippers Nômades"
 civic_keepers_harmony_nomad_desc:0 "Pessoas desta sociedade adoram a santidade dos lugares que visitam. Eles cruzam a galáxia em peregrinações que duram anos para locais sagrados onde natureza e o cosmos estão em perfeita harmonia."
 civic_tooltip_keepers_harmony_nomad_effects:0 "$t$§ESímbiose Divina:§!$TABBED_NEW_LINE$$t$- Substitui £job_bureaucrat£ §Y$job_bureaucrat$§! vagas por únicas £job_priest£ §Y$job_druid$§! vagas.$TABBED_NEW_LINE$$t$- £job_priest£ §Y$job_druid$§! vagas são mais efetivas em $arkship_plural$ com §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBloqueadores§!, proporcionando §Gadicional§! £housing£ §YHabitação§!, e aumentada §Y$MOD_POP_ENVIRONMENT_TOLERANCE$§!.\n$TABBED_NEW_LINE$- £building£ §Y$building_nature_sanctuary_nomad_plural$§! são edifícios únicos que proporcionam aumentada local $r_unity$, £happiness£ §YFelicidade§!, e £pops£ §H$ethic_green$§! atração per §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBloqueadores§! na $arkship$, e requerem $r_food$ para manutenção."
 civic_tooltip_keepers_harmony_nomad_negative_effects:0 "$t$§ESímbiose Abandonada:§!$TABBED_NEW_LINE$$t$- Em $arkship_plural$ sem §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBloqueadores§!, §Y$job_druid$§! vagas produzirão §Rmenos§! $r_unity$ do que mesmo um burocrata normal."
 
