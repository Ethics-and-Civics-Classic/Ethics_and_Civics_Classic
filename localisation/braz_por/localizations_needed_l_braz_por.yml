 concept_organizer_desc: "$job_organizer_effect_desc$\n\n§L$job_organizer_desc$§!"

 # Labor Organizer
 steward_anarchy: "$job_steward_anarchy$"
 job_steward_anarchy:0 "Organizador do Trabalho"
 job_steward_anarchy_plural:0 "Organizadores do Trabalho"
 job_steward_anarchy_desc:0 "Em um ambiente de trabalho igualitário, organizadores do trabalho mediam conflitos entre trabalhadores e coordenam a distribuição de materiais brutos e suprimentos."

 living_standard_community_labor: "Trabalho Comunitário"
 living_standard_community_labor_tooltip: "$living_standard_community_labor$ garante que as necessidades de nossos vizinhos nunca sejam deixadas insatisfeitas. Recursos são trocados, doados ou compartilhados eficientemente."
 living_standard_community_labor_tooltip_delayed: "§LConcorrência é a lei da selva, mas cooperação é a lei da civilização.§!"
 civic_anarchy_ideals:0 "Ideais Anarquistas"
 civic_anarchy_ideals_desc:0 "Esta sociedade baseia-se em ideais de rejeição a qualquer forma de hierarquia política ou sociológica injusta."
 civic_anarchy_ideals_effects:0 "$civic_civil_education_effects$ $TABBED_NEW_LINE$- $AVAILABLE_POLICIES$ ['concept_trade_mutual_aid'] $TABBED_NEW_LINE$- Substitui os cargos £job_politician£ §Y$job_politician$§! e £job_bureaucrat£ §Y$job_bureaucrat$§! pelos cargos ['concept_organizer',£job_culture_worker£ $job_organizer$] $TABBED_NEW_LINE$- §GDesbloqueia§! a postura de bombardeio §Y$bombardment_EaC_liberate_slaves$§!."
 civic_anarchy_ideals_negatives:0 "$t$- §RProibido§! de ter as seguintes políticas:$TABBED_NEW_LINE$$t$- §H$policy_resettlement$§!: $resettlement_allowed$$TABBED_NEW_LINE$$t$- §H$policy_population_controls$§!: $population_controls_allowed$"

 civic_anarchy_utopia:0 "Utopia Anarquista"
 civic_anarchy_utopia_desc:0 "Este coletivo autônomo organiza-se com base em princípios de ajuda mútua, justiça restaurativa e livre associação. Sem o fardo da hierarquia, são verdadeiramente o povo mais livre da galáxia."
 civic_anarchy_utopia_effects:0 "$t$- Permite o Padrão de Vida §Y$living_standard_community_labor$§!, sob o qual todos os £pop£ §YPops§! têm manutenção elevada de £consumer_goods£ §Y$consumer_goods$§! independentemente do §YEstrato§! $TABBED_NEW_LINE$- Desativa o uso da maioria dos outros §YPadrões de Vida§!$TABBED_NEW_LINE$- $civic_crowdsourcing_anarchy_effects$\n$civic_anarchy_ideals_effects$"
 civic_anarchy_utopia_negatives:0 "$t$- §RProibido§! de ter as seguintes políticas:$TABBED_NEW_LINE$$t$- §H$policy_resettlement$§!: $resettlement_allowed$$TABBED_NEW_LINE$$t$- §H$policy_interference$§!: $interference_aggressive$ $TABBED_NEW_LINE$$t$- §H$policy_population_controls$§!: $population_controls_allowed$\n$TABBED_NEW_LINE$- §RObrigado§! a ter as seguintes políticas:$TABBED_NEW_LINE$$t$- §H$policy_trade_policy$§!: $trade_policy_mutual_aid$ $TABBED_NEW_LINE$$t$- §H$policy_subjugation_war_terms$§!: $benevolent_terms_name$$TABBED_NEW_LINE$$t$- §H$policy_conscription_stance$§!: $conscription_stance_0$ $TABBED_NEW_LINE$$t$- §H$policy_border$§!: $border_policy_open_name$$TABBED_NEW_LINE$$t$- §H$policy_refugees$§!: $refugees_allowed$"

 civic_primitive_enthusiasts:0 "Entusiastas Primitivos"
 civic_primitive_enthusiasts_desc:0 "Esta sociedade aprecia as técnicas mais antigas, escolhendo realizar muitos trabalhos manualmente e viver da terra por meio de troca, agricultura e criação de animais."
 civic_primitive_enthusiasts_effects:0 "$t$- Pelo menos um §YMundo Habitável Garantido§! será o £job_hunter_gatherer£ §GMundo Nativo§! de uma Civilização pré-FTL\n$TABBED_NEW_LINE$- £job_civilian£ §YCivis§! se tornam £job_primitive_enthusiasts£ §HPioneiros§! e praticam um estilo de vida de §Gautosuficiência§! produzindo $r_food$\n\n§YDomesticação:§!$TABBED_NEW_LINE$Garante uma §Gmaior chance§! de pesquisar £physics£ ['tech_gravity_wells'] e eventualmente £society£ ['tech_alien_cloning'].\n\n§ESe as Éticas forem§! §H$ethic_socialism$§! §Ee§! §H$ethic_egalitarian$§!§E:§!$TABBED_NEW_LINE$$t$- Permite a Política Comercial §Y$trade_policy_mutual_aid$§!, que converte $r_trade$ em $r_energy$, $r_minerals$, e $r_food$§E:§!$TABBED_NEW_LINE$- Substitui os cargos £job_politician£ §Y$job_politician$§! e £job_bureaucrat£ §Y$job_bureaucrat$§! pelos cargos ['concept_organizer',£job_culture_worker£ $job_organizer$]."
 civic_primitive_enthusiasts_effects_first_contact_dlc:0 "$t$- Obtém §G100%§! a mais de Intuições ao observar Civilizações pré-FTL\n$civic_primitive_enthusiasts_effects$"

