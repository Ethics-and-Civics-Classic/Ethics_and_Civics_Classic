 council_agenda_agenda_quarterly_budget_review_corp_desc:1 "Para manter projeções de crescimento, precisamos brainstormar redução de custos de trabalho e aparar o excesso."
 agenda_quarterly_budget_review_corp_finish:0 "$council_agenda_agenda_quarterly_budget_review_corp_name$ $agenda_ref$"
