 environmental_stewards_agenda_boost:0 "$council_agenda_agenda_environmental_stewards_name$ $agenda_ref$"
 environmental_stewards_agenda_boost_desc:1 "Políticas recentes de proteção ecológica melhoraram os resultados da pesquisa de conservação neste planeta."
 council_agenda_agenda_environmental_stewards_nomad_name:0 "Pisar Levemente"
 council_agenda_agenda_environmental_stewards_nomad_desc:1 "O vácuo é o maior ecossistema de todos, e nós somos seus guardiões. Devemos estar atentos aos nossos passos e pisar levemente entre as estrelas."

 requires_industrial: "$TRIGGER_FAIL$$civic_tooltip_industrial$"
 council_agenda_agenda_production_goals_name:0 "Otimizar Metas de Produção"
 council_agenda_agenda_production_goals_desc:1 "Estagnar é morrer, e não produzir é murchar. Devemos aumentar nossa capacidade de produção."
 agenda_production_goals_finish:0 "$council_agenda_agenda_production_goals_name$ $agenda_ref$"

 council_agenda_agenda_production_goals_nomads_name:0 "Modelo de Produção Móvel"
 council_agenda_agenda_production_goals_nomads_desc:1 "Nosso modo de vida não é sustentado sem recursos significativos. Devemos melhorar nossos rendimentos de produção, ou perecer."
 agenda_production_goals_nomads_finish:0 "$council_agenda_agenda_production_goals_nomads_name$ $agenda_ref$"

 requires_socialism: "$TRIGGER_FAIL$$civic_tooltip_socialism$"
