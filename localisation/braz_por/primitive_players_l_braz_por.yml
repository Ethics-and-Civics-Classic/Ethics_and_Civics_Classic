 # Drive components
 EXPERIMENTAL_DRIVE:0 "Motor Hiperespacial Experimental"
 EXPERIMENTAL_DRIVE_DESC:0 "Agora podemos viajar pela rede de hiperlinhas, embora muito lentamente comparado ao que nossos modelos prevêm. Não podemos garantir que possamos fazê-lo com segurança ou confiabilidade. O motor é...imprevisível. Pode precisar ser desligado e reiniciado remotamente durante a viagem no hiperespaço. Isso poderia ter muitos efeitos colaterais, alguns dos quais poderiam até ser positivos.\n\n"
 
 # Warp Drives
 tech_hyper_drive_theory:0 "Teoria do Hiperespaço"
 tech_hyper_drive_theory_desc:0 "Como as fibras de uma teia de aranha, o reino extradimensional do hiperespaço corre entre os poços gravitacionais da maioria das estrelas. Viagem mais rápida que a luz é teoricamente possível ao longo destas hiperlinhas.\n\n"
 tech_experimental_hyper_drive:0 "Motores Hiperespaciais Experimentais"
 tech_experimental_hyper_drive_desc:0 ""A teoria do hiperespaço provou ser sólida, mas ainda precisamos elaborar uma maneira de cruzar a fronteira dimensional e navegar pelas hiperlinhas.\n\n""
 tech_hyper_drive_05:0 "Viagem Hiperespacial Prática"
 tech_hyper_drive_05_desc:0 "Dados de testes reunidos de motores experimentais vastamente melhoraram nossa compreensão do hiperespaço, e agora deveríamos poder elaborar tecnologia de motor muito mais rápida, segura e confiável, adequada para uso generalizado.\n\n"
 
