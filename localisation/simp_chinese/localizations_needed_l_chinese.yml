 # Nomadic Keepers of Harmony - Planetary Pilgrimage Contracts
 planetary_pilgrimage_special: "Planetary Pilgrimage"
 
 contract_planetary_pilgrimage_1_chain_title: "$contract_planetary_pilgrimage_1_title$"
 contract_planetary_pilgrimage_1_chain_desc: "$contract_planetary_pilgrimage_1_desc$"
 contract_planetary_pilgrimage_1_title: "Meditate on Unspoiled Nature"
 contract_planetary_pilgrimage_1_desc: "§L"Our acolytes are keen to experience the tranquility of a planet unspoiled by civilization's ravages. They wish to meditate on a stationary world."§!"
 contract_planetary_pilgrimage_1_lore_issued: "§L"An entire world, without anyone on it! Imagine the birdsong you could hear!"§!"
 contract_planetary_pilgrimage_1_lore_completed: "§L"I have never felt so at peace, so in tune with nature..."§!"
 contract_planetary_pilgrimage_1_lore_failed: "§L"Oh well... the $d_ark_nature_preserve_blocker$ is nice too..."§!"
 contract_planetary_pilgrimage_1_chain_title: "$contract_planetary_pilgrimage_1_title$"
 contract_planetary_pilgrimage_1_chain_desc: "$contract_planetary_pilgrimage_1_desc$"
