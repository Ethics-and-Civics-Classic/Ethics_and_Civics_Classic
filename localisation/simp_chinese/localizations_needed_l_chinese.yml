 contract_planetary_pilgrimage_2_chain_title: "$contract_planetary_pilgrimage_2_title$"
 contract_planetary_pilgrimage_2_chain_desc: "$contract_planetary_pilgrimage_2_desc$"
 contract_planetary_pilgrimage_2_title: "Homage to the Innocent"
 contract_planetary_pilgrimage_2_desc: "§L"The $job_druid_plural$ wish to conduct a special ceremony to wish eternal wisdom and happiness to the $job_pre_sapient_plural$ on this planet."§!"
 contract_planetary_pilgrimage_2_lore_issued: "§L"To know nothing of desire or strife! There's so much we could learn!"§!"
 contract_planetary_pilgrimage_2_lore_completed: "§L"I don't think that spending an entire afternoon picking at my orifices was what I was supposed to learn..."§!"
 contract_planetary_pilgrimage_2_lore_failed: "§L"Such a rare opportunity, and we spoiled it. I want to cry!"§!"
 contract_planetary_pilgrimage_2_chain_title: "$contract_planetary_pilgrimage_2_title$"
 contract_planetary_pilgrimage_2_chain_desc: "$contract_planetary_pilgrimage_2_desc$"
 CONTRACT_planetary_pilgrimage_2_PROJECT: "$contract_planetary_pilgrimage_2_title$"
 CONTRACT_planetary_pilgrimage_2_PROJECT_DESC: ""

 contract_planetary_pilgrimage_3_chain_title: "$contract_planetary_pilgrimage_3_title$"
 contract_planetary_pilgrimage_3_chain_desc: "$contract_planetary_pilgrimage_3_desc$"
 contract_planetary_pilgrimage_3_title: "Worship the Sacred World"
 contract_planetary_pilgrimage_3_desc: "§L"A planet consecrated as a sacred place, never to be touched by civilization. We are compelled to give reverence in worship."§!"
 contract_planetary_pilgrimage_3_lore_issued: "§L"To bask in such sacred beauty is my life's dream!"§!"
 contract_planetary_pilgrimage_3_lore_completed: "§L"It was the most beautiful thing I have ever seen in my life... I'll remember it forever."§!"
