 # Ark Gardener
 building_nomad_conservatory:0 "保育温室"
 building_nomad_conservatory_desc:0 "本庇护所是 $arkship$ 生态系统的核心枢纽。方舟园艺区的生命支持控制系统由此处进行维护与监管。"
 building_nomad_conservatory_effect: "£job_ranger£ $job_ark_gardener$ 岗位来自 $d_ark_nature_preserve_blocker$ £blocker£ §HBlockers§!: §G+1§! £job_ranger£"

 ark_gardener:0 "$job_ark_gardener$"
 job_ark_gardener:0 "方舟园丁"
 job_ark_gardener_plural:0 "方舟园丁"
 job_ark_gardener_desc:0 "这些经过专门训练的守护者在旅程中保护珍贵的异星动植物，必要时会使用武力。"
 job_ark_gardener_effect_desc:2 "£job_ranger£ $job_ark_gardener_plural$ 产生 $r_society$、$r_unity$，降低本地 £crime£ §Y$PLANET_CRIME_TITLE$§!，生成 §Y$defense_army_plural$§!，并提升 §Y$concept_naval_capacity$§。"

 mod_job_ark_gardener_add:0 "$job_ark_gardener$岗位"
 has_nomad_conservatory:0 "$TRIGGER_FAIL$§R该地块障碍由于§Y[GetConservatoryType]§!的存在而无法清除。§!"
 biologist_is_ark_gardener_tt: "£job_biologist£ $job_biologist_plural$转化为£job_ranger£ $job_ark_gardener_plural$"

 d_ark_nature_preserve_blocker:0 "生态保护区"
 d_ark_nature_preserve_blocker_desc:0 "本方舟舰的一部分区域专门用于保护来自多颗行星的濒危及已灭绝物种。此处既是它们的栖息地，也是人类的栖息地。"

 decision_expand_biotope:0 "扩展生物圈"
 decision_expand_biotope_short:0 "在方舟舰上增加一个§Y$d_ark_nature_preserve_blocker$§!。"
 decision_expand_biotope_desc:0 "通过冗余生命支持系统和严密监测，我们能够精确复原多种不同生物圈的生态条件。"

 # Nomad Naturalism
 civic_naturalism_nomad:0 "星河共生理想派"
 civic_naturalism_nomad_desc:0 "这些漫游者献身于将方舟舰塑造为它们所挚爱之星球的模样。他们不仅复刻那些世界，更使其真正化为行走在星海间的流动家园。"
 building_national_park_nomad:0 "方舟生态圈"
 building_national_park_nomad_desc:0 "方舟舰内部孕育着完整的生态系统，万物在此蓬勃生长。这里的每一株草木、每一个生灵皆受悉心庇佑。"

 # Nomad Environmentalist
 civic_environmentalist_nomad:0 "生态方舟"
 civic_environmentalist_nomad_desc:0 "这些游牧民族从其所造访的行星收集濒危及已灭绝物种。他们在方舟舰上照料这些生命，执行一项保护全银河生物多样性的使命。"
 civic_tooltip_environmentalist_nomad_effects:2 "$t$- $AVAILABLE_BUILDINGS$ £building£ ['building:building_nomad_conservatory']$TABBED_NEW_LINE$- $ADDITIONAL_BUILDINGS_STRING$ £building£ §Y$building_nomad_conservatory$§!\n$t$- $AVAILABLE_HOLDINGS$ £building£ ['building:holding_park_ranger_lodge']$TABBED_NEW_LINE$- 游戏开始时提供额外的 §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlocker§!。$TABBED_NEW_LINE$- $UNLOCKS_CONTRACT_TYPE$ §Y$conservation_study_special$§!。"

 # Nomad Keepers of Harmony
 civic_keepers_harmony_nomad:0 "Nomadic Nature-Worshippers"
 civic_keepers_harmony_nomad_desc:0 "People of this society worship the sanctity of the places they visit. They cross the galaxy on years-long pilgrimages to holy sites where nature and the cosmos are in perfect harmony."
 civic_tooltip_keepers_harmony_nomad_effects:0 "$t$§EDivine Symbiosis:§!$TABBED_NEW_LINE$$t$- Replaces £job_bureaucrat£ §Y$job_bureaucrat$§! jobs with unique £job_priest£ §Y$job_druid$§! jobs.$TABBED_NEW_LINE$$t$- £job_priest£ §Y$job_druid$§! jobs are more effective on $arkship_plural$ with §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlockers§!, providing §Gadditional§! £housing£ §YHousing§!, and increased §Y$MOD_POP_ENVIRONMENT_TOLERANCE$§!.\n$TABBED_NEW_LINE$- £building£ §Y$building_nature_sanctuary_nomad_plural$§! are unique buildings which provide increased local $r_unity$, £happiness£ §Y$HAPPINESS$§!, and £pops£ §H$ethic_green$§! attraction per §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlocker§! on the $arkship$, and require $r_food$ for upkeep.\n$TABBED_NEW_LINE$- $UNLOCKS_CONTRACT_TYPE$ §Y$planetary_pilgrimage_special$§!."
 civic_tooltip_keepers_harmony_nomad_negative_effects:0 "$t$§EForsaken Symbiosis:§!$TABBED_NEW_LINE$$t$- On $arkship_plural$ without §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlockers§!, §Y$job_druid$§! jobs will produce §Rless§! $r_unity$ than even a normal $job_bureaucrat$."
 
 building_nature_sanctuary_nomad:0 "Garden Sanctuary"
 building_nature_sanctuary_nomad_plural:0 "Garden Sanctuaries"
 building_nature_sanctuary_nomad_desc:0 "This sacred place is where our path through the stars is enshrined, and our harmony with the ecosystem of the void is honored. This monument increases local $r_unity$, £happiness£ $HAPPINESS$ and §YEcocentrism§! ethics attraction per §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlockers§!, and requires $r_food$ for upkeep."
 building_nature_sanctuary_nomad_plural_desc:0 "$building_nature_sanctuary_nomad_desc$"

 # Nomad Eco Warfare
 civic_eco_warfare_nomad:0 "Protective Biotopes"
 civic_eco_warfare_nomad_desc:0 "Not only are these people more than ready and capable of defending their garden biotopes with guns in their hands, but they also learned to effectively apply advancements in biological sciences to the military.\n\n§WOrganic Ships§!: Involving biotechnology in military construction allows ships to gain special abilities, such as regeneration of Armor and Hull, and also become more energy efficient. The downside is that those materials are generally more fragile than non-organic alloys.\n\n§WMilitary Biomedicine§!: Army Health is increased."

 civic_tooltip_eco_warfare_nomad_effects:0 "$t$§ENatural Protection§!: Benefits from §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlockers§!$TABBED_NEW_LINE$$t$- Change £job_entertainer£ §Y$job_entertainer_plural$§! into £job_duelist£ §Y$job_duelist_plural$§!.$TABBED_NEW_LINE$$t$- Each £blocker£ §HBlocker§! provides §G-5%§! §YPlanetary Bombardment damage§!.\n$TABBED_NEW_LINE$§EMilitary Biotechnology§!:$TABBED_NEW_LINE$$t$- $r_minerals$ upkeep per 100 [foundry.GetIcon] §Y[GetAlloyProducer]§! §G-1§!.$TABBED_NEW_LINE$$t$- $r_food$ upkeep per 100 [foundry.GetIcon] §Y[GetAlloyProducer]§! §R+1§!.$TABBED_NEW_LINE$$t$- $r_food$ upkeep per 100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§! §R+1§!.$TABBED_NEW_LINE$$t$- $r_alloys$ produced per 100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§! §G+0.5§!.\n$BOB_mercs_tooltip$""

