 civic_environmentalist_nomad_desc: "这些游牧民族从其所造访的行星收集濒危及已灭绝物种。他们在方舟舰上照料这些生命，执行一项保护全银河生物多样性的使命。"
 civic_tooltip_environmentalist_nomad_effects: "$t$- $AVAILABLE_BUILDINGS$ £building£ ['building:building_nomad_conservatory']$TABBED_NEW_LINE$- $ADDITIONAL_BUILDINGS_STRING$ £building£ §Y$building_nomad_conservatory$§!\n$t$- $AVAILABLE_HOLDINGS$ £building£ ['building:holding_park_ranger_lodge']$TABBED_NEW_LINE$- 游戏开始时提供额外的 §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlocker§!。$TABBED_NEW_LINE$- $UNLOCKS_CONTRACT_TYPE$ §Y$conservation_study_special$§!。"
 civic_keepers_harmony_nomad: "游牧自然崇拜者"
 civic_keepers_harmony_nomad_desc: "本社会的人们膜拜其所造访之地的神圣性。他们为朝圣而行，穿越银河，历经数载奔赴圣地——那里自然与宇宙达成完美和谐。"
