 job_ark_gardener: "方舟园丁"
 job_ark_gardener_plural: "方舟园丁"
 job_ark_gardener_desc: "这些经过专门训练的守护者在旅程中保护珍贵的异星动植物，必要时会使用武力。"
 job_ark_gardener_effect_desc: "£job_ranger£ $job_ark_gardener_plural$ 产生 $r_society$、$r_unity$，降低本地 £crime£ §Y$PLANET_CRIME_TITLE$§!，生成 §Y$defense_army_plural$§!，并提升 §Y$concept_naval_capacity$§。"
