 d_ark_nature_preserve_blocker: "生态保护区"
 d_ark_nature_preserve_blocker_desc: "本方舟舰的一部分区域专门用于保护来自多颗行星的濒危及已灭绝物种。此处既是它们的栖息地，也是人类的栖息地。"
 decision_expand_biotope: "扩展生物圈"
 decision_expand_biotope_short: "在方舟舰上增加一个§Y$d_ark_nature_preserve_blocker$§!。"
 decision_expand_biotope_desc: "通过冗余生命支持系统和严密监测，我们能够精确复原多种不同生物圈的生态条件。"
 civic_naturalism_nomad: "星河共生理想派"
 civic_naturalism_nomad_desc: "这些漫游者献身于将方舟舰塑造为它们所挚爱之星球的模样。他们不仅复刻那些世界，更使其真正化为行走在星海间的流动家园。"
 building_national_park_nomad: "方舟生态圈"
 building_national_park_nomad_desc: "方舟舰内部孕育着完整的生态系统，万物在此蓬勃生长。这里的每一株草木、每一个生灵皆受悉心庇佑。"
 civic_environmentalist_nomad: "生态方舟"
 civic_environmentalist_nomad_desc: "这些游牧民族从其所造访的行星收集濒危及已灭绝物种。他们在方舟舰上照料这些生命，执行一项保护全银河生物多样性的使命。"
 civic_tooltip_environmentalist_nomad_effects: "$t$- $AVAILABLE_BUILDINGS$ £building£ ['building:building_nomad_conservatory']$TABBED_NEW_LINE$- $ADDITIONAL_BUILDINGS_STRING$ £building£ §Y$building_nomad_conservatory$§!\n$t$- $AVAILABLE_HOLDINGS$ £building£ ['building:holding_park_ranger_lodge']$TABBED_NEW_LINE$- 游戏开始时提供额外的 §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlocker§!。"
 civic_keepers_harmony_nomad: "游牧自然崇拜者"
 civic_keepers_harmony_nomad_desc: "本社会的人们膜拜其所造访之地的神圣性。他们为朝圣而行，穿越银河，历经数载奔赴圣地——那里自然与宇宙达成完美和谐。"
 civic_tooltip_keepers_harmony_nomad_effects: "$t$§E神圣共生：§!$TABBED_NEW_LINE$$t$- 用独特的£job_priest£ §Y$job_druid$§!岗位替代 £job_bureaucrat£ §Y$job_bureaucrat$§!岗位。$TABBED_NEW_LINE$$t$- 在拥有§Y$d_ark_nature_preserve_blocker$§! £blocker£ §H障碍§!的 $arkship_plural$ 上，£job_priest£ §Y$job_druid$§!岗位效率更高，提供§G额外的§! £housing£ §Y住房§!，并提升 §Y$MOD_POP_ENVIRONMENT_TOLERANCE$§!。$TABBED_NEW_LINE$$t$- £building£ §Y$building_nature_sanctuary_nomad_plural$§!为独特建筑，每处位于 $arkship$ 上的 §Y$d_ark_nature_preserve_blocker$§! £blocker£ §H障碍§!可提供增强的当地 $r_unity$、£happiness£ §Y$HAPPINESS$§!和 £pops£ §H$ethic_green$§!思潮吸引力，且需 $r_food$ 维护。"
 civic_tooltip_keepers_harmony_nomad_negative_effects: "$t$§E失落共生：§!$TABBED_NEW_LINE$$t$- 在没有 §Y$d_ark_nature_preserve_blocker$§! £blocker£ §H障碍§!的 $arkship_plural$ 上，§Y$job_druid$§!岗位产生的 $r_unity$ 甚至 §R少于§!普通 $job_bureaucrat$。"
 building_nature_sanctuary_nomad: "花园圣所"
 building_nature_sanctuary_nomad_plural: "花园圣所"
 building_nature_sanctuary_nomad_desc: "此神圣之地铭刻我等穿越星海的轨迹，亦彰显我等与虚空生态系统的和谐。此纪念碑每处§Y$d_ark_nature_preserve_blocker$§! £blocker£ §H障碍§!可提升当地 $r_unity$、£happiness£ $HAPPINESS$ 和 §Y$ethic_green$§! 思潮吸引力，并需 $r_food$ 维护。"
 building_nature_sanctuary_nomad_plural_desc: "$building_nature_sanctuary_nomad_desc$"
 civic_eco_warfare_nomad: "保护性生境"
 civic_eco_warfare_nomad_desc: "这些人不仅准备好并且有能力用手中的枪守护他们的花园生境，同时也学会了将生物科学的进步有效地应用于军事。\n\n§Y有机船舰§W：在军事建设中引入生物技术可使舰船获得特殊能力，如装甲与船体的再生及能源效率的提升。缺点是这些材料通常比无机合金更脆弱。\n\n§Y军事生物医学§W：提升陆军生命值。"
 civic_tooltip_eco_warfare_nomad_effects: "§Y自然防护§W：受益于§Y$d_ark_nature_preserve_blocker$§W £blocker£ §H障碍物§W$TABBED_NEW_LINE$$t$- 将£job_entertainer£ §Y$job_entertainer_plural$§W转变为£job_duelist£ §Y$job_duelist_plural$§W。\n$t$- 每个£blocker£ §H障碍物§W提供§G-5%§W §Y轨道轰炸伤害§W。\n$TABBED_NEW_LINE$§Y军事生物科技§W：$TABBED_NEW_LINE$$t$- $r_minerals$维护费每100 [foundry.GetIcon] §Y[GetAlloyProducer]§W §G-1§W。\n$t$- $r_food$维护费每100 [foundry.GetIcon] §Y[GetAlloyProducer]§W §R+1§W。\n$t$- $r_food$维护费每100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§W §R+1§W。\n$t$- $r_alloys$产出每100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§W §G+0.5§W。\n$BOB_mercs_tooltip$"
 concept_eco_biologists: "Ecocentrist Biologist Jobs"
 eco_biologist_swap: "Ecocentric Biologist Job Swaps"
 concept_eco_biologists_desc: "Various §H$ethic_green$§! Civics allow biologists to be swapped for special, more productive variants.\n§E$job_xenobiologist$§!$TABBED_NEW_LINE$- £job_xenobiologist£ §Y$job_xenobiologist_plural$§! are more productive versions of £job_biologist£ §Y$job_biologist_plural§!, producing §G50%§! more $r_society$, at the cost of §R33%§! more $r_consumer_goods$.$TABBED_NEW_LINE$- This is enabled by the §C$civic_terraforming$§! §YCivic§!, in combination with ['concept_natural_blockers'].\n\n§E$job_ranger$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ranger_plural$s§! are a mix between several jobs, and generalists producing several resources on top of the $r_society$, like $r_unity$, $r_amenities$, £job_criminal£ §Y$PLANET_CRIME_TITLE$§! Reduction, §Y$concept_naval_capacity$§!, and §Y$defense_army_plural$§!.$TABBED_NEW_LINE$- This is enabled by the £building£ §Y$building_ranger_lodge$§! Building from by the §C$civic_environmentalist$§! Civic.$TABBED_NEW_LINE$- This is also enabled by the §C$civic_eco_warfare$§! civic in combination with ['concept_natural_blockers'].\n\n§E$job_xenoranger$§!$TABBED_NEW_LINE$- When both £job_xenobiologist£ §Y$job_xenobiologist_plural$§! and £job_ranger£ §Y$job_ranger_plural$§! are enabled, the job becomes a £job_xenoranger£ §Y$job_xenoranger$§!, which has the benifits and upkeep of both.\n\n§E$job_ark_gardener$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ark_gardener_plural$§! are $job_ranger_plural$ that work exclusively on $arkship_plural$ in ['concept_nomadic_empires']. They fulfill the same function as a normal £job_ranger£ §Y$job_ranger$§!. They benefit from the placement of §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlockers§!, and are available to all £green£ Nomads."
 holding_national_park: "Overlord National Park"
 holding_national_park_desc: "This institution converts part of the subject's planet into an expansive nature reserve. Recovered wilderness zones encourage an $ethic_green$ outlook, and will improve relations with the Overlord if the subject also appreciates nature."
