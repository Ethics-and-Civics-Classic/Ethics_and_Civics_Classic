 # Nomadic Keepers of Harmony - Planetary Pilgrimage Contracts
 planetary_pilgrimage_special:0 "Peregrinación Planetaria"

 contract_planetary_pilgrimage_1_chain_title:0 "$contract_planetary_pilgrimage_1_title$"
 contract_planetary_pilgrimage_1_chain_desc:0 "$contract_planetary_pilgrimage_1_desc$"
 contract_planetary_pilgrimage_1_title:0 "Meditar sobre la Naturaleza Intacta"
 contract_planetary_pilgrimage_1_desc:0 "§L"Nuestros acólitos están ansiosos por experimentar la tranquilidad de un planeta intacto por las devastaciones de la civilización. Desean meditar en un mundo estacionario."§!"
 contract_planetary_pilgrimage_1_lore_issued:0 "§L"¡Un mundo entero, sin nadie en él! ¡Imaginen el canto de los pájaros que podrían escuchar!"§!"
 contract_planetary_pilgrimage_1_lore_completed:0 "§L"Nunca me he sentido tan en paz, tan en sintonía con la naturaleza..."§!"
 contract_planetary_pilgrimage_1_lore_failed:0 "§L"Bueno... el $d_ark_nature_preserve_blocker$ también está bien..."§!"
 contract_planetary_pilgrimage_1_chain_title:0 "$contract_planetary_pilgrimage_1_title$"
 contract_planetary_pilgrimage_1_chain_desc:0 "$contract_planetary_pilgrimage_1_desc$"
