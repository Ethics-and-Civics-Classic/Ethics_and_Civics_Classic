 concept_eco_biologists: "Ecocentrist Biologist Jobs"
 eco_biologist_swap: "Ecocentric Biologist Job Swaps"
 concept_eco_biologists_desc: "Various §HEcocentric§! Civics allow biologists to be swapped for special, more productive variants.\n§EXeno-Biologists§!$TABBED_NEW_LINE$- £job_xenobiologist£ §YXeno-Biologists§! are more productive versions of £job_biologist£ §Y$job_biologist_plural$§!, producing §G50%§! more $r_society$, at the cost of §R33%§! more $r_consumer_goods$.$TABBED_NEW_LINE$- This is enabled by the §CEcological Engineers§! §YCivic§!, on planets with the following £blocker£ §HBlockers§!:$TABBED_NEW_LINE$$t$- £blocker£ §H$d_dangerous_wildlife$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_dense_jungle$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_toxic_kelp$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_noxious_swamp$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_wandering_forests$§!.$TABBED_NEW_LINE$$t$- £blocker£ §HTitanic Lifeforms§!.$TABBED_NEW_LINE$$t$- §HIsolated Valley§!.$TABBED_NEW_LINE$$t$- §H$d_migrating_forests$§!.$TABBED_NEW_LINE$$t$- §H$d_migrating_forest_reserve$§!.$TABBED_NEW_LINE$$t$- §H$d_savage_wildlands$§!.\n\n§E$job_ranger_plural$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ranger_plural$§! are generalists which produce several resources in addition to $r_society$, such as: $r_unity$, $r_amenities$, £job_criminal£ §Y$PLANET_CRIME_TITLE$§! Reduction, §YNaval Capacity§!, and §YPlanetary Defense Armies§!.$TABBED_NEW_LINE$- This is enabled by the £building£ §Y$building_ranger_lodge$§! Building, from the §C$civic_environmentalist$§! Civic.$TABBED_NEW_LINE$- This is also enabled by the §C$civic_eco_warfare$§! Civic, on planets with the following blockers:$TABBED_NEW_LINE$$t$- £blocker£ §H$d_massive_glacier$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_noxious_swamp$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_quicksand_basin$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_toxic_kelp$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_dense_jungle$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_active_volcano$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_mountain_range$§!.$TABBED_NEW_LINE$$t$- £blocker£ §H$d_dangerous_wildlife$§!.$TABBED_NEW_LINE$$t$- £blocker£ §HWandering Forests§!.$TABBED_NEW_LINE$$t$- £blocker£ §HTitanic Lifeforms§!.$TABBED_NEW_LINE$$t$- §HIsolated Valley§!.$TABBED_NEW_LINE$$t$- §H$d_migrating_forests$§!.$TABBED_NEW_LINE$$t$- §H$d_migrating_forest_reserve$§!.$TABBED_NEW_LINE$$t$- §H$d_savage_wildlands$§!.\n\n§EXeno-Ranger§!$TABBED_NEW_LINE$- When both £job_xenobiologist£ §YXeno-Biologists§! and £job_ranger£ §Y$job_ranger_plural$§! are enabled, the job becomes a £job_xenoranger£ §YXeno-Ranger§!, which has the benefits and upkeep of both.\n\n§E$job_ark_gardener$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ark_gardener_plural$§! are $job_ranger_plural$ that work exclusively on $arkship_plural$ in ['concept_nomadic_empires']. They fulfill the same function as a normal £job_ranger£ §Y$job_ranger$§!. They benefit from the placement of §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlockers§!, and are available to all £green£ Nomads."

 holding_national_park:0 "Overlord National Park"
