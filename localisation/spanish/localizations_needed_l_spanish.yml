 council_agenda_agenda_production_goals_nomads_name:0 "Modelo de Producción Móvil"
 council_agenda_agenda_production_goals_nomads_desc:1 "Nuestro modo de vida no se sostiene sin recursos significativos. Debemos mejorar nuestros rendimientos de producción o perecer."
