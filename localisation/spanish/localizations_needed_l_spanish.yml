 job_ark_gardener_effect_desc:2 "£job_ranger£ $job_ark_gardener_plural$ producen $r_society$, $r_unity$, reducen el £crime£ §Y$PLANET_CRIME_TITLE$§! local, generan §Y$defense_army_plural$§! y aumentan §Y$concept_naval_capacity$§."

