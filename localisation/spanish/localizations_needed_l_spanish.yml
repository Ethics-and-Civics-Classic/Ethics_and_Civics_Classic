 contract_planetary_pilgrimage_5_chain_desc:0 "$contract_planetary_pilgrimage_5_desc$"
 contract_planetary_pilgrimage_5_title:0 "Maravillarse ante las Creaciones del Vacío"
 contract_planetary_pilgrimage_5_desc:0 "§L"Nuestros $job_druid_plural$ desean realizar una ceremonia para honrar a la fauna espacial nativa de este sistema, para que podamos emularlos mejor."§!"
 contract_planetary_pilgrimage_5_lore_issued:0 "§L"¡Somos muy parecidos! ¡Sería maravilloso reconocer eso!"§!"
 contract_planetary_pilgrimage_5_lore_completed:0 "§L"Eran tan majestuosos... Me siento muy humilde."§!"
 contract_planetary_pilgrimage_5_lore_failed:0 "§L"Simplemente no es lo mismo que rezar cuando pasan por aquí!"§!"
