 # Nomad Environmentalism
 civic_environmentalist_nomad:0 "Arkas Ambientales"
 civic_environmentalist_nomad_desc:0 "Estos nómadas recolectan especies en peligro de extinción y extintas de los planetas que visitan. Los cuidan a bordo de sus arkas en una misión para preservar la vida en toda la galaxia."
 civic_tooltip_environmentalist_nomad_effects:2 "$t$- $AVAILABLE_BUILDINGS$ £building£ ['building:building_nomad_conservatory']$TABBED_NEW_LINE$- $ADDITIONAL_BUILDINGS_STRING$ £building£ §Y$building_nomad_conservatory$§!\n$t$- $AVAILABLE_HOLDINGS$ £building£ ['building:holding_park_ranger_lodge']$TABBED_NEW_LINE$- Otorga una §Y$d_ark_nature_preserve_blocker$§! £blocker£§HBarrera§! adicional al inicio del juego."

 # Nomad Keepers of Harmony
 civic_keepers_harmony_nomad:0 "Adoradores Nómadas de la Naturaleza"
 civic_keepers_harmony_nomad_desc:0 "La gente de esta sociedad adora la santidad de los lugares que visitan. Cruzan la galaxia en peregrinaciones de años hacia sitios sagrados donde la naturaleza y el cosmos están en perfecta armonía."
 civic_tooltip_keepers_harmony_nomad_effects:0 "$t$§ESimbiosis Divina:§!$TABBED_NEW_LINE$$t$- Reemplaza los puestos de £job_bureaucrat£ §Y$job_bureaucrat$§! con únicos puestos de £job_priest£ §Y$job_druid$§!.$TABBED_NEW_LINE$$t$- Los puestos de £job_priest£ §Y$job_druid$§! son más efectivos en $arkship_plural$ con §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBarreras§!, proporcionando §Gadicionales§! £housing£ §YVivienda§!, y aumentando §Y$MOD_POP_ENVIRONMENT_TOLERANCE$§!.\n$TABBED_NEW_LINE$- £building£ §Y$building_nature_sanctuary_nomad_plural$§! son edificios únicos que aumentan $r_unity$ local, £happiness£ §YFelicidad§!, y la atracción de ética £pops£ §H$ethic_green$§! por cada §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBarrera§! en la $arkship$, y requieren $r_food$ para mantenimiento."
 civic_tooltip_keepers_harmony_nomad_negative_effects:0 "$t$§ESimbiosis Abandonada:§!$TABBED_NEW_LINE$$t$- En $arkship_plural$ sin §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBarreras§!, los puestos §Y$job_druid$§! producirán §Rmenos§! $r_unity$ que incluso un burócrata normal."

 building_nature_sanctuary_nomad_plural:0 "Santuarios Jardín"
 building_nature_sanctuary_nomad_plural_desc:0 "$building_nature_sanctuary_nomad_desc$"
 building_nature_sanctuary_nomad:0 "Santuario Jardín"
 building_nature_sanctuary_nomad_desc:0 "Este lugar sagrado es donde nuestro camino a través de las estrellas está consagrado, y nuestra armonía con el ecosistema del vacío es honrada. Este monumento aumenta $r_unity$ local, £happiness£ $HAPPINESS$ y la atracción de ética §YEcocentrismo§! por cada §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBarrera§!, y requiere $r_food$ para mantenimiento."

 # Nomad Eco Warfare
 civic_eco_warfare_nomad:0 "Biotopos Protectores"
 civic_eco_warfare_nomad_desc:0 "Estas personas no solo están más que listas y capaces de defender sus biotopos jardín con armas en sus manos, sino que también aprendieron a aplicar efectivamente los avances en ciencias biológicas al ámbito militar.\n\n§WNaves Orgánicas§!: Involucrar biotecnología en la construcción militar permite a las naves ganar habilidades especiales, como regeneración de Armadura y Cascara, y también volverse más eficientes energéticamente. La desventaja es que esos materiales generalmente son más frágiles que las aleaciones no orgánicas.\n\n§MBiomedicina Militar§!: La Salud del Ejército aumenta."

 civic_tooltip_eco_warfare_nomad_effects:0 "$t$§EProtección Natural§!: Beneficia de §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBarreras§!$TABBED_NEW_LINE$$t$- Cambia £job_entertainer£ §Y$job_entertainer_plural$§! en £job_duelist£ §Y$job_duelist_plural$§!.$TABBED_NEW_LINE$$t$- Cada £blocker£ §HBarrera§! proporciona §G-5%§! §YDaño de Bombardeo Planetario§!.\n$TABBED_NEW_LINE$§EBiotecnología Militar§!:$TABBED_NEW_LINE$$t$- Mantenimiento $r_minerals$ por 100 [foundry.GetIcon] §Y[GetAlloyProducer]§! §G-1§!.$TABBED_NEW_LINE$$t$- Mantenimiento $r_food$ por 100 [foundry.GetIcon] §Y[GetAlloyProducer]§! §R+1§!.$TABBED_NEW_LINE$$t$- Mantenimiento $r_food$ por 100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§! §R+1§!.$TABBED_NEW_LINE$$t$- §Y$r_alloys$§! producidos por 100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§! §G+0.5§!.\n$BOB_mercs_tooltip$"

 concept_eco_biologists: "Ecocentrist Biologist Jobs"
 eco_biologist_swap: "Ecocentric Biologist Job Swaps"
 concept_eco_biologists: "Ecocentrist Biologist Jobs"
 eco_biologist_swap: "Ecocentric Biologist Job Swaps"
 concept_eco_biologists_desc: "Various §H$ethic_green$§! Civics allow biologists to be swapped for special, more productive variants.\n§E$job_xenobiologist$§!$TABBED_NEW_LINE$- £job_xenobiologist£ §Y$job_xenobiologist_plural$§! are more productive versions of £job_biologist£ §Y$job_biologist_plural§!, producing §G50%§! more $r_society$, at the cost of §R33%§! more $r_consumer_goods$.$TABBED_NEW_LINE$- This is enabled by the §C$civic_terraforming$§! §YCivic§!, in combination with ['concept_natural_blockers'].\n\n§E$job_ranger$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ranger_plural$s§! are a mix between several jobs, and generalists producing several resources on top of the $r_society$, like $r_unity$, $r_amenities$, £job_criminal£ §Y$PLANET_CRIME_TITLE$§! Reduction, §Y$concept_naval_capacity$§!, and §Y$defense_army_plural$§!.$TABBED_NEW_LINE$- This is enabled by the £building£ §Y$building_ranger_lodge$§! Building from by the §C$civic_environmentalist$§! Civic.$TABBED_NEW_LINE$- This is also enabled by the §C$civic_eco_warfare$§! civic in combination with ['concept_natural_blockers'].\n\n§E$job_xenoranger$§!$TABBED_NEW_LINE$- When both £job_xenobiologist£ §Y$job_xenobiologist_plural$§! and £job_ranger£ §Y$job_ranger_plural$§! are enabled, the job becomes a £job_xenoranger£ §Y$job_xenoranger$§!, which has the benifits and upkeep of both.\n\n§E$job_ark_gardener$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ark_gardener_plural$§! are $job_ranger_plural$ that work exclusively on $arkship_plural$ in ['concept_nomadic_empires']. They fulfill the same function as a normal £job_ranger£ §Y$job_ranger$§!. They benefit from the placement of §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlockers§!, and are available to all £green£ Nomads."

 holding_national_park:0 "Overlord National Park"
 holding_national_park_desc:0 "This institution converts part of the subject's planet into an expansive nature reserve. Recovered wilderness zones encourage an $ethic_green$ outlook, and will improve relations with the Overlord if the subject also appreciates nature."
