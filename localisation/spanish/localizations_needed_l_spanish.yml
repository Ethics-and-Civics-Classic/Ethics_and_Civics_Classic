 CONTRACT_PILGRIMAGE_1_PROJECT_DESC:0 ""

 contract_planetary_pilgrimage_2_chain_title:0 "$contract_planetary_pilgrimage_2_title$"
 contract_planetary_pilgrimage_2_chain_desc:0 "$contract_planetary_pilgrimage_2_desc$"
 contract_planetary_pilgrimage_2_title:0 "Homenaje a los Innocentes"
 contract_planetary_pilgrimage_2_desc:0 "§L"Los $job_druid_plural$ desean realizar una ceremonia especial para desear sabiduría eterna y felicidad a los $job_pre_sapient_plural$ en este planeta."§!"
 contract_planetary_pilgrimage_2_lore_issued:0 "§L"No saber nada de deseo o conflicto! ¡Hay tanto que podríamos aprender!"§!"
 contract_planetary_pilgrimage_2_lore_completed:0 "§L"No creo que pasar toda una tarde picoteando mis orificios fuera lo que se suponía que debía aprender..."§!"
 contract_planetary_pilgrimage_2_lore_failed:0 "§L"Tanta oportunidad rara, y la arruinamos. ¡Quiero llorar!"§!"
 contract_planetary_pilgrimage_2_chain_title:0 "$contract_planetary_pilgrimage_2_title$"
 contract_planetary_pilgrimage_2_chain_desc:0 "$contract_planetary_pilgrimage_2_desc$"
 CONTRACT_PILGRIMAGE_2_PROJECT:0 "$contract_planetary_pilgrimage_2_title$"
 CONTRACT_PILGRIMAGE_2_PROJECT_DESC:0 ""

 contract_planetary_pilgrimage_3_chain_title:0 "$contract_planetary_pilgrimage_3_title$"
 contract_planetary_pilgrimage_3_chain_desc:0 "$contract_planetary_pilgrimage_3_desc$"
 contract_planetary_pilgrimage_3_title:0 "Adorar al Mundo Sagrado"
 contract_planetary_pilgrimage_3_desc:0 "§L"Un planeta consagrado como lugar sagrado, nunca para ser tocado por la civilización. Nos vemos compelidos a dar reverencia en adoración."§!"
 contract_planetary_pilgrimage_3_lore_issued:0 "§L"¡Darnos el lujo de tanta belleza sagrada es el sueño de mi vida!"§!"
 contract_planetary_pilgrimage_3_lore_completed:0 "§L"Era la cosa más hermosa que he visto en mi vida... Lo recordaré para siempre."§!"
 contract_planetary_pilgrimage_3_lore_failed:0 "§L"Quizás nunca volveré a ver un mundo santo nuevamente en mi vida..."§!"
 contract_planetary_pilgrimage_3_chain_title:0 "$contract_planetary_pilgrimage_3_title$"
 contract_planetary_pilgrimage_3_chain_desc:0 "$contract_planetary_pilgrimage_3_desc$"
