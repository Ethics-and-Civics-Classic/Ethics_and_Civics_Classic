 pft_environmentalists_nomads_desc:1 "Xenoecologists are primarily concerned with the continued habitability of our arkships, and preserving the macro-environment of the galaxy at large. They are opposed to Extractionists' demands for stellar excavation.\n\n§LEcocentrism ethos§!"

 pft_manufacturers_nomads:0 "Extractionist Faction"
 pft_manufacturers_nomads_desc:1 "Extractionists represent the interests of astro-miners, manufacturers, and metallurgists who maintain our Arkships' operational capacity. They are disdainful of the ideals of Xenoecologists.\n\n§LIndustrialism ethos§!"

