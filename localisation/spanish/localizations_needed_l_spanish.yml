 contract_planetary_pilgrimage_4_chain_desc:0 "$contract_planetary_pilgrimage_4_desc$"
 contract_planetary_pilgrimage_4_title:0 "Honrar a las Formas de Vida Únicas"
 contract_planetary_pilgrimage_4_desc:0 "§L"Nuestros $job_druid_plural$ han solicitado una peregrinación para honrar a las formas de vida únicas en este mundo."§!"
 contract_planetary_pilgrimage_4_lore_issued:0 "§L"¡Una oportunidad para honrar a tales criaturas increíbles sería una bendición!"§!"
 contract_planetary_pilgrimage_4_lore_completed:0 "§L"¡Criaturas tan magníficas! ¡Pensar que la galaxia alberga tales maravillas increíbles!"§!"
 contract_planetary_pilgrimage_4_lore_failed:0 "§L"Estaba esperando quizás ver una Nemma. Mi decepción es inmensurable y mi día está arruinado."§!"
