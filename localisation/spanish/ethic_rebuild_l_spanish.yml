 civic_peacekeepers:0 "Universalismo"
 civic_peacekeepers_desc:0 "Esta civilización es impulsada al espacio por el espíritu de esperanza y una creencia en la cooperación pacífica de toda vida sentiente en la galaxia.\n\nEstar en §YFederaciones§!, §YPactos de No-Agresión§! y §YAcuerdos de Pesquisa§! no cuesta Influencia para mantener.\nLa facción §YXenófila§! proporciona aprobación adicional por estar en una §YFederación§!.\nNo puede tener §YRivales§!.\nPermite construcción del edificio £building£ §YForo Pan-Galáctico§! único del imperio, que proporciona un bono a nivel imperio a §YPeso Diplomático§!, £society_research£ Pesquisa Sociétal, £unity£ Unidad y £trade_value£ Comercio.\n\nConsiderado una versión avanzada del civismo §YCuerpo Diplomático§!"
 
