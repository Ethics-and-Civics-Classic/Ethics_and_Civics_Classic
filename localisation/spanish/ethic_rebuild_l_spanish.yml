 SELECTIVE_BOMBARDMENT:0 "Política de Bombardeo Selectivo"
 SELECTIVE_BOMBARDMENT_DESC:0 "Implementar una política §Yde Bombardeo§! que asegure daño mínimo al ambiente local agradará al [Root.GetName]."
 
