 mod_leader_generals_cost_mult:0 "Costo de Generales"
 mod_leader_generals_upkeep_mult:0 "Mantenimiento de Generales"
 mod_leader_admirals_cost_mult:0 "Costo de Almirantes"
 mod_leader_admirals_upkeep_mult:0 "Mantenimiento de Almirantes"
 mod_leader_scientists_cost_mult:0 "Costo de Científicos"
 mod_leader_scientists_upkeep_mult:0 "Mantenimiento de Científicos"
 mod_leader_governors_cost_mult:0 "Costo de Gobernadores"
 mod_leader_governors_upkeep_mult:0 "Mantenimiento de Gobernadores"
 
 civic_enlightment:0 "Mancomunidad Pacífica"
 civic_enlightment_desc:0 "Habiendo aprendido a vivir una vida de paz y prosperidad, esta civilización logró alcanzar un enorme nivel de desarrollo económico y cultural.\n\nComienza con la tecnología §YSitio Heredado§!. Los §YESpiritualistas§! comienzan con la tecnología §YRituales Holográficos§!.\n\nProporciona +1 trabajo de $job_healthcare$ Trabajador Médico por nivel de Edificio Capital\nRecibe una opinión aumentada de enclaves §YColectivo Artístico§!."
 
 job_transcend:0 "Transcendente"
 job_transcend_plural:0 "Transcendentes"
 job_transcend_desc:0 "Estos individuos son considerados haber alcanzado un estado iluminado de consciencia."
 job_transcend_effect_desc:0 "£job_transcend£ $job_transcend_plural$ producen buena cantidad de £unity£ §YUnidad§!, £society£ §YPesquisa Sociétal§!, £physics£ §Y$physics_research$§!, £engineering£ §Y$engineering_research$§!, aumentan §Y$MOD_COUNTRY_ADMIN_CAP_ADD$§! y reducen £crime£ §YCrimen§! planetario."
 mod_job_transcend_add:0 "Trabajos de $job_transcend$"
 mod_job_transcend_per_pop:0 "§G+1§! Trabajo de $job_transcend$ por cada $VALUE$ Poblaciones"
 mod_job_transcend_per_pop_short:0 "\n§G+1§! £mod_job_transcend_add£ por $VALUE$ £pop£"
 
 civic_spiritual_seekers:0 "Buscadores Espirituales"
 civic_spiritual_seekers_desc:0 "La gente de esta sociedad está principalmente preocupada por asuntos de desarrollo psicológico y espiritual de sí mismos y buscando paz interior.\n\n£building£ §YSistema Capital§! y §YCitadela de Fe§! proporcionan trabajos §G+1§! £job_transcend£ $job_transcend$ adicionales, que producen pequeñas cantidades de £unity£ §YUnidad§!, £society£ §YPesquisa Sociétal§!, £physics£ §YPesquisa Física§! y £engineering£ §YPesquisa Ingeniería§!, así como aumentar §Y$MOD_COUNTRY_ADMIN_CAP_ADD$§! y reducir £crime£ §YCrimen§!.\nTiene una probabilidad aumentada de seleccionar la opción de pesquisa §YTeoría Psiónica§!."
 
 civic_private_militaries:0 "Militares Privados"
 civic_private_militaries_desc:0 "Cuando se trata de guerra esta sociedad tradicionalmente confía en las fuerzas de mercenarios y corporaciones militares privadas.\n\n£building£ §YFortines§! y §YFortalezas§! proporcionan trabajos £job_soldier£ $job_mercenary$ adicionales. Los mercenarios actúan mayormente como $job_soldier_plural$, pero también producen algo de £mod_trade_value_add£ §Y$TRADE_VALUE$§! y requieren £consumer_goods£ §YBienes de Consumo§! para mantenimiento."
 
 job_mercenary:0 "Mercenario"
 job_mercenary_plural:0 "Mercenarios"
 job_mercenary_desc:0 "Un soldado que lucha por ganancia personal, pero no es parte de un militar oficial."
 job_mercenary_effect_desc:0 "£job_soldier£ $job_mercenary_plural$ aumentan £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!, generan £defense_army£ §YEjércitos de Defensa§!, producen £mod_trade_value_add£ §Y$TRADE_VALUE$§! y requieren §YBienes de Consumo§! para mantenimiento."
 mod_job_mercenary_add:0 "Trabajos de $job_mercenary$"
 mod_job_mercenary_per_pop:0 "§G+1§! Trabajo de $job_mercenary$ por cada $VALUE$ Poblaciones"
 mod_job_mercenary_per_pop_short:0 "\n§G+1§! £mod_job_mercenary_add£ por $VALUE$ £pop£"
 
 civic_exploration:0 "Buscadores Estelares"
 civic_exploration_desc:0 "Esta civilización es impulsada al espacio por el verdadero espíritu de un pionero y un puro sentido de misterio indescubierto, en lugar de mera ambición imperialista o económica.\n\nComienza con la tecnología §YProtocolos de Exploración Automatizada§!.\nPermitido construir £building£ §YEscáner de Espacio Profundo§! único, que añade §G+1§! £mod_job_researcher_add£ Pesquisa, produce algo de £unity£ §YUnidad§!, aumenta §YAlcance de Sensores§! planetario, aumenta £physics£ §Y$physics_research$§! y atracción de ética §YMateralista§!.\nNo puede usar la política §YTelecomunicaciones Militares§!."
 
 mod_planet_priests_produces_mult:0 "Producción de £job_priest£ $job_priest_plural$"
 
 ALLOWED_LOBBY:0 "Cabildeo Corporativo"
 NO_ALLOWED_LOBBY:0 "Cabildeo Corporativo"
 ALLOWED_LOBBY_DESC:0 "Un civismo §YElitismo Financiero§! o §YCapitalismo Despiadado: "§! activo implica más poder para la facción §YEmprendedores§!, y por tanto agrada al [Root.GetName]."
 
 LABOUR_POWER:0 "Sindicalismo Desarrollado"
 NO_LABOUR_POWER:0 "Desarrollar Sindicalismo"
 LABOUR_POWER_DESC:0 "Un civismo §YSindicalismo§! activo implica más poder para la facción §YSocialistas§!, y por tanto agrada al [Root.GetName]."
 
 job_labour_hero:0 "Héroe Laboral"
 job_labour_hero_plural:0 "Héroes Laborales"
 job_labour_hero_desc:0 "Un individuo que fue reconocido por sus logros excepcionales de trabajo."
 job_labour_hero_effect_desc:0 "£job_primitive_laborer£ $job_labour_hero_plural$ producen pequeña cantidad de £minerals£ §YMinerales§!, £food£ §YAlimentos§!, £energy£ §YEnergía§! y £unity£ §YUnidad§!."
 mod_job_labour_hero_add:0 "Trabajos de $job_labour_hero$"
 mod_job_labour_hero_per_pop:0 "§G+1§! Trabajo de $job_labour_hero$ por cada $VALUE$ Poblaciones"
 mod_job_labour_hero_per_pop_short:0 "\n§G+1§! £mod_job_labour_hero_add£ por $VALUE$ £pop£"
 
 HEALTHCARE_CAMPAIGN:0 "Plenitud Nutricional"
 NO_HEALTHCARE_CAMPAIGN:0 "Plenitud Nutricional"
 HEALTHCARE_CAMPAIGN_DESC:0 "Invocar el Edicto §YPlenitud Nutricional§! agrada al [Root.GetName]."
 
 EDUCATION_CAMPAIGN:0 "Campaña Educativa"
 NO_EDUCATION_CAMPAIGN:0 "Sin Campaña Educativa"
 EDUCATION_CAMPAIGN_DESC:0 "Invocar una §YCampaña Educativa§! agrada al [Root.GetName]."
 
 
 
 SOCIAL_WELFARE_POP_EFFECTS:0 "$RULERS$: $VERY_HIGH_LUXURIES$, $10_HAPPINESS$\n$SPECIALISTS$: $HIGH_LUXURIES$, $7_HAPPINESS$\n$WORKERS$: $HIGH_LUXURIES$, $5_HAPPINESS$\n$SLAVES$: $LOW_LUXURIES$, $5_HAPPINESS$"
 
 LIBERATION_PHILOSOPHY:0 "Liberadores Galácticos"
 LIBERATION_NO_PHILOSOPHY:0 "Liberadores Galácticos"
 LIBERATION_PHILOSOPHY_DESC:0 "Tener la Filosofía de Guerra §YGuerras de Liberación§! agrada al [Root.GetName]."
 
 job_templar:0 "Templario"
 job_templar_plural:0 "Templarios"
 job_templar_desc:0 "Miembro de una orden militar religiosa, sirviendo para defender la Iglesia de los infieles."
 job_templar_effect_desc:0 "£job_templar£ $job_templar_plural$ producen £unity£ §YUnidad§!, §YLímite Naval§! aumentado y generan §YEjércitos de Defensa§!."
 mod_job_templar_add:0 "Trabajos de $job_templar$"
 mod_job_templar_per_pop:0 "§G+1§! Trabajo de $job_templar$ por cada $VALUE$ Poblaciones"
 
 mod_job_templar_per_pop_short:0 "\n§G+1§! £mod_job_templar_add£ por $VALUE$ £pop£"
 
 gov_strasserism:0 "Comunismo Nacional"
 gov_strasserism_desc:0 "Una sociedad basada en fuertes ideales nacionalistas en cultura y política, pero ideales egalitarios en la esfera de la economía."
 
 opinion_trade_enclave_vs_globalism:0 "Socios Comerciales"
 opinion_artist_enclave_vs_cultural_heritage:0 "Gente Civilizada"
 opinion_industrialist_vs_ecologist:0 "Abrazadores de Árboles Tontos"
 opinion_vs_ecologist_industrialist:0 "Odiantes de la Naturaleza"
 
 
 civic_reeducated_labor:0 "Déspotas Esclavistas"
 civic_reeducated_labor_desc:0 "La economía de esta sociedad está dominada por varios propietarios poderosos y despiadados de casas de comercio de esclavos.\n\nLos trabajos §YSuperintendente de Esclavos§! producen £unity£ §YUnidad§! adicional.\nSe permite a los no §YPacifistas Fanáticos§! construir el £building£ §YNeo-Coliseo§!, que añade trabajos £job_gladiator£ §YGladiador§!, que a su vez producen algo de £trade_value£ §YValor Comercial§! y aumentan §YDaño de Ejército§! local.\nUna versión avanzada del civismo §YGremios de Esclavistas§!"
 
 job_gladiator:0 "Gladiador"
 job_gladiator_plural:0 "Gladiadores"
 job_gladiator_desc:0 "Normalmente un individuo esclavizado, que sirve como combatiente armado para entretener a la gente luchando en la arena. Durante la guerra se une a las fuerzas armadas.\n\n§R!§! §W¡Trabajo requiere§! £pops£ §H$ethic_militarist$§! §Wo§! £pops£ §H$pop_cat_slave$§!"
 job_gladiator_effect_desc:0 "£job_gladiator£ $job_gladiator_plural$ aumentan £amenities£ §YComodidades§!, §YLímite Naval§! y producen §YEjércitos de Defensa§! y atracción £pops£ §H$ethic_militarist$§!."
 mod_job_gladiator_add:0 "Trabajos de $job_gladiator$"
 mod_job_gladiator_per_pop:0 "§G+1§! Trabajo de $job_gladiator$ por cada $VALUE$ Poblaciones"
