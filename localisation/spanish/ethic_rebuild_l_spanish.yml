 principle_federalist:0 "Federalismo"
 principle_federalist_desc:0 "Se enfoca en expansión a través del desarrollo pacífico de una Federación - una unión de estados parcialmente autogobernados bajo un gobierno central. Recibe mejor opinión de súbditos y a cambio les permite colonizar fuera de sus fronteras."
 
