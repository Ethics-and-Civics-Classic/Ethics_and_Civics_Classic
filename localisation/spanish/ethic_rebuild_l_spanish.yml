 civic_timocracy:0 "Timocracia"
 civic_timocracy_desc:0 "Este gobierno es una forma de Aristocracia Popular - un tipo elitista de república, que ha cerrado muchos derechos de una amplia parte de su población para empoderar una clase superior rica. Permite el principio §HSistema de Castas§! para autoridades §DDemocráticas§!"

 gov_demos_cratos:0 "Democracia Directa"
 gov_demos_cratos_desc:0 "Este gobierno es una forma de democracia, donde la gente decide directamente sobre iniciativas de política, ya sea por voto o consenso."
 auth_democratic:0 "Democracia Indirecta"
 auth_democratic_desc:0 "Las democracias indirectas tienen elecciones regulares donde todos los ciudadanos pueden votar sobre quién debería representarles."

 gov_plutocratic_oligarchy:0 "Oligarquía Plutocrática"
 gov_plutocratic_oligarchy_desc:0 "Este gobierno es una forma de oligarquía, donde el poder descansa con un comité de líderes ricos y poderosos que manejan el gran motor burocrático supervisando todos los asuntos del estado."

 gov_anarchy_state:0 "Anarco-Sindicalismo"
 gov_anarchy_state_desc:0 "Los principios básicos de la sociedad anarco-sindicalista son solidaridad, democracia directa y autogestión de trabajadores. Sindicalistas consideran sus teorías económicas una estrategia para facilitar la actividad de trabajadores y como un sistema económico cooperativo alternativo con valores democráticos y producción centrada en satisfacer necesidades de la gente."

 gov_popular_front:0 "Frente Popular"
 gov_popular_front_desc:0 "Los principios básicos de la sociedad anarco-sindicalista son solidaridad, democracia directa y autogestión de trabajadores. Un frente popular entonces toma estos ideales y construye una coalición de partidos de clase trabajadora y clase media, incluyendo liberales y socialdemócratas, todos unidos contra fascistas y esclavistas."
 
 gov_trade_union_corporate:0 "Sindicato Comercial"
 gov_trade_union_corporate_desc:0 "El objetivo básico de un sindicato es igualar el poder de los dueños de capital a través de colectivizar el trabajo. Por los trabajadores agrupándose juntos entran en una mesa de negociación igual con el proveedor de trabajo"
 
 gov_trade_combine:0 "Megacorporación Conjunta"
 gov_trade_combine_desc:0 "La clase trabajadora y clase superior tienen una relación compleja. Los objetivos de su sociedad están alineados pero solo porque sus trabajadores han sostenido siglos de adoctrinamiento y opresión."
 
 gov_aristocratic_combine:0 "Conjunta Aristocrática"
 gov_aristocratic_combine_desc:0 "La clase trabajadora y clase superior tienen una relación compleja. Los objetivos de su sociedad están alineados pero solo debido a cierto nivel de armonía que se mantiene entre estratos sociales."
 
 gov_aristocratic_megacorp:0 "Megacorporación Aristocrática"
 gov_aristocratic_megacorp_desc:0 "La Megacorporación de esta sociedad es propiedad de nobleza rica que supervisa las acciones de ejecutivos designados. A menudo dentro de esta sociedad feudal las frases 'empleado' y 'siervo' son intercambiables."
 


