 gov_national_socialism:0 "Régimen Fascista"
 gov_national_socialism_desc:0 "Este gobierno es una forma de ultranacionalismo altamente autoritario caracterizado por poder dictatoriales, supresión forzosa de la oposición y fuerte regimentación de la sociedad y la economía."
 
 civic_aristocratic_elite:0 "Aristocracia Patrimonial"
 civic_aristocratic_elite_desc:0 "Esta sociedad tiene una nobleza arraigada que ocupa los estratos superiores de la sociedad.\n\n£building£ §YEdificios Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Trabajos con £job_noble£ §Y$job_noble_plural$§!.\nPuede construir £building£ §Y$building_noble_estates$§! edificios que añaden trabajos £job_noble£ §Y$job_noble$§! adicionales.\n§YVillanos§!: §Y$building_noble_estates$§! proveen vivienda £housing£ adicional y trabajos de £job_farmer£ Agricultor.\nLa facción §YElitista§! estará complacida."
 
 civic_aristocratic_elite_corporate:0 "Aristocracia Patrimonial"
 civic_aristocratic_elite_corporate_desc:0 "Esta sociedad tiene una nobleza arraigada que ocupa los estratos superiores de esta sociedad de Megacorporación.\n\n£building£ §YEdificios Capitales§! §Wreemplazan algunos§! £job_executive£ §Y$job_executive$§! §WTrabajos con§! £job_noble£ §Y$job_noble_plural$§!§W.\nPuede §Wconstruir§! £building£ §Y$building_noble_estates$§! §Wedificios que añaden§! £job_noble£ §Y$job_noble$§! §WTrabajos adicionales.§!\n§YVillanos§!§W:§! §Y$building_noble_estates$§! §Wproveen§! £housing£ §WHospedaje y§! £job_farmer£ §WTrabajos de Agricultor adicionales.\n\nLa§! §Yfacción Elitista§! §Westará complacida.§!"
 
 TOTALITARIAN_STRATIFICATION_DESC:1 "Garantizar una sociedad estratificada -ya sea mediante una economía estratificada, esclavitud, privilegio académico o incluso purgas- complacerá al [Root.GetName]."
 
 gov_par_monarchy:0 "Monarquía Parlamentaria"
 gov_par_monarchy_desc:0 "Un estado encabezado por un monarca que no está activamente involucrado en la formación o implementación de políticas. El verdadero liderazgo gubernamental es llevado a cabo por un gabinete y su cabeza -un primer ministro, premier, o canciller- que son elegidos del parlamento."
 
 civic_naval_traditions:0 "Tradiciones Navales"
 civic_naval_traditions_desc:0 "Esta sociedad tiene tradiciones profundamente arraigadas de una gloriosa flota militar y produce muchos comandantes de naves distinguidos."
 
 civic_spiritual_democracy:0 "República Teocrática"
 civic_spiritual_democracy_desc:0 "Una forma de república, donde los ciudadanos están unidos por tradición religiosa, fuertes valores morales e imperativos éticos.\n\n£building£ §YEdificios Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Trabajos con £job_high_priest §Y$job_high_priest_plural$§!. Los £building£ §YNexo Sagrado§! y §YCitadela de Fe§! proveen trabajos de §YSumo Sacerdote§! adicionales.\n£job_priest£ §Y$job_priest_plural$§! producen §G+1§! £unity£ Unidad.\n£job_high_priest£ §Y$job_high_priest_plural$§! proveen £society£ §YPesquisa Sociétal§! y £amenities£ §YComodidades§! adicionales.\n\nNo puede esclavizar su propia especie.\nNo puede usar §YControles de Población§!."
 
 edict_patriotic_call:0 "Llamada Patriótica"
 edict_patriotic_call_desc:0 "¡A las Armas! ¡Tu Nación te Necesita en Esta Hora Oscura!"
 
 glorious_fleet:0 "¡Victoria Gloriosa!"
 unglorious_fleet:0 "¡Ay de los Conquistados!"
 
 civic_police_state:0 "Estado Policial"
 civic_police_state_desc:0 "Para aplacar cualquier rastro de disidencia, la población en esta sociedad represiva es cuidadosamente monitoreada y controlada por una gran fuerza policial interna.\n\n£job_enforcer£ §Y$job_enforcer_plural$§! también producen §Y1§! £unity£ §Y$Unity$§! y reducen £crime£ §YCrimen§! en §G+5§!.\nEl §YCuartel de Precinto§! y el §YSalón de Juicio§! tienen su £energy£ costo aumentado."
 
 civic_tooltip_private_prospectors_effects:2 "§HDesbloquea Tipo de Nave:§! Nave Colonial Privada\n$MOD_COUNTRY_ADMIN_CAP_ADD$: §G+20§!"
 
 gov_peoples_republic:0 "República Popular"
 gov_peoples_republic_desc:0 "El gobierno es una forma egalitaria de dictadura. Hay un parlamento real, pero está dominado por un único poder político -el llamado Partido Popular."
 
 
 empire_not_capitalism:0 "$TRIGGER_FAIL$Nuestro imperio no abraza los ideales necesarios §Y$ethic_capitalism$§!."
 
 job_supervisor:0 "Pensador"
 job_supervisor_plural:0 "Pensadores"
 job_supervisor_desc:0 "Filósofos e intelectuales encargados de articular y examinar los principios mismos por los cuales opera su sociedad."
 job_supervisor_effect_desc:0 "£job_supervisor£ $job_supervisor_plural$ producen £unity£ §YUnidad§!, £society_research£ §YPesquisa Sociétal§! y aumentan £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§!."
