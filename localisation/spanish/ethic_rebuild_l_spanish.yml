 principle_socialistic:0 "Hermandad de Drones"
 principle_socialistic_desc:0 "En esta sociedad personas de clase trabajadora son tradicionalmente glorificadas y forman una comunidad global basada en principios idealistas de colectivismo e igualdad.\n\nDistritos §YMinería§!, §YGranja§! y §YGenerador§! proporcionan §G+1§! Puesto y §G+1§! Vivienda cada uno, y tienen §R+15%§! mantenimiento aumentado\nPermite puesto especial Trabajador: £job_primitive_laborer£ §YHéroe Laboral§!, que produce pequeña cantidad de £minerals£ §YMinerales§!, £food£ §YAlimentos§!, £energy£ §YEnergía§! y £unity£ §YUnidad§!"
 
 
 principle_environmentalist:0 "Herencia Natural"
 principle_environmentalist_desc:2 "En esta sociedad la naturaleza es considerada riqueza nacional, que debe ser preservada y cuidadosamente explotada para el bien común.\n\nBeneficia de barreras naturales desalojables, que proporcionan Puestos de Trabajadores (como §YMineros§!, §YTécnicos§! y §YAgricultores§!) con nivel apropiado de £housing£ §VVivienda§!. Barreras también producen £unity£ Unidad y aumentan £amenities£ Servicios planetarios.\n\nBarreras naturales raras (como §YVida Titanic§! o §YBosques Errantes§!) proporcionan bonos apropiados también"   
  
 
 principle_master_engineer:0 "Maestros Ingenieros"
 principle_master_engineer_desc:0 "Esta civilización es renombrada por sus arquitectos e ingenieros asombrosamente hábiles."
 
 #References food policy "rationing"
 principle_land_of_plenty:0 "Tierra de Abundancia"
 principle_land_of_plenty_desc:0 "Esta sociedad sigue el concepto de desarrollo industrial sirviendo al público, crea un ambiente de trabajo y vida cómodo, y cumple necesidades materiales de la gente tanto como posible.\n\nRed §YUVAs§! cubre todas las áreas desde densamente pobladas hasta inhabitadas. Realizó gran número de trabajos de transporte, mantenimiento, patrulla, etc. Controlar este sistema requiere gestión a toda hora de muchos §YDispersores de UAVs§!"
 
 
 principle_commonwealth:0 "Colectivo Armónico"
 principle_commonwealth_desc:0 "Esta sociedad se caracteriza por un fuerte sentido de comunidad cultural y mejorando el bienestar de sus ciudadanos."
 
 
 
 principle_military_junta:0 "Consejo Militar"
 principle_military_junta_desc:0 "El gobierno de esta sociedad está dominado por una coalición de los líderes militares más poderosos.\n\n£building£ §YEditiones Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Puestos con £job_commandante£ §Y$job_commandante_plural$§!, quienes aumentan §YCapacidad Naval§!, generan §YEjércitos de Defensa§!, aumentan §YE estabilidad§! planetaria y reducen daño de §YBombardeo§!\nProhíbe establecer política §YEnfoque de Producción§! en §YCivilian§!"
 
 principle_peaceful_republic:0 "Democracia Utopíca"
 principle_peaceful_republic_desc:0 "Una forma pacifista de república, donde ciudadanos están unidos por la idea nacional de una vida libre, pacífica y próspera para todos.\n\n£building£ §YEditiones Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Puestos con £job_supervisor£ §Y$job_supervisor_plural$§!, que producen £unity£ §YUnidad§!, £society_research£ §YPuntos de Investigación Sociológica§! y aumentan £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§!\n\nProhíbe establecer política §YEnfoque de Producción§! en §YMilitar§!"
 
 principle_cyber_demos_cratos:0 "Ciberdemocracia"
 principle_cyber_demos_cratos_desc:0 "Involucrar logros de alta tecnología en TI y comunicaciones masivas en gobierno democrático permite crear el sistema burocrático descentralizado más eficiente. Pero tal dependencia de tecnología, combinada con nivel justo de libertad, puede resultar en brotes ocasionales de cibercrimen.\n\n£building£ §YEditiones Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Puestos con £job_head_researcher£ §Y$job_head_researcher_plural$§!\n§Y$job_researcher_plural$§! también producen §Y1§! £unity£ Unidad."
 
 principle_science_directorate:0 "Dirección de Ciencia"
 principle_science_directorate_desc:0 "El gobierno está fuertemente influenciado por un comité de los científicos más renombrados del imperio.\n\nLa facción §YTecnólogo§! demandará estándares de vida §YPrivilegios Académicos§!\n£building£ §YEditiones Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Puestos con £job_head_researcher£ §Y$job_head_researcher_plural$§!\n§Y$job_researcher_plural$§! también producen §Y1§! £unity£ Unidad."
 
 principle_executive_committee:0 "Asamblea de Filósofos"
 principle_executive_committee_desc:0 "El gobierno es tradicionalmente supervisado por un consejo de los filósofos más inteligentes e honorables del imperio.\n\n£building£ §YEditiones Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Puestos con £job_supervisor£ §Y$job_supervisor_plural$§!, quienes producen £unity£ §YUnidad§!, £society_research£ §YPuntos de Investigación Sociológica§! y aumentan £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§!"
 
 principle_cyber_dictatorship:0 "Dictadura Cibernética"
 principle_cyber_dictatorship_desc:0 "El gobierno representa una forma de dictadura tecnocrática, donde el estado depende pesadamente de supercomputadoras para lidiar con asuntos de seguridad y administración. Pero con tanto poder subcontratado a IAs, ciudadanos ordinarios tienen aún menos influencia en el proceso gobernante.\n\n£building£ §YEditiones Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Puestos con £job_head_researcher£ §Y$job_head_researcher_plural$§!\n§Y$job_researcher_plural$§! que también producen §Y1§! £unity£ Unidad.\nComienza con tecnología §YIA Administrativa§!"
 
 civic_ruthless_competition_desc:0 "La clase trabajadora en esta Megacorporación está constantemente compitiendo entre sí en competencia despiadada para conseguir los restos dejados por la clase propietaria gobernante. Sus mundos consisten en ruptura de sindicatos, fábricas sin regular, y minas sin regular. Aún más este socavamiento del trabajo organizado no está relegado a sus propios mundos. Es una galaxia de perro come perro.\n\n§WObligado a vivir bajo§! §YEconomía Estratificada§! §Westándares de vida.\n\nPuede construir§! §YOficinas Filiales§! §Ten el planeta de cualquier imperio, incluyendo megacorp, que no tenga guerra o tregua activa.\nPuede construir §YSupresión Laboral Especial§! £building£ §Y$BRANCH_OFFICE_BUILDINGS$§!§W.§!"
 
 #missing description
 principle_centralized_state:0 "Autoridad Centralizada"
 principle_centralized_state_desc:0 " "
 
 
 principle_exalted_priesthood:0 "Teocracia"
 principle_exalted_priesthood_desc:0 "Líderes religiosos ocupan todas las posiciones administrativas principales para guardar la sociedad contra herejía.\n\nComienza con tecnología §YRituales Holográficos§!\nEl £building£ §YNexo Sagrado§! y §YCiudadela de Fe§! proporcionan £job_high_priest §Y$job_high_priest_plural$§! adicionales.\nCombinado con principio §YCulto Mecánico§!, £job_high_priest §Y$job_high_priest_plural$§! además aumentan §YSalida Robótica§! y £engineering£ §YPuntos de Investigación de Ingeniería§! en el planeta, y §YSacerdotes Tecnológicos§! producen £unity£ §YUnidad§! adicional y £engineering£ §YPuntos de Investigación de Ingeniería§!"
 
 principle_citizen_service:0 "República Estratocrática"
 principle_citizen_service_desc:0 "Ciudadanía completa y responsabilidad política que viene con ella está limitada a aquellos quienes han servido un turno de deber en el militar. Servicio garantiza ciudadanía y derechos de elegir y gobernar.\n\n£building£ §YEditiones Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Puestos con £job_commandante£ §Y$job_commandante_plural$§!, quienes aumentan §YCapacidad Naval§!, generan §YEjércitos de Defensa§!, aumentan §YE estabilidad§! planetaria y reducen daño de §YBombardeo§!\n\n£job_commandante£ §Y$job_commandante_plural$§! proporcionan £unity£ §YUnidad§! adicional y £amenities£ §YServicios§!\nPermite invocar Edicto del imperio §YLlamada Patriótica§!"
 
 
 principle_idealistic_foundation:0 "Ideales Anarquistas"
 principle_idealistic_foundation_desc:0 "Esta sociedad está basada en una fundación idealista de libertad e igualdad, caracterizada por poder mucho reducido de autoridad gubernamental central.\nLas facciones §YProgresistas§! y §YTrabajadores§! demandarán §YDemocracia Directa§!"
 
 principle_hierarchy:0 "Jerarquía Inmutable"
 principle_hierarchy_desc:0 "En esta sociedad poder político está concentrado en manos de pequeña élite gobernante que domina y explota pesadamente la clase trabajadora, así manteniendo un sistema de castas inmutable."
 
