 civic_in_perfect:0 "Homogeneidad Cultural"
 civic_in_perfect_desc:0 "Esta sociedad xenófoba está imbuida con un fuerte sentido de colectivismo homogéneo.\n\n§YConsejo de Ancianos§!: permite construcción del edificio £building£ §YPalacio del Consejo de Ancianos§! único planetario, que proporciona un trabajo de Gobernante único, £job_the_elder£ $job_the_elder$, que aumenta £society_research£ §YPesquisa Sociétal§!, £amenities£ §YComodidades§! y §YEstabilidad§! locales, escalando con el número de Poblaciones en el planeta."
 
 ECOSYSTEM_DIVERSITY:0 "Diversidad de Ecosistemas"
 ECOSYSTEM_DIVERSITY_DESC:0 "Colonización de todos los tipos posibles de planetas habitables (Árido, Desierto, Sabana, Alpino, Ártico, Tundra, Continental, Oceánico, Tropical) agradará enormemente al [Root.GetName]"
 
 building_tribal_council:0 "Palacio del Consejo de Ancianos"
 building_tribal_council_desc:0 "Líderes de las tribus se reúnen aquí regularmente para discutir problemas urgentes relacionados con desarrollo planetario sostenible.\n\nProporciona un trabajo de Gobernante único - £job_the_elder£ $job_the_elder$, y aumenta Pesquisa Sociétal £society_research£, Comodidades £amenities£ y §YEstabilidad§! locales, escalando con el número de §YPoblaciones§! en el planeta, desde §G40§! a §G200+§! (para 40/80/120/160/200+ Poblaciones). Su mantenimiento aumenta apropiadamente."
 
 job_the_elder:0 "Anciano Reverenciado"
 job_the_elder_plural:0 "Ancianos Reverenciados"
 job_the_elder_desc:0 "Un miembro del §YConsejo de Ancianos§!"
 job_the_elder_effect_desc:0 "£job_the_elder£ $job_the_elder$ produce £unity£ Unidad y genera §YEjércitos de Defensa§!."
