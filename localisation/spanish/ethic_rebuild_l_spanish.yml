 dec_bureaucracy:0 "Consejo Estelar"
 dec_bureaucracy_desc:0 "Este gobierno es una oligarquía, donde el poder descansa con un comité de directores y varios otros oficiales que manejan el gran motor burocrático que supervisa todos los asuntos del estado."
 star_bureaucracy:0 "Administración Interestelar"
 star_bureaucracy_desc:0 "Este gobierno es una forma avanzada de oligarquía, donde incontables diferentes oficinas manejan varios asuntos del estado interestelar constantemente en expansión. El círculo interno gobernante está compuesto por oficiales de más alto rango, cada uno representando sus propios intereses."

 START_SCREEN_PART_TWO_DEC_BUREAUCRACY:0 " "

 START_SCREEN_PART_TWO_POLICE_STATE:0  " "
 
 START_SCREEN_PART_TWO_ECO_DEMOCRACY:0 " "

 START_SCREEN_PART_TWO_DRONE_COA:0 "Por largos periodos nuestra gente ha sufrido de tiranía y opresión. Para restaurar la justicia nosotros - la clase trabajadora - nos levantamos y establecimos un gobierno planetario con los sindicatos laborales como su núcleo. De ahora en adelante el estado va a cuidar a la gente, proporcionando ingresos decentes y calidad de vida para todos. Unidos como uno podemos alcanzar una altura sin precedentes."

 START_SCREEN_PART_TWO_SOC_DEM:0 "Nuestra civilización sobrevivió guerras devastadoras, naciones aisladas y mentes alienadas. Pero llegó el momento cuando realizamos que conflictos no tienen ningún sentido y es tiempo de unirnos en paz. Creamos un gobierno mundial enfocado únicamente en la gente y su bien común. Elecciones democráticas, seguridad social y justicia para todos - todo esto nos permitió romper el círculo vicioso. ¡Y ahora estamos listos para alcanzar las estrellas!"

 START_SCREEN_PART_TWO_CAP_AUTOCRACY:0 "Intentando modelos económicos diferentes encontramos que la clave al bienestar es iniciativa personal. Pero después de que economía de libre mercado descontrolada casi destruyó nuestra civilización, el gobierno tuvo que tomar flujos financieros bajo estricta supervisión. Ahora la mayoría de nuestra riqueza pertenece a corporaciones estatales, con negocios regulados por un sistema burocrático masivo. La selección cuidadosa del gobernante garantiza la sostenibilidad de todo el sistema."

 START_SCREEN_PART_TWO_CASTE:0 "A través de la historia muchas formas ridículas y bizarras de gobierno se sucedieron una a otra. Para preservar armonía social creamos esta sociedad, donde todos son maestros de alguien debajo y esclavos de alguien arriba. Al final cada engranaje tiene su lugar, y el gobierno perfecto domina todo el planeta."

 START_SCREEN_PART_TWO_COMMUNISM:0 "Por mucho tiempo nuestro planeta estuvo dividido entre diferentes naciones, y sus recursos saqueados por capitalistas codiciosos. Hasta que un líder sabio llegó para unirnos, cuidando cada último ciudadano. Él creó y él mismo encabezó la administración para manejar todo el planeta. Cambiar a una economía planificada permitió rápido aumento de tasas de producción, así como prosperidad de la clase trabajadora. Todos los recursos excedentes fueron dirigidos para cumplir nuestro sueño de larga data de alcanzar las estrellas."

 START_SCREEN_PART_TWO_COMMUNIST_DICTATORSHIP:0 "Existo. Soy la Mente. Mi cuerpo está hecho de organismos subordinados, que forman la base de nuestra especie. Comencé a gobernar todas estas criaturas débiles y manejamos conquistar todo el planeta. Di algunos de ellos cualidades intelectuales increíbles para ayudarme con investigación, construcción y guerra. Pero ellos no tienen su propia voluntad. Yo soy su voluntad. Sus inferiores obedecen a los Superiores, y los Superiores no son nada más que esclavos para mí. Yo soy la columna vertebral y el corazón. La única alternativa para mí es muerte. Llevaré nuestra especie al destino, como soy la Colmena y la Colmena soy yo."

 START_SCREEN_PART_TWO_SOCIAL_DEMOCRACY:0 "Muchas eras de guerras intestinas nos mostraron nada más que su falta de sentido. Tan pronto como la muy última guerra terminó nuestras economías comenzaron a crecer. La cantidad de bienes comerciales aumentó junto con su calidad. Eventualmente esto llevó a la sociedad valorando posesiones materiales y riqueza sobre todo lo demás. La alta calidad de vida resultante fue un factor clave en la unificación de todo el planeta."

