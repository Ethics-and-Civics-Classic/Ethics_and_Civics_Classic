 mod_job_supervisor_per_pop_short:0 "\n§G+1§! £mod_job_supervisor_add£ por $VALUE$ £pop£"
 
 civic_stratocracy:0 "Estratocracia Ordenada"
 civic_stratocracy_desc:0 "En una estratocracia el estado y el ejército son efectiva y constitucionalmente lo mismo. Las posiciones administrativas suelen estar ocupadas por oficiales militares activos o honorablemente licenciados.\n\n£building£ §YEdificios Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Trabajos con £job_commandante£ §Y$job_commandante_plural$§!, quienes aumentan §YCapacidad Naval§!, generan §YEjércitos de Defensa§!, aumentan la §YEstabilidad§! planetaria y reducen el daño del §YBombardeo§!."
 
 civic_bureaucracy:0 "Burocracia Ilustrada"
 civic_bureaucracy_desc:0 "En esta sociedad el gobierno es tradicionalmente guiado por filósofos y pensadores, quienes -considerados gobernantes ideales- generalmente poseen inteligencia, confiabilidad, y voluntad de vivir una vida pacífica y próspera.\n\n£building£ §YEdificios Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Trabajos con £job_supervisor£ §Y$job_supervisor_plural$§!, quienes producen £unity£ §YUnidad§!, £society_research£ §YPesquisa Sociétal§! y aumentan £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§!."
 
 gov_bur_collectivism:0 "Colectivismo Burocrático"
 gov_bur_collectivism_desc:0 "Un estado colectivista burocrático posee los medios de producción, mientras que el excedente o beneficio es distribuido entre una élite de partido burocrático, en lugar de entre la clase trabajadora."
 
 job_commandante:0 "Comandante"
 job_commandante_plural:0 "Comandantes"
 job_commandante_desc:0 "Un oficial militar experimentado, ya sea activo o honorablemente licenciado."
 job_commandante_effect_desc:0 "£job_commandante£ $job_commandante_plural$ aumentan la §YCapacidad Naval§! del Imperio, generan §YEjércitos de Defensa§!, aumentan la §YEstabilidad§! planetaria, reducen el daño del §YBombardeo§! y producen una pequeña cantidad de £amenities£ §YComodidades§!."
