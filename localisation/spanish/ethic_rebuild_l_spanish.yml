 civic_mining_guilds:1 "Liga Minera"
 civic_mining_guilds_desc:0 "Varios gremios mineros grandes se han organizado en una unión económica que alcanzó posición dominante en esta sociedad. La contribución de la liga a la economía del imperio es fuerte, así el gobierno depende fuertemente de su apoyo.\n\nPermite usar la política comercial §YSubsidios Mineros§!\n§YPlantas de Purificación Mineral§! proporcionan §G+1§! £job_administrator£ §Y$job_administrator$§!\nComienza con tecnología §YExtracción del Núcleo Profundo§!"
 
 civic_industrial_automation:0 "Automatización Industrial"
 civic_industrial_automation_desc:0 "La economía depende fuertemente del uso de sistemas de control avanzados, como computadores o robots y otras tecnologías de información para manejar diferentes procesos y maquinaria.\n\nComienza con la tecnología §YTrabajadores Robóticos§!"
 
 civic_innovative_economy:0 "Economía Innovadora"
 civic_innovative_economy_desc:0 "Un paradigma económico, según el cual el factor clave impulsando crecimiento económico autosostenido es innovación tecnológica continua. Sin embargo, tal obsesión con progreso hi-tecnológico puede tener efecto disruptivo en la cultura de la civilización.\n\nComienza con el paradigma comercial §YInnovación y Progreso§!.\n§YPesquisa Corporativa§!: trabajos §YInvestigador§! proporcionan £trade_value£ §YValor Comercial§! adicional.\nLa facción §YEmprendedores§! proporcionará aprobación adicional para implementar la política comercial §YInnovación y Progreso§!."
 civic_innovative_economy_corporate:0 "Economía Innovadora"
 civic_innovative_economy_corporate_desc:0 "Un paradigma económico, según el cual el factor clave impulsando crecimiento económico autosostenido es innovación tecnológica continua. Sin embargo, tal obsesión con progreso hi-tecnológico puede tener efecto disruptivo en la cultura de la civilización.\n\nComienza con el paradigma comercial §YInnovación y Progreso§!.\n§YPesquisa Corporativa§!: trabajos §YInvestigador§! proporcionan £trade_value£ §YValor Comercial§! adicional.\nLa facción §YEmprendedores§! proporcionará aprobación adicional para implementar la política comercial §YInnovación y Progreso§!."
 
