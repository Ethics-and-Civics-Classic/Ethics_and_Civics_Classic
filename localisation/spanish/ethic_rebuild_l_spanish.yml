 mod_job_hedonist_per_pop_short:0 "\n§G+1§! £mod_job_hedonist_add£ por $VALUE$ £pop£"
 
 
 
 civic_slaver_guilds_desc:1 "Esta sociedad tradicionalmente explota trabajo esclavo y confía en los servicios de gremios especiales, organizados para mantener entrenamiento y distribución de sus esclavos.\n\nPermite construcción del £building£ §YNeo-Neo-Coliseo§! planetario único, que añade trabajos £job_gladiator£ §YGladiador§!. Gladiadores producen algo de £trade_value£ §YValor Comercial§! y aumentan §YDaño de Ejército§! local."
 
 civic_military_dictatorship:0 "Señor de la Guerra"
 civic_military_dictatorship_desc:0 "Los gobernantes de esta sociedad fueron históricamente los señores de la guerra más agresivos y exitosos. En tiempos modernos el gobernante es seleccionado de comandantes de grandes formaciones militares.\n\n£building£ §YEdificios Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Trabajos con £job_commandante£ §Y$job_commandante_plural$§!, quienes aumentan §YCapacidad Naval§!, generan §YEjércitos de Defensa§!, aumentan §YEstabilidad§! planetaria y reducen daño del §YBombardeo§!."
 
 civic_military_dictatorship_corporate:0 "Señor Pirata"
 civic_military_dictatorship_corporate_desc:0 "Los líderes de esta sociedad fueron históricamente los piratas más agresivos y exitosos. Con todas las facciones operando bajo la bandera unificada del Señor Pirata, ahora contratan sus servicios de piratería para que otros imperios usen.\n\n£building£ §YEdificios Capitales§! §Wreemplazan todos§! £job_executive£ §Y$job_executive$§! §WTrabajos con§! £job_commandante_pirate£ §Y$job_commandante_pirate$§! §WTrabajos§!\n\n§W$job_commandante_pirate_effect_desc$§!\n\n§WPermite usar§! §C$civic_barbaric_despoilers$§! §Wcívico§!"
 
 WEALTH_CREATION:0 "Creación de Riqueza"
 WEALTH_CREATION_DESC:0 "Implementar la política comercial §YCreación de Riqueza§! agradará al [Root.GetName]."

 #\n\nCan learn §YDeep Core Mining§! technology, allowing to construct §YThermal Borehole§! and hire §YDeep Core Engineers§!  \n\nBuilding §YMineral Purification Hub§! produce additional £unity£ §YUnity§!
 civic_corporate_dominion:1 "Comerciantes Pacíficos"
 civic_corporate_dominion_desc:0 "Esta sociedad opera bajo una regla simple: la paz es buena para los negocios. Para ese fin, una porción significativa del gobierno es administrada, controlada, o al menos influenciada por una alianza suelta de comerciantes independientes trabajando juntos para lograr prosperidad mutua.\n\n- Permite trabajo único £job_entrepreneur£ $job_entrepreneur_plural$, que produce £mod_trade_value_add£ §Y$TRADE_VALUE$§! y aumenta producción local de £rare_crystals£, £volatile_motes£ y £exotic_gases£.\n- Comienza con la tecnología §Y$tech_space_trading$§! ya desbloqueada.\n- La §YCompañía Comercial Extramundial§! produce §G+4§! £trade_value£ §YValor Comercial§! y §Y4§! £unity£ §YUnidad§!.\n- El §YCentro Comercial§! tiene su §Y$MOD_STARBASE_TRADE_PROTECTION_RANGE_ADD$§! aumentado en §G+1§!. \n- El §YMegaplex Comercial§! proporciona trabajos £job_entrepreneur£ $job_entrepreneur_plural$ adicionales. \n- La facción §YEmprendedores§! proporcionará aprobación adicional para implementar la política comercial §YLiga Comercial§!.\n- No puede usar la política §YTransporte Militar§!."
 
 job_corporate_researcher:0 "Investigador Corporativo"
 job_corporate_researcher_plural:0 "Investigadores Corporativos"
 job_corporate_researcher_desc:1 "Científicos corporativos utilizan sus habilidades científicas y conocimiento académico para propósitos comerciales."
 job_corporate_researcher_effect_desc:0 "£job_corporate_researcher£ $job_corporate_researcher_plural$ producen un poco menos de investigación £physics_research£, £engineering_research£ y £society_research£, pero proporcionan £trade_value£ §YValor Comercial§! adicional en cambio."
