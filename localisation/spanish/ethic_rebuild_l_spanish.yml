 abs_monarchy:0 "Monarquía Feudal"
 abs_monarchy_desc:0 "Una forma autocrática de gobierno construida alrededor de una autoridad central fuerte, con vasallos mantenidos bajo control y formando la columna vertebral sociológica y militar de la sociedad. La nación está dividida en incontables feudos gobernados por nobles leales designados que cuidan sus dominios y contribuyen al mantenimiento del ejército real."
 adv_abs_monarchy:0 "Hegemonía Estelar"
 adv_abs_monarchy_desc:0 "Una forma autocrática de gobierno construida alrededor de una autoridad central fuerte, con vasallos mantenidos bajo control y formando la columna vertebral sociológica y militar de la sociedad. La nación está dividida en incontables feudos gobernados por nobles leales designados que cuidan sus dominios y contribuyen al mantenimiento del ejército real."
 START_SCREEN_PART_TWO_ABS_MONARCHY:0 "Nuestra nación forjó una historia sangrienta de numerosos conflictos pequeños librados entre pequeños señores beligerantes por poder y riqueza. Eventualmente solo el dominio independiente más fuerte permaneció y el rey reclamó el título de gobernante global. Su ambición luego impulsó la ciencia hacia adelante, resultando en un salto tecnológico significativo. Ahora las estrellas están dentro de nuestro alcance."

