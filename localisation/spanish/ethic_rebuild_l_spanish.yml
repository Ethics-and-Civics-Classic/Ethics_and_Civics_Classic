 #which traditions exactly?
 principle_nationalism:0 "Nacionalismo"
 principle_nationalism_desc:0 "Un fuerte sentido de superioridad y orgullo nacionalista permea todas las capas de esta sociedad. Tradiciones de §HUnidad§! no están disponibles para adopción."
 
 #unused?
 principle_private_property:0 "Sindicato Energético"
 principle_private_property_desc:0 "La economía necesita una gran cantidad de energía para crecer. Para mejorar eficiencia y desarrollo industrial el gobierno privatizó una parte significativa de sus instalaciones de generación. §H$building_power_hub_1$§! y §H$building_power_hub_2$§! también producen §Y1§! Unidad."
 
 principle_militia:0 "Cuerpos Militares Privados"
 principle_militia_desc:0 "Compañías militares privadas han alcanzado una posición influyente en esta sociedad, y muchos aspectos de manejar el militar han sido transferidos a corporaciones poderosas."
 
 #unused?
 principle_public_medicine:0 "Medicina Pública"
 principle_public_medicine_desc:0 "El gobierno mantiene un extenso sistema público de atención médica. Comienza con tecnología §YSalud Fronteriza§!. §HClinica§! y §HHospital§! proporcionan §HUnidad§! adicional."
 
 #unused?
 principle_public_education:0 "Educación Pública"
 principle_public_education_desc:0 "El gobierno mantiene un extenso sistema público de educación."
 
 principle_monarchy:0 "Monarquía"
 principle_monarchy_desc:0 "Una monarquía es una forma de gobierno en la cual un grupo de personas, usualmente una familia dinástica, encarna la identidad nacional del país y uno de sus miembros es el jefe de estado o gobierno, o usualmente ambos, de por vida.."
  
 principle_dictatorship:0 "Dictadura"
 principle_dictatorship_desc:0 "Dictadura es una forma de gobierno en la cual un país es gobernado por una persona (un dictador) o por una entidad política, y poder es ejercido a través de varios mecanismos para asegurar que el poder de la entidad permanece absoluto."
 
 principle_nazi_dictatorship:0 "Dictadura Nacionalista"
 principle_nazi_dictatorship_desc:0 "El Gobernante es tradicionalmente el líder del partido político nacionalista dominante."
  
 principle_republic:0 "República"
 principle_republic_desc:0 "Una república es una forma de gobierno en la cual el país es considerado un 'asunto público' - no preocupación privada o propiedad de los gobernantes - y donde oficinas del estado son electas o nombradas según varias leyes y reglas."
 
 principle_xeno_republic:0 "República Multicultural"
 principle_xeno_republic_desc:0 "Forma multicultural de una república, que es gobernada en los principios de apertura total a diferentes culturas y aceptarlas como iguales. §HCiudadanía Completa§! y §HServicio Militar Completo§! son garantizados para Xenos por defecto."
 
 #gun rights still implemented?
 principle_military_demos_cratos:0 "Hermandad Marcial"
 principle_military_demos_cratos_desc:0 "Una forma de democracia, donde ciudadanos tradicionalmente mantienen y mantienen sus propias armas y equipamiento personales, formando unidades de milicia efectivas en tiempos de guerra. La política §HDerechos de Arma§! no puede ser desallowed."
 
 principle_feudalism:0 "Burocratismo"
 principle_feudalism_desc:0 "Las burocracias tradicionalmente favorecen un aparato estatal ampliado, resultando en poder excesivo de regulación del gobierno central."
 
 principle_ambassadors_assembly:0 "Asamblea de Embajadores"
 principle_ambassadors_assembly_desc:0 "El gobierno es dominado por un grupo de oficiales diplomáticos más influyentes."
 
 #This describes direct democracy. Maybe should be democracy in general?
 principle_demos_cratos:0 "Democracia"
 principle_demos_cratos_desc:0 "Ciudadanos ordinarios son empoderados para decidir sobre iniciativas de política local y global directamente a través de plebiscitos y referendos."
 
 principle_empire_bureau:0 "Gran Gobierno"
 principle_empire_bureau_desc:0 "Agrandar el tamaño de la burocracia estatal aumenta el poder de regulación del gobierno, pero inevitablemente resulta en gastos adicionales e ineficiencia económica general."

 principle_science_lobby:0 "Investigación Corporativa"
 principle_science_lobby_desc:0 "Partes significativas de los programas de investigación del gobierno han sido subcontratadas a corporaciones privadas más eficientes."
 
