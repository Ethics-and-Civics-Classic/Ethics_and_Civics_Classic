l_spanish:
 INSULT_PROPOSE_COL_IND:0 "¿Es el [Root.GetName] siquiera una nación real o simplemente un grupo anárquico de individuos peleones? Debe disculparme, pero su sistema político, tal como es, hace difícil discernirlo."
 02_INSULT_PROPOSE_COL_IND:0 "¿Entonces quién gobierna hoy su divertida pequeña nación estelar? Qué noción curiosa, ¡la de 'elegir' a alguien para el poder! Inevitablemente llevará a su colapso, por supuesto."
 03_INSULT_PROPOSE_COL_IND:0 "Sus ideales democráticos son una plaga en esta galaxia, y lo mismo ocurre con el [Root.GetName]."
 04_INSULT_PROPOSE_COL_IND:0 "Qué pueblo tan egoísta son ustedes, prefiriendo la mezquina 'libertad' al orden y estabilidad. Libertarismo... ¡ja! El [Root.GetName] no sobrevivirá el año."
 01_INSULT_PROPOSE_IND_COL:0 "Su régimen brutal y tiránico eventualmente caerá, y habrá un cuentas pendientes."
 02_INSULT_PROPOSE_IND_COL:0 "¿Han considerado siquiera la noción de permitir que sus ciudadanos piensen por sí mismos? Si tienen miedo de que esto llevaría al fin del [Root.GetName], tienen razón."
 03_INSULT_PROPOSE_IND_COL:0 "Qué triste que pueda existir una nación autoritaria como el [Root.GetName]. Es una vergüenza para los seres sintientes en todas partes."
 04_INSULT_PROPOSE_IND_COL:0 "La cruel opresión de las personas viviendo bajo el yugo del [Root.GetName] debe terminar algún día. Su jerarquía probará su perdición."
 16_FRIENDLY_GREETING:0 "Su gobierno hace un buen trabajo de contener los peores excesos del libertarismo, [From.GetSpeciesNamePlural]."
 14_FRIENDLY_GREETING:0 "Si bien preferimos sociedades libres, no podemos negar que su gobierno hace un buen trabajo de proporcionar estabilidad a sus ciudadanos."
 ENSLAVED_DESC:0 "Este Pópula está esclavizado. Las Populas esclavizadas generan infelicidad para todas las Populas Libertarias en este planeta."
 COL_LABEL:0 "Autoritario <-> Libertario"

 ethic_collectivist:0 "Autoritario"
 ethic_collectivist_desc:1 "§LEs evidente que diferentes personas tienen diferentes habilidades. Algunos están más aptos para gobernar, mientras otros están más aptos para servir, y sus roles en la sociedad deberían reflejar esto. Ignorar este hecho es invitar al caos y desorden.§!\n"
 ethic_fanatic_collectivist:0 "Autoritario Fanático"
 ethic_fanatic_collectivist_desc:1 "§LEs un crimen contra la naturaleza que un sirviente gobierne, o un gobernante sirva. El orden correcto solo puede mantenerse mediante estricta jerarquía y obediencia absoluta.§!\n"
 ethic_egalitarian:0 "Libertario"
 ethic_individualist_desc:1 "§LTodos son iguales en dignidad básica y derechos. La preservación del orden, aunque sea un objetivo loable, no justifica la tiranía ni la opresión ni en principio ni en práctica. La civilización florece mejor cuando los pocos no dominan a los muchos.§!\n"
 ethic_fanatic_egalitarian:0 "Libertario Fanático"
 ethic_fanatic_individualist_desc:1 "§LPoder no solo corrompe. Él mismo es corrupción. Todos los desequilibrios de poder son fundamentalmente coactivos por la naturaleza del poder. Verdadera libertad y justicia solo pueden obtenerse a través de igualdad.§!\n"

 personality_utopia_builders:0 "Constructores de Utopía"
 personality_utopia_builders_desc:0 "Los Constructores de Utopía valoran la prosperidad económica y social de su especie sobre todo lo demás. El gobierno, sin importar su tamaño, existe para asegurar que nadie padezca de necesidad, enfermedad o pobreza."

 personality_adventurous_expansionist:0 "Expansionistas Agresivos"
 personality_adventurous_expansionist_desc:0 "Los Expansionistas Agresivos ven la galaxia como su legado. Se enfocan principalmente en extender su influencia a cada rincón oscuro del espacio que pueden alcanzar."

 personality_paranoid_isolationists:0 "Aislacionistas Paranoides"
 personality_paranoid_isolationists_desc:0 "Los Aislacionistas Paranoides desean aislarse completamente del mundo exterior. Se encargan de sus propios asuntos y preferirían que todos los demás hicieran lo mismo."

 ### Toxic Baths
 #civic_toxic_baths:0 "Balnearios mutagénicos"
 #civic_corporate_toxic_baths:0 "Lujo mutagénico"
 #civic_hive_toxic_baths:0 "Piscinas de permutación"
 #civic_machine_toxic_baths:0 "Cuenca de hiperlubricación"
 civic_tooltip_toxic_baths_effects:0 "Construye §Ybalnearios mutagénicos§!.\nCada §Ybañero§! otorga:\nVeloc. crecimiento población: §G+1,5%§! por cada §Hdistrito industrial§!\n£pops£ $ethic_industrial$ attraction §G+1%§! per §HIndustrial District§!\nFelicidad: §R-0,75%§! por cada §Hdistrito industrial§!\nHabitabilidad: §R-0,25%§! por cada §Hdistrito industrial§!\n£pops£ $ethic_green$ attraction §R-1%§! per §HIndustrial District§!"
 #civic_tooltip_hive_toxic_baths_effects:0 "Construye §Ypiscinas de permutación mutagénicas§!.\nCada §Ydron de asistencia de permutación§! otorga:\nVelocidad montaje de pob. biológica: §G+2%§! por cada §Hdistrito industrial§!\nHabitabilidad: §R-0,75%§! por cada §Hdistrito industrial§!"
 #civic_tooltip_machine_toxic_baths_effects:0 "Construye §Ycuencas de producción§!.\nCada §Yterminal de lubricación§! otorga:\nVelocidad montaje de poblaciones: §G+1,5%§! por cada §Hdistrito industrial§!\nUso de servicios: §R+1%§! por cada §Hdistrito industrial§!"
 #civic_toxic_baths_desc:0 "Esta civilización se somete a rituales de baños mutagénicos con empleados profesionales que supervisan el uso de sustancias muy peligrosas. Este proceso tan \"vigorizante\" puede horrorizar a los espectadores no iniciados."
 #civic_corporate_toxic_baths_desc:0 "Esta civilización se somete a baños mutagénicos con empleados profesionales que supervisan el uso de sustancias muy peligrosas. Este proceso tan \"vigorizante\" se ofrece como un paso necesario del bienestar y el desarrollo personal."
 #civic_hive_toxic_baths_desc:0 "Esta Mente colmena usa criaderos mutagénicos con empleados profesionales que supervisan el crecimiento de los drones recién nacidos. Este proceso es muy intrusivo para el medioambiente."
 #civic_machine_toxic_baths_desc:0 "Este imperio de máquinas mejoró la producción de armazones de drones gracias a la enérgica aplicación de agentes de lubricación muy agresivos controlados por terminales programadas al milímetro. Este proceso de \"optimización\" se basa en reutilizar los desechos típicos de las industrias para una máxima eficiencia."
 #civic_tooltip_not_mutagenic:0 "No tiene el principio ['concept_mutagenic_civics']"
 #concept_mutagenic_civics:0 "Balnearios mutagénicos"
 #concept_mutagenic_civics_desc:0 "Los principios $concept_mutagenic_civics$ se componen de \n- ['civic:civic_toxic_baths']$NEW_LINE$- ['civic:civic_toxic_baths_individual_machine']$NEW_LINE$- ['civic:civic_corporate_toxic_baths']$NEW_LINE$- ['civic:civic_corporate_toxic_baths_individual_machine']$NEW_LINE$- ['civic:civic_hive_toxic_baths']$NEW_LINE$- ['civic:civic_machine_toxic_baths']"
 #building_toxic_bath:0 "Balneario mutagénico"
 #building_toxic_bath_hive:0 "Piscina de permutación mutagénica"
 #building_toxic_bath_machine:0 "Cuenca de hiperlubricación"
 #building_toxic_bath_desc:0 "Aunque los balnearios mutagénicos son centros terapéuticos muy avanzados con unos beneficios para la salud más que documentados, hay cierta gente que considera que los métodos que se emplean son repugnantes. Cada gota de líquido que hay en los baños es más mutagénica que la mayoría de sustancias prohibidas de la galaxia."
 #building_toxic_bath_hive_desc:0 "Las piscinas de permutación mutagénica son la máxima expresión de lo que una mente colmena es capaz de lograr cuando solo se tiene el objetivo de crear más cuerpos para su conciencia en constante expansión."
 #building_toxic_bath_machine_desc:0 "Las cuencas de hiperlubricación son la respuesta lógica a los problemas de fricción, sobrecalentamiento y electricidad estática que ocurren cuando se crean nuevas unidades. "
 #job_bath_attendant:0 "Empleado del balneario mutagénico"
 #job_bath_attendant_hive:0 "Dron de asistencia de permutación"
 #job_bath_attendant_machine:0 "Terminal de lubricación"
 job_bath_attendant_desc:0 "Empleados cualificados para los balnearios mutagénicos. Su trabajo en la vida consiste en asegurarse de que sus clientes sigan con buena salud a través de distintos servicios, como la desintoxicación extrema y la degeneración de los genotipos seleccionados con sumo cuidado.\n\n§R!§! §WJob requires§! £pops£ §H$ethic_industrial$§!"
 #job_bath_attendant_hive_desc:0 "Drones especializados creados con el objetivo es observar el proceso de permutación durante la creación de nuevos drones biológicos para la colmena."
 #job_bath_attendant_machine_desc:0 "Las terminales de lubricación son drones programados especialmente para observar la producción sumergida de nuevos armazones. Se encargan de controlar las condiciones de lubricación durante el proceso."
 #planet_bath_attendants:0 "Empleados del balneario mutagénico"
 #mod_job_bath_attendant_add:0 "Trabajos de $job_bath_attendant$"
 #job_bath_attendant_plural:0 "Empleados del balneario mutagénico"
 #job_toxic_baths_effect_desc:0 "Los £job_bath_attendant£ empleados del balneario mutagénico convierten los £consumer_goods£ §Ybienes de consumo§! en £pops£ §Ycrecimiento de población§!, pero reducen la £happiness£ §Rfelicidad§! y la £planet£ §Rhabitabilidad§!."
 #planet_bath_attendants_hive:0 "Drones de asistencia de permutación"
 #mod_job_bath_attendant_hive_add:0 "Trabajos de $job_bath_attendant_hive$"
 #job_bath_attendant_hive_plural:0 "Drones de asistencia de permutación"
 #job_toxic_baths_effect_hive_desc:0 "Los £job_bath_attendant£ drones de asistencia de permutación aumentan el £pops£ §Ymontaje de poblaciones biológicas§!, pero reducen la £planet£ §Rhabitabilidad§!."
 #planet_bath_attendants_machine:0 "Terminal de lubricación"
 #mod_job_bath_attendant_machine_add:0 "Trabajos de $job_bath_attendant_machine$"
 #job_bath_attendant_machine_plural:0 "Terminales de lubricación"
 #job_toxic_baths_effect_machine_desc:0 "Las £job_bath_attendant_machine£ terminales de lubricación convierten los £minerals£ §Yminerales§! en £pops£ §Ymontaje de poblaciones§! y aumentan el £amenities£ §Ruso de servicios§!."
