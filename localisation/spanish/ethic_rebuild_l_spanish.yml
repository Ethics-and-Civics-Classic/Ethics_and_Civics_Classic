 socialism_unrest:0 "Malestar (Atracción Cooperativa)"
 socialism_unrest_desc:0 "El §HMalestar§! en esta colonia ha causado que las Poblaciones locales se vuelvan más atraídas a §YCooperativa§!."
 
 green_unrest:0 "Malestar (Atracción Ecocentrista)"
 green_unrest_desc:0 "El §HMalestar§! en esta colonia ha causado que las Poblaciones locales se vuelvan más atraídas a §YEcocentrista§!."
 
 industrial_unrest:0 "Malestar (Atracción Antropocentrista)"
