 gov_aristocratic_republic:0 "República Aristocrática"
 gov_aristocratic_republic_desc:0 "Una forma de democracia representativa, en la cual solo aquellos que pertenecen a la élite social pueden ser elegidos para el parlamento y gobernar en nombre del pueblo."
 
 gov_oligarchic_republic:0 "República Oligárquica"
 gov_oligarchic_republic_desc:0 "Una forma extremadamente elitista de república, en la cual una cantidad significativa de poder se concentra en las manos de un pequeño grupo privilegiado de personas, con fuerte influencia en las elecciones y los procesos de gobierno."
 
 gov_congress_republic:0 "República Congresional"
 gov_congress_republic_desc:0 "Una forma de democracia representativa, en la cual el poder pertenece a miembros democráticamente electos del parlamento que seleccionan al jefe de gobierno. Cada ciudadano libre puede votar y ser elegido."
 
 gov_noble_aristocracy:0 "Aristocracia Nobiliaria"
 gov_noble_aristocracy_desc:0 "Todo el poder político en esta sociedad pertenece al consejo de representantes de las antiguas casas aristocráticas."
 
 RT_REGENT:0 "Regente"
 
 civic_personality_cult:0 "Culto a la Personalidad"
 civic_personality_cult_desc:0 "El jefe de estado es visto como un paradigma infalible y esta noción, imaginada o no, es fuertemente enforced en toda la sociedad."
 
 gov_soviet_republic:0 "República Soviética"
 gov_soviet_republic_desc:0 "Un tipo de república gobernada por «Soviet» directamente electos -consejos de trabajadores-, que son directamente responsables ante sus electores. No hay separación de poderes, y los delegados electos actúan como legisladores, gobierno y tribunales en uno."
 
 gov_aristocratic_monarchy:0 "Monarquía Aristocrática"
 gov_aristocratic_monarchy_desc:0 "Una forma de monarquía, en la cual el gobernante hereditario no tiene poder absoluto, sino que debe compartirlo con los miembros más influyentes de la nobleza."
 
 edict_div_crusade:0 "$unity_ambition$ Cruzada Divina"
 edict_div_crusade_desc:0 "¡Los infieles impíos perecerán de una vez por todas!"
 
 civic_defenders_faith:0 "Zelotes Militantes"
 civic_defenders_faith_desc:0 "Fundamentalistas religiosos cuyo ejército mantiene una fuerte tradición de entrenamiento marcial intenso, tanto físico como espiritual. Todos deben estar siempre listos para proteger sus creencias religiosas de los infieles.\n\n£building£ §YTemplos§! reemplazan algunos £job_priest£ §YSacerdotes§! con trabajos £job_templar£ §Y$job_templar$§!.  \nAmbición de Unidad Especial: §YCruzada Divina§! \nPuede usar una decisión planetaria especial, §YInquisición§!, que hace que £job_templar£ $job_templar_plural$ produzcan £unity£ Unidad adicional, Estabilidad y aumento de atracción de ética Espiritualista, mientras que la §YPesquisa§! local sufre fuertemente."
 
 gov_liberal_democracy:0 "Democracia Liberal"
 gov_liberal_democracy_desc:0 "Una forma de gobierno caracterizada por elecciones entre múltiples partidos políticos distintos, separación de poderes, economía de mercado con propiedad privada y protección de derechos civiles y libertades políticas."
 
 RT_DUCE:0 "Duce"
 
 gov_anarchy_communism:0 "Comunismo Militar"
 gov_anarchy_communism_desc:0 "Una forma extrema de dictadura comunista, caracterizada por la nacionalización de todas las industrias y la introducción de gestión centralizada estricta, control estatal del comercio exterior, disciplina estricta para los trabajadores, con huelgas prohibidas y deber laboral obligatorio por clases no trabajadoras."
 
 RT_GENERALISSIMO:0 "Generalísimo"
 
 policy_drug_rights:0 "Drogas"
 policy_drug_rights_desc:0 "El levantamiento de restricciones sobre la producción y distribución de drogas psicodélicas y analgésicas proporciona una amplia gama de beneficios potenciales en el campo de la medicina, pero dado que la gente tiende a usar estas sustancias para fines recreativos esto puede resultar en la perturbación de la estabilidad social."
 
 drug_rights_limited:0 "Limitada"
 drug_rights_limited_name:0 "Limitada"
 drug_rights_limited_desc:0 " "
 
 drug_rights_allowed:0 "Permitida"
 drug_rights_allowed_name:0 "Permitida"
 drug_rights_allowed_desc:0 " "
 
 PROGRESSIVE_DRUG_RIGHTS:0 "Drogas Recreativas Permitidas"
 PROGRESSIVE_NO_DRUG_RIGHTS:0 "Permitir Drogas Recreativas"
 PROGRESSIVE_DRUG_RIGHTS_DESC:0 "Permitir a los ciudadanos de nuestro imperio comprar y usar libremente §YDrogas Recreativas§! agradará al [Root.GetName]."
 
 TOTALITARIAN_DRUG_RIGHTS:0 "Drogas Recreativas Prohibidas"
 TOTALITARIAN_NO_DRUG_RIGHTS:0 "Prohibir Drogas Recreativas"
 TOTALITARIAN_DRUG_RIGHTS_DESC:0 "Aplicar controles estrictos sobre la distribución y uso de §YDrogas Recreativas§! en nuestro imperio agradará al [Root.GetName]."
 
 TOTALITARIAN_GUN_RIGHTS:0 "Armas Personales Prohibidas"
 TOTALITARIAN_NO_GUN_RIGHTS:0 "Prohibir Armas Personales"
 TOTALITARIAN_GUN_RIGHTS_DESC:0 "Aplicar controles estrictos sobre la distribución y uso de §YArmas Personales§! en nuestro imperio agradará al [Root.GetName]."
 
 gov_communist_dictatorship:0 "Dictadura Revolucionaria"
 gov_communist_dictatorship_desc:0 "Los trabajadores de esta sociedad han liderado una rebelión exitosa contra sus antiguos amos y se apoderaron de los medios de producción. Durante este período de transición hacia una sociedad comunal, los revolucionarios utilizan el ejército como cuerpo gobernante."
 
 gov_social_democracy:0 "Democracia Social"
 gov_social_democracy_desc:0 "Un gobierno democráticamente elegido implementando una economía mixta. Aunque operando dentro del marco de una economía de mercado capitalista, el gobierno interviene para asegurar cierta redistribución de ingresos y garantizar el bienestar del pueblo."
 
 gov_social_nationalism:0 "Nacional Socialismo"
 gov_social_nationalism_desc:0 "Una forma de gobierno totalitario, caracterizado por intenso nacionalismo, elitismo y gobierno policial dictatorial."
 
 gov_anarch_capitalism:0 "Anarco-Capitalismo"
 gov_anarch_capitalism_desc:0 "Una forma de sociedad donde el tamaño y autoridad del aparato estatal se reduce a un mínimo, y un mercado completamente libre proporciona todos los bienes y servicios públicos, incluyendo ley y orden."
 
 civic_philosopher_king:1 "Rey Filósofo"
 civic_philosopher_king_desc:0 "No es suficiente simplemente gobernar. La Nave del Estado debe ser guiada por un rey que maneje suficiente sabiduría y conocimiento para dirigirla correctamente.\n\n£building£ §YEdificios Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Trabajos con £job_supervisor£ §Y$job_supervisor_plural$§!, quienes producen £unity£ §YUnidad§!, £society_research£ §YPesquisa Sociétal§! y aumentan £mod_planet_amenities_add£ §Y$PLANET_AMENITIES_TITLE$§!."
 
 gov_minarchy:0 "Minarquía"
 gov_minarchy_desc:0 "Una forma de estado minimal «de cartero nocturno», que no es responsable por la educación, atención médica, empleo o transporte de sus ciudadanos. Tampoco hace ningún uso de recursos naturales en su territorio. Todo esto se mantiene en privado o públicamente, pero nunca es susceptible a ninguna interferencia del estado, sus leyes o sus representantes."
 
 XENOIST_UNIVERSALISM:0 "Universalismo Galáctico"
 XENOIST_UNIVERSALISM_DESC:0 "Albergar al menos §Y8§! especies únicas dentro de nuestro imperio agradará enormemente al [Root.GetName]."
 XENOIST_NO_UNIVERSALISM:0 "$XENOIST_UNIVERSALISM$"
 
 IMPERIALIST_DEFENSIVE_PACTS:0 "Alianza Defensiva"
 IMPERIALIST_DEFENSIVE_PACTS_DESC:0 "Firmar Pactos Defensivos con al menos §Y2§! otros imperios agradará al [Root.GetName]."
 NO_IMPERIALIST_DEFENSIVE_PACTS:0 "$IMPERIALIST_DEFENSIVE_PACTS$"
 
 
 AUTHORITY_ELECTION_DIRECT_DEMOCRATIC:0 "Realiza una elección cada §Y5§! años para seleccionar un nuevo Gobernante."
 
 civic_free_haven_desc:0 "Esta sociedad tiene una reputación bien ganada como refugio libre. Los cansados, los pobres, las masas aglomeradas que anhelan respirar libres -todos son bienvenidos aquí, independientemente de su especie u origen.\n\nLa facción §YXenófila§! proporciona influencia adicional para un mayor número de §YEspecies Únicas§! en el imperio (más de 5, 7 y 10)."
 
 civic_inwards_perfection:0 "Aislacionismo"
 civic_inwards_perfection_desc:0 "Esta sociedad tranquila y pacifista tiene poco uso para extraños que no entienden su forma de vida. Más que nada, preferirían ser dejados solos.\n\nNo puede tener §YRivales§!\nNo puede formar §YPactos Defensivos§!\nNo puede formar §YTratados de Migración§!\nNo puede formar §YAcuerdos de Pesquisa§!\nNo puede formar §YPactos Comerciales§!\nNo puede §YGarantizar Independencia§!\nNo puede unirse a §YFederaciones§!\nNo puede §YInfiltrar§! primitivos\nNo puede tener §YSúbditos§! forzados\nNo puede usar política §YGuerras Ilimitadas§!\nConstruir §YGenerador de Escudo Planetario§! produce £unity£ §YUnidad§! adicional\nLa §YPolítica Fronteriza§! es §YCerrada§! por defecto\nLa facción §YAislacionista§! estará feliz con la postura diplomática §YAislacionismo§!"
 
 civic_isolationism:0 "Aislacionismo Paranoico"
 civic_isolationism_desc:0 "Como la gente de esta sociedad xenófoba se muda al espacio, asuntos de seguridad nacional y protección fronteriza se vuelven fuertemente priorizados.\n\n§HGeneradores de Escudo Planetario§! producen £unity£ §YUnidad§! adicional.\nLa §YPolítica Fronteriza§! es §YCerrada§! por defecto."
 
 civic_warrior_culture_desc:0 "Esta sociedad ha desarrollado en una cultura guerrera robusta. La destreza marcial es valorada por encima de todo, y la verdadera gloria solo puede encontrarse en el campo de batalla.\n\nReemplaza £job_entertainer£ §Y$job_entertainer$§! Trabajos con £job_duelist£ §Y$job_duelist$§! Trabajos.\n$job_duelist_effect_desc$ \nComienza con tecnología §YMando Centralizado§!."
 
 mod_rivalries_influence_produces_mult:0 "Ganancia de Influencia de Rivalidad"
 
 gov_republican_dictatorship:0 "Dictadura Republicana"
 gov_republican_dictatorship_desc:0 "Una forma gubernamental donde representantes electos ejercen poder absoluto sobre el estado. Los gobernantes son votados, pero reinan hasta la muerte."
 
 
 mod_planet_enforcers_upkeep_mult:0 "Costo de £job_enforcer£ $job_enforcer_plural$"
 
 mod_decisions_cost_mult:0 "Costo de Decisiones"
 
 
 
 empire_not_capitalist_authoritarian:0 "$TRIGGER_FAIL$Requiere tener combinación de ética §YCompetitiva Fanática§!/§Yno-Libertaria§! O §YAutoritaria§!/§Yno-Cooperativa§!."
 
 civic_ultimate_collective:0 "Utopía Totalitaria"
 civic_ultimate_collective_desc:0 "Una sociedad totalitaria firme, donde toda la economía está bajo estricto control gubernamental, y los ciudadanos están dedicados al estado sin necesidad de coerción.\n\nNo puede usar la economía §YMercado Libre§! y políticas comerciales §YInnovación y Progreso§!."
 
 civic_asceticism:0 "Colectivo Armónico"
 civic_asceticism_desc:0 "Esta sociedad se caracteriza por un fuerte sentido de comunidad espiritual y desarrollo del bien común entre su pueblo.\n\nPermite construcción del £building£ §YSímbolo de Harmonía§!, que aumenta £happiness£ §YFelicidad§! planetaria y §YAtracción de Ética Gubernamental§!, y reduce §YUso de Vivienda de Población§!. Requiere £energy£ §YEnergía§! para mantenimiento."
 
 civic_research_cooperatives:0 "Cooperativas de Pesquisa"
 civic_research_cooperatives_desc:0 "La base cooperativa de esta sociedad generalmente fomenta el mismo enfoque colectivo al progreso científico. Siendo tradicionalmente organizada en cooperativas financiadas por gobierno ayuda a los científicos del imperio a compartir sus hallazgos y realizar su potencial completo.\n\nEl £building£ §YInstituto de Pesquisa§! aumenta producción local de £unity£ §YUnidad§! y proporciona §G+3§! £housing£ §YVivienda§!."
 
 mod_planet_researchers_upkeep_mult:0 "Costo de £job_researcher£ $job_researcher_plural$"
 
 
 
 trait_ruler_immortal:0 "Inmortal"
 trait_ruler_immortal_desc:0 "§LEste individuo está bendecido por los dioses para reinar eternamente.§!\n"
 
 edict_immortal_ruler:0 "Declarar Gobernante Inmortal"
 edict_immortal_ruler_desc:0 "Invocar este Edicto reclamará a nuestro gobernante actual como Inmortal."
 
 
 mod_pop_ethic_capitalism_attraction_mult:0 "Atracción de Ética Competitiva"
 mod_pop_ethic_socialism_attraction_mult:0 "Atracción de Ética Cooperativa"
 
 
 
 POP_ATTRACTION_SOCIALISM_POS:0 "§G+ Ética Gubernamental Cooperativa§!"
 POP_ATTRACTION_SOCIALISM_NEG:0 "§G- Ética Gubernamental Cooperativa§!"
 POP_ATTRACTION_CAPITALISM_POS:0 "§G+ Ética Gubernamental Competitiva§!"
 POP_ATTRACTION_CAPITALISM_NEG:0 "§G- Ética Gubernamental Competitiva§!"
 
