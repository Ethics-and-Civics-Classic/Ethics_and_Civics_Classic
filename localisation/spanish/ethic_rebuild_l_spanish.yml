 civic_xeno_militarist:0 "Intervencionismo"
 civic_xeno_militarist_desc:0 "Siendo naturalmente abierto a culturas alienígenas, esta civilización sin embargo no descuida usar fuerza militar cuando parece justificado mantener un equilibrio global de poder o corregir injusticias percibidas.\n\nPactos §YDefensivos§! y §YGarantizar Independencia§! no cuestan influencia para mantener\nOpciones §Yde Bombardeo§! limitadas\nLa §YFacción Militarista§!:\n - aprueba §YPactos Defensivos§! \n - no proporciona influencia para más de 1 §YRival§! y no exigirá §YDiplomacia Agressiva§! \n - aprobará la política bélica §YGuerras de Liberación§!  \n - aprobará estar en §YFederaciones Militares§! \n\nPermite construcción del edificio £building£ §YCentro de Coordinación Militar Interestelar§! único del imperio, que proporciona un bono a nivel imperio a §YCapacidad Naval§!, §YPeso Diplomático de Flota§!, §YProtección Comercial§! y §YTamaño de Red de Espionaje§!, dependiendo del número de §YEspecies Únicas§! en el imperio."
 
 civic_keepers_harmony:0 "Guardianes de la Harmonía"
 civic_keepers_harmony_desc:0 "La gente de esta sociedad desarrolló un culto espiritual a la naturaleza. Para lograr genuina harmonía con la biosfera, el culto requiere significativo desapego de placeres mundanos.\n\n- Beneficia de varias barreras planetarias ambientales, que proporcionan trabajos especiales de sacerdote, §YDruidas§!, con nivel apropiado de £housing£ Vivienda. Las barreras también aumentan ligeramente §Y$MOD_POP_ENVIRONMENT_TOLERANCE$§!. Algunas barreras planetarias raras y características (como §YBosque Errante§! o §YVida Titánica§!) también proporcionan bonificaciones apropiadas.\n- £building£ §YDomos del Paraíso§! proporcionan £housing£ §YVivienda§! adicional y aumentan producción £unity£ §YUnidad§!.\n- §YDistritos Mineros§! disminuyen £amenities£ §YComodidades§! en §R-1§!.\n§YVoz del Planeta§!: permite implementar una decisión planetaria especial, que erradica anomalías planetarias negativas como §YÁrido§!, §YClima Peligroso§!, §YTormentas Salvajes§!, §YEcología Dañada§!, §YAcechador Mutante§!, §YFauna Peligrosa§!, y §YRadiación de Tierra Desolada§!.\n- §YAdoración de la Naturaleza§!: permite construcción de £building£ §YSantuarios de Naturaleza§! planetario único, que aumentan £unity£ Unidad, £happiness£ Felicidad y atracción §YEcocentrista§! local por cada barrera natural única, y requieren £food£ Alimentos para mantenimiento."
 
 building_nature_sanctuary:0 "Santuario de Naturaleza"
 building_nature_sanctuary_desc:0 "La gente de todo el planeta se reúne aquí, trayendo sus ofrendas para adorar a la Madre Naturaleza. Este monumento aumenta £unity£ Unidad, £happiness£ Felicidad y atracción §YEcocentrista§! local por cada §YBarrera§! natural única, y requiere £food£ Alimentos para mantenimiento."
 
 civic_functional_architecture_desc:1 "Esta sociedad es reconocida por su arquitectura simple y aún funcional. Hay quienes referirían a este estilo arquitectónico como aburrido o incluso deprimente, pero en la mayoría de casos, neo-concreto hace el trabajo igual de bien que cualquier otro material de construcción.\n\nPermite reemplazar £building£ §YResidencias de Lujo§! con £building£ §YVivienda Comunal§!"
 
 civic_eco_warfare:0 "Defensores de la Naturaleza"
 civic_eco_warfare_desc:0 "No solo esta gente está más que lista y capaz de defender su ecosistema con armas en sus manos, sino que también aprendieron aplicar efectivamente avances en ciencias biológicas al militar.\n\n- §YProtección Natural§!: Beneficia de barreras planetarias naturales, que proporcionan trabajos £job_ranger£ $job_ranger$ únicos y reducen §YDaño de Bombardeo Planetario§! en §G5%§! cada una. Anomalías pesadas (como §YVolcán§!, §YMontaña§! o §YFauna Silvestre§!) proporcionan £job_ranger£ $job_ranger_plural$ y £job_foundry£ $job_foundry_plural$ O £job_duelist£ $job_duelist_plural$. Barreras planetarias raras y características (como §YBosque Errante§! o §YVida Titánica§!) también proporcionan trabajos y bonificaciones apropiadas.\n- §YVigilancia de Guardaparques§!: £job_ranger£ $job_ranger_plural$ Especialista Único, que genera §YEjércitos de Defensa§!, aumentan §YCapacidad Naval§!, reducen £crime£ §YCrimen§!, producen £society_research£ Pesquisa Sociétal y £unity£ Unidad.\n- §YNaves Orgánicas§!: Involucrar biotecnología en construcción militar permite naves ganar habilidades especiales, como regeneración de Armadura y Cascara, y también volverse más eficientes energéticamente. La desventaja es que esos materiales son generalmente más frágiles que aleaciones no-orgánicas.\n- §YMedicina Biológica Militar§!: Salud de Ejército está aumentada.\n- §YBiotecnología Militar§!: £job_foundry£ $job_foundry_plural$ gastan §G-1§! £minerals£ y §R+1§! £food£ para producir £alloys£ Aleaciones. £job_biotechnologist£ $job_biotechnologist_plural$ gastan §R+1§! £food£ para producir §G+0.5§! £alloys£ Aleaciones."
 
 COLONIZED_GAIA_WORLDS:0 "Mundo Gaia Colonizado"
 COLONIZED_GAIA_WORLDS_DESC:0 "Poseer un §YMundo Gaia§! agradará al [Root.GetName]."
 
 NATURAL_WONDER:0 "Reserva Natural Nacional"
 NATURAL_WONDER_DESC:0 "Poseer un planeta con todas las barreras naturales posibles (Volcán, Montaña, Fauna Silvestre, Selva, Pantano, Algas, Sima, Glaciar, Arena Movediza) agradará enormemente al [Root.GetName]."
 
 PROTECTED_NATURE:0 "Naturaleza Protegida"
 NO_PROTECTED_NATURE:0 "Encontrar y proteger Naturaleza Extraterrestre"
 PROTECTED_NATURE_DESC:0 "Poseer un mundo con §YLujurioso§!, §YBelleza Natural§!, §YBosque Errante§! o §YBosque Migratorio§! agradará al [Root.GetName]."
 
 PROTECTED_WILDLIFE:0 "Fauna Silvestre Protegida"
 NO_PROTECTED_WILDLIFE:0 "Encontrar y proteger Fauna Nativa"
 PROTECTED_WILDLIFE_DESC:0 "Poseer un mundo con §YFauna Peligrosa§! (ya sea barrera o modificador de planeta) o §YTierras Salvajes§! agradará al [Root.GetName]."
 
 UNIQUE_LIFEFORMS:0 "Formas de Vida Únicas Protegidas"
 NO_UNIQUE_LIFEFORMS:0 "Encontrar y proteger Formas de Vida Únicas"
 UNIQUE_LIFEFORMS_DESC:0 "Poseer un mundo con §YNemma§!, §YVida Titánica§! o §YMascotas Alienígenas§! agradará enormemente al [Root.GetName]."
 
 building_tribal_palace:0 "Ministerio de Seguridad Nacional"
 building_tribal_palace_desc:0 "A medida que el imperio crece en tamaño, así también las amenazas externas, y este departamento se vuelve cada vez más importante, tanto políticamente como administrativamente.\n\nConcede un trabajo de Gobernante a un £job_tribe_speaker£ $job_tribe_speaker$, quien proporciona un bono a nivel imperio a §YCapacidad Administrativa§!, §YCapacidad Naval§!, §YCapacidad de Base Estelar§! y §YInfluencia§! dependiendo del número total de §YPlanetas§! poseídos en el imperio, escalando desde §G5+§! a §G25+§! (para 5/10/15/20/25+ planetas)"

 job_tribe_speaker:0 "Presidente de Seguridad Nacional"
 job_tribe_speaker_plural:0 "Presidentes de Seguridad Nacional"
 job_tribe_speaker_desc:0 "Una figura líder en §YSeguridad Nacional§!"
 job_tribe_speaker_effect_desc:0 "£job_tribe_speaker£ $job_tribe_speaker$ proporciona un bono a nivel imperio a §YCapacidad Administrativa§!, §YCapacidad Naval§!, §YCapacidad de Base Estelar§! y §YInfluencia§!, dependiendo del número de §YPlanetas§! poseídos en el imperio, escalando desde §G5+§! a §G25+§! (para 5/10/15/20/25+ planetas). Su mantenimiento £energy£ Energía está escalado apropiadamente. También generan §YEjércitos de Defensa§!."
