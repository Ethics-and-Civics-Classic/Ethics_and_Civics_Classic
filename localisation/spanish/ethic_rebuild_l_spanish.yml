 civic_slave_race:0 "Especie Esclava"
 civic_slave_race_desc:0 "Una segunda especie, artificialmente diseñada y físicamente formidable, forma parte integral de esta sociedad. Han sido declarados seres inferiores por la especie principal, quienes los consideran adecuados solo para trabajo duro y todo tipo de experimentos genéticos despiadados.\n\nComienza con §Y12§! £pop£ Poblaciones de otra especie, subordinada. Esta especie tiene el rasgo §YGene Esclavo§!, y es mayormente bueno para trabajo primitivo y combate terrestre.\nComienza con las tecnologías §YMapeo Genómico§! y §YImplantes Neurales§!.\nObtiene £society£ §Y$society_research$§! de comer £pop£ Poblaciones Xeno."
 
 gov_xenophile_democracy:0 "Democracia Multicultural"
 gov_xenophile_democracy_desc:0 "Esta sociedad es gobernada por un parlamento electo, consistente en los representantes más honrados de diferentes especies y culturas compartiendo este mundo."
 
 trait_symbiotic:0 "Simbiótico"
 trait_symbiotic_desc:0 "§LEsta especie evolucionó junto con una segunda especie, más avanzada. Sin embargo, son consideradas iguales a la especie principal del mundo y forman parte integral de su sociedad.§!"
 
