 principle_elite_troops_desc:0 "El gobierno asigna recursos significativos para entrenar y mantener fuerzas militares de alta clase."
 
 
 
 
 principle_political_pluralism:0 "Ideales Republicanos"
 principle_political_pluralism_desc:0 "El republicanismo está centrado alrededor de la idea de virtud cívica y el estado como un 'asunto público'. Los ciudadanos ordinarios están generalmente involucrados en la vida política en algún nivel, ya sea a través de debates públicos o elecciones."
 
 principle_meritocracy:1 "Meritocracia Ascendida"
 principle_meritocracy_desc:1 "La única base para el avance en esta sociedad es igual oportunidad para demostrar habilidad y esfuerzo. Así, posiciones de liderazgo son mantenidas por los individuos más calificados.\n\n§YLíderes§! tienen probabilidad significativamente reducida de recibir §YCaracterísticas§! negativas."
 
 principle_beacon_of_liberty:0 "Espíritu de Libertad"
 principle_beacon_of_liberty_desc:0 "Esta sociedad idealiza la libertad personal, manteniendo sobre todo el derecho del individuo para perseguir y cumplir sus propias metas y ambiciones. La reducción de autoridad gubernamental central y regulación burocrática fomenta innovación y flujo libre de personas, bienes e ideas a través de la nación.\n\nPuede construir §YNaves Coloniales Privadas§!\nEl §YNúcleo Comercial§! tiene su §Y$MOD_STARBASE_TRADE_COLLECTION_RANGE_ADD$§! aumentado en §G+1§!\nObligado a usar política económica §YLibre Mercado§!\nLas políticas §YReasentamiento Forzado§!, §YSalud Pública§! y §YEducación Pública§! no están permitidas\nEl estándar de vida §RBienestar Social§! no está disponible."
 
 
