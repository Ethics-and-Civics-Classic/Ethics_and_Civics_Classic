 mod_planet_district_hab_housing_upkeep_mult:0 "Mantenimiento de Distrito de Habitabilidad"
 mod_planet_district_rw_city_upkeep_mult:0 "Mantenimiento de Distrito Ciudad de Mundo Anillo"
 
 #starts game with §YBiotech Consortium§! tech
 
 civic_terraforming:0 "Ingenieros Ecológicos"
 civic_terraforming_desc:0 "Esta civilización tradicionalmente confía en la ciencia para lidiar con problemas ambientales. Usa tecnología para diseñar ecosistemas sostenibles que integran la sociedad con su entorno natural para beneficio de ambos.\n\n- Beneficia de varias características y barreras planetarias naturales, que proporcionan £housing£ §YVivienda§! y trabajos de pesquisa especiales, como §YXenobiólogos§! y §YGeofísicos§!.\n- §YIngeniería de Paisaje§!: permite crear barreras naturales complicadas (§YVolcán§!, §YMontaña§! o §YFauna Silvestre§!), una vez investigada tecnología apropiada para despejar tal barrera.\nDespejar barreras planetarias puede proporcionar varias ganancias de recursos de una sola vez.\n- §YRestauración Ambiental§!: permite invocar una decisión planetaria especial, que erradica anomalías planetarias ambientales particulares, como §YPlaneta Irradiado§!, §YPlanetaria con Marea Bloqueada§! o §YEcología Dañada§!.\n- Comienza con tecnologías §YFiltrado Atmosférico§! y §YEsculpido Terrestre§!.\n- Probabilidad aumentada de seleccionar opción de pesquisa §YAdaptación a Mundo Tumba§!.\n- §YOpciones avanzadas de terraformación§!: puede aprender la tecnología de alto nivel §YPurificación Atmosférica§!, que permite terraformar mundos tóxicos.\n- Permite construcción del edificio £building£ §YInstalación de Control Climático§! único planetario, que proporciona §G+15%§! Habitabilidad, produce £physics_research£ y £society_research£, y requiere §R10§! £energy£ Energía para mantenimiento."
 
 building_climate_control:0 "Instalación de Control Climático"
 building_climate_control_desc:0 "El propósito de esta instalación hi-tecnológica es manipular el clima planetario para hacerlo más adecuado para la especie, con perturbación mínima posible al ambiente local."
 
