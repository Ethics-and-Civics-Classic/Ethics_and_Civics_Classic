 16_FRIENDLY_GREETING:1 "Su gobierno hace un buen trabajo de contener los peores excesos del libertarismo, [From.GetSpeciesNamePlural]."
 04_INSULT_PROPOSE_COL_IND:0 "Qué pueblo tan egoísta son ustedes, siempre poniendo sus individuos individuales primero. Libertarismo... ¡ja! El [Root.GetName] no sobrevivirá el año."
 uplift.7215.c.tooltip:1 "El [From.From.From.GetName] obtiene la Ética §Ylibertaria§!."
 nomad.21.d.response:1 "Son una multitud espiritual y libertaria, qué tan bien eso se ajusta a tu tribu es para que tú discernas."
 observation.2041.desc:0 "Los nativos en [From.GetName] no solo se han enamorado de nuestra tecnología, sino que nuestros asesores reportan que también están comenzando a emular nuestras maneras.\n\nInspirados por lo que han visto de nuestro arte y cultura, la sociedad [From.Owner.GetSpeciesName] parece haber desarrollado un nuevo sentido de libertarismo. Sus libertades personales han aumentado enormemente desde nuestro arribo."
 observation.2061.desc:0 "Anarquía reina suprema en la superficie de [From.GetName], y nuestros asesores están teniendo tiempo difícil enseñando ciencia moderna a los [From.Owner.GetSpeciesNamePlural]. Sus llamados científicos todos tiran su investigación en direcciones que suceden interesarlos por el momento, mostrando poco respeto por el bien común.\n\nNuestra misión de iluminación continúa, a pesar del mal dirigido libertarismo mostrado por los nativos, pero tomará más tiempo que esperado."
