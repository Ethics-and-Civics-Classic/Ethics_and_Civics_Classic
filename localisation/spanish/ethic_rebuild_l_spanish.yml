 allows_new_babylon:0 "Proporciona un Edicto para transformar un mundo poseído en §YMilagro Galáctico: Nueva Babilonia§!. El Edicto solo está disponible si el número de diferentes especies en el imperio es más de 3. El tamaño del planeta será aumentado hasta 10 tiles (no más de 25 en total), y recibirá un modificador permanente, aumentando §YAtracción de Migración Xenó§!, §YHabitabilidad§!, §YUnidad§!, §YPuntos de Investigación Sociológica§!, §YEnergía§! y potencial §LDisturbios§!, y reduciendo su §YAtracción de Ética Gubernamental§!"
