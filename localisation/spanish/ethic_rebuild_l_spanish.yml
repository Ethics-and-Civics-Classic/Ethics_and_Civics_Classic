 civic_natural_capitalism:0 "Capitalismo Natural"
 civic_natural_capitalism_desc:0 "La ideología del Capitalismo Natural (o Ambiental) reconoce la interdependencia crítica entre la producción y uso del capital hecho por humanos y el mantenimiento y suministro del capital natural. Aboga por el desarrollo de sostenibilidad ambiental en el marco de una economía de mercado, caracterizado por la preservación de los bienes y servicios naturales proporcionados por el propio ecosistema.\n\n- §YEcosistema Commercializado§!: Bloqueadores planetarios naturales proporcionan trabajos £job_clerk£ §YContadores§! con nivel apropiado de £housing£ Vivienda, y bono menor de recurso (£food£, £minerals£ o £energy£). Bloqueadores ambientales pesados (como §YVolcán§!, §YMontañas§! o §YFauna Silvestre§!) también proporcionan trabajos £job_merchant£ §YEmprendedor§!. Bloqueadores naturales raros (como §YVida Titánica§! o §YBosques Errantes§!) también proporcionan bonificaciones apropiadas. \n- §YBiotecnología Comercial§!: £job_biotechnologist£ $job_biotechnologist_plural$ también producen £trade_value£ Comercio \n- §YEco-Turismo Desarrollado§!: Permite construcción de £building£ §YCentros de Eco-Turismo§! planetario único, que proporcionan §G+1§! trabajos £job_merchant£ §YEmprendedor§!, y aumentan £trade_value£ Comercio y £amenities£ Comodidades locales por cada barrerra natural único."
 
 civic_natural_capitalism_corporate:0 "Capitalismo Natural"
 civic_natural_capitalism_corporate_desc:0 "La ideología del Capitalismo Natural (o Ambiental) reconoce la interdependencia crítica entre la producción y uso del capital hecho por humanos y el mantenimiento y suministro del capital natural. Aboga por el desarrollo de sostenibilidad ambiental en el marco de una economía de mercado, caracterizado por la preservación de los bienes y servicios naturales proporcionados por el propio ecosistema.\n\n- §YEcosistema Commercializado§!: Bloqueadores planetarios naturales proporcionan trabajos £job_clerk£ §YContadores§! con nivel apropiado de £housing£ Vivienda, y bono menor de recurso (£food£, £minerals£ o £energy£). Bloqueadores ambientales pesados (como §YVolcán§!, §YMontañas§! o §YFauna Silvestre§!) también proporcionan trabajos £job_merchant£ §YEmprendedor§!. Bloqueadores naturales raros (como §YVida Titánica§! o §YBosques Errantes§!) también proporcionan bonificaciones apropiadas. \n- §YBiotecnología Comercial§!: £job_biotechnologist£ $job_biotechnologist_plural$ también producen £trade_value£ Comercio \n- §YEco-Turismo Desarrollado§!: Permite construcción de £building£ §YCentros de Eco-Turismo§! planetario único, que proporcionan §G+1§! trabajos £job_merchant£ §YEmprendedor§!, y aumentan £trade_value£ Comercio y £amenities£ Comodidades locales por cada barrerra natural único."
 
 tech_bioreactor:0 "Biotecnología Industrial"
 tech_bioreactor_desc:0 "Permite construir §YPlantas de Procesamiento Biológico§!, que proporcionan trabajos £job_biotechnologist£ §YBiotecnólogo§! para convertir £food£ §YBiomasa§! en algo de £energy£ Energía, £consumer_goods£ Bienes de Consumo y £alloys£ Aleaciones. $job_artisan_plural$ y $job_foundry_plural$ gastan §G-1§! £minerals£ Mineral y §G+1§! £food£ Alimentos para producir £consumer_goods£ y £alloys£."
 
 job_biotechnologist:0 "Biotecnólogo"
 job_biotechnologist_plural:0 "Biotecnólogos"
 job_biotechnologist_desc:0 "Especialistas que aplican su ciencia y habilidades de ingeniería para procesar biomasa en materiales industriales crudos, usando tecnología ambientalmente inofensiva."
 job_biotechnologist_effect_desc:0 "£job_biotechnologist£ $job_biotechnologist_plural$ convierten £food£ §YBiomasa§! en £energy£ Energía, £consumer_goods£ Bienes de Consumo y £alloys£ Aleaciones."
 mod_job_biotechnologist_add:0 "Trabajos de $job_biotechnologist$"
 mod_job_biotechnologist_per_pop:0 "§G+1§! Trabajo de $job_biotechnologist$ por cada $VALUE$ Poblaciones"
 mod_job_biotechnologist_per_pop_short:0 "\n§G+1§! £mod_job_biotechnologist_add£ por $VALUE$ £pop£"
 
 building_biofuel_plant:0 "Planta de Procesamiento Biológico"
 building_biofuel_plant_desc:0 "Esta instalación aloja equipos de grado industrial diseñados para aislar y extraer compuestos de diversas plantas y cultivos. Tales compuestos son estudiados, procesados y aplicados posteriormente como biocombustibles, materiales compuestos y bienes de consumo."
 
 BIO_TECH:0 "§YBiotecnología Avanzada§!: Permite aprender la tecnología §YBiotecnología Industrial§! y contratar £job_biotechnologist£ $job_biotechnologist_plural$. No disponible para imperios Litoide."
 
 job_hedonist:0 "Hedonista"
 job_hedonist_plural:0 "Hedonistas"
 job_hedonist_desc:0 "Vivir una vida de total opulencia, donde cada necesidad o deseo material posible puede ser satisfecho."
 job_hedonist_effect_desc:0 "£job_hedonist£ $job_hedonist_plural$ consumen £food£ Alimentos y £consumer_goods£ Bienes de Consumo, y producen £unity£ Unidad."
