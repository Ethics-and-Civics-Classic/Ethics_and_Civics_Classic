 civic_labour_unions:0 "Sindicatos Laborales"
 civic_labour_unions_desc:0 "Los trabajadores de esta sociedad están tradicionalmente involucrados en tomar decisiones, y comparten autoridad y responsabilidad en el lugar de trabajo, lo que resulta en productividad aumentada y entrega de servicios de una fuerza laboral más comprometida y feliz.\n\n§YDistritos de Minería§!, §YGranjas§! y §YGeneradores§! proporcionan §G+1§! £housing£ Vivienda cada uno\n\nLa versión avanzada de este civismo es §YSindicalismo§!"
 
 civic_welfare_state:0 "Estado Social"
 civic_welfare_state_desc:0 "En esta sociedad el estado tradicionalmente mantiene autoridad significativa mientras juega un papel clave en la protección y promoción del bienestar económico y social de sus ciudadanos.\n\n§YDistritos Ciudad§! proporcionan §G+1§! £housing£ §YVivienda§!. §YAdministradores§! proporcionan §G+2§! £amenities£ §YComodidades§!.\nNo puede usar las políticas §YSalud Privada§! o §YEducación Privada§!."
 
 civic_shared_burden:1 "Sindicalismo"
 civic_shared_burden_desc:1 "Esta sociedad preserva los ideales del sindicalismo, con unidades económicas siendo directamente gestionadas por trabajadores para asegurar distribución equitativa de recursos, y garantizar igualdad social y económica para todos.\n\n§HPolítica §Wde §REsclavitud§W está §Rprohibida§W.§!\n\n- §YDistritos de Minería§!, §YGranjas§!, §YGeneradores§! y §YIndustriales§! proporcionan §G+1§! £housing£ Vivienda cada uno y tienen mantenimiento aumentado en §R25%§!.\n- Permite Trabajo Especial de Trabajador: £job_primitive_laborer£ §YHéroe Laboral§!, que produce pequeñas cantidades de £minerals£ §YMinerales§!, £food£ §YAlimentos§!, £energy£ §YEnergía§! y £unity£ §YUnidad§!.\n-Obligado a vivir bajo estándares de vida §Yde Igualdad Social§!\n- La facción §YTrabajo§! estará feliz\n- Permitido invocar Edicto especial: §YObras Públicas§!"
 
 REGULATED_TRADE:0 "Comercio Regulado: Enfoque Social"
 REGULATED_TRADE_DESC:0 "Implementar ya sea la política comercial §YDesarrollo Industrial§! o §YDesarrollo Social§! agradará al [Root.GetName]."
 
 civic_tooltip_byzantine_bureaucracy_effects:2 "£job_bureaucrat£ §Y$job_bureaucrat_plural$§! también producen §Y1§! £unity£ Unidad, £job_administrator£ §Y$job_administrator_plural$§! adicionalmente aumentan §Y$MOD_COUNTRY_ADMIN_CAP_ADD$§! en §G+5§!, y consumen §Y0.5§! £consumer_goods£ Bienes de Consumo"
 
