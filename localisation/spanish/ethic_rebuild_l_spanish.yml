 job_commandante_pirate_effect_desc:0 "£job_commandante_pirate£ $job_commandante_pirate_plural$ aumentan la §YCapacidad Naval§! del Imperio, generan §YEjércitos de Defensa§!, aumentan la §YEstabilidad§! planetaria, reducen el daño del §YBombardeo§! y producen una pequeña cantidad de £amenities£ §YComodidades§!."
