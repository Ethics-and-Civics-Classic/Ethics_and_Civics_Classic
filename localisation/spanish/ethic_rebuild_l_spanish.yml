 civic_symbiotic_race:0 "Simbiontes Sociales"
 civic_symbiotic_race_desc:0 "Una segunda especie, artificialmente diseñada y físicamente formidable, forma parte integral de esta sociedad. A pesar de sus diferencias notables la especie principal gobernando su mundo natal común los considera iguales, en gran medida debido a su actitud empática hacia diferentes formas de vida.\n\n- Comienza con §Y12§! £pop£ Poblaciones de otra especie, subordinada. Esta especie tiene el rasgo §YSimbiótico§!, puede generar §YLíderes§! y tomar trabajos §YEspecialistas§!.\n- Comienza con las tecnologías §YMapeo Genómico§! y §YActivadores Epigenéticos§!.\n- £building£ §YTanques de Clonación§! mejoran producción £unity£ §YUnidad§! planetaria.\n- En §YElevación§! exitosa gana un modificador de 10 años en todo el imperio, que aumenta £unity£ §YUnidad§! y £society_research£ §YPesquisa Sociétal§!.\n- La facción §YTecnologista§! estará complacida al adoptar el beneficio de ascensión §YEvolución Ingenierada§!."
 
