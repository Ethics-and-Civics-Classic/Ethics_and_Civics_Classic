 tech_thermal_borehole:0 "Extracción del Núcleo Profundo"
 tech_thermal_borehole_desc:0 "Desbloquea construcción de §YPoço Térmico§!, que proporciona trabajos £job_deep_miner£ §YIngenieros del Núcleo Profundo§!."
 
 civic_martial_brotherhood:0 "Hermandad Marcial"
 civic_martial_brotherhood_desc:0 "Las fuerzas armadas son consideradas una parte integral de esta sociedad -un símbolo de su unidad y colectivismo. Servir es un honor en lugar de una deuda u obligación.\n\n£job_soldier£ §Y$job_soldier_plural$§! también producen §Y2§! £unity£ Unidad.\n§YAcademias Militares§! proporcionan §G+2§! £housing£ Vivienda adicionales y producen £unity£ Unidad.\nLa facción §YMilitarista§! proporciona aprobación adicional."
 
 MARTIAL_BROTHERHOOD:0 "Hermandad Marcial"
 MARTIAL_BROTHERHOOD_DESC:0 "Un civismo gubernamental §YHermandad Marcial§! activo agrada al [Root.GetName]."
 
 civic_distributism:0 "Distributismo"
 civic_distributism_desc:0 "Una ideología que plantea que la ética tiene un lugar en la economía de mercado. Aunque aboga por derechos fundamentales de propiedad privada, afirma que los medios de producción deberían ser ampliamente poseídos y distribuidos, en lugar de concentrados en las manos de pocos individuos o corporaciones. Así, generalmente favorece pequeños emprendedores y negocios familiares, así como serias regulaciones antimonopolio.\n\nLa mayoría de trabajos §YEspecialistas§! (recursos, bienes, comodidades) además producen algo de £trade_value£ Valor Comercial.\nDesbloquea trabajo especial de sacerdote: §YPredicadores de Riqueza§!, que producen £unity£ Unidad y aumentan £trade_value£ Valor Comercial planetario.\nNo puede construir §YBolsa Galáctica§! ni tener trabajos £job_mogul£ §YMagnate§!."
 
 civic_star_settlers:0 "Colonos Estelares"
 civic_star_settlers_desc:0 "Al comenzar la exploración espacial, esta civilización abrazó un fuerte espíritu pionero. La gente tiende a expandir vastamente sus territorios mediante expansión pacífica y colonización, reasentando lo más ampliamente posible.\n\nComienza con la tecnología §YAmbiciones Galácticas§! ya desbloqueada.\n£job_colonist£ §Y$job_colonist_plural$§! también producen §Y10§! £unity£ Unidad.\nNo puede usar las políticas §YTransporte Militar§! o §YTelecomunicaciones Militares§!"
 
 gov_military_corp:0 "Corporación Militar Privada"
 gov_military_corp_desc:0 "El gobierno está representado por una masiva holdings militar-industrial, con el consejo de administración consistente únicamente en líderes militares activos y retirados."
 
 6_HAPPINESS:0 "§G+6%§! £happiness£"
 
 requires_ap_world_shaper:0 "$TRIGGER_FAIL$Requiere adoptar el beneficio de ascensión §YModelador Mundial§!."
 
 allow_dead_terraform:0 "Desbloquea tecnologías especiales, permitiendo terraformar mundos muertos, como §YCongelado§!, §Y fundido§! o §YTóxico§! en tipos específicos de habitables."
 
 ap_mastery_of_terraforming:0 "Renaciador Mundial"
 ap_mastery_of_terraforming_desc:0 " "
 
 civic_genetic_aristocracy:0 "Aristocracia Genética"
 civic_genetic_aristocracy_desc:0 "En esta sociedad materialista las posiciones de liderazgo están tradicionalmente ocupadas por individuos elegidos y preparados principalmente sobre la base de su superioridad genética."
 
 gov_great_houses:0 "Grandes Casas"
 gov_great_houses_desc:0 "Esta civilización es gobernada por un consejo de liderazgo de pocas grandes casas, con tradiciones derivadas de clanes y tribus antiguas, pero que ahora funcionan más como partidos políticos. A diferencia de una Aristocracia Nobiliaria clásica, la membresía de casa no está ligada a linaje, como nacimiento o matrimonio, sino que cualquiera puede ser adoptado en una casa y avanzar a sus rangos más altos, mientras juran lealtad a la casa y preserven sus tradiciones."
 
 GENETIC_SUPERIORITY:2 "Superioridad Genética"
 NO_GENETIC_SUPERIORITY:1 "Superioridad Genética"
 GENETIC_SUPERIORITY_DESC:2 "Adoptar el Beneficio de Ascensión §YEvolución Ingenierada§! agradará al [Root.GetName]."
 
 mod_planet_pops_minerals_upkeep_mult:1 "Costo de Minerales de Población"
 
 personality_evangelising_zealots_machine:0 "Fanáticos Evangelizadores"
 personality_evangelising_zealots_machine_desc:0 "Los Fanáticos Evangelizadores buscan difundir su fe a través de la galaxia, y no dudan en usar fuerza militar para forzar a otros a aceptar sus creencias."
 
 personality_spiritual_seekers_machine:0 "Buscadores Espirituales"
 personality_spiritual_seekers_machine_desc:0 "Los Buscadores Espirituales creen que toda vida está conectada a través de algún poder superior que puede entenderse a través de sus creaciones. Buscarán cooperación pacífica con otros imperios en la esperanza de estudiar su conexión con lo divino."
 
 civic_merchant_guilds:1 "Élite Financiera"
 civic_merchant_guilds_desc:2 "En esta sociedad la riqueza equivale a poder. Los estratos superiores de la sociedad están ocupados por los ricos, mientras la clase trabajadora es sistemáticamente oprimida.\n\n- §YEdificios Capitales§! reemplazan algunos £job_administrator£ §YAdministradores§! con trabajos £job_mogul£ §Y$job_mogul$§!, que producen £trade_value£ §YValor Comercial§! y £amenities£ §YComodidades§!.\n- Construir §YBolsa Galáctica§! proporciona trabajos £job_mogul£ §Y$job_mogul$§! adicionales y aumenta £trade_value£ §YValor Comercial§! planetario en §G+5%§!. \n- Comienza con la tecnología §Y$tech_power_hub_1$§!.\n- No puede usar las políticas §YSalud Pública§! o §YEducación Pública§!. \n- §YCabildeo Corporativo:§! La facción §YEmprendedores§! proporciona aprobación adicional. \n- §YExplotación Despiadada§!: cada £job_mogul£ §Y$job_mogul$§! aumenta producción £energy£ Energía de trabajadores locales en §G+7%§!."
 
 civic_state_monopoly:0 "Capitalismo Despiadado"
 civic_state_monopoly_desc:0 "Una distopía socioeconómica, donde todo poder político está concentrado en las manos de oligarcas y sus corporaciones, que cruelmente explotan al resto de la población en nombre de aumentar indefinidamente su riqueza.\n\n-Obligado a vivir bajo estándares de vida §Yde Economía Estratificada§!.\n-£building£ §YEdificios Capitales§! reemplazan algunos £job_administrator£ §YAdministradores§! con trabajos £job_mogul£ §Y$job_mogul$§!.\n-La §YBolsa Galáctica§! proporciona §G+1§! trabajos £job_mogul£ §Y$job_mogul$§! adicionales y aumenta £trade_value£ §YValor Comercial§! planetario en §G+5%§!.\n- §YCabildeo Corporativo:§! La facción §YEmprendedores§! proporciona aprobación adicional.\n- §YExplotación Despiadada§!: cada §Y$job_mogul$§! aumenta producción £energy£ §YEnergía§! y £minerals£ §YMinerales§! de trabajadores locales en §G+7%§!.\n-Comienza con la tecnología §Y$tech_power_hub_2$§!.\n-No puede usar las políticas §YSalud Pública§! o §YEducación Pública§!. \n-Considerado una versión avanzada del civismo §YÉlite Financiera§!."
 
 #Wasn't this axis removed?
 ethic_elitist:0 "Elitista"
 ethic_elitist_desc:0 "Las sociedades elitistas son aquellas que apoyan alguna jerarquía implícita o explícita entre grupos sociales, diferenciada por cosas como raza, sexo, edad o riqueza."
 ethic_fanatic_elitist:0 "Fanático Elitista"
 ethic_fanatic_elitist_desc:0 "La sociedad es una manada, con pastores y perros guardianes; la sociedad es una lucha, con ganadores y perdedores. Las masas incultas, poco mejores que animales, necesitan el liderazgo de aquellos pocos destinados con el acierto necesario, visión y fuerza para guiarlos hacia un propósito mayor. ¿Quiénes mejores que nosotros?"
 
 ethic_pluralist:0 "Pluralista"
 ethic_pluralist_desc:0 "Las sociedades pluralistas son aquellas en las que las personas son consideradas iguales en términos de derechos civiles y movilidad social. Se toman esfuerzos especiales para asegurar que la competencia por posiciones de liderazgo esté abierta a tantos individuos capaces como sea posible."
 ethic_fanatic_pluralist:0 "Fanático Pluralista"
 ethic_fanatic_pluralist_desc:0 "Todos somos dignos de la misma dignidad y del mismo respeto básico, pues dentro de cada uno de nosotros yace el potencial para la grandeza, para un golpe de suerte o genio, para la muy salvación de nuestra especie. Sí, no todos nacimos iguales, pero ¿qué importa eso cuando estamos igualmente dotados con la capacidad de crear?"
 
 ethic_industrial:0 "Industrialista"
 ethic_fanatic_industrial:0 "Fanático Industrialista"
 ethic_industrial_desc:1 "§LLos industrialistas comparten un sistema de valor antropocéntrico, considerándose a sí mismos maestros de la biosfera, quienes tienen derechos morales para explotar la naturaleza y sus recursos en nombre de su propia prosperidad, incluso si esto implica discriminación de otras especies biológicas. También puede llamarse «Elitismo Biosférico»§!"
 ethic_fanatic_industrial_desc:1 "§LA través de nuestras invenciones, fuimos capaces de elevar la civilización del polvo y doblar las fuerzas de la naturaleza a nuestra voluntad. A nuestro comando, otros planetas renunciarán a sus riquezas y magníficas fábricas los recogerán. Este poder demanda ser usado, y a través de su uso, remodelaremos la galaxia a nuestra propia imagen.§!\n\nEl Edicto §Yde Campaña de Reciclaje§! no está disponible."
 
 ethic_green:0 "Ecocentrista"
 ethic_fanatic_green:0 "Fanático Ecocentrista"
 ethic_green_desc:1 "§LLos adherentes del Ecocentrismo siguen un sistema de valores, según el cual no hay divisiones existenciales entre ellos y la biosfera que habitan y que ninguna especie inteligente está por encima de la naturaleza. Puede así verse como «Egalitarismo Biosférico». El enfoque ecocéntrico a la economía está basado en la idea de desarrollo sostenible, que implica uso más eficiente de recursos naturales, consumismo limitado y crecimiento poblacional controlado§!"
 ethic_fanatic_green_desc:1 "§LNuestros músicos no pueden componer una melodía tan profunda como las canciones de la fauna silvestre y los susurros de los árboles. Nuestros artistas no pueden capturar la majestad ineffable de cimas montañosas, lagos secluded, o vastas cavernas. Ya sea por diseño o por azar, hemos nacido en un universo de belleza natural trascendente; ningún costo es demasiado alto para asegurar su preservación continua.§!\n\n"
 
