 civic_parliamentary_system:1 "Pluralismo Político"
 civic_parliamentary_system_desc:1 "En esta sociedad el debate público animado sobre cualquier tema es fomentado a través de un sistema parlamentario muy diverso. Granjear favor con una de las facciones políticas dominantes puede resultar ser bastante ventajoso.\n\nTodas las facciones estarán felices y proporcionarán aprobación adicional\n\nLa facción §YProgresista§! exigirá establecer un gobierno §YDemocrático§!, para no-democracias."
 
 POLITICAL_PLURALISM:0 "Pluralismo Político"
 POLITICAL_PLURALISM_DESC:0 "Fomentar discusión política pública a través de un civismo §YSistema Parlamentario§! activo agradará al [Root.GetName]."
 
 civic_consumerism:0 "Consumismo Desperdiciador"
 civic_consumerism_desc:0 "Esta sociedad comparte una ideología social y económica que fomenta la adquisición de bienes y servicios en cantidades siempre crecientes.\n- §YContadores§! proporcionan §G+1§! £trade_value£ Valor Comercial y £amenities£ Comodidades.\n- §YArtesanos§! producen §G+1§! de £consumer_goods£ Bienes y §YEntretenedores§! proporcionan §G+2§! £amenities£ Comodidades\n- £building£ §YZonas Comerciales§!, §YMegaplexes Comerciales§!, §YDistritos Ciudad§!, §YDistritos Comerciales de Mundo Anillo§! y §YDistritos Comerciales de Hábitat§! proporcionan trabajos £job_clerk£ §YContador§! y £job_merchant£ §YEmprendedor§! adicionales.\n- £building£ §YMegaplexes Comerciales§! producen £unity£ Unidad.\n- Trabajos £job_merchant£ §YEmprendedor§! son generalmente más productivos.\n- La facción §YEmprendedores§! proporcionará aprobación adicional para la política comercial §YBeneficios para Consumidores§!."
 
 civic_consumerism_corporate:0 "Consumismo Desperdiciador"
 civic_consumerism_corporate_desc:0 "Esta sociedad comparte una ideología social y económica que fomenta la adquisición de bienes y servicios en cantidades siempre crecientes.\n- §YContadores§! proporcionan §G+1§! £trade_value£ Valor Comercial y £amenities£ Comodidades.\n- §YArtesanos§! producen §G+1§! de £consumer_goods£ Bienes y §YEntretenedores§! proporcionan §G+2§! £amenities£ Comodidades\n- £building£ §YZonas Comerciales§!, §YMegaplexes Comerciales§!, §YDistritos Ciudad§!, §YDistritos Comerciales de Mundo Anillo§! y §YDistritos Comerciales de Hábitat§! proporcionan trabajos £job_clerk£ §YContador§! y £job_merchant£ §YEmprendedor§! adicionales.\n- £building£ §YMegaplexes Comerciales§! producen £unity£ Unidad.\n- Trabajos £job_merchant£ §YEmprendedor§! son generalmente más productivos.\n- La facción §YEmprendedores§! proporcionará aprobación adicional para la política comercial §YBeneficios para Consumidores§!."
 
 civic_divine_council:0 "Consejo Divino"
 civic_divine_council_desc:0 "El gobierno de este imperio es supervisado por un consejo de líderes religiosos más influyentes de la sociedad.\n\n£building£ §YEdificios Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Trabajos con £job_high_priest£ §Y$job_high_priest_plural$§!. Los £building£ §YNexo Sagrado§! y £building£ §YCitadela de Fe§! proporcionan trabajos £job_high_priest£ §YSumo Sacerdote§! adicionales.\n£job_priest£ §Y$job_priest_plural$§! producen §G+1§! £unity£ Unidad"
 
