 principle_hegemon:0 "Imperialismo"
 principle_hegemon_desc:0 "Este imperio trata con sus súbditos desde una posición de poder y fuerza, obligándolos con contribuciones significativas al señor supremo. Los súbditos están permitidos a colonizar fuera de sus fronteras."
 
 ethic_capitalism:0 "Competitivo"
 ethic_fanatic_capitalism:0 "Competitivo Fanático"
 ethic_capitalism_desc:1 "§LLa ambición personal es el motor del progreso. El deseo de mejorar, el impulso de perseguirlo: estas son las cosas que han traído las estrellas mismas a nuestros dedos. Debemos continuar protegiendo nuestras libertades ganadas con dificultad de expresión de los temores irracionales de conformistas, y nunca permitir que el genio sea retenido por el genericismo.§!\n"
 ethic_fanatic_capitalism_desc:1 "§LNo hay mandato mayor que el llamado a sobresalir, a acumular, a reinvertir. Del choque de ambiciones surgen grandes fortunas, y con ellas, ambiciones cada vez mayores. La rueda gira, aplastando a los no aptos debajo de ella, pero trayendo nuevos esforzados con cada paso. Sabemos - nosotros ejemplificamos - que lo que es mejor para los mejores de nosotros es, finalmente, lo que es bueno para todos nosotros."
 
 ethic_socialism:0 "Cooperativo"
 ethic_fanatic_socialism:0 "Cooperativo Fanático"
 
 ethic_socialism_desc:0 "§LEl trabajo en equipo es el motor del progreso. Trabajando lado a lado, nos convertimos en algo más que la suma de nuestras partes: un gran organismo viviente, con cada uno de nosotros una célula. Realizar diligentemente las tareas que se nos dan es todo lo que se nos pide; contribuir al bien común es todo lo que pedimos de nosotros mismos.§!\n"
 ethic_fanatic_socialism_desc:0 "§LNo hay mandato mayor que el llamado a encontrar tu lugar en el gran trabajo, a dar de ti mismo, a compartir la fruta común. Acumular egoístamente riqueza, tierra, o máquinas - estos son síntomas tumorales dentro del cuerpo político. Más bien, es la carga que compartimos cuidando a los jóvenes, a los viejos, y a los enfermos que juntos nos hace fuertes, que juntos nos hace uno.§!\n"
 
 ethic_egalitarian_desc:1 "§LEl Libertarismo aboga por libertad en la sociedad, promoviendo autonomía y libertad política, enfatizando asociación libre, libertad de elección, asociación voluntaria e individualismo, y basando su eficiencia en la reducción de centralización de poder y regulaciones.§!\n"
 ethic_fanatic_egalitarian_desc:1 "§LEl Libertarismo Radical se compromete a sostener la libertad como principio central de la sociedad, basado en autonomía y autogobierno, y aborrece cualquier forma de tiranía u opresión; todos son iguales en dignidad y derechos, el poder político reside en el individuo primordialmente.§!\n"
 
 principle_pilgrims:0 "Pioneros Aventureros"
 principle_pilgrims_desc:0 "Esta sociedad tiene tradiciones nómadas de larga data y un fuerte espíritu aventurero. La gente tiende a expandir vastamente sus territorios, reasentándose tan ampliamente como es posible."
 
 principle_free_market:0 "Libre Mercado"
 principle_free_market_desc:0 "Un sistema económico idealizado donde los precios de bienes y servicios son determinados exclusivamente por productores y consumidores, y las leyes y fuerzas de oferta y demanda están libres de cualquier intervención de gobierno, monopolio fijador de precios, u otra autoridad."
 
