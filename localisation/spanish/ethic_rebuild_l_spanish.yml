 civic_evangelism:0 "Evangelismo"
 civic_evangelism_desc:0 "La gente de esta civilización realmente cree que toda vida sentiente en el universo está unida por un espíritu superior. Ahora están ansiosos por difundir su fe a través de la galaxia.\n\nPermite construcción del edificio £building£ §YTemplo de Unidad Galáctica§! único del imperio, que proporciona un bono a nivel imperio a £unity£ Unidad, §YPeso Diplomático de Poblaciones§!, £happiness£ Felicidad, §YAtracción de Inmigración§! y §YAtracción de Ética Xenófila§!, dependiendo del número de §YEspecies Únicas§! en el imperio"
 
 building_galactic_navy_academy:0 "Centro de Coordinación Militar Interestelar"
 building_galactic_navy_academy_desc:0 "Concede un trabajo de Gobernante a un £job_head_commander£ $job_head_commander$, quien proporciona un bono a nivel imperio a §YCapacidad Naval§!, §YPeso Diplomático de Flota§!, §YProtección Comercial§! y §YTamaño de Red de Espionaje§!, dependiendo del número de §YEspecies Únicas§! en el imperio, escalando desde §G10§! a §G100+§! (para 10/25/40/55/70/85/100/100+ especies). También generan §YEjércitos de Defensa§! locales."
 
 job_head_commander:0 "Alto Comandante"
 job_head_commander_plural:0 "Altos Comandantes"
 job_head_commander_desc:0 "Una figura líder en el §YCentro de Coordinación Militar Interestelar§!"
 job_head_commander_effect_desc:0 "£job_head_commander£ $job_head_commander$ proporcionan un bono a nivel imperio a §YCapacidad Naval§!, §YPeso Diplomático de Flota§!, §YProtección Comercial§! y §YTamaño de Red de Espionaje§!, dependiendo del número de §YEspecies Únicas§! en el imperio, escalando desde §G10§! a §G100+§! (para 10/25/40/55/70/85/100/100+ especies). Su mantenimiento en £energy£ Energía está escalado apropiadamente. También generan §YEjércitos de Defensa§! locales."
