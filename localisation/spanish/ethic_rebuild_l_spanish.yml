 gov_cor_dictatorship:0 "Dictadura Corporativa"
 gov_cor_dictatorship_desc:0 "Una forma de gobierno extremamente capitalista, donde corporaciones poderosas tomaron completamente el control de la vida política y económica de la sociedad."
 
 
