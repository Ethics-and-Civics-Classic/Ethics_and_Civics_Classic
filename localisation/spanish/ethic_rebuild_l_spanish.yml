 civic_chosen_people:0 "Pueblo Elegido"
 civic_chosen_people_desc:0 "Estas personas preservan religiosamente su unicidad biológica y cultural, considerándose excepcionales y elegidos por un poder superior para dominar la galaxia.\n\nPermite construcción de £building£ §YSímbolo de Pureza§!, que aumenta producción £unity£ §YUnidad§! planetaria, §YCrecimiento de Población§! y atracción §Yde Ética Xenófoba§!, y requiere £energy£ §YEnergía§! para mantenimiento."
 
