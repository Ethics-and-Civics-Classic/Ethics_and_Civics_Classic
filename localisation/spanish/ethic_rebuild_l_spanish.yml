 civic_meritocratic_capitalism:0 "Capitalismo Meritocrático"
 civic_meritocratic_capitalism_desc:0 "En esta sociedad, la competencia de mercado abierta y justa mejora el espíritu empresarial y conduce a una economía sustancialmente más productiva y de crecimiento más rápido.\n\n£job_merchant£ §YEmprendedor§! Trabajos producen £unity£ Unidad\n\nEsta es una versión alternativa del civismo §YMeritocracia Ascendida§!"
 
 civic_meritocratic_capitalism_corporate:0 "Capitalismo Meritocrático"
 civic_meritocratic_capitalism_corporate_desc:0 "En esta sociedad, la competencia de mercado abierta y justa mejora el espíritu empresarial y conduce a una economía sustancialmente más productiva y de crecimiento más rápido.\n\n£job_merchant£ §YEmprendedor§! Trabajos producen £unity£ Unidad\n\nEsta es una versión alternativa del civismo §YMeritocracia Ascendida§!"
 
 civic_harmonious_hierarchy:0 "Jerarquía Armónica"
 civic_harmonious_hierarchy_desc:0 "Cierto nivel de armonía se mantiene tradicionalmente entre estratos sociales, mientras la élite gobernante dirige el estado y su economía en los mejores intereses de las clases bajas.\n\n£job_noble£ §Y$job_noble_plural$§! §Wtambién producen adicionales§! £unity£ §WUnidad, Estabilidad§!, £amenities£ §WComodidades y§! £society£ §WPesquisa Sociétal§!.\n£building£ §Y$building_noble_estates$§! §Wproporcionan§! §G+1§! §Y$job_noble$§! §Wpor cada 33 poblaciones§!, §G+2§! £housing£ §WVivienda y aumentan§! §Y$MOD_POP_GOVERNMENT_ETHIC_ATTRACTION$§!§W.§!\n£building£ §YEdificios Capitales§! §Wreemplazan algunos§! £job_executive£ §Y$job_politician$§! §WTrabajos con§! £job_noble£ §Y$job_noble_plural$§!\n§!No puede esclavizar su propia especie\n\nEsta es una versión alternativa del§! §YAristocracia Patrimonial§! §Wcívico§!"
  
 civic_harmonious_hierarchy_corporate:0 "Armonía Entre Clases"
 civic_harmonious_hierarchy_corporate_desc:0 "Cierto nivel de armonía se mantiene tradicionalmente entre estratos sociales, mientras las élites dirigen la Megacorporación y la mayoría de ganancias se comparte con las clases trabajadoras.\n\n£job_noble£ §Y$job_noble_plural$§! §Wtambién producen adicionales§! £unity£ §WUnidad, Estabilidad§!, £amenities£ §WComodidades y§! £society£ §WPesquisa Sociétal§!.\n£building£ §Y$building_noble_estates$§! §Wproporcionan§! §G+1§! §Y$job_noble$§! §Wpor cada 33 poblaciones§!, §G+2§! £housing£ §WVivienda y aumentan§! §Y$MOD_POP_GOVERNMENT_ETHIC_ATTRACTION$§!§W.§!\n£building£ §YEdificios Capitales§! §Wreemplazan algunos§! £job_executive£ §Y$job_executive$§! §WTrabajos con§! £job_noble£ §Y$job_noble_plural$§!\n§!No puede esclavizar su propia especie\n\nEsta es una versión alternativa del§! §YAristocracia Patrimonial§! §Wcívico§!"
  
