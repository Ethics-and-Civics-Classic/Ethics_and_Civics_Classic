 BLOCKERS_BENEFITS:0 "§YNaturaleza Protegida§!: Bloqueadores planetarios naturales despejables, cada uno produciendo pequeña cantidad de £unity£ Unidad, £amenities£ Comodidades y £society_research£ Pesquisa Sociétal."
 
