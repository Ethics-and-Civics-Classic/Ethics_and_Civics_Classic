 NATIONAL_SECURITY:0 "\n§YSeguridad Nacional§!: a medida que el imperio crece al tamaño de §G5+§! planetas, se le permite construir el edificio £building£ §YMinisterio de Seguridad Nacional§! único del imperio, que proporciona bonos a nivel imperio a §YCapacidad Administrativa§!, §YCapacidad Naval§!, §YCapacidad de Base Estelar§! y §YInfluencia§!, escalados con el número de planetas poseídos (desde §G5§! a §G25+§! planetas)"
 
 decision_witch_hunt:0 "Cacería de Brujas"
 decision_witch_hunt_desc:0 "¡Esos herejes serán procesados y purgados!"
 decision_witch_hunt_effects_custom:0 "£job_templar£ $job_templar_plural$ producen Unidad adicional, Estabilidad y atracción de ética Espiritualista, mientras que la actividad de pesquisa local sufre enormemente."
 
 decision_end_witch_hunt:0 "Terminar Cacería de Brujas"
 decision_end_witch_hunt_desc:0 "Termina la Cacería de Brujas en curso"
 decision_end_witch_hunt_effects_custom:0 "La decisión termina la Cacería de Brujas en curso"
 
 civic_imperial_cult_desc:1 "Esta sociedad tiene una religión estatal dominante donde el gobernante es adorado como un deidad viviente.\n\n£building£ §YEdificios Capitales§! reemplazan algunos £job_administrator£ §Y$job_administrator$§! Trabajos con £job_high_priest£ §Y$job_high_priest_plural$§!. Los £building£ §YNexo Sagrado§! y £building£ §YCitadela de Fe§! proporcionan trabajos £job_high_priest£ §YSumo Sacerdote§! adicionales.\n£job_priest£ §Y$job_priest_plural$§! producen §G+1§! £unity£ Unidad.\n§YEmperador-Dios§!: permite un Edicto especial, que hace inmortal al Gobernante actual.\nLa Ambición §YRevolución Científica§! no está disponible"
 
 civic_war_industry:1 "Industria Militar"
 civic_war_industry_desc:1 "Esta sociedad tiene un complejo militar-industrial altamente desarrollado. Sus naves y armas son de la más alta calidad, pero bastante caras de mantener."
 
 civic_tooltip_shadow_council_effects:1 "£job_administrator£ §Y$job_administrator_plural$§! proporcionan §G+2§! Estabilidad cada uno\n\n"
 
