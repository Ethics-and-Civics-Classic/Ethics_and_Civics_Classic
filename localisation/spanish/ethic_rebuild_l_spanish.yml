 principle_drone_brotherhood:0 "Hermandad de Drones"
 principle_drone_brotherhood_desc:0 "En esta sociedad personas de clase trabajadora son tradicionalmente glorificadas y forman una comunidad global basada en principios idealistas de colectivismo e igualdad. §HGranjas§! y §HMinas§! producen §Y0.2§! §HUnidad§! cada."
 
