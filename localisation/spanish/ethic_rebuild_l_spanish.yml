 job_slave_master:0 "Maestro de Esclavos"
 job_slave_master_plural:0 "Maestros de Esclavos"
 job_slave_master_desc:0 "Un miembro influyente de un gremio esclavista dominante."
 job_slave_master_effect_desc:0 "£job_slave_master£ $job_slave_master_plural$ produce £unity£ Unidad, aumenta §Yproducción de Esclavos§! y proporciona §G+5§! Estabilidad."
 mod_job_slave_master_add:0 "Trabajos de $job_slave_master$"
 mod_job_slave_master_per_pop:0 "§G+1§! Trabajo de $job_slave_master$ por cada $VALUE$ Poblaciones"
 mod_job_slave_master_per_pop_short:0 "\n§G+1§! £mod_job_slave_master_add£ por $VALUE$ £pop£"
 
 civic_divine_order:0 "Sistema de Castas"
 civic_divine_order_desc:0 "Esta sociedad está organizada como un rígido sistema de castas, basado en tradiciones culturales antiguas y complejas. Cada estrato social se considera servir su propósito predestinado.\n\nPermite trabajo £job_slave_master£ $job_slave_master$ único, que produce £unity£ §YUnidad§! y aumenta §YProducción de Esclavos§! y £stability£ §YEstabilidad§! locales.\nLos trabajos §YSuperintendente de Esclavos§! producen £unity£ §YUnidad§! adicional.\nPermite construcción del edificio £building£ §YNeo-Coliseo§! único planetario, que añade trabajos £job_gladiator£ §YGladiador§!. Gladiadores producen algo de £trade_value£ §YValor Comercial§! y aumentan §YDaño de Ejército§! local.\n\nConsiderado una versión avanzada del civismo §YGremios de Esclavistas§!"
 
 witch_hunt:0 "Cacería de Brujas"
 witch_hunt_desc:0 "Este planeta está sujeto a proceso de herejía en curso"
 
 civic_circular_economy:0 "Economía Circular"
 civic_circular_economy_desc:0 "Un sistema que emplea fuertemente reutilización, reacondicionamiento y reciclaje, resultando en materiales de desperdicio y energía convirtiéndose en insumos para otros procesos. El objetivo es crear un sistema de bucle cerrado económicamente eficiente, que minimiza el uso de insumos de recursos y la creación de desperdicio y contaminación.\n\n§YEficiencia Manufacturera Aumentada§!: Especialistas gastan §G-1§! £minerals£ Minerales para producir £exotic_gases£ §YGases Exóticos§!, £rare_crystals£ §YCristales Raros§! y £volatile_motes£ §YPartículas Volátiles§!.\n- §YBiotecnología Desarrollada§!: comienza con la tecnología §YBiotecnología Industrial§!."
 
 mod_station_gatherers_upkeep_mult:0 "Mantenimiento de Estaciones Mineras"
 
 DEEP_MINING:0 "Permite investigar tecnología §YExtracción del Núcleo Profundo§!, construir §YPozo Térmico§! y contratar £job_deep_miner£ $job_deep_miner_plural$."
 
 ETHIC_FANATIC_STORM_RESEARCH:0 "\nProbabilidad de recibir opciones de investigación para §Ytecnología de tormentas cósmicas§!: §G+20%§!"
 ETHIC_STORM_RESEARCH:0 "\nProbabilidad de recibir opciones de investigación para §Ytecnología de tormentas cósmicas§!: §G+10%§!"
 
 building_national_park:0 "Parque Eco Nacional"
 building_national_park_desc:0 "Las maravillas naturales de este planeta han sido declaradas un activo de importancia nacional y puestos bajo protección especial del gobierno.\n\nLas barreras §YNaturales§! requerirán Influencia adicional para ser despejadas."
 
 gov_timocracy:0 "Timocracia"
 gov_timocracy_desc:0 "Un estado republicano donde el derecho a votar y ser elegido está determinado por la cantidad de propiedad poseída."
 
 civic_anarchy_ideals:0 "Ideales Anarquistas"
 civic_anarchy_ideals_desc:0 "Esta sociedad está basada sobre ideales de rechazo de cualquier forma de jerarquía política o social. $civic_civil_education_desc$\n\n§WLas§! §Wpolíticas de §HPres reasentamiento§! §Wy§! §HControl de Población§! §Westán§! §Rindisponibles§!"
 
 civic_anarchy_utopia:0 "Utopía Anarquista"
 civic_anarchy_utopia_desc:0 "Esta sociedad está basada sobre ideales de rechazo de cualquier forma de jerarquía política o sociológica injusta. Esto llevó a la sociedad a poner énfasis en la inspiración individual como raíz de verdadera innovación. Patentes de código abierto, mente abierta, colaboraciones espontáneas y recompensas de innovación allanan el camino al progreso. Conocida por muchos por tener una reputación bien ganada como refugio libre. Los cansados, los pobres, las masas aglomeradas que anhelan respirar libres -todos son bienvenidos aquí, independientemente de su especie u origen. $civic_civil_education_desc$\n\n§WLa§! §HFacción Xenófila§! §Wproporcionará mayor§! §YProducción de Facción§! §Wsiempre que haya un gran número de§! §YEspecies Únicas§! §WDentro del imperio (mayor que 5, 7 o 10).§!\n\n§WPolticas de §HPres Reasentamiento§!§W,§! §HInterferencia Agresiva§!§W,§! §HControles de Población§! §Wy§! §HPurgas§! §Westán§! §Rprohibidas§!§W.\n\nObligado a tener§! §HTérminos de Sumisión Benevolente§! §W,§! §HPrimacía Voluntaria§!§W, §YFronteras Abiertas§! §Wy§! §WRefugiados Bienvenidos§! §Wpolíticas.§!\n\n§WDeshbloquea:§! §YEslavizar Esclavos§! §Wposición de bombardeo.§!"
