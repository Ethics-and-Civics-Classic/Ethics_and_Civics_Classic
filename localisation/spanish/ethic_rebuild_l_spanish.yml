 gov_dread_brotherhood:0 "Hermandad Temible"
 gov_dread_brotherhood_desc:0 "Una forma extremadamente xenófoba de democracia directa, donde todos los ciudadanos están unidos por el objetivo común -la destrucción de todas las formas de vida inferiores en la galaxia."
 
