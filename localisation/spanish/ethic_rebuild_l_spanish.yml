 civic_globalism:0 "Globalismo"
 civic_globalism_desc:0 "No es solo la fascinación por lo desconocido e extraño lo que nos impulsa al espacio, sino también los tratos rentables que podemos obtener de ello.\n\n- Los planetas obtienen una probabilidad aumentada de ser nombrados para albergar el §YMercado Galáctico§! a través de §YImpulso§!. Decisiones para §YNominación de Mercado§! no cuestan Influencia para invocar.\n- §YPactos Comerciales§! no cuestan Influencia para mantener.\n- Opinión aumentada de enclaves §YConglomerado Comercial§!.\n- La facción §YEmprendedores§! proporcionará aprobación adicional por estar en una §YFederación Comercial§!.\n-Permite construcción del edificio £building£ §YCentro de Comercio Interestelar§! único del imperio, que proporciona un bono a nivel imperio a £trade_value£ Comercio, §YPeso Diplomático de Economía§!, §YCapacidad de Base Estelar§! y producción £consumer_goods£ Bienes de Consumo, dependiendo del número de §YEspecies Únicas§! en el imperio."
 
