 civic_peaceful_urbanism:0 "Maestría de Ingeniería"
 civic_peaceful_urbanism_desc:0 "Esta civilización tradicionalmente canaliza su pasión industrial y actividad hacia la dirección pacífica de arquitectura y desarrollo de construcción.\n\n§YDistritos Ciudad§! proporcionan §G+5§! £amenities£ Comodidades.\nPermite trabajo especialista único: £job_urban_engineer£ $job_urban_engineer$, que produce £engineering_research£ Ingeniería, £unity£ Unidad y reduce §Y$mod_planet_districts_cities_upkeep_mult$§! local y §Y$mod_planet_districts_industrial_upkeep_mult$§! en §G5%§!, y reduce §Y$mod_planet_districts_hab_industrial_cost_mult$§! en §G10%§!."
 
 job_urban_engineer:0 "Ingeniero Urbano"
 job_urban_engineer_plural:0 "Ingenieros Urbanos"
 job_urban_engineer_desc:0 "Especialistas que son hábiles en asuntos de ingeniería urbana, construcción y desarrollo."
