 principle_peoples_republic:0 "Dictadura del Proletariado"
 principle_peoples_republic_desc:0 "El gobierno es una forma meritocrática de dictadura. Hay un parlamento real, pero está dominado por un solo poder político - el llamado Partido del Pueblo."
 
 
 principle_tribal_aristocracy:0 "Castas Inmutables"
 principle_tribal_aristocracy_desc:0 "Esta sociedad está sujeta a una forma estricta de estratificación social, con personas siendo divididas en grupos jerárquicos rígidos de amos y esclavos. Obligado a tener §HSistema de Castas§!. Construir §HNuevo Coliseo§! proporciona §G+1§! §UUnidad§! adicional."
 
 principle_noble_aristocracy:0 "Reyes Filósofos"
 principle_noble_aristocracy_desc:0 "Esta sociedad está guiada por una forma idealista de aristocracia - una élite moral e intelectual gobernando en principios meritocráticos."
 
 
 
