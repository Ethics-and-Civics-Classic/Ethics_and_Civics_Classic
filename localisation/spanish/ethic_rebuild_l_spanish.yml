 civic_efficient_bureaucracy_desc:0 "Esta sociedad es reconocida por su eficiencia. No solo los trenes magnéticos corren a tiempo, sino el aparato burocrático colosal requerido para manejar una nación interestelar ha sido grandemente simplificado.\n\n£job_bureaucrat£ §Y$job_bureaucrat_plural$§! también aumentan §Y$MOD_COUNTRY_ADMIN_CAP_ADD$§! en §G+5§!"
 
