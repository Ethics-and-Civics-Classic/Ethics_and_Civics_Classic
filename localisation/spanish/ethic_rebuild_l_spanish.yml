 pft_bankers:0 "Facción de Empresarios"
 pft_bankers_desc:1 "La Facción de Empresarios representa los intereses de empresarios privados y corporaciones, quienes están principalmente preocupados con el desarrollo de la economía y la acumulación de su propia riqueza.\n\n§LEtica Competitiva§!"
 pft_socialists:0 "Facción Laboral"
 pft_socialists_desc:1 "La Facción Laboral representa los intereses de personas de clase trabajadora y generalmente desea la propiedad cooperativa de los medios de producción y re-distribución justa de riqueza.\n\n§LEtica Cooperativa§!"
 pft_manufacturers:0 "Facción Industrialista"
 pft_manufacturers_desc:1 "Miembros de esta facción consideran el crecimiento industrial en constante aumento como el principal impulso de prosperidad económica. Se oponen generalmente a todo tipo de políticas proambientales.\n\n§LEtica Industrialista§!"
 pft_labourites:0 "Facción Pluralista"
 pft_labourites_desc:1 "Los pluralistas combaten todas las formas de prejuicios y discriminación entre diferentes grupos sociales, caracterizados por cosas como raza, género, edad y riqueza.\n\n§LEtica Pluralista§!"
 pft_environmentalists:0 "Facción Ambientalista"
 pft_environmentalists_desc:1 "Los ambientalistas buscan maneras de proteger y mejorar la calidad del ambiente natural, oponiéndose políticamente a todo tipo de actividades dañinas al medio ambiente.\n\n§LEtica Ecocéntrica§!"
 pft_conservatives:0 "Facción Elitista"
 pft_conservatives_desc:0 "Los elitistas creen que un grupo de personas con ciertas cualidades inherentes - ya sea nacimiento o riqueza - merece tener mayor influencia o autoridad que otros. Consideran la jerarquía social una parte integral de una sociedad sostenible.\n\n§LEtica Elitista§!"
 pft_progressive:1 "Facción Democrática"
 pft_progressive_desc:1 "La Facción Democrática favorece libertades políticas personales, reducción de autoridad gubernamental central y no le gustan las formas de gobierno no democráticas en general.\n\n§LEtica Libertaria§!" 

