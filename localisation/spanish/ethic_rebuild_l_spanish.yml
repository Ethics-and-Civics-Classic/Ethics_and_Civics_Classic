 PLURALISM_POPS:0 "Sociedad Pluralista"
 PLURALISM_POPS_DESC:0 "Tener al menos §Y25%§! de nuestra población sea alguna forma de Pluralista agradará al [Root.GetName]."
 
 civic_machine_cult:0 "Culto Mecánico"
 civic_machine_cult_desc:0 "Adoran máquinas como dioses, usando el vigor de su fe para impulsar §YRobots§!.\n\n- Comienza con tecnología §YTrabajadores Robóticos§!, §Y4§! pops robóticos, y edificios £building£ §YMonasterio Mecha§! y £building£ §YPlanta de Ensamblaje Robótica§!\n- La facción §YESpiritualista§! es tolerante hacia robots.\n- Permite construcción de £building£ §YMonasterios Mecha§! planetario único, que proporcionan trabajos §YSacerdote Técnico§!, que producen £unity£ §YUnidad§!, £engineering£ §YPesquisa de Ingeniería§! y reducen mantenimiento de Pops §YRobóticos§! locales.\n- Permitido construir £building£ §YMonoumento Robot Colosal§!, que aumenta §YFelicidad§! local, §YProducción Robot§! y £unity£ §YUnidad§!, y requiere £energy£ §YEnergía§! para mantenimiento.\n- Combinado con civismos gubernamentales §YTeocracia§! o §YESpiritualista§!, £job_high_priest£ §Y$job_high_priest_plural$§! adicionalmente aumentarán £engineering£ §YPesquisa de Ingeniería§! planetaria en §G+3§! y §YProducción Robot§! en §G+2%§!, y §YSacerdotes Técnicos§! producirán £unity£ §YUnidad§! y £engineering£ §YPesquisa de Ingeniería§! adicionales."
 
 building_colossal_monument:0 "Monumento Robot Colosal"
 building_colossal_monument_desc:0 "Un monumento gigante, glorificando un robot antropomórfico."
 
