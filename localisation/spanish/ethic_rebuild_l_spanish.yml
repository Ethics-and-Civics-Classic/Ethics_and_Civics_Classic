 civic_naturalism:0 "Ecotopía"
 civic_naturalism_desc:0 "Estar genuinamente cerca de la naturaleza hace a uno, por sí mismo, más calmado y pacífico. La gente de esta sociedad utópica considera entornos naturales parte esencial de su cultura.\n\n- Beneficia de barreras planetarias naturales, que proporcionan §G+1§! £job_naturalist£ $job_naturalist_plural$ y aumentan £housing£ Vivienda. Anomalías pesadas (como §YVolcán§!, §YMontaña§! o §YFauna Silvestre§!) proporcionan §G+2§! trabajos: £job_culture_worker£ $job_culture_worker_plural$ y £job_artisan£ $job_artisan_plural$ O £job_entertainer£ $job_entertainer_plural$. Barreras planetarias raras y características (como §YBosque Errante§! o §YVida Titánica§!) también proporcionan trabajos y bonificaciones apropiadas.\n- §YInspirados por la Naturaleza§!: £job_culture_worker£ $job_culture_worker_plural$ requieren menos mantenimiento y tienen productividad aumentada en planetas con anomalías naturales. Permite trabajo trabajador único: £job_naturalist£ $job_naturalist_plural$, que producen pequeña cantidad de £society_research£ Pesquisa Sociétal, £unity£ Unidad, £amenities£ Comodidades y £trade_value£ Comercio.\n- §YAsentamientos Eco§!: Barreras naturales regulares proporcionan §G+2§! £housing£ Vivienda. Anomalías naturales pesadas proporcionan §G+4§! £housing£ Vivienda.\n- §YUrbanización Reducida§!: Distritos Ciudad proporcionan §R-1§! £housing£ Vivienda y tienen su costo y mantenimiento disminuidos en §G25%§!.\n- §YBiotecnología Civil§!: £job_artisan£ $job_artisan_plural$ gastan §G-1§! £minerals£ y §R+1§! £food£ para producir £consumer_goods£ Bienes de Consumo. £job_biotechnologist£ $job_biotechnologist_plural$ gastan §R+1§! £food£ para producir §G+0.5§! £consumer_goods£ Bienes de Consumo\n- §YParque Eco Nacional§!: permite construcción de edificio planetario único, que proporciona §G+1§! £job_naturalist£ $job_naturalist_plural$ trabajos por cada 17 poblaciones, y produce £unity£ Unidad y £society_research£ Pesquisa Sociétal por cada §YBarrera§! natural única. Una vez construido, despejar barreras naturales requerirá Influencia adicional."
 
