l_spanish:
 requires_building_criminal_headquarters:0 "\nThis building requires a Planetary Capital to be present on the planet first."
 building_criminal_headquarters:0 "Cuarteles Generales Operativos"
 building_criminal_headquarters_desc:0 "Los cuarteles generales planetarios de nuestra corporación, atendidos por burócratas trabajando para asegurar que nuestras operaciones no sean truncadas por las autoridades locales.\n\nCrea un empleo de Burocrata Corrupto que incrementa el crimen por cada enforcer, comenzando desde 3 hasta 10 enforcers, y a su vez disminuye el valor comercial. También desbloquea edificios de oficinas sucursales adicionales."
 building_high_society_clubs:0 "Clubes de la Alta Sociedad"
 building_high_society_clubs_desc:0 "Un lugar donde los ricos y famosos se reúnen, socializan y realizan otras actividades que no harían en público. Lo que sucede en estos clubes, se queda allí...a menos que no lo haga.\n\nIncrementa la velocidad y nivel de infiltración, el valor comercial de la oficina y también agrega el empleo de Entretenedor Corrupto que incrementa la felicidad del gobernante y la producción."
 building_high_society_clubs_custom_tooltip:0 "§R¡No se puede formar§! §YClubes de la Alta Sociedad§!§R!§!"
 building_infiltrated_church:0 "Iglesia Infiltrada"
 building_infiltrated_church_desc:0 "Estas iglesias parecen perfectamente normales superficialmente pero han sido infiltradas por miembros del culto.\n\nIncrementa la velocidad y nivel de infiltración, el valor comercial de la oficina, la atracción espiritualista y también agrega el empleo de Sacerdote Corrupto que incrementa la estabilidad a costa de la atracción de la ética de gobierno."
 building_union_busting_lawfirm:0 "Bufete Anti-Sindicatos"
 building_union_busting_lawfirm_desc:0 "La mejor manera de hacer que tus trabajadores trabajen lo más duro posible, es asegurarte de que no sepan cuánto valen realmente. Estos bufetes se especializan en asegurar que los trabajadores cooperen justo lo suficiente como para no afectar el margen de ganancias.\n\nIncrementa la velocidad y nivel de infiltración, el valor comercial de la oficina y también agrega el empleo de Abogado Corrupto que incrementa la producción de los trabajadores."
 building_unregulated_factories:0 "Fábricas No Reguladas"
 building_unregulated_factories_desc:0 "¿Regulaciones de seguridad? Esas solo limitan la productividad de los trabajadores. Estas fábricas pueden ahorrar dinero en equipamiento y entrenamiento, haciéndolas excelentes para la producción.\n\nIncrementa la velocidad y nivel de infiltración, el valor comercial de la oficina y también agrega el empleo de Gerente Corrupto que incrementa la producción de aleaciones y bienes de consumo."
 building_unregulated_research_labs:0 "Laboratorios de Investigación No Regulado"
 building_unregulated_research_labs_desc:0 "Por el precio de sus patentes, los científicos pueden usar estos laboratorios para todos los experimentos que quieran realizar pero no pueden debido a 'ética' o 'reglas'.\n\nIncrementa la velocidad y nivel de infiltración, el valor comercial de la oficina y también agrega el empleado Investigador Corrupto que incrementa la producción de investigadores."
 building_pr_bureau:0 "Bureau de Relaciones Públicas"
 building_pr_bureau_desc:0 "El Bureau de Relaciones Públicas utiliza una variedad de medios menos legales para controlar el flujo de información y no hacen ningún secreto sobre ello."
 building_fighting_pit:0 "Pelea de Combate"
 building_fighting_pit_desc:0 "Este ring de gladiadores ilegales atrae tanto inversores como participantes desde cada rincón del imperio. Pagan para observar rehenes, esclavos y asesinos profesionales luchar por las emociones de la multitud, a veces, hasta la muerte."

 criminal_smuggler:0 "$job_criminal_smuggler$"
 job_criminal_smuggler:0 "Contrabandista Pirata"
 job_criminal_smuggler_plural:0 "Contrabandistas Piratas"
 job_criminal_smuggler_desc:0 "Los piratas de bajo nivel arriesgan sus vidas contrabandeando bienes ilegales hacia otros imperios por un pago lucrativo, compartiendo un 5% con el Capitán Pirata local."
 mod_job_criminal_smuggler_per_crime:0 "§R+100§! £job_criminal_smuggler£ §Y$job_criminal_smuggler_plural$§! Job per $VALUE$ Planet £crime£ §YCrime§!"
 mod_job_criminal_smuggler_per_crime_short:0 "\n§R+100§! £job_criminal_smuggler£ £mod_job_criminal_smuggler_add£ per $VALUE$ £crime£"
 mod_job_criminal_smuggler_add:0 "Trabajos de $job_criminal_smuggler$"
 
