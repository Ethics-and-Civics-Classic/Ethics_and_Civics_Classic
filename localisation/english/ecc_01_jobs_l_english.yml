 job_pirate_combat_instructor_plural:0 "Pirate Combat Instructors"
 job_pirate_combat_instructor_desc:0 "A sharp mind is a valuable asset to every privateer fleet. Focusing on development instead of punishment enhances the skill of crew members and mitigates problems before they arise."

# Steward Captain
 steward_pirate: "$job_steward_pirate$"
 job_steward_pirate:0 "Steward Captain"
 job_steward_pirate_plural:0 "Steward Captains"
 job_steward_pirate_desc:0 "As a labor union of cooperative privateer fleets, the charter under which a pirate captain may fly our flag requires on-planet duties as well as in space."
 
# Syndicalist Officer
 steward_pirate_anarchy: "$job_steward_pirate_anarchy$"
 job_steward_pirate_anarchy:0 "Syndicalist Officer"
 job_steward_pirate_anarchy_plural:0 "Syndicalist Officers"
 job_steward_pirate_anarchy_desc:0 "The demands of captaining a vessel and organizing work require a person of many talents. They must be someone willing to rise to the challenge, and then cede power when their time is done. They will not be respected by their crew otherwise."

# Offworld Steward Captain
 steward_pirate_offworld:0 "$job_steward_pirate_offworld$"
 job_steward_pirate_offworld:0 "Offworld Steward Captain"
 job_steward_pirate_offworld_plural:0 "Offworld Steward Captains"
 job_steward_pirate_offworld_desc:0 "An Offworld Steward Captain acts as an unconventional naval labour advocate, establishing a unique rapport with enterprising spacers. They integrate their networks and illegal gains into the local labour structure, resulting in a prosperous arrangement for the workers involved."

# Community Organizer
 organizer: "$job_organizer$"
 job_organizer:0 "Community Organizer"
 job_organizer_plural:0 "Community Organizers"
 job_organizer_desc:0 "In a non-hierarchical society, the needs of our neighbors are met by community organizers. They distribute daily necessities and coordinate during emergencies."
 job_organizer_effect_desc: "£job_culture_worker£ $job_organizer_plural$ turn $r_consumer_goods$ into $r_unity$ and $r_amenities$, as well as a small amount of $r_basic$."

 concept_organizer: "$job_organizer_plural$"
 concept_organizer_desc: "$job_organizer_effect_desc$\n\n§L$job_organizer_desc$§!"

