### Advanced Governments
## Technocracies
 civic_cyber_demos_cratos:0 "Cyber Democracy"
 civic_cyber_demos_cratos_desc:0 "Involving high tech achievements in IT and mass communications in democratic governance allows creating the most efficient de-centralized bureaucratic system. But such dependence on technology, combined with a fair level of freedom, may result in occasional cyber-crime outbreaks."
 civic_tooltip_cyber_demos_cratos_effects:0 "$t$- £building£ §YCapital Buildings§! replace £job_politician£ §Y$job_politician$§! Jobs with £job_head_researcher£ §Y$job_head_researcher_plural$§!.$TABBED_NEW_LINE$- The £building£ §YResearch Institute§! provide additional £job_head_researcher£ §Y$job_head_researcher_plural$§! Jobs.$TABBED_NEW_LINE$- £job_researcher£ §Y$job_researcher_plural$§! also produce $r_unity$."

 civic_science_directorate:0 "Science Directorate"
 civic_science_directorate_desc:0 "The government is strongly influenced by a committee of the empire's most renowned scientists."
 civic_tooltip_science_directorate_effects:0 "$t$- £building£ §YCapital Buildings§! replace £job_politician£ §Y$job_politician$§! jobs with £job_head_researcher£ §Y$job_head_researcher_plural$§!$TABBED_NEW_LINE$- The £building£ §YResearch Institute§! provide additional £job_head_researcher£ §Y$job_head_researcher_plural$§! Jobs.$TABBED_NEW_LINE$- £job_researcher£ §Y$job_researcher_plural$§! also produce $r_unity$."
 civic_tooltip_science_directorate_negative_effects:0 "$t$- The §YTechnologist§! faction will §Rdemand§! §YAcademic Privileges§! living standards."

 civic_cyber_dictatorship:0 "Cyber Dictatorship"
 civic_cyber_dictatorship_desc:0 "The government represents a form of technocratic dictatorship, where the state relies heavily on super-computers to deal with matters of security and administration. But with so much power outsourced to AIs, ordinary citizens have even less influence on the governing process."
 civic_tooltip_cyber_dictatorship_effects:0 "$civic_tooltip_cyber_demos_cratos_effects$$TABBED_NEW_LINE$- Starts with £physics£ §YAdministrative AI§! technology"

## Theocracies
 civic_spiritual_democracy:0 "Theocratic Republic"
 civic_spiritual_democracy_desc:0 "A form of republic, where citizens are bonded by religious tradition, strong moral values and ethical imperatives."
 civic_tooltip_spiritual_democracy_effects:0 "- £building£ §YCapital Buildings§! replace £job_politician£ §Y$job_politician$§! Jobs with £job_high_priest£ §Y$job_high_priest_plural$§!. \n- The £building£ §YSacred Nexus§! and £building£ §YCitadel of Faith§! provide additional £job_high_priest£ §YHigh Priest§! Jobs. \n- £job_high_priest£ §Y$job_high_priest_plural$§! provide additional $r_society$ and $r_amenities$. \n\n- £job_priest£ §Y$job_priest_plural$§! produce additional $r_unity$. \n\n§ECan be combined with:§! \n- ['civic_tooltip_spiritualist_machine_cult_combo', $civic_machine_cult$]"
 civic_tooltip_spiritual_democracy_negative_effects:0 "- §RCannot§! enslave own species. \n- §RCannot§! use §YPopulation Controls§!."

 civic_divine_council:0 "Divine Council"
 civic_divine_council_desc:0 "This empire's government is overseen by a council of society's most influential religious leaders."
 civic_tooltip_divine_council_effects:0 "$t$- £building£ §YCapital Buildings§! replace £job_politician£ §Y$job_politician$§! Jobs with £job_high_priest£ §Y$job_high_priest_plural$§!.$TABBED_NEW_LINE$- The £building£ §YSacred Nexus§! and £building£ §YCitadel of Faith§! provide additional £job_high_priest£ §YHigh Priest§! Jobs.$TABBED_NEW_LINE$- £job_priest£ §Y$job_priest_plural$§! produce additional $r_unity$.\n\n§ECan be combined with:§!$TABBED_NEW_LINE$- ['civic_tooltip_spiritualist_machine_cult_combo', $civic_machine_cult$]"

## Stratocracies
 civic_military_junta:0 "Military Council"
 civic_military_junta_desc:0 "This society's government is dominated by a coalition of the most powerful military leaders."
 civic_tooltip_military_junta_effects:0 "$t$- £building£ §YCapital Buildings§! replace £job_politician£ §Y$job_politician$§! Jobs with £job_commandante£ §Y$job_commandante_plural$§!, who increase $i_naval_capacity$, spawn £defense_army£ §YDefense Armies§!, increase planetary $r_stability$ and reduce damage from §YBombardment§!."
 civic_tooltip_military_junta_negative_effects:0 "$t$- §RProhibits§! setting the §YProduction Focus§! policy to §YCivilian§!."

 civic_military_dictatorship:0 "War Lord"
 civic_military_dictatorship_desc:0 "The rulers of this society were historically the most aggressive and successful warlords. In modern times they have unified under a single authority and contract their expertise to other empires."
 civic_tooltip_military_dictatorship_effects:0 "- £building£ §YCapital Buildings§! replace £job_politician£ §Y$job_politician$§! Jobs with £job_commandante£ §Y$job_commandante_plural$§!, who increase $i_naval_capacity$, spawn £defense_army£ §YDefense Armies§!, increase planetary $r_stability$ and reduce damage from §YBombardment§!."
 civic_tooltip_military_dictatorship_effects_shroud:0 "Starts with the ability to conduct ['concept_proxy_wars'].\n- £building£ §YCapital Buildings§! replace £job_politician£ §Y$job_politician$§! Jobs with £job_commandante£ §Y$job_commandante_plural$§!, who increase $i_naval_capacity$, spawn £defense_army£ §YDefense Armies§!, increase planetary $r_stability$ and reduce damage from §YBombardment§!."
 
## Utopias
 civic_bureaucracy:0 "Enlightened Bureaucracy"
 civic_bureaucracy_desc:0 "In this society government is traditionally guided by philosophers and thinkers, who - considered to be ideal rulers - generally possess intelligence, reliability, and a willingness to live a peaceful and prosperous life."
 civic_tooltip_bureaucracy_effect:0 "$t$- £building£ §YCapital Buildings§! change £job_politician£ §Y$job_politician_plural$§! into £job_supervisor£ §Y$job_supervisor_plural$§!, who produce $r_unity$, $r_society$ and increase $r_amenities$."

 civic_peaceful_republic:0 "Utopian Democracy"
 civic_peaceful_republic_desc:0 "A pacifistic form of a republic, where citizens are unified by the national idea of a free, peaceful and prosperous life for everyone."
 civic_tooltip_peaceful_republic_effects:0 "$t$- £building£ §YCapital Buildings§! replace £job_politician£ §Y$job_politician$§! jobs with £job_supervisor£ §Y$job_supervisor_plural$§!, which produce $r_unity$, $r_society$, and increase $r_amenities$."
 civic_tooltip_peaceful_republic_negative_effects:0 "$t$- §RProhibits§! setting the §YProduction Focus§! policy to §YMilitary§!"

 civic_executive_committee:0 "Philosophers Assembly"
 civic_executive_committee_desc:0 "The government is traditionally supervised by a council of the empire's most intelligent and honorable philosophers."
 civic_tooltip_executive_committee_effects:0 "$t$- £building£ §YCapital Buildings§! replace £job_politician£ §Y$job_politician$§! jobs with £job_supervisor£ §Y$job_supervisor_plural$§!, who produce $r_unity$, $r_society$, and increase $r_amenities$."

## Plutocracies
 civic_state_monopoly:0 "Ruthless Capitalism"
 civic_state_monopoly_desc:0 "A socio-economic dystopia, where all political power is concentrated in the hands of oligarchs and their corporations, which cruelly exploit the rest of the population for the sake of endlessly increasing their wealth. \n\n§WConsidered an advanced version of the§! §YFinancial Elite§! §Wcivic.§!"
 civic_tooltip_state_monopoly_effects:0 "$t$- £building£ §YCapital Buildings§! replace £job_politician£ §Y$job_politician$§! jobs with £job_mogul£ §Y$job_mogul$§! jobs.$TABBED_NEW_LINE$- The £building£ §YGalactic Stock Exchange§! provides an additional §G+100§! £job_mogul£ §Y$job_mogul$§! jobs and increases planetary $r_trade$.$TABBED_NEW_LINE$- §ERuthless Exploitation§!: each £job_mogul£ §Y$job_mogul$§! increases local workers $r_energy$ and $r_minerals$ output.\n$TABBED_NEW_LINE$- Starts with the £physics£ ['concept_tech_power_hub_1'] and £physics£ ['concept_tech_power_hub_2'] technologies.$TABBED_NEW_LINE$- §ECorporate Lobbying§!: The §YEntrepreneurs§! faction provides additional approval.\n$BOB_retreat_tooltip$$BOB_forum_tooltip$"
 civic_tooltip_state_monopoly_negative_effects:0 "$t$- §RCannot§! use the §YPublic Healthcare§! or §YPublic Education§! §Wpolicies.$TABBED_NEW_LINE$- §RObligated§! to live under §YStratified Economy§! living standards."
## Communism
 civic_shared_burden:1 "Syndicalism"
 civic_shared_burden_desc:1 "This society preserves the ideals of syndicalism, with the economical units being directly managed by workers in order to secure an equitable distribution of resources, and guarantee social and economical equality for everyone. \n\n§WConsidered an advanced version of the§! §YLabor Unions§!§W civic.§!"
 civic_tooltip_shared_burden_effects:1 "- §YMining§!§W,§! §YFarming§!§W,§! §YGenerator§! §Wand§! §YIndustrial§! §WDistricts provide§! §G+100§! £housing£ §WHousing each and have their upkeep increased by§! §R25%§!§W. \n- Allows special Worker Job:§! £job_primitive_laborer£ §YLabour Hero§!§W, who produces small amounts of§! $r_minerals$§W,§! $r_food$§W,§! $r_energy$ §Wand§! $r_unity$§W. \n- The§! §YLabor§! faction will be happy \n\n- Allowed to invoke special Edict: ['edict:public_works_socialist', $edict_public_works$] $TABBED_NEW_LINE$ $BOB_embassy_tooltip$"
 civic_tooltip_shared_burden_negative_effects:1 "- §RObligated§! to live under §YSocial Equality§! §Wliving standards \n- §HEnslavement§! §Wpolicy is§! §Rprohibited§!§W.§!"
## Anarchy
 civic_anarchy_ideals:0 "Anarchist Ideals"
 civic_anarchy_ideals_desc:0 "This society is based upon ideals of rejection of any form of unjust political or sociological hierarchy."
 civic_anarchy_ideals_effects:0 "$civic_civil_education_effects$ $TABBED_NEW_LINE$- $AVAILABLE_POLICIES$ ['concept_trade_mutual_aid'] $TABBED_NEW_LINE$- Replaces £job_politician£ §Y$job_politician$§! and £job_bureaucrat£ §Y$job_bureaucrat$§! Jobs with ['concept_organizer',£job_culture_worker£ $job_organizer$] Jobs $TABBED_NEW_LINE$- §GUnlocks§! the §Y$bombardment_EaC_liberate_slaves$§! bombardment stance."
 civic_anarchy_ideals_negatives:0 "$t$- §RBanned§! from having the following policies:$TABBED_NEW_LINE$$t$- §H$policy_resettlement$§!: $resettlement_allowed$$TABBED_NEW_LINE$$t$- §H$policy_population_controls$§!: $population_controls_allowed$"
 
 civic_anarchy_utopia:0 "Anarchist Utopia"
 civic_anarchy_utopia_desc:0 "This autonomous collective organizes itself upon principles of mutual aid, restorative justice, and free association. Without the burden of hierarchy, they are truly the freest people in the galaxy."
 civic_anarchy_utopia_effects:0 "$t$- Allows §Y$living_standard_community_labor$§! Living Standard, under which all £pop£ §YPops§! have high §Y$r_consumer_goods$§! Upkeep regardless of §YStrata§! $TABBED_NEW_LINE$- Disables the use of most other §YLiving Standards§!$TABBED_NEW_LINE$- $civic_crowdsourcing_anarchy_effects$\n$civic_anarchy_ideals_effects$"
 civic_anarchy_utopia_negatives:0 "$t$- §RBanned§! from having the following policies:$TABBED_NEW_LINE$$t$- §H$policy_resettlement$§!: $resettlement_allowed$$TABBED_NEW_LINE$$t$- §H$policy_interference$§!: $interference_aggressive$ $TABBED_NEW_LINE$$t$- §H$policy_population_controls$§!: $population_controls_allowed$\n$TABBED_NEW_LINE$- §RObligated§! to have the following policies:$TABBED_NEW_LINE$$t$- §H$policy_trade_policy$§!: $trade_policy_mutual_aid$ $TABBED_NEW_LINE$$t$- §H$policy_subjugation_war_terms$§!: $benevolent_terms_name$$TABBED_NEW_LINE$$t$- §H$policy_conscription_stance$§!: $conscription_stance_0$ $TABBED_NEW_LINE$$t$- §H$policy_border_policy$§!: $border_policy_open_name$$TABBED_NEW_LINE$$t$- §H$policy_refugees$§!: $refugees_allowed$"

 civic_primitive_enthusiasts:0 "Primitive Enthusiasts"
 civic_primitive_enthusiasts_desc:0 "This society has an appreciation for the older techniques, choosing to perform many jobs by hand and live off the land through barter, farming, and animal husbandry."
 civic_primitive_enthusiasts_effects:0 "$t$- At least one §YGuaranteed Habitable World§! will be a pre-FTL Civilization's £job_hunter_gatherer£ §GHomeworld§!\n$TABBED_NEW_LINE$- £job_civilian£ §YCivilians§! become £job_primitive_enthusiasts£ §HHomesteaders§! and practice a lifestyle of §Gself-sufficiency§! producing $r_food$\n\n§YDomestication:§!$TABBED_NEW_LINE$Guarantees a §Ghigher chance§! to research £physics£ ['tech_gravity_wells'] and eventually £society£ ['tech_alien_cloning'].\n\n§EIf Ethics are§! §H$ethic_socialism$§! §Eand§! §H$ethic_egalitarian$§!§E:§!$TABBED_NEW_LINE$$t$- Allows the §Y$trade_policy_mutual_aid$§! Trade Policy, which converts $r_trade$ into $r_energy$, $r_minerals$, and $r_food$§E:§!$TABBED_NEW_LINE$- Replaces £job_politician£ §Y$job_politician$§! and £job_bureaucrat£ §Y$job_bureaucrat$§! Jobs with ['concept_organizer',£job_culture_worker£ $job_organizer$] Jobs."
 civic_primitive_enthusiasts_effects_first_contact_dlc:0 "$t$- Gains §G100%§! more Insights from observing pre-FTL Civilizations\n$civic_primitive_enthusiasts_effects$"

### Normal Civics
# Land of Plenty
 civic_land_of_plenty:0 "Land of Plenty"
 civic_land_of_plenty_desc:0 "This society follows the concept of industrial development serving the public, creates a comfortable working and living environment, and meets the material needs of the people as much as possible.\n\n§WUAV network§! covers all areas from densely populated to uninhabited. Undertook a large number of works of transportation, maintenance, patrol and so on. Controlling this system requires the all-weather management of many §WUAV dispatchers§!. These dispatchers increase the production of most resources §Wmultiplicatively§! making densely populated planets progressively more productive.\n§W$BOB_industry_tooltip$§!"

# Labor Unions
 civic_labour_unions:0 "Labor Unions"
 civic_labour_unions_desc:0 "This society's workers are traditionally involved in making decisions, and share authority and responsibility in the workplace, which results in increased productivity and service delivery from a more fully engaged and happier workforce. \n\n§WThe advanced version of this civic is§! §YSyndicalism§! "
 civic_tooltip_labour_unions_effects:0 "$t$- £district£ ['concept_generator_districts'], £district£ ['concept_mining_districts'], and £district£ ['concept_farming_districts'] provide §G+100§! £housing£ §YHousing§!.\n$BOB_minerals_tooltip$"
 civic_tooltip_labour_unions_negative_effects:0 "$t$- §RObligated§! to have at a minimum §HSocial Welfare§! living standards."
# Machine Cult
 civic_machine_cult:0 "Machine Cult"
 civic_machine_cult_desc:0 "They worship machines like gods, using the vigor of their faith to power §YRobots§!."
 civic_tooltip_machine_cult_effects:0 "Starts with §YRobotic Workers§! technology, §Y400§! £pops£ §HLatent Psionic Robots§!, and £building£ §YMecha-Monastery§! and £building£ §YRobot Assembly Plant§! buildings \n\n- The §YSpiritualist§! faction is tolerant towards robots. \n$civic_tooltip_machine_cult_buildings$ \n\n§ECan be combined with:§! \n- ['civic_tooltip_machine_cult_spiritualist_combo', $civic_exalted_priesthood$] or other ['concept_ethics_rebuild_theocracy',§YSpiritualist§! themed government civics]."
 civic_tooltip_machine_cult_spiritualist_combo:0 "- §EWhen combined with §C['civic:civic_exalted_priesthood', $civic_exalted_priesthood$]§! or other ['concept_ethics_rebuild_theocracy',§YSpiritualist§! themed government civics]:§! \n- £job_high_techno_priest£ §Y$job_high_techno_priest_plural$§! additionally increase §YRobot Output§! and $r_engineering$ on the planet \n- £job_techno_priest£ §Y$job_techno_priest_plural$§! produce additional $r_unity$ and $r_engineering$."
 civic_tooltip_machine_cult_buildings:0 "- Available buildings:$TABBED_NEW_LINE$- £building£ §C['building:building_mecha_monastery', $building_mecha_monastery$]§!$TABBED_NEW_LINE$- £building£ §C['building:building_colossal_monument', $building_colossal_monument$]§!"

 civic_tooltip_spiritualist_machine_cult_combo:0 "§EWhen combined with the §C['civic:civic_machine_cult', $civic_machine_cult$]§! civic:§! \n- £job_high_techno_priest£ §Y$job_high_techno_priest_plural$§! additionally increase §YRobot Output§! and $r_engineering$ on the planet \n- £job_techno_priest£ §Y$job_techno_priest_plural$§! produce additional $r_unity$ and $r_engineering$."
# Machine Spirit
 civic_machine_cult_machine:0 "Machine Spirit"
 civic_machine_cult_machine_desc:0 "These machines are thought to have psionic qualities, using the vigor of faith to power their Machine Spirit."
 civic_tooltip_machine_cult_machine_effects:0 "- Additional Starting Building: £building£ §YMecha-Monastery§! \n- Unlocks §C['trait:trait_latent_psionic_machine', $trait_latent_psionic_machine$]§! trait \n$civic_tooltip_machine_cult_buildings$\n\n§EPsionic Symbiosis§!:\n    - Can modify £pops£ §Y$planet_pop_organics$§! to be §HCybernetic§!\n$civic_tooltip_machine_servitor_effects$\n\n§ECan be combined with:§! \n- ['civic_tooltip_machine_cult_spiritualist_combo', $civic_exalted_priesthood$] or other ['concept_ethics_rebuild_theocracy',§YSpiritualist§! themed government civics]"
 
 civic_machine_cult_machine_secondary_species:0 "Machine Cultists"
 civic_machine_cult_machine_secondary_species_desc:0 "§LThis species built, and began to worship, a sentient machine intelligence that resides on their homeworld. Their fervent belief occasionally unlocks psionic capabilities within machines.§!"
