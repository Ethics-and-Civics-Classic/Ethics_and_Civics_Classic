# Worker Co-Op
 civic_worker_coop: "Worker Cooperative"
 civic_worker_coop_desc: "Members of this society enjoy an equal share in the labors, profits and aspirations of the cooperative's ventures.\n\n§WCan build special slavery resisting§! £building£ §Y$BRANCH_OFFICE_BUILDINGS$§!\n\n§YUnderground Railroad§!§W:\nCan build§! §YBranch Offices§! §Won any planet that has§! §Hslavery§! §Was long as the owner empire has no war or active truce.\nCan build a special§! £building£ §YUnderground Railroad§! §Wthat§! §Rdecreases§! $r_stability$ §Wand encourage§! §GSlave Rebellions§!§W.§!\n§WEffectiveness increased with§! §CBreaker of Shackles§! §Worigin.§!"
 civic_tooltip_worker_coop_effects: "Allows §Y$living_standard_worker_ownership$§! Living Standard, under which all £pop£ Pops have high $r_consumer_goods$ Upkeep regardless of §YStrata§!\n\nDisables the use of most other §YLiving Standards§!\n\nAllows the §Y$trade_policy_mutual_aid$§! Trade Policy, which converts $r_trade$ to $r_energy$, $r_minerals$ and $r_food$.\n\nReplaces £job_executive£ $job_executive$ and £job_manager£ $job_manager$ Jobs with £job_manager£ §Y$job_steward$§! Jobs, which turns $r_consumer_goods$ into $r_unity$, $r_trade£, and $r_amenities$.\n\n§YBranch Office§! §WPlanets can create§! §RGeneral Strike§! §Wjobs from§! £pops£ §Hlibertarian§! §Wor§! £pops£ §Hcooperative§! §Wwhenever§! §Hspecies rights§! §Ware inadequate.\n\n§YBranch Offices§! force Labor Right §HFactions§! if able."
 
