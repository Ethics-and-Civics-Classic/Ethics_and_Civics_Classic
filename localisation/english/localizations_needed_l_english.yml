 envoy_events.210.desc.green:0 "$envoy_events.210.desc.start$ Abandoning [Root.GetAdj] pragmatism, [event_envoy.GetSheHe] [event_envoy.GetHasHave] been spending nearly all of [event_envoy.GetHerHis] personal time in the [envoy_country.GetAdj] wilderness. The more shocking reports declare that [event_envoy.GetSheHe] [event_envoy.GetWasWere] photographed sleeping on the ground!\nWhen confronted, [event_envoy.GetHerHis] only defense was, "The [envoy_country.GetSpeciesNamePlural] are right. We've murdered our homeworld. I want to feel reunited with my native [Root.GetSpeciesAdj] nature, but that's no longer possible on [Root.GetHomeworldName]." \n\n$envoy_events.210.desc.end$"
 # I might have had a little too much fun here. XD --Sage
 envoy_events.210.desc.industrial:0 "$envoy_events.210.desc.start$ To the public's shock and horror, [event_envoy.GetSheHe] [event_envoy.GetHasHave] publicly denounced our beloved national parks program, deriding it as "A criminal appeasal of bleeding-heart sentimentality" and "an obstruction of progress".\n[Root.GetShockingDietSecret] It's a scandal!\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.industrial_hum:0 "The more shocking rumors insist that [event_envoy.GetSheHe] [event_envoy.GetHasHave] even indulged in eating meat!"
 envoy_events.210.desc.industrial_mam:0 "There are even whispers that [event_envoy.GetSheHe] [event_envoy.GetHasHave] been using clay sanitary litter!"
 envoy_events.210.desc.industrial_rep:0 "The most discouraging allegations claim that [event_envoy.GetSheHe] use[event_envoy.GetSXX] high-wattage basking lights!"
 envoy_events.210.desc.industrial_avi:0 "One witness even claims to have seen [event_envoy.GetHerHim] taking a dust bath, and then discarding it instead of recycling it!"
 envoy_events.210.desc.industrial_art:0 "The most serious reports claim that [event_envoy.GetSheHe] no longer composts [event_envoy.GetHerHis] discarded molts."
 envoy_events.210.desc.industrial_mol:0 "Unconfirmed reports allege that [event_envoy.GetSheHe] use[event_envoy.GetSXX] non-biodegradable mucosal gels! As beauty products!"
 envoy_events.210.desc.industrial_shell:0 "Unconfirmed reports allege that [event_envoy.GetSheHe] commissioned a shell made from archaic fossil-plastic! Of all the things, plastic!"
 envoy_events.210.desc.industrial_necroid:0 "The most scandalous discoveries point to the use of banned embalming fluids in [event_envoy.GetHerHis] daily rejuvenation."
 envoy_events.210.desc.industrial_aquatic:0 "A neighbor even claims to have witnessed [event_envoy.GetHerHim] pouring hyperdrive coolant from [event_envoy.GetHerHis] personal shuttle into a public waterway!"
 envoy_events.210.desc.industrial_lithoid:0 "Among the more distressing accusations are claims that [event_envoy.GetSheHe] [event_envoy.GetHasHave] been consuming minerals from sources that were not certified sustainable."
 envoy_events.210.desc.industrial_plant:0 "Even worse, [event_envoy.GetHerHis] home soil-bed has tested positive for illegal industrial fertilizers."
 envoy_events.210.desc.industrial_tox:0 "Home environmental detectors have confirmed that [event_envoy.GetSheHe] [event_envoy.GetHasHave] been burning archaic fossil fuels for personal use."
 envoy_events.210.desc.socialism:0 "$envoy_events.210.desc.start$ The [envoy_country.GetAdj] communists have somehow managed to brainwash [event_envoy.GetHerHim] into embracing their depraved ideology.\nWhen [event_envoy.GetSheHe] was caught accepting speaking engagements at [envoy_country.GetSpeciesAdj] labor union meetings, [event_envoy.GetSheHe] refused to recant.\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.capitalism:0 "$envoy_events.210.desc.start$ In a shocking turn that has led to a public uproar, [event_envoy.GetSheHe] [event_envoy.GetHasHave] been unmasked as a scab. [event_envoy.GetSheHeCap] [event_envoy.GetHasHave] been recorded in closed meetings with [envoy_country.GetAdj] authorities divulging the identities of key leaders in [envoy_country.GetSpeciesAdj] labor movements, in exchange for generous bounties.\n\n$envoy_events.210.desc.end$"