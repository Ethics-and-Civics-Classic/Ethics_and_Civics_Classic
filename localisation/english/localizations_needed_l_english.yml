l_english:
 INTERVENTIONIST_LIBERATION:0 "Liberation"
 INTERVENTIONIST_NO_LIBERATION:0 "$INTERVENTIONIST_LIBERATION$"
 INTERVENTIONIST_LIBERATION_DESC:0 "'Liberating' foreign planets will please the [Root.GetName] for a time."

 envoy_events.210.desc.green:0 "$envoy_events.210.desc.start$ Abandoning [Root.GetAdj] pragmatism, [event_envoy.GetSheHe][event_envoy.GetSVe] been spending nearly all of [event_envoy.GetHerHis] personal time in the [envoy_country.GetAdj] wilderness. The more shocking reports declare that [event_envoy.GetSheHe] [event_envoy.GetWasWere] photographed sleeping on the ground! Like some kind of cave-[Root.GetSpeciesName]!\nWhen confronted, [event_envoy.GetHerHis] only defense was, "The [envoy_country.GetSpeciesNamePlural] are right. We've murdered our homeworld. I want to feel reunited with my native [Root.GetSpeciesAdj] nature, but that's no longer possible on [Root.GetHomeworldName]." \n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.industrial:0 "$envoy_events.210.desc.start$ To the public's shock and horror, [event_envoy.GetSheHe] [event_envoy.GetHasHave] publicly denounced our beloved national parks program, deriding it as "A criminal appeasal of bleeding-heart sentimentality" and "an obstruction of progress".\n[event_envoy.species.GetShockingDietSecret] It's a scandal!\n\n$envoy_events.210.desc.end$"
 TABLOIDRUMOR_hum:0 "The more shocking rumors insist that [event_envoy.GetSheHe][event_envoy.GetSVe] even indulged in eating meat!"
 TABLOIDRUMOR_mam:0 "There are even whispers that [event_envoy.GetSheHe][event_envoy.GetSVe] been using clay sanitary litter!"
 TABLOIDRUMOR_rep:0 "The most discouraging allegations claim that [event_envoy.GetSheHe] use[event_envoy.GetSXX] high-wattage basking lights!"
 TABLOIDRUMOR_avi:0 "One witness even claims to have seen [event_envoy.GetHerHim] taking a dust bath, and then discarding it instead of recycling it!"
 TABLOIDRUMOR_art:0 "The most serious reports claim that [event_envoy.GetSheHe] no longer composts [event_envoy.GetHerHis] discarded molts."
 TABLOIDRUMOR_mol:0 "Unconfirmed reports allege that [event_envoy.GetSheHe] use[event_envoy.GetSXX] non-biodegradable mucosal gels! As beauty products!"
 TABLOIDRUMOR_shell:0 "Unconfirmed reports allege that [event_envoy.GetSheHe] commissioned a shell made from archaic fossil-plastic! Of all the things, plastic!"
 TABLOIDRUMOR_necroid:0 "The more shameful discoveries point to the use of banned embalming fluids in [event_envoy.GetHerHis] daily rejuvenation."
 TABLOIDRUMOR_aquatic:0 "A neighbor even claims to have witnessed [event_envoy.GetHerHim] pouring hyperdrive coolant from [event_envoy.GetHerHis] personal shuttle into a public waterway!"
 TABLOIDRUMOR_lithoid:0 "Among the more distressing accusations are claims that [event_envoy.GetSheHe][event_envoy.GetSVe] been consuming minerals from mines that were not certified sustainable."
 TABLOIDRUMOR_plant:0 "Even worse, [event_envoy.GetHerHis] home soil-bed has tested positive for illegal industrial fertilizers."
 TABLOIDRUMOR_tox:0 "Home environmental detectors have confirmed that [event_envoy.GetSheHe] [event_envoy.GetHasHave] been burning archaic fossil fuels for personal use."
 envoy_events.210.desc.socialism:0 "$envoy_events.210.desc.start$ The [envoy_country.GetAdj] communists have somehow managed to brainwash [event_envoy.GetHerHim] into embracing their depraved ideology.\nWhen [event_envoy.GetSheHe] [event_envoy.GetWasWere] caught accepting speaking engagements at [envoy_country.GetSpeciesAdj] labor union meetings, [event_envoy.GetSheHe] refused to recant.\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.capitalism:0 "$envoy_events.210.desc.start$ In a shocking turn that has led to a public uproar, [event_envoy.GetName] has been unmasked as a scab. [event_envoy.GetSheHeCap][event_envoy.GetSVe] been recorded in closed meetings with [envoy_country.GetAdj] authorities divulging the identities of key leaders in [envoy_country.GetSpeciesAdj] labor movements, in exchange for generous bounties.\n\n$envoy_events.210.desc.end$"

 envoy_events.17.desc.green:0 "$envoy_events.17.desc.base$ However, [dispute_loser_envoy.GetSheHe] [dispute_loser_envoy.GetWasWere] unable to convince those present of the benefits of a more environmentally conscious outlook, and was soon faced with a barrage of jeers for supporting "sentimental [Root.GetAdj] treehugging".\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.industrial:0 "$envoy_events.17.desc.base$ However, [dispute_loser_envoy.GetSheHe] [dispute_loser_envoy.GetWasWere] unable to convince those present of the benefits of a more anthropocentric outlook, facing scathing scorn for so callously endorsing "widespread ecological devastation".\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.socialism:0 "$envoy_events.17.desc.base$ However, [dispute_loser_envoy.GetSheHe] [dispute_loser_envoy.GetWasWere] unable to convince those present of the benefits of a centrally planned economy, and was nearly run out of the chamber for openly endorsing socialism.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.capitalism:0 "$envoy_events.17.desc.base$ However, [dispute_loser_envoy.GetSheHe] [dispute_loser_envoy.GetWasWere] unable to convince those present of the benefits of a laissez-faire economic model, and had to quickly bow out of the chamber. [dispute_loser_envoy.GetSheHeCap][dispute_loser_envoy.GetSRe] being publicly shamed for espousing "bourgeoisie tyranny" and "[Root.GetAdj] rent-seeking".\n\n$envoy_events.17.desc.end$"
 envoy_events.18.desc.green.base:0 "was able to persuade many of the benefits of a more ecocentric outlook, citing the countless preventable global catastrophes in the pre-FTL history of every member body's homeworld."
 envoy_events.18.desc.industrial.base:0 "was able to persuade many of the benefits of a more industrialist outlook, cleanly articulating the virtues of the pragmatic calculus behind modern production models."
 envoy_events.18.desc.socialism.base:0 "was able to persuade many of the benefits of socialist economic theory, thoroughly shredding any defense of capitalism that the [dispute_loser.GetAdj] envoy could bring to bear."
 envoy_events.18.desc.capitalism.base:0 "was able to persuade many of the benefits of the free market model, soundly presenting the failings of socialism before the entire body."
 envoy_events.18.desc.green:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.green.base$ $envoy_events.18.desc.end$"
 envoy_events.18.desc.industrial:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.industrial.base$ $envoy_events.18.desc.end$"
 envoy_events.18.desc.socialism:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.socialism.base$ $envoy_events.18.desc.end$"
 envoy_events.18.desc.capitalism:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.capitalism.base$ $envoy_events.18.desc.end$"
