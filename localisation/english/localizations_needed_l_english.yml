 envoy_events.19.desc.industrial:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.industrial.base$ $envoy_events.19.desc.end$"
 envoy_events.19.desc.socialism:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.socialism.base$ $envoy_events.19.desc.end$"
 envoy_events.19.desc.capitalism:0 "$envoy_events.18.desc.base$ $envoy_events.18.desc.capitalism.base$ $envoy_events.19.desc.end$"
 federation_green_ideology:0 "$federation_militarist_ideology$"
 federation_green_ideology_desc:0 "Our membership in the federation is allowing ecocentrism to become increasingly widespread in our nation."
