 EMPIRE_DESIGN_korinth_conglomerate:0 "Korinth Conglomerate"
 EMPIRE_DESIGN_EaC_korinth_conglomerate_desc:0 "At first, they only launched satellites. When the early warning system built by Alabaster Communications LLC detected a rogue planet on an inevitable collision course with Korin That Was, something had to be done. The news unified the world, and the desperate people yielded their trust to the corporation.\n\nAlabaster spearheaded the Voidborne project, utilizing all their resources to launch the first habitat. They built a brand for their new home that the people loved, and companies lined up to become franchisees. Soon habitats spanned across the solar system, and the intermixing of societies blossomed into a cultural renaissance.\n\nUnfortunately, complications abounded: satellite misalignment, meteor impacts, legal disputes, and lack of standardization made maintaining communication arrays nigh impossible. Alabaster Communications volunteered to be the sole maintainers of the vital and delicate communication network. The people realized too late how powerful that leverage would become.\n\nOne by one, each of the habitats' franchisees would have assets annexed, fees doubled, and their shares purchased, all under threat of losing all access to the internet. Eventually, all were consolidated under a single organization. Now rebranded as the Korinth Conglomerate, this Megacorp seeks to make endless acquisitions, via the franchising model, all over the galaxy!"
