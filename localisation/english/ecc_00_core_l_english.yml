 EMPIRE_DESIGN_yldarian_raider_clan:0 "Yldarian Raider Clan"
 EMPIRE_DESIGN_EaC_yldarian_raider_clan_desc:0 "The Yldari origins are all but forgotten, consigned to speculation and faint clues of a grand design. According to oral tradition, they had been genetically designed as the warrior caste of a precursor empire of old. With their old masters long extinct, the clans have been united and are looking outward to reap new spoils from undefended worlds.\nThe Yldari are an all male species and cannot reproduce normally, relying on Ancient Cloning Vats to propagate. However, their ancient genetic templates designed them as perfect warriors. This created a culture of deep-set hierarchy, fueled by the belief that the warriors must rule and the masses must obey."
