 job_ark_gardener_effect_desc:2 "£job_ranger£ $job_ark_gardener_plural$ produisent $r_society$, $r_unity$, réduisent £crime£ §Y$PLANET_CRIME_TITLE$§! local, font apparaître §Y$defense_army_plural$§! et augmentent §Y$concept_naval_capacity$§."
 mod_job_ark_gardener_add:0 "$job_ark_gardener$ Emplois"
 has_nomad_conservatory:0 "$TRIGGER_FAIL$§RObstacle ne sera pas supprimable tant que le §Y[GetConservatoryType]§! existe.§!"
 biologist_is_ark_gardener_tt: "£job_biologist£ $job_biologist_plural$ sont convertis en £job_ranger£ $job_ark_gardener_plural$"
 d_ark_nature_preserve_blocker: "Biotope Jardin"
 d_ark_nature_preserve_blocker_plural: "Biotopes Jardin"
 d_ark_nature_preserve_blocker_desc:0 "Une section de notre $arkship$ a été dédiée à la protection des espèces en danger et éteintes de nombreuses planètes. C'est leur maison, comme la nôtre."
 decision_expand_biotope: "Étendre Biotope"
 decision_expand_biotope_short: "Ajoute un §Y$d_ark_nature_preserve_blocker$§! additionnel à la $arkship$."
 decision_expand_biotope_desc: "Avec des systèmes de support de vie redondants et une surveillance attentive, nous pouvons recréer avec précision les conditions écologiques de nombreuses biosphères différentes."
 civic_naturalism_nomad:0 "Solarpunks Starbound"
 civic_naturalism_nomad_desc:0 "Ces vagabonds se sont consacrés à façonner leur $arkship_plural$ à l'image des planètes qu'ils aiment le plus. Ils ne les imitent pas seulement, ils sont véritablement des mondes mobiles."
 building_national_park_nomad:0 "Biosphère Ark"
 building_national_park_nomad_desc:0 "L'intérieur de la $arkship$ est un écosystème complet, grouillant de vie naturelle. La flore et la faune ici sont sous protection spéciale."
 civic_environmentalist_nomad:0 "Arks Environnementaux"
 civic_environmentalist_nomad_desc:0 "Ces nomades collectent les espèces en danger et éteintes des planètes qu'ils visitent. Ils en prennent soin à bord de leurs arks dans une mission pour préserver la vie à travers la galaxie."
 civic_tooltip_environmentalist_nomad_effects:2 "$t$- $AVAILABLE_BUILDINGS$ £building£ ['building:building_nomad_conservatory']$TABBED_NEW_LINE$- $ADDITIONAL_BUILDINGS_STRING$ £building£ §Y$building_nomad_conservatory$§!\n$t$- $AVAILABLE_HOLDINGS$ £building£ ['building:holding_park_ranger_lodge']$TABBED_NEW_LINE$- Accorde un §Y$d_ark_nature_preserve_blocker$§! £blocker£§HObstacle§! additionnel au début de partie."
 civic_keepers_harmony_nomad:0 "Nature-adorateurs Nomades"
 civic_keepers_harmony_nomad_desc:0 "Les gens de cette société adorent la sainteté des endroits qu'ils visitent. Ils traversent la galaxie sur des pèlerinages de plusieurs années vers des sites sacrés où la nature et le cosmos sont en parfaite harmonie."
 civic_tooltip_keepers_harmony_nomad_effects:0 "$t$§ESymbiose Divine:§!$TABBED_NEW_LINE$$t$- Remplace £job_bureaucrat£ §Y$job_bureaucrat$§! emplois avec uniques £job_priest£ §Y$job_druid$§! emplois.$TABBED_NEW_LINE$$t$- £job_priest£ §Y$job_druid$§! emplois sont plus efficaces sur $arkship_plural$ avec §Y$d_ark_nature_preserve_blocker$§! £blocker£ §H§Bloqueur§!§!, fournissant §Gadditionnels§! £housing£ §YLogement§!, et augmentent §Y$MOD_POP_ENVIRONMENT_TOLERANCE$§!.\n$TABBED_NEW_LINE$- £building£ §Y$building_nature_sanctuary_nomad_plural$§! sont des bâtiments uniques qui fournissent $r_unity$ locale accrue, £happiness£ §YBonheur§!, et £pops£ §H$ethic_green$§! attraction par §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HObstacle§! sur la $arkship$, et nécessitent $r_food$ pour entretien."
 civic_tooltip_keepers_harmony_nomad_negative_effects:0 "$t$§ASymbiose Abandonnée:§!$TABBED_NEW_LINE$$t$- Sur $arkship_plural$ sans §Y$d_ark_nature_preserve_blocker$§! £blocker£ §H§Bloqueur§!§!, §Y$job_druid$§! emplois produiront §Rmoins§! $r_unity$ qu'un bureaucrate normal."
 building_nature_sanctuary_nomad_plural:0 "Sanctuaires Jardin"
 building_nature_sanctuary_nomad_plural_desc:0 "$building_nature_sanctuary_nomad_desc$"
 building_nature_sanctuary_nomad:0 "Sanctuaire Jardin"
 building_nature_sanctuary_nomad_desc:0 "Ce lieu sacré est où notre chemin à travers les étoiles est consacré, et notre harmonie avec l'écosystème du vide est honorée. Ce monument augmente $r_unity$ locale, £happiness£ $HAPPINESS$ et §YÉcocentrisme§! attraction d'éthique par §Y$d_ark_nature_preserve_blocker$§! £blocker£ §H§Bloqueur§!§!, et nécessite $r_food$ pour entretien."
 civic_eco_warfare_nomad:0 "Biotopes Protecteurs"
 civic_eco_warfare_nomad_desc:0 "Non seulement ces gens sont plus que prêts et capables de défendre leurs biotopes jardin avec des fusils dans leurs mains, mais ils ont aussi appris à appliquer efficacement les avancées en sciences biologiques au militaire.\n\n§YNavires Organiques§!: Impliquer la biotechnologie dans la construction militaire permet aux vaisseaux d'obtenir des capacités spéciales, comme régénération de l'Armure et Coque, et aussi devenir plus économes en énergie. L'inconvénient est que ces matériaux sont généralement plus fragiles que les alliages non-organiques.\n\n§YBiomédecine Militaire§!: Santé de l'Armée est augmentée."
 civic_tooltip_eco_warfare_nomad_effects:0 "$t$§AProtection Naturelle§!: Bénéfice de §Y$d_ark_nature_preserve_blocker$§! £blocker£ §H§Bloqueur§!§!$TABBED_NEW_LINE$$t$- Change £job_entertainer£ §Y$job_entertainer_plural$§! en £job_duelist£ §Y$job_duelist_plural$§!.$TABBED_NEW_LINE$$t$- Chaque £blocker£ §HObstacle§! fournit §G-5%§! §YBombardement Planétaire dégâts§!.\n$TABBED_NEW_LINE$§ABiotechnologie Militaire§!:$TABBED_NEW_LINE$$t$- $r_minerals$ entretien par 100 [foundry.GetIcon] §Y[GetAlloyProducer]§! §G-1§!.$TABBED_NEW_LINE$$t$- $r_food$ entretien par 100 [foundry.GetIcon] §Y[GetAlloyProducer]§! §R+1§!.$TABBED_NEW_LINE$$t$- $r_food$ entretien par 100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§! §R+1§!.$TABBED_NEW_LINE$$t$- $r_alloys$ produit par 100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§! §G+0.5§!.\n$BOB_mercs_tooltip$"
 concept_eco_biologists: "Emplois de biologiste écocentriste"
 eco_biologist_swap: "Remplacements d'emploi de biologiste écocentrique"
 concept_eco_biologists_desc: "Divers §H$ethic_green$§! civismes permettent aux biologistes d'être remplacés par des variantes spéciales, plus productives.\n§E$job_xenobiologist$§!$TABBED_NEW_LINE$- £job_xenobiologist£ §Y$job_xenobiologist_plural$§! sont des versions plus productives de £job_biologist£ §Y$job_biologist_plural$§!, produisant §G50%§! de $r_society$ en plus, au prix de §R33%§! de $r_consumer_goods$ en plus.$TABBED_NEW_LINE$- Ceci est activé par le §C$civic_terraforming$§! §Ycivisme§!, en combinaison avec ['concept_natural_blockers'].\n\n§E$job_ranger$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ranger_plural$s§! sont un mélange de plusieurs emplois, et des généralistes produisant plusieurs ressources en plus de $r_society$, comme $r_unity$, $r_amenities$, £job_criminal£ §Y$PLANET_CRIME_TITLE$§! Réduction, §Y$concept_naval_capacity$§!, et §Y$defense_army_plural$§!.$TABBED_NEW_LINE$- Ceci est activé par le £building£ §Y$building_ranger_lodge$§! Bâtiment par le §C$civic_environmentalist$§! civisme.$TABBED_NEW_LINE$- Ceci est également activé par le §C$civic_eco_warfare$§! civisme en combinaison avec ['concept_natural_blockers'].\n\n§E$job_xenoranger$§!$TABBED_NEW_LINE$- Lorsque £job_xenobiologist£ §Y$job_xenobiologist_plural$§! et £job_ranger£ §Y$job_ranger_plural$§! sont tous deux activés, l'emploi devient un £job_xenoranger£ §Y$job_xenoranger$§!, qui possède les avantages et coûts des deux.\n\n§E$job_ark_gardener$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ark_gardener_plural$§! sont des $job_ranger_plural$ qui travaillent exclusivement sur $arkship_plural$ dans ['concept_nomadic_empires']. Ils remplissent la même fonction qu'un normal £job_ranger£ §Y$job_ranger$§!. Ils bénéficient du placement de §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBloqueurs§!, et sont disponibles pour tous £green£ Nomades."
 holding_national_park:0 "Parc national du suzerain"
 holding_national_park_desc:0 "Cette institution convertit une partie de la planète du sujet en une vaste réserve naturelle. Les zones sauvages restaurées favorisent une perspective $ethic_green$, et amélioreront les relations avec le Suzerain si le sujet apprécie également la nature."
