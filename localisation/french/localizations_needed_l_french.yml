 contract_planetary_pilgrimage_4_chain_desc: "$contract_planetary_pilgrimage_4_desc$"
 contract_planetary_pilgrimage_4_title: "Honorer les Formes de Vie Uniques"
 contract_planetary_pilgrimage_4_desc: "§L«Nos $job_druid_plural$ ont demandé un pèlerinage pour honorer les formes de vie uniques sur ce monde.»§!"
 contract_planetary_pilgrimage_4_lore_issued: "§L«Une chance d'honorer de telles créatures incroyables serait une bénédiction!»§!"
 contract_planetary_pilgrimage_4_lore_completed: "§L«De telles créatures magnifiques! Penser que la galaxie abrite de telles merveilles incroyables!»§!"
 contract_planetary_pilgrimage_4_lore_failed: "§L«Je regardais en avant peut-être voir un Nemma. Ma déception est incommensurable et ma journée est ruinée.»§!"
 contract_planetary_pilgrimage_4_chain_title: "$contract_planetary_pilgrimage_4_title$"
