 # Anarchy Rework #
 ##################
 # Community Organizer
 organizer: "$job_organizer$"
 job_organizer:0 "Community Organizer"
 job_organizer_plural:0 "Community Organizers"
 job_organizer_desc:0 "In a non-hierarchical society, the needs of our neighbors are met by community organizers. They distribute daily necessities and coordinate during emergencies."
 job_organizer_effect_desc: "£job_culture_worker£ $job_organizer_plural$ turn $r_consumer_goods$ into $r_unity$ and $r_amenities$, as well as a small amount of $r_food$, $r_minerals$, and $r_energy$."

 concept_organizer: "$job_organizer_plural$"
 concept_organizer_desc: "$job_organizer_effect_desc$\n\n§L$job_organizer_desc$§!"

 # Labor Organizer
 steward_anarchy: "$job_steward_anarchy$"
 job_steward_anarchy:0 "Labor Organizer"
 job_steward_anarchy_plural:0 "Labor Organizers"
 job_steward_anarchy_desc:0 "In an egalitarian work environment, labor organizers mediate conflicts between workers and coordinate the distribution of raw materials and supplies."

 living_standard_community_labor: "Community Labor"
 living_standard_community_labor_tooltip: "$living_standard_community_labor$ guarantees that the needs of our neighbors are never left unfulfilled. Resources are bartered, donated, or shared efficiently."
 living_standard_community_labor_tooltip_delayed: "§LCompetition is the law of the jungle, but cooperation is the law of civilization.§!"

 civic_anarchy_ideals:0 "Anarchist Ideals"
 civic_anarchy_ideals_desc:0 "This society is based upon ideals of rejection of any form of unjust political or sociological hierarchy."
 civic_anarchy_ideals_effects:0 "$civic_civil_education_effects$ $TABBED_NEW_LINE$- $AVAILABLE_POLICIES$ ['concept_trade_mutual_aid'] $TABBED_NEW_LINE$- Replaces £job_politician£ §Y$job_politician$§! and £job_bureaucrat£ §Y$job_bureaucrat$§! Jobs with ['concept_organizer',£job_culture_worker£ $job_organizer$] Jobs $TABBED_NEW_LINE$- §GUnlocks§! the §Y$bombardment_EaC_liberate_slaves$§! bombardment stance."
 civic_anarchy_ideals_negatives:0 "$t$- §RBanned§! from having the following §YPolicies§!:$TABBED_NEW_LINE$$t$- §Y$policy_resettlement$§!: §H$resettlement_allowed$§!$TABBED_NEW_LINE$$t$- §Y$policy_population_controls$§!: §H$population_controls_allowed$§!"
 
 civic_anarchy_utopia:0 "Anarchist Utopia"
 civic_anarchy_utopia_desc:0 "This autonomous collective organizes itself upon principles of mutual aid, restorative justice, and free association. Without the burden of hierarchy, they are truly the freest people in the galaxy."
 civic_anarchy_utopia_effects:0 "$t$- Allows §Y$living_standard_community_labor$§! Living Standard, under which all £pop£ §YPops§! have high £consumer_goods£ §Y$consumer_goods$§! Upkeep regardless of §YStrata§! $TABBED_NEW_LINE$- Disables the use of most other §YLiving Standards§!$TABBED_NEW_LINE$- $civic_crowdsourcing_anarchy_effects$\n$civic_anarchy_ideals_effects$"
 civic_anarchy_utopia_negatives:0 "$t$- §RBanned§! from having the following §YPolicies§!:$TABBED_NEW_LINE$$t$- §Y$policy_resettlement$§!: §H$resettlement_allowed$§!$TABBED_NEW_LINE$$t$- §Y$policy_interference$§!: §H$interference_aggressive$§! $TABBED_NEW_LINE$$t$- §Y$policy_population_controls$§!: §H$population_controls_allowed$§!\n$TABBED_NEW_LINE$- §RObligated§! to have the following §YPolicies§!:$TABBED_NEW_LINE$$t$- §Y$policy_trade_policy$§!: §H$trade_policy_mutual_aid$§! $TABBED_NEW_LINE$$t$- §Y$policy_subjugation_war_terms$§!: §H$benevolent_terms_name$§!$TABBED_NEW_LINE$$t$- §Y$policy_conscription_stance$§!: §H$conscription_stance_0$§! $TABBED_NEW_LINE$$t$- §H$border_policy_open_name$§!$TABBED_NEW_LINE$$t$- §Y$policy_refugees$§!: §H$refugees_allowed$§!!"

 civic_primitive_enthusiasts:0 "Primitive Enthusiasts"
 civic_primitive_enthusiasts_desc:0 "This society has an appreciation for the older techniques, choosings to perform many jobs by hand and live off the land through barter, farming, and animal husbandry."
 civic_primitive_enthusiasts_effects:0 "$t$- At least one §YGuaranteed Habitable World§! will be a pre-FTL Civilization's £job_hunter_gatherer£ §GHomeworld§!\n$TABBED_NEW_LINE$- £job_civilian£ §YCivilians§! become £job_primitive_enthusiasts£ §HHomesteaders§! and practice a lifestyle of §Gself-sufficiency§! producing $r_food$\n\n§YDomestication:§!$TABBED_NEW_LINE$Guarantees a §Ghigher chance§! to research £physics£ ['tech_gravity_wells'] and eventually £society£ ['tech_alien_cloning'].\n\n§EIf Ethics are§! §H$ethic_socialism$§! §Eand§! §H$ethic_egalitarian$§!§E:§!$TABBED_NEW_LINE$$t$- Allows the §Y$trade_policy_mutual_aid$§! Trade Policy, which converts $r_trade$ into $r_energy$, $r_minerals$, and $r_food$§E:§!$TABBED_NEW_LINE$- Replaces £job_politician£ §Y$job_politician$§! and £job_bureaucrat£ §Y$job_bureaucrat$§! Jobs with ['concept_organizer',£job_culture_worker£ $job_organizer$] Jobs."
 civic_primitive_enthusiasts_effects_first_contact_dlc:0 "$t$- Gains §G100%§! more Insights from observing pre-FTL Civilizations\n$civic_primitive_enthusiasts_effects$"
