 # Nomadic Keepers of Harmony - Planetary Pilgrimage Contracts
 planetary_pilgrimage_special: "Pèlerinage Planétaire"
 
 contract_planetary_pilgrimage_1_chain_title: "$contract_planetary_pilgrimage_1_title$"
 contract_planetary_pilgrimage_1_chain_desc: "$contract_planetary_pilgrimage_1_desc$"
 contract_planetary_pilgrimage_1_title: "Méditer sur la Nature Intacte"
 contract_planetary_pilgrimage_1_desc: "§L«Nos acolytes sont désireux d'expérimenter la tranquillité d'une planète intacte par les ravages de la civilisation. Ils souhaitent méditer sur un monde stationnaire.»§!"
 contract_planetary_pilgrimage_1_lore_issued: "§L«Un monde entier, sans personne dessus! Imaginez le chant des oiseaux que vous pourriez entendre!»§!"
 contract_planetary_pilgrimage_1_lore_completed: "§L«Je n'ai jamais été aussi en paix, aussi en harmonie avec la nature...»§!"
 contract_planetary_pilgrimage_1_lore_failed: "§L«Bah... le $d_ark_nature_preserve_blocker$ est gentil aussi...»§!"
 contract_planetary_pilgrimage_1_chain_title: "$contract_planetary_pilgrimage_1_title$"
 contract_planetary_pilgrimage_1_chain_desc: "$contract_planetary_pilgrimage_1_desc$"
 CONTRACT_planetary_pilgrimage_1_PROJECT: "$contract_planetary_pilgrimage_1_title$"
 CONTRACT_planetary_pilgrimage_1_PROJECT_DESC: ""
 
 contract_planetary_pilgrimage_2_chain_title: "$contract_planetary_pilgrimage_2_title$"
 contract_planetary_pilgrimage_2_chain_desc: "$contract_planetary_pilgrimage_2_desc$"
 contract_planetary_pilgrimage_2_title: "Hommage aux Innocents"
 contract_planetary_pilgrimage_2_desc: "§L«Les $job_druid_plural$ souhaitent conduire une cérémonie spéciale pour souhaiter sagesse éternelle et bonheur aux $job_pre_sapient_plural$ sur cette planète.»§!"
 contract_planetary_pilgrimage_2_lore_issued: "§L«Rien connaître de désir ou de querelle! Il y a tant que nous pourrions apprendre!»§!"
 contract_planetary_pilgrimage_2_lore_completed: "§L«Je ne pense pas que passer un après-midi entier à picorer mes orifices était ce que j'étais supposé apprendre...»§!"
 contract_planetary_pilgrimage_2_lore_failed: "§L«Une occasion si rare, et nous l'avons gâchée. Je veux pleurer!»§!"
 contract_planetary_pilgrimage_2_chain_title: "$contract_planetary_pilgrimage_2_title$"
 contract_planetary_pilgrimage_2_chain_desc: "$contract_planetary_pilgrimage_2_desc$"
 CONTRACT_planetary_pilgrimage_2_PROJECT: "$contract_planetary_pilgrimage_2_title$"
 CONTRACT_planetary_pilgrimage_2_PROJECT_DESC: ""
 
 contract_planetary_pilgrimage_3_chain_title: "$contract_planetary_pilgrimage_3_title$"
 contract_planetary_pilgrimage_3_chain_desc: "$contract_planetary_pilgrimage_3_desc$"
 contract_planetary_pilgrimage_3_title: "Adorer le Monde Sacrée"
 contract_planetary_pilgrimage_3_desc: "§L«Une planète consacrée comme lieu sacré, jamais à toucher par la civilisation. Nous sommes contraints d'offrir révérence en adoration.»§!"
 contract_planetary_pilgrimage_3_lore_issued: "§L«Se baigner dans une telle beauté sacrée est le rêve de ma vie!»§!"
 contract_planetary_pilgrimage_3_lore_completed: "§L«C'était la plus belle chose que j'aie jamais vue de ma vie... Je m'en rappellerai pour toujours.»§!"
 contract_planetary_pilgrimage_3_lore_failed: "§L«Je ne pourrai peut-être jamais revoir un monde saint dans ma vie...»§!"
 contract_planetary_pilgrimage_3_chain_title: "$contract_planetary_pilgrimage_3_title$"
 contract_planetary_pilgrimage_3_chain_desc: "$contract_planetary_pilgrimage_3_desc$"
