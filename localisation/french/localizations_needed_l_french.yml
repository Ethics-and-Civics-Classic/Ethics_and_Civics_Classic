 civic_primitive_enthusiasts_desc:0 "Cette société apprécie les techniques anciennes, choisissant d'effectuer de nombreux métiers à la main et de vivre de la terre grâce au troc, à l'agriculture et à l'élevage."
 civic_primitive_enthusiasts_effects:0 "$t$- Au moins un §YMonde Garanti Habitable§! sera le §YMonde d'Origine§! £job_hunter_gatherer£ §Gd'une Civilisation pré-FTL§!\n$TABBED_NEW_LINE$- £job_civilian£ §YCivilians§! deviennent £job_primitive_enthusiasts£ §HHomesteader§! et pratiquent un mode de vie §Gauto-suffisant§! produisant $r_food$\n\n§YDomestication:§!$TABBED_NEW_LINE$Garantit une §Gmeilleure chance§! de rechercher £physics£ ['tech_gravity_wells'] et éventuellement £society£ ['tech_alien_cloning'].\n\n§ESi Éthiques sont§! §H$ethic_socialism$§! §Eet§! §H$ethic_egalitarian$§!§E:§!$TABBED_NEW_LINE$$t$- Permet la Politique Commerciale §Y$trade_policy_mutual_aid$§!, qui convertit $r_trade$ en $r_energy$, $r_minerals$, et $r_food$§E:§!$TABBED_NEW_LINE$- Remplace £job_politician£ §Y$job_politician$§! et £job_bureaucrat£ §Y$job_bureaucrat$§! par ['concept_organizer',£job_culture_worker£ $job_organizer$]."
