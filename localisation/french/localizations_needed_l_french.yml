 contract_planetary_pilgrimage_5_chain_title: "$contract_planetary_pilgrimage_5_title$"
 contract_planetary_pilgrimage_5_chain_desc: "$contract_planetary_pilgrimage_5_desc$"
 contract_planetary_pilgrimage_5_title: "Admirer les Créations du Vide"
 contract_planetary_pilgrimage_5_desc: "§L«Nos $job_druid_plural$ souhaitent conduire une cérémonie pour honorer la faune spatiale native de ce système, afin que nous puissions mieux les imiter.»§!"
 contract_planetary_pilgrimage_5_lore_issued: "§L«Nous sommes si semblables! Ce serait merveilleux de reconnaître cela!»§!"
 contract_planetary_pilgrimage_5_lore_completed: "§L«Ils étaient si majestueux... Je me sens tellement humble.»§!"
 contract_planetary_pilgrimage_5_lore_failed: "§L«Ce n'est tout simplement pas la même chose que prier quand ils passent!»§!"
