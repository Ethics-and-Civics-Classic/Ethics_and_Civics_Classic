 # Pirate Combat Instructor
 pirate_combat_instructor: "$job_pirate_combat_instructor$"
 job_pirate_combat_instructor:0 "Instructeur de Combat Pirate"
 job_pirate_combat_instructor_plural:0 "Instructeurs de Combat Pirates"
 job_pirate_combat_instructor_desc:0 "Un esprit aigu est un atout précieux pour chaque flotte de corsaires. Se concentrer sur le développement au lieu de la punition améliore la compétence des membres d'équipage et atténue les problèmes avant qu'ils ne surviennent."
 steward_pirate: "$job_steward_pirate$"
 job_steward_pirate:0 "Capitaine Intendant"
 job_steward_pirate_plural:0 "Capitaines Intendants"
 job_steward_pirate_desc:0 "En tant que syndicat ouvrier de flottes de corsaires coopératives, la charte sous laquelle un capitaine pirate peut arborer notre drapeau exige des devoirs sur planète ainsi que dans l'espace."
 steward_pirate_anarchy: "$job_steward_pirate_anarchy$"
 job_steward_pirate_anarchy:0 "Officier syndicaliste"
 job_steward_pirate_anarchy_plural:0 "Officiers syndicalistes"
 job_steward_pirate_anarchy_desc:0 "Les exigences du commandement d'un vaisseau et de l'organisation du travail exigent des gens de l'espace dotés de nombreux talents. Plus important encore, ils doivent être prêts à relever le défi, puis céder le pouvoir lorsque leur temps est révolu. Sinon, ils ne seront pas respectés par leur équipage."
 steward_pirate_offworld: "$job_steward_pirate_offworld$"
 job_steward_pirate_offworld:0 "Capitaine intendant extramondain"
 job_steward_pirate_offworld_plural:0 "Capitaines intendants extramondains"
 job_steward_pirate_offworld_desc:0 "Un capitaine intendant extramondain agit comme un représentant syndical naval non conventionnel, établissant un rapport unique avec des gens de l'espace entreprenants. Ils intègrent leurs réseaux et gains illicites dans la structure locale du travail, résultant en une arrangement prospère pour les travailleurs impliqués."
 organizer: "$job_organizer$"
 job_organizer:0 "Organisateur communautaire"
 job_organizer_plural:0 " Organisateurs communautaires"
 job_organizer_desc:0 "Dans une société non hiérarchisée, les besoins de nos voisins sont satisfaits par les organisateurs communautaires. Ils distribuent les nécessités quotidiennes et coordonnent lors des urgences."
 job_organizer_effect_desc: "£job_culture_worker£ $job_organizer_plural$ transforment $r_consumer_goods$ en $r_unity$ et $r_amenities$, ainsi qu'une petite quantité de $r_food$, $r_minerals$, et $r_energy$."
 concept_organizer: "$job_organizer_plural$"
 concept_organizer_desc: "$job_organizer_effect_desc$\n\n§L$job_organizer_desc$§!"
 steward_anarchy: "$job_steward_anarchy$"
 job_steward_anarchy:0 "Organisateur du travail"
 job_steward_anarchy_plural:0 "Organisateurs du travail"
 job_steward_anarchy_desc:0 "Dans un environnement de travail égalitaire, les organisateurs du travail arbitrent les conflits entre travailleurs et coordonnent la distribution des matières premières et fournitures."
 living_standard_community_labor: "Travail communautaire"
 living_standard_community_labor_tooltip: "$living_standard_community_labor$ garantit que les besoins de nos voisins ne restent jamais insatisfaits. Les ressources sont échangées, données ou partagées efficacement."
 living_standard_community_labor_tooltip_delayed: "§LLa compétition est la loi de la jungle, mais la coopération est la loi de la civilisation.§!"
 civic_anarchy_ideals:0 "Idéaux anarchistes"
 civic_anarchy_ideals_desc:0 "Cette société repose sur des principes de rejet de toute forme de hiérarchie politique ou sociologique injustifiée."
 civic_anarchy_ideals_effects:0 "$civic_civil_education_effects$ $TABBED_NEW_LINE$- $AVAILABLE_POLICIES$ ['concept_trade_mutual_aid'] $TABBED_NEW_LINE$- Remplace £job_politician£ §Y$job_politician$§! et £job_bureaucrat£ §Y$job_bureaucrat$§! par ['concept_organizer',£job_culture_worker£ $job_organizer$]$TABBED_NEW_LINE$- §GDébloque§! la posture de bombardement §Y$bombardment_EaC_liberate_slaves$§!."
 civic_anarchy_ideals_negatives:0 "$t$- §Banni§! d'avoir les politiques suivantes:$TABBED_NEW_LINE$$t$- §H$policy_resettlement$§!: $resettlement_allowed$$TABBED_NEW_LINE$$t$- §H$policy_population_controls$§!: $population_controls_allowed$"
 civic_anarchy_utopia:0 "Utopie anarchiste"
 civic_anarchy_utopia_desc:0 "Ce collectif autonome s'organise selon les principes de l'entraide, de la justice restaurative et de l'association libre. Sans le poids de la hiérarchie, ils sont véritablement le peuple le plus libre de la galaxie."
 civic_anarchy_utopia_effects:0 "$t$- Permet le Niveau de Vie §Y$living_standard_community_labor$§!, sous lequel tous £pop£ §YPops§! ont un coût élevé £consumer_goods£ §Y$consumer_goods$§! indépendamment du §YStrate§! $TABBED_NEW_LINE$- Désactive l'utilisation de la plupart des autres §YNiveaux de Vie§!$TABBED_NEW_LINE$- $civic_crowdsourcing_anarchy_effects$\n$civic_anarchy_ideals_effects$"
