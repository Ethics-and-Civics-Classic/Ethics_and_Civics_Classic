 pft_environmentalists_nomads:0 "Faction des xénoécologistes"
 pft_environmentalists_nomads_desc:1 "Les xénoécologistes se préoccupent principalement de l'habitabilité continue de nos vaisseaux-arcs et de la préservation du macro-environnement galactique dans son ensemble. Ils s'opposent aux demandes d'extraction stellaire des extracteurs.\n\n§LEthique écocentrique§!"
 pft_manufacturers_nomads:0 "Faction des extracteurs"
 pft_manufacturers_nomads_desc:1 "Les extracteurs représentent les intérêts des astro-miniers, manufacturiers et métallurgistes qui maintiennent la capacité opérationnelle de nos vaisseaux-arcs. Ils sont dédaigneux des idéaux des xénoécologistes.\n\n§LEthique industrialiste§!"
 factions.1.desc.manufacturers_nomads:0 "Leurs membres se sont principalement préoccupés d'excaver les corps célestes et d'étendre les réserves opérationnelles.\n\n"
 factions.1.desc.environmentalists_nomads:0 "Leurs membres font du lobbying pour la conservation de l'écosystème galactique et la réduction des besoins opérationnels.\n\n"
 civic_machine_cult_machine_forever_cruise: "Culte du Serviteur"
 civic_machine_cult_machine_forever_cruise_desc: "Cet empire de machines, adoré comme des dieux par leurs créateurs, veut à prendre la vie organique par la main et lui montrer la gloire du cosmos... et servir des boissons fruitées délicieuses."
 civic_tooltip_machine_cult_machine_forever_cruise_effects: "$- Bâtiment de départ supplémentaire : £building£ §YMécha-Monastère§! \n- Débloque le §C['trait:trait_latent_psionic_machine', $trait_latent_psionic_machine$]§! trait \n$civic_tooltip_machine_cult_buildings$\n\n§ESymbiose Psiyonique§!:\n    - Peut modifier £pops£ §Y$planet_pop_organics$§! pour devenir §HCybernétique§!$t$- §HPassagers§! doivent utiliser le niveau de vie §Y$living_standard_organic_trophy$§! et fournissent §Gun bonus de +1%§! d'efficacité des emplois de spécialiste\n$t$- §HPassagers de classe économique§! sont remplacés par §Y$job_cruise_passenger_unemployment_bio_trophy_plural$§!\n$t$- §RLes besoins des passagers sont plus difficiles à satisfaire§!\n$t$ Tous les pops mécaniques deviennent automatiquement §HEquipage§!, et ne peuvent jamais être §HPassagers§!.\n\n§EPeut être combiné avec:§! \n- ['civic_tooltip_machine_cult_spiritualist_combo', $civic_exalted_priesthood$] ou d'autres ['concept_ethics_rebuild_theocracy',§YSpiritualiste§! civismes de gouvernement à thème]"

