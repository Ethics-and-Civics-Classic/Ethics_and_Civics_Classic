 ####################
 # Pirate Job Stuff #
 ####################
 
 # Pirate Combat Instructor
 pirate_comabt_instructor: "$job_pirate_combat_instructor$"
 job_pirate_combat_instructor:0 "Instructeur de Combat Pirate"
 job_pirate_combat_instructor_plural:0 "Instructeurs de Combat Pirates"
 job_pirate_combat_instructor_desc:0 "Un esprit aigu est un atout précieux pour chaque flotte de corsaires. Se concentrer sur le développement au lieu de la punition améliore la compétence des membres d'équipage et atténue les problèmes avant qu'ils ne surviennent."
 
 # Steward Captain
 steward_pirate: "$job_steward_pirate$"
 job_steward_pirate:0 "Capitaine Intendant"
 job_steward_pirate_plural:0 "Capitaines Intendants"
 job_steward_pirate_desc:0 "En tant que syndicat ouvrier de flottes de corsaires coopératives, la charte sous laquelle un capitaine pirate peut arborer notre drapeau exige des devoirs sur planète ainsi que dans l'espace."
 
 # Syndicalist Officer
 steward_pirate_anarchy: "$job_steward_pirate_anarchy$"
 job_steward_pirate_anarchy:0 "Syndicalist Officer"
 job_steward_pirate_anarchy_plural:0 "Syndicalist Officers"
 job_steward_pirate_anarchy_desc:0 "The demands of captaining a vessel and organizing work require spacers of many talents. Most importantly, they must be someone willing to rise to the challenge, and then cede power when their time is done. They will not be respected by their crew otherwise."

 # Offworld Steward Captain
 steward_pirate_offworld:0 "$job_steward_pirate_offworld$"
 job_steward_pirate_offworld:0 "Offworld Steward Captain"
 job_steward_pirate_offworld_plural:0 "Offworld Steward Captains"
 job_steward_pirate_offworld_desc:0 "An Offworld Steward Captain acts as an unconventional naval labor advocate, establishing a unique rapport with enterprising spacers. They integrate their networks and illegal gains into the local labor structure, resulting in a prosperous arrangement for the workers involved."

