 ##################
 # Ethics Agendas #
 ##################
 requires_green: "$TRIGGER_FAIL$$civic_tooltip_green$"
 council_agenda_agenda_environmental_stewards_name:0 "Gardien de l'Environnement"
 council_agenda_agenda_environmental_stewards_desc:1 "Il est notre devoir solennel et le plus vital d'assurer la santé des écosystèmes de nos planètes."
 council_agenda_agenda_environmental_stewards_effect:0 "Donne le modificateur §Y$natural_beauty$§!, ou booste la production £job_biologist£ $job_biologist$, sur une colonie."
 agenda_environmental_stewards_finish:0 "$council_agenda_agenda_environmental_stewards_name$ $agenda_ref$"
 agenda_environmental_stewards_finish_desc:0 "$council_agenda_agenda_environmental_stewards_desc$ $agenda_ref$"
 
 decision_enact_environmental_stewards_agenda:0 "$council_agenda_agenda_environmental_stewards_name$ $agenda_ref$"
 decision_enact_environmental_stewards_agenda_desc:0 "$council_agenda_agenda_environmental_stewards_effect$"
 environmental_stewards_agenda_boost:0 "$council_agenda_agenda_environmental_stewards_name$ $agenda_ref$"
 environmental_stewards_agenda_boost_desc:1 "Les politiques récentes de protection écologique ont amélioré les résultats de recherche sur conservation sur cette planète."
 council_agenda_agenda_environmental_stewards_nomad_name:0 "Marcher Léger"
 council_agenda_agenda_environmental_stewards_nomad_desc:1 "Le vide est le plus grand écosystème de tous, et nous sommes ses gardiens. Nous devons être attentifs à nos pas, et marcher légèrement parmi les étoiles."
 
 requires_industrial: "$TRIGGER_FAIL$$civic_tooltip_industrial$"
 council_agenda_agenda_production_goals_name:0 "Optimiser Objectifs de Production"
 council_agenda_agenda_production_goals_desc:1 "Stagner c'est mourir, et ne pas produire c'est se flétrir. Nous devons augmenter notre output de production."
 agenda_production_goals_finish:0 "$council_agenda_agenda_production_goals_name$ $agenda_ref$"
 
 council_agenda_agenda_production_goals_nomads_name:0 "Modèle de Production Mobile"
 council_agenda_agenda_production_goals_nomads_desc:1 "Notre façon de vivre n'est pas soutenue sans ressources significatives. Nous devons améliorer nos rendements de production, ou périr."
 agenda_production_goals_nomads_finish:0 "$council_agenda_agenda_production_goals_nomads_name$ $agenda_ref$"
 
 requires_socialism: "$TRIGGER_FAIL$$civic_tooltip_socialism$"
 council_agenda_agenda_wealth_redistribution_name:0 "Redistribution de Richesse"
 council_agenda_agenda_wealth_redistribution_desc:1 "Il est vital pour notre économie que les programmes sociaux clés restent non seulement bien financés, mais s'étendent dans leur portée."
 agenda_wealth_redistribution_finish:0 "$council_agenda_agenda_wealth_redistribution_name$ $agenda_ref$"
 
 council_agenda_agenda_wealth_redistribution_corp_name:0 "Compagnie Syndicalisée"
 council_agenda_agenda_wealth_redistribution_corp_desc:1 "Dans le cadre de nos efforts coopératifs en cours, il est impératif de fréquemment examiner les contrats syndicaux des employés."
 agenda_wealth_redistribution_corp_finish:0 "$council_agenda_agenda_wealth_redistribution_corp_name$ $agenda_ref$"
 
 requires_capitalism: "$TRIGGER_FAIL$$civic_tooltip_capitalism$"
 council_agenda_agenda_quarterly_budget_review_name:0 "Examen Budgétaire Trimestriel"
 council_agenda_agenda_quarterly_budget_review_desc:1 "Les finances nationales doivent être examinées fréquemment pour réduire la dette et éliminer les dépenses inutiles."
 agenda_quarterly_budget_review_finish:0 "$council_agenda_agenda_quarterly_budget_review_name$ $agenda_ref$"
 council_agenda_agenda_quarterly_budget_review_effects:0 "§GAugmente§! §Y$mod_pop_cat_ruler_bonus_workforce_mult$§! sur notre capitale, mais risque de §Raugmenter§! £crime£ §Y$PLANET_CRIME_TITLE$§!."
 
 council_agenda_agenda_quarterly_budget_review_corp_name:0 "Réunion des Actionnaires"
 council_agenda_agenda_quarterly_budget_review_corp_desc:1 "Afin de maintenir les projections de croissance, nous devons brainstormer pour réduire les coûts de travail et couper les graisses."
 agenda_quarterly_budget_review_corp_finish:0 "$council_agenda_agenda_quarterly_budget_review_corp_name$ $agenda_ref$"
 council_agenda_agenda_quarterly_budget_review_corp_effects:0 "Gagne £trade£$@agenda_a_higher_purpose_unity|Y0$ par $pop_group_unit$ $job_trader_with_icon$, au risque de §Raugmenter§! £crime£ §Y$PLANET_CRIME_TITLE$§!."
 quarterly_budget_review_agenda_boost:0 "Examen Budgétaire Trimestriel"
 quarterly_budget_review_agenda_boost_desc:1 "Examiner le budget national et faire des coupes dans les programmes sociaux a mené à un vent debout pour l'élite locale."
 
