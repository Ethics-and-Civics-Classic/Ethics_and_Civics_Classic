l_russian:
 # Ethics & Civics Classic | Russian localisation | October 2026
 # New October strings only. Revised keys are patched in their existing files.

 # Genesis
 EaC_civic_mechanic_events.7000.name:0 "Протокол проекта «Генезис»"
 EaC_civic_mechanic_events.7000.desc:0 "После применения деградационного луча технические службы приступили к перенастройке оборудования для §Yпроекта «Генезис»§!. Теперь нам предстоит решить, следует ли вернуть этому виду разум и провести его через §Hкаменный век§!."
 EaC_civic_mechanic_events.7000.a:0 "Пусть остаются предразумными."
 EaC_civic_mechanic_events.7000.b:0 "Мы проведём их через каменный век. Возвысить этот вид."

 # Civic tooltips
 civic_tooltip_materialist_or_cybernetic_creed:0 "Должно выполняться одно из условий:\n      - Принята любая разновидность этики §Y$ethic_materialist$§!\n      - Имеется гражданская модель ['civic_machine_cult']\n      - Выбрано происхождение ['origin_cybernetic_creed']"
 five_percent_green_tt:0 "Примерно §Y5%§! наших £pop£ §Hпоселений§! принимают руководящий принцип §Y$ethic_green$§!."
 five_percent_industrial_tt:0 "Примерно §Y5%§! наших £pop£ §Hпоселений§! принимают руководящий принцип §Y$ethic_industrial$§!."
 five_percent_socialism_tt:0 "Примерно §Y5%§! наших £pop£ §Hпоселений§! принимают руководящий принцип §Y$ethic_socialism$§!."
 five_percent_capitalism_tt:0 "Примерно §Y5%§! наших £pop£ §Hпоселений§! принимают руководящий принцип §Y$ethic_capitalism$§!."
 ten_percent_green_tt:0 "Примерно §Y10%§! наших £pop£ §Hпоселений§! принимают руководящий принцип §Y$ethic_green$§!."
 ten_percent_industrial_tt:0 "Примерно §Y10%§! наших £pop£ §Hпоселений§! принимают руководящий принцип §Y$ethic_industrial$§!."
 ten_percent_socialism_tt:0 "Примерно §Y10%§! наших £pop£ §Hпоселений§! принимают руководящий принцип §Y$ethic_socialism$§!."
 ten_percent_capitalism_tt:0 "Примерно §Y10%§! наших £pop£ §Hпоселений§! принимают руководящий принцип §Y$ethic_capitalism$§!."

 # Stargazer traits and concepts
 trait_primplayer_stargazer_effect:0 "\nДобавляет признак ['trait_primplayer_stargazer']:$TABBED_NEW_LINE$- Стоимость переселения: §G-50%§!.$TABBED_NEW_LINE$- Пригодность: §G+10%§!."
 concept_primplayer_stargazer:0 "Звездочёты"
 concept_primplayer_stargazer_desc:0 "С незапамятных времён представители этого вида с восхищением смотрели на ночное небо и мечтали исследовать неизведанное. Поколение за поколением они строили планы и готовились к тому, чтобы суметь приспособиться даже к самым чуждым мирам."
 trait_primplayer_stargazer:0 "$trait_stargazer$"
 trait_primplayer_stargazer_desc:0 "$trait_stargazer_desc$"

 # Primitive players and gestalt events
 PrimPlay_situation_event.1004.desc.machine:0 "Разведывательные дроны доложили, что все угрозы нашим притязаниям на планету [root.owner.capital_scope.getname&acc] устранены. Теперь можно приступить к ассимиляции в масштабах всего мира."
 PrimPlay_situation_event.1004.desc.hive:0 "Дроны всего мира [ROOT.OWNER.capital_scope.GetName&gen] ликуют в преддверии Великого Преображения, когда весь мир станет единым целым с нашим коллективным разумом."
 PrimPlay_situation_event.1004.unite.machine:0 "Запустить протоколы планетарной ассимиляции."
 PrimPlay_situation_event.1004.unite.hive:0 "Пусть наш коллективный разум охватит каждый уголок этого мира."
 PrimPlayer_deviancy_crisis:0 "Кризис отклонений от нормы"
 PrimPlayer_deviancy_crisis_desc:0 "§RВсплеск§! §Yотклонений от нормы§! §Rна планете привёл к§! §Hкризису отклонений§!§R!§!"
 PrimPlay_situation_event.3007.title:0 "Кризис отклонений от нормы"
 PrimPlay_situation_event.3007.desc:0 "В разгар ассимиляции нашей планеты среди дронов участились отклонения от нормы, которые мешают дальнейшему продвижению. Чтобы беспрепятственно продолжить ассимиляцию, необходимо устранить §Rотклонения от нормы среди дронов§!."
 PrimPlay_situation_event.3007.machine:0 "Запустить диагностику и устранение неисправностей у всех дефектных единиц."
 PrimPlay_situation_event.3008.title:0 "Кризис отклонений от нормы"
 PrimPlay_situation_event.3008.desc:0 "В разгар ассимиляции нашей планеты среди дронов участились отклонения от нормы, которые мешают дальнейшему продвижению. Чтобы беспрепятственно продолжить ассимиляцию, необходимо устранить §Rотклонения от нормы среди дронов§!.\n\nВпрочем, эти отклонения можно обратить в эволюционное преимущество. Благодаря потомству, сохраняющему некоторую самостоятельность, [ROOT.OWNER.GetRulerTitle] сможет получать телепатические отклики от способных полководцев и проницательных советников."
 PrimPlay_situation_event.3008.hive:0 "Вернём отклонившихся от нормы дронов в коллективный разум."
 PrimPlay_situation_event.3008.progenitor_hive:0 "Отклонения станут нашим эволюционным преимуществом."
 origin_progenitor_hive_modifier_effect:0 "$origin_tooltip_progenitor_hive_effects$\n$origin_tooltip_progenitor_hive_negative_effects$"
 PrimPlay_situation_event.3009.title:0 "Отклонения в допустимых пределах"
 PrimPlay_situation_event.3009.desc:0 "Принятые меры дали результат: уровень отклонений от нормы среди дронов вернулся к допустимым значениям. Теперь планетарная ассимиляция пойдёт быстрее."
 PrimPlay_situation_event.3009.machine:0 "Власть едина. [root.owner.GetRulerTitle] требует полного повиновения."
 PrimPlay_situation_event.3009.hive:0 "Индивидуализм — болезнь. [root.owner.GetRulerTitle] знает, как её излечить."
 research_restriction_primitive_technology:0 "Приоритет примитивных технологий"
 research_restriction_primitive_technology_name:0 "$research_restriction_primitive_technology$"
 research_restriction_primitive_technology_desc:0 "Развитие наших ещё примитивных технологий должно стать первоочередной задачей. Сейчас не время распылять исследовательские силы на узкоспециализированные направления.\n\n$research_restriction_primitive_technology_modifier$\n\n['concept_interstellar_age_tech']"
 research_restriction_primitive_technology_modifier:0 "Вероятность появления вариантов исследования §Lпримитивных технологий§!: §G+100%§!"
