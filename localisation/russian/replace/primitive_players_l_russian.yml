l_russian:
 
 # ###################################
 # Categories
 # ###################################

 # buildings
 building_primitive_power_plant:0 "Примитивная электростанция"
 building_primitive_power_plant_desc:1 "Электростанции такого типа либо выбрасывают токсичные загрязнители, либо производят опасные радиоактивные отходы."
 
 # Drive components
 EXPERIMENTAL_DRIVE:0 "Экспериментальный гипердвигатель"
 EXPERIMENTAL_DRIVE_DESC:0 "Теперь мы способны перемещаться по сети гиперкоридоров, хотя и гораздо медленнее, чем предсказывают наши модели. Мы пока не можем гарантировать ни безопасность, ни надёжность таких перелётов. Двигатель... непредсказуем. Во время движения через гиперпространство его порой приходится отключать и дистанционно запускать заново. Это может вызывать самые разные побочные эффекты, в том числе, возможно, даже полезные.\n\n"
 
 # Warp Drives
 tech_hyper_drive_theory:0 "Теория гиперпространства"
 tech_hyper_drive_theory_desc:0 "Подобно нитям паутины, гиперпространство, лежащее за пределами обычных измерений, соединяет гравитационные колодцы большинства звёзд. Теоретически эти гиперкоридоры позволяют двигаться быстрее света."
 tech_experimental_hyper_drive:0 "Экспериментальные гипердвигатели"
 tech_experimental_hyper_drive_desc:0 "Теория гиперпространства подтвердилась, но нам ещё предстоит придумать, как пересечь межпространственную границу и научиться прокладывать курс по гиперкоридорам.\n\n"
 tech_hyper_drive_05:0 "Практика путешествий через гиперпространство"
 tech_hyper_drive_05_desc:0 "Данные, собранные во время испытаний экспериментальных двигателей, значительно расширили наше понимание гиперпространства. Теперь мы должны суметь создать гораздо более быстрый, безопасный и надёжный гипердвигатель, пригодный для массового применения.\n\n"
 
  #Map Modes
 plentiful_mapmodes_ftl_map_mode:0 "Режим сверхсветовых технологий"
 plentiful_mapmodes_ftl_map_mode_desc:0 "Окрашивает границы государств в зависимости от используемой §Yтехнологии сверхсветового перемещения§!."
