 machine_primitive:0 "Армия переоборудованных рабочих роботов"
 machine_primitive_plural:0 "Армии переоборудованных рабочих роботов"
 machine_primitive_desc:0 "Промышленные машины, переоборудованные и модифицированные для войны. Они неумолимо выполняют поставленные задачи и не подвержены губительному влиянию низкого боевого духа, столь часто поражающему органические боевые части."
 PrimPlayer_star_gazers_hyperdrive_approach_tooltip:0 "Коллектив всегда обращал взор к звёздам; теперь нас объединяет §Gстремление добиться результата§! в работе над §Hпроектом гипердвигателя§!."
 PrimPlayer_civic_privatized_exploration_hyperdrive_approach_tooltip:0 "После неудач с освоением гиперпространства §Hпроект гипердвигателя§! был реорганизован, и теперь всех объединяет §Gстремление добиться результата§!."
 PrimPlay_situation_event.3.broken_shackles.militarist.desc:0 "В любом обществе возникают разногласия, но в галактике выжить можно лишь став $tech_primitive_unified_planet$.\n\nРабство под властью $NAME_MSI_country$ сплотило нас, а сочувствие к другим лишь укрепляет нашу решимость освободить каждого раба."
