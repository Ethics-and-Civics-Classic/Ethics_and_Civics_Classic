 ### Russian localisation sync for Stellaris 4.5
 tech_primitive_arkship_desc:0 "С открытия кораблей-ковчегов минули эпохи. Но из-за ревнивых хранителей знаний, мелочной алчности или просто превратностей времени секреты их строительства были утрачены; археологи называют такие знания §ELosTech§!."
 tech_primitive_arkship_tooltip_desc:0 "С открытия кораблей-ковчегов минули эпохи. Но из-за ревнивых хранителей знаний, мелочной алчности или просто превратностей времени секреты их строительства были утрачены; археологи называют такие знания §ELosTech§!."
 tech_primitive_ring_world_desc:0 "С открытия миров-колец минули эпохи. Но из-за ревнивых хранителей знаний, мелочной алчности или просто превратностей времени секреты их строительства были утрачены; археологи называют такие знания §ELosTech§!."
 tech_primitive_ring_world_tooltip_desc:0 "С открытия миров-колец минули эпохи. Но из-за ревнивых хранителей знаний, мелочной алчности или просто превратностей времени секреты их строительства были утрачены; археологи называют такие знания §ELosTech§!."
 tech_primitive_habitat_desc:0 "С открытия орбитальных поселений минули эпохи. Но из-за ревнивых хранителей знаний, мелочной алчности или просто превратностей времени секреты их строительства были утрачены; археологи называют такие знания §ELosTech§!."
 tech_primitive_habitat_tooltip_desc:0 "С открытия орбитальных поселений минули эпохи. Но из-за ревнивых хранителей знаний, мелочной алчности или просто превратностей времени секреты их строительства были утрачены; археологи называют такие знания §ELosTech§!."
 tech_primitive_artificial_desc:0 "С открытия искусственных миров минули эпохи. Но из-за ревнивых хранителей знаний, мелочной алчности или просто превратностей времени секреты их строительства были утрачены; археологи называют такие знания §ELosTech§!."
 tech_primitive_artificial_tooltip_desc:0 "С открытия искусственных миров минули эпохи. Но из-за ревнивых хранителей знаний, мелочной алчности или просто превратностей времени секреты их строительства были утрачены; археологи называют такие знания §ELosTech§!."
 primitive_arkship_planet_modifier_desc:0 "['concept_pc_ark'] §Gувеличен§! на £planet£ §Y3§!\n\nДревний корабль-ковчег, построенный много эпох назад и ставший прародиной нашего народа. За бесчисленные поколения до нас дошла лишь малая доля его технологий, и само судно превратилось в реликт ушедшей эпохи.\n\nСовременным археологам ещё многое предстоит узнать из разрозненных схем §ELosTech§!, сохранившихся в этом §Hреликтовом корабле-ковчеге§!. Поэтому новые §Yместа археологических раскопок§! здесь обнаруживаются довольно часто."
 primitive_ring_world_planet_modifier_desc:0 "Этот древний мир-кольцо был расколот много эпох назад и стал прародиной нашего народа. За бесчисленные поколения до нас дошла лишь малая доля его технологий, и само кольцо превратилось в реликт ушедшей эпохи.\n\nСовременным археологам ещё многое предстоит узнать из разрозненных схем §ELosTech§!, сохранившихся в этом §Hреликтовом мире-кольце§!. Поэтому новые §Yместа археологических раскопок§! здесь обнаруживаются довольно часто."
 primitive_habitat_planet_modifier_desc:0 "Древнее орбитальное поселение, построенное много эпох назад и ставшее прародиной нашего народа. За бесчисленные поколения до нас дошла лишь малая доля его технологий, и само поселение превратилось в реликт ушедшей эпохи.\n\nСовременным археологам ещё многое предстоит узнать из разрозненных схем §ELosTech§!, сохранившихся в этом §Hреликтовом орбитальном поселении§!. Поэтому новые §Yместа археологических раскопок§! здесь обнаруживаются довольно часто."
 primitive_artificial_planet_modifier_desc:0 "Древний искусственный мир, созданный много эпох назад и ставший прародиной нашего народа. За бесчисленные поколения до нас дошла лишь малая доля его технологий, и сам мир превратился в реликт ушедшей эпохи.\n\nСовременным археологам ещё многое предстоит узнать из разрозненных схем §ELosTech§!, сохранившихся в этом §Hреликтовом искусственном мире§!. Поэтому новые §Yместа археологических раскопок§! здесь обнаруживаются довольно часто."
 PrimPlay_situation_event.1101.desc:0 "Сверхсветовой двигатель древнего корабля-ковчега умолк. Он больше не гудит от безграничной энергии, и наши инженеры полагают, что это молчание продлится почти §Yпять лет§!.\n\nТем временем жители [fleet.GetName] готовятся надолго обосноваться в новой системе [fleet.solar_system.GetName]."
 PrimPlay_situation_event.1101.a:0 "Наш дом. Пока что."
 PrimPlay_situation_event.1102.desc:0 "Сверхсветовой двигатель древнего корабля-ковчега вновь отзывается гулом энергии, и судно мгновенно переносится в соседнюю систему вместе со всей нашей цивилизацией, целой и невредимой.\n\nУчёные установили, что §Yповреждённому сверхсветовому двигателю§! понадобится не менее §Yпяти лет§!, чтобы накопить достаточно энергии для новой попытки перехода."
 ANCIENT_FISSION_REACTOR_DESC:0 "С открытия ядерного деления минули эпохи. Но из-за ревнивых хранителей знаний, мелочной алчности или просто превратностей времени искусство строительства новых ядерных реакторов было утрачено. Теперь секреты ядерного огня относят к §ELosTech§!."
 ANCIENT_SHIP_THRUSTER_0_DESC:0 "Секреты вещества, питающего эти исполинские двигатели, были утрачены и теперь относятся к §ELosTech§!. Столетиями нам приходилось полагаться на скудеющие остатки запасов и вести корабль в тонком танце орбитальной механики."
 nations.6.militarist:0 "Наша военная мощь положит конец всем разногласиям."
 nations.6.materialist:0 "Благоразумие поможет нам приспособиться к грядущему."
 nations.8.gestalt:0 "Пусть сомнения исчезнут: отныне мы едины разумом."
