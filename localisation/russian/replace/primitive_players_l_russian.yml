 job_ancient_nuclear_technician_plural:0 "Археоядерные техники"
 job_ancient_nuclear_technician_desc:0 "Эти техники больше напоминают историков: они поддерживают древний ядерный реактор в сердце реликтового корабля-ковчега, от которого зависит работа систем жизнеобеспечения."
