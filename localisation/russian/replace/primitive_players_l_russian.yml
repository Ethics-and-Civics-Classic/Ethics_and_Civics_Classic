 d_ship_debris_lost_colony_blocker_desc:0 "$d_ship_debris_lost_colony_blocker_buildings$\n\nОбломки колониального корабля покрывают огромную территорию и мешают развитию планеты."
 concept_d_ship_debris_lost_colony_blocker:0 "$d_ship_debris_lost_colony_blocker$"
 concept_d_ship_debris_lost_colony_blocker_desc:0 "$d_ship_debris_lost_colony_blocker_desc$"
 d_ship_debris_lost_colony_blocker_buildings:0 "§YПозволяет строить:§!\n §W-§! £building£ ['building:building_low_tech_power_plant', «$building_low_tech_power_plant$»]\n §W-§! £building£ ['building:building_low_tech_scrap_refinery', «$building_low_tech_scrap_refinery$»]"
 building_lost_colony_tech_scrap_refinery_desc:0 "В наскоро сооружённых цехах рабочие трудятся в поте лица, превращая корабельный утиль в ценные материалы."
 building_lost_colony_power_plant_desc:0 "Техники обслуживают сложную сеть солнечных батарей, уцелевших после крушения."
 concept_lost_colony_digsite:0 "$lost_colony_digsite$"
 concept_lost_colony_digsite_desc:0 "§L$lost_colony_digsite_desc$§!"
 lost_colony_digsite:0 "Разбившийся колониальный корабль"
 lost_colony_digsite_desc:0 "Бортовой самописец из командного отсека нашего старого колониального корабля должен помочь установить местонахождение родного мира."
 primitive_origin.151.name:0 "$origin_lost_colony$"
 primitive_origin.151.desc.early_space_age:0 "§Y[Root.GetName]§! — государство, основанное выходцами с планеты §Y«[Root.GetHomeWorldName]»§!, которые преодолели тяготы дальнего перелёта и сумели колонизировать соседнюю систему. Их предки были §Hэнергичными исследователями§! и рано освоили межзвёздные путешествия. Но за этот прорыв пришлось заплатить отставанием в других областях науки. Без необходимых технологий мы не можем связаться с родным миром.\n\nХуже того, из-за §Rкатастрофического сбоя§! в §Yподпространственных двигателях§! части корабля вышли из подпространства вразнобой. Командный отсек отделился от колониального спускаемого аппарата, оставив многих инженеров и учёных без систем жизнеобеспечения. Уцелевшие [Root.GetSpeciesNamePlural] достигли поверхности на спускаемом аппарате. Нам предстоит долгий путь, прежде чем наука и промышленность снова позволят нам выйти к звёздам."
 primitive_origin.151.likes_home:0 "Мы стремимся восстановить связь с родным миром."
 primitive_origin.151.neutral:0 "Наша колония будет процветать и без родного мира."
 primitive_origin.151.hates_home:0 "Как хорошо, что родной мир остался позади."
