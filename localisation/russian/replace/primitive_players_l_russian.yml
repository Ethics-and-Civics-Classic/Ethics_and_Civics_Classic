 decision_primplayer_unified_planet_tooltip:0 "£society£['tech_primitive_unified_planet'] (после завершения ситуации)"
 nations.8.desc:0 "После долгой и беспощадной борьбы за независимость войска [Owner.GetName&gen] наконец освободили [ROOT.GetName&acc]. Победа за нами!"
 random_primitive_events.2.desc.home_nuked_planet:0 "[Root.Leader.GetName] обнаруживает пригодный для колонизации мир! На родине уже кипят споры о том, когда первые колонисты ступят на [FROM.GetName&acc]."
 random_primitive_events.2.desc.nuked_planet:0 "[Root.Leader.GetName] обнаруживает опустошённый мир, который считался совершенно непригодным для жизни. Однако дальнейшие исследования неожиданно показывают, что жизнь здесь всё же возможна — пусть и на самом пределе. Остаётся один вопрос... захочет ли кто-нибудь поселиться на этом мире-могиле?"
 random_primitive_events.2.option.home_nuked_planet:0 "Даже мир-могила может стать домом."
 random_primitive_events.2.option.nuked_planet:0 "Когда-то дом, теперь лишь могила."
 NAME_PrimPlayer_Grazing_Tiyanki:0 "$NAME_Grazing_Tiyanki$"
 PrimPlay_situation_event.1004.desc.machine:0 "Разведывательные дроны докладывают: [root.owner.capital_scope.getname] полностью под нашим контролем, все угрозы устранены. Теперь можно приступить к ассимиляции в планетарном масштабе."
 PrimPlay_situation_event.1004.desc.hive:0 "Наших трутней охватило воодушевление перед Великим преображением. Планета «[ROOT.OWNER.capital_scope.GetName]» вот-вот станет единым целым с нашим коллективным разумом."
 PrimPlay_situation_event.1004.unite.machine:0 "Запустить протоколы планетарной ассимиляции."
 PrimPlay_situation_event.1004.unite.hive:0 "Пусть наш разум охватит каждый уголок этого мира."
 random_primitive_events.212.desc_fractured:0 "После долгих лет тщательного планирования, огромных расходов и упорной работы нам удалось терраформировать [FROM.GetName&acc] в §Y$pc_continental$§!.\n\nВсе [Root.GetSpeciesNamePlural] на [Root.Capital.GetName&prep] ликуют: [FROM.GetName] станет их новым домом. Однако одно из государств добровольно предложило перенести в новую колонию свою столицу вместе с населением.\n\nКак нам поступить?"
 random_primitive_events.214.desc_fractured:0 "После долгих лет тщательного планирования, огромных расходов и упорной работы нам удалось терраформировать [FROM.GetName&acc] в §Y$pc_ocean$§!.\n\nВсе [Root.GetSpeciesNamePlural] на [Root.Capital.GetName&prep] ликуют: [FROM.GetName] станет их новым домом. Однако одно из государств добровольно предложило перенести в новую колонию свою столицу вместе с населением.\n\nКак нам поступить?"
 random_primitive_events.214.b:0 "Пусть другое государство колонизирует [FROM.GetName&acc] и покинет [root.capital_scope.GetName&acc]."
 random_primitive_events.214.b.tooltip:0 "Поселенцы из [This.GetName&gen] §Yколонизируют§! [FROM.GetName&acc] и §Gпокинут§! нашу £planet£ §Hстолицу§!"
 random_primitive_events.217.desc_fractured:0 "После долгих лет тщательного планирования, огромных расходов и кропотливой очистки от токсичных частиц нам удалось терраформировать [FROM.GetName&acc] в §Y$pc_continental$§!.\n\nВсе [Root.GetSpeciesNamePlural] на [Root.Capital.GetName&prep] ликуют: [FROM.GetName] станет их новым домом. Однако одно из государств добровольно предложило перенести в новую колонию свою столицу вместе с населением.\n\nКак нам поступить?"
 random_primitive_events.255.desc:0 "Землетрясения, терзавшие [From.From.GetName&acc], оказались следствием проходческих работ ранее неизвестной местной подземной цивилизации! Они прорвались на поверхность, и из туннелей хлынули огромные армии, вооружённые примитивным, но смертоносным стрелковым оружием. Их авангард уже атакует наши поселения. Силы безопасности вступили в бой, но нам могут понадобиться подкрепления!"
 random_primitive_events.260.desc.subterranean:0 "Обитающие в магме пришельцы на [Root.GetName&prep] собрали достаточно сил, чтобы начать новое вторжение в наши пещеры! Их обезумевшие армии вновь хлынули из свежевырытых туннелей и бросают нам вызов."
 random_primitive_events.265.name:0 "Экспансия: [Root.Owner.GetSubMantleUpper]"
 random_primitive_events.4.tooltip:0 "§YРанний химический корабль§! будет улучшен до §Yисследовательского судна§!."
 building_generator_generic_primitive:0 "Площадки солнечной энергетики"
 mod_planet_miners_primitive_uranium_produces_add:0 "£primitive_uranium£ за каждые 100 £job_miner£ $job_miner_plural$"
 planet_primitive_researcher_2_primitive_uranium_produces_add:0 "£primitive_uranium£ за каждые 100 £primitive_researcher_2£ $job_primitive_researcher_2$"
 mod_country_primitive_uranium_produces_mult:0 "Производство £primitive_uranium£ §H$primitive_uranium$§!"
 mod_country_base_primitive_uranium_produces_add:0 "Производство £primitive_uranium£ §H$primitive_uranium$§! в государстве"
 mod_job_nuclear_technician_add:0 "Должности $job_nuclear_technician$"
 job_ancient_nuclear_technician:0 "Археоядерный техник"
 job_ancient_nuclear_technician_plural:0 "Археоядерные техники"
 job_ancient_nuclear_technician_desc:0 "Эти техники больше напоминают историков: они поддерживают древний ядерный реактор в сердце реликтового корабля-ковчега, от которого зависит работа систем жизнеобеспечения."
 mod_job_ancient_nuclear_technician_add:0 "Должности $job_ancient_nuclear_technician$"
 mod_job_primitive_machine_calculator_add:0 "Должности примитивных вычислителей"
 machine_primitive:0 "Армия переоборудованных рабочих роботов"
 machine_primitive_plural:0 "Армии переоборудованных рабочих роботов"
 machine_primitive_desc:0 "Промышленные машины, переоборудованные и модифицированные для войны. Они неумолимо выполняют поставленные задачи и не подвержены губительному влиянию низкого боевого духа, столь часто поражающему органические боевые части."
 origin_primitive_player_early_space_age_nomad_desc:0 "$CHALLENGING_ORIGIN$\nЭта цивилизация вновь вступила в раннюю космическую эпоху. Её предки освоили космические перелёты ещё в глубокой древности. С тех пор бесчисленные поколения прожили на одном корабле-ковчеге. До наших дней дошла лишь малая часть знаний о его технологиях, и сам ковчег стал реликтом ушедшей эпохи."
 trait_primplayer_stargazer:0 "$trait_stargazer$"
 trait_primplayer_stargazer_desc:0 "$trait_stargazer_desc$"
 PrimPlayer_star_gazers_hyperdrive_approach_tooltip:0 "Коллектив всегда обращал взор к звёздам; теперь нас объединяет §Gстремление добиться результата§! в работе над §Hпроектом гипердвигателя§!."
 PrimPlayer_civic_privatized_exploration_hyperdrive_approach_tooltip:0 "После неудач с освоением гиперпространства §Hпроект гипердвигателя§! был реорганизован, и теперь всех объединяет §Gстремление добиться результата§!."
 PrimPlayer_deviancy_crisis:0 "Кризис отклонений"
 PrimPlayer_deviancy_crisis_desc:0 "§RНа планете§! §Yотклонения от нормы§! §Rпривели к§! §Hкризису§!§R!§!"
 PrimPlay_situation_event.3.broken_shackles.militarist.desc:0 "В любом обществе возникают разногласия, но в галактике выжить можно лишь став $tech_primitive_unified_planet$.\n\nРабство под властью $NAME_MSI_country$ сплотило нас, а сочувствие к другим лишь укрепляет нашу решимость освободить каждого раба."
 PrimPlay_situation_event.3.broken_shackles.militarist:0 "Наш народ объединяется как §YСокрушитель оков§!!"
 PrimPlay_situation_event.3006.a:0 "С сепаратистским движением пока покончено."
 PrimPlay_situation_event.3007.title:0 "Кризис отклонений"
 PrimPlay_situation_event.3007.desc:0 "Ассимиляцию нашего мира тормозит рост числа отклонений от нормы. Необходимо обуздать §Rотклонившихся дронов§!, чтобы продолжить ассимиляцию без помех."
 PrimPlay_situation_event.3007.machine:0 "Запустить протоколы устранения неисправностей во всех дефектных единицах."
 PrimPlay_situation_event.3008.title:0 "Кризис отклонений"
 PrimPlay_situation_event.3008.desc:0 "Ассимиляцию нашего мира тормозит рост числа отклонений от нормы. Необходимо обуздать §Rотклонившихся дронов§!, чтобы продолжить ассимиляцию без помех.\n\nОднако эти отклонения могут стать нашим эволюционным преимуществом. Если у нас появятся частично автономные отпрыски, носитель титула «[ROOT.OWNER.GetRulerTitle]» сможет получать по телепатической связи сведения от способных полководцев и проницательных советников."
 PrimPlay_situation_event.3008.hive:0 "Мы вернём отклонившихся дронов в коллективный разум."
 PrimPlay_situation_event.3008.progenitor_hive:0 "Отклонения от нормы станут нашим эволюционным преимуществом."
 origin_progenitor_hive_modifier_effect:0 "$origin_tooltip_progenitor_hive_effects$\n$origin_tooltip_progenitor_hive_negative_effects$"
 PrimPlay_situation_event.3009.title:0 "Уровень отклонений в пределах нормы"
 PrimPlay_situation_event.3009.desc:0 "Протоколы устранения отклонений успешно выполнены. Уровень отклонений от нормы среди дронов вернулся в допустимые пределы, что позволяет ускорить планетарную ассимиляцию."
 PrimPlay_situation_event.3009.machine:0 "Источник приказов для всех единиц — [root.owner.GetRulerTitle]."
