 tech_primitive_historical_archives_desc:0 "Эта огромная библиотека служит важнейшим хранилищем наших научных и культурных знаний. Здесь хранятся саги о правителях, записи об урожаях и путешествиях, карты и великие труды."
 tech_proto_thrusters_1_desc:0 "С гравитацией не совладать силой. Но точные расчёты позволяют использовать притяжение ближайших небесных тел как гравитационную пращу и отправлять небольшие аппараты далеко за пределы родной системы."
