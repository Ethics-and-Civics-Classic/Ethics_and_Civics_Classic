 PrimPlayer_civic_lost_colony_effect:0 "\n\n£planet£ §YСтартовая колония§! §Gне разделена§! на §Pразрозненные государства§! и начинает игру с сооружением £building£ ['building:building_colony_shelter', «$building_colony_shelter$»]."
