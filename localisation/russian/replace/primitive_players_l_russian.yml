 PrimPlay_situation_event.1005.title:0 "Международная космическая инициатива"
 PrimPlay_situation_event.1005.desc:0 "С началом космической гонки государства [owner.capital_scope.GetName&gen] объединили усилия для разработки технологии §Y«$tech_terrestrial_sculpting$»§!. Мы гарантированно получим возможность её исследовать, но то же преимущество достанется нашим соперникам.\n\nВпрочем, мы можем посеять взаимное недоверие и сорвать это международное сотрудничество..."
 PrimPlay_situation_event.1005.yes:0 "Да, поддержим международную исследовательскую группу!"
 PrimPlay_situation_event.1005.no:0 "Дискредитировать инициативу. Мы должны основать колонию первыми."
 PrimPlay_situation_event.1006.title:0 "Технология «$tech_terrestrial_sculpting$» изучена!"
 PrimPlay_situation_event.1006.tooltip:0 "Технология §Y«$tech_terrestrial_sculpting$»§! будет изучена через §Pнесколько лет§!.\n\n"
 PrimPlay_situation_event.1006.tooltip.long:0 "Технология §Y«$tech_terrestrial_sculpting$»§! будет изучена не раньше чем через §Gдесять лет§!.\n\n"
 PrimPlayer_terraform_situation_race:0 "Космическая гонка"
 PrimPlayer_terraform_situation_race_desc:0 "Началась космическая гонка: государства стремятся первыми превратить эту безжизненную планету в пригодный для жизни мир и основать на ней колонию."
 PrimPlayer_terraform_situation_race_type:0 "Космическая гонка"
 PrimPlayer_terraform_frozen_situation_race:0 "Космическая гонка"
 PrimPlayer_terraform_frozen_situation_race_desc:0 "Началась космическая гонка: государства стремятся первыми растопить льды этой планеты, создать на ней жизнеспособную экосистему и основать колонию."
 PrimPlayer_terraform_frozen_situation_race_type:0 "Космическая гонка"
 PrimPlayer_terraform_toxic_situation_race:0 "Космическая гонка"
 PrimPlayer_terraform_toxic_situation_race_desc:0 "Началась космическая гонка: государства стремятся первыми очистить токсичную планету, превратить её в мир класса «$pc_continental$» и основать на ней колонию."
 PrimPlayer_terraform_toxic_situation_race_type:0 "Космическая гонка"
 PrimPlayer_terraform_situation_approach_impede:0 "Замедлять прогресс соперников"
 PrimPlayer_terraform_situation_approach_passive:0 "Не вмешиваться"
 nations.1003.title:0 "Обнаружен скрытый гиперкоридор!"
 nations.1003.desc:0 "Наши ксенологи проследили за передвижениями тиянки, покидавших нашу систему. Специальные маячки позволили восстановить маршрут этих мирно пасущихся существ. Судя по всему, за пределами исследованного пространства находится своего рода вход в сеть межзвёздных путей.\n\nОткрытие взбудоражило научное сообщество: овладев нужными технологиями, мы сможем покинуть родную систему. Однако скептики опасаются, что этот путь откроется и для незваных гостей..."
 nations.1003.hide:0 "Засекретить открытие. Нам лучше оставаться незамеченными."
 nations.1003.reveal:0 "Нанести гиперкоридор на карты. Здравствуй, галактика!"
 nations.14274.desc.tech_alien_life_studies:0 "Узнав, что мы освоили технологию §Y«$tech_alien_life_studies$»§!, посланники §H[FROM.GetName&gen]§! попросили поделиться результатами исследований и помочь в подготовке их учёных.\n\nНаши исследователи сомневаются: такая программа отвлечёт ресурсы от собственных приоритетов.\n\nОтказ почти наверняка вызовет недовольство в [From.GetName&prep]."
 nations.14274.desc.tech_terrestrial_sculpting:0 "Увидев нашу запатентованную §Hтехнологию терраформирования§! в действии, учёные §H[FROM.GetName&gen]§! попросили поделиться методами преобразования планет.\n\nНаши политические советники настаивают на отказе: получив эти знания, соседи смогут колонизировать миры, пригодные для терраформирования.\n\nОднако [From.GetRulerName] наверняка сочтёт отказ личным оскорблением."
 nations.18274.desc.tech_lasers_1:0 "Увидев §Hсовременное оружие§! наших сил безопасности, несколько генералов §H[FROM.GetName&gen]§! попросили поделиться частью наших военных технологий.\n\nНаши офицеры сомневаются, стоит ли это делать: если когда-нибудь дело дойдёт до войны, победить материалистическое государство станет заметно труднее.\n\nОднако [From.GetRulerName] наверняка сочтёт отказ личным оскорблением."
 nations.18274.desc.tech_terrestrial_sculpting:0 "Увидев нашу запатентованную §Hтехнологию терраформирования§! в действии, учёные §H[FROM.GetName&gen]§! попросили поделиться методами преобразования планет.\n\nНаши политические советники настаивают на отказе: получив эти знания, соседи смогут колонизировать миры, пригодные для терраформирования.\n\nОднако [From.GetRulerName] наверняка сочтёт отказ личным оскорблением."
 nations.19274.desc.tech_frontier_health:0 "Узнав, что мы освоили технологию §H«$tech_frontier_health$»§!, посланники §H[FROM.GetName&gen]§! попросили поделиться нашими медицинскими разработками.\n\nНаши учёные сомневаются: это отвлечёт финансирование от собственных исследовательских приоритетов.\n\nОднако [From.GetRulerName] сочтёт отказ пренебрежением к тем, кто нуждается в помощи, и наши отношения ухудшатся."
 nations.19274.desc.tech_terrestrial_sculpting:0 "Увидев нашу запатентованную §Hтехнологию терраформирования§! в действии, учёные §H[FROM.GetName&gen]§! попросили поделиться методами преобразования планет.\n\nНаши политические советники настаивают на отказе: получив эти знания, соседи смогут колонизировать миры, пригодные для терраформирования.\n\nОднако [From.GetRulerName] наверняка сочтёт отказ личным оскорблением."
 nations.20274.desc.tech_robotic_workers:0 "Узнав, что мы освоили технологию §Y«$tech_robotic_workers$»§!, представители §H[FROM.GetName&gen]§! попросили поделиться нашими разработками в области робототехники.\n\nНаши учёные сомневаются: у этих технологий есть военное применение. Если когда-нибудь дело дойдёт до войны, победить индустриалистское государство станет заметно сложнее...\n\nОднако отказ вызовет недовольство руководства промышленности: [From.GetRulerName] наверняка сочтёт его личным оскорблением."
 nations.20274.desc.tech_terrestrial_sculpting:0 "Увидев нашу запатентованную §Hтехнологию терраформирования§! в действии, учёные §H[FROM.GetName&gen]§! попросили поделиться методами преобразования планет.\n\nНаши политические советники настаивают на отказе: получив эти знания, соседи смогут колонизировать миры, пригодные для терраформирования.\n\nОднако [From.GetRulerName] наверняка сочтёт отказ личным оскорблением."
