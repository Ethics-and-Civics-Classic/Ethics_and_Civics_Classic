 PrimPlay_situation_event.3007.desc:0 "Ассимиляцию нашего мира тормозит рост числа отклонений от нормы. Необходимо обуздать §Rотклонившихся дронов§!, чтобы продолжить ассимиляцию без помех."
 PrimPlay_situation_event.3007.machine:0 "Запустить протоколы устранения неисправностей во всех дефектных единицах."
 PrimPlay_situation_event.3008.desc:0 "Ассимиляцию нашего мира тормозит рост числа отклонений от нормы. Необходимо обуздать §Rотклонившихся дронов§!, чтобы продолжить ассимиляцию без помех.\n\nОднако эти отклонения могут стать нашим эволюционным преимуществом. Если у нас появятся частично автономные отпрыски, [ROOT.OWNER.GetRulerTitle] сможет получать по телепатической связи сведения от способных полководцев и проницательных советников."
 PrimPlay_situation_event.3008.hive:0 "Мы вернём отклонившихся дронов в коллективный разум."
 PrimPlay_situation_event.3008.progenitor_hive:0 "Отклонения от нормы станут нашим эволюционным преимуществом."
 PrimPlay_situation_event.3009.desc:0 "Протоколы устранения отклонений успешно выполнены. Уровень отклонений от нормы среди дронов вернулся в допустимые пределы, что позволяет ускорить планетарную ассимиляцию."
 PrimPlay_situation_event.3009.machine:0 "Источник приказов для всех единиц — [root.owner.GetRulerTitle]."
 PrimPlay_situation_event.3009.hive:0 "Индивидуализм — болезнь. [root.owner.GetRulerTitle] — наше исцеление."
