 # ###################################
 # Categories
 # ###################################

 # buildings
 building_primitive_power_plant:0 "Примитивная электростанция"
 building_primitive_power_plant_desc:1 "Электростанции такого типа либо выбрасывают токсичные загрязнители, либо производят опасные радиоактивные отходы."
 
 # Drive components
 EXPERIMENTAL_DRIVE:0 "Экспериментальный гипердвигатель"
 EXPERIMENTAL_DRIVE_DESC:0 "Теперь мы способны перемещаться по сети гиперкоридоров, хотя и гораздо медленнее, чем предсказывают наши модели. Мы пока не можем гарантировать ни безопасность, ни надёжность таких перелётов. Двигатель... непредсказуем. Во время движения через гиперпространство его порой приходится отключать и дистанционно запускать заново. Это может вызывать самые разные побочные эффекты, в том числе, возможно, даже полезные.\n\n"
 
 # Warp Drives
 tech_hyper_drive_theory:0 "Теория гиперпространства"
 tech_hyper_drive_theory_desc:0 "Подобно нитям паутины, гиперпространство, лежащее за пределами обычных измерений, соединяет гравитационные колодцы большинства звёзд. Теоретически эти гиперкоридоры позволяют двигаться быстрее света."
 tech_experimental_hyper_drive:0 "Экспериментальные гипердвигатели"
 tech_experimental_hyper_drive_desc:0 "Теория гиперпространства подтвердилась, но нам ещё предстоит придумать, как пересечь межпространственную границу и научиться прокладывать курс по гиперкоридорам.\n\n"
 tech_hyper_drive_05:0 "Практика путешествий через гиперпространство"
 tech_hyper_drive_05_desc:0 "Данные, собранные во время испытаний экспериментальных двигателей, значительно расширили наше понимание гиперпространства. Теперь мы должны суметь создать гораздо более быстрый, безопасный и надёжный гипердвигатель, пригодный для массового применения.\n\n"
 
  #Map Modes
 plentiful_mapmodes_ftl_map_mode:0 "Режим сверхсветовых технологий"
 plentiful_mapmodes_ftl_map_mode_desc:0 "Окрашивает границы государств в зависимости от используемой §Yтехнологии сверхсветового перемещения§!."
 HAS_HYPER_DRIVE_1:0 "§Y[This.GetName]§! располагает технологией §Y«$HYPER_DRIVE_1$»§!."
 HAS_HYPER_DRIVE_2:0 "§Y[This.GetName]§! располагает технологией §Y«$HYPER_DRIVE_2$»§!."
 HAS_HYPER_DRIVE_3:0 "§Y[This.GetName]§! располагает технологией §Y«$HYPER_DRIVE_3$»§!."
 HAS_JUMP_DRIVE:0 "§Y[This.GetName]§! располагает технологией §Y«$JUMP_DRIVE_1$»§!."
 HAS_PSI_DRIVE:0 "§Y[This.GetName]§! располагает технологией §Y«$PSI_JUMP_DRIVE_1$»§!."
 HAS_NO_DRIVE:0 "§Y[This.GetName]§! не располагает технологиями сверхсветового перемещения."


 # Stage 19.10 exhaustive coverage patch — source: localisation/primitive_players_l_english.yml
 PrimPlayer_pirate_station:0 "Пиратское убежище"
 PrimPlayer_pirate_station_plural:0 "Пиратские убежища"
 policy_energy_resource_policy:0 "Источник энергии"
 policy_energy_resource_policy_desc:0 "Эта политика определяет, какие источники энергии используют техники нашей державы."
 energy_resource_policy_dark_matter:0 "Энергия тёмной материи"
 energy_resource_policy_dark_matter_desc:0 "Загадочная тёмная материя может стать неисчерпаемым источником энергии.\n\nВместо §Yтехников§! работают £sr_dark_matter£ §H$job_dark_matter_technician_plural$§!.\n§YРесурс содержания§!: £sr_dark_matter£ $sr_dark_matter$."
 energy_resource_policy_fusion:0 "Термоядерная энергия"
 energy_resource_policy_fusion_desc:0 "Термоядерный синтез даёт неисчерпаемую чистую энергию при минимальных эксплуатационных затратах.\n\nРесурсы на содержание §Yтехников§! §Gне расходуются§!."
 energy_resource_policy_primitive_uranium:0 "Энергия ядерного деления"
 energy_resource_policy_primitive_uranium_desc:0 "Ядерное деление даёт чистую энергию, но при этом расходуется уран.\n\nВместо §Yтехников§! работают £job_nuclear_technician£ §H$job_nuclear_technician_plural$§!.\n§YРесурс содержания§!: £primitive_uranium£ $primitive_uranium$."
 energy_resource_policy_fossil_fuel:0 "Энергия ископаемого топлива"
 energy_resource_policy_fossil_fuel_desc:0 "Это примитивный способ производства энергии. Он загрязняет окружающую среду и требует минералов для работы.\n\nВместо §Yтехников§! работают £job_primitive_technician£ §H$job_primitive_technician_plural$§!.\n§YРесурс содержания§!: $r_minerals$."
 job_arkship_scavenger:0 "Утилизатор"
 job_arkship_scavenger_plural:0 "Утилизаторы"
 job_arkship_scavenger_desc:0 "Утилизаторы исследуют руины §Y$primitive_arkship_planet_modifier$§! в поисках всего, что ещё может представлять ценность."
 job_arkship_scavenger_effect_desc:0 "£job_arkship_scavenger£ $job_arkship_scavenger_plural$ производят небольшое количество $r_alloys$, $r_amenities$ и $r_research$."
 mod_arkship_scavenger_add:0 "Должности $job_arkship_scavenger$"
 mod_job_broken_shackles_scavenger_per_pop:0 "§G+1§! должность $job_arkship_scavenger$ за каждые $VALUE$ поселений"
 mod_job_broken_shackles_scavenger_per_pop_short:0 "§G+1§! £job_arkship_scavenger£ на $VALUE$ £pop£"
 job_lost_colony_scavenger:0 "Утилизатор&!masc|||gen:утилизатора|||dat:утилизатору|||acc:утилизатора|||inst:утилизатором|||prep:утилизаторе"
 job_lost_colony_scavenger_plural:0 "Утилизаторы&!pl|||gen:утилизаторов|||dat:утилизаторам|||acc:утилизаторов|||inst:утилизаторами|||prep:утилизаторах"
 job_lost_colony_scavenger_desc:0 "Утилизаторы обследуют обломки разбившегося колониального корабля в поисках всего, что ещё может пригодиться."
 job_lost_colony_scavenger_effect_desc:0 "£job_lost_colony_scavenger£ $job_lost_colony_scavenger_plural$ производят немного $r_alloys_lower$, $r_amenities_lower$ и $r_research_lower$."
 job_low_tech_lost_colony_laborer:0 "Колониальный рабочий&!masc|||gen:колониального рабочего|||dat:колониальному рабочему|||acc:колониального рабочего|||inst:колониальным рабочим|||prep:колониальном рабочем"
 job_low_tech_lost_colony_laborer_plural:0 "Колониальные рабочие&!pl|||gen:колониальных рабочих|||dat:колониальным рабочим|||acc:колониальных рабочих|||inst:колониальными рабочими|||prep:колониальных рабочих"
 job_low_tech_lost_colony_laborer_desc:0 "Эти выносливые колонисты сообща налаживают производство товаров, необходимых для более благополучного будущего."
 job_low_tech_lost_colony_laborer_effect_desc:0 "£job_low_tech_laborer£ $job_low_tech_lost_colony_laborer_plural$ перерабатывают $r_minerals_lower$ в $r_consumer_goods_lower$ и $r_alloys_lower$."
 mod_job_low_tech_lost_colony_laborer_add:0 "Должности «$job_low_tech_lost_colony_laborer$»"
 job_low_tech_lost_colony_technician:0 "Техник солнечных батарей&!masc|||gen:техника солнечных батарей|||dat:технику солнечных батарей|||acc:техника солнечных батарей|||inst:техником солнечных батарей|||prep:технике солнечных батарей"
 job_low_tech_lost_colony_technician_plural:0 "Техники солнечных батарей&!pl|||gen:техников солнечных батарей|||dat:техникам солнечных батарей|||acc:техников солнечных батарей|||inst:техниками солнечных батарей|||prep:техниках солнечных батарей"
 job_low_tech_lost_colony_technician_desc:0 "Эти техники обслуживают сложную сеть солнечных батарей, уцелевших после крушения."
 job_low_tech_lost_colony_technician_effect_desc:0 "£job_low_tech_technician£ $job_low_tech_lost_colony_technician_plural$ производят $r_energy_lower$."
 mod_job_low_tech_lost_colony_technician_add:0 "Должности «$job_low_tech_lost_colony_technician$»"
 job_low_tech_lost_colony_miner:0 "Старатель&!masc|||gen:старателя|||dat:старателю|||acc:старателя|||inst:старателем|||prep:старателе"
 job_low_tech_lost_colony_miner_plural:0 "Старатели&!pl|||gen:старателей|||dat:старателям|||acc:старателей|||inst:старателями|||prep:старателях"
 job_low_tech_lost_colony_miner_desc:0 "Эти старатели разбирают обломки разбившегося колониального корабля и добывают из них ценные металлы."
 job_low_tech_lost_colony_miner_effect_desc:0 "£job_low_tech_miner£ $job_low_tech_lost_colony_miner_plural$ производят $r_minerals_lower$."
