 personality_PrimPlayer_ethic_fanatic_nation_desc:0 "Другое государство на нашем родном мире, мечтающее достичь звёзд и стать межзвёздной империей."
 personality_PrimPlayer_ethic_fanatic_nation_megacorp_desc:0 "Мегакорпорация, контролирующая значительную часть нашего родного мира и мечтающая торговать среди звёзд как межзвёздная торговая империя."
