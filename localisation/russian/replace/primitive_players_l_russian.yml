 mod_job_broken_shackles_scavenger_per_pop:0 "§G+1§! должность $job_arkship_scavenger$ за каждые $VALUE$ поселений"
 nations.8.desc:0 "После долгой и беспощадной борьбы за независимость [ROOT.GetName] наконец освобождена войсками [Owner.GetName]. Победа за нами!"
 random_primitive_events.2.desc.home_nuked_planet:0 "[Root.Leader.GetName] обнаруживает пригодный для колонизации мир! На родине уже кипят споры о том, когда первые колонисты ступят на [FROM.GetName&acc]."
 random_primitive_events.2.desc.nuked_planet:0 "[Root.Leader.GetName] обнаружил опустошённый мир, который считался совершенно непригодным для жизни. Однако дальнейшие исследования неожиданно показали, что жизнь здесь всё же возможна — пусть и на самом пределе. Остаётся один вопрос... захочет ли кто-нибудь поселиться на этом мире-могиле?"
 random_primitive_events.2.option.home_nuked_planet:0 "Даже мир-могила может стать домом."
 random_primitive_events.2.option.nuked_planet:0 "Когда-то дом, теперь лишь могила."
 NAME_PrimPlayer_Grazing_Tiyanki:0 "$NAME_Grazing_Tiyanki$"
 random_primitive_events.212.desc_fractured:0 "После долгих лет тщательного планирования, огромных расходов и упорной работы нам удалось терраформировать [FROM.GetName&acc] в §Y$pc_continental$§!.\n\nВсе [Root.GetSpeciesNamePlural] на [Root.Capital.GetName&prep] ликуют: [FROM.GetName] станет их новым домом. Однако одно из государств добровольно предложило перенести в новую колонию свою столицу вместе с населением.\n\nКак нам поступить?"
 random_primitive_events.214.desc_fractured:0 "После долгих лет тщательного планирования, огромных расходов и упорной работы нам удалось терраформировать [FROM.GetName&acc] в §Y$pc_ocean$§!.\n\nВсе [Root.GetSpeciesNamePlural] на [Root.Capital.GetName&prep] ликуют: [FROM.GetName] станет их новым домом. Однако одно из государств добровольно предложило перенести в новую колонию свою столицу вместе с населением.\n\nКак нам поступить?"
 random_primitive_events.214.b:0 "Пусть другое государство колонизирует [FROM.GetName&acc] и покинет [root.capital_scope.GetName&acc]."
 random_primitive_events.214.b.tooltip:0 "[This.GetName] §Yколонизирует§! [FROM.GetName&acc] и §Gпокинет§! нашу £planet£ §Hстолицу§!"
 random_primitive_events.217.desc_fractured:0 "После долгих лет тщательного планирования, огромных расходов и кропотливой очистки от токсичных частиц нам удалось терраформировать [FROM.GetName&acc] в §Y$pc_continental$§!.\n\nВсе [Root.GetSpeciesNamePlural] на [Root.Capital.GetName&prep] ликуют: [FROM.GetName] станет их новым домом. Однако одно из государств добровольно предложило перенести в новую колонию свою столицу вместе с населением.\n\nКак нам поступить?"
 random_primitive_events.255.desc:0 "Землетрясения, терзавшие [From.From.GetName&acc], оказались следствием проходческих работ ранее неизвестной местной подземной цивилизации! Они прорвались на поверхность, и из туннелей хлынули огромные армии, вооружённые примитивным, но смертоносным стрелковым оружием. Их авангард уже атакует наши поселения. Силы безопасности вступили в бой, но нам могут понадобиться подкрепления!"
 random_primitive_events.260.desc.subterranean:0 "Обитающие в магме пришельцы на [Root.GetName&prep] собрали достаточно сил, чтобы начать новое вторжение в наши пещеры! Их обезумевшие армии вновь хлынули из свежевырытых туннелей и бросают нам вызов."
 random_primitive_events.265.name:0 "Экспансия: [Root.Owner.GetSubMantleUpper]"
 random_primitive_events.4.tooltip:0 "§YРанний химический корабль§! будет улучшен до §Yисследовательского судна§!."
