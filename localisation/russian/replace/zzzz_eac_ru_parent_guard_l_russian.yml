 civic_efficient_bureaucracy_desc:0 "Это общество прославилось своей эффективностью. Мало того, что поезда на магнитной подушке движутся по расписанию, так еще и колоссальный бюрократический аппарат, требуемый для управления межзвездной нацией, был значительно упрощен."
 civic_tooltip_private_prospectors_effects:0 "§HТип кораблей:§! Частный колониальный корабль\n• £building£ §Y$building_private_mining_consortium$§! $megacorp_civic_branch_office_building_effect$"
 civic_tooltip_toxic_baths_effects:0 "• $AVAILABLE_BUILDINGS$ £building£ ['building:building_toxic_bath'] $NEW_LINE$• Лидеры с чертой §Y$leader_trait_substance_abuser$§! получают §G+3§! к уровню действующего навыка, пока управляют £colony£ колонией, в которой есть £building£ §Y$building_toxic_bath$§!."
 observation.1002.desc:0 "Наши агенты успешно похитили [abducted_scientist.GetAXX::учёного|||fem:учёную] из [pre_ftl_country.GetName&gen]! Один из наших наземных челноков перехватил [abducted_scientist.GetHerHis] автомашину, когда [abducted_scientist.GetAXX::он возвращался|||fem:она возвращалась] домой поздно ночью после работы, и вывел её из строя при помощи электромагнитного импульса.\n\nВременно [abducted_scientist.GetAXX::парализованного учёного|||fem:парализованную учёную] доставили на челнок, а его телохранителям выборочно почистили память. Мы уверены, что сможем «убедить» [abducted_scientist.GetAXX::хорошего учёного|||fem:хорошую учёную] поработать на нас."
 agenda_environmental_stewards_finish_desc:0 "$council_agenda_agenda_environmental_stewards_desc$ $agenda_ref$"
