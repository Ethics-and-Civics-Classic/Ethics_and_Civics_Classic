l_russian:
 # Ethics and Civics Classic / Russian localisation fixes, October 2026.
 # Last-loaded overrides; original RU source files are not modified.

 random_primitive_events.1.title:0 "Исследование системы [Root.System.GetName]"
 random_primitive_events.1.nuked.desc:0 "[Root.Leader.GetName] отправляется исследовать систему [Root.System.GetName]. Этот долгий и одинокий путь может стать последней надеждой нашего мира на обретение нового дома."
 random_primitive_events.1.desc:0 "[Root.Leader.GetName] отправляется исследовать систему [Root.System.GetName]. Наши мысли и надежды с этой экспедицией, которая делает первые шаги в неизведанный космос."
 random_primitive_events.1.gestalt:0 "Система [Root.System.GetName] станет нашим ядром."
 random_primitive_events.1.authoritarian:0 "Система [Root.System.GetName] принадлежит державе, которой правит [Root.Owner.GetRulerTitle]!"
 random_primitive_events.1.egalitarian:0 "К бесконечности и дальше!"
 random_primitive_events.1.xenophobe:0 "Система [Root.System.GetName] станет надёжным убежищем для [Root.GetSpeciesNamePlural&gen]!"
 random_primitive_events.1.xenophile:0 "Наконец-то мы сможем обнаружить новую жизнь в системе [Root.System.GetName]!"
 random_primitive_events.1.materialist:0 "Один маленький шаг для представителя вида «[Root.GetSpeciesName]» и огромный скачок для всего нашего народа."
 random_primitive_events.1.green:0 "Наш родной мир [Root.GetHomeworldName] дал нам корни; теперь мы тянем ветви к звёздам."
 random_primitive_events.1.socialism:0 "Это великое свершение стало закономерным итогом усилий всего нашего народа!"
 random_primitive_events.1.capitalism:0 "Подобно первопроходцам былых эпох, мы исследуем неизведанные пределы системы [Root.System.GetName] в поисках новых богатств!"
 civic_hive_stargazers_effects:1 "$eager_explorers_base_effect$$TABBED_NEW_LINE$- Начинает игру с низким уровнем разведданных о стартовом скоплении."
 origin_primitive_player_effect:0 "$eager_explorers_developing_hyperdrive_situation$\n\n£job_historical_curator£ §YИстории происхождения§! раскрываются по мере прохождения ситуации §H$PrimPlayer_situation$§! и после её завершения дают §Gновое происхождение§!.\n$trait_primplayer_stargazer_effect$"
 origin_primitive_player_effect_nomad:0 "Родной мир — £planet£ ['modifier:primitive_arkship_planet_modifier'] с должностями §Y$job_archaeoengineers_with_icon$§!\nГарантирует вариант исследования £society£ §H$tech_archaeostudies$§!\n\n$eager_explorers_developing_hyperdrive_situation$\n\n£job_historical_curator£ §YИстории происхождения§! раскрываются по мере прохождения ситуации §H$PrimPlayer_situation$§! и после её завершения дают §Gновое происхождение§!.\n$trait_primplayer_stargazer_effect$"
 concept_stargazer_desc:0 "С восхищением глядя в ночное небо, этот коллективный разум всегда стремился к исследованиям. На протяжении бесчисленных поколений он строил планы и готовился к тому, чтобы как можно легче приспосабливаться к чуждым условиям."
 leader_trait_warrior_culture_desc:2 "$leader_trait_warrior_culture_effect$\n\nВ бою проявляет благородство воина, а в мирное время заботится о нуждах народа. Победы приносят жителям государства не только славу, но и вполне осязаемое благополучие."
 nations.14271.name:1 "Туристы-ксенофилы"
 nations.14271.desc:0 "На нашей границе недавно появилась большая группа туристов из §H[FROM.GetName&gen]§!. Они хотят познакомиться с нашим укладом жизни.\n\nЕсли мы откажем им в праве поселиться в нашей империи, это наверняка вызовет недовольство властей [From.GetRealName&gen]."
 nations.14271.a:0 "Нам ни к чему дипломатический скандал. Впустите их."
 nations.14271.b:0 "Наша империя не туристический курорт!"
 eager_explorers_base_effect:0 "$t$- В начале игры доступны 2 §H$explorer_vessel_plural$§! и §H$engineer_vessel$§!, оснащённые технологией £physics£ ['tech_subspace_drive']. Они не могут перемещаться по гиперкоридорам, но способны совершать ограниченные прыжки.$TABBED_NEW_LINE$$t$- $eager_explorers_developing_hyperdrive_situation$\n$TABBED_NEW_LINE$- £planet£ §YСтоличный мир§! недавно пережил ['concept_prosp_uni'].$TABBED_NEW_LINE$- Завершение инцидента §H«$PrimPlayer_situation$»§! даёт §G+1§! к §Yвместимости гражданских моделей§!.\n$trait_primplayer_stargazer_effect$"
 auth_synth_direct_democratic_virtual_tt:0 "$auth_direct_democratic_election_tt$"
 POP_ATTRACTION_COMMUNAL_POS:0 "§G+ £pop£ поселение обладает признаком «$trait_communal$»§!"
 POP_ATTRACTION_COMMUNAL_NEG:0 "§R- £pop£ поселение обладает признаком «$trait_communal$»§!"
 civic_tooltip_warrior_culture_effects:2 "\n- Должности £job_entertainer£ §Y$job_entertainer$§! заменяются должностями £job_duelist£ §Y$job_duelist$§!.\n- £job_duelist£ §Y$job_duelist_plural$§! преобразуют $r_alloys$ в $r_unity$, $r_amenities$ и повышают привлекательность принципа £mod_ethic_attraction_mult£ §H$ethic_militarist$§!.\n- Должности £job_xeno_zoo_animal£ §Y$job_xeno_zoo_animal$§! заменяются должностями £job_xeno_zoo_beast£ §Y$job_xeno_zoo_beast$§!. $TABBED_NEW_LINE$ $warrior_culture_default_bonuses_tt$ $TABBED_NEW_LINE$ $BOB_mercs_tooltip$"
