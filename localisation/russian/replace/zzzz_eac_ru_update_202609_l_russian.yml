 building_infiltrated_church:0 "Церковь под влиянием культа"
 building_infiltrated_church_desc:0 "На первый взгляд эти церкви ничем не отличаются от обычных, но внутри уже укоренились культисты.\n\nУвеличивает скорость и уровень внедрения, торговую ценность филиала и привлекательность спиритуализма, а также добавляет должность продажного священника, повышающего стабильность ценой снижения привлекательности принципов государства."
 building_pr_bureau:0 "Бюро по связям с общественностью"
 building_pr_bureau_desc:0 "Бюро по связям с общественностью использует множество не вполне законных методов для контроля информационных потоков и даже не пытается этого скрывать."

