 PrimPlayer_civic_void_dwellers:0 "Древние жители пустоты"
 PrimPlayer_civic_void_dwellers_desc:0 "Эта цивилизация была вынуждена покинуть родной мир много эпох назад из-за неконтролируемого парникового эффекта. За бесчисленные поколения сохранилась лишь малая часть древних технологий орбитального поселения, превратившегося в реликт ушедшей эпохи.\n\nСовременным археологам ещё предстоит многое узнать из разрозненных схем утраченных технологий, сохранившихся в этом реликте, поэтому здесь регулярно обнаруживаются новые места раскопок."
