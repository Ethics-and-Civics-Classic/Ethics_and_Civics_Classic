 job_steward_pirate_anarchy_desc:0 "Управление судном и организация труда требуют самых разных талантов. Но главное — суметь принять власть, когда этого требует дело, а затем отказаться от неё, когда срок полномочий истечёт. Иначе экипаж не станет уважать такого командира."
