 tech_primitive_ring_world:0 "Древний мир-кольцо"
 tech_primitive_ring_world_desc:0 "С открытия миров-колец минули эпохи. Из-за закрытых патентов, ограничений промышленности или невозможности передать знания потомкам строительство и значительная часть обслуживания миров-колец стали утраченными технологиями."
 tech_primitive_ring_world_tooltip:0 "§HОткрывает:§! древний мир-кольцо"
 tech_primitive_ring_world_tooltip_desc:0 "С открытия миров-колец минули эпохи. Из-за закрытых патентов, ограничений промышленности или невозможности передать знания потомкам строительство и значительная часть обслуживания миров-колец стали утраченными технологиями."
 tech_primitive_habitat:0 "Древнее орбитальное поселение"
 tech_primitive_habitat_desc:0 "С открытия орбитальных поселений минули эпохи. Из-за закрытых патентов, ограничений промышленности или невозможности передать знания потомкам строительство и значительная часть обслуживания орбитальных поселений стали утраченными технологиями."
 tech_primitive_habitat_tooltip:0 "§HОткрывает:§! древнее орбитальное поселение"
 tech_primitive_habitat_tooltip_desc:0 "С открытия орбитальных поселений минули эпохи. Из-за закрытых патентов, ограничений промышленности или невозможности передать знания потомкам строительство и значительная часть обслуживания орбитальных поселений стали утраченными технологиями."
 tech_primitive_artificial:0 "Древний искусственный мир"
 tech_primitive_artificial_desc:0 "С открытия искусственных миров минули эпохи. Из-за закрытых патентов, ограничений промышленности или невозможности передать знания потомкам строительство и значительная часть обслуживания искусственных миров стали утраченными технологиями."
 tech_primitive_artificial_tooltip:0 "§HОткрывает:§! древний искусственный мир"
 tech_primitive_artificial_tooltip_desc:0 "С открытия искусственных миров минули эпохи. Из-за закрытых патентов, ограничений промышленности или невозможности передать знания потомкам строительство и значительная часть обслуживания искусственных миров стали утраченными технологиями."
 primitive_ring_world_planet_modifier:0 "Реликтовый мир-кольцо"
 primitive_ring_world_planet_modifier_desc:0 "Этот древний мир-кольцо был расколот много эпох назад, но его по-прежнему населяют потомки первых обитателей. За бесчисленные поколения сохранилась лишь малая часть технологий кольца, превратившегося в реликт ушедшей эпохи.\n\nСовременным археологам ещё предстоит многое узнать из разрозненных схем утраченных технологий, сохранившихся в этом реликте, поэтому здесь регулярно обнаруживаются новые места раскопок."
 primitive_habitat_planet_modifier:0 "Реликтовое орбитальное поселение"
 primitive_habitat_planet_modifier_desc:0 "Древнее орбитальное поселение, созданное многие эпохи назад и до сих пор населённое потомками первых обитателей. За бесчисленные поколения сохранилась лишь малая часть его технологий, и само поселение превратилось в реликт ушедшей эпохи.\n\nСовременным археологам ещё предстоит многое узнать из разрозненных схем утраченных технологий, сохранившихся в этом реликте, поэтому здесь регулярно обнаруживаются новые места раскопок."
 primitive_artificial_planet_modifier:0 "Реликтовый искусственный мир"
 primitive_artificial_planet_modifier_desc:0 "Древний искусственный мир, созданный многие эпохи назад и до сих пор населённый потомками первых обитателей. За бесчисленные поколения сохранилась лишь малая часть его технологий, и сам мир превратился в реликт ушедшей эпохи.\n\nСовременным археологам ещё предстоит многое узнать из разрозненных схем утраченных технологий, сохранившихся в этом реликте, поэтому здесь регулярно обнаруживаются новые места раскопок."
 random_primitive_events.3.void_dweller_desc:0 "3... 2... 1... Пуск!\n\n[ROOT.OWNER.GetName] [ROOT.OWNER.GetName::запускает|||pl:запускают] первый космический шаттл из древних доков планеты [ROOT.OWNER.Capital.GetName]. Успешный выход в пустоту знаменует рождение нашей космической программы и вступление в §Yраннюю космическую эпоху§!."
 random_primitive_events.3.void_dweller:0 "Мы вступаем в раннюю космическую эпоху."
