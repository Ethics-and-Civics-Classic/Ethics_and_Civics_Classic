 civic_void_machines:0 "Древние машины пустоты"
 civic_void_machines_desc:0 "$PrimPlayer_civic_void_machines_desc$"
 civic_tooltip_void_machines_effects:0 "$PrimPlayer_civic_tooltip_void_machines_effects$"
 PrimPlayer_civic_void_machines:0 "Древние машины пустоты"
 PrimPlayer_civic_void_machines_desc:0 "Изначально создатели этой машинной цивилизации предназначили её для вечных странствий в космосе, полностью приспособив машины к работе в условиях невесомости. Пережив многие эпохи изоляции, они сохранили лишь малую часть древних технологий своего орбитального поселения, превратившегося в реликт ушедшей эпохи.\n\nСовременным археологическим дронам ещё предстоит извлечь многое из разрозненных схем утраченных технологий, сохранившихся в этом реликте, поэтому здесь регулярно обнаруживаются новые места раскопок."
 PrimPlayer_civic_tooltip_void_machines_effects:0 "£planet£ Родной мир:$NEW_LINE$ - Получает ['modifier:primitive_habitat_planet_modifier'] и должности §Y$job_archaeoengineers_with_icon$§!\n\n£society£ Гарантированные исследования:\n - ['tech_archaeostudies']\n - ['tech_archaeo_strike_crafts']\n$NEW_LINE$- $SPECIES_TRAITS$$TABBED_NEW_LINE$- ['concept_void_dweller_2', $trait_void_dweller_2$]$TABBED_NEW_LINE$- ['concept_habitat_preference', $trait_pc_habitat_preference$]$NEW_LINE$- $ap_voidborn_habitat_effect$"
 job_archaeo_strike_crafts_miner:0 "Древний буровой дрон"
 job_archaeo_strike_crafts_miner_plural:0 "Древние буровые дроны"
 job_archaeo_strike_crafts_miner_desc:0 "Эти дистанционно управляемые дроны оснащены старинными добывающими лазерами, способными расплавить любую броню. С такой техникой астероидная добыча для них проще простого!"
 mod_job_archaeo_strike_crafts_miner_add:0 "Должности $job_archaeo_strike_crafts_miner$"

