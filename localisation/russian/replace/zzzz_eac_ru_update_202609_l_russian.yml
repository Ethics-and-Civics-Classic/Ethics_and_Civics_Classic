 PrimPlayer_civic_shattered_ring:0 "Древнее расколотое кольцо"
 PrimPlayer_civic_shattered_ring_desc:0 "Эта цивилизация обитает на §Hмире-кольце§!, построенном неизвестными предтечами. За бесчисленные поколения сохранилась лишь малая часть древних технологий этого кольца, превратившегося в реликт ушедшей эпохи.\n\nСовременным археологам ещё предстоит многое узнать из разрозненных схем утраченных технологий, сохранившихся в этом реликте, поэтому здесь регулярно обнаруживаются новые места раскопок. Если удастся разгадать устройство расколотого мира-кольца и полностью его восстановить, его обитатели обретут огромную силу."
 PrimPlayer_civic_tooltip_shattered_ring_effects:0 "£planet£ Родной мир:$NEW_LINE$ - Получает ['modifier:primitive_ring_world_planet_modifier'] и должности §Y$job_archaeoengineers_with_icon$§!\n\n£society£ Гарантированные исследования:\n - ['tech_archaeostudies']\n - ['tech_archaeo_strike_crafts']\n$NEW_LINE$- ['concept_guaranteed_colonies']: заменяются пригодными для колонизации сегментами мира-кольца с £blocker£ §Rпрепятствиями§!, снижающими £mod_pop_environment_tolerance£ приспособленность $NEW_LINE$- $SPECIES_TRAITS$ ['concept_ring_preference']"
 PrimPlayer_civic_tooltip_shattered_ring_effects_lithoid:0 "§R- ВНИМАНИЕ: сложное происхождение для литоидов из-за нехватки минералов.§!$NEW_LINE$$PrimPlayer_civic_tooltip_shattered_ring_effects$"
 civic_void_dwellers:0 "Древние жители пустоты"
