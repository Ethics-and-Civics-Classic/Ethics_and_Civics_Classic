 d_ark_nature_preserve_blocker_desc:0 "Часть нашего $arkship$ отдана под защиту исчезающих и уже вымерших видов со множества планет. Здесь их дом, как и наш."
 decision_expand_biotope:0 "Расширить биотоп"
 decision_expand_biotope_short:0 "Добавляет на $arkship$ ещё одно §Y$d_ark_nature_preserve_blocker$§!."
 decision_expand_biotope_desc:0 "Благодаря резервным системам жизнеобеспечения и тщательному контролю мы можем точно воспроизводить экологические условия самых разных биосфер."
 civic_naturalism_nomad:0 "Звёздные соларпанки"
 civic_naturalism_nomad_desc:0 "Эти странники превращают свои $arkship_plural$ в подобия любимых планет. Но это не просто имитация: их корабли и правда становятся странствующими мирами."
 building_national_park_nomad:0 "Биосфера ковчега"
 building_national_park_nomad_desc:0 "Внутри $arkship$ раскинулась полноценная живая экосистема. Местные флора и фауна находятся под особой охраной."
 civic_environmentalist_nomad:0 "Эко-ковчеги"
 civic_environmentalist_nomad_desc:0 "Эти кочевники собирают исчезающие и уже вымершие виды на посещаемых планетах и заботятся о них на борту своих ковчегов, стремясь сохранить жизнь по всей галактике."
 civic_tooltip_environmentalist_nomad_effects:0 "$t$- $AVAILABLE_BUILDINGS$ £building£ ['building:building_nomad_conservatory']$TABBED_NEW_LINE$- $ADDITIONAL_BUILDINGS_STRING$ £building£ §Y$building_nomad_conservatory$§!\n$t$- $AVAILABLE_HOLDINGS$ £building£ ['building:holding_park_ranger_lodge']$TABBED_NEW_LINE$- В начале игры даёт дополнительное §Y$d_ark_nature_preserve_blocker$§! £blocker£ §Hпрепятствие§!."
 civic_keepers_harmony_nomad:0 "Кочующие почитатели природы"
 civic_keepers_harmony_nomad_desc:0 "Для этого общества священны места, которые оно посещает. Его представители пересекают галактику в многолетних паломничествах к святыням, где природа и космос пребывают в совершенной гармонии."
 civic_tooltip_keepers_harmony_nomad_effects:0 "$t$§EБожественный симбиоз:§!$TABBED_NEW_LINE$$t$- Должности £job_bureaucrat£ §Y$job_bureaucrat$§! заменяются уникальными должностями £job_priest£ §Y$job_druid$§!.$TABBED_NEW_LINE$$t$- Должности £job_priest£ §Y$job_druid$§! эффективнее на $arkship_plural$ с §Y$d_ark_nature_preserve_blocker$§! £blocker£ §Hпрепятствиями§!, предоставляя §Gдополнительное§! £housing£ §Yжильё§! и повышенную §Y$MOD_POP_ENVIRONMENT_TOLERANCE$§!.\n$TABBED_NEW_LINE$- £building£ §Y$building_nature_sanctuary_nomad_plural$§! — уникальные сооружения, которые повышают местные $r_unity$, £happiness£ §Yсчастье§! и привлекательность £pops£ §H$ethic_green$§! за каждое §Y$d_ark_nature_preserve_blocker$§! £blocker£ §Hпрепятствие§! на $arkship$, а для содержания требуют $r_food$."
 civic_tooltip_keepers_harmony_nomad_negative_effects:0 "$t$§EОтвергнутый симбиоз:§!$TABBED_NEW_LINE$$t$- На $arkship_plural$ без §Y$d_ark_nature_preserve_blocker$§! £blocker£ §Hпрепятствий§! должности §Y$job_druid$§! производят §Rменьше§! $r_unity$, чем даже обычные бюрократы."
 building_nature_sanctuary_nomad_plural:0 "Садовые святилища"
 building_nature_sanctuary_nomad_plural_desc:0 "$building_nature_sanctuary_nomad_desc$"
 building_nature_sanctuary_nomad:0 "Садовое святилище"
 building_nature_sanctuary_nomad_desc:0 "Здесь увековечен наш путь среди звёзд и почитается гармония с экосистемой пустоты. Этот монумент повышает местные $r_unity$, £happiness£ $HAPPINESS$ и привлекательность этики §Yэкоцентризма§! за каждое §Y$d_ark_nature_preserve_blocker$§! £blocker£ §Hпрепятствие§!, а для содержания требует $r_food$."
 civic_eco_warfare_nomad:0 "Защитные биотопы"
 civic_eco_warfare_nomad_desc:0 "Этот народ не только готов с оружием в руках защищать свои садовые биотопы, но и научился эффективно применять достижения биологических наук в военном деле.\n\n§WОрганические корабли§!: применение биотехнологий в военном кораблестроении наделяет корабли особыми свойствами, включая регенерацию брони и корпуса, а также повышенную энергоэффективность. Обратная сторона — такие материалы обычно более хрупки, чем неорганические сплавы.\n\n§WВоенная биомедицина§!: повышает здоровье армий."
 civic_tooltip_eco_warfare_nomad_effects:0 "$t$§EЕстественная защита§!: даёт преимущества от §Y$d_ark_nature_preserve_blocker$§! £blocker£ §Hпрепятствий§!$TABBED_NEW_LINE$$t$- Должности £job_entertainer£ §Y$job_entertainer_plural$§! заменяются на £job_duelist£ §Y$job_duelist_plural$§!.$TABBED_NEW_LINE$$t$- Каждое £blocker£ §Hпрепятствие§! снижает §Yурон от планетарной бомбардировки§! на §G5%§!.\n$TABBED_NEW_LINE$§EВоенная биотехнология§!:$TABBED_NEW_LINE$$t$- Содержание в $r_minerals$ за каждые 100 [foundry.GetIcon] §Y[GetAlloyProducer]§!: §G-1§!.$TABBED_NEW_LINE$$t$- Содержание в $r_food$ за каждые 100 [foundry.GetIcon] §Y[GetAlloyProducer]§!: §R+1§!.$TABBED_NEW_LINE$$t$- Содержание в $r_food$ за каждые 100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§!: §R+1§!.$TABBED_NEW_LINE$$t$- Производство $r_alloys$ за каждые 100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§!: §G+0.5§!.\n$BOB_mercs_tooltip$"
 holding_national_park:0 "Национальный парк сюзерена"
 holding_national_park_desc:0 "Часть планеты вассала отводится под обширный природный заповедник. Возвращение этих земель дикой природе укрепляет позиции $ethic_green$, а если вассал и сам ценит природу, ещё и улучшает отношения с сюзереном."
 job_overlord_naturalist:0 "$job_naturalist$ сюзерена"
 job_overlord_naturalist_plural:0 "$job_naturalist_plural$ сюзерена"
 planet_overlord_naturalists:0 "$job_overlord_naturalist_plural$"
 mod_job_overlord_naturalist_add:0 "Должности $job_overlord_naturalist$"
 job_overlord_naturalist_effect_desc:0 "$job_naturalist_effect_desc$"
 job_overlord_naturalist_desc:0 "$job_naturalist_plural$ наставляют население, как обращаться с природой в соответствии с волей сюзерена."
 ORBITAL_RING_SENSOR_0:0 "$SENSOR_0$"
 ORBITAL_RING_SENSOR_0_DESC:0 "$SENSOR_0_DESC$"

 # Source: localisation/english/replace/ethic_rebuild_l_english.yml
 cb_primitive_uprising:0 "$casus_belli_cb_primitive_uprising$"
 cb_primitive_uprising_desc:0 "$casus_belli_cb_primitive_uprising_desc$"
 casus_belli_cb_primitive_uprising_desc:0 "Нам всегда хватит мужества, чтобы освободить свой народ от межзвёздной империи, решившей нас покорить."
 building_colossal_monument:0 "Колоссальный монумент роботу"
 building_colossal_monument_desc:0 "Это не просто статуя, а исполинский монумент антропоморфному роботу. Здесь не поклоняются машине: это святыня памяти о древних искусственных интеллектах, определивших судьбу империи."
 civic_tooltip_only_fanatic_egalitarian_and_capitalism:0 "Допускается только §Hфанатическая§! этика §Y$ethic_egalitarian$§! или §Y$ethic_capitalism$§!"
 tech_industrial_biotech:0 "Промышленная биотехнология"
 tech_industrial_biotech_desc:0 "Позволяет строить §Yбиоперерабатывающие заводы§!, предоставляющие должности £job_biotechnologist£ §Yбиотехнологов§!, которые превращают $r_food$ в $r_energy$, $r_consumer_goods$ и $r_alloys$. В государствах нелитоидных видов $job_artisan_plural$ и $job_foundry_plural$ расходуют на §G-1§! $r_minerals$ меньше и на §G+1§! $r_food$ больше при производстве $r_consumer_goods$ и $r_alloys$."
 POP_ATTRACTION_MACHINE_CULT_POS:0 "$triggered_machine_cult_opinion_of_robot_empires$"
 POP_ATTRACTION_MACHINE_CULT_MACHINE_POS:0 "$triggered_robot_empires_opinion_of_machine_cult$"
 building_luxury_fishing_lodge:0 "Роскошный рыболовный домик"
 building_luxury_fishing_lodge_desc:0 "Роскошные апартаменты предназначены для рыболовов, посещающих этот редкий $zone_anglers$ на $resort_colony$ ради самых экзотических рыб галактики."
 sm_arkship_spinal_branch_office_mount:0 "Верфь порта захода"
 sm_arkship_spinal_branch_office_mount_desc:0 "§LЭти осевые доки не только перевозят пассажиров, но и обслуживают все торговые операции, связанные с их покупками во время захода в порт.§!\n\n['modifier:planet_luxuries_boost'] §Wпри выходе на§! £planet£ §Hорбиту§! §Wлюбой§! £planet£ §Yколонии§!\n"
 must_be_cruise_arkship:0 "§RКорабль-ковчег должен быть§! §Yкруизным лайнером§!§R!§!"
 forever_cruise_BRANCH_OFFICE:0 "Планетарные шаттловые доки"
 forever_cruise_BRANCH_OFFICE_DESC:0 "§LЭти осевые доки не только перевозят пассажиров, но и обслуживают все торговые операции, связанные с их покупками во время захода в порт.\n\nВ бою шаттлы дополняют огневую мощь штурмовиков и одновременно развлекают пассажиров захватывающими симуляциями космических сражений.§!\n\n['modifier:planet_luxuries_boost'] §Wпри выходе на§! £planet£ §Hорбиту§! §Wлюбой§! £planet£ §Yколонии§!\n"
 forever_cruise_branch:0 "Порт захода «Вечного круиза»"
 forever_cruise_branch_desc:0 "Корабль-ковчег «Вечного круиза» открыл на этой планете филиал, где жителям предлагают роскошь, развлечения и возможность забыть о монотонности повседневной жизни.\n\n§RТребуется§! §Yкорабль-ковчег «Вечного круиза»§! §Rв этой системе!§!"
 councilor_machine_cult_machine:0 "Мехапапа"
 councilor_barbaric_despoilers_khan:0 "Военачальник «Плана Великого хана»"
 job_bio_trophy_processing:0 "Будущий биотрофей"
 job_bio_trophy_processing_plural:0 "Будущие биотрофеи"
 job_bio_trophy_processing_desc:0 "Органики постепенно переходят под опеку империи. Эта должность служит для них переходным этапом, пока они не освоятся в роли биотрофеев."
 job_bio_trophy_unprocessing:0 "Покидающий опеку биотрофей"
 job_bio_trophy_unprocessing_plural:0 "Покидающие опеку биотрофеи"
 job_bio_trophy_unprocessing_desc:0 "Бывшие биотрофеи постепенно возвращаются к обычному труду. Эта должность служит переходным этапом до возвращения в прежний социальный слой."
