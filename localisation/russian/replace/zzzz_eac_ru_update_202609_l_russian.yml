 pft_environmentalists_nomads:0 "Фракция ксеноэкологов"
 pft_environmentalists_nomads_desc:0 "Ксеноэкологов прежде всего волнуют пригодность наших кораблей-ковчегов для жизни и сохранение галактической экосистемы в целом. Они выступают против требований экстракционистов разрабатывать небесные тела.\n\n§LЭтос экоцентризма§!"
 pft_manufacturers_nomads:0 "Фракция экстракционистов"
 pft_manufacturers_nomads_desc:0 "Экстракционисты представляют интересы астродобытчиков, промышленников и металлургов, поддерживающих работоспособность наших кораблей-ковчегов. К идеалам ксеноэкологов они относятся с презрением.\n\n§LЭтос индустриализма§!"
 factions.1.desc.manufacturers_nomads:0 "Члены этой фракции главным образом заинтересованы в разработке небесных тел и расширении оперативных резервов.\n\n"
 factions.1.desc.environmentalists_nomads:0 "Члены этой фракции выступают за сохранение галактической экологии и сокращение потребностей в ресурсах.\n\n"
