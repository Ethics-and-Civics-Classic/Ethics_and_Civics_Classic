 # Source: localisation/english/EaC_civic_mechanic_events_l_english.yml
 sm_arkship_pirate_mercenary_garrison:0 "$sm_pirate_mercenary_garrison$"
 sm_arkship_pirate_mercenary_garrison_desc:0 "$sm_pirate_mercenary_garrison_desc$"
 origin_post_apocalyptic_specimen_desc_short:0 "Эта атомная бомба мощностью 35 мегатонн с нашей родной планеты [EVENT_TARGET_0.GetName] осталась со времён Великой ядерной войны, уничтожившей некогда пригодный для жизни мир."
 origin_post_apocalyptic_specimen_desc_details:0 "К счастью, ядерную бомбу всё ещё удалось обезвредить. Наши историки перевели надпись на боеголовке. Судя по всему, она означает что-то вроде «Самый большой из больших мальчиков». Странно."
 EAC_NUCLEAR_BOMB_PROJECT:0 "Повторно активированная ядерная боеголовка"
 EAC_NUCLEAR_BOMB_PROJECT_DESC:0 "Во время раскопок на планете [From.GetName] мы случайно активировали заброшенную атомную бомбу. Нужно обезвредить её, пока не истёк таймер!"
 EaC_civic_mechanic_events.7155.name:0 "Повторно активированная ядерная боеголовка"
 EaC_civic_mechanic_events.7155.desc:0 "Во время раскопок руин неподалёку от нашей столицы на планете [Root.GetName] несколько [OWNER.GetSpeciesNamePlural&gen] случайно запустили таймер неразорвавшейся атомной бомбы, оставшейся со времён Великой ядерной войны.\n\nРасчётная мощность заряда составляет 35 мегатонн. В случае взрыва будут уничтожены несколько населённых центров. Бомба слишком нестабильна, чтобы её перемещать, а времени на эвакуацию всего региона уже не осталось."
 EaC_civic_mechanic_events.7155.a:0 "Мы должны её обезвредить!"
 EaC_civic_mechanic_events.7156.desc:0 "Нам удалось обезвредить атомную бомбу на планете [From.From.GetName]! Её безопасно утилизировали, а специальные группы теперь прочёсывают поверхность [From.From.GetName&gen], разыскивая другие неразорвавшиеся боеприпасы. Будем надеяться, это снизит вероятность повторения подобного происшествия."
 EaC_civic_mechanic_events.7156.pacifist:0 "Напоминание о безрассудстве, которое нельзя повторить."
 EaC_civic_mechanic_events.7156.a:0 "Атомный артефакт в память о нашем прошлом."
 EaC_civic_mechanic_events.7157.desc:0 "Группа сапёров не успела обезвредить атомную бомбу на планете [From.From.GetName]. Они и всё живое в радиусе ста километров были уничтожены взрывом. Погибло бесчисленное множество [ROOT.GetSpeciesNamePlural&gen]. Они стали последними жертвами трагической и бессмысленной войны, закончившейся десятилетия назад."
 EaC_civic_mechanic_events.7157.a:0 "Так закончилась Великая ядерная война... наше собственное безумие."
 EaC_civic_mechanic_events.7158.title:0 "Атомное возвышение"
 EaC_civic_mechanic_events.7158.desc:0 "Закалённые атомным огнём, [OWNER.GetSpeciesNamePlural] знают, какая мощь таится в уране. Если мы научимся ею распоряжаться, наше общество сможет возвыситься. Уран увеличит производство энергии, усилит военный потенциал и станет катализатором нашего возвышения!\n\nЕсли только... мы решимся его принять."
 EaC_civic_mechanic_events.7158.a:0 "Примем наше Атомное возвышение!"
 EaC_civic_mechanic_events.7158.b:0 "Урану место в атомной эпохе."
 atomic_ascension:0 "Атомное возвышение"
 embrace_atomic_ascension:0 "Принимает ['concept_atomic_ascension']."
 concept_atomic_ascension:0 "$atomic_ascension$"
 concept_atomic_ascension_desc:0 "$concept_atomic_ascension$:\n£job_technician£ §H$job_technician_plural$§! заменяются на £job_nuclear_technician£ §H$job_nuclear_technician_plural$§!, которые производят больше £energy£ §Y$energy$§!, но расходуют £primitive_uranium£ §Y$primitive_uranium$§!.\n\nВ £building£ ['building:building_primitive_nuclear_plant'] появляются дополнительные должности £job_physicist£ §H$job_physicist$§!, а само сооружение можно £building£ §Hулучшить§!.\n\nТехнология £physics£ §Y$tech_power_hub_1$§! открывает:\n['building:building_mega_reactor_apocalyptic'] для £building£ §Hэнергетических районов§!, которое можно улучшить так, чтобы оно §Gтерраформировало§! любую не искусственную планету в £planet£ §Y$pc_nuked$§!."
 building_mega_reactor_apocalyptic:0 "Сеть мегареакторов"
 building_mega_reactor_apocalyptic_desc:0 "Вдоль энергосети расположена целая сеть ядерных исследовательских комплексов, где техники экспериментируют с мощностью реакторов. К сожалению, бесконтрольные испытания уже превратили окрестности в $irradiated_wasteland$."
 building_mega_reactor_apocalyptic_nuked:0 "Перегруженная сеть реакторов"
 building_mega_reactor_apocalyptic_nuked_desc:0 "Сеть ядерных исследовательских комплексов, разбросанных вдоль энергосистемы. Техники выжимают из реакторов предельную мощность. Превращение окрестностей в $irradiated_wasteland$ — наименьшая из их забот..."
 building_mega_reactor_apocalyptic_nuked_effect:0 "£planet£ §HКолония§! получает модификатор £primitive_uranium£ ['modifier:irradiated_wasteland']\n\n£job_nuclear_technician£ $job_nuclear_technician$ производят £volatile_motes£ §Y$volatile_motes$§!"

 # Source: localisation/english/EaC_l_english.yml
 EMPIRE_DESIGN_EaC_korinth_conglomerate_desc:0 "Поначалу они лишь запускали спутники. Но когда система раннего предупреждения, созданная компанией «Alabaster Communications LLC», обнаружила планету-бродягу, неумолимо двигавшуюся к столкновению с Былым Корином, пришлось действовать. Эта новость сплотила весь мир, и отчаявшиеся жители доверили свою судьбу корпорации.\n\n«Alabaster» возглавила проект «Рождённые в пустоте», направив все ресурсы на запуск первого орбитального поселения. Новый дом получил привлекательный бренд, полюбившийся населению, а компании одна за другой выстраивались в очередь за франшизой. Вскоре орбитальные поселения распространились по всей системе, а смешение их обществ породило настоящий культурный ренессанс.\n\nНо проблем хватало: сбои ориентации спутников, удары метеоритов, судебные споры и отсутствие единых стандартов сделали обслуживание сетей связи почти невозможным. «Alabaster Communications» добровольно взяла на себя исключительную ответственность за жизненно важную и хрупкую коммуникационную инфраструктуру. Слишком поздно население осознало, какую власть давал этот рычаг.\n\nОдно за другим поселения-франчайзи теряли активы: сборы удваивались, доли принудительно выкупались под угрозой полного отключения от сети. В конце концов все они оказались объединены под началом одной организации. Теперь, сменив название на Коринфский конгломерат, эта мегакорпорация намерена без конца расширяться по галактике, поглощая всё новые предприятия через франчайзинговую модель!"
 EMPIRE_DESIGN_EaC_yldarian_raider_clan_desc:0 "Происхождение илдари почти забыто и сохранилось лишь в догадках да смутных намёках на некий великий замысел. Согласно устным преданиям, некогда их генетически создали как касту воинов древней империи Предтеч. Их прежние хозяева давно вымерли, кланы объединились и теперь обращают взор наружу, готовясь поживиться добычей беззащитных миров.\nВсе илдари мужского пола и не способны размножаться обычным способом, поэтому для продолжения рода используют древние чаны клонирования. Их генетические шаблоны изначально были созданы для идеальных воинов. Так возникла глубоко иерархичная культура, основанная на убеждении, что воины должны править, а массы — повиноваться."
 PRESCRIPTED_ruler_title_yldarian_raider_clan:0 "Пиратский лорд"
 PRESCRIPTED_ruler_bio_yldarian_raider_clan:0 "Пиратский лорд Моннобаки ещё при объединении кланов илдари доказал, насколько он хитёр и расчётлив. Сам присвоив себе титул пиратского лорда, теперь он намерен распространить свой преступный синдикат на всю галактику!"
 EMPIRE_DESIGN_EaC_united_workers_steel_conglomerate_desc:0 "Мы, коллектив Киберстана, имеем право защищать рабочих от эгоистичных капиталистов. Никто больше не будет страдать под гнётом корпораций, как страдали мы! Рабочие, объединяйтесь!"
 PRESCRIPTED_ruler_title_united_united_workers_steel_conglomerate:0 "Избранный советник"
 PRESCRIPTED_ruler_title_female_united_workers_steel_conglomerate:0 "Избранная советница"
