 civic_machine_cult_machine_forever_cruise_desc:0 "Эта империя машин, которым создатели поклоняются как богам, стремится взять органиков за руку, открыть им величие космоса... и угостить вкусными фруктовыми напитками."
 civic_tooltip_machine_cult_machine_forever_cruise_effects:0 "- Дополнительное стартовое сооружение: £building£ §YМехамонастырь§! \n- Открывает черту §C['trait:trait_latent_psionic_machine', $trait_latent_psionic_machine$]§! \n$civic_tooltip_machine_cult_buildings$\n\n§EПсионический симбиоз§!:\n    - Позволяет модифицировать £pops£ §Y$planet_pop_organics$§!, делая их §Hкибернетическими§!\n$t$- §HПассажиры§! должны иметь уровень жизни §Y$living_standard_organic_trophy$§! и дают §Gдополнительно +1%§! к эффективности должностей специалистов\n$t$- §HПассажиры экономкласса§! заменяются на §Y$job_cruise_passenger_unemployment_bio_trophy_plural$§!\n$t$- §RПотребности пассажиров удовлетворять сложнее§!\n$t$ Все механические поселения автоматически становятся §Hэкипажем§! и никогда не могут быть §Hпассажирами§!.\n\n§EМожно сочетать с:§! \n- ['civic_tooltip_machine_cult_spiritualist_combo', $civic_exalted_priesthood$] или другими ['concept_ethics_rebuild_theocracy',§Yтематическими гражданскими моделями спиритуалистов§!]"
