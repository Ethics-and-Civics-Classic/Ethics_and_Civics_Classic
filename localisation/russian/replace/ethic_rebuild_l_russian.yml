 new_babylon.name:0 "Галактическое Чудо: Новый Вавилон"
 new_babylon.desc:0 "С этого момента эта Планета считается галактическим раем культурного плюрализма. Каждый Ксен приветствуется здесь, чтобы присоединиться к вечному празднованию разнообразия."

 edict_new_babylon:0 "Основать Новый Вавилон"
 edict_new_babylon_desc:0 "Превращает планету в новое Галактическое Чудо - §YНовый Вавилон§!."
 edict_new_babylon.tooltip:0 "Этот указ переименует планету в §YНовый Вавилон§!, увеличит её размер максимум на 10 (до 25), значительно повысит §Yпривлекательность миграции ксеносов§!, §Yпригодность§!, §Yединство§!, производство §Yэнергии§! и §Yсоциологических исследований§!, а также снизит §Yпривлекательность государственных принципов§! и повысит возможный уровень §Yволнений§!."

