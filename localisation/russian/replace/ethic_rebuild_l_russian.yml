 POP_ATTRACTION_CAPITALISM_POS:0 "§G+ Руководящий принцип государства: $ethic_capitalism$§!"
 POP_ATTRACTION_CAPITALISM_NEG:0 "§R− Руководящий принцип государства: $ethic_capitalism$§!"

