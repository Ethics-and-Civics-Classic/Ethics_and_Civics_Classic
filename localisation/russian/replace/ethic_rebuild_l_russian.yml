 auth_direct_democratic:0 "Прямая демократия"
 auth_direct_democratic_desc:0 "При прямой демократии граждане сами голосуют по многим — а иногда и по всем — политическим вопросам, не полагаясь на избранных представителей."

 gov_slaver_republic:0 "Рабовладельческая республика"
 gov_slaver_republic_desc:0 "Крайне элитарная форма республики, где политические права большей части населения урезаны, гражданство доступно немногим, а значительная часть жителей обращена в рабство ради привилегированного меньшинства."

 gov_genuine_aristocracy:0 "Подлинная аристократия"
 gov_genuine_aristocracy_desc:0 "Идеалистическая форма правления, при которой правящая элита считает своим долгом учитывать интересы общества и заботиться о народе."

 decision_planet_voice:0 "Голос планеты"
 decision_planet_voice_effects:0 "Позволяет избавиться от следующих планетарных модификаторов: §YОпасные Животные§!, §YБезрадостная§!, §YОпасная Погода§!, §YДикие Шторма§!, §YПоврежденная Экология§!, §YМутант-преследователь§!, §YРадиоактивная Пустошь§!."
 decision_planet_voice_effects_short:0 "Позволяет избавиться от следующих планетарных модификаторов:  §YОпасные Животные§!, §YБезрадостная§!, §YОпасная Погода§!, §YДикие Шторма§!, §YПоврежденная Экология§!, §YМутант-преследователь§!, §YРадиоактивная Пустошь§!."
 decision_planet_voice_desc:0 "Дух этого мира страдает. Немного заботы и внимания — и планета вновь станет прекрасной и гостеприимной."
 edict_voice_planet_1.tooltip:0 "Решение удаляет отрицательные планетарные модификаторы окружающей среды, в том числе £blocker£ §Hопасную дикую природу§!, £blocker£ §Hскудную природу§!, £blocker£ §Hопасную погоду§!, £blocker£ §Hнепредсказуемые бури§!, £blocker£ §Hхищное существо§!, £blocker£ §Hповреждённую экологию§! и £blocker£ §Hрадиацию в пустошах§!."

 decision_environment_fix:0 "Восстановление экологии"
 decision_environment_fix_effects:0 "Позволяет избавиться от следующих планетарных модификаторов: §YНестабильная Тектоника§!, §YСлабое Магнитное Поле§!, §YМагнитное Разрушение§!, §YПриливный Захват§!, §YРадиоактивная Планета§!, §YПоврежденная Экология§!, §YРадиоактивные Пустоши§!, §YЗаброшенное Терраформирование§!, §YОпасная Погода§!, §YДикие Шторма§!."
 decision_environment_fix_effects_short:0 "Позволяет избавиться от следующих планетарных модификаторов: §YНестабильная Тектоника§!, §YСлабое Магнитное Поле§!, §YМагнитное Разрушение§!, §YПриливный Захват§!, §YРадиоактивная Планета§!, §YПоврежденная Экология§!, §YРадиоактивные Пустоши§!, §YЗаброшенное Терраформирование§!, §YОпасная Погода§!, §YДикие Шторма§!."
 decision_environment_fix_desc:0 "Экология этого мира нарушена, но мы знаем, как её восстановить."
 edict_voice_planet_2.tooltip:0 "Решение удаляет отрицательные планетарные модификаторы окружающей среды, в том числе §Yнестабильную тектонику§!, §Yслабое магнитное поле§!, §Yсинхронное вращение§!, §Yрадиационное заражение§!, §Yповреждённую экологию§!, §Yрадиацию в пустошах§!, §Yзаброшенный проект по терраформированию§!, §Yопасную погоду§!, §Yнепредсказуемые бури§! и §Yмагнитное нарушение§!."

 policy_budget_incentives:0 "Фокус Финансирования"
 policy_budget_incentives_desc:0 "Позаоляет выбрать определенное направление финансирования. Содержание каждой политики стоит §Y20§! от всей производимой энергии. Необходимо сперва изучить §YГосуправление: Бюджетные Ассигнования§!."

