 civic_federalist:0 "Федерализм"
 civic_federalist_desc:0 "Сосредоточена на мирном расширении через развитие Федерации — союза частично самоуправляемых государств под властью центрального правительства. Получает повышенное одобрение подданных и позволяет им основывать колонии за пределами собственных границ."

 triggered_opinion_federalism:0 "Федеральные Лидеры"

 civic_hegemon:0 "Империализм"
 civic_hegemon_desc:0 "Империалисты ведут диалог с поддаными с позиции силы, требуя с них значительную дань на благо Империи."

 ethic_capitalism:0 "Конкуренция"
 ethic_fanatic_capitalism:0 "Фанатичная конкуренция"
 ethic_capitalism_desc:1 "§LЛичная амбиция — двигатель прогресса. Желание стать лучше и решимость добиваться этого — вот что позволило нам дотянуться до самих звёзд. Мы должны и дальше защищать завоёванную свободу самовыражения от иррационального страха конформистов и никогда не позволять шаблонности сдерживать гений.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_capitalism_desc:1 "§LНет высшего императива, чем стремление к превосходству, накоплению и новым вложениям. В столкновении амбиций рождаются огромные состояния, а вместе с ними — ещё большие амбиции. Колесо вращается, сокрушая неприспособленных, но с каждым оборотом вознося новых претендентов. Мы знаем — и служим тому доказательством, — что благо для лучших из нас в конечном счёте становится благом для всех.§!$ethic_gestalt_consciousness_desc_tooltip$"

 ethic_socialism:0 "Кооперация"
 ethic_fanatic_socialism:0 "Фанатичная кооперация"

 ethic_socialism_desc:0 "§LСовместный труд — двигатель прогресса. Трудясь плечом к плечу, мы становимся чем-то большим, чем простая сумма отдельных частей: великим живым организмом, где каждый из нас — клетка. Добросовестно исполнять порученную нам работу — всё, чего от нас требуют; вносить свой вклад в общее благо — всё, чего мы требуем от самих себя.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_socialism_desc:0 "§LНет высшего призвания, чем найти своё место в общем труде, отдавать себя общему делу и делить его плоды. Эгоистичное накопление богатства, земли или машин — опухоль на теле общества. Общая же забота о молодых, старых и больных делает нас сильными и объединяет нас в единое целое.§!$ethic_gestalt_consciousness_desc_tooltip$"

 ethic_egalitarian_desc:1 "§LЛибертарианство отстаивает свободу личности, автономию и политические права. В его основе лежат свобода выбора и объединений, добровольное взаимодействие и индивидуализм, а эффективность общественного устройства достигается за счёт меньшей централизации власти и более ограниченного регулирования.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_egalitarian_desc:1 "§LРадикальное либертарианство провозглашает свободу главным принципом общества, основанного на автономии и самоуправлении, и отвергает любые формы тирании и угнетения. Все равны в достоинстве и правах, а политическая власть прежде всего принадлежит индивиду.§!$ethic_gestalt_consciousness_desc_tooltip$"

 civic_pilgrims:0 "Отважные пилигримы"
 civic_pilgrims_desc:0 "У этого общества давно устоявшиеся кочевые традиции и сильный дух приключений. Люди стремятся расширить свои территории и путешествовать по всей империи."

 civic_free_market:0 "Свободный Рынок"
 civic_free_market_desc:0 "Идеализированная система, в которой цена за товары и услуги определяется открытым рынком и потребителями, и в которой законы и правила предложения и спроса свободны от какого либо вмешательства со стороны правительства, ценообразующей монополии или какой-либо другой власти."

