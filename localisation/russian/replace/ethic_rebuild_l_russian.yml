 civic_naturalism:0 "Экотопия"
 civic_naturalism_desc:0 "Подлинная близость к природе сама по себе приносит спокойствие и умиротворение. Жители этого утопического общества считают естественную среду неотъемлемой частью своей культуры."

 building_ecotourism_center:0 "Центр экотуризма"
 building_ecotourism_center_desc:0 "Природные чудеса этой планеты оживляют местную экономику и привлекают туристов со всего государства."

 job_naturalist:0 "Проводник-натуралист"
 job_naturalist_plural:0 "Проводники-натуралисты"
 job_naturalist_desc:0 "Местные жители, организующие отдых на природе, знакомящие гостей с её достопримечательностями и следящие за сохранностью экосистем."
