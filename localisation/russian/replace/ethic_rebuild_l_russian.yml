 mod_job_techno_priest_per_pop:0 "§G+1§! должность $job_techno_priest$ за каждые $VALUE$ поселений"
 mod_job_techno_priest_per_pop_short:0 "\n§G+1§! £mod_job_techno_priest_add£ за каждые $VALUE$ £pop£"

 civic_socialistic:0 "Рабочее Братство"
 civic_socialistic_desc:0 "В этом обществе представителей рабочего класса традиционно превозносят, а само общество строится как единое глобальное сообщество на идеалистических принципах коллективизма и равенства.\n\n§YГорнодобывающие§!, §Yсельскохозяйственные§! и §Yгенераторные§! районы дают по §G+1§! должности и §G+1§! жилью, но их содержание увеличено на §R+15%§!.\nОткрывается особая должность рабочего: £job_primitive_laborer£ §Y$job_labour_hero$§!, производящая небольшое количество $r_minerals$, $r_food$, $r_energy$ и $r_unity$."

 civic_environmentalist:0 "Природное наследие"
 civic_environmentalist_desc:2 "В этом обществе природа считается национальным достоянием, которое следует сохранять и осмотрительно использовать ради общего блага."

 #\n\n§YCompetitive§! ethic: buildings §YFood Processing Facility§! and §YFood Processing Center§! provide additional £job_merchant£ §YMerchant§! jobs"

 civic_master_engineer:0 "Мастера-инженеры"
 civic_master_engineer_desc:0 "Эта Цивилизация известна своими глубокими традициями инженерного и архитектурного дела."

 #References food policy "rationing"
 civic_land_of_plenty:0 "Земля изобилия"
 civic_land_of_plenty_desc:0 "Это общество придерживается идеи, что промышленное развитие должно служить обществу: оно создаёт комфортную среду для труда и жизни и стремится как можно полнее удовлетворять материальные потребности населения.\n\n§WСеть беспилотников§! охватывает всё — от густонаселённых районов до необитаемых территорий — и выполняет огромное количество транспортных, ремонтных, патрульных и иных задач. Управление этой системой требует круглосуточной работы множества §Wдиспетчеров БПЛА§!. Работа этих диспетчеров даёт §Wмультипликативный§! бонус к производству большинства ресурсов, поэтому густонаселённые планеты становятся всё продуктивнее.\n§W$BOB_industry_tooltip$§!"

 civic_commonwealth:0 "Традиционализм"
 civic_commonwealth_desc:0 "Эта цивилизация характеризуется сильным чувством духовного единства Граждан, стремлением к сохранению и развитию культурной общности."

 #"This capitalistic society considers all natural resources as something to be either utilized or commodified. They have little concern of possible environmental outcomes and only focus on short term economic gratification. \n\nCan learn §YDeep Core Mining§! technology, allowing to construct §YThermal Borehole§! and hire §YDeep Core Engineers§! \n\n§YEntrepreneurs§! faction will be happy for §YConsumer Benefits§! trade policy"

 civic_military_junta:0 "Военный совет"
 civic_military_junta_desc:0 "В правительстве этого общества господствует коалиция наиболее влиятельных военных лидеров."

 civic_peaceful_republic:0 "Утопическая демократия"
 civic_peaceful_republic_desc:0 "Пацифистская форма республики, граждан которой объединяет национальный идеал свободной, мирной и благополучной жизни для каждого."

 civic_cyber_demos_cratos:0 "Кибердемократия"
 civic_cyber_demos_cratos_desc:0 "Передовые информационные технологии и массовые коммуникации позволяют создать чрезвычайно эффективную децентрализованную систему управления. Но высокая зависимость от технологий в свободном обществе порой оборачивается всплесками киберпреступности."

 civic_science_directorate:0 "Научный директорат"
 civic_science_directorate_desc:0 "На правительство оказывает огромное влияние комитет самых выдающихся учёных государства."

 civic_executive_committee:0 "Собрание философов"
 civic_executive_committee_desc:0 "За деятельностью правительства традиционно наблюдает совет самых умных и достойных философов государства."

 civic_cyber_dictatorship:0 "Кибердиктатура"
 civic_cyber_dictatorship_desc:0 "Это разновидность технократической диктатуры: в вопросах безопасности и управления государство во многом полагается на суперкомпьютеры. Но чем больше власти передаётся искусственному интеллекту, тем меньше обычные граждане влияют на государственное управление."

 civic_ruthless_competition_desc:0 "Рабочий класс этой мегакорпорации вынужден вести безжалостную борьбу друг с другом за крохи, оставшиеся после правящего класса собственников. Подавление профсоюзов, нерегулируемые фабрики и шахты определяют жизнь на её мирах. Более того, подрыв организованного труда не ограничивается собственными владениями корпорации. В этой галактике каждый сам за себя."

 #missing description
 civic_centralized_state:0 "Централизованная Власть"
 civic_centralized_state_desc:0 " "

 civic_exalted_priesthood:0 "Теократия"
 civic_exalted_priesthood_desc:0 "Чтобы оградить общество от ереси, все высшие административные должности здесь занимают религиозные лидеры."

 civic_citizen_service:0 "Стратократическая республика"
 civic_citizen_service_desc:0 "Полное гражданство и связанная с ним политическая ответственность доступны лишь тем, кто прошёл военную службу. Служба гарантирует гражданство, а вместе с ним — право избирать и управлять."

 civic_idealistic_foundation:0 "Идеологические основы"
 civic_idealistic_foundation_desc:0 "Это общество построено на идеалах свободы и равенства и отличается значительно ослабленной властью центрального правительства."

 civic_hierarchy:0 "Непоколебимая Иерархия"
 civic_hierarchy_desc:0 "В этом обществе вся политическая власть сконцентрирована в руках небольшой группы правящей элиты, которая безжалостно подавляет и эксплуатирует рабочий класс."  

 civic_nationalistic_zeal:1 "Империализм"

 FANATIC_LIBERTARIAN_GOVERNMENT:0 "Политический Плюрализм"
 NO_FANATIC_LIBERTARIAN_GOVERNMENT:0 "Отсутствие Политического Плюрализма"
 FANATIC_LIBERTARIAN_GOVERNMENT_DESC:0 "Все Фракции, кроме §YТоталитаристов§! и §YАристократов§!, будут более счастливы, если гражданская модель §YПолитический Плюрализм§! будет активна." 

