 factions.1.desc.prosperity:1 "Члены этой фракции требуют сосредоточиться на социальном и экономическом процветании, а стабильности добиваться мирными средствами."
 factions.1.desc.progressive:0 "Члены этой фракции выступают за свободу и справедливость для всех жителей нашего государства.\n\n"
 factions.1.desc.conservatives:0 "Члены этой фракции добиваются более выгодного индивидуального учета заслуг и достижений каждого человека.\n\n"
 factions.1.desc.bankers:0 "Члены этой фракции требуют сделать финансовый рост и развитие свободного рынка общегосударственным приоритетом.\n\n"
 factions.1.desc.socialists:0 "Члены этой фракции выступают за экономическое равенство для всех жителей государства.\n\n"
 factions.1.desc.labourites:1 "Члены этой фракции выступают за борьбу с элитизмом и равные социальные возможности для всех."
 factions.1.desc.environmentalists:0 "Члены этой фракции выступают за защиту окружающей среды.\n\n"
 factions.1.desc.manufacturers:0 "Члены этой фракции настойчиво добиваются ускоренного промышленного развития государства.\n\n"

 factions.2000.desc.prosperity:0 "После включения этой фракции в правительство государство стало заметно больше тяготеть к §Hимпериализму§!.\n\n"
 factions.2000.desc.progressive:0 "После включения этой фракции в правительство государство стало заметно больше тяготеть к §Hлибертарианству§!.\n\n"
 factions.2000.desc.conservatives:0 "В результате привлечения этой фракции в состав правительства, они стали более §HЭлитарными§!.\n\n"
 factions.2000.desc.bankers:0 "После включения этой фракции в правительство государство стало заметно больше тяготеть к §Hконкуренции§!.\n\n"
 factions.2000.desc.socialists:0 "После включения этой фракции в правительство государство стало заметно больше тяготеть к §Hкооперации§!.\n\n"
 factions.2000.desc.labourites:0 "В результате привлечения этой фракции в состав правительства, они стали более §HПлюралистичными§!.\n\n"
 factions.2000.desc.environmentalists:0 "После включения этой фракции в правительство государство стало заметно больше тяготеть к §Hэкоцентризму§!.\n\n"
 factions.2000.desc.manufacturers:0 "После включения этой фракции в правительство государство стало заметно больше тяготеть к §Hиндустриализму§!.\n\n"

