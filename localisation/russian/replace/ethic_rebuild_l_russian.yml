 civic_timocracy:0 "Тимократия"
 civic_timocracy_desc:0 "Это «народная аристократия» — элитарная республика, где значительная часть населения лишена многих прав ради усиления богатого высшего класса. Позволяет демократическим формам правления выбирать гражданскую модель §H«Кастовая система»§!."

 gov_demos_cratos:0 "Прямая демократия"
 gov_demos_cratos_desc:0 "Форма демократии, при которой граждане сами принимают решения по политическим вопросам — непосредственным голосованием или достижением консенсуса."
 auth_democratic:0 "Непрямая демократия"
 auth_democratic_desc:0 "При непрямой демократии регулярно проводятся выборы, на которых все граждане могут голосовать за тех, кто будет представлять их интересы."

 gov_plutocratic_oligarchy:0 "Плутократия"
 gov_plutocratic_oligarchy_desc:0 "Форма олигархии, в которой власть принадлежит комитету богатых и влиятельных лидеров, управляющих огромным бюрократическим аппаратом, контролирующим все государственные дела."

 gov_anarchy_state:0 "Анархо-синдикализм"
 gov_anarchy_state_desc:0 "Основные принципы анархо-синдикалистского общества — солидарность, прямая демократия и рабочее самоуправление. Синдикалисты видят в своей экономической системе и способ укрепить самостоятельность трудящихся, и альтернативу капитализму: кооперативную экономику, основанную на демократических ценностях и производстве ради общественных потребностей."

 gov_popular_front:0 "Народный фронт"
 gov_popular_front_desc:0 "Основные принципы анархо-синдикалистского общества — солидарность, прямая демократия и рабочее самоуправление. Народный фронт объединяет вокруг этих идей партии рабочего и среднего класса, включая либеральные и социал-демократические силы, перед лицом общей угрозы фашизма и рабовладения."
 
 gov_trade_union_corporate:0 "Профсоюз"
 gov_trade_union_corporate_desc:0 "Главная задача профсоюза — уравновесить власть владельцев капитала, объединив работников. Вместе они могут вести переговоры с работодателем на куда более равных условиях."
 
 gov_trade_combine:0 "Мегакорпоративный комбинат"
 gov_trade_combine_desc:0 "Отношения между рабочим и высшим классами здесь сложны. Их интересы выглядят согласованными лишь потому, что рабочий класс веками подвергался систематической индоктринации и угнетению."
 
 gov_aristocratic_combine:0 "Аристократический конгломерат"
 gov_aristocratic_combine_desc:0 "Отношения между рабочими и высшими слоями здесь сложны. Их цели удаётся согласовать лишь благодаря хрупкому равновесию между социальными сословиями."
 
 gov_aristocratic_megacorp:0 "Аристократическая мегакорпорация"
 gov_aristocratic_megacorp_desc:0 "Мегакорпорация этого общества принадлежит богатой знати, контролирующей назначенных управляющих. В этой феодальной системе слова «работник» и «крепостной» нередко оказываются почти взаимозаменяемыми."
 
