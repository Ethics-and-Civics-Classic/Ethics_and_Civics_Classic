 civic_peoples_republic:0 "Диктатура Пролетариата"
 civic_peoples_republic_desc:0 "Меритократическая форма диктатуры. Парламент существует, но в нём доминирует единственная политическая сила — так называемая Народная партия."

 civic_tribal_aristocracy:0 "Незыблемая Каста"
 civic_tribal_aristocracy_desc:0 "Это общество подвержено строгой форме расслоения, население жёстко разделено на иерархические касты хозяев и рабов. Обязано использовать §Hкастовую систему§!. Здание §HНовый Колизей§! даёт дополнительно §G+1§! §Hединства§! £unity£."

 civic_noble_aristocracy:0 "Король Философ"
 civic_noble_aristocracy_desc:0 "Этим обществом управляет идеалистическая аристократия — нравственная и интеллектуальная элита, правящая на основе меритократических принципов."

 tech_pragmatic_dev:0 "Прагматичное Планетарное Развитие"
 tech_pragmatic_dev_desc:0 "Открывает планетарный указ §YПрагматичное Планетарное Развитие§!, позволяющий увеличить место доступное для обработки на 2 клетки, слегка снижая §YПригодность§! планеты."

 tech_div_crusade:0 "Зов Богов"
 tech_div_crusade_desc:0 "Открывает указ §YКрестовый Поход§!. Пацифисты могут объявлять войны при активации этого указа."

 civic_tooltip_corporate_dominion_effects:0 "$t$- Должности £job_entrepreneur£ §Y$job_entrepreneur_plural$§! дополнительно производят $mod_pop_job_trade_mult$ и увеличивают местное производство $r_strategic_plural$.$TABBED_NEW_LINE$- На старте изучена технология §Y$tech_space_trading$§!.$TABBED_NEW_LINE$- Производство $r_trade$ у §YТорговых узлов§! увеличено на §G+4§!.$TABBED_NEW_LINE$- §YТорговый мегаплекс§! даёт дополнительные должности £job_entrepreneur£ $job_entrepreneur_plural$.$TABBED_NEW_LINE$- Фракция §Yпредпринимателей§! получает дополнительное одобрение при использовании торговой политики §Y«Торговая лига»§!.\n$BOB_forum_tooltip$"

