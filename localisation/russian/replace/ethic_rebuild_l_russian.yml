 economic_stance_default_desc:0 "Базовый смешанный экономический уклад."

 job_slave_master:0 "Надсмотрщик"
 job_slave_master_plural:0 "Надсмотрщики"
 job_slave_master_desc:0 "Влиятельный представитель могущественной гильдии работорговцев."
 job_slave_master_effect_desc:0 "£job_slave_master£ $job_slave_master_plural$ производят $r_unity$, увеличивают §Yпроизводительность рабов§! и дают §G+5§! $r_stability$."
 mod_job_slave_master_add:0 "Должности $job_slave_master$"
 mod_job_slave_master_per_pop:0 "§G+1§! должность $job_slave_master$ за каждые $VALUE$ поселений"
