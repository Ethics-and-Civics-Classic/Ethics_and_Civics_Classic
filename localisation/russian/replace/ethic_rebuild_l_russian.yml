 job_druid:0 "Друид"
 job_druid_plural:0 "Друиды"
 job_druid_desc:0 "Друид проповедует почитание сил природы и путь духовного возвышения. Друиды исцеляют общество и телом, и духом.\n\n§R!§! §WДля должности требуется§! £pops£ §H$ethic_green$§! §Wили§! £pops£ §H$ethic_spiritualist$§!"
 job_druid_effect_desc:0 "£job_priest£ §Y$job_druid_plural$§! производят значительное количество $r_unity$, хотя на мирах без £blocker£ ['concept_natural_blockers'] их производство единства заметно ниже. £job_priest£ §Y$job_druid_plural$§! также снижают £crime£ §Yпреступность§!, немного повышают §Yскорость роста поселений§! и привлекательность £pops£ §H$ethic_green$§! и £pops£ §H$ethic_spiritualist$§!."
