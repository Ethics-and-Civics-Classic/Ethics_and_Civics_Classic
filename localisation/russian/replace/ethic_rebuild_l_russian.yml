 civic_slave_race:0 "Рабская раса"
 civic_slave_race_desc:0 "Второй, искусственно созданный и физически очень сильный вид стал неотъемлемой частью этого общества. Основной вид объявил его представителей низшими существами, пригодными лишь для тяжёлого труда и всевозможных безжалостных генетических экспериментов."

 gov_xenophile_democracy:0 "Мультикультурная демократия"
 gov_xenophile_democracy_desc:0 "Этим обществом управляет избранный парламент, в который входят наиболее уважаемые представители разных видов и культур, разделяющих общий мир."

 trait_symbiotic:0 "Симбиоты"
 trait_symbiotic_desc:0 "§LЭтот вид эволюционировал бок о бок с другим, более развитым видом. Несмотря на это, его представители считаются равными основному виду мира и составляют неотъемлемую часть общества.§!"

 trait_slave_gene:0 "Рабский ген"
 trait_slave_gene_desc:0 "§LЭтот вид был генетически спроектирован для рабского труда: его сила и выносливость повышены ценой умственных способностей. Изменения биологии привели к росту числа мертворождений и младенческой смертности, поскольку вмешательство нарушило естественный баланс, необходимый для нормального раннего развития.§!"

