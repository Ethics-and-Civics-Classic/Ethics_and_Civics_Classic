 civic_divine_order:0 "Кастовая система"
 civic_divine_order_desc:0 "Это общество организовано в виде жёсткой кастовой системы, основанной на древних и сложных культурных традициях. Считается, что каждый социальный слой исполняет заранее предначертанную ему роль.\n\n§WСчитается продвинутой версией гражданской модели§! §Y«$civic_slaver_guilds$»§!§W.§!"

 witch_hunt:0 "Охота на ведьм"
 witch_hunt_desc:0 "На этой планете ведётся кампания по преследованию еретиков."

 civic_circular_economy:0 "Экономика замкнутого цикла"
 civic_circular_economy_desc:0 "Эта система широко применяет повторное использование, восстановление и переработку, превращая отходы материалов и энергии в сырьё для других процессов. Её цель — создать экономически эффективный замкнутый цикл, сводящий к минимуму потребление первичных ресурсов, образование отходов и загрязнение окружающей среды."

 mod_station_gatherers_upkeep_mult:0 "Содержание Добывающих Станций"

 DEEP_MINING:0 "Позволяет исследовать технологию §Y«Глубинная разработка недр»§!, построить §YТермальную скважину§! и нанимать £job_deep_miner£ $job_deep_miner_plural$."

 ETHIC_FANATIC_STORM_RESEARCH:0 "\nШанс получить варианты исследования §Yтехнологий космических бурь§!: §G+20%§!"
 ETHIC_STORM_RESEARCH:0 "\nШанс получить варианты исследования §Yтехнологий космических бурь§!: §G+10%§!"
 
 building_national_park:0 "Национальный экопарк"
 building_national_park_desc:0 "Природные чудеса этой планеты объявлены достоянием государственного значения и взяты под особую охрану.\n\nРасчистка §Yприродных§! £blocker£ препятствий потребует дополнительных затрат влияния."

 gov_timocracy:0 "Тимократия"
 gov_timocracy_desc:0 "Республиканское государство, в котором право голосовать и быть избранным определяется размером принадлежащей гражданину собственности."

 civic_anarchy_ideals:0 "Анархистские идеалы"
 civic_anarchy_ideals_desc:0 "Это общество основано на неприятии любых форм несправедливой политической или социальной иерархии. $civic_civil_education_desc$"

 civic_anarchy_utopia:0 "Анархистская утопия"
 civic_anarchy_utopia_desc:0 "Это общество основано на неприятии любых форм несправедливой политической или социальной иерархии. Поэтому источником подлинных инноваций здесь считается личное вдохновение. Открытые патенты, широта взглядов, стихийное сотрудничество и вознаграждение за новаторство прокладывают путь прогрессу. Многие по праву считают это государство свободной гаванью: здесь рады всем — усталым, бедным и гонимым, жаждущим свободно дышать, независимо от вида и происхождения. $civic_civil_education_desc$"
 civic_anarchy_utopia_effects:0 "$t$- Открывает уровень жизни §Y$living_standard_community_labor$§!, при котором все £pop£ §Yпоселения§! имеют высокое содержание в £consumer_goods£ §Y$consumer_goods$§! независимо от §Yсоциального слоя§! $TABBED_NEW_LINE$- Запрещает большинство других §Yуровней жизни§!$TABBED_NEW_LINE$- $civic_crowdsourcing_anarchy_effects$\n$civic_anarchy_ideals_effects$"
 civic_crowdsourcing_anarchy_effects:0 "$t$— Вскоре после начала игры в государстве появятся фракции.$TABBED_NEW_LINE$— Открывает указ §H«$civic_crowdsourcing_edict$»§!.$TABBED_NEW_LINE$— Фракции распределяют производимый ими объём между $r_research$ и $r_unity$."
 
 civic_crowdsourcing_edict:0 "Краудсорсинговая инициатива"
 edict_civic_crowdsourcing_edict:0 "Краудсорсинговая инициатива"
 edict_civic_crowdsourcing_edict_desc:0 "Поощрять открытые патенты, широту взглядов, стихийное сотрудничество и новаторство во всех отраслях, чтобы общими усилиями приблизить лучшее будущее."
 edict_civic_crowdsourcing_edict_effect:0 "Фракции производят $r_research$ вместо $r_unity$."
 edict_civic_crowdsourcing_edict_anarchy_effect:0 "Фракции распределяют своё производство между $r_research$ и $r_unity$."
 
