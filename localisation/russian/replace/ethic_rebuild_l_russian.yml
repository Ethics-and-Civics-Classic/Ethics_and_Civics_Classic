l_russian:

 INSULT_PROPOSE_COL_IND:0 "Так [Root.GetName] всё-таки настоящее государство или просто анархичная свора вечно ссорящихся индивидуалистов? Простите, но при вашей политической системе это и правда трудно понять."
 02_INSULT_PROPOSE_COL_IND:0 "И кто сегодня правит вашей забавной маленькой звёздной державой? Какая занятная идея — «голосовать», чтобы привести кого-то к власти! Разумеется, рано или поздно это вас погубит."
 03_INSULT_PROPOSE_COL_IND:0 "Ваши демократические идеалы — язва на теле галактики. Как и [Root.GetName]."
 04_INSULT_PROPOSE_COL_IND:0 "Какой эгоистичный народ: каждый ставит себя превыше всего. Либертарианство... ха! [Root.GetName] и года не протянет."
 01_INSULT_PROPOSE_IND_COL:0 "Ваш жестокий тиранический режим однажды рухнет. И тогда придёт время расплаты."
 02_INSULT_PROPOSE_IND_COL:0 "Вы хоть раз думали о том, чтобы позволить гражданам думать самостоятельно? Если боитесь, что это станет концом [Root.GetName&gen], то совершенно правы."
 03_INSULT_PROPOSE_IND_COL:0 "Печально, что такие авторитарные государства, как [Root.GetName], вообще существуют. Позор для всех разумных существ галактики."
 04_INSULT_PROPOSE_IND_COL:0 "Жестокое угнетение тех, кто живёт под игом [Root.GetName&gen], однажды закончится. Ваша иерархия вас же и погубит."
 16_FRIENDLY_GREETING:1 "Ваше правительство успешно сдерживает крайние проявления либертарианства, [From.GetSpeciesNamePlural]."
 14_FRIENDLY_GREETING:0 "Хотя мы предпочитаем свободные общества, нельзя отрицать: ваше правительство умеет обеспечивать своим гражданам стабильность."
 ENSLAVED_DESC:0 "Это поселение порабощено. Порабощённые поселения вызывают недовольство у всех либертарианских поселений на этой планете."
 COL_LABEL:0 "Авторитаризм <-> Либертарианство"

 ### Toxic Baths
 #civic_toxic_baths: "Мутагенные спа"
 #civic_corporate_toxic_baths: "Мутагенная роскошь"
 #civic_hive_toxic_baths: "Резервуары для преобразования"
 #civic_machine_toxic_baths: "Емкости для гиперсмазки"
 #civic_tooltip_hive_toxic_baths_effects: "Можно строить §Yмутагенные резервуары для преобразования§!\nКаждый §Yоператор преобразования§! обеспечивает:\nСкорость прироста биологических поселений: §G+2%§! за §Hпромышленный район§!\nПриспособленность: §R−0,75%§! за §Hпромышленный район§!"
 #civic_tooltip_machine_toxic_baths_effects: "Можно строить §Yпроизводственные емкости§!\nКаждый §Yсмазочный терминал§! обеспечивает:\nСкорость сбора поселений: §G+1,5%§! за §Hпромышленный район§!\nИспользование благ: §R+1%§! за §Hпромышленный район§!"
 #civic_toxic_baths_desc: "Эта цивилизация проводит ритуальные омовения в мутагенах, во время которых профессиональные операторы контролируют применение крайне опасных веществ. Подобное «оздоровление» может ужаснуть непосвященного наблюдателя."
 #civic_corporate_toxic_baths_desc: "Эта цивилизация проводит омовения в мутагенах, во время которых профессиональные операторы контролируют применение крайне опасных веществ. Подобное «оздоровление» обозначено как необходимый шаг на пути к благополучию и личностному росту."
 #civic_hive_toxic_baths_desc: "Этот разум улья использует мутагенные резервуары для выведения, в которых специализированные операторы следят за ростом новых трутней. Этот процесс сильно вредит окружающей среде."
 #civic_machine_toxic_baths_desc: "Это государство машин улучшает свои базовые дроны с помощью интенсивного использования крайне агрессивных смазочных веществ, за применением которых следят тщательно запрограммированные терминалы. Этот «оптимизированный» процесс обычно полагается на излишки побочных продуктов промышленности, которые теперь используются для иных целей во имя эффективности."
 #civic_tooltip_not_mutagenic: "НЕТ гражданской модели «['concept_mutagenic_civics']»"
 #concept_mutagenic_civics: "Мутагенные спа"
 #concept_mutagenic_civics_desc: "К гражданским моделям «$concept_mutagenic_civics$» относятся:\n• ['civic:civic_toxic_baths']$NEW_LINE$• ['civic:civic_toxic_baths_individual_machine']$NEW_LINE$• ['civic:civic_corporate_toxic_baths']$NEW_LINE$• ['civic:civic_corporate_toxic_baths_individual_machine']$NEW_LINE$• ['civic:civic_hive_toxic_baths']$NEW_LINE$• ['civic:civic_machine_toxic_baths']"
 #building_toxic_bath: "Мутагенные спа"
 #building_toxic_bath_hive: "Мутагенные резервуары для преобразования"
 #building_toxic_bath_machine: "Емкости для гиперсмазки"
 #building_toxic_bath_desc: "Хотя мутагенные спа являются продвинутыми терапевтическими центрами и их положительное влияние на здоровье хорошо изучено, некоторые все равно с отвращением относятся к используемым в них методам. Каждая капля жидкости из этих ванн обладает большей мутагенностью, чем большинство запрещенных в галактике веществ."
 #building_toxic_bath_hive_desc: "Мутагенные резервуары для преобразования являются олицетворением высот, которых может достичь улей при полной концентрации на производстве новых тел для непрерывно растущего сознания."
 #building_toxic_bath_machine_desc: "Емкости для гиперсмазки являются наиболее логичным ответом на проблемы с трением, перегревом и статическим электричеством при производстве новых единиц. "
 #job_bath_attendant: "Оператор мутагенных спа"
 #job_bath_attendant_hive: "Оператор преобразования"
 #job_bath_attendant_machine: "Смазочный терминал"
 job_bath_attendant_desc:0 "Обученные операторы мутагенных ванн. Их предназначение — поддерживать здоровье клиентов с помощью самых разных процедур, включая интенсивную детоксикацию и тщательно контролируемую дегенерацию генотипа.\n\n§R!§! §WДля должности требуется§! £pops£ §H$ethic_industrial$§!"
 #job_bath_attendant_hive_desc: "Специализированные единицы разума, выращенные с единственной целью — надзирать за процессом преображения во время создания новых биологических трутней для улья."
 #job_bath_attendant_machine_desc: "Смазочные терминалы — это специально запрограммированные дроны, контролирующие погружное производство новых корпусов и тщательно отслеживающие нанесение смазочных материалов во время процесса."
