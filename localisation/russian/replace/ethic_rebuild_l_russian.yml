 building_thermal_borehole:0 "Термальная скважина"
 building_thermal_borehole_desc:0 "Термальная скважина проходит сквозь мантию планеты почти до самого ядра. Она открывает доступ к богатым запасам минералов и энергии, но огромный объём высвобождаемого тепла способен серьёзно повредить окружающей среде."

