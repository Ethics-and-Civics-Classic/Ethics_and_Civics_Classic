 job_geoengineer_desc:0 "Учёный, специализирующийся на изучении физических свойств планетарных тел."
 job_geoengineer_effect_desc:0 "£job_researcher£ $job_geoengineer_plural$ производят значительное количество $r_engineering$ и $r_physics$."
