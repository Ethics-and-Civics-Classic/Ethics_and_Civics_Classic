 gov_national_socialism:0 "Фашистский режим"
 gov_national_socialism_desc:0 "Форма крайне авторитарного ультранационализма, для которой характерны диктаторская власть, насильственное подавление оппозиции и жёсткая регламентация общественной жизни."

 civic_aristocratic_elite:0 "Родовая аристократия"
 civic_aristocratic_elite_desc:0 "В этом обществе укоренилось сословие знати, занимающее верхние ступени социальной иерархии."

 civic_aristocratic_elite_corporate:0 "Родовая аристократия"
 civic_aristocratic_elite_corporate_desc:0 "В этом обществе укоренилось сословие знати, занимающее верхние ступени социальной иерархии мегакорпорации."

 TOTALITARIAN_STRATIFICATION_DESC:1 "Экономически стратифицированное общество — при уровне жизни §Y«Достойные условия»§!, §Y«Стратифицированная экономика»§! или §Y«Привилегия образования»§! — понравится [Root.GetName&dat]."

 gov_par_monarchy:0 "Парламентская монархия"
 gov_par_monarchy_desc:0 "Государство возглавляет монарх, почти не участвующий в формировании и проведении политики. Реальная власть принадлежит сформированному из парламентариев кабинету министров во главе с премьер-министром."

 civic_naval_traditions:0 "Флотские традиции"
 civic_naval_traditions_desc:0 "В этом обществе глубоко укоренились славные флотские традиции, благодаря которым здесь воспитывают множество выдающихся командиров кораблей."

 civic_spiritual_democracy:0 "Теократическая республика"
 civic_spiritual_democracy_desc:0 "Форма республики, граждан которой объединяют религиозная традиция, прочные моральные ценности и этические императивы."


 glorious_fleet:0 "Славная победа!"
 unglorious_fleet:0 "Горе побеждённым!"

 civic_police_state:0 "Полицейское государство"
 civic_police_state_desc:0 "Чтобы подавить любые проявления инакомыслия, население этого репрессивного общества находится под пристальным надзором и контролем разветвлённой внутренней полиции."


 gov_peoples_republic:0 "Народная республика"
 gov_peoples_republic_desc:0 "Эгалитарная по форме диктатура: парламент здесь действительно существует, но полностью контролируется одной политической силой — так называемой Народной партией."

 empire_not_capitalism:0 "$TRIGGER_FAIL$Наша Империя не поддерживает необходимый идеал - §Y$ethic_capitalism$§!."
 
 job_supervisor:0 "Мыслитель"
 job_supervisor_plural:0 "Мыслители"
 job_supervisor_desc:0 "Философы и интеллектуалы, которым поручено формулировать и исследовать сами принципы устройства их общества."
 job_supervisor_effect_desc:0 "£job_supervisor£ $job_supervisor_plural$ производят $r_unity$ и $r_society$, а также увеличивают $r_amenities$."
 mod_job_supervisor_add:0 "Должности $job_supervisor$"
 mod_job_supervisor_per_pop:0 "§G+1§! должность $job_supervisor$ за каждые $VALUE$ поселений"
 mod_job_supervisor_per_pop_short:0 "\n§G+1§! £mod_job_supervisor_add£ за каждые $VALUE$ £pop£"
 
 civic_stratocracy:0 "Упорядоченная стратократия"
 civic_stratocracy_desc:0 "В стратократии государство и вооружённые силы фактически и юридически представляют собой одно целое. Административные должности обычно занимают действующие офицеры или военные, почётно вышедшие в отставку."
 
 civic_bureaucracy:0 "Просвещённая бюрократия"
 civic_bureaucracy_desc:0 "В этом обществе государственным управлением традиционно руководят философы и мыслители, которых считают идеальными правителями благодаря их уму, надёжности и стремлению к мирной и благополучной жизни."
 
 gov_bur_collectivism:0 "Бюрократический коллективизм"
 gov_bur_collectivism_desc:0 "В государстве бюрократического коллективизма средства производства принадлежат государству, однако прибавочный продукт и прибыль распределяются прежде всего среди партийно-бюрократической элиты, а не рабочего класса."

 job_commandante:0 "Командующий"
 job_commandante_plural:0 "Командующие"
 job_commandante_desc:0 "Опытный военный офицер, находящийся на действительной службе или с почётом вышедший в отставку."
 job_commandante_effect_desc:0 "£job_commandante£ $job_commandante_plural$ увеличивают $i_naval_capacity$ государства, создают £defense_army£ §Yоборонительные армии§!, повышают $r_stability$ на планете, снижают урон от §Yбомбардировки§! и производят небольшое количество $r_amenities$."
 mod_job_commandante_add:0 "Должности $job_commandante$"
 mod_job_commandante_per_pop:0 "§G+1§! должность $job_commandante$ за каждые $VALUE$ поселений"
 mod_job_commandante_pop_short:0 "\n§G+1§! £mod_job_commandante_add£ за каждые $VALUE$ £pop£"

 job_commandante_pirate:0 "Пиратский капитан"
 job_commandante_pirate_plural:0 "Пиратские капитаны"
 job_commandante_pirate_desc:0 "Пиратскому капитану нередко приходится быть и политиком: составлять правила для команды и договариваться о том, какой курс она будет проводить."
 job_commandante_pirate_effect_desc:0 "£job_commandante_pirate£ $job_commandante_pirate_plural$ увеличивают $i_naval_capacity$ государства, создают £defense_army£ §Yоборонительные армии§!, повышают $r_stability$ на планете, снижают урон от §Yбомбардировки§! и производят небольшое количество $r_amenities$."
 mod_job_commandante_pirate_add:0 "Должности $job_commandante_pirate$"
 mod_job_commandante_pirate_per_pop:0 "§G+1§! должность $job_commandante_pirate$ за каждые $VALUE$ поселений"
 mod_job_commandante_pirate_pop_short:0 "\n§G+1§! £mod_job_commandante_pirate_add£ за каждые $VALUE$ £pop£"
 
 gov_enlighted_socialism:0 "Просвещённый деспотизм"
 gov_enlighted_socialism_desc:0 "Форма социалистической диктатуры, в которой мудрый правитель, избранный пожизненно, безоговорочно считается просвещённым архитектором светлого будущего."

 RT_SAGE:0 "Мудрец"
 HT_PROSELYTE:0 "Новообращённый"
 
 gov_dread_brotherhood:0 "Братство ужаса"
 gov_dread_brotherhood_desc:0 "Крайне ксенофобная форма прямой демократии, в которой всех граждан объединяет одна общая цель — уничтожение всех низших форм жизни в галактике."
 
 RT_BROTHER:0 "Брат"
 RT_SISTER:0 "Сестра"
 
 PROGRESSIVE_NO_WELFARE:0 "Нет социальному равенству"
 NO_PROGRESSIVE_NO_WELFARE:0 "Нет социальному равенству"
 PROGRESSIVE_NO_WELFARE_DESC:0 "Использование уровня жизни §Y«Социальное равенство»§!, §Y«Социальное обеспечение»§! или §Y«Утопическое изобилие»§! не понравится [Root.GetName&dat]."

 PROGRESSIVE_NO_STRATIFIED_DESC:0 "Если хотя бы часть жителей нашего государства будет использовать уровень жизни §Y«Стратифицированная экономика»§! или §Y«Привилегия образования»§!, это очень не понравится [Root.GetName&dat]."

 gov_absolute_monarchy:0 "Абсолютная монархия"
 gov_absolute_monarchy_desc:0 "Форма монархии, при которой монарх обладает верховной властью, не ограниченной писаными законами, законодательными органами или обычаями."

 gov_cor_dictatorship:0 "Корпоративная диктатура"
 gov_cor_dictatorship_desc:0 "Крайне капиталистическая форма правления, при которой могущественные корпорации полностью подчинили себе политическую и экономическую жизнь общества."

 #civic_slaver_guilds_desc:0 "A number of powerful and ruthless slaver guilds dominates the economy. Private enterprises traditionally rely on slave labor force, and they know how to get the profits out of it. \n\nAllows to set §YEnslavement Rate§! policy, from §G10%§! to §G30%§!."

 NO_FREE_MEDIA:0 "Нет Свободе СМИ"
 NO_FREE_MEDIA_DESC:0 "Политика §YСвободные СМИ§! расстраивает [Root.GetName]."

 job_xenobiologist:0 "Ксенобиолог"
 job_xenobiologist_plural:0 "Ксенобиологи"
 job_xenobiologist_desc:0 "Учёный, специализирующийся на изучении инопланетной жизни."
