 civic_slaver_guilds_desc:1 "Это общество традиционно эксплуатирует рабский труд и полагается на услуги особых гильдий, занимающихся обучением и распределением рабов."

 civic_military_dictatorship:0 "Военачальник"
 civic_military_dictatorship_desc:0 "Правителями этого общества исторически становились самые агрессивные и успешные военачальники. В современную эпоху они объединились под единой властью и предлагают другим державам свои военные знания и услуги."

 civic_military_dictatorship_corporate:0 "Пиратский лорд"
 civic_military_dictatorship_corporate_desc:0 "Лидерами этого общества исторически становились самые агрессивные и успешные пираты. Теперь все группировки действуют под единым знаменем Пиратского лорда и, когда не грабят чужие державы, охотно предлагают им же свои пиратские услуги.\n\n§WВсе должности§! £job_manager£ §Y$job_manager$§! §Wзаменяются должностями§! £job_pirate_quartermaster£ §Y$job_pirate_quartermaster$§!§W, а§!\n£building£ §Yстоличные сооружения§! §Wзаменяют все должности§! £job_executive£ §Y$job_executive$§! §Wдолжностями§! £job_commandante_pirate£ §Y$job_commandante_pirate$§!§W.§!\n\n§WПозволяет использовать гражданскую модель§! §C$civic_barbaric_despoilers$§!§W.§!\n\n§WПозволяет использовать политики§! §H$economic_stance_criminal_market$§! §Wи§! §H$economic_policy_criminal$§!§W.§!"
 
