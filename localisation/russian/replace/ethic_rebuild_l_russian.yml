 tech_planetary_unification_desc_hive_mind:0 "Экологическое горнило, в котором мы боролись за выживание, оставило неизгладимые пути в нашей генетической памяти. Мы — непревзойдённое единство всего, что было до нас, и теперь отправляемся в межзвёздное путешествие."
