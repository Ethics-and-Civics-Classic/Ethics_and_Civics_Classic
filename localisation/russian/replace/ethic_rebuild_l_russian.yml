 pragmatic_development_1_desc:0 "Увеличивает размер планеты на 1, снижая её §Yпригодность§! на 2%."
 pragmatic_development_2:0 "Прагматическое развитие II"
 pragmatic_development_2_desc:0 "Увеличивает размер планеты на 1, снижая её §Yпригодность§! на 3%."

