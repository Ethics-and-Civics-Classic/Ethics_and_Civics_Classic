 building_food_bazaar:0 "Большой продуктовый базар"
 building_food_bazaar_desc:0 "Этот огромный торговый район стимулирует производство продуктов питания и приносит удовлетворение жителям планеты."
 building_soil_enrich:0 "Установка по обогащению почвы"
 building_soil_enrich_desc:0 " "
 building_metallurgical_plant:0 "Автоматизированный завод тяжелой промышленности"
 building_metallurgical_plant_desc:0 "Этот объект тяжелой промышленности стимулирует добычу местных полезных ископаемых и способствует развитию инфраструктуры на планете."
 building_wellfare_center:0 "Центр социального обеспечения"
 building_wellfare_center_desc:0 "Местная администрация следит за поддержанием достойных условий жизни общин на планете."
 building_royal_library:0 "Королевская библиотека"
 building_royal_library_desc:0 " "
 building_recreational:0 "Площадка для отдыха"
 building_recreational_desc:0 "Люди приезжают на этот курорт в поисках спокойствия и глубокого психологического отдыха, которые могут дать только очень специальные виды медицины."
 building_sacred_grove:0 "Священная роща"
 building_sacred_grove_desc:0 "Люди со всей империи приезжают в это священное место, чтобы принять участие в ежегодных церемониях. Священные растения, приготовленные и принятые особым образом, учат их жить более мудрой жизнью, принося здоровье уму и телу."
 building_industrial_cap:0 "Промышленная столица"
 building_industrial_cap_desc:0 "Этот массивный высокотехнологичный промышленный комплекс позволяет применять Гипериум на уровне империи, обеспечивая ранее недостижимую промышленную эффективность как в военной, так и в гражданской областях."

