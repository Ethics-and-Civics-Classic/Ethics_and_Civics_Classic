 TOTAL_ISOLATIONISM:0 "Философия Изоляционизма"
 TOTAL_ISOLATIONISM_DESC:0 "Активный принцип §YИзоляционизм§! понравится [Root.GetName&dat]."

 #####

 civic_labour_unions:0 "Профсоюзы"
 civic_labour_unions_desc:0 "Работники этого общества традиционно участвуют в принятии решений и разделяют власть и ответственность на рабочем месте. Благодаря большей вовлечённости и удовлетворённости трудящихся растут производительность и качество услуг.\n\n§WПродвинутая версия этой гражданской модели —§! §Y«Синдикализм»§!§W.§!"

 civic_welfare_state:0 "Социальное государство"
 civic_welfare_state_desc:0 "В этом обществе государство традиционно обладает значительными полномочиями, поскольку играет ключевую роль в защите и укреплении экономического и социального равенства граждан и их благополучия."

 civic_shared_burden:1 "Синдикализм"
 civic_shared_burden_desc:1 "Это общество хранит идеалы синдикализма: хозяйством напрямую распоряжаются сами работники, поэтому ресурсы распределяются справедливее, а социальное и экономическое равенство гарантировано каждому.\n\n§WСчитается продвинутой версией гражданской модели§! §Y«Профсоюзы»§!§W.§!"

 REGULATED_TRADE:0 "Регулируемая торговля: социальный приоритет"
 REGULATED_TRADE_DESC:0 "Торговая политика §Y«Развитие инфраструктуры»§! или §Y«Социальное развитие»§! понравится [Root.GetName&dat]."

