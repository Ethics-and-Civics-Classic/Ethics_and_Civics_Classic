 job_uav_dispatcher:0 "Диспетчер БПЛА"
 job_uav_dispatcher_plural:0 "Диспетчеры БПЛА"
 job_uav_dispatcher_desc:0 "Сеть беспилотников охватывает всё — от густонаселённых районов до безлюдных территорий. Она выполняет перевозки, разведку, техническое обслуживание, патрулирование и множество других задач. Для круглосуточного управления такой системой требуется множество $job_uav_dispatcher_plural$."
 job_uav_dispatcher_effect_desc:0 "£job_uav_dispatcher£ $job_uav_dispatcher_plural$ потребляют §R1§! $r_energy$, увеличивают $r_amenities$, повышают местное производство $r_minerals$ и $r_food$ на §G5%§!, снижают §Yпреступность§! и создают §Yоборонительные армии§!."
 mod_job_uav_dispatcher_add:0 "Должности $job_uav_dispatcher$"
 mod_job_uav_dispatcher_per_pop:0 "§G+1§! должность $job_uav_dispatcher$ за каждые $VALUE$ поселений"
 mod_job_uav_dispatcher_per_pop_short:0 "\n§G+1§! £mod_job_uav_dispatcher_add£ на $VALUE$ £pop£"  

