 decision_create_quicksand_basin:0 "Создать зыбучие пески"
 decision_create_quicksand_basin_desc:0 "Создаёт препятствие §Y«Зыбучие пески»§! на идеальных мирах и естественных обитаемых планетах с сухим климатом."
 decision_create_quicksand_basin_effects_custom:0 "Создаёт препятствие §Y«Зыбучие пески»§! на идеальных мирах и естественных обитаемых планетах с сухим климатом."

 decision_create_noxious_swamp:0 "Создать токсичное болото"
 decision_create_noxious_swamp_desc:0 "Создаёт препятствие §Y«Токсичное болото»§! на идеальных мирах и естественных обитаемых планетах с влажным климатом."
 decision_create_noxious_swamp_effects_custom:0 "Создаёт препятствие §Y«Токсичное болото»§! на идеальных мирах и естественных обитаемых планетах с влажным климатом."

 decision_create_massive_glacier:0 "Создать огромный ледник"
 decision_create_massive_glacier_desc:0 "Создаёт препятствие §Y«Огромный ледник»§! на идеальных мирах и естественных обитаемых планетах с влажным или холодным климатом."
 decision_create_massive_glacier_effects_custom:0 "Создаёт препятствие §Y«Огромный ледник»§! на идеальных мирах и естественных обитаемых планетах с влажным или холодным климатом."

 building_pangalactic_forum:0 "Пангалактический форум"
 building_pangalactic_forum_desc:0 "Предоставляет должность правителя — £job_head_ambassador£ $job_head_ambassador$. Она даёт всему государству бонусы к §Yдипломатическому весу§!, $r_society$, $r_unity$ и $r_trade$ в зависимости от числа §Yуникальных видов§! в государстве. Величина бонусов возрастает от §G10§! до §G100+§! (при 10/25/40/55/70/85/100/100+ видах)."

 job_head_ambassador:0 "Генеральный посол"
 job_head_ambassador_plural:0 "Генеральные послы"
 job_head_ambassador_desc:0 "Один из руководителей §YПангалактического форума§!."
 job_head_ambassador_effect_desc:0 "£job_head_ambassador£ $job_head_ambassador$ даёт всему государству бонусы к §Yдипломатическому весу§!, $r_society$, $r_unity$ и $r_trade$. Их величина зависит от числа §Yуникальных видов§! в государстве и возрастает от §G10§! до §G100+§! (при 10/25/40/55/70/85/100/100+ видах). Затраты в $r_energy$ растут вместе с величиной бонусов."
 mod_job_head_ambassador_add:0 "Должности генеральных послов"
 mod_job_head_ambassador_per_pop:0 "§G+1§! должность $job_head_ambassador$ за каждые $VALUE$ поселений"
 mod_job_head_ambassador_per_pop_short:0 "\n§G+1§! £mod_job_head_ambassador_add£ на $VALUE$ £pop£"

 civic_peacekeepers:0 "Универсализм"
 civic_peacekeepers_desc:0 "Эту цивилизацию ведут к звёздам надежда и вера в мирное сотрудничество всей разумной жизни галактики.\n\n§WСчитается продвинутой версией гражданской модели§! §Y«$civic_diplomatic_corps$»§!§W.§!"

 building_galactic_trade_center:0 "Межзвёздный торговый центр"
 building_galactic_trade_center_desc:0 "Предоставляет должность правителя — £job_head_trader£ $job_head_trader$. Она даёт всему государству бонусы к $r_trade$, §Yдипломатическому весу от силы экономики§!, §Yмаксимуму станций§! и производству $r_consumer_goods$ в зависимости от числа §Yуникальных видов§! в государстве. Величина бонусов возрастает от §G10§! до §G100+§! (при 10/25/40/55/70/85/100/100+ видах)."

 job_head_trader:0 "Координатор торговли"
 job_head_trader_plural:0 "Координаторы торговли"
 job_head_trader_desc:0 "Один из руководителей §YМежзвёздного торгового центра§!."
 job_head_trader_effect_desc:0 "£job_head_trader£ $job_head_trader$ даёт всему государству бонусы к $r_trade$, §Yдипломатическому весу от силы экономики§!, §Yмаксимуму станций§! и производству $r_consumer_goods$. Их величина зависит от числа §Yуникальных видов§! в государстве и возрастает от §G10§! до §G100+§! (при 10/25/40/55/70/85/100/100+ видах). Затраты в $r_energy$ растут вместе с величиной бонусов."
 mod_job_head_trader_add:0 "Должности координаторов торговли"
 mod_job_head_trader_per_pop:0 "§G+1§! должность $job_head_trader$ за каждые $VALUE$ поселений"
 mod_job_head_trader_per_pop_short:0 "\n§G+1§! £mod_job_head_trader_add£ на $VALUE$ £pop£"

 civic_globalism:0 "Глобализм"
 civic_globalism_desc:0 "К звёздам нас влечёт не только очарование неизвестного и чужого, но и прибыль, которую можно извлечь из новых сделок."

 civic_globalism_corporate:0 "$civic_globalism$"
 civic_globalism_corporate_desc:0 "$civic_globalism_desc$"

 building_galactic_temple:0 "Храм галактического единства"
 building_galactic_temple_desc:0 "Предоставляет должность правителя — £job_head_preacher£ $job_head_preacher$. Она даёт всему государству бонусы к $r_unity$, §Yдипломатическому весу от поселений§!, £happiness£ §Yсчастью§!, §Yпривлекательности иммиграции§! и §Yпривлекательности ксенофилии§! в зависимости от числа §Yуникальных видов§! в государстве. Величина бонусов возрастает от §G10§! до §G100+§! (при 10/25/40/55/70/85/100/100+ видах)."

 job_head_preacher:0 "Верховный проповедник"
 job_head_preacher_plural:0 "Верховные проповедники"
 job_head_preacher_desc:0 "Один из руководителей §YХрама галактического единства§!."
 job_head_preacher_effect_desc:0 "£job_head_preacher£ $job_head_preacher$ даёт всему государству бонусы к £unity£ единству, §Yдипломатическому весу от поселений§!, £happiness£ §Yсчастью§! и §Yпривлекательности иммиграции§!. Величина бонусов зависит от числа §Yуникальных видов§! в государстве и возрастает от §G10§! до §G100+§! (при 10/25/40/55/70/85/100/100+ видах). Содержание в £energy£ энергокредитах растёт вместе с величиной этих бонусов."
 mod_job_head_preacher_add:0 "Должности верховных проповедников"
 mod_job_head_preacher_per_pop:0 "§G+1§! должность $job_head_preacher$ за каждые $VALUE$ поселений"
 mod_job_head_preacher_per_pop_short:0 "\n§G+1§! £mod_job_head_preacher_add£ на $VALUE$ £pop£"

 civic_evangelism:0 "Евангелизм"
 civic_evangelism_desc:0 "Жители этой цивилизации искренне верят, что всю разумную жизнь во вселенной связывает высший дух. Теперь они стремятся распространить свою веру по всей галактике."

 building_galactic_navy_academy:0 "Межзвёздный центр военной координации"
 building_galactic_navy_academy_desc:0 "Предоставляет должность правителя — £job_head_commander£ $job_head_commander$. Она даёт всему государству бонусы к §Yвместимости флота§!, §Yдипломатическому весу от силы флота§!, производству $r_trade$ и §Yразмеру агентурной сети§! в зависимости от числа §Yуникальных видов§! в государстве. Величина бонусов возрастает от §G10§! до §G100+§! (при 10/25/40/55/70/85/100/100+ видах). Также должность создаёт местные §Yоборонительные армии§!."

 job_head_commander:0 "Верховный командующий"
 job_head_commander_plural:0 "Верховные командующие"
 job_head_commander_desc:0 "Один из руководителей §YМежзвёздного центра военной координации§!."
 job_head_commander_effect_desc:0 "£job_head_commander£ $job_head_commander$ даёт всему государству бонусы к §Yвместимости флота§!, §Yдипломатическому весу от силы флота§!, производству $r_trade$ и §Yразмеру агентурной сети§!. Величина бонусов зависит от числа §Yуникальных видов§! в государстве и возрастает от §G10§! до §G100+§! (при 10/25/40/55/70/85/100/100+ видах). Содержание в £energy£ энергокредитах растёт вместе с величиной этих бонусов. Также должность создаёт местные §Yоборонительные армии§!."
 mod_job_head_commander_add:0 "Должности верховных командующих"
 mod_job_head_commander_per_pop:0 "§G+1§! должность $job_head_commander$ за каждые $VALUE$ поселений"
 mod_job_head_commander_per_pop_short:0 "\n§G+1§! £mod_job_head_commander_add£ на $VALUE$ £pop£"

 civic_xeno_militarist:0 "Интервенционизм"
 civic_xeno_militarist_desc:0 "Эта цивилизация по природе открыта чужим культурам, но не пренебрегает военной силой, когда считает её необходимой для сохранения баланса сил или исправления очевидной несправедливости."

 civic_keepers_harmony:0 "Хранители гармонии"
 civic_keepers_harmony_desc:0 "Жители этого общества создали духовный культ природы. Чтобы достичь подлинной гармонии с биосферой, его последователи должны в значительной мере отрешиться от мирских удовольствий."

 building_nature_sanctuary:0 "Святилище природы"
 building_nature_sanctuary_desc:0 "Сюда стекаются жители со всей планеты, принося дары Матери-природе. На планете этот памятник повышает производство £unity£ единства, £happiness£ счастье и привлекательность §Yэкоцентризма§! за каждое уникальное природное §Yпрепятствие§!, а его содержание требует $r_food$."

 civic_functional_architecture_desc:1 "Это общество известно простой, но функциональной архитектурой. Некоторые сочли бы этот стиль скучным или даже унылым, однако в большинстве случаев необетон справляется со своей задачей ничуть не хуже любого другого строительного материала."

 civic_eco_warfare:0 "Защитники природы"
 civic_eco_warfare_desc:0 "Этот народ не только готов с оружием в руках защищать свою экосистему, но и научился эффективно применять достижения биологических наук в военном деле.\n\n§WОрганические корабли§!: применение биотехнологий в военном кораблестроении наделяет корабли особыми свойствами, включая регенерацию брони и корпуса, а также повышенную энергоэффективность. Обратная сторона — такие материалы обычно более хрупки, чем неорганические сплавы.\n\n§WВоенная биомедицина§!: повышает здоровье армий."

 COLONIZED_GAIA_WORLDS:0 "Колонизированный гайя-мир"
 COLONIZED_GAIA_WORLDS_DESC:0 "Владение §Yгайя-миром§! понравится [Root.GetName&dat]."

 NATURAL_WONDER:0 "Национальный природный заповедник"
 NATURAL_WONDER_DESC:0 "Владение планетой, где представлены все основные природные препятствия — вулкан, горы, опасная дикая природа, джунгли, болото, водоросли, карстовая воронка, ледник и зыбучие пески, — очень понравится [Root.GetName&dat]."

 PROTECTED_NATURE:0 "Охраняемая природа"
 NO_PROTECTED_NATURE:0 "Найти и защитить внеземную природу"
 PROTECTED_NATURE_DESC:0 "Владение миром с модификатором §Y«Цветущий»§!, §Y«Природная красота»§!, §Y«Блуждающий лес»§! или §Y«Мигрирующие леса»§! понравится [Root.GetName&dat]."

 PROTECTED_WILDLIFE:0 "Охраняемая дикая природа"
 NO_PROTECTED_WILDLIFE:0 "Найти и защитить местную фауну"
 PROTECTED_WILDLIFE_DESC:0 "Владение миром с §Yопасной дикой природой§! — в виде препятствия или модификатора планеты — либо с §Yдикими землями§! понравится [Root.GetName&dat]."

 UNIQUE_LIFEFORMS:0 "Охрана уникальных форм жизни"
 NO_UNIQUE_LIFEFORMS:0 "Найти и защитить уникальные формы жизни"
 UNIQUE_LIFEFORMS_DESC:0 "Владение миром с §Yтитаническими формами жизни§!, §Yнеммами§! или §Yинопланетными питомцами§! очень понравится [Root.GetName&dat]."

 building_tribal_palace:0 "Министерство национальной безопасности"
 building_tribal_palace_desc:0 "По мере роста государства множатся и внешние угрозы, а потому это ведомство приобретает всё большее политическое и административное значение.\n\nПредоставляет должность правителя — £job_tribe_speaker£ $job_tribe_speaker$. Она даёт всему государству бонусы к §Y£mod_country_edict_fund_add£ $MOD_COUNTRY_EDICT_FUND_ADD$§!, $i_naval_capacity$, §Yмаксимуму станций§! и $r_influence$ в зависимости от общего числа принадлежащих государству §Yпланет§!. Величина бонусов возрастает от §G5+§! до §G25+§! (при 5/10/15/20/25+ планетах)."
 
 job_tribe_speaker:0 "Председатель Совета национальной безопасности"
 job_tribe_speaker_plural:0 "Председатели Совета национальной безопасности"
 job_tribe_speaker_desc:0 "Одна из ключевых фигур в системе §Yнациональной безопасности§!."
 job_tribe_speaker_effect_desc:0 "£job_tribe_speaker£ $job_tribe_speaker$ даёт всему государству бонусы к §Y£mod_country_edict_fund_add£ $MOD_COUNTRY_EDICT_FUND_ADD$§!, $i_naval_capacity$, §Yмаксимуму станций§! и $r_influence$. Их величина зависит от числа принадлежащих государству §Yпланет§! и возрастает от §G5+§! до §G25+§! (при 5/10/15/20/25+ планетах). Затраты в $r_energy$ растут вместе с величиной бонусов. Также должность создаёт §Yоборонительные армии§!."
 mod_job_tribe_speaker_add:0 "Должности председателей Совета национальной безопасности"
 mod_job_tribe_speaker_per_pop:0 "§G+1§! должность $job_tribe_speaker$ за каждые $VALUE$ поселений"
 mod_job_tribe_speaker_per_pop_short:0 "\n§G+1§! £mod_job_tribe_speaker_add£ на $VALUE$ £pop£"

 civic_in_perfect:0 "Однородный коллективизм"
 civic_in_perfect_desc:0 "Это ксенофобное общество проникнуто сильным духом племенного коллективизма."

 ECOSYSTEM_DIVERSITY:0 "Разнообразие экосистем"
 ECOSYSTEM_DIVERSITY_DESC:0 "Колонизация всех основных типов обитаемых миров — засушливых, пустынных, саванных, альпийских, арктических, тундровых, континентальных, океанических и тропических — очень понравится [Root.GetName&dat]."

 building_tribal_council:0 "Дворец совета племени"
 building_tribal_council_desc:0 "Здесь собираются старейшины, которым доверено направлять развитие общества и хранить его устои.\n\nДаёт уникальную должность правителя — £job_the_elder£ $job_the_elder$, а также повышает на планете производство £society_research£ социологических исследований, количество £amenities£ благ и §Yстабильность§! в зависимости от числа §Yпоселений§! — от §G40§! до §G200+§! (при 40/80/120/160/200+ поселениях). Затраты на содержание растут вместе с величиной бонусов."

 job_the_elder:0 "Старейшина"
 job_the_elder_plural:0 "Старейшины"
 job_the_elder_desc:0 "Член совета племени, которому доверено хранить устои общества и направлять его развитие."
 job_the_elder_effect_desc:0 "£job_the_elder£ $job_the_elder$ производит £unity£ единство и создаёт §Yоборонительные армии§!."
 mod_job_the_elder_add:0 "Должности $job_the_elder$"
 mod_job_the_elder_per_pop:0 "§G+1§! должность $job_the_elder$ за каждые $VALUE$ поселений"
 mod_job_the_elder_per_pop_short:0 "\n§G+1§! £mod_job_the_elder_add£ за каждые $VALUE$ £pop£"

 decision_witch_hunt:0 "Охота на ведьм"
 decision_witch_hunt_desc:0 "Еретиков будут преследовать и искоренять!"
 decision_witch_hunt_effects_custom:0 "[soldier.GetIcon] [soldier.GetNamePlural] дополнительно производят $r_unity$ и повышают $r_stability$, а производство исследований на планете снижается."

 decision_end_witch_hunt:0 "Прекратить охоту на ведьм"
 decision_end_witch_hunt_desc:0 "Прекратить продолжающуюся охоту на ведьм."
 decision_end_witch_hunt_effects_custom:0 "Прекращает продолжающуюся охоту на ведьм."

 civic_imperial_cult_desc:1 "В этом обществе господствует государственная религия, в которой правителю поклоняются как живому божеству."

 civic_war_industry:1 "Военная промышленность"
 civic_war_industry_desc:1 "В этом обществе существует высокоразвитый военно-промышленный комплекс. Его корабли и вооружение отличаются высочайшим качеством, но требуют значительных затрат на содержание.\n§W$BOB_forge_tooltip$§!"

 civic_tooltip_shadow_council_effects:1 "$t$- $r_stability$ за каждые 100 £job_politician£ §Y$job_politician_plural$§!: §G+2§!.\n$BOB_retreat_tooltip$"

 #######

 mod_planet_district_hab_housing_upkeep_mult:0 "Содержание жилого района"
 mod_planet_district_rw_city_upkeep_mult:0 "Содержание городского района на мире-кольце"

 #starts game with §YBiotech Consortium§! tech

 civic_terraforming:0 "Экологические инженеры"
 civic_terraforming_desc:0 "Для решения экологических проблем эта цивилизация традиционно полагается на науку. С помощью технологий она создаёт устойчивые экосистемы, в которых общество и природная среда сосуществуют к взаимной выгоде."

 building_climate_control:0 "Комплекс климатического контроля"
 building_climate_control_desc:0 "Этот высокотехнологичный комплекс позволяет управлять климатом планеты, делая его более подходящим для нашего вида и при этом сводя к минимуму ущерб местной экосистеме."

 #Climate Control Generator +15 habitability
 #terraform Toxic

 edict_find_toxic_planets:0 "Поиск токсичных миров"
 edict_find_toxic_planets_desc:0 "Этот указ позволяет обнаружить токсичные миры в пределах границ государства."

 ####

 toxic_world_candidate:0 "Токсичный кандидат на терраформирование"
 toxic_world_candidate_desc:0 "Этот мир потенциально пригоден для терраформирования."

 capitalism_unrest:0 "Беспорядки (привлекательность конкуренции)"
 capitalism_unrest_desc:0 "§HБеспорядки§! в этой колонии повысили привлекательность §Yконкуренции§! среди местных поселений."

 socialism_unrest:0 "Беспорядки (привлекательность кооперации)"
 socialism_unrest_desc:0 "§HБеспорядки§! в этой колонии повысили привлекательность §Yкооперации§! среди местных поселений."

 green_unrest:0 "Беспорядки (привлекательность экоцентризма)"
 green_unrest_desc:0 "§HБеспорядки§! в этой колонии повысили привлекательность §Yэкоцентризма§! среди местных поселений."

 industrial_unrest:0 "Беспорядки (привлекательность индустриализма)"
 industrial_unrest_desc:0 "§HБеспорядки§! в этой колонии повысили привлекательность §Yиндустриализма§! среди местных поселений."

 pluralist_unrest:0 "Беспорядки (Усилена привлекательность Плюрализма)"
 pluralist_unrest_desc:0 "§HБеспорядки§! в этой колонии привели к росту привлекательности этики §YПлюрализма§! среди населения."

 elitist_unrest:0 "Беспорядки (Усилена привлекательность Элитизма)"
 elitist_unrest_desc:0 "§HБеспорядки§! в этой колонии привели к росту привлекательности этики §YЭлитизма§! среди населения."

