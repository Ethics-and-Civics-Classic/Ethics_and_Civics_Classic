 civic_peaceful_urbanism:0 "Мирный урбанизм"
 civic_peaceful_urbanism_desc:0 "Эта цивилизация традиционно направляет свою индустриальную энергию и созидательный порыв в мирное русло — развитие архитектуры и строительства."

 job_urban_engineer:0 "Городской инженер"
 job_urban_engineer_plural:0 "Городские инженеры"
 job_urban_engineer_desc:0 "Специалисты в области городской инженерии, строительства и развития поселений."
 job_urban_engineer_effect_desc:0 "£job_urban_engineer£ $job_urban_engineer_plural$ производят $r_engineering$ и $r_unity$, снижают местный §Y$mod_planet_districts_cities_upkeep_mult$§! и §Y$mod_planet_districts_industrial_upkeep_mult$§! на §G5%§!, а §Y$mod_planet_districts_hab_industrial_cost_mult$§! — на §G10%§!."
