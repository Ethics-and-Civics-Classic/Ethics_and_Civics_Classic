 civic_parliamentary_system:1 "Политический плюрализм"
 civic_parliamentary_system_desc:1 "Разнообразная парламентская система этого общества поощряет оживлённые публичные споры на любые темы. Заручиться поддержкой одной из ведущих политических фракций бывает чрезвычайно выгодно."

 POLITICAL_PLURALISM:0 "Политический плюрализм"
 POLITICAL_PLURALISM_DESC:0 "Гражданская модель §Y«Политический плюрализм»§!, поддерживающая открытое политическое обсуждение, понравится [Root.GetName&dat]."

 civic_consumerism:0 "Расточительное потребительство"
 civic_consumerism_desc:0 "Это общество придерживается социально-экономической идеологии, поощряющей приобретение товаров и услуг во всё возрастающих объёмах."

 civic_divine_council:0 "Священный совет"
 civic_divine_council_desc:0 "За управлением этой державой надзирает совет самых влиятельных религиозных лидеров общества."

 ####

 PLURALISM_POPS:0 "Плюралистическое общество"
 PLURALISM_POPS_DESC:0 "[Root.GetName] будут довольны, если хотя бы §Y25%§! нашего населения станут приверженцами идеалов плюрализма."

 civic_machine_cult:0 "Культ машин"
 civic_machine_cult_desc:0 "Жители этого общества поклоняются машинам как богам, а сила их веры буквально питает §Yроботов§!."

 building_collosal_monument:0 "Колоссальный памятник роботу"
 building_collosal_monument_desc:0 "Это не просто статуя, а исполинский монумент в честь антропоморфного робота. Святилище посвящено не поклонению, а памяти о древних искусственных разумах, некогда определивших судьбу государства."

