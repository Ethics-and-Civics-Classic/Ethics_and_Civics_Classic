 mod_pop_ethic_egalitarian_attraction_mult:0 "Привлекательность Либертарных Принципов"

 gov_aristocratic_republic:0 "Аристократическая республика"
 gov_aristocratic_republic_desc:0 "Форма представительной демократии, при которой избираться в парламент и управлять от имени народа могут только представители социальной элиты."

 gov_oligarchic_republic:0 "Олигархическая республика"
 gov_oligarchic_republic_desc:0 "Крайне элитарная форма республики, в которой значительная часть власти сосредоточена в руках небольшой привилегированной группы, способной оказывать сильное влияние на выборы и государственные решения."

 gov_congress_republic:0 "Конгрессионная республика"
 gov_congress_republic_desc:0 "Форма представительной демократии, в которой власть принадлежит демократически избранным членам парламента, а те выбирают главу правительства. Каждый свободный гражданин имеет право голоса."

 gov_noble_aristocracy:0 "Родовая аристократия"
 gov_noble_aristocracy_desc:0 "Вся политическая власть в этом обществе принадлежит совету представителей древних аристократических домов."

 RT_REGENT:0 "Регент"

 civic_personality_cult:0 "Персоналистический Режим"
 civic_personality_cult_desc:0 "Правитель рассматривается как полурелигиозный символ, что активно пропагандируется во всем государстве."

 gov_soviet_republic:0 "Советская республика"
 gov_soviet_republic_desc:0 "Разновидность республики, которой управляют напрямую избираемые Советы — рабочие советы, непосредственно ответственные перед своими избирателями. Разделения властей нет, а делегаты могут быть отозваны в любой момент."

 gov_aristocratic_monarchy:0 "Аристократическая монархия"
 gov_aristocratic_monarchy_desc:0 "Форма монархии, при которой наследственный правитель не обладает абсолютной властью и вынужден делить её с наиболее влиятельными представителями знати."

 edict_div_crusade:0 "$unity_ambition$ Божественный крестовый поход"
 edict_div_crusade_desc:0 "Нечестивые неверные будут уничтожены раз и навсегда!"

 civic_defenders_faith:0 "Воинствующие ревнители"
 civic_defenders_faith_desc:0 "Это общество религиозных фундаменталистов, чья армия хранит прочную традицию суровой боевой подготовки — как физической, так и духовной. Каждый должен быть всегда готов защитить свою веру от неверных."

 gov_liberal_democracy:0 "Либеральная демократия"
 gov_liberal_democracy_desc:0 "Форма правления с конкурентными выборами между несколькими политическими партиями, разделением властей, рыночной экономикой и частной собственностью, а также правовыми гарантиями основных свобод."

 RT_DUCE:0 "Дуче"

 gov_anarchy_communism:0 "Военный коммунизм"
 gov_anarchy_communism_desc:0 "Крайняя форма коммунистической диктатуры, для которой характерны национализация всей промышленности, жёсткое централизованное управление, государственный контроль внешней торговли, строгая трудовая дисциплина, запрет забастовок и обязательная трудовая повинность для нетрудящихся классов."

 RT_GENERALISSIMO:0 "Генералиссимус"

 policy_drug_rights:0 "Наркотики"
 policy_drug_rights_desc:0 "Снижение контроля за производством и оборотом особой категории психоделических веществ стимулирует развитие медицины, однако их потенциальное применение населением в личных рекреационных целях может приводить к нарушению социальной стабильности."

 drug_rights_limited:0 "Ограничены"
 drug_rights_limited_name:0 "Ограничены"
 drug_rights_limited_desc:0 " "

 drug_rights_allowed:0 "Разрешены"
 drug_rights_allowed_name:0 "Разрешены"
 drug_rights_allowed_desc:0 " "

 PROGRESSIVE_DRUG_RIGHTS:0 "Рекреационные Наркотики Разрешены"
 PROGRESSIVE_NO_DRUG_RIGHTS:0 "Разрешить Рекреационные Наркотики"
 PROGRESSIVE_DRUG_RIGHTS_DESC:0 "Разрешение свободно покупать и использовать §YРекреационные Наркотики§! понравится [Root.GetName&dat]."

 TOTALITARIAN_DRUG_RIGHTS:0 "Рекреационные Наркотики Запрещены"
 TOTALITARIAN_NO_DRUG_RIGHTS:0 "Запретить Рекреационные Наркотики"
 TOTALITARIAN_DRUG_RIGHTS_DESC:0 "Жесткий контроль на распространением и применением §YРекреационных Наркотиков§! в нашей Империи понравится [Root.GetName&dat]."

 TOTALITARIAN_GUN_RIGHTS_DESC:0 "Жесткий контроль на распространением и использованием §YЛичного Оружия§! в нашей Империи понравится [Root.GetName&dat]."

 gov_communist_dictatorship:0 "Революционная диктатура"
 gov_communist_dictatorship_desc:0 "Рабочие этого общества успешно восстали против прежних хозяев и захватили средства производства. На переходном этапе к общинному строю революционеры используют вооружённые силы как временный орган управления."

 gov_social_democracy:0 "Социал-демократия"
 gov_social_democracy_desc:0 "Демократически избранное правительство проводит политику смешанной экономики. Сохраняя рыночную систему и частную собственность, государство активно вмешивается в хозяйство, перераспределяет часть доходов и гарантирует гражданам определённый уровень социального благополучия."

 gov_social_nationalism:0 "Национал-Социализм"
 gov_social_nationalism_desc:0 "Форма тоталитарного государства, характеризующаяся мощным элитизмом, национализмом и репрессивной диктаторской манерой управления."

 gov_anarch_capitalism:0 "Анархо-капитализм"
 gov_anarch_capitalism_desc:0 "Форма общества, в которой размеры и полномочия государственного аппарата сведены к абсолютному минимуму, а полностью свободный рынок обеспечивает все общественные блага и услуги — вплоть до правопорядка и национальной обороны."

 civic_philosopher_king:1 "Король-мудрец"
 civic_philosopher_king_desc:0 "Недостаточно просто править. Корабль государства должен вести король, обладающий мудростью и знаниями, необходимыми, чтобы не сбиться с верного курса."

 gov_minarchy:0 "Минархия"
 gov_minarchy_desc:0 "Форма минимального «государства ночного сторожа», которое не отвечает за образование, здравоохранение, занятость или транспорт граждан и не распоряжается природными ресурсами своей территории. Все эти сферы находятся в частных или общественных руках, и государство не вправе вмешиваться в них ни напрямую, ни через законы или своих представителей."

 XENOIST_UNIVERSALISM:0 "Галактический универсализм"
 XENOIST_UNIVERSALISM_DESC:0 "Присутствие в нашем государстве как минимум §Y8§! уникальных видов очень понравится [Root.GetName&dat]."
 XENOIST_NO_UNIVERSALISM:0 "$XENOIST_UNIVERSALISM$"

 IMPERIALIST_DEFENSIVE_PACTS:0 "Оборонный союз"
 IMPERIALIST_DEFENSIVE_PACTS_DESC:0 "Пакты о взаимной защите как минимум с §Y2§! другими государствами очень понравятся [Root.GetName&dat]."
 NO_IMPERIALIST_DEFENSIVE_PACTS:0 "$IMPERIALIST_DEFENSIVE_PACTS$"

 AUTHORITY_ELECTION_DIRECT_DEMOCRATIC:0 "Выборы нового правителя проводятся каждые §Y10§! лет."

 civic_free_haven_desc:0 "Это общество по праву славится как свободная гавань. Здесь рады всем: усталым, бедным и гонимым, жаждущим свободно дышать, независимо от вида и происхождения."
 
 civic_inwards_perfection:0 "Изоляционизм"
 civic_inwards_perfection_desc:0 "Это спокойное и пацифистское общество не видит особого смысла в общении с чужаками, не понимающими его уклада. Больше всего его жители хотят, чтобы их просто оставили в покое."

 civic_isolationism:0 "Параноидальный Изоляционизм"
 civic_isolationism_desc:0 "С выходом этого ксенофобного общества в космос вопросы национальной безопасности и защиты границ стали высшим приоритетом. \n\n§HГенераторы планетарного щита§! производят дополнительное $r_unity$. \n§YПолитика границ§! по умолчанию: §Yзакрытые§!."

 civic_warrior_culture_pacifist: "Терпеливые воины"
 civic_warrior_culture_desc:0 "В этом обществе сложилась суровая воинская культура: даже правители здесь связаны кодексом воинской чести. Воинское мастерство и чувство долга ценятся превыше всего. В мирное время воины берут на себя львиную долю тяжёлой работы ради защиты слабых, а на войне стремятся сойтись с достойным противником.\n\n§WЕсли государство придерживается принципа§! §Y$ethic_pacifist$§!, §Wгражданская модель даёт мирные бонусы.§!"
 civic_tooltip_warrior_culture_effects:0 "\n- Должности £job_entertainer£ §Y$job_entertainer$§! заменяются на £job_duelist£ §Y$job_duelist$§!.\n- £job_duelist£ §Y$job_duelist_plural$§! превращают $r_alloys$ в $r_unity$, $r_amenities$ и повышают £mod_ethic_attraction_mult£ привлекательность принципа §H$ethic_militarist$§!.\n- Должности £job_xeno_zoo_animal£ §Y$job_xeno_zoo_animal$§! заменяются на £job_xeno_zoo_beast£ §Y$job_xeno_zoo_beast$§!. $TABBED_NEW_LINE$ $warrior_culture_default_bonuses_tt$ $TABBED_NEW_LINE$ $BOB_mercs_tooltip$"
 civic_tooltip_warrior_culture_effects_paragon:0 "$warrior_culture_leader_swords_to_plowshares_tt$\n- Должности £job_entertainer£ §Y$job_entertainer$§! заменяются на £job_duelist£ §Y$job_duelist$§!.\n- £job_duelist£ §Y$job_duelist_plural$§! превращают $r_alloys$ в $r_unity$, $r_amenities$, §Y$PLANET_AMENITIES_TITLE$§! и повышают £mod_ethic_attraction_mult£ привлекательность принципа §H$ethic_militarist$§!.\n- Должности £job_xeno_zoo_animal£ §Y$job_xeno_zoo_animal$§! заменяются на £job_xeno_zoo_beast£ §Y$job_xeno_zoo_beast$§!.$TABBED_NEW_LINE$ $warrior_culture_default_bonuses_tt$ $TABBED_NEW_LINE$ $BOB_mercs_tooltip$"
 civic_tooltip_warrior_culture_effects_pacifist:0 "- Должности £job_entertainer£ §Y$job_entertainer$§! заменяются на £job_duelist£ §Y$job_duelist$§!.\n- £job_duelist£ §Y$job_duelist_plural$§! превращают $r_alloys$ в $r_unity$, $r_amenities$ и повышают £mod_ethic_attraction_mult£ привлекательность принципа §H$ethic_pacifist$§!.\n- Должности £job_xeno_zoo_animal£ §Y$job_xeno_zoo_animal$§! заменяются на £job_xeno_zoo_beast£ §Y$job_xeno_zoo_beast$§!. $TABBED_NEW_LINE$ $warrior_culture_pacifist_bonuses_tt$ $TABBED_NEW_LINE$ $BOB_mercs_tooltip$"
 civic_tooltip_warrior_culture_effects_paragon_pacifist:0 "$warrior_culture_leader_swords_to_plowshares_tt$\n- Должности £job_entertainer£ §Y$job_entertainer$§! заменяются на £job_duelist£ §Y$job_duelist$§!.\n- £job_duelist£ §Y$job_duelist_plural$§! превращают $r_alloys$ в $r_unity$, $r_amenities$, §Y$PLANET_AMENITIES_TITLE$§! и повышают £mod_ethic_attraction_mult£ привлекательность принципа §H$ethic_pacifist$§!.\n- Должности £job_xeno_zoo_animal£ §Y$job_xeno_zoo_animal$§! заменяются на £job_xeno_zoo_beast£ §Y$job_xeno_zoo_beast$§!.$TABBED_NEW_LINE$ $warrior_culture_pacifist_bonuses_tt$ $TABBED_NEW_LINE$ $BOB_mercs_tooltip$"
 warrior_culture_leader_swords_to_plowshares_tt: "\n- §Y$commander_plural_with_icon$§! начинают с чертой ветерана §Y$leader_trait_warrior_culture$§!"
 warrior_culture_pacifist_bonuses_tt:0 "\n- £job_soldier£ §Y$job_soldier_plural$§! производят $r_food$, $r_minerals$ и $r_unity$.\n- $MOD_ARMY_DEFENSE_DAMAGE_MULT$: §G+15%§!\n\n- $MOD_ARMY_COLLATERAL_DAMAGE_MULT$: §G-10%§!\n- $MOD_ARMY_EXPERIENCE_GAIN_MULT$: §G+5%§!"
 warrior_culture_default_bonuses_tt: "\n- $MOD_ARMY_DAMAGE_MULT$: §G+20%§!\n- $MOD_PLANET_ARMY_BUILD_COST_MULT$: §G-20%§!\n- $MOD_COUNTRY_NAVAL_CAP_MULT$: §G+10%§!\n- $MOD_COUNTRY_WAR_EXHAUSTION_MULT$: §G-10%§!"
 leader_trait_warrior_culture_desc:0 "$leader_trait_warrior_culture_effect$\n\nВ бою этот командующий благородный воин, а в мирное время заботливый управленец. [Root.GetHisHerCap] победы принесут жителям государства спокойствие и достаток."

 mod_rivalries_influence_produces_mult:0 "Влияние за Соперничество"

 gov_republican_dictatorship:0 "Республиканская диктатура"
 gov_republican_dictatorship_desc:0 "Форма правления, при которой избранные представители получают абсолютную власть над государством. Правителя выбирают голосованием, но после избрания он остаётся у власти до самой смерти."


 mod_planet_enforcers_upkeep_mult:0 "Содержание £job_enforcer£ $job_enforcer_plural$"

 mod_decisions_cost_mult:0 "Стоимость планетарных Решений"

 empire_not_capitalist_authoritarian:0 "$TRIGGER_FAIL$Наша Империя не обладает необходимой комбинацией этик §YФанатичная Конкуренция§!/§Yне-Либертарианизм§! ИЛИ §YАвторитаризм§!/§Yне-Кооперация§!."

 civic_ultimate_collective:0 "Тоталитарная утопия"
 civic_ultimate_collective_desc:0 "В этом жёстко тоталитарном обществе вся экономика находится под строгим государственным контролем, а граждане преданы государству без всякого принуждения."

 civic_asceticism:0 "Гармоничный коллектив"
 civic_asceticism_desc:0 "Это общество отличается сильным чувством духовной общности и стремлением его жителей к общему благу."

 civic_research_cooperatives:0 "Научные кооперативы"
 civic_research_cooperatives_desc:0 "Кооперативное устройство общества распространяется и на науку. Учёные традиционно объединены в финансируемые государством кооперативы, где свободно обмениваются открытиями и полнее раскрывают свой потенциал."

 mod_planet_researchers_upkeep_mult:0 "£job_researcher£ $job_researcher_plural$ Содержание"

 trait_ruler_immortal:0 "Бессмертный"
 trait_ruler_immortal_desc:0 "§LЭтот индивидуум благославлен Богами на Вечное Правление.§!\n"

 edict_immortal_ruler:0 "Провозгласить правителя бессмертным"
 edict_immortal_ruler_desc:0 "Этот указ сделает нынешнего правителя бессмертным."

 mod_pop_ethic_capitalism_attraction_mult:0 "Привлекательность Принципов Конкуренции"
 mod_pop_ethic_socialism_attraction_mult:0 "Привлекательность Принципов Кооперации"

