 building_storm_summoning_theater:0 "Центр призыва бурь"
 building_storm_summoning_theater_desc:0 "Праздник искусства и технологии: восторженные движения наших $job_storm_dancer_plural$ помогают приманивать космические бури."

 building_storm_holo_theater:0 "Буревой голографический зал"
 building_storm_holo_theater_desc:0 "Трансляции $building_storm_holo_theater$ охватывают всю планету и выходят далеко за её пределы, усиливая гипнотическое воздействие наших $job_storm_dancer_plural$."

 building_storm_grand_theater:0 "Великий комплекс бурь"
