 civic_corporate_dominion:1 "Мирные торговцы"
 civic_corporate_dominion_desc:0 "Это общество живёт по простому правилу: мир полезен для торговли. Поэтому значительная часть государственного управления находится в руках — или по меньшей мере под влиянием — свободного союза независимых купцов и торговцев, объединившихся ради общего процветания."

