 pft_bankers:0 "Предприниматели"
 pft_bankers_desc:1 "Предприниматели представляют интересы частного бизнеса и индивидуальных предпринимателей, их больше всего волнуют развитие рыночной экономики и конкуренции. \n\n§LПринцип Конкуренция§!"
 pft_socialists:0 "Лейбористы"
 pft_socialists_desc:1 "Лейбористы выступают за интересы рабочего класса и активно продвигают идею коллективной собственности на средства производства и справедливого перераспределения благ. \n\n§LПринцип Кооперация§!"
 pft_manufacturers:0 "Промышленники"
 pft_manufacturers_desc:1 "Промышленники продвигают идеи активного индустриального развития и увеличение промышленного производства. \n\n§LПринцип Индустриализм§!"
 pft_environmentalists:0 "Зеленые"
 pft_environmentalists_desc:1 "Зелёные выступают за охрану окружающей среды и развитие экологически эффективных форм промышленности. \n\n§LПринцип Экоцентризм§!" 
 pft_progressive:1 "Демократы"
 pft_progressive_desc:1 "Выступают за личные политические свободы, снижение роли центрального правительства и упразднение недемократических форм правления.\n\n§LПринцип Либертаризм§!" 

