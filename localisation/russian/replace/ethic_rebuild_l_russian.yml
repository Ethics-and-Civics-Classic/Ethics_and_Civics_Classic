 allows_new_babylon:0 "Открывает указ, позволяющий превратить один из принадлежащих нам миров в §YГалактическое чудо: Новый Вавилон§!. Указ доступен, только если в империи живёт более 3 разных видов. Размер планеты увеличивается на величину до 10 (но не более 25 в сумме), а постоянный модификатор повышает §Yпривлекательность миграции ксеносов§!, §Yпригодность§!, §Yединство§!, §Yсоциологические исследования§!, §Yэнергию§! и потенциальные §Yволнения§!, одновременно снижая §Yпривлекательность государственных принципов§!."
 allow_fanatic_purifiers:0 "Не может вести §Yдипломатию§! с другими видами! §YПоселения ксеносов§! всегда подвергаются истреблению. Истребление §Yпоселений ксеносов§! приносит §Yединство§!. Доступны только военные требования §Y«Уступить планету»§! и §Y«Очистить планету»§!. Можно использовать режим орбитальной бомбардировки §Y$orbital_bombardment_armageddon$§!."
 allows_anarchy_utopia:0 "Разблокирует экономическую политику: §YПостиндустриальная Экономика§!."

