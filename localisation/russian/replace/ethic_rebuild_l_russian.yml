 sm_hyperium_refinery:0 "Завод по добыче Гипериума"

 sr_sacred_plant:0 "Священные растения"
 sr_sacred_plant_desc:0 "Эти очень редкие и специфические растения известны своей способностью вызывать измененные состояния сознания и обеспечивать глубокий отдых, как на психологическом, так и на физиологическом уровнях."

 sr_hyperium:0 "Гипериум"
 sr_hyperium_desc:0 "Этот редкий металл славится своей невероятной прочностью и податливостью, но он также чрезвычайно радиоактивен и требует высокотехнологичного рафинирования, прежде чем его можно будет применить в промышленности."

