 civic_xenologist:0 "Архитекторы Эволюции"
 civic_xenologist_desc:0 "Учёные этой цивилизации посвятили себя изучению происхождения биологической жизни и эволюции. Теперь, с началом освоения глубокого космоса, перед их любопытством открываются новые горизонты."

