 #civic_corporate_toxic_baths_individual_machine_desc: "Хвала создателю! Роскошная, притягательно мягкая текстура этих смазочных материалов эффективно устраняет признаки износа стареющих шасси. Особым образом изготовленные смеси премиальных термомасел позволяет жителям этого машинного государства выглядеть и чувствовать себя «словно с конвейера». Подходит для всех моделей и задач."
 
 
 
 
 job_high_priest_desc:1 "К кому обращаются пастыри, когда сами не знают, куда двигаться? К другим, более опытным пастырям.\n\n§R!§! §WДля должности требуется§! £pops£ §H$ethic_spiritualist$§!"
 job_high_priest_effect_desc:1 "£job_high_priest£ $job_high_priest_plural$ превращают $r_consumer_goods$ в $r_unity$, $r_amenities$ и повышают привлекательность принципа £pops£ §H$ethic_spiritualist$§!."
 
 job_priest_desc:1 "Духовное руководство массами доверено самым благочестивым и набожным.\n\n§R!§! §WДля должности требуется§! £pops£ §H$ethic_spiritualist$§!"
 job_priest_effect_desc:1 "£job_priest£ $job_priest_plural$ превращают $r_consumer_goods_acc$ в $r_unity_acc$ и $r_amenities_acc$, а также повышают привлекательность принципа £pops£ §H$ethic_spiritualist$§!."
 
 job_preacher_desc: "Проповедники процветания несут массам благую весть: они тоже могут преуспеть, если пожертвуют небольшую сумму на правое дело.\n\n§R!§! §WДля должности требуется§! £pops£ §H$ethic_spiritualist$§!"
 job_preacher_effect_desc: "£job_preacher£ $job_preacher_plural$ превращают $r_consumer_goods_acc$ в $r_unity_acc$, $r_trade_acc$ и $r_amenities_acc$, а также повышают привлекательность принципа £pops£ §H$ethic_spiritualist$§!."

