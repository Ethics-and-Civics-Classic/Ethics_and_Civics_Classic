 civic_natural_capitalism:0 "Естественный капитализм"
 civic_natural_capitalism_desc:0 "Естественный, или экологический, капитализм исходит из взаимозависимости созданного обществом и природного капитала. Рыночная экономика здесь должна развиваться так, чтобы не истощать природные ресурсы и сохранять блага, которые даёт сама экосистема."

 civic_natural_capitalism_corporate:0 "$civic_natural_capitalism$"
 civic_natural_capitalism_corporate_desc:0 "Естественный, или экологический, капитализм исходит из взаимозависимости созданного обществом и природного капитала. Рыночная экономика здесь должна развиваться так, чтобы не истощать природные ресурсы и сохранять блага, которые даёт сама экосистема.\n\n§W-§! §YКоммерциализированная экосистема§!§W: природные планетарные препятствия предоставляют должности§! £job_trader£ §Yторговцев§! §Wи соответствующее количество§! £housing£ §Wжилья, а также небольшой бонус ресурсов (§!£food£§W,§! £minerals£ §Wили§! £energy£§W). Крупные природные препятствия, такие как§! §Yвулкан§!§W,§! §Yгоры§! §Wили§! §Yдикая природа§!§W, также предоставляют должности§! £job_entrepreneur£ §Yпредпринимателей§!§W. Редкие природные препятствия, такие как§! §Yтитаническая жизнь§! §Wили§! §Yблуждающие леса§!§W, также дают соответствующие бонусы.\n\n-§! §YКоммерческая биотехнология§!§W:§! £job_biotechnologist£ $job_biotechnologist_plural$ §Wтакже производят§! $r_trade$§W.\n\n-§! §YРазвитый экотуризм§!§W: позволяет построить уникальный для планеты§! £building£ §Yцентр экотуризма§!§W, предоставляющий должности§! £job_entrepreneur£ §Yпредпринимателей§! §Wи повышающий местные§! $r_trade$ §Wи§! $r_amenities$ §Wза каждое уникальное природное препятствие.§!"

 
 tech_bioreactor:0 "Промышленная биотехнология"
 tech_bioreactor_desc:0 "Позволяет строить §Yбиоперерабатывающие заводы§!, предоставляющие должности £job_biotechnologist£ §Yбиотехнологов§!, которые превращают $r_food$ в $r_energy$, $r_consumer_goods$ и $r_alloys$. В государствах нелитоидных видов $job_artisan_plural$ и $job_foundry_plural$ расходуют на §G-1§! $r_minerals$ меньше и на §G+1§! $r_food$ больше при производстве $r_consumer_goods$ и $r_alloys$."

 job_biotechnologist:0 "Биотехнолог"
 job_biotechnologist_plural:0 "Биотехнологи"
 job_biotechnologist_desc:0 "Специалисты, применяющие научные и инженерные знания для переработки биомассы в промышленное сырьё при помощи экологически безопасных технологий."
 job_biotechnologist_effect_desc:0 "£job_biotechnologist£ $job_biotechnologist_plural$ превращают $r_food$ в $r_energy$, $r_consumer_goods$ и $r_alloys$."
