 job_techno_priest:0 "Техножрец"
 job_techno_priest_plural:0 "Техножрецы"
 job_techno_priest_desc:0 "Именно сила нашей веры поддерживает работу этих машин."
 job_techno_priest_effect_desc:0 "£job_techno_priest£ $job_techno_priest_plural$ производят $r_engineering$ и $r_unity$, а также снижают §Y$mod_planet_pops_robotics_upkeep_mult$§! на §G5%§!."
