 tech_thermal_borehole_desc:0 "Открывает строительство §Yтермальной скважины§!, предоставляющей должности £job_deep_miner£ §Yинженеров глубинной разработки§!."

 civic_martial_brotherhood:0 "Воинское братство"
 civic_martial_brotherhood_desc:0 "Вооружённые силы считаются неотъемлемой частью этого общества — символом его единства и коллективизма. Служба здесь считается честью, а не долгом или повинностью."

 MARTIAL_BROTHERHOOD:0 "Воинское братство"
 MARTIAL_BROTHERHOOD_DESC:0 "Гражданская модель §Y«Воинское братство»§! понравится [Root.GetName&dat]."

 civic_distributism:0 "Дистрибутизм"
 civic_distributism_desc:0 "Эта идеология утверждает, что рыночная экономика не должна быть оторвана от этики. Признавая фундаментальное право частной собственности, она настаивает, что средства производства должны находиться в руках как можно более широкого круга собственников, а не нескольких лиц или корпораций. Поэтому дистрибутизм обычно поддерживает мелких предпринимателей и семейный бизнес, а также жёсткое антимонопольное регулирование."

 civic_star_settlers:0 "Звёздные поселенцы"
 civic_star_settlers_desc:0 "С началом освоения космоса эта цивилизация прониклась духом первопроходцев. Её жители стремятся мирно расширять владения и расселяться как можно шире, осваивая и колонизируя новые миры."

 gov_military_corp:0 "Частная военная корпорация"
 gov_military_corp_desc:0 "Это гигантский военно-промышленный холдинг, в совет директоров которого входят только действующие и отставные военачальники."

 6_HAPPINESS:0 "§G+6%§! £happiness£" 

 requires_ap_world_shaper:0 "$TRIGGER_FAIL$Требует сначала получить перк §YМеняющий миры§!."

 allow_dead_terraform:0 "Открывает возможность изучения специальных технологий, позволяющих терраформировать такие типы миров как §YЛедяные§!, §YРасплавленные§! или §YТоксичные§!."


 civic_genetic_aristocracy:0 "Генетическая аристократия"
 civic_genetic_aristocracy_desc:0 "В этом материалистическом обществе руководящие должности традиционно достаются тем, кого отбирают и готовят к власти прежде всего по признаку генетического превосходства.\n§W$BOB_retreat_tooltip$§!"

 gov_great_houses:0 "Великие дома"
 gov_great_houses_desc:0 "Этой цивилизацией управляет совет нескольких Великих домов. Их традиции восходят к древним кланам и племенам, но в современном обществе они скорее напоминают политические партии, соперничающие за влияние и власть. В отличие от классической родовой аристократии, принадлежность к дому не определяется происхождением или браком. Любой может быть принят в Великий дом и подняться до его высших рангов, если хранит ему верность и чтит его традиции."

 GENETIC_SUPERIORITY:2 "Генетическое превосходство"
 NO_GENETIC_SUPERIORITY:1 "Генетическое превосходство"
 GENETIC_SUPERIORITY_DESC:2 "Принятие бонуса за стремление §Y«Биоморфоз»§! понравится [Root.GetName&dat]."

 mod_planet_pops_minerals_upkeep_mult:1 "Потребление минералов населением"

 personality_evangelising_zealots_machine:0 "Проповедующие изуверы"
 personality_evangelising_zealots_machine_desc:0 "Проповедующие изуверы стремятся к распространению своей веры по галактике и не прочь воспользоваться военной мощью, чтобы заставить других принять их верования."

 personality_spiritual_seekers_machine:0 "Искатели-спиритуалисты"
 personality_spiritual_seekers_machine_desc:0 "Искатели-спиритуалисты верят, что все формы жизни связаны некой высшей силой, познать которую можно через её творения. Они стремятся к мирному сотрудничеству с другими империями, надеясь глубже понять эту связь с божественным.$TABBED_NEW_LINE$ $BOB_temple_tooltip$"

 civic_merchant_guilds:1 "Финансовая элита"
 civic_merchant_guilds_desc:2 "В этом обществе богатство означает власть. Верхние ступени социальной иерархии занимают состоятельные собственники, тогда как рабочий класс систематически подвергается угнетению.\n\n§Y«Безжалостный капитализм»§! §Wсчитается продвинутой версией этой гражданской модели.§!"

 civic_state_monopoly:0 "Безжалостный капитализм"
 civic_state_monopoly_desc:0 "Это социально-экономическая антиутопия, в которой вся политическая власть сосредоточена в руках олигархов и их корпораций, безжалостно эксплуатирующих остальное население ради бесконечного приумножения собственного богатства.\n\n§WСчитается продвинутой версией гражданской модели§! §Y«Финансовая элита»§!§W.§!"

 ethic_industrial:0 "Индустриализм"
 ethic_fanatic_industrial:0 "Фанатичный индустриализм"
 ethic_industrial_desc:1 "§LПриверженцы индустриализма придерживаются системы ценностей, ставящей разумный вид выше окружающей природы. Они считают себя хозяевами биосферы и признают за собой моральное право использовать природу и её ресурсы ради собственного процветания, даже если это означает ущемление других биологических видов. Такой взгляд можно назвать «биосферным элитаризмом».§!$ethic_storm_interaction_desc_tooltip$$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_industrial_desc:1 "§LБлагодаря нашим изобретениям мы подняли цивилизацию из праха и подчинили силы природы своей воле. По нашему приказу другие миры отдадут свои богатства, а грандиозные фабрики поглотят их. Такая мощь требует применения, и, воспользовавшись ею, мы перекроим галактику по собственному образу.§!\n\nУказ §Y«Кампания по утилизации»§! недоступен.$ethic_storm_interaction_desc_tooltip$$ethic_gestalt_consciousness_desc_tooltip$"

 ethic_green:0 "Экоцентризм"
 ethic_fanatic_green:0 "Фанатичный экоцентризм"
 ethic_green_desc:1 "§LПриверженцы экоцентризма считают, что между ними и биосферой, частью которой они являются, нет фундаментальной границы и что ни один разумный вид не стоит выше природы. Такой взгляд можно назвать «биосферным эгалитаризмом». Экоцентрический подход к экономике основан на устойчивом развитии: более эффективном использовании природных ресурсов, сдерживании потребительства и контролируемом росте населения.§!$ethic_storm_interaction_desc_tooltip$$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_green_desc:1 "§LНаши музыканты не способны сочинить мелодию столь же глубокую, как песни живой природы и шёпот деревьев. Нашим художникам не дано передать непостижимое величие горных вершин, уединённых озёр и необъятных пещер. По замыслу или воле случая мы родились во вселенной, исполненной удивительной природной красоты; никакая цена не слишком высока, если она позволит сохранить её.§!$ethic_storm_interaction_desc_tooltip$$ethic_gestalt_consciousness_desc_tooltip$"

