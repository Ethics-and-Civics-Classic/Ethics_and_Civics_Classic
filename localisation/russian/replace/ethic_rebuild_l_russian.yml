 decision_create_dense_jungle_effects_custom:0 "Создаёт препятствие §Y«Густые джунгли»§! на идеальных мирах и естественных обитаемых планетах с влажным климатом."

 decision_create_toxic_kelp:0 "Создать ядовитые водоросли"
 decision_create_toxic_kelp_desc:0 "Создаёт препятствие §Y«Ядовитые водоросли»§! на идеальных мирах и естественных обитаемых планетах с влажным или холодным климатом."
