 job_storm_chanter_plural:0 "Певцы бури"
 job_storm_chanter_desc:0 "Соединяя духовные ритуалы с технологиями, $job_storm_chanter$ стремится явить миру сам дух бури.\n\n§R!§! §WДля должности требуется§! £pops£ §H$ethic_spiritualist$§!"
