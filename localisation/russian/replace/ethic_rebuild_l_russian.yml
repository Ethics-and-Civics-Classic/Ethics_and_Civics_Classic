 ethic_collectivist:0 "Автократия"
 ethic_collectivist_desc:1 "§LОчевидно, что у разных людей разные способности. Одни лучше подходят для управления, другие — для служения, и их место в обществе должно это отражать. Игнорировать этот факт — значит приглашать хаос и беспорядок.§!\n"
 ethic_fanatic_collectivist:0 "Фан.Автократия"
 ethic_fanatic_collectivist_desc:1 "§LКогда слуга правит, а правитель служит — это преступление против самой природы. Истинный порядок возможен лишь при строгой иерархии и абсолютном повиновении.§!\n"
 ethic_egalitarian:0 "Либертарианство"
 ethic_individualist_desc:1 "§LВсе равны в своём достоинстве и правах. Сохранение порядка — достойная цель, но оно не оправдывает тиранию и угнетение ни в принципе, ни на практике. Цивилизация процветает, когда меньшинство не господствует над большинством.§!\n"
 ethic_fanatic_egalitarian:0 "Фанатичное либертарианство"
 ethic_fanatic_individualist_desc:1 "§LВласть не просто развращает — она сама есть развращение. Любое неравенство власти по своей природе основано на принуждении. Истинные свобода и справедливость возможны лишь при равенстве.§!\n"

 personality_utopia_builders:0 "Строители Утопии"
 personality_utopia_builders_desc:0 "Строители утопии превыше всего ценят экономическое и социальное благополучие своего вида. Каким бы большим ни было государство, его задача — сделать так, чтобы никто не страдал от нужды, болезней или бедности."

 personality_adventurous_expansionist:0 "Агрессивные Экспансионисты"
 personality_adventurous_expansionist_desc:0 "Агрессивные экспансионисты считают галактику своим наследием и стремятся распространить влияние во все уголки космоса, до которых способны дотянуться."

 personality_paranoid_isolationists:0 "Параноидальные изоляционисты"
 personality_paranoid_isolationists_desc:0 "Параноидальные изоляционисты стремятся полностью отгородиться от внешнего мира. Они не вмешиваются в чужие дела и предпочли бы, чтобы остальные отвечали им тем же."

