 PROGRESSIVE_SLAVERY:0 "Рабство разрешено"
 PROGRESSIVE_NO_SLAVERY_DESC:0 "Разрешение §Yрабства§! не понравится [Root.GetName&dat]."

 TRADITIONALIST_YES_ROBOTS:0 "Слава Роботам!"
 TRADITIONALIST_NO_ROBOTS:0 "Нет роботам"
 TRADITIONALIST_YES_ROBOTS_DESC:0 "Политика, разрешающая использование роботов в Империи, нравится [Root.GetName&dat]."

 #unused civic?
 civic_elite_troops:0 "Элитные войска"
 civic_elite_troops_desc:0 "Государство выделяет значительные ресурсы на подготовку и содержание элитных вооружённых сил."

 civic_political_pluralism:0 "Республиканские Идеалы"
 civic_political_pluralism_desc:0 "Республиканизм строится вокруг идеи гражданской добродетели и государства как «общего дела». Обычные граждане в той или иной мере участвуют в политической жизни — через общественные дискуссии или выборы."

 civic_meritocracy:1 "Высшая меритократия"
 civic_meritocracy_desc:1 "Единственной основой для продвижения в этом обществе служит равная возможность проявить способности и усердие. Поэтому руководящие должности занимают наиболее достойные и квалифицированные."

 civic_beacon_of_liberty:0 "Дух свободы"
 civic_beacon_of_liberty_desc:0 "Это общество превозносит личную свободу, ставя превыше всего право каждого самостоятельно добиваться своих целей и воплощать собственные устремления. Ослабление центральной власти и бюрократического регулирования способствует инновациям и свободному движению граждан, товаров и идей по всей стране."

 job_mogul:0 "Магнат"
 job_mogul_plural:0 "Магнаты"
 job_mogul_desc:0 "Влиятельный и заметный представитель финансовой элиты."
 job_mogul_effect_desc:0 "£job_mogul£ $job_mogul_plural$ производят $r_trade$ и увеличивают планетарный $mod_planet_jobs_energy_produces_mult$ на §G+5%§!."
