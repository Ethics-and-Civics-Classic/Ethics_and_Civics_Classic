 mod_job_biotechnologist_per_pop_short:0 "\n§G+1§! £mod_job_biotechnologist_add£ за каждые $VALUE$ £pop£"

 building_biofuel_plant:0 "Биоперерабатывающий завод"
 building_biofuel_plant_desc:0 "На этом предприятии установлено промышленное оборудование для выделения и извлечения соединений из различных растений и сельскохозяйственных культур. Полученные вещества изучаются, перерабатываются и применяются при производстве биотоплива, композитных материалов и товаров массового спроса."

 BIO_TECH:0 "§YПродвинутая биотехнология§!: позволяет изучить технологию §Y«Промышленная биотехнология»§! и нанимать £job_biotechnologist£ $job_biotechnologist_plural$. Недоступно литоидным государствам."

