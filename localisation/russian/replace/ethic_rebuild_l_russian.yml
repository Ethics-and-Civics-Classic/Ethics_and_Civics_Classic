 auth_dictatorial:0 "Диктатура"
 auth_dictatorial_desc:0 "Диктаторское государство находится под пожизненной властью единоличного правителя, обладающего абсолютными полномочиями."

 building_biomaterials_plant:0 "Фабрика Промышленных Биоматериалов"
 building_biomaterials_plant_desc:0 "Эта фарика использует биомассу, чтобы создавать органические промышленные композиционные материалы, а также ряд различных био-питательных веществ."

 civic_drone_brotherhood:0 "Братство Дронов"
 civic_drone_brotherhood_desc:0 "В этом обществе рабочий класс традиционно окружён особым почётом и образует глобальное сообщество, основанное на идеалистических принципах коллективизма и равенства. §HФермы§! и §HШахты§! производят по §Y0,2§! $r_unity$."

