 job_entrepreneur:0 "Предприниматель"
 job_entrepreneur_plural:0 "Предприниматели"
 job_entrepreneur_desc:0 "Предприниматели играют ключевую роль в экономике: благодаря инициативе и деловой хватке они предугадывают спрос и выводят на рынок новые идеи, товары и услуги."
