 civic_symbiotic_race:0 "Общественные симбионты"
 civic_symbiotic_race_desc:0 "Второй, искусственно созданный и физически очень сильный вид стал неотъемлемой частью этого общества. Несмотря на заметные различия, основной вид, управляющий общим родным миром обоих видов, считает его представителей равными себе — во многом благодаря своей способности сочувствовать иным формам жизни."

