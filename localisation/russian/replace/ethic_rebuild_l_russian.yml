 uplift.7215.c.tooltip:1 "[From.From.From.GetName] получил §Yдемократию§!."
 nomad.21.d.response:1 "Они - духовная и свободолюбивая толпа, как хорошо, что эти одноклеточные сильно различаются."
 observation.2041.desc:0 "Туземцы на [From.GetName&prep] не только увлеклись нашими технологиями: советники сообщают, что они начинают перенимать и наш образ жизни.\n\nПод впечатлением от нашего искусства и культуры общество [From.Owner.GetSpeciesName&gen] прониклось идеями либертарианства. С момента нашего прибытия личные свободы туземцев заметно расширились."
 observation.2061.desc:0 "На поверхности [From.GetName&gen] царит анархия, и нашим советникам нелегко обучать [From.Owner.GetSpeciesNamePlural&acc] современной науке. Их так называемые учёные постоянно бросаются от одной интересующей их темы к другой, почти не заботясь об общем благе.\n\nНесмотря на ошибочное либертарианство туземцев, наша миссия просвещения продолжается, но займёт больше времени, чем ожидалось."
