 clone_army_digsite_barbaric_despoiler_desc:0 "С тех пор как мы осознали своё положение, споры о §HЗамысле Великого хана§! не дают нашему виду покоя. Мы серьёзно недооценили последствия различных толкований этого замысла. Пока вопрос не решён, наше общество не способно двигаться вперёд, не говоря уже о сотрудничестве. Мы не можем прийти к согласию и жаждем ответов.\n\nЭти раскопки призваны отыскать свидетельства, способные разрешить споры о великом замысле нашего предтечи, помочь нам принять единое толкование и наконец объединиться."
 civic_primitive_enthusiasts_desc_gestalt:0 "Это общество высоко ценит старые способы производства, предпочитая выполнять многие работы вручную и жить за счёт земледелия и животноводства."
