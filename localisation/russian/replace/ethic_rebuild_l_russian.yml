 #civic_storm_callers: "Storm Callers"
 #civic_storm_callers_desc: "Ever since ancient times, this society has been able to attract tempests through their rituals. Over the years, they combined technical innovations to enhance their efficiency. With the dawn of the space age, they now seek to take this knowledge to the stars."
 civic_storm_callers_effect_tooltip:0 "$AVAILABLE_BUILDINGS$ £building£ ['building:building_storm_summoning_theater'], превращающий $r_consumer_goods$ в $r_unity$, $r_amenities$ и один из двух видов исследований: $r_society$ или $r_engineering$. Кроме того, он повышает £pops£ §Hпривлекательность принципов§! в зависимости от принципов государства.\n\n$SPECIES_TRAITS$ ['trait:trait_storm_touched']\nВо время §Yкосмического шторма§!:\n- Ресурсы от должностей £pops£: §G+10%§!\n- Использование благ: §G-10%§!"

