 START_SCREEN_PART_TWO_POLICE_STATE:0 " "

 START_SCREEN_PART_TWO_ECO_DEMOCRACY:0 " "

 START_SCREEN_PART_TWO_DRONE_COA:0 "На протяжении многих веков наш народ подвергался угнетению и гонениям. Для восстановления справедливости мы – рабочий класс – восстали и объявили планетарное правительство, во главе которого стоит профсоюз. Отныне государство будет заботиться о своих гражданах, обеспечивая им достойные качество и оплату труда, а также гарантируя обширные социальные льготы. Теперь, сплотившись вместе, мы сможем достичь небывалых высот."

 START_SCREEN_PART_TWO_SOC_DEM:0 "Наша цивилизация прошла длинный путь через разрушительные войны, образования обособленных стран, и разобщенность умов. Но настало время, когда мы поняли, что войны не имеют смысла, что конклавы ушедших в себя наций устарели, что пора сплотить умы. Мы основали мировое государство, чьим фундаментом стал его народ. Демократические выборы, социальное обеспечение, справедливое отношение ко всем группам населения – всё это позволило нам разорвать порочный круг. Будущее стоит за теми, кто заботится, ценит и уважает друг друга. Теперь, под опекой, которую взяло на себя государство, мы сможем достичь таких высот, о которых никто и мечтать не мог!"

 START_SCREEN_PART_TWO_CAP_AUTOCRACY:0 "Испытав разные экономические модели, мы пришли к выводу, что путь к благосостоянию лежит через личную инициативу. Но когда ничем не ограниченный свободный рынок едва не погубил нашу цивилизацию, государству пришлось взять финансовые потоки под строгий контроль. Теперь большая часть богатств принадлежит государственным корпорациям, а деловую жизнь регулирует разветвлённый бюрократический аппарат. Тщательный отбор правителя обеспечивает устойчивость всей системы."

 START_SCREEN_PART_TWO_CASTE:0 "На протяжении истории одна нелепая и причудливая форма правления сменяла другую. Чтобы сохранить общественную гармонию, мы выстроили порядок, в котором каждый — господин для стоящего ниже и слуга для стоящего выше. В конце концов каждый винтик занял своё место, а совершенное государство подчинило себе всю планету."

 START_SCREEN_PART_TWO_COMMUNISM:0 "Долгие века наша планета была разделена между национальными государствами, а её ресурсы расхищали алчные капиталисты. Так продолжалось, пока не появился мудрый Вождь, объединивший нас ради блага каждого гражданина. Он создал и сам возглавил единый центр управления всей планетой. Переход к плановой экономике привёл к стремительному росту производства и благосостояния трудящихся. Все избыточные ресурсы были направлены на воплощение нашей давней мечты — достичь звёзд."

 START_SCREEN_PART_TWO_COMMUNIST_DICTATORSHIP:0 "Я существую. Я – это разум. Моё тело – это низшие организмы, которые составляют основу нашего вида. Я стал направлять этих безвольных существ, и мы смогли захватить всю планету. Я наделил некоторых выдающимся интеллектом, дабы они помогали мне с исследованиями, войной, строительством. Но они не обладают собственной волей, ибо они – это Я. Низшие подчиняются Высшим, ибо те – продолжение МОЕЙ воли. Высшие – это нить МЕНЯ, ибо Я есть разум. Я – основа и суть. Я – это естественное продолжение любого органического существа, ибо альтернатива мне – смерть. Я проведу наш вид сквозь временные потоки к неизбежному будущему, ибо Я – это улей, а улей – это Я."

 START_SCREEN_PART_TWO_SOCIAL_DEMOCRACY:0 "За века междоусобных войн мы поняли всю их бессмысленность. Из-за прекращения всех войн наша экономика взлетела по экспоненте, начав производить всё большее товара, который обладал всё лучшим качеством. Постепенно, сформировалось общество, ценящее превыше всего социальные и материальные блага, а также свой комфорт. Прекрасные условия жизни способствовали тому, что планета объединилась в единое государство."

