 ##### COUNCIL LOC #####
 councilor_anarchy_ideals:0 "Децентрализованный представитель"
 councilor_anarchy_ideals_desc:0 "Представитель местных автономий и сообществ в государстве с крайне низкой степенью централизации."
 councilor_circular_economy:0 "Директор замкнутого цикла"
 councilor_circular_economy_desc:0 "Руководитель научного развития экономики замкнутого цикла. Он разрабатывает процессы и продукты, в которых отходы и побочные результаты одних систем становятся ресурсами для других."
 councilor_eco_warfare:0 "Генерал-квартирмейстер"
 councilor_eco_warfare_desc:0 "Военачальник, отвечающий за эффективность военных цепочек снабжения и сокращение потерь материальных ресурсов."
 councilor_war_industry:0 "Директор по снабжению"
 councilor_war_industry_desc:0 "Главный специалист по снабжению, отвечающий за закупки материальных средств, производство и взаимодействие с военно-промышленным комплексом."
 councilor_naturalism:0 "Главный градостроитель"
 councilor_naturalism_desc:0 "Отвечает за самодостаточное проектирование районов, архитектурную эффективность, рациональное городское планирование и развитый общественный транспорт."
 councilor_peaceful_urbanism:0 "Градостроитель гармонии"
 councilor_peaceful_urbanism_desc:0 "Проектирует спокойную и удобную городскую среду: просторные парки, тихие торговые кварталы и эффективный общественный транспорт."
 councilor_military_industry:0 "Военный изобретатель"
 councilor_military_industry_desc:0 "Военный изобретатель руководит передовыми разработками и исследованиями в области вооружений и военной техники."
 councilor_state_monopoly:0 "Неизменный"
 councilor_state_monopoly_desc:0 "Роль Неизменного окружена тайной и мало понятна широкой публике. Он поддерживает государственную монополию и охраняет общественную иерархию, подавляя политическое влияние и активность низших слоёв ради сохранения стабильности."
 councilor_keepers_harmony:0 "Старший друид"
 councilor_keepers_harmony_desc:0 "Глава Экоцеркви и высший служитель Зелёного культа. Он укрепляет церковь и поддерживает веру в путь Хранителей."
 councilor_industrial_automation:0 "Куратор автоматизации"
 councilor_industrial_automation_desc:0 "Куратор и ведущий разработчик государственной Программы автоматизации."
 councilor_natural_capitalism:0 "Главный регулятор"
 councilor_natural_capitalism_desc:0 "Главный регулятор ограничивает негативные внешние эффекты потребительской экономики и сокращает отходы, стремясь сделать хозяйственный рост совместимым с сохранением природного капитала."
 councilor_natural_capitalism_corporate:0 "Главный регулятор"
 councilor_natural_capitalism_corporate_desc:0 "Главный регулятор ограничивает негативные внешние эффекты потребительской экономики и сокращает отходы, стремясь сделать хозяйственный рост совместимым с сохранением природного капитала."
 councilor_consumerism:0 "Директор по маркетингу"
 councilor_consumerism_desc:0 "Главный директор по маркетингу. В обычной корпорации он отвечает за рекламу; в гиперпотребительском обществе — ещё и за превращение демонстративного потребления и роскоши в культурную норму."
 councilor_consumerism_corporate:0 "Директор по маркетингу"
 councilor_consumerism_corporate_desc:0 "Главный директор по маркетингу. В обычной корпорации он отвечает за рекламу; в гиперпотребительском обществе — ещё и за превращение демонстративного потребления и роскоши в культурную норму."
 councilor_land_of_plenty:0 "Министр производства"
 councilor_land_of_plenty_desc:0 "Руководитель Министерства производства, отвечающий за оптимизацию производственных цепочек и развитие лёгкой промышленности."
 councilor_asceticism:0 "Гуру-шрамана"
 councilor_asceticism_desc:0 "Просветлённый шрамана и наставник аскетического пути. Этот философ и подвижник ведёт общество к отказу от избыточного потребления и духовному просветлению."
 councilor_innovative_economy:0 "Технологический магнат"
 councilor_innovative_economy_desc:0 "Хотя технологический магнат формально не входит в Совет, ему предоставляют место благодаря контрольным пакетам акций во всех передовых технологических компаниях. Эти конгломераты веками выполняли заказы правительств."
 councilor_innovative_economy_corporate:0 "Технологический магнат"
 councilor_innovative_economy_corporate_desc:0 "Технологический магнат возглавляет крупнейший межзвёздный технологический конгломерат и уже не одно поколение выполняет важнейшие контракты мегакорпорации."
 councilor_enlightment:0 "Общественный модератор"
 councilor_enlightment_desc:0 "Общественный модератор борется с дезинформацией и недоверием, ищет точки соприкосновения и способствует миру и взаимопониманию между внутренними политическими силами."
 councilor_terraforming:0 "Терраскульптор"
 councilor_terraforming_desc:0 "Главный советник по терраформированию. Он определяет, во что и каким образом преобразовывать планеты, и отвечает за успешное выполнение этих проектов."
 councilor_evangelism:0 "Верховный прозелит"
 councilor_evangelism_desc:0 "Телеевангелист, мегамиссионер и высший диакон — проповедник истины и праведного пути, призванный наставлять народ и возвращать отступников к вере."
 councilor_peacekeepers:0 "Маршал миротворцев"
 councilor_peacekeepers_desc:0 "Маршал Корпуса миротворцев. Создаёт безопасные зоны, стремится уменьшить жестокость войны и укрепляет отношения с другими державами гуманитарной помощью и миротворческой дипломатией."
 councilor_xeno_militarist:0 "Директор разведки"
 councilor_xeno_militarist_desc:0 "Руководитель главного разведывательного и контрразведывательного аппарата. Его задача — построить галактическую разведывательную сеть, собирать доступные сведения об иностранных державах и укреплять безопасность государства."
 councilor_star_settlers:0 "Колониальный администратор"
 councilor_star_settlers_desc:0 "Руководит колониальными делами, поощряет дальнейшее расселение и решает проблемы, с которыми сталкиваются молодые колонии."
 councilor_distributism:0 "Верховный телеевангелист"
 councilor_distributism_desc:0 "Телеевангелист, мегамиссионер и высший диакон — проповедник славы земных благ, дарованных высшими силами. Из стен исторической мегацеркви он ведёт народ к процветанию, вере и хозяйственной самостоятельности."
 councilor_martial_brotherhood:0 "Военный теоретик"
 councilor_martial_brotherhood_desc:0 "Военный теоретик-новатор, совершенствующий организацию войск, доктрины, вооружение и методы ведения наземной войны."
 councilor_symbiotic_race:0 "Офицер по коммуникациям"
 councilor_symbiotic_race_desc:0 "Главный офицер, отвечающий за коммуникации и диалог между фракциями внутри государства."
 councilor_slave_race:0 "Главный надсмотрщик"
 councilor_slave_race_desc:0 "Безжалостный надсмотрщик, отвечающий за поддержание достаточного объёма рабского труда."
 councilor_exploration:0 "Великий первопроходец"
 councilor_exploration_desc:0 "Авантюрист, первопроходец и советник, прославившийся на окраинных мирах своими экспедициями и открытиями."
 councilor_spiritual_seekers:0 "Верховный провидец"
 councilor_spiritual_seekers_desc:0 "Высший провидец государства, истолковывающий нематериальную волю вселенной и направляющий Совет."
 councilor_private_militaries:0 "Большой босс"
 councilor_private_militaries_desc:0 "У него нет ни нации, ни философии, ни идеологии. Он сражается ради самого себя и вдохновляет множество частных военных компаний, составляющих вооружённые силы государства."
 councilor_defenders_faith:0 "Маршал ордена крестоносцев"
 councilor_defenders_faith_desc:0 "Маршал священного ордена крестоносцев, командующий его силами и отвечающий за организацию воинского братства защитников веры."
 councilor_harmonious_hierarchy:0 "Высший инспектор"
 councilor_harmonious_hierarchy_desc:0 "Следит за тем, чтобы правящий класс соблюдал установленные нормы, расследует коррупцию и случаи жестокого обращения с низшими слоями общества."
 councilor_harmonious_hierarchy_corporate:0 "Главный инспектор"
 councilor_harmonious_hierarchy_corporate_desc:0 "Следит за тем, чтобы правящий класс соблюдал установленные нормы, расследует коррупцию и случаи жестокого обращения с низшими слоями общества."
 councilor_genetic_aristocracy:0 "Генетический архивариус"
 councilor_genetic_aristocracy_desc:0 "Ведёт генетический архив всех граждан государства, чтобы выявлять наиболее выдающихся кандидатов на руководящие должности."
 councilor_meritocratic_capitalism:0 "Секретарь Высшего делового бюро"
 councilor_meritocratic_capitalism_desc:0 "Секретарь высшего делового бюро. Стремится искоренить коррупцию и обеспечить честную конкуренцию и справедливое продвижение по службе."
 councilor_meritocratic_capitalism_corporate:0 "Секретарь Высшего делового бюро"
 councilor_meritocratic_capitalism_corporate_desc:0 "Секретарь высшего делового бюро. Стремится искоренить коррупцию и обеспечить честную конкуренцию и справедливое продвижение по службе."
 councilor_police_state:0 "Верховный судья"
 councilor_police_state_desc:0 "Высший судья и руководитель ключевых органов безопасности и правосудия государства."
 councilor_ultimate_collective:0 "Директор пропаганды"
 councilor_ultimate_collective_desc:0 "Руководит Министерством пропаганды, формируя общественное мнение с помощью кино, плакатов, рекламы, новостей и других средств массовой информации."
 councilor_divine_order:0 "Секретарь регистрационного бюро"
 councilor_divine_order_desc:0 "Секретарь регистрационного бюро граждан и бюро по трудоустройству с множеством административных обязанностей."
 councilor_labour_unions:0 "Представитель профсоюзов"
 councilor_labour_unions_desc:0 "Представитель, избранный крупнейшими профсоюзами страны для защиты их интересов на государственном уровне."
 councilor_welfare_state:0 "Министр здравоохранения и социального обеспечения"
 councilor_welfare_state_desc:0 "Контролирует распределение социальных пособий и занимается управлением системой здравоохранения."
 councilor_machine_cult:0 "Мехапонтифик"
 councilor_machine_cult_desc:0 "Высший духовный авторитет машинного культа и проповедник пути Священной Машины."
 councilor_naval_traditions:0 "Маршал флота"
 councilor_naval_traditions_desc:0 "Высшая должность во флоте, которой удостаивается наиболее авторитетный и прославленный адмирал."
 councilor_chosen_people:0 "Избранный понтифик"
 councilor_chosen_people_desc:0 "Проповедник пути избранного народа, призывающий граждан государства следовать своему высшему предназначению."
 councilor_military_dictatorship:0 "Амбициозный военачальник"
 councilor_military_dictatorship_desc:0 "Амбициозный военачальник и возможный преемник главы фракции. Наследует ли он власть — вопрос далеко не решённый, поэтому он стремится доказать свою состоятельность, даже ценой безрассудного риска."
 councilor_peaceful_republic:0 "Социальный теоретик"
 councilor_peaceful_republic_desc:0 "Социальный теоретик и экономический философ, чьи идеи призваны определить направление дальнейшего развития государства."
 councilor_spiritual_democracy:0 "Народный понтифик"
 councilor_spiritual_democracy_desc:0 "Понтифик, избираемый гражданами государства и сохраняющий свою власть благодаря народной поддержке."
 councilor_cyber_demos_cratos:0 "Куратор кибербезопасности"
 councilor_cyber_demos_cratos_desc:0 "Кибердемократия уязвима перед цифровыми угрозами, поэтому её обширная система кибербезопасности находится под непосредственным надзором этого советника."
 councilor_divine_council:0 "Камерленго Совета"
 councilor_divine_council_desc:0 "Формально не входя в Совет, камерленго доводит его волю до общества и следит за исполнением принятых решений."
 councilor_military_junta:0 "Маршал звёздного ополчения"
 councilor_military_junta_desc:0 "Маршал звёздного ополчения, отвечающий за его организацию и за силы безопасности военной хунты."
 councilor_science_directorate:0 "Представитель Директората"
 councilor_science_directorate_desc:0 "Представитель, избранный директоратом для участия в формировании государственной политики от имени академического сообщества."
 councilor_research_cooperatives:0 "Представитель научных кооперативов"
 councilor_research_cooperatives_desc:0 "Представитель, напрямую избираемый научным сообществом для защиты интересов академической среды и участия в формировании государственной политики."
 councilor_executive_committee:0 "Спикер форума"
 councilor_executive_committee_desc:0 "Спикер философского форума, представляющий в Совете волю и полномочия собрания."
 councilor_cyber_dictatorship:0 "Руководитель разработки ИИ"
 councilor_cyber_dictatorship_desc:0 "Руководитель разработки ИИ и глава исследовательского бюро искусственного интеллекта. Ключевая должность для функционирования правительства, опирающегося на самосознающий ИИ."
 councilor_globalism:0 "Председатель торговой комиссии"
 councilor_globalism_desc:0 "Председатель глобалистской торговой комиссии. Развивает сотрудничество между торговыми партнёрами и помогает решать проблемы, возникающие по мере роста экономики."
 councilor_globalism_corporate:0 "Председатель комиссии"
 councilor_globalism_corporate_desc:0 "Председатель глобалистской торговой комиссии. Способствует развитию сотрудничества между торговыми партнерами и решению проблем, возникающих в связи с ростом экономики."
 councilor_in_perfect:0 "Магистрат чистоты"
 councilor_in_perfect_desc:0 "Магистрат чистоты направляет работу судов так, чтобы их решения соответствовали постановлениям Министерства истины."
 councilor_stratocracy:0 "Директор внутренней безопасности"
 councilor_stratocracy_desc:0 "В стратократии директор внутренней безопасности поддерживает порядок при помощи единого силового аппарата, сочетающего функции полиции и армии."
 councilor_bureaucracy:0 "Просвещённый администратор"
 councilor_bureaucracy_desc:0 "Администратор просвещённой бюрократии. Эксперт по эффективности и философски образованный руководитель."
 
