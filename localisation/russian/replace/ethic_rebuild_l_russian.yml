 building_storm_summoning_theater_desc_industrial:0 "Праздник искусства и технологии: ритуалы наших $job_storm_technician_plural$ помогают вызывать космические бури."

 #building_storm_holo_theater: "Storm Holo Hall"
 building_storm_holo_theater_desc_industrial:0 "Трансляции $building_storm_holo_theater$ охватывают всю планету и выходят далеко за её пределы, расширяя влияние процедур наших $job_storm_technician_plural$."

 #building_storm_grand_theater: "Storm Grand Theater"
 building_storm_grand_theater_desc_industrial:0 "Вершина художественных и технических достижений: эти грандиозные центры создают идеальные условия для самых сложных ритуальных процедур."
 
 job_storm_technician:0 "Техник бури"
 job_storm_technician_plural:0 "Техники бури"
 job_storm_technician_desc:0 "Соединяя древние ритуалы с практической наукой, $job_storm_technician$ стремится воздействовать на саму сущность бури.\n\n§R!§! §WДля должности требуется§! £pops£ §H$ethic_industrial$§!"
 job_storm_technician_effect_desc:0 "$job_storm_technician_plural$ превращают $r_consumer_goods$ в $r_unity$, $r_amenities$ и £engineering£ §Yинженерные исследования§!, а также повышают привлекательность принципа £pops£ §H$ethic_industrial$§!."
