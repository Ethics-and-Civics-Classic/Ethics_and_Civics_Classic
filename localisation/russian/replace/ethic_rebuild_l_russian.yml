 civic_reeducated_labor:0 "Жестокие Работорговцы"
 civic_reeducated_labor_desc:0 "Экономика этого общества находится под властью нескольких могущественных и безжалостных владельцев работорговых домов. \n\n§YНадсмотрщики рабов§! производят дополнительное $r_unity$. \nГосударства, не являющиеся §Yфанатичными пацифистами§!, могут строить £building£ §YНеоколизей§!, создающий должности £job_gladiator£ §Yгладиаторов§!. Они производят $r_trade$ и повышают местный §Yурон армий§!. \nУлучшенная версия гражданской модели §Y«$civic_slaver_guilds$»§!."

 job_gladiator:0 "Гладиатор"
 job_gladiator_plural:0 "Гладиаторы"
 job_gladiator_desc:0 "Обычно это порабощённый боец, развлекающий публику сражениями на арене. Во время войны гладиаторы пополняют вооружённые силы.\n\n§R!§!"
