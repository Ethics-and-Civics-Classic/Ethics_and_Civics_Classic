 civic_mining_guilds:1 "Горнодобывающая лига"
 civic_mining_guilds_desc:0 "Несколько крупных горнодобывающих гильдий объединились в экономический союз, занявший господствующее положение в этом обществе. Вклад лиги в экономику государства столь велик, что правительство во многом зависит от её поддержки."

 civic_industrial_automation:0 "Промышленная автоматизация"
 civic_industrial_automation_desc:0 "Экономика этого общества во многом опирается на передовые системы управления — компьютеры, роботов и другие информационные технологии, контролирующие производственные процессы и оборудование."

 civic_innovative_economy:0 "Инновационная экономика"
 civic_innovative_economy_desc:0 "Экономическая парадигма, согласно которой главным фактором самоподдерживающегося роста служат непрерывные технологические инновации. Однако подобная одержимость высокотехнологичным прогрессом может разрушительно сказываться на культуре цивилизации."
 
 civic_innovative_economy_corporate:0 "$civic_innovative_economy$"
 civic_innovative_economy_corporate_desc:0 "$civic_innovative_economy_desc$"

 ####

 civic_meritocratic_capitalism:0 "Меритократический капитализм"
 civic_meritocratic_capitalism_desc:0 "Открытая и честная рыночная конкуренция в этом обществе усиливает предпринимательский дух и ведёт к существенно более производительной и быстрорастущей экономике.\n\n£job_entrepreneur£ §Y$job_entrepreneur$§! §Wпроизводят§! $r_unity$.\n\n§WЭто альтернативная версия гражданской модели§! §Y«Высшая меритократия»§!§W.§!"

 civic_meritocratic_capitalism_corporate:0 "$civic_meritocratic_capitalism$"
 civic_meritocratic_capitalism_corporate_desc:0 "Открытая и честная рыночная конкуренция в этом обществе усиливает предпринимательский дух и ведёт к существенно более производительной и быстрорастущей экономике.\n\n£job_entrepreneur£ §Y$job_entrepreneur$§! §Wпроизводят§! $r_unity$.\n\n§WЭто альтернативная версия гражданской модели§! §Y«Высшая меритократия»§!§W.§! $TABBED_NEW_LINE$ $BOB_forum_tooltip$"

 
 civic_harmonious_hierarchy:0 "Гармоничная иерархия"
 civic_harmonious_hierarchy_desc:0 "Между социальными слоями этого общества традиционно поддерживается определённая гармония: правящая элита управляет государством и экономикой в интересах низших классов.\n\n§WЭто альтернативная версия гражданской модели§! §Y«Родовая аристократия»§!§W.§!"
 
 civic_harmonious_hierarchy_corporate:0 "Гармония классов"
 civic_harmonious_hierarchy_corporate_desc:0 "Между социальными слоями этого общества традиционно поддерживается определённая гармония: элита управляет мегакорпорацией, а большая часть прибыли разделяется с рабочими классами.\n\n§WЭто альтернативная версия гражданской модели§! §Y«Родовая аристократия»§!§W.§!"

 does_not_embrace_species_slavery:0 "$TRIGGER_FAIL$Наша держава либо не допускает §Y$policy_slavery$§!, либо её принципы и гражданские модели не позволяют порабощать этот вид."

 building_deep_space_scanner:0 "Сканер глубокого космоса"
 building_deep_space_scanner_desc:0 "Этот комплекс предназначен для наблюдения за далёким космосом и развития фундаментальных наук."

 tech_repeatable_improved_trade_value:0 "Оптимизация торговых тарифов"
 tech_repeatable_improved_trade_value_desc:0 "Переоценка действующих торговых правил позволяет оптимизировать налогообложение и повысить эффективность межзвёздной торговли."

 civic_nationalistic_zeal_desc:0 "Все слои этого общества пронизаны сильным национальным самосознанием и империалистическими устремлениями.\n§W$BOB_mercs_tooltip$§!"

 IMPERIALIST_MILITARY_FEDERATION:0 "Военный альянс"
