 gov_peoples_commissariat:0 "Народный комиссариат"
 gov_peoples_commissariat_desc:0 "Государством управляет особый чрезвычайный комитет. Его членов утверждает народ, а решения принимаются коллективно ради сохранения благополучия всего общества."

 RT_DEPUTY:0 "Народный депутат"

 #description missing
 building_mecha_monastery:0 "Мехамонастырь"
 building_mecha_monastery_desc:0 "Это монолитное сооружение, выкованное из прочных сплавов и корпусов древних звездолётов, отзывается низким гулом. В его исполинских залах техножрецы обслуживают вычислительные комплексы, от которых зависит само существование колонии."

 empire_is_socialism:0 "$TRIGGER_FAIL$Наша Империя исповедует идеалы этики §Y$ethic_socialism$§!."

