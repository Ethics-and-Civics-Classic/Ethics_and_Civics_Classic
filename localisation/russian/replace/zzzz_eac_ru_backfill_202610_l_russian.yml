 job_mutagenomic_drone_effect_desc:0 "£job_mutagenomic_drone£ $job_mutagenomic_drone_plural$ превращают $r_food$ (или $r_minerals$) в $r_society$ и $r_amenities$."
 job_mutagenomic_drone_plural:0 "Мутагеномные дроны"
 job_mutagenomic_drone_plural_with_icon:0 "£job_mutagenomic_drone£ $job_mutagenomic_drone_plural$"
