 job_death_trader_pirate_effect_desc:0 "[soldier.GetIcon] [soldier.GetNamePlural] превращают $r_consumer_goods$ в $r_physics$, $r_society$ и $r_trade$, увеличивают $i_naval_capacity$ и создают £defense_army£ §Yармии обороны из нежити§!."
 job_death_trader_pirate_plural:0 "Грозные каперы"
 job_death_trader_plural:0 "Торговцы смертью"
 job_grey_paladin:0 "Паладин серой наживы"
 job_grey_paladin_desc:0 "Серые паладины — искусные воины, подчиняющие себе круговорот жизни и смерти с помощью некромантии и извлекающие из этого прибыль."
 job_grey_paladin_effect_desc:0 "[soldier.GetIcon] [soldier.GetNamePlural] превращают $r_consumer_goods$ в $r_unity$, $r_physics$, $r_society$ и $r_trade$, увеличивают $i_naval_capacity$ и создают £defense_army£ §Yармии обороны из нежити§!."
 job_grey_paladin_pirate:0 "Грозный рыцарь-капер"
 job_grey_paladin_pirate_desc:0 "Эти рыцари-каперы — искусные воины, которые с помощью некромантии подчиняют себе круговорот жизни и смерти ради прибыли."
 job_grey_paladin_pirate_effect_desc:0 "[soldier.GetIcon] [soldier.GetNamePlural] превращают $r_consumer_goods$ в $r_unity$, $r_physics$, $r_society$ и $r_trade$, увеличивают $i_naval_capacity$ и создают £defense_army£ §Yармии обороны из нежити§!."
