 job_death_knight:0 "Рыцарь смерти"
 job_death_knight_desc:0 "Присягнув хранить порядок, этот воин повелевает неупокоенными мертвецами, заставляя их исполнять свою волю."
 job_death_knight_effect_desc:0 "[soldier.GetIcon] [soldier.GetNamePlural] превращают $r_consumer_goods$ в $r_unity$, $r_physics$ и $r_society$, увеличивают $i_naval_capacity$ и создают £defense_army£ §Yармии обороны из нежити§!."
 job_death_knight_pirate:0 "Грозный пиратский рыцарь"
 job_death_knight_pirate_desc:0 "Этот рыцарь-пират поклялся хранить порядок по собственному разумению и повелевает неупокоенными мертвецами, чтобы исполнять свою волю."
 job_death_knight_pirate_effect_desc:0 "[soldier.GetIcon] [soldier.GetNamePlural] превращают $r_consumer_goods$ в $r_unity$, $r_physics$ и $r_society$, увеличивают $i_naval_capacity$ и создают £defense_army£ §Yармии обороны из нежити§!."
