 gateway_branch:0 "§HВетвь развития филиалов§!\n§EЭта технология открывает путь к дальнейшему совершенствованию филиалов.§!"
 gov_messianic_cult:0 "Мессианский культ"
 gov_messianic_cult_desc:0 "Небольшие религиозные общины объединились под властью одной династии, представители которой, как они верят, наделены великой божественной силой."
 gov_monastic_commmunes:0 "Монастырские общины"
 gov_monastic_commmunes_desc:0 "Эта форма правления объединяет бесчисленные небольшие религиозные общины, каждая из которых управляет собой самостоятельно. Перед лицом общей беды они готовы сплотиться ради всего общества."
 gov_monastic_hegemony:0 "Монастырская гегемония"
 gov_monastic_hegemony_desc:0 "Общество состоит из небольших обособленных религиозных общин. Их обычаи и порядки устанавливаются более могущественными монастырями, а главенство достаётся сильнейшему из них."
 gov_monastic_order:0 "Монастырский орден"
 gov_monastic_order_desc:0 "Общество состоит из небольших обособленных религиозных общин, подчиняющихся единому уставу, который составляет совет настоятелей монастырей."
