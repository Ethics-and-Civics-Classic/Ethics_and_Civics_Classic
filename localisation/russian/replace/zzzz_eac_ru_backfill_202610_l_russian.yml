 clone_army_digsite_barbaric_despoiler_desc:0 "С тех пор как мы осознали своё положение, споры о §Hплане Великого хана§! раскололи наш народ. Мы недооценили, насколько различными могут быть толкования замысла нашего предтечи. Пока спор не разрешён, общество не способно двигаться дальше, не говоря уже о совместных действиях. Нам нужны ответы, но прийти к согласию никак не удаётся.\n\nЭти раскопки начаты ради поиска свидетельств, которые помогут разрешить спор о великом плане предтечи, выбрать единую трактовку и вновь сплотить наш народ."
