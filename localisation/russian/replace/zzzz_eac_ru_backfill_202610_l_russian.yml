 job_heirs_of_the_khan_enforcer_effect_desc:0 "[enforcer.GetIcon] [heirs_of_the_khan_enforcer.GetNamePlural] снижают £crime£ §Y$PLANET_CRIME_TITLE$§!, создают £defense_army£ §Yоборонительные армии§! и получают $r_trade$ за производство $r_unity$."
