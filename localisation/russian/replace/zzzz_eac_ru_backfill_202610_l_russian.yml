 job_necromancer_pirate_effect_desc:0 "£job_necromancer£ §Y$job_necromancer_plural$§! превращают $r_consumer_goods$ в $r_physics$, $r_society$ и $i_naval_capacity$, а также создают £defense_army£ §Yармии обороны из нежити§!."
