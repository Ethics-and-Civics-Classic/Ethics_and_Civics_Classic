 job_death_trader_effect_desc:0 "[soldier.GetIcon] [soldier.GetNamePlural] превращают $r_consumer_goods$ в $r_physics$, $r_society$ и $r_trade$, увеличивают $i_naval_capacity$ и создают £defense_army£ §Yармии обороны из нежити§!."
 job_death_trader_pirate:0 "Грозный капер"
