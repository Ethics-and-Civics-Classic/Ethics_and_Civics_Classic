l_russian:
 
 building_criminal_headquarters:0 "Оперативный штаб"
 building_criminal_headquarters_desc:0 "Планетарный штаб нашей корпорации, где бюрократы следят за тем, чтобы местные власти не смогли слишком быстро пресечь наши операции.\n\nСоздаёт должность коррумпированного бюрократа, который повышает преступность за каждого силовика (от 3 до 10) и тем самым снижает объём торговли. Кроме того, открывает доступ к дополнительным сооружениям филиала."
 building_high_society_clubs:0 "Клубы высшего общества"
 building_high_society_clubs_desc:0 "Место, где богатые и знаменитые встречаются, заводят связи и занимаются тем, чего не стали бы делать на публике. Что происходит в этих клубах, остаётся в этих клубах... если, конечно, не всплывёт наружу.\n\nПовышает скорость и уровень внедрения, объём торговли филиала и добавляет должность коррумпированного артиста, повышающего счастье и производительность правителей."
 building_Infiltrated_church:0 "Внедрённая церковь"
 building_Infiltrated_church_desc:0 "На первый взгляд эти храмы совершенно обычны, но внутри уже прочно обосновались культисты.\n\nПовышает скорость и уровень внедрения, объём торговли филиала и привлекательность спиритуализма, а также добавляет должность коррумпированного священнослужителя, который повышает стабильность ценой привлекательности руководящих принципов."
 building_union_busting_lawfirm:0 "Антипрофсоюзная юридическая фирма"
 building_union_busting_lawfirm_desc:0 "Лучший способ заставить работников трудиться изо всех сил — не дать им понять, сколько на самом деле стоит их труд. Эти юридические фирмы специализируются на том, чтобы рабочие оставались достаточно разобщёнными и не могли всерьёз угрожать прибыли.\n\nПовышает скорость и уровень внедрения, объём торговли филиала и добавляет должность коррумпированного юриста, увеличивающего производительность рабочих."
 building_unregulated_factories:0 "Нерегулируемые фабрики"
 building_unregulated_factories_desc:0 "Техника безопасности? Она только мешает производительности. Экономя на оборудовании и подготовке персонала, эти фабрики добиваются выдающейся отдачи.\n\nПовышает скорость и уровень внедрения, объём торговли филиала и добавляет должность коррумпированного управляющего, увеличивающего производство сплавов и товаров массового спроса."
 building_unregulated_research_labs:0 "Нерегулируемые исследовательские лаборатории"
 building_unregulated_research_labs_desc:0 "В обмен на права на патенты учёным позволяют проводить здесь любые эксперименты, которые в обычных лабораториях запретили бы из-за «этики» или «правил».\n\nПовышает скорость и уровень внедрения, объём торговли филиала и добавляет должность коррумпированного исследователя, увеличивающего производительность исследователей."
 building_PR_bureau:0 "Бюро по связям с общественностью"
 building_PR_bureau_desc:0 "Бюро по связям с общественностью использует самые разные полулегальные методы контроля информационных потоков и даже не пытается это скрывать."

 job_corrupt_bureaucrat:0 "Коррумпированный бюрократ"
 job_corrupt_bureaucrat_plural:0 "Коррумпированные бюрократы"
 job_corrupt_bureaucrat_desc:0 "Взятки, исчезающие улики, работа на чужую сторону — для них нет запретных методов, если вознаграждение того стоит."
 mod_job_corrupt_bureaucrat_add:0 "Должности $job_corrupt_bureaucrat$"
 job_corrupt_researcher:0 "Коррумпированный исследователь"
 job_corrupt_researcher_plural:0 "Коррумпированные исследователи"
 job_corrupt_researcher_desc:0 "Некоторым исследователям моральные ограничения только мешают. Ради продолжения своих работ они готовы обращаться к внешним покровителям."
 mod_job_corrupt_researcher_add:0 "Должности $job_corrupt_researcher$"
 job_corrupt_lawyer:0 "Коррумпированный юрист"
 job_corrupt_lawyer_plural:0 "Коррумпированные юристы"
 job_corrupt_lawyer_desc:0 "Юрист, казалось бы, должен защищать клиентов. Эти тоже кое-кого защищают — только прежде всего прибыль, а не работников."
 mod_job_corrupt_lawyer_add:0 "Должности $job_corrupt_lawyer$"
 job_corrupt_manager:0 "Коррумпированный управляющий"
 job_corrupt_manager_plural:0 "Коррумпированные управляющие"
 job_corrupt_manager_desc:0 "Управлять квалифицированными рабочими непросто. Ещё труднее заставить их выполнять опасную работу без повышения оплаты. Они знают, как добиться и того и другого."
 mod_job_corrupt_manager_add:0 "Должности $job_corrupt_manager$"
 job_corrupt_priest:0 "Коррумпированный священнослужитель"
 job_corrupt_priest_plural:0 "Коррумпированные священнослужители"
 job_corrupt_priest_desc:0 "Эти священнослужители распространяют учения, способные посеять смуту в обществе, одновременно помогая тем, кто оказался в нужде."
 mod_job_corrupt_priest_add:0 "Должности $job_corrupt_priest$"
 job_corrupt_entertainer:0 "Коррумпированный артист"
 job_corrupt_entertainer_plural:0 "Коррумпированные артисты"
 job_corrupt_entertainer_desc:0 "Этим артистам приходится работать в обстоятельствах, о которых публике лучше никогда не узнать. Но их настоящая ценность раскрывается уже после окончания представления."
 mod_job_corrupt_entertainer_add:0 "Должности $job_corrupt_entertainer$"

 requires_bilding_criminal_headquarters:0 "\nДля строительства этого сооружения на планете сначала должна быть возведена планетарная столица."


