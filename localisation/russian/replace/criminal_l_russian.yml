 job_criminal_smuggler:0 "Пират-контрабандист"
 job_criminal_smuggler_plural:0 "Пираты-контрабандисты"
 job_criminal_smuggler_desc:0 "Пираты низшего ранга рискуют жизнью, переправляя нелегальные товары в другие империи ради щедрой прибыли, 5% которой отдают местному пиратскому капитану."
