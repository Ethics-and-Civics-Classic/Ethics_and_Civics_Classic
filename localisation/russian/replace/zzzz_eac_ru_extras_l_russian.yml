 nations.15268.b:0 "Не вмешиваться в казнь. Мы не можем рисковать последствиями..."
 nations.15269.name:0 "Голод в [From.GetName&prep]"
 nations.15269.desc:1 "К нам прибыл представитель §H[From.GetName&gen]§!. Похоже, страна переживает тяжёлые времена и оказалась перед угрозой §Rголода§!.\n\nОни умоляют помочь всем, чем мы можем..."
 nations.15269.a:0 "Конечно. Мы поможем им, чем сможем."
 nations.15269.b:0 "Пусть сами о себе позаботятся."
 nations.15269.c:0 "У нас нет лишней еды..."
 ethic_fanatic_militarist_nation_pleased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Gулучшатся§!. Принцип государства: §H$ethic_militarist$§!."
 ethic_fanatic_militarist_nation_displeased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Rухудшатся§!. Принцип государства: §H$ethic_militarist$§!."
 nations.15270.name:0 "Дар милитаристского государства"
 nations.15270.desc:0 "В знак дружбы между нашими цивилизациями верховное командование §H[FROM.GetName&gen]§! познакомило наших офицеров с принципами доктрины §Y«$tech_centralized_command$»§!.\n\nПолученные знания позволят разработать собственную военную теорию и включить её в программы академий."
 nations.15270.a:0 "Эта военная теория нам ещё пригодится!"
 nations.15271.name:1 "Пацифисты из [From.GetName&gen]"
 nations.15271.desc:0 "К нашей границе прибыла большая группа §Hбеженцев-пацифистов§! из §H[FROM.GetName&gen]§!, которую преследует небольшой военный отряд. Они бегут от принудительного призыва, считая его нарушением своих убеждений.\n\nЕсли дать им убежище, это наверняка разгневает власти [From.GetName&gen]. Если же позволить преследователям увести пацифистов обратно, тех, скорее всего, отправят на фронт как пушечное мясо... зато соседи могут оказаться должны нам §Gодолжение§!."
 nations.15271.a:0 "Пусть присоединяются к нашим колонистам, если захотят."
 nations.15271.b:0 "Политический инцидент нам не нужен. Отправьте их обратно."
 nations.15271.xenophobe:0 "Чужакам здесь не место."
 nations.15271.civic_fanatic_purifiers:0 "Убивать всех без разбора."
 ethic_fanatic_militarist_nation_refugees:0 "К нашему государству присоединяются §G800§! £pop£ поселений вида §Y[FROM.GetSpeciesNamePlural&gen]§!. Принцип новых жителей: §Y$ethic_pacifist$§!."
 nations.15272.name:0 "Культурный обмен с милитаристским государством"
 nations.15272.desc:1 "Несколько наших посланников вернулись после долгого пребывания среди жителей §H[FROM.GetName&gen]§!. Они хорошо изучили местные обычаи и уклад жизни, что, несомненно, поможет нашим социологическим исследованиям.\n\nНо вместе с чужой культурой приходят и чужие идеи... разрешим ли мы §Hсвободный обмен§!?"
 nations.15272.a:0 "Пусть наши народы свободно обмениваются товарами и идеями."
 nations.15272.b:0 "Мы будем строго контролировать всё, что пересекает границу."
 nations.15273.name:1 "Катастрофа на испытаниях оружия!"
 nations.15273.desc:1 "Во время испытания экспериментального оружия произошёл §Rкатастрофический сбой§!! Государство §H[FROM.GetName]§! утверждает, что ошибка в системе наведения привела к выстрелу прямо по одному из наших поселений, где погибло множество [Root.GetSpeciesNamePlural&gen].\n\nСоседи принесли извинения и настаивают, что произошедшее было случайностью, однако жители требуют от правительства §Pдобиться возмещения§! и привлечь виновных к ответу."
 nations.15273.nomad:1 "Во время испытания экспериментального оружия произошла §Rкатастрофическая авария§!! Государство §H[FROM.GetName]§! утверждает, что ошибка в системе наведения привела к выстрелу прямо по одному из наших поселений, где погибло множество [Root.GetSpeciesNamePlural&gen].\n\nСоседи принесли извинения и настаивают, что произошедшее было случайностью, однако жители требуют от правительства §Pдобиться возмещения§! и привлечь виновных к ответу."
 nations.15273.a:0 "Это была техническая ошибка. Простим их."
 nations.15273.b:0 "Потребовать ответа и возмещения ущерба!"
 nations.15274.name:0 "Запрос технологий"
 nations.15274.desc:1 "Увидев §Hсовременное оружие§! наших сил безопасности, несколько генералов §H[FROM.GetName&gen]§! попросили поделиться частью наших военных технологий.\n\nНаши офицеры сомневаются, стоит ли это делать: если когда-нибудь дело дойдёт до войны, победить милитаристское государство станет заметно труднее.\n\nОтказ почти наверняка будет воспринят как оскорбление."
 nations.15274.a:0 "Передавать милитаристскому государству более совершенное оружие — плохая идея."
 nations.15274.b:0 "Они наши друзья. Поделимся тем, чем можем."
 nations.15275.name:0 "Послание доставлено"
 nations.15275.desc:1 "В последнее время торговля с §H[FROM.GetName&inst]§! почти сошла на нет, а караваны оттуда появляются всё реже. Сегодня мы получили сообщение от представителя местных вооружённых сил. Похоже, там очень недовольны."
 nations.15275.a:0 "Посмотрим, что там."
 nations.15276.name:0 "Послание"
 nations.15276.desc:0 "Поверхностник. Мы пытались быть добрыми соседями, но теперь ясно: вы не намерены оказывать нашей великой цивилизации должного уважения.\n\nОтныне этот мир по праву принадлежит нам целиком. Мы заберём его силой!"
 nations.15276.a:0 "Укрепить границу с §H[FROM.GetName&inst]§!!"
 nations.15277.name:0 "Государство [FROM.GetName] предлагает объединение"
 nations.15277.desc:0 "Во многом наши взгляды совпадают, [ROOT.GetName]. Мы предлагаем официально §Gобъединить§! два национальных государства в §Hединую державу§!."
 nations.15277.merge.fanatic:0 "Наши принципы почти едины, как и наши цели. Пора объединиться."
 nations.15277.merge.normal:0 "Наши принципы близки, а отношения давно стали дружескими. Пора объединиться."
 nations.15277.merge.different:0 "Несмотря на различия в принципах, наши государства стали неразрывно связаны. Пора объединиться."
 nations.15277.no:0 "Сейчас мы не готовы к объединению."
 nations.16261.name:0 "Обрушение"
 nations.16261.desc:1 "С [Root.GetName&gen] пришли тревожные вести! Инопланетяне [Root.Owner.GetSubMantleLower], с которыми мы там воюем, обрушили грунт под целой армией, стоявшей у одного из входов в их туннели.\n\nНемногих солдат, переживших падение, чужаки перебили прежде, чем основные силы успели прийти им на помощь."
 nations.16261.a:0 "Они за это заплатят!"
 nations.16262.name:0 "Диверсионные группы"
 nations.16262.desc:0 "Инопланетяне, живущие под нашей колонией на [Root.GetName&prep], по ночам высылают из туннелей небольшие диверсионные группы. Их последняя атака уничтожила один из важнейших объектов колонии, а прежде чем наши силы успели отреагировать, налётчики скрылись под землёй."
 nations.16262.a:0 "Эти набеги нужно прекратить!"
 nations.16263.name:0 "Атака на поверхность"
 nations.16263.desc:1 "На [Root.GetName&prep] произошло очередное нападение! Инопланетяне [Root.Owner.GetSubMantleLower] вышли из новых туннелей прямо в центре одного из наших крупных поселений. Они подавили местную оборону и перебили колонистов. Отступая в туннели, чужаки утащили под землю нескольких уцелевших, кричавших от ужаса."
 nations.16263.a:0 "Эти убийства не останутся без ответа."
 nations.16264.name:0 "Пещера уцелевших"
 nations.16264.desc:1 "Наши войска на [Root.GetName&prep] продолжают картографировать сеть туннелей под колонией. Они обнаружили крупный город, успевший изолироваться от остального подземного государства ещё до того, как мы заполнили туннели нервно-паралитическим газом. Внутри остаются миллионы перепуганных жителей. Следует ли нашим инженерам обрушить пещеру и довести дело до конца?"
 nations.16264.a:0 "Да. Избавьте их от мучений."
 nations.16264.b:0 "Нет! Вытащите их на поверхность, пусть служат нам."
 nations.16264.b.subterranean:0 "Нет! Доставьте их в колонию, пусть служат нам."
 nations.16265.name:1 "Экспансия: [Root.Owner.GetSubMantleUpper]"
 nations.16265.desc:0 "Мы закончили нейтрализацию нервно-паралитического газа и уборку тел инопланетян из сети туннелей на [Root.GetName&prep]. Теперь нашим колонистам должно быть безопасно туда переселиться. Разумеется, оставленные чужаками примитивные города будут снесены и заменены нашей более совершенной архитектурой."
 nations.16266.name:0 "Золото!"
 nations.16266.desc:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим подземным инопланетянам. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.16266.desc.subterranean:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим обитателям магмы. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.16267.name:0 "Сокровищница"
 nations.16267.desc:0 "Разведчики, обследующие сеть туннелей на [Root.GetName&prep], проникли в царский дворец бывшей столицы подземного государства. Труп того, кого местные считали императором, до сих пор восседает на массивном троне в парадном зале.\n\nПодорвав двери дворцовой сокровищницы, разведчики обнаружили внутри золото и странные произведения инопланетного искусства. Искусство отправят в музеи на [From.Owner.Capital.GetName&acc], а продажа золота заметно пополнит государственный бюджет."
 nations.16268.name:0 "Инцидент с [From.GetName&inst]"
 nations.16268.desc:1 "Дипломатический скандал разгорелся после того, как наш §Yпосланник§! проявил неуважение к местному правителю. [From.GetRulerName] теперь требует показательного суда: посланника уже бросили в тюрьму, а палач ждёт приговора.\n\nМы можем потребовать соблюдения §Hдипломатической неприкосновенности§!, но это вызовет серьёзные §Rдипломатические последствия§!."
 nations.16268.a:0 "Потребовать соблюдения дипломатической неприкосновенности! Посланник нужен нам живым."
 nations.16268.b:0 "Не вмешиваться в казнь. Мы не можем рисковать последствиями..."
 nations.16269.name:0 "Голод в [From.GetName&prep]"
 nations.16269.desc:1 "К нам прибыл представитель §H[From.GetName&gen]§!. Похоже, страна переживает тяжёлые времена и оказалась перед угрозой §Rголода§!.\n\nОни умоляют помочь всем, чем мы можем..."
 nations.16269.a:0 "Конечно. Мы поможем им, чем сможем."
 nations.16269.b:0 "Пусть сами о себе позаботятся."
 nations.16269.c:0 "У нас нет лишней еды..."
 ethic_fanatic_pacifist_nation_pleased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Gулучшатся§!. Принцип государства: §H$ethic_pacifist$§!."
 ethic_fanatic_pacifist_nation_displeased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Rухудшатся§!. Принцип государства: §H$ethic_pacifist$§!."
 nations.16270.name:0 "Дар пацифистского государства"
 nations.16270.desc:0 "В знак дружбы между нашими цивилизациями посланник §H[FROM.GetName&gen]§! познакомил нас с принципами торговой политики §Y«$tech_agri_consortium$»§!.\n\nЭта торговая политика перенаправляет средства из торгового сектора в производство продовольствия."
 nations.16270.a:0 "Как любезно с их стороны."
 nations.16270.b:0 "Субсидии сельскому хозяйству? Принять эту торговую политику!"
 nations.16271.name:1 "Изгнанная военная хунта"
 nations.16271.desc:0 "Вооружённая §Yгруппа наёмников§! бежит из §H[FROM.GetName&gen]§! после неудачной попытки военного переворота. Добравшись до нашей границы, наёмники предложили §Gприсягнуть нам на службу§! в обмен на дипломатическую защиту.\n\nЕсли принять их предложение, это наверняка ухудшит отношения с [FROM.GetName&inst] и может дать толчок §Pмилитаристскому движению§!. Если же выдать беглецов преследующей армии, им, скорее всего, грозит пожизненное заключение."
 nations.16271.a:0 "Включить наёмников в состав наших вооружённых сил."
 nations.16271.b:0 "Давать убежище военной хунте — плохая идея..."
 nations.16271.xenophobe:0 "Чужакам здесь не место."
 nations.16271.civic_fanatic_purifiers:0 "Убивать всех без разбора."
 ethic_fanatic_pacifist_nation_refugees:0 "К нашему государству присоединяются §G800§! £pop£ поселений вида §Y[FROM.GetSpeciesNamePlural&gen]§!. Принцип новых жителей: §Y$ethic_militarist$§!."
 nations.16272.name:0 "Культурный обмен с пацифистским государством"
 nations.16272.desc:1 "Несколько наших посланников вернулись после долгого пребывания среди жителей §H[FROM.GetName&gen]§!. Они хорошо изучили местные обычаи и уклад жизни, что, несомненно, поможет нашим социологическим исследованиям.\n\nНо вместе с чужой культурой приходят и чужие идеи... разрешим ли мы §Hсвободный обмен§!?"
 nations.16272.a:0 "Пусть наши народы свободно обмениваются товарами и идеями."
 nations.16272.b:0 "Мы будем строго контролировать всё, что пересекает границу."
 nations.16273.name:1 "Трагический инцидент с [From.GetName&inst]"
 nations.16273.desc:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Ракета, направлявшаяся в космос, потеряла тягу во время полёта и рухнула на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.16273.nomad:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Обычная ремонтная операция закончилась катастрофой: небесный док рухнул на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.16273.a:0 "Подставим другую щёку."
 nations.16273.b:0 "Мы должны потребовать извинений!"
 nations.16274.name:0 "Запрос технологий"
 nations.16274.desc:1 "Узнав о наших достижениях в пограничной медицине (§Y$tech_frontier_health$§!), несколько посланников §H[FROM.GetName&gen]§! попросили поделиться медицинскими технологиями.\n\nНаши учёные сомневаются: это отвлечёт финансирование от собственных исследовательских приоритетов.\n\nЕсли отказать, это будет воспринято как пренебрежение к тем, кто нуждается в помощи, и наши отношения ухудшатся."
 nations.16274.a:0 "Нужно сохранить нынешние приоритеты исследований."
 nations.16274.b:0 "Они наши друзья. Поделимся тем, чем можем."
 nations.16275.name:0 "Послание доставлено"
 nations.16275.desc:1 "В последнее время торговля с §H[FROM.GetName&inst]§! почти сошла на нет, а караваны оттуда появляются всё реже. Сегодня мы получили сообщение от представителя местных вооружённых сил. Похоже, там очень недовольны."
 nations.16275.a:0 "Посмотрим, что там."
