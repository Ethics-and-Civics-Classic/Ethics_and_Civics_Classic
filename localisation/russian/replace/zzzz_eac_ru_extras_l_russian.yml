 PrimPlayer_terraform_situation_desc:0 "Хотя этот мир бесплоден и лишён жизни, вода здесь сохранилась в замёрзшем виде; возможно, когда-то здесь процветала экосистема. При наличии подходящих технологий его можно терраформировать. В итоге должен получиться §Y$pc_continental$§!."
 PrimPlayer_terraform_toxic_situation:0 "Терраформирование токсичного мира"
 PrimPlayer_terraform_toxic_situation_desc:0 "Хотя ядовитая атмосфера делает этот мир непригодным для жизни, при достаточных усилиях токсичные газы можно расщепить на менее опасные соединения и со временем очистить планету. В итоге должен получиться §Y$pc_continental$§!."
 PrimPlayer_through_the_ages:0 "Сквозь века"
