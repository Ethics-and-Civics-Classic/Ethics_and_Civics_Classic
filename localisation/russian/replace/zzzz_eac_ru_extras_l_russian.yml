 nations.21267.desc:0 "Разведчики, обследующие сеть туннелей на [Root.GetName&prep], проникли в царский дворец бывшей столицы подземного государства. Труп того, кого местные считали императором, до сих пор восседает на массивном троне в парадном зале.\n\nПодорвав двери дворцовой сокровищницы, разведчики обнаружили внутри золото и странные произведения инопланетного искусства. Искусство отправят в музеи на [From.Owner.Capital.GetName&acc], а продажа золота заметно пополнит государственный бюджет."
 nations.21268.name:0 "Инцидент с [From.GetName&inst]"
 nations.21268.desc:1 "Дипломатический скандал разгорелся после того, как наш §Yпосланник§! проявил неуважение к местному правителю. [From.GetRulerName] теперь требует показательного суда: посланника уже бросили в тюрьму, а палач ждёт приговора.\n\nМы можем потребовать соблюдения §Hдипломатической неприкосновенности§!, но это вызовет серьёзные §Rдипломатические последствия§!."
 nations.21268.a:0 "Потребовать соблюдения дипломатической неприкосновенности! Посланник нужен нам живым."
 nations.21268.b:0 "Не вмешиваться в казнь. Мы не можем рисковать последствиями..."
 nations.21269.name:0 "Голод в [From.GetName&prep]"
 nations.21269.desc:1 "К нам прибыл представитель §H[From.GetName&gen]§!. Похоже, страна переживает тяжёлые времена и оказалась перед угрозой §Rголода§!.\n\nОни умоляют помочь всем, чем мы можем..."
 nations.21269.a:0 "Конечно. Мы поможем им, чем сможем."
 nations.21269.b:0 "Пусть сами о себе позаботятся."
 nations.21269.c:0 "У нас нет лишней еды..."
 ethic_fanatic_socialism_nation_pleased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Gулучшатся§!. Принцип государства: §H$ethic_socialism$§!."
 ethic_fanatic_socialism_nation_displeased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Rухудшатся§!. Принцип государства: §H$ethic_socialism$§!."
 nations.21270.name:0 "Дар кооперативного государства"
 nations.21270.desc:0 "В знак дружбы между нашими цивилизациями посланник §H[FROM.GetName&gen]§! познакомил нас с политической доктриной §Y«$tech_planned_economy$»§!. Приняв эту политику, мы сможем перейти к плановой экономике: надёжные и предсказуемые цепочки поставок обеспечат §Gстабильность промышленности§!. Однако рынки, признанные менее важными, столкнутся со §Rснижением объёма торговли§! из-за ограниченной гибкости снабжения."
 nations.21270.a:0 "Очень любезно с их стороны."
 nations.21270.b:0 "Немедленно принять эту политику."
 nations.21271.name:1 "Беженцы из [From.GetName&gen]"
 nations.21271.desc:0 "К нашей границе недавно вышла большая группа беженцев из §H[FROM.GetName&gen]§!, которую преследует небольшой военный отряд. Беженцы утверждают, что состояли в движении сопротивления и после неудавшейся попытки переворота спасаются от расправы.\n\nЕсли принять их, это наверняка разгневает власти [FROM.GetName&gen]. Если же позволить преследователям увести беглецов обратно, их, скорее всего, казнят."
 nations.21271.a:0 "Пусть присоединяются к нашим колонистам, если захотят."
 nations.21271.b:0 "Политический инцидент нам не нужен. Отправьте их обратно."
 nations.21271.xenophobe:0 "Чужакам здесь не место."
 nations.21271.civic_fanatic_purifiers:0 "Убивать всех без разбора."
 ethic_fanatic_socialism_nation_refugees:0 "К нашему государству присоединяются §G800§! £pop£ поселений вида §Y[FROM.GetSpeciesNamePlural&gen]§!. Принцип новых жителей: §Y$ethic_socialism$§!."
 nations.21272.name:0 "Культурный обмен с кооперативным государством"
 nations.21272.desc:1 "Несколько наших посланников вернулись после долгого пребывания среди жителей §H[FROM.GetName&gen]§!. Они хорошо изучили местные обычаи и уклад жизни, что, несомненно, поможет нашим социологическим исследованиям.\n\nНо вместе с чужой культурой приходят и чужие идеи... разрешим ли мы §Hсвободный обмен§!?"
 nations.21272.a:0 "Пусть наши народы свободно обмениваются товарами и идеями."
 nations.21272.b:0 "Мы будем строго контролировать всё, что пересекает границу."
 nations.21273.name:1 "Трагический инцидент с [From.GetName&inst]"
 nations.21273.desc:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Ракета, направлявшаяся в космос, потеряла тягу во время полёта и рухнула на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.21273.nomad:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Обычная ремонтная операция закончилась катастрофой: небесный док рухнул на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.21273.a:0 "Подставим другую щёку."
 nations.21273.b:0 "Мы должны потребовать извинений!"
 nations.21274.name:0 "Запрос технологий"
 nations.21274.desc:1 "Узнав о наших достижениях в пограничной медицине (§Y$tech_frontier_health$§!), несколько посланников §H[FROM.GetName&gen]§! попросили поделиться медицинскими технологиями.\n\nНаши учёные сомневаются: это отвлечёт финансирование от собственных исследовательских приоритетов.\n\nЕсли отказать, [From.GetRulerName] воспримет это как пренебрежение к тем, кто нуждается в помощи, и наши отношения ухудшатся."
 nations.21274.a:0 "Нужно сохранить нынешние приоритеты исследований."
 nations.21274.b:0 "Они наши друзья. Поделимся тем, чем можем."
 nations.21275.name:0 "Послание доставлено"
 nations.21275.desc:1 "В последнее время торговля с §H[FROM.GetName&inst]§! почти сошла на нет, а караваны оттуда появляются всё реже. Сегодня мы получили сообщение от представителя местных вооружённых сил. Похоже, там очень недовольны."
 nations.21275.a:0 "Посмотрим, что там."
 nations.21276.name:0 "Послание"
 nations.21276.desc:0 "Поверхностник. Мы пытались быть добрыми соседями, но теперь ясно: вы не намерены оказывать нашей великой цивилизации должного уважения.\n\nОтныне этот мир по праву принадлежит нам целиком. Мы заберём его силой!"
 nations.21276.a:0 "Укрепить границу с §H[FROM.GetName&inst]§!!"
 nations.21277.name:0 "Государство [FROM.GetName] предлагает объединение"
 nations.21277.desc:0 "Во многом наши взгляды совпадают, [ROOT.GetName]. Мы предлагаем официально §Gобъединить§! два национальных государства в §Hединую державу§!."
 nations.21277.merge.fanatic:0 "Наши принципы почти едины, как и наши цели. Пора объединиться."
 nations.21277.merge.normal:0 "Наши принципы близки, а отношения давно стали дружескими. Пора объединиться."
 nations.21277.merge.different:0 "Несмотря на различия в принципах, наши государства стали неразрывно связаны. Пора объединиться."
 nations.21277.no:0 "Сейчас мы не готовы к объединению."
 civic_tooltip_military_dictatorship_effects_shroud:0 "С начала игры можно вести ['concept_proxy_wars'].\n- £building£ §YСтоличные сооружения§! заменяют должности £job_politician£ §Y$job_politician$§! на £job_commandante£ §Y$job_commandante_plural$§!, которые увеличивают $i_naval_capacity$, создают £defense_army£ §Yоборонительные армии§!, повышают $r_stability$ на планете и снижают урон от §Yбомбардировки§!."
 AUTHORITY_ELECTION_8_CANDIDATES:0 "\n$t$• Быть §Hкандидатами на выборах§! может до §H8§! лидеров"
 CLONE_PRECURSOR_KHAN_UNLOCK_FERTILITY_DESC:0 "Наш вид не сравнится с величием Хана-предтечи, зато станет достаточно плодовитым и стабильным для генетической модификации.\n\nЭффекты:\n— Признак «['trait:trait_clone_soldier_infertile']» будет заменён на признак «['trait:trait_clone_soldier_fertile']».\n— Этот путь приведёт к тому, что все ['building:building_clone_army_clone_vat', $building_clone_army_clone_vat_plural$] будут §Rразобраны§!."
 PRIMPLAYER_SEISMIC_DISTURBANCE_1_PROJECT_DESC:0 "Нужно найти способ установить связь с цивилизацией [Root.Owner.GetSubMantleLower]. Возможно, нам удастся мирно сосуществовать."
 PRIMPLAYER_SEISMIC_DISTURBANCE_2_PROJECT_DESC:0 "Инопланетяне, прорывающиеся на поверхность, представляют угрозу, с которой необходимо покончить. Мы нанесём упреждающий удар по их подземным городам."
 PRIMPLAYER_SEISMIC_DISTURBANCE_3_PROJECT_DESC:0 "Подземная инопланетная цивилизация на [From.From.GetName&prep] представляет явную угрозу нашей колонии и должна быть уничтожена. Нужно найти способ нанести удар по её городам под землёй."
 SPACE_CRITTER_FEEDING_GROUND_PROJECT_DESC:0 "$random_primitive_events.2.desc.pc_gas_giant.anomaly.300.desc$"
 STORM_CHASER_CAPSULE_PROJECT_CANCEL_DESC:0 "Таинственная капсула непонятной конструкции упала с орбиты, вызвав тревогу среди местных жителей. При осмотре один из наших §Hучёных§! обнаружил исходящее из неё опасное излучение, совпадающее с сигнатурами, наблюдаемыми в космосе.\n\nЧто бы ни находилось внутри, оно слишком опасно. Капсулу нужно немедленно вернуть в космос, подальше от [OWNER.capital_scope.GetName&gen]!"
 bombardment_EaC_liberate_slaves_desc:0 "Десантные группы будут вывозить с планеты порабощённых жителей и даровать им свободу.\n\n§RДействует только на§! §Yпорабощённые поселения§!§R!§!"
 civic_tooltip_xeno_militarist_negative_effects:0 "$t$- Доступны не все тактики §Hорбитальной бомбардировки§!: §Yковровая бомбардировка§! §Rзапрещена§!.$TABBED_NEW_LINE$- §YМилитаристская фракция§! приносит $r_influence$ лишь за §R1§! §Yсоперника§!."
 job_noble_supervisor:0 "Аристократ-мудрец"
 job_noble_supervisor_plural:0 "Аристократы-мудрецы"
 job_noble_techno_priest:0 "Знатный техножрец"
 job_noble_techno_priest_plural:0 "Знатные техножрецы"
 nations.14220.option.goodbye:0 "Вольно, генерал [Root.capital_scope.army.Leader.GetName]. Сегодня не тот день."
 civic_tooltip_efficient_bureaucracy_effects:0 "$t$- £job_bureaucrat£ ['concept_bureaucrat'] повышают §Y£mod_country_edict_fund_add£ $MOD_COUNTRY_EDICT_FUND_ADD$§! пропорционально производимому ими $r_unity$."
 concept_democratic_election:0 "Непрямые демократические выборы"
 concept_democratic_election_desc:0 "$AUTHORITY_ELECTION_20_YEARS$ $AUTHORITY_ELECTION_DEMOCRATIC$ $AUTHORITY_ELECTION_8_CANDIDATES$ $AUTHORITY_ELECTION_ALLOWS_REELECTION$ $AUTHORITY_ELECTION_NO_EMERGENCY_ELECTION$"
 eager_explorers_base_effect:0 "$t$- В начале игры доступны 2 §H$explorer_vessel_plural$§! и §H$engineer_vessel$§!, оснащённые технологией £physics£ ['tech_subspace_drive']. Они не могут перемещаться по гиперкоридорам, но способны совершать ограниченные прыжки.$TABBED_NEW_LINE$$t$- $eager_explorers_developing_hyperdrive_situation$\n$TABBED_NEW_LINE$- £planet£ §YСтоличный мир§! недавно пережил ['concept_prosp_uni'].$TABBED_NEW_LINE$- Завершение инцидента §H«$PrimPlayer_situation$»§! даёт §G+1§! к §Yвместимости гражданских моделей§!."
 job_noble_merchant:0 "Высший магнат"
 job_noble_merchant_plural:0 "Высшие магнаты"
 job_storm_duelist_effect_desc:0 "[entertainer.GetIcon] [entertainer.GetNamePlural] превращают $r_consumer_goods$ в $r_unity$, $r_amenities$ и £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!, а также повышают привлекательность одного из руководящих принципов государства."
 origin_tooltip_payback_effects:0 "• $HOMEWORLD$ $TABBED_NEW_LINE$• ['concept_advanced_infrastructure']$TABBED_NEW_LINE$• $PLANETARY_MODIFIERS$ ['concept_payback_unified_purpose']$NEW_LINE$• $HOME_SYSTEM$ ['concept_archaeology_site'] «['concept_payback_digsite']»$NEW_LINE$• Одно ['concept_advanced_empires', развитое ИИ-государство] и несколько ['concept_preftl_civilizations', досветовых цивилизаций] независимо от настроек галактики $NEW_LINE$• Одна досветовая цивилизация будет преображена и получит происхождение §I$origin_broken_shackles$§!\nЗавершение инцидента §H«$PrimPlayer_situation$»§! даёт §G+1§! к §Yвместимости гражданских моделей§!\n\n$eager_explorers_developing_hyperdrive_situation$"
 tech_planetary_unification_desc:2 "Древние враждовавшие племена, позже ставшие соперничающими державами, наконец объединились под одним знаменем и теперь покоряют целую звёздную систему. Мы не должны пасть. И не падём."
 nations.19270.industrial:0 "Найдём этому практическое применение."
 nations.20270.desc:0 "В знак дружбы между нашими цивилизациями посланник §H[FROM.GetName&gen]§! передал нам материалы по технологии §Y«$tech_droid_workers$»§! и познакомил с торговой доктриной §Y«$tech_mining_consortium$»§!.\n\nЕсли принять эту политику, §Y60%§! нашего объёма торговли будет направляться на производство минералов."
 nations.20270.a:0 "Этот подарок может положить начало настоящей горнодобывающей революции!"
 nations.20270.b:0 "Направить торговые излишки на субсидии добывающей промышленности."
 nations.22274.name:0 "Запрос технологий"
 nations.22274.desc:1 "Узнав о наших разработках в области робототехники (§Y$tech_robotic_workers$§!), представители §H[FROM.GetName&gen]§! попросили поделиться технологиями.\n\nНаши учёные сомневаются: у таких разработок есть очевидное военное применение. Если когда-нибудь дело дойдёт до войны, победить конкурентное государство станет заметно сложнее.\n\nОтказ почти наверняка будет воспринят как оскорбление."
 nations.22274.a:0 "Передавать конкурентам технологии боевых роботов — плохая идея."
 nations.22274.b:0 "Они наши друзья. Поделимся тем, чем можем."
 awareness_medium_tt:0 "$awareness_partial_tt$"
 pops_with_icon:0 "£pop£ поселения"
 MOD_POP_GROWTH_SPEED:0 "Скорость прироста поселений"
 tech_solarpunk_sapling:0 "Гигантские саженцы"
 tech_solarpunk_sapling_desc:0 "Сочетание селекции, биоинженерии и экологического проектирования позволяет выращивать колоссальные растения, способные стать основой устойчивой продовольственной системы."
