 ethic_fanatic_materialist_nation_displeased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Rухудшатся§!. Принцип государства: §H$ethic_materialist$§!."
 nations.18270.name:0 "Дар материалистического государства"
 nations.18270.desc:0 "В знак дружбы между нашими цивилизациями посланник §H[FROM.GetName&gen]§! передал нам материалы по технологии §Y«$tech_integrated_cybernetics$»§! и познакомил с торговой доктриной §Y«$tech_innovations$»§!.\n\nПриняв эту политику, мы сможем §Pнаправлять торговую ценность§! на §Gисследования§!, полностью отказавшись от получения §Rэнергокредитов§! за счёт торговли."
 nations.18270.spiritualist:0 "Мы не станем мириться с машинной ересью."
 nations.18271.name:1 "Религиозные преследования"
 nations.18271.desc:0 "§YКараван спиритуалистов§! спасается от преследований в §H[FROM.GetName&prep]§!. Верующие ищут место, где смогут свободно исповедовать свою веру.\n\nЕсли прогнать их, многие, скорее всего, не переживут путь до следующей границы. Но если позволить им поселиться у нас, внутри государства может набрать силу §Pспиритуалистское движение§!.\n"
 nations.18271.a:0 "Пусть присоединяются к нашим колонистам, если захотят."
 nations.18271.b:0 "Политический инцидент нам не нужен. Отправьте их обратно."
 nations.18271.xenophobe:0 "Чужакам здесь не место."
 nations.18271.civic_fanatic_purifiers:0 "Перебить весь караван."
 ethic_fanatic_materialist_nation_refugees:0 "К нашему государству присоединяются §G800§! £pop£ поселений вида §Y[FROM.GetSpeciesNamePlural&gen]§!. Принцип новых жителей: §Y$ethic_spiritualist$§!."
 nations.18272.name:0 "Культурный обмен с материалистическим государством"
 nations.18272.desc:1 "Несколько наших посланников вернулись после долгого пребывания среди жителей §H[FROM.GetName&gen]§!. Они хорошо изучили местные обычаи и уклад жизни, что, несомненно, поможет нашим социологическим исследованиям.\n\nНо вместе с чужой культурой приходят и чужие идеи... разрешим ли мы §Hсвободный обмен§!?"
 nations.18272.a:0 "Пусть наши народы свободно обмениваются товарами и идеями."
 nations.18272.b:0 "Мы будем строго контролировать всё, что пересекает границу."
 nations.18273.name:1 "Трагический инцидент с [From.GetName&inst]"
 nations.18273.desc:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Ракета, направлявшаяся в космос, потеряла тягу во время полёта и рухнула на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.18273.nomad:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Обычная ремонтная операция закончилась катастрофой: небесный док рухнул на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.18273.a:0 "Подставим другую щёку."
 nations.18273.b:0 "Мы должны потребовать извинений!"
 nations.18274.name:0 "Запрос технологий"
 nations.18274.desc:1 "Увидев §Hсовременное оружие§! наших сил безопасности, несколько генералов §H[FROM.GetName&gen]§! попросили поделиться частью наших военных технологий.\n\nНаши офицеры сомневаются, стоит ли это делать: если когда-нибудь дело дойдёт до войны, победить материалистическое государство станет заметно труднее.\n\nОтказ почти наверняка будет воспринят как оскорбление."
 nations.18274.a:0 "Передавать материалистическому государству более совершенное оружие — плохая идея."
 nations.18274.b:0 "Они наши друзья. Поделимся тем, чем можем."
 nations.18275.name:0 "Послание доставлено"
 nations.18275.desc:1 "В последнее время торговля с §H[FROM.GetName&inst]§! почти сошла на нет, а караваны оттуда появляются всё реже. Сегодня мы получили сообщение от представителя местных вооружённых сил. Похоже, там очень недовольны."
 nations.18275.a:0 "Посмотрим, что там."
 nations.18276.name:0 "Послание"
 nations.18276.desc:0 "Поверхностник. Мы пытались быть добрыми соседями, но теперь ясно: вы не намерены оказывать нашей великой цивилизации должного уважения.\n\nОтныне этот мир по праву принадлежит нам целиком. Мы заберём его силой!"
 nations.18276.a:0 "Укрепить границу с §H[FROM.GetName&inst]§!!"
 nations.18277.name:0 "Государство [FROM.GetName] предлагает объединение"
 nations.18277.desc:0 "Во многом наши взгляды совпадают, [ROOT.GetName]. Мы предлагаем официально §Gобъединить§! два национальных государства в §Hединую державу§!."
 nations.18277.merge.fanatic:0 "Наши принципы почти едины, как и наши цели. Пора объединиться."
 nations.18277.merge.normal:0 "Наши принципы близки, а отношения давно стали дружескими. Пора объединиться."
 nations.18277.merge.different:0 "Несмотря на различия в принципах, наши государства стали неразрывно связаны. Пора объединиться."
 nations.18277.no:0 "Сейчас мы не готовы к объединению."
 nations.19261.name:0 "Обрушение"
 nations.19261.desc:1 "С [Root.GetName&gen] пришли тревожные вести! Инопланетяне [Root.Owner.GetSubMantleLower], с которыми мы там воюем, обрушили грунт под целой армией, стоявшей у одного из входов в их туннели.\n\nНемногих солдат, переживших падение, чужаки перебили прежде, чем основные силы успели прийти им на помощь."
 nations.19261.a:0 "Они за это заплатят!"
 nations.19262.name:0 "Диверсионные группы"
 nations.19262.desc:0 "Инопланетяне, живущие под нашей колонией на [Root.GetName&prep], по ночам высылают из туннелей небольшие диверсионные группы. Их последняя атака уничтожила один из важнейших объектов колонии, а прежде чем наши силы успели отреагировать, налётчики скрылись под землёй."
 nations.19262.a:0 "Эти набеги нужно прекратить!"
 nations.19263.name:0 "Атака на поверхность"
 nations.19263.desc:1 "На [Root.GetName&prep] произошло очередное нападение! Инопланетяне [Root.Owner.GetSubMantleLower] вышли из новых туннелей прямо в центре одного из наших крупных поселений. Они подавили местную оборону и перебили колонистов. Отступая в туннели, чужаки утащили под землю нескольких уцелевших, кричавших от ужаса."
 nations.19263.a:0 "Эти убийства не останутся без ответа."
 nations.19264.name:0 "Пещера уцелевших"
 nations.19264.desc:1 "Наши войска на [Root.GetName&prep] продолжают картографировать сеть туннелей под колонией. Они обнаружили крупный город, успевший изолироваться от остального подземного государства ещё до того, как мы заполнили туннели нервно-паралитическим газом. Внутри остаются миллионы перепуганных жителей. Следует ли нашим инженерам обрушить пещеру и довести дело до конца?"
 nations.19264.a:0 "Да. Избавьте их от мучений."
 nations.19264.b:0 "Нет! Вытащите их на поверхность, пусть служат нам."
 nations.19264.b.subterranean:0 "Нет! Доставьте их в колонию, пусть служат нам."
 nations.19265.name:1 "Экспансия: [Root.Owner.GetSubMantleUpper]"
 nations.19265.desc:0 "Мы закончили нейтрализацию нервно-паралитического газа и уборку тел инопланетян из сети туннелей на [Root.GetName&prep]. Теперь нашим колонистам должно быть безопасно туда переселиться. Разумеется, оставленные чужаками примитивные города будут снесены и заменены нашей более совершенной архитектурой."
 nations.19266.name:0 "Золото!"
 nations.19266.desc:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим подземным инопланетянам. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.19266.desc.subterranean:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим обитателям магмы. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.19267.name:0 "Сокровищница"
 nations.19267.desc:0 "Разведчики, обследующие сеть туннелей на [Root.GetName&prep], проникли в царский дворец бывшей столицы подземного государства. Труп того, кого местные считали императором, до сих пор восседает на массивном троне в парадном зале.\n\nПодорвав двери дворцовой сокровищницы, разведчики обнаружили внутри золото и странные произведения инопланетного искусства. Искусство отправят в музеи на [From.Owner.Capital.GetName&acc], а продажа золота заметно пополнит государственный бюджет."
 nations.19268.name:0 "Инцидент с [From.GetName&inst]"
 nations.19268.desc:1 "Дипломатический скандал разгорелся после того, как наш §Yпосланник§! проявил неуважение к местному правителю. [From.GetRulerName] теперь требует показательного суда: посланника уже бросили в тюрьму, а палач ждёт приговора.\n\nМы можем потребовать соблюдения §Hдипломатической неприкосновенности§!, но это вызовет серьёзные §Rдипломатические последствия§!."
 nations.19268.a:0 "Потребовать соблюдения дипломатической неприкосновенности! Посланник нужен нам живым."
 nations.19268.b:0 "Не вмешиваться в казнь. Мы не можем рисковать последствиями..."
 nations.19269.name:0 "Голод в [From.GetName&prep]"
 nations.19269.desc:1 "К нам прибыл представитель §H[From.GetName&gen]§!. Похоже, страна переживает тяжёлые времена и оказалась перед угрозой §Rголода§!.\n\nОни умоляют помочь всем, чем мы можем..."
 nations.19269.a:0 "Конечно. Мы поможем им, чем сможем."
 nations.19269.b:0 "Пусть сами о себе позаботятся."
 nations.19269.c:0 "У нас нет лишней еды..."
 ethic_fanatic_green_nation_pleased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Gулучшатся§!. Принцип государства: §H$ethic_green$§!."
 ethic_fanatic_green_nation_displeased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Rухудшатся§!. Принцип государства: §H$ethic_green$§!."
 nations.19270.name:0 "Дар экоцентристского государства"
 nations.19270.desc:0 "В знак дружбы между нашими цивилизациями посланник §H[FROM.GetName&gen]§! передал нам материалы по технологии §H«$tech_bioreactor$»§!. Эти наработки заметно продвинут наши собственные исследования."
 nations.19270.a:0 "Очень любезно с их стороны."
 nations.19271.name:1 "Беженцы из [From.GetName&gen]"
 nations.19271.desc:0 "К нашей границе недавно вышла большая группа беженцев из §H[FROM.GetName&gen]§!, которую преследует небольшой военный отряд. Беженцы утверждают, что состояли в движении сопротивления и после неудавшейся попытки переворота спасаются от расправы.\n\nЕсли принять их, это наверняка разгневает власти [FROM.GetName&gen]. Если же позволить преследователям увести беглецов обратно, их, скорее всего, казнят."
 nations.19271.a:0 "Пусть присоединяются к нашим колонистам, если захотят."
 nations.19271.b:0 "Политический инцидент нам не нужен. Отправьте их обратно."
 nations.19271.xenophobe:0 "Чужакам здесь не место."
 nations.19271.civic_fanatic_purifiers:0 "Убивать всех без разбора."
 ethic_fanatic_green_nation_refugees:0 "К нашему государству присоединяются §G800§! £pop£ поселений вида §Y[FROM.GetSpeciesNamePlural&gen]§!. Принцип новых жителей: §Y$ethic_green$§!."
 nations.19272.name:0 "Культурный обмен с экоцентристским государством"
 nations.19272.desc:1 "Несколько наших посланников вернулись после долгого пребывания среди жителей §H[FROM.GetName&gen]§!. Они хорошо изучили местные обычаи и уклад жизни, что, несомненно, поможет нашим социологическим исследованиям.\n\nНо вместе с чужой культурой приходят и чужие идеи... разрешим ли мы §Hсвободный обмен§!?"
 nations.19272.a:0 "Пусть наши народы свободно обмениваются товарами и идеями."
 nations.19272.b:0 "Мы будем строго контролировать всё, что пересекает границу."
 nations.19273.name:1 "Трагический инцидент с [From.GetName&inst]"
 nations.19273.desc:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Ракета, направлявшаяся в космос, потеряла тягу во время полёта и рухнула на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.19273.nomad:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Обычная ремонтная операция закончилась катастрофой: небесный док рухнул на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.19273.a:0 "Подставим другую щёку."
 nations.19273.b:0 "Мы должны потребовать извинений!"
 nations.19274.name:0 "Запрос технологий"
 nations.19274.desc:1 "Узнав о наших достижениях в пограничной медицине (§Y$tech_frontier_health$§!), несколько посланников §H[FROM.GetName&gen]§! попросили поделиться медицинскими технологиями.\n\nНаши учёные сомневаются: это отвлечёт финансирование от собственных исследовательских приоритетов.\n\nЕсли отказать, [From.GetRulerName] воспримет это как пренебрежение к тем, кто нуждается в помощи, и наши отношения ухудшатся."
 nations.19274.a:0 "Нужно сохранить нынешние приоритеты исследований."
 nations.19274.b:0 "Они наши друзья. Поделимся тем, чем можем."
 nations.19275.name:0 "Послание доставлено"
 nations.19275.desc:1 "В последнее время торговля с §H[FROM.GetName&inst]§! почти сошла на нет, а караваны оттуда появляются всё реже. Сегодня мы получили сообщение от представителя местных вооружённых сил. Похоже, там очень недовольны."
 nations.19275.a:0 "Посмотрим, что там."
