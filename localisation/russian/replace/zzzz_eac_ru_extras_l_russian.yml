 civic_terraforming_effects:0 "$t$§EЛандшафтная инженерия§!: даёт преимущества от различных §Yприродных§! планетарных §Hсвойств§! и £blocker£ §Hпрепятствий§!.$TABBED_NEW_LINE$$t$- Природные £blocker£ §Hпрепятствия§! дают £housing£ §Yжильё§!, а £blocker£ ['heavy_blockers'] блокируют меньше £district£ §Yрайонов§!.$TABBED_NEW_LINE$$t$- Открывает £job_engineer£ ['eco_engineer_swap'] и £job_biologist£ ['eco_biologist_swap'].\n$TABBED_NEW_LINE$§EВосстановление экологии§!:$TABBED_NEW_LINE$$t$- Расчистка планетарных £blocker£ §Hпрепятствий§! может приносить различные разовые ресурсы.$TABBED_NEW_LINE$$t$- После изучения технологии расчистки определённого £blocker£ §Hпрепятствия§! становится доступно решение, позволяющее §Yсоздавать§! его на подходящих планетах.$TABBED_NEW_LINE$$t$- Открывает особое планетарное решение §Y«Восстановление экологии»§!, устраняющее некоторые экологические аномалии планеты — например §Yоблучённую планету§!, §Yприливную синхронизацию§! или §Yповреждённую экологию§!.\n$TABBED_NEW_LINE$§EРасширенные возможности терраформирования§!:$TABBED_NEW_LINE$$t$- Начинает с £society£ технологий §Y«Очистка атмосферы»§! и £society£ §Y«Изменение формы суши»§!.$TABBED_NEW_LINE$$t$- Повышает вероятность получить вариант исследования £society£ §Y«Адаптация к опустошённым мирам»§!.$TABBED_NEW_LINE$$t$- Позволяет изучить высокоуровневую £society£ технологию §Y«Очищение атмосферы»§!, открывающую терраформирование §Hтоксичных миров§!.$TABBED_NEW_LINE$$t$- Позволяет построить уникальный для планеты £building£ §YКомплекс климатического контроля§!, который даёт §G+15%§! пригодности, производит $r_physics$ и $r_society$ и требует §R10§! $r_energy$ содержания.\n$BOB_research_tooltip$"
 civic_welfare_state_effects:3 "$t$- Политика §H«Государственное здравоохранение»§! всегда §Gдоступна§!.$TABBED_NEW_LINE$- £district£ §YГородские районы§! дают §G+100§! £housing£ §Yжилья§!.$TABBED_NEW_LINE$- £building£ §YСтоличные сооружения§! дают §G+100§! должностей £job_healthcare£ §Y$job_healthcare$§!.$TABBED_NEW_LINE$- $r_amenities$ за каждые 100 £job_healthcare£ §Y$job_healthcare_plural$§!: §G+200§!.$TABBED_NEW_LINE$- $r_amenities$ за каждые 100 £job_politician£ §Y$job_politician_plural$§!: §G+200§!.\n$BOB_xeno_outreach_tooltip$"
