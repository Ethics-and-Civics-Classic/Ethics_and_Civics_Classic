 uplifting_invoice_desc_details:0 "Документ, составленный Межзвёздной компанией кредитного управления, перечисляет все услуги и имущество, предоставленные цивилизации [this.GetName&dat] за двадцать лет программы возвышения. В перечень включены даже счета за лечение каждого пациента, побывавшего в генной клинике. Эта так называемая «благотворительная корпорация» требует возместить все расходы и утверждает, что любое вмешательство в принадлежащие ей объекты возвышения на территории [this.GetName&gen] станет очередным нарушением договора."
