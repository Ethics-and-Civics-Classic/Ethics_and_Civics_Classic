 nations.90001.ethic_fanatic_authoritarian.desc.open_border:0 "Королевский посланник [FROM.GetName&gen] запросил аудиенцию для переговоров об открытии границы. Переговоры прошли успешно, и стороны согласовали взаимные условия приграничного сообщения.\n\nТеперь [ROOT.Ruler.GetName] готовится официально объявить режим границы между [ROOT.GetName&inst] и [FROM.GetName&inst]."
 nations.90001.ethic_fanatic_egalitarian.desc.open_border:0 "Посланники [FROM.GetName&gen] передали предложение открыть границу и обеспечить свободное передвижение между нашими государствами. Переговоры прошли успешно, и стороны согласовали взаимные условия приграничного сообщения.\n\nТеперь [ROOT.Ruler.GetName] готовится официально объявить режим границы между [ROOT.GetName&inst] и [FROM.GetName&inst]."
 nations.90001.ethic_fanatic_xenophobe.desc.open_border:0 "Посланник [FROM.GetName&gen] пересёк нашу границу и передал предложение об её открытии. В документе изложены взаимоприемлемые условия приграничного сообщения.\n\n[ROOT.Ruler.GetName] готовится официально объявить режим границы между [ROOT.GetName&inst] и [FROM.GetName&inst]."
 nations.90001.ethic_fanatic_xenophile.desc.open_border:0 "Несколько посланников [FROM.GetName&gen] с большим интересом прибыли в нашу столицу, посетили её главные достопримечательности и познакомились с культурой [ROOT.GetName&gen]. После продолжительного обмена мнениями они предложили установить режим открытой границы между нашими государствами.\n\nНарод ждёт, когда [ROOT.Ruler.GetName] объявит официальную позицию по границе между [ROOT.GetName&inst] и [FROM.GetName&inst]."
 nations.90001.ethic_fanatic_pacifist.desc.open_border:0 "Посланник [FROM.GetName&gen] прибыл с мирными намерениями и предложением открыть границу между нашими государствами.\n\n[ROOT.Ruler.GetName] готовится официально объявить режим границы между [ROOT.GetName&inst] и [FROM.GetName&inst]."
 nations.90001.ethic_fanatic_spiritualist.desc.open_border:0 "Посланники [FROM.GetName&gen] прибыли с предложением открыть границу между нашими государствами. В их словах это не просто дипломатическая мера, а возможность сблизить народы и позволить им свободнее следовать своим духовным путям. Переговоры завершились взаимоприемлемыми условиями.\n\nТеперь [ROOT.Ruler.GetName] готовится официально объявить режим границы между [ROOT.GetName&inst] и [FROM.GetName&inst]."
 nations.90001.ethic_fanatic_materialist.desc.open_border:0 "Делегация [FROM.GetName&gen] представила подробный проект открытия границы, подкреплённый расчётами транспортных потоков, научного обмена и ожидаемой экономической выгоды. После обсуждения стороны согласовали условия приграничного движения.\n\nТеперь [ROOT.Ruler.GetName] готовится официально объявить режим границы между [ROOT.GetName&inst] и [FROM.GetName&inst]."
 nations.90001.ethic_fanatic_green.desc.open_border:0 "Представители [FROM.GetName&gen] предложили открыть границу между нашими государствами, сохранив общие требования к защите природных территорий и перемещению через уязвимые экосистемы. Стороны смогли согласовать приемлемый порядок приграничного движения.\n\nТеперь [ROOT.Ruler.GetName] готовится официально объявить режим границы между [ROOT.GetName&inst] и [FROM.GetName&inst]."
 nations.90001.ethic_fanatic_industrial.desc.open_border:0 "Представители [FROM.GetName&gen] предложили открыть границу и связать наши государства новыми транспортными и грузовыми коридорами. После деловых переговоров стороны согласовали условия перемещения граждан и товаров.\n\nТеперь [ROOT.Ruler.GetName] готовится официально объявить режим границы между [ROOT.GetName&inst] и [FROM.GetName&inst]."
 nations.90001.ethic_fanatic_socialism.desc.open_border:0 "Делегация [FROM.GetName&gen] предложила открыть границу, чтобы жители наших государств могли свободнее трудиться, путешествовать и сотрудничать друг с другом. Переговоры завершились соглашением о взаимном приграничном движении.\n\nТеперь [ROOT.Ruler.GetName] готовится официально объявить режим границы между [ROOT.GetName&inst] и [FROM.GetName&inst]."
 nations.90001.ethic_fanatic_capitalism.desc.open_border:0 "Представители [FROM.GetName&gen] прибыли с предложением открыть границу для путешественников, предпринимателей и новых коммерческих связей. После переговоров стороны согласовали взаимовыгодные правила приграничного движения.\n\nТеперь [ROOT.Ruler.GetName] готовится официально объявить режим границы между [ROOT.GetName&inst] и [FROM.GetName&inst]."
 nations.90001.open_border.yes:0 "Наши границы открыты для [FROM.GetName&gen]"
 nations.90001.open_border.no:0 "[FROM.GetName&dat] здесь не рады."
 nations.90002.branch_office.title:0 "Филиал [FROM.GetName&gen]"
 nations.90002.branch_office.desc:0 "Клиентам у нас всегда рады! Наш специалист по закупкам вскоре свяжется с вами, чтобы обсудить коммерческие условия открытия нового филиала."
 nations.90002.branch_office.desc.established:0 "Добро пожаловать, уважаемый клиент! Представитель службы поддержки скоро свяжется с вами и ответит на любые вопросы об условиях обслуживания."
 nations.90002.branch_office.yes:0 "Открыть §Yфилиал§! на планете §H[Root.Capital.GetName]§!"
 nations.90002.branch_office.no:0 "Нет, спасибо."
 nations.90002.branch_office.established:0 "Сейчас у нас нет вопросов."
 EaC_civic_mechanic_events.103.option.commander_hive_a:0 "Пусть знания Хранилища станут частью памяти улья."
 EaC_civic_mechanic_events.103.option.commander_machine_a:0 "Интегрировать знания Хранилища в память правителя."
