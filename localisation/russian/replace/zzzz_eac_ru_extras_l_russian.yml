 PrimPlayer_broken_shackles_hyperdrive_approach_tooltip:0 "Нашим бывшим хозяевам-работорговцам из §Y$NAME_MSI_country$§! не удалось стереть инженерную базу данных. После их поражения уцелело §G3% данных§!, включая подробные чертежи технологии §H$tech_hyper_drive_1$§!."
