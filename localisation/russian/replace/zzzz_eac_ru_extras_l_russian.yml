 ethic_fanatic_xenophobe_nation_displeased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Rухудшатся§!. Принцип государства: §H$ethic_xenophobe$§!."
 nations.13270.name:0 "Дар ксенофобского государства"
 nations.13270.desc:0 "В знак дружбы между нашими цивилизациями посланник §H[FROM.GetName&gen]§! передал нам материалы по технологии §H«$tech_encryption_1$»§!. Дар был передан от имени [FROM.GetRulerName]."
 nations.13270.a:0 "Очень любезно с их стороны."
 nations.13271.name:1 "Беженцы из [From.GetName&gen]"
 nations.13271.desc:0 "К нашей границе недавно вышла большая группа беженцев из §H[FROM.GetName&gen]§!, которую преследует небольшой военный отряд. Беженцы утверждают, что состояли в движении сопротивления и после неудавшейся попытки переворота спасаются от расправы.\n\nЕсли принять их, это наверняка разгневает власти [FROM.GetName&gen]. Если же позволить преследователям увести беглецов обратно, их, скорее всего, казнят."
 nations.13271.a:0 "Пусть присоединяются к нашим колонистам, если захотят."
 nations.13271.b:0 "Политический инцидент нам не нужен. Отправьте их обратно."
 nations.13271.xenophobe:0 "Чужакам здесь не место."
 nations.13271.civic_fanatic_purifiers:0 "Убивать всех без разбора."
 ethic_fanatic_xenophobe_nation_refugees:0 "К нашему государству присоединяются §G800§! £pop£ поселений вида §Y[FROM.GetSpeciesNamePlural&gen]§!. Принцип новых жителей: §Y$ethic_xenophobe$§!."
 nations.13272.name:0 "Культурный обмен с ксенофобским государством"
 nations.13272.desc:1 "Несколько наших посланников вернулись после долгого пребывания среди жителей §H[FROM.GetName&gen]§!. Они хорошо изучили местные обычаи и уклад жизни, что, несомненно, поможет нашим социологическим исследованиям.\n\nНо вместе с чужой культурой приходят и чужие идеи... разрешим ли мы §Hсвободный обмен§!?"
 nations.13272.a:0 "Пусть наши народы свободно обмениваются товарами и идеями."
 nations.13272.b:0 "Мы будем строго контролировать всё, что пересекает границу."
 nations.13273.name:1 "Разбушевавшиеся предразумные"
 nations.13273.desc:1 "Мы получили сообщение от §H[FROM.GetName&gen]§!: из расположенного у нашей границы ксенозоопарка сбежали животные. Пограничники уже поймали беглецов, но лишь после того, как те устроили настоящий §Pпогром§! и причинили заметный ущерб.\n\nПри ближайшем рассмотрении выяснилось, что пленники принадлежат к §Yпредразумному§! виду. Вероятно, соседи изучали их. Если мы откажемся вернуть существ, отношения с [FROM.GetName&inst] серьёзно ухудшатся. Впрочем, в обмен на возвращение можно потребовать компенсацию за причинённый ущерб."
 nations.13273.nomad:1 "$nations.14273.desc$"
 nations.13273.a:0 "Вернуть их бесплатно."
 nations.13273.b:0 "Вернуть, но потребовать возмещения ущерба."
 nations.13273.c:0 "Предразумных мы оставим себе."
 nations.13273.civic_fanatic_purifiers:0 "Истребить предразумных."
 nations.13274.name:0 "Запрос технологий"
 nations.13274.desc:1 "Увидев §Hсовременное оружие§! наших сил безопасности, несколько генералов §H[FROM.GetName&gen]§! попросили поделиться частью наших военных технологий.\n\nНаши офицеры сомневаются, стоит ли это делать: если когда-нибудь дело дойдёт до войны, победить ксенофобское государство станет заметно труднее.\n\nОтказ почти наверняка будет воспринят как оскорбление."
 nations.13274.a:0 "Передавать ксенофобскому государству более совершенное оружие — плохая идея."
 nations.13274.b:0 "Они наши друзья. Поделимся тем, чем можем."
 nations.13275.name:0 "Послание доставлено"
 nations.13275.desc:1 "В последнее время торговля с §H[FROM.GetName&inst]§! почти сошла на нет, а караваны оттуда появляются всё реже. Сегодня мы получили сообщение от представителя местных вооружённых сил. Похоже, там очень недовольны."
 nations.13275.a:0 "Посмотрим, что там."
 nations.13276.name:0 "Послание"
 nations.13276.desc:0 "Поверхностник. Мы пытались быть добрыми соседями, но теперь ясно: вы не намерены оказывать нашей великой цивилизации должного уважения.\n\nОтныне этот мир по праву принадлежит нам целиком. Мы заберём его силой!"
 nations.13276.a:0 "Укрепить границу с §H[FROM.GetName&inst]§!!"
 nations.13277.name:0 "Государство [FROM.GetName] предлагает объединение"
 nations.13277.desc:0 "Во многом наши взгляды совпадают, [ROOT.GetName]. Мы предлагаем официально §Gобъединить§! два национальных государства в §Hединую державу§!."
 nations.13277.merge.fanatic:0 "Наши принципы почти едины, как и наши цели. Пора объединиться."
 nations.13277.merge.normal:0 "Наши принципы близки, а отношения давно стали дружескими. Пора объединиться."
 nations.13277.merge.different:0 "Несмотря на различия в принципах, наши государства стали неразрывно связаны. Пора объединиться."
 nations.13277.no:0 "Сейчас мы не готовы к объединению."
 nations.14261.name:0 "Обрушение"
 nations.14261.desc:1 "С [Root.GetName&gen] пришли тревожные вести! Инопланетяне [Root.Owner.GetSubMantleLower], с которыми мы там воюем, обрушили грунт под целой армией, стоявшей у одного из входов в их туннели.\n\nНемногих солдат, переживших падение, чужаки перебили прежде, чем основные силы успели прийти им на помощь."
 nations.14261.a:0 "Они за это заплатят!"
 nations.14262.name:0 "Диверсионные группы"
 nations.14262.desc:0 "Инопланетяне, живущие под нашей колонией на [Root.GetName&prep], по ночам высылают из туннелей небольшие диверсионные группы. Их последняя атака уничтожила один из важнейших объектов колонии, а прежде чем наши силы успели отреагировать, налётчики скрылись под землёй."
 nations.14262.a:0 "Эти набеги нужно прекратить!"
 nations.14263.name:0 "Атака на поверхность"
 nations.14263.desc:1 "На [Root.GetName&prep] произошло очередное нападение! Инопланетяне [Root.Owner.GetSubMantleLower] вышли из новых туннелей прямо в центре одного из наших крупных поселений. Они подавили местную оборону и перебили колонистов. Отступая в туннели, чужаки утащили под землю нескольких уцелевших, кричавших от ужаса."
 nations.14263.a:0 "Эти убийства не останутся без ответа."
 nations.14264.name:0 "Пещера уцелевших"
 nations.14264.desc:1 "Наши войска на [Root.GetName&prep] продолжают картографировать сеть туннелей под колонией. Они обнаружили крупный город, успевший изолироваться от остального подземного государства ещё до того, как мы заполнили туннели нервно-паралитическим газом. Внутри остаются миллионы перепуганных жителей. Следует ли нашим инженерам обрушить пещеру и довести дело до конца?"
 nations.14264.a:0 "Да. Избавьте их от мучений."
 nations.14264.b:0 "Нет! Вытащите их на поверхность, пусть служат нам."
 nations.14264.b.subterranean:0 "Нет! Доставьте их в колонию, пусть служат нам."
 nations.14265.name:1 "Экспансия: [Root.Owner.GetSubMantleUpper]"
 nations.14265.desc:0 "Мы закончили нейтрализацию нервно-паралитического газа и уборку тел инопланетян из сети туннелей на [Root.GetName&prep]. Теперь нашим колонистам должно быть безопасно туда переселиться. Разумеется, оставленные чужаками примитивные города будут снесены и заменены нашей более совершенной архитектурой."
 nations.14266.name:0 "Золото!"
 nations.14266.desc:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим подземным инопланетянам. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.14266.desc.subterranean:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим обитателям магмы. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.14267.name:0 "Сокровищница"
 nations.14267.desc:0 "Разведчики, обследующие сеть туннелей на [Root.GetName&prep], проникли в царский дворец бывшей столицы подземного государства. Труп того, кого местные считали императором, до сих пор восседает на массивном троне в парадном зале.\n\nПодорвав двери дворцовой сокровищницы, разведчики обнаружили внутри золото и странные произведения инопланетного искусства. Искусство отправят в музеи на [From.Owner.Capital.GetName&acc], а продажа золота заметно пополнит государственный бюджет."
 nations.14268.name:0 "Инцидент с [From.GetName&inst]"
 nations.14268.desc:1 "Дипломатический скандал разгорелся после того, как наш §Yпосланник§! проявил неуважение к местному правителю. [From.GetRulerName] теперь требует показательного суда: посланника уже бросили в тюрьму, а палач ждёт приговора.\n\nМы можем потребовать соблюдения §Hдипломатической неприкосновенности§!, но это вызовет серьёзные §Rдипломатические последствия§!."
 nations.14268.a:0 "Потребовать соблюдения дипломатической неприкосновенности! Посланник нужен нам живым."
 nations.14268.b:0 "Не вмешиваться в казнь. Мы не можем рисковать последствиями..."
 nations.14269.name:0 "Голод в [From.GetName&prep]"
 nations.14269.desc:1 "К нам прибыл представитель §H[From.GetName&gen]§!. Похоже, страна переживает тяжёлые времена и оказалась перед угрозой §Rголода§!.\n\nОни умоляют помочь всем, чем мы можем..."
 nations.14269.a:0 "Конечно. Мы поможем им, чем сможем."
 nations.14269.b:0 "Пусть сами о себе позаботятся."
 nations.14269.c:0 "У нас нет лишней еды..."
 ethic_fanatic_xenophile_nation_pleased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Gулучшатся§!. Принцип государства: §H$ethic_xenophile$§!."
 ethic_fanatic_xenophile_nation_displeased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Rухудшатся§!. Принцип государства: §H$ethic_xenophile$§!."
 nations.14270.name:0 "Дар ксенофильского государства"
 nations.14270.desc:0 "В знак дружбы между нашими цивилизациями посланник §H[FROM.GetName&gen]§! показал нам, как создавать §H$tech_resort_colonies$§!. Многие [ROOT.GetSpeciesNamePlural] уже интересуются, не собирается ли правительство основать такую колонию."
 nations.14270.a:0 "Звучит как прекрасное место для отпуска!"
 nations.14271.name:1 "Беженцы из [From.GetName&gen]"
 nations.14271.desc:0 "К нашей границе недавно вышла большая группа беженцев из §H[FROM.GetName&gen]§!, которую преследует небольшой военный отряд. Беженцы утверждают, что состояли в движении сопротивления и после неудавшейся попытки переворота спасаются от расправы.\n\nЕсли принять их, это наверняка разгневает власти [FROM.GetName&gen]. Если же позволить преследователям увести беглецов обратно, их, скорее всего, казнят."
 nations.14271.a:0 "Пусть присоединяются к нашим колонистам, если захотят."
 nations.14271.b:0 "Политический инцидент нам не нужен. Отправьте их обратно."
 nations.14271.xenophobe:0 "Чужакам здесь не место."
 nations.14271.civic_fanatic_purifiers:0 "Убивать всех без разбора."
 ethic_fanatic_xenophile_nation_refugees:0 "К нашему государству присоединяются §G800§! £pop£ поселений вида §Y[FROM.GetSpeciesNamePlural&gen]§!. Принцип новых жителей: §Y$ethic_xenophile$§!."
 nations.14272.name:0 "Культурный обмен с ксенофильским государством"
 nations.14272.desc:1 "Несколько наших посланников вернулись после долгого пребывания среди жителей §H[FROM.GetName&gen]§!. Они хорошо изучили местные обычаи и уклад жизни, что, несомненно, поможет нашим социологическим исследованиям.\n\nНо вместе с чужой культурой приходят и чужие идеи... разрешим ли мы §Hсвободный обмен§!?"
 nations.14272.a:0 "Пусть наши народы свободно обмениваются товарами и идеями."
 nations.14272.b:0 "Мы будем строго контролировать всё, что пересекает границу."
 nations.14273.name:1 "Разбушевавшиеся предразумные"
 nations.14273.desc:1 "Мы получили сообщение от §H[FROM.GetName&gen]§!: из расположенного у нашей границы ксенозоопарка сбежали животные. Пограничники уже поймали беглецов, но лишь после того, как те устроили настоящий §Pпогром§! и причинили заметный ущерб.\n\nПри ближайшем рассмотрении выяснилось, что пленники относятся к некоему §Yпредразумному§! виду. Вероятно, соседи изучали их. Отказ вернуть существ сильно испортит отношения с [FROM.GetName&inst]. Впрочем, мы можем потребовать компенсацию за причинённый ущерб в обмен на их возвращение."
 nations.14273.nomad:1 "$nations.14273.desc$"
 nations.14273.a:0 "Вернуть их бесплатно."
 nations.14273.b:0 "Вернуть, но потребовать возмещения ущерба."
 nations.14273.c:0 "Предразумных мы оставим себе."
 nations.14273.civic_fanatic_purifiers:0 "Истребить предразумных."
 nations.14274.name:0 "Запрос технологий"
 nations.14274.desc:1 "Узнав о наших прорывах в изучении инопланетной жизни (§Y$tech_alien_life_studies$§!), несколько посланников §H[FROM.GetName&gen]§! попросили поделиться результатами и помочь обучить их учёных.\n\nНаши исследователи сомневаются: такая программа отвлечёт ресурсы от собственных приоритетов.\n\nОтказ почти наверняка ухудшит отношения с [From.GetName&inst]."
 nations.14274.a:0 "Мы не можем жертвовать собственными исследовательскими приоритетами."
 nations.14274.b:0 "Они наши друзья. Поделимся тем, чем можем."
 nations.14275.name:0 "Послание доставлено"
 nations.14275.desc:1 "В последнее время торговля с §H[FROM.GetName&inst]§! почти сошла на нет, а караваны оттуда появляются всё реже. Сегодня мы получили сообщение от представителя местных вооружённых сил. Похоже, там очень недовольны."
 nations.14275.a:0 "Посмотрим, что там."
