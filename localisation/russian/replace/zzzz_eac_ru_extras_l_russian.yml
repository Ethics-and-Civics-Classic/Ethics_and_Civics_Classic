 building_archaeostudies_faculty_relic_effect:1 "\nПри постройке в §Yреликтовом мире§! или на §Yреликтовом корабле-ковчеге§!:\n$t$• Скорость исследования (археоисследования): §G+25%§!\n$t$• $mod_planet_biologists_minor_artifacts_produces_add$: §G+0,15§!"
 building_bio_reactor_2_resort_colony_desc:0 "Когда улов рыболовов оказывается слишком мелким, его с высокой эффективностью перерабатывают в энергию. Усовершенствованное компостирование рыбных отходов позволяет получать полезные газообразные побочные продукты."
 building_bio_reactor_resort_colony_desc:0 "Когда улов рыболовов оказывается слишком мелким, его с высокой эффективностью перерабатывают в энергию."
 building_corporate_heritage_museum:0 "Корпоративный музей наследия"
 building_corporate_heritage_museum_desc:0 "Эта мегакорпорация с гордостью демонстрирует историю квартальных отчётов о прибыли, веками направлявших развитие её общества."
 building_early_spaceport:0 "Ранний космопорт"
 building_early_spaceport_desc:0 "Досверхсветовой космопорт с протянувшимися на многие километры сборочными площадками и инфраструктурой, без которой невозможно организовать строительство даже одного корабля, способного к межзвёздному перелёту."
 building_early_spaceport_launch:0 "Построить $engineer_vessel$"
 building_early_spaceport_launch_desc:0 "Хьюстон, взлёт состоялся."
 building_early_spaceport_tooltip:0 "Позволяет построить один §Y$NAME_Pre_FTL_Chemical_Ship$§!"
 building_factory_angler_1:0 "Океаническая промышленность"
 building_factory_angler_1_desc:0 "$building_factory_1_desc$ Всё необходимое добывается из океана."
 building_factory_angler_2:0 "Океанические фабрикаторы"
