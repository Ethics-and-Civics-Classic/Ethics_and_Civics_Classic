 PrimPlayer_unified_planet_situation:0 "Объединённая планета"
 PrimPlayer_unified_planet_situation_desc:0 "Любое общество знает разногласия, но для выживания в галактике планета должна объединиться. Перелом наступит, когда большинство населения примет общее будущее."
