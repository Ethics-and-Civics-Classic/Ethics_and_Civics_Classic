 EaC_civic_mechanic_events.9.name:0 "[THIS.GetName]: проводники генезиса"
 EaC_civic_mechanic_events.9.desc:0 "На [THIS.GetName&prep] зародилась предразумная жизнь.\n\nКак хранители, мы направляем развитие предразумных существ. Обладая нужной технологией, мы сможем возвысить их до каменного века и наблюдать за их обществом независимо от [owner.GetName&gen]."
 EaC_civic_mechanic_events.41.desc.has_ethic_libertarian.no_ethic_cooperative.has_slaves:0 "После заметного роста стабильности на §H[Root.GetName&prep]§! всеобщая забастовка утратила поддержку: население снова чувствует себя материально защищённым."
 EaC_civic_mechanic_events.41.desc.no_ethic_libertarian.has_ethic_cooperative.has_slaves:0 "После заметного роста стабильности на §H[Root.GetName&prep]§! всеобщая забастовка утратила поддержку: население снова чувствует себя материально защищённым."
 EaC_civic_mechanic_events.41.desc.no_ethic_libertarian.no_ethic_cooperative.has_slaves:0 "После заметного роста стабильности на §H[Root.GetName&prep]§! некогда влиятельное рабочее движение практически исчезло. Население успокоилось и, похоже, вполне довольно нынешним положением."
 EaC_civic_mechanic_events.41.desc.has_ethic_libertarian.no_ethic_cooperative.no_slaves:0 "После заметного роста стабильности на §H[Root.GetName&prep]§! всеобщая забастовка утратила поддержку: население снова чувствует себя материально защищённым."
