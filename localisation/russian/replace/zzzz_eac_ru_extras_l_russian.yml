 civic_imperial_cult_effects:0 "$t$- £building£ §YСтоличные сооружения§! заменяют должности £job_politician£ §Y$job_politician$§! на £job_high_priest£ §Y$job_high_priest_plural$§!.$TABBED_NEW_LINE$- £building£ §YСвященный нексус§! и £building£ §YЦитадель веры§! дают дополнительные должности £job_high_priest£ §Yверховных жрецов§!.\n$TABBED_NEW_LINE$- £job_priest£ §Y$job_priest_plural$§! производят больше $r_unity$.$TABBED_NEW_LINE$- §EБожественный правитель§!: открывает особый §Yуказ§!, делающий текущего правителя §Hбессмертным§!.\n$TABBED_NEW_LINE$§EМожно сочетать с§!:$TABBED_NEW_LINE$$t$- гражданской моделью ['civic_tooltip_spiritualist_machine_cult_combo', $civic_machine_cult$] для получения уникальных эффектов."
