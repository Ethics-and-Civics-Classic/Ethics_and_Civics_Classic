 random_primitive_events.253.a.response:0 "Наша держава простирается во все уголки известного мира. Лишь Великий Смог остаётся за пределами нашей власти. У нас множество прекрасных городов, а пропитание им дают фермы лишайников и рыба из больших рек, текущих по нашим туннелям.\n\nТак мы живём уже тысячи лет — с тех пор, как промышленная революция отравила атмосферу. Наши проходчики услышали сквозь камень слабые отголоски ваших городов, и мы решили выяснить, что происходит."
 random_primitive_events.253.b.response:0 "Так тому и быть, житель поверхности! Будем жить на этом мире бок о бок и хранить мир. Мы с большим интересом торговали бы с вашим народом — думаю, нам есть что предложить друг другу. Мы вернёмся в свои города и всё подготовим. Спасибо, что очистили наш мир от Великого Смога и вернули ему прежний облик..."
 random_primitive_events.253.b.response.subterranean:0 "Так тому и быть, корковик! Будем жить на этом мире бок о бок и хранить мир. Мы с большим интересом торговали бы с вашим народом — думаю, нам есть что предложить друг другу. Мы вернёмся в свои города и всё подготовим. Спасибо, что очистили наш мир от Великого Смога и вернули ему прежний облик..."
 random_primitive_events.253.c.response:0 "Ха! Это вы покоритесь нам! Мы могли жить бок о бок в мире... Теперь наши армии вернут земли, которые отнял у нас Великий Смог — и которые вы столь любезно очистили, — и присоединят их к нашей державе! Нам всегда было предначертано властвовать над всем сущим."
