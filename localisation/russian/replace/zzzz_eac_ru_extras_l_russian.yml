 nations.18269.desc:1 "К нам прибыл представитель §H[From.GetName&gen]§!. Похоже, страна переживает тяжёлые времена и оказалась перед угрозой §Rголода§!.\n\nОни умоляют помочь всем, чем мы можем..."
