 civic_criminal_heritage_authority:0 "Преступный синдикат"
 civic_criminal_heritage_authority_desc:0 "Этим синдикатом правит олигархия преступных предприятий, поддерживающих интересы друг друга. Правителя избирает «Совет главарей» — обычно из числа самых выдающихся криминальных гениев."
