 PrimPlayer_operation_locate_strategic_targets_on_success.nuclear:1 "$IF_SUCCESSFUL|E$\nПолучены разведданные о стратегических объектах [root.target.GetName&gen] и увеличен §Yмаксимальный уровень внедрения§!, что позволяет наносить §Gупреждающие удары§! по §Yядерным объектам§!."
 PrimPlayer_operation_steal_technology_enigmatic_engineering:0 "$TRIGGER_FAIL$ §RИх технологии и методы исследования стали для нас непостижимыми.§!"
 PrimPlayer_operation_steal_technology_on_success:0 "$IF_SUCCESSFUL|E$\nбудет получена случайная неизвестная технология или некоторое количество очков исследования."
 PrimPlayer_operation_steal_technology_too_recent:1 "$TRIGGER_FAIL$ §RНужно подождать как минимум до §Y[Root.recently_stole_technology]§!, прежде чем предпринимать ещё одну попытку проникнуть в их исследовательские центры.§!"
 PrimPlayer_operation_acquire_asset_on_success:0 "$IF_SUCCESSFUL|E$\nв этой агентурной сети появится новый актив."
 PrimPlayer_operation_sleeper_cells_on_success:0 "$IF_SUCCESSFUL|E$\nдеятельность этой агентурной сети прекращается и её $role_spymaster$ сможет получить новое назначение. При этом $INFILTRATION_LEVEL$ не будет снижаться."
 PrimPlayer_operation_smear_campaign_on_success:0 "$IF_SUCCESSFUL|E$\nУхудшаются отношения между [root.target.GetName&inst] и другим государством."
 PrimPlayer_operation_extort_favors_on_success:0 "$IF_SUCCESSFUL|E$\nБудет получено как минимум одно одолжение от [root.target.GetName&gen]."
 PrimPlayer_operation_gather_information_no_dlc_desc:2 "Наши оперативники соберут информацию о §Y[This.Target.GetName&prep]§! и по завершении предоставят отчёт с §Yразведданными§!. Выявленные слабые места будут использованы для временного увеличения §Yмаксимального уровня внедрения§!."
 PrimPlayer_operation_gather_information_on_success:1 "$IF_SUCCESSFUL|E$\nПолучены разведданные о [root.target.GetName&prep]; максимальный уровень внедрения увеличен."
 PrimPlayer_operation_diplomatic_incident_on_success:0 "$IF_SUCCESSFUL|E$\nПровоцирует дипломатический скандал с участием посла [root.target.GetName&gen]."
