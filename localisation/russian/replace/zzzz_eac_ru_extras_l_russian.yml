 CLONE_PRECURSOR_KHAN_UNLOCK_POTENTIAL_DESC:0 "Наш вид возвысится, приобщившись к величию Хана-предтечи, но навсегда останется бесплодным и устойчивым к генетической модификации.\n\nЭффекты:\n— Признак «['trait:trait_clone_soldier_infertile']» будет заменён на признак «['trait:trait_clone_soldier_infertile_full_potential']».\n— Лидеры получат признак «['trait:leader_trait_ruler_precursor_great_khan']»."
 STORM_CHASER_CAPSULE_PROJECT_DESC:0 "Таинственная капсула непонятной конструкции упала с орбиты, вызвав тревогу среди местных жителей. При осмотре один из наших §Hучёных§! обнаружил исходящее из неё опасное излучение, совпадающее с сигнатурами, наблюдаемыми в космосе.\n\nЧто бы ни находилось внутри, оно может быть опасно. Но узнать это можно лишь одним способом... готовы ли мы выделить этому §Hкосмическому исследовательскому проекту§! §Rдостаточное финансирование§!?"
 civic_brand_loyalty_authoritarian_effect:0 "§WЗаменяет§! £job_enforcer£ §H$job_enforcer_plural$§! §Wна§! £job_loyalty_enforcer£ §H$job_loyalty_enforcer_plural$§!, §Wкоторые§! §Gподдерживают§! £unity£ §Wза§! §Rболее высокую плату§! £trade£"
 ethic_gestalt_consciousness_desc_tooltip:0 "\n\n§RПринципы оказывают лишь ограниченное влияние на §Yгештальт-сознания§!!§!"
 ethic_storm_interaction_desc_tooltip:0 "\n\nНа £planet£ §Hколониях§!, находящихся под воздействием §Yкосмических бурь§!:\n— £job_entertainer£ $job_entertainer_plural$ заменяются на £job_storm_dancer£ $job_storm_interpreter_plural$.\n— £job_storm_dancer£ $job_storm_interpreter_plural$ требуют меньше £consumer_goods£ и производят больше £unity£."
 job_death_seller:0 "Торговец смертью"
 job_death_seller_desc:0 "Торговцами смертью прозвали некромантов, которые не только сдают внаём армии нежити и рабов-прислужников, но и продают зрелище смерти и кровопролития в колизее. Многие идут к ним ради более высокой платы — ведь нежить доли не требует, — но нередко сами пополняют её ряды раньше, чем успевают уйти на покой."
 job_death_seller_effect_desc:0 "£job_death_seller£ $job_death_seller_plural$ увеличивают $r_amenities$ и §Yвместимость флота§!, создают §Yоборонительные армии§! и повышают привлекательность принципа £pops£ §H$ethic_militarist$§!."
 job_death_seller_plural:0 "Торговцы смертью"
 job_fe_hedonist_tourist_desc:1 "Курорт обеспечивает жизнь в полной роскоши, где можно удовлетворить любые материальные потребности и желания."
 job_holy_gladiator:0 "Священный гладиатор"
 job_holy_gladiator_desc:0 "Тамплиеры этого мира поддерживают боевую форму тренировками и спаррингами. Однако вместо поединков друг с другом они оттачивают мастерство против гладиаторов на арене, и многие вступают в священные ордена именно ради славы Колизея."
 job_holy_gladiator_effect_desc:0 "£job_holy_gladiator£ $job_holy_gladiator_plural$ увеличивают $r_amenities$ и §Yвместимость флота§!, создают §Yоборонительные армии§! и повышают привлекательность принципа £pops£ §H$ethic_militarist$§!."
 job_holy_gladiator_plural:0 "Священные гладиаторы"
 job_independent_paladin:0 "Независимый паладин"
 job_independent_paladin_desc:0 "Здесь особенно силён дух предприимчивости, и границы между рабом, паладином и наёмником размываются. В колизеях сражаются паладины и наёмники, рабовладельцы сдают своих подопечных внаём как телохранителей и оруженосцев, а рыцари священных орденов в свободное время работают в частной охране или выходят на арену ради славы."
 job_independent_paladin_effect_desc:0 "£job_independent_paladin£ $job_independent_paladin_plural$ увеличивают $r_amenities$ и §Yвместимость флота§!, создают §Yоборонительные армии§! и повышают привлекательность принципа £pops£ §H$ethic_militarist$§!."
 job_independent_paladin_plural:0 "Независимые паладины"
 job_loyalty_enforcer:0 "Инспектор лояльности"
 job_loyalty_enforcer_desc:0 "Этим инспекторам щедро платят за то, чтобы условия и правила мегакорпорации соблюдались неукоснительно."
 job_loyalty_enforcer_effect_desc:2 "[enforcer.GetIcon] [enforcer.GetNamePlural] снижают £crime£ §Y$PLANET_CRIME_TITLE$§! и создают £defense_army£ §Yоборонительные армии§!."
 job_loyalty_enforcer_plural:0 "Инспекторы лояльности"
 job_mutagenomic_researcher:0 "Исследователь мутагеномики"
 job_mutagenomic_researcher_desc:0 "$job_mutagenomic_researcher_plural$ изучают промышленные отходы и приспосабливают их для интенсивной детоксикации и контролируемой терапии дегенерации генотипа."
 job_mutagenomic_researcher_effect_desc:0 "£job_mutagenomic_researcher£ $job_mutagenomic_researcher_plural$ превращают $r_consumer_goods$ в $r_society$ и $r_amenities$."
 job_mutagenomic_researcher_plural:0 "Исследователи мутагеномики"
 job_mutagenomic_researcher_plural_with_icon:0 "£job_mutagenomic_researcher£ $job_mutagenomic_researcher_plural$"
 job_mutagenomic_researcher_situation_effect_desc:0 "£job_mutagenomic_researcher£ $job_mutagenomic_researcher_plural$ ускоряют ежемесячный прогресс инцидента §Y«$genetic_ascension_situation$»§!."
 job_mutagenomic_researcher_with_icon:0 "£job_mutagenomic_researcher£ $job_mutagenomic_researcher$"
 job_noble_commandante:0 "Знатный командующий"
 job_noble_commandante_effect_desc:0 "£job_noble_commandante£ $job_noble_commandante_plural$ увеличивают $i_naval_capacity$ государства, создают £defense_army£ §Yоборонительные армии§!, повышают $r_stability$ на планете, снижают урон от §Yбомбардировки§! и производят небольшое количество $r_amenities$."
 job_noble_commandante_pirate:0 "Пиратский вельможа"
 job_noble_commandante_pirate_effect_desc:0 "£job_noble_commandante_pirate£ $job_noble_commandante_pirate_plural$ увеличивают $i_naval_capacity$ государства, создают £defense_army£ §Yоборонительные армии§!, повышают $r_stability$ на планете, снижают урон от §Yбомбардировки§! и производят небольшое количество $r_amenities$."
 job_noble_commandante_pirate_plural:0 "Пиратские вельможи"
 job_noble_commandante_plural:0 "Знатные командующие"
 job_pirate_quartermaster:0 "Пиратский квартирмейстер"
 job_pirate_quartermaster_effect_desc:0 "£job_pirate_quartermaster£ $job_pirate_quartermaster_plural$ увеличивают $i_naval_capacity$ государства, повышают планетарное £mod_planet_housing_add£ §Yжильё§! и производят небольшое количество $r_amenities$."
 job_pirate_quartermaster_plural:0 "Пиратские квартирмейстеры"
 job_red_death_knight:0 "Красный рыцарь смерти"
 job_red_death_knight_desc:0 "Красные рыцари смерти получили своё имя за броские красные одежды и знаки, которыми их армии нежити привлекают внимание публики. Эти рыцари местного ордена специализируются на масштабных показательных боях, предпочитая тактике численность и жестокость, а зрелищность усиливают религиозными жертвоприношениями и ритуальными поединками."
 job_red_death_knight_effect_desc:0 "£job_red_death_knight£ $job_red_death_knight_plural$ увеличивают $r_amenities$ и §Yвместимость флота§!, создают §Yоборонительные армии§! и повышают привлекательность принципа £pops£ §H$ethic_militarist$§!."
 job_red_death_knight_plural:0 "Красные рыцари смерти"
 job_storm_interpreter:0 "Толкователь бури"
 job_storm_interpreter_desc:0 "Это далеко не просто артист: $job_storm_interpreter$ превращает бушующую космическую бурю в историю, понятную тем, кто наблюдает за ней издалека."
 job_storm_interpreter_effect_desc:0 "[entertainer.GetIcon] [entertainer.GetNamePlural] превращают $r_consumer_goods$ в $r_unity$, $r_amenities$ и £society£ §Yсоциологические исследования§!."
 job_storm_interpreter_plural:0 "Толкователи бури"
 job_storm_interpreter_plural_with_icon:0 "£job_storm_interpreter£ $job_storm_interpreter_plural$"
 job_storm_interpreter_with_icon:0 "£job_storm_interpreter£ $job_storm_interpreter$"
 job_undead_gladiator:0 "Гладиатор из нежити"
 job_undead_gladiator_desc:0 "Некоторые некроманты этого мира целиком посвящают себя созданию гладиаторов из нежити, которые сходятся с рабами в грандиозных схватках против бездумных орд. Раб либо побеждает вопреки всему, либо сам пополняет орду — в любом случае зрелище получается отменное."
 job_undead_gladiator_effect_desc:0 "£job_undead_gladiator£ $job_undead_gladiator_plural$ увеличивают $r_amenities$ и §Yвместимость флота§!, создают §Yоборонительные армии§! и повышают привлекательность принципа £pops£ §H$ethic_militarist$§!."
 job_undead_gladiator_plural:0 "Гладиаторы из нежити"
 job_yellow_death_knight:0 "Жёлтый рыцарь смерти"
 job_yellow_death_knight_desc:0 "Жёлтые рыцари смерти — предприимчивые стяжатели, получившие своё прозвище за одержимость кредитами. Их религиозные организации больше напоминают частные военные компании: они нанимают и сдают внаём рабов, отчаянных искателей удачи и орды нежити для любой работы, которую ещё можно назвать законной."
 job_yellow_death_knight_effect_desc:0 "£job_yellow_death_knight£ $job_yellow_death_knight_plural$ увеличивают $r_amenities$ и §Yвместимость флота§!, создают §Yоборонительные армии§! и повышают привлекательность принципа £pops£ §H$ethic_militarist$§!."
 job_yellow_death_knight_plural:0 "Жёлтые рыцари смерти"
 sm_pirate_mercenary_garrison:0 "Гарнизон каперов"
 sm_pirate_mercenary_garrison_desc:0 "Комплекс казарм, где размещены нанятые каперы. Эти закалённые ветераны регулярно проводят учения для остальной команды и готовы защищать станцию — пока мы им платим."
 councilor_barbaric_despoilers_corporate_custom_modifier_desc:1 "- £slavery£ Вклад рабов в £empire_sprawl£ §Y$EMPIRE_SIZE$§!: §G-2%§!"
 councilor_barbaric_despoilers_PrimPlayer_custom_modifier_desc:1 "- £slavery£ Вклад рабов в £empire_sprawl£ §Y$EMPIRE_SIZE$§!: §G-2%§!"
 councilor_barbaric_despoilers_interpreter_PrimPlayer_custom_modifier_desc:1 "- £slavery£ Вклад рабов в £empire_sprawl£ §Y$EMPIRE_SIZE$§!: §G-2%§!"
 job_pirate_combat_instructor:0 "Боевой инструктор пиратов"
 job_pirate_combat_instructor_plural:0 "Боевые инструкторы пиратов"
 job_pirate_combat_instructor_desc:0 "В любой каперской флотилии толковый наставник ценится на вес золота. Упор на обучение, а не наказание повышает мастерство экипажа и позволяет решать проблемы прежде, чем они успеют разрастись."
 job_steward_pirate:0 "Капитан-распорядитель"
 job_steward_pirate_plural:0 "Капитаны-распорядители"
 job_steward_pirate_desc:0 "Мы — союз кооперативных каперских флотилий, и право ходить под нашим флагом обязывает капитана служить не только в космосе, но и на планетах."
 PrimPlayer_angry_population:0 "Разгневанное население"
 PrimPlayer_angry_population_desc:0 "Недавние события вызвали сильное недовольство населения."
 PrimPlayer_tech_transaction:0 "Передача оружейных технологий"
 PrimPlayer_tech_transaction_desc:0 "Часть наших исследовательских материалов и средств передаётся одному из других национальных государств нашей родной планеты."
 PrimPlay_situation_event.1004.title:0 "Планета готова к объединению!"
 PrimPlay_situation_event.1004.desc:0 "Наши министры сообщают, что государство готово приступить к объединению планеты."
 PrimPlay_situation_event.1004.unite:0 "Официально провозгласить планетарное единство."
 PrimPlay_situation_event.1004.hold:0 "Мы пока не готовы к объединению."
 random_primitive_events.274.xenophobe:0 "Вооружать их современным оружием — плохая идея."
 PrimPlayer_opinion_flavors_up:0 "$opinion_flavors_up$"
 PrimPlayer_opinion_flavors_down:0 "$opinion_flavors_down$"
 nations.11261.name:0 "Обрушение"
 nations.11261.desc:1 "С [Root.GetName&gen] пришли тревожные вести! Инопланетяне [Root.Owner.GetSubMantleLower], с которыми мы там воюем, обрушили грунт под целой армией, стоявшей у одного из входов в их туннели.\n\nНемногих солдат, переживших падение, чужаки перебили прежде, чем основные силы успели прийти им на помощь."
 nations.11261.a:0 "Они за это заплатят!"
 nations.11262.name:0 "Диверсионные группы"
 nations.11262.desc:0 "Инопланетяне, живущие под нашей колонией на [Root.GetName&prep], по ночам высылают из туннелей небольшие диверсионные группы. Их последняя атака уничтожила один из важнейших объектов колонии, а прежде чем наши силы успели отреагировать, налётчики скрылись под землёй."
 nations.11262.a:0 "Эти набеги нужно прекратить!"
 nations.11263.name:0 "Атака на поверхность"
 nations.11263.desc:1 "На [Root.GetName&prep] произошло очередное нападение! Инопланетяне [Root.Owner.GetSubMantleLower] вышли из новых туннелей прямо в центре одного из наших крупных поселений. Они подавили местную оборону и перебили колонистов. Отступая в туннели, чужаки утащили под землю нескольких уцелевших, кричавших от ужаса."
 nations.11263.a:0 "Эти убийства не останутся без ответа."
 nations.11264.name:0 "Пещера уцелевших"
 nations.11264.desc:1 "Наши войска на [Root.GetName&prep] продолжают картографировать сеть туннелей под колонией. Они обнаружили крупный город, успевший изолироваться от остального подземного государства ещё до того, как мы заполнили туннели нервно-паралитическим газом. Внутри остаются миллионы перепуганных жителей. Следует ли нашим инженерам обрушить пещеру и довести дело до конца?"
 nations.11264.a:0 "Да. Избавьте их от мучений."
 nations.11264.b:0 "Нет! Вытащите их на поверхность, пусть служат нам."
 nations.11264.b.subterranean:0 "Нет! Доставьте их в колонию, пусть служат нам."
 nations.11265.name:1 "Экспансия: [Root.Owner.GetSubMantleUpper]"
 nations.11265.desc:0 "Мы закончили нейтрализацию нервно-паралитического газа и уборку тел инопланетян из сети туннелей на [Root.GetName&prep]. Теперь нашим колонистам должно быть безопасно туда переселиться. Разумеется, оставленные чужаками примитивные города будут снесены и заменены нашей более совершенной архитектурой."
 nations.11266.name:0 "Золото!"
 nations.11266.desc:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим подземным инопланетянам. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.11266.desc.subterranean:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим обитателям магмы. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.11267.name:0 "Сокровищница"
 nations.11267.desc:0 "Разведчики, обследующие сеть туннелей на [Root.GetName&prep], проникли в царский дворец бывшей столицы подземного государства. Труп того, кого местные считали императором, до сих пор восседает на массивном троне в парадном зале.\n\nПодорвав двери дворцовой сокровищницы, разведчики обнаружили внутри золото и странные произведения инопланетного искусства. Искусство отправят в музеи на [From.Owner.Capital.GetName&acc], а продажа золота заметно пополнит государственный бюджет."
 nations.11268.name:0 "Инцидент с [From.GetName&inst]"
 nations.11268.desc:1 "Дипломатический скандал разгорелся после того, как наш §Yпосланник§! проявил неуважение к местному правителю. [From.GetRulerName] теперь требует показательного суда: посланника уже бросили в тюрьму, а палач ждёт приговора.\n\nМы можем потребовать соблюдения §Hдипломатической неприкосновенности§!, но это вызовет серьёзные §Rдипломатические последствия§!."
 nations.11268.a:0 "Потребовать соблюдения дипломатической неприкосновенности! Посланник нужен нам живым."
 nations.11268.b:0 "Не вмешиваться в казнь. Мы не можем рисковать последствиями..."
 nations.11269.name:0 "Голод в [From.GetName&prep]"
 nations.11269.desc:1 "К нам прибыл представитель §H[From.GetName&gen]§!. Похоже, страна переживает тяжёлые времена и оказалась перед угрозой §Rголода§!.\n\nОни умоляют помочь всем, чем мы можем..."
 nations.11269.a:0 "Конечно. Мы поможем им, чем сможем."
 nations.11269.b:0 "Пусть сами о себе позаботятся."
 nations.11269.c:0 "У нас нет лишней еды..."
 ethic_fanatic_authoritarian_nation_pleased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Gулучшатся§!. Принцип государства: §H$ethic_authoritarian$§!."
 ethic_fanatic_authoritarian_nation_displeased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Rухудшатся§!. Принцип государства: §H$ethic_authoritarian$§!."
 nations.11270.name:0 "Дар авторитарного государства"
 nations.11270.desc:0 "В знак дружбы между нашими цивилизациями посланник §H[FROM.GetName&gen]§! передал нам чертежи §Yтехнологий наблюдения§! и материалы по доктринам §Y«$tech_centralized_state$»§! и §Y«$tech_penal_colonies$»§!.\n\nПриняв эту политику, мы сможем сильнее централизовать государство и §Gувеличить прирост влияния§!, ещё больше ограничив автономию колоний. Платой станет §Rувеличение размера государства§!."
 nations.11270.a:0 "Очень любезно с их стороны."
 nations.11270.b:0 "Немедленно принять эту политику."
 nations.11271.name:1 "Беженцы из [From.GetName&gen]"
 nations.11271.desc:0 "К нашей границе недавно вышла большая группа беженцев из §H[FROM.GetName&gen]§!, которую преследует небольшой военный отряд. Беженцы утверждают, что состояли в движении сопротивления и после неудавшейся попытки переворота спасаются от расправы.\n\nЕсли принять их, это наверняка разгневает власти [FROM.GetName&gen]. Если же позволить преследователям увести беглецов обратно, их, скорее всего, казнят."
 nations.11271.a:0 "Пусть присоединяются к нашим колонистам, если захотят."
 nations.11271.b:0 "Политический инцидент нам не нужен. Отправьте их обратно."
 nations.11271.xenophobe:0 "Чужакам здесь не место."
 nations.11271.civic_fanatic_purifiers:0 "Убивать всех без разбора."
 ethic_fanatic_authoritarian_nation_refugees:0 "К нашему государству присоединяются §G800§! £pop£ поселений вида §Y[FROM.GetSpeciesNamePlural&gen]§!. Принцип новых жителей: §Y$ethic_egalitarian$§!."
 nations.11272.name:0 "Культурный обмен с авторитарным государством"
 nations.11272.desc:1 "Несколько наших посланников вернулись после долгого пребывания среди жителей §H[FROM.GetName&gen]§!. Они хорошо изучили местные обычаи и уклад жизни, что, несомненно, поможет нашим социологическим исследованиям.\n\nНо вместе с чужой культурой приходят и чужие идеи... разрешим ли мы §Hсвободный обмен§!?"
 nations.11272.a:0 "Пусть наши народы свободно обмениваются товарами и идеями."
 nations.11272.b:0 "Мы будем строго контролировать всё, что пересекает границу."
 nations.11273.name:1 "Трагический инцидент с [From.GetName&inst]"
 nations.11273.desc:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Ракета, направлявшаяся в космос, потеряла тягу во время полёта и рухнула на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.11273.nomad:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Обычная ремонтная операция закончилась катастрофой: небесный док рухнул на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.11273.a:0 "Подставим другую щёку."
 nations.11273.b:0 "Мы должны потребовать извинений!"
 nations.11274.name:0 "Запрос технологий"
 nations.11274.desc:1 "Увидев §Hсовременное оружие§! наших сил безопасности, несколько генералов §H[FROM.GetName&gen]§! попросили поделиться частью наших военных технологий.\n\nНаши офицеры сомневаются, стоит ли это делать: если когда-нибудь дело дойдёт до войны, победить авторитарное государство станет заметно труднее.\n\nОтказ почти наверняка будет воспринят как оскорбление."
 nations.11274.a:0 "Передавать авторитарному государству более совершенное оружие — плохая идея."
 nations.11274.b:0 "Они наши друзья. Поделимся тем, чем можем."
 nations.11275.name:0 "Послание доставлено"
 nations.11275.desc:1 "В последнее время торговля с §H[FROM.GetName&inst]§! почти сошла на нет, а караваны оттуда появляются всё реже. Сегодня мы получили сообщение от представителя местных вооружённых сил. Похоже, там очень недовольны."
 nations.11275.a:0 "Посмотрим, что там."
 nations.11276.name:0 "Послание"
 nations.11276.desc:0 "Поверхностник. Мы пытались быть добрыми соседями, но теперь ясно: вы не намерены оказывать нашей великой цивилизации должного уважения.\n\nОтныне этот мир по праву принадлежит нам целиком. Мы заберём его силой!"
 nations.11276.a:0 "Укрепить границу с §H[FROM.GetName&inst]§!!"
 nations.11277.name:0 "Государство [FROM.GetName] предлагает объединение"
 nations.11277.desc:0 "Во многом наши взгляды совпадают, [ROOT.GetName]. Мы предлагаем официально §Gобъединить§! два национальных государства в §Hединую державу§!."
 nations.11277.merge.fanatic:0 "Наши принципы почти едины, как и наши цели. Пора объединиться."
 nations.11277.merge.normal:0 "Наши принципы близки, а отношения давно стали дружескими. Пора объединиться."
 nations.11277.merge.different:0 "Несмотря на различия в принципах, наши государства стали неразрывно связаны. Пора объединиться."
 nations.11277.no:0 "Сейчас мы не готовы к объединению."
 nations.12261.name:0 "Обрушение"
 nations.12261.desc:1 "С [Root.GetName&gen] пришли тревожные вести! Инопланетяне [Root.Owner.GetSubMantleLower], с которыми мы там воюем, обрушили грунт под целой армией, стоявшей у одного из входов в их туннели.\n\nНемногих солдат, переживших падение, чужаки перебили прежде, чем основные силы успели прийти им на помощь."
 nations.12261.a:0 "Они за это заплатят!"
 nations.12262.name:0 "Диверсионные группы"
 nations.12262.desc:0 "Инопланетяне, живущие под нашей колонией на [Root.GetName&prep], по ночам высылают из туннелей небольшие диверсионные группы. Их последняя атака уничтожила один из важнейших объектов колонии, а прежде чем наши силы успели отреагировать, налётчики скрылись под землёй."
 nations.12262.a:0 "Эти набеги нужно прекратить!"
 nations.12263.name:0 "Атака на поверхность"
 nations.12263.desc:1 "На [Root.GetName&prep] произошло очередное нападение! Инопланетяне [Root.Owner.GetSubMantleLower] вышли из новых туннелей прямо в центре одного из наших крупных поселений. Они подавили местную оборону и перебили колонистов. Отступая в туннели, чужаки утащили под землю нескольких уцелевших, кричавших от ужаса."
 nations.12263.a:0 "Эти убийства не останутся без ответа."
 nations.12264.name:0 "Пещера уцелевших"
 nations.12264.desc:1 "Наши войска на [Root.GetName&prep] продолжают картографировать сеть туннелей под колонией. Они обнаружили крупный город, успевший изолироваться от остального подземного государства ещё до того, как мы заполнили туннели нервно-паралитическим газом. Внутри остаются миллионы перепуганных жителей. Следует ли нашим инженерам обрушить пещеру и довести дело до конца?"
 nations.12264.a:0 "Да. Избавьте их от мучений."
 nations.12264.b:0 "Нет! Вытащите их на поверхность, пусть служат нам."
 nations.12264.b.subterranean:0 "Нет! Доставьте их в колонию, пусть служат нам."
 nations.12265.name:1 "Экспансия: [Root.Owner.GetSubMantleUpper]"
 nations.12265.desc:0 "Мы закончили нейтрализацию нервно-паралитического газа и уборку тел инопланетян из сети туннелей на [Root.GetName&prep]. Теперь нашим колонистам должно быть безопасно туда переселиться. Разумеется, оставленные чужаками примитивные города будут снесены и заменены нашей более совершенной архитектурой."
 nations.12266.name:0 "Золото!"
 nations.12266.desc:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим подземным инопланетянам. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.12266.desc.subterranean:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим обитателям магмы. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.12267.name:0 "Сокровищница"
 nations.12267.desc:0 "Разведчики, обследующие сеть туннелей на [Root.GetName&prep], проникли в царский дворец бывшей столицы подземного государства. Труп того, кого местные считали императором, до сих пор восседает на массивном троне в парадном зале.\n\nПодорвав двери дворцовой сокровищницы, разведчики обнаружили внутри золото и странные произведения инопланетного искусства. Искусство отправят в музеи на [From.Owner.Capital.GetName&acc], а продажа золота заметно пополнит государственный бюджет."
 nations.12268.name:0 "Инцидент с [From.GetName&inst]"
 nations.12268.desc:1 "Дипломатический скандал разгорелся после того, как наш §Yпосланник§! проявил неуважение к местному правителю. [From.GetRulerName] теперь требует показательного суда: посланника уже бросили в тюрьму, а палач ждёт приговора.\n\nМы можем потребовать соблюдения §Hдипломатической неприкосновенности§!, но это вызовет серьёзные §Rдипломатические последствия§!."
 nations.12268.a:0 "Потребовать соблюдения дипломатической неприкосновенности! Посланник нужен нам живым."
 nations.12268.b:0 "Не вмешиваться в казнь. Мы не можем рисковать последствиями..."
 nations.12269.name:0 "Голод в [From.GetName&prep]"
 nations.12269.desc:1 "К нам прибыл представитель §H[From.GetName&gen]§!. Похоже, страна переживает тяжёлые времена и оказалась перед угрозой §Rголода§!.\n\nОни умоляют помочь всем, чем мы можем..."
 nations.12269.a:0 "Конечно. Мы поможем им, чем сможем."
 nations.12269.b:0 "Пусть сами о себе позаботятся."
 nations.12269.c:0 "У нас нет лишней еды..."
 ethic_fanatic_egalitarian_nation_pleased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Gулучшатся§!. Принцип государства: §H$ethic_egalitarian$§!."
 ethic_fanatic_egalitarian_nation_displeased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Rухудшатся§!. Принцип государства: §H$ethic_egalitarian$§!."
 nations.12270.name:0 "Дар либертарианского государства"
 nations.12270.desc:0 "В знак дружбы между нашими цивилизациями посланник §H[FROM.GetName&gen]§! познакомил нас с политической доктриной §H«$tech_federal_state$»§!. Приняв эту политику, мы сможем децентрализовать управление и §Gсократить размер государства§!. Более широкая автономия усилит роль торговцев в поддержании §Gстабильности§!, но ценой станет §Rснижение эффективности бюрократии§!."
 nations.12270.a:0 "Очень любезно с их стороны."
 nations.12270.b:0 "Немедленно принять эту политику."
 nations.12271.name:1 "Авторитарные изгнанники"
 nations.12271.desc:0 "Большую группу политиков изгнали из §H[FROM.GetName&gen]§! по обвинению в §Yавторитарной коррупции§!. Скитаясь от страны к стране, они просят убежища и права поселиться у нас.\n\nЕсли принять изгнанников, это наверняка даст толчок §Pавторитарному движению§! и ухудшит отношения с [FROM.GetName&inst]. Но если прогнать их дальше, многие, скорее всего, не переживут путь до следующей границы."
 nations.12271.authoritarian:0 "Эти политики могли бы пригодиться нашему правительству."
 nations.12271.a:0 "Пусть присоединяются к нашим колонистам, если захотят."
 nations.12271.b:0 "Отказать. Нам не нужен политический скандал."
 nations.12271.xenophobe:0 "Чужакам здесь не место."
 nations.12271.civic_fanatic_purifiers:0 "Перебить всех бродяг до единого."
 ethic_fanatic_egalitarian_nation_refugees:0 "К нашему государству присоединяются §G800§! £pop£ поселений вида §Y[FROM.GetSpeciesNamePlural&gen]§!. Принцип новых жителей: §Y$ethic_authoritarian$§!."
 nations.12272.name:0 "Культурный обмен с либертарианским государством"
 nations.12272.desc:1 "Несколько наших посланников вернулись после долгого пребывания среди жителей §H[FROM.GetName&gen]§!. Они хорошо изучили местные обычаи и уклад жизни, что, несомненно, поможет нашим социологическим исследованиям.\n\nНо вместе с чужой культурой приходят и чужие идеи... разрешим ли мы §Hсвободный обмен§!?"
 nations.12272.a:0 "Пусть наши народы свободно обмениваются товарами и идеями."
 nations.12272.b:0 "Мы будем строго контролировать всё, что пересекает границу."
 nations.12273.name:1 "Трагический инцидент с [From.GetName&inst]"
 nations.12273.desc:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Ракета, направлявшаяся в космос, потеряла тягу во время полёта и рухнула на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.12273.nomad:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Обычная ремонтная операция закончилась катастрофой: небесный док рухнул на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.12273.a:0 "Подставим другую щёку."
 nations.12273.b:0 "Мы должны потребовать извинений!"
 nations.12274.name:0 "Запрос технологий"
 nations.12274.desc:1 "Увидев §Yсовременное оружие§! наших сил безопасности, несколько генералов §H[FROM.GetName&gen]§! попросили поделиться частью наших военных технологий.\n\nНаши офицеры сомневаются, стоит ли это делать: если когда-нибудь дело дойдёт до войны, победить либертарианское государство станет заметно труднее.\n\nОтказ почти наверняка воспримут как недоверие к данному ими слову."
 nations.12274.a:0 "Вооружать борцов за свободу — плохая идея."
 nations.12274.b:0 "Они наши друзья. Поделимся тем, чем можем."
 nations.12275.name:0 "Послание доставлено"
 nations.12275.desc:1 "В последнее время торговля с §H[FROM.GetName&inst]§! почти сошла на нет, а караваны оттуда появляются всё реже. Сегодня мы получили сообщение от представителя местных вооружённых сил. Похоже, там очень недовольны."
 nations.12275.a:0 "Посмотрим, что там."
 nations.12276.name:0 "Послание"
 nations.12276.desc:0 "Поверхностник. Мы пытались быть добрыми соседями, но теперь ясно: вы не намерены оказывать нашей великой цивилизации должного уважения.\n\nОтныне этот мир по праву принадлежит нам целиком. Мы заберём его силой!"
 nations.12276.a:0 "Укрепить границу с §H[FROM.GetName&inst]§!!"
 nations.12277.name:0 "Государство [FROM.GetName] предлагает объединение"
 nations.12277.desc:0 "Во многом наши взгляды совпадают, [ROOT.GetName]. Мы предлагаем официально §Gобъединить§! два национальных государства в §Hединую державу§!."
 nations.12277.merge.fanatic:0 "Наши принципы почти едины, как и наши цели. Пора объединиться."
 nations.12277.merge.normal:0 "Наши принципы близки, а отношения давно стали дружескими. Пора объединиться."
 nations.12277.merge.different:0 "Несмотря на различия в принципах, наши государства стали неразрывно связаны. Пора объединиться."
 nations.12277.no:0 "Сейчас мы не готовы к объединению."
 nations.13261.name:0 "Обрушение"
 nations.13261.desc:1 "С [Root.GetName&gen] пришли тревожные вести! Инопланетяне [Root.Owner.GetSubMantleLower], с которыми мы там воюем, обрушили грунт под целой армией, стоявшей у одного из входов в их туннели.\n\nНемногих солдат, переживших падение, чужаки перебили прежде, чем основные силы успели прийти им на помощь."
