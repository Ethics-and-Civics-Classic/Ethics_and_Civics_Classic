 building_factory_angler_3:0 "Океанические репли-комплексы"
 building_factory_angler_3_desc:0 "$building_factory_3_desc$ Всё необходимое добывается из океана."
 building_fallout_shelter_tt:0 "Негативные эффекты §Y$default_storm$§!, влияющие на производство планеты, снижены на §G25%§!.\n\nПри наличии §Y$default_storm$§! или §Y$irradiated_wasteland$§!:$TABBED_NEW_LINE$$mod_planet_miners_minerals_produces_add$: §G+1§! $TABBED_NEW_LINE$$mod_planet_farmers_food_produces_add$: §G+1§! $TABBED_NEW_LINE$$mod_planet_technician_energy_produces_add$: §G+1§!\n\nПри наличии §Y$irradiated_wasteland$§!:$TABBED_NEW_LINE$£stability£ $MOD_PLANET_STABILITY_ADD$: §G+10§!"
 building_generator_generic_primitive_desc:0 "Постройка §Y3§! сооружений типа §Y$building_generator_generic$§! §Gустраняет§! все штрафы от £mod_pop_environment_tolerance£ §Rзагрязнения§! для £job_primitive_technician£ §H$job_primitive_technician_plural$§!."
 building_generator_generic_primitive_effect:0 "Сооружения типа §Y«$building_generator_generic$»§! используют солнечные панели как дополнение к энергосети, тем самым снижая общее загрязнение окружающей среды."
 building_heritage_museum:0 "Музей наследия"
 building_heritage_museum_desc:0 "Огромный музей, посвящённый достижениям прошлого этой ещё молодой цивилизации."
 building_high_society_clubs_custom_tooltip:0 "§Rнельзя создать§! §Yклубы высшего общества§!§R!§!"
 building_local_union_headquaters:0 "Местное профсоюзное представительство"
 building_local_union_headquaters_desc:0 "Это профсоюзное представительство объединяет местных работников, добиваясь более высокого уровня жизни и защиты гражданских прав."
 building_luxary_fishing_lodge:0 "Роскошный рыбацкий домик"
 building_luxary_fishing_lodge_desc:0 "Здесь соседствуют два редких преимущества: $zone_anglers$ и $resort_colony$. Для приезжих рыболовов построены роскошные домики, а местные воды славятся одними из самых экзотических рыб во всей галактике."
 building_machine_primitive_assembly_plant:0 "Примитивный сборочный завод"
 building_machine_primitive_assembly_plant_desc:0 "На производство одной единицы этим примитивным сборочным заводам требуются целые эпохи по меркам современной промышленности, но именно они положили начало роботизированной революции."
 building_machine_primitive_capital:0 "Континентальный массив"
 building_machine_primitive_capital_desc:0 "Центральный узел машинного разума, чья сеть охватывает целый континент и ведёт борьбу за контроль над этим миром."
 building_mine_generic:0 "Карьер-сплаволитейня"
 building_mine_generic_desc:0 "Над неглубокими карьерами возводятся дуговые печи, позволяющие сразу перерабатывать добытые минералы в сплавы."
 building_msi_uplift_center:0 "Центр просвещения"
 building_msi_uplift_center_desc:0 "Просвещение может быть не бесплатным. Но в $NAME_MSI_country_initials$ оно всегда оправдывает свою цену."
 building_primitive_nuclear_plant_apocalyptic:0 "Комплекс по обогащению урана"
 building_primitive_nuclear_plant_apocalyptic_desc:0 "Исполинский комплекс, способный обогащать огромные количества урана для производства ядерного оружия и снабжать межзвёздную державу достаточным количеством расщепляющегося материала для атомной энергетики."
 building_primitive_nuclear_plant_irradiated_wasteland_effect:0 "Во время строительства §Hкорабли-ковчеги§! получают модификатор £primitive_uranium£ ['modifier:irradiated_wasteland']"
 building_primitive_precinct_house:0 "Полицейский участок"
 building_primitive_precinct_house_desc:0 "Такие полицейские участки отправляют небольшие патрули поддерживать закон и защищать собственность."
 building_primitive_research:0 "Университетские исследовательские лаборатории"
 building_primitive_research_desc:0 "Именно университеты обеспечили основную часть научных исследований, позволивших цивилизации вступить в космический век."
 building_primitive_synthetics_refinery:0 "Завод синтетических материалов"
 building_primitive_synthetics_refinery_desc:0 "В атомном веке подобные предприятия встречались повсеместно: здесь нефть превращали в пластмассы для самых разных отраслей либо сжигали как топливо для выработки электричества."
 building_thermal_borehole_2:0 "Термобуровой экстрактор"
 building_thermal_borehole_2_desc:0 "Термобуровой экстрактор выходит далеко за пределы возможностей обычного бурения мантии. Усиленные шахты и усовершенствованные тепловые каналы открывают доступ к сверхплотным минеральным слоям, резко повышая добычу, но создавая колоссальное геотермальное напряжение и дестабилизируя окружающие экосистемы."
 building_underground_railroad_office:0 "Подземная железная дорога"
 building_underground_railroad_office_desc:0 "Иностранное государство создало здесь сеть Подземной железной дороги, чтобы помогать порабощённым жителям бежать с этого мира."
 tech_basic_industry:0 "Промышленность космического века"
 tech_basic_industry_desc:0 "Рабочим больше не приходится изнурительно трудиться на примитивных фабриках: теперь они обслуживают огромные комплексы автоматизированного производства. Только такие масштабы позволяют обеспечить общество передовыми материалами, необходимыми для превращения в межзвёздную цивилизацию."
 tech_basic_industry_tooltip:0 "§HОткрывает должности:§! [foundry.GetIcon] [GetAlloyProducer] [artisan.GetIcon] [artisan.GetNamePlural]"
 tech_basic_science_lab_1:0 "Исследователи космического века"
 tech_basic_science_lab_1_desc:0 "Примитивные инструменты прошлого исчезают из лабораторий. Прорывы космического века в общественных науках, материаловедении и инженерии коренным образом меняют сам процесс исследований."
 tech_basic_science_lab_1_tooltip:0 "§HОткрывает должности:§! £physics£ $job_physicist_plural$ £society£ $job_biologist_plural$ £engineering£ $job_engineer_plural$"
 tech_fission_power_tooltip:0 "§HОткрывает должность:§! £job_nuclear_technician£ $job_nuclear_technician_plural$"
 tech_fission_power_tooltip_desc:0 "$job_nuclear_technician_desc$"
 tech_fusion_power_tooltip:0 "§HОткрывает должность:§! £job_technician£ $job_technician_plural$\n§HЗаменяет§! £job_nuclear_technician£ $job_nuclear_technician_plural$ на £job_technician£ §Hтермоядерных техников§!."
 tech_fusion_power_tooltip_desc:0 "Техники больше не обслуживают грязные генераторы, отравляющие лёгкие работников, и не зависят от урана, оставляющего после себя ядерные отходы. Теперь они управляют чистыми термоядерными установками."
 tech_industrial_city:0 "Градостроительное планирование"
 tech_industrial_city_desc:0 "Города возникали всякий раз, когда множество жителей собиралось вместе ради общей цели. Но с ростом населения стихийной застройки уже недостаточно: начинается эпоха системного градостроительства."
 tech_industrial_farming_2:0 "Фермеры космического века"
 tech_industrial_farming_2_desc:0 "Когда-то фермеру приходилось вручную и неустанно заботиться об урожае. Теперь автоматизация оставляет фермерам лишь наблюдение за полями и контроль сложной техники."
 tech_industrial_farming_2_job_tooltip:0 "§HОткрывает должность:§! £job_farmer£ $job_farmer_plural$"
 tech_interplanetary_commerce:0 "Межконтинентальная торговля"
 tech_interplanetary_commerce_desc:0 "Полностью сформировавшиеся планетарные рынки открывают по всему миру новые возможности. Бизнес вступает в эпоху бурного роста."
 tech_mechanized_mining_2:0 "Шахтёры космического века"
 tech_mechanized_mining_2_desc:0 "Шахтёры больше не работают примитивными ручными инструментами в убийственно опасных условиях. Поколения изобретателей неустанно совершенствовали добычу, часто вдохновляясь историями тех, кто погиб в шахтах."
 tech_mechanized_mining_2_job_tooltip:0 "§HОткрывает должность:§! £job_miner£ $job_miner_plural$\nДля производства £primitive_uranium£ §H$primitive_uranium$§! требуется меньше £minerals£ минералов."
 tech_pirate_leaders_desc:0 "Эти пираты доказали свою ценность и лидерские качества на военной службе. Теперь ясно, что их таланты можно использовать и в государственном управлении… пусть и ценой нашего единства."
 tech_pirate_leaders_tooltip:0 "£job_politician£ $job_politician_plural$ также становятся £job_commandante_pirate£ §H$job_commandante_pirate_plural$§!\nЛидеры появляются с различными §Hпиратскими чертами правителя§!."
 tech_planetary_unification:0 "Межзвёздная держава"
 tech_power_plant_1_job_tooltip:0 ""
 tech_power_plant_1_space_age:0 "Техники космического века"
 tech_power_plant_1_space_age_desc:0 "Эти техники освоили производство и использование урана, чтобы обеспечить энергией наши межзвёздные амбиции."
 tech_pre_industrial_iron_construction:0 "Железные конструкции"
 tech_pre_industrial_iron_construction_desc:0 "Железо прочно и поддаётся обработке даже в простейшей кузнице: достаточно нагреть его и придать форму молотом. То, что было невозможно с камнем, становится обыденностью."
 tech_pre_industrial_iron_construction_tooltip:0 "§HОткрывает должность:§! £job_low_tech_laborer£ $job_low_tech_laborer_plural$"
 tech_pre_industrial_steel_construction:0 "Стальные конструкции"
 tech_pre_industrial_steel_construction_desc:0 "Свойства стали можно изменять с помощью различных химических добавок, получая материалы с оптимальной прочностью, пластичностью и другими характеристиками для строительства."
 tech_pre_industrial_stone_construction:0 "Каменное строительство"
 tech_pre_industrial_stone_construction_desc:0 "Камень встречается повсюду и легко доступен. Неудивительно, что рано или поздно кто-то поднимет его с земли и построит из него убежище."
 tech_primitive_adv_genetic_theory:0 "Генетический репозиторий"
 tech_primitive_adv_genetic_theory_desc:0 "Огромный комплекс баз данных хранит результаты генетических исследований и позволяет учёным углублять понимание наследственности, двигая генетику вперёд."
 tech_primitive_adv_genetic_theory_tooltip:0 "§H$building_medical_1$:§! §G+100§! £job_healthcare£ $job_healthcare_plural$"
 tech_primitive_aeroplanes:0 "Аэрокосмическая техника"
 tech_primitive_aeroplanes_desc:0 "Птицы свободно пересекают реки, океаны и горы. Естественно, что однажды кто-то захочет подарить обществу такую же свободу движения."
 tech_primitive_ai_computing_technology:0 "Нейросетевые компьютеры"
 tech_primitive_ai_computing_technology_desc:0 "Эти вычислительные системы устроены по образцу органического мозга и избавляют исследователей от рутинной обработки уже известных задач, высвобождая время для настоящего поиска."
 tech_primitive_ai_computing_technology_tooltip:0 "£job_primitive_researcher_2£ §H$job_primitive_researcher_2$:§! снижено содержание в £consumer_goods£ товарах массового спроса."
 tech_primitive_alloy_quarry_foundry:0 "Примитивная переработка сплавов"
 tech_primitive_alloy_quarry_foundry_desc:0 "В раннем космическом веке производство сплавов крайне энергоёмко из-за примитивных дуговых печей. Рядом с ними часто возникают специализированные карьеры, где добывают редкие элементы, необходимые для создания сплавов, способных выдержать межзвёздный перелёт."
 tech_primitive_aluminium_material:0 "Алюминиевые конструкции"
 tech_primitive_aluminium_material_desc:0 "Алюминий — лёгкий металл, идеально подходящий для авиационно-космической техники и строительства."
 tech_primitive_arkship:0 "Древний корабль-ковчег"
 tech_primitive_arkship_tooltip:0 "§HОткрывает класс кораблей-ковчегов:§! древний корабль-ковчег"
 tech_primitive_atomic_age_weapons:0 "Постатомное военное дело"
 tech_primitive_atomic_age_weapons_desc:0 "Сначала это открытие прославляли как научный прорыв, но вскоре его стали бояться как оружия массового уничтожения. Война изменилась."
 tech_primitive_atomic_era_computing_technology:0 "Транзисторные компьютеры"
 tech_primitive_atomic_era_computing_technology_desc:0 "Компьютеры атомного века занимают целые помещения, зато избавляют исследователей от значительной части громоздких вычислений."
 tech_primitive_atomic_era_computing_technology_tooltip:0 "£job_primitive_researcher_2£ §H$job_primitive_researcher_2$:§! снижено содержание в £consumer_goods£ товарах массового спроса."
 tech_primitive_bow_and_arrow:0 "Доиндустриальное военное дело"
 tech_primitive_bow_and_arrow_desc:0 "Палка и натянутая тетива кажутся простыми, но появление лука и стрел произвело настоящую революцию в военном деле."
 tech_primitive_combustion_technology:0 "Технология горения"
 tech_primitive_combustion_technology_desc:0 "Революционная технология использует простую реакцию горючего вещества с кислородом как источник энергии для всего общества. Цена прогресса — побочные продукты, отравляющие окружающую среду."
 tech_primitive_combustion_technology_tooltip:0 "§HОткрывает должность:§! £job_primitive_technician£ $job_primitive_technician_plural$\n§H$building_primitive_research$:§! §G+25§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$"
 tech_primitive_composite_material:0 "Композитные материалы"
 tech_primitive_composite_material_desc:0 "Композиты создаются сочетанием двух или более материалов с различными свойствами, чтобы получить новые характеристики — высокую прочность, малую массу и долговечность. Они идеально подходят для развитой авиационно-космической и ядерной техники."
 tech_primitive_computing_technology:0 "Перфокарты"
 tech_primitive_computing_technology_desc:0 "Листы плотного картона с точно пробитыми отверстиями позволяют хранить данные и задавать машинам конкретные последовательности действий."
 tech_primitive_computing_technology_tooltip:0 "£job_primitive_researcher_2£ §H$job_primitive_researcher_2$:§! снижено содержание в £consumer_goods£ товарах массового спроса."
 tech_primitive_early_aerospace_rocket:0 "Первый космический спутник"
 tech_primitive_early_aerospace_rocket_desc:0 "Общество стремится подняться выше небес — и рождается ракета, способная бросить вызов гравитационным оковам планеты."
 tech_primitive_electromagnetism_theory:0 "Теория электромагнетизма"
 tech_primitive_electromagnetism_theory_desc:0 "Электромагнетизм — раздел физики, изучающий электромагнитное взаимодействие между электрически заряженными частицами."
 tech_primitive_electromagnetism_theory_tooltip:0 "§H$building_primitive_research$:§! §G+25§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$"
 tech_primitive_generation_ship:0 "Межзвёздный корабль поколений"
 tech_primitive_generation_ship_desc:0 "Одной планеты нам недостаточно. Нужен корабль, способный преодолевать межзвёздные расстояния, но путь займёт столько времени, что несколько поколений будут рождаться, жить и умирать на борту прежде, чем цель окажется достигнута."
 tech_primitive_historical_archives:0 "Исторические архивы"
 tech_primitive_holographic_technology:0 "Голографические технологии"
 tech_primitive_holographic_technology_desc:0 "Голографические технологии используют свет и лазеры для создания объёмных изображений, словно парящих в пространстве. Вместе с ними коммерческому сектору открывается бесконечное поле новых возможностей."
 tech_primitive_holographic_technology_tooltip:0 "§H$building_commercial_zone$:§! §G+100§! £job_trader£ $job_trader_plural$\n§HОткрывает планетарное решение:§! $decision_planet_luxuries_boost$"
 tech_primitive_industrial_age_weapons:0 "Индустриальное военное дело"
 tech_primitive_industrial_age_weapons_desc:0 "Механизация подачи боеприпасов открыла путь к смертоносным системам вооружения для тяжёлых боевых машин."
 tech_primitive_nation_state_government:0 "Национальные государства"
 tech_primitive_nation_state_government_desc:0 "На пути к современному государству общество создаёт правительство, действующее от имени сообщества, члены которого всё сильнее отождествляют себя с единой нацией."
 tech_primitive_node:0 "Эволюция синапсических дронов"
 tech_primitive_node_desc:0 "Простой узел, позволяющий синапсическим дронам передавать волю коллективного разума и поддерживать устойчивую связь, направляющую остальных дронов."
 tech_primitive_node_job_tooltip:0 "§HОткрывает должность:§! £job_synapse_drone£ $job_synapse_drone_plural$"
 tech_primitive_nuclear_physics:0 "Теория ядерной физики"
 tech_primitive_nuclear_physics_desc:0 "Ядерная физика изучает атомные ядра, их состав, взаимодействия и другие формы ядерной материи."
 tech_primitive_nuclear_physics_tooltip:0 "§H$building_primitive_research$:§! §G+25§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$"
 tech_primitive_plastic_material:0 "Синтетические материалы"
 tech_primitive_plastic_material_desc:0 "Пластмассы — синтетические материалы на основе углеродного сырья. Их производство требует химической переработки, сильно загрязняющей окружающую среду, но спектр применения пластмасс практически безграничен."
 tech_primitive_quantum_computing_technology:0 "Квантовые компьютеры"
 tech_primitive_quantum_computing_technology_desc:0 "Компьютеры раннего космического века используют квантово-механические явления и благодаря этому выполняют вычисления ещё быстрее."
 tech_primitive_quantum_computing_technology_tooltip:0 "£job_primitive_researcher_2£ §H$job_primitive_researcher_2$:§! снижено содержание в £consumer_goods£ товарах массового спроса."
 tech_primitive_quantum_electronics_theory:0 "Теория квантовой электроники"
 tech_primitive_quantum_electronics_theory_desc:0 "Квантовая электроника — направление квантовой теории, изучающее применение квантовых эффектов в электронных устройствах и системах."
 tech_primitive_quantum_electronics_theory_tooltip:0 "§H$building_primitive_research$:§! §G+50§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$"
 tech_primitive_quantum_mechanics_theory:0 "Теория квантовой механики"
 tech_primitive_quantum_mechanics_theory_desc:0 "Квантовая механика — фундаментальная теория, описывающая поведение природы на масштабе атомов и ниже."
 tech_primitive_quantum_mechanics_theory_tooltip:0 "§H$building_primitive_research$:§! §G+50§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$"
 tech_primitive_radiowave_telescope:0 "Радиотехнологии"
 tech_primitive_radiowave_telescope_desc:0 "Радиотелескоп — специализированная антенна с радиоприёмником, предназначенная для регистрации радиоволн от астрономических источников на небе."
 tech_primitive_radiowave_theory:0 "Теория радиоволн"
 tech_primitive_radiowave_theory_desc:0 "Теория радиоволн — раздел электромагнетизма, изучающий связанные электрическое и магнитное поля, то есть электромагнитные волны, распространяющиеся в пространстве."
 tech_primitive_radiowave_theory_tooltip:0 "§H$building_primitive_research$:§! §G+25§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$"
 tech_primitive_scientific_method:0 "Научный метод"
 tech_primitive_scientific_method_desc:0 "Научный метод — систематический способ познания, основанный на наблюдении, выдвижении гипотез, эксперименте, анализе данных и выводах, позволяющих проверять и уточнять представления о природе."
 tech_primitive_scientific_method_tooltip:0 "§HОткрывает должность:§! £job_primitive_researcher£ $job_primitive_researcher_plural$"
 tech_primitive_space_age_weapons:0 "Военное дело космического века"
 tech_primitive_space_age_weapons_desc:0 "Мировые войны когда-то казались пределом масштабов конфликта. Теперь целая планета выглядит лишь одним полем боя среди множества миров галактики."
 tech_primitive_synapses:0 "Эволюция дронов-анализаторов"
 tech_primitive_synapses_desc:0 "Простой узел, позволяющий дронам-анализаторам стать органами чувств коллективного разума и обеспечивать ему наблюдение за деятельностью остальных дронов."
 tech_primitive_synapses_job_tooltip:0 "§HОткрывает должность:§! £job_evaluator£ $job_evaluator_plural$"
 tech_primitive_theory_of_evolution:0 "Теория эволюции"
 tech_primitive_theory_of_evolution_desc:0 "Любознательные умы замечают закономерности между видами и неизбежно задаются вопросом: «Почему они так похожи?»"
 tech_primitive_thrusters_0:0 "Баллистическая ракета"
 tech_primitive_thrusters_0_desc:0 "Появившиеся в машинном веке ракеты оснащаются простыми твердотопливными двигателями, способными поднять боеприпас высоко в небо, а затем направить его вниз — точно на цель."
 tech_primitive_unified_planet:0 "Объединённая планета"
 tech_primitive_unified_planet_desc:0 "Под единым знаменем наш мир перестал быть раздробленным. Теперь мы — единый народ, готовый вынести свои идеи к звёздам."
 tech_primitive_unified_planet_tooltip:0 "§HОткрывает планетарное решение:§! $decision_expel_population$"
 tech_primitive_universities:0 "Национальные университеты"
 tech_primitive_universities_desc:0 "Национальные учреждения высшего образования, где обучают студентов и проверяют их знания в самых разных областях передовой науки."
 tech_primitive_universities_tooltip:0 "§HОткрывает должность:§! £job_primitive_researcher_2£ $job_primitive_researcher_2_plural$"
 tech_proto_thrusters_1:0 "Орбитальная механика"
 tech_solar_panel_network:0 "Солнечная энергетика"
 tech_solar_panel_network_desc:1 "Сложные фотоэлектрические элементы создают электродвижущую силу и ток, превращая часть энергии света в электричество."
 tech_space_international_space_station:0 "Международная космическая станция"
 tech_space_international_space_station_desc:0 "Впервые весь мир объединил усилия ради почти немыслимого — постоянного научно-исследовательского центра среди звёзд над планетой."
 tech_thrusters_1:0 "Эффективные химические двигатели"
 tech_thrusters_1_desc:0 "Простые, но достаточно эффективные химические двигатели используют усовершенствованное горючее для создания тяги, необходимой космическим кораблям."
