 payback_out_of_warranty_chain_desc:0 "Сооружения §Y«$building_medical_2$»§!, построенные для нас корпорацией $NAME_MSI_country_initials$, ветшают из-за отсутствия обслуживания. Хотя большая часть этих технологий пока недоступна нашему пониманию, мы можем попытаться §Sотремонтировать§! клиники.\n\n§LСоглашения об исследованиях с другими государствами повысят наши шансы на успех. [GetAgreementStatus]§!"
