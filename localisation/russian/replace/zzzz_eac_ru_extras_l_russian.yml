 EaC_civic_mechanic_events.103.option.official_machine_a:0 "Интегрировать знания Хранилища в память правителя."
 EaC_civic_mechanic_events.103.option.scientist_hive_a:0 "Пусть знания Хранилища станут частью памяти улья."
 EaC_civic_mechanic_events.103.option.scientist_machine_a:0 "Интегрировать знания Хранилища в память правителя."
 EaC_civic_mechanic_events.103.title.other:0 "Наследие прошлого"
 EaC_civic_mechanic_events.41.desc.has_ideology.has_slaves:0 "На §H[Root.GetName&prep]§! спало общественное напряжение. Хотя рабство сохраняется, движение, прежде объединявшее недовольных рабочих и сочувствующих, быстро теряет поддержку: чувство материальной защищённости оказалось сильнее призывов к борьбе."
 EaC_civic_mechanic_events.41.desc.has_ideology.no_slaves:0 "На §H[Root.GetName&prep]§! восстановилась стабильность, а прежние требования рабочего движения во многом утратили остроту. Всё меньше жителей готовы поддерживать забастовки и подпольную борьбу, предпочитая вернуться к обычной жизни."
 EaC_civic_mechanic_events.41.desc.no_ideology.has_slaves:0 "На §H[Root.GetName&prep]§! почти исчезла идеологическая почва, на которой держалось рабочее движение. Даже сохраняющееся рабство больше не собирает вокруг него достаточно сторонников, и организованное сопротивление постепенно сходит на нет."
 EaC_civic_mechanic_events.41.desc.no_ideology.no_slaves:0 "На §H[Root.GetName&prep]§! не осталось ни прежней идеологической поддержки, ни рабства, служившего постоянным источником напряжения. Подпольные сети распались, а некогда влиятельное рабочее движение практически исчезло."
 EaC_civic_mechanic_events.4123.a:0 "Теперь этот мир опустел."
 EaC_civic_mechanic_events.4123.desc:0 "Последний представитель местной досветовой цивилизации был увезён с планеты. Теперь на ней не осталось коренного населения; общество, за которым ещё недавно можно было наблюдать, фактически прекратило существование."
 EaC_civic_mechanic_events.4123.name:0 "Последний житель похищен"
 EaC_civic_mechanic_events.6001.desc:0 "Среди реликвий прошлого обнаружен необычный образец, способный многое рассказать об истории жизни на нашем мире. Его изучение может дать новые сведения о развитии предразумных видов и приблизить нас к пониманию механизмов их возвышения."
 EaC_civic_mechanic_events.6001.name:0 "Древний трофей"
 EaC_civic_mechanic_events.9.b:0 "Мы продолжим их возвышение до каменного века и будем наблюдать."
 PrimPlay_situation_event.2.civic_hive_stargazers_effects:0 "Улей вновь обращает взор к звёздам."
 PrimPlay_situation_event.2.civic_hive_stargazers_effects.desc:0 "Этот улей с древнейших времён смотрел на звёзды и мечтал вырваться за пределы родного мира. Первые подпространственные корабли приблизили мечту, но теперь коллективный разум ищет путь к настоящим межзвёздным путешествиям.\n\nМысль принимает форму... $tech_hyper_drive_theory_desc$"
 PrimPlay_situation_event.2.civic_machine_exploration_protocol:0 "Активировать протокол дальнейшего исследования."
 PrimPlay_situation_event.2.civic_machine_exploration_protocol.desc:0 "Главная директива этого машинного разума требует изучить и описать жизнь за пределами родного мира. Подпространственные корабли позволили сделать первые шаги, но дальнейшее исполнение протокола требует настоящих межзвёздных перелётов.\n\nРасчёты сходятся в одной точке... $tech_hyper_drive_theory_desc$"
 PrimPlay_situation_event.3.payback.desc:0 "Первый контакт с $NAME_MSI_country$ едва не закончился нашим порабощением. Мы сумели отбиться, но знаем, что враг может вернуться. Перед такой угрозой раздробленный мир не выстоит. Наша следующая цель — §H$tech_primitive_unified_planet$§!."
