 PrimPlayer_developing_hyperdrive_situation_desc:0 "$tech_hyper_drive_1$ — технология, далеко превосходящая всё, что мы когда-либо создавали. Даже строительство подобного устройства потребует многих лет проектирования и участия величайших умов нашего общества."
 PrimPlayer_developing_hyperdrive_situation_modifier_tooltip:0 "Даёт §Gнебольшой шанс§! открыть технологию §H$tech_subspace_drive$§!"
 PrimPlayer_developing_hyperdrive_situation_stage_1:0 "В ходе работы над §H$tech_hyper_drive_1$§! возможны §Gпрорывы§!, увеличивающие £physics£ §Yпрогресс§!, однако столь масштабный проект неизбежно повлечёт §Yслучайные события§!, которые §Rмогут отбросить исследования назад§!.\n\nДаёт §Gнебольшой шанс§! открыть технологию §H$tech_subspace_drive$§!"
