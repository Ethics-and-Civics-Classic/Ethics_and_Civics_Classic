 civic_feudal_realm_authority:0 "Неофеодализм"
 civic_feudal_realm_authority_desc:0 "Группа акционеров делит эту мегакорпорацию на феоды, над которыми правит крупнейший держатель акций.\n\n§YПравители§! §Wи§! §Yлидеры§! §Wстановятся§! §Hаристократами§!"
