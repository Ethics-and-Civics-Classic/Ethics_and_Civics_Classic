 EaC_civic_mechanic_events.103.title.scientist_machine_is_memorialist_empire:0 "Переливание памяти"
 EaC_civic_mechanic_events.103.desc.official_elected:0 "Извилистые лестницы политического крыла ведут к архивам, где за бесчисленные эпохи накопились политические трактаты, своды законов, записи о государственной политике, гражданском планировании, снабжении и множестве других областей знания. Во внутренних залах находится древнее устройство, способное внедрить часть библиотеки Хранилища в разум избранного.\n\nНа создание проводника для переливания памяти уходит десятилетие, и после каждого использования его приходится расширять. Поэтому именно §Y[ROOT.GetLeaderName]§! получает право пройти §Gпереливание памяти§!. Пусть обретённые знания ведут [ROOT.GetName&acc] вперёд!"
 EaC_civic_mechanic_events.103.desc.official_elected_20:0 "Извилистые лестницы политического крыла ведут к архивам, где за бесчисленные эпохи накопились политические трактаты, своды законов, записи о государственной политике, гражданском планировании, снабжении и множестве других областей знания. Во внутренних залах находится древнее устройство, способное внедрить часть библиотеки Хранилища в разум избранного.\n\nНа создание проводника для переливания памяти уходят десятилетия, и после каждого использования его приходится расширять. Поэтому именно §Y[ROOT.GetLeaderName]§! получает право пройти §Gпереливание памяти§!. Пусть обретённые знания ведут [ROOT.GetName&acc] вперёд!"
 EaC_civic_mechanic_events.103.desc.official_dictator:0 "Извилистые лестницы политического крыла ведут к архивам, где за бесчисленные эпохи накопились политические трактаты, своды законов, записи о государственной политике, гражданском планировании, снабжении и множестве других областей знания. Во внутренних залах находится древнее устройство, способное внедрить часть библиотеки Хранилища в разум избранного.\n\nНа создание проводника для переливания памяти уходят десятилетия, и после каждого использования его приходится расширять. Именно §Y[ROOT.GetLeaderName]§! получает право на §Gпереливание памяти§!. Пусть обретённые знания поведут [ROOT.GetName&acc] вперёд!"
 EaC_civic_mechanic_events.103.desc.official_dictator_is_memorialist_empire:0 "Извилистые лестницы политического крыла ведут к архивам, где за бесчисленные эпохи накопились политические трактаты, своды законов, записи о государственной политике, гражданском планировании, снабжении и множестве других областей знания.\n\nВ глубинных залах Хранилища скрыт тайный комплекс с древним устройством, способным внедрять часть его библиотеки в разум правителя. §BПалата власти§! хранит воспоминания всех прежних правителей государства.\n\nСегодня §Y[ROOT.GetLeaderName]§! проходит торжественное §Gпереливание памяти§! и становится продолжением предшественника, сливаясь с единым сознанием, живущим через череду преемников."
 EaC_civic_mechanic_events.103.desc.official_imperial:0 "Извилистые лестницы политического крыла ведут к архивам, где за бесчисленные эпохи накопились политические трактаты, своды законов, записи о государственной политике, гражданском планировании, снабжении и множестве других областей знания.\n\nВо внутренних залах находится древнее устройство, способное внедрить часть библиотеки Хранилища в разум избранного.\n\nНа создание проводника для переливания памяти уходят десятилетия, и после каждого использования его приходится расширять. §Y[ROOT.GetLeaderName]§! обладает наследственным правом на §Gпереливание памяти§!. Пусть обретённые знания поведут [ROOT.GetName&acc] вперёд!"
 EaC_civic_mechanic_events.103.desc.official_imperial_is_memorialist_empire:0 "Извилистые лестницы политического крыла ведут к архивам, где за бесчисленные эпохи накопились политические трактаты, своды законов, записи о государственной политике, гражданском планировании, снабжении и множестве других областей знания.\n\nВ глубинных залах Хранилища скрыт древний комплекс с устройством, способным внедрять часть его библиотеки в разум правителя. §BКоролевская палата§! хранит воспоминания всего правящего рода и тщательно оберегается, чтобы однажды передать их следующему поколению.\n\nСегодня священный день: §Y[Root.GetHeirName]§! получает титул «[Root.GetHeirTitle]» и становится свидетелем §Gкоронации памяти§!. §Y[ROOT.GetLeaderName]§! проходит обряд, принимая память предшественника и вливаясь в сознание предков, которое продолжает жить в их потомках."
 EaC_civic_mechanic_events.103.desc.official_hive_is_memorialist_empire:0 "Извилистые лестницы политического крыла ведут к архивам, где за бесчисленные эпохи накопились политические трактаты, своды законов, записи о государственной политике, гражданском планировании, снабжении и множестве других областей знания.\n\nВ глубинных залах Хранилища находится кора памяти улья. Через специальный проводник она внедряет часть архивной библиотеки в правящий разум. Эта §Bкора памяти улья§! хранит воспоминания всех существ, когда-либо входивших в состав улья.\n\nИз-за сложности создания проводников §Y[ROOT.GetLeaderName]§! может проходить §Gпереливание памяти§! лишь раз в несколько десятилетий."
 EaC_civic_mechanic_events.103.desc.official_megacorp:0 "Извилистые лестницы политического крыла ведут к архивам, где за бесчисленные эпохи накопились политические трактаты, своды законов, записи о государственной политике, гражданском планировании, снабжении и множестве других областей знания.\n\nВ глубинных залах Хранилища расположена штаб-квартира [ROOT.GetName&gen]. Здесь находится древнее устройство, способное внедрять часть архивной библиотеки в чужой разум, но для него требуется особый проводник, изготовление которого занимает десятилетия. Поэтому с деловой точки зрения именно §Y[ROOT.GetLeaderName]§! лучше всего подходит для §Gпереливания памяти§!. Накопленная мудрость поможет приумножать кредиты и вести [ROOT.GetName&acc] к процветанию!"
 EaC_civic_mechanic_events.103.desc.official_machine_is_memorialist_empire:0 "Извилистые лестницы политического крыла ведут к архивам, где за бесчисленные эпохи накопились политические трактаты, своды законов, записи о государственной политике, гражданском планировании, снабжении и множестве других областей знания.\n\nВ глубинных залах Хранилища находится древнее ядро памяти. Через специальный проводник оно внедряет часть архивной библиотеки в правящий разум. Это §Bдревнее ядро памяти§! хранит накопленный опыт всех единиц, когда-либо входивших в сеть.\n\nИз-за сложности изготовления проводников §Y[ROOT.GetLeaderName]§! может проходить §Gпереливание памяти§! лишь раз в несколько десятилетий."
 EaC_civic_mechanic_events.103.desc.commander_elected:0 "Извилистые лестницы военного крыла ведут к архивам, где за бесчисленные эпохи накопились труды по стратегии и военному искусству. Ряды голокниг посвящены всем видам войны — на суше, в воздухе, на море, на орбите и в открытом космосе. Во внутренних залах находится древнее устройство, способное внедрить часть библиотеки Хранилища в разум избранного.\n\nНа создание проводника для переливания памяти уходит десятилетие, и после каждого использования его приходится расширять. Поэтому именно §Y[ROOT.GetLeaderName]§! получает право пройти §Gпереливание памяти§!. Пусть обретённые знания ведут [ROOT.GetName&acc] вперёд!"
 EaC_civic_mechanic_events.103.desc.commander_elected_20:0 "Извилистые лестницы военного крыла ведут к архивам, где за бесчисленные эпохи накопились труды по стратегии и военному искусству. Ряды голокниг посвящены всем видам войны — на суше, в воздухе, на море, на орбите и в открытом космосе. Во внутренних залах находится древнее устройство, способное внедрить часть библиотеки Хранилища в разум избранного.\n\nНа создание проводника для переливания памяти уходит десятилетие, и после каждого использования его приходится расширять. Поэтому именно §Y[ROOT.GetLeaderName]§! получает право пройти §Gпереливание памяти§!. Пусть обретённые знания ведут [ROOT.GetName&acc] вперёд!"
 EaC_civic_mechanic_events.103.desc.commander_dictator:0 "Извилистые лестницы военного крыла ведут к архивам, где за бесчисленные эпохи накопились труды по стратегии и военному искусству. Ряды голокниг посвящены всем видам войны — на суше, в воздухе, на море, на орбите и в открытом космосе.\n\n"
