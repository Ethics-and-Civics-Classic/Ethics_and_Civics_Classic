 EaC_civic_mechanic_events.103.option.official_dictator_is_memorialist_empire_a:0 "Да здравствует правитель, которому неведом покой!"
 EaC_civic_mechanic_events.103.option.official_imperial_a:0 "Пусть Хранилище поделится знаниями и подготовит нового правителя!"
 EaC_civic_mechanic_events.103.option.official_imperial_is_memorialist_empire_a:0 "Царственный Предок продолжает жить!"
