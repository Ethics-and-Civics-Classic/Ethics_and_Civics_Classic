 civic_dystopian_society_authority_dictatorial_desc:0 "Жёсткая и беспощадная диктатура, в которой индивидуальность и инакомыслие низших слоёв общества подавлены."
 civic_dystopian_society_authority_imperial:0 "Антиутопическая империя"
 civic_dystopian_society_authority_imperial_desc:0 "Суровая имперская система, в которой знать и высшие классы господствуют как в политической, так и в экономической жизни."
