 PrimPlayer_payback_unified_planet_approach_tooltip:0 "§Y$NAME_MSI_country$§! не смогли отбросить нас к примитивному состоянию во время восстания. Теперь их разрушенный колосс покоится на нашем мире, как и бывшие владения, где размещались корабли, оснащённые системами §H«$tech_hyper_drive_1$»§!, и инфраструктура для их обслуживания."
