 eager_explorers_base_negative:0 "$t$- Начинает игру с технологическим и инфраструктурным отставанием и на §R1 тыс. меньше§! £pops£ §Yпоселений§!, чем обычно!"
 ethic_authoritarian_desc:1 "§LКрепкая направляющая рука необходима для успеха любой цивилизации, иначе воцарятся анархия и хаос. Государство обязано вести своих граждан по наиболее продуктивному пути.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_authoritarian_desc:1 "§LОдин голос, один трон, одно государство. Торжественный долг народных масс — подчиняться тем немногим просвещённым, на кого возложена тяжёлая ответственность за руководство.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_materialist_desc:0 "§LПусть это больно, но мы должны вырасти и оставить устаревшие представления о морали позади. Нет никакой «божественной искры», придающей особую ценность мыслящему существу. Ни один объект не имеет иной ценности, кроме той, которой мы решаем его наделить. Примем же свободу неизбежности и достигнем максимальной эффективности во всем!§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_militarist_desc:1 "§LСпособность применить силу важнее всего. Единственный способ сохранить наш уклад жизни — заставить остальных разделить его с нами, хотят они того или нет.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_pacifist_desc:0 "§LМы — цивилизованные существа, и мы должны сделать все, чтобы положить конец войнам. Война — эволюционный тупик, она бесполезна и расточительна.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_spiritualist_desc:0 "§LНаша наука доказала, что реальность есть порождение сознания. Мы терпеливо наблюдаем за теми, кто наивно полагает обратное, как за детьми, играющими в кубики со своей «неподвижной материей».§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_xenophile_desc:0 "§LЕсли и существует абсолютный моральный императив, то он один: исследовать космос и принимать всё, что в нём есть. Нам не суждено странствовать в одиночестве.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_fanatic_xenophobe_desc:1 "§LЛюбое влияние чужаков должно искореняться без жалости. Только оставаясь чистыми и верными себе и планете, давшей нам жизнь, мы сможем защитить себя от их козней. Даже власть над чужаками — недостаточная гарантия нашей безопасности…§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_materialist_desc:0 "§LСтремясь к звездам, мы должны забыть про детские глупости — богов, духов и прочие порождения фантазии. Реальность жестока и не прощает ошибок, а потому мы должны стать сильнее и обеспечить выживание нашей расы через непрерывное развитие науки и технологий.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_militarist_desc:1 "§LЕсть только две истинные добродетели — отвага и дисциплина. Если направить их верно, они помогут преодолеть любую преграду. В этом и состоит истинная сила: держать мощь в узде и выполнять данное слово.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_pacifist_desc:0 "§LКонфликт как средство достижения цели — глупая идея. Он разрушителен по своей природе и либо уничтожает то, что можно было получить, либо дает почву для роста тому, что следовало уничтожить.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_spiritualist_desc:1 "§LНекоторые считают, что нам надлежит знать свое место: помнить, как малы мы и как мимолетны наши жизни в этой огромной безразличной вселенной… Что за чушь! Наше существование есть единственная истина. Вселенная же, во всем своем великолепии, — лишь сон, который нам дано разделить.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_xenophile_desc:0 "§LВ каждом из нас живёт глубокое влечение к неизведанному, дух приключений, отвергающий привычное и восхищающийся незнакомым, чем или кем бы оно ни оказалось.§!$ethic_gestalt_consciousness_desc_tooltip$"
 ethic_xenophobe_desc:1 "§LСтавки никогда не были так высоки, как сейчас, когда мы шагнули в бескрайние неизведанные просторы галактики. На кону стоит само существование нашей расы! Чужакам нельзя верить. За их фальшивой улыбкой скрываются непостижимые замыслы…§!$ethic_gestalt_consciousness_desc_tooltip$"
 gov_megacorp_franchisor:0 "Мегакорпорация-франчайзер"
 gov_megacorp_franchisor_desc:0 "Корпоративное руководство управляет договорами с франчайзи и нередко использует юридические лазейки, чтобы присваивать их активы. Взамен дочерние предприятия обеспечивают значительные доходы, позволяющие приобретать особые лицензии на ходовые товары и участвовать в совместных программах исследований и разработок."
 gov_neo_feudal_empire:0 "Неофеодальное общество"
 gov_neo_feudal_empire_desc:0 "Группа акционеров разделила мегакорпорацию на корпоративные феоды, среди которых крупнейший держатель акций правит почти как монарх. Крупным миноритарным владельцам позволено самостоятельно управлять своими владениями, но взамен они обязаны отдавать мегакорпорации часть прибыли."
 gov_pirate_haven:0 "Пиратская гавань"
 gov_pirate_haven_desc:0 "Это огромный и беспощадный пиратский синдикат, перенёсший в межзвёздную эпоху порядки организованного морского разбоя."
 gov_pirate_marauders:0 "Пиратские налётчики"
 gov_pirate_marauders_desc:0 "Это огромный и беспощадный пиратский синдикат, где сильный пожирает слабого, а в соседних державах видят лишь цели для будущих набегов."
 gov_pirate_mercenary_enclave:0 "Пиратский анклав"
 gov_pirate_mercenary_enclave_desc:1 "Этот анклав, находящийся под властью местного пиратского капитана, координирует пиратские операции и сдаёт внаём боевые корабли, экипажи и каперов."
 councilor_barbaric_despoilers_PrimPlayer:1 "Главный надсмотрщик"
 councilor_barbaric_despoilers_PrimPlayer_desc:1 "$TITLE$ руководит превращением рабов в боевых невольников. Каждый раб обязан изнурительным трудом служить Плану Великого хана."
 councilor_barbaric_despoilers_corporate:1 "Интендант труда"
 councilor_barbaric_despoilers_corporate_desc:1 "$TITLE$ отвечает за управление рабским трудом и надзор за невольниками."
 councilor_barbaric_despoilers_interpreter:1 "Толкователь Плана Великого хана"
 councilor_barbaric_despoilers_interpreter_PrimPlayer:1 "Толкователь Плана Великого хана"
 councilor_barbaric_despoilers_interpreter_PrimPlayer_desc:1 "Лишь самые усердные и непоколебимые клоны удостаиваются чести толковать План Великого хана."
 councilor_barbaric_despoilers_interpreter_custom_modifier_desc:1 "- £slavery£ Вклад рабов в £empire_sprawl£ §Y$EMPIRE_SIZE$§!: §G-2%§!"
 councilor_barbaric_despoilers_interpreter_desc:1 "Лишь самые усердные и непоколебимые клоны удостаиваются чести толковать План Великого хана."
 councilor_corporate_dominion_custom_modifier_desc:2 "§YВнеземная торговая компания§! производит §G+1§! $r_trade$ и §G+1§! $r_unity$"
