 PrimPlayer_fear_of_the_dark_unified_planet_approach_tooltip:0 "После разрушительного удара по нашему родному миру выжившие быстро основали новую столицу. Когда отчаяние достигло предела, они стали видеть в нашем правительстве источник порядка и стабильности."
