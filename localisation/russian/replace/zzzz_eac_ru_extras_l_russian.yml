 TECH_UNLOCK_THRUSTER_0_DESC:0 "§HПротохимический двигатель§!\nРанние космические программы испытывали прототипы различных химических двигателей, пытаясь найти оптимальную схему сжигания топлива для создания тяги."
 TECH_UNLOCK_THRUSTER_0_TITLE:0 "§HОткрывает компонент:§! протохимический двигатель"
 TECH_UNLOCK_THRUSTER_1_DESC:0 "§HЭффективный химический двигатель§!\nПростые, но достаточно эффективные химические двигатели используют усовершенствованное горючее для создания тяги."
 TECH_UNLOCK_THRUSTER_1_TITLE:0 "§HОткрывает компонент:§! эффективный химический двигатель"
 astroid_mining_hub_drone_laser:0 "£building£ §H$sm_astroid_mining_hub$:§! §G+15%§! к урону §Yштурмовиков§!"
 astroid_mining_hub_drone_laser_desc:0 "Все дроны, размещённые на модуле §Y«$sm_astroid_mining_hub$»§!, оснащаются боевыми версиями технологии §Y«$tech_mining_drone_weapon_1$»§!, усиливая местные эскадрильи штурмовиков."
 orbital_ring_tier_0_MEGASTRUCTURE_DETAILS:0 "§Y$orbital_ring_tier_0$§! — разновидность космической базы на высокой орбите планеты, обеспечивающая орбитальную оборону и строительство кораблей."
 required_for_tech_primitive_space_age_weapons:0 "Требуется для £society£ §H$tech_primitive_space_age_weapons$§!"
 colony_vessel_desc:0 "Гражданское судно, предназначенное для основания колоний на пригодных для жизни мирах."
 engineer_vessel_desc:0 "Инженерное судно, предназначенное для строительства космических станций и другой орбитальной инфраструктуры."
 explorer_vessel_desc:0 "Исследовательское судно, предназначенное для изучения неизвестных систем и дальнего космоса."
 SENSOR_0:0 "Радиолокационная система"
 SENSOR_0_DESC:1 "Используя радиоволновые технологии, эти радиолокационные системы обеспечивают ограниченные возможности обнаружения и отслеживания космических аппаратов."
 SENSOR_1:0 "Межзвёздная радиолокационная система"
 SENSOR_1_DESC:1 "Планетарная технология, адаптированная для применения в глубоком космосе. Теория гиперкоридоров позволяет этим простым радиолокационным системам обеспечивать базовое обнаружение и отслеживание межзвёздных судов."
 SHIP_THRUSTER_0:0 "Протохимические двигатели"
 SHIP_THRUSTER_0_DESC:0 "Ранние космические программы испытывали прототипы различных химических двигателей, пытаясь найти оптимальную схему сжигания топлива для создания тяги."
 SHIP_THRUSTER_1:0 "Эффективные химические двигатели"
 SHIP_THRUSTER_1_DESC:0 "Простые, но достаточно эффективные химические двигатели используют усовершенствованное горючее для создания тяги, необходимой космическим кораблям."
 orbital_ring_tier_0:0 "Орбитальная станция"
 orbital_ring_tier_0_CONSTRUCTION_INFO_DELAYED:1 "Орбитальные станции укрепляют оборону планеты и служат платформой для многочисленных модулей и сооружений космической базы, а также жилых модулей и орбитальных производственных комплексов."
 sm_astroid_mining_hub:0 "Центр добычи на астероидах"
 sm_astroid_mining_hub_desc:0 "Комплекс офисов и перерабатывающих мощностей, где размещаются инженеры и координаторы, управляющие добычей на астероидах системы.\n"
 EaC_administration_strikes:0 "Забастовка администрации"
 EaC_administration_strikes_desc:0 "Руководители планетарной администрации объявили забастовку в знак солидарности с местным рабочим движением."
 EaC_inspired_slave_resistance:0 "Воодушевлённое сопротивление рабов"
 EaC_inspired_slave_resistance_desc:0 "Подземная железная дорога на [ROOT.GetName&prep] распространяет истории об удачных побегах рабов. Порабощённое население мира всё враждебнее относится к нашему правительству, видя в происходящем предвестие скорого освобождения."
 EaC_labor_movements:0 "Рабочее движение"
 EaC_labor_movements_desc:0 "Рабочие этой планеты прониклись радикальными идеями децентрализации власти и демократического владения средствами производства."
 EaC_labor_propaganda:0 "Рабочая агитация"
 EaC_labor_propaganda_desc:0 "Местное рабочее движение усилило агитацию, стремясь подготовить всеобщую забастовку планетарного масштаба."
 EaC_operation_complete_establish_underground_railroad_modifier:0 "Подземная железная дорога"
