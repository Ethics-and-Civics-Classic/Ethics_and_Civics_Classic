 civic_tooltip_worker_coop_effects:0 "Открывает уровень жизни §Y$living_standard_worker_ownership$§!, при котором все £pop£ поселения расходуют много $r_consumer_goods$ независимо от §Yсоциального слоя§!.\n\nБольшинство других §Yуровней жизни§! недоступны.\n\nОткрывает торговую политику §Y$trade_policy_mutual_aid$§!, преобразующую $r_trade$ в $r_energy$, $r_minerals$ и $r_food$.\n\nДолжности £job_executive£ $job_executive$ и £job_manager£ $job_manager$ заменяются на £job_manager£ §Y$job_steward$§!, которые превращают $r_consumer_goods$ в $r_unity$, $r_trade$ и $r_amenities$.\n\nНа планетах с §Yфилиалами§! могут появляться должности §R«Всеобщая забастовка»§! среди £pops£ §Hлибертарианских§! или £pops£ §Hкооперативных§! поселений, если их §Hправа вида§! недостаточны.\n\n§YФилиалы§! по возможности создают §Hфракции трудовых прав§!."
