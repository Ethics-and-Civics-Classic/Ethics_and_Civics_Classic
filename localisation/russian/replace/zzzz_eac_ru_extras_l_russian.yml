 origin_broken_shackles:0 "Сброшенные оковы"
 origin_broken_shackles_desc:1 "$CHALLENGING_ORIGIN$\nЭта цивилизация зародилась в результате мятежа на невольничьем корабле, поднятого пёстрой группой представителей досветовых видов.\n\n§H$conscription_stance_3$§!: §Wполитика призыва§! §Gдоступна§!§W.§!\n\n§WОткрывает:§! режим орбитальной бомбардировки §Y«Освобождение рабов»§!."
 origin_heirs_of_the_khan_effects:0 "• Кочевое происхождение\n• Периодически подвергается нападениям §Rвраждебных§! кораблей мародёров\n• Может стать ханом, если сумеет выжить\n• Может создавать вассальные §Yсатрапии§!\n\n$civic_slaver_guilds_effects$\n\n£job_noble£ ['civic:civic_aristocratic_elite'] даёт изменённые §Gбонусы§!."
 origin_ocean_machines_desc:0 "Сразу после появления на свет эта механическая цивилизация погрузилась в пучины океана, богатого и спокойного.\n\n§WВ начале игры доступна технология§! §Y$tech_resort_colonies$§!\n§WГарантированно доступны для исследования§! §Y$tech_terrestrial_sculpting$§! §Wи§! §Y$tech_mine_rare_crystals$§!."
 origin_ocean_machines_effects:0 "§W• $HOMEWORLD$$TABBED_NEW_LINE$• ['concept_pc_ocean'] (размер: £planetsize£ 30)$TABBED_NEW_LINE$• $PLANETARY_MODIFIERS$ ['concept_ocean_paradise_mod']$TABBED_NEW_LINE$• $PLANETARY_FEATURES$ ['concept_crystal_reef']\n• ['concept_guaranteed_colonies']: заменяются ['concept_pc_frozen', замёрзшими мирами]§!\n\n§W•§! £planet£ §HОкеанические райские миры§! можно преобразовать в §Hкурортные миры§!, специализировав их на §Y$zone_anglers$§!, чтобы привлекать §Y$job_angler_tourist_plural_with_icon$§!."
 origin_ocean_paradise_desc:0 "С самого своего зарождения эта цивилизация наслаждалась миром и покоем в богатой ресурсами среде без естественных врагов, что позволило ей без помех расти и процветать.\n\n§WВ начале игры доступна технология§! §Y$tech_resort_colonies$§!\n§WГарантированно доступны для исследования§! §Y$tech_terrestrial_sculpting$§! §Wи§! §Y$tech_mine_rare_crystals$§!."
 origin_ocean_paradise_effects:2 "§W• $HOMEWORLD$$TABBED_NEW_LINE$• ['concept_pc_ocean'] (размер: £planetsize£ 30)$TABBED_NEW_LINE$• $PLANETARY_MODIFIERS$ ['concept_ocean_paradise_mod']$TABBED_NEW_LINE$• $PLANETARY_FEATURES$ ['concept_crystal_reef']\n• ['concept_guaranteed_colonies']: заменяются ['concept_pc_frozen', замёрзшими мирами]§!\n\n§W•§! £planet£ §HОкеанические райские миры§! можно преобразовать в §Hкурортные миры§!, специализировав их на §Y$zone_anglers$§!, чтобы привлекать §Y$job_angler_tourist_plural_with_icon$§!."
 origin_payback:0 "Расплата"
 origin_payback_desc:1 "§RВНИМАНИЕ: происхождение повышенной сложности§!\nПервый контакт этой цивилизации с инопланетным разумом окончился насильственным просвещением и порабощением её жителей. Захватчики всё же получили отпор, но надолго ли?\n\n§H$conscription_stance_3$§!: §Wполитика призыва§! §Gдоступна§!§W.§!\n\n§WОткрывает:§! режим орбитальной бомбардировки §Y«Освобождение рабов»§!."
 origin_primitive_player_pre_industrial_age:0 "Доиндустриальная эпоха"
 origin_primitive_player_pre_industrial_age_desc:0 "Эта цивилизация находится на доиндустриальной стадии развития. До выхода к звёздам ей предстоит ещё долгий путь."
 origin_primitive_player_pre_industrial_age_negative_effects:0 "Гарантирует наличие как минимум одного ['concept_advanced_empires', развитого ИИ-государства]\nНедоступны стартовые технологии следующих эпох:\n• Индустриальная эпоха\n• Машинный век\n• Атомный век\n• Ранняя космическая эпоха\n• Межзвёздная эпоха"
 origin_primitive_player_industrial_age:0 "Индустриальная эпоха"
 origin_primitive_player_industrial_age_desc:0 "Эта цивилизация развилась до этапа, аналогичного ранней индустриальной эпохе. Электричество и двигатели внутреннего сгорания нашли широкое применение, а темп урбанизации резко ускорился."
 origin_primitive_player_industrial_age_negative_effects:0 "Гарантирует наличие как минимум одного ['concept_advanced_empires', развитого ИИ-государства]\nНедоступны стартовые технологии следующих эпох:\n• Машинный век\n• Атомный век\n• Ранняя космическая эпоха\n• Межзвёздная эпоха"
 origin_primitive_player_machine_age:0 "Машинный век"
 origin_primitive_player_machine_age_desc:0 "Эта цивилизация развилась до этапа, аналогичного машинному веку, который считается завершением индустриальной эпохи. Фабрики массово выпускают товары и технику, а воздушный транспорт стал обычным явлением."
 origin_primitive_player_machine_age_negative_effects:0 "Гарантирует наличие как минимум одного ['concept_advanced_empires', развитого ИИ-государства]\nНедоступны стартовые технологии следующих эпох:\n• Атомный век\n• Ранняя космическая эпоха\n• Межзвёздная эпоха"
 origin_primitive_player_atomic_age:0 "Атомный век"
 origin_primitive_player_atomic_age_desc:0 "Эта цивилизация развилась до этапа, аналогичного атомному веку. Она уже научилась использовать силу атома, но ещё не вышла в космос. Широкое распространение ядерного оружия может привести к внезапной гибели цивилизации."
 origin_primitive_player_atomic_age_negative_effects:0 "Гарантирует наличие как минимум одного ['concept_advanced_empires', развитого ИИ-государства]\nНедоступны стартовые технологии следующих эпох:\n• Ранняя космическая эпоха\n• Межзвёздная эпоха"
 origin_primitive_player_early_space_age_desc:0 "$CHALLENGING_ORIGIN$\nЭта цивилизация вошла в раннюю космическую эпоху. Вокруг её родного мира обращаются примитивные спутники, а первые пилотируемые полёты уже состоялись на низкой орбите. Скоро она будет готова покинуть свой мир."
 origin_primitive_player_early_space_age_negative_effects:0 "Гарантирует наличие как минимум одного ['concept_advanced_empires', развитого ИИ-государства]\nНедоступны стартовые £physics£ £society£ £engineering£ технологии §Hмежзвёздной эпохи§!$NEW_LINE$$HOMEWORLD$ $NEW_LINE$£planet£ §HРаздробленные национальные государства§! необходимо объединять дипломатическим путём"
 origin_primitive_player_early_space_age_negative_effects_nomad:0 "Гарантирует наличие как минимум одного ['concept_advanced_empires', развитого ИИ-государства]\nНедоступны стартовые £physics£ £society£ £engineering£ технологии §Hмежзвёздной эпохи§!$NEW_LINE$$HOMEWORLD$ $NEW_LINE$£planet£ §HРаздробленные национальные государства§! необходимо объединять дипломатическим путём\n\nКорабль-ковчег может §Rслучайным образом совершать варп-переходы§!, пока не исследованы £physics£ §Hсверхсветовые двигатели§!"
 origin_primitive_player_effect:0 "$eager_explorers_developing_hyperdrive_situation$\n\n£job_historical_curator£ §YИстории происхождения§! раскрываются по мере прохождения ситуации §H$PrimPlayer_situation$§! и после её завершения дают §Gновое происхождение§!."
 origin_primitive_player_effect_nomad:0 "Родной мир — £planet£ ['modifier:primitive_arkship_planet_modifier'] с должностями §Y$job_archaeoengineers_with_icon$§!\nГарантирует вариант исследования £society£ §H$tech_archaeostudies$§!\n\n$eager_explorers_developing_hyperdrive_situation$\n\n£job_historical_curator£ §YИстории происхождения§! раскрываются по мере прохождения ситуации §H$PrimPlayer_situation$§! и после её завершения дают §Gновое происхождение§!."
 origin_galactic_doorstep_desc:1 "В родной системе этой цивилизации находятся неактивные §Hврата§!. Что это, источник технологий или смутная угроза? $eager_explorers_origin_galactic_doorstep_effect$"
 origin_tooltip_atleast_pre_industrial_age:0 "Общество достигло как минимум §Yдоиндустриальной эпохи§!"
 eager_explorer:0 "Энергичные исследователи"
 eager_explorers_origin_galactic_doorstep_effect:0 "\n\n§WДержавы с гражданской моделью§! ['eager_explorer', «Энергичные исследователи»] §Wполучают шанс открыть§! §Y$tech_gateway_activation$§! §Wи§! §Y$tech_gateway_construction$§! §Wво время§! §H$PrimPlayer_developing_hyperdrive_situation$§!."
 primitive_arkship_planet_modifier:0 "Реликтовый корабль-ковчег"
 ocean_paradise_desc:0 "Мало какие миры могут похвастаться столь благоприятными условиями. При разумном управлении их богатых и процветающих ресурсов хватит на целую вечность.\n\n§WПосле преобразования мира в§! §H$resort_colony$§! §Wего туристическую инфраструктуру можно специализировать как§! §Y$zone_anglers$§!, §Wчтобы привлечь§! §Y$job_angler_tourist_plural_with_icon$§!."
 angler_tourist:0 "$job_angler_tourist$"
 job_angler_tourist:0 "Турист-рыболов"
 job_angler_tourist_plural:0 "Туристы-рыболовы"
 job_angler_tourist_plural_with_icon:0 "£job_angler£ $job_angler_tourist_plural$"
 job_angler_tourist_desc:0 "Редкие курортные миры с аквакультурными комплексами привлекают рыболовов со всей галактики, желающих отдохнуть у самых нетронутых и богатых рыбой водоёмов."
 mod_job_angler_tourist_add:0 "Должности туристов-рыболовов"
