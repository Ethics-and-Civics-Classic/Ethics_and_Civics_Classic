 EaC_civic_mechanic_events.103.option.civic_heroic_tales.official.a:0 "Пусть новое правление станет достойно старых легенд."
 EaC_civic_mechanic_events.103.option.civic_heroic_tales.commander.a:0 "Пусть новые победы пополнят наши легенды."
 EaC_civic_mechanic_events.103.option.civic_heroic_tales.scientist.a:0 "Пусть новые открытия переживут века."
 EaC_civic_mechanic_events.103.tooltip.leader_is_max_level:0 "§RЭтот правитель уже достиг максимального уровня навыка.§!"
 EaC_civic_mechanic_events.2000.name:1 "Анклав [mercenary_enclave_country.GetName] выплачивает дивиденды"
 EaC_civic_mechanic_events.2000.desc:1 "Уважаемый покровитель! Наши последние контракты оказались весьма прибыльными. Мы расширили гражданские операции, и несколько корпораций наняли нас для обеспечения безопасности и поддержания порядка. Во время одного из контрактов нашим оперативникам случайно попались ценные научные материалы. Мы приложили их к вашим обычным дивидендам."
 EaC_civic_mechanic_events.2005.desc:1 "Уважаемый покровитель! Дела компании идут хорошо, а доходы неуклонно растут. Вот ваши дивиденды, а вместе с ними — дополнительная партия ресурсов, взысканная с гражданского клиента, который не сумел оплатить наш счёт."
 EaC_civic_mechanic_events.2010.desc:1 "Уважаемый покровитель! Рады сообщить о рекордной прибыли за этот финансовый период. Поэтому к обычным дивидендам мы добавили щедрую премию."
 EaC_civic_mechanic_events.2015.desc:1 "Уважаемый покровитель! Наши верфи неустанно трудятся, создавая лучший флот, какой только возможно. Помимо дивидендов мы рады совершенно бесплатно передать вам флотилию новейших кораблей для испытаний и оценки. Обязательно сообщите, что вы о них думаете!"
 EaC_civic_mechanic_events.2020.desc:1 "Уважаемый покровитель! Во время последней миротворческой операции мы разгромили несколько пиратских группировок и захватили необычайно много ресурсов, технологических данных и кораблей. Большую часть добычи мы отложили для вас — сверх положенных дивидендов."
 EaC_civic_mechanic_events.2025.desc:1 "Уважаемый покровитель! Компания переживает трудные времена. Мы потеряли нескольких гражданских клиентов, а ряд других операций закончился дорогостоящими неудачами. Сейчас готовится план реструктуризации, предусматривающий повсеместное сокращение расходов и увольнение части сотрудников.\n\nБудьте уверены: мы трудились не покладая рук, чтобы выплатить ваши дивиденды, и эта полоса неудач лишь временная."
 EaC_civic_mechanic_events.2025.a:0 "Разочаровывает."
 EaC_civic_mechanic_events.2025.b:0 "Вы уволены. Обсудите выходное пособие с Советом директоров."
 EaC_civic_mechanic_events.2025.c:0 "Тогда мы поможем."
 EaC_civic_mechanic_events.2040.desc:0 "Вы хотите поделиться с нами технологиями? Ваше доверие — большая честь, дорогой покровитель. Наш отдел исследований и разработок старается держаться на самом острие прогресса, но мы просто не можем мобилизовать столько ресурсов, сколько вы. Любые переданные знания, разумеется, будут использованы для развития нашей деятельности исключительно этичным образом!"
 EaC_civic_mechanic_events.2040.a.tt:0 "Мы поделимся с этим анклавом своими §Yтехнологиями§!. Это можно делать лишь раз в §Y10 лет§!."
 EaC_civic_mechanic_events.2050.name:0 "Предложение, от которого нам не стоит отказываться"
 EaC_civic_mechanic_events.2050.desc:0 "Мы получили срочное сообщение от [mercenary_enclave_country.GetName&gen]. По их словам, им поступило от [khan_country.GetName&gen] предложение, от которого невозможно отказаться. Единственный выход — в течение двух месяцев найти другого нанимателя. Если никто не заключит с ними контракт, они поступят на службу к хану и будут вынуждены вести против нас тотальную войну."
 EaC_civic_mechanic_events.2050.a:0 "Связаться с [mercenary_enclave_country.GetName&inst]."
 EaC_civic_mechanic_events.2050.a.tt:0 "У нас есть £time£ §Y60 дней§!, чтобы решить, нанимать их или нет."
 EaC_civic_mechanic_events.2050.b:0 "Сейчас мы не можем себе этого позволить. Возможно, позже."
 EaC_civic_mechanic_events.2050.b.tt:0 "У нас есть £time£ §Y7 дней§!, чтобы решить, нанимать их или нет."
 EaC_civic_mechanic_events.2050.c:0 "Предатели! Их жадность их же и погубит."
 EaC_civic_mechanic_events.2.desc:2 "Мы обсуждаем возможность помочь флотилии [fleet.GetName] стать независимым §Yпиратским анклавом§!. Инициатива исходит от её командира и означает, что мы потеряем непосредственный контроль над флотилией. Кроме того, нам придётся вложить значительные средства в виде §Yэнергокредитов§! и §Yсплавов§!. Взамен пиратский капитан анклава поклянётся нам в верности, а мы получим периодические дивиденды и особые привилегии.\n\nНас заверяют, что в трудную минуту эти пираты всегда будут готовы сражаться за нас. И за нашу казну."
 EaC_civic_mechanic_events.2.desc.criminal_heritage:2 "Мы обсуждаем возможность помочь флотилии [fleet.GetName] стать независимым §Yпиратским анклавом§!. Инициатива исходит от её командира и означает, что мы потеряем непосредственный контроль над флотилией. Кроме того, нам придётся вложить значительные средства в виде §Yэнергокредитов§! и §Yсплавов§!. Взамен пиратский капитан анклава поклянётся нам в верности, а мы получим периодические дивиденды и особые привилегии.\n\nНас заверяют, что в трудную минуту эти пираты всегда будут готовы сражаться за нас. И за нашу казну."
 EaC_civic_mechanic_events.2.a.criminal_heritage:0 "Выгодная бизнес-модель: «платная защита»."
 EaC_civic_mechanic_events.2.a.vassal.tooltip:0 "Будет создан §Yвассальный пиратский анклав§!, благодаря которому §Hпреступные должности§! в системе вместо обычного эффекта будут §Gприносить небольшое количество§! £trade_value£."
 EaC_civic_mechanic_events.2.a.tooltip:0 "Будет создан §Yпиратский анклав§!, благодаря которому §Hпреступные должности§! в системе вместо обычного эффекта будут §Gприносить небольшое количество§! £trade_value£."
 EaC_civic_mechanic_events.25:0 "Пиратский анклав уничтожен"
 EaC_civic_mechanic_events.25.desc:1 "Наша флотилия прорвала оборону пиратов в [merc_system.GetName&prep] и разнесла их станцию на куски. После этого остатки [FROM.GetName&gen] быстро рассеялись, а уцелевшие флотилии распались. Многие пережившие разгром капитаны наверняка вернутся к менее организованному пиратству, но некоторые заявили, что продолжат выполнять небольшие наёмнические контракты, оказывая логистическую поддержку или усиливая гарнизоны космических баз. Однако подобные мелочи несущественны. Главное — Пиратского анклава больше нет, а из его обломков нам удалось извлечь значительное количество ресурсов."
 EaC_civic_mechanic_events.26.desc:1 "До нас дошла весть, что в [merc_system.GetName&prep] государство [mercenary_destroyer.GetName] уничтожило Пиратский анклав. Нападавшие оказались слишком сильны, чтобы анклав [FROM.GetName] мог справиться с ними самостоятельно, и станция, где находились совет, казармы и верфи, была разрушена. Вскоре распалась и каперская флотилия: каждый капитан остался сам за себя. Тем не менее некоторые представители заявили, что по мере сил продолжат выполнять договоры компании в сфере логистики и гарнизонной службы на космических базах, несмотря на ликвидацию Пиратской бухты."
 EaC_civic_mechanic_events.26.a:0 "Они за это заплатят."
 EaC_civic_mechanic_events.27:0 "Экстренный отзыв флотилии"
 EaC_civic_mechanic_events.27.desc:0 "Эй, сухопутная крыса!\n\nНа нашу бухту напали, а пират прежде всего верен самому себе! Семь футов под килем: наша флотилия покинет вашу службу, как только это послание дойдёт до вас. Когда разберёмся с этой заварухой, сможем снова заключить договор о защите."
 EaC_civic_mechanic_events.27.a:0 "Удачи вам."
 EaC_civic_mechanic_events.27.b:0 "Это возмутительно! Вероломные пираты!"
 EaC_civic_mechanic_events.28:0 "Мирная сделка"
 EaC_civic_mechanic_events.28.desc:0 "Эй, [Root.GetName]! Прошёл год с вашей последней выходки. Мы, [mercenary_enclave_country.GetName], готовы забыть былое — в конце концов, без добычи нет платы, но между добрыми товарищами так дела не ведут... верно, [ROOT.GetRulerTitle] [ROOT.GetLeaderName]? Если вы всего лишь принесёте извинения и пришлёте нам небольшой сундук в знак доброй воли, мы готовы закрыть глаза на это мошенничество."
 EaC_civic_mechanic_events.28.a:0 "Сдохните и сгнивайте, пиратское отребье."
 EaC_civic_mechanic_events.28.b:0 "Хорошо."
 EaC_civic_mechanic_events.205.name:0 "[mercenary_enclave_country.GetName]"
 EaC_civic_mechanic_events.205.desc:1 "Добро пожаловать, братцы! [mercenary_enclave_country.GetName] предлагает клиентам каперские услуги, в том числе товары с чёрного рынка.\n\nА для особенно любимых клиентов у нас есть флотилии, армии, военные советники... За скромный сундук монет, конечно."
 EaC_civic_mechanic_events.205.desc.hostile:0 "А, сухопутная крыса вернулась.\n\nНу что, наконец образумились, прохвосты? Мы пощады не просим и не даём. Небольшой знак доброй воли да скромная сумма из вашей казны — и пиратский капитан [mercenary_enclave_country.GetName] согласится забыть эту пакость. Давайте лучше вместе смотреть в прибыльное каперское будущее."
 EaC_civic_mechanic_events.205.a:1 "Мы хотим §Yарендовать каперскую флотилию§!."
 EaC_civic_mechanic_events.205.tooltip.a:1 "[current_client.GetName] уже арендует нашу каперскую флотилию."
 EaC_civic_mechanic_events.205.tooltip.b:0 "Свободной каперской флотилии для аренды нет."
 EaC_civic_mechanic_events.205.b:1 "Мы хотим §Yуправлять§! арендованной каперской флотилией."
 EaC_civic_mechanic_events.205.c:1 "Нас интересует создание §Yпиратских гарнизонов§!."
 EaC_civic_mechanic_events.205.d:1 "Мы хотим помочь вам выставить §Yболее крупную каперскую флотилию§!."
 EaC_civic_mechanic_events.205.d.timeout:0 "Анклав набирает новых офицеров и экипажи. Следующее логистическое расширение будет доступно после §Y[mercenary_enclave_country.upgraded_station_timer]§!."
 EaC_civic_mechanic_events.205.e:1 "Нам нужны §Yтактические сведения§! о грозных противниках."
 EaC_civic_mechanic_events.205.f:1 "Мы хотим нанять §Yназемные войска§!."
 EaC_civic_mechanic_events.205.g:1 "Какие §Yлогистические решения§! вы можете предложить?"
 EaC_civic_mechanic_events.205.g.tooltip:1 "Мы уже получаем §Yлогистическую поддержку§!."
 EaC_civic_mechanic_events.205.h:2 "Как ваш §Yпокровитель§!, я хочу, чтобы вы ещё раз рассмотрели свои возможности."
 EaC_civic_mechanic_events.205.i:0 "Пусть будет так."
 EaC_civic_mechanic_events.205.j:2 "Я ваш §YПиратский лорд§!, и вы обязаны выполнять мои требования."
 EaC_civic_mechanic_events.205.k:2 "Сообщите капитану: прибыл §Y[ROOT.GetRulerTitle]§!."
 EaC_civic_mechanic_events.210.desc:0 "Отлично! Нанять каперскую флотилию [mercenary_enclave_country.GetName&gen] — верное решение. Наши силы — одни из самых обученных и дисциплинированных в галактике, а технологии не уступают лучшим образцам. Пираты, мятежники и любое другое отребье, с которым вам придётся иметь дело, скоро научатся проявлять уважение.\n\nКроме того, каждая наша флотилия совершенно бесплатно получает закалённого в боях командующего. Он владеет всеми тонкостями межзвёздной войны и непременно приведёт ваши силы к победе."
 EaC_civic_mechanic_events.211.desc:0 "Уверены, вы найдёте своим новым каперам достойное применение, и соперники вскоре научатся бояться вашего государства!"
 EaC_civic_mechanic_events.215.desc:1 "Нет добычи — нет платы.\n\nНаши каперы уже рвутся в новый рейд. Если хотите продолжить партнёрство, капитан готов к переговорам."
 EaC_civic_mechanic_events.215.a:0 "Мы хотели бы обсудить другой вопрос."
 EaC_civic_mechanic_events.215.b:0 "Мы хотим продлить наше партнёрство."
 EaC_civic_mechanic_events.215.c:0 "Мы хотим прекратить наше партнёрство."
 EaC_civic_mechanic_events.220.desc:0 "Нанятые у [mercenary_enclave_country.GetName&gen] каперские гарнизоны превосходно расправляются с несанкционированными пиратскими сетями. У них, так сказать, есть нужный вес. Прибыв на место, специалисты возьмутся муштровать персонал станции и доведут его подготовку до предела.\n\nВ [mercenary_enclave_country.GetName&prep] готовят только лучших блюстителей порядка."
 EaC_civic_mechanic_events.225.desc:0 "Военная добыча приносит прибыль. Дайте знать, когда снова захотите нанять наших каперов для рейда."
 EaC_civic_mechanic_events.235.1.desc:0 "На эти средства мы сможем значительно расширить дело: больше кораблей, больше экипажей, крупнее и лучше учебные центры — и, конечно же, больше грога!"
 EaC_civic_mechanic_events.235.2.desc:0 "В постоянно меняющейся и безжалостной галактике проблема пиратства важнее некуда. Ваше пожертвование позволит нам расширить операции и перечень услуг — разумеется, не трогая наших славных сухопутных друзей!"
 EaC_civic_mechanic_events.235.3.desc:0 "Только представьте: [mercenary_enclave_country.GetName] проводит рейды по всей галактике против гражданских и военных структур, которым пора слегка подрезать крылья... А вы получаете невиданный прежде уровень безопасности..."
 EaC_civic_mechanic_events.235.4.desc:1 "Когда всё это начиналось, у Пиратского лорда была мечта: направить пиратство в продуктивное русло. Сегодня я с радостью могу сказать — эта цель почти достигнута."
 EaC_civic_mechanic_events.235.5.desc:0 "Мы выставим САМУЮ БОЛЬШУЮ флотилию в галактике! Сундуки будут ломиться от добычи. Государства станут драться за нашу защиту... Ох, видеть бы лицо Пиратского лорда, когда я сообщу ему эту новость!"
 EaC_civic_mechanic_events.240.desc:0 "Да, времена и правда тревожные. Наши контрабандисты сильно рисковали, наблюдая за появлением новых угроз, и теперь могут предоставить полезные разведданные о..."
 EaC_civic_mechanic_events.240.a:0 "Великий хан."
 EaC_civic_mechanic_events.240.b:0 "Серая буря"
 EaC_civic_mechanic_events.240.c:0 "Преторианский рой"
 EaC_civic_mechanic_events.240.d:0 "Захватчики из другого измерения"
 EaC_civic_mechanic_events.240.e:0 "ИИ Контингенции"
 EaC_civic_mechanic_events.240.f:0 "Сетана"
 EaC_civic_mechanic_events.245.desc:0 "Корабли хана хорошо сбалансированы и не имеют очевидной слабости. По словам наших контрабандистов, против них неплохо должны работать торпеды, но чрезмерно специализировать защиту не стоит. Лучший шанс сохранить корабли — сочетать щиты и броню. Хан уже проявил себя как чрезвычайно умелый командующий, и недооценивать его было бы ужасной ошибкой. Его свиту следует считать крайне опасной целью."
 EaC_civic_mechanic_events.250.desc:0 "Серая буря полагается на два взаимодополняющих вида оружия: энергетические лучи и штурмовики. От первых хорошо защищают щиты, но штурмовики способны их обходить. Наши расчёты показывают, что корабли со щитами и системами ПВО имеют значительно больше шансов пережить столкновение. Нанитовые корабли очень хорошо защищены, однако торпеды могут помочь пробить их оборону."
 EaC_civic_mechanic_events.255.desc:0 "Флотилии преторианцев используют медленные снаряды и рои малых кораблей, чтобы уничтожать противника. Один вариант защиты — сочетать ПВО с бронёй и повышенной прочностью корпуса; другой — вступать в бой с предельной дистанции. Достаточно мощное энергетическое оружие позволит уничтожать их флотилии ещё до того, как они успеют приблизиться."
 EaC_civic_mechanic_events.260.desc:0 "Полная зависимость Незваных от энергетических технологий даёт нам очевидную слабость, которой можно воспользоваться. Оружие с повышенным уроном по щитам должно быть особенно эффективно, а системы, полностью игнорирующие щиты, быстро отправят их обратно из нашего измерения. Для собственной защиты лучше использовать щиты, способные противостоять их энергетическим лучам."
 EaC_civic_mechanic_events.265.desc:0 "Корабли Контингенции используют исключительно энергетическое оружие, поэтому входящий урон лучше всего сдерживать щитами. Моделирование показывает, что при мощной защите их корпуса сравнительно хрупки. По оценке наших контрабандистов, пробивающее оружие должно показать себя особенно хорошо."
 EaC_civic_mechanic_events.266.desc:0 "Корабли Сетаны полагаются на дальнобойное энергетическое оружие с высоким уроном и прочную регенерирующую броню. Они особенно эффективны против крупных целей, поэтому лучше изматывать их роями малых кораблей. Торпеды и энергетическое оружие должны неплохо работать против её флотов, а щиты помогут нашим кораблям продержаться чуть дольше."
 EaC_civic_mechanic_events.270.desc:0 "Нужно усмирить колонию или выбить особо важные цели? Наши планетарные каперские службы предлагают подразделения обученных пиратов, готовых действовать в сложной обстановке и при высоком риске."
 EaC_civic_mechanic_events.270.a:0 "Небольшой отряд каперов."
 EaC_civic_mechanic_events.270.b:0 "Небольшой отряд элитных механизированных каперов."
 EaC_civic_mechanic_events.270.c:0 "Крупный отряд каперов."
 EaC_civic_mechanic_events.270.d:0 "Ударная группа элитных механизированных каперов."
 EaC_civic_mechanic_events.270.e:0 "Большой взвод каперов."
 EaC_civic_mechanic_events.280.a.desc:1 "Уважаемый покровитель! Какими судьбами? Уже видели наши новые проекты кораблей? Они станут основой нового предложения «Каперская безопасность» для гражданских клиентов."
 EaC_civic_mechanic_events.280.b.desc:0 "Как приятно вас видеть! Мы приготовили лёгкие угощения — можете попробовать, пока мы вызываем капитана."
 EaC_civic_mechanic_events.280.c.desc:0 "Мы всегда рады встрече с нашим покровителем. Не сомневайтесь: следующая партия дивидендов скоро прибудет. А пока не хотите ли оценить наш новый набор услуг по защите в особо опасных ситуациях? Думаем, гражданские клиенты будут в восторге!"
 EaC_civic_mechanic_events.280.d.desc:0 "Как приятно вас видеть, [ROOT.GetRulerTitle] [ROOT.GetLeaderName]! Мы приготовили лёгкие угощения — можете попробовать, пока мы вызываем местного пиратского капитана.\n\n§WВерность капитана [ROOT.GetName&dat]§!: §Gвысокая§!."
 EaC_civic_mechanic_events.280.e.desc:0 "Как приятно вас видеть, [ROOT.GetRulerTitle] [ROOT.GetLeaderName]! Мы приготовили лёгкие угощения — можете попробовать, пока мы вызываем местного пиратского капитана.\n\n§WОтношение капитана к [ROOT.GetName&dat]§!: §lдоверительное§!."
 EaC_civic_mechanic_events.280.f.desc:0 "Как приятно вас видеть, [ROOT.GetRulerTitle] [ROOT.GetLeaderName]! Мы приготовили лёгкие угощения — можете попробовать, пока мы вызываем местного пиратского капитана.\n\n§WОтношение капитана к [ROOT.GetName&dat]§!: §Pнедоверчивое§!."
 EaC_civic_mechanic_events.280.g.desc:0 "Как приятно вас видеть, [ROOT.GetRulerTitle] [ROOT.GetLeaderName]! Мы приготовили лёгкие угощения — можете попробовать, пока мы вызываем местного пиратского капитана.\n\n§WОтношение капитана к [ROOT.GetName&dat]§!: §Rпредательское§!."
 EaC_civic_mechanic_events.280.b:1 "Мы хотим, чтобы вы §Yотозвали§! свою флотилию."
 EaC_civic_mechanic_events.280.c:0 "Мы готовы поделиться с вами §Yтехнологиями§!."
 EaC_civic_mechanic_events.280.c.timeout:0 "Анклав всё ещё внедряет наши технологии. Следующий обмен технологиями будет возможен после §Y[mercenary_enclave_country.updating_databanks_timer]§!."
 EaC_civic_mechanic_events.285.desc:2 "Вы, конечно, понимаете, что отзыв флотилии — дело деликатное. Во всех стандартных договорах у нас предусмотрены необходимые лазейки, но на возвращение флота уйдёт не меньше шести месяцев, а нынешним клиентам придётся выплатить... щедрую компенсацию, чтобы они не слишком расстроились.\n\nМы не считаем этот шаг полезным для нашей организации, но вы наш покровитель — если настаиваете, мы всё устроим."
 EaC_civic_mechanic_events.285.tooltip:0 "Это вызовет недовольство пиратского анклава."
 EaC_civic_mechanic_events.290.name:1 "Затребованная флотилия прибыла"
 EaC_civic_mechanic_events.290.desc:1 "Каперская флотилия, которую мы затребовали у нашего анклава, прибыла и ожидает приказов."
 EaC_civic_mechanic_events.294.name:1 "Уведомление о расторжении договора"
 EaC_civic_mechanic_events.294.desc:1 "Дорогая сухопутная крыса!\n\nСогласно пункту 285b.15 нашего договора, мы вынуждены досрочно прекратить соглашение и отозвать каперскую флотилию, которую вы у нас арендовали. В соответствии с условиями контракта это уведомление служит трёхмесячным предупреждением: по истечении срока флотилия покинет вашу службу. Мы прилагаем щедрую компенсацию, которая вам полагается.\n\nПриносим извинения за неудобства и желаем удачи во всех будущих начинаниях."
 EaC_civic_mechanic_events.294.b:1 "Нам были нужны эти корабли!"
 EaC_civic_mechanic_events.2030.desc:1 "Наша служба логистической поддержки поможет развернуть ваши флотилии в самых дальних уголках галактики. Наши специалисты проследят, чтобы корабли получили всё необходимое — от боеприпасов и продовольствия до последнего болта в терморегуляторе. Мы также заранее создадим склады снабжения по маршруту флота или заключим договоры на поставки с местными гражданскими компаниями. Ваши корабли заслуживают лучшего обслуживания, и мы готовы его обеспечить."
 EaC_civic_mechanic_events.2035.name:0 "Истекает договор на логистическую поддержку"
 EaC_civic_mechanic_events.2035.desc:1 "Дорогая сухопутная крыса!\n\nСрок действия договора на логистическую поддержку подходит к концу. Согласно его условиям, если мы не получим от вас иных распоряжений, услуга будет автоматически продлена, а счёт выставлен в обычном порядке.\n\nНадеемся, вы довольны нашей работой. Будем рады дальнейшему сотрудничеству!"
 EaC_civic_mechanic_events.2035.a:0 "Сейчас эта услуга нам не нужна."
 EaC_civic_mechanic_events.2060.name:0 "Срок аренды флотилии истёк"
 EaC_civic_mechanic_events.2060.desc:0 "Наш договор с [mercenary_enclave_country.GetName&inst] завершён, и их флотилия готовится покинуть нашу службу. Связаться с ними и предложить продление?"
 EaC_civic_mechanic_events.2060.a:0 "Не сейчас."
 EaC_civic_mechanic_events.2060.b:0 "Да, установить связь."
 EaC_operation_establish_underground_railroad:0 "Создать Подземную железную дорогу"
 EaC_operation.1000.desc:1 "Наши оперативники завершили создание сети убежищ в пределах [FROM.GetName&gen] и передали досье с их местоположением."
 EaC_operation.1000.a:0 "Путь к свободе проложен."
 EaC_planet_general_strike_flag_tooltip:0 "§RЭтот выбор приведёт к§! §Yвсеобщей забастовке§!§R!§!"
 EaC_civic_mechanic_events.1.name:1 "Рост безработицы на [Root.GetName&prep]"
 EaC_civic_mechanic_events.1.desc:0 "Безработица и нищета на §H[Root.GetName&prep]§! распространяются с пугающей скоростью. Разочарованные жители начали §Rобъединяться в рабочие организации§!, надеясь добиться расширения своих прав в этот хаотичный период. Их представители утверждают, что тяжёлые материальные условия сами по себе подпитывают преступность и что бороться с преступлениями, вызванными бедностью, можно лишь обеспечив населению основные жизненные потребности.\n\nНо бедственным положением стремятся воспользоваться и куда более опасные силы. Местные §Rпреступные организации§! получили и множество лёгких жертв, и поток отчаявшихся новобранцев.\n\nВ качестве временной меры мы можем увеличить пособия по безработице на этом мире. Это обойдётся недёшево, но даст время найти более устойчивое решение: создать новые рабочие места или повысить уровень жизни пострадавших групп населения.\n\nМожно и не вмешиваться, но тогда на [Root.GetName&prep] почти наверняка сформируется крупный преступный мир."
 EaC_civic_mechanic_events.1.a:0 "Увеличить пособия."
 EaC_civic_mechanic_events.1.b:0 "Недовольные рабочие и горстка преступников не стоят нашего внимания."
 EaC_civic_mechanic_events.2.name:0 "Подкупленные чиновники на [Root.GetName&prep]"
 EaC_civic_mechanic_events.2.desc.has_authoritarian_ethic:0 "Недавно выяснилось, что многие чиновники на §H[Root.GetName&prep]§! были подкуплены. Местные преступные организации платили им за то, чтобы те закрывали глаза на незаконную деятельность. В некоторых случаях выяснилось, что сами чиновники состояли в тех самых организациях, с которыми должны были бороться!\n\nНесколько чиновников уже арестованы, однако часть остальных покинула свои посты, как только поняла, что их раскрыли. Похоже, коррупция на [Root.GetName&prep] пустила глубокие корни.\n\nНа фоне этого хаоса организованное рабочее движение решило воспользоваться ситуацией. После безрассудного сговора чиновников с преступниками его лидеры требуют смены руководства и устранения социально-экономических причин, подпитывающих преступность.\n\nБудем надеяться, что у этих радикалов не появится ещё более опасных идей..."
 EaC_civic_mechanic_events.2.desc.not_authoritarian_ethic:0 "Недавно выяснилось, что многие чиновники на §H[Root.GetName&prep]§! были подкуплены. Местные преступные организации платили им за то, чтобы те закрывали глаза на незаконную деятельность. В некоторых случаях выяснилось, что сами чиновники состояли в тех самых организациях, с которыми должны были бороться!\n\nНесколько чиновников уже арестованы, однако часть остальных покинула свои посты, как только поняла, что их раскрыли. Похоже, коррупция на [Root.GetName&prep] пустила глубокие корни.\n\nНа фоне этого хаоса лидеры рабочих выступили с резкой критикой происходящего. После безрассудного сговора чиновников с преступниками они требуют смены руководства и устранения социально-экономических причин, подпитывающих преступность."
 EaC_civic_mechanic_events.2.a:0 "С этим нужно разобраться."
 EaC_civic_mechanic_events.2.b:0 "С этим нужно разобраться. По-нашему."
 EaC_civic_mechanic_events.2.c:0 "Может, стоит выслушать лидеров рабочих?"
 EaC_civic_mechanic_events.3.desc.has_private_healthcare:0 "Вслед за ростом преступности на §H[Root.GetName&prep]§! резко выросло и употребление наркотиков. Незаконные вещества давно перестали быть уделом местного преступного мира и теперь проникли во все слои общества.\n\nРабочие организации требуют перевести здравоохранение в государственный сектор, чтобы жертвы зависимости могли получать помощь независимо от толщины кошелька."
 EaC_civic_mechanic_events.3.desc.has_public_healthcare:0 "Вслед за ростом преступности на §H[Root.GetName&prep]§! резко выросло и употребление наркотиков. Незаконные вещества давно перестали быть уделом местного преступного мира и теперь проникли во все слои общества.\n\nРабочие организации поддерживают государственную систему здравоохранения: она позволяет жертвам зависимости получать помощь, не опасаясь разорительных счетов за лечение."
 EaC_civic_mechanic_events.3.a:0 "Тревожные новости."
 EaC_civic_mechanic_events.3.a.has_public_healthcare:0 "Тревожные новости, но мы делаем всё возможное."
 EaC_civic_mechanic_events.3.b.has_private_healthcare:0 "Бесплатное здравоохранение? И как же на этом зарабатывать?"
 EaC_civic_mechanic_events.3.c.not_public_healthcare:0 "Перейдём к государственному здравоохранению и успокоим этих радикалов."
 EaC_civic_mechanic_events.4.name:0 "Столкновения силовиков с бастующими на [Root.GetName&prep]"
 EaC_civic_mechanic_events.4.desc.not_anticrime_campaign:0 "Ожесточённые столкновения между силовиками и бастующими на §H[Root.GetName&prep]§! обернулись серьёзными разрушениями. Всё началось после того, как планетарные власти усилили борьбу с несанкционированными забастовками.\n\nНе сумев быстро подавить протесты, силовики подготовили кампанию против преступности и предлагают применить её методы к бастующим. Представители рабочего движения отвечают, что такие меры нарушают право на свободу слова и коллективные переговоры."
 EaC_civic_mechanic_events.4.desc.has_anticrime_campaign:0 "Ожесточённые столкновения между вооружёнными по-военному силовиками и бастующими на §H[Root.GetName&prep]§! обернулись серьёзными разрушениями. Всё началось после того, как планетарные власти усилили борьбу с несанкционированными забастовками.\n\nПротесты всё ещё не подавлены, но силовики настаивают: кампания против преступности сработает, если применить ещё больше силы. Представители рабочего движения отвечают, что репрессии лишь усугубляют положение: жители борются за свободу слова и право на коллективные переговоры."
 EaC_civic_mechanic_events.4.not_anticrime_campaign.a:0 "Ситуация выходит из-под контроля! Немедленно ускорить реализацию плана силовиков!"
 EaC_civic_mechanic_events.4.not_anticrime_campaign.b:0 "Ситуация выходит из-под контроля — и виноваты в этом силовики!"
 EaC_civic_mechanic_events.4.has_anticrime_campaign.c:0 "Как и говорил начальник, рано или поздно всё наладится... рано или поздно."
 EaC_civic_mechanic_events.4.has_anticrime_campaign.d:0 "План силовиков лишь ухудшает положение. Прекратить эту кампанию!"
 EaC_civic_mechanic_events.5.name:0 "Сообщения о Подземной железной дороге на [Root.GetName&prep]"
 EaC_civic_mechanic_events.5.desc:0 "В последнее время на §H[Root.GetName&prep]§! заметно активизировалось движение за освобождение рабов. Считается, что на поверхности мира действует несколько «серых портов» — нелегальных космопортов, через которые контрабандисты вывозят рабов на свободу.\n\nМестные власти пытаются найти эти порты, но пока поиски безуспешны, беглецы будут и дальше покидать мир, а целые группы рабов — исчезать.\n\nСохранение рабовладельческой экономики требует всё более кровавых репрессий. Хотя… если отменить рабство, дорогостоящий аппарат принуждения можно будет резко сократить."
 EaC_civic_mechanic_events.5.a:0 "Наши силовики покончат с этой Подземной железной дорогой!"
 EaC_civic_mechanic_events.5.b:0 "Удерживать рабов больше не стоит таких усилий. Мы покончим с рабством."
 EaC_civic_mechanic_events.6.name:0 "Беглые рабы на [Root.GetName&prep]"
 EaC_civic_mechanic_events.6.desc:0 "В последнее время на §H[Root.GetName&prep]§! участились операции контрабандистов по освобождению рабов. Местная кампания против работорговли набирает силу: теперь беглецов выводят даже из жилых районов, которые прежде считались недосягаемыми для Подземной железной дороги."
 EaC_civic_mechanic_events.6.a:0 "С побегами рабов нужно разобраться."
 EaC_civic_mechanic_events.6.b:0 "Эту проблему можно решить, начав путь к отмене рабства."
 EaC_civic_mechanic_events.7.name:0 "Беглые рабы захвачены на [Root.GetName&prep]"
 EaC_civic_mechanic_events.7.desc:0 "Получив анонимную наводку, силовики на §H[Root.GetName&prep]§! недавно штурмовали большой склад на окраине местной столицы. Внутри без сомнения находился перевалочный пункт Подземной железной дороги: запасы еды и воды, постельные принадлежности и скрывавшиеся рабы. Несколько участников сети арестованы, а задержанные рабы помещены в государственные криохранилища для дальнейшего использования."
 EaC_civic_mechanic_events.7.a:0 "Чего бы это ни стоило, мы сохраним наш экономический уклад!"
 EaC_civic_mechanic_events.7.b:0 "Разморозить криокапсулы. Первый шаг к окончательной отмене рабства сделан."
 EaC_civic_mechanic_events.8.name:0 "Освободитель рабов арестован на [Root.GetName&prep]"
 EaC_civic_mechanic_events.8.desc:0 "Недавно силовики провели спецоперацию и задержали одного из ключевых проводников Подземной железной дороги на §H[Root.GetName&prep]§!. Потеря лидера серьёзно подорвала одну из местных сетей, и число исчезающих групп рабов заметно сократилось.\n\nНа допросе проводник сказал: «Если вы убьёте меня, ничего не закончится. Я всего лишь симптом рабства — опухоль на теле государства, которая говорит: внутри что-то прогнило. Симптомы не исчезнут, пока не будет устранена сама болезнь»."
 EaC_civic_mechanic_events.8.a:0 "Именно поэтому мы подавляем силой любые «нежелательные» симптомы."
 EaC_civic_mechanic_events.8.b:0 "В его словах есть правда. Остановить это сможет лишь отмена рабства."
 EaC_civic_mechanic_events.9.a.tooltip:0 "Наша колония выделит охраняемую зону для предразумных."
 EaC_civic_mechanic_events.9.b.tooltip:0 "После возвышения общество предразумных получит во владение §Y[ROOT.GetName&acc]§!"
 EaC_civic_mechanic_events.40.name:0 "Всеобщая забастовка на [Root.GetName&prep]"
 EaC_civic_mechanic_events.40.desc:0 "Трудовой конфликт на §H[Root.GetName&prep]§! лишь обостряется. Местное рабочее движение окрепло и прочно укоренилось: одни районы погрузились в беззаконие, а другие превратились в автономные рабочие коммуны."
 EaC_civic_mechanic_events.40.a:0 "Это недопустимо."
 EaC_civic_mechanic_events.41.name:1 "Порядок восстановлен на [Root.GetName&prep]"
 EaC_civic_mechanic_events.41.desc.has_ethic_libertarian.has_ethic_cooperative.has_slaves:0 "После заметного роста стабильности на §H[Root.GetName&prep]§! всеобщая забастовка утратила поддержку: население снова чувствует себя материально защищённым."
 EaC_civic_mechanic_events.41.desc.has_ethic_libertarian.has_ethic_cooperative.no_slaves:0 "После заметного роста стабильности на §H[Root.GetName&prep]§! всеобщая забастовка утратила поддержку: население снова чувствует себя материально защищённым."
 EaC_civic_mechanic_events.41.desc.no_ethic_libertarian.no_ethic_cooperative.no_slaves:0 "После заметного роста стабильности на §H[Root.GetName&prep]§! некогда влиятельное рабочее движение практически исчезло. Население успокоилось и, похоже, вполне довольно нынешним положением."
 EaC_civic_mechanic_events.100.name:0 "Восстание рабов на [Root.GetName&prep]"
 EaC_civic_mechanic_events.100.desc:0 "Восстание рабов на §H[Root.GetName&prep]§! должно было подать пример рабам соседних миров, и теперь борьба достигла критической точки. На улицах и в переулках по всему миру идут ожесточённые бои, быстро перекидывающиеся на жилые районы.\n\nМестные силы безопасности пытаются сдержать насилие, но масштаб столкновений оказался им не по силам."
 EaC_civic_mechanic_events.100.a:0 "Здесь настоящая зона боевых действий!"
 EaC_civic_mechanic_events.101.name:0 "Восстание рабов на [Root.GetName&prep]!"
 EaC_civic_mechanic_events.101.desc:0 "Одно из сообществ рабов на §H[Root.GetName&prep]§! недавно провело согласованную атаку на силы правопорядка по всему миру. В назначенный час рабы устроили засады на патрули и полностью захватили несколько полицейских участков. В ожесточённых боях погибли тысячи.\n\nОставшиеся силы безопасности пытаются вернуть контроль, но многие районы пока погружены в полное беззаконие."
 EaC_civic_mechanic_events.101.tooltip:0 "§HПоселение силовиков на [Root.GetName&prep]:§! погибает"
 EaC_civic_mechanic_events.102.name:0 "Восстание рабов на [Root.GetName&prep] выходит в космос"
 EaC_civic_mechanic_events.102.desc:1 "Жестокое восстание рабов на §H[Root.GetName&prep]§! перекинулось на остальную часть системы [Root.solar_system.GetName]. Вооружённые гражданские корабли, присоединившиеся к мятежу, уже несколько раз вступали в бой и теперь нападают на прибывающие торговые суда, пытаясь ещё сильнее дестабилизировать систему."
 EaC_civic_mechanic_events.102.tooltip:0 "§RВ системе [Root.solar_system.GetName] появилась враждебная флотилия!§!"
 EaC_civic_mechanic_events.103.name:0 "Освобождение рабов на [Root.GetName&prep]"
 EaC_civic_mechanic_events.103.desc:0 "Восставшие рабы на §H[Root.GetName&prep]§! нанесли удар по одному из крупнейших городов мира, стремясь освободить тех, кого по-прежнему держат в неволе и вынуждают жить в бесчеловечных условиях.\n\nСилы безопасности не справились с натиском, и борцам за свободу удалось освободить несколько групп рабов и вывезти их с планеты."
 EaC_civic_mechanic_events.103.tooltip:0 "§H3§! §Yпорабощённых поселения§! §Hна [Root.GetName&prep]:§! сбегут в другое государство."
 EaC_civic_mechanic_events.104.name:0 "Торговцы обходят зону столкновений стороной"
 EaC_civic_mechanic_events.104.desc:0 "Продолжающаяся борьба с восстанием рабов на §H[Root.GetName&prep]§! серьёзно ударила по местной торговле. Из-за нестабильности несколько межзвёздных гильдий работорговцев посоветовали торговцам держаться подальше от этого мира. Зато нелегальная торговля оружием, похоже, переживает настоящий расцвет."
 EaC_civic_mechanic_events.200.name:0 "Подземная железная дорога расширяется на [Root.GetName&prep]"
 EaC_civic_mechanic_events.200.desc:0 "По мере падения стабильности на §H[Root.GetName&prep]§! освободители рабов действуют всё смелее. Теперь на планету контрабандой ввозят наркотики со всего известного космоса.\n\nОни широко распространились среди населения и серьёзно снижают общую производительность."
 EaC_civic_mechanic_events.200.a:0 "Ничего хорошего."
 EaC_civic_mechanic_events.201.name:0 "Беглые рабы покидают [Root.GetName]"
 EaC_civic_mechanic_events.201.desc:0 "Контрабандисты на §H[Root.GetName&prep]§! создали сеть тайных маршрутов и убежищ, которую здесь называют Подземной железной дорогой. Последняя группа беглецов ушла далеко за пределы наших владений и добралась до другого государства.\n\nМестные власти пытаются остановить распространение антирабовладельческих идей, однако всё больше неопознанных кораблей прибывает на планету и покидает её."
 EaC_civic_mechanic_events.201.tooltip:0 "§H4§! §Yпорабощённых поселения§! §Hна [Root.GetName&prep]:§! сбегут в другое государство."
 EaC_civic_mechanic_events.202.name:0 "Восстание рабов на [Root.GetName&prep]"
 EaC_civic_mechanic_events.202.desc:0 "Силовики проводят облавы на убежища Подземной железной дороги на §H[Root.GetName&prep]§!. Недавние столкновения с применением тяжёлого армейского оружия привели к серьёзным разрушениям и множеству жертв, среди которых оказалось немало предателей и сочувствующих рабам. Похоже, рабов тайно вывозят с планеты, а оружие для побегов столь же тайно ввозят обратно."
 EaC_civic_mechanic_events.203.name:0 "Судно освободителей рабов разбилось на [Root.GetName&prep]"
 EaC_civic_mechanic_events.203.desc:0 "Недавно крупному гражданскому грузовому судну отказали во входе в атмосферу §H[Root.GetName&gen]§!: в дополнительном грузовом отсеке обнаружили беглых рабов. Судну приказали остановиться для досмотра, но одержимый свободой капитан вместо этого попытался на полном ходу прорваться через орбитальную блокаду и сесть на планету.\n\nВо время снижения судно попало под огонь наземных сил безопасности и рухнуло в густонаселённый городской район. На земле выжили немногие."
 EaC_civic_mechanic_events.203.a:0 "Это катастрофа!"
 EaC_civic_mechanic_events.204.name:0 "Наркоторговля продолжается на [Root.GetName&prep]"
 EaC_civic_mechanic_events.204.desc:0 "Незаконная торговля наркотиками на §H[Root.GetName&prep]§! не ослабевает. Недавно выяснилось, что контрабандисты каким-то образом похитили с одного из наших орбитальных складов экзотические газы с известными психоактивными свойствами. Затем вещества передали дилерам и распродали на местных улицах."
 EaC_civic_mechanic_events.204.a:0 "Нельзя позволять этому продолжаться!"
 EaC_civic_mechanic_events.300.name:0 "Рабочие коммуны"
 EaC_civic_mechanic_events.300.desc:0 "Всеобщая забастовка на §H[Root.GetName&prep]§! переросла в создание автономной зоны: местное рабочее движение уже давно подрывает власть планетарной администрации, а население всё чаще видит в коммунах единственный способ выжить в нищете."
 EaC_civic_mechanic_events.300.a:0 "С этими узурпаторами разберутся."
 EaC_civic_mechanic_events.301.name:0 "Всеобщая забастовка на [Root.GetName&prep] набирает силу"
 EaC_civic_mechanic_events.301.desc:0 "Рабочие коммуны, контролирующие §H[Root.GetName]§!, распространяют антигосударственную пропаганду. Официальные суды и силы правопорядка не справляются с организованным рабочим движением, и всё больше жителей решаются к нему присоединиться. Производительность заметно упала."
 EaC_civic_mechanic_events.301.a:0 "Нужно восстановить контроль."
 EaC_civic_mechanic_events.302.name:0 "Забастовка администрации на [Root.GetName&prep]"
 EaC_civic_mechanic_events.302.desc:0 "Недавняя инспекция §H[Root.GetName&gen]§! показала, что подавляющее большинство планетарной администрации присоединилось ко всеобщей забастовке, организованной местным рабочим движением. Всех бастующих чиновников заменили, но это вызвало серьёзные перебои в работе государственного сектора.\n\nТем временем лидеры движения уже убеждают новых чиновников присоединиться к забастовке и требуют более широкого представительства."
 EaC_civic_mechanic_events.302.a:0 "Эту всеобщую забастовку нужно подавить."
 EaC_civic_mechanic_events.303.name:0 "Губернатор убит на [Root.GetName&prep]"
 EaC_civic_mechanic_events.303.desc:0 "Угнетённые рабочие на §H[Root.GetName&prep]§! убили местного губернатора — §Y[governor_target.GetName]§!! Кортеж губернатора был блокирован при выезде из космопорта, после чего между охраной и нападавшими вспыхнула ожесточённая перестрелка.\n\nКогда всё стихло, губернатор оказался среди погибших. Позднее рабочее движение распространило послание: «Внимание, [ROOT.GetLeaderName]! Ваше угнетение никогда не сломит наш дух. Нам нужно сломать только одно — наши цепи!»"
 EaC_civic_mechanic_events.303.a:0 "Подготовить государственные похороны."
 EaC_civic_mechanic_events.304.name:0 "Рабочие захватывают торговлю на [Root.GetName&prep]"
 EaC_civic_mechanic_events.304.desc:0 "Рабочие коммуны, управляющие §H[Root.GetName]§!, теперь контролируют значительную часть местной торговли. Они полностью захватили несколько крупных космопортов, и весь товарооборот проходит через их посредников. В результате торговые доходы от [Root.GetName&gen] резко упали."
 EaC_civic_mechanic_events.1001.name:1 "Филиал на [Root.GetName&prep] закрыт"
 EaC_civic_mechanic_events.1001.desc:0 "Стабильность на §H[Root.GetName&prep]§! продолжает расти, и местные власти наконец смогли сосредоточиться на борьбе с несанкционированными забастовками, которые устраивал филиал §H[office_owner.GetName]§!. Массовые аресты вынудили преступное предприятие прекратить деятельность."
 EaC_civic_mechanic_events.1001.a:0 "Скатертью дорога."
 EaC_civic_mechanic_events.1002.name:1 "Филиал на [From.GetName&prep] закрыт"
 EaC_civic_mechanic_events.1002.desc:0 "Наш филиал на §H[From.GetName&prep]§! недавно пришлось закрыть после массовых арестов, проведённых местными властями. Похоже, снижение преступности позволило силам правопорядка сосредоточиться на пресечении нашей деятельности."
 EaC_civic_mechanic_events.1002.tooltip:0 "Наш филиал на [From.GetName&prep] закрыт."
 action.1.preftl_action_trade_pact_msi:0 "От имени Совета директоров $NAME_MSI_country$ примите наши сердечные приветствия. В $NAME_MSI_country_initials$ мы верим, что технологии и торговля помогают другим цивилизациям раскрыть свой потенциал. В конце концов, каждое разумное существо имеет право воплотить свои мечты.\n\nМы уже поделились знаниями с десятками досветовых миров и намерены увеличить их число на 40% в течение следующего десятилетия.\n\nДля нас большая честь обслуживать жителей планеты [Root.Capital.GetName]. Как клиенту нашей программы возвышения, желаем вам приятного бесплатного пробного периода!"
 action.1.obelisk:0 "От имени Совета директоров $NAME_MSI_country$ примите наши сердечные приветствия. В $NAME_MSI_country_initials$ мы верим, что технологии и торговля помогают другим цивилизациям раскрыть свой потенциал. В конце концов, каждое разумное существо имеет право воплотить свои мечты.\n\nМы уже поделились знаниями с десятками досветовых миров и намерены увеличить их число на 40% в течение следующего десятилетия. Мы также поддерживаем космические державы галактики, предоставляя финансовую помощь и услуги наших специализированных работников по контракту.\n\nЕсли вам что-нибудь понадобится, не стесняйтесь обращаться. Будем рады вести с вами дела!"
 action.2.a:0 "§EПриветствуем! Нам есть чему поучиться у культур друг друга.§!"
 action.2.d:0 "§EКосмос полон чудес, и мы можем показать вам, как он устроен.§!"
 action.2.e:0 "§EПриведите своего величайшего воина. Пусть битва станет праздником для нас обоих!§!"
 action.2.f:0 "§EМы пришли с миром. Пусть наши народы живут в гармонии.§!"
 action.2.g:0 "§EМы пришли с миром и приветствуем свободу вашего народа.§!"
 action.2.cooperative:0 "§EПриветствуем, товарищи.§!"
 action.2.competitive:0 "§EПриветствуем! Нам есть что вам предложить — за соответствующую плату.§!"
 action.2.industrialist:0 "§EВаш мир скрывает немало богатств. Позвольте нам помочь их раскрыть.§!"
 action.2.ecocentrist:0 "§EМы поможем вам исцелить свой мир и научиться жить с ним в гармонии.§!"
 action.2.a.invade:0 "§EНаши археологи многое узнают, изучая руины вашего общества!§!"
 action.2.b.invade:0 "§EОтвратительные твари... Мы сотрём вас с лица этого мира!§!"
 action.2.c.invade:0 "§EДа пребудет божественное благословение с вами и вашим миром.§!"
 action.2.d.invade:0 "§EНаши технологии уничтожат ваши примитивные армии.§!"
 action.2.e.invade:0 "§EМы наведём порядок в вашем хаотичном существовании. Ожидайте.§!"
 action.2.f.invade:0 "§EМы желаем мира, но само ваше существование не оставляет нам выбора.§!"
 action.2.g.invade:0 "§EМы идём войной, чтобы освободить ваш народ!§!"
 action.2.h.invade:1 "§EВы считаете себя развитой цивилизацией? Как мило.§!"
 action.2.i.invade:0 "§EМы едины. Вы станете частью нас.§!"
 action.2.j.invade:0 "§EМы едины. Вы тоже едины. Но единым может быть только один.§!"
 action.2.k.invade:0 "§EНадеемся превратить вас в прибыльную колонию!§!"
 action.2.cooperative.invade:0 "§EВы пока ещё не товарищи...§!"
 action.2.competitive.invade:0 "§EПриветствуем! У вас много активов, которые мы хотели бы приобрести!§!"
 action.2.industrialist.invade:0 "§EВаш мир скрывает немало богатств. Мы их используем.§!"
 action.2.ecocentrist.invade:0 "§EМы спасём ваш мир от вашей же беспечности!§!"
 action.2.civic_barbaric_despoilers.invade:0 "§EМы поработим ваше общество! Всё здесь будет принадлежать нам!§!"
 action.2.civic_barbaric_despoilers.invade.tooltip:0 "§YФлотилия на орбите§! §Wпереходит к§! §Gрейдерской§! тактике бомбардировки\n\n"
 preftl.180.wargoal:0 "Восстание досветовой цивилизации"
 origin.10.a.pre_ftl.desc:0 "Приветствуем вас, верные [Root.GetSpeciesNamePlural]. Вы многого добились. Под нашим руководством ваша цивилизация достигла ранней космической эпохи, и теперь вы готовы впервые отправиться исследовать свою звёздную систему... как некогда сделали мы сами бесчисленные эпохи назад.\n\nНе бойтесь: если бы мы не считали вас готовыми, то не позволили бы событиям зайти так далеко. Ступайте же и заставьте нас гордиться вами."
 origin.10.a.pre_ftl:0 "Да свершится воля твоя."
 origin.10.b.pre_ftl.desc:0 "[Root.GetSpeciesNamePlural]. Первая фаза эксперимента успешно завершена: мы направили вашу цивилизацию к ранней космической эпохе, и теперь вы готовы исследовать сложную систему своей звезды.\n\nБудьте уверены: с началом второй фазы мы продолжим наблюдать за вашим развитием. До сих пор вы проявляли удивительную сноровку. Совсем не такую, как остальные.\n\nЛюбопытно будет увидеть, как вы распорядитесь этой возможностью."
 origin.10.b.pre_ftl:0 "Мы вас не подведём."
 origin.5500.name:0 "Снова к звёздам!"
 origin.5500.desc:0 "Во время мятежа наши бывшие хозяева попытались §Rполностью стереть компьютерную базу данных§!, но им не удалось уничтожить оставшиеся §G3% информации§!. Почти чудом наши учёные обнаружили уцелевшие материалы по технологии §H«$tech_hyper_drive_1$»§!, а также сведения по теме §H«$tech_hyper_drive_theory$»§!. Инженерный отсек невольничьего корабля срочно переоборудован в примитивный лабораторный комплекс для исследований гипердвигателя.\n\nНе менее тревожной оказалась другая находка. Аналитики выяснили, куда направлялся корабль работорговцев. Согласно судовому манифесту, он должен был установить первый контакт с §Hдосветовой цивилизацией§! в соседней системе. Особенно настораживает обозначение планеты — §R«Мир Обелиска»§!, то же обозначение, что и у родного мира [Root.GetSpeciesName&gen]. Приложив немного усилий, мы сможем расшифровать координаты других Миров Обелисков."
 origin.5500.tt:0 "Сооружение §H£building£ «$building_low_tech_research_lab$»§! на планете §Y[Root.Capital.GetName&prep]§! будет улучшено до §H£building£ «$building_research_lab_1$»§!."
 origin.5500.a:0 "Мы должны создать гипердвигатели и предупредить их, пока не стало слишком поздно!"
 origin.5505.desc:1 "Одним из первых решений наше молодое правительство поспешно переоборудовало несколько палуб невольничьего корабля под примитивный административный центр. Теперь, когда мы прочно обосновались на планете [Root.Capital.GetName], эти помещения были модернизированы."
 origin.5505.option.regular:0 "Это поможет нам подготовиться к следующему шагу: §H$tech_primitive_unified_planet$§!."
 origin.5505.option.spiritualist:0 "Это укрепит нас на духовном пути. Следующий шаг — §H$tech_primitive_unified_planet$§!."
 civic_tooltip_not_egalitarian_or_xenophile:0 "Не следует ни принципам §Y$ethic_egalitarian$§!, ни принципам §Y$ethic_xenophile$§!"
