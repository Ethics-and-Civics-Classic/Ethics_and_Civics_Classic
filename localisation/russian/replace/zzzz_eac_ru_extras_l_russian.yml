 nations.20225.title:0 "Государство [FROMFROMFROMFROM.GetName] уничтожено"
 nations.20225.desc.nuclear_winter_situation:0 "Сначала в ночном небе вспыхнули мерцающие огоньки. А через несколько минут ночь внезапно сменилась ослепительным солнцем. Одно за другим национальные государства исчезали в ядерном огне, а из бункеров выбирались изуродованные выжившие, пытаясь вновь овладеть оставшимся им миром-могилой.\n\nНаше государство пострадало меньше остальных, но собрать уцелевшее население под единым знаменем будет непросто. Первым делом нам предстоит восстановить порядок."
 nations.20225.desc.nuclear_winter_avoided:0 "После успешного уничтожения стратегических объектов противника его государство быстро распалось, погрузившись в хаос. Нам остаётся лишь занять земли, которыми оно прежде управляло."
 nations.20225.option.nuclear_winter_situation:0 "Мы выжили... но §Rядерная зима§! только начинается..."
 nations.20225.option.nuclear_winter_avoided:0 "Наш превентивный §Yядерный удар§! увенчался успехом!"
 nations.22205.title:0 "Дипломатический канал связи"
 nations.22205.desc:0 "Приветствуем, [Root.GetName]! Мы всегда готовы обсудить выгодные сделки, но ведь нас наверняка связывают не только экономические вопросы?"
