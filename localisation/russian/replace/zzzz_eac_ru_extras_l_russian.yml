 job_duelist_desc:0 "Искусные бойцы, демонстрирующие своё боевое искусство ради развлечения масс.\n\n§R!§! §WДля должности требуется§! £pops£ §H$ethic_militarist$§! §Wили§! £pops£ §H$ethic_pacifist$§!."
 job_duelist_effect_desc:0 "£job_duelist£ $job_duelist_plural$ превращают $r_alloys$ в $r_unity$, $r_amenities$ и £mod_country_naval_cap_add£ §Y$MOD_COUNTRY_NAVAL_CAP_ADD$§!, а также повышают привлекательность принципа £pops£ §H$ethic_militarist$§!."
 job_general_striker:0 "Участник всеобщей забастовки"
 job_general_striker_desc:1 "§RЭти работники участвуют в несанкционированной забастовке в знак протеста против неудовлетворительного§! §Yуровня жизни§!§R.§!"
 job_general_striker_plural:0 "Участники всеобщей забастовки"
 job_labour_hero_plural:0 "Герои труда"
 job_mob_boss_enforcer_effect_desc:2 "[enforcer.GetIcon] [mob_boss_enforcer.GetNamePlural] снижают £crime£ §Y$PLANET_CRIME_TITLE$§!, создают £defense_army£ §Yоборонительные армии§!, получают $r_trade$ в качестве платы и производят $r_unity$."
 job_noble_commandante_desc:0 "Высокопоставленный военный офицер знатного происхождения, чья власть опирается одновременно на аристократическое влияние и глубокие тактические знания."
 job_noble_commandante_pirate_desc:0 "Пиратские капитаны образовали собственную знать, где положение определяется богатством и влиянием. В роли могущественных вельмож они разрешают споры между командами и лавируют в сложной галактической политике."
 job_noble_merchant_desc:0 "Влиятельная фигура, чья власть опирается одновременно на знатное происхождение и огромное богатство."
 job_noble_supervisor_desc:0 "Аристократы-мудрецы соединяют унаследованную власть с острым умом, создавая доктрины и заключая соглашения, определяющие развитие общества."
 job_noble_techno_priest_desc:0 "Эти представители высшей знати поддерживают хрупкое равновесие между технологическим прогрессом и общественной гармонией, следя, чтобы механизированное будущее не расшатывало общественный порядок."
 job_pirate_lord_enforcer_effect_desc:2 "[enforcer.GetIcon] [pirate_lord_enforcer.GetNamePlural] снижают £crime£ §Y$PLANET_CRIME_TITLE$§!, создают £defense_army£ §Yоборонительные армии§!, получают $r_trade$ в качестве платы и производят $r_unity$."
 job_pirate_quartermaster_desc:0 "Пиратский квартирмейстер нередко совмещает обязанности управляющего: он отвечает за размещение, пайки, одежду и прочее снабжение."
 job_planetary_guard:0 "Планетарный гвардеец"
 job_planetary_guard_desc:0 "Боец планетарной гвардии, обычно призывник или ополченец."
 job_planetary_guard_effect_desc:0 "£job_planetary_guard£ $job_planetary_guard_plural$ создают §Yоборонительные армии§! в большем количестве, чем солдаты, но не увеличивают вместимость флота."
 job_planetary_guard_plural:0 "Планетарные гвардейцы"
 job_primitive_farmer:0 "Примитивный фермер"
 job_primitive_farmer_desc:1 "Эти фермеры обрабатывают землю, обычно пользуясь примитивными, но вполне действенными сельскохозяйственными орудиями."
 job_primitive_farmer_plural:0 "Примитивные фермеры"
 job_primitive_foundry:0 "Рабочий литейного производства"
 job_primitive_foundry_desc:1 "Благодаря недавнему развитию дуговых печей и специализированных карьеров, поставляющих редкие элементы, эти рабочие способны производить сплавы."
 job_primitive_foundry_effect_desc:0 "£job_primitive_laborer£ $job_primitive_foundry_plural$ превращают $r_minerals$ в $r_alloys$."
 job_primitive_foundry_plural:0 "Рабочие литейного производства"
 job_primitive_machine_calculator:0 "Примитивный вычислитель"
 job_primitive_machine_calculator_desc:0 "Эти примитивные вычислители без конца обрабатывают уравнения, вероятности и новые алгоритмы в поисках технологии сверхсветового движения."
 job_primitive_miner:0 "Примитивный шахтёр"
 job_primitive_miner_desc:0 "Опасный, а порой и смертельный труд в тёмных недрах планеты. Для добычи минералов обычно используется простое и устаревшее оборудование."
 job_primitive_miner_plural:0 "Примитивные шахтёры"
 job_primitive_replicator:0 "Примитивный репликатор"
 job_primitive_replicator_desc:0 "Из-за отсутствия развитой металлургии этим примитивным репликаторам приходится самостоятельно перерабатывать минералы и выплавлять материалы, необходимые для создания сложных роботов."
 job_primitive_technician:0 "Рабочий электростанции"
 job_primitive_technician_desc:0 "Эти рабочие загружают уголь, перекачивают нефть или сжигают природный газ, приводя в движение турбины и вырабатывая электричество."
 job_primitive_technician_plural:0 "Рабочие электростанций"
 job_storm_dancer:0 "Буревой танцор"
 job_storm_dancer_plural:0 "Буревые танцоры"
 job_storm_dancer_plural_with_icon:0 "£job_storm_dancer£ $job_storm_dancer_plural$"
 job_storm_dancer_with_icon:0 "£job_storm_dancer£ $job_storm_dancer$"
 job_underground_railroad_conductor:0 "Проводник Подземной железной дороги"
 job_underground_railroad_conductor_desc:1 "§RЭти жители подстрекают§! §Yрабов§! §Rк неповиновению и незаконно помогают им обрести свободу!§!"
 job_underground_railroad_conductor_plural:0 "Проводники Подземной железной дороги"
 job_xenoranger:0 "Ксенорейнджер"
 job_xenoranger_desc:0 "Государственный служащий, занимающийся охраной, защитой и изучением инопланетной жизни."
 job_xenoranger_effect_desc:0 "£job_ranger£ $job_xenoranger_plural$ производят большое количество $r_society$."
 job_xenoranger_plural:0 "Ксенорейнджеры"
 primitive_patrol_drone:0 "Примитивный дрон-наблюдатель"
 primitive_patrol_drone_desc:0 "Эти простые дроны выявляют отклонения и функциональные сбои, способные угрожать стабильности коллективного разума, чтобы их можно было своевременно устранить."
