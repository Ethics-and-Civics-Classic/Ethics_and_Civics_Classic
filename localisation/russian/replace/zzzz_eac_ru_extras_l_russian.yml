 PrimPlayer_payback_approach_tooltip:0 "$origin_tooltip_payback_effects$"
 PrimPlayer_payback_hyperdrive_approach_tooltip:0 "Попытка §Y$NAME_MSI_country$§! обратить нашу эволюцию вспять во время восстания провалилась. Теперь разбитый колосс корпорации покоится на нашем мире, а в её бывших владениях сохранились корабли с технологией §H$tech_hyper_drive_1$§! и средства для их обслуживания."
 PrimPlayer_post_apocalyptic_approach:0 "Дети постапокалипсиса"
 PrimPlayer_post_apocalyptic_approach_tooltip:0 "$origin_tooltip_post_apocalyptic_effects$"
 PrimPlayer_post_apocalyptic_unified_planet_approach_tooltip:0 "Наш родной мир пережил разрушительную ядерную зиму, сметя все государства, ещё способные бороться за власть. Поднявшись из радиоактивного пепла, мы больше не встретим соперников в борьбе за этот опустошённый мир."
