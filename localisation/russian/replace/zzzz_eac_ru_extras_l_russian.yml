l_russian:

 # Safe runtime fallbacks for missing upstream localisation aliases
 pop_cat_bio_civilian_unemployment:0 "Безработный биогражданин"
 pop_cat_bio_civilian_unemployment_plural:0 "Безработные биограждане"
 pop_cat_bio_civilian_unemployment_desc:0 "Биограждане, не занятые на доступных должностях."
 bio_civilian_unemployment:0 "$pop_cat_bio_civilian_unemployment$"
 bio_civilian_unemployment_desc:0 "$pop_cat_bio_civilian_unemployment_desc$"
 civic_imperial_cult:0 "Имперский культ"
 civic_shadow_council_desc:0 "Граждане не подозревают, что на самом деле этим обществом из-за кулис управляет тайный совет. Приличия приходится соблюдать, но и от тирании большинства необходимо защищаться. В конце концов, что будет, если глупцы проголосуют не за того кандидата?"
 civic_feudal_realm:0 "Феодальное общество"
 civic_feudal_realm_desc:0 "Это общество устроено по феодальному принципу: власть монарха опирается на могущественных вассалов, которые пользуются значительной самостоятельностью в управлении своими владениями."
 civic_twisted_experimenters_corporate_desc:0 "Это общество запустило многообещающую инициативу, которая одновременно снижает издержки судебной системы и ускоряет научный прогресс. Проблемных граждан переводят в экспериментальные исследовательские программы, где они проходят строгие испытания ради технологических прорывов. Показатели смертности остаются в пределах расчётных значений."
 civic_barbaric_despoilers_desc:0 "В этом обществе почти нет ничего святого. Жизнь — это борьба, и сильнейший вправе забрать всё, чего пожелает. Следствием такой философии стало повсеместное рабство, а единственный путь невольника к свободе лежит через гладиаторские бои."
 civic_catalytic_processing_desc:0 "Сосредоточив промышленность на каталитической химии, эта цивилизация открыла способ использовать органические материалы при строительстве космических сооружений."
 civic_technocracy:0 "Технократия"
 civic_technocracy_desc:0 "Для максимальной эффективности это общество управляется в соответствии с принципами науки и рациональности. Нельзя позволять личным прихотям невежественной и опасно некомпетентной политической элиты вмешиваться в этот процесс."
 civic_relentless_industrialists_machine_cult:0 "Неудержимый индустриальный культ"
 civic_relentless_industrialists_machine_cult_desc:0 "Плоть слаба. Вера этой цивилизации строится на безоговорочном принятии машин и стремлении использовать с предельной эффективностью каждый грамм материи и каждую частицу живой плоти, доступные для эксплуатации.\n\n§WРекомендуемое происхождение:§! §B$origin_cybernetic_creed$§!"
 civic_consumerism_corporate:0 "$civic_consumerism$"
 civic_consumerism_corporate_desc:0 "$civic_consumerism_desc$"
 civic_machine_cult_machine:0 "Дух машины"
 civic_machine_cult_machine_desc:0 "Считается, что эти машины обладают псионическими свойствами, а сила веры поддерживает их Дух машины."
 civic_franchising:0 "Торговые привилегии"
 civic_franchising_desc:0 "Руководители корпоративного сектора контролируют договоры с франчайзи и нередко используют юридические лазейки, чтобы присваивать активы дочерних предприятий. Франчайзи приносят значительные средства, на которые можно приобретать особые лицензии на ходовые товары и финансировать совместные программы исследований и разработок."
 civic_gospel_of_the_masses:0 "Благая весть для народных масс"
 civic_gospel_of_the_masses_desc:0 "В этом обществе причудливо сочетаются коммерческие и спиритуалистические ценности: обязанности рукоположенного служителя культа и корпоративного руководителя слились в единую должность. $TABBED_NEW_LINE$ $BOB_temple_tooltip$"
 civic_ruthless_competition:0 "Безжалостная конкуренция"
 civic_criminal_heritage:0 "Криминальное наследие"
 civic_criminal_heritage_desc:0 "Эта мегакорпорация уходит корнями к преступному синдикату, который со временем набрал такую силу, что вытеснил все формы местного правления.\n\n§WПозволяет использовать политики§! §H$economic_stance_criminal_market$§! §Wи§! §H$economic_policy_criminal$§!§W.§!"
 civic_private_military_companies:0 "Частные военные компании"
 civic_private_military_companies_desc:0 "На содержании этой мегакорпорации находится множество могущественных частных военных компаний. Эти наёмные подрядчики усиливают её наземные войска."
 civic_indentured_assets:0 "Долговые активы"
 civic_indentured_assets_desc:0 "Эта мегакорпорация специализируется на использовании огромной массы зависимых работников. Это, разумеется, не имеет ничего общего с варварской практикой рабства — эти работники всего лишь отрабатывают свои долги... бессрочно.\n\n§WВсе§! §Yвиды рабства§!§W, кроме§! §Hдолгового рабства§!§W,§! §Rзапрещены§!§W.§!"
 civic_public_relations_specialists:0 "Специалисты по общественным отношениям"
 civic_public_relations_specialists_desc:0 "Если контролировать мысли разумного существа, можно контролировать и его поведение. У этой мегакорпорации есть целая армия специалистов, готовых вступить в битву за общественное мнение.\n\n§WМожно построить§! £building£ §Y$building_PR_bureau$§!§W.§!"
 civic_corporate_catalytic_processing_desc:0 "Эта мегакорпорация стремится максимизировать прибыль, перерабатывая излишки органического вещества в передовые материалы, пригодные для строительства космических сооружений."
 civic_barbaric_despoilers_corporate:0 "$civic_barbaric_despoilers$"
 civic_barbaric_despoilers_corporate_desc:0 "В этом обществе почти нет ничего святого. Жизнь — это борьба, и сильнейший вправе забрать всё, чего пожелает. Следствием такой философии стало повсеместное рабство, а единственный путь невольника к свободе лежит через гладиаторские бои."
 PrimPlayer_civic_barbaric_despoilers_khan:0 "План Великого хана"
 PrimPlayer_civic_barbaric_despoilers_khan_desc:0 "Эти варварские клоны когда-то были боевыми невольниками Великого хана, жившего многие эпохи назад. Их древний хозяин давно мёртв, но они по-прежнему неукоснительно исполняют его План."
 civic_barbaric_despoilers_khan:0 "$PrimPlayer_civic_barbaric_despoilers_khan$"
 civic_barbaric_despoilers_khan_desc:0 "$PrimPlayer_civic_barbaric_despoilers_khan_desc$"
 civic_crusader_spirit:0 "Дух крестоносцев"
 civic_crusader_spirit_desc:0 "Отсутствие наставления рождает слабые умы, легко поддающиеся пороку и упадку. Это общество возложило на себя миссию нести массам «просвещение», силой обращая их в свою веру."
 civic_crusader_spirit_corporate_desc:0 "Чтобы бороться с космическим пиратством и защищать свои границы, это государство привлекает известных пиратов в качестве военных советников и командиров флота."
 civic_pirate_mercenary_enclave:0 "Пиратский анклав"
 civic_pirate_mercenary_enclave_desc:0 "$preset_pirate_enclave_desc$"
 civic_private_healthcare_corporate_desc:1 "Сильная нация — здоровая нация. Эта мегакорпорация поддерживает мощную экономику благодаря экспериментальным препаратам, почти полностью приватизированной системе здравоохранения и агрессивным рекламным кампаниям."
 civic_memory_vault_corporate:1 "Наставничество"
 civic_memory_vault_corporate_desc:1 "Знания, принципы и опыт выдающихся личностей оцифровываются и накапливаются в Хранилищах знаний. Граждане могут обращаться к этому источнику мудрости и опыта, чтобы учиться у призраков прошлого. Разумеется, за определённую плату.\n\n§YЛидеры§!§W, ставшие§! §Yправителями§!§W, получают§! §G+1§! §Yуровень навыка§!§W.§!"
 civic_worker_coop:0 "Рабочий кооператив"
 civic_worker_coop_desc:0 "Члены этого общества поровну делят труд, прибыль и общие устремления кооператива.\n\n§WМожно строить особые противорабовладельческие§! £building£ §Y$BRANCH_OFFICE_BUILDINGS$§!§W.§!\n\n§YПодземная железная дорога§!§W:§!\n§WМожно открывать§! §Yфилиалы§! §Wна любой планете, где существует§! §Hрабство§!§W, если с государством-владельцем нет войны или действующего перемирия.§!\n§WМожно построить особое§! £building£ §Yсооружение «Подземная железная дорога»§!§W, которое§! §Rснижает§! $r_stability$ §Wи способствует§! §Gвосстаниям рабов§!§W.§!\n§WЭффективность повышается при происхождении§! §C«Разрушители оков»§!§W.§!"
 civic_corporate_sovereign_guardianship:0 "Корпоративный протекторат"
 civic_corporate_sovereign_guardianship_desc:0 "Соперничающие отрасли этого общества давно усвоили: лучшая защита вложений — крепкая оборона. Теперь они объединились и несут этот принцип к звёздам, стремясь сделать границы неприступными, а отношения с соседями — спокойными."
 civic_astrometeorology_desc:0 "Глубоко уважая силы природы, этот вид прилагает огромные усилия, чтобы раскрыть внутренние механизмы природных явлений. Отправляясь к звёздам, он проявляет особый интерес к астрометеорологии, а в центре его исследований находятся самые впечатляющие и потенциально разрушительные астрономические явления — космические бури."
 civic_storm_callers:0 "Преданность буре"
 civic_storm_callers_desc:0 "С древнейших времён это общество умело призывать бури своими ритуалами. С годами технические новшества сделали эти практики эффективнее. С наступлением космической эры оно стремится перенести накопленные знания к звёздам."
 civic_natural_design:0 "Задумка природы"
 civic_natural_design_desc:0 "§RВНИМАНИЕ: блокирует все пути возвышения§!\n§RВНИМАНИЕ: невозможно модифицировать органические виды§!\n\nЭто общество убеждено, что природа уже создала совершенство в генетическом коде его народа. Его медицина и государственные институты издавна посвящены здоровью и сохранению естественных, неизменённых геномов."
 civic_void_reavers:0 "Разбойники пустоты"
 civic_void_reavers_desc:0 "Эти звёздные вольные грабители имеют весьма смутное представление о собственности. По их мнению, сильный и хитрый вправе присвоить любое плохо защищённое богатство."
 civic_star_seekers_desc:0 "Нас объединяют жажда странствий и настоящий дух первопроходцев, а не одни лишь империалистические или экономические амбиции. Мы ищем всё более необычные звёзды, радуемся каждому светилу галактики и дорожим каждым мгновением погони за далёкими мирами."
 civic_hive_memorialist:0 "Мемориалист"
 civic_hive_memorialist_desc:0 "Коллективный разум уделяет особое внимание смерти других разумных существ, используя её как способ осмыслить собственное неумирающее «я»."
 civic_hive_catalytic_processing_desc:0 "Коллективный разум перерабатывает излишки органического вещества в передовые материалы, пригодные для строительства космических сооружений."
 civic_memory_vault_hive:1 "Нейроархивы"
 civic_memory_vault_hive_desc:0 "Этот улей стремится познать самого себя, изучая жизнь автономных дронов, встречающихся в галактике. Он извлекает их воспоминания, сохраняя и растворяя мозговую ткань, а затем частично переносит накопленный опыт в недавно подготовленных дронов."
 civic_machine_memorialist:0 "$civic_hive_memorialist$"
 civic_machine_memorialist_desc:0 "Машинный разум уточняет понимание своих базовых протоколов, тщательно анализируя энтропию во вселенной. Избыточность — тоже данные на пути к большей устойчивости."
 civic_machine_catalytic_processing_desc:0 "Машинный разум перерабатывает избыточное органическое вещество в передовые материалы, пригодные для строительства космических сооружений."
 civic_memory_vault_machine:1 "Кэширование опыта"
 civic_memory_vault_machine_desc:0 "Этот машинный разум был создан для оцифровки и хранения данных и опыта, чтобы анализировать их, учиться на них и использовать для собственного совершенствования."
 PrimPlayer_civic_nation_state:0 "Национальное государство"
 PrimPlayer_civic_nation_state_desc:0 "Это общество ещё не объединило весь мир под единым знаменем."
 PrimPlayer_civic_primitive:0 "Примитивная экономика"
 PrimPlayer_civic_primitive_desc:0 "Экономика этого общества пока остаётся простой."
 PrimPlayer_civic_feudalism:0 "Феодализм"
 PrimPlayer_civic_feudalism_desc:0 "Экономические принципы этого общества основаны на праве монархов обладать абсолютной властью над всеми людьми и всем имуществом в пределах своих владений."
 PrimPlayer_civic_capitalism:0 "Капитализм"
 PrimPlayer_civic_capitalism_desc:0 "Экономические принципы этого общества основаны на праве собственников единолично распоряжаться принадлежащими им средствами производства."
 PrimPlayer_civic_socialism:0 "Социализм"
 PrimPlayer_civic_socialism_desc:0 "Экономические принципы этого общества основаны на праве работников демократически управлять коллективно принадлежащими им средствами производства."
 PrimPlayer_civic_isolationism:0 "Изоляционизм"
 PrimPlayer_civic_isolationism_desc:0 "Это государство отгораживается от остального мира."
 PrimPlayer_civic_internationalism:0 "Интернационализм"
 PrimPlayer_civic_internationalism_desc:0 "Это государство стремится к объединению мира."
 civic_primitive_enthusiasts:0 "Почитатели старины"
 civic_primitive_enthusiasts_desc:0 "Это общество высоко ценит старые способы производства, предпочитая выполнять многие работы вручную и жить за счёт земледелия и животноводства."
 PrimPlayer_civic_the_obelisk:0 "Обелиск"
 PrimPlayer_civic_the_obelisk_desc:0 "Обелиск возвышается над этим государством, не тронутый временем. Как отреагирует молодое общество на загадочный монолит?"
 civic_the_obelisk:0 "$PrimPlayer_civic_the_obelisk$"
 civic_the_obelisk_desc:0 "$PrimPlayer_civic_the_obelisk_desc$"
 PrimPlayer_civic_scion_materialist:0 "Отпрыски материализма"
 PrimPlayer_civic_scion_materialist_desc:0 "$origin_scion_desc$"
 civic_scion_materialist:0 "$PrimPlayer_civic_scion_materialist$"
 civic_scion_materialist_desc:0 "$origin_scion_desc$"
 PrimPlayer_civic_scion_spiritualist:0 "Отпрыски спиритуализма"
 PrimPlayer_civic_scion_spiritualist_desc:0 "$origin_scion_desc$"
 civic_scion_spiritualist:0 "$PrimPlayer_civic_scion_spiritualist$"
 civic_scion_spiritualist_desc:0 "$origin_scion_desc$"
 PrimPlayer_civic_here_be_dragons:0 "$origin_here_be_dragons$"
 PrimPlayer_civic_here_be_dragons_desc:0 "$origin_here_be_dragons_desc$"
 civic_here_be_dragons:0 "$PrimPlayer_civic_here_be_dragons$"
 civic_here_be_dragons_desc:0 "$PrimPlayer_civic_here_be_dragons_desc$"
 PrimPlayer_civic_fortress_nation:0 "Государство-крепость"
 PrimPlayer_civic_fortress_nation_desc:0 "\n\n§RНельзя удалить до наступления§! §Yатомной эпохи§!§R!§!"
 PrimPlayer_civic_electrifying_nation:0 "Электрифицированное государство"
 PrimPlayer_civic_electrifying_nation_desc:0 "Это государство приняло технологический прорыв, связанный с освоением электричества.\n\n§RНельзя удалить до наступления§! §Yмашинной эпохи§!§R!§!"
 PrimPlayer_civic_agrarian_nation:0 "Аграрное государство"
 PrimPlayer_civic_agrarian_nation_desc:0 "Это государство сделало ставку на естественную устойчивость аграрной экономики.\n\n§RНельзя удалить до наступления§! §Yмашинной эпохи§!§R!§!"
 PrimPlayer_civic_industrializing_nation:0 "Индустриализирующееся государство"
 PrimPlayer_civic_industrializing_nation_desc:0 "Это государство встало на путь индустриализации и автоматизирует все сферы жизни.\n\n§RНельзя удалить до наступления§! §Yмашинной эпохи§!§R!§!"
 PrimPlayer_civic_star_gazers:0 "Звездочёты"
 PrimPlayer_civic_star_gazers_desc:0 "Это государство придаёт огромное значение звёздам и постоянно задаётся вопросом: что же там, за пределами нашего мира?"
 PrimPlayer_civic_symbiotic_presapients:0 "Предразумные симбионты"
 PrimPlayer_civic_symbiotic_presapients_desc:0 "Предразумный вид эволюционировал бок о бок с видом этого государства и помогает ему во многих сферах жизни.\n\n§RМожно заменить только событием. Улучшается до§! §Y«Общественных симбионтов»§! §Rили§! §Y«Рабской расы»§!§R в зависимости от руководящих принципов государства!§!"
 PrimPlayer_civic_trading_nation:0 "Торговое государство"
 PrimPlayer_civic_trading_nation_desc:0 "Это государство поощряет рост и влияние торгового сословия.\n\n§RНельзя удалить до наступления§! §Yатомной эпохи§!§R!§!"
 PrimPlayer_civic_environmental_synergy:0 "Экологическая синергия"
 PrimPlayer_civic_environmental_synergy_desc:0 "Это государство стремится жить в гармонии с природой и сохранять естественные ландшафты.\n\n§RНельзя удалить до наступления§! §Yатомной эпохи§!§R!§!"
 PrimPlayer_civic_tooltip_aquatics_effects:1 "- $HOME_SYSTEM$ населена защитным §IНебесным драконом§!, который придёт в ярость, если вызвать его недовольство"
 civic_hired_guns_effect_tooltip:0 "- Награда за торговлю по военным контрактам: §G+50%§!\n- Скорострельность кораблей во время действия военного контракта: §G+15%§!\n- Содержание кораблей во время действия военного контракта: §G-15%§!\n- Содержание кораблей на орбите §Rвраждебных§! колоний: §G-10%§!.\n- £building£ §YЦитадели§! и §YКрепости§! дают должности £job_mercenary£ §Y$job_mercenary$§! вместо £job_soldier£ §Y$job_soldier_plural$§!.\n- £job_mercenary£ §Y$job_mercenary_plural$§! в основном действуют как £job_soldier£ §Y$job_soldier_plural$§!, но также производят немного $r_trade$ и требуют $r_consumer_goods$ на содержание."
