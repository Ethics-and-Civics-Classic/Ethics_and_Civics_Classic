 economic_policy_criminal:0 "Криминальная экономика"
 economic_policy_criminal_name:0 "Криминальная экономика"
 economic_policy_criminal_desc:0 "Мы не обременяем себя поддержанием экономики мирного или военного времени: государства, которые этим занимаются, становятся нашими лучшими клиентами. То, чего им недостаёт, превращается в самый прибыльный контрабандный товар.\n\n$economic_policy_criminal_effect$"
 economic_policy_criminal_effect:0 "§Y$crime_lord_deal$§! теперь позволяет £job_criminal£ §Yпреступникам§! производить $r_trade$."
 economic_stance_criminal_market:0 "Криминальный рынок"
 economic_stance_criminal_market_name:0 "Криминальный рынок"
 economic_stance_criminal_market_desc:0 "Экономикой распоряжаются преступные организации, фактически исполняющие роль государственных органов торгового регулирования. Значительная часть их деятельности связана с вывозом нелегальных товаров на внешние рынки через криминальные филиалы.\n\n"
 policy_conscription_stance:0 "Воинская обязанность"
 policy_conscription_stance_name:0 "Воинская обязанность"
 policy_conscription_stance_desc:0 ""
 conscription_stance_0:0 "Добровольная служба"
 conscription_stance_0_name:0 "Добровольная служба"
 conscription_stance_0_desc:0 "Мы не станем вводить массовую обязательную военную службу. Принудительные меры, например военное положение, будут применяться лишь в отдельных случаях и по необходимости."
 conscription_stance_1:0 "Ограниченный призыв"
 conscription_stance_1_name:0 "Ограниченный призыв"
 conscription_stance_1_desc:0 "На каждые §Y50 поселений§! будет создаваться одна должность планетарного гвардейца для укрепления обороны. Пригодные к службе граждане и постоянные жители будут при необходимости проходить примерно двухлетнюю службу."
 conscription_stance_2:0 "Расширенный призыв"
 conscription_stance_2_name:0 "Расширенный призыв"
 conscription_stance_2_desc:0 "На каждые §Y25 поселений§! будет создаваться одна должность планетарного гвардейца для защиты наших миров. Такая система требует значительных средств и людских ресурсов, но считается необходимой."
 conscription_stance_3:0 "Звёздная служба"
 conscription_stance_3_name:0 "Звёздная служба"
 conscription_stance_3_desc:0 "На каждые §Y16 поселений§! будет создаваться одна должность планетарного гвардейца — опора обороны перед лицом многочисленных угроз. Все пригодные к службе граждане, не вступившие в войска добровольно, подлежат призыву."
 trade_policy_leader:0 "Доля правителя"
 trade_policy_leader_name:0 "Доля правителя"
 trade_policy_leader_desc:0 "Ресурсы государства принадлежат правителю, которому причитается доля с каждой торговой операции и последнее слово в каждой сделке.\n\n§Y75%§! собранного $r_trade$ конвертируется в $r_energy$ и $r_influence$. За каждую §Y1§! ед. $r_trade$ мы получаем §G0,25§! ед. $r_energy$ и §G0,002§! ед. $r_influence$."
 franchising_terms:0 "Договоры франчайзи"
 franchising_terms_desc:0 "Эти договоры определяют все условия отношений между подданным-франчайзи и корпоративным сюзереном.\n\n§EНачальные условия соглашения с дочерней компанией:\n$t$$subject_can_be_integrated$\n$t$$subject_can_do_diplomacy$\n$t$$subject_can_expand$\n$t$Налог основными ресурсами: 30%\n$t$Участие в войнах сюзерена: во всех\n$t$Участие в войнах подданного: оборонительные\n$t$Лимит владений у подданного: 2§!\n\nЭто §Yблагожелательная политика подчинения§!."
 orbital_bombardment_nuclear_armageddon_name:0 "Бомбардировка «Ядерный Армагеддон»"
 orbital_bombardment_nuclear_armageddon_desc:1 "Разрешает применение всего ядерного арсенала без какой-либо оглядки на жизнь на поверхности. Они познают то же пылающее солнце, которое когда-то увидели наши предки.\n\n§EПозволяет использовать тактики орбитальной бомбардировки «Неизбирательная» и «Армагеддон».§!"
 has_valid_civic_for_tooltip_tooltip:0 "Есть §Hподходящая гражданская модель§! для этой политики"
 has_valid_civic_civic_innovative_economy:0 "Есть гражданская модель §Y«$civic_innovative_economy$»§!"
 PrimPlayer_awareness_situation_suppress:0 "Подавление осведомлённости"
 edict_decision_primplayer_awareness_situation:0 "Политика межзвёздной осведомлённости"
 edict_decision_primplayer_awareness_situation_desc:0 "Сведения о существовании межзвёздной жизни уже почти невозможно скрывать на официальном уровне."
 decision_primplayer_awareness_situation_fail:0 "Завершён инцидент §Y«Межзвёздная осведомлённость»§!"
 decision_primplayer_awareness_situation_suppress:0 "Не выбран подход §H«$PrimPlayer_awareness_situation_suppress$»§!"
 edict_civilian_resort_colony_cruise_roam_edict:0 "Разрешить системные круизы"
 edict_civilian_resort_colony_cruise_roam_edict_desc:0 "Круизные лайнеры курортных миров, оставленные на орбите, будут периодически посещать случайные планеты этой системы.\n\n§R!§! §WКлавиша «H» останавливает гражданские корабли.§!"
 edict_negotiate_with_crime_lords_edict:0 "Подкупленные силовики"
 edict_negotiate_with_crime_lords_edict_desc:0 "Наши дипломаты договорятся с местными криминальными боссами и обеспечат их предприятиям защиту от излишнего внимания закона. Услуга за услугу..."
 negotiate_with_crime_lords_edict_effect:0 "§Y$crime_lord_deal$§! теперь не позволяет [enforcer.GetIcon] §Y[enforcer.GetNamePlural]§! снижать £crime£ §Y$PLANET_CRIME_TITLE$§!."
 decision_primplayer_unified_planet:0 "Объединить раздробленные национальные государства"
 decision_primplayer_unified_planet_desc:0 "Наша революция — через трагедию или единство — определит нашу судьбу."
 PrimPlayer_situation_add_progress_tooltip:0 "Необходимо для перехода в §Hмежзвёздную§! эпоху."
