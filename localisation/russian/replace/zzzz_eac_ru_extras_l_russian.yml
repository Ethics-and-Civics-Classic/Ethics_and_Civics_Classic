 concept_direct_democratic_election_desc:0 "$AUTHORITY_ELECTION_10_YEARS$ $AUTHORITY_ELECTION_OLIGARCHIC$ $AUTHORITY_ELECTION_UNLIMITED_CANDIDATES$ $AUTHORITY_ELECTION_NO_REELECTION$ $AUTHORITY_ELECTION_ALLOWS_EMERGENCY_ELECTION$"
 concept_eco_biologists:0 "$eco_biologist_swap$"
 concept_eco_biologists_desc:0 "Различные §Hэкоцентристские§! гражданские модели позволяют заменять биологов особыми, более продуктивными специализациями.\n§EКсенобиологи§!$TABBED_NEW_LINE$- £job_xenobiologist£ §YКсенобиологи§! производят на §G50%§! больше $r_society$, чем обычные £job_biologist£ §Yбиологи§!, но требуют на §R33%§! больше $r_consumer_goods$.$TABBED_NEW_LINE$- Эта специализация открывается гражданской моделью §C«Экологическая инженерия»§! при наличии подходящих £blocker£ §Hприродных препятствий§!: опасной дикой природы, густых джунглей, ядовитых водорослей, токсичного болота, блуждающих лесов, титанической жизни, изолированной долины, мигрирующих лесов, заповедника с мигрирующим лесом или диких земель.\n\n§EРейнджеры§!$TABBED_NEW_LINE$- £job_ranger£ §YРейнджеры§! совмещают функции нескольких профессий: помимо $r_society$ они производят $r_unity$ и $r_amenities$, снижают £crime£ §Yпреступность§!, повышают §Yвместимость флота§! и создают §Yоборонительные армии§!.$TABBED_NEW_LINE$- Их открывает £building£ §YЗастава рейнджеров§! гражданской модели §C«Природное наследие»§!.$TABBED_NEW_LINE$- Гражданская модель §C«Защитники природы»§! также открывает их при наличии подходящих природных препятствий: огромного ледника, токсичного болота, зыбучих песков, ядовитых водорослей, густых джунглей, действующего вулкана, непроходимых гор, опасной дикой природы, блуждающих лесов, титанической жизни, изолированной долины, мигрирующих лесов, заповедника с мигрирующим лесом или диких земель.\n\n§EКсенорейнджеры§!$TABBED_NEW_LINE$- Если одновременно доступны специализации £job_xenobiologist£ §Yксенобиолога§! и £job_ranger£ §Yрейнджера§!, биолог становится £job_xenoranger£ §Yксенорейнджером§!, объединяющим преимущества и содержание обеих специализаций.\n\n§E$job_ark_gardener$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ark_gardener_plural$§! — это $job_ranger_plural$, работающие исключительно на $arkship_plural$ в ['concept_nomadic_empires']. Они выполняют те же функции, что и обычный £job_ranger£ §Y$job_ranger$§!, получают преимущества от §Y$d_ark_nature_preserve_blocker$§! £blocker£ §Hпрепятствий§! и доступны всем кочевникам с этикой §Y$ethic_green$§!."
 concept_eco_engineers:0 "Экоцентристские специализации инженеров"
 concept_eco_engineers_desc:0 "Гражданская модель §E«Экологическая инженерия»§! позволяет £job_engineer£ §Yинженерам§! становиться £job_geoengineer£ §Yгеофизиками§!. Они производят немного меньше $r_engineering$, зато получают значительный объём $r_physics$, сопоставимый с производством $r_engineering$.$TABBED_NEW_LINE$Специализация открывается при наличии следующих £blocker£ §Hприродных препятствий§!:$TABBED_NEW_LINE$$t$- £blocker£ §HНепроходимые горы§!.$TABBED_NEW_LINE$$t$- £blocker£ §HДействующий вулкан§!.$TABBED_NEW_LINE$$t$- £blocker£ §HГлубокая карстовая воронка§!.$TABBED_NEW_LINE$$t$- £blocker£ §HЗыбучие пески§!.$TABBED_NEW_LINE$$t$- £blocker£ §HОгромный ледник§!."
 concept_heavy_blockers_desc:0 "Тяжёлые препятствия — это £blocker£ §Hприродные препятствия§!, каждое из которых уменьшает число доступных £district£ §Hрайонов§! на 2:$TABBED_NEW_LINE$- £blocker£ §HДействующий вулкан§!$TABBED_NEW_LINE$- £blocker£ §HНепроходимые горы§!$TABBED_NEW_LINE$- £blocker£ §HОпасная дикая природа§!."
 concept_starbase_starhold:0 "Звёздный бастион"
 concept_starbase_starholds:0 "Звёздные бастионы"
 concept_starbase_starholds_desc:0 "Звёздные бастионы — космические базы 3-го уровня. Они вмещают два сооружения и поддерживают четыре модуля."
 concept_stargazer:0 "Звездочёты"
 concept_stargazer_desc:0 "С восхищением глядя в ночное небо, этот коллективный разум всегда стремился к исследованиям. На протяжении бесчисленных лет он строил планы и готовился к тому, чтобы как можно легче приспосабливаться к чуждым условиям."
 concept_subspace_drive:0 "Подпространственные двигатели"
 concept_subspace_drive_desc:0 "Эти подпространственные двигатели родились из отчаянного стремления покинуть родной мир и предназначены для ограниченных межзвёздных перелётов. Они позволяют совершать лишь короткие прыжки, но дают уникальную возможность начать освоение галактики раньше обычного."
