 add_leader_trait_treasure_hoarder_tooltip:0 "§Y[ROOT.GetRulerName]§! получает черту §H$leader_trait_treasure_hoarder$§!"
 clones_barbaric_despoiler.20.desc:0 "Упорство учёных в расшифровке Плана Великого хана принесло прорыв: найденный глубоко внутри Древних фабрик клонов шифр наконец удалось разгадать. Вопреки протоколу чрезмерно воодушевлённый руководитель научной группы активировал заключённый в нём ключ.\n\nС экрана доносится послание из прошлого..."
 clones_barbaric_despoiler.21.desc:0 "«§HЯ — Великий хан§!.\n\nНаш ханат будет вечен, а его продолжение обеспечит долг, вписанный в вашу ДНК.\n\nЯ создал вас, чтобы вы приняли знамя, если наш вид когда-нибудь исчезнет. Ваш священный генетический долг — восстановить империю. Я оставляю вам два пути.\n\nПервый — обратить изменения, сделавшие вас бесплодными, даровать вам свободу развиваться, процветать и размножаться.\n\nВторой — наделить вас истинным потенциалом хана, но довести ваши генетические пределы до крайности, навеки обрекая будущие поколения на зависимость от технологий размножения». "
 clones_barbaric_despoiler.21.a:0 "План Великого хана!"
 CLONE_PRECURSOR_KHAN_UNLOCK_FERTILITY:0 "Плодовитость клонов"
 CLONE_PRECURSOR_KHAN_UNLOCK_POTENTIAL:0 "Потенциал хана"
 clones_barbaric_despoiler.22.desc:0 "Наша плодовитость восстановлена, и первая группа новых §Y[Root.GetSpeciesNamePlural&gen]§! готова возродить империю ханата. Их собственные дети навсегда изменят наше будущее и позволят нам вновь стать продолжателями общества древнего хана.\n\n§YДревние фабрики клонов§! больше не нужны. Мы разберём их и извлечём всё, что ещё может представлять научную ценность. Теперь наш народ сосредоточен на том, чтобы возродить утраченную цивилизацию предтеч."
 clones_barbaric_despoiler.23.desc:0 "Зачем отказываться от потенциала древнего хана, столь предусмотрительно сохранённого для нас? Каждый клон будет нести образ и §HПредназначение§! Великого хана. Древние фабрики клонов тоже остаются могучим средством, способным наполнить нашу §Hцивилизацию предтеч§! клонами Великого хана.\n\nЛучше принять величие нашего хана. Первая группа §Y[Root.GetSpeciesNamePlural&gen]§! уже готова, и мы сильнее, чем когда-либо. Наш усовершенствованный вид возродит цивилизацию предтеч."
 clones_barbaric_despoiler.23.a:0 "Дар наших предтеч: цивилизация Великих ханов."
 clones_barbaric_despoiler.10.desc:0 "С недавним выходом в космос разногласия о нашем происхождении стремительно перерастают в настоящий раскол. Историки подтвердили давнюю теорию: когда-то мы были клонами-солдатами, созданными древним §HВеликим ханом§!. Это открытие породило новую цель — вернуть утраченную §Hцивилизацию предтеч Великого хана§!, однако пути к этой цели мы видим по-разному.\n\nОдни считают древнего Великого хана богом, которому следует поклоняться и повиноваться, и верят, что мы были созданы ради исполнения Плана Великого хана. Для них нет ничего важнее заложенного в наших генах долга перед ним. Другие убеждены, что нам нужно вырваться из состояния клонов и вновь заселить цивилизацию Великого хана. Наша зависимость от клонирования делает нас уязвимыми перед вымиранием, а значит, в конечном счёте ставит под угрозу сам План Великого хана.\n\nНа планете [Root.Owner.GetHomeWorldName] начаты раскопки, которые должны установить истину и положить конец спорам. Прежде чем искать ответы среди звёзд, стоит исчерпать все возможности здесь. Наша цивилизация-предтеча существовала в глубокой древности. Её традиции передавались через поколения клонов, живших и умиравших на этом мире. Под древними сооружениями нашей родины наверняка сохранились тексты предтеч."
 clones.10.a:0 "Нужно разобраться в этом подробнее!"
 clones_barbaric_despoiler.10.a:0 "Мы должны расшифровать §HПлан Великого хана§!!"
 clones_barbaric_despoiler.11.desc:0 "На главном участке раскопок удалось определить примерное время установки одной из наших §YДревних фабрик клонов§!: исследователи изучили почву под сооружением и сравнили её плотность и состав с окружающими слоями.\n\nСудя по всему, первые представители нашего народа — первые клоны — появились около двенадцати столетий назад.\n\nМногие поколения нашей истории были утрачены из-за безразличия к §HПлану Великого хана§!. Столько всего прошло мимо нас — и об этом остаётся лишь сожалеть."
 clones_barbaric_despoiler.12.desc:0 "На одном из участков раскопок обнаружены старые окаменелости, напоминающие останки [Root.Owner.GetSpeciesName&gen]. Очень старые. Первичное секвенирование ДНК выявило сходство между нашим геномом и окаменевшим материалом и подтвердило, что перед нами останки вида, от которого мы произошли. Ещё глубже в комплексе археологи нашли руины, по всей видимости, древнего тронного зала, окружённого обширными помещениями, в которых находились §Y$building_clone_army_clone_vat_plural$§!.\n\nТексты из тронного зала вместе с данными ДНК подтвердили предположения о назначении фабрик. В них подробно описан план действий на случай гибели Великого хана или ханского общества. Судя по возрасту окаменелостей и архитектуры, наши §YДревние фабрики клонов§! были сооружены более тысячи лет назад. Но мы пока не знаем, был ли этот чрезвычайный план действительно приведён в действие... или же он попросту не удался.\n\nЭто заставляет взглянуть на многое иначе."
 clones_barbaric_despoiler.12.tooltip:0 "Это подтверждает наше предназначение как народа Великого хана."
 clones_barbaric_despoiler.12.vats:0 "Вместимость §Y$building_clone_army_clone_vat$§! §Gувеличена§!"
 clones_barbaric_despoiler.13.desc:0 "Весть о находках на раскопках, доказавших, что мы — клоны древнего народа §HВеликого хана§!, начинает распространяться повсюду.\n\nОт очевидного вывода трудно отмахнуться: План Великого хана заключался в том, чтобы сохранить клонов ханского общества, которые однажды смогут вернуть утраченную цивилизацию предтеч."
 clones_barbaric_despoiler.13.a:0 "Да. Наша судьба — служить делу Великого хана."
 clones_barbaric_despoiler.16.desc:0 "Несколько высокопоставленных офицеров публично заявили о поддержке древнего Великого хана.\n\nВ широко транслировавшемся обращении они воздают должное мужеству и мудрости, с которыми была раскрыта правда о Плане Великого хана, а также доверию, оказанному им и всему нашему народу. Общая цель — вернуть цивилизацию предтеч — дала им уверенность и ясное направление.\n\nПо всему государству жители празднуют и одобряют принятое решение."
 origin_galactic_doorstep:0 "На пороге галактики"
 story.7.name:0 "Контакт: загадочные покорители космоса"
 PrimPlay_situation_event.1100.title:0 "[root.GetName]: варп-двигатель набирает мощность"
 PrimPlay_situation_event.1100.desc:0 "Сверхсветовой двигатель древнего корабля-ковчега гудит от накопленной энергии и уже почти готов перенести нас в соседнюю систему.\n\nОтправить инженерную группу и подготовить процедуру отключения или позволить варп-двигателю сработать?"
 PrimPlay_situation_event.1100.deactivate:0 "Отправить инженерную группу для принудительного отключения."
 PrimPlay_situation_event.1100.materialist:0 "Начать протоколы отключения."
 PrimPlay_situation_event.1100.spiritualist:0 "Приготовиться к ритуалу умиротворения!"
 PrimPlay_situation_event.1100.civic_machine_cult.deactivate:0 "Умиротворить Дух Машины..."
 PrimPlay_situation_event.1100.civic_machine_cult.activate:0 "Дух Машины ГОВОРИТ!!!"
