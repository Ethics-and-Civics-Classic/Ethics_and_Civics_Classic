 nations.17263.desc:1 "На [Root.GetName&prep] произошло очередное нападение! Инопланетяне [Root.Owner.GetSubMantleLower] вышли из новых туннелей прямо в центре одного из наших крупных поселений. Они подавили местную оборону и перебили колонистов. Отступая в туннели, чужаки утащили под землю нескольких уцелевших, кричавших от ужаса."
 nations.17263.a:0 "Эти убийства не останутся без ответа."
 nations.17264.name:0 "Пещера уцелевших"
 nations.17264.desc:1 "Наши войска на [Root.GetName&prep] продолжают картографировать сеть туннелей под колонией. Они обнаружили крупный город, успевший изолироваться от остального подземного государства ещё до того, как мы заполнили туннели нервно-паралитическим газом. Внутри остаются миллионы перепуганных жителей. Следует ли нашим инженерам обрушить пещеру и довести дело до конца?"
 nations.17264.a:0 "Да. Избавьте их от мучений."
 nations.17264.b:0 "Нет! Вытащите их на поверхность, пусть служат нам."
 nations.17264.b.subterranean:0 "Нет! Доставьте их в колонию, пусть служат нам."
 nations.17265.name:1 "Экспансия: [Root.Owner.GetSubMantleUpper]"
 nations.17265.desc:0 "Мы закончили нейтрализацию нервно-паралитического газа и уборку тел инопланетян из сети туннелей на [Root.GetName&prep]. Теперь нашим колонистам должно быть безопасно туда переселиться. Разумеется, оставленные чужаками примитивные города будут снесены и заменены нашей более совершенной архитектурой."
 nations.17266.name:0 "Золото!"
 nations.17266.desc:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим подземным инопланетянам. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.17266.desc.subterranean:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим обитателям магмы. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.17267.name:0 "Сокровищница"
 nations.17267.desc:0 "Разведчики, обследующие сеть туннелей на [Root.GetName&prep], проникли в царский дворец бывшей столицы подземного государства. Труп того, кого местные считали императором, до сих пор восседает на массивном троне в парадном зале.\n\nПодорвав двери дворцовой сокровищницы, разведчики обнаружили внутри золото и странные произведения инопланетного искусства. Искусство отправят в музеи на [From.Owner.Capital.GetName&acc], а продажа золота заметно пополнит государственный бюджет."
 nations.17268.name:0 "Инцидент с [From.GetName&inst]"
 nations.17268.desc:1 "Дипломатический скандал разгорелся после того, как наш §Yпосланник§! проявил неуважение к местному правителю. [From.GetRulerName] теперь требует показательного суда: посланника уже бросили в тюрьму, а палач ждёт приговора.\n\nМы можем потребовать соблюдения §Hдипломатической неприкосновенности§!, но это вызовет серьёзные §Rдипломатические последствия§!."
 nations.17268.a:0 "Потребовать соблюдения дипломатической неприкосновенности! Посланник нужен нам живым."
 nations.17268.b:0 "Не вмешиваться в казнь. Мы не можем рисковать последствиями..."
 nations.17269.name:0 "Голод в [From.GetName&prep]"
 nations.17269.desc:1 "К нам прибыл представитель §H[From.GetName&gen]§!. Похоже, страна переживает тяжёлые времена и оказалась перед угрозой §Rголода§!.\n\nОни умоляют помочь всем, чем мы можем..."
 nations.17269.a:0 "Конечно. Мы поможем им, чем сможем."
 nations.17269.b:0 "Пусть сами о себе позаботятся."
 nations.17269.c:0 "У нас нет лишней еды..."
 ethic_fanatic_spiritualist_nation_pleased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Gулучшатся§!. Принцип государства: §H$ethic_spiritualist$§!."
 ethic_fanatic_spiritualist_nation_displeased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Rухудшатся§!. Принцип государства: §H$ethic_spiritualist$§!."
 nations.17270.name:0 "Дар спиритуалистского государства"
 nations.17270.desc:0 "В знак дружбы между нашими цивилизациями посланник §H[FROM.GetName&gen]§! поделился исследованиями по теме §Y«$tech_psionic_theory$»§!."
 nations.17270.a:0 "Урок о Покрове? Как любезно."
 nations.17270.materialist:0 "Спиритуалистская чепуха."
 nations.17271.name:1 "Преследование атеистов"
 nations.17271.desc:0 "Группа §Yбеженцев-материалистов§! спасается от преследований в §H[FROM.GetName&prep]§!. За ними по пятам идёт армия инквизиторов, и беглецы просят у нас убежища и защиты.\n\nЕсли принять их, это крайне разгневает местное духовенство. Кроме того, присутствие беженцев может придать сил §Pматериалистскому движению§! внутри нашего государства."
 nations.17271.a:0 "Пусть присоединяются к нашим колонистам, если захотят."
 nations.17271.b:0 "Политический инцидент нам не нужен. Отправьте их обратно."
 nations.17271.xenophobe:0 "Чужакам здесь не место."
 nations.17271.civic_fanatic_purifiers:0 "Убивать всех без разбора."
 ethic_fanatic_spiritualist_nation_refugees:0 "К нашему государству присоединяются §G800§! £pop£ поселений вида §Y[FROM.GetSpeciesNamePlural&gen]§!. Принцип новых жителей: §Y$ethic_materialist$§!."
 nations.17272.name:0 "Культурный обмен со спиритуалистским государством"
 nations.17272.desc:1 "Несколько наших посланников вернулись после долгого пребывания среди жителей §H[FROM.GetName&gen]§!. Они хорошо изучили местные обычаи и уклад жизни, что, несомненно, поможет нашим социологическим исследованиям.\n\nНо вместе с чужой культурой приходят и чужие идеи... разрешим ли мы §Hсвободный обмен§!?"
 nations.17272.a:0 "Пусть наши народы свободно обмениваются товарами и идеями."
 nations.17272.b:0 "Мы будем строго контролировать всё, что пересекает границу."
 nations.17273.name:1 "Трагедия у границы [From.GetName&gen]"
 nations.17273.desc:1 "У границы §H[FROM.GetName&gen]§! произошёл §Rтрагический случай§!. Ракета, направлявшаяся в космос, потеряла тягу в полёте и рухнула на одно из наших соседних поселений.\n\nНаши жители требуют публично осудить соседей за халатность. Но если проявить великодушие, соседи останутся должны нам §Gодолжение§!."
 nations.17273.nomad:1 "У границы §H[FROM.GetName&gen]§! произошёл §Rтрагический случай§!. Обычная ремонтная операция закончилась катастрофой: небесный док рухнул на одно из наших соседних поселений.\n\nНаши жители требуют публично осудить соседей за халатность. Но если проявить великодушие, соседи останутся должны нам §Gодолжение§!."
 nations.17273.a:0 "Простим им эту ошибку."
 nations.17273.b:0 "Мы должны потребовать возмещения!"
 nations.17274.name:0 "Запрос технологий"
 nations.17274.desc:1 "Узнав о наших достижениях в пограничной медицине (§Y$tech_frontier_health$§!), несколько посланников §H[FROM.GetName&gen]§! попросили поделиться медицинскими технологиями.\n\nНаши учёные сомневаются: это отвлечёт финансирование от собственных исследовательских приоритетов.\n\nЕсли отказать в помощи, местное духовенство сочтёт это кощунством против священного учения, и наши отношения ухудшатся."
 nations.17274.a:0 "Нужно сохранить нынешние приоритеты исследований."
 nations.17274.b:0 "Они наши друзья. Поделимся тем, чем можем."
 nations.17275.name:0 "Послание доставлено"
 nations.17275.desc:1 "В последнее время торговля с §H[FROM.GetName&inst]§! почти сошла на нет, а караваны оттуда появляются всё реже. Сегодня мы получили сообщение от представителя местных вооружённых сил. Похоже, там очень недовольны."
 nations.17275.a:0 "Посмотрим, что там."
 nations.17276.name:0 "Послание"
 nations.17276.desc:0 "Поверхностник. Мы пытались быть добрыми соседями, но теперь ясно: вы не намерены оказывать нашей великой цивилизации должного уважения.\n\nОтныне этот мир по праву принадлежит нам целиком. Мы заберём его силой!"
 nations.17276.a:0 "Укрепить границу с §H[FROM.GetName&inst]§!!"
 nations.17277.name:0 "Государство [FROM.GetName] предлагает объединение"
 nations.17277.desc:0 "Во многом наши взгляды совпадают, [ROOT.GetName]. Мы предлагаем официально §Gобъединить§! два национальных государства в §Hединую державу§!."
 nations.17277.merge.fanatic:0 "Наши принципы почти едины, как и наши цели. Пора объединиться."
 nations.17277.merge.normal:0 "Наши принципы близки, а отношения давно стали дружескими. Пора объединиться."
 nations.17277.merge.different:0 "Несмотря на различия в принципах, наши государства стали неразрывно связаны. Пора объединиться."
 nations.17277.no:0 "Сейчас мы не готовы к объединению."
 nations.18261.name:0 "Обрушение"
 nations.18261.desc:1 "С [Root.GetName&gen] пришли тревожные вести! Инопланетяне [Root.Owner.GetSubMantleLower], с которыми мы там воюем, обрушили грунт под целой армией, стоявшей у одного из входов в их туннели.\n\nНемногих солдат, переживших падение, чужаки перебили прежде, чем основные силы успели прийти им на помощь."
 nations.18261.a:0 "Они за это заплатят!"
 nations.18262.name:0 "Диверсионные группы"
 nations.18262.desc:0 "Инопланетяне, живущие под нашей колонией на [Root.GetName&prep], по ночам высылают из туннелей небольшие диверсионные группы. Их последняя атака уничтожила один из важнейших объектов колонии, а прежде чем наши силы успели отреагировать, налётчики скрылись под землёй."
 nations.18262.a:0 "Эти набеги нужно прекратить!"
 nations.18263.name:0 "Атака на поверхность"
 nations.18263.desc:1 "На [Root.GetName&prep] произошло очередное нападение! Инопланетяне [Root.Owner.GetSubMantleLower] вышли из новых туннелей прямо в центре одного из наших крупных поселений. Они подавили местную оборону и перебили колонистов. Отступая в туннели, чужаки утащили под землю нескольких уцелевших, кричавших от ужаса."
 nations.18263.a:0 "Эти убийства не останутся без ответа."
