 PrimPlayer_civic_scion_materialist_effects:0 "- ['concept_scion', £scion£ Наследник] ['concept_fallen_empire']-сюзерена\n- $HOME_SYSTEM$ соединена со столицей сюзерена ['concept_gateway']\n- §YМатериалистическая Угасшая империя§! присутствует в галактике независимо от настроек\n- Есть шанс получить могущественные дары от сюзерена\n- §WВо время§! §H$PrimPlayer_developing_hyperdrive_situation$§! §Wможет открыться возможность изучить§! §Y$tech_gateway_activation$§! §Wи§! §Y$tech_gateway_construction$§!"
 PrimPlayer_civic_scion_spiritualist_effects:0 "- ['concept_scion', £scion£ Наследник] ['concept_fallen_empire']-сюзерена\n- $HOME_SYSTEM$ соединена со столицей сюзерена ['concept_gateway']\n- §YСпиритуалистическая Угасшая империя§! присутствует в галактике независимо от настроек\n- Есть шанс получить могущественные дары от сюзерена\n- §WВо время§! §H$PrimPlayer_developing_hyperdrive_situation$§! §Wможет открыться возможность изучить§! §Y$tech_gateway_activation$§! §Wи§! §Y$tech_gateway_construction$§!"
 PrimPlayer_civic_the_obelisk_effects:0 "$NEW_LINE$Две досветовые цивилизации:$TABBED_NEW_LINE$- одна будет возвышена с происхождением §I$origin_payback$§!$TABBED_NEW_LINE$- другая будет возвышена с происхождением §I$origin_broken_shackles$§!$NEW_LINE$$HOMEWORLD$$TABBED_NEW_LINE$- $PLANETARY_MODIFIERS$ ['concept_PrimPlayer_the_obelisk']"
 PrimPlayer_gov_atomic_age:0 "Атомный век"
 PrimPlayer_gov_atomic_age_desc:0 "Эта цивилизация достигла уровня атомного века. Она уже овладела энергией атома, но ещё не вышла в космос. Ядерное оружие может быть широко распространено и в любой момент привести к внезапной гибели цивилизации."
 PrimPlayer_gov_early_space_age:0 "Ранний космический век"
 PrimPlayer_gov_early_space_age_desc:0 "Эта цивилизация вступила в ранний космический век. Вокруг её родного мира уже обращаются примитивные спутники, а первые пилотируемые экспедиции достигли низкой орбиты. Скоро она будет готова покинуть свой мир."
 PrimPlayer_gov_industrial_age:0 "Индустриальный век"
 PrimPlayer_gov_industrial_age_desc:0 "Эта цивилизация достигла уровня раннего индустриального века. Электричество и двигатели внутреннего сгорания постепенно входят в повседневную жизнь, а темпы урбанизации стремительно растут."
 PrimPlayer_gov_machine_age:0 "Машинный век"
 PrimPlayer_gov_machine_age_desc:0 "Эта цивилизация достигла уровня машинного века — позднего этапа индустриальной эпохи. Фабрики массово выпускают товары и транспорт, а воздушные путешествия становятся обычным явлением."
 PrimPlayer_gov_pre_industrial_age:0 "Доиндустриальный век"
 PrimPlayer_gov_pre_industrial_age_desc:0 "Эта цивилизация всё ещё живёт в доиндустриальную эпоху. До того дня, когда она сможет устремиться к звёздам, пройдёт ещё очень много времени."
 RT_PIRATE_CAPTAIN:0 "Пиратский капитан"
 RT_SHAREHOLDER:0 "Мажоритарный акционер"
 auth_cyber_creed_direct_democratic:0 "Божественная аугментократия"
 auth_cyber_creed_direct_democratic_desc:0 "В этой кибернетической демократии право голоса считается священным. Аугментированные граждане могут участвовать в бесчисленных политических решениях почти без посредников, превращая коллективную волю общества в непосредственную силу управления."
 auth_cyber_creed_direct_democratic_tt:0 "В этой кибернетической демократии право голоса считается священным. Аугментированные граждане могут участвовать в бесчисленных политических решениях почти без посредников, превращая коллективную волю общества в непосредственную силу управления."
 auth_cyber_direct_democratic_collectivist:0 "Распределённая взаимосвязь"
 auth_cyber_direct_democratic_collectivist_desc:0 "Интерфейсы сознания позволяют полноценным киборгам в реальном времени обмениваться ощущениями, эмоциональными реакциями и образами мышления. Эмоциональные фильтры отсеивают нежелательные всплески и защищают участников от перегрузки чужими переживаниями.\n\nБлагодаря этому их мнения и мысли напрямую, почти на подсознательном уровне, влияют на политические решения."
 auth_cyber_direct_democratic_collectivist_tt:0 "$auth_democratic_election_tt$\nКибернетические $pops_with_icon$ не зависят от счастья\n$unlock_edict_self_preservation_override$"
 auth_cyber_direct_democratic_individualist:0 "Прямой консенсус"
 auth_cyber_direct_democratic_individualist_desc:0 "Высокоразвитые протоколы нейробезопасности позволяют гражданам голосовать по политическим решениям непосредственно и в реальном времени. Их мнения и намерения напрямую влияют на формирование курса государства, почти устраняя необходимость в традиционных посредниках."
 auth_cyber_direct_democratic_individualist_tt:0 "$auth_democratic_election_tt$\n$unlock_edict_legislative_chorus$"
 auth_synth_direct_democratic_physical:0 "Прямой перенос"
 auth_synth_direct_democratic_physical_desc:0 "Эта форма правления обеспечивает беспрецедентную свободу перехода из одного синтетического тела в другое и готова нести дополнительные расходы, связанные с такой мобильностью."
