 building_fallout_shelter:0 "Противорадиационное убежище"
 building_fallout_shelter_desc:0 "Созданные ещё в атомном веке противорадиационные убежища обеспечивают общество всем необходимым для выживания после катастрофы."
 building_pirate_haven:0 "Пиратская вольная гавань"
 building_pirate_haven_2:0 "Пиратская вольная гавань"
 building_pirate_haven_2_desc:0 "Уединённый, скрытый от посторонних город на поверхности планеты, где пираты и прочие отбросы общества могут собираться, ремонтировать корабли и обмениваться байками."
 building_pirate_haven_desc:0 "Уединённый, скрытый от посторонних город на поверхности планеты, где пираты и прочие отбросы общества могут собираться, ремонтировать корабли и обмениваться байками."
 building_primitive_nuclear_plant:0 "Комплекс по обогащению урана"
 building_primitive_nuclear_plant_desc:0 "Огромный комплекс, где уран обогащают до расщепляющегося материала, используемого для ядерного оружия и атомной энергетики. Межзвёздным державам, перешедшим на термоядерную энергетику, такие сооружения почти не нужны."
 job_commandante_pirate_offworld:0 "Пиратский капитан за рубежом"
 job_commandante_pirate_offworld_desc:0 "Пиратский капитан за рубежом выступает необычным планетарным управляющим, устанавливая собственный порядок на мирах других государств. Его связи и незаконные доходы вплетаются в местную экономику, принося выгоду и ему, и принимающему миру."
 job_commandante_pirate_offworld_effect_desc:0 "£job_commandante_pirate_offworld£ $job_commandante_pirate_offworld_plural$ увеличивают $i_naval_capacity$ государства, создают £defense_army£ §Yоборонительные армии§!, повышают $r_stability$ на планете, снижают урон от §Yбомбардировки§! и производят небольшое количество $r_amenities$."
 job_commandante_pirate_offworld_plural:0 "Пиратские капитаны за рубежом"
 job_corrupt_healthcare:0 "Коррумпированный медработник"
 job_corrupt_healthcare_desc:0 "Эти фармацевтические работники выдают себя за обычный персонал клиник, но тайно торгуют незаконными препаратами на чёрном рынке в интересах крупного преступного синдиката."
 job_corrupt_healthcare_plural:0 "Коррумпированные медработники"
 job_gladiator_mercenary:0 "Гладиатор-наёмник"
 job_gladiator_mercenary_desc:0 "Обычно это раб, которого алчный хозяин сдаёт внаём для вооружённых боёв на арене, хотя среди них встречаются и свободные искатели заработка. Во время войны гладиаторы-наёмники присоединяются к вооружённым силам, выбирая того, кто платит больше.\n\n§R!§!"
 job_gladiator_mercenary_effect_desc:0 "£job_gladiator_mercenary£ $job_gladiator_mercenary_plural$ увеличивают $r_amenities$ и §Yвместимость флота§!, производят $r_trade$, создают §Yоборонительные армии§! и повышают привлекательность принципа £pops£ §H$ethic_militarist$§!."
 job_gladiator_mercenary_plural:0 "Гладиаторы-наёмники"
 job_high_techno_priest:0 "Верховный техножрец"
 job_high_techno_priest_desc:0 "Верховные техножрецы управляют сложными технологическими системами государственного управления, поддерживая их бесперебойную и слаженную работу."
 job_high_techno_priest_effect_desc:0 "£job_high_techno_priest£ $job_high_techno_priest_plural$ увеличивают $i_naval_capacity$ государства, создают £defense_army£ §Yоборонительные армии§!, повышают $r_stability$ на планете, снижают урон от §Yбомбардировки§! и производят небольшое количество $r_amenities$."
 job_high_techno_priest_plural:0 "Верховные техножрецы"
 job_mercenary_pirate:0 "Капер"
 job_mercenary_pirate_desc:0 "Пират, продающий свои боевые услуги за плату, но не состоящий ни в каких регулярных вооружённых силах."
