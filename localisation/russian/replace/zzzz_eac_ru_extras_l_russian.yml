 PrimPlay_situation_event.4110.desc:0 "Нам не удалось восстановить запасы ядерного топлива. После нескольких месяцев критического дефицита урана у нас не осталось выбора: пришлось остановить атомную энергетику и прекратить снабжение ядерных арсеналов."
 PrimPlay_situation_event.4110.desc.gestalt:0 "Не удалось восстановить баланс запасов ядерного топлива. После нескольких месяцев критического дефицита урана система снабжения была вынуждена перейти к масштабному перераспределению ресурсов."
 building_primitive_nuclear_plant_waste_effect:0 "Примитивные двигательные технологии не позволяют эффективно утилизировать ядерные отходы, выбрасывая их в дальний космос."
 situation_primitive_uranium_deficit:0 "Дефицит урана"
 situation_primitive_uranium_deficit_desc:0 "Запасы урана достигли критической отметки! Специалисты атомной отрасли в панике: надёжные поставки топливных стержней больше не гарантированы. Выработка атомной энергии и боевой дух вооружённых сил упали до исторического минимума.\n\nЧтобы восстановить запасы, необходимо построить §Y$building_primitive_nuclear_plant$§!!"
