 nations.20274.name:0 "Запрос технологий"
 nations.20274.desc:1 "Узнав о наших разработках в области робототехники (§Y$tech_robotic_workers$§!), представители §H[FROM.GetName&gen]§! попросили поделиться технологиями.\n\nНаши учёные сомневаются: у таких разработок есть очевидное военное применение. Если когда-нибудь дело дойдёт до войны, победить индустриалистское государство станет заметно сложнее.\n\nОтказ почти наверняка будет воспринят как оскорбление."
 nations.20274.a:0 "Передавать индустриалистскому государству боевых роботов — плохая идея."
 nations.20274.b:0 "Они наши друзья. Поделимся тем, чем можем."
