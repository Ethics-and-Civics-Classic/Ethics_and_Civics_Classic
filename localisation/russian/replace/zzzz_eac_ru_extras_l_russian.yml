 nations.22225.desc.nuclear_winter_situation:0 "Сначала в ночном небе вспыхнули мерцающие огоньки. А через несколько минут ночь внезапно сменилась ослепительным солнцем. Одно за другим национальные государства исчезали в ядерном огне, а из бункеров выбирались изуродованные выжившие, пытаясь вновь овладеть оставшимся им миром-могилой.\n\nНаше государство пострадало меньше остальных, но собрать уцелевшее население под единым знаменем будет непросто. Первым делом нам предстоит восстановить порядок."
