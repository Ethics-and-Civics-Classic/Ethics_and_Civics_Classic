 councilor_military_dictatorship_corporate:0 "Старпом Пиратского лорда"
 councilor_military_dictatorship_corporate_desc:0 "Старпом занимает постоянное место в Совете Пиратского лорда и отвечает за развёртывание пиратской армады."
 councilor_military_dictatorship_corporate_envoy:0 "Посланник пиратских капитанов"
 councilor_military_dictatorship_corporate_envoy_desc:0 "Пиратских капитанов представляет один посланник, занимающий место в Совете Пиратского лорда."
 councilor_relentless_industrialists_machine_cult:0 "Жрец священной добычи"
 councilor_relentless_industrialists_machine_cult_desc:1 "$TITLE$ готов эксплуатировать кого и что угодно, лишь бы исполнить замысел Священной Машины."
