 nations.9.a:0 "Итак, война началась."
 nations.9.desc:0 "Кризис перерос в открытое восстание. Мятежники отвергли власть прежнего правительства, заняли часть территории и сформировали собственное государство. Теперь спор о будущем мира будет решаться силой оружия."
 nations.9.title:0 "Восстание перерастает в войну"
 nations.90000.title:0 "Рост осведомлённости о внешнем мире"
 nations.90001.ethic_fanatic_militarist.desc.open_border:0 "Несколько воинов из [FROM.GetName&gen] прибыли обсудить пограничный режим между нашими государствами. Условия соглашения вырабатывались под грохот показательных боёв, и в конце концов стороны пришли к взаимоприемлемому порядку движения через границу.\n\nТеперь [ROOT.Ruler.GetName] готовится объявить итог переговоров между [ROOT.GetName&inst] и [FROM.GetName&inst]."
 nations.90001.title:0 "Переговоры об открытии границ"
 primitive_origin.146.alliance:0 "Вместе мы заставим МСИ расплатиться."
 primitive_origin.146.desc:0 "После первого обмена сообщениями с нами вновь связалась цивилизация, которая тоже столкнулась с $NAME_MSI_country$. Опыт научил их тому же, чему и нас: в одиночку против такого врага устоять трудно. Они предлагают закрепить сотрудничество формальным союзом и вместе готовиться к будущему столкновению с МСИ."
 primitive_origin.146.name:0 "Союз против МСИ"
 primitive_origin.146.reject:0 "Мы не готовы вступать в союз."
 primitive_origin.156.alliance:0 "Если Обелиск сделал нас целью, вместе мы станем опаснее для МСИ."
 primitive_origin.156.desc:0 "Истинное назначение Обелиска теперь известно: он был частью системы наблюдения $NAME_MSI_country$, предназначенной для поиска цивилизаций, которые можно обратить в источник прибыли и рабского труда. Те, кто раскрыл эту угрозу раньше нас, предлагают объединить силы и не позволить МСИ повторить случившееся."
 primitive_origin.156.name:0 "Тайна Обелиска и общий враг"
 primitive_origin.156.reject:0 "Мы сами определим свою судьбу."
 random_primitive_events.2.desc.home_pc_nuked:0 "§Y[Root.Leader.GetName]§! возглавляет экспедицию, обнаружившую ещё один мир, опалённый ядерной войной. Его пейзажи болезненно напоминают нашу собственную родину после катастрофы, но даже здесь жизнь всё ещё возможна. Это мрачное открытие — и доказательство того, что даже после огня мир может получить второй шанс."
 random_primitive_events.2.desc.pc_nuked:0 "§Y[Root.Leader.GetName]§! возглавляет экспедицию, обнаружившую опустошённый мир, который сначала сочли безнадёжно мёртвым. Однако дальнейшие исследования показали: жизнь здесь всё ещё возможна, пусть и на самом пределе. Остаётся вопрос — захочет ли кто-нибудь однажды назвать эту планетарную могилу домом?"
 random_primitive_events.2.option.home_pc_nuked:0 "Мы уже знаем: даже могила может снова стать домом."
 random_primitive_events.2.option.pc_nuked:0 "Когда-то это был дом. Теперь — лишь могила."
 random_primitive_events.2002.desc:0 "К созданному нами атмосферному пастбищу приблизились огромные космические существа. Их миграция явно не случайна: они используют этот мир как место кормёжки и, похоже, способны воспринимать наши сигналы. Учёные предлагают воспользоваться редкой возможностью и попытаться установить контакт с тиянки."
 random_primitive_events.2002.option:0 "Попробуем установить контакт."
 random_primitive_events.2002.title:0 "Гости из межзвёздной пустоты"
 random_primitive_events.2002.works:0 "Они отвечают! Продолжить передачу."
 random_primitive_events.215.title:0 "Развитие промышленной базы"
 civic_tooltip_civic_barbaric_despoilers:0 "Есть гражданская модель §Y$civic_barbaric_despoilers$§!"
