 EaC_underground_railroad_expanded_desc:0 "Сеть Подземной железной дороги распространилась по всей планете. Многочисленные убежища помогают рабам скрываться и покидать этот мир."
 EaC_underground_railroad_smuggling:0 "Освобождение рабов"
 EaC_worker_commune:0 "Рабочая коммуна"
 EaC_worker_commune_desc:0 "Рабочие планеты захватили достаточно имущества, чтобы создать самодостаточные автономные зоны и положить конец ущемлению трудящихся."
 EaC_worker_commune_means_of_production:0 "Средства производства захвачены"
