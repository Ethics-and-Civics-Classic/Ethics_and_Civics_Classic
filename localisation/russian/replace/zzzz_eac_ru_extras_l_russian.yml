 nations.14276.desc:0 "Поверхностник. Мы пытались быть добрыми соседями, но теперь ясно: вы не намерены оказывать нашей великой цивилизации должного уважения.\n\nОтныне этот мир по праву принадлежит нам целиком. Мы заберём его силой!"
 nations.14276.a:0 "Укрепить границу с §H[FROM.GetName&inst]§!!"
