 EMPIRE_DESIGN_korinth_conglomerate:0 "Конгломерат «Коринт»&!masc|||gen:Конгломерата «Коринт»|||dat:Конгломерату «Коринт»|||acc:Конгломерат «Коринт»|||inst:Конгломератом «Коринт»|||prep:Конгломерате «Коринт»"
 EMPIRE_DESIGN_korinth_conglomerate_desc:0 "Первые спутники, построенные ООО «Коринт Коммуникации», вычислили, что траектория блуждающей планеты приведёт к столкновению с их родным миром. Эта новость объединила планету: общество доверило «Коринт Коммуникации» возглавить проект строительства орбитальных поселений. Компания превратила свои станции в узнаваемый бренд, полюбившийся людям, а другие фирмы выстроились в очередь за франшизами на их строительство. Вскоре поселения охватили всю звёздную систему, а смешение их обществ породило бурный культурный обмен.\n\nОднако сбои в синхронизации спутников, удары метеоритов, юридические споры, расходы на обслуживание и отсутствие единых стандартов сделали поддержку сетей связи почти невозможной. Ради упрощения «Коринт Коммуникации» назначили единственным оператором спутниковой связи. Никто не понимал, какую власть даст компании этот рычаг — и какой контракт им предстоит подписать...\n\nОдин за другим франчайзи лишались активов: сборы удваивались, акции скупались, собственность поглощалась — пока всё не оказалось в руках одной организации. Теперь, под новым именем «Конгломерат Коринт», эта мегакорпорация намерена бесконечно расширять свои владения по всей галактике с помощью той же модели франчайзинга."
 EMPIRE_DESIGN_united_workers_steel_conglomerate:0 "Сталелитейный конгломерат объединённых рабочих&!masc|||gen:Сталелитейного конгломерата объединённых рабочих|||dat:Сталелитейному конгломерату объединённых рабочих|||acc:Сталелитейный конгломерат объединённых рабочих|||inst:Сталелитейным конгломератом объединённых рабочих|||prep:Сталелитейном конгломерате объединённых рабочих"
 EMPIRE_DESIGN_united_workers_steel_conglomerate_desc:0 "Мы, трудящиеся Киберстана, имеем право защищать рабочих от эгоистичных капиталистов. Никто больше не будет страдать так, как страдали мы под гнётом корпораций! Рабочие, объединяйтесь!"
 EMPIRE_DESIGN_yldarian_raider_clan:0 "Илдарийский клан налётчиков&!masc|||gen:Илдарийского клана налётчиков|||dat:Илдарийскому клану налётчиков|||acc:Илдарийский клан налётчиков|||inst:Илдарийским кланом налётчиков|||prep:Илдарийском клане налётчиков"
 EMPIRE_DESIGN_yldarian_raider_clan_desc:0 "Происхождение илдарийцев неизвестно, но устные предания утверждают, что некогда древняя цивилизация-предтеча генетически создала их как воинскую касту. Их прежние хозяева давно мертвы; теперь кланы Илдари объединились и обращают взор к другим мирам в поисках новой добычи. Илдарийцы — исключительно мужской вид и не способны размножаться естественным путём, поэтому для продолжения рода зависят от древних фабрик клонов. Но у этого есть и преимущество: они были созданы идеальными воинами. Так возникла гордая культура, в которой черновой труд считается уделом рабов."
