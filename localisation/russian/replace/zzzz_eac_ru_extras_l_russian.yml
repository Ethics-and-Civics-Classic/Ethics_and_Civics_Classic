 nations.16277.desc:0 "Во многом наши взгляды совпадают, [ROOT.GetName]. Мы предлагаем официально §Gобъединить§! два национальных государства в §Hединую державу§!."
 nations.16277.merge.fanatic:0 "Наши принципы почти едины, как и наши цели. Пора объединиться."
 nations.16277.merge.normal:0 "Наши принципы близки, а отношения давно стали дружескими. Пора объединиться."
 nations.16277.merge.different:0 "Несмотря на различия в принципах, наши государства стали неразрывно связаны. Пора объединиться."
 nations.16277.no:0 "Сейчас мы не готовы к объединению."
