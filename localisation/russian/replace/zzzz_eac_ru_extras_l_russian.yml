 decision_civilian_local_colony_cruise:0 "Отправить в первый рейс"
 decision_civilian_local_colony_cruise_desc:0 "$civilian_local_colony_cruise$ отправится в первый обзорный рейс по системе §Y[solar_system.GetName]§!."
 decision_civilian_local_colony_cruise_pop_cost:0 "§R500§! £pops£ покинут §Y[Root.GetName&acc]§!."
 decision_civilian_local_colony_cruise_return:0 "Отозвать круизный лайнер"
 decision_civilian_local_colony_cruise_return_desc:0 "Пассажиры на борту $civilian_local_colony_cruise$ вернутся на §Y[Root.GetName&acc]§! после экскурсии по системе."
