 EaC_civic_mechanic_events.103.desc.commander_imperial:0 "Извилистые лестницы военного крыла ведут к архивам, где за бесчисленные эпохи накопились труды по стратегии и военному искусству. Ряды голокниг посвящены всем видам войны — на суше, в воздухе, на море, на орбите и в открытом космосе.\n\n"
 EaC_civic_mechanic_events.103.desc.commander_imperial_is_memorialist_empire:0 "Извилистые лестницы военного крыла ведут к архивам, где за бесчисленные эпохи накопились труды по стратегии и военному искусству. Ряды голокниг посвящены всем видам войны — на суше, в воздухе, на море, на орбите и в открытом космосе.\n\nВ глубинных залах Хранилища скрыт древний комплекс с устройством, способным внедрять часть его библиотеки в разум правителя. §BКоролевская палата§! хранит воспоминания всего правящего рода и тщательно оберегается, чтобы однажды передать их следующему поколению.\n\nСегодня священный день: §Y[Root.GetHeirName]§! получает титул «[Root.GetHeirTitle]» и становится свидетелем §Gкоронации памяти§!. §Y[ROOT.GetLeaderName]§! проходит обряд, принимая память предшественника и вливаясь в сознание предков, которое продолжает жить в их потомках."
 EaC_civic_mechanic_events.103.desc.commander_hive_is_memorialist_empire:0 "Извилистые лестницы военного крыла ведут к архивам, где за бесчисленные эпохи накопились труды по стратегии и военному искусству. Ряды голокниг посвящены всем видам войны — на суше, в воздухе, на море, на орбите и в открытом космосе.\n\nВ глубинных залах Хранилища находится кора памяти улья. Через специальный проводник она внедряет часть архивной библиотеки в правящий разум. Эта §Bкора памяти улья§! хранит воспоминания всех существ, когда-либо входивших в состав улья.\n\nИз-за сложности создания проводников §Y[ROOT.GetLeaderName]§! может проходить §Gпереливание памяти§! лишь раз в несколько десятилетий."
 EaC_civic_mechanic_events.103.desc.commander_megacorp:0 "Извилистые лестницы военного крыла ведут к архивам, где за бесчисленные эпохи накопились труды по стратегии и военному искусству. Ряды голокниг посвящены всем видам войны — на суше, в воздухе, на море, на орбите и в открытом космосе.\n\nВ глубинных залах Хранилища расположена штаб-квартира [ROOT.GetName&gen]. Здесь находится древнее устройство, способное внедрять часть архивной библиотеки в чужой разум, но для него требуется особый проводник, изготовление которого занимает десятилетия. Поэтому с деловой точки зрения именно §Y[ROOT.GetLeaderName]§! лучше всего подходит для §Gпереливания памяти§!. Накопленная мудрость поможет приумножать кредиты и вести [ROOT.GetName&acc] к процветанию!"
 EaC_civic_mechanic_events.103.desc.commander_machine_is_memorialist_empire:0 "Извилистые лестницы военного крыла ведут к архивам, где за бесчисленные эпохи накопились труды по стратегии и военному искусству. Ряды голокниг посвящены всем видам войны — на суше, в воздухе, на море, на орбите и в открытом космосе.\n\nВ глубинных залах Хранилища находится древнее ядро памяти. Через специальный проводник оно внедряет часть архивной библиотеки в правящий разум. Это §Bдревнее ядро памяти§! хранит накопленный опыт всех единиц, когда-либо входивших в сеть.\n\nИз-за сложности изготовления проводников §Y[ROOT.GetLeaderName]§! может проходить §Gпереливание памяти§! лишь раз в несколько десятилетий."
 EaC_civic_mechanic_events.103.desc.scientist_elected:0 "Извилистые лестницы научного крыла ведут к архивам, где за бесчисленные эпохи накопились научные теории и законы, сведения о свойствах материалов, математические доказательства и бесчисленные другие знания. Во внутренних залах находится древнее устройство, способное внедрить часть библиотеки Хранилища в разум избранного.\n\nНа создание проводника для переливания памяти уходит десятилетие, и после каждого использования его приходится расширять. Поэтому именно §Y[ROOT.GetLeaderName]§! получает право пройти §Gпереливание памяти§!. Пусть обретённые знания ведут [ROOT.GetName&acc] вперёд!"
 EaC_civic_mechanic_events.103.desc.scientist_elected_20:0 "Извилистые лестницы научного крыла ведут к архивам, где за бесчисленные эпохи накопились научные теории и законы, сведения о свойствах материалов, математические доказательства и бесчисленные другие знания. Во внутренних залах находится древнее устройство, способное внедрить часть библиотеки Хранилища в разум избранного.\n\nНа создание проводника для переливания памяти уходят десятилетия, и после каждого использования его приходится расширять. Поэтому именно §Y[ROOT.GetLeaderName]§! получает право пройти §Gпереливание памяти§!. Пусть обретённые знания ведут [ROOT.GetName&acc] вперёд!"
 EaC_civic_mechanic_events.103.desc.scientist_dictator:0 "Извилистые лестницы научного крыла ведут к архивам, где за бесчисленные эпохи накопились научные теории и законы, сведения о свойствах материалов, математические доказательства и бесчисленные другие знания.\n\nВо внутренних залах находится древнее устройство, способное внедрить часть библиотеки Хранилища в разум избранного. На создание проводника для переливания памяти уходят десятилетия, поэтому право пройти §Gпереливание памяти§! получает §Y[ROOT.GetLeaderName]§!. Пусть обретённые знания поведут [ROOT.GetName&acc] вперёд!"
 EaC_civic_mechanic_events.103.desc.scientist_dictator_is_memorialist_empire:0 "Извилистые лестницы научного крыла ведут к архивам, где за бесчисленные эпохи накопились научные теории и законы, сведения о свойствах материалов, математические доказательства и бесчисленные другие знания.\n\nВ глубинных залах Хранилища скрыт тайный комплекс с древним устройством, способным внедрять часть его библиотеки в разум правителя. §BПалата власти§! хранит воспоминания всех прежних правителей государства.\n\nСегодня §Y[ROOT.GetLeaderName]§! проходит торжественное §Gпереливание памяти§! и становится продолжением предшественника, сливаясь с единым сознанием, живущим через череду преемников."
 EaC_civic_mechanic_events.103.desc.scientist_imperial:0 "Извилистые лестницы научного крыла ведут к архивам, где за бесчисленные эпохи накопились научные теории и законы, сведения о свойствах материалов, математические доказательства и бесчисленные другие знания.\n\nВо внутренних залах находится древнее устройство, способное внедрить часть библиотеки Хранилища в разум избранного. На создание проводника для переливания памяти уходят десятилетия, поэтому наследственное право на §Gпереливание памяти§! получает §Y[ROOT.GetLeaderName]§!. Пусть обретённые знания поведут [ROOT.GetName&acc] вперёд!"
 EaC_civic_mechanic_events.103.desc.scientist_imperial_is_memorialist_empire:0 "Извилистые лестницы научного крыла ведут к архивам, где за бесчисленные эпохи накопились научные теории и законы, сведения о свойствах материалов, математические доказательства и бесчисленные другие знания.\n\nВ глубинных залах Хранилища скрыт древний комплекс с устройством, способным внедрять часть его библиотеки в разум правителя. §BКоролевская палата§! хранит воспоминания всего правящего рода и тщательно оберегается, чтобы однажды передать их следующему поколению.\n\nСегодня священный день: §Y[Root.GetHeirName]§! получает титул «[Root.GetHeirTitle]» и становится свидетелем §Gкоронации памяти§!. §Y[ROOT.GetLeaderName]§! проходит обряд, принимая память предшественника и вливаясь в сознание предков, которое продолжает жить в их потомках."
 EaC_civic_mechanic_events.103.desc.scientist_hive_is_memorialist_empire:0 "Извилистые лестницы научного крыла ведут к архивам, где за бесчисленные эпохи накопились научные теории и законы, сведения о свойствах материалов, математические доказательства и бесчисленные другие знания.\n\nВ глубинных залах Хранилища находится кора памяти улья. Через специальный проводник она внедряет часть архивной библиотеки в правящий разум. Эта §Bкора памяти улья§! хранит воспоминания всех существ, когда-либо входивших в состав улья.\n\nИз-за сложности создания проводников §Y[ROOT.GetLeaderName]§! может проходить §Gпереливание памяти§! лишь раз в несколько десятилетий."
 EaC_civic_mechanic_events.103.desc.scientist_megacorp:0 "Извилистые лестницы научного крыла ведут к архивам, где за бесчисленные эпохи накопились научные теории и законы, сведения о свойствах материалов, математические доказательства и бесчисленные другие знания.\n\nВ глубинных залах Хранилища расположена штаб-квартира [ROOT.GetName&gen]. Здесь находится древнее устройство, способное внедрять часть архивной библиотеки в чужой разум, но для него требуется особый проводник, изготовление которого занимает десятилетия. Поэтому с деловой точки зрения именно §Y[ROOT.GetLeaderName]§! лучше всего подходит для §Gпереливания памяти§!. Накопленная мудрость поможет приумножать кредиты и вести [ROOT.GetName&acc] к процветанию!"
 EaC_civic_mechanic_events.103.desc.scientist_machine_is_memorialist_empire:0 "Извилистые лестницы научного крыла ведут к архивам, где за бесчисленные эпохи накопились научные теории и законы, сведения о свойствах материалов, математические доказательства и бесчисленные другие знания.\n\nВ глубинных залах Хранилища находится древнее ядро памяти. Через специальный проводник оно внедряет часть архивной библиотеки в правящий разум. Это §Bдревнее ядро памяти§! хранит накопленный опыт всех единиц, когда-либо входивших в сеть.\n\nИз-за сложности изготовления проводников §Y[ROOT.GetLeaderName]§! может проходить §Gпереливание памяти§! лишь раз в несколько десятилетий."
 EaC_civic_mechanic_events.103.desc.civic_heroic_tales.official:0 "В [ROOT.GetName&prep] власть неотделима от памяти о героях прошлого. Теперь §Y[ROOT.GetLeaderName]§! приходит к власти, и летописцы с ораторами уже проводят параллели между новым правителем и величайшими государственными деятелями нашей истории. Остаётся доказать, что эти сравнения были не напрасны."
 EaC_civic_mechanic_events.103.desc.civic_heroic_tales.commander:0 "Военные предания [ROOT.GetName&gen] хранят имена полководцев, чьи подвиги стали мерилом доблести для многих поколений. Теперь §Y[ROOT.GetLeaderName]§! принимает власть, а вместе с ней — тяжесть этого наследия. Если история потребует новых героев, их деяния начнутся сегодня."
 EaC_civic_mechanic_events.103.desc.civic_heroic_tales.scientist:0 "История [ROOT.GetName&gen] чтит не только завоевателей и правителей, но и тех, кто расширял границы познания. §Y[ROOT.GetLeaderName]§! приходит к власти под взорами поколений исследователей, чьи открытия когда-то изменили наш мир. Возможно, теперь к ним добавится ещё одно великое имя."
 EaC_civic_mechanic_events.103.desc.other:0 "§RОдин из ваших модов требует патча совместимости с§! §YEthics and Civics Classic§!§R!§!\n\nКонфликт вызван формой правления, которой нет ни в Ethics and Civics Classic, ни в ванильной игре. Запросить совместимость можно у разработчика Ethics and Civics Classic."
 EaC_civic_mechanic_events.103.option.official_elected_a:0 "Пусть §Y[ROOT.GetLeaderName]§! получит знания, необходимые для следующего срока."
 EaC_civic_mechanic_events.103.option.official_elected_20_a:0 "Пусть §Y[ROOT.GetLeaderName]§! получит знания, необходимые для руководства советом."
