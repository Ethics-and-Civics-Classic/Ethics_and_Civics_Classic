 space_critter_feeding_ground:0 "Атмосферная кормовая зона"
 space_critter_feeding_ground_desc:0 "Обычно газовые гиганты способны поддерживать жизнь лишь на микроскопическом уровне, однако этот мир превратился в кормовую зону для гигантских межзвёздных организмов.\n\nБлагодаря этому здесь возникла своеобразная процветающая экосистема: космические существа регулярно останавливаются и «пасутся» в верхних слоях атмосферы."
 trait_latent_psionic_machine_desc:0 "§LЭти машины обладают скрытыми псионическими способностями, которые у большинства единиц остаются в латентном состоянии. Хотя подобные проявления редки, время от времени эта сила всё же пробуждается.§!\n"
 EaC_operation_complete_establish_underground_railroad:0 "Подземная железная дорога создана"
 celestial_chart_modifier_desc:0 "Жажда открытий охватила общество, устремившее взгляд к звёздам и неизведанным мирам."
 job_fe_hedonist_tourist:0 "Турист"
 job_fe_hedonist_tourist_plural:0 "Туристы"
 EaC_operation_establish_underground_railroad_desc:3 "Наши оперативники соберут сведения о различных мирах государства §Y[This.Target.GetName&gen]§! и по завершении предоставят отчёт с §Yразведданными§!. Они создадут сеть убежищ и тайных маршрутов, по которым местные жители смогут спасаться от угнетения. Это надолго повысит наш §Yмаксимальный уровень внедрения§!.\n\nПриписанные к операции §Yактивы§! могут повлиять на её исход в соответствии со своими интересами."
 EaC_operation_establish_underground_railroad_no_dlc_desc:2 "Наши оперативники соберут сведения о различных мирах государства §Y[This.Target.GetName&gen]§! и по завершении предоставят отчёт с §Yразведданными§!. Они создадут сеть убежищ и тайных маршрутов, по которым местные жители смогут спасаться от угнетения. Это надолго повысит наш §Yмаксимальный уровень внедрения§!."
 NAME_Early_Civilian_Trade_Freighter_NoDrive:0 "Гражданский грузовой корабль"
 NAME_Pre_FTL_Civilian_Trade_Freighter:0 "Досветовой гражданский грузовой корабль"
 PrimPlayer_operation_acquire_asset:0 "Получить актив"
 PrimPlayer_operation_acquire_asset_desc:1 "За определённую цену мы можем склонить к сотрудничеству тех, кто нам нужен, — убеждением, давлением или принуждением — и получить ценные активы для разведывательных операций.\n\nПриписанные к операции §Yактивы§! могут повлиять на её исход в соответствии со своими интересами."
 PrimPlayer_operation_diplomatic_incident:0 "Спровоцировать дипломатический инцидент"
 PrimPlayer_operation_diplomatic_incident_desc:0 "Мы попытаемся спровоцировать неловкую ситуацию, используя уязвимые места их дипломатического корпуса."
 PrimPlayer_operation_extort_favors:0 "Вымогать одолжения"
 PrimPlayer_operation_extort_favors_desc:0 "Шантаж и вымогательство способны дать нашим дипломатам немало полезных рычагов."
 PrimPlayer_operation_gather_information:0 "Сбор информации"
 PrimPlayer_operation_gather_information_desc:3 "Наши оперативники соберут информацию о §Y[This.Target.GetName&prep]§! и по завершении предоставят отчёт с §Yразведданными§!. Выявленные слабые места будут использованы для временного увеличения §Yмаксимального уровня внедрения§!.\n\nПриписанные к операции §Yактивы§! могут повлиять на её исход в соответствии со своими интересами."
 PrimPlayer_operation_locate_strategic_targets_desc:3 "Наши оперативники соберут сведения о расположении стратегических объектов на территории §Y[This.Target.GetName&gen]§! и по завершении предоставят отчёт с §Yразведданными§!. Они также выявят возможные стратегические цели, включая военную инфраструктуру, и надолго повысят наш §Yмаксимальный уровень внедрения§!.\n\nПриписанные к операции §Yактивы§! могут повлиять на её исход в соответствии со своими интересами."
 PrimPlayer_operation_locate_strategic_targets_no_dlc_desc:2 "Наши оперативники соберут сведения о расположении стратегических объектов на территории §Y[This.Target.GetName&gen]§! и по завершении предоставят отчёт с §Yразведданными§!. Они также выявят возможные стратегические цели, включая военную инфраструктуру, и надолго повысят наш §Yмаксимальный уровень внедрения§!."
 PrimPlayer_operation_locate_strategic_targets_no_dlc_desc.nuclear:2 "Наши оперативники соберут сведения о расположении стратегических объектов на территории §Y[This.Target.GetName&gen]§! и по завершении предоставят отчёт с §Yразведданными§!, дополнительно повысив наш §Yмаксимальный уровень внедрения§!. Они также выявят возможные стратегические цели, включая военную инфраструктуру, что позволит наносить §Gупреждающие удары§! по §Yядерным объектам§!."
 PrimPlayer_operation_sleeper_cells:0 "Подготовить спящие ячейки"
 PrimPlayer_operation_sleeper_cells_desc:0 "В настоящий момент у нас есть более срочные задачи для наших оперативников, но благодаря тщательной подготовке мы сможем сохранить значительную часть агентурной сети на будущее."
 PrimPlayer_operation_smear_campaign:0 "Кампания по дискредитации"
 PrimPlayer_operation_smear_campaign_desc:1 "Умелые оперативники могут распространять наш вариант правды, подрывая даже самые тесные отношения."
 PrimPlayer_operation_steal_technology:0 "Украсть технологию"
 PrimPlayer_operation_steal_technology_desc:0 "Наши оперативники проникнут в исследовательские лаборатории и внутренние системы и передадут нашим учёным ответы на интересующие их вопросы."
 close_branch_office_flag:0 "Наши филиалы недавно были закрыты властями [OWNER.GetName&gen]"
 culture_shock_diplomacy_desc:0 "Эта досветовая цивилизация всё ещё привыкает к мысли, что она не одинока в галактике. В результате она мобилизовала огромные, пусть и примитивные, силы планетарной обороны."
