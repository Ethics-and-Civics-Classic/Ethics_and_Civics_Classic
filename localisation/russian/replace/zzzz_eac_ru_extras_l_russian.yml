 PrimPlayer_terraform_frozen_situation:0 "Терраформирование замёрзшего мира"
 PrimPlayer_terraform_frozen_situation_desc:0 "Хотя этот мир бесплоден и лишён жизни, вода здесь сохранилась в виде льда; возможно, когда-то здесь процветала экосистема. При наличии подходящих технологий его можно терраформировать. В итоге должен получиться §Y$pc_ocean$§!."
 PrimPlayer_terraform_situation:0 "Терраформирование безжизненного мира"
