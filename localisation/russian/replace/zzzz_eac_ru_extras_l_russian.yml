 d_PrimPlayer_nation_deposit:0 "Столичный город"
 d_PrimPlayer_nation_deposit_desc:0 "Именно здесь молодое государство начало свой путь к звёздам."
 d_PrimPlayer_the_obelisk_deposit:0 "Обелиск"
 d_PrimPlayer_the_obelisk_deposit_desc:0 "Над этим государством возвышается странный Обелиск, не тронутый временем. Одни поклоняются ему, другие пытаются изучать, но в конце концов все задаются одним вопросом: зачем он здесь?"
 d_ethic_fanatic_authoritarian_nation_blocker:0 "Фанатично-авторитарное государство"
 d_ethic_fanatic_authoritarian_nation_blocker_desc:0 "Это авторитарное государство сосредоточило богатства своих земель в руках обожаемого правителя."
 d_ethic_fanatic_capitalism_nation_blocker:0 "Фанатично-конкурентное государство"
 d_ethic_fanatic_capitalism_nation_blocker_desc:0 "Это конкурентное государство разделило всю землю в своих границах между собственниками и не намерено делиться ею с соседями."
 d_ethic_fanatic_egalitarian_nation_blocker:0 "Фанатично-либертарианское государство"
 d_ethic_fanatic_egalitarian_nation_blocker_desc:0 "Это либертарианское государство следит за тем, чтобы его граждане имели доступ к земле, но за его границами этот принцип уже не действует."
 d_ethic_fanatic_green_nation_blocker:0 "Фанатично-экоцентристское государство"
 d_ethic_fanatic_green_nation_blocker_desc:0 "Это экоцентристское государство стремится жить в гармонии с природой и защищает свои земли от эксплуатации соседями."
 d_ethic_fanatic_industrial_nation_blocker:0 "Фанатично-индустриалистское государство"
 d_ethic_fanatic_industrial_nation_blocker_desc:0 "Это индустриалистское государство стремится выжать из своих земель всё возможное, превращая их богатства в топливо для собственной экономики."
 d_ethic_fanatic_materialist_nation_blocker:0 "Фанатично-материалистическое государство"
 d_ethic_fanatic_materialist_nation_blocker_desc:0 "Это материалистическое государство стремится изучить и освоить каждую геологическую находку на своей территории — и делиться открытиями не собирается."
 d_ethic_fanatic_militarist_nation_blocker:0 "Фанатично-милитаристское государство"
 d_ethic_fanatic_militarist_nation_blocker_desc:0 "Это милитаристское государство будет сражаться за каждую пядь своей земли."
 d_ethic_fanatic_pacifist_nation_blocker:0 "Фанатично-пацифистское государство"
 d_ethic_fanatic_pacifist_nation_blocker_desc:0 "Это пацифистское государство бережно относится к своей земле и надеется сотрудничать с соседями, сохраняя независимость."
 d_ethic_fanatic_socialism_nation_blocker:0 "Фанатично-кооперативное государство"
 d_ethic_fanatic_socialism_nation_blocker_desc:0 "В этом кооперативном государстве земля используется сообща, а её блага делятся между всеми, кто живёт в его границах."
 d_ethic_fanatic_spiritualist_nation_blocker:0 "Фанатично-спиритуалистское государство"
 d_ethic_fanatic_spiritualist_nation_blocker_desc:0 "Это спиритуалистское государство объявило свои земли священными и готово делить их лишь с единоверцами."
 d_ethic_fanatic_xenophile_nation_blocker:0 "Фанатично-ксенофильское государство"
 d_ethic_fanatic_xenophile_nation_blocker_desc:0 "Это ксенофильское государство охотно идёт на переговоры, но использовать богатства собственных земель намерено само."
 d_ethic_fanatic_xenophobe_nation_blocker:0 "Фанатично-ксенофобское государство"
 d_ethic_fanatic_xenophobe_nation_blocker_desc:0 "Это ксенофобское государство сторонится чужаков и держит свои земли закрытыми в пределах собственных границ."
 d_primitive_nation_absorption_effect_tooltip:0 "Будет создано §G1000§! £pop£ поселений"
 d_primitive_nation_absorption_tomb_tooltip:0 "Будет создано §G500§! £pop£ поселений"
 tb_2nd_enemy:0 "£blocker£ Враждебный органический вид"
 tb_2nd_enemy_desc:0 "Этот регион находится под контролем органической формы жизни, не похожей на нас."
 tb_enemy:0 "£blocker£ Враждебное государство"
 tb_enemy_desc:0 "Этот регион населён частью нашего собственного вида, чьи основополагающие ценности настолько расходятся с нашими, что, возможно, с инопланетянами у нас больше общего."
