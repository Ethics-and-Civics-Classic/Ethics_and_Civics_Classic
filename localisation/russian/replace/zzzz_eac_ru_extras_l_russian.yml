 nations.18270.a:0 "Эти знания могут дать мощный толчок нашим исследованиям!"
 nations.18270.b:0 "Направить торговые излишки на исследования."
 nations.20271.name:1 "Беженцы из [From.GetName&gen]"
 nations.20271.desc:0 "К нашей границе недавно вышла большая группа беженцев из §H[FROM.GetName&gen]§!, которую преследует небольшой военный отряд. Беженцы утверждают, что состояли в движении сопротивления и после неудавшейся попытки переворота спасаются от расправы.\n\nЕсли принять их, это наверняка разгневает власти [FROM.GetName&gen]. Если же позволить преследователям увести беглецов обратно, их, скорее всего, казнят."
 nations.20271.a:0 "Пусть присоединяются к нашим колонистам, если захотят."
 nations.20271.b:0 "Политический инцидент нам не нужен. Отправьте их обратно."
 nations.20271.xenophobe:0 "Чужакам здесь не место."
 nations.20271.civic_fanatic_purifiers:0 "Убивать всех без разбора."
 ethic_fanatic_industrial_nation_refugees:0 "К нашему государству присоединяются §G800§! £pop£ поселений вида §Y[FROM.GetSpeciesNamePlural&gen]§!. Принцип новых жителей: §Y$ethic_industrial$§!."
 nations.20272.name:0 "Культурный обмен с индустриалистским государством"
 nations.20272.desc:1 "Несколько наших посланников вернулись после долгого пребывания среди жителей §H[FROM.GetName&gen]§!. Они хорошо изучили местные обычаи и уклад жизни, что, несомненно, поможет нашим социологическим исследованиям.\n\nНо вместе с чужой культурой приходят и чужие идеи... разрешим ли мы §Hсвободный обмен§!?"
 nations.20272.a:0 "Пусть наши народы свободно обмениваются товарами и идеями."
 nations.20272.b:0 "Мы будем строго контролировать всё, что пересекает границу."
 nations.20273.name:1 "Трагический инцидент с [From.GetName&inst]"
 nations.20273.desc:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Ракета, направлявшаяся в космос, потеряла тягу во время полёта и рухнула на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.20273.nomad:1 "У границы §H[FROM.GetName&gen]§! произошёл трагический случай. Обычная ремонтная операция закончилась катастрофой: небесный док рухнул на одно из наших соседних поселений. В тот день погибло множество [Root.GetSpeciesNamePlural&gen]..."
 nations.20273.a:0 "Подставим другую щёку."
 nations.20273.b:0 "Мы должны потребовать извинений!"
 nations.20275.name:0 "Послание доставлено"
 nations.20275.desc:1 "В последнее время торговля с §H[FROM.GetName&inst]§! почти сошла на нет, а караваны оттуда появляются всё реже. Сегодня мы получили сообщение от представителя местных вооружённых сил. Похоже, там очень недовольны."
 nations.20275.a:0 "Посмотрим, что там."
 nations.20276.name:0 "Послание"
 nations.20276.desc:0 "Поверхностник. Мы пытались быть добрыми соседями, но теперь ясно: вы не намерены оказывать нашей великой цивилизации должного уважения.\n\nОтныне этот мир по праву принадлежит нам целиком. Мы заберём его силой!"
 nations.20276.a:0 "Укрепить границу с §H[FROM.GetName&inst]§!!"
 nations.20277.name:0 "Государство [FROM.GetName] предлагает объединение"
 nations.20277.desc:0 "Во многом наши взгляды совпадают, [ROOT.GetName]. Мы предлагаем официально §Gобъединить§! два национальных государства в §Hединую державу§!."
 nations.20277.merge.fanatic:0 "Наши принципы почти едины, как и наши цели. Пора объединиться."
 nations.20277.merge.normal:0 "Наши принципы близки, а отношения давно стали дружескими. Пора объединиться."
 nations.20277.merge.different:0 "Несмотря на различия в принципах, наши государства стали неразрывно связаны. Пора объединиться."
 nations.20277.no:0 "Сейчас мы не готовы к объединению."
 nations.22261.name:0 "Обрушение"
 nations.22261.desc:1 "С [Root.GetName&gen] пришли тревожные вести! Инопланетяне [Root.Owner.GetSubMantleLower], с которыми мы там воюем, обрушили грунт под целой армией, стоявшей у одного из входов в их туннели.\n\nНемногих солдат, переживших падение, чужаки перебили прежде, чем основные силы успели прийти им на помощь."
 nations.22261.a:0 "Они за это заплатят!"
 nations.22262.name:0 "Диверсионные группы"
 nations.22262.desc:0 "Инопланетяне, живущие под нашей колонией на [Root.GetName&prep], по ночам высылают из туннелей небольшие диверсионные группы. Их последняя атака уничтожила один из важнейших объектов колонии, а прежде чем наши силы успели отреагировать, налётчики скрылись под землёй."
 nations.22262.a:0 "Эти набеги нужно прекратить!"
 nations.22263.name:0 "Атака на поверхность"
 nations.22263.desc:1 "На [Root.GetName&prep] произошло очередное нападение! Инопланетяне [Root.Owner.GetSubMantleLower] вышли из новых туннелей прямо в центре одного из наших крупных поселений. Они подавили местную оборону и перебили колонистов. Отступая в туннели, чужаки утащили под землю нескольких уцелевших, кричавших от ужаса."
 nations.22263.a:0 "Эти убийства не останутся без ответа."
 nations.22264.name:0 "Пещера уцелевших"
 nations.22264.desc:1 "Наши войска на [Root.GetName&prep] продолжают картографировать сеть туннелей под колонией. Они обнаружили крупный город, успевший изолироваться от остального подземного государства ещё до того, как мы заполнили туннели нервно-паралитическим газом. Внутри остаются миллионы перепуганных жителей. Следует ли нашим инженерам обрушить пещеру и довести дело до конца?"
 nations.22264.a:0 "Да. Избавьте их от мучений."
 nations.22264.b:0 "Нет! Вытащите их на поверхность, пусть служат нам."
 nations.22264.b.subterranean:0 "Нет! Доставьте их в колонию, пусть служат нам."
 nations.22265.name:1 "Экспансия: [Root.Owner.GetSubMantleUpper]"
 nations.22265.desc:0 "Мы закончили нейтрализацию нервно-паралитического газа и уборку тел инопланетян из сети туннелей на [Root.GetName&prep]. Теперь нашим колонистам должно быть безопасно туда переселиться. Разумеется, оставленные чужаками примитивные города будут снесены и заменены нашей более совершенной архитектурой."
 nations.22266.name:0 "Золото!"
 nations.22266.desc:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим подземным инопланетянам. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.22266.desc.subterranean:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим обитателям магмы. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 nations.22267.name:0 "Сокровищница"
 nations.22267.desc:0 "Разведчики, обследующие сеть туннелей на [Root.GetName&prep], проникли в царский дворец бывшей столицы подземного государства. Труп того, кого местные считали императором, до сих пор восседает на массивном троне в парадном зале.\n\nПодорвав двери дворцовой сокровищницы, разведчики обнаружили внутри золото и странные произведения инопланетного искусства. Искусство отправят в музеи на [From.Owner.Capital.GetName&acc], а продажа золота заметно пополнит государственный бюджет."
 nations.22268.name:0 "Инцидент с [From.GetName&inst]"
 nations.22268.desc:1 "Дипломатический скандал разгорелся после того, как наш §Yпосланник§! проявил неуважение к местному правителю. [From.GetRulerName] теперь требует показательного суда: посланника уже бросили в тюрьму, а палач ждёт приговора.\n\nМы можем потребовать соблюдения §Hдипломатической неприкосновенности§!, но это вызовет серьёзные §Rдипломатические последствия§!."
 nations.22268.a:0 "Потребовать соблюдения дипломатической неприкосновенности! Посланник нужен нам живым."
 nations.22268.b:0 "Не вмешиваться в казнь. Мы не можем рисковать последствиями..."
 nations.22269.name:0 "Голод в [From.GetName&prep]"
 nations.22269.desc:1 "К нам прибыл представитель §H[From.GetName&gen]§!. Похоже, страна переживает тяжёлые времена и оказалась перед угрозой §Rголода§!.\n\nОни умоляют помочь всем, чем мы можем..."
 nations.22269.a:0 "Конечно. Мы поможем им, чем сможем."
 nations.22269.b:0 "Пусть сами о себе позаботятся."
 nations.22269.c:0 "У нас нет лишней еды..."
 ethic_fanatic_capitalism_nation_pleased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Gулучшатся§!. Принцип государства: §H$ethic_capitalism$§!."
 ethic_fanatic_capitalism_nation_displeased:0 "В результате отношения с §H[FROM.GetName&inst]§! §Rухудшатся§!. Принцип государства: §H$ethic_capitalism$§!."
 nations.22270.name:0 "Дар конкурентного государства"
 nations.22270.desc:0 "В знак дружбы между нашими цивилизациями посланник §H[FROM.GetName&gen]§! познакомил нас с политической доктриной §Y«$tech_free_market$»§!. Приняв эту политику, мы сможем §Gувеличить объём торговли§! за счёт приватизации всей промышленности, но при этом значительно §Rснизится прирост влияния§!."
 nations.22270.a:0 "Очень любезно с их стороны."
 nations.22270.b:0 "Немедленно принять эту политику."
 nations.22271.name:1 "Беженцы из [From.GetName&gen]"
 nations.22271.desc:0 "К нашей границе недавно вышла большая группа беженцев из §H[FROM.GetName&gen]§!, которую преследует небольшой военный отряд. Беженцы утверждают, что состояли в движении сопротивления и после неудавшейся попытки переворота спасаются от расправы.\n\nЕсли принять их, это наверняка разгневает власти [FROM.GetName&gen]. Если же позволить преследователям увести беглецов обратно, их, скорее всего, казнят."
