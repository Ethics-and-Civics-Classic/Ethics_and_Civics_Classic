 nations.18264.desc:1 "Наши войска на [Root.GetName&prep] продолжают картографировать сеть туннелей под колонией. Они обнаружили крупный город, успевший изолироваться от остального подземного государства ещё до того, как мы заполнили туннели нервно-паралитическим газом. Внутри остаются миллионы перепуганных жителей. Следует ли нашим инженерам обрушить пещеру и довести дело до конца?"
 nations.18264.a:0 "Да. Избавьте их от мучений."
 nations.18264.b:0 "Нет! Вытащите их на поверхность, пусть служат нам."
 nations.18264.b.subterranean:0 "Нет! Доставьте их в колонию, пусть служат нам."
