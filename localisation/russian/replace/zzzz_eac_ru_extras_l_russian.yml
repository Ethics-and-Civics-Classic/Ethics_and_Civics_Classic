 leader_trait_legendary_Sustainable_Cultivator_desc:0 "Этот лидер продвигает экологичные методы земледелия, стремясь одновременно к изобилию продовольствия и сохранению окружающей среды."
 leader_trait_legendary_Void_Harvester:0 "Жнец пустоты"
 leader_trait_legendary_Void_Harvester_2:0 "Жнец пустоты II"
 leader_trait_legendary_Void_Harvester_2_desc:0 "Каждый астероид и каждая частица звёздной пыли для этого лидера — ресурс, который должен служить промышленности."
 leader_trait_legendary_Void_Harvester_3:0 "Жнец пустоты III"
 leader_trait_legendary_Void_Harvester_3_desc:0 "Каждый астероид и каждая частица звёздной пыли для этого лидера — ресурс, который должен служить промышленности."
 leader_trait_legendary_Void_Harvester_desc:0 "Каждый астероид и каждая частица звёздной пыли для этого лидера — ресурс, который должен служить промышленности."
 leader_trait_legendary_bad_altruism:0 "Чрезмерный альтруист"
 leader_trait_legendary_bad_altruism_desc:0 "Неустанное стремление этого лидера к общему благу нередко оборачивается растратой государственных ресурсов ради помощи другим."
 leader_trait_legendary_bad_capitalism:0 "Прибыль превыше всего"
 leader_trait_legendary_bad_capitalism_desc:0 "Для этого лидера амбиции важнее сострадания, а путь к богатству вымощен жертвами тех, кому повезло меньше."
 leader_trait_legendary_bad_polluter:0 "Разоритель природы"
 leader_trait_legendary_bad_polluter_desc:0 "Этот лидер считает экологический ущерб неизбежной ценой прогресса и готов пренебречь состоянием природы ради дальнейшего развития."
 leader_trait_legendary_bad_treehugger:0 "Экофундаменталист"
 leader_trait_legendary_bad_treehugger_desc:0 "Для этого лидера защита природы важнее любых иных соображений — даже если ради неё придётся пожертвовать развитием."
