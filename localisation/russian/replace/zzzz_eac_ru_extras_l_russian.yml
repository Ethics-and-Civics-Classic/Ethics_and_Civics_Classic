 civic_memorialist:0 "Мемориалисты"
 civic_memorialist_desc:0 "Это государство чтит память и разумных существ прошлого, черпая устойчивость и понимание из непрерывного цикла смерти, возрождения и наследия."
 civic_memory_vault:0 "Хранилища знаний"
 civic_memory_vault_desc:1 "Знания, принципы и жизненный опыт выдающихся личностей оцифровываются и накапливаются в Хранилищах знаний. Граждане могут обращаться к этому источнику мудрости и опыта, учась у призраков прошлого.\n\n§YЛидеры§!§W, становясь§! §Yправителями§!§W, получают§! §G+1§! §Yуровень навыка§!.\n\n§WПри наличии гражданской модели§! §C«Хранители памяти»§!:\n§YПравители§! §Wв§! §Sдиктаторских§! §Wи§! §Sимперских§! §Wгосударствах, если их уровень навыка ниже, повышают его до уровня предыдущего§! §Yправителя§!§W.§!"
 civic_meritocracy_effect:1 "$t$- §YЛидеры§! имеют значительно меньшую вероятность получить §Rотрицательные§! §Yчерты§!.\n$BOB_xeno_outreach_tooltip$"
 civic_military_dictatorship_corporate_authority:0 "Пиратский синдикат"
 civic_military_dictatorship_corporate_authority_desc:0 "Каждый пират подчиняется Пиратскому лорду. Политическая система хаотична и полна смертельно опасных интриг. Пиратский лорд удерживает власть до тех пор, пока младшие лорды довольны богатствами, получаемыми от наёмнических контрактов и пиратских баз."
 civic_military_dictatorship_corporate_effect:0 "§WНачинает с§! £society_research£ §H$tech_pirate_leaders$§! §Wтехнологией§!:\n- каждый нанятый лидер получает дополнительную черту ['concept_adventurous_spirit_trait']$NEW_LINE$- Черты правителя:$TABBED_NEW_LINE$- ['leader_trait:leader_trait_buccaneer']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_trailblazer']$TABBED_NEW_LINE$- ['leader_trait:leader_trait_treasure_hoarder']\n\n$civic_tooltip_criminal_heritage_effects$"
