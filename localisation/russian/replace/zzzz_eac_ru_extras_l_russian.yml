 PrimPlayer_operation_locate_strategic_targets_desc.nuclear:2 "Наши оперативники соберут сведения о расположении стратегических объектов на территории §Y[This.Target.GetName&gen]§! и по завершении предоставят отчёт с §Yразведданными§!, дополнительно повысив наш §Yмаксимальный уровень внедрения§!. Они также выявят возможные стратегические цели, включая военную инфраструктуру, что позволит наносить §Gупреждающие удары§! по §Yядерным объектам§!.\n\nПриписанные к операции §Yактивы§! могут повлиять на её исход в соответствии со своими интересами."
