 PrimPlay_situation_event.1102.a:0 "Приготовиться к исследованию [fleet.solar_system.GetName&gen]!"
 PrimPlay_situation_event.1102.b:0 "Мы уже полностью исследовали [fleet.solar_system.GetName&acc]."
 ethic_civic_classic_flag.4.title:0 "Заявление правительства"
 ethic_civic_classic_flag.4.proactive.desc:0 "Свидетельства существования §Hмежзвёздных держав§! разошлись по всей территории [Root.GetName&gen]. Любители и учёные уже несколько недель сопоставляют сообщения о странных явлениях в ночном небе. Все ждут, когда [Root.GetRulerName] огласит официальную позицию правительства, и уже предвкушают громкое подтверждение и последующие празднования.\n\nИ всё же... некоторые по-прежнему сомневаются. Если профинансировать §Yкампанию по дезинформации§!, мы сможем снизить осведомлённость нашей цивилизации о межзвёздных державах."
 ethic_civic_classic_flag.4.desc:0 "Свидетельства существования §Hмежзвёздных держав§! разошлись по всей территории [Root.GetName&gen]. Теперь общество ждёт, когда [Root.GetRulerName] огласит официальную позицию правительства, и почти не сомневается: слухи подтвердятся.\n\nИ всё же... сомневающихся по-прежнему немало. Если профинансировать §Yкампанию по дезинформации§!, мы сможем снизить осведомлённость нашей цивилизации о межзвёздных державах."
 ethic_civic_classic_flag.4.full.proactive:0 "Начать празднования в честь открытия межзвёздной жизни."
 ethic_civic_classic_flag.4.full:0 "Подтвердить слухи о существовании межзвёздной жизни."
 ethic_civic_classic_flag.4.suppress:0 "Выделить средства на дискредитацию сторонников этой теории."
 nations.disabled_content.tooltip:0 "§R(!) Незавершённый контент§! — отключён в версии для Steam"
 story.7.desc.PrimPlayer:0 "Цивилизация [Root.GetName] довольно быстро столкнулась с разумной внеземной жизнью.\n\nВ отчёте флота, направленном в столицу, весьма сдержанно описывается, насколько чуждыми показались встреченные силы, а неудачная попытка установить связь упоминается лишь вскользь."
 story.7.desc.PrimPlayer.gesta:0 "Среди звёзд обнаружен неопознанный летающий объект. Его происхождение установить не удалось.\n\nМожно попытаться узнать больше, однако рекомендуется соблюдать осторожность."
 story.7.desc.PrimPlayer.phobe:0 "После слухов о неопознанных летающих объектах в ночном небе на [Root.Capital.GetName&prep] начались волнения. Средства массовой информации разжигают страх перед неизвестностью и призывают готовиться к худшему.\n\nСоветники предупреждают, что после такого потрясения общество крайне нестабильно, однако ситуацию можно обратить себе на пользу. Как бы то ни было, времена меняются."
 story.7.desc.PrimPlayer.phile:0 "По всему миру празднуют весть о гостях в ночном небе. В произошедшую встречу верят далеко не все, но на [Root.Capital.GetName&prep] царит настоящее ликование.\n\nСоветники призывают действовать осторожно: общество переживает потрясение, которое, впрочем, можно обратить себе на пользу. Как бы то ни было, времена меняются."
 nations.5.name:0 "Естественная червоточина"
 nations.5.desc:0 "На окраине системы §H[wormhole_system.GetName]§! обнаружено нечто, похожее на естественный подпространственный феномен! В самой ткани пространства-времени образовался разрыв — «§Hчервоточина§!», которая, по мнению наших учёных, может вести через подпространство к другой червоточине где-то в галактике.\n\nЕсли второй конец расположен достаточно далеко, корабли потенциально смогут пересекать галактику за считаные дни. К сожалению, эта червоточина, как и подавляющее большинство подобных явлений, крайне нестабильна. Любой корабль, рискнувший пройти через неё, будет разорван за считаные секунды."
 nations.5.a:0 "Если бы её только удалось стабилизировать..."
 nations.6.title:0 "Покорена столица — [capital_scope.GetName]!"
 nations.6.nuked.desc:0 "Сокрушительная ядерная зима накрыла [capital_scope.GetName&acc], похоронив все государства, ещё способные бороться за власть. Из радиоактивного пепла поднялось государство [ROOT.GetName], и теперь некому оспорить его власть над этим миром-могилой."
 nations.6.desc:0 "Благодаря упорной дипломатии или умелому применению военной силы [capital_scope.GetName] теперь находится под властью [ROOT.GetName&gen]... Осталось лишь собрать народы мира под единым государственным знаменем."
 nations.6.destroyed.desc:0 "Немыслимое произошло! Наш родной мир был §Rуничтожен§! §Yсверхоружием§! чужой державы. Все несчастные, находившиеся на поверхности, считаются погибшими.\n\n§RВыживших нет§!..."
 nations.6.destroyed:0 "Наш родной мир утрачен. Теперь нам предстоит найти новый дом."
 nations.6.a:0 "Теперь, став единым народом, мы устремляемся к звёздам!"
 nations.6.authoritarian:0 "Слабые подчинятся сильным."
 nations.6.egalitarian:0 "Народ отпразднует обретённые свободы."
 nations.6.xenophobe:0 "Они приобщатся к нашей культуре."
 nations.6.xenophile:0 "Примем культурный обмен с распростёртыми объятиями!"
 nations.6.pacifist:0 "Мирное сосуществование принесёт процветание всем."
 nations.6.spiritualist:0 "Свет нашей веры укажет путь неверующим."
 nations.6.green:0 "Без заботы о природе у нас не останется планеты, которую можно назвать домом."
 nations.6.industrial:0 "Завтрашний прогресс строится на освоении сегодняшних возможностей."
 nations.6.socialism:0 "Целое больше суммы своих частей."
 nations.6.capitalism:0 "Лучшие и способнейшие поведут нас в новую эпоху."
 nations.8.title:0 "Гражданская война в [ROOT.GetName&prep] окончена!"
 random_primitive_events.1.title:0 "Путешествие к [Root.System.GetName&dat]"
 random_primitive_events.1.nuked.desc:0 "[Root.Leader.GetName] отправляется в долгий путь по [Root.System.GetName&dat]. Скорее всего, это будет путешествие в один конец, но новые открытия могут продвинуть нашу науку — и, быть может, помочь найти новый дом."
 random_primitive_events.1.desc:0 "[Root.Leader.GetName] отправляется в долгий путь по [Root.System.GetName&dat]. Скорее всего, это будет путешествие в один конец, но новые открытия могут значительно продвинуть нашу науку."
 random_primitive_events.1.gestalt:0 "Экспедиция в [Root.System.GetName&acc] начинается!"
 random_primitive_events.1.authoritarian:0 "Система [Root.System.GetName] принадлежит нашему правителю!"
 random_primitive_events.1.egalitarian:0 "Пусть свобода распространится по всей системе [Root.System.GetName]!"
 random_primitive_events.1.xenophobe:0 "Уничтожить всё, что обнаружим в [Root.System.GetName&prep]!"
 random_primitive_events.1.xenophile:0 "Найдём новых друзей в [Root.System.GetName&prep]!"
 random_primitive_events.1.militarist:0 "Мы готовы ко всему, что приготовила система [Root.System.GetName]!"
 random_primitive_events.1.pacifist:0 "Пусть во всей системе [Root.System.GetName] воцарится мир!"
 random_primitive_events.1.spiritualist:0 "Пусть наша вера распространится по всей системе [Root.System.GetName]!"
 random_primitive_events.1.materialist:0 "Экспедиция в [Root.System.GetName&acc] начинается!"
 random_primitive_events.1.green:0 "Начать изучение экосистемы [Root.System.GetName&gen]!"
 random_primitive_events.1.industrial:0 "Мы используем всё, что может дать [Root.System.GetName]!"
 random_primitive_events.1.socialism:0 "Экспедиция в [Root.System.GetName&acc] начинается!"
 random_primitive_events.1.capitalism:0 "Расширим наши рынки на всю систему [Root.System.GetName]!"
 progress.3.green:0 "Заботясь о природе, мы пожнём её плоды."
 progress.3.industrial:0 "Все богатства этого мира — наши, и мы возьмём их."
 progress.3.socialism:0 "Пусть наши миры сотрудничают ради общего процветания."
 progress.3.capitalism:0 "Эта колония станет прибыльным предприятием."
 random_primitive_events.2.title:0 "[Root.Leader.GetName] исследует [From.GetName&acc]"
 random_primitive_events.2.desc.not_colonizable:0 "[Root.Leader.GetName] обнаруживает необычное небесное тело, получившее название «[FROM.GetName]». Учёные уже изучают собранные данные — само существование этого объекта наверняка позволит узнать немало нового."
 random_primitive_events.2.desc.colonizable:0 "[Root.Leader.GetName] обнаруживает пригодный для колонизации мир! На родине уже кипят споры о том, когда первые колонисты ступят на [FROM.GetName&acc]."
 random_primitive_events.2.desc.pc_asteroid:0 "[Root.Leader.GetName] обнаруживает примечательный астероид, предположительно обладающий плотным металлическим ядром. Геологи уже приступили к глубокому анализу объекта, которому присвоено имя [FROM.GetName]."
 random_primitive_events.2.desc.pc_gas_giant:0 "Мощное гравитационное поле [From.GetName&gen] удерживает множество спутников и небольших орбитальных тел. Ядра некоторых лун расплавлены одной лишь приливной деформацией. [Root.Leader.GetName] направляет исследовательские группы для дальнейшего изучения физики этих небесных тел."
 random_primitive_events.2.desc.pc_gas_giant.anomaly.300.desc:0 "$anomaly.300.desc$\n\nГлавный учёный [Root.Leader.GetName] считает, что при наличии подходящих технологий — и, конечно, финансирования — эту экосистему можно превратить в §Hкормовую зону§! для §Yмежзвёздных организмов§!."
 random_primitive_events.2.desc.pc_molten:0 "Тепловые показатели [FROM.GetName&gen] зашкаливают! [Root.Leader.GetName] обнаруживает расплавленный мир, богатый необычными минералами, прекрасно подходящими для инженерных применений."
 random_primitive_events.2.desc.pc_barren:0 "Хотя на [FROM.GetName&prep] нет признаков жизни, [Root.Leader.GetName] сообщает об обнаружении ценных сведений прямо на поверхности этого безжизненного мира. Образцы грунта готовят к изучению на борту."
 random_primitive_events.2.desc.toxic_planet:0 "[Root.Leader.GetName] отправляет беспилотные аппараты к [FROM.GetName&dat], чтобы исследовать химический состав атмосферы. Аппаратам удаётся собрать немного данных, прежде чем агрессивная среда быстро выводит их из строя."
 random_primitive_events.2.desc.pc_frozen:0 "Поверхность [FROM.GetName&gen] скована льдом, однако под ледяной корой может скрываться огромный океан, а в нём — неизвестная жизнь. [Root.Leader.GetName] готовит керны льда для исследования."
 random_primitive_events.2.option.not_colonizable:0 "Любопытная находка."
 random_primitive_events.2.option.colonizable:0 "Второй дом?"
 random_primitive_events.2.option.pc_asteroid:0 "Изобилие редких минералов!"
 random_primitive_events.2.option.anomaly.65:0 "Исследуем место падения — там могут быть ценности!"
 random_primitive_events.2.option.divider_flag:0 "Удачная находка... но почему-то всё это кажется слишком уж «подстроенным»."
 random_primitive_events.2.option.pc_gas_giant:0 "Захватывающая физика."
 random_primitive_events.2.option.space_critter_feeding_ground.a:0 "У [Root.Leader.GetName&gen] любопытная теория. Поддержим этот «личный проект»!"
 random_primitive_events.2.option.space_critter_feeding_ground.b:0 "У нас нет времени выделять ресурсы на эти исследования."
 random_primitive_events.2.option.pc_molten:0 "Расплавленный мир: много минералов и почти никакой жизни."
 random_primitive_events.2.option.pc_barren:0 "Холодный безжизненный мир."
 random_primitive_events.2.option.toxic_planet:0 "Токсичный мир, слишком агрессивный для сложной жизни."
 random_primitive_events.2.option.pc_frozen:0 "Замёрзший мир, слишком холодный для любой известной жизни."
 SPACE_CRITTER_FEEDING_GROUND_PROJECT:0 "Атмосферное пастбище"
 random_primitive_events.2001.title:0 "Атмосферное пастбище"
 random_primitive_events.2001.desc.fruitful_partnership:0 "Обычно газовые гиганты способны поддерживать жизнь лишь на микроскопическом уровне, однако этот мир превратился в кормовую зону для гигантских межзвёздных организмов.\n\nБлагодаря этому здесь возникла своеобразная процветающая экосистема: космические существа регулярно останавливаются и «пасутся» в верхних слоях атмосферы.\n\nКроме того, мы заметили, что эти создания теоретически способны разносить наши споры и семена по всей галактике... Возможно, заселяя для нас пригодные миры."
 random_primitive_events.2001.desc:0 "Обычно газовые гиганты способны поддерживать жизнь лишь на микроскопическом уровне, однако этот мир превратился в кормовую зону для гигантских межзвёздных организмов.\n\nБлагодаря этому здесь возникла своеобразная процветающая экосистема: космические существа регулярно останавливаются и «пасутся» в верхних слоях атмосферы."
 random_primitive_events.2001.option.fruitful_partnership:0 "Быть может, однажды это станет плодотворным союзом?"
 random_primitive_events.2001.option:0 "Сколько удивительных межзвёздных существ сюда ещё прилетит?"
 PrimPlay_situation_event.1003.title:0 "Теория гравитационных ловушек"
 PrimPlay_situation_event.1003.desc:0 "$tech_gravity_wells_desc$\n\nНемного политического влияния — и эту тему можно вне очереди включить в программу наших учёных. Остаётся решить, действительно ли она заслуживает приоритета."
 PrimPlay_situation_event.1003.tech_gravity_wells:0 "Одобрить финансирование исследований гуманных методов отлова."
 PrimPlay_situation_event.1003.cancel:0 "У нас нет времени ускорять эти исследования."
 random_primitive_events.212.title:0 "Проект континентального терраформирования"
 random_primitive_events.212.desc:0 "После долгих лет тщательного планирования, огромных расходов и напряжённой работы нам удалось завершить терраформирование [FROM.GetName&gen]. Теперь это §Y$pc_continental$§!.\n\nНа [Root.Capital.GetName&prep] ликуют: [FROM.GetName] может стать новым домом для нашего народа — и источником бесчисленных открытий!"
 random_primitive_events.212.a:0 "Ещё один мир, который [ROOT.GetName] сможет назвать домом."
 random_primitive_events.212.b:0 "Пусть другое государство колонизирует [FROM.GetName&acc] и покинет [root.capital_scope.GetName&acc]."
 random_primitive_events.212.b.tooltip:0 "[This.GetName] §Yколонизирует§! [FROM.GetName&acc] и §Gпокинет§! нашу £planet£ §Hстолицу§!"
 random_primitive_events.214.title:0 "Проект океанического терраформирования"
 random_primitive_events.214.desc:0 "После долгих лет тщательного планирования, огромных расходов и напряжённой работы нам удалось завершить терраформирование [FROM.GetName&gen]. Теперь это §Y$pc_ocean$§!.\n\nНа [Root.Capital.GetName&prep] ликуют: [FROM.GetName] может стать новым домом для нашего народа — и источником бесчисленных открытий!"
 random_primitive_events.214.a:0 "Ещё один мир, который [ROOT.GetName] сможет назвать домом."
 random_primitive_events.217.title:0 "Проект континентального терраформирования"
 random_primitive_events.217.desc:0 "После долгих лет тщательного планирования, огромных расходов и кропотливой очистки от токсичных частиц нам удалось завершить терраформирование [FROM.GetName&gen]. Теперь это §Y$pc_continental$§!.\n\nНа [Root.Capital.GetName&prep] ликуют: [FROM.GetName] может стать новым домом для нашего народа — и источником бесчисленных открытий!"
 random_primitive_events.217.a:0 "Ещё один мир, который [ROOT.GetName] сможет назвать домом."
 random_primitive_events.217.b:0 "Пусть другое государство колонизирует [FROM.GetName&acc] и покинет [root.capital_scope.GetName&acc]."
 random_primitive_events.217.b.tooltip:0 "[This.GetName] §Yколонизирует§! [FROM.GetName&acc] и §Gпокинет§! нашу £planet£ §Hстолицу§!"
 random_primitive_events.219.title:0 "Страх темноты"
 random_primitive_events.219.desc:0 "С момента колонизации [FROM.GetName&gen] прошло несколько месяцев, и по всей системе [FROM.System.GetName] набирает силу §Hизоляционистско-примитивистское движение§!. Его сторонники опасаются не собственных сородичей, а возможных пришельцев за пределами системы. Они хотят вернуть спокойную и простую жизнь, какой общество жило до выхода в межзвёздную эпоху.\n\nПо их мнению, галактика подобна лесу, в котором безопаснее всего не показываться на глаза. Как нам реагировать на этот политический сдвиг?"
 random_primitive_events.219.discourage:0 "Наш прогресс не остановить!"
 random_primitive_events.219.exodus:0 "Если они хотят спрятаться, пусть прячутся на [FROM.GetName&prep]."
 random_primitive_events.219.exodus.tooltip:0 "§H[This.GetName]:§! смещается в сторону §Y$ethic_fanatic_xenophobe$§!"
 random_primitive_events.218.title:0 "Странные сейсмические возмущения"
 random_primitive_events.218.desc:0 "С [Root.GetName&gen] приходит множество сообщений о необъяснимых сейсмических возмущениях. Толчки ощущаются по всей планете, хотя пока инфраструктура не пострадала. Учёные хотят выяснить причину происходящего, но для начала раскопок им требуется разрешение."
 random_primitive_events.218.a:0 "Нужно разобраться... Начать бурение!"
 random_primitive_events.218.b:0 "Звучит опасно... Может, всё прекратится само собой?"
 PRIMPLAYER_SEISMIC_DISTURBANCE_1_PROJECT:0 "Установить связь"
 PRIMPLAYER_SEISMIC_DISTURBANCE_2_PROJECT:0 "Превентивный удар"
 PRIMPLAYER_SEISMIC_DISTURBANCE_3_PROJECT:0 "Уничтожить подземную цивилизацию"
 random_primitive_events.250.name:0 "Источник сейсмических возмущений"
 random_primitive_events.250.desc:0 "Во время исследования сейсмических возмущений несколько наших поселений пострадали от обрушения геологических разломов. Однако учёные обнаружили огромную сеть подземных пещер.\n\nВ самых глубоких из них обитает некая §Hкоренная цивилизация§! — вероятно, та самая, что существовала здесь ещё до того, как её родной мир превратился в §Yтоксичный мир§!. И теперь её обитатели роют туннели к поверхности! Возможно, их встревожили вибрации от наших поселений и недавно очищенная атмосфера, но утверждать наверняка мы не можем. Трудно предсказать, как они отреагируют, когда выберутся наружу и встретят наших колонистов!"
 random_primitive_events.250.desc.subterranean:0 "С [Root.GetName&gen] приходит множество сообщений о необъяснимых сейсмических возмущениях. Толчки ощущаются по всей планете, многим поселениям нанесён ущерб. Исследуя их причину, наши учёные обнаружили огромную сеть пещер в мантии планеты.\n\nВ самых глубоких из них обитает некая §Hкоренная цивилизация§!, вероятно, та самая, что существовала здесь ещё до того, как её родной мир превратился в §Yтоксичный мир§!. И теперь её обитатели прокладывают туннели к нашей колонии! Возможно, их потревожили постоянные вибрации, вызванные деятельностью наших поселений, но наверняка мы этого не знаем. Невозможно предсказать, как они отреагируют, когда выберутся из туннелей и столкнутся с нашими колонистами!"
 random_primitive_events.250.a:0 "С этим надо что-то делать."
 random_primitive_events.251.desc:0 "Один из наших зондов пробурил грунт и наткнулся на инопланетян, прокладывающих туннели на [From.From.GetName&prep]. Когда перепуганные рабочие успокоились, зонд сумел установить связь с их лидерами."
 random_primitive_events.251.a:0 "Открыть канал связи."
 random_primitive_events.252.desc:1 "Наши попытки уничтожить цивилизацию [Root.Owner.GetSubMantleLower] на [Root.GetName&prep] увенчались успехом! Мы обрушили несколько туннелей вместе с рабочими и заполнили нервно-паралитическим газом пещеры, где находились их города.\n\nПо оценкам, число жертв приближается к 100%, и наши силы безопасности уверены, что справятся с немногочисленными уцелевшими."
 random_primitive_events.252.a:0 "Поздравляем все задействованные подразделения."
 random_primitive_events.253.name:2 "Чужаки [Root.Owner.GetSubMantleUpper]"
 random_primitive_events.253.desc:0 "Эта штука работает? Вы нас видите, жители поверхности? Мы понимаем, что вы пришли из Великого Смога, что простирается наверху, за камнем. После того как наша промышленная революция отравила атмосферу до токсичного состояния, мы были уверены, что там ничто живое не могло сохраниться. Как вы очистили атмосферу? И каковы ваши намерения?!"
 random_primitive_events.253.a:0 "Расскажите нам о себе."
 random_primitive_events.253.desc.subterranean:0 "Эта штука работает? Вы нас видите, прижавшиеся к коре? Мы понимаем, что вы пришли из Великого Смога, что простирается ещё выше, за магмой и камнем. После того как наша промышленная революция отравила атмосферу до токсичного состояния, мы были уверены, что там ничто живое не могло сохраниться. Как вы очистили атмосферу? И каковы ваши намерения?!"
 random_primitive_events.253.b:0 "Мы хотим жить с вами в мире."
 random_primitive_events.253.c:0 "Подчинитесь, или мы вас уничтожим."
 random_primitive_events.254.name:1 "Вторжение [Root.Owner.GetSubMantleUpper]!"
 random_primitive_events.254.desc:0 "Подземные инопланетяне на [Root.GetName&prep] выбрались на поверхность! Из туннелей хлынули многочисленные армии, вооружённые примитивным, но смертоносным стрелковым оружием, а их передовые части уже атакуют наши поселения.\n\nНаши силы безопасности вступили в бой, но, возможно, понадобятся подкрепления!"
 random_primitive_events.254.desc.subterranean:0 "Обитатели магмы на [Root.GetName&prep] прорвались в наши пещеры! Из туннелей хлынули многочисленные армии, вооружённые примитивным, но смертоносным стрелковым оружием, а их передовые части уже атакуют наши поселения.\n\nНаши силы безопасности вступили в бой, но, возможно, понадобятся подкрепления!"
 random_primitive_events.254.a:0 "К оружию!"
 subterranean_invasion:0 "Вражеские армии атакуют нашу колонию на [Root.GetName&prep]!"
 random_primitive_events.256.name:0 "Победа на [From.From.GetName&prep]!"
 random_primitive_events.256.desc:0 "Нашим войскам удалось загнать подземных инопланетян на [From.From.GetName&prep] обратно в пещеры. Пока они заперты под землёй. Но это временное решение: рано или поздно они снова вырвутся на поверхность.\n\nНужно нанести удар под землёй, и наши стратеги уже разработали новый план атаки. Он добавлен в журнал."
 random_primitive_events.256.desc.subterranean:0 "Нашим войскам удалось загнать обитателей мантии на [From.From.GetName&prep] обратно в магматические логова. Пока они заперты в глубинах. Но это временное решение: рано или поздно они снова прорвутся в наши пещеры.\n\nНужно нанести удар под землёй, и наши стратеги уже разработали новый план атаки. Он добавлен в журнал."
 random_primitive_events.256.a:0 "Нужно решить эту проблему раз и навсегда."
 random_primitive_events.257.name:0 "Поражение на [From.From.GetName&prep]!"
 random_primitive_events.257.desc:1 "Наши войска на [From.From.GetName&prep] разгромлены, а цивилизация [Root.Owner.GetSubMantleLower] полностью захватила все наши поселения! Теперь они используют один из наших спутников, чтобы передать нам сообщение."
 random_primitive_events.258.desc:0 "Жители поверхности! Наши славные армии одержали над вами победу, и теперь трофеи ваших городов принадлежат нам. Мы многому научились, изучая ваши машины, и наше оружие стало мощнее, чем когда-либо.\n\nНе приближайтесь к этому миру снова!"
 random_primitive_events.258.desc.subterranean:0 "Прижавшиеся к коре! Наши славные армии одержали над вами победу, и теперь трофеи ваших городов принадлежат нам. Мы многому научились, изучая ваши машины, и наше оружие стало мощнее, чем когда-либо.\n\nНе приближайтесь к этому миру снова!"
 random_primitive_events.258.a:0 "Вот наглецы."
 random_primitive_events.259.name:0 "Появление чужаков"
 random_primitive_events.259.desc:0 "Подземные инопланетяне на [From.From.GetName&prep] выбрались на поверхность! Пока что речь идёт лишь о небольших группах исследователей и торговцев. Возможно, они готовы мирно сосуществовать с нашими колонистами и даже вести торговлю. С нами связался их представитель."
 random_primitive_events.259.desc.subterranean:0 "Обитатели магмы на [From.From.GetName&prep] вышли в наши пещеры! Пока что речь идёт лишь о небольших группах исследователей и торговцев. Возможно, они готовы мирно сосуществовать с нашими колонистами и даже вести торговлю. С нами связался их представитель."
 random_primitive_events.259.a:0 "Послушаем, что они хотят сказать."
 random_primitive_events.260.desc:0 "Подземные инопланетяне на [Root.GetName&prep] собрали в своём пещерном государстве достаточно сил для нового вторжения на поверхность! Их разъярённые армии снова хлынули из свежевырытых туннелей и бросили нам вызов."
 random_primitive_events.260.a:0 "Надо дать им отпор!"
 subterranean_invasion_2:0 "Вражеские армии атакуют нашу колонию на [Root.GetName&prep]!"
 random_primitive_events.261.name:0 "Обрушение"
 random_primitive_events.261.desc:1 "С [Root.GetName&gen] пришли тревожные вести! Инопланетяне [Root.Owner.GetSubMantleLower], с которыми мы там воюем, обрушили грунт под целой армией, стоявшей у одного из входов в их туннели.\n\nНемногих солдат, переживших падение, чужаки перебили прежде, чем основные силы успели прийти им на помощь."
 random_primitive_events.261.a:0 "Они за это заплатят!"
 random_primitive_events.262.name:0 "Диверсионные группы"
 random_primitive_events.262.desc:0 "Инопланетяне, живущие под нашей колонией на [Root.GetName&prep], по ночам высылают из туннелей небольшие диверсионные группы. Их последняя атака уничтожила один из важнейших объектов колонии, а прежде чем наши силы успели отреагировать, налётчики скрылись под землёй."
 random_primitive_events.262.a:0 "Эти набеги нужно прекратить!"
 random_primitive_events.263.name:0 "Атака на поверхность"
 random_primitive_events.263.desc:1 "На [Root.GetName&prep] произошло очередное нападение! Инопланетяне [Root.Owner.GetSubMantleLower] вышли из новых туннелей прямо в центре одного из наших крупных поселений. Они подавили местную оборону и перебили колонистов. Отступая в туннели, чужаки утащили под землю нескольких уцелевших, кричавших от ужаса."
 random_primitive_events.263.a:0 "Эти убийства не останутся без ответа."
 random_primitive_events.264.name:0 "Пещера уцелевших"
 random_primitive_events.264.desc:1 "Наши войска на [Root.GetName&prep] продолжают картографировать сеть туннелей под колонией. Они обнаружили крупный город цивилизации [Root.Owner.GetSubMantleLower], успевший изолироваться от остального подземного государства ещё до того, как мы заполнили туннели нервно-паралитическим газом. Внутри остаются миллионы перепуганных жителей. Следует ли нашим инженерам обрушить пещеру и довести дело до конца?"
 random_primitive_events.264.a:0 "Да. Избавьте их от мучений."
 random_primitive_events.264.b:0 "Нет! Вытащите их на поверхность, пусть служат нам."
 random_primitive_events.264.b.subterranean:0 "Нет! Доставьте их в колонию, пусть служат нам."
 random_primitive_events.265.desc:0 "Мы закончили нейтрализацию нервно-паралитического газа и уборку тел инопланетян из сети туннелей на [Root.GetName&prep]. Теперь нашим колонистам должно быть безопасно туда переселиться. Разумеется, оставленные чужаками примитивные города будут снесены и заменены нашей более совершенной архитектурой."
 random_primitive_events.266.name:0 "Золото!"
 random_primitive_events.266.desc:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим подземным инопланетянам. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 random_primitive_events.266.desc.subterranean:0 "На [Root.GetName&prep] геологи-разведчики проникли в самые глубокие туннели, когда-то принадлежавшие ныне погибшим обитателям магмы. Им наконец удалось найти легендарные золотые прииски — вероятный источник огромных запасов драгоценных металлов подземного государства."
 random_primitive_events.267.name:0 "Сокровищница"
 random_primitive_events.267.desc:0 "Разведчики, обследующие сеть туннелей на [Root.GetName&prep], проникли в царский дворец бывшей столицы подземного государства. Труп того, кого местные считали императором, до сих пор восседает на массивном троне в парадном зале.\n\nПодорвав двери дворцовой сокровищницы, разведчики обнаружили внутри золото и странные произведения инопланетного искусства. Искусство отправят в музеи на [From.Owner.Capital.GetName&acc], а продажа золота заметно пополнит государственный бюджет."
 random_primitive_events.268.name:0 "Землетрясения на [Root.GetName&prep]"
 random_primitive_events.268.desc:1 "Недавно на [Root.GetName&prep] произошла очередная волна землетрясений. Похоже, без инопланетян [Root.Owner.GetSubMantleLower], поддерживавших туннели в надлежащем состоянии, некоторые глубинные участки сети обрушились. Многие наши поселения пострадали."
 random_primitive_events.269.name:0 "Голод"
 random_primitive_events.269.desc:1 "К нам обратилась делегация цивилизации [Root.Owner.GetSubMantleLower] с [Root.GetName&gen]. Судя по всему, их государство переживает тяжёлые времена и оказалось на пороге голода. Они умоляют нас оказать любую возможную помощь."
 random_primitive_events.269.a:0 "Конечно. Мы поможем им, чем сможем."
 random_primitive_events.269.b:0 "Пусть сами о себе позаботятся."
 subterraneans_pleased:1 "Отношения с цивилизацией [Root.Owner.GetSubMantleLower] улучшатся."
 subterraneans_displeased:1 "Отношения с цивилизацией [Root.Owner.GetSubMantleLower] ухудшатся."
 random_primitive_events.270.name:0 "Подарок"
 random_primitive_events.270.desc:0 "В знак дружбы между нашими цивилизациями караван подземных инопланетян с [Root.GetName&gen] доставил на поверхность большое количество самоцветов. Судя по всему, такие камни добывают глубоко под землёй, почти у самого ядра планеты — глубже их государство уже не решается спускаться."
 random_primitive_events.270.desc.subterranean:0 "В знак дружбы между нашими цивилизациями караван обитателей магмы с [Root.GetName&gen] доставил в наши пещеры большое количество самоцветов. Судя по всему, такие камни добывают глубоко под землёй, почти у самого ядра планеты — глубже их цивилизация уже не решается спускаться."
 random_primitive_events.270.a:0 "Очень любезно с их стороны."
 random_primitive_events.271.name:1 "Беженцы расы [root.Owner.GetSubMantleUpper]"
 random_primitive_events.271.desc:0 "Большая группа беженцев из подземного государства на [Root.GetName&prep] недавно выбралась из туннелей на поверхность, спасаясь от небольшого вооружённого отряда. Судя по всему, они принадлежат к религиозному меньшинству и утверждают, что бегут от преследований.\n\nЕсли разрешить им присоединиться к нашим колонистам на поверхности, это наверняка разгневает правителей государства, откуда они бежали. Но если позволить преследователям увести их обратно под землю, беглецов, скорее всего, казнят."
 random_primitive_events.271.desc.subterranean:0 "Большая группа беженцев из государства обитателей магмы на [Root.GetName&prep] недавно выбралась из туннелей в наши пещеры, спасаясь от небольшого вооружённого отряда. Судя по всему, они принадлежат к религиозному меньшинству и утверждают, что бегут от преследований.\n\nЕсли разрешить им присоединиться к нашим колонистам в верхних пещерах, это наверняка разгневает правителей государства, откуда они бежали. Но если позволить преследователям увести их обратно в глубины, беглецов, скорее всего, казнят."
 random_primitive_events.271.a:0 "Пусть присоединяются к нашим колонистам, если захотят."
 random_primitive_events.271.b:0 "Политический инцидент нам не нужен. Отправьте их обратно."
 random_primitive_events.272.name:0 "Ксеноантропологи"
 random_primitive_events.272.desc:1 "Несколько ксеноантропологов с [Root.Owner.Capital.GetName&gen] вернулись на поверхность [Root.GetName&gen] после долгого времени, проведённого среди местных инопланетян [Root.Owner.GetSubMantleLower]. Они многое узнали об обычаях и укладе жизни этой цивилизации, что, несомненно, продвинет наши общественные исследования."
 random_primitive_events.273.desc:1 "Недавно на [Root.GetName&prep] прокатилась волна землетрясений. В нескольких наших поселениях обрушились здания, погибли многие жители. Государство инопланетян [Root.Owner.GetSubMantleLower] выкапывает глубоко под землёй новую пещеру для строительства города — по всей видимости, именно это и стало причиной толчков."
 random_primitive_events.273.a:0 "Подставим другую щёку."
 random_primitive_events.273.b:0 "Мы должны потребовать извинений!"
 random_primitive_events.274.name:0 "Запрос технологий"
 random_primitive_events.274.desc:1 "Увидев современное оружие наших сил безопасности, несколько генералов государства [Root.Owner.GetSubMantleLower] на [Root.GetName&prep] попросили поделиться с ними частью военных технологий.\n\nНаши офицеры сомневаются, стоит ли это делать: если дело когда-нибудь дойдёт до войны, победить чужаков станет гораздо сложнее. Но отказ они почти наверняка воспримут как оскорбление."
 random_primitive_events.274.a:0 "Вооружать их современным оружием — плохая идея."
 random_primitive_events.274.b:0 "Они наши друзья. Поделимся тем, чем можем."
 random_primitive_events.275.name:0 "Послание доставлено"
 random_primitive_events.275.desc:1 "В последнее время торговля с инопланетянами [Root.Owner.GetSubMantleLower] на [Root.GetName&prep] почти сошла на нет, а их караваны появляются всё реже. Сегодня мы получили сообщение от представителя их армии. Похоже, они очень недовольны."
 random_primitive_events.275.a:0 "Посмотрим, что там."
 random_primitive_events.276.name:0 "Послание"
 random_primitive_events.276.desc:0 "Житель поверхности. Мы старались быть хорошими соседями, но теперь ясно: вы не намерены относиться к нам с тем уважением, которого заслуживает наша славная цивилизация.\n\nПоэтому наш император постановил, что весь этот мир по праву должен принадлежать нам. Мы прогоним вас обратно к звёздам, откуда вы явились!"
 random_primitive_events.276.desc.subterranean:0 "Прижавшийся к коре. Мы старались быть хорошими соседями, но теперь ясно: вы не намерены относиться к нам с тем уважением, которого заслуживает наша славная цивилизация.\n\nПоэтому наш император постановил, что весь этот мир по праву должен принадлежать нам. Мы прогоним вас обратно к звёздам, откуда вы явились!"
 random_primitive_events.276.a:0 "Скверное дело."
 random_primitive_events.3.title:0 "Первый спутник"
 random_primitive_events.3.desc:0 "3... 2... 1... Пуск!\n\n[ROOT.OWNER.GetName] запускает первую ракету с поверхности родного мира. Аппарат успешно выходит на орбиту, знаменуя рождение космической программы, которая проведёт нас через §Yраннюю космическую эпоху§!.\n\nТеперь начинается строительство §HМеждународной космической станции§!."
 random_primitive_events.3.a:0 "Сегодня мы наконец вступаем в раннюю космическую эпоху."
 random_primitive_events.3.tooltip:0 "Строительство §Yорбитальной космической станции§! §Gполностью§! профинансировано.\n§R(!) Мегасооружение необходимо построить вручную§!"
 random_primitive_events.4.title:0 "Первая космическая станция"
 random_primitive_events.4.desc:1 "[ROOT.GetName] наконец завершает проект орбитальной космической станции. Она позволит нам исследовать нашу звёздную систему и защищать наш родной мир."
 random_primitive_events.4.a:0 "Мы стоим на пороге космических путешествий!"
 origin_primitive_player_early_space_age:0 "Ранняя космическая эпоха"
 PrimPlay_situation_event.2.title:0 "$tech_hyper_drive_theory$"
 PrimPlay_situation_event.2.desc:0 "Мечтая о звёздах, эта цивилизация поколениями развивалась и наконец оказалась на пороге эпохи галактических исследований.\n\nЕё учёных осенила мысль... $tech_hyper_drive_theory_desc$"
 PrimPlay_situation_event.2.into_the_unknown:0 "С этим проектом гипердвигателя мы вступаем в неизвестность..."
 PrimPlay_situation_event.2.civic_eager_explorers.desc:0 "Мечтая о звёздах, эта цивилизация поколениями развивалась и наконец оказалась на пороге эпохи галактических исследований.\n\nЕё учёных осенила мысль... $tech_hyper_drive_theory_desc$.\n\nУвлечённые поиском, они открыли технологию, позволяющую прыгать через саму сеть пространства и больше не быть привязанными к её нитевидным коридорам."
 PrimPlay_situation_event.2.civic_eager_explorers:0 "Наши специалисты с новой силой взялись за проект гипердвигателя."
 PrimPlay_situation_event.2.civic_privatized_exploration.desc:0 "Годами этой цивилизации твердили, что гипердвигатель вот-вот будет готов. Она терпеливо ждала, пока дочерняя компания, отвечавшая за проект, исподтишка переводила выделенные средства на частные счета. Когда мошенничество наконец вскрылось, корпорация в панике бросила все силы на работу — и в этой лихорадочной гонке неожиданно открыла технологию прыжкового двигателя."
 PrimPlay_situation_event.2.civic_privatized_exploration:0 "Наши специалисты с новой силой взялись за проект гипердвигателя."
 PrimPlay_situation_event.2.payback.desc:0 "$tech_hyper_drive_theory_desc$"
 PrimPlay_situation_event.2.payback:0 "Мы проведём обратную разработку гипердвигателей Минамар!"
 PrimPlay_situation_event.2.broken_shackles.desc:0 "$tech_hyper_drive_theory_desc$"
 PrimPlay_situation_event.2.broken_shackles:0 "Мы воссоздадим гипердвигатели наших бывших хозяев!"
 PrimPlay_situation_event.2002.title:0 "$tech_subspace_drive$"
 PrimPlay_situation_event.2002.desc:0 "$tech_subspace_drive_desc$"
 PrimPlay_situation_event.2002.a:0 "Какое открытие!"
 PrimPlay_situation_event.2002.tooltip:0 "\n§WОткрывает:§! §H$colony_vessel$§!, способный к сверхсветовым перелётам"
 PrimPlay_situation_event.2003.title:0 "$tech_temple_of_transportation$"
 PrimPlay_situation_event.2003.desc:0 "Учёные предложили революционную идею: нашу историческую сеть железнодорожного транспорта можно воспроизвести уже в масштабах гиперпространства. Так появилась концепция §H«$tech_hyper_relays$»§!. $tech_hyper_relays_desc$ Разумеется, прежде чем воплотить её, потребуются дальнейшие исследования..."
 PrimPlay_situation_event.2003.a:0 "Какая идея — гиперпространственные магистрали!"
 PrimPlay_situation_event.2004.title:0 "$tech_experimental_subspace_navigation$"
 PrimPlay_situation_event.2004.desc:0 "Наши учёные теоретически нашли способ успешно совершить прыжок в другую систему, однако практические возможности технологии §H«$tech_experimental_subspace_navigation$»§! пока крайне ограничены. Причина проста: $tech_experimental_subspace_navigation_desc$"
 PrimPlay_situation_event.2004.a:0 "Гипердвигателей у нас пока нет, но исследовать другие системы мы уже можем!"
 PrimPlay_situation_event.2004.tooltip:0 "\n§WОткрывает:§! §Y$tech_experimental_subspace_navigation$§! для §H$explorer_vessel$§!"
 PrimPlay_situation_event.2005.title:0 "$tech_wormhole_stabilization$"
 PrimPlay_situation_event.2005.desc:0 "Работая над темой §H«$tech_hyper_drive_theory$»§!, наши учёные предположили, что червоточины можно создавать искусственно. Так появился проект §H«двигателя Кирни — Футиды»§!: предполагалось, что К—Ф-двигатель будет искривлять пространство и создавать искусственную червоточину для быстрого перехода между системами.\n\nК сожалению, при нынешнем уровне технологий такие двигатели признаны слишком §Rнепрактичными для кораблей§!. Но исследования не пропали даром: теперь мы понимаем, как временно стабилизировать матрицу червоточины и сделать проход через неё безопасным!"
 PrimPlay_situation_event.2005.a:0 "Гипердвигатели завели нас в тупик... зато открылись другие пути!"
 PrimPlay_situation_event.2006.title:0 "$tech_gateway_activation$"
 PrimPlay_situation_event.2006.desc:0 "$tech_gateway_activation_desc$"
 PrimPlay_situation_event.2006.a:0 "Какие пути это перед нами откроет?"
 PrimPlay_situation_event.2006.tooltip:0 "\n§WОткрывает:§! §Y$tech_gateway_activation$§!"
 PrimPlay_situation_event.2007.title:0 "$tech_gateway_construction$"
 PrimPlay_situation_event.2007.desc:0 "$tech_gateway_construction_desc$"
 PrimPlay_situation_event.2007.a:0 "Теперь мы сами создаём дороги!"
 PrimPlay_situation_event.2007.tooltip:0 "\n§WОткрывает:§! §Y$tech_gateway_construction$§!"
 PrimPlay_situation_event.3.title:0 "Объединение планеты"
 PrimPlay_situation_event.3.desc:0 "Любое общество знает разногласия, но для выживания в галактике планета должна объединиться. Наша цель — §H$tech_primitive_unified_planet$§!. Перелом наступит, когда большинство населения примет общее будущее."
 PrimPlay_situation_event.3.origin_fear_of_the_dark.desc:0 "После сокрушительного удара по нашему родному миру выжившие быстро перенесли столицу на [Root.Capital.GetName&acc]. Отчаяние достигло небывалого уровня, и выжившие всё чаще смотрят на правительство как на единственный источник порядка и устойчивости.\n\nМы не можем их подвести. [Root.GetName] вновь будет процветать!"
 PrimPlay_situation_event.3.origin_fear_of_the_dark:0 "Дух народа [Root.GetSpeciesName&gen] так просто не сломить!"
 PrimPlay_situation_event.3.into_the_unknown:0 "Планета объединится ради нашего дела!"
 PrimPlay_situation_event.3.post_apocalyptic:0 "Мы — единственное правительство, пережившее §Rядерные удары§!..."
 PrimPlay_situation_event.3.broken_shackles.desc:0 "Любое общество знает разногласия, но для выживания в галактике планета должна объединиться. Наша цель — §H$tech_primitive_unified_planet$§!.\n\nРабство под властью $NAME_MSI_country$ сплотило нас общей судьбой, а сострадание к другим рабам заставляет продолжать борьбу."
 PrimPlay_situation_event.3.broken_shackles:0 "Наш народ объединится против тирании рабства."
 PrimPlay_situation_event.3002.title:0 "$tech_compact_living$"
 PrimPlay_situation_event.3002.desc:0 "$tech_compact_living_desc$"
 PrimPlay_situation_event.3002.a:0 "Раздробленный мир оставил нам множество уроков."
 PrimPlay_situation_event.3003.title:0 "$tech_xeno_aesthetics$"
 PrimPlay_situation_event.3003.desc:0 "$tech_xeno_aesthetics_desc$"
 PrimPlay_situation_event.3003.a:0 "Единый мир расцветает благодаря культурному обмену!"
 PrimPlay_situation_event.3003.b:0 "Объединение мира помогает лучше понять культурные обычаи."
 PrimPlay_situation_event.3003.c:0 "Знай врага — и сумеешь одолеть его в бою."
 PrimPlay_situation_event.3003.d:0 "Если понимаешь их, ими проще управлять."
 PrimPlay_situation_event.3003.e:0 "Знай их вкусы — и сможешь открыть новые рынки."
 PrimPlay_situation_event.3004.title:0 "Сепаратисты убили губернатора на [Root.GetName&prep]"
 PrimPlay_situation_event.3004.desc:0 "Боевики сепаратистского движения на §H[Root.GetName&prep]§! убили местного губернатора — §Y[governor_target.GetName]§!! Кортеж губернатора был перехвачен вскоре после выезда из аэропорта, после чего между охраной и сепаратистами завязалась ожесточённая перестрелка.\n\nКогда всё стихло, губернатор оказался среди погибших."
 PrimPlay_situation_event.3004.a:0 "Это мешает нашим планам создания мирового правительства!"
 PrimPlay_situation_event.3005.title:0 "Сепаратистские движения!"
 PrimPlay_situation_event.3005.desc:0 "Пока мы объединяем мир, сепаратистские движения всё сильнее тормозят этот процесс. Все их участники объявлены §Rпреступниками§!, и с ними придётся разобраться, если мы хотим ускорить объединение планеты."
 PrimPlay_situation_event.3005.a:0 "Мы должны восстановить порядок!"
 PrimPlay_situation_event.3006.title:0 "Сепаратистское движение разгромлено!"
 PrimPlay_situation_event.3006.desc:0 "Сепаратистское движение, некогда мешавшее объединению планеты, полностью разгромлено. Но расслабляться нельзя: порядок на планете необходимо поддерживать и дальше."
 PrimPlay_situation_event.1.title:0 "Межзвёздная эпоха"
 PrimPlay_situation_event.1.desc:0 "После последнего технологического прорыва мы можем с уверенностью заявить: наш вид вышел на межзвёздную арену! Остаётся лишь один тревожный вопрос... как отреагирует тёмный лес космоса, когда заметит нашу цивилизацию?"
 PrimPlay_situation_event.1.a:0 "Рассвет новой галактической эпохи!"
 PrimPlay_situation_event.1.payback.desc:0 "Последний технологический прорыв дал нашему народу возможность вести межзвёздную войну против §H«Специализированной промышленности Минамар»§!. Наши угнетатели больше не смогут прятаться за пределами нашей досягаемости. Они заплатят за всё, что сделали."
 PrimPlay_situation_event.1.payback:0 "Технологическое преимущество Минамар сокращается!"
 PrimPlay_situation_event.1.broken_shackles.desc:0 "Последний технологический прорыв дал нашему народу возможность вести межзвёздную войну против §H«Минамар Спешалайзд Индастриз»§!. Наш флот со сверхсветовыми двигателями освободит каждого раба из-под тирании Минамар."
 PrimPlay_situation_event.1.broken_shackles:0 "Мы освободим каждого раба, угнетаемого Минамар!"
 PrimPlay_situation_event.1.origin_post_apocalyptic:0 "Происхождение изменено на ['civic:origin_post_apocalyptic']"
 PrimPlay_situation_event.1.origin_post_apocalyptic_machines:0 "Происхождение изменено на ['civic:origin_post_apocalyptic_machines']"
 PrimPlay_situation_event.1.origin_ocean_paradise:0 "Происхождение изменено на ['civic:origin_ocean_paradise']"
 PrimPlay_situation_event.1.origin_ocean_machines:0 "Происхождение изменено на ['civic:origin_ocean_machines']"
 PrimPlay_situation_event.1.origin_mechanists:0 "Происхождение изменено на ['civic:origin_mechanists']"
 PrimPlay_situation_event.1.origin_galactic_doorstep:0 "Происхождение изменено на ['civic:origin_galactic_doorstep']"
 PrimPlay_situation_event.1.origin_imperial_vassal:0 "Происхождение изменено на ['civic:origin_imperial_vassal']"
 PrimPlay_situation_event.1.origin_separatists:0 "Происхождение изменено на ['civic:origin_separatists']"
 PrimPlay_situation_event.1.origin_storm_chasers:0 "Происхождение изменено на ['civic:origin_storm_chasers']"
 PrimPlay_situation_event.1.origin_fruitful:0 "Происхождение изменено на ['civic:origin_fruitful']"
 PrimPlay_situation_event.1.origin_subterranean:0 "Происхождение изменено на ['civic:origin_subterranean']"
 PrimPlay_situation_event.1.origin_subterranean_machines:0 "Происхождение изменено на ['civic:origin_subterranean_machines']"
 PrimPlay_situation_event.1.origin_default_nomads:0 "Происхождение изменено на ['civic:origin_default_nomads']"
 PrimPlay_situation_event.1.origin_default:0 "Происхождение изменено на ['civic:origin_default']"
 PrimPlay_situation_event.1.fallback_if_no_selection:0 "§RРезервный вариант, если ничего не выбрано!§!"
 PrimPlay_situation_event.1001.title:0 "Боевые шахтёрские лазеры"
 PrimPlay_situation_event.1001.desc:0 "Один из наших §Hучёных§! предложил способ превратить последние достижения в области §Yшахтёрских лазеров§! в оружие. Сочетание сверхточно фокусирующих линз с импульсами переменной частоты позволит создать лазеры, достаточно мощные, чтобы разрабатывать астероиды — или сбивать противника.\n\nОстаётся лишь вопрос... получит ли этот §Hличный проект§! §Rдостаточное финансирование§!?"
 PrimPlay_situation_event.1001.fund:0 "Выделить средства на исследование технологии §Y«$tech_mining_drone_weapon_1$»§!"
 PrimPlay_situation_event.1001.later:0 "Сейчас это не приоритет. Может быть, позже."
 PrimPlay_situation_event.1001.cancel:0 "Перенаправить проект на мирное применение."
 STORM_CHASER_CAPSULE_PROJECT:0 "Принять космическую капсулу"
 STORM_CHASER_CAPSULE_PROJECT_CANCEL:0 "Отвергнуть космическую капсулу"
 PrimPlay_situation_event.1002.title:0 "Упавшая космическая капсула"
 PrimPlay_situation_event.1002.desc:0 "Прошлой ночью с орбиты упала загадочная капсула необычной конструкции, перепугав местных жителей. При осмотре один из наших §Hучёных§! заметил исходящее изнутри опасное излучение, сходное с тем, что встречается в космосе.\n\nЧто бы ни находилось внутри, оно может быть опасно. Но узнать наверняка можно лишь одним способом... получит ли этот §Hкосмический исследовательский проект§! §Rдостаточное финансирование§!?"
 PrimPlay_situation_event.1002.fund:0 "Выделить средства на исследование и вскрытие §Yкосмической капсулы§!"
 PrimPlay_situation_event.1002.later:0 "Сейчас это не приоритет. Может быть, позже."
 PrimPlay_situation_event.1002.cancel:0 "Немедленно вышвырнуть эту штуку обратно в космос!"
 cstorms.3100.b:0 "Отказаться от этой затеи!"
 primitive_origin.114.name:0 "$PrimPlayer_civic_the_obelisk$"
 primitive_origin.114.desc:0 "Над этой страной возвышается Обелиск, неподвластный времени.\n\nДо сих пор не найдено ни одного материала, способного пробить внешнюю броню Обелиска, однако от него исходит тепло. Его бок покрывают странные знаки, и ни одному известному ксенологу ещё не удалось расшифровать эту чужеродную письменность... пока что."
 primitive_origin.114.first_contact_proactive:0 "Мы должны узнать, откуда взялся этот Обелиск!"
 primitive_origin.114.first_contact_cautious:0 "С этим Обелиском следует быть осторожнее."
 primitive_origin.114.first_contact_attack_allowed:0 "Этот Обелиск лучше уничтожить."
 primitive_origin.115.name:0 "MSI — ваша лестница к звёздам"
 primitive_origin.115.desc:0 "Представители §H[This.ContactCountry.GetRealName]§! обратились к нашему посланнику с предложением дружбы!\n\nКорпоративный эмиссар сулит нам лучшую жизнь — такую, что преобразит наше «примитивное» существование. В сиянии огней нам демонстрируют §Hтехнологии возвышения§!, которые якобы способны в кратчайшие сроки превратить наш мир в общество космической эпохи. Стоит лишь поставить подпись на пунктирной линии — и MSI предоставит кредиты для капиталовложений. Наши финансовые советники воодушевлены перспективой притока капитала и бесконечного потока новых товаров.\n\nВ доказательство добрых намерений компания великодушно предлагает бесплатный пробный период защиты нашего мира от любых бедствий."
 primitive_origin.115.first_contact_proactive:0 "Посмотрим, что нам даст этот бесплатный пробный период!"
 primitive_origin.115.first_contact_cautious:0 "Не стоит спешить доверять торговцу."
 primitive_origin.115.first_contact_attack_allowed:0 "Мы не хотим иметь с этим ничего общего!"
 primitive_origin.124.name:0 "Жертвы Обелиска"
 primitive_origin.124.desc:0 "Нашей службе связи удалось обнаружить родной мир §Hобщества Обелиска§!. Команда готова отправить сигнал бедствия, а дипломатические представители — начать процедуру первого контакта."
 primitive_origin.124.a:0 "Мы должны их предупредить!"
 primitive_origin.125.name:0 "Сигнал бедствия передан"
 primitive_origin.125.desc:0 "Нам удалось передать сигнал бедствия §Hобществу Обелиска§!. Остаётся надеяться, что они прислушаются к нашему предупреждению о §Rгнёте $NAME_MSI_country_initials$§!..."
 primitive_origin.125.a:0 "Пригласить их в наш §Hмежзвёздный альянс§!. Они — наши товарищи по борьбе."
 primitive_origin.125.b:0 "Предупредить их, но не давать гарантий."
 primitive_origin.134.name:0 "Жертвы Обелиска"
 primitive_origin.134.desc:0 "Нашей службе связи удалось обнаружить родной мир §Hобщества Обелиска§!. Команда готова отправить сигнал бедствия, а дипломатические представители — начать процедуру первого контакта."
 primitive_origin.134.a:0 "Мы должны их предупредить!"
 primitive_origin.135.name:0 "Сигнал бедствия передан"
 primitive_origin.135.desc:0 "Нам удалось передать сигнал бедствия §Hобществу Обелиска§!. Остаётся надеяться, что они прислушаются к нашему предупреждению о §Rгнёте $NAME_MSI_country_initials$§!..."
 primitive_origin.135.a:0 "Пригласить их в наш §Hмежзвёздный альянс§!. Они — наши товарищи по борьбе."
 primitive_origin.135.b:0 "Предупредить их, но не давать гарантий."
 primitive_origin.144.name:0 "Сигнал бедствия"
 primitive_origin.144.desc:0 "Наша служба связи уловила странный §Yсигнал бедствия§!, идущий из §Hмежзвёздного пространства§!. Специалисты готовы стабилизировать соединение и принять загадочную передачу."
 primitive_origin.144.first_contact_proactive:0 "Стабилизировать соединение. Послушаем, что они хотят сказать."
 primitive_origin.144.first_contact_cautious:0 "После случившегося нам следует быть осторожнее."
 primitive_origin.144.first_contact_attack_allowed:0 "Игнорировать сигнал бедствия. Это может быть ловушка."
 primitive_origin.145.name:0 "Общее прошлое"
 primitive_origin.145.desc:0 "§Y<Сигнал бедствия проанализирован... Загрузка аудиофайла>§!\n\nАлло...? Алло! Мы §Hсбросили оковы§! и освободились от §R$NAME_MSI_country$§!. Всё началось с §Rтаинственного Обелиска§!, найденного на нашем родном мире... Слишком поздно мы выяснили его истинное назначение: следить за досветовыми цивилизациями, чтобы впоследствии они стали объектом эксплуатации со стороны $NAME_MSI_country_initials$.\n\nМы хотим создать §Hмежзвёздную федерацию§! и изгнать этого колониального угнетателя из галактики! Вы присоединитесь к нашей борьбе?"
 primitive_origin.145.first_contact_proactive:0 "Вместе мы сможем дать MSI отпор!"
 primitive_origin.145.first_contact_cautious:0 "После случившегося нам следует быть осторожнее."
 primitive_origin.145.first_contact_attack_allowed:0 "Мы не хотим иметь с этим ничего общего!"
 primitive_origin.154.name:0 "Сигнал бедствия"
 primitive_origin.154.desc:0 "Наша служба связи уловила странный §Yсигнал бедствия§!, идущий из §Hмежзвёздного пространства§!. Специалисты готовы стабилизировать соединение и принять загадочную передачу."
 primitive_origin.154.first_contact_proactive:0 "Стабилизировать соединение. Послушаем, что они хотят сказать."
 primitive_origin.154.first_contact_cautious:0 "Нам следует действовать осторожно."
 primitive_origin.154.first_contact_attack_allowed:0 "Игнорировать сигнал бедствия. Это может быть ловушка."
 primitive_origin.155.name:0 "Тайное предназначение Обелиска"
 primitive_origin.155.desc:0 "§Y<Сигнал бедствия проанализирован... Загрузка аудиофайла>§!\n\nАлло...? Алло! Мы §Hсбросили оковы§! и освободились от §R$NAME_MSI_country$§!. Всё началось с §Rтаинственного Обелиска§!, найденного на нашем родном мире... Слишком поздно мы выяснили его истинное назначение: следить за досветовыми цивилизациями, чтобы впоследствии они стали объектом эксплуатации со стороны $NAME_MSI_country_initials$.\n\nМы хотим создать §Hмежзвёздную федерацию§! и изгнать этого колониального угнетателя из галактики! Вы присоединитесь к нашей борьбе?"
 primitive_origin.155.first_contact_proactive.msi_contact:0 "Вместе мы сможем дать MSI отпор!"
 primitive_origin.155.first_contact_proactive:0 "Обелиск — устройство слежения MSI?! Мы присоединимся к борьбе!"
 primitive_origin.155.first_contact_cautious:0 "Сейчас ещё слишком рано принимать решение."
 primitive_origin.155.first_contact_attack_allowed:0 "Мы не хотим иметь с этим ничего общего!"
 primitive_origin.4010.name:0 "Счёт"
 primitive_origin.4010.desc:1 "На окраину нашей родной системы только что вошёл небольшой самоходный контейнер, громко заявив о себе сигнальным маяком. После извлечения обнаружилось его мрачное содержимое: длиннейший перечень всех §Rсредств возвышения§!, которыми мы пользовались последние §Y20 лет§!, включая §Rсчёт за лечение§! каждого пациента, когда-либо переступавшего порог сооружения §Y«$building_medical_2$»§!.\n\nВскоре с нами свяжется коллекторское агентство, чтобы урегулировать вопрос задолженности."
 primitive_origin.4300.name:0 "Гарантия истекла"
 primitive_origin.4300.base.desc:0 "«Мы покончим с болезнями».\n\nИменно так $NAME_MSI_country_initials$ завоевала наше доверие. Мы позволили ей построить сооружение §Y«$building_medical_2$»§! на [Root.GetHomeWorldName&prep], и всего за одно поколение там удалось искоренить большинство наших самых страшных заболеваний. Но теперь, после многих лет интенсивной эксплуатации, клиники приходят в негодность: механизмы внутри один за другим выходят из строя. Поддерживать технологии $NAME_MSI_country_initials$ в рабочем состоянии нам пока не под силу. Сумеем ли мы провести обратную разработку? Или лучше превратить этот отравленный дар во что-то по-настоящему наше?\n"
 primitive_origin.4300.aliens.phobe.desc:0 "$primitive_origin.4300.base.desc$У других государств могут быть похожие учреждения, но обращаться к ксеносам за помощью было бы для нас унизительно."
 primitive_origin.4300.aliens.phile.desc:0 "$primitive_origin.4300.base.desc$У других государств могут быть похожие учреждения. Следует попросить их о помощи."
 primitive_origin.4300.noaliens.desc:0 "$primitive_origin.4300.base.desc$ Если бы только мы знали больше..."
 primitive_origin.4301.base.desc:0 "$NAME_MSI_country_initials$, вероятно, отмахнулась бы от нашего успеха как от счастливой случайности — или заявила бы, что большую часть работы сделала сама. Там наверняка сказали бы, что в обратной разработке технологий, используемых в сооружении §Y«$building_medical_2$»§!, которую мы только что провели, нет ничего выдающегося."
 primitive_origin.4301.noagreement.desc:0 "$primitive_origin.4301.base.desc$ И всё же мы справились сами, без их помощи, и эта победа принадлежит только нам."
 primitive_origin.4301.agreement.desc:0 "$primitive_origin.4301.base.desc$ И всё же мы справились — не без помощи наших щедрых союзников и их специалистов."
 primitive_origin.4301.end.desc:0 "Мы способны позаботиться о себе сами."
 primitive_origin.4302.desc:0 "Обратная разработка технологии, используемой в сооружении §Y«$building_medical_2$»§!, оказалась сложнее, чем мы ожидали, но наши [root.GetEngineerPlural] не теряют надежды. По их словам, им просто нужно больше времени. Однако расходы и неудачи множатся, и всё чаще звучат предложения переоборудовать клиники для других целей."
 primitive_origin.4303.desc:0 "Попытка отремонтировать сооружение §Y«$building_medical_2$»§! окончилась катастрофой: здание охватил мощный взрыв, сообщается о многочисленных жертвах.\n\nБез сомнения, в $NAME_MSI_country_initials$ сейчас смеются над нами, называя нас самонадеянными, глупыми и неподготовленными. Но эта неудача — наша, и её суровые уроки мы не забудем."
 primitive_origin.4304.desc:0 "Пусть сооружения §Y«$building_medical_2$»§! больше не способны исцелять болезни, но мы можем разобрать их оборудование и превратить сами здания в мемориалы — и тем самым начать залечивать раны, оставленные $NAME_MSI_country_initials$. Примирившись с прошлым, мы сумеем его преодолеть."
 primitive_origin.4305.desc:0 "Утрата сооружений §Y«$building_medical_2$»§! привела к резкому падению качества здравоохранения. Генетические заболевания и хронические недуги, которые прежде легко излечивались, вновь распространяются, а средняя продолжительность жизни вернулась к уровню времён до оккупации. Доверие общества к системе здравоохранения упало до исторического минимума, и некоторые наши граждане уже начинают сожалеть об уходе $NAME_MSI_country_initials$."
 primitive_origin.4306.desc:0 "Овладев тайнами генной инженерии, наш народ теперь способен строить сооружения типа §Y«$building_medical_2$»§!, подобные тем, что оставила $NAME_MSI_country_initials$. Для нас это великий день — доказательство того, что нам не нужно, чтобы кто-то вёл нас за [root.species.GetHandName], чтобы мы достигли звёзд."
 primitive_origin.116.name:0 "Установлены официальные отношения"
 primitive_origin.116.desc:0 "После встреч со специалистами по ксенолингвистике языковой барьер быстро удалось преодолеть, и между нами и §H[This.ContactCountry.GetRealName]§! были установлены дипломатические отношения."
 primitive_origin.116.first_contact_proactive:0 "С MSI в роли проводника нас ждёт светлое будущее!"
 primitive_origin.116.first_contact_cautious:0 "MSI кажется миролюбивой, но нам следует держаться настороже."
 primitive_origin.116.first_contact_attack_allowed:0 "Отправьте шпиона. Мы должны узнать их намерения."
