 nations.18267.desc:0 "Разведчики, обследующие сеть туннелей на [Root.GetName&prep], проникли в царский дворец бывшей столицы подземного государства. Труп того, кого местные считали императором, до сих пор восседает на массивном троне в парадном зале.\n\nПодорвав двери дворцовой сокровищницы, разведчики обнаружили внутри золото и странные произведения инопланетного искусства. Искусство отправят в музеи на [From.Owner.Capital.GetName&acc], а продажа золота заметно пополнит государственный бюджет."
