 contract_planetary_pilgrimage_2_lore_issued: "§L"To know nothing of desire or strife! There's so much we could learn!"§!"
 contract_planetary_pilgrimage_2_lore_completed: "§L"I don't think that spending an entire afternoon picking at my orifices was what I was supposed to learn..."§!"
 contract_planetary_pilgrimage_2_lore_failed: "§L"Such a rare opportunity, and we spoiled it. I want to cry!"§!"
