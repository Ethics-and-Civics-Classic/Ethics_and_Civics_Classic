 INTERVENTIONIST_LIBERATION_DESC:0 "«Освобождение» чужих планет на время порадует фракцию [Root.GetName]."
 envoy_events.210.desc.green:0 "$envoy_events.210.desc.start$ Позабыв о [Root.GetAdj&masc,prep] прагматизме, [event_envoy.GetSheHe] почти всё свободное время проводит в диких уголках [envoy_country.GetName&gen]. Согласно самым возмутительным сообщениям, на фотографиях [event_envoy.GetSheHe] вообще спит прямо на земле — словно пещерные предки [Root.GetSpeciesNamePlural&gen]!\nВ ответ на обвинения звучит лишь одно оправдание: «[envoy_country.GetSpeciesNamePlural] правы. Мы погубили родной мир. Я хочу вновь почувствовать единение с природой, в которой зародился наш вид, но на планете «[Root.GetHomeworldName]» это уже невозможно».\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.industrial:0 "$envoy_events.210.desc.start$ К потрясению и ужасу общественности, [event_envoy.GetSheHe] открыто осуждает нашу любимую программу национальных парков, называя её «преступной уступкой слезливой сентиментальности» и «преградой на пути прогресса».\n[event_envoy.species.GetShockingDietSecret] Какой скандал!\n\n$envoy_events.210.desc.end$"
 TABLOIDRUMOR_hum:0 "По самым возмутительным слухам, [event_envoy.GetSheHe] даже ест мясо!"
 TABLOIDRUMOR_mam:0 "Поговаривают даже об использовании глиняного наполнителя для туалета!"
 TABLOIDRUMOR_rep:0 "Согласно самым обескураживающим обвинениям, для обогрева используются мощные лампы!"
 TABLOIDRUMOR_avi:0 "Один из свидетелей утверждает, что [event_envoy.GetSheHe] принимает пылевые ванны, а затем просто выбрасывает пыль вместо переработки!"
 TABLOIDRUMOR_art:0 "По самым серьёзным сообщениям, сброшенные панцири больше не отправляются в компост."
 TABLOIDRUMOR_mol:0 "По неподтверждённым сведениям, [event_envoy.GetSheHe] пользуется небиоразлагаемыми слизистыми гелями! В косметических целях!"
 TABLOIDRUMOR_shell:0 "По неподтверждённым сведениям, [event_envoy.GetSheHe] заказывает себе раковины из допотопного пластика на основе ископаемого сырья! Только подумать — из пластика!"
 TABLOIDRUMOR_necroid:0 "Среди самых постыдных разоблачений — использование запрещённых бальзамирующих жидкостей для ежедневного омоложения."
 TABLOIDRUMOR_aquatic:0 "По словам одного из соседей, [event_envoy.GetSheHe] сливает охлаждающую жидкость из гипердвигателя личного шаттла прямо в общественный водоём!"
 TABLOIDRUMOR_lithoid:0 "Среди наиболее тревожных обвинений — употребление минералов из шахт, не прошедших экологическую сертификацию."
 TABLOIDRUMOR_plant:0 "Хуже того, анализ грунта из домашней почвенной грядки выявил запрещённые промышленные удобрения."
 TABLOIDRUMOR_tox:0 "Домашние датчики подтвердили сжигание допотопного ископаемого топлива для личных нужд."
 envoy_events.210.desc.socialism:0 "$envoy_events.210.desc.start$ Коммунисты [envoy_country.GetName&gen] каким-то образом сумели промыть [event_envoy.GetHerHim] мозги и склонить к своей порочной идеологии.\nКогда выяснилось, что [event_envoy.GetSheHe] выступает на собраниях профсоюзов [envoy_country.GetSpeciesNamePlural&gen], в ответ на требования отречься от этих взглядов прозвучал отказ.\n\n$envoy_events.210.desc.end$"
 envoy_events.210.desc.capitalism:0 "$envoy_events.210.desc.start$ Разразился скандал: наш посол [event_envoy.GetName] помогает срывать забастовки. В распоряжении общественности оказались записи закрытых встреч с властями [envoy_country.GetName&gen], на которых [event_envoy.GetSheHe] за щедрое вознаграждение выдаёт им имена ключевых лидеров рабочего движения [envoy_country.GetSpeciesNamePlural&gen].\n\n$envoy_events.210.desc.end$"
 envoy_events.17.desc.green:0 "$envoy_events.17.desc.base$ Однако доводы нашего представителя в пользу бережного отношения к окружающей среде не убедили присутствующих. Вскоре со всех сторон посыпались насмешки над «[Root.GetAdj&neut,inst] сентиментальным преклонением перед деревьями».\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.industrial:0 "$envoy_events.17.desc.base$ Однако доводы нашего представителя в пользу мировоззрения, ставящего потребности цивилизации выше природы, не убедили присутствующих. В ответ прозвучали язвительные обвинения в бессердечном одобрении «повсеместного уничтожения экосистем».\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.socialism:0 "$envoy_events.17.desc.base$ Однако доводы нашего представителя в пользу плановой экономики не убедили присутствующих. За открытую поддержку социализма нашего посла едва не выгнали из зала.\n\n$envoy_events.17.desc.end$"
 envoy_events.17.desc.capitalism:0 "$envoy_events.17.desc.base$ Однако доводы нашего представителя в пользу экономики без государственного вмешательства не убедили присутствующих. Нашему послу пришлось поспешно покинуть зал под публичные обвинения в поддержке «тирании буржуазии» и «[Root.GetAdj&fem,gen] погони за рентой».\n\n$envoy_events.17.desc.end$"
 envoy_events.18.desc.green.base:0 "убедили многих в преимуществах экоцентризма, напомнив о бесчисленных глобальных катастрофах, которых можно было избежать на родных мирах всех членов федерации ещё до освоения сверхсветовых полётов."
 envoy_events.18.desc.industrial.base:0 "убедили многих в преимуществах индустриализма, ясно объяснив, почему современные модели производства строятся на прагматичном расчёте."
 envoy_events.18.desc.socialism.base:0 "убедили многих в преимуществах социалистической экономики, последовательно опровергнув все доводы в защиту капитализма, с которыми выступал посол [dispute_loser.GetName&gen]."
 envoy_events.18.desc.capitalism.base:0 "убедили многих в преимуществах свободного рынка, наглядно показав всему собранию недостатки социализма."
