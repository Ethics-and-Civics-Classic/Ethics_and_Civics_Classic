 job_ark_gardener:0 "Ark Gardener"
 job_ark_gardener_plural:0 "Ark Gardeners"
 job_ark_gardener_desc:0 "These carefully trained stewards preserve the precious xenofauna and flora we find on our journey, sometimes with violence if necessary."
 job_ark_gardener_effect_desc:2 "£job_ranger£ $job_ark_gardener_plural$ produce $r_society$, $r_unity$, reduce local £crime£ §Y$PLANET_CRIME_TITLE$§!, spawn §Y$defense_army_plural$§! and increase §Y$concept_naval_capacity$§."

 mod_job_ark_gardener_add:0 "$job_ark_gardener$ Jobs"
