 council_agenda_agenda_environmental_stewards_nomad_desc:1 "The void is the largest ecosystem of all, and we are its stewards. We must be mindful of our footsteps, and tread lightly among the stars."

 requires_industrial: "$TRIGGER_FAIL$$civic_tooltip_industrial$"
 council_agenda_agenda_production_goals_name:0 "Optimize Production Goals"
 council_agenda_agenda_production_goals_desc:1 "To stagnate is to die, and to not produce is to wither away. We must increase our production output."
 agenda_production_goals_finish:0 "$council_agenda_agenda_production_goals_name$ $agenda_ref$"

 council_agenda_agenda_production_goals_nomads_name:0 "Mobile Production Model"
 council_agenda_agenda_production_goals_nomads_desc:1 "Our way of life is not sustained without significant resources. We must improve our production yields, or perish."
