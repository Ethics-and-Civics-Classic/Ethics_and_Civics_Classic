 # Labor Organizer
 steward_anarchy: "$job_steward_anarchy$"
 job_steward_anarchy:0 "Labor Organizer"
 job_steward_anarchy_plural:0 "Labor Organizers"
 job_steward_anarchy_desc:0 "In an egalitarian work environment, labor organizers mediate conflicts between workers and coordinate the distribution of raw materials and supplies."

 living_standard_community_labor: "Community Labor"
 living_standard_community_labor_tooltip: "$living_standard_community_labor$ guarantees that the needs of our neighbors are never left unfulfilled. Resources are bartered, donated, or shared efficiently."
 living_standard_community_labor_tooltip_delayed: "§LCompetition is the law of the jungle, but cooperation is the law of civilization.§!"

 civic_anarchy_ideals:0 "Anarchist Ideals"
 civic_anarchy_ideals_desc:0 "This society is based upon ideals of rejection of any form of unjust political or sociological hierarchy."
 civic_anarchy_ideals_effects:0 "$civic_civil_education_effects$ $TABBED_NEW_LINE$- $AVAILABLE_POLICIES$ ['concept_trade_mutual_aid'] $TABBED_NEW_LINE$- Replaces £job_politician£ §Y$job_politician$§! and £job_bureaucrat£ §Y$job_bureaucrat$§! Jobs with ['concept_organizer',£job_organizer£ $job_organizer$] Jobs $TABBED_NEW_LINE$- §GUnlocks§! the §Y$bombardment_EaC_liberate_slaves$§! bombardment stance."
 civic_anarchy_ideals_negatives:0 "$t$- §RBanned§! from having the following policies:$TABBED_NEW_LINE$$t$- §H$policy_resettlement$§!: $resettlement_allowed$$TABBED_NEW_LINE$$t$- §H$policy_population_controls$§!: $population_controls_allowed$"
 
 civic_anarchy_utopia:0 "Anarchist Utopia"
 civic_anarchy_utopia_desc:0 "This autonomous collective organizes itself upon principles of mutual aid, restorative justice, and free association. Without the burden of hierarchy, they are truly the freest people in the galaxy."
 civic_anarchy_utopia_effects:0 "$t$- Allows §Y$living_standard_community_labor$§! Living Standard, under which all £pop£ §YPops§! have high £consumer_goods£ §Y$consumer_goods$§! Upkeep regardless of §YStrata§! $TABBED_NEW_LINE$- Disables the use of most other §YLiving Standards§!$TABBED_NEW_LINE$- $civic_crowdsourcing_anarchy_effects$\n$civic_anarchy_ideals_effects$"
 civic_anarchy_utopia_negatives:0 "$t$- §RBanned§! from having the following policies:$TABBED_NEW_LINE$$t$- §H$policy_resettlement$§!: $resettlement_allowed$$TABBED_NEW_LINE$$t$- §H$policy_interference$§!: $interference_aggressive$ $TABBED_NEW_LINE$$t$- §H$policy_population_controls$§!: $population_controls_allowed$\n$TABBED_NEW_LINE$- §RObligated§! to have the following policies:$TABBED_NEW_LINE$$t$- §H$policy_trade_policy$§!: $trade_policy_mutual_aid$ $TABBED_NEW_LINE$$t$- §H$policy_subjugation_war_terms$§!: $benevolent_terms_name$$TABBED_NEW_LINE$$t$- §H$policy_conscription_stance$§!: $conscription_stance_0$ $TABBED_NEW_LINE$$t$- §H$policy_border_policy$§!: $border_policy_open_name$$TABBED_NEW_LINE$$t$- §H$policy_refugees$§!: $refugees_allowed$"

 civic_primitive_enthusiasts:0 "Primitive Enthusiasts"
 civic_primitive_enthusiasts_desc:0 "This society has an appreciation for the older techniques, choosing to perform many jobs by hand and live off the land through barter, farming, and animal husbandry."
 civic_primitive_enthusiasts_effects:0 "$t$- At least one §YGuaranteed Habitable World§! will be a pre-FTL Civilization's £job_hunter_gatherer£ §GHomeworld§!\n$TABBED_NEW_LINE$- £job_civilian£ §YCivilians§! become £job_primitive_enthusiasts£ §HHomesteaders§! and practice a lifestyle of §Gself-sufficiency§! producing $r_food$\n\n§YDomestication:§!$TABBED_NEW_LINE$Guarantees a §Ghigher chance§! to research £physics£ ['tech_gravity_wells'] and eventually £society£ ['tech_alien_cloning'].\n\n§EIf Ethics are§! §H$ethic_socialism$§! §Eand§! §H$ethic_egalitarian$§!§E:§!$TABBED_NEW_LINE$$t$- Allows the §Y$trade_policy_mutual_aid$§! Trade Policy, which converts $r_trade$ into $r_energy$, $r_minerals$, and $r_food$§E:§!$TABBED_NEW_LINE$- Replaces £job_politician£ §Y$job_politician$§! and £job_bureaucrat£ §Y$job_bureaucrat$§! Jobs with ['concept_organizer',£job_organizer£ $job_organizer$] Jobs."
 civic_primitive_enthusiasts_effects_first_contact_dlc:0 "$t$- Gains §G100%§! more Insights from observing pre-FTL Civilizations\n$civic_primitive_enthusiasts_effects$"

 tr_harmony_bear_each_others_burdens:0 "Bear Each Other's Burdens"
 tr_harmony_bear_each_others_burdens_desc:0 "To lift up our fellows is our highest calling, and our hands are forever outstretched to our fellow sapients. Together, we thrive."

