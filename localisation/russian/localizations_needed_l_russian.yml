 federation_capitalism_ideology_desc:0 "Участие в федерации способствует распространению принципов экономической конкуренции в нашем государстве."
 envoy_events.210.desc.end:0 "Эти сообщения вызвали требования отозвать нашего посла и напомнить [event_envoy.GetHerHim] о [Root.GetAdj&pl,gen] обычаях. Однако другие считают, что способность понимать чужие взгляды может пригодиться в напряжённых дипломатических ситуациях."
 envoy_events.17.desc.base:0 "Изменение законов в федерации [Root.Federation.GetName] вызвало жаркие споры. Между нами и [dispute_winner.GetName&inst] вновь обострились идеологические разногласия. Наш представитель [dispute_loser_envoy.GetName] и представитель [dispute_winner.GetName&gen] по имени [dispute_winner_envoy.GetName] обсудили их на открытом диспуте."
 envoy_events.18.desc.base:0 "Изменение законов в федерации [Root.Federation.GetName] вызвало жаркие споры. Между нами и [dispute_loser.GetName&inst] вновь обострились идеологические разногласия. Наш представитель [dispute_winner_envoy.GetName] и [dispute_winner_envoy.GetHerHis] сторонники"
