 contract_planetary_pilgrimage_3_desc: "§L"A planet consecrated as a sacred place, never to be touched by civilization. We are compelled to give reverence in worship."§!"
 contract_planetary_pilgrimage_3_lore_issued: "§L"To bask in such sacred beauty is my life's dream!"§!"
 contract_planetary_pilgrimage_3_lore_completed: "§L"It was the most beautiful thing I have ever seen in my life... I'll remember it forever."§!"
 contract_planetary_pilgrimage_3_lore_failed: "§L"I might never get to see a holy world again in my lifetime..."§!"
