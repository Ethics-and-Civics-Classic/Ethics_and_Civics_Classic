#####################
  
 # Ark Gardener
 building_nomad_conservatory:0 "Conservatory"
 building_nomad_conservatory_desc:0 "This sanctuary is the beating heart of the $arkship$'s ecosystem. It is from here that the life support controls for the Ark Gardens are maintained."
 building_nomad_conservatory_effect: "£job_ranger£ $job_ark_gardener$ Jobs from $d_ark_nature_preserve_blocker$ £blocker£ §HBlockers§!: §G+1§! £job_ranger£"

 ark_gardener: "$job_ark_gardener$"
 job_ark_gardener:0 "Ark Gardener"
 job_ark_gardener_plural:0 "Ark Gardeners"
 job_ark_gardener_desc:0 "These carefully trained stewards preserve the precious xenofauna and flora we find on our journey, sometimes with violence if necessary."
 job_ark_gardener_effect_desc:2 "£job_ranger£ $job_ark_gardener_plural$ produce $r_society$, $r_unity$, reduce local £crime£ §Y$PLANET_CRIME_TITLE$§!, spawn §Y$defense_army_plural$§! and increase §Y$concept_naval_capacity$§."

 mod_job_ark_gardener_add:0 "$job_ark_gardener$ Jobs"
 has_nomad_conservatory:0 "$TRIGGER_FAIL$§RThis blocker will not be removeable as long as the §Y[GetConservatoryType]§! exists.§!"
 biologist_is_ark_gardener_tt: "£job_biologist£ $job_biologist_plural$ are converted into £job_ranger£ $job_ark_gardener_plural$"

 d_ark_nature_preserve_blocker: "Garden Biotope"
 d_ark_nature_preserve_blocker_plural: "Garden Biotopes"
 d_ark_nature_preserve_blocker_desc:0 "A section of our $arkship$ has been dedicated to the protection of endangered and extinct species from many planets. This is their home, as it is ours."

 decision_expand_biotope: "Expand Biotope"
 decision_expand_biotope_short: "Adds an additional §Y$d_ark_nature_preserve_blocker$§! to the $arkship$."
 decision_expand_biotope_desc: "With redundant life support systems and careful monitoring, we can accurately recreate the ecological conditions of many different biospheres."

 # Nomad Naturalism
 civic_naturalism_nomad:0 "Starbound Solarpunks"
 civic_naturalism_nomad_desc:0 "These wanderers have devoted themselves to shaping their $arkship_plural$ in the image of the planets they love the most. They don't merely mimic them, they truly are mobile worlds."

 building_national_park_nomad:0 "Ark Biosphere"
 building_national_park_nomad_desc:0 "The interior of the $arkship$ is a complete ecosystem, teeming with natural life. The flora and fauna here are under special protection."

 # Nomad Environmentalism
 civic_environmentalist_nomad:0 "Enviro-Arks"
 civic_environmentalist_nomad_desc:0 "These nomads collect endangered and extinct species from the planets they visit. They care for them aboard their arks in a mission to preserve life across the galaxy."
 civic_tooltip_environmentalist_nomad_effects:2 "$t$- $AVAILABLE_BUILDINGS$ £building£ ['building:building_nomad_conservatory']$TABBED_NEW_LINE$- $ADDITIONAL_BUILDINGS_STRING$ £building£ §Y$building_nomad_conservatory$§!\n$t$- $AVAILABLE_HOLDINGS$ £building£ ['building:holding_park_ranger_lodge']$TABBED_NEW_LINE$- Grants an additional §Y$d_ark_nature_preserve_blocker$§! £blocker£§HBlocker§! at game start.$TABBED_NEW_LINE$- $UNLOCKS_CONTRACT_TYPE$ §Y$conservation_study_special$§!."
 
 # Nomad Keepers of Harmony
 civic_keepers_harmony_nomad:0 "Nomadic Nature-Worshippers"
 civic_keepers_harmony_nomad_desc:0 "People of this society worship the sanctity of the places they visit. They cross the galaxy on years-long pilgrimages to holy sites where nature and the cosmos are in perfect harmony."
 civic_tooltip_keepers_harmony_nomad_effects:0 "$t$§EDivine Symbiosis:§!$TABBED_NEW_LINE$$t$- Replaces £job_bureaucrat£ §Y$job_bureaucrat$§! jobs with unique £job_priest£ §Y$job_druid$§! jobs.$TABBED_NEW_LINE$$t$- £job_priest£ §Y$job_druid$§! jobs are more effective on $arkship_plural$ with §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlockers§!, providing §Gadditional§! £housing£ §YHousing§!, and increased §Y$MOD_POP_ENVIRONMENT_TOLERANCE$§!.\n$TABBED_NEW_LINE$- £building£ §Y$building_nature_sanctuary_nomad_plural$§! are unique buildings which provide increased local $r_unity$, £happiness£ §YHappiness§!, and £pops£ §H$ethic_green$§! attraction per §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlocker§! on the $arkship$, and require $r_food$ for upkeep.\n$TABBED_NEW_LINE$- $UNLOCKS_CONTRACT_TYPE$ §Y$planetary_pilgrimage_special$§!."
 civic_tooltip_keepers_harmony_nomad_negative_effects:0 "$t$§EForsaken Symbiosis:§!$TABBED_NEW_LINE$$t$- On $arkship_plural$ without §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlockers§!, §Y$job_druid$§! jobs will produce §Rless§! $r_unity$ than even a normal bureaucrat."
 
 building_nature_sanctuary_nomad_plural:0 "Garden Sanctuaries"
 building_nature_sanctuary_nomad_plural_desc:0 "$building_nature_sanctuary_nomad_desc$"
 building_nature_sanctuary_nomad:0 "Garden Sanctuary"
 building_nature_sanctuary_nomad_desc:0 "This sacred place is where our path through the stars is enshrined, and our harmony with the ecosystem of the void is honored. This monument increases local $r_unity$, £happiness£ $HAPPINESS$ and §YEcocentrism§! ethics attraction per §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlockers§!, and requires $r_food$ for upkeep."

 # Nomad Eco Warfare
 civic_eco_warfare_nomad:0 "Protective Biotopes"
 civic_eco_warfare_nomad_desc:0 "Not only are these people more than ready and capable of defending their garden biotopes with guns in their hands, but they also learned to effectively apply advancements in biological sciences to the military.\n\n§WOrganic Ships§!: Involving biotechnology in military construction allows ships to gain special abilities, such as regeneration of Armor and Hull, and also become more energy efficient. The downside is that those materials are generally more fragile than non-organic alloys.\n\n§WMilitary Biomedicine§!: Army Health is increased."

 civic_tooltip_eco_warfare_nomad_effects:0 "$t$§ENatural Protection§!: Benefits from §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlockers§!$TABBED_NEW_LINE$$t$- Change £job_entertainer£ §Y$job_entertainer_plural$§! into £job_duelist£ §Y$job_duelist_plural$§!.$TABBED_NEW_LINE$$t$- Each £blocker£ §HBlocker§! provides §G-5%§! §YPlanetary Bombardment damage§!.\n$TABBED_NEW_LINE$§EMilitary Biotechnology§!:$TABBED_NEW_LINE$$t$- $r_minerals$ upkeep per 100 [foundry.GetIcon] §Y[GetAlloyProducer]§! §G-1§!.$TABBED_NEW_LINE$$t$- $r_food$ upkeep per 100 [foundry.GetIcon] §Y[GetAlloyProducer]§! §R+1§!.$TABBED_NEW_LINE$$t$- $r_food$ upkeep per 100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§! §R+1§!.$TABBED_NEW_LINE$$t$- $r_alloys$ produced per 100 £job_biotechnologist£ §Y$job_biotechnologist_plural$§! §G+0.5§!.\n$BOB_mercs_tooltip$""

