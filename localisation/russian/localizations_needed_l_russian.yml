 civic_machine_cult_machine_forever_cruise: "Cult of the Servitor"
 civic_machine_cult_machine_forever_cruise_desc: "This empire of machines, worshipped like gods by their creators, seeks to take organic life by the hand and show them the glory of the cosmos... and serve delicious fruity beverages."
