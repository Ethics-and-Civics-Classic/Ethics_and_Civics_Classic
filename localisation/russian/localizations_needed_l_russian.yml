 concept_eco_biologists: "Ecocentrist Biologist Jobs"
 eco_biologist_swap: "Ecocentric Biologist Job Swaps"
 concept_eco_biologists_desc: "Various §H$ethic_green$§! Civics allow biologists to be swapped for special, more productive variants.\n§E$job_xenobiologist$§!$TABBED_NEW_LINE$- £job_xenobiologist£ §Y$job_xenobiologist_plural$§! are more productive versions of £job_biologist£ §Y$job_biologist_plural§!, producing §G50%§! more $r_society$, at the cost of §R33%§! more $r_consumer_goods$.$TABBED_NEW_LINE$- This is enabled by the §C$civic_terraforming$§! §YCivic§!, in combination with ['concept_natural_blockers'].\n\n§E$job_ranger$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ranger_plural$s§! are a mix between several jobs, and generalists producing several resources on top of the $r_society$, like $r_unity$, $r_amenities$, £job_criminal£ §Y$PLANET_CRIME_TITLE$§! Reduction, §Y$concept_naval_capacity$§!, and §Y$defense_army_plural$§!.$TABBED_NEW_LINE$- This is enabled by the £building£ §Y$building_ranger_lodge$§! Building from by the §C$civic_environmentalist$§! Civic.$TABBED_NEW_LINE$- This is also enabled by the §C$civic_eco_warfare$§! civic in combination with ['concept_natural_blockers'].\n\n§E$job_xenoranger$§!$TABBED_NEW_LINE$- When both £job_xenobiologist£ §Y$job_xenobiologist_plural$§! and £job_ranger£ §Y$job_ranger_plural$§! are enabled, the job becomes a £job_xenoranger£ §Y$job_xenoranger$§!, which has the benifits and upkeep of both.\n\n§E$job_ark_gardener$§!$TABBED_NEW_LINE$- £job_ranger£ §Y$job_ark_gardener_plural$§! are $job_ranger_plural$ that work exclusively on $arkship_plural$ in ['concept_nomadic_empires']. They fulfill the same function as a normal £job_ranger£ §Y$job_ranger$§!. They benefit from the placement of §Y$d_ark_nature_preserve_blocker$§! £blocker£ §HBlockers§!, and are available to all £green£ Nomads."

