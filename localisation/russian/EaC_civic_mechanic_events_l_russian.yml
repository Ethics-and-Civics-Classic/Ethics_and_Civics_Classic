 EaC_civic_mechanic_events.7000.desc:0 "После применения деволюционного луча техники приступили к перенастройке оборудования для §Yпроекта «Генезис»§!. Теперь нам предстоит решить, восстанавливать ли разум у этих существ и возвращать ли их в §Hкаменный век§!."
 EaC_civic_mechanic_events.7000.a:0 "Они останутся предразумными."
 EaC_civic_mechanic_events.7000.b:0 "Преобразить их и направить их развитие в каменном веке."

 EaC_civic_mechanic_events.7000.name:0 "Протокол проекта «Генезис»"
